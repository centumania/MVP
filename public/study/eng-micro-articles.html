 s13:[
 "____ honesty is a virtue, but ____ honesty of this officer is ____ rare quality.|—-the-a;The-the-a;—-a-the|0|General → none. Of-phrase → THE. 'Rare' begins with /r/ → A.",
 "He had ____ breakfast at ____ hotel before catching ____ 8 o'clock train.|—-a-the;the-a-the;—-an-the|0|Meals → none. 'Hotel' spoken H → A. A specific train → THE.",
 "She teaches ____ English at ____ university and plays ____ cricket on Sundays.|the-a-the;—-a-—;—-an-—|1|Languages → none. 'University' /yu/ → A. Games → none.",
 "____ gold in this ring came from ____ mine near ____ Kolar.|The-a-—;The-the-the;A-a-—|0|Specific gold → THE. 'Mine' → A. Place name → none.",
 "____ courage of ____ soldiers who fought on ____ Himalayas was praised by all.|The-the-the;A-the-the;The-a-the|0|Of-phrase → THE. Specific soldiers → THE. A range → THE."],

 s14:{
  rule:"General proper, material and abstract nouns take no article. Specific ones take THE.",
  formula:"GENERAL → no article\nSPECIFIC (with of / in / clause) → THE",
  memory:"All of it = no article. This particular one = THE. Look for 'of'.",
  ta:"முழுவதும்னா article இல்ல. இந்த குறிப்பிட்டதுன்னா THE. 'of'-ஐ தேடுங்க.",
  tl:"Muzhuvadhumnaa article illa. Indha kurippittadhunnaa THE. 'of'-ai thedunga.",
  mistake:"Adding THE to general abstract nouns, and dropping THE when an of-phrase makes them specific.",
  exam:"SSC CGL / CHSL and Bank — common in Cloze Test and Fill in the Blank."},

 s15:[
 {ta:"இந்த rule-ஐ புரிஞ்சுக்க ஒரு அடிப்படை கேள்வி கேட்டுக்கணும்: 'நான் இதைப் பத்தி பொதுவா பேசுறேனா, இல்ல ஒரு குறிப்பிட்ட ஒண்ணைப் பத்தி பேசுறேனா?'",
  tl:"Indha rule-ai purinjukka oru adippadai kelvi kettukkanum: 'naan idhaip paththi podhuvaa pesurenaa, illa oru kurippitta onnaip paththi pesurenaa?'"},
 {ta:"'Honesty is the best policy' — இங்க எந்த நேர்மையைப் பத்தி பேசுறீங்க? ஒரு குறிப்பிட்ட மனுஷனோட நேர்மையா? இல்ல. உலகத்துல இருக்கிற எல்லா நேர்மையையும் பத்தி. பொதுவானது. அதனால article இல்ல.",
  tl:"'Honesty is the best policy' — inga endha nermaiyaip paththi pesureenga? Oru kurippitta manushanoda nermaiyaa? Illa. Ulagaththula irukkira ellaa nermaiyaiyum paththi. Podhuvaanadhu. Adhanaala article illa."},
 {ta:"ஆனா 'The honesty of that officer surprised us' — இங்க எந்த நேர்மை? அந்த அதிகாரியோட நேர்மை. குறிப்பிட்டது. ஒரே ஒரு நபரோடது. அதனால THE. வித்தியாசம் தெரியுதா?",
  tl:"Aanaa 'The honesty of that officer surprised us' — inga endha nermai? Andha adhigaariyoda nermai. Kurippittadhu. Ore oru nabarodadhu. Adhanaala THE. Viththiyaasam theriyudhaa?"},
 {ta:"இதை எப்படி உடனே கண்டுபிடிக்கிறது? ஒரு switch இருக்கு — 'of'. வாக்கியத்துல 'of' இருக்கா? அல்லது 'in this...', 'which...', 'that...' இருக்கா? அப்படின்னா அது குறிப்பிட்டது, THE வரும். இல்லைன்னா பொதுவானது, article இல்ல. இந்த ஒரு சோதனை போதும்.",
  tl:"Idhai eppadi udane kandupidikkiradhu? Oru switch irukku — 'of'. Vaakkiyaththula 'of' irukkaa? Alladhu 'in this...', 'which...', 'that...' irukkaa? Appadinnaa adhu kurippittadhu, THE varum. Illainnaa podhuvaanadhu, article illa."},
 {ta:"இப்போ இன்னொரு பகுதி — நாலு குடும்பம் article-ஏ எடுக்காது. உணவு: breakfast, lunch, dinner. மொழி: English, Tamil, Hindi. பாடம்: mathematics, history. விளையாட்டு: cricket, football, chess. இதெல்லாம் பொதுவா பயன்படுத்தும்போது article இல்ல.",
  tl:"Ippo innoru paguthi — naalu kudumbam article-e edukkaadhu. Unavu: breakfast, lunch, dinner. Mozhi: English, Tamil, Hindi. Paadam: mathematics, history. Vilaiyaattu: cricket, football, chess."},
 {ta:"நாம தமிழ்ல பேசும்போது 'the' அப்படிங்கிற ஒரு வார்த்தையே கிடையாது. அதனால நமக்கு எப்போ போடணும், எப்போ போடக்கூடாது அப்படின்னு குழப்பம் வரும். இந்த rule-ஐ மனப்பாடம் பண்ணாதீங்க — புரிஞ்சுக்கோங்க. 'எல்லாத்தையும் பத்தியா, இல்ல இதை மட்டும் பத்தியா?' இந்த ஒரு கேள்வி உங்களுக்கு எப்பவும் பதில் தரும்.",
  tl:"Naama Tamil-la pesumbodhu 'the' appadingira oru vaarththaiye kidaiyaadhu. Adhanaala namakku eppo podanum, eppo podakkoodaadhu appadinnu kuzhappam varum. Indha rule-ai manappaadam pannaadheenga — purinjukkonga. 'Ellaaththaiyum paththiyaa, illa idhai mattum paththiyaa?'"}]},

/* ========== RULE 8 ========== */
{n:8,rc:"ART-08",d:"Medium",t:"THE + Adjective = A Whole Class of People",
 tam:"'THE' + பெயரடை = அந்த வகை மக்கள் அனைவரும் (பன்மை வினைச்சொல்)",
 s1:{en:"When THE is placed before an adjective, the adjective becomes a PLURAL NOUN meaning the whole class of people with that quality — and it takes a PLURAL VERB.",
  ta:"ஒரு பெயரடைக்கு முன் THE வைக்கப்படும்போது, அந்தப் பெயரடை ஒரு பன்மைப் பெயர்ச்சொல்லாக மாறி, அந்தப் பண்பைக் கொண்ட முழு வகை மக்களையும் குறிக்கிறது — மேலும் அது பன்மை வினைச்சொல்லை எடுக்கும்.",
  tl:"Oru peyaradaikku mun THE vaikkappadumbodhu, andhap peyaradai oru panmaip peyarcholaaga maari, andhap panbaik konda muzhu vagai makkalaiyum kurikkiradhu — melum adhu panmai vinaicholai edukkum.",
  formula:"THE  +  adjective  =  PLURAL NOUN  →  PLURAL VERB\n\n  the poor   ARE  often ignored.   (= poor people)\n  the rich   HAVE their problems.  (= rich people)\n  the blind  NEED our support.     (= blind people)\n  the elderly NEED care.           (= elderly people)"},

 s2:[
 {h:"The verb is the real question",
  en:"Almost every exam question on this rule tests the VERB, not the article. 'The poor IS ignored' is the planted error. Because 'the poor' means 'poor people' — many people — the verb must be plural.",
  ta:"வினைச்சொல்தான் உண்மையான கேள்வி. இந்த விதி மீதான கிட்டத்தட்ட ஒவ்வொரு தேர்வுக் கேள்வியும் article-ஐ அல்ல, வினைச்சொல்லைச் சோதிக்கிறது. 'The poor IS ignored' என்பதுதான் நடப்பட்ட தவறு. 'The poor' என்றால் 'ஏழை மக்கள்' — பல மக்கள் — எனவே வினைச்சொல் பன்மையாக இருக்க வேண்டும்.",
  tl:"Vinaichol-dhaan unmaiyaana kelvi. Indha vidhi meedhaana kittaththatta ovvoru thervuk kelviyum article-ai alla, vinaicholaich sodhikkiradhu. 'The poor IS ignored' enbadhudhaan nadappatta thavaru."},
 {h:"The common members of this family",
  en:"the poor, the rich, the young, the old, the elderly, the blind, the deaf, the dumb, the sick, the wounded, the injured, the dead, the unemployed, the homeless, the educated, the illiterate, the brave, the weak, the strong, the accused.",
  ta:"இந்தக் குடும்பத்தின் பொதுவான உறுப்பினர்கள்: the poor, the rich, the young, the old, the elderly, the blind, the deaf, the sick, the wounded, the injured, the dead, the unemployed, the homeless, the educated, the illiterate, the brave, the accused.",
  tl:"Indhak kudumbaththin podhuvaana uruppinargal: the poor, the rich, the young, the old, the elderly, the blind, the deaf, the sick, the wounded, the injured, the dead, the unemployed, the homeless, the educated, the illiterate."},
 {h:"An abstract exception",
  en:"A few of these take a SINGULAR verb because they name an abstract quality, not people: 'The beautiful IS not always the good.' Here 'the beautiful' means 'beauty as a concept'. This is rare in exams but worth knowing.",
  ta:"ஒரு கருத்தியல் விதிவிலக்கு. இவற்றில் சில ஒருமை வினைச்சொல்லை எடுக்கும், ஏனெனில் அவை மக்களை அல்ல, ஒரு கருத்துப் பண்பைக் குறிக்கின்றன: 'The beautiful IS not always the good.' இங்கே 'the beautiful' என்றால் 'ஒரு கருத்தாக அழகு'. இது தேர்வுகளில் அரிது, ஆனால் தெரிந்திருக்க வேண்டியது.",
  tl:"Oru karuththiyal vidhivilakku. Ivatril sila orumai vinaicholai edukkum, yenenil avai makkalai alla, oru karuththup panbaik kurikkindrana: 'The beautiful IS not always the good.'"},
 {h:"Nationality adjectives work the same way",
  en:"'The English are hardworking', 'the French are artistic', 'the Chinese are industrious', 'the Japanese are disciplined'. All mean the people of that nation, all take plural verbs.",
  ta:"தேசியப் பெயரடைகளும் இதேபோலவே செயல்படுகின்றன. 'The English are hardworking', 'the French are artistic', 'the Chinese are industrious', 'the Japanese are disciplined'. அனைத்தும் அந்த நாட்டு மக்களைக் குறிக்கின்றன, அனைத்தும் பன்மை வினைச்சொல் எடுக்கும்.",
  tl:"Desiyap peyaradaigalum idhepolave seyalpadugindrana. 'The English are hardworking', 'the French are artistic', 'the Chinese are industrious'. Anaiththum panmai vinaichol edukkum."}],

 s3:[
 {h:"One word becomes many people",
  d:"   THE  +  POOR  =  poor PEOPLE  =  many  →  ARE\n            ↑\n      an adjective becomes a plural noun\n\n   The poor ARE often ignored.        ✔\n   The poor IS often ignored.         ✘\n\n   Mentally add the word PEOPLE:\n   \"The poor [people] are ignored.\"  ✔"},
 {h:"Never add -s",
  d:"   the poor    ✔        the poors    ✘\n   the rich    ✔        the riches   ✘\n   the blind   ✔        the blinds   ✘\n   the young   ✔        the youngs   ✘\n\n   The plural is in the MEANING, not in the spelling.\n   (Compare this with Rule 47 of the SVA module:\n    people, police, cattle — same idea.)"}],

 s4:{
 wrong:["\"'The poor' is one phrase, so singular verb.\" — It means many people.",
  "\"I should write 'the poors' to make it plural.\" — Never add -s. The plural is in the meaning.",
  "\"'The rich has many problems' sounds fine.\" — It must be 'have'.",
  "\"This is an article rule, so only the article is being tested.\" — The verb is what is actually tested."],
 right:["Mentally insert the word PEOPLE after the adjective.",
  "'The poor [people] are ignored' — now the plural verb is obvious.",
  "Never add -s to the adjective.",
  "Nationality words behave the same way: the English ARE, the French ARE."]},

 s5:[
 {en:"The poor are often ignored by the system.",ta:"ஏழை மக்கள் அமைப்பால் அடிக்கடி புறக்கணிக்கப்படுகிறார்கள்.",tl:"Ezhai makkal amaippaal adikkadi purakkanikkappadugiraargal.",note:"'The poor' = poor people → ARE."},
 {en:"The rich have their own problems.",ta:"பணக்கார மக்களுக்கும் அவர்களுடைய சொந்தப் பிரச்சனைகள் உண்டு.",tl:"Panakkaara makkalukkum avargaludaiya sondhap prachanaigal undu.",note:"'The rich' = rich people → HAVE."},
 {en:"The blind need our support and understanding.",ta:"பார்வையற்றவர்களுக்கு நமது ஆதரவும் புரிதலும் தேவை.",tl:"Paarvaiyatravargalukku namadhu aadharavum purithalum thevai.",note:"'The blind' = blind people → NEED."},
 {en:"The wounded were taken to the nearest hospital.",ta:"காயமடைந்தவர்கள் அருகிலுள்ள மருத்துவமனைக்கு அழைத்துச் செல்லப்பட்டனர்.",tl:"Kaayamadaindhavargal arugilulla maruththuvamanaikku azhaiththuch sellappattanar.",note:"'The wounded' = wounded people → WERE."},
 {en:"The English are known for their politeness.",ta:"ஆங்கிலேயர்கள் தங்கள் பணிவுக்காக அறியப்படுகிறார்கள்.",tl:"Aangileyargal thangal panivukkaaga ariyappadugiraargal.",note:"A nationality adjective → ARE."}],

 s9:[
 "Fill in the Blank|The elderly ____ special attention during the winter months.|needs;need|1|'The elderly' means elderly people → plural verb.",
 "Find the Error|The poor (A) is often (B) denied access (C) to basic health care (D).|A;B;C;D|1|Part B. 'The poor' takes a plural verb → 'are often denied'.",
 "Sentence Improvement|The poors of this village have no access to clean water.|The poors;The poor;A poor|1|Never add -s to the adjective.",
 "Fill in the Blank|The wounded ____ rushed to the district hospital within minutes.|was;were|1|'The wounded' is plural.",
 "Find the Error|The unemployed (A) has been (B) protesting outside the office (C) for a week (D).|A;B;C;D|1|Part B. Plural subject → 'have been protesting'."],

 s10:{
  en:"This looks like an Articles rule but it is really a Subject-Verb Agreement question in disguise. The exam prints 'the poor', 'the rich' or 'the elderly' and then plants a SINGULAR verb, which sounds perfectly natural because the phrase is only two words long. The second trap is 'the poors' — students add -s to show plurality, which is always wrong.",
  ta:"இது Articles விதி போலத் தெரிகிறது, ஆனால் உண்மையில் இது மாறுவேடத்தில் உள்ள ஒரு Subject-Verb Agreement கேள்வி. தேர்வு 'the poor', 'the rich' அல்லது 'the elderly' என்று அச்சிட்டு, பிறகு ஒரு ஒருமை வினைச்சொல்லை நடும் — அந்தத் தொடர் இரண்டே சொற்கள் நீளம் என்பதால் அது முற்றிலும் இயற்கையாகக் கேட்கும். இரண்டாவது பொறி 'the poors' — மாணவர்கள் பன்மையைக் காட்ட -s சேர்க்கிறார்கள், அது எப்போதுமே தவறு.",
  tl:"Idhu Articles vidhi polath therigiradhu, aanaal unmaiyil idhu maaruvedaththil ulla oru Subject-Verb Agreement kelvi. Thervu 'the poor' endru achittu, piragu oru orumai vinaicholai nadum. Irandaavadhu pori 'the poors' — maanavargal panmaiyaik kaatta -s serkkiraargal, adhu eppodhume thavaru."},

 s11:{
  en:"MENTALLY ADD THE WORD 'PEOPLE'. The poor [people] ARE ignored.",
  ta:"மனதுக்குள் 'PEOPLE' என்ற சொல்லைச் சேருங்கள். The poor [people] ARE ignored.",
  tl:"Manadhukkul 'PEOPLE' endra sollaich serungal. The poor [people] ARE ignored.",
  vis:"      THE INVISIBLE WORD 'PEOPLE'\n\n   the poor  [people]  ARE  ignored.\n   the rich  [people]  HAVE problems.\n   the blind [people]  NEED help.\n   the sick  [people]  ARE treated.\n              ↑\n     always mentally insert PEOPLE\n\n   TWO RULES IN ONE:\n   1. Never add -s   →  'the poors' ✘\n   2. Always plural verb →  'the poor is' ✘"},

 s13:[
 "The poor ____ often ignored, while ____ rich of this city ____ every facility.|are-the-have;is-the-has;are-a-have|0|'The poor' → ARE. 'The rich of this city' is specific → THE. Plural → HAVE.",
 "The wounded ____ taken to ____ hospital, and ____ dead ____ buried the same evening.|were-a-the-were;was-a-the-was;were-the-a-were|0|Plural → WERE. 'Hospital' spoken H → A. 'The dead' → THE + WERE.",

 s14:{
  rule:"THE + adjective means the whole class of people and takes a plural verb.",
  formula:"THE + adjective = plural noun → ARE / WERE / HAVE / NEED",
  memory:"Mentally add PEOPLE: the poor [people] are ignored.",
  ta:"மனசுல 'PEOPLE' சேர்த்துப் பாருங்க: the poor [people] are ignored.",
  tl:"Manasula 'PEOPLE' serthup paarunga: the poor [people] are ignored.",
  mistake:"Using a singular verb, and adding -s to write 'the poors'.",
  exam:"SSC CGL / CHSL and Bank — tested as an Error Spotting question about the VERB."},

 s15:[
 {ta:"இந்த rule ஒரு rule-ஓட முகமூடி போட்ட இன்னொரு rule. வெளிய பார்த்தா Article rule மாதிரி இருக்கு, ஆனா உள்ள Subject-Verb Agreement கேள்வி.",
  tl:"Indha rule oru rule-oda mugamoodi potta innoru rule. Veliya paarththaa Article rule maadhiri irukku, aanaa ulla Subject-Verb Agreement kelvi."},
 {ta:"முதல்ல rule-ஐ புரிஞ்சுக்கலாம். 'Poor' அப்படிங்கிறது ஒரு பெயரடை (adjective) — 'ஏழையான'. ஆனா அதுக்கு முன்னாடி 'the' போட்டா, அது பெயர்ச்சொல்லா மாறிடும் — 'the poor' = 'ஏழை மக்கள்'. அதேபோல 'the rich' = 'பணக்கார மக்கள்', 'the blind' = 'பார்வையற்றவர்கள்'.",
  tl:"Mudhalla rule-ai purinjukkalaam. 'Poor' appadingiradhu oru peyaradai (adjective) — 'ezhaiyaana'. Aanaa adhukku munnaadi 'the' pottaa, adhu peyarcholaa maaridum — 'the poor' = 'ezhai makkal'."},
 {ta:"இப்போ முக்கியமான கேள்வி: 'the poor' அப்படின்னா எத்தனை பேரு? ஒருத்தரா? இல்ல, பலர். எல்லா ஏழை மக்களும். பலர்னா என்ன? பன்மை. அதனால verb பன்மை. 'The poor ARE ignored.' 'IS' இல்ல.",
  tl:"Ippo mukkiyamaana kelvi: 'the poor' appadinnaa eththanai peru? Oruththaraa? Illa, palar. Ellaa ezhai makkalum. Palarnaa enna? Panmai. Adhanaala verb panmai. 'The poor ARE ignored.'"},
 {ta:"இதை எப்படி எளிமையா நினைவு வெச்சுக்கிறது? மனசுக்குள்ள 'people' அப்படிங்கிற வார்த்தையை சேர்த்துப் பாருங்க. 'The poor [people] are ignored.' இப்போ verb தெளிவா தெரியுது இல்லையா? 'The rich [people] have problems.' 'The blind [people] need help.' இந்த ஒரு trick போதும்.",
  tl:"Idhai eppadi elimaiyaa ninaivu vechukkiradhu? Manasukkulla 'people' appadingira vaarththaiyai serthup paarunga. 'The poor [people] are ignored.' Ippo verb thelivaa theriyudhu illaiyaa?"},
 {ta:"இன்னொரு பெரிய தப்பு சொல்லுறேன். நிறைய பேரு 'பன்மைன்னா -s போடணும்' அப்படின்னு நினைச்சு 'the poors' அப்படின்னு எழுதுவாங்க. இது கண்டிப்பா தப்பு. 'The poors', 'the riches', 'the blinds' — எல்லாமே தப்பு. பன்மை பொருள்ல இருக்கு, எழுத்துல இல்ல. இது SVA module-ல படிச்ச Rule 47 மாதிரியே — police, cattle, people-க்கு -s போடமாட்டோம், ஆனா பன்மை verb போடுவோம்.",
  tl:"Innoru periya thappu solluren. Neraiya peru 'panmainnaa -s podanum' appadinnu ninaichu 'the poors' appadinnu ezhudhuvaanga. Idhu kandippaa thappu. Panmai porulla irukku, ezhuththula illa. Idhu SVA module-la padicha Rule 47 maadhiriye."},
 {ta:"கடைசியா ஒரு கூடுதல் தகவல். தேசியப் பெயரடையும் இதே மாதிரி வேலை செய்யும். 'The English are hardworking', 'The French are artistic', 'The Chinese are industrious', 'The Japanese are disciplined'. இதெல்லாம் அந்த நாட்டு மக்களைக் குறிக்குது, பலர். அதனால பன்மை verb. இதை SSC அடிக்கடி கேட்கும்.",
  tl:"Kadaisiyaa oru koodudhal thagaval. Desiyap peyaradaiyum idhe maadhiri velai seyyum. 'The English are hardworking', 'The French are artistic', 'The Chinese are industrious'. Idhellaam andha naattu makkalaik kurikkudhu, palar. Adhanaala panmai verb."}]},

/* ========== RULE 9 ========== */
{n:9,rc:"ART-09",d:"Hard",t:"Omit the Article when the Place serves its PRIMARY PURPOSE",
 tam:"School, Hospital, Prison — முதன்மை நோக்கத்திற்குப் பயன்படும்போது article இல்லை",
 s1:{en:"Words like school, college, church, temple, hospital, court, prison, jail, bed, market and sea take NO article when the person is there for the place's PRIMARY PURPOSE. When you visit the BUILDING itself, THE returns.",
  ta:"School, college, church, temple, hospital, court, prison, jail, bed, market, sea போன்ற சொற்கள், அந்த இடத்தின் முதன்மை நோக்கத்திற்காக ஒருவர் அங்கு இருக்கும்போது article எடுக்காது. நீங்கள் கட்டிடத்தையே பார்க்கச் செல்லும்போது, THE திரும்பி வரும்.",
  tl:"School, college, church, temple, hospital, court, prison, jail, bed, market, sea pondra sorkal, andha idaththin mudhanmai nokkaththirkaaga oruvar angu irukkumbodhu article edukkaadhu. Neengal kattidaththaiye paarkkach sellumbodhu, THE thirumbi varum.",
  formula:"PRIMARY PURPOSE  →  NO ARTICLE\n  He goes to school.        (to study)\n  He is in hospital.        (as a patient)\n  He was sent to prison.    (as a convict)\n  She went to bed.          (to sleep)\n\nTHE BUILDING  →  THE\n  He went to THE school to meet the principal.\n  He went to THE hospital to see a patient.\n  He went to THE prison to interview a convict."},

 s2:[
 {h:"Purpose versus place",
  en:"The question English asks is: are you there for the ACTIVITY or for the BUILDING? A student goes to school (activity: studying). A father goes to THE school (building: to meet a teacher). Same word, two different meanings.",
  ta:"நோக்கமா, இடமா? ஆங்கிலம் கேட்கும் கேள்வி இதுதான்: நீங்கள் அங்கே செயலுக்காக இருக்கிறீர்களா, கட்டிடத்திற்காகவா? ஒரு மாணவர் school-க்குச் செல்கிறார் (செயல்: படிப்பது). ஒரு தந்தை THE school-க்குச் செல்கிறார் (கட்டிடம்: ஆசிரியரைச் சந்திக்க). ஒரே சொல், இரண்டு வெவ்வேறு பொருள்.",
  tl:"Nokkamaa, idamaa? Aangilam ketkum kelvi idhudhaan: neengal ange seyalukkaaga irukkireergalaa, kattidaththirkaagavaa? Oru maanavar school-kkuch selgiraar (seyal: padippadhu). Oru thandhai THE school-kkuch selgiraar (kattidam)."},
 {h:"The full family of words",
  en:"school, college, university (in some uses), church, temple, mosque, hospital, court, prison, jail, bed, table (at table = eating), sea (go to sea = become a sailor), town, market, class, office, work, home.",
  ta:"முழு சொல் குடும்பம்: school, college, church, temple, mosque, hospital, court, prison, jail, bed, table (at table = சாப்பிடுவது), sea (go to sea = மாலுமியாவது), town, market, class, office, work, home.",
  tl:"Muzhu sol kudumbam: school, college, church, temple, mosque, hospital, court, prison, jail, bed, table (at table = saappiduvadhu), sea (go to sea = maalumiyaavadhu), town, market, class, office, work, home."},
 {h:"The most useful pairs to memorise",
  en:"go to bed (to sleep) vs go to THE bed (the furniture). go to sea (become a sailor) vs go to THE sea (the beach). at table (eating) vs at THE table (the furniture). in class (studying) vs in THE class (the room).",
  ta:"மனப்பாடம் செய்ய வேண்டிய மிகவும் பயனுள்ள ஜோடிகள்: go to bed (தூங்க) vs go to THE bed (மரச்சாமான்). go to sea (மாலுமியாக) vs go to THE sea (கடற்கரை). at table (சாப்பிடுவது) vs at THE table (மேசை). in class (படிப்பது) vs in THE class (அறை).",
  tl:"Manappaadam seyya vendiya migavum payanulla jodigal: go to bed vs go to THE bed. go to sea vs go to THE sea. at table vs at THE table. in class vs in THE class."},
 {h:"American English differs — follow British usage",
  en:"Americans say 'in THE hospital' even for a patient. Indian competitive exams follow BRITISH usage, so 'He is in hospital' with no article is the expected answer. Do not be misled by American films or websites.",
  ta:"அமெரிக்க ஆங்கிலம் வேறுபடுகிறது — பிரிட்டிஷ் வழக்கைப் பின்பற்றுங்கள். அமெரிக்கர்கள் நோயாளிக்கும் 'in THE hospital' என்று சொல்கிறார்கள். இந்தியப் போட்டித் தேர்வுகள் பிரிட்டிஷ் வழக்கைப் பின்பற்றுகின்றன, எனவே article இல்லாத 'He is in hospital'தான் எதிர்பார்க்கப்படும் விடை. அமெரிக்கத் திரைப்படங்களாலோ இணையதளங்களாலோ தவறாக வழிநடத்தப்படாதீர்கள்.",
  tl:"America Aangilam verupadugiradhu — British vazhakkaip pinpatrungal. Americargal noyaalikkum 'in THE hospital' endru solgiraargal. Indhiyap pottith thervugal British vazhakkaip pinpatrugindrana, enave article illaadha 'He is in hospital'-dhaan edhirpaarkkappadum vidai."}],

 s3:[
 {h:"Why are you there?",
  d:"   🎒 to STUDY        →  He goes to school.        (no article)\n   👔 to MEET someone  →  He goes to THE school.    (THE)\n\n   🤒 as a PATIENT     →  He is in hospital.        (no article)\n   💐 as a VISITOR     →  He is at THE hospital.    (THE)\n\n   ⛓️ as a CONVICT     →  He was sent to prison.    (no article)\n   📋 as an OFFICER    →  He went to THE prison.    (THE)"},
 {h:"The famous pairs",
  d:"  go to BED       = to sleep      |  go to THE BED  = the furniture\n  go to SEA       = become sailor  |  go to THE SEA  = the beach\n  at TABLE        = eating         |  at THE TABLE   = the furniture\n  in CLASS        = studying       |  in THE CLASS   = the room\n  go to CHURCH    = to pray        |  go to THE CHURCH = to see it\n  in COURT        = on trial       |  in THE COURT   = the building"}],

 s4:{
 wrong:["\"Hospital is a place, and places need THE.\" — Not when you are there as a patient.",
  "\"'He is in the hospital' is what I hear in films.\" — That is American usage. Indian exams follow British usage.",
  "\"'Go to the bed' is more grammatical than 'go to bed'.\" — 'Go to bed' means to sleep and is the standard idiom.",
  "\"This rule applies to all buildings.\" — Only to this specific family of institution words."],
 right:["Ask: is this person here for the ACTIVITY or to see the BUILDING?",
  "Activity → no article. Building → THE.",
  "Memorise the pairs: to bed / to the bed, to sea / to the sea, at table / at the table.",
  "Follow British usage: 'in hospital' for a patient."]},

 s5:[
 {en:"He goes to school every day.",ta:"அவன் தினமும் பள்ளிக்குச் செல்கிறான்.",tl:"Avan dhinamum pallikkuch selgiraan.",note:"He goes to STUDY — the primary purpose → no article."},
 {en:"His father went to the school to meet the principal.",ta:"அவனுடைய தந்தை தலைமையாசிரியரைச் சந்திக்கப் பள்ளிக்குச் சென்றார்.",tl:"Avanudaiya thandhai thalaimaiyaasiriyaraich sandhikkap pallikkuch sendraar.",note:"He went to the BUILDING, not to study → THE."},
 {en:"The thief was sent to prison for three years.",ta:"அந்தத் திருடன் மூன்று ஆண்டுகளுக்குச் சிறையில் அடைக்கப்பட்டான்.",tl:"Andhath thirudan moondru aandugalukkuch siraiyil adaikkappattaan.",note:"He is there as a CONVICT → no article."},
 {en:"My brother is in hospital with a fracture.",ta:"என்னுடைய சகோதரர் எலும்பு முறிவால் மருத்துவமனையில் இருக்கிறார்.",tl:"Ennudaiya sagodharar elumbu murivaal maruththuvamanaiyil irukkiraar.",note:"He is there as a PATIENT → no article."},
 {en:"She went to bed early last night.",ta:"நேற்று இரவு அவர் சீக்கிரமாகத் தூங்கச் சென்றார்.",tl:"Netru iravu avar seekkiramaagath thoongach sendraar.",note:"'Go to bed' means to sleep → no article."}],

 s7:[

 "The thief was sent to ____ prison.|—|Easy|As a convict.",
 "She went to ____ bed at ten.|—|Easy|To sleep.",

 s8:[
 "He goes to the school every day to study.|He goes to school every day to study.|He is there for the primary purpose.",
 "His father went to school to meet the principal.|His father went to the school to meet the principal.|He went to the building.",
 "The thief was sent to the prison as a convict.|The thief was sent to prison as a convict.|He is there for the primary purpose.",
 "She went to the bed at ten to sleep.|She went to bed at ten to sleep.|'Go to bed' means to sleep.",
 "My uncle is in the hospital with a fever.|My uncle is in hospital with a fever.|British usage drops the article for a patient.",
 "I went to hospital to see my uncle.|I went to the hospital to see my uncle.|A visitor goes to the building.",
 "He goes to the church every Sunday to pray.|He goes to church every Sunday to pray.|Primary purpose.",
 "The accused appeared in the court as a party.|The accused appeared in court as a party.|Primary purpose.",
 "The family was at the table eating dinner.|The family was at table eating dinner.|'At table' means eating.",
 "The students are in the class studying now.|The students are in class studying now.|Primary purpose."],

 s9:[
 "Fill in the Blank|My brother has been in ____ hospital since Monday with a broken leg.|the;no article|1|He is there as a patient → no article.",
 "Find the Error|His father went (A) to school (B) to meet the class teacher (C) about his marks (D).|A;B;C;D|1|Part B. He went to the building, not to study → 'to the school'.",
 "Sentence Improvement|The convict was sent to the prison for a period of five years.|to the prison;to prison;to a prison|1|He is there as a convict → no article.",
 "Fill in the Blank|The whole family was at ____ table when the news was announced on TV.|the;no article|1|'At table' means eating → no article.",
 "Find the Error|She goes (A) to the church (B) every Sunday morning (C) to pray quietly (D).|A;B;C;D|1|Part B. She goes to pray, the primary purpose → 'to church'."],

 s10:{
  en:"This is the hardest article rule because the SAME sentence can be right or wrong depending on WHY the person is there. The exam supplies the reason in the second half of the sentence: 'to study' versus 'to meet the principal', 'with a fracture' versus 'to see a patient'. Read the whole sentence before choosing. Also beware of American usage from films — Indian exams follow British rules.",
  ta:"இது மிகக் கடினமான article விதி, ஏனெனில் அந்த நபர் அங்கே ஏன் இருக்கிறார் என்பதைப் பொறுத்து ஒரே வாக்கியம் சரியாகவோ தவறாகவோ இருக்கலாம். தேர்வு காரணத்தை வாக்கியத்தின் இரண்டாவது பாதியில் தருகிறது: 'to study' மற்றும் 'to meet the principal', 'with a fracture' மற்றும் 'to see a patient'. தேர்ந்தெடுப்பதற்கு முன் முழு வாக்கியத்தையும் படியுங்கள். மேலும் திரைப்படங்களில் இருந்து வரும் அமெரிக்க வழக்கு குறித்து எச்சரிக்கையாக இருங்கள்.",
  tl:"Idhu migak kadinamaana article vidhi, yenenil andha nabar ange yen irukkiraar enbadhaip poruththu ore vaakkiyam sariyaagavo thavaraagavo irukkalaam. Therndhedupparku mun muzhu vaakkiyaththaiyum padiyungal."},

 s11:{
  en:"WHY IS THE PERSON THERE? For the ACTIVITY → no article. For the BUILDING → THE.",
  ta:"அந்த நபர் ஏன் அங்கே இருக்கிறார்? செயலுக்காக → article இல்லை. கட்டிடத்திற்காக → THE.",
  tl:"Andha nabar yen ange irukkiraar? Seyalukkaaga → article illai. Kattidaththirkaaga → THE.",
  vis:"       ASK: WHY IS HE THERE?\n\n   STUDENT  → school   → to STUDY   → no article\n   PARENT   → THE school → to MEET  → THE\n\n   PATIENT  → hospital → to be TREATED → no article\n   VISITOR  → THE hospital → to SEE   → THE\n\n   CONVICT  → prison   → to be JAILED → no article\n   OFFICER  → THE prison → to INSPECT → THE\n\n   ⚠ British usage: 'in hospital' for a patient.\n     American films say 'in the hospital' — ignore them."},

 s13:[
 "His son goes to ____ school, but yesterday he himself went to ____ school to meet ____ principal.|—-the-the;the-—-a;—-a-the|0|Student → no article. Parent visiting the building → THE. A specific principal → THE.",
 "My brother is in ____ hospital, so I went to ____ hospital carrying ____ basket of fruit.|—-the-a;the-—-a;—-a-the|0|Patient → no article. Visitor → THE. 'Basket' → A.",
 "____ accused were produced in ____ court by ____ police at ____ 10 o'clock.|The-—-the-—;A-the-the-the;The-the-the-—|0|'The accused' → THE. 'In court' as a party → no article. 'The police' → THE. Clock time takes no article.",
 "She went to ____ bed after placing ____ lamp on ____ table near ____ window.|—-a-the-the;the-a-a-the;—-the-a-a|0|'Go to bed' → no article. 'Lamp' → A. Specific table and window → THE.",

 s14:{
  rule:"Institution words take no article when used for their primary purpose, and THE when the building is meant.",
  formula:"PRIMARY PURPOSE → no article\nTHE BUILDING → THE",
  memory:"Ask why the person is there. Activity = no article. Building = THE.",
  ta:"அந்த நபர் ஏன் அங்க இருக்காருன்னு கேளுங்க. செயல்னா article இல்ல. கட்டிடம்னா THE.",
  tl:"Andha nabar yen anga irukkaarunnu kelunga. Seyalnaa article illa. Kattidamnaa THE.",
  mistake:"Writing 'in the hospital' for a patient because of American usage, and 'go to the bed' for sleeping.",
  exam:"SSC CGL Tier-1, CDS and Bank — appears in Fill in the Blank and Cloze Test."},

 s15:[
 {ta:"இது Articles-ல மிகக் கடினமான rule. ஏன்? ஏன்னா ஒரே வாக்கியம் ஒரு சூழல்ல சரியா இருக்கும், இன்னொரு சூழல்ல தப்பா இருக்கும். வார்த்தை மாறல, ஆனா அர்த்தம் மாறுது.",
  tl:"Idhu Articles-la migak kadinamaana rule. Yennaa ore vaakkiyam oru soozhalla sariyaa irukkum, innoru soozhalla thappaa irukkum. Vaarththai maarala, aanaa arththam maarudhu."},
 {ta:"ஒரு உதாரணம் பார்ப்போம். 'He goes to school.' — இதுல article இல்ல. ஏன்? ஏன்னா அவன் ஒரு மாணவன், படிக்கப் போறான். school-ஓட முதன்மை நோக்கம் என்ன? படிப்பு. அவன் அதுக்குத்தான் போறான். அதனால article இல்ல.",
  tl:"Oru udhaaranam paarpom. 'He goes to school.' — idhula article illa. Yennaa avan oru maanavan, padikkap poraan. School-oda mudhanmai nokkam enna? Padippu. Avan adhukkuth-thaan poraan. Adhanaala article illa."},
 {ta:"ஆனா 'His father went to THE school to meet the principal.' — இங்க THE இருக்கு. ஏன்? ஏன்னா அப்பா படிக்கப் போகல. அவரு கட்டிடத்துக்குப் போறாரு, தலைமையாசிரியரைப் பார்க்க. அவருக்கு school ஒரு கட்டிடம் மட்டும்தான். அதனால THE.",
  tl:"Aanaa 'His father went to THE school to meet the principal.' — inga THE irukku. Yennaa appaa padikkap pogala. Avaru kattidaththukkup poraaru. Avarukku school oru kattidam mattum-dhaan. Adhanaala THE."},
 {ta:"மருத்துவமனையும் அப்படித்தான். 'My brother is in hospital' — அவரு நோயாளி. மருத்துவமனையோட முதன்மை நோக்கம் சிகிச்சை. அவரு அதுக்குத்தான் இருக்காரு. article இல்ல. ஆனா 'I went to THE hospital to see my brother' — நான் நோயாளி இல்ல, நான் பார்க்கப் போறேன். கட்டிடம். THE.",
  tl:"Maruththuvamanaiyum appadidhaan. 'My brother is in hospital' — avaru noyaali. Article illa. Aanaa 'I went to THE hospital to see my brother' — naan noyaali illa, naan paarkkap poren. Kattidam. THE."},
 {ta:"இப்போ சில முக்கியமான ஜோடி சொல்லுறேன், இதை மனப்பாடம் பண்ணுங்க. 'Go to bed' = தூங்கப் போ. 'Go to the bed' = படுக்கை அப்படிங்கிற மரச்சாமான் கிட்ட போ. 'Go to sea' = மாலுமியாகு. 'Go to the sea' = கடற்கரைக்குப் போ. 'At table' = சாப்பிட்டுட்டு இரு. 'At the table' = மேசை பக்கத்துல இரு. இந்த ஜோடிகள் தேர்வுல அடிக்கடி வரும்.",
  tl:"Ippo sila mukkiyamaana jodi solluren, idhai manappaadam pannunga. 'Go to bed' = thoongap po. 'Go to the bed' = padukkai kitta po. 'Go to sea' = maalumiyaagu. 'Go to the sea' = kadarkaraikkup po. 'At table' = saappittuttu iru. 'At the table' = mesai pakkaththula iru."},
 {ta:"கடைசியா ஒரு முக்கியமான எச்சரிக்கை. நீங்க ஆங்கில படம் பார்க்கும்போது 'He is in THE hospital' அப்படின்னு கேட்பீங்க — நோயாளியா இருந்தாலும். அது அமெரிக்க ஆங்கிலம். இந்திய தேர்வுகள் எல்லாம் பிரிட்டிஷ் ஆங்கிலத்தைத்தான் பின்பற்றுது. அதனால தேர்வுல 'in hospital' — article இல்லாம — அதுதான் சரி. படம் பார்த்து குழம்பாதீங்க.",
  tl:"Kadaisiyaa oru mukkiyamaana echcharikkai. Neenga Aangila padam paarkkumbodhu 'He is in THE hospital' appadinnu ketpeenga. Adhu America Aangilam. Indhiya thervugal ellaam British Aangilaththaith-thaan pinpatrudhu. Adhanaala thervula 'in hospital' — article illaama — adhudhaan sari."}]},

/* ========== RULE 10 ========== */
{n:10,rc:"ART-10",d:"Hard",t:"Repeat the Article for Two Different Persons or Things",
 tam:"ஒரே நபர் = ஒரு article. வெவ்வேறு நபர் = தனித்தனி article",
 s1:{en:"ONE article before two nouns means ONE person or thing, and the verb is SINGULAR. REPEATING the article means TWO separate persons or things, and the verb is PLURAL. The article count tells you how many entities there are.",
  ta:"இரண்டு பெயர்ச்சொற்களுக்கு முன் ஒரு article என்றால் ஒரே ஒரு நபர் அல்லது பொருள், வினைச்சொல் ஒருமை. Article-ஐ மீண்டும் சேர்த்தால் இரண்டு தனித்தனி நபர்கள் அல்லது பொருட்கள், வினைச்சொல் பன்மை. Article எண்ணிக்கை எத்தனை பொருட்கள் இருக்கின்றன என்பதைச் சொல்கிறது.",
  tl:"Irandu peyarchorkalukku mun oru article endraal ore oru nabar alladhu porul, vinaichol orumai. Article-ai meendum serthaal irandu thanithani nabargal alladhu porutkal, vinaichol panmai. Article ennikkai eththanai porutkal irukkindrana enbadhaich solgiradhu.",
  formula:"ONE article  =  ONE person  →  SINGULAR verb\n  THE secretary and treasurer IS present.\n  (one man holding both posts)\n\nTWO articles =  TWO persons →  PLURAL verb\n  THE secretary and THE treasurer ARE present.\n  (two different men)"},

 s2:[
 {h:"The article is a counting device",
  en:"Think of each article as a name tag. One tag means one person wearing two labels. Two tags mean two people standing side by side. Count the tags and you know how many people are in the room.",
  ta:"Article ஒரு எண்ணும் கருவி. ஒவ்வொரு article-ஐயும் ஒரு பெயர்ச் சீட்டாக நினைத்துக் கொள்ளுங்கள். ஒரு சீட்டு என்றால் இரண்டு பட்டங்களை அணிந்த ஒரே நபர். இரண்டு சீட்டு என்றால் அருகருகே நிற்கும் இரண்டு நபர்கள். சீட்டுகளை எண்ணினால் அறையில் எத்தனை பேர் இருக்கிறார்கள் என்று தெரியும்.",
  tl:"Article oru ennum karuvi. Ovvoru article-aiyum oru peyarch seettaaga ninaiththuk kollungal. Oru seettu endraal irandu pattangalai anindha ore nabar. Irandu seettu endraal arugaruge nirkum irandu nabargal."},
 {h:"This is exactly SVA Rule 33 seen from the other side",
  en:"In the Subject-Verb Agreement module you learnt that 'The Collector and District Magistrate IS' takes a singular verb. That was the VERB side of this rule. Here you are learning the ARTICLE side. Same rule, two doors.",
  ta:"இது Subject-Verb Agreement module-ன் Rule 33-ஐ மறுபக்கத்திலிருந்து பார்ப்பதுதான். அங்கே 'The Collector and District Magistrate IS' ஒருமை வினைச்சொல் எடுக்கும் என்று கற்றுக்கொண்டீர்கள். அது இந்த விதியின் வினைச்சொல் பக்கம். இங்கே article பக்கத்தைக் கற்றுக்கொள்கிறீர்கள். ஒரே விதி, இரண்டு கதவுகள்.",
  tl:"Idhu Subject-Verb Agreement module-in Rule 33-ai marupakkaththilirundhu paarppadhudhaan. Ange 'The Collector and District Magistrate IS' orumai vinaichol edukkum endru katrukkondeergal. Ore vidhi, irandu kadhavugal."},
 {h:"Possessives count as articles too",
  en:"'My friend and guide HAS advised me' — one 'my' means one person who is both. 'My friend and my guide HAVE advised me' — two 'my' means two people. Words like my, his, her and your work exactly like the.",
  ta:"உடைமைச் சொற்களும் article-ஆகவே கணக்கிடப்படும். 'My friend and guide HAS advised me' — ஒரு 'my' என்றால் இரண்டுமாக இருக்கும் ஒரே நபர். 'My friend and my guide HAVE advised me' — இரண்டு 'my' என்றால் இரண்டு நபர்கள். my, his, her, your போன்ற சொற்கள் the போலவே செயல்படும்.",
  tl:"Udaimaich sorkalum article-aagave kanakkidappadum. 'My friend and guide HAS advised me' — oru 'my' endraal irandumaaga irukkum ore nabar. 'My friend and my guide HAVE advised me' — irandu 'my' endraal irandu nabargal."},
 {h:"Also repeat the article for contrasting things",
  en:"When two nouns are being contrasted or compared, repeat the article even if the verb does not change: 'the rise and THE fall of prices', 'a black and A white shirt' (two shirts) versus 'a black and white shirt' (one two-coloured shirt).",
  ta:"முரண்படும் பொருட்களுக்கும் article-ஐ மீண்டும் சேர்க்கவும். இரண்டு பெயர்ச்சொற்கள் ஒப்பிடப்படும்போது, வினைச்சொல் மாறாவிட்டாலும் article-ஐ மீண்டும் சேருங்கள்: 'a black and A white shirt' (இரண்டு சட்டைகள்) மற்றும் 'a black and white shirt' (ஒரே இரு நிற சட்டை).",
  tl:"Muranpadum porutkalukkum article-ai meendum serkkavum. 'a black and A white shirt' (irandu sattaigal) matrum 'a black and white shirt' (ore iru nira sattai)."}],

 s3:[
 {h:"Count the name tags",
  d:"   THE secretary and treasurer  IS  present.\n    ↑\n  ONE tag  →  👤  one man, two posts  →  singular verb\n\n   THE secretary and THE treasurer  ARE  present.\n    ↑                 ↑\n  TWO tags →  👤👤  two men          →  plural verb"},
 {h:"The shirt example",
  d:"  a black and white shirt      →  👕      ONE shirt\n     ↑                              (two colours on it)\n  one article\n\n  a black and A white shirt    →  👕👕   TWO shirts\n     ↑          ↑                  (one black, one white)\n  two articles"}],

 s4:{
 wrong:["\"There are two nouns, so there must be two people.\" — Not if only one article appears.",
  "\"The article is just decoration and does not change meaning.\" — Here the article count IS the meaning.",
  "\"'The Collector and District Magistrate are visiting' — that is clearly two officers.\" — In India it is one officer holding both designations.",
  "\"Possessives like 'my' are different from articles.\" — They count exactly the same way."],
 right:["Count the articles (the, a, my, his) before the nouns.",
  "One article → one entity → singular verb.",
  "Two articles → two entities → plural verb.",
  "Read the rest of the sentence for clues like 'both' or 'separately'."]},

 s5:[
 {en:"The secretary and treasurer is present at the meeting.",ta:"செயலாளராகவும் பொருளாளராகவும் இருக்கும் அதே நபர் கூட்டத்தில் இருக்கிறார்.",tl:"Seyalaalaraagavum porulaalaraagavum irukkum adhe nabar koottaththil irukkiraar.",note:"One article → one person holding both posts → IS."},
 {en:"The secretary and the treasurer are present at the meeting.",ta:"செயலாளரும் பொருளாளரும் இருவரும் கூட்டத்தில் இருக்கிறார்கள்.",tl:"Seyalaalarum porulaalarum iruvarum koottaththil irukkiraargal.",note:"Two articles → two different people → ARE."},
 {en:"The poet and philosopher is dead.",ta:"கவிஞரும் தத்துவவாதியுமான அந்த ஒரே நபர் இறந்துவிட்டார்.",tl:"Kavignarum thaththuvavaadhiyumaana andha ore nabar irandhuvittaar.",note:"One article → one man who was both → IS."},
 {en:"My friend and guide has always supported me.",ta:"என்னுடைய நண்பரும் வழிகாட்டியுமான அவர் எப்போதும் என்னை ஆதரித்திருக்கிறார்.",tl:"Ennudaiya nanbarum vazhikaattiyumaana avar eppodhum ennai aadhariththirukkiraar.",note:"One 'my' → one person → HAS."},
 {en:"He wore a black and a white shirt on the two days.",ta:"அவர் அந்த இரண்டு நாட்களிலும் ஒரு கருப்புச் சட்டையையும் ஒரு வெள்ளைச் சட்டையையும் அணிந்திருந்தார்.",tl:"Avar andha irandu naatkalilum oru karuppuch sattaiyaiyum oru vellaich sattaiyaiyum anindhirundhaar.",note:"Two articles → two separate shirts."}],

 "The poet and the philosopher ____ dead.|are|Medium|Two articles → two men.",
 "The principal and the vice-principal ____ attending.|are|Medium|Two articles.",
 "The Collector and District Magistrate ____ visiting us.|is|Medium|One article → one officer.",
 "My friend and guide ____ helped me a lot.|has|Hard|One 'my' → one person.",

 "The Chairman and Managing Director ____ signed it.|has|Hard|One article → one person.",
 "The Chairman and the Managing Director ____ signed separately.|have|Hard|Two articles → two people.",

 "The teacher and the writer ____ addressed us one after the other.|have|Expert|Two articles.",
 "The teacher and writer ____ addressed us for an hour.|has|Expert|One article → one person.",
 "The bread and butter ____ kept on the table.|was|Expert|One dish → singular."],

 s9:[
 "Fill in the Blank|The Chairman and Managing Director of the company ____ inaugurated the new plant.|has;have|0|One article → one person holding both posts.",
 "Find the Error|The principal (A) and vice-principal (B) are attending (C) two different meetings (D).|A;B;C;D|1|Part B. Two different people need a second article → 'and the vice-principal'.",
 "Sentence Improvement|The poet and the novelist is one of the finest writers of our time.|and the novelist is;and novelist is;and the novelist are|1|One person means one article and a singular verb.",
 "Fill in the Blank|My friend and ____ guide have both advised me to take up this course.|—;my|1|'Both' shows two people, so the possessive must be repeated.",
 "Find the Error|The Collector (A) and District Magistrate (B) are visiting (C) our district tomorrow (D).|A;B;C;D|2|Part C. One article means one officer → 'is visiting'."],

 s10:{
  en:"The exam decides the answer with ONE tiny word — a second 'the' that is either present or absent. Two sentences look identical at a glance. Worse, the verb and the article must AGREE with each other, so a single mistake breaks both. The other trap is Indian designations: 'The Collector and District Magistrate' is genuinely one officer, and 'The Chairman and Managing Director' is genuinely one person.",
  ta:"தேர்வு ஒரே ஒரு சின்ன சொல்லால் விடையைத் தீர்மானிக்கிறது — இரண்டாவது 'the' இருக்கிறதா இல்லையா என்பதால். இரண்டு வாக்கியங்களும் ஒரு பார்வையில் ஒரே மாதிரி தெரியும். மோசமாக, வினைச்சொல்லும் article-ம் ஒன்றுடன் ஒன்று ஒத்துப்போக வேண்டும், எனவே ஒரே ஒரு தவறு இரண்டையும் உடைக்கும். மற்றொரு பொறி இந்தியப் பதவிப் பெயர்கள்: 'The Collector and District Magistrate' உண்மையிலேயே ஒரே அதிகாரிதான்.",
  tl:"Thervu ore oru chinna sollaal vidaiyaith theermaanikkiradhu — irandaavadhu 'the' irukkiradhaa illaiyaa enbadhaal. Irandu vaakkiyangalum oru paarvaiyil ore maadhiri theriyum. Matroru pori Indhiyap padhavip peyargal."},

 s11:{
  en:"COUNT THE ARTICLES. One article = one person = singular verb. Two articles = two persons = plural verb.",
  ta:"Article-களை எண்ணுங்கள். ஒரு article = ஒரு நபர் = ஒருமை வினைச்சொல். இரண்டு article = இரண்டு நபர் = பன்மை வினைச்சொல்.",
  tl:"Article-galai ennungal. Oru article = oru nabar = orumai vinaichol. Irandu article = irandu nabar = panmai vinaichol.",
  vis:"        COUNT THE NAME TAGS\n\n   THE secretary and treasurer  →  👤    →  IS\n    ↑\n   1 tag = 1 person wearing 2 labels\n\n   THE secretary and THE treasurer →  👤👤  →  ARE\n    ↑                 ↑\n   2 tags = 2 separate people\n\n   POSSESSIVES COUNT TOO:\n   MY friend and guide      →  1 person  →  HAS\n   MY friend and MY guide   →  2 people  →  HAVE\n\n   ⚠ Indian designations that are ONE person:\n     The Collector and District Magistrate\n     The Chairman and Managing Director\n     The Principal and Correspondent"},

 s13:[
 "____ Collector and District Magistrate, along with his staff, ____ visiting ____ school tomorrow.|The-is-the;The-are-a;A-is-the|0|One article → one officer → IS. 'Along with' is ignored (SVA Rule 31). Visiting the building → THE school.",
 "____ poet and ____ novelist ____ both been awarded ____ honorary doctorate.|The-the-have-an;The-—-has-an;The-the-have-a|0|Two articles → two people → HAVE. 'Honorary' silent H → AN.",
 "My friend and ____ guide ____ advised me to join ____ university near ____ Ganga.|my-have-a-the;—-has-a-the;my-has-the-the|0|Second 'my' → two people → HAVE. 'University' /yu/ → A. River → THE.",
 "____ Chairman and Managing Director ____ present, but ____ secretary and ____ treasurer ____ absent.|The-was-the-the-were;The-were-the-—-was;A-was-a-a-were|0|One article → one person → WAS. Two articles → two people → WERE.",
 "____ principal and correspondent of ____ school ____ gone to ____ court on official work.|The-the-has-—;The-a-have-the;A-the-has-the|0|One article → one person → HAS. Specific school → THE. In court on official work → no article."],

 s14:{
  rule:"One article before two nouns means one person and a singular verb. Repeating the article means two persons and a plural verb.",
  formula:"ONE article → ONE person → SINGULAR verb\nTWO articles → TWO persons → PLURAL verb",
  memory:"Count the name tags. Possessives (my, his) count as articles too.",
  ta:"பெயர்ச் சீட்டுகளை எண்ணுங்க. My, His போன்ற உடைமைச் சொற்களும் article-ஆவே கணக்கு.",
  tl:"Peyarch seettugalai ennunga. My, His pondra udaimaich sorkalum article-aave kanakku.",
  mistake:"Ignoring the second article and choosing the verb by counting nouns instead.",
  exam:"SSC CGL Tier-1 favourite. Mirrors SVA Rule 33 — the two are always tested together."},

 s15:[
 {ta:"நாம Articles module-ஓட கடைசி rule-க்கு வந்துட்டோம். இது ரொம்ப சுவாரஸ்யமான rule, ஏன்னா இங்க ஒரு சின்ன வார்த்தை — 'the' — வாக்கியத்தோட முழு அர்த்தத்தையும் மாத்திடும்.",
  tl:"Naama Articles module-oda kadaisi rule-kku vandhuttom. Idhu romba suvaarasyamaana rule, yennaa inga oru chinna vaarththai — 'the' — vaakkiyaththoda muzhu arththaththaiyum maaththidum."},
 {ta:"ரெண்டு வாக்கியம் பாருங்க. 'The secretary and treasurer IS present.' மற்றும் 'The secretary and THE treasurer ARE present.' வித்தியாசம் என்ன? ஒரே ஒரு 'the'. ஆனா அர்த்தம் முழுசா வேற.",
  tl:"Rendu vaakkiyam paarunga. 'The secretary and treasurer IS present.' matrum 'The secretary and THE treasurer ARE present.' Viththiyaasam enna? Ore oru 'the'. Aanaa arththam muzhusaa veru."},
 {ta:"முதல் வாக்கியத்துல ஒரே ஒரு 'the'. அதனால ஒரே ஒரு நபர். அந்த ஒரு மனுஷன் செயலாளரும் ஆவாரு, பொருளாளரும் ஆவாரு. ரெண்டு பதவி, ஒரு நபர். அதனால IS. ரெண்டாவது வாக்கியத்துல ரெண்டு 'the'. ரெண்டு நபர். ஒருத்தர் செயலாளர், இன்னொருத்தர் பொருளாளர். அதனால ARE.",
  tl:"Mudhal vaakkiyaththula ore oru 'the'. Adhanaala ore oru nabar. Andha oru manushan seyalaalarum aavaaru, porulaalarum aavaaru. Rendu padhavi, oru nabar. Adhanaala IS. Randaavadhu vaakkiyaththula rendu 'the'. Rendu nabar. Adhanaala ARE."},
 {ta:"இதை ஒரு படமா நினைச்சுக்கோங்க — பெயர்ச் சீட்டு. ஒவ்வொரு 'the'-ம் ஒரு பெயர்ச் சீட்டு. அறையில எத்தனை சீட்டு இருக்கோ அத்தனை மனுஷன். ஒரு சீட்டு = ஒரு மனுஷன். ரெண்டு சீட்டு = ரெண்டு மனுஷன். சீட்டை எண்ணுங்க, மனுஷனை எண்ணுங்க, verb போடுங்க.",
  tl:"Idhai oru padamaa ninaichukkonga — peyarch seettu. Ovvoru 'the'-um oru peyarch seettu. Araiyila eththanai seettu irukko aththanai manushan. Oru seettu = oru manushan. Rendu seettu = rendu manushan."},
 {ta:"இப்போ ஒரு முக்கியமான இந்திய உதாரணம். 'The Collector and District Magistrate is visiting our town.' இதைப் பார்த்தவுடனே நிறைய பேரு நினைப்பாங்க — 'ரெண்டு அதிகாரி வராங்க'. இல்ல! இந்தியால ஒரே அதிகாரிதான் ரெண்டு பதவியையும் வகிக்கிறாரு. அவரோட முழு பதவிப் பெயரே 'Collector and District Magistrate'. ஒரு 'the'. ஒரு மனுஷன். IS.",
  tl:"Ippo oru mukkiyamaana Indhiya udhaaranam. 'The Collector and District Magistrate is visiting our town.' Idhaip paarththavudane neraiya peru ninaippaanga — 'rendu adhigaari varaanga'. Illa! India-la ore adhigaari-dhaan rendu padhaviyaiyum vagikkiraaru."},
 {ta:"கடைசியா ஒரு கூடுதல் தகவல் — 'my', 'his', 'her' போன்ற உடைமைச் சொல்லும் article மாதிரியே வேலை செய்யும். 'My friend and guide HAS helped me' — ஒரு 'my', ஒரு நபர். 'My friend and MY guide HAVE helped me' — ரெண்டு 'my', ரெண்டு நபர். இதே rule. மேலும் — நீங்க SVA module-ல படிச்ச Rule 33 நினைவிருக்கா? அது இதே rule-ஓட மறுபக்கம். அங்க verb பக்கம் பார்த்தோம், இங்க article பக்கம் பார்க்குறோம். ரெண்டையும் சேர்த்து படிச்சா, SSC-ல இந்த கேள்வி வந்தா நீங்க நிச்சயம் சரியா பண்ணுவீங்க.",
  tl:"Kadaisiyaa oru koodudhal thagaval — 'my', 'his', 'her' pondra udaimaich sollum article maadhiriye velai seyyum. 'My friend and guide HAS helped me' — oru 'my', oru nabar. Melum — neenga SVA module-la padicha Rule 33 ninaivirukkaa? Adhu idhe rule-oda marupakkam."}]}
];

/* ================== ENGINE ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[
 ["What is the Rule?","விதி என்ன? · Vidhi enna?"],
 ["Why does this rule exist?","ஏன் இந்த விதி? · Yen indha vidhi?"],
 ["Visual Diagram","படம் மூலம் புரிதல் · Padam moolam purithal"],
 ["Wrong Thinking vs Right Thinking","தவறான சிந்தனை · Thavaraana sinthanai"],
 ["Tamil Translation of Examples","உதாரணங்களின் தமிழ் · Udhaaranangalin Tamil"],
 ["Word-by-Word Meaning","சொல்லுக்குச் சொல் · Sollukku sol"],
 ["Solved Examples — Easy to Hard","தீர்க்கப்பட்ட உதாரணங்கள்"],
 ["Wrong vs Correct","தவறு vs சரி · Thavaru vs Sari"],
 ["SSC / Bank PYQ Style","முந்தைய வினாத்தாள் பாணி"],
 ["Exam Trap","தேர்வு பொறி · Thervu pori"],
 ["Memory Trick","நினைவு உத்தி · Ninaivu utthi"],
 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],
 ["Challenge Round","சவால் சுற்று · Savaal sutru"],
 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],
 ["Centu AI Explains","சென்டு AI விளக்கம்"]
];

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-articles', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
