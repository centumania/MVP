<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Articles (A, An, The) — 10 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

============================================== */
const RULES=[
/* ========== RULE 1 ========== */
{n:1,rc:"ART-01",d:"Easy",t:"Use A before a CONSONANT SOUND — not a consonant letter",
 tam:"மெய் ஒலிக்கு முன் 'A' — எழுத்து அல்ல, ஒலி · Mey olikku mun 'A' — ezhuththu alla, oli",
 s1:{en:"Use the article 'A' before a word that BEGINS WITH A CONSONANT SOUND. English articles follow the EAR, not the EYE. What matters is how the word is pronounced, not which letter it is spelt with.",
  ta:"மெய் ஒலியில் தொடங்கும் சொல்லுக்கு முன் 'A' பயன்படுத்த வேண்டும். ஆங்கில article-கள் காதைப் பின்பற்றுகின்றன, கண்ணை அல்ல. அந்தச் சொல் எப்படி உச்சரிக்கப்படுகிறது என்பதுதான் முக்கியம், எந்த எழுத்தில் எழுதப்படுகிறது என்பது அல்ல.",
  tl:"Mey oliyil thodangum sollukku mun 'A' payanpaduththa vendum. Aangila article-kal kaadhaip pinpatrugindrana, kannai alla. Andhach sol eppadi uchcharikkappadugiradhu enbadhudhaan mukkiyam.",
  formula:"A  +  word beginning with a CONSONANT SOUND\n\n  a boy      (b sound)\n  a cat      (k sound)\n  a pen      (p sound)\n  a house    (h sound — H is pronounced here)\n\n  RULE: say the word aloud FIRST, then choose."},

 s2:[
 {h:"The ear decides, not the eye",
  en:"This is the single most important idea in the whole Articles module. Do not look at the first LETTER. Say the word aloud and listen to the first SOUND. If your mouth makes a consonant sound, use A.",
  ta:"இது முழு Articles module-லும் மிக முக்கியமான கருத்து. முதல் எழுத்தைப் பார்க்காதீர்கள். சொல்லை உரக்கச் சொல்லி முதல் ஒலியைக் கேளுங்கள். உங்கள் வாய் ஒரு மெய் ஒலியை உருவாக்கினால், A பயன்படுத்துங்கள்.",
  tl:"Idhu muzhu Articles module-lum miga mukkiyamaana karuththu. Mudhal ezhuththaip paarkkaadheergal. Sollai urakkach solli mudhal oliyaik kelungal. Ungal vaay oru mey oliyai uruvaakkinaal, A payanpaduththungal."},
 {h:"Why 'a' exists at all",
  en:"'A' and 'AN' are the same word. English split them only to make speech smooth. Saying 'a apple' forces two vowel sounds to collide, which is hard for the mouth. So English inserts an N. That is the entire origin of the rule.",
  ta:"'A' மற்றும் 'AN' ஒரே சொல்தான். பேச்சு மென்மையாக இருக்க வேண்டும் என்பதற்காக மட்டுமே ஆங்கிலம் அவற்றைப் பிரித்தது. 'a apple' என்று சொல்வது இரண்டு உயிர் ஒலிகளை மோதவைக்கிறது, அது வாய்க்குக் கடினம். எனவே ஆங்கிலம் ஒரு N-ஐச் சேர்க்கிறது. இதுதான் இந்த விதியின் முழு தோற்றம்.",
  tl:"'A' matrum 'AN' ore sol-dhaan. Pechu menmaiyaaga irukka vendum enbadharkaaga mattume Aangilam avatraip piriththadhu. 'a apple' endru solvadhu irandu uyir oligalai modhavaikkiradhu, adhu vaaykkuk kadinam. Enave Aangilam oru N-aich serkkiradhu."},
 {h:"A / AN is used only with SINGULAR COUNTABLE nouns",
  en:"'A' and 'an' mean 'one'. So they can never be used with plural nouns ('a books' is impossible) or with uncountable nouns ('an advice', 'a furniture' are both wrong). This is worth remembering before you even reach the sound question.",
  ta:"'A' மற்றும் 'an' என்றால் 'ஒன்று' என்று பொருள். எனவே அவை ஒருபோதும் பன்மைப் பெயர்ச்சொற்களுடன் ('a books' சாத்தியமில்லை) அல்லது எண்ண முடியாத பெயர்ச்சொற்களுடன் ('an advice', 'a furniture' இரண்டுமே தவறு) பயன்படுத்தப்பட முடியாது. ஒலி கேள்விக்கு வருவதற்கு முன்பே இதை நினைவில் வைக்க வேண்டும்.",

 s3:[

  d:"           👁️  EYE  says: look at the LETTER   ✘\n           👂  EAR  says: listen to the SOUND   ✔\n\n   a  boy      →  /b/  consonant sound  →  A  ✔\n   a  cat      →  /k/  consonant sound  →  A  ✔\n   a  house    →  /h/  consonant sound  →  A  ✔\n\n   ALWAYS SAY THE WORD ALOUD FIRST."},
 {h:"Why the N was invented",
  d:"   a  apple   →  \"uh-apple\"   😖  two vowels collide\n   an apple   →  \"un-apple\"   😊  smooth\n\n   The N is a bridge between two vowel sounds.\n   That is the ONLY reason AN exists."}],

 s4:{

 s5:[
 {en:"I saw a dog near the gate.",ta:"வாசலுக்கு அருகில் ஒரு நாயைப் பார்த்தேன்.",tl:"Vaasalukku arugil oru naayaip paarththen.",note:"'Dog' begins with the /d/ consonant sound → A."},

 "Fill in the Blank|He is ____ member of the state legislative assembly.|a;an|0|'Member' begins with the /m/ consonant sound.",
 "Find the Error|She checked into (A) an hotel (B) near the railway station (C) last night (D).|A;B;C;D|1|Part B. The H in 'hotel' is pronounced → 'a hotel'.",
 "Sentence Improvement|It was an historic victory for the Indian team.|an historic;a historic;the historic|1|The H in 'historic' is pronounced.",
 "Fill in the Blank|The minister made ____ one-hour speech at the function.|a;an|0|'One' is pronounced 'wun', a consonant sound.",
 "Find the Error|He gave me (A) an useful book (B) on Indian history (C) last week (D).|A;B;C;D|1|Part B. 'Useful' begins with /yu/ → 'a useful book'."],

 s10:{
  en:"The exam NEVER tests the obvious case. It will not ask you about 'a boy'. It will pick words where the LETTER and the SOUND disagree — university, one, European, useful, hour, honest, MLA, hotel, historic. Students who learnt the rule as 'consonant LETTER takes A' get every single one of these wrong. Students who learnt it as 'consonant SOUND takes A' get every one right.",
  ta:"தேர்வு ஒருபோதும் வெளிப்படையான வழக்கைச் சோதிப்பதில்லை. 'a boy' பற்றி கேட்காது. எழுத்தும் ஒலியும் ஒத்துப்போகாத சொற்களைத்தான் தேர்ந்தெடுக்கும் — university, one, European, useful, hour, honest, MLA, hotel, historic. 'மெய் எழுத்துக்கு A' என்று விதியைக் கற்றுக்கொண்ட மாணவர்கள் இவை ஒவ்வொன்றையும் தவறாகச் செய்வார்கள். 'மெய் ஒலிக்கு A' என்று கற்றுக்கொண்டவர்கள் ஒவ்வொன்றையும் சரியாகச் செய்வார்கள்.",
  tl:"Thervu orupodhum velippadaiyaana vazhakkaich sodhippadhillai. 'a boy' patri ketkaadhu. Ezhuththum oliyum oththuppogaadha sorkalaith-thaan therndhedukkum — university, one, European, useful, hour, honest, MLA, hotel, historic."},

 s11:{
  en:"SAY IT ALOUD. Your mouth already knows the answer. A = Consonant Sound.",
  ta:"உரக்கச் சொல்லிப் பாருங்கள். உங்கள் வாய்க்கு ஏற்கனவே பதில் தெரியும். A = மெய் ஒலி.",
  tl:"Urakkach sollip paarungal. Ungal vaaykku erkanave padhil theriyum. A = Mey oli.",
  vis:"      THE ALOUD TEST\n\n   Step 1: cover the blank with your finger\n   Step 2: say the NEXT WORD out loud\n   Step 3: listen to the very first sound\n\n   Mouth closes / touches → CONSONANT → A\n   Mouth opens wide      → VOWEL     → AN\n\n   b, k, p, t, d, m, n, s, h(spoken), y, w  →  A\n\n   MEMORY LINE:  \"A = Consonant Sound.\""},

 s14:{
  rule:"Use A before a word beginning with a CONSONANT SOUND.",

 s15:[
 {ta:"வாங்க, Articles-ஐ ஆரம்பிக்கலாம். இது ரொம்ப எளிமையான rule மாதிரி தெரியும், ஆனா SSC-ல ஒவ்வொரு வருஷமும் நிறைய பேரு இதுல mark இழக்கிறாங்க. ஏன் தெரியுமா? ஏன்னா நாம school-ல ஒரு தப்பான rule கத்துக்கிட்டோம்.",
  tl:"Vaanga, Articles-ai aarambikkalaam. Idhu romba elimaiyaana rule maadhiri theriyum, aanaa SSC-la ovvoru varushamum neraiya peru idhula mark izhakkiraanga. Yen theriyumaa? Yennaa naama school-la oru thappaana rule kaththukkittom."},
 {ta:"நமக்கு சொல்லிக் கொடுத்தது என்ன? 'a, e, i, o, u-க்கு முன்னாடி AN, மத்ததுக்கு A.' இது எழுத்தை வெச்சு சொல்லப்பட்ட rule. இது 80% நேரம் வேலை செய்யும். ஆனா SSC அந்த மீதி 20%-ஐ மட்டும்தான் கேட்குது.",
  tl:"Namakku sollik koduththadhu enna? 'a, e, i, o, u-kku munnaadi AN, maththadhukku A.' Idhu ezhuththai vechu sollappatta rule. Idhu 80% neram velai seyyum. Aanaa SSC andha meedhi 20%-ai mattum-dhaan ketkudhu."},
 {ta:"சரியான rule என்னன்னா — எழுத்து இல்ல, ஒலி. உங்க கண்ணை நம்பாதீங்க, உங்க காதை நம்புங்க. ஒரு சொல்லை பார்த்தவுடனே மனசுக்குள்ள உரக்கச் சொல்லிப் பாருங்க. முதல்ல வர்ற ஒலி என்ன? அது மெய் ஒலியா, உயிர் ஒலியா?",
  tl:"Sariyaana rule ennannaa — ezhuththu illa, oli. Unga kannai nambaadheenga, unga kaadhai nambunga. Oru sollai paarththavudane manasukkulla urakkach sollip paarunga. Mudhalla varra oli enna? Adhu mey oliyaa, uyir oliyaa?"},
 {ta:"'Boy' — 'ப்' அப்படிங்கிற ஒலியில ஆரம்பிக்குது. உதடு மூடுது. மெய் ஒலி. A. 'Cat' — 'க்'. நாக்கு தொடுது. மெய் ஒலி. A. 'Apple' — 'அ'. வாய் திறக்குது, எதுவும் தொடல. உயிர் ஒலி. AN. இதை உங்க வாயே சொல்லிடும். மனப்பாடம் பண்ண வேணாம்.",
  tl:"'Boy' — 'p' appadingira oliyila aarambikkudhu. Udhadu moodudhu. Mey oli. A. 'Cat' — 'k'. Naakku thodudhu. Mey oli. A. 'Apple' — 'a'. Vaay thirakkudhu, edhuvum thodala. Uyir oli. AN."},
 {ta:"ஏன் இப்படி ஒரு விதி இருக்கு? ஒரு சின்ன வரலாறு சொல்லுறேன். 'A' மற்றும் 'AN' ரெண்டும் உண்மையில ஒரே வார்த்தைதான். 'a apple' அப்படின்னு சொல்லிப் பாருங்க — 'உ-ஆப்பிள்'. ரெண்டு உயிர் ஒலி மோதுது, வாய்க்கு கஷ்டமா இருக்கு. அதனால ஆங்கிலம் ஒரு 'n' நடுவுல போட்டு 'an apple' ஆக்கிடுச்சு. அவ்ளோதான். இந்த rule முழுக்க முழுக்க வசதிக்காக உருவானது, தர்க்கத்துக்காக இல்ல.",
  tl:"Yen ippadi oru vidhi irukku? Oru chinna varalaaru solluren. 'A' matrum 'AN' rendum unmaiyila ore vaarththai-dhaan. 'a apple' appadinnu sollip paarunga — 'u-apple'. Rendu uyir oli modhudhu, vaaykku kashtamaa irukku. Adhanaala Aangilam oru 'n' naduvula pottu 'an apple' aakkiduchu."},
 {ta:"கடைசியா ஒரு எச்சரிக்கை. 'A' மற்றும் 'AN' அப்படின்னா 'ஒன்று' அப்படிங்கிற அர்த்தம். அதனால ஒருமை மற்றும் எண்ணக்கூடிய பெயர்ச்சொல்லோட மட்டும்தான் வரும். 'a books' — தப்பு, பன்மை. 'an advice' — தப்பு, advice எண்ண முடியாதது. 'a furniture' — தப்பு. இதையும் மனசுல வெச்சுக்கோங்க, ஏன்னா SSC இதையும் சேர்த்து கேட்கும்.",
  tl:"Kadaisiyaa oru echcharikkai. 'A' matrum 'AN' appadinnaa 'ondru' appadingira arththam. Adhanaala orumai matrum ennakkoodiya peyarcholoda mattum-dhaan varum. 'a books' — thappu, panmai. 'an advice' — thappu, advice enna mudiyaadhadhu."}]},

/* ========== RULE 2 ========== */
{n:2,rc:"ART-02",d:"Easy",t:"Use AN before a VOWEL SOUND",
 tam:"உயிர் ஒலிக்கு முன் 'AN' · Uyir olikku mun 'AN'",
 s1:{en:"Use the article 'AN' before a word that BEGINS WITH A VOWEL SOUND — the sounds of a, e, i, o, u. Again, it is the SOUND that matters, not the letter.",
  ta:"உயிர் ஒலியில் தொடங்கும் சொல்லுக்கு முன் 'AN' பயன்படுத்த வேண்டும் — a, e, i, o, u ஆகியவற்றின் ஒலிகள். மீண்டும், ஒலிதான் முக்கியம், எழுத்து அல்ல.",
  tl:"Uyir oliyil thodangum sollukku mun 'AN' payanpaduththa vendum — a, e, i, o, u aagiyavatrin oligal. Meendum, oli-dhaan mukkiyam, ezhuththu alla.",
  formula:"AN  +  word beginning with a VOWEL SOUND\n\n  an apple     (a sound)\n  an egg       (e sound)\n  an idea      (i sound)\n  an orange    (o sound)\n  an umbrella  (u sound)\n  an MLA       (spelt M, but read 'EM')"},

 s2:[
 {h:"Abbreviations are the real test",
  en:"When a word is an abbreviation, you read the LETTER NAME aloud. M is read 'em', F is read 'ef', S is read 'es', L is read 'el', N is read 'en', X is read 'ex', R is read 'ar'. All of these begin with a vowel sound, so they take AN.",
  ta:"சுருக்கெழுத்துக்கள்தான் உண்மையான சோதனை. ஒரு சொல் சுருக்கெழுத்தாக இருந்தால், நீங்கள் எழுத்தின் பெயரை உரக்கப் படிக்கிறீர்கள். M = 'எம்', F = 'எஃப்', S = 'எஸ்', L = 'எல்', N = 'என்', X = 'எக்ஸ்', R = 'ஆர்'. இவை அனைத்தும் உயிர் ஒலியில் தொடங்குகின்றன, எனவே AN எடுக்கும்.",
  tl:"Surukkezhuththukkal-dhaan unmaiyaana sodhanai. Oru sol surukkezhuththaaga irundhaal, neengal ezhuththin peyarai urakkap padikkireergal. M = 'em', F = 'ef', S = 'es', L = 'el', N = 'en', X = 'ex', R = 'ar'."},
 {h:"The high-frequency AN abbreviations",
  en:"an MLA, an MP, an MBA, an MBBS, an FIR, an SDM, an SP, an SSC exam, an NGO, an LIC policy, an X-ray, an RTI application, an IAS officer, an IPS officer, an ATM card, an HR manager, an NCC cadet.",
  ta:"அடிக்கடி வரும் AN சுருக்கெழுத்துக்கள்: an MLA, an MP, an MBA, an MBBS, an FIR, an SDM, an SP, an SSC exam, an NGO, an LIC policy, an X-ray, an RTI application, an IAS officer, an ATM card, an HR manager.",
  tl:"Adikkadi varum AN surukkezhuththukkal: an MLA, an MP, an MBA, an MBBS, an FIR, an SDM, an SP, an NGO, an LIC policy, an X-ray, an RTI application, an IAS officer, an ATM card."},
 {h:"But some abbreviations take A",
  en:"B, C, D, G, J, K, P, Q, T, U, V, W, Y, Z all begin with consonant sounds when read aloud. So: a BA degree, a CBI enquiry, a PhD, a TV set, a UPSC exam, a UN report, a VIP, a BSc degree.",
  ta:"ஆனால் சில சுருக்கெழுத்துக்கள் A எடுக்கும். B, C, D, G, J, K, P, Q, T, U, V, W, Y, Z — இவை உரக்கப் படிக்கும்போது மெய் ஒலியில் தொடங்குகின்றன. எனவே: a BA degree, a CBI enquiry, a PhD, a TV set, a UPSC exam, a UN report, a VIP.",
  tl:"Aanaal sila surukkezhuththukkal A edukkum. B, C, D, G, J, K, P, Q, T, U, V, W, Y, Z — ivai urakkap padikkumbodhu mey oliyil thodangugindrana. Enave: a BA degree, a CBI enquiry, a PhD, a TV set, a UPSC exam."}],

 s3:[
 {h:"Say the letter name, not the letter",
  d:"   MLA   →  read aloud  →  \"EM-el-ay\"   →  E sound  →  AN ✔\n   BA    →  read aloud  →  \"BEE-ay\"     →  B sound  →  A  ✔\n   FIR   →  read aloud  →  \"EF-eye-ar\"  →  E sound  →  AN ✔\n   TV    →  read aloud  →  \"TEE-vee\"    →  T sound  →  A  ✔\n\n   ALWAYS SPELL THE FIRST LETTER OUT LOUD."},
 {h:"The two abbreviation families",
  d:"  TAKE 'AN' (letter name starts with a vowel)\n  A, E, F, H, I, L, M, N, O, R, S, X\n  → an MLA, an FIR, an SP, an NGO, an X-ray, an RTI\n\n  TAKE 'A' (letter name starts with a consonant)\n  B, C, D, G, J, K, P, Q, T, U, V, W, Y, Z\n  → a BA, a CBI case, a PhD, a TV, a UPSC exam, a VIP"}],

 s4:{
 wrong:["\"MLA starts with M, and M is a consonant letter, so use A.\" — You do not say 'muh-LA'. You say 'EM-el-ay'.",
  "\"All abbreviations take the same article.\" — It depends entirely on how the first letter is pronounced.",
  "\"'An' is only for a, e, i, o, u letters.\" — It is for a, e, i, o, u SOUNDS, wherever they come from."],
 right:["Spell the first letter aloud: M is 'em', F is 'ef', S is 'es'.",
  "If the letter name begins with a vowel sound → AN.",
  "Memorise the AN family: A E F H I L M N O R S X."]},

 s5:[
 {en:"I ate an apple after lunch.",ta:"மதிய உணவுக்குப் பிறகு ஒரு ஆப்பிள் சாப்பிட்டேன்.",tl:"Madhiya unavukkup piragu oru apple saappitten.",note:"'Apple' begins with the /a/ vowel sound → AN."},

 s10:{
  en:"Abbreviations are where this rule is actually tested. 'An MLA', 'an FIR', 'an SP', 'an NGO' all look wrong to the eye because they begin with consonant letters. Meanwhile 'a UPSC exam' and 'a BA degree' look wrong for the opposite reason. The exam picks exactly these. The fix is mechanical: spell the first letter out loud before you choose.",
  ta:"சுருக்கெழுத்துக்களில்தான் இந்த விதி உண்மையில் சோதிக்கப்படுகிறது. 'An MLA', 'an FIR', 'an SP', 'an NGO' — இவை அனைத்தும் மெய் எழுத்தில் தொடங்குவதால் கண்ணுக்குத் தவறாகத் தெரியும். அதே சமயம் 'a UPSC exam' மற்றும் 'a BA degree' நேர் எதிர் காரணத்தால் தவறாகத் தெரியும். தேர்வு சரியாக இவற்றைத்தான் தேர்ந்தெடுக்கும். தீர்வு எந்திரத்தனமானது: தேர்ந்தெடுப்பதற்கு முன் முதல் எழுத்தை உரக்கச் சொல்லுங்கள்.",
  tl:"Surukkezhuththukkalil-dhaan indha vidhi unmaiyil sodhikkappadugiradhu. 'An MLA', 'an FIR', 'an SP', 'an NGO' — ivai anaiththum mey ezhuththil thodanguvadhaal kannukkuth thavaraagath theriyum. Theervu endhiraththanamaanadhu: therndhedupparku mun mudhal ezhuththai urakkach sollungal."},

 s11:{
  en:"SPELL THE LETTER ALOUD. M is 'EM'. F is 'EF'. S is 'ES'. All vowel sounds → AN.",
  ta:"எழுத்தை உரக்கச் சொல்லுங்கள். M = 'எம்'. F = 'எஃப்'. S = 'எஸ்'. எல்லாம் உயிர் ஒலிகள் → AN.",
  tl:"Ezhuththai urakkach sollungal. M = 'em'. F = 'ef'. S = 'es'. Ellaam uyir oligal → AN.",
  vis:"     THE AN-FAMILY OF LETTERS\n\n     A  E  F  H  I  L  M  N  O  R  S  X\n     ↓  ↓  ↓  ↓  ↓  ↓  ↓  ↓  ↓  ↓  ↓  ↓\n    ay ee ef aitch eye el em en oh ar es ex\n         ALL START WITH A VOWEL SOUND\n\n  MEMORY SENTENCE (say it daily):\n  \"AN MLA filed AN FIR with AN SP of AN NGO.\"\n\n  EVERYTHING ELSE (B C D G J K P Q T U V W Y Z) → A\n  \"A BA, A CBI case, A PhD, A TV, A UPSC exam.\""},

 s14:{
  rule:"Use AN before a word beginning with a VOWEL SOUND, including abbreviations read as letters.",
  formula:"AN + vowel SOUND. Letters A E F H I L M N O R S X → AN",
  memory:"Spell the letter aloud. 'AN MLA filed AN FIR with AN SP.'",
  ta:"எழுத்தை உரக்கச் சொல்லுங்க. 'AN MLA filed AN FIR with AN SP.'",
  tl:"Ezhuththai urakkach sollunga. 'AN MLA filed AN FIR with AN SP.'",
  mistake:"Writing 'a MLA' and 'a FIR' because the words begin with consonant letters.",
  exam:"SSC CGL / CHSL / MTS, RRB, Bank — abbreviations appear almost every year."},

 s15:[
 {ta:"Rule 1-ல நாம கத்துக்கிட்டோம் — ஒலிதான் முக்கியம், எழுத்து இல்ல. இப்போ அதே கொள்கையை AN-க்கு பயன்படுத்தலாம். ஆனா இங்க ஒரு புது விஷயம் இருக்கு — சுருக்கெழுத்து. இதுதான் SSC-ஓட உண்மையான களம்.",
  tl:"Rule 1-la naama kaththukkittom — oli-dhaan mukkiyam, ezhuththu illa. Ippo adhe kolgaiyai AN-kku payanpaduththalaam. Aanaa inga oru pudhu vishayam irukku — surukkezhuththu. Idhudhaan SSC-oda unmaiyaana kalam."},
 {ta:"ஒரு உதாரணம் பார்ப்போம். 'He is ____ MLA.' இப்போ என்ன போடுவீங்க? நிறைய பேரு A போடுவாங்க. ஏன்? ஏன்னா 'MLA' M-ல ஆரம்பிக்குது, M ஒரு மெய் எழுத்து. logic சரிதான், ஆனா முடிவு தப்பு.",
  tl:"Oru udhaaranam paarpom. 'He is ____ MLA.' Ippo enna poduveenga? Neraiya peru A poduvaanga. Yennaa 'MLA' M-la aarambikkudhu, M oru mey ezhuththu. Logic saridhaan, aanaa mudivu thappu."},
 {ta:"ஏன் தப்பு? ஏன்னா நீங்க 'MLA'-ஐ எப்படி படிக்கிறீங்க? 'ம்-லா' அப்படின்னா? இல்ல. 'எம்-எல்-ஏ' அப்படித்தான் படிக்கிறீங்க. முதல் ஒலி என்ன? 'எ'. அது உயிர் ஒலி! அதனால AN. 'An MLA'. சரி.",
  tl:"Yen thappu? Yennaa neenga 'MLA'-ai eppadi padikkireenga? 'm-laa' appadinnaa? Illa. 'em-el-ay' appadidhaan padikkireenga. Mudhal oli enna? 'e'. Adhu uyir oli! Adhanaala AN. 'An MLA'. Sari."},
 {ta:"இதே வழியில எல்லாத்தையும் சரிபாருங்க. FIR — 'எஃப்-ஐ-ஆர்'. 'எ'. AN. SP — 'எஸ்-பி'. 'எ'. AN. NGO — 'என்-ஜி-ஓ'. 'எ'. AN. X-ray — 'எக்ஸ்-ரே'. 'எ'. AN. இதெல்லாம் கண்ணுக்கு தப்பா தெரியும், ஆனா காதுக்கு சரியா இருக்கும்.",
  tl:"Idhe vazhiyila ellaaththaiyum saripaarunga. FIR — 'ef-eye-ar'. 'e'. AN. SP — 'es-pee'. 'e'. AN. NGO — 'en-jee-oh'. 'e'. AN. X-ray — 'ex-ray'. 'e'. AN."},
 {ta:"இப்போ தலைகீழ் பக்கம் பாருங்க. 'BA' — 'பீ-ஏ'. 'ப்' ஒலி. மெய். A. 'a BA degree'. 'TV' — 'டீ-வீ'. 'ட்'. மெய். A. 'UPSC' — 'யூ-பி-எஸ்-சி'. 'ய்'. மெய்! A. 'a UPSC exam'. இது கண்ணுக்கு தப்பா தெரியும், ஏன்னா U ஒரு உயிரெழுத்து. ஆனா ஒலி 'யூ' — அது மெய் ஒலி.",
  tl:"Ippo thalaigeezh pakkam paarunga. 'BA' — 'bee-ay'. 'b' oli. Mey. A. 'TV' — 'tee-vee'. 'T'. Mey. A. 'UPSC' — 'yu-pee-es-see'. 'y'. Mey! A. 'a UPSC exam'."},
 {ta:"இதை எளிமையா நினைவுல வெச்சுக்க ஒரு வாக்கியம் தாறேன். தினமும் ஒரு தடவ சொல்லுங்க: 'AN MLA filed AN FIR with AN SP of AN NGO.' இந்த ஒரு வாக்கியத்துல நாலு முக்கியமான சுருக்கெழுத்து இருக்கு. இதை மனப்பாடம் பண்ணிட்டா, தேர்வுல இந்த மாதிரி கேள்வி வந்தா உடனே பதில் தெரியும்.",
  tl:"Idhai elimaiyaa ninaivula vechukka oru vaakkiyam thaaren. Dhinamum oru thadava sollunga: 'AN MLA filed AN FIR with AN SP of AN NGO.' Indha oru vaakkiyaththula naalu mukkiyamaana surukkezhuththu irukku."}]},

/* ========== RULE 3 ========== */
{n:3,rc:"ART-03",d:"Medium",t:"Vowel LETTER but Consonant SOUND takes A",
 tam:"University, One, European — உயிரெழுத்தில் தொடங்கினாலும் 'A'",
 s1:{en:"Words beginning with U, E or O that are PRONOUNCED with a /yu/ sound or a /w/ sound take A, not AN — because /y/ and /w/ are consonant sounds.",
  ta:"U, E அல்லது O-வில் தொடங்கும் சொற்கள், /யூ/ ஒலியுடனோ /வ்/ ஒலியுடனோ உச்சரிக்கப்பட்டால் A எடுக்கும், AN அல்ல — ஏனெனில் /ய்/ மற்றும் /வ்/ மெய் ஒலிகள்.",
  tl:"U, E alladhu O-vil thodangum sorkal, /yu/ oliyudano /w/ oliyudano uchcharikkappattaal A edukkum, AN alla — yenenil /y/ matrum /w/ mey oligal.",
  formula:"U pronounced 'YU'   →  A\n  a university, a useful book, a uniform, a union,\n  a unit, a universal truth, a European, a ewe\n\nO pronounced 'WUN'  →  A\n  a one-day match, a one-rupee coin, a one-way street"},

 s2:[
 {h:"Why /yu/ is a consonant sound",
  en:"Say 'university' slowly: yu-ni-ver-si-ty. The first sound is /y/, exactly the same sound as in 'yes' and 'young'. /y/ is a consonant sound. So the word takes A, even though it is spelt with a U.",
  ta:"/யூ/ ஏன் மெய் ஒலி? 'University'-ஐ மெதுவாகச் சொல்லுங்கள்: யூ-னி-வெர்-சி-டி. முதல் ஒலி /ய்/, 'yes' மற்றும் 'young'-ல் இருக்கும் அதே ஒலி. /ய்/ ஒரு மெய் ஒலி. எனவே அந்தச் சொல் U-வில் எழுதப்பட்டாலும் A எடுக்கிறது.",
  tl:"/yu/ yen mey oli? 'University'-ai medhuvaagach sollungal: yu-ni-ver-si-ty. Mudhal oli /y/, 'yes' matrum 'young'-l irukkum adhe oli. /y/ oru mey oli. Enave andhach sol U-vil ezhudhappattaalum A edukkiradhu."},
 {h:"But not every U is /yu/",
  en:"'Umbrella' is 'um-brella' — a pure /u/ vowel sound, so AN. 'Uncle' is 'un-cle' — AN. 'Ugly' is AN. Compare with 'university', 'uniform', 'union', 'useful', 'unique' — all /yu/, so A. Say the word, do not guess.",
  ta:"ஆனால் ஒவ்வொரு U-வும் /யூ/ அல்ல. 'Umbrella' என்பது 'அம்-ப்ரெல்லா' — தூய /அ/ உயிர் ஒலி, எனவே AN. 'Uncle' — AN. 'Ugly' — AN. 'University', 'uniform', 'union', 'useful', 'unique' ஆகியவற்றுடன் ஒப்பிடுங்கள் — அனைத்தும் /யூ/, எனவே A. சொல்லைச் சொல்லுங்கள், யூகிக்காதீர்கள்.",
  tl:"Aanaal ovvoru U-vum /yu/ alla. 'Umbrella' enbadhu 'um-brella' — thooya /u/ uyir oli, enave AN. 'Uncle' — AN. 'Ugly' — AN. Oppidungal: 'university', 'uniform', 'union', 'useful', 'unique' — anaiththum /yu/, enave A."},
 {h:"O pronounced as W",
  en:"'One' is pronounced 'WUN' and 'once' is pronounced 'WUNS'. The /w/ sound is a consonant sound, so both take A: 'a one-day match', 'a one-rupee note', 'a once-in-a-lifetime chance'.",
  ta:"W-ஆக உச்சரிக்கப்படும் O. 'One' என்பது 'வன்' என்று உச்சரிக்கப்படுகிறது, 'once' என்பது 'வன்ஸ்'. /வ்/ ஒலி ஒரு மெய் ஒலி, எனவே இரண்டும் A எடுக்கும்: 'a one-day match', 'a one-rupee note', 'a once-in-a-lifetime chance'.",
  tl:"W-aaga uchcharikkappadum O. 'One' enbadhu 'wun' endru uchcharikkappadugiradhu, 'once' enbadhu 'wuns'. /w/ oli oru mey oli, enave irandum A edukkum."}],

 s3:[
 {h:"The two sound families of U",
  d:"  U pronounced 'YU' (consonant sound) → A\n  ──────────────────────────────────────\n   a university   a uniform    a union\n   a useful book  a unique idea  a unit\n   a universal law  a European   a user\n\n  U pronounced 'UH' (vowel sound) → AN\n  ──────────────────────────────────────\n   an umbrella   an uncle    an ugly dog\n   an unusual case  an understanding  an uprising"},
 {h:"ONE sounds like WUN",
  d:"   ONE  →  spelt with O   👁️  looks like a vowel\n        →  said as 'WUN'  👂  sounds like /w/\n\n   /w/ is a CONSONANT sound.\n\n   a one-day match      ✔\n   a one-rupee coin     ✔\n   an one-day match     ✘"}],

 s4:{
 wrong:["\"University starts with U, and U is a vowel, so AN.\" — This is THE most planted error in SSC article questions.",
  "\"All words starting with U behave the same way.\" — 'A university' but 'an umbrella'. The sound differs.",
  "\"'One' starts with O, a vowel, so AN.\" — 'One' is said 'wun', a consonant sound.",
  "\"'European' starts with E, so AN.\" — 'European' is said 'yu-ro-pean'."],
 right:["Say the word aloud. Does it start with 'YOU' or 'WUH'? Then use A.",
  "Compare: university (yu) → A, but umbrella (uh) → AN.",
  "Memorise the /yu/ family: university, uniform, union, unique, useful, unit, universal, European, user."]},

 "He wore an uniform.|He wore a uniform.|'Uniform' begins with /yu/.",

 "She opened a umbrella.|She opened an umbrella.|'Umbrella' begins with a pure vowel sound.",
 "It was a unusual request.|It was an unusual request.|'Unusual' begins with a pure vowel sound.",
 "He handed me an one-rupee note.|He handed me a one-rupee note.|'One' is said 'wun'."],

 s9:[
 "Fill in the Blank|Delhi has ____ university of national importance in the north campus.|a;an|0|'University' begins with the /yu/ consonant sound.",
 "Find the Error|The board arranged (A) an European tour (B) for the toppers (C) of the school (D).|A;B;C;D|1|Part B. 'European' begins with /yu/ → 'a European tour'.",
 "Sentence Improvement|It was an one-day cricket match played under lights.|an one-day;a one-day;the one-day|1|'One' is said 'wun', a consonant sound.",
 "Fill in the Blank|He gave the committee ____ unanimous recommendation on the matter.|a;an|0|'Unanimous' is said 'yu-nanimous'.",
 "Find the Error|She opened (A) a umbrella (B) as soon as (C) the rain started (D).|A;B;C;D|1|Part B. 'Umbrella' begins with a pure vowel sound → 'an umbrella'."],

 s10:{
  en:"'An university' is the single most planted error in the entire Articles section of SSC. It appears year after year because it looks completely correct to the eye — U is a vowel letter, so AN feels right. The paper also mixes it with 'an umbrella' in the same question set, so you cannot survive by memorising 'U always takes A'. You must actually hear the difference: yu versus uh.",
  ta:"'An university' என்பது SSC-ன் முழு Articles பகுதியிலும் மிக அதிகமாக நடப்படும் தவறு. வருடம் வருடம் இது வருகிறது, ஏனெனில் இது கண்ணுக்கு முற்றிலும் சரியாகத் தெரிகிறது — U ஒரு உயிரெழுத்து, எனவே AN சரியெனத் தோன்றுகிறது. தேர்வுத்தாள் இதை 'an umbrella'-உடன் ஒரே கேள்வித் தொகுப்பில் கலக்கும், எனவே 'U எப்போதும் A எடுக்கும்' என்று மனப்பாடம் செய்து தப்பிக்க முடியாது. நீங்கள் உண்மையிலேயே வித்தியாசத்தைக் கேட்க வேண்டும்: யூ மற்றும் அ.",
  tl:"'An university' enbadhu SSC-in muzhu Articles paguthiyilum miga adhigamaaga nadappadum thavaru. Varudam varudam idhu varugiradhu, yenenil idhu kannukku mutrilum sariyaagath therigiradhu. Neengal unmaiyileye viththiyaasaththaik ketka vendum: yu matrum uh."},

 s11:{
  en:"Does it start with 'YOU' or 'WUH'? Then A. Sound matters, not spelling.",
  ta:"அது 'யூ'-வில் தொடங்குகிறதா, 'வ'-வில் தொடங்குகிறதா? அப்படியானால் A. ஒலி முக்கியம், எழுத்துக்கூட்டல் அல்ல.",
  tl:"Adhu 'yu'-vil thodangugiradhaa, 'wu'-vil thodangugiradhaa? Appadiyaanaal A. Oli mukkiyam, ezhuththukkoottal alla.",
  vis:"        THE 'YU' FAMILY — ALL TAKE A\n\n   a UNIversity   a UNIform    a UNIon\n   a UNIque       a USEful     a UNIt\n   a UNIversal    a EURopean   a USEr\n            ↑\n     see 'UNI' or 'EUR' or 'USE' → say 'YOU' → A\n\n        THE 'UH' FAMILY — ALL TAKE AN\n\n   an UMbrella   an UNcle   an UGly dog\n   an UNusual case   an UPrising\n\n   ONE / ONCE  →  said 'WUN' / 'WUNS'  →  A"},

 s13:[
 "He is ____ honest man studying at ____ university in ____ European city.|an-a-a;a-an-a;an-an-a|0|Silent H → AN. 'University' /yu/ → A. 'European' /yu/ → A.",
 "She opened ____ umbrella and waited ____ hour for ____ one-day pass.|an-an-a;a-an-an;an-a-a|0|'Umbrella' pure vowel → AN. 'Hour' silent H → AN. 'One' = 'wun' → A.",
 "It was ____ unusual request from ____ MLA who wanted ____ uniform for his son.|an-an-a;a-an-a;an-a-a|0|'Unusual' → AN. 'MLA' = 'em' → AN. 'Uniform' /yu/ → A.",
 "He made ____ unanimous appeal to ____ union at ____ ordinary meeting.|an-a-an;a-a-an;a-an-a|1|'Unanimous' /yu/ → A. 'Union' /yu/ → A. 'Ordinary' pure vowel → AN.",
 "____ European scholar gave ____ useful lecture at ____ NGO conference.|An-an-a;A-a-an;A-an-an|1|'European' → A. 'Useful' → A. 'NGO' = 'en' → AN."],

 s14:{
  rule:"U or O with a /yu/ or /w/ sound takes A, not AN.",
  formula:"'YU' sound → A  (university, uniform, useful, European)\n'WUN' sound → A  (one-day, one-rupee)\n'UH' sound → AN  (umbrella, uncle, ugly, unusual)",
  memory:"Does it start with 'YOU' or 'WUH'? Then A.",
  ta:"'யூ'-ன்னு ஆரம்பிக்குதா, 'வ'-ன்னு ஆரம்பிக்குதா? அப்படின்னா A.",
  tl:"'YU'-nnu aarambikkudhaa, 'wu'-nnu aarambikkudhaa? Appadinnaa A.",
  mistake:"Writing 'an university' and 'an one-day match' because U and O are vowel letters.",
  exam:"The single most repeated article error in SSC CGL and CHSL Tier-1."},

 s15:[
 {ta:"இப்போ நாம SSC-ஓட மிக முக்கியமான Article கேள்விக்கு வந்துட்டோம். இதை நான் 'ஒரு mark rule' அப்படின்னு சொல்லுவேன், ஏன்னா ஒவ்வொரு வருஷமும் இது வரும், தெரிஞ்சவங்க எடுத்துப்பாங்க, தெரியாதவங்க இழப்பாங்க.",
  tl:"Ippo naama SSC-oda miga mukkiyamaana Article kelvikku vandhuttom. Idhai naan 'oru mark rule' appadinnu solluven, yennaa ovvoru varushamum idhu varum, therinjavanga eduththuppaanga, theriyaadhavanga izhappaanga."},
 {ta:"கேள்வி இதுதான்: 'He studies in ____ university.' A-வா AN-ஆ? நான் இதை நூறு class-ல கேட்டிருக்கேன். 90% பேரு AN-ன்னு சொல்லுவாங்க. ஏன்? ஏன்னா 'university' U-ல ஆரம்பிக்குது, U ஒரு உயிரெழுத்து. School-ல அப்படித்தான் சொல்லிக் கொடுத்தாங்க.",
  tl:"Kelvi idhudhaan: 'He studies in ____ university.' A-vaa AN-aa? Naan idhai nooru class-la kettirukken. 90% peru AN-nnu solluvaanga. Yennaa 'university' U-la aarambikkudhu, U oru uyirezhuththu."},
 {ta:"ஆனா சரியான பதில் A. இப்போ ஏன்னு பாருங்க. 'University'-ஐ மெதுவா சொல்லுங்க — யூ-னி-வெர்-சி-டி. முதல் ஒலி என்ன? 'ய்'. இப்போ 'yes' அப்படின்னு சொல்லுங்க — 'ய்-எஸ்'. அதே ஒலி இல்லையா? 'ய்' ஒரு மெய் ஒலி. அதனால A.",
  tl:"Aanaa sariyaana padhil A. Ippo yennu paarunga. 'University'-ai medhuvaa sollunga — yu-ni-ver-si-ty. Mudhal oli enna? 'y'. Ippo 'yes' appadinnu sollunga — 'y-es'. Adhe oli illaiyaa? 'y' oru mey oli. Adhanaala A."},
 {ta:"இப்போ ஒரு முக்கியமான எச்சரிக்கை. எல்லா U-வும் இப்படி இல்ல. 'Umbrella' சொல்லிப் பாருங்க — 'அம்-ப்ரெல்லா'. இங்க 'ய்' ஒலி இல்ல, தூய 'அ' ஒலி. உயிர் ஒலி. அதனால AN. அதே மாதிரி 'uncle' — 'அங்-கிள்'. AN. 'Ugly' — 'அக்-லி'. AN.",
  tl:"Ippo oru mukkiyamaana echcharikkai. Ellaa U-vum ippadi illa. 'Umbrella' sollip paarunga — 'um-brella'. Inga 'y' oli illa, thooya 'u' oli. Uyir oli. Adhanaala AN. Adhe maadhiri 'uncle' — AN. 'Ugly' — AN."},
 {ta:"அப்போ எப்படி நினைவு வெச்சுக்கிறது? ஒரு எளிய pattern இருக்கு. UNI-ன்னு ஆரம்பிச்சா 'யூ' ஒலி — university, uniform, union, unique, unit, universal, unanimous. USE-ன்னு ஆரம்பிச்சா 'யூ' — useful, user, useless. EUR-ன்னு ஆரம்பிச்சா 'யூ' — European, Europe. இந்த மூணு pattern-ஐ பார்த்தா உடனே A போடுங்க.",
  tl:"Appo eppadi ninaivu vechukkiradhu? Oru eliya pattern irukku. UNI-nnu aarambichaa 'yu' oli — university, uniform, union, unique, unit, universal. USE-nnu aarambichaa 'yu' — useful, user, useless. EUR-nnu aarambichaa 'yu' — European."},
 {ta:"கடைசியா 'ONE'. இது இன்னும் தந்திரமானது. O-ல ஆரம்பிக்குது, ஆனா நாம எப்படி சொல்லுறோம்? 'வன்'. 'ஓன்' இல்ல, 'வன்'. 'வ்' ஒரு மெய் ஒலி. அதனால 'a one-day match', 'a one-rupee coin'. 'An one-day' அப்படின்னு எழுதினா அது தப்பு. இது SSC-ல அடிக்கடி வரும் pattern.",
  tl:"Kadaisiyaa 'ONE'. Idhu innum thandhiramaanadhu. O-la aarambikkudhu, aanaa naama eppadi sollurom? 'Wun'. 'On' illa, 'wun'. 'w' oru mey oli. Adhanaala 'a one-day match', 'a one-rupee coin'."}]},

/* ========== RULE 4 ========== */
{n:4,rc:"ART-04",d:"Medium",t:"Silent H takes AN",
 tam:"H ஒலிக்காத சொற்களுக்கு 'AN' · H olikkaadha sorkalukku 'AN'",
 s1:{en:"Words with a SILENT initial H — hour, honest, honour, heir, honorary — take AN, because the word effectively begins with a vowel sound. But when the H IS pronounced (hotel, historic, hospital, house), use A.",
  ta:"தொடக்கத்தில் H ஒலிக்காத சொற்கள் — hour, honest, honour, heir, honorary — AN எடுக்கும், ஏனெனில் அந்தச் சொல் உண்மையில் உயிர் ஒலியில் தொடங்குகிறது. ஆனால் H உச்சரிக்கப்படும்போது (hotel, historic, hospital, house), A பயன்படுத்தவும்.",
  tl:"Thodakkaththil H olikkaadha sorkal — hour, honest, honour, heir, honorary — AN edukkum, yenenil andhach sol unmaiyil uyir oliyil thodangugiradhu. Aanaal H uchcharikkappadumbodhu (hotel, historic, hospital, house), A payanpaduththavum.",
  formula:"SILENT H  →  AN\n  an hour, an honest man, an honour,\n  an heir, an honorary degree, an heiress\n\nSPOKEN H  →  A\n  a hotel, a historic day, a hospital,\n  a house, a horse, a hundred, a habit"},

 s2:[
 {h:"Only five words in the silent-H family",
  en:"The good news is that this family is tiny. HOUR, HONEST, HONOUR, HEIR, HONORARY — plus their relatives (hourly, honestly, honourable, heiress, honorarium). Learn these five and you have learnt the entire rule.",
  ta:"நல்ல செய்தி என்னவென்றால் இந்தக் குடும்பம் மிகச் சிறியது. HOUR, HONEST, HONOUR, HEIR, HONORARY — மேலும் அவற்றின் உறவினர்கள் (hourly, honestly, honourable, heiress, honorarium). இந்த ஐந்தைக் கற்றுக்கொண்டால் முழு விதியையும் கற்றுக்கொண்டீர்கள்.",
  tl:"Nalla seydhi ennavendraal indhak kudumbam migach siriyadhu. HOUR, HONEST, HONOUR, HEIR, HONORARY — melum avatrin uravinargal (hourly, honestly, honourable, heiress). Indha aindhaik katrukkondaal muzhu vidhiyaiyum katrukkondeergal."},
 {h:"Everything else with H is pronounced",
  en:"Hotel, historic, history, hospital, house, horse, hundred, habit, holiday, husband, hero, human — every one of these has a spoken H, so every one takes A. Do not overapply the silent-H rule.",
  ta:"H-உடன் உள்ள மற்ற அனைத்தும் உச்சரிக்கப்படுகின்றன. Hotel, historic, history, hospital, house, horse, hundred, habit, holiday, husband, hero, human — இவை ஒவ்வொன்றிலும் H ஒலிக்கிறது, எனவே ஒவ்வொன்றும் A எடுக்கும். silent-H விதியை அளவுக்கு அதிகமாகப் பயன்படுத்தாதீர்கள்.",
  tl:"H-udan ulla matra anaiththum uchcharikkappadugindrana. Hotel, historic, history, hospital, house, horse, hundred, habit, holiday, husband, hero, human — ivai ovvondrilum H olikkiradhu, enave ovvondrum A edukkum."},
 {h:"'An historic' — the famous exception that is now wrong",
  en:"Older British writers wrote 'an historic occasion'. Modern standard English and every Indian exam key now require 'A historic occasion', because the H is pronounced. If you see 'an historic' as an option, it is the wrong answer.",
  ta:"'An historic' — இப்போது தவறான புகழ்பெற்ற விதிவிலக்கு. பழைய பிரிட்டிஷ் எழுத்தாளர்கள் 'an historic occasion' என்று எழுதினார்கள். நவீன தரநிலை ஆங்கிலமும் ஒவ்வொரு இந்தியத் தேர்வு விடைத்தாளும் இப்போது 'A historic occasion' என்றே கேட்கின்றன, ஏனெனில் H உச்சரிக்கப்படுகிறது. 'an historic' ஒரு option-ஆகத் தெரிந்தால், அதுதான் தவறான விடை.",
  tl:"'An historic' — ippodhu thavaraana pugazhpetra vidhivilakku. Pazhaiya British ezhuththaalargal 'an historic occasion' endru ezhudhinaargal. Naveena tharanilai Aangilamum ovvoru Indhiyath thervu vidaiththaalum ippodhu 'A historic occasion' endre ketkindrana."}],

 s3:[
 {h:"The H disappears",
  d:"   HOUR    →  say it  →  \"OUR\"     →  H is gone  →  AN ✔\n   HONEST  →  say it  →  \"ONEST\"   →  H is gone  →  AN ✔\n   HEIR    →  say it  →  \"AIR\"     →  H is gone  →  AN ✔\n\n   HOTEL   →  say it  →  \"HO-tel\"  →  H is there →  A  ✔\n   HISTORIC→  say it  →  \"HIS-toric\"→ H is there →  A  ✔"},
 {h:"The complete silent-H family",
  d:"   ONLY FIVE ROOTS — memorise them\n\n   1. HOUR      →  an hour, an hourly wage\n   2. HONEST    →  an honest man, an honest reply\n   3. HONOUR    →  an honour, an honourable judge\n   4. HEIR      →  an heir, an heiress\n   5. HONORARY  →  an honorary degree, an honorarium\n\n   EVERY OTHER H-WORD TAKES 'A'."}],

 s4:{
 wrong:["\"H is a consonant letter, so all H-words take A.\" — Five words have a silent H.",
  "\"'Hotel' is like 'honest', so 'an hotel'.\" — The H in hotel is clearly pronounced.",
  "\"'An historic' is more elegant.\" — It is archaic and marked wrong in Indian exams.",
  "\"Hospital and honest both start with 'ho', so both take AN.\" — Spelling similarity means nothing. Sound decides."],
 right:["Say the word aloud. Can you hear the H? If yes → A. If no → AN.",
  "Memorise the five silent-H roots: hour, honest, honour, heir, honorary.",
  "Treat every other H-word as taking A."]},

 s5:[
 {en:"An honest officer never takes a bribe.",ta:"ஒரு நேர்மையான அதிகாரி ஒருபோதும் லஞ்சம் வாங்க மாட்டார்.",tl:"Oru nermaiyaana adhigaari orupodhum lanjam vaanga maattaar.",note:"The H in 'honest' is silent → AN."},
 {en:"He waited for an hour outside the office.",ta:"அவர் அலுவலகத்திற்கு வெளியே ஒரு மணி நேரம் காத்திருந்தார்.",tl:"Avar aluvalagaththirku veliye oru mani neram kaaththirundhaar.",note:"The H in 'hour' is silent → AN."},
 {en:"He is an heir to a large property.",ta:"அவர் ஒரு பெரிய சொத்துக்கு வாரிசு.",tl:"Avar oru periya soththukku vaarisu.",note:"The H in 'heir' is silent → AN."},
 {en:"She stayed in a hotel near the station.",ta:"அவர் நிலையத்திற்கு அருகில் ஒரு விடுதியில் தங்கினார்.",tl:"Avar nilaiyaththirku arugil oru vidudhiyil thanginaar.",note:"The H in 'hotel' IS pronounced → A."},
 {en:"It was a historic day for our country.",ta:"அது நம் நாட்டிற்கு ஒரு வரலாற்று சிறப்புமிக்க நாள்.",tl:"Adhu nam naattirku oru varalaatru sirappumikka naal.",note:"The H in 'historic' IS pronounced → A."}],

 s9:[

 s10:{
  en:"The exam puts 'an hour' and 'a hotel' in the same question so that a memorised rule fails. Students who learnt 'H words take AN' write 'an hotel' and lose the mark. Students who learnt 'H words take A' write 'a hour' and lose it too. Only the sound test survives. And 'an historic' is offered as an elegant-looking trap — it is archaic and marked wrong.",
  ta:"தேர்வு 'an hour' மற்றும் 'a hotel' இரண்டையும் ஒரே கேள்வியில் வைக்கும், அதனால் மனப்பாடம் செய்த விதி தோற்றுவிடும். 'H சொற்கள் AN எடுக்கும்' என்று கற்றவர்கள் 'an hotel' எழுதி mark இழப்பார்கள். 'H சொற்கள் A எடுக்கும்' என்று கற்றவர்கள் 'a hour' எழுதி இழப்பார்கள். ஒலிச் சோதனை மட்டுமே தப்பிக்கும். மேலும் 'an historic' ஒரு நேர்த்தியாகத் தோன்றும் பொறியாகத் தரப்படும் — அது பழமையானது, தவறாகக் குறிக்கப்படும்.",
  tl:"Thervu 'an hour' matrum 'a hotel' irandaiyum ore kelviyil vaikkum, adhanaal manappaadam seydha vidhi thotruvidum. Oli sodhanai mattume thappikkum. Melum 'an historic' oru nerththiyaagath thondrum poriyaagath tharappadum."},

 s11:{
  en:"CAN YOU HEAR THE H? Yes → A. No → AN. Only five words have a silent H.",
  ta:"H ஒலி கேட்கிறதா? கேட்டால் → A. கேட்கவில்லை என்றால் → AN. ஐந்து சொற்களுக்கு மட்டுமே H ஒலிக்காது.",
  tl:"H oli ketkiradhaa? Kettaal → A. Ketkavillai endraal → AN. Aindhu sorkalukku mattume H olikkaadhu.",
  vis:"      THE FAMOUS FIVE — SILENT H\n\n   ┌────────────────────────────────┐\n   │  HOUR      →  an hour          │\n   │  HONEST    →  an honest man    │\n   │  HONOUR    →  an honour        │\n   │  HEIR      →  an heir          │\n   │  HONORARY  →  an honorary post │\n   └────────────────────────────────┘\n\n   MEMORY SENTENCE:\n   \"AN HONEST HEIR waited AN HOUR\n    for AN HONORARY HONOUR.\"\n\n   Every other H-word → A\n   (a hotel, a historic day, a hospital, a hundred)"},

 s14:{
  rule:"Words with a silent initial H take AN. Words with a spoken H take A.",
  formula:"SILENT H → AN  (hour, honest, honour, heir, honorary)\nSPOKEN H → A   (hotel, historic, hospital, hundred, habit)",
  memory:"An honest heir waited an hour for an honorary honour.",
  ta:"H ஒலி கேட்குதா? கேட்டா A, கேட்கலைன்னா AN. ஐந்து சொல் மட்டும்தான் silent.",
  tl:"H oli ketkudhaa? Kettaa A, ketkalainnaa AN. Aindhu sol mattum-dhaan silent.",
  mistake:"Writing 'an hotel', 'an historic' or 'a hour' by applying a memorised letter rule.",
  exam:"SSC CGL / CHSL, RRB, Bank — appears alongside Rule 3 in the same question sets."},

 s15:[
 {ta:"இந்த rule Rule 3-ஓட மறுபக்கம். Rule 3-ல உயிரெழுத்து ஆனா மெய் ஒலி பார்த்தோம். இப்போ மெய் எழுத்து ஆனா உயிர் ஒலி பார்க்குறோம். ரெண்டுமே ஒரே கொள்கை — ஒலிதான் ராஜா.",
  tl:"Indha rule Rule 3-oda marupakkam. Rule 3-la uyirezhuththu aanaa mey oli paarththom. Ippo mey ezhuththu aanaa uyir oli paarkkurom. Rendume ore kolgai — oli-dhaan raaja."},
 {ta:"நல்ல செய்தி என்னன்னா — இந்த குடும்பம் ரொம்ப சின்னது. வெறும் அஞ்சு வேர் சொல்: HOUR, HONEST, HONOUR, HEIR, HONORARY. இந்த அஞ்சு மட்டும்தான் H ஒலிக்காம இருக்கும். மத்த எல்லா H சொல்லும் H ஒலிக்கும்.",
  tl:"Nalla seydhi ennannaa — indha kudumbam romba chinnadhu. Verum anju ver sol: HOUR, HONEST, HONOUR, HEIR, HONORARY. Indha anju mattum-dhaan H olikkaama irukkum."},
 {ta:"சோதிச்சுப் பாருங்க. 'Hour' — நீங்க எப்படி சொல்றீங்க? 'ஹவர்' இல்ல, 'அவர்'. H காணாம போச்சு. அதனால 'an hour'. 'Honest' — 'ஹானெஸ்ட்' இல்ல, 'ஆனெஸ்ட்'. H இல்ல. 'an honest man'. 'Heir' — 'ஹேர்' இல்ல, 'ஏர்' (air மாதிரி). 'an heir'.",
  tl:"Sodhichup paarunga. 'Hour' — neenga eppadi solreenga? 'Hawar' illa, 'awar'. H kaanaama pochu. Adhanaala 'an hour'. 'Honest' — 'haanest' illa, 'aanest'. 'an honest man'. 'Heir' — 'her' illa, 'air'. 'an heir'."},
 {ta:"இப்போ மறுபக்கம். 'Hotel' — 'ஹோ-டெல்'. H தெளிவா கேட்குது. அதனால 'a hotel'. 'Hospital' — 'ஹாஸ்பிடல்'. H இருக்கு. 'a hospital'. 'Hundred' — 'ஹண்ட்ரெட்'. H இருக்கு. 'a hundred rupees'. 'Historic' — 'ஹிஸ்டாரிக்'. H இருக்கு. 'a historic day'.",
  tl:"Ippo marupakkam. 'Hotel' — 'ho-tel'. H thelivaa ketkudhu. Adhanaala 'a hotel'. 'Hospital' — 'haaspital'. 'a hospital'. 'Hundred' — 'handred'. 'a hundred rupees'. 'Historic' — 'historic'. 'a historic day'."},
 {ta:"இங்க SSC-ஓட ஒரு கெட்ட புத்தி சொல்லுறேன். அவங்க ஒரே கேள்விய 'an hour' மற்றும் 'a hotel' ரெண்டையும் சேர்த்து வெப்பாங்க. ஏன்? ஏன்னா நீங்க ஒரு rule-ஐ மனப்பாடம் பண்ணி இருந்தா, ஒண்ணு சரியா வரும், இன்னொண்ணு தப்பா வரும். ஒலி சோதனை மட்டும்தான் ரெண்டையும் சரியா தரும்.",
  tl:"Inga SSC-oda oru ketta puththi solluren. Avanga ore kelviya 'an hour' matrum 'a hotel' rendaiyum serthu veppaanga. Yennaa neenga oru rule-ai manappaadam panni irundhaa, onnu sariyaa varum, innonnu thappaa varum."},
 {ta:"கடைசியா 'an historic' பத்தி சொல்லணும். பழைய பிரிட்டிஷ் புத்தகங்கள்ல 'an historic occasion' அப்படின்னு எழுதி இருப்பாங்க. அது பழைய பாணி. இப்போ நவீன ஆங்கிலத்துலயும், எல்லா இந்திய தேர்வுலயும் 'a historic occasion'-தான் சரி. Option-ல 'an historic' தெரிஞ்சா, அது தப்பான பதில். இதை நல்லா மனசுல வெச்சுக்கோங்க.",
  tl:"Kadaisiyaa 'an historic' paththi sollanum. Pazhaiya British puththagangalla 'an historic occasion' appadinnu ezhudhi iruppaanga. Adhu pazhaiya paani. Ippo naveena Aangilaththulayum, ellaa Indhiya thervulayum 'a historic occasion'-dhaan sari."}]},

/* ========== RULE 5 ========== */
{n:5,rc:"ART-05",d:"Easy",t:"THE before Superlatives and Ordinals",
 tam:"Superlative மற்றும் வரிசை எண்களுக்கு முன் 'THE'",
 s1:{en:"Use THE before superlative degrees (best, tallest, most beautiful) and before ordinal numbers (first, second, third, last). Both point to ONE unique item, and THE is the article of uniqueness.",
  ta:"Superlative நிலைகளுக்கு முன் (best, tallest, most beautiful) மற்றும் வரிசை எண்களுக்கு முன் (first, second, third, last) THE பயன்படுத்த வேண்டும். இரண்டுமே ஒரே ஒரு தனித்துவமான பொருளைச் சுட்டுகின்றன, THE என்பது தனித்துவத்தின் article.",
  tl:"Superlative nilaigalukku mun (best, tallest, most beautiful) matrum varisai engalukku mun (first, second, third, last) THE payanpaduththa vendum. Irandume ore oru thaniththuvamaana porulaich suttugindrana.",
  formula:"THE  +  SUPERLATIVE\n  the best student, the tallest boy,\n  the most beautiful painting, the worst result\n\nTHE  +  ORDINAL\n  the first day, the second row,\n  the third attempt, the last chapter"},

 s2:[
 {h:"Why uniqueness demands THE",
  en:"'A tall boy' could be any of many tall boys. But 'THE tallest boy' can only be ONE person in the whole group. When there is only one possible referent, English marks it with THE.",
  ta:"தனித்துவம் ஏன் THE-ஐக் கோருகிறது? 'A tall boy' என்றால் பல உயரமான பையன்களில் யாராகவும் இருக்கலாம். ஆனால் 'THE tallest boy' என்றால் முழுக் குழுவிலும் ஒரே ஒரு நபராகத்தான் இருக்க முடியும். ஒரே ஒரு சாத்தியம் மட்டுமே இருக்கும்போது, ஆங்கிலம் அதை THE-ஆல் குறிக்கிறது.",
  tl:"Thaniththuvam yen THE-aik korugiradhu? 'A tall boy' endraal pala uyaramaana paiyangalil yaaraagavum irukkalaam. Aanaal 'THE tallest boy' endraal muzhuk kuzhuvilum ore oru nabaraagath-thaan irukka mudiyum."},
 {h:"The comparative of two also takes THE",
  en:"When you compare exactly TWO things, you use the comparative WITH the: 'He is THE taller of the two brothers.' This surprises many students, because comparatives usually take no article.",
  ta:"இரண்டைக் கொண்ட comparative-ம் THE எடுக்கும். சரியாக இரண்டு பொருட்களை ஒப்பிடும்போது, comparative-ஐ THE-உடன் பயன்படுத்துகிறீர்கள்: 'He is THE taller of the two brothers.' இது பல மாணவர்களை ஆச்சரியப்படுத்தும், ஏனெனில் comparative-கள் பொதுவாக article எடுப்பதில்லை.",
  tl:"Irandaik konda comparative-um THE edukkum. Sariyaaga irandu porutkalai oppidumbodhu, comparative-ai THE-udan payanpaduththugireergal: 'He is THE taller of the two brothers.'"},
 {h:"The one case where a superlative drops THE",
  en:"When 'most' means simply 'very' and no comparison is being made, THE is dropped: 'He is most intelligent' means 'He is very intelligent'. Compare with 'He is THE most intelligent boy in the class', which is a real comparison.",
  ta:"Superlative THE-ஐ விடும் ஒரே சூழல். 'Most' என்பது வெறுமனே 'மிகவும்' என்று பொருள்பட்டு எந்த ஒப்பீடும் இல்லாதபோது, THE விடப்படுகிறது: 'He is most intelligent' என்றால் 'அவர் மிகவும் புத்திசாலி'. 'He is THE most intelligent boy in the class' என்பதுடன் ஒப்பிடுங்கள் — அது ஒரு உண்மையான ஒப்பீடு.",
  tl:"Superlative THE-ai vidum ore soozhal. 'Most' enbadhu verumane 'migavum' endru porulpattu endha oppeedum illaadhabodhu, THE vidappadugiradhu: 'He is most intelligent' endraal 'avar migavum puththisaali'."}],

 s3:[
 {h:"Only one can be the best",
  d:"   👦 👦 👦 👦 👦   ← many tall boys\n                 ↑\n         only ONE is the TALLEST\n\n   a tall boy      →  any one of many   →  A\n   THE tallest boy →  exactly one       →  THE"},
 {h:"Two versus three",
  d:"  TWO things   →  THE + comparative\n    He is THE taller of the two brothers.  ✔\n\n  THREE or more →  THE + superlative\n    He is THE tallest of the five boys.    ✔\n\n  Note: 'of the two' ALWAYS carries THE."}],

 s4:{
 wrong:["\"Superlatives are adjectives, so they need no article.\" — Superlatives always take THE.",
  "\"'He is best student' sounds fine in speech.\" — In writing and in exams it needs THE.",
  "\"'The taller of the two' — comparatives never take THE.\" — With 'of the two' they always do.",
  "\"'He is most intelligent' is always wrong.\" — It is correct when 'most' simply means 'very'."],
 right:["See -est or 'most' → write THE.",
  "See first, second, third, last, next → write THE.",
  "See 'of the two' → write THE + comparative.",
  "Only drop THE when 'most' means 'very' with no comparison."]},

 s5:[
 {en:"He is the best student in the class.",ta:"அவன் வகுப்பிலேயே சிறந்த மாணவன்.",tl:"Avan vagupileye sirandha maanavan.",note:"Superlative 'best' → THE."},
 {en:"She was the first woman to win this award.",ta:"இந்த விருதை வென்ற முதல் பெண் அவர்தான்.",tl:"Indha virudhai vendra mudhal pen avardhaan.",note:"Ordinal 'first' → THE."},
 {en:"This is the tallest building in the city.",ta:"இதுதான் நகரத்திலேயே உயரமான கட்டிடம்.",tl:"Idhudhaan nagaraththileye uyaramaana kattidam.",note:"Superlative 'tallest' → THE."},
 {en:"He is the taller of the two brothers.",ta:"இரண்டு சகோதரர்களில் அவன்தான் உயரமானவன்.",tl:"Irandu sagodharargalil avandhaan uyaramaanavan.",note:"'Of the two' takes THE + comparative."},

 s9:[

 s10:{
  en:"Two traps sit inside this simple rule. First, 'of the two' takes THE with a COMPARATIVE, not a superlative — 'the taller of the two', never 'the tallest of the two'. Second, the adverbial uses drop the article entirely: 'He came first', 'He finished second'. Here 'first' and 'second' describe HOW he ran, not WHICH one he is, so no article.",
  ta:"இந்த எளிய விதிக்குள் இரண்டு பொறிகள் இருக்கின்றன. முதலாவது, 'of the two' என்பது superlative அல்ல, COMPARATIVE-உடன் THE எடுக்கும் — 'the taller of the two', ஒருபோதும் 'the tallest of the two' அல்ல. இரண்டாவது, வினையுரிச்சொல் பயன்பாடுகள் article-ஐ முற்றிலும் விட்டுவிடுகின்றன: 'He came first', 'He finished second'. இங்கே 'first' மற்றும் 'second' அவர் எப்படி ஓடினார் என்பதை விவரிக்கின்றன, அவர் எந்த ஒருவர் என்பதை அல்ல, எனவே article இல்லை.",
  tl:"Indha eliya vidhikkul irandu porigal irukkindrana. Mudhalaavadhu, 'of the two' enbadhu superlative alla, COMPARATIVE-udan THE edukkum. Irandaavadhu, vinaiyurichol payanpaadugal article-ai mutrilum vittuvidugindrana: 'He came first', 'He finished second'."},

 s11:{
  en:"SEE -EST OR AN ORDINAL → WRITE THE. Only one can be the best.",
  ta:"-EST அல்லது வரிசை எண் பார்த்தால் → THE எழுதுங்கள். ஒருவரால் மட்டுமே சிறந்தவராக இருக்க முடியும்.",
  tl:"-EST alladhu varisai en paarththaal → THE ezhudhungal. Oruvaraal mattume sirandhavaraaga irukka mudiyum.",
  vis:"     TRIGGERS THAT DEMAND 'THE'\n\n   -est      →  the tallest, the best, the worst\n   most      →  the most beautiful (with comparison)\n   least     →  the least expensive\n   first     →  the first day\n   second    →  the second row\n   last      →  the last chapter\n   next      →  the next station\n   same      →  the same book\n   only      →  the only son\n   of the two→  the taller of the two\n\n   ⚠ NO ARTICLE when used as an ADVERB:\n     He came first.   He finished second."},

 s14:{
  rule:"Use THE before superlatives and ordinals, and with a comparative after 'of the two'.",
  formula:"THE + -est / most / least\nTHE + first / second / last / next / same / only\nTHE + comparative + of the two",
  memory:"Only one can be the best. Uniqueness needs THE.",
  ta:"ஒருத்தர் மட்டும்தான் சிறந்தவரா இருக்க முடியும். தனித்துவத்துக்கு THE வேணும்.",
  tl:"Oruththar mattum-dhaan sirandhavaraa irukka mudiyum. Thaniththuvaththukku THE venum.",
  mistake:"Dropping THE before superlatives, and using 'the tallest of the two' instead of 'the taller of the two'.",
  exam:"SSC CGL / CHSL and Bank — often combined with the degrees-of-comparison rules."},

 s15:[
 {ta:"இந்த rule ரொம்ப எளிது, ஆனா நாம பேச்சுல அடிக்கடி THE-ஐ விட்டுடுவோம். 'He is best student in the class' அப்படின்னு சொல்லுவோம். ஆனா எழுத்துல, தேர்வுல, 'the' கண்டிப்பா வேணும்.",
  tl:"Indha rule romba eladhu, aanaa naama pechula adikkadi THE-ai vittuduvom. 'He is best student in the class' appadinnu solluvom. Aanaa ezhuththula, thervula, 'the' kandippaa venum."},
 {ta:"ஏன் THE? ஒரு படம் மனசுல வெச்சுக்கோங்க. Class-ல 50 பையன் இருக்காங்க. 'A tall boy' அப்படின்னா — யாரு? தெரியாது, யாரோ ஒரு உயரமான பையன். பலர் இருக்கலாம். ஆனா 'THE tallest boy' அப்படின்னா — ஒரே ஒருத்தர்தான். எல்லாரையும் அளந்து பார்த்தா, ஒருத்தர்தான் மிக உயரமானவர். ஒரே ஒருத்தர்னா THE.",
  tl:"Yen THE? Oru padam manasula vechukkonga. Class-la 50 paiyan irukkaanga. 'A tall boy' appadinnaa — yaaru? Theriyaadhu. Aanaa 'THE tallest boy' appadinnaa — ore oruththar-dhaan. Ore oruththarnaa THE."},
 {ta:"வரிசை எண்ணும் அப்படித்தான். 'The first day' — முதல் நாள் ஒண்ணுதான். 'The second row' — ரெண்டாவது வரிசை ஒண்ணுதான். 'The last chapter' — கடைசி அத்தியாயம் ஒண்ணுதான். எல்லாமே தனித்துவம். எல்லாத்துக்கும் THE.",
  tl:"Varisai ennum appadidhaan. 'The first day' — mudhal naal onnu-dhaan. 'The second row' — randaavadhu varisai onnu-dhaan. Ellaame thaniththuvam. Ellaaththukkum THE."},
 {ta:"இப்போ ஒரு முக்கியமான பொறி. 'He is the taller of the two brothers.' கவனிங்க — 'tallest' இல்ல, 'taller'. ஏன்? ஏன்னா ரெண்டு பேரு மட்டும்தான். ரெண்டு பேருன்னா comparative (taller), மூணு பேருக்கு மேல superlative (tallest). ஆனா ரெண்டு சூழல்லயும் THE வரும். 'of the two' அப்படிங்கிற வார்த்தை பார்த்தா, உடனே 'the + comparative' போடுங்க.",
  tl:"Ippo oru mukkiyamaana pori. 'He is the taller of the two brothers.' Kavaninga — 'tallest' illa, 'taller'. Yennaa rendu peru mattum-dhaan. Rendu perunnaa comparative, moonu perukku mela superlative. Aanaa rendu soozhallayum THE varum."},
 {ta:"இன்னொரு நுட்பமான விஷயம். 'He came first in the race' — இங்க 'the' இல்ல. ஏன்? ஏன்னா இங்க 'first' ஒரு adverb, adjective இல்ல. அவர் எப்படி ஓடினார்? முதலாவதா. இது செயலை விவரிக்குது, நபரை இல்ல. அதனால article இல்ல. ஆனா 'He won the first prize' — இங்க 'first' ஒரு adjective, 'prize'-ஐ விவரிக்குது. அதனால THE.",
  tl:"Innoru nutpamaana vishayam. 'He came first in the race' — inga 'the' illa. Yennaa inga 'first' oru adverb. Avar eppadi odinaar? Mudhalaavadhaa. Aanaa 'He won the first prize' — inga 'first' oru adjective. Adhanaala THE."},
 {ta:"கடைசியா ஒரு விதிவிலக்கு. 'He is most intelligent' — இங்க THE இல்ல, ஆனா தப்பும் இல்ல. ஏன்? ஏன்னா இங்க 'most' அப்படின்னா 'மிகவும்' அப்படிங்கிற அர்த்தம், ஒப்பீடு இல்ல. 'அவர் மிகவும் புத்திசாலி.' ஆனா 'He is the most intelligent boy in the class' — இங்க ஒப்பீடு இருக்கு, class-ல எல்லாரையும் விட. அதனால THE. ஒப்பீடு இருந்தா THE, இல்லாட்டி இல்ல.",
  tl:"Kadaisiyaa oru vidhivilakku. 'He is most intelligent' — inga THE illa, aanaa thappum illa. Yennaa inga 'most' appadinnaa 'migavum' appadingira arththam, oppeedu illa. Aanaa 'He is the most intelligent boy in the class' — inga oppeedu irukku. Oppeedu irundhaa THE, illaatti illa."}]},
/* ========== RULE 6 ========== */
{n:6,rc:"ART-06",d:"Medium",t:"THE before Unique and Named Things",
 tam:"நதி, கடல், மலைத்தொடர், புனித நூல், செய்தித்தாள் — அனைத்துக்கும் 'THE'",
 s1:{en:"Use THE before rivers, seas, oceans, deserts, mountain RANGES, GROUPS of islands, holy books, newspapers, historical buildings, and unique natural objects like the sun, the moon, the earth and the sky.",
  ta:"நதிகள், கடல்கள், பெருங்கடல்கள், பாலைவனங்கள், மலைத்தொடர்கள், தீவுக் கூட்டங்கள், புனித நூல்கள், செய்தித்தாள்கள், வரலாற்றுக் கட்டிடங்கள், மற்றும் சூரியன், நிலா, பூமி, வானம் போன்ற தனித்துவமான இயற்கைப் பொருட்களுக்கு முன் THE பயன்படுத்தவும்.",
  tl:"Nadhigal, kadalgal, perungadalgal, paalaivanangal, malaiththodargal, theevuk koottangal, punidha noolgal, seydhiththaalgal, varalaatruk kattidangal, matrum sooriyan, nilaa, boomi, vaanam pondra thaniththuvamaana iyarkaip porutkalukku mun THE payanpaduththavum.",
  formula:"THE  +  unique or named thing\n\n  RIVERS   : the Ganga, the Kaveri, the Nile\n  SEAS     : the Arabian Sea, the Bay of Bengal\n  OCEANS   : the Indian Ocean, the Pacific\n  DESERTS  : the Thar, the Sahara\n  RANGES   : the Himalayas, the Western Ghats\n  ISLANDS  : the Andamans, the West Indies\n  BOOKS    : the Ramayana, the Quran, the Bible\n  PAPERS   : the Hindu, the Times of India\n  UNIQUE   : the sun, the moon, the earth, the sky"},

 s2:[
 {h:"Range takes THE, single peak does not",
  en:"This is the most tested distinction in the rule. A mountain RANGE is a group, so it takes THE: the Himalayas, the Alps, the Western Ghats. A single PEAK is one named mountain and takes NO article: Mount Everest, Kanchenjunga, Mount Fuji.",
  ta:"மலைத்தொடர் THE எடுக்கும், தனி சிகரம் எடுக்காது. இதுதான் இந்த விதியில் மிக அதிகமாகச் சோதிக்கப்படும் வேறுபாடு. ஒரு மலைத்தொடர் ஒரு குழு, எனவே அது THE எடுக்கும்: the Himalayas, the Alps, the Western Ghats. ஒரு தனி சிகரம் ஒரே ஒரு பெயரிடப்பட்ட மலை, அதற்கு article இல்லை: Mount Everest, Kanchenjunga.",
  tl:"Malaiththodar THE edukkum, thani sigaram edukkaadhu. Idhudhaan indha vidhiyil miga adhigamaagach sodhikkappadum verupaadu. Oru malaiththodar oru kuzhu, enave adhu THE edukkum. Oru thani sigaram ore oru peyaridappatta malai, adharku article illai."},
 {h:"Island group takes THE, single island does not",
  en:"Same logic. The Andamans, the Maldives, the West Indies, the Philippines — all groups, all take THE. But Sri Lanka, Java, Sumatra, Cuba — single islands, no article.",
  ta:"தீவுக் கூட்டம் THE எடுக்கும், தனித் தீவு எடுக்காது. அதே தர்க்கம். The Andamans, the Maldives, the West Indies, the Philippines — அனைத்தும் கூட்டங்கள், அனைத்தும் THE எடுக்கும். ஆனால் Sri Lanka, Java, Sumatra, Cuba — தனித் தீவுகள், article இல்லை.",
  tl:"Theevuk koottam THE edukkum, thanith theevu edukkaadhu. Adhe tharkkam. The Andamans, the Maldives, the West Indies, the Philippines — anaiththum koottangal. Aanaal Sri Lanka, Java, Cuba — thanith theevugal, article illai."},
 {h:"Countries: most take no article, a few take THE",
  en:"Ordinary country names take NO article: India, China, Japan, France. But countries whose names describe a political structure take THE: the United States, the United Kingdom, the Netherlands, the Philippines, the UAE, the USSR.",
  ta:"நாடுகள்: பெரும்பாலானவை article எடுப்பதில்லை, சில THE எடுக்கும். சாதாரண நாட்டுப் பெயர்கள் article எடுப்பதில்லை: India, China, Japan, France. ஆனால் அரசியல் அமைப்பை விவரிக்கும் பெயர்கள் THE எடுக்கும்: the United States, the United Kingdom, the Netherlands, the Philippines, the UAE.",
  tl:"Naadugal: perumbaalaanavai article eduppadhillai, sila THE edukkum. Saadhaarana naattup peyargal article eduppadhillai: India, China, Japan, France. Aanaal arasiyal amaippai vivarikkum peyargal THE edukkum."},
 {h:"One of a kind in the whole world",
  en:"The sun, the moon, the earth, the sky, the sea, the world, the universe, the equator, the North Pole — there is only one of each, so THE is compulsory.",
  ta:"உலகில் ஒரே ஒன்று. The sun, the moon, the earth, the sky, the sea, the world, the universe, the equator, the North Pole — ஒவ்வொன்றும் ஒன்றுதான் இருக்கிறது, எனவே THE கட்டாயம்.",
  tl:"Ulagil ore ondru. The sun, the moon, the earth, the sky, the world, the universe, the equator, the North Pole — ovvondrum ondru-dhaan irukkiradhu, enave THE kattaayam."}],

 s3:[
 {h:"Group takes THE, single does not",
  d:"   MOUNTAINS\n   the Himalayas    (a whole RANGE)   →  THE  ✔\n   Mount Everest    (ONE peak)        →  none ✔\n\n   ISLANDS\n   the Andamans     (a GROUP)         →  THE  ✔\n   Sri Lanka        (ONE island)      →  none ✔\n\n   RULE: many = THE,  one named = no article"},
 {h:"The whole THE family",
  d:"  🌊 the Ganga · the Kaveri · the Nile\n  🌊 the Arabian Sea · the Bay of Bengal\n  🌊 the Indian Ocean · the Pacific Ocean\n  🏜️ the Thar Desert · the Sahara\n  ⛰️ the Himalayas · the Western Ghats\n  🏝️ the Andamans · the West Indies\n  📖 the Ramayana · the Quran · the Bible\n  📰 the Hindu · the Times of India\n  🏛️ the Taj Mahal · the Red Fort\n  ☀️ the sun · the moon · the earth · the sky"}],

 s4:{
 wrong:["\"Everest is a mountain, and mountains take THE.\" — Only RANGES take THE. Single peaks take none.",
  "\"India is a country, and the United States is a country, so both behave the same.\" — Only descriptive names like 'the United States' take THE.",
  "\"'Sun rises in east' is fine.\" — Both 'sun' and 'east' are unique, so both need THE.",
  "\"Newspapers are just names, so no article.\" — Newspaper titles always take THE."],
 right:["Ask: is this a GROUP (range, island group) or ONE named thing?",
  "Group → THE. Single named peak or island → no article.",
  "Rivers, seas, oceans, deserts, holy books and newspapers ALWAYS take THE.",
  "Anything there is only one of in the world → THE."]},

 s5:[
 {en:"The Ganga flows through the northern plains.",ta:"கங்கை நதி வடக்குச் சமவெளிகள் வழியாகப் பாய்கிறது.",tl:"Gangai nadhi vadakkuch samavelgal vazhiyaagap paaygiradhu.",note:"Rivers always take THE."},
 {en:"The Himalayas are the highest mountains in the world.",ta:"இமயமலைத் தொடர்தான் உலகின் மிக உயரமான மலைகள்.",tl:"Imayamalaith thodardhaan ulagin miga uyaramaana malaigal.",note:"A range → THE. Also note the plural verb ARE."},

 s6:["the Ganga|கங்கை நதி|Gangai nadhi",
  "the Himalayas|இமயமலைத் தொடர்|Imayamalaith thodar",

 s10:{
  en:"The exam almost never asks about 'the Ganga'. It asks about the BORDER cases: 'the Himalayas' versus 'Mount Everest', 'the Andamans' versus 'Sri Lanka', 'the United States' versus 'India'. In each pair one takes THE and the other takes nothing, and they look identical in kind. The test is always: is it a GROUP or a SINGLE named thing?",
  ta:"தேர்வு 'the Ganga' பற்றி கிட்டத்தட்ட ஒருபோதும் கேட்பதில்லை. எல்லைப்புற வழக்குகளைத்தான் கேட்கும்: 'the Himalayas' மற்றும் 'Mount Everest', 'the Andamans' மற்றும் 'Sri Lanka', 'the United States' மற்றும் 'India'. ஒவ்வொரு ஜோடியிலும் ஒன்று THE எடுக்கும், மற்றொன்று எதுவும் எடுக்காது, இரண்டுமே ஒரே வகையாகத் தெரியும். சோதனை எப்போதும் இதுதான்: இது ஒரு குழுவா, அல்லது ஒரே ஒரு பெயரிடப்பட்ட பொருளா?",
  tl:"Thervu 'the Ganga' patri kittaththatta orupodhum ketpadhillai. Ellaippura vazhakkugalaith-thaan ketkum: 'the Himalayas' matrum 'Mount Everest', 'the Andamans' matrum 'Sri Lanka'. Sodhanai eppodhum idhudhaan: idhu oru kuzhuvaa, alladhu ore oru peyaridappatta porulaa?"},

 s11:{
  en:"RANGE = THE. PEAK = none. GROUP = THE. SINGLE = none.",
  ta:"மலைத்தொடர் = THE. சிகரம் = இல்லை. கூட்டம் = THE. தனி = இல்லை.",
  tl:"Malaiththodar = THE. Sigaram = illai. Koottam = THE. Thani = illai.",
  vis:"       THE GROUP TEST\n\n   Is it MANY things under one name?\n            ↓ YES\n         use THE\n   the Himalayas · the Andamans · the West Indies\n   the United States · the Netherlands\n\n   Is it ONE named thing?\n            ↓ YES\n        use NOTHING\n   Mount Everest · Sri Lanka · India · Japan\n\n   ALWAYS THE (no exceptions):\n   rivers · seas · oceans · deserts\n   holy books · newspapers · the sun/moon/earth"},

 s15:[
 {ta:"இந்த rule ஒரு பட்டியல் rule மாதிரி தெரியும், ஆனா உண்மையில ஒரே ஒரு கொள்கைதான் — தனித்துவம். உலகத்துல ஒண்ணுதான் இருக்குன்னா, அல்லது பல விஷயங்கள் ஒரே பெயர்ல இருக்குன்னா, THE வரும்.",
  tl:"Indha rule oru pattiyal rule maadhiri theriyum, aanaa unmaiyila ore oru kolgai-dhaan — thaniththuvam. Ulagaththula onnu-dhaan irukkunnaa, alladhu pala vishayangal ore peyarla irukkunnaa, THE varum."},
 {ta:"நதி, கடல், பெருங்கடல், பாலைவனம் — இதெல்லாம் எப்பவும் THE. 'The Ganga', 'The Arabian Sea', 'The Indian Ocean', 'The Thar Desert'. இதுல குழப்பமே இல்ல. புனித நூல்களும் அப்படித்தான் — 'The Ramayana', 'The Quran', 'The Bible'. செய்திதாளும் — 'The Hindu', 'The Times of India'.",
  tl:"Nadhi, kadal, perungadal, paalaivanam — idhellaam eppavum THE. 'The Ganga', 'The Arabian Sea', 'The Indian Ocean'. Idhula kuzhappame illa. Punidha noolgalum appadidhaan — 'The Ramayana', 'The Quran'."},
 {ta:"இப்போ SSC-ஓட உண்மையான களத்துக்கு வரலாம். அவங்க இதெல்லாம் கேட்க மாட்டாங்க. அவங்க கேட்குறது எல்லைக் கேள்விதான். உதாரணம்: 'The Himalayas' சரி. ஆனா 'The Mount Everest' சரியா? இல்ல! 'Mount Everest' — article இல்ல.",
  tl:"Ippo SSC-oda unmaiyaana kalaththukku varalaam. Avanga idhellaam ketka maattaanga. Avanga ketkuradhu ellaik kelvi-dhaan. Udhaaranam: 'The Himalayas' sari. Aanaa 'The Mount Everest' sariyaa? Illa! 'Mount Everest' — article illa."},
 {ta:"ஏன் இந்த வித்தியாசம்? யோசிச்சுப் பாருங்க. 'Himalayas' அப்படின்னா என்ன? ஒரு மலையா? இல்ல — நூற்றுக்கணக்கான மலைகள் சேர்ந்த ஒரு தொடர். பல. கூட்டம். கூட்டத்துக்கு THE. ஆனா 'Everest' அப்படின்னா? ஒரே ஒரு சிகரம். ஒரு பெயர். அதனால article இல்ல.",
  tl:"Yen indha viththiyaasam? Yosichup paarunga. 'Himalayas' appadinnaa enna? Oru malaiyaa? Illa — nootrukkanakkaana malaigal serndha oru thodar. Pala. Koottam. Koottaththukku THE. Aanaa 'Everest' appadinnaa? Ore oru sigaram. Adhanaala article illa."},
 {ta:"இதே logic தீவுக்கும் பொருந்தும். 'The Andamans' — பல தீவுகள் சேர்ந்த கூட்டம். THE. 'Sri Lanka' — ஒரே ஒரு தீவு. article இல்ல. 'The Maldives' — கூட்டம். THE. 'Java' — தனி. இல்ல. கூட்டமா தனியா அப்படின்னு கேளுங்க, பதில் தானா வரும்.",
  tl:"Idhe logic theevukkum porundhum. 'The Andamans' — pala theevugal serndha koottam. THE. 'Sri Lanka' — ore oru theevu. Article illa. Koottamaa thaniyaa appadinnu kelunga, padhil thaanaa varum."},
 {ta:"கடைசியா நாடுகள். 'India', 'China', 'Japan', 'France' — சாதாரண பெயர், article இல்ல. ஆனா 'The United States', 'The United Kingdom', 'The Netherlands', 'The Philippines' — இவை THE எடுக்கும். ஏன்? ஏன்னா இந்த பெயர்கள் ஒரு அமைப்பை விவரிக்குது — 'ஐக்கிய மாநிலங்கள்', 'ஐக்கிய இராச்சியம்'. பல பகுதிகள் சேர்ந்த ஒண்ணு. அதனால THE. இதே கொள்கை மறுபடியும்.",
  tl:"Kadaisiyaa naadugal. 'India', 'China', 'Japan' — saadhaarana peyar, article illa. Aanaa 'The United States', 'The United Kingdom', 'The Netherlands' — ivai THE edukkum. Yennaa indha peyargal oru amaippai vivarikkudhu. Pala paguthigal serndha onnu. Adhanaala THE."}]},

/* ========== RULE 7 ========== */
{n:7,rc:"ART-07",d:"Medium",t:"NO Article before General Proper, Material and Abstract Nouns",
 tam:"பொதுவான சிறப்புப்பெயர், பொருள்பெயர், கருத்துப்பெயருக்கு article இல்லை",
 s1:{en:"Do NOT use an article before proper nouns (Ram, Chennai), material nouns (gold, water, milk) and abstract nouns (honesty, courage, beauty) when they are used in a GENERAL sense. But when they become SPECIFIC, THE returns.",
  ta:"சிறப்புப்பெயர்கள் (Ram, Chennai), பொருள்பெயர்கள் (gold, water, milk), கருத்துப்பெயர்கள் (honesty, courage, beauty) — இவை பொதுவான பொருளில் பயன்படுத்தப்படும்போது article பயன்படுத்தக் கூடாது. ஆனால் அவை குறிப்பிட்டவையாக மாறும்போது, THE திரும்பி வரும்.",
  tl:"Sirappuppeyargal (Ram, Chennai), porulpeyargal (gold, water, milk), karuththuppeyargal (honesty, courage, beauty) — ivai podhuvaana porulil payanpaduththappadumbodhu article payanpaduththak koodaadhu. Aanaal avai kurippittavaiyaaga maarumbodhu, THE thirumbi varum.",
  formula:"GENERAL  →  NO ARTICLE\n  Honesty is the best policy.\n  Gold is a precious metal.\n  Ram lives in Chennai.\n\nSPECIFIC (with 'of' or a clause)  →  THE\n  THE honesty of the officer surprised us.\n  THE gold in this ring is pure.\n  THE Chennai of my childhood was quieter."},

 s2:[
 {h:"Why general nouns need no article",
  en:"An article LIMITS a noun. 'Honesty' in general already means all honesty everywhere — there is nothing left to limit. Adding THE would wrongly suggest one particular honesty. So English uses no article at all.",
  ta:"பொதுவான பெயர்ச்சொற்களுக்கு ஏன் article தேவையில்லை? ஒரு article பெயர்ச்சொல்லை வரையறுக்கிறது. பொதுவாக 'honesty' என்றால் எல்லா இடத்திலும் உள்ள எல்லா நேர்மையையும் குறிக்கிறது — வரையறுக்க எதுவும் மிச்சமில்லை. THE சேர்த்தால் ஒரு குறிப்பிட்ட நேர்மையைத் தவறாகச் சுட்டும். எனவே ஆங்கிலம் எந்த article-ஐயும் பயன்படுத்துவதில்லை.",
  tl:"Podhuvaana peyarchorkalukku yen article thevaiyillai? Oru article peyarcholai varaiyarukkiradhu. Podhuvaaga 'honesty' endraal ellaa idaththilum ulla ellaa nermaiyaiyum kurikkiradhu. THE serthaal oru kurippitta nermaiyaith thavaraaych suttum."},
 {h:"The of-phrase switch",
  en:"The moment you add 'of + something', the noun becomes specific and THE appears. 'Honesty is rare' but 'THE honesty OF this man is rare'. 'Water is life' but 'THE water OF this well is salty'. Look for 'of' — it is the switch.",
  ta:"'of' தொடர் என்பது ஒரு switch. நீங்கள் 'of + ஏதோ ஒன்று' சேர்க்கும் தருணத்தில், அந்தப் பெயர்ச்சொல் குறிப்பிட்டதாகி THE தோன்றுகிறது. 'Honesty is rare' ஆனால் 'THE honesty OF this man is rare'. 'Water is life' ஆனால் 'THE water OF this well is salty'. 'of'-ஐத் தேடுங்கள் — அதுதான் switch.",
  tl:"'of' thodar enbadhu oru switch. Neengal 'of + edho ondru' serkkum tharunaththil, andhap peyarchol kurippittadhaagi THE thondrugiradhu. 'of'-aith thedungal — adhudhaan switch."},
 {h:"Proper nouns can take THE when made specific",
  en:"'Shakespeare wrote plays' — no article. But 'He is THE Shakespeare of India' means he plays that role, so THE appears. Similarly 'THE Mr Sharma who called yesterday' points to one particular Mr Sharma.",
  ta:"சிறப்புப்பெயர்கள் குறிப்பிட்டதாக்கப்படும்போது THE எடுக்கலாம். 'Shakespeare wrote plays' — article இல்லை. ஆனால் 'He is THE Shakespeare of India' என்றால் அவர் அந்தப் பாத்திரத்தை வகிக்கிறார், எனவே THE தோன்றுகிறது. அதேபோல 'THE Mr Sharma who called yesterday' ஒரு குறிப்பிட்ட Mr Sharma-ஐச் சுட்டுகிறது.",
  tl:"Sirappuppeyargal kurippittadhaakkappadumbodhu THE edukkalaam. 'Shakespeare wrote plays' — article illai. Aanaal 'He is THE Shakespeare of India' endraal avar andhap paaththiraththai vagikkiraar, enave THE thondrugiradhu."},
 {h:"Meals, languages, subjects and games take no article",
  en:"Breakfast, lunch, dinner; English, Tamil, Hindi; mathematics, history; cricket, football, chess — all take no article in general use. 'He plays cricket', not 'the cricket'. 'She teaches English', not 'the English'.",
  ta:"உணவு, மொழி, பாடம், விளையாட்டு ஆகியவை article எடுப்பதில்லை. Breakfast, lunch, dinner; English, Tamil, Hindi; mathematics, history; cricket, football, chess — அனைத்தும் பொது பயன்பாட்டில் article எடுப்பதில்லை. 'He plays cricket', 'the cricket' அல்ல. 'She teaches English', 'the English' அல்ல.",
  tl:"Unavu, mozhi, paadam, vilaiyaattu aagiyavai article eduppadhillai. Breakfast, lunch, dinner; English, Tamil, Hindi; mathematics, history; cricket, football, chess — anaiththum podhu payanpaattil article eduppadhillai."}],

 s3:[
 {h:"General versus specific",
  d:"  GENERAL (all of it, everywhere)  →  NO ARTICLE\n     Honesty is the best policy.\n     Gold is precious.\n     Water is life.\n\n  SPECIFIC (this particular one)   →  THE\n     THE honesty OF the officer surprised us.\n     THE gold IN this ring is pure.\n     THE water OF this well is salty.\n              ↑\n     'of' or 'in' or a clause = the switch"},
 {h:"Four families that take no article",
  d:"  🍽️ MEALS     : breakfast, lunch, dinner, supper\n  🗣️ LANGUAGES : English, Tamil, Hindi, French\n  📚 SUBJECTS   : mathematics, history, physics\n  🏏 GAMES      : cricket, football, chess, hockey\n\n  He plays cricket after dinner.        ✔\n  He plays the cricket after the dinner. ✘"}],

 s4:{
 wrong:["\"Every noun needs an article.\" — General abstract, material and proper nouns take none.",
  "\"'The honesty is the best policy' sounds more complete.\" — The extra THE makes it wrong.",
  "\"'He plays the cricket' — cricket is a specific game.\" — Games take no article.",
  "\"Abstract nouns never take THE.\" — They do, the moment an of-phrase or clause makes them specific."],
 right:["Ask: am I talking about ALL of it, or THIS particular one?",
  "All of it → no article. This particular one → THE.",
  "Look for 'of', 'in' or a which/that clause — those force THE.",
  "Meals, languages, subjects and games take no article in general use."]},

 s5:[
 {en:"Honesty is the best policy.",ta:"நேர்மையே சிறந்த கொள்கை.",tl:"Nermaiye sirandha kolgai.",note:"General abstract noun → no article."},
 {en:"The honesty of that officer surprised everyone.",ta:"அந்த அதிகாரியின் நேர்மை அனைவரையும் ஆச்சரியப்படுத்தியது.",tl:"Andha adhigaariyin nermai anaivaraiyum aachariyappaduththiyadhu.",note:"'Of that officer' makes it specific → THE."},
 {en:"Gold is a precious metal.",ta:"தங்கம் ஒரு விலைமதிப்புமிக்க உலோகம்.",tl:"Thangam oru vilaimadhippumikka ulogam.",note:"General material noun → no article."},
 {en:"He plays cricket every evening after dinner.",ta:"அவர் தினமும் மாலை இரவு உணவுக்குப் பிறகு கிரிக்கெட் விளையாடுகிறார்.",tl:"Avar dhinamum maalai iravu unavukkup piragu cricket vilaiyaadugiraar.",note:"Games and meals take no article."},
 {en:"She teaches English at a government school.",ta:"அவர் ஒரு அரசுப் பள்ளியில் ஆங்கிலம் கற்பிக்கிறார்.",tl:"Avar oru arasup palliyil Aangilam karpikkiraar.",note:"Languages take no article."}],

 s9:[

 s10:{
  en:"The exam puts the SAME abstract noun in two sentences — one general, one specific — and asks you to article them differently. 'Honesty is the best policy' takes nothing, but 'THE honesty of the officer' takes THE. Students who learnt 'abstract nouns never take THE' get the second one wrong. The switch is always an of-phrase, an in-phrase, or a which/that clause.",
  ta:"தேர்வு ஒரே கருத்துப்பெயரை இரண்டு வாக்கியங்களில் வைக்கும் — ஒன்று பொதுவானது, ஒன்று குறிப்பிட்டது — மேலும் அவற்றுக்கு வெவ்வேறு article கேட்கும். 'Honesty is the best policy' எதுவும் எடுக்காது, ஆனால் 'THE honesty of the officer' THE எடுக்கும். 'கருத்துப்பெயர்கள் ஒருபோதும் THE எடுக்காது' என்று கற்றவர்கள் இரண்டாவதைத் தவறாகச் செய்வார்கள். switch எப்போதும் ஒரு of-தொடர், in-தொடர், அல்லது which/that clause.",
  tl:"Thervu ore karuththuppeyarai irandu vaakkiyangalil vaikkum — ondru podhuvaanadhu, ondru kurippittadhu. 'Honesty is the best policy' edhuvum edukkaadhu, aanaal 'THE honesty of the officer' THE edukkum. Switch eppodhum oru of-thodar, in-thodar, alladhu which/that clause."},

 s11:{
  en:"ALL OF IT → no article. THIS PARTICULAR ONE → THE. Look for 'of'.",
  ta:"முழுவதும் → article இல்லை. இந்தக் குறிப்பிட்ட ஒன்று → THE. 'of'-ஐத் தேடுங்கள்.",
  tl:"Muzhuvadhum → article illai. Indhak kurippitta ondru → THE. 'of'-aith thedungal.",
  vis:"        THE 'OF' SWITCH\n\n   Honesty is the best policy.\n      ↑\n   no 'of' → GENERAL → no article\n\n   THE honesty OF the officer surprised us.\n                ↑\n   'of' present → SPECIFIC → THE\n\n   NEVER TAKE AN ARTICLE (general use):\n   🍽️ meals      🗣️ languages\n   📚 subjects    🏏 games\n   💎 materials   💭 abstract nouns\n   👤 proper nouns"},
