 s13:[
 "Mathematics, along with physics and chemistry, ____ compulsory for all science students.|are;is;were|1|Rule 31 removes 'along with...'. A subject name is singular → IS.",
 "Neither the United States nor the Philippines ____ signed the treaty so far.|have;has;had|1|'Neither...nor' takes the nearest → 'The Philippines' (singular country) → HAS.",
 "The statistics that ____ published last week ____ shown a sharp rise in unemployment.|was-has;were-have;were-has|1|Here 'statistics' means actual figures → WERE published and HAVE shown.",
 "Each of the diseases mentioned here, including measles and mumps, ____ preventable by vaccination.|are;is;were|1|'Each of' is fixed singular (Rule 50) and 'including...' is parenthetical → IS.",
 "Politics ____ a dirty game, but his politics ____ never been questioned by anyone.|is-has;is-have;are-have|1|Subject name → IS. Personal views → HAVE."],

 s14:{
  rule:"Names of countries, books, diseases and subjects ending in -s take a singular verb.",
  formula:"ONE NAME (even ending in -s)  →  SINGULAR VERB",
  memory:"The -s is spelling, not grammar. One name, one verb.",
  ta:"அந்த -s எழுத்துக்கூட்டல் மட்டும்தான், இலக்கணம் இல்ல. ஒரு பெயர், ஒரு வினைச்சொல்.",
  tl:"Andha -s ezhuththukkoottal mattum-dhaan, ilakkanam illa. Oru peyar, oru vinaichol.",
  mistake:"Writing a plural verb because the name ends in -s.",
  exam:"SSC CGL / CHSL, RRB NTPC — appears regularly, especially with country names."},

 s15:[
 {ta:"இந்த rule ரொம்ப சுவாரஸ்யமானது. ஏன்னா இங்க நம்ம கண்ணே நம்மள ஏமாத்துது. 'The United States' — கடைசில 's' இருக்கு. நம்ம மூளை உடனே 'ஓ, பன்மை' அப்படின்னு முடிவு பண்ணிடும். ஆனா அது தப்பு.",
  tl:"Indha rule romba suvaarasyamaanadhu. Yennaa inga namma kanne nammala emaaththudhu. 'The United States' — kadaisila 's' irukku. Namma moolai udane 'oh, panmai' appadinnu mudivu pannidum. Aanaa adhu thappu."},
 {ta:"ஒரு படம் மனசுல வெச்சுக்கோங்க. உலக வரைபடத்தை பாருங்க. அமெரிக்கா எங்க இருக்கு? ஒரே ஒரு இடத்துல. ஒரு நாடு. ஒரு கொடி. ஒரு அரசு. உள்ள 50 மாநிலம் இருக்கலாம், ஆனா நாடு ஒண்ணுதான். அதனால IS.",
  tl:"Oru padam manasula vechukkonga. Ulaga varaibadaththai paarunga. America enga irukku? Ore oru idaththula. Oru naadu. Oru kodi. Oru arasu. Ulla 50 maanilam irukkalaam, aanaa naadu onnu-dhaan. Adhanaala IS."},
 {ta:"நூல் விஷயத்துலயும் அதேதான். 'Gulliver's Travels' — உள்ள நிறைய பயணம் இருக்கு, ஆனா புத்தகம் ஒண்ணுதான். நீங்க கடையில் போய் 'Gulliver's Travels' கேட்டா, ஒரு புத்தகம்தான் தருவாங்க, பல புத்தகம் இல்ல. அதனால IS.",
  tl:"Nool vishayaththulayum adhedhaan. 'Gulliver's Travels' — ulla neraiya payanam irukku, aanaa puththagam onnu-dhaan. Neenga kadaiyil poy kettaa, oru puththagam-dhaan tharuvaanga. Adhanaala IS."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு point — Politics மற்றும் Statistics. இந்த ரெண்டு வார்த்தையும் இரட்டை வேடம் போடும். 'Politics is a dirty game' — இங்க politics அப்படின்னா 'அரசியல்' அப்படிங்கிற துறை, ஒரு பாடம். ஒருமை. ஆனா 'His politics are unclear' — இங்க politics அப்படின்னா 'அவரோட அரசியல் கருத்துக்கள்', பல கருத்துக்கள். பன்மை.",
  tl:"Ippo romba mukkiyamaana oru point — Politics matrum Statistics. Indha rendu vaarththaiyum irattai vedam podum. 'Politics is a dirty game' — inga politics appadinnaa 'arasiyal' appadingira thurai, oru paadam. Orumai. Aanaa 'His politics are unclear' — inga 'avaroda arasiyal karuththukkal', pala karuththukkal. Panmai."},
 {ta:"Statistics-ம் அப்படித்தான். 'Statistics is a branch of mathematics' — புள்ளியியல் அப்படிங்கிற பாடம். ஒருமை. ஆனா 'These statistics are misleading' — இங்க உண்மையான எண்கள், விவரங்கள். பன்மை. உங்களுக்கு ஒரு கேள்வி கேட்டுக்கோங்க: 'இது ஒரு பாடமா, இல்ல உண்மையான எண்களா?' பாடம்னா ஒருமை, எண்கள்னா பன்மை.",
  tl:"Statistics-um appadidhaan. 'Statistics is a branch of mathematics' — pulliyiyal appadingira paadam. Orumai. Aanaa 'These statistics are misleading' — inga unmaiyaana engal, vivarangal. Panmai. Ungalukku oru kelvi kettukkonga: 'idhu oru paadamaa, illa unmaiyaana engalaa?'"},
 {ta:"கடைசியா நான்கு குடும்பத்தை மனப்பாடம் பண்ணுங்க: நாடு, நூல், நோய், பாடம். இந்த நாலும் -s-ல முடிஞ்சாலும் ஒருமை. இதை ஒரு பாட்டு மாதிரி நினைச்சுக்கோங்க — 'நாடு, நூல், நோய், பாடம் — நாலும் ஒருமை'. தேர்வுல இந்த மாதிரி வார்த்தை பார்த்தவுடனே இந்த வரி மனசுல வரணும்.",
  tl:"Kadaisiyaa naangu kudumbaththai manappaadam pannunga: naadu, nool, noy, paadam. Indha naalum -s-la mudinjaalum orumai. Idhai oru paattu maadhiri ninaichukkonga — 'naadu, nool, noy, paadam — naalum orumai'."}]},

/* ========== RULE 42 ========== */
{n:42,rc:"SVA-12",d:"Medium",t:"Money, Distance, Time and Weight as ONE Unit are Singular",
 tam:"பணம், தூரம், நேரம், எடை — ஒரே அளவாக இருந்தால் ஒருமை · Panam, dhooram, neram, edai — ore alavaaga irundhaal orumai",
 s1:{en:"When an amount of money, a period of time, a distance, a weight or a quantity is treated as ONE single measurement, the verb is SINGULAR — even though the noun is plural in form.",
  ta:"ஒரு தொகை பணம், ஒரு கால அளவு, ஒரு தூரம், ஒரு எடை அல்லது ஒரு அளவு — இவை ஒரே ஒரு அளவீடாகக் கருதப்படும்போது, வினைச்சொல் ஒருமையாக இருக்கும், பெயர்ச்சொல் பன்மை வடிவில் இருந்தாலும்.",
  tl:"Oru thogai panam, oru kaala alavu, oru dhooram, oru edai alladhu oru alavu — ivai ore oru alaveedaagak karudhappadumbodhu, vinaichol orumaiyaaga irukkum, peyarchol panmai vadivil irundhaalum.",
  formula:"ONE MEASUREMENT  =  ONE VERB\n\nTen thousand rupees  IS  a big amount.\nFive kilometres      IS  a long walk.\nTwo hours            IS  enough time.\nTwenty kilograms     IS  too heavy."},

 s2:[
 {h:"You are naming a quantity, not counting objects",
  en:"'Ten thousand rupees is a big amount' — you are not talking about ten thousand separate notes. You are talking about ONE amount. The plural noun is just how English writes the size of that single amount.",
  ta:"'Ten thousand rupees is a big amount' — நீங்கள் பத்தாயிரம் தனித்தனி நோட்டுகளைப் பற்றிப் பேசவில்லை. ஒரே ஒரு தொகையைப் பற்றிப் பேசுகிறீர்கள். அந்தப் பன்மைப் பெயர்ச்சொல், அந்த ஒரே தொகையின் அளவை ஆங்கிலம் எழுதும் விதம், அவ்வளவுதான்.",
  tl:"'Ten thousand rupees is a big amount' — neengal paththaayiram thanithani nottugalaip patrip pesavillai. Ore oru thogaiyaip patrip pesugireergal. Andhap panmaip peyarchol, andha ore thogaiyin alavai Aangilam ezhudhum vidham, avvalavudhaan."},
 {h:"When the same words become plural",
  en:"If you really mean the separate items, the verb turns plural: 'The rupees WERE scattered on the floor' (individual notes), 'Five kilometres OF ROAD HAVE been repaired' (separate stretches). Meaning decides.",
  ta:"நீங்கள் உண்மையிலேயே தனித்தனிப் பொருட்களைக் குறித்தால், வினைச்சொல் பன்மையாக மாறும்: 'The rupees WERE scattered on the floor' (தனித்தனி நோட்டுகள்), 'Five kilometres OF ROAD HAVE been repaired' (தனித்தனிப் பகுதிகள்). பொருள்தான் தீர்மானிக்கிறது.",
  tl:"Neengal unmaiyileye thanithanip porutkalaik kurithaal, vinaichol panmaiyaaga maarum. Porul-dhaan theermaanikkiradhu."},
 {h:"The classic test sentence",
  en:"'Ten years is a long time to wait.' If you can replace the whole phrase with 'it', the verb is singular. 'IT is a long time to wait.' It works, so singular.",
  ta:"'Ten years is a long time to wait.' முழுத் தொடரையும் 'it' என்று மாற்ற முடிந்தால், வினைச்சொல் ஒருமை. 'IT is a long time to wait.' பொருந்துகிறது, எனவே ஒருமை.",
  tl:"'Ten years is a long time to wait.' Muzhuth thodaraiyum 'it' endru maatra mudindhaal, vinaichol orumai. 'IT is a long time to wait.' Porundhugiradhu, enave orumai."}],

 s3:[
 {h:"One bag, not many coins",
  d:"   💰💰💰💰💰   ← ten thousand rupees\n        ↓\n   ┌──────────┐\n   │  ONE     │   =  ONE AMOUNT  →  IS\n   │  AMOUNT  │\n   └──────────┘\n\n  Ten thousand rupees IS a big amount.  ✔"},
 {h:"The 'IT' replacement test",
  d:"  Five kilometres is a long walk.\n       ↓ replace with IT\n  IT   is a long walk.           ✔ works → singular\n\n  The rupees were scattered on the floor.\n       ↓ replace with IT\n  IT   were scattered            ✘ fails → plural (separate notes)"}],

 s4:{
 wrong:["\"'Rupees' ends in -s, so plural.\" — The plural marks the size of one amount.",
  "\"Ten years is clearly ten separate years.\" — You are naming one period of waiting.",
  "\"'Five kilometres are a long walk' sounds better.\" — Sound is not the rule; meaning is."],
 right:["Ask: am I naming ONE amount, ONE period, ONE distance? If yes → singular.",
  "Try replacing the whole phrase with 'IT'. If it fits, use a singular verb.",
  "If you genuinely mean separate notes or separate stretches → plural."]},

 s5:[
 {en:"Ten thousand rupees is a big amount for him.",ta:"பத்தாயிரம் ரூபாய் என்பது அவருக்குப் பெரிய தொகை.",tl:"Paththaayiram roobaay enbadhu avarukkup periya thogai.",note:"One amount → IS."},
 {en:"Five kilometres is a long walk in this heat.",ta:"இந்த வெயிலில் ஐந்து கிலோமீட்டர் என்பது நீண்ட நடை.",tl:"Indha veyilil aindhu kilometre enbadhu neenda nadai.",note:"One distance → IS."},
 {en:"Two hours is enough for this test.",ta:"இந்தத் தேர்வுக்கு இரண்டு மணி நேரம் போதுமானது.",tl:"Indhath thervukku irandu mani neram podhumaanadhu.",note:"One period → IS."},
 {en:"Twenty kilograms is too heavy for a child.",ta:"இருபது கிலோ என்பது ஒரு குழந்தைக்கு மிகவும் கனமானது.",tl:"Irubadhu kilo enbadhu oru kuzhandhaikku migavum kanamaanadhu.",note:"One weight → IS."},
 {en:"The rupees were scattered all over the floor.",ta:"ரூபாய் நோட்டுகள் தரை முழுவதும் சிதறிக் கிடந்தன.",tl:"Roobaay nottugal tharai muzhuvadhum sidharik kidandhana.",note:"Here the individual notes are meant → WERE."}],

 s9:[
 "Find the Error|Ten thousand rupees (A) are a huge amount (B) for a daily wage worker (C) like him (D).|A;B;C;D|1|Part B. One amount → 'is a huge amount'.",
 "Fill in the Blank|Two hours ____ more than enough to complete this paper.|is;are|0|One period of time → IS.",
 "Sentence Improvement|Five kilometres are not a great distance for a trained runner.|are;is;were|1|One distance → IS.",
 "Find the Error|Six months (A) are required (B) to complete (C) this construction work (D).|A;B;C;D|1|Part B. One period → 'is required'.",
 "Fill in the Blank|Fifty kilograms ____ the maximum weight allowed in the cabin.|is;are|0|One weight → IS."],

 s10:{
  en:"The exam counts on the -s ending and the obviously plural number. 'Ten thousand rupees' has both, so you write ARE without thinking. The deeper trap is the reversed case: 'Five kilometres of the road HAVE been widened' — here the road is being repaired in separate stretches, so the verb genuinely is plural. The paper will place both versions nearby.",
  ta:"தேர்வு -s விகுதியையும் வெளிப்படையான பன்மை எண்ணையும் நம்பியிருக்கிறது. 'Ten thousand rupees'-ல் இரண்டுமே இருக்கிறது, எனவே யோசிக்காமல் ARE என்று எழுதிவிடுவீர்கள். ஆழமான பொறி தலைகீழ் வழக்கு: 'Five kilometres of the road HAVE been widened' — இங்கே சாலை தனித்தனிப் பகுதிகளாகச் சரிசெய்யப்படுகிறது, எனவே வினைச்சொல் உண்மையிலேயே பன்மை. இரண்டு வடிவங்களையும் அருகருகே வைப்பார்கள்.",
  tl:"Thervu -s vigudhiyaiyum velippadaiyaana panmai ennaiyum nambiyirukkiradhu. 'Ten thousand rupees'-l rendume irukkiradhu, enave yosikkaamal ARE endru ezhudhividuveergal. Aazhamaana pori thalaigeezh vazhakku."},

 s11:{
  en:"THE 'IT' TEST. Replace the whole phrase with 'IT'. If the sentence still works, the verb is singular.",
  ta:"'IT' சோதனை. முழுத் தொடரையும் 'IT' என்று மாற்றுங்கள். வாக்கியம் இன்னும் சரியாக இருந்தால், வினைச்சொல் ஒருமை.",
  tl:"'IT' sodhanai. Muzhuth thodaraiyum 'IT' endru maatrungal. Vaakkiyam innum sariyaaga irundhaal, vinaichol orumai.",
  vis:"    FOUR MEASUREMENT FAMILIES\n\n   💰 MONEY    : Ten thousand rupees IS...\n   📏 DISTANCE : Five kilometres    IS...\n   ⏰ TIME     : Two hours          IS...\n   ⚖️ WEIGHT   : Twenty kilograms   IS...\n\n   ALL ONE MEASUREMENT → ALL SINGULAR\n\n   Exception: if you mean the separate NOTES,\n   the separate STRETCHES → plural verb."},

 s13:[
 "Ten thousand rupees, along with some jewellery, ____ stolen from the house last night.|were;was;have|1|Rule 31 removes 'along with some jewellery'. One amount → WAS.",
 "Neither five kilometres nor two hours ____ a problem for a trained athlete like her.|are;is;were|1|'Neither...nor' takes the nearest → 'two hours' as one period → IS.",
 "Five kilometres of the highway ____ been widened, but the remaining distance ____ still narrow.|has-are;have-is;have-are|1|Separate stretches of road → HAVE. 'The remaining distance' as one measurement → IS.",

 s14:{
  rule:"Money, distance, time and weight taken as ONE measurement take a singular verb.",
  formula:"ONE AMOUNT / PERIOD / DISTANCE / WEIGHT  →  SINGULAR VERB",
  memory:"Replace the whole phrase with 'IT'. If it fits, use a singular verb.",
  ta:"முழு தொடரையும் 'IT' அப்படின்னு மாத்திப் பாருங்க. பொருந்தினா ஒருமை.",
  tl:"Muzhu thodaraiyum 'IT' appadinnu maaththip paarunga. Porundhinaa orumai.",
  mistake:"Writing a plural verb because the noun ends in -s and the number is large.",

 s15:[
 {ta:"இந்த rule-ஐ புரிஞ்சுக்க ஒரு எளிமையான காட்சி மனசுல வெச்சுக்கோங்க. உங்க கையில பத்தாயிரம் ரூபாய் இருக்கு. இப்போ நீங்க என்ன வெச்சிருக்கீங்க — பத்தாயிரம் தனித்தனி விஷயமா, இல்ல ஒரே ஒரு தொகையா? ஒரே ஒரு தொகை. ஒரு கட்டு பணம். அதனால IS.",
  tl:"Indha rule-ai purinjukka oru elimaiyaana kaatchi manasula vechukkonga. Unga kaiyila paththaayiram roobaay irukku. Ippo neenga enna vechirukkeenga — paththaayiram thanithani vishayamaa, illa ore oru thogaiyaa? Ore oru thogai. Oru kattu panam. Adhanaala IS."},
 {ta:"நேரமும் அப்படித்தான். 'Two hours is enough' — இங்க நீங்க ரெண்டு தனித்தனி மணி நேரத்தைப் பத்தி பேசலை. ஒரு கால அளவைப் பத்தி பேசுறீங்க. 'ரெண்டு மணி நேரம்' அப்படிங்கிற ஒரு துண்டு நேரம். ஒண்ணு. IS.",
  tl:"Neramum appadidhaan. 'Two hours is enough' — inga neenga rendu thanithani mani neraththaip paththi pesalai. Oru kaala alavaip paththi pesureenga. 'Rendu mani neram' appadingira oru thundu neram. Onnu. IS."},
 {ta:"இதை சோதிக்க ஒரு அருமையான trick இருக்கு — 'IT' சோதனை. முழு தொடரையும் 'IT' அப்படின்னு மாத்திப் பாருங்க. 'Five kilometres is a long walk' → 'IT is a long walk'. சரியா இருக்கு இல்லையா? அதனால ஒருமை. இப்போ 'The rupees were scattered' → 'IT were scattered' — தப்பா இருக்கு. அதனால பன்மை. இந்த ஒரு சோதனை போதும்.",
  tl:"Idhai sodhikka oru arumaiyaana trick irukku — 'IT' sodhanai. Muzhu thodaraiyum 'IT' appadinnu maaththip paarunga. 'Five kilometres is a long walk' → 'IT is a long walk'. Sariyaa irukku illaiyaa? Adhanaala orumai."},
 {ta:"இப்போ ஒரு நுட்பமான விஷயம். எப்போ இதே வார்த்தைகள் பன்மை ஆகும்? நீங்க உண்மையிலேயே தனித்தனி பொருளைப் பத்தி பேசும்போது. 'The rupees WERE scattered on the floor' — இங்க நோட்டுகள் தரையில சிதறி கிடக்கு. தனித்தனி நோட்டு. பன்மை. அல்லது 'Five kilometres of the road HAVE been repaired' — இங்க சாலையோட தனித்தனி பகுதிகள் சரி பண்ணப்பட்டிருக்கு. பன்மை.",
  tl:"Ippo oru nutpamaana vishayam. Eppo idhe vaarththaigal panmai aagum? Neenga unmaiyileye thanithani porulaip paththi pesumbodhu. 'The rupees WERE scattered on the floor' — inga nottugal tharaiyila sidhari kidakku. Thanithani nottu. Panmai."},
 {ta:"அதனால கடைசி கேள்வி இதுதான்: 'நான் ஒரு அளவைப் பத்தி பேசுறேனா, இல்ல தனித்தனி பொருளைப் பத்தி பேசுறேனா?' அளவுன்னா ஒருமை. பொருள்ன்னா பன்மை. இந்த ஒரு கேள்வி உங்களை எப்பவும் காப்பாத்தும்.",
  tl:"Adhanaala kadaisi kelvi idhudhaan: 'naan oru alavaip paththi pesurenaa, illa thanithani porulaip paththi pesurenaa?' Alavunnaa orumai. Porulnnaa panmai. Indha oru kelvi ungalai eppavum kaappaaththum."}]},

/* ========== RULE 43 ========== */
{n:43,rc:"SVA-13",d:"Easy",t:"THERE IS / THERE ARE — Find the Real Subject",
 tam:"'There' -க்குப் பின் வரும் பெயர்ச்சொல்லே உண்மையான Subject · 'There'-kkup pin varum peyarchole unmaiyaana Subject",
 s1:{en:"In sentences beginning with 'There', the word 'there' is NOT the subject. It is only an introductory word. The real subject comes AFTER the verb, and the verb must agree with it.",
  ta:"'There'-ஆல் தொடங்கும் வாக்கியங்களில், 'there' என்பது Subject அல்ல. அது வெறும் அறிமுகச் சொல் மட்டுமே. உண்மையான Subject வினைச்சொல்லுக்குப் பின்னால் வருகிறது, வினைச்சொல் அதனுடன் ஒத்துப்போக வேண்டும்.",
  tl:"'There'-aal thodangum vaakkiyangalil, 'there' enbadhu Subject alla. Adhu verum arimugach sol mattume. Unmaiyaana Subject vinaicholukkup pinnaal varugiradhu, vinaichol adhanudan oththuppoga vendum.",
  formula:"THERE  +  VERB  +  REAL SUBJECT\n   ↑        ↑          ↑\n dummy   agrees with  this\n\nThere IS  a book  on the table.\nThere ARE many books on the table."},

 s2:[
 {h:"'There' is a dummy — it carries no number",
  en:"Grammarians call 'there' an 'expletive' or 'dummy subject'. It is a placeholder that lets you delay the real subject. It has no singular or plural form of its own, so it can never decide the verb.",
  ta:"இலக்கண அறிஞர்கள் 'there'-ஐ 'dummy subject' என்று அழைக்கிறார்கள். அது உண்மையான Subject-ஐத் தாமதப்படுத்த உதவும் ஒரு இடம்பிடிப்பான். அதற்கு சொந்தமாக ஒருமை அல்லது பன்மை வடிவம் கிடையாது, எனவே அது ஒருபோதும் வினைச்சொல்லைத் தீர்மானிக்க முடியாது.",
  tl:"Ilakkana arignargal 'there'-ai 'dummy subject' endru azhaikkiraargal. Adhu unmaiyaana Subject-aith thaamadhappaduththa udhavum oru idampidippaan. Adharku sondhamaaga orumai alladhu panmai vadivam kidaiyaadhu."},
 {h:"With a list, the verb follows the FIRST item",
  en:"'There IS a pen and two books on the desk.' The verb sits next to 'a pen', which is singular, so 'is' is correct. If you reverse it — 'There ARE two books and a pen' — the verb becomes plural. Word order decides.",
  ta:"ஒரு பட்டியல் வரும்போது, வினைச்சொல் முதல் பொருளைப் பின்பற்றும். 'There IS a pen and two books on the desk.' வினைச்சொல் 'a pen'-க்கு அருகில் இருக்கிறது, அது ஒருமை, எனவே 'is' சரி. தலைகீழாக்கினால் — 'There ARE two books and a pen' — வினைச்சொல் பன்மையாகிவிடும். சொல் வரிசைதான் தீர்மானிக்கிறது.",
  tl:"Oru pattiyal varumbodhu, vinaichol mudhal porulaip pinpatrum. 'There IS a pen and two books on the desk.' Vinaichol 'a pen'-kku arugil irukkiradhu, adhu orumai, enave 'is' sari."},
 {h:"HERE works exactly the same way",
  en:"'Here comes the bus' (singular) but 'Here come the buses' (plural). Same principle: the real subject follows the verb.",
  ta:"'HERE'-உம் அதேபோலவே செயல்படுகிறது. 'Here comes the bus' (ஒருமை) ஆனால் 'Here come the buses' (பன்மை). அதே கொள்கை: உண்மையான Subject வினைச்சொல்லுக்குப் பின் வருகிறது.",
  tl:"'HERE'-um adhepolave seyalpadugiradhu. 'Here comes the bus' (orumai) aanaal 'Here come the buses' (panmai)."}],

 s3:[
 {h:"Read the sentence backwards",
  d:"  There  ARE  many books  on the table.\n    ↑          ↑\n  dummy    REAL SUBJECT (plural)\n            ╰──── verb agrees with this\n\n  REWRITE IT:  Many books ARE on the table.  ✔\n  Now the subject is obvious."},
 {h:"With a list, the nearest item wins",
  d:"  There IS  a pen and two books on the desk.\n            ↑\n       first item (singular) → IS\n\n  There ARE two books and a pen on the desk.\n            ↑\n       first item (plural) → ARE"}],

 s4:{
 wrong:["\"'There' is the subject, and it is one word, so singular.\" — 'There' is never the subject.",
  "\"'There's many people here' — everyone says it.\" — Common in speech, wrong in the exam.",
  "\"With a list I should look at the whole list.\" — No, look only at the first item after the verb."],
 right:["Cover the word 'there' and read the rest of the sentence.",
  "Rewrite the sentence in normal order: subject first, verb second.",
  "With a list, match the verb to the FIRST item only."]},

 s5:[
 {en:"There is a book on the table.",ta:"மேசையின் மீது ஒரு புத்தகம் இருக்கிறது.",tl:"Mesaiyin meedhu oru puththagam irukkiradhu.",note:"Real subject = 'a book' (singular) → IS."},
 {en:"There are many books on the table.",ta:"மேசையின் மீது பல புத்தகங்கள் இருக்கின்றன.",tl:"Mesaiyin meedhu pala puththagangal irukkindrana.",note:"Real subject = 'many books' (plural) → ARE."},
 {en:"There have been several complaints against him.",ta:"அவருக்கு எதிராகப் பல புகார்கள் வந்துள்ளன.",tl:"Avarukku edhiraagap pala pugaargal vandhullana.",note:"Real subject = 'several complaints' → HAVE BEEN."},
 {en:"There is a boy and two girls in the room.",ta:"அறையில் ஒரு பையனும் இரண்டு பெண்களும் இருக்கிறார்கள்.",tl:"Araiyil oru paiyanum irandu pengalum irukkiraargal.",note:"First item = 'a boy' (singular) → IS."},
 {en:"Here comes the bus we have been waiting for.",ta:"நாம் காத்திருந்த பேருந்து இதோ வருகிறது.",tl:"Naam kaaththirundha perundhu idho varugiradhu.",note:"Real subject = 'the bus' → COMES."}],

 s7:[

 s9:[

 "Sentence Improvement|There was two boys and a girl waiting outside the office.|was;were;is|1|First item = 'two boys' (plural) → WERE.",
 "Find the Error|Here come (A) the bus (B) that we have been (C) waiting for (D).|A;B;C;D|0|Part A. Real subject = 'the bus' (singular) → 'Here comes'.",

 s10:{
  en:"Spoken English says 'There's many people' constantly, so the wrong form feels natural. The exam also uses lists to trip you: 'There ____ a pen and two books on the desk' — your eye jumps to 'two books' and you write ARE, but the verb must follow the FIRST item, 'a pen'. And it uses uncountable nouns: 'There ____ a lot of water' takes IS, not ARE.",
  ta:"பேச்சு ஆங்கிலத்தில் 'There's many people' என்று தொடர்ந்து சொல்கிறோம், எனவே தவறான வடிவம் இயற்கையாகத் தோன்றும். தேர்வு பட்டியல்களையும் பயன்படுத்தி உங்களை வீழ்த்தும்: 'There ____ a pen and two books on the desk' — உங்கள் கண் 'two books'-க்குத் தாவும், நீங்கள் ARE என்று எழுதுவீர்கள், ஆனால் வினைச்சொல் முதல் பொருளான 'a pen'-ஐப் பின்பற்ற வேண்டும். மேலும் எண்ண முடியாத பெயர்ச்சொற்களையும் பயன்படுத்தும்.",
  tl:"Pechu Aangilaththil 'There's many people' endru thodarndhu solgirom, enave thavaraana vadivam iyarkaiyaagath thondrum. Thervu pattiyalgalaiyum payanpaduththi ungalai veezhththum. Vinaichol mudhal porulaana 'a pen'-aip pinpatra vendum."},

 s11:{
  en:"COVER THE WORD 'THERE'. Read what is left. That noun decides the verb.",
  ta:"'THERE' அப்படிங்கிற வார்த்தையை மூடுங்கள். மீதி இருப்பதைப் படியுங்கள். அந்தப் பெயர்ச்சொல்தான் வினைச்சொல்லைத் தீர்மானிக்கும்.",
  tl:"'THERE' appadingira vaarththaiyai moodungal. Meedhi iruppadhaip padiyungal. Andhap peyarchol-dhaan vinaicholaith theermaanikkum.",
  vis:"      REWRITE IN NORMAL ORDER\n\n  There ARE many books on the table.\n           ↓ rewrite\n  Many books ARE on the table.     ✔ obvious now\n\n  There IS a book on the table.\n           ↓ rewrite\n  A book IS on the table.          ✔ obvious now\n\n  'THERE' is a ghost. It has no number."},

 s13:[
 "There ____ a number of complaints, but the number of actual cases ____ still small.|are-is;is-are;are-are|0|'A number of complaints' → ARE (Rule 38). 'The number of cases' → IS.",
 "There ____ neither the teacher nor the students in the classroom when the inspector arrived.|was;were;are|1|'Neither...nor' takes the nearest → 'students' (plural) → WERE.",
 "There ____ five kilometres of road to be repaired, and two hours ____ not enough for it.|is-is;are-is;is-are|0|'Five kilometres' as one distance → IS. 'Two hours' as one period → IS.",
 "Here ____ the officers who ____ been appointed only last week.|come-have;comes-has;come-has|0|'Officers' is plural → COME. 'Who' refers to 'officers' → HAVE BEEN.",
 "There ____ more than one candidate and more than one examiner in the room at that time.|was;were;is|1|Two 'more than one' units joined by AND (Rule 40) → WERE."],

 s14:{
  rule:"'There' is never the subject. The verb agrees with the noun that follows it.",
  formula:"THERE + VERB + REAL SUBJECT  →  verb copies the REAL SUBJECT",
  memory:"Cover 'there' and rewrite the sentence in normal order.",
  ta:"'There'-ஐ மூடிட்டு, வாக்கியத்தை சாதாரண வரிசையில் மாத்தி எழுதுங்க.",
  tl:"'There'-ai moodittu, vaakkiyaththai saadhaarana varisaiyil maaththi ezhudhunga.",
  mistake:"Saying 'There is many...' because spoken English allows it, and matching the verb to the second item in a list.",
  exam:"SSC CHSL / MTS and RRB — easy marks if you rewrite the sentence."},

 s15:[
 {ta:"இந்த rule ரொம்ப எளிமையானது, ஆனா நாம பேச்சுல தினமும் தப்பு பண்ணுறோம். 'There's many people here' அப்படின்னு நாம சொல்லுவோம், படிக்கிற ஆங்கிலத்துலயும் கேட்போம். ஆனா அது தப்பு. சரியான வடிவம் 'There ARE many people here'.",
  tl:"Indha rule romba elimaiyaanadhu, aanaa naama pechula dhinamum thappu pannurom. 'There's many people here' appadinnu naama solluvom. Aanaa adhu thappu. Sariyaana vadivam 'There ARE many people here'."},
 {ta:"முதல்ல ஒரு விஷயம் புரிஞ்சுக்கோங்க. 'There' அப்படிங்கிறது Subject இல்ல. அது ஒரு போலி Subject — ஆங்கிலத்துல 'dummy subject' அப்படின்னு சொல்லுவாங்க. அது வெறும் வாக்கியத்தை ஆரம்பிக்க உதவும் ஒரு வார்த்தை. அதுக்கு ஒருமை பன்மை அப்படின்னு எதுவும் கிடையாது.",
  tl:"Mudhalla oru vishayam purinjukkonga. 'There' appadingiradhu Subject illa. Adhu oru poli Subject — Aangilaththula 'dummy subject' appadinnu solluvaanga. Adhu verum vaakkiyaththai aarambikka udhavum oru vaarththai."},
 {ta:"அப்போ உண்மையான Subject எங்க இருக்கு? Verb-க்கு அப்பறம். 'There are many books on the table' — உண்மையான Subject 'many books'. பன்மை. அதனால ARE. ஒரு எளிமையான வழி சொல்லுறேன்: வாக்கியத்தை சாதாரண வரிசையில் மாத்தி எழுதுங்க. 'Many books are on the table.' இப்போ Subject தெளிவா தெரியுது இல்லையா?",
  tl:"Appo unmaiyaana Subject enga irukku? Verb-kku apparam. 'There are many books on the table' — unmaiyaana Subject 'many books'. Panmai. Adhanaala ARE. Oru elimaiyaana vazhi solluren: vaakkiyaththai saadhaarana varisaiyil maaththi ezhudhunga."},
 {ta:"இப்போ SSC-ஓட ஒரு நுட்பமான பொறி சொல்லுறேன். பட்டியல் வரும்போது கவனமா இருக்கணும். 'There ____ a pen and two books on the desk.' இப்போ என்ன போடுவீங்க? நிறைய பேரு ARE போடுவாங்க, 'two books' பார்த்து. ஆனா சரியான பதில் IS. ஏன்? ஏன்னா verb-க்கு உடனே அப்பறம் இருக்கிறது 'a pen'. ஒருமை. Verb முதல் பொருளைத்தான் பார்க்கும்.",
  tl:"Ippo SSC-oda oru nutpamaana pori solluren. Pattiyal varumbodhu kavanamaa irukkanum. 'There ____ a pen and two books on the desk.' Neraiya peru ARE poduvaanga. Aanaa sariyaana padhil IS. Yennaa verb-kku udane apparam irukkiradhu 'a pen'. Orumai."},
 {ta:"கடைசியா — 'Here'-உம் அதேபோலத்தான். 'Here comes the bus' — bus ஒருமை, அதனால comes. 'Here come the buses' — buses பன்மை, அதனால come. 'There' மற்றும் 'Here' ரெண்டுமே போலி Subject. ரெண்டுக்கும் ஒரே விதி. வாக்கியத்தை திருப்பிப் போட்டுப் பாருங்க, பதில் தானா வரும்.",
  tl:"Kadaisiyaa — 'Here'-um adhepoladhaan. 'Here comes the bus' — bus orumai, adhanaala comes. 'Here come the buses' — buses panmai, adhanaala come. 'There' matrum 'Here' rendume poli Subject."}]},

/* ========== RULE 44 ========== */
{n:44,rc:"SVA-14",d:"Hard",t:"ONE OF THE + Plural Noun + WHO + Plural Verb",
 tam:"'One of the boys who...' — who-க்குப் பின் பன்மை வினைச்சொல் · who-kkup pin panmai vinaichol",
 s1:{en:"In the structure 'one of the + plural noun + who/that', the verb inside the relative clause agrees with the PLURAL NOUN, not with 'one'. But adding 'THE ONLY' flips it to singular.",
  ta:"'one of the + பன்மைப் பெயர்ச்சொல் + who/that' என்ற அமைப்பில், relative clause-க்குள் இருக்கும் வினைச்சொல் பன்மைப் பெயர்ச்சொல்லுடன் ஒத்துப்போகும், 'one'-உடன் அல்ல. ஆனால் 'THE ONLY' சேர்த்தால் அது ஒருமையாக மாறிவிடும்.",
  tl:"'one of the + panmaip peyarchol + who/that' endra amaippil, relative clause-kkul irukkum vinaichol panmaip peyarcholudan oththuppogum, 'one'-udan alla. Aanaal 'THE ONLY' serthaal adhu orumaiyaaga maarividum.",
  formula:"ONE OF THE + plural noun + WHO + PLURAL VERB\nTHE ONLY ONE OF THE + plural noun + WHO + SINGULAR VERB\n\nHe is one of the boys who HAVE passed.\nHe is the only one of the boys who HAS passed."},

 s2:[
 {h:"Who does 'who' refer to?",
  en:"A relative pronoun always refers to the noun immediately before it. In 'one of the boys who...', the word just before 'who' is 'boys' — plural. So the clause verb is plural. The main verb of the sentence still follows 'one' and stays singular.",
  ta:"Relative pronoun எப்போதும் தனக்கு உடனே முன்னால் இருக்கும் பெயர்ச்சொல்லைக் குறிக்கும். 'one of the boys who...' இதில் 'who'-க்கு உடனே முன்னால் இருக்கும் சொல் 'boys' — பன்மை. எனவே clause வினைச்சொல் பன்மை. வாக்கியத்தின் முதன்மை வினைச்சொல் இன்னும் 'one'-ஐப் பின்பற்றி ஒருமையாகவே இருக்கும்.",
  tl:"Relative pronoun eppodhum thanakku udane munnaal irukkum peyarcholaik kurikkum. 'one of the boys who...' idhil 'who'-kku udane munnaal irukkum sol 'boys' — panmai. Enave clause vinaichol panmai."},
 {h:"The meaning test",
  en:"'He is one of the boys who have passed' means: many boys passed, and he is one of them. The 'have passed' describes the BOYS, not him. Say it in Tamil and the logic becomes obvious.",
  ta:"பொருள் சோதனை. 'He is one of the boys who have passed' என்றால்: பல பையன்கள் தேர்ச்சி பெற்றார்கள், அவனும் அவர்களில் ஒருவன். 'have passed' என்பது பையன்களை விவரிக்கிறது, அவனை அல்ல. தமிழில் சொல்லிப் பாருங்கள், logic தெளிவாகிவிடும்.",
  tl:"Porul sodhanai. 'He is one of the boys who have passed' endraal: pala paiyangal thercchi petraargal, avanum avargalil oruvan. 'have passed' enbadhu paiyangalai vivarikkiradhu, avanai alla."},
 {h:"THE ONLY reverses everything",
  en:"'He is the only one of the boys who HAS passed' means: many boys took the exam, but only HE passed. Now 'who' refers to 'the only one' — singular. The two little words 'the only' change the entire sentence.",
  ta:"'THE ONLY' எல்லாவற்றையும் தலைகீழாக்கும். 'He is the only one of the boys who HAS passed' என்றால்: பல பையன்கள் தேர்வு எழுதினார்கள், ஆனால் அவன் மட்டுமே தேர்ச்சி பெற்றான். இப்போது 'who' என்பது 'the only one'-ஐக் குறிக்கிறது — ஒருமை. 'the only' என்ற இரண்டு சின்ன வார்த்தைகள் முழு வாக்கியத்தையும் மாற்றிவிடுகின்றன.",
  tl:"'THE ONLY' ellaavatraiyum thalaigeezhaakkum. 'He is the only one of the boys who HAS passed' endraal: pala paiyangal thervu ezhudhinaargal, aanaal avan mattume thercchi petraan. Ippodhu 'who' enbadhu 'the only one'-aik kurikkiradhu — orumai."}],

 s3:[
 {h:"WHO looks at the word just before it",
  d:"  He is one of the BOYS  who  HAVE  passed.\n                     ↑      ↑     ↑\n              plural noun  refers  plural verb\n                          back to BOYS\n\n  MEANING: many boys passed, he is one of them."},
 {h:"Add THE ONLY and everything flips",
  d:"  He is THE ONLY one of the boys who HAS passed.\n           ↑                          ↑\n     now 'who' refers to           singular verb\n     'the only one'\n\n  MEANING: only HE passed, nobody else did."},
 {h:"Two verbs in one sentence",
  d:"  He  IS  one of the boys who  HAVE  passed.\n       ↑                          ↑\n   main verb                 clause verb\n  follows 'He'                follows 'boys'\n   (singular)                  (plural)"}],

 s4:{
 wrong:["\"'One' is the subject, so the verb after 'who' must be singular.\" — 'Who' refers to 'boys', not to 'one'.",
  "\"'One of the boys who has passed' sounds correct.\" — It sounds fine but breaks the reference rule.",
  "\"Adding 'the only' makes no difference.\" — It completely reverses the verb."],
 right:["Find the word immediately before 'who'. That is what 'who' refers to.",
  "Say the meaning aloud: did MANY people do it, or only ONE?",
  "Look for 'the only'. If it is there, the clause verb becomes singular."]},

 s9:[

 s10:{
  en:"Two sentences look almost identical but need opposite verbs. 'One of the boys who HAVE passed' versus 'The only one of the boys who HAS passed'. The exam prints one of them and offers the other verb. It also confuses this rule with Rule 50: 'One of the boys IS absent' is singular because there is no 'who'. The presence or absence of 'who' and 'the only' is the entire question.",
  ta:"இரண்டு வாக்கியங்கள் கிட்டத்தட்ட ஒரே மாதிரி தெரியும், ஆனால் எதிரெதிர் வினைச்சொற்கள் தேவை. 'One of the boys who HAVE passed' மற்றும் 'The only one of the boys who HAS passed'. தேர்வு ஒன்றை அச்சிட்டு மற்றொன்றின் வினைச்சொல்லைத் தரும். மேலும் இந்த விதியை Rule 50-உடன் குழப்பும்: 'One of the boys IS absent' — இங்கே 'who' இல்லாததால் ஒருமை. 'who' இருக்கிறதா, 'the only' இருக்கிறதா என்பதுதான் முழு கேள்வியும்.",
  tl:"Irandu vaakkiyangal kittaththatta ore maadhiri theriyum, aanaal edhiredhir vinaichorkal thevai. Thervu ondrai achittu matrondrin vinaicholaith tharum. Melum indha vidhiyai Rule 50-udan kuzhappum. 'who' irukkiradhaa, 'the only' irukkiradhaa enbadhudhaan muzhu kelviyum."},

 s11:{
  en:"LOOK AT THE WORD JUST BEFORE 'WHO'. That is what 'who' refers to. Then hunt for 'the only' — it flips everything.",
  ta:"'WHO'-க்கு உடனே முன்னால் இருக்கும் சொல்லைப் பாருங்கள். அதைத்தான் 'who' குறிக்கிறது. பிறகு 'the only'-ஐத் தேடுங்கள் — அது எல்லாவற்றையும் தலைகீழாக்கும்.",
  tl:"'WHO'-kku udane munnaal irukkum sollaip paarungal. Adhaith-thaan 'who' kurikkiradhu. Piragu 'the only'-aith thedungal — adhu ellaavatraiyum thalaigeezhaakkum.",
  vis:"      TWO SENTENCES, TWO VERBS\n\n  one of the boys who  HAVE  passed\n         ↑                ↑\n    many passed      plural verb\n\n  THE ONLY one of the boys who  HAS  passed\n     ↑                            ↑\n  only he passed              singular verb\n\n  SEARCH FOR THE WORDS 'THE ONLY'.\n  Found → singular.  Not found → plural."},

 s13:[

 s14:{
  rule:"In 'one of the + plural noun + who', the clause verb is plural. 'The only one of' makes it singular.",
  formula:"ONE OF THE + plural + WHO + PLURAL VERB\nTHE ONLY ONE OF THE + plural + WHO + SINGULAR VERB",
  memory:"'Who' refers to the word right before it. Hunt for 'the only'.",
  ta:"'Who' தனக்கு முன்னாடி இருக்கிற வார்த்தையைத்தான் குறிக்கும். 'The only' இருக்கானு தேடுங்க.",
  tl:"'Who' thanakku munnaadi irukkira vaarththaiyaith-thaan kurikkum. 'The only' irukkaanu thedunga.",
  mistake:"Using a singular verb after 'who' because 'one' appears at the start of the phrase.",
  exam:"SSC CGL Tier-1 favourite. Also very common in Bank PO Error Spotting."},

 s15:[
 {ta:"இந்த rule-ல ரொம்ப பேரு தப்பு பண்ணுவாங்க, ஏன்னா 'one' அப்படிங்கிற வார்த்தை ஆரம்பத்துலயே இருக்கு. 'One' அப்படின்னா ஒண்ணு, ஒருமை. அதனால verb-உம் ஒருமையா இருக்கணும் அப்படின்னு நினைப்போம். ஆனா இல்ல.",
  tl:"Indha rule-la romba peru thappu pannuvaanga, yennaa 'one' appadingira vaarththai aarambaththulaye irukku. 'One' appadinnaa onnu, orumai. Adhanaala verb-um orumaiyaa irukkanum appadinnu ninaippom. Aanaa illa."},
 {ta:"அர்த்தத்தை யோசிச்சுப் பாருங்க — இதுதான் திறவுகோல். 'He is one of the boys who have passed.' இதுக்கு தமிழ்ல அர்த்தம் என்ன? 'தேர்ச்சி பெற்ற பையன்களில் அவனும் ஒருவன்.' இப்போ சொல்லுங்க — தேர்ச்சி பெற்றது யாரு? பையன்கள். பலர். பன்மை. அதனால HAVE.",
  tl:"Arththaththai yosichup paarunga — idhudhaan thiravugol. 'He is one of the boys who have passed.' Idhukku Tamil-la arththam enna? 'Thercchi petra paiyangalil avanum oruvan.' Ippo sollunga — thercchi petradhu yaaru? Paiyangal. Palar. Panmai. Adhanaala HAVE."},
 {ta:"இலக்கண காரணமும் சிம்பிள். 'Who' அப்படிங்கிற வார்த்தை எப்பவும் தனக்கு உடனே முன்னாடி இருக்கிற பெயர்ச்சொல்லைத்தான் குறிக்கும். 'one of the boys who' — 'who'-க்கு உடனே முன்னாடி என்ன இருக்கு? 'boys'. பன்மை. அதனால clause-ல வர்ற verb பன்மை.",
  tl:"Ilakkana kaaranamum simple. 'Who' appadingira vaarththai eppavum thanakku udane munnaadi irukkira peyarcholaith-thaan kurikkum. 'one of the boys who' — 'who'-kku udane munnaadi enna irukku? 'boys'. Panmai."},
 {ta:"இப்போ ரொம்ப முக்கியமான மாற்றம். 'THE ONLY' சேர்ந்தா என்ன ஆகும்? 'He is THE ONLY one of the boys who HAS passed.' இப்போ அர்த்தம் என்ன? 'பையன்களில் அவன் மட்டும்தான் தேர்ச்சி பெற்றான்.' தேர்ச்சி பெற்றது யாரு? அவன் மட்டும். ஒருவன். ஒருமை. HAS. இந்த ரெண்டு சின்ன வார்த்தை — 'the only' — முழு வாக்கியத்தையும் திருப்பிப் போட்டுடும்.",
  tl:"Ippo romba mukkiyamaana maatram. 'THE ONLY' serndhaa enna aagum? 'He is THE ONLY one of the boys who HAS passed.' Ippo arththam enna? 'Paiyangalil avan mattum-dhaan thercchi petraan.' Oruvan. Orumai. HAS."},
 {ta:"இன்னொரு விஷயம் கவனிங்க — ஒரே வாக்கியத்துல ரெண்டு verb இருக்கு. 'He IS one of the boys who HAVE passed.' முதல் verb 'is' — அது 'He'-ஐ பார்த்து வருது, ஒருமை. ரெண்டாவது verb 'have' — அது 'boys'-ஐ பார்த்து வருது, பன்மை. ரெண்டும் வேற வேற Subject. குழம்பாதீங்க.",
  tl:"Innoru vishayam kavaninga — ore vaakkiyaththula rendu verb irukku. 'He IS one of the boys who HAVE passed.' Mudhal verb 'is' — adhu 'He'-ai paarththu varudhu, orumai. Randaavadhu verb 'have' — adhu 'boys'-ai paarththu varudhu, panmai."},
 {ta:"கடைசியா ஒரு பெரிய எச்சரிக்கை. இந்த rule-ஐ Rule 50-ஓட குழப்பிக்காதீங்க. 'One of the boys IS absent' — இங்க 'who' கிடையாது, அதனால verb 'one'-ஐ பார்த்து ஒருமை. ஆனா 'One of the boys who HAVE passed' — இங்க 'who' இருக்கு, அதனால clause verb பன்மை. 'who' இருக்கா இல்லையா அப்படின்னு முதல்ல பாருங்க. அதுதான் முழு கேள்வியும்.",
  tl:"Kadaisiyaa oru periya echcharikkai. Indha rule-ai Rule 50-oda kuzhappikkaadheenga. 'One of the boys IS absent' — inga 'who' kidaiyaadhu, adhanaala verb 'one'-ai paarththu orumai. Aanaa 'One of the boys who HAVE passed' — inga 'who' irukku, adhanaala clause verb panmai."}]},

/* ========== RULE 45 ========== */
{n:45,rc:"SVA-15",d:"Medium",t:"Infinitives, Gerunds and Clauses as Subjects are Singular",
 tam:"To-infinitive, -ing வடிவம், Clause — Subject ஆனால் ஒருமை · Subject aanaal orumai",
 s1:{en:"When the subject of a sentence is an infinitive (to + verb), a gerund (verb + ing) or a noun clause (what he says, that he is honest), the verb is SINGULAR — because each names ONE single action or idea.",
  ta:"ஒரு வாக்கியத்தின் Subject ஒரு infinitive (to + verb), ஒரு gerund (verb + ing) அல்லது ஒரு noun clause (what he says, that he is honest) ஆக இருக்கும்போது, வினைச்சொல் ஒருமையாக இருக்கும் — ஏனெனில் ஒவ்வொன்றும் ஒரே ஒரு செயலையோ கருத்தையோ குறிக்கிறது.",
  tl:"Oru vaakkiyaththin Subject oru infinitive (to + verb), oru gerund (verb + ing) alladhu oru noun clause aaga irukkumbodhu, vinaichol orumaiyaaga irukkum — yenenil ovvondrum ore oru seyalaiyo karuththaiyo kurikkiradhu.",
  formula:"TO + VERB       →  SINGULAR VERB\nVERB + ING      →  SINGULAR VERB\nWHAT / THAT ... →  SINGULAR VERB\n\nTo err IS human.\nSwimming IS good exercise.\nWhat he says IS true."},

 s2:[
 {h:"An action is one thing",
  en:"'Swimming' is one activity, however many strokes it involves. 'To err' is one behaviour. 'What he says' is one statement. English treats each of these as a single noun, so the verb is singular.",
  ta:"ஒரு செயல் என்பது ஒரே ஒரு விஷயம். 'Swimming' என்பது ஒரு செயல்பாடு, அதில் எத்தனை அசைவுகள் இருந்தாலும். 'To err' என்பது ஒரு நடத்தை. 'What he says' என்பது ஒரு கூற்று. ஆங்கிலம் இவை ஒவ்வொன்றையும் ஒரே ஒரு பெயர்ச்சொல்லாகக் கருதுகிறது, எனவே வினைச்சொல் ஒருமை.",
  tl:"Oru seyal enbadhu ore oru vishayam. 'Swimming' enbadhu oru seyalpaadu, adhil eththanai asaivugal irundhaalum. Aangilam ivai ovvondraiyum ore oru peyarcholaagak karudhugiradhu, enave vinaichol orumai."},
 {h:"But TWO gerunds joined by AND become plural",
  en:"'Reading and writing ARE two different skills' — here you have two separate activities joined by AND, so Rule 32 applies and the verb becomes plural. One action = singular. Two actions = plural.",
  ta:"ஆனால் AND-ஆல் இணைக்கப்பட்ட இரண்டு gerund-கள் பன்மையாகும். 'Reading and writing ARE two different skills' — இங்கே AND-ஆல் இணைக்கப்பட்ட இரண்டு தனித்தனி செயல்பாடுகள் உள்ளன, எனவே Rule 32 பொருந்தும், வினைச்சொல் பன்மையாகிவிடும். ஒரு செயல் = ஒருமை. இரண்டு செயல்கள் = பன்மை.",
  tl:"Aanaal AND-aal inaikkappatta irandu gerund-kal panmaiyaagum. 'Reading and writing ARE two different skills'. Oru seyal = orumai. Irandu seyalgal = panmai."},
 {h:"The plural noun inside the phrase is a decoy",
  en:"'Reading BOOKS is my hobby' — the plural 'books' sits right next to the verb but it is only the object of the gerund. The subject is 'reading books' as one whole activity → IS.",
  ta:"தொடருக்குள் இருக்கும் பன்மைப் பெயர்ச்சொல் ஒரு ஏமாற்று. 'Reading BOOKS is my hobby' — பன்மையான 'books' வினைச்சொல்லுக்கு அருகிலேயே அமர்ந்திருக்கிறது, ஆனால் அது gerund-ன் object மட்டுமே. Subject என்பது 'reading books' என்ற ஒரே முழு செயல்பாடு → IS.",
  tl:"Thodarukkul irukkum panmaip peyarchol oru emaatru. 'Reading BOOKS is my hobby' — panmaiyaana 'books' vinaicholukku arugileye amarndhirukkiradhu, aanaal adhu gerund-in object mattume."}],

 s3:[
 {h:"Wrap the whole phrase in a box",
  d:"  ┌──────────────────┐\n  │  Reading books   │   IS   my hobby.\n  └──────────────────┘    ↑\n     ONE ACTIVITY     singular verb\n\n  The plural 'books' is INSIDE the box.\n  It cannot reach the verb."},
 {h:"One action or two?",
  d:"  Swimming             IS  good exercise.   (one activity)\n\n  Reading and writing  ARE two skills.      (two activities)\n         ↑\n     AND makes it plural (Rule 32)"},
 {h:"The 'IT' replacement test",
  d:"  What he says is true.\n       ↓ replace with IT\n  IT   is true.          ✔ works → singular\n\n  To err is human.\n       ↓\n  IT is human.           ✔ works → singular"}],

 s4:{
 wrong:["\"'Reading books' — 'books' is plural, so the verb is plural.\" — 'Books' is the object inside the gerund phrase.",
  "\"'What the witnesses said' — 'witnesses' is plural, so plural verb.\" — The whole clause is one statement.",
  "\"Swimming and running involve many movements, so plural.\" — Each names one activity."],
 right:["Draw a mental box around the whole subject phrase. Treat the box as one noun.",
  "Replace the whole phrase with 'IT'. If it fits, use a singular verb.",
  "Count the ACTIONS, not the words. Two actions joined by AND → plural."]},

 s5:[
 {en:"To err is human, to forgive divine.",ta:"தவறு செய்வது மனித இயல்பு, மன்னிப்பது தெய்வீகம்.",tl:"Thavaru seyvadhu manidha iyalbu, mannippadhu dheiveegam.",note:"Infinitive subject → IS."},
 {en:"Swimming is the best exercise for the whole body.",ta:"நீச்சல் என்பது உடல் முழுவதற்கும் சிறந்த உடற்பயிற்சி.",tl:"Neechal enbadhu udal muzhuvadharkum sirandha udarpayirchi.",note:"Gerund subject → IS."},
 {en:"What he says is always true.",ta:"அவர் சொல்வது எப்போதும் உண்மை.",tl:"Avar solvadhu eppodhum unmai.",note:"Noun clause subject → IS."},
 {en:"Reading books is my favourite hobby.",ta:"புத்தகங்கள் படிப்பது என்னுடைய விருப்பமான பொழுதுபோக்கு.",tl:"Puththagangal padippadhu ennudaiya viruppamaana pozhudhupokku.",note:"'Books' is only the object; the subject is the whole activity → IS."},
 {en:"Reading and writing are two different skills.",ta:"படிப்பதும் எழுதுவதும் இரண்டு வெவ்வேறு திறன்கள்.",tl:"Padippadhum ezhudhuvadhum irandu vevveru thirangal.",note:"Two activities joined by AND → ARE."}],

 s7:[
 "To err ____ human.|is|Easy|Infinitive subject.",
 "Swimming ____ good for health.|is|Easy|Gerund subject.",
 "Walking in the morning ____ beneficial.|is|Easy|Gerund subject.",
 "What he says ____ always correct.|is|Medium|Noun clause subject.",
 "Reading books ____ my hobby.|is|Medium|'Books' is the object, not the subject.",
 "Reading and writing ____ two skills.|are|Medium|Two activities joined by AND.",
 "To read good books ____ a great pleasure.|is|Medium|One infinitive activity.",
 "Smoking cigarettes ____ injurious to health.|is|Hard|'Cigarettes' is the object.",
 "What the witnesses said ____ recorded carefully.|was|Hard|The whole clause is one statement.",
 "That he is honest ____ known to everyone.|is|Hard|Noun clause subject.",
 "Solving these puzzles ____ taken me all evening.|has|Hard|'Puzzles' is the object.",
 "Singing and dancing ____ her two passions.|are|Expert|Two activities → plural.",
 "To forgive your enemies ____ not easy.|is|Expert|One infinitive activity.",
 "Whether he comes or not ____ irrelevant to us.|is|Expert|Noun clause subject.",
 "Collecting old coins ____ become a serious hobby for him.|has|Expert|'Coins' is the object."],

 s8:[
 "To err are human.|To err is human.|An infinitive subject is singular.",
 "Swimming are good exercise.|Swimming is good exercise.|A gerund subject is singular.",
 "What he says are true.|What he says is true.|A noun clause subject is singular.",
 "Reading books are my hobby.|Reading books is my hobby.|'Books' is the object, not the subject.",
 "Reading and writing is two skills.|Reading and writing are two skills.|Two activities joined by AND.",
 "Smoking cigarettes are harmful.|Smoking cigarettes is harmful.|One activity.",
 "What the witnesses said were recorded.|What the witnesses said was recorded.|The whole clause is one statement.",
 "That he is honest are known to all.|That he is honest is known to all.|Noun clause subject.",
 "Singing and dancing is her passions.|Singing and dancing are her passions.|Two activities → plural.",
 "Collecting old coins have become his hobby.|Collecting old coins has become his hobby.|'Coins' is the object."],

 s9:[
 "Find the Error|Reading good books (A) are one of the best (B) ways to improve (C) your vocabulary (D).|A;B;C;D|1|Part B. The gerund subject is singular → 'is one of the best ways'.",
 "Fill in the Blank|What the villagers told the officer ____ later found to be completely false.|was;were|0|The noun clause is one statement → WAS.",
 "Sentence Improvement|To forgive your enemies are not an easy thing to do.|are;is;were|1|An infinitive subject is singular → IS.",
 "Find the Error|Singing and dancing (A) is her (B) two greatest (C) passions in life (D).|A;B;C;D|1|Part B. Two activities joined by AND → 'are her two greatest passions'.",
 "Fill in the Blank|Solving these difficult puzzles ____ taken him the whole evening.|has;have|0|The gerund phrase is one activity → HAS."],

 s11:{
  en:"BOX THE WHOLE SUBJECT. Everything inside the box counts as ONE noun, however many plurals hide inside it.",
  ta:"முழு Subject-ஐயும் ஒரு பெட்டிக்குள் அடையுங்கள். பெட்டிக்குள் எத்தனை பன்மைகள் ஒளிந்திருந்தாலும், முழுப் பெட்டியும் ஒரே ஒரு பெயர்ச்சொல்லாகவே கணக்கிடப்படும்.",
  tl:"Muzhu Subject-aiyum oru pettikkul adaiyungal. Pettikkul eththanai panmaigal olindhirundhaalum, muzhup pettiyum ore oru peyarcholaagave kanakkidappadum.",
  vis:"   ┌────────────────────────────┐\n   │  What the witnesses said   │  WAS  recorded.\n   └────────────────────────────┘   ↑\n           ONE STATEMENT       singular verb\n\n   'witnesses' is plural, but it is INSIDE the box.\n   It never touches the verb.\n\n   TEST: replace the box with 'IT'.\n   IT was recorded.  ✔"},

 s10:{
  en:"The exam plants a plural noun inside the subject phrase, right next to the verb. 'Reading BOOKS ____ my hobby' and 'What the WITNESSES said ____ recorded' both put a plural word in your line of sight. But that word is only an object or part of the clause. The other trap is two gerunds joined by AND, where the verb genuinely turns plural.",
  ta:"தேர்வு Subject தொடருக்குள், வினைச்சொல்லுக்கு அருகிலேயே ஒரு பன்மைப் பெயர்ச்சொல்லை நடும். 'Reading BOOKS ____ my hobby' மற்றும் 'What the WITNESSES said ____ recorded' — இரண்டுமே உங்கள் பார்வையில் ஒரு பன்மைச் சொல்லை வைக்கின்றன. ஆனால் அந்தச் சொல் ஒரு object மட்டுமே, அல்லது clause-ன் ஒரு பகுதி மட்டுமே. மற்றொரு பொறி AND-ஆல் இணைக்கப்பட்ட இரண்டு gerund-கள் — அங்கே வினைச்சொல் உண்மையிலேயே பன்மையாகிவிடும்.",
  tl:"Thervu Subject thodarukkul, vinaicholukku arugileye oru panmaip peyarcholai nadum. Aanaal andhach sol oru object mattume, alladhu clause-in oru paguthi mattume. Matroru pori AND-aal inaikkappatta irandu gerund-kal."},

 s13:[
 "What the two witnesses said in court ____ later proved false, though each of them ____ under oath.|was-was;were-were;was-were|0|The noun clause is one statement → WAS. 'Each of them' → WAS.",
 "Reading good books, along with regular writing practice, ____ the best way to improve English.|are;is;were|1|Rule 31 removes 'along with...'. The gerund subject → IS.",
 "Neither swimming nor long walks ____ helped him lose the weight he ____ gained last year.|has-had;have-had;have-has|1|'Neither...nor' takes the nearest → 'long walks' → HAVE. Earlier past action → HAD.",
 "To err ____ human, but to repeat the same mistake twice ____ carelessness.|is-are;is-is;are-is|1|Both infinitive subjects are singular → IS and IS.",
 "Singing and dancing ____ her passions, and one of the songs she wrote ____ won an award.|are-has;is-has;are-have|0|Two activities joined by AND → ARE. 'One of the songs' → HAS (Rule 50)."],

 s14:{
  rule:"Infinitive, gerund and noun-clause subjects take a singular verb.",
  formula:"TO + V1  /  V + ING  /  WHAT-THAT clause   →  SINGULAR VERB",
  memory:"Box the whole subject. One box = one noun = one verb.",
  ta:"முழு Subject-ஐயும் ஒரு பெட்டியில அடைங்க. ஒரு பெட்டி = ஒரு பெயர்ச்சொல் = ஒருமை வினைச்சொல்.",
  tl:"Muzhu Subject-aiyum oru pettiyila adainga. Oru petti = oru peyarchol = orumai vinaichol.",
  mistake:"Matching the verb to a plural noun that sits inside the subject phrase.",
  exam:"SSC CGL / CHSL and Bank PO — common in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule-ல ஒரு சின்ன மனநிலை மாற்றம் வேணும். நாம பொதுவா Subject-ன்னா ஒரு வார்த்தை அப்படின்னு நினைப்போம் — 'Ram', 'books', 'the boy'. ஆனா Subject ஒரு முழு தொடரா, ஒரு முழு clause-ஆ கூட இருக்கலாம்.",
  tl:"Indha rule-la oru chinna mananilai maatram venum. Naama podhuvaa Subject-nnaa oru vaarththai appadinnu ninaippom — 'Ram', 'books', 'the boy'. Aanaa Subject oru muzhu thodaraa, oru muzhu clause-aa kooda irukkalaam."},
 {ta:"'Reading books is my hobby.' இங்க Subject என்ன? 'books' இல்ல. Subject 'Reading books' — முழுசா. புத்தகம் படிக்கிற செயல். ஒரே ஒரு செயல். அதனால IS. 'books' அப்படிங்கிறது gerund-ஓட object மட்டும்தான். அது verb-ஐ தொட முடியாது.",
  tl:"'Reading books is my hobby.' Inga Subject enna? 'books' illa. Subject 'Reading books' — muzhusaa. Puththagam padikkira seyal. Ore oru seyal. Adhanaala IS. 'books' appadingiradhu gerund-oda object mattum-dhaan."},
 {ta:"ஒரு நல்ல படம் மனசுல வெச்சுக்கோங்க. முழு Subject தொடரையும் ஒரு பெட்டிக்குள்ள போடுங்க. அந்த பெட்டிக்குள்ள எத்தனை பன்மை வார்த்தை இருந்தாலும் பரவாயில்ல — பெட்டி ஒண்ணுதான். ஒரு பெட்டி = ஒரு பெயர்ச்சொல் = ஒருமை verb.",
  tl:"Oru nalla padam manasula vechukkonga. Muzhu Subject thodaraiyum oru pettikkulla podunga. Andha pettikkulla eththanai panmai vaarththai irundhaalum paravaayilla — petti onnu-dhaan. Oru petti = oru peyarchol = orumai verb."},
 {ta:"Clause வரும்போது இது இன்னும் தெளிவா தெரியும். 'What the witnesses said WAS recorded.' இங்க 'witnesses' பன்மை, verb-க்கு பக்கத்துலயே இருக்கு. ஆனா Subject 'What the witnesses said' — அவங்க சொன்ன விஷயம். ஒரு கூற்று. ஒண்ணு. WAS. 'IT was recorded' அப்படின்னு மாத்திப் பாருங்க — சரியா இருக்கு. அதனால ஒருமை.",
  tl:"Clause varumbodhu idhu innum thelivaa theriyum. 'What the witnesses said WAS recorded.' Inga 'witnesses' panmai, verb-kku pakkaththulaye irukku. Aanaa Subject 'What the witnesses said' — avanga sonna vishayam. Oru kootru. Onnu. WAS."},
 {ta:"கடைசியா ஒரு விதிவிலக்கு — AND. 'Reading and writing ARE two skills.' இங்க ரெண்டு தனித்தனி செயல் இருக்கு — படிக்கிறது ஒரு செயல், எழுதுறது இன்னொரு செயல். ரெண்டு பெட்டி. அதனால பன்மை. இது Rule 32-ஓட logic. அதனால கேள்வி இதுதான்: 'எத்தனை செயல்?' ஒண்ணுன்னா ஒருமை. ரெண்டுன்னா பன்மை. வார்த்தையை எண்ணாதீங்க, செயலை எண்ணுங்க.",
  tl:"Kadaisiyaa oru vidhivilakku — AND. 'Reading and writing ARE two skills.' Inga rendu thanithani seyal irukku. Rendu petti. Adhanaala panmai. Adhanaala kelvi idhudhaan: 'eththanai seyal?' Onnunnaa orumai. Rendunnaa panmai. Vaarththaiyai ennaadheenga, seyalai ennunga."}]},
/* ========== RULE 46 ========== */
{n:46,rc:"SVA-16",d:"Medium",t:"Fractions, Percentages and MAJORITY follow the Noun after OF",
 tam:"பின்னம், சதவீதம், Majority — 'of'-க்குப் பின் வரும் பெயர்ச்சொல்லைப் பின்பற்றும்",
 s1:{en:"With fractions (two-thirds of), percentages (sixty per cent of) and 'the majority of', the verb agrees with the noun that follows 'of'. A fraction has no number of its own — it takes the number of whatever it measures.",
  ta:"பின்னங்கள் (two-thirds of), சதவீதங்கள் (sixty per cent of) மற்றும் 'the majority of' — இவற்றுடன் வரும் வினைச்சொல், 'of'-க்குப் பின் வரும் பெயர்ச்சொல்லுடன் ஒத்துப்போகும். ஒரு பின்னத்திற்கு சொந்தமாக எண் கிடையாது — அது எதை அளக்கிறதோ அதன் எண்ணை எடுத்துக்கொள்கிறது.",
  tl:"Pinnangal (two-thirds of), sadhaveedhangal (sixty per cent of) matrum 'the majority of' — ivatrudan varum vinaichol, 'of'-kkup pin varum peyarcholudan oththuppogum. Oru pinnaththirku sondhamaaga en kidaiyaadhu.",
  formula:"FRACTION / PERCENTAGE / MAJORITY  +  OF  +  NOUN  +  VERB\n                                                 ↑        ↑\n                                           LOOK HERE   copy it\n\nTwo-thirds of the WORK    IS  done.\nTwo-thirds of the WORKERS ARE absent."},

 s2:[
 {h:"A fraction measures — it does not count",
  en:"'Two-thirds' sounds plural because of the -s, but it is only a measuring word. Two-thirds of a cake is still cake. Two-thirds of the workers are still workers. The thing being measured decides.",
  ta:"'Two-thirds' -s விகுதியால் பன்மை போலக் கேட்கிறது, ஆனால் அது வெறும் அளவீட்டுச் சொல் மட்டுமே. கேக்கில் மூன்றில் இரண்டு பங்கு இன்னும் கேக்தான். தொழிலாளர்களில் மூன்றில் இரண்டு பங்கு இன்னும் தொழிலாளர்கள்தான். அளக்கப்படும் பொருள்தான் தீர்மானிக்கிறது.",
  tl:"'Two-thirds' -s vigudhiyaal panmai polak ketkiradhu, aanaal adhu verum alaveettuch sol mattume. Alakkappadum porul-dhaan theermaanikkiradhu."},
 {h:"POPULATION, PUBLIC, MAJORITY — the tricky group nouns",
  en:"'Sixty per cent of the population LIVES in villages' — 'population' is one body, so singular. But 'The majority of the students ARE present' — 'students' is plural. And 'The majority WAS in favour' is singular when 'majority' stands alone as one body.",
  ta:"POPULATION, PUBLIC, MAJORITY — தந்திரமான கூட்டுப் பெயர்கள். 'Sixty per cent of the population LIVES in villages' — 'population' ஒரே அமைப்பு, எனவே ஒருமை. ஆனால் 'The majority of the students ARE present' — 'students' பன்மை. மேலும் 'The majority WAS in favour' — 'majority' தனியாக ஒரே அமைப்பாக நிற்கும்போது ஒருமை.",
  tl:"POPULATION, PUBLIC, MAJORITY — thandhiramaana koottup peyargal. 'Population' ore amaippu, enave orumai. Aanaal 'students' panmai."},
 {h:"This is the same engine as Rule 37",
  en:"Rule 37 covered most of / some of / all of. Rule 46 covers fractions, percentages and majority. The mechanism is identical: jump over 'of' and copy the noun. Learn them as one family.",
  ta:"இது Rule 37-ன் அதே இயந்திரம். Rule 37 most of / some of / all of ஆகியவற்றை உள்ளடக்கியது. Rule 46 பின்னங்கள், சதவீதங்கள், majority ஆகியவற்றை உள்ளடக்குகிறது. செயல்முறை ஒன்றுதான்: 'of'-ஐத் தாண்டிக் குதித்து பெயர்ச்சொல்லை நகலெடுங்கள். இரண்டையும் ஒரே குடும்பமாகக் கற்றுக்கொள்ளுங்கள்.",
  tl:"Idhu Rule 37-in adhe iyandhiram. Seyalmurai ondru-dhaan: 'of'-aith thaandik kudhiththu peyarcholai nagaledungal. Irandaiyum ore kudumbamaagak katrukkollungal."}],

 s3:[
 {h:"The fraction is a measuring cup",
  d:"   🥤 two-thirds of  →  [ WATER ]     →  IS   (uncountable)\n   🥤 two-thirds of  →  [ STUDENTS ]  →  ARE  (plural)\n\n   The cup has no number.\n   What is IN the cup decides."},
 {h:"Population versus students",
  d:"  60% of the POPULATION  LIVES  in villages.\n              ↑\n        one body → singular\n\n  60% of the VOTERS      HAVE   registered.\n              ↑\n        many people → plural"}],

 s4:{

  "\"'Sixty per cent' is a big number, so plural.\" — The noun after 'of' decides, not the size.",

 s10:{
  en:"POPULATION is the star trap here. 'Sixty per cent of the population ____ in villages' — students see 'population' and think of crores of people, so they write LIVE. But 'population' as one demographic body takes LIVES. The same applies to public, audience, majority, crowd and staff. The other trap is uncountable nouns after 'of' — equipment, information, furniture.",
  ta:"POPULATION-தான் இங்கே முக்கிய பொறி. 'Sixty per cent of the population ____ in villages' — மாணவர்கள் 'population'-ஐப் பார்த்து கோடிக்கணக்கான மக்களை நினைத்து LIVE என்று எழுதுவார்கள். ஆனால் 'population' ஒரே மக்கள்தொகை அமைப்பாக LIVES-ஐ எடுக்கும். இதே public, audience, majority, crowd, staff ஆகியவற்றுக்கும் பொருந்தும். மற்றொரு பொறி 'of'-க்குப் பின் வரும் எண்ண முடியாத பெயர்ச்சொற்கள் — equipment, information, furniture.",
  tl:"POPULATION-dhaan inge mukkiya pori. Maanavargal 'population'-aip paarththu kodikkanakkaana makkalai ninaiththu LIVE endru ezhudhuvaargal. Aanaal 'population' ore makkalthogai amaippaaga LIVES-ai edukkum."},

 s11:{
  en:"JUMP OVER 'OF' — same as Rule 37. The fraction is only a measuring cup.",
  ta:"'OF'-ஐத் தாண்டிக் குதியுங்கள் — Rule 37 போலவே. பின்னம் என்பது வெறும் அளவீட்டுக் கோப்பை மட்டுமே.",
  tl:"'OF'-aith thaandik kudhiyungal — Rule 37 polave. Pinnam enbadhu verum alaveettuk koppai mattume.",
  vis:"     THE MEASURING-CUP FAMILY\n     (Rule 37 + Rule 46 = one idea)\n\n   most of        ┐\n   some of        │\n   all of         │\n   half of        ├──►  jump over OF\n   none of        │     copy the noun\n   two-thirds of  │\n   60 per cent of │\n   the majority of┘\n\n   WATCH: population / public / audience\n          = one body = singular verb"},

 s14:{
  rule:"Fractions, percentages and 'the majority of' take the number of the noun after 'of'.",
  formula:"FRACTION / % / MAJORITY + OF + NOUN + VERB → verb copies the NOUN",
  memory:"The fraction is a measuring cup. What is inside decides.",
  ta:"பின்னம் ஒரு அளவு கோப்பை. உள்ள என்ன இருக்கோ அதுதான் முடிவு பண்ணும்.",
  tl:"Pinnam oru alavu koppai. Ulla enna irukko adhudhaan mudivu pannum.",
  mistake:"Writing a plural verb because the fraction ends in -s, or treating 'population' as plural.",
  exam:"SSC CGL / CHSL, RRB NTPC and Bank — often combined with the uncountable-noun rule."},

 s15:[
 {ta:"இந்த rule Rule 37-ஓட இரட்டை சகோதரன். அங்க 'most of', 'some of' பார்த்தோம். இங்க பின்னம், சதவீதம் பார்க்குறோம். ஆனா இயந்திரம் ஒண்ணுதான் — 'of'-ஐ தாண்டி குதிச்சு, அடுத்த பெயர்ச்சொல்ல இறங்குங்க.",
  tl:"Indha rule Rule 37-oda irattai sagodharan. Anga 'most of', 'some of' paarththom. Inga pinnam, sadhaveedham paarkkurom. Aanaa iyandhiram onnu-dhaan — 'of'-ai thaandi kudhichu, aduththa peyarcholla irangunga."},
 {ta:"ஒரு படம் மனசுல வெச்சுக்கோங்க — அளவு கோப்பை. 'Two-thirds of' அப்படிங்கிறது ஒரு கோப்பை. கோப்பைக்கு சொந்தமா எந்த எண்ணும் கிடையாது. நீங்க உள்ள தண்ணீர் ஊத்தினா, அது தண்ணீர். எண்ண முடியாதது. IS. நீங்க உள்ள மாணவர்களை போட்டா, அது மாணவர்கள். பன்மை. ARE.",
  tl:"Oru padam manasula vechukkonga — alavu koppai. 'Two-thirds of' appadingiradhu oru koppai. Koppaikku sondhamaa endha ennum kidaiyaadhu. Neenga ulla thanneer ooththinaa, adhu thanneer. IS. Maanavargalai pottaa, panmai. ARE."},
 {ta:"இப்போ இந்த rule-ஓட மிகப்பெரிய பொறி சொல்லுறேன் — POPULATION. 'Sixty per cent of the population ____ in villages.' இப்போ என்ன போடுவீங்க? கிட்டத்தட்ட எல்லாரும் LIVE போடுவாங்க. ஏன்? ஏன்னா 'population' அப்படின்னா கோடிக்கணக்கான மக்கள். ஆனா சரியான பதில் LIVES.",
  tl:"Ippo indha rule-oda migapperiya pori solluren — POPULATION. 'Sixty per cent of the population ____ in villages.' Kittaththatta ellaarum LIVE poduvaanga. Yennaa 'population' appadinnaa kodikkanakkaana makkal. Aanaa sariyaana padhil LIVES."},
 {ta:"ஏன்? ஏன்னா 'population' அப்படிங்கிறது ஒரு எண்ணிக்கை, ஒரு அமைப்பு. நீங்க 'one population', 'two populations' அப்படின்னு சொல்ல மாட்டீங்க இல்லையா? ஒரு நாட்டுக்கு ஒரு மக்கள்தொகைதான். ஒண்ணு. அதனால ஒருமை. இதே public, audience, crowd, staff, majority-க்கும் பொருந்தும் — அவை தனியா நின்னா ஒரே அமைப்பு.",
  tl:"Yennaa 'population' appadingiradhu oru ennikkai, oru amaippu. Neenga 'one population', 'two populations' appadinnu solla maatteenga illaiyaa? Oru naattukku oru makkalthogai-dhaan. Onnu. Adhanaala orumai. Idhe public, audience, crowd, staff, majority-kkum porundhum."},
 {ta:"கடைசியா ஒரு practical tip. இந்த rule-ல வர்ற எல்லா கேள்வியிலயும் ஒரே ஒரு விஷயம்தான் பாக்கணும் — 'of'-க்கு அப்பறம் என்ன வார்த்தை இருக்கு? அது எண்ண முடியுமா, முடியாதா? எண்ண முடிஞ்சா, அது பன்மையா ஒருமையா? இந்த மூணு கேள்வியை கேட்டா, பதில் தானா வரும். மேலும் Rule 37, 46, 48 மூணுமே ஒரே குடும்பம் — ஒண்ணா படிங்க.",
  tl:"Kadaisiyaa oru practical tip. Indha rule-la varra ellaa kelviyilayum ore oru vishayam-dhaan paakkanum — 'of'-kku apparam enna vaarththai irukku? Adhu enna mudiyumaa, mudiyaadhaa? Melum Rule 37, 46, 48 moonume ore kudumbam — onnaa padinga."}]},

/* ========== RULE 47 ========== */
{n:47,rc:"SVA-17",d:"Medium",t:"PEOPLE, POLICE and CATTLE always take a Plural Verb",
 tam:"People, Police, Cattle, Poultry, Gentry, Clergy — எப்போதும் பன்மை",
 s1:{en:"People, police, cattle, poultry, gentry, clergy, vermin, folk, offspring, swine and peasantry are plural in meaning. They take NO -s and ALWAYS take a PLURAL verb.",
  ta:"People, police, cattle, poultry, gentry, clergy, vermin, folk, offspring, peasantry — இவை பொருளில் பன்மை. இவை -s விகுதி எடுக்காது, ஆனால் எப்போதும் பன்மை வினைச்சொல்லையே எடுக்கும்.",
  tl:"People, police, cattle, poultry, gentry, clergy, vermin, folk, offspring, peasantry — ivai porulil panmai. Ivai -s vigudhi edukkaadhu, aanaal eppodhum panmai vinaicholaiye edukkum.",
  formula:"NO -s  BUT  PLURAL VERB\n\nThe police HAVE arrested the thief.\nCattle ARE grazing in the field.\nMany people WERE injured.\nThe clergy HAVE opposed the bill."},

 s2:[
 {h:"These words already contain the plural",
  en:"'Police' means the whole force — many officers. 'Cattle' means many animals. 'People' means many persons. The plural is built into the meaning, so English does not add -s. But the verb still has to be plural.",
  ta:"இந்தச் சொற்களுக்குள்ளேயே பன்மை அடங்கியிருக்கிறது. 'Police' என்றால் முழுப் படை — பல அதிகாரிகள். 'Cattle' என்றால் பல விலங்குகள். 'People' என்றால் பல நபர்கள். பன்மை பொருளுக்குள்ளேயே கட்டமைக்கப்பட்டிருக்கிறது, எனவே ஆங்கிலம் -s சேர்ப்பதில்லை. ஆனால் வினைச்சொல் இன்னும் பன்மையாகவே இருக்க வேண்டும்.",
  tl:"Indhach sorkalukkulleye panmai adangiyirukkiradhu. 'Police' endraal muzhup padai — pala adhigaarigal. Panmai porulukkulleye kattamaikkappattirukkiradhu, enave Aangilam -s serppadhillai."},
 {h:"When PEOPLES is correct",
  en:"'Peoples' with an -s is correct only when it means NATIONS or RACES: 'the peoples of Asia', 'the indigenous peoples of America'. In every other case, 'people' with no -s is the plural.",
  ta:"'Peoples' என்று -s உடன் எழுதுவது தேசங்கள் அல்லது இனங்கள் என்று பொருள்படும்போது மட்டுமே சரி: 'the peoples of Asia', 'the indigenous peoples of America'. மற்ற எல்லா இடங்களிலும், -s இல்லாத 'people'தான் பன்மை.",
  tl:"'Peoples' endru -s udan ezhudhuvadhu desangal alladhu inangal endru porulpadumbodhu mattume sari: 'the peoples of Asia'. Matra ellaa idangalilum, -s illaadha 'people'-dhaan panmai."},
 {h:"Do not confuse these with collective nouns",
  en:"'Team', 'committee' and 'jury' can go either way (Rule 14 territory). But 'police', 'cattle' and 'people' are FIXED plural. 'The police is investigating' is always wrong.",
  ta:"இவற்றை கூட்டுப் பெயர்களுடன் குழப்பிக் கொள்ளாதீர்கள். 'Team', 'committee', 'jury' ஆகியவை இரு வழிகளிலும் செல்லலாம். ஆனால் 'police', 'cattle', 'people' ஆகியவை நிலையான பன்மை. 'The police is investigating' எப்போதுமே தவறு.",
  tl:"Ivatrai koottup peyargaludan kuzhappik kollaadheergal. 'Team', 'committee', 'jury' aagiyavai iru vazhigalilum sellalaam. Aanaal 'police', 'cattle', 'people' aagiyavai nilaiyaana panmai."}],

 s3:[
 {h:"No -s, but still plural",
  d:"   POLICE   👮👮👮👮   =  many officers   →  HAVE\n   CATTLE   🐄🐄🐄🐄   =  many animals    →  ARE\n   PEOPLE   🧑🧑🧑🧑   =  many persons    →  WERE\n\n   The word looks singular.\n   The meaning is plural.\n   The verb follows the MEANING."},
 {h:"Two different families",
  d:"  ALWAYS PLURAL            CAN GO EITHER WAY\n  ─────────────            ─────────────────\n  people                   team\n  police                   committee\n  cattle                   jury\n  poultry                  family\n  gentry                   government\n  clergy                   audience\n  vermin                   staff\n  peasantry                crowd"}],

 s4:{
 wrong:["\"'Police' has no -s, so it is singular.\" — The plural is in the meaning, not the spelling.",
  "\"'Many peoples were injured' — adding -s makes it more plural.\" — 'Peoples' means nations, not persons.",
  "\"'The police is investigating' sounds right in news reports.\" — Indian newspapers write it, but it is wrong."],
 right:["Memorise the fixed-plural list: people, police, cattle, poultry, gentry, clergy, vermin, peasantry.",
  "Never add -s to these words for ordinary meaning.",
  "Always use a plural verb: are, were, have, do."]},

 s5:[
 {en:"The police have arrested the thief.",ta:"காவல்துறையினர் திருடனைக் கைது செய்துவிட்டனர்.",tl:"Kaavalthuraiyinar thirudanaik kaidhu seydhuvittanar.",note:"'Police' is always plural → HAVE."},
 {en:"Cattle are grazing in the field.",ta:"கால்நடைகள் வயலில் மேய்ந்து கொண்டிருக்கின்றன.",tl:"Kaalnadaigal vayalil meyndhu kondirukkindrana.",note:"'Cattle' takes no -s but is plural → ARE."},
 {en:"Many people were injured in the accident.",ta:"விபத்தில் பலர் காயமடைந்தனர்.",tl:"Vibaththil palar kaayamadaindhanar.",note:"'People' is the plural of person → WERE."},
 {en:"The clergy have opposed the new law.",ta:"மதகுருமார்கள் புதிய சட்டத்தை எதிர்த்துள்ளனர்.",tl:"Madhagurumaargal pudhiya sattaththai edhirththullanar.",note:"'Clergy' is plural → HAVE."}],

 s6:["people|மக்கள் / நபர்கள்|Makkal / Nabargal",

  "poultry|கோழி வளர்ப்பு பறவைகள்|Kozhi valarppu paravaigal",

  "have arrested|கைது செய்துவிட்டனர்|Kaidhu seydhuvittanar",

 s9:[
 "Find the Error|The police (A) has arrested (B) three suspects (C) in connection with the robbery (D).|A;B;C;D|1|Part B. 'Police' is always plural → 'have arrested'.",
 "Fill in the Blank|Cattle ____ been grazing in this field since morning.|has;have|1|'Cattle' is always plural → HAVE BEEN.",
 "Sentence Improvement|Many peoples were affected by the sudden flood in the district.|peoples were;people were;people was|1|'People' is the plural of person.",
 "Find the Error|The clergy (A) in this region (B) has always supported (C) social reform (D).|A;B;C;D|2|Part C. 'Clergy' is plural → 'have always supported'.",
 "Fill in the Blank|The police, as well as the local volunteers, ____ working round the clock.|is;are|1|Subject = police (plural) → ARE."],

 s10:{
  en:"'The police is investigating' appears in Indian newspapers every single day, so it feels completely correct. That is exactly why SSC tests it. The second trap is 'peoples' — students add -s thinking it makes the word more plural, but 'peoples' means nations. The third trap is combining this rule with Rule 31 or Rule 35, where the plural noun must survive a parenthetical phrase or lose to a nearest-subject rule.",
  ta:"'The police is investigating' என்பது இந்தியச் செய்தித்தாள்களில் தினமும் வருகிறது, எனவே அது முற்றிலும் சரியாகத் தோன்றும். அதனால்தான் SSC இதைச் சோதிக்கிறது. இரண்டாவது பொறி 'peoples' — மாணவர்கள் இன்னும் பன்மையாக்க -s சேர்க்கிறார்கள், ஆனால் 'peoples' என்றால் தேசங்கள். மூன்றாவது பொறி இந்த விதியை Rule 31 அல்லது Rule 35-உடன் இணைப்பது.",
  tl:"'The police is investigating' enbadhu Indhiyach seydhiththaalgalil dhinamum varugiradhu, enave adhu mutrilum sariyaagath thondrum. Adhanaal-dhaan SSC idhaich sodhikkiradhu. Irandaavadhu pori 'peoples' — 'peoples' endraal desangal."},

 s11:{
  en:"NO -s, BUT ALWAYS PLURAL. The plural is hidden inside the meaning.",
  ta:"-s இல்லை, ஆனால் எப்போதும் பன்மை. பன்மை பொருளுக்குள்ளேயே ஒளிந்திருக்கிறது.",
  tl:"-s illai, aanaal eppodhum panmai. Panmai porulukkulleye olindhirukkiradhu.",
  vis:"   MEMORY LINE — say it aloud:\n\n   \"PEOPLE, POLICE, CATTLE, POULTRY,\n    GENTRY, CLERGY, VERMIN, PEASANTRY\n         — ALL EIGHT ARE PLURAL.\"\n\n   No -s.  Always ARE / WERE / HAVE / DO.\n\n   ⚠ 'PEOPLES' with -s = NATIONS only.\n     the peoples of Asia  ✔\n     five peoples came    ✘"},

 s12:[

 "Cattle ____ grazing peacefully.|is;are|1",
 "Many people ____ present at the rally.|was;were|1",
 "The clergy ____ opposed the reform.|has;have|1",

 "The gentry ____ invited to the palace.|was;were|1",
 "Vermin ____ a serious problem in godowns.|is;are|1",
 "The police ____ made no arrest so far.|has;have|1",
 "Cattle in this village ____ well fed.|is;are|1",
 "The peasantry ____ protesting today.|is;are|1",
 "Several people ____ lost their homes.|has;have|1",
 "The police ____ questioning the suspects.|is;are|1",
 "Offspring of these fish ____ very small.|is;are|1",
 "Poultry ____ been affected by bird flu.|has;have|1",
 "The clergy ____ divided on this issue.|is;are|1",

 s13:[
 "The police, along with the fire brigade, ____ been working at the site since midnight.|has;have;had|1|Rule 31 removes 'along with the fire brigade'. 'Police' is always plural → HAVE BEEN.",
 "Neither the cattle nor the shepherd ____ been found, though the police ____ searching all night.|has-have;have-has;has-has|0|'Neither...nor' takes the nearest → 'shepherd' → HAS. 'Police' → HAVE.",
 "Many people who ____ affected by the cyclone ____ still living in relief camps.|was-is;were-are;were-is|1|'Who' refers to 'people' → WERE. Main verb also plural → ARE.",
 "Each of the villagers ____ compensated, but the peasantry as a whole ____ still unhappy.|were-is;was-are;was-is|1|'Each of' → WAS (Rule 50). 'Peasantry' is always plural → ARE.",
 "The clergy ____ divided on the issue, and the majority of the members ____ against the proposal.|is-is;are-are;are-is|1|'Clergy' → ARE. 'The majority of the members' → ARE (Rule 46)."],

 s14:{
  rule:"People, police, cattle, poultry, gentry, clergy, vermin and peasantry always take a plural verb.",
  formula:"NO -s  +  PLURAL VERB  (are / were / have / do)",
  memory:"Eight fixed-plural words. The plural is in the meaning, not the spelling.",
  ta:"எட்டு நிலையான பன்மை சொற்கள். பன்மை பொருள்ல இருக்கு, எழுத்துல இல்ல.",
  tl:"Ettu nilaiyaana panmai sorkal. Panmai porulla irukku, ezhuththula illa.",
  mistake:"Writing 'The police is' and adding -s to make 'peoples'.",
  exam:"SSC CGL / CHSL / MTS and RRB — 'The police is' is one of the most repeated planted errors."},

 s15:[
 {ta:"இந்த rule-ல நமக்கு ஒரு பெரிய பிரச்சனை இருக்கு — நம்ம செய்திதாள்ளயே தப்பா எழுதுறாங்க. 'The police is investigating the case' அப்படின்னு தினமும் படிக்கிறோம். அதனால நமக்கு அது சரி மாதிரி தோணுது. ஆனா அது தப்பு.",
  tl:"Indha rule-la namakku oru periya prachanai irukku — namma seydhithaallaye thappaa ezhudhuraanga. 'The police is investigating the case' appadinnu dhinamum padikkirom. Adhanaala namakku adhu sari maadhiri thonudhu. Aanaa adhu thappu."},
 {ta:"ஏன் பன்மை? 'Police' அப்படின்னா என்ன? ஒரு காவலரா? இல்ல. முழு காவல்துறை — நூற்றுக்கணக்கான அதிகாரிகள். பல பேரு. அதனால பன்மை. 'The police HAVE arrested the thief.' சரி.",
  tl:"Yen panmai? 'Police' appadinnaa enna? Oru kaavalaraa? Illa. Muzhu kaavalthurai — nootrukkanakkaana adhigaarigal. Pala peru. Adhanaala panmai. 'The police HAVE arrested the thief.' Sari."},
 {ta:"அதே மாதிரி 'cattle'. ஒரு மாடா? இல்ல, பல மாடு. 'People' — ஒரு நபரா? இல்ல, பல நபர். இந்த வார்த்தைகள்ல -s இல்ல, ஆனா பொருள்ல பன்மை இருக்கு. ஆங்கிலம் -s சேர்க்கல, ஏன்னா தேவையில்ல — பன்மை ஏற்கனவே உள்ள இருக்கு.",
  tl:"Adhe maadhiri 'cattle'. Oru maadaa? Illa, pala maadu. 'People' — oru nabaraa? Illa, pala nabar. Indha vaarththaigalla -s illa, aanaa porulla panmai irukku."},
 {ta:"இப்போ ஒரு முக்கியமான எச்சரிக்கை — 'peoples'. நிறைய பேரு 'இன்னும் பன்மையாக்கணும்' அப்படின்னு நினைச்சு 'Many peoples were injured' அப்படின்னு எழுதுவாங்க. இது தப்பு. 'Peoples' அப்படின்னா தேசங்கள், இனங்கள். 'The peoples of Asia' — ஆசியாவின் இனங்கள். சரி. ஆனா நபர்களைக் குறிக்கும்போது எப்பவும் 'people', -s இல்லாம.",
  tl:"Ippo oru mukkiyamaana echcharikkai — 'peoples'. Neraiya peru 'innum panmaiyaakkanum' appadinnu ninaichu 'Many peoples were injured' appadinnu ezhudhuvaanga. Idhu thappu. 'Peoples' appadinnaa desangal, inangal."},
 {ta:"இந்த எட்டு வார்த்தையையும் ஒரு பாட்டு மாதிரி மனப்பாடம் பண்ணுங்க: 'People, Police, Cattle, Poultry, Gentry, Clergy, Vermin, Peasantry — எட்டும் பன்மை.' தேர்வுல இந்த வார்த்தையை பார்த்தவுடனே இந்த வரி மனசுல வரணும். அப்புறம் ARE, WERE, HAVE — பன்மை verb போடுங்க. முடிஞ்சது.",
  tl:"Indha ettu vaarththaiyaiyum oru paattu maadhiri manappaadam pannunga: 'People, Police, Cattle, Poultry, Gentry, Clergy, Vermin, Peasantry — ettum panmai.' Appuram ARE, WERE, HAVE — panmai verb podunga."}]},

/* ========== RULE 48 ========== */
{n:48,rc:"SVA-18",d:"Easy",t:"A LOT OF, PLENTY OF and THE REST OF follow the Noun",
 tam:"A lot of, Plenty of, Rest of — 'of'-க்குப் பின் வரும் பெயர்ச்சொல்லைப் பின்பற்றும்",
 s1:{en:"A lot of, lots of, plenty of, the rest of and a good deal of take the number of the noun after 'of'. But a GREAT DEAL OF and a LARGE AMOUNT OF are always singular, while a LARGE NUMBER OF is always plural.",
  ta:"A lot of, lots of, plenty of, the rest of, a good deal of — இவை 'of'-க்குப் பின் வரும் பெயர்ச்சொல்லின் எண்ணை எடுக்கும். ஆனால் A GREAT DEAL OF மற்றும் A LARGE AMOUNT OF எப்போதும் ஒருமை, A LARGE NUMBER OF எப்போதும் பன்மை.",
  tl:"A lot of, lots of, plenty of, the rest of — ivai 'of'-kkup pin varum peyarcholin ennai edukkum. Aanaal A GREAT DEAL OF matrum A LARGE AMOUNT OF eppodhum orumai, A LARGE NUMBER OF eppodhum panmai.",
  formula:"A LOT OF / PLENTY OF / REST OF  +  NOUN  →  verb copies the NOUN\n\nA lot of MONEY    WAS  wasted.   (uncountable)\nA lot of PEOPLE   WERE waiting.  (plural)\n\nFIXED:  a great deal of / a large amount of  →  ALWAYS SINGULAR\n        a large number of                    →  ALWAYS PLURAL"},

 s2:[
 {h:"AMOUNT versus NUMBER — the deciding pair",
  en:"AMOUNT is for uncountable things: 'a large amount of water IS'. NUMBER is for countable things: 'a large number of bottles ARE'. If you can count it, use NUMBER and a plural verb. If you cannot, use AMOUNT and a singular verb.",
  ta:"AMOUNT மற்றும் NUMBER — தீர்மானிக்கும் ஜோடி. AMOUNT என்பது எண்ண முடியாதவற்றுக்கு: 'a large amount of water IS'. NUMBER என்பது எண்ணக்கூடியவற்றுக்கு: 'a large number of bottles ARE'. எண்ண முடிந்தால் NUMBER மற்றும் பன்மை வினைச்சொல். முடியாவிட்டால் AMOUNT மற்றும் ஒருமை வினைச்சொல்.",
  tl:"AMOUNT matrum NUMBER — theermaanikkum jodi. AMOUNT enbadhu enna mudiyaadhavatrukku. NUMBER enbadhu ennakkoodiyavatrukku. Enna mudindhaal NUMBER matrum panmai vinaichol."},
 {h:"A GREAT DEAL OF is locked to singular",
  en:"'A great deal of' can only be used with uncountable nouns, so it is always singular: 'A great deal of time HAS been wasted.' You cannot say 'a great deal of books'.",
  ta:"'A great deal of' எண்ண முடியாத பெயர்ச்சொற்களுடன் மட்டுமே பயன்படுத்த முடியும், எனவே அது எப்போதும் ஒருமை: 'A great deal of time HAS been wasted.' 'A great deal of books' என்று சொல்ல முடியாது.",
  tl:"'A great deal of' enna mudiyaadha peyarchorkaludan mattume payanpaduththa mudiyum, enave adhu eppodhum orumai. 'A great deal of books' endru solla mudiyaadhu."},
 {h:"The third member of the measuring-cup family",
  en:"Rule 37 (most of), Rule 46 (fractions) and Rule 48 (a lot of) are one family with one mechanism. Only 'a great deal of', 'a large amount of' and 'a large number of' are fixed.",
  ta:"Rule 37 (most of), Rule 46 (பின்னங்கள்) மற்றும் Rule 48 (a lot of) — இவை ஒரே இயந்திரம் கொண்ட ஒரே குடும்பம். 'a great deal of', 'a large amount of', 'a large number of' மட்டுமே நிலையானவை.",
  tl:"Rule 37, Rule 46 matrum Rule 48 — ivai ore iyandhiram konda ore kudumbam. 'a great deal of', 'a large amount of', 'a large number of' mattume nilaiyaanavai."}],

 s3:[
 {h:"Countable or uncountable?",
  d:"  A LOT OF  +  money    →  can you count it?  NO  →  IS / WAS\n  A LOT OF  +  people   →  can you count it?  YES →  ARE / WERE\n\n  The phrase is the same. The noun decides."},
 {h:"AMOUNT and NUMBER",
  d:"  a large AMOUNT of water    IS   wasted.   (uncountable)\n  a large NUMBER of bottles  ARE  wasted.   (countable)\n            ↑\n   AMOUNT = cannot count  →  singular\n   NUMBER = can count     →  plural"}],

 s4:{
 wrong:["\"'A lot of' obviously means many, so plural.\" — Not when the noun is uncountable.",
  "\"'A large amount of students' is fine.\" — Students are countable, so it must be 'a large number of students'.",
  "\"'The rest of' is one thing, so singular.\" — It follows the noun after 'of'."],
 right:["Jump over 'of' and read the noun. Can you count it?",
  "Countable → NUMBER and a plural verb. Uncountable → AMOUNT and a singular verb.",
  "Remember the three fixed phrases: a great deal of and a large amount of are singular, a large number of is plural."]},

 s5:[

 s9:[

 s10:{
  en:"AMOUNT versus NUMBER is the real question here, and it is tested in Sentence Improvement more than in Error Spotting. 'A large amount of students' is offered as an option and looks perfectly normal — but students are countable, so it must be 'a large number of students'. The other trap is uncountable nouns after 'a lot of': equipment, furniture, luggage, work, information.",
  ta:"AMOUNT மற்றும் NUMBER-தான் இங்கே உண்மையான கேள்வி, அது Error Spotting-ஐ விட Sentence Improvement-ல் அதிகம் சோதிக்கப்படுகிறது. 'A large amount of students' ஒரு option-ஆகத் தரப்படும், அது முற்றிலும் இயல்பாகத் தெரியும் — ஆனால் மாணவர்கள் எண்ணக்கூடியவர்கள், எனவே 'a large number of students' என்றுதான் இருக்க வேண்டும். மற்றொரு பொறி 'a lot of'-க்குப் பின் வரும் எண்ண முடியாத பெயர்ச்சொற்கள்.",
  tl:"AMOUNT matrum NUMBER-dhaan inge unmaiyaana kelvi. 'A large amount of students' oru option-aagath tharappadum, adhu mutrilum iyalbaagath theriyum — aanaal maanavargal ennakkoodiyavargal, enave 'a large number of students' endrudhaan irukka vendum."},

 s11:{
  en:"CAN YOU COUNT IT? Countable → NUMBER and a plural verb. Uncountable → AMOUNT and a singular verb.",
  ta:"அதை எண்ண முடியுமா? எண்ணக்கூடியது → NUMBER மற்றும் பன்மை வினைச்சொல். எண்ண முடியாதது → AMOUNT மற்றும் ஒருமை வினைச்சொல்.",
  tl:"Adhai enna mudiyumaa? Ennakkoodiyadhu → NUMBER matrum panmai vinaichol. Enna mudiyaadhadhu → AMOUNT matrum orumai vinaichol.",
  vis:"    THE COUNT TEST\n\n   Can I say 'one, two, three...' ?\n\n   YES  →  a large NUMBER of  →  ARE / WERE / HAVE\n           bottles, students, files, books\n\n   NO   →  a large AMOUNT of  →  IS / WAS / HAS\n           water, money, work, information\n\n   FIXED SINGULAR: a great deal of\n   FIXED PLURAL  : a large number of"},
