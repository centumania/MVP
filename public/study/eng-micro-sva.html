 "Either Ram or his friends ____ coming.|are|Easy|Nearest = friends (plural).",
 "Neither the pen nor the book ____ mine.|is|Easy|Nearest = book (singular).",
 "Neither the pen nor the books ____ mine.|are|Easy|Nearest = books (plural).",
 "Either the boys or Ram ____ responsible.|is|Medium|Nearest = Ram (singular).",
 "Neither the teacher nor the students ____ present.|were|Medium|Nearest = students (plural).",
 "Either you or he ____ wrong.|is|Medium|Nearest = he → IS.",
 "Neither he nor I ____ responsible.|am|Hard|Nearest = I → AM. Person trap.",
 "Neither I nor my friends ____ responsible.|are|Hard|Nearest = friends → ARE.",
 "Either my brothers or my father ____ going to attend.|is|Hard|Nearest = father (singular).",
 "Not only the students but also the teacher ____ punished.|was|Hard|Nearest = teacher (singular).",
 "Not only the teacher but also the students ____ punished.|were|Hard|Nearest = students (plural).",
 "Neither you nor I ____ at fault here.|am|Expert|Nearest = I → AM.",
 "Neither I nor you ____ at fault here.|are|Expert|Nearest = you → ARE.",
 "Either the manager or his assistants ____ to be informed first.|have|Expert|Nearest = assistants (plural)."],

 s8:[
 "Either Ram or his friends is coming.|Either Ram or his friends are coming.|Nearest = friends (plural).",
 "Either the boys or Ram are coming.|Either the boys or Ram is coming.|Nearest = Ram (singular).",
 "Neither the teacher nor the students was present.|Neither the teacher nor the students were present.|Nearest = students (plural).",
 "Neither he nor I is responsible.|Neither he nor I am responsible.|Nearest = I, so the person changes too.",
 "Neither I nor my friends is guilty.|Neither I nor my friends are guilty.|Nearest = friends (plural).",
 "Either you or he are wrong.|Either you or he is wrong.|Nearest = he (singular).",
 "Not only the students but also the teacher were punished.|Not only the students but also the teacher was punished.|Nearest = teacher (singular).",
 "Either Ram nor Shyam is coming.|Either Ram or Shyam is coming.|EITHER pairs only with OR.",
 "Neither the pen or the book is mine.|Neither the pen nor the book is mine.|NEITHER pairs only with NOR.",
 "Neither of the boys were present.|Neither of the boys was present.|'Neither of' is always singular — different rule, do not confuse."],

 s9:[
 "Find the Error|Either the teacher (A) or the students (B) is present (C) in the hall (D).|A;B;C;D|2|Part C. Nearest subject = 'students' (plural) → 'are present'.",
 "Fill in the Blank|Neither Ram nor his friends ____ ready for the exam.|is;are|1|Nearest = friends (plural) → ARE.",
 "Sentence Improvement|Either the students or the principal are coming to the function.|are coming;is coming;were coming|1|Nearest = principal (singular) → IS coming.",
 "Find the Error|Neither he (A) nor I (B) is responsible (C) for this mistake (D).|A;B;C;D|2|Part C. Nearest = 'I' → must be 'am responsible'.",
 "Fill in the Blank|Not only the workers but also the supervisor ____ been suspended.|has;have|0|Nearest = supervisor (singular) → HAS BEEN."],

 s10:{
  en:"SSC knows exactly how you think. You see two subjects, you count them, you write a plural verb. But SSC does not care how many subjects there are — it only cares which one is NEAREST. The paper deliberately reverses the natural order and writes 'Either the boys or Ram ____' so that a plural noun sits far from the verb and a singular noun sits next to it. The second trap is PERSON: 'Neither he nor I ____' where the answer is AM, an option most candidates never even consider.",
  ta:"நீங்கள் எப்படி யோசிப்பீர்கள் என்பது SSC-க்குத் துல்லியமாகத் தெரியும். நீங்கள் இரண்டு Subject-களைப் பார்க்கிறீர்கள், அவற்றை எண்ணுகிறீர்கள், பன்மை வினைச்சொல்லை எழுதுகிறீர்கள். ஆனால் எத்தனை Subject இருக்கிறது என்பதைப் பற்றி SSC கவலைப்படுவதில்லை — எது அருகில் இருக்கிறது என்பதை மட்டுமே பார்க்கிறது. தேர்வுத்தாள் வேண்டுமென்றே இயற்கையான வரிசையை மாற்றி 'Either the boys or Ram ____' என்று எழுதும், அதனால் பன்மைப் பெயர்ச்சொல் வினைச்சொல்லிலிருந்து தூரத்திலும், ஒருமைப் பெயர்ச்சொல் அருகிலும் இருக்கும். இரண்டாவது பொறி PERSON: 'Neither he nor I ____' இதற்கான விடை AM — பெரும்பாலான தேர்வர்கள் இந்த option-ஐ யோசித்தே பார்ப்பதில்லை.",
  tl:"Neengal eppadi yosippeergal enbadhu SSC-kkuth thulliyamaagath theriyum. Neengal irandu Subject-kalaip paarkkireergal, avatrai ennugireergal, panmai vinaicholai ezhudhugireergal. Aanaal eththanai Subject irukkiradhu enbadhaip patri SSC kavalaippaduvadhillai — edhu arugil irukkiradhu enbadhai mattume paarkkiradhu. Irandaavadhu pori PERSON: 'Neither he nor I ____' idharkaana vidai AM."},

 s11:{
  en:"NEAREST WINS. The verb walks backwards, looks left, and grabs the very first subject it meets. Nothing beyond that exists.",
  ta:"அருகில் இருப்பதே வெல்லும். வினைச்சொல் பின்னோக்கி நடந்து, இடதுபுறம் பார்த்து, முதலில் சந்திக்கும் Subject-ஐப் பிடித்துக் கொள்ளும். அதற்கு அப்பால் எதுவும் இல்லை.",
  tl:"Arugil iruppadhe vellum. Vinaichol pinnokki nadandhu, idhupuram paarththu, mudhalil sandhikkum Subject-aip pidiththuk kollum. Adharku appaal edhuvum illai.",
  vis:"          THE VERB WALKS BACKWARDS\n\n   Ram  ──── or ────  friends  ────►  ARE\n    ✗                    ✓  ◄────────┘\n                             (verb looks LEFT,\n                              stops at the first\n                              subject it meets)\n\n   MEMORY LINE:  \"NEAREST WINS.\"\n   CHECK BOTH  :  number (is/are)  +  person (am/is/are)"},

 s13:[
 "Neither the principal nor the teachers, along with the peon, ____ available at the moment.|is;are;was|1|Rule 31 deletes 'along with the peon'. Then nearest = teachers (plural) → ARE.",
 "Either Ram or his friends ____ been waiting here since morning.|has;have;had|1|Nearest = friends (plural) → HAVE. 'Since morning' confirms present perfect continuous.",
 "Neither he nor I ____ aware that the office ____ closed the previous day.|am-had been;is-was;am-was|0|Nearest = I → AM. The earlier past action needs the past perfect → HAD BEEN.",
 "Not only the students but also each teacher ____ required to submit ____ report by Friday.|are-their;is-his;is-their|1|Nearest = 'each teacher' → IS. 'Each' also forces the singular pronoun HIS.",
 "Either the manager or the two assistants who ____ appointed last year ____ to be transferred.|was-has;were-have;were-has|1|'Who' refers to 'assistants' → WERE. Nearest subject to the main verb = assistants → HAVE."],

 s14:{
  rule:"With either…or / neither…nor, the verb agrees with the NEAREST subject in number AND person.",
  formula:"Either A or B + VERB  →  VERB follows B",
  memory:"NEAREST WINS. The verb looks left and stops at the first subject.",
  ta:"அருகில் இருப்பதே வெல்லும். Verb இடதுபுறம் பார்த்து முதல் Subject-ல நிக்கும். Number-உம் Person-உம் ரெண்டையும் check பண்ணுங்க.",
  tl:"Arugil iruppadhe vellum. Verb idhupuram paarththu mudhal Subject-la nikkum. Number-um Person-um rendaiyum check pannunga.",
  mistake:"Using a plural verb just because two subjects are visible — and forgetting that PERSON also follows the nearest subject.",
  exam:"The single most repeated SVA rule in SSC CGL, CHSL, MTS, RRB NTPC, SBI PO and IBPS."},

 s15:[
 {ta:"வாங்க, ஒரு வகுப்பறையில் இருக்கிற மாதிரி நினைச்சுக்கோங்க. நான் board-ல எழுதுறேன்: 'Either Ram or his friends ____ coming.' இப்போ class-ல கை தூக்கச் சொல்றேன். கிட்டத்தட்ட எல்லாரும் ARE-ன்னு சொல்லுவாங்க. சரி, அது சரியான பதில். ஆனா ஏன் சரி அப்படின்னு கேட்டா, பாதி பேரு 'ரெண்டு பேரு இருக்காங்க, அதனால பன்மை' அப்படின்னு சொல்லுவாங்க. அந்த காரணம் தப்பு. காரணம் தப்பா இருந்தா, அடுத்த கேள்விய நீங்க நிச்சயம் தப்பு பண்ணுவீங்க.",
  tl:"Vaanga, oru vagupparaiyil irukkira maadhiri ninaichukkonga. Naan board-la ezhudhuren: 'Either Ram or his friends ____ coming.' Ippo class-la kai thookkach solren. Kittaththatta ellaarum ARE-nnu solluvaanga. Sari, adhu sariyaana padhil. Aanaa yen sari appadinnu kettaa, paadhi peru 'rendu peru irukkaanga, adhanaala panmai' appadinnu solluvaanga. Andha kaaranam thappu."},
 {ta:"இப்போ நான் அதே வாக்கியத்தை தலைகீழா மாத்துறேன்: 'Either the boys or Ram ____ coming.' இப்போ சொல்லுங்க. அதே class-ல பாதி பேரு இன்னும் ARE-ன்னுதான் சொல்லுவாங்க — ஏன்னா 'boys' அப்படிங்கிற பன்மை வார்த்தை இன்னும் அங்க இருக்கு. ஆனா சரியான பதில் IS. ஏன்? ஏன்னா verb-க்கு பக்கத்துல இருக்கிறது 'Ram'. ஒருமை. அவ்ளோதான்.",
  tl:"Ippo naan adhe vaakkiyaththai thalaigeezhaa maaththuren: 'Either the boys or Ram ____ coming.' Ippo sollunga. Adhe class-la paadhi peru innum ARE-nnudhaan solluvaanga — yennaa 'boys' appadingira panmai vaarththai innum anga irukku. Aanaa sariyaana padhil IS. Yen? Yennaa verb-kku pakkaththula irukkiradhu 'Ram'. Orumai. Avlodhaan."},
 {ta:"இதை ஒரு படமா நினைச்சுக்கோங்க. Verb-க்கு கண் இருக்கு. அது எப்பவும் இடது பக்கம் திரும்பிப் பார்க்கும். திரும்பிப் பார்க்கும்போது முதல்ல எந்த Subject தெரியுதோ, அதை மட்டும் பிடிச்சுக்கும். அதுக்கு அப்பாறம் இருக்கிறது verb-க்கு தெரியவே தெரியாது. 'Either' அப்படிங்கிற வார்த்தையே 'ரெண்டுல ஒண்ணு' அப்படிங்கிற அர்த்தம். ரெண்டும் சேர்ந்து இல்ல. அதனாலதான் இந்த விதி.",
  tl:"Idhai oru padamaa ninaichukkonga. Verb-kku kan irukku. Adhu eppavum idhu pakkam thirumbip paarkkum. Thirumbip paarkkumbodhu mudhalla endha Subject theriyudho, adhai mattum pidichukkum. Adhukku appaaram irukkiradhu verb-kku theriyave theriyaadhu. 'Either' appadingira vaarththaiye 'rendula onnu' appadingira arththam."},
 {ta:"இப்போ இந்த rule-ல இருக்கிற ரகசியப் பொறியை சொல்லுறேன் — இது தெரிஞ்சவங்க ரொம்ப கம்மி. 'Neither he nor I ____ responsible.' இப்போ என்ன போடுவீங்க? நிறைய பேரு IS-ன்னு போடுவாங்க, 'he'-ஐ பார்த்து. இல்ல, சிலர் ARE-ன்னு போடுவாங்க, 'ரெண்டு பேரு' அப்படின்னு நினைச்சு. ரெண்டுமே தப்பு. சரியான பதில் AM. ஏன்? ஏன்னா verb-க்கு பக்கத்துல இருக்கிறது 'I'. 'I'-க்கு எப்பவும் AM. இது number மட்டும் இல்ல, PERSON-உம் அருகில் இருக்கிற Subject-ஐப் பார்த்தேதான் வரும்.",
  tl:"Ippo indha rule-la irukkira ragasiyap poriyai solluren — idhu therinjavanga romba kammi. 'Neither he nor I ____ responsible.' Ippo enna poduveenga? Neraiya peru IS-nnu poduvaanga. Illa, silar ARE-nnu poduvaanga. Rendume thappu. Sariyaana padhil AM. Yennaa verb-kku pakkaththula irukkiradhu 'I'. 'I'-kku eppavum AM."},
 {ta:"இன்னொரு முக்கியமான விஷயம். 'Either' எப்பவும் 'or'-ஓடதான் வரும். 'Neither' எப்பவும் 'nor'-ஓடதான் வரும். SSC 'Either Ram nor Shyam' அப்படின்னு எழுதி உங்களை ஏமாத்தும். இது தப்பு. ஜோடி எப்பவும் சரியா இருக்கணும். E-O, N-N. இப்படி நினைச்சுக்கோங்க: EithEr-Or, NeitheR-NoR.",
  tl:"Innoru mukkiyamaana vishayam. 'Either' eppavum 'or'-odadhaan varum. 'Neither' eppavum 'nor'-odadhaan varum. SSC 'Either Ram nor Shyam' appadinnu ezhudhi ungalai emaaththum. Idhu thappu. Jodi eppavum sariyaa irukkanum."},
 {ta:"கடைசியா ஒரு எச்சரிக்கை — இதுல ரொம்ப பேரு குழம்புவாங்க. 'Neither of the boys was present' — இங்க verb ஒருமை. ஆனா 'Neither the teacher nor the boys were present' — இங்க பன்மை. ஏன் வித்தியாசம்? ஏன்னா முதல் வாக்கியம் 'Neither OF' — அது வேற rule (Rule 50). ரெண்டாவது வாக்கியம் 'Neither...NOR' — அது இந்த rule. 'of' இருக்கா 'nor' இருக்கா அப்படின்னு பாருங்க. அதுதான் எல்லாத்தையும் தீர்மானிக்கும்.",
  tl:"Kadaisiyaa oru echcharikkai — idhula romba peru kuzhambuvaanga. 'Neither of the boys was present' — inga verb orumai. Aanaa 'Neither the teacher nor the boys were present' — inga panmai. Yen viththiyaasam? Yennaa mudhal vaakkiyam 'Neither OF' — adhu veru rule. Randaavadhu vaakkiyam 'Neither...NOR' — adhu indha rule. 'of' irukkaa 'nor' irukkaa appadinnu paarunga."}]},
/* ========== RULE 36 ========== */
{n:36,rc:"SVA-06",d:"Easy",t:"Indefinite Pronouns are Always Singular",
 tam:"Everyone, Nobody, Somebody — அனைத்தும் ஒருமை · Everyone, Nobody, Somebody — anaiththum orumai",
 s1:{en:"Everyone, everybody, everything, someone, somebody, something, anyone, anybody, anything, no one, nobody, nothing, each, either, neither and one are ALL singular and take singular verbs and singular pronouns.",
  ta:"Everyone, everybody, everything, someone, somebody, something, anyone, anybody, anything, no one, nobody, nothing, each, either, neither, one — இவை அனைத்தும் ஒருமை. இவை ஒருமை வினைச்சொல்லையும் ஒருமைப் பிரதிபெயரையும் எடுக்கும்.",
  tl:"Everyone, everybody, someone, somebody, anyone, anybody, no one, nobody, nothing, each, either, neither, one — ivai anaiththum orumai. Ivai orumai vinaicholaiyum orumaip pirathibeyaraiyum edukkum.",
  formula:"Any word ending in  -ONE / -BODY / -THING   →   SINGULAR VERB\n\nEveryone  IS  welcome.\nNobody    KNOWS the answer.\nSomething HAS  gone wrong."},

 s2:[
 {h:"Meaning is plural, grammar is singular",
  en:"'Everyone in the stadium' may be fifty thousand people, but grammatically 'everyone' is EVERY ONE — one person, then the next, then the next. English froze this as singular centuries ago and never changed it.",
  ta:"'Everyone in the stadium' என்றால் ஐம்பதாயிரம் பேராக இருக்கலாம், ஆனால் இலக்கண ரீதியாக 'everyone' என்பது EVERY ONE — ஒரு நபர், பிறகு அடுத்தவர், பிறகு அடுத்தவர். ஆங்கிலம் நூற்றாண்டுகளுக்கு முன்பே இதை ஒருமையாக நிலைநிறுத்திவிட்டது.",
  tl:"'Everyone in the stadium' endraal aimbadhaayiram peraaga irukkalaam, aanaal ilakkana reedhiyaaga 'everyone' enbadhu EVERY ONE — oru nabar, piragu aduththavar. Aangilam nootraandugalukku munbe idhai orumaiyaaga nilainiruththividdadhu."},
 {h:"The pronoun must be singular too",
  en:"'Everyone must do HIS duty', not 'their duty'. Modern spoken English accepts singular 'they', but SSC and Banking answer keys still mark HIS or HIS OR HER as correct. Know the exam standard, not the street standard.",
  ta:"'Everyone must do HIS duty' — 'their duty' அல்ல. நவீன பேச்சு ஆங்கிலம் ஒருமை 'they'-ஐ ஏற்றுக்கொள்கிறது, ஆனால் SSC மற்றும் Banking விடைத்தாள்கள் இன்னும் HIS அல்லது HIS OR HER-ஐத்தான் சரியாகக் குறிக்கின்றன. தெருவின் தரம் அல்ல, தேர்வின் தரம் தெரிந்திருக்க வேண்டும்.",
  tl:"'Everyone must do HIS duty' — 'their duty' alla. Naveena pechu Aangilam orumai 'they'-ai etrukkolgiradhu, aanaal SSC matrum Banking vidaiththaalgal innum HIS alladhu HIS OR HER-aidhaan sariyaagak kurikkindrana."},
 {h:"NONE is the one flexible member",
  en:"'None' can be singular or plural depending on the noun after it. 'None of the water is clean' (singular) but 'None of the boys are ready' (plural is now accepted). All the others are strictly singular.",
  ta:"'None' மட்டும் நெகிழ்வானது — அதற்குப் பின் வரும் பெயர்ச்சொல்லைப் பொறுத்து ஒருமையாகவோ பன்மையாகவோ இருக்கும். 'None of the water is clean' (ஒருமை) ஆனால் 'None of the boys are ready' (பன்மை இப்போது ஏற்கப்படுகிறது). மற்ற அனைத்தும் கண்டிப்பாக ஒருமை.",
  tl:"'None' mattum negizhvaanadhu — adharkup pin varum peyarcholaip poruththu orumaiyaagavo panmaiyaagavo irukkum. Matra anaiththum kandippaaga orumai."}],

 s3:[
 {h:"Break the word in half",
  d:"  EVERY + ONE   =  EVERY ONE  →  ONE  →  singular ✔\n  ANY   + BODY  =  ANY BODY   →  ONE BODY  →  singular ✔\n  NO    + THING =  NO THING   →  ONE THING →  singular ✔\n\n  Everyone IS.   Anybody HAS.   Nothing WAS."},
 {h:"The three endings",
  d:"   ┌── -ONE   :  everyone, someone, anyone, no one\n   ├── -BODY  :  everybody, somebody, anybody, nobody\n   └── -THING :  everything, something, anything, nothing\n\n   ALL THREE  →  SINGULAR VERB  →  IS / HAS / WAS / DOES"}],

 s4:{
 wrong:["\"'Everyone' means all the people, so the verb is plural.\" — Meaning is plural, grammar is singular.",
  "\"'Everyone must do their duty' sounds normal.\" — It is normal in speech but marked wrong in SSC.",
  "\"'None of the students' — students is plural, so plural always.\" — Only NONE is flexible. Everything else is fixed singular."],
 right:["Spot the ending: -one, -body or -thing → singular verb.",
  "Match the pronoun as well: everyone → his, not their.",
  "Treat 'none' separately — look at the noun after 'of'."]},

 s5:[
 {en:"Everyone is welcome to attend the function.",ta:"விழாவில் கலந்து கொள்ள அனைவரும் வரவேற்கப்படுகிறார்கள்.",tl:"Vizhaavil kalandhu kolla anaivarum varaverkappadugiraargal.",note:"'Everyone' → IS, even though many people are meant."},
 {en:"Nobody knows the correct answer.",ta:"சரியான பதில் யாருக்கும் தெரியாது.",tl:"Sariyaana padhil yaarukkum theriyaadhu.",note:"'Nobody' → KNOWS (with -s, the singular form)."},
 {en:"Somebody has taken my pen.",ta:"யாரோ ஒருவர் என்னுடைய பேனாவை எடுத்துவிட்டார்.",tl:"Yaaro oruvar ennudaiya penaavai eduththuvittaar.",note:"'Somebody' → HAS."},
 {en:"Everyone must do his duty honestly.",ta:"ஒவ்வொருவரும் தன்னுடைய கடமையை நேர்மையாகச் செய்ய வேண்டும்.",tl:"Ovvoruvarum thannudaiya kadamaiyai nermaiyaagach seyya vendum.",note:"Singular pronoun HIS, not 'their', in exam English."}],

 s7:[

 "Nobody ____ the truth.|knows|Easy|-BODY ending → singular verb with -s.",
 "Something ____ wrong with the machine.|is|Easy|-THING ending → singular.",
 "Everybody ____ enjoying the programme.|is|Easy|Singular.",
 "Anyone ____ apply for this post.|can|Medium|Modal, but subject is singular.",

 s9:[
 "Find the Error|Everyone in the hall (A) were asked (B) to stand up (C) for the anthem (D).|A;B;C;D|1|Part B. 'Everyone' is singular → 'was asked'.",
 "Fill in the Blank|Nobody ____ willing to take the responsibility.|is;are|0|'Nobody' is singular.",
 "Sentence Improvement|Everyone must complete their work before Friday.|their;his;its|1|Exam English requires the singular 'his'.",
 "Find the Error|Neither of the two proposals (A) are acceptable (B) to the committee (C) at present (D).|A;B;C;D|1|Part B. 'Neither' is singular → 'is acceptable'.",
 "Fill in the Blank|Nothing but a few old papers ____ found in the drawer.|was;were|0|Subject = 'Nothing' → WAS."],

 s10:{
  en:"The exam hides the indefinite pronoun behind a long phrase: 'Everyone of the two hundred candidates who appeared ____ informed.' By the time you reach the blank, you have read 'candidates' and 'appeared', and you write WERE. But the subject was 'Everyone' all along. The second trap is the pronoun — 'their' is offered as the natural-sounding but wrong choice.",
  ta:"தேர்வு indefinite pronoun-ஐ ஒரு நீளமான தொடருக்குப் பின்னால் மறைத்துவிடும்: 'Everyone of the two hundred candidates who appeared ____ informed.' Blank-ஐ அடையும்போது நீங்கள் 'candidates', 'appeared' ஆகியவற்றைப் படித்திருப்பீர்கள், WERE என்று எழுதிவிடுவீர்கள். ஆனால் Subject எப்போதுமே 'Everyone'தான். இரண்டாவது பொறி pronoun — 'their' இயற்கையாகக் கேட்கும், ஆனால் தவறான தேர்வாகத் தரப்படும்.",
  tl:"Thervu indefinite pronoun-ai oru neelamaana thodarukkup pinnaal maraiththividum. Blank-ai adaiyumbodhu neengal 'candidates', 'appeared' aagiyavatraip padiththiruppeergal, WERE endru ezhudhividuveergal. Aanaal Subject eppodhume 'Everyone'-dhaan."},

 s11:{
  en:"IF IT ENDS IN -ONE, -BODY OR -THING, IT IS ONE. One means singular.",
  ta:"-ONE, -BODY அல்லது -THING-ல் முடிந்தால், அது ஒன்று. ஒன்று என்றால் ஒருமை.",
  tl:"-ONE, -BODY alladhu -THING-l mudindhaal, adhu ondru. Ondru endraal orumai.",
  vis:"        SPLIT THE WORD IN TWO\n\n   EVERY | ONE    →  ONE  →  IS\n   ANY   | BODY   →  ONE  →  HAS\n   NO    | THING  →  ONE  →  WAS\n\n   The second half is ALWAYS singular.\n   The first half is just a quantity word."},

 s13:[
 "Everyone of the fifty candidates who ____ shortlisted ____ been informed by post.|was-has;were-has;were-have|1|'Who' refers to 'candidates' (plural) → WERE. Main subject 'Everyone' → HAS BEEN.",
 "Nobody, not even the senior officers, ____ aware that the file ____ already been destroyed.|were-had;was-had;was-has|1|'Nobody' → WAS. The earlier action needs the past perfect → HAD BEEN.",
 "Neither of the applicants ____ submitted ____ certificates before the deadline.|have-their;has-his;has-their|1|'Neither of' → HAS. Singular subject → singular pronoun HIS.",
 "Everything, including the chairs and the tables, ____ been shifted to the new hall yesterday.|have;has;had|1|'Everything' → HAS. 'Including...' is parenthetical (Rule 31).",
 "None of the water in these tanks ____ fit for drinking, and none of the filters ____ working.|is-are;are-is;is-is|0|Uncountable 'water' → IS. Plural 'filters' → ARE. NONE is flexible."],

 s14:{
  rule:"All indefinite pronouns ending in -one, -body, -thing are singular.",
  formula:"EVERYONE / NOBODY / SOMETHING  →  IS / HAS / WAS / DOES",
  memory:"Split the word: EVERY + ONE. One means singular.",
  ta:"வார்த்தையை பிரிச்சுப் பாருங்க: EVERY + ONE. ONE-ன்னா ஒருமை.",
  tl:"Vaarththaiyai pirichuppaarunga: EVERY + ONE. ONE-nnaa orumai.",
  mistake:"Using a plural verb because the meaning covers many people, and using 'their' instead of 'his'.",
  exam:"SSC CGL / CHSL / MTS, RRB, Bank — appears in Error Spotting and Fill in the Blank."},

 s15:[
 {ta:"இந்த rule ரொம்ப எளிமையானது, ஆனா அர்த்தமும் இலக்கணமும் ஒத்துப் போகாத ஒரு இடம். 'Everyone' அப்படின்னா தமிழ்ல 'அனைவரும்' — பன்மை. ஆனா ஆங்கிலத்துல அது ஒருமை. இந்த வித்தியாசம்தான் நம்மள குழப்புது.",
  tl:"Indha rule romba elimaiyaanadhu, aanaa arththamum ilakkanamum oththup pogaadha oru idam. 'Everyone' appadinnaa Tamil-la 'anaivarum' — panmai. Aanaa Aangilaththula adhu orumai. Indha viththiyaasam-dhaan nammala kuzhappudhu."},
 {ta:"ஒரு trick சொல்லுறேன். வார்த்தையை ரெண்டா பிரிச்சுப் பாருங்க. Everyone = EVERY + ONE. கடைசில என்ன இருக்கு? ONE. ஒன்னு. ஒருமை. Anybody = ANY + BODY. ஒரு உடம்பு. ஒருமை. Nothing = NO + THING. ஒரு பொருள். ஒருமை. கடைசி பாதி எப்பவும் ஒருமை. இதை ஒரு தடவ புரிஞ்சுக்கிட்டா, வாழ்நாள் முழுக்க மறக்காது.",
  tl:"Oru trick solluren. Vaarththaiyai rendaa pirichup paarunga. Everyone = EVERY + ONE. Kadaisila enna irukku? ONE. Onnu. Orumai. Anybody = ANY + BODY. Oru udambu. Orumai. Kadaisi paadhi eppavum orumai."},
 {ta:"இப்போ SSC-ஓட உண்மையான பொறி என்னன்னு சொல்லுறேன். அவங்க இப்படி எழுதுவாங்க: 'Everyone of the two hundred candidates who appeared for the exam ____ informed.' நீங்க படிச்சுட்டே வரும்போது 'candidates', 'appeared', 'exam' — எல்லாம் பன்மையா தெரியும். Blank-ஐ அடையும்போது WERE-ன்னு எழுதிடுவீங்க. ஆனா Subject என்ன? ஆரம்பத்துல இருக்கிற 'Everyone'. WAS. இதுதான் பதில்.",
  tl:"Ippo SSC-oda unmaiyaana pori ennannu solluren. Avanga ippadi ezhudhuvaanga. Neenga padichutte varumbodhu 'candidates', 'appeared', 'exam' — ellaam panmaiyaa theriyum. Blank-ai adaiyumbodhu WERE-nnu ezhudhiduveenga. Aanaa Subject enna? Aarambaththula irukkira 'Everyone'. WAS."},
 {ta:"இன்னொரு விஷயம் — pronoun. 'Everyone must do their duty' அப்படின்னு நாம பேச்சுல சொல்லுவோம், அது இப்போ ஆங்கிலத்துல ஏத்துக்கப்படுது. ஆனா SSC விடைத்தாள்ல இன்னும் 'his duty'-தான் சரி. தேர்வுல எழுதும்போது தேர்வோட தரத்தை follow பண்ணுங்க, தெருவோட தரத்தை இல்ல. இது ஒரு mark-ஓட விஷயம்.",
  tl:"Innoru vishayam — pronoun. 'Everyone must do their duty' appadinnu naama pechula solluvom, adhu ippo Aangilaththula eththukkappadudhu. Aanaa SSC vidaiththaalla innum 'his duty'-dhaan sari. Thervula ezhudhumbodhu thervoda tharaththai follow pannunga."},
 {ta:"கடைசியா ஒரு விதிவிலக்கு — 'None'. இது மட்டும் நெகிழ்வானது. 'None of the water is clean' — water எண்ண முடியாதது, அதனால IS. 'None of the boys are ready' — boys பன்மை, அதனால ARE (இது இப்போ ஏத்துக்கப்படுது). மற்ற எல்லா indefinite pronoun-உம் கண்டிப்பா ஒருமை. None மட்டும் விதிவிலக்கு அப்படின்னு மனசுல வெச்சுக்கோங்க.",
  tl:"Kadaisiyaa oru vidhivilakku — 'None'. Idhu mattum negizhvaanadhu. 'None of the water is clean' — water enna mudiyaadhadhu, adhanaala IS. 'None of the boys are ready' — boys panmai, adhanaala ARE. Matra ellaa indefinite pronoun-um kandippaa orumai."}]},

/* ========== RULE 37 ========== */
{n:37,rc:"SVA-07",d:"Hard",t:"NONE OF / SOME OF / MOST OF / ALL OF / HALF OF — Follow the Noun after OF",
 tam:"'of'-க்குப் பின் வரும் பெயர்ச்சொல்லே Verb-ஐ தீர்மானிக்கும் · 'of'-kkup pin varum peyarchole Verb-ai theermaanikkum",
 s1:{en:"With none of, some of, most of, all of, half of, plenty of, a lot of and the rest of, the verb agrees with the noun that comes AFTER 'of'. These quantifiers have no number of their own — they borrow it.",
  ta:"none of, some of, most of, all of, half of, plenty of, a lot of, the rest of — இவற்றுடன் வரும் வினைச்சொல், 'of'-க்குப் பின் வரும் பெயர்ச்சொல்லைப் பொறுத்தே அமையும். இந்த quantifier-களுக்கு சொந்தமாக எண் கிடையாது — அவை கடன் வாங்குகின்றன.",
  tl:"none of, some of, most of, all of, half of, plenty of, a lot of, the rest of — ivatrudan varum vinaichol, 'of'-kkup pin varum peyarcholaip poruththe amaiyum. Indha quantifier-galukku sondhamaaga en kidaiyaadhu — avai kadan vaangugindrana.",
  formula:"MOST / SOME / ALL / HALF / NONE  +  OF  +  NOUN  +  VERB\n                                              ↑        ↑\n                                        LOOK HERE   copy its number\n\nMost of the WATER    IS  polluted.   (uncountable → singular)\nMost of the STUDENTS ARE present.    (plural       → plural)"},

 s2:[
 {h:"The quantifier is an empty container",
  en:"Think of 'most of' as an empty box. Whatever you put inside decides the size. Put water in it and it becomes singular. Put students in it and it becomes plural. The box itself has no number.",
  ta:"'most of' என்பதை ஒரு காலி பெட்டியாக நினைத்துக் கொள்ளுங்கள். உள்ளே எதை வைக்கிறீர்களோ அதுதான் அளவைத் தீர்மானிக்கிறது. தண்ணீரை வைத்தால் ஒருமை. மாணவர்களை வைத்தால் பன்மை. பெட்டிக்கு சொந்தமாக எண் கிடையாது.",
  tl:"'most of' enbadhai oru kaali pettiyaaga ninaiththuk kollungal. Ulle edhai vaikkireergalo adhudhaan alavaith theermaanikkiradhu. Thanneerai vaiththaal orumai. Maanavargalai vaiththaal panmai."},
 {h:"This is the OPPOSITE of Rule 50",
  en:"'Each of / either of / neither of / one of' are ALWAYS singular no matter what follows. But 'most of / some of / all of / none of' FOLLOW the noun. Learn which list a word belongs to — that is the whole difficulty.",
  ta:"'Each of / either of / neither of / one of' — இவை பின்னால் என்ன வந்தாலும் எப்போதும் ஒருமை. ஆனால் 'most of / some of / all of / none of' — இவை பெயர்ச்சொல்லைப் பின்பற்றும். எந்தச் சொல் எந்தப் பட்டியலைச் சேர்ந்தது என்று கற்றுக்கொள்ளுங்கள் — அதுதான் முழு சிரமமும்.",
  tl:"'Each of / either of / neither of / one of' — ivai pinnaal enna vandhaalum eppodhum orumai. Aanaal 'most of / some of / all of / none of' — ivai peyarcholaip pinpatrum. Endhach sol endhap pattiyalaich serndhadhu endru katrukkollungal."},
 {h:"Fractions and percentages behave the same way",
  en:"'Two-thirds of the work is done' but 'Two-thirds of the workers are absent'. 'Sixty per cent of the population lives here' but 'Sixty per cent of the voters have registered'.",
  ta:"பின்னங்களும் சதவீதங்களும் இதேபோலவே செயல்படும். 'Two-thirds of the work is done' ஆனால் 'Two-thirds of the workers are absent'. 'Sixty per cent of the population lives here' ஆனால் 'Sixty per cent of the voters have registered'.",
  tl:"Pinnangalum sadhaveedhangalum idhepolave seyalpadum. 'Two-thirds of the work is done' aanaal 'Two-thirds of the workers are absent'."}],

 s3:[
 {h:"Jump over OF and land on the noun",
  d:"  Most  of  the  students  ARE  present.\n              ╰──►  jump  ──►  ↑\n                            land here, copy the number\n\n  Most  of  the  water     IS   polluted.\n              ╰──►  jump  ──►  ↑"},
 {h:"Two lists — learn which is which",
  d:"  FLEXIBLE (follow the noun)      FIXED (always singular)\n  ──────────────────────────      ───────────────────────\n   most of                          each of\n   some of                          every one of\n   all of                           either of\n   half of                          neither of\n   none of                          one of\n   a lot of / plenty of             any one of\n   the rest of                      \n   two-thirds of / 60% of"}],

 s4:{
 wrong:["\"'Most of' sounds plural, so the verb is plural.\" — Not if the noun after 'of' is uncountable.",
  "\"'None' means not one, so it is always singular.\" — Modern usage allows a plural verb when the noun is plural.",
  "\"All 'of' phrases behave the same.\" — No. 'Each of' is fixed singular; 'most of' is flexible."],
 right:["Put your finger on 'of'. Jump over it. Read the next noun.",
  "Ask: is that noun countable-plural or uncountable-singular?",
  "Copy its number onto the verb. Done."]},

 s5:[
 {en:"Most of the water is polluted.",ta:"பெரும்பாலான தண்ணீர் மாசடைந்துள்ளது.",tl:"Perumbaalaana thanneer maasadaindhulladhu.",note:"'Water' is uncountable → IS."},
 {en:"Most of the students are present today.",ta:"பெரும்பாலான மாணவர்கள் இன்று வந்திருக்கிறார்கள்.",tl:"Perumbaalaana maanavargal indru vandhirukkiraargal.",note:"'Students' is plural → ARE."},
 {en:"Half of the cake was eaten by the children.",ta:"கேக்கில் பாதி குழந்தைகளால் சாப்பிடப்பட்டது.",tl:"Cake-kil paadhi kuzhandhaigalaal saappidappattadhu.",note:"'Cake' is one item → WAS."},
 {en:"Half of the mangoes were rotten.",ta:"மாம்பழங்களில் பாதி அழுகிப் போயிருந்தன.",tl:"Maambazhangalil paadhi azhugip poyirundhana.",note:"'Mangoes' is plural → WERE."},
 {en:"Two-thirds of the work has been completed.",ta:"வேலையில் மூன்றில் இரண்டு பங்கு முடிக்கப்பட்டுவிட்டது.",tl:"Velaiyil moondril irandu pangu mudikkappattuvittadhu.",note:"'Work' is uncountable → HAS."}],

 s6:["most of|பெரும்பாலான|Perumbaalaana",
  "some of|சிலவற்றில் / சிறிதளவு|Silavatril / Siridhalavu",

  "per cent of|சதவீதம்|Sadhaveedham",

  "rotten|அழுகிய|Azhugiya"],

 s7:[

 "Some of the sugar ____ fallen on the floor.|has|Easy|'Sugar' is uncountable.",
 "Some of the books ____ missing from the shelf.|are|Easy|'Books' is plural.",
 "All of the furniture ____ been sold.|has|Medium|'Furniture' is uncountable.",
 "All of the chairs ____ been sold.|have|Medium|'Chairs' is plural.",
 "Half of the land ____ been sold.|has|Medium|'Land' is uncountable.",
 "Half of the fields ____ been sold.|have|Medium|'Fields' is plural.",
 "None of the water ____ fit for drinking.|is|Hard|Uncountable after 'of'.",
 "None of the bottles ____ full.|are|Hard|Plural after 'of'.",

 s8:[

 s9:[
 "Find the Error|Most of the information (A) given in the report (B) were incorrect (C) and misleading (D).|A;B;C;D|2|Part C. 'Information' is uncountable → 'was incorrect'.",
 "Fill in the Blank|Half of the villagers ____ been evacuated before the flood.|has;have|1|'Villagers' is plural → HAVE.",
 "Sentence Improvement|Two-thirds of the land are still uncultivated in this district.|are;is;were|1|'Land' is uncountable → IS.",
 "Find the Error|Some of the luggage (A) was left (B) at the station (C), no error (D).|A;B;C;D|3|No error. 'Luggage' is uncountable, so 'was' is correct.",
 "Fill in the Blank|None of the candidates ____ satisfied with the result declared today.|is;are|1|'Candidates' is plural → ARE."],

 s10:{
  en:"The exam picks nouns that LOOK plural or LOOK singular but are not. 'Information', 'furniture', 'luggage', 'equipment', 'machinery', 'advice' and 'work' all look like countable words to an Indian learner, so students write plural verbs. Meanwhile 'population', 'staff' and 'public' look singular but can go either way. The whole question is: what kind of noun sits after 'of'?",
  ta:"தேர்வு பன்மை போலத் தோன்றும் அல்லது ஒருமை போலத் தோன்றும் ஆனால் உண்மையில் அப்படி இல்லாத பெயர்ச்சொற்களைத் தேர்ந்தெடுக்கிறது. 'Information', 'furniture', 'luggage', 'equipment', 'machinery', 'advice', 'work' — இவை அனைத்தும் இந்திய மாணவருக்கு எண்ணக்கூடிய சொற்களாகத் தோன்றும், எனவே பன்மை வினைச்சொல்லை எழுதிவிடுவார்கள். முழு கேள்வியும் இதுதான்: 'of'-க்குப் பின் இருப்பது எந்த வகைப் பெயர்ச்சொல்?",
  tl:"Thervu panmai polath thondrum alladhu orumai polath thondrum aanaal unmaiyil appadi illaadha peyarchorkalaith therndhedukkiradhu. 'Information', 'furniture', 'luggage', 'equipment', 'advice', 'work' — ivai anaiththum Indhiya maanavarukku ennakkoodiya sorkalaagath thondrum. Muzhu kelviyum idhudhaan: 'of'-kkup pin iruppadhu endha vagaip peyarchol?"},

 s11:{
  en:"JUMP OVER 'OF'. Whatever noun you land on decides the verb. Copy its number.",
  ta:"'OF'-ஐத் தாண்டிக் குதியுங்கள். எந்தப் பெயர்ச்சொல்லில் இறங்குகிறீர்களோ அதுதான் வினைச்சொல்லைத் தீர்மானிக்கும். அதன் எண்ணை நகலெடுங்கள்.",
  tl:"'OF'-aith thaandik kudhiyungal. Endhap peyarcholil irangugireergalo adhudhaan vinaicholaith theermaanikkum. Adhan ennai nagaledungal.",
  vis:"    THINK OF IT AS AN EMPTY BOX\n\n    ┌───────────┐\n    │  MOST OF  │  + water     →  IS   (uncountable)\n    │  (empty)  │  + students  →  ARE  (plural)\n    └───────────┘\n\n    The box has no number of its own.\n    Whatever you put in decides."},

 s13:[
 "Most of the equipment, along with the spare parts, ____ been shifted to the new godown.|have;has;had|1|Rule 31 removes 'along with the spare parts'. 'Equipment' is uncountable → HAS BEEN.",
 "Neither of the two reports ____ accurate, and most of the data in them ____ outdated.|are-are;is-is;is-are|1|'Neither of' is fixed singular → IS. 'Data' as a mass noun in exam English → IS.",
 "Half of the villagers who ____ affected by the cyclone ____ still waiting for relief.|was-is;were-are;were-is|1|'Who' refers to 'villagers' → WERE. Main verb also follows 'villagers' → ARE.",
 "Two-thirds of the land ____ sold last year, but the rest of the fields ____ not yet been valued.|was-have;were-has;was-has|0|'Land' uncountable → WAS. 'Fields' plural → HAVE.",
 "None of the furniture in these rooms ____ new, though some of the chairs ____ recently repaired.|are-was;is-were;is-was|1|'Furniture' uncountable → IS. 'Chairs' plural → WERE."],

 s14:{
  rule:"With most of / some of / all of / half of / none of, the verb follows the noun after 'of'.",
  formula:"QUANTIFIER + OF + NOUN + VERB  →  verb copies the NOUN",
  memory:"Jump over 'of' and land on the noun. Copy its number.",
  ta:"'of'-ஐ தாண்டி குதிச்சு, அடுத்த பெயர்ச்சொல்ல இறங்குங்க. அதோட எண்ணை copy பண்ணுங்க.",
  tl:"'of'-ai thaandi kudhichu, aduththa peyarcholla irangunga. Adhoda ennai copy pannunga.",
  mistake:"Treating 'most of' as automatically plural, and treating uncountable nouns like information or furniture as plural.",
  exam:"SSC CGL / CHSL, RRB NTPC, IBPS — heavy overlap with the uncountable-noun rule."},

 s15:[
 {ta:"இந்த rule-ஐ புரிஞ்சுக்க ஒரு எளிமையான படம் மனசுல வெச்சுக்கோங்க. 'Most of' அப்படிங்கிறது ஒரு காலி பெட்டி மாதிரி. பெட்டிக்கு சொந்தமா எந்த அளவும் கிடையாது. நீங்க உள்ள என்ன வைக்கிறீங்களோ, அதுதான் அளவு.",
  tl:"Indha rule-ai purinjukka oru elimaiyaana padam manasula vechukkonga. 'Most of' appadingiradhu oru kaali petti maadhiri. Pettikku sondhamaa endha alavum kidaiyaadhu. Neenga ulla enna vaikkireengalo, adhudhaan alavu."},
 {ta:"'Most of the water' — பெட்டிக்குள்ள தண்ணீர். தண்ணீரை எண்ண முடியுமா? முடியாது. அதனால ஒருமை. IS. 'Most of the students' — பெட்டிக்குள்ள மாணவர்கள். எண்ண முடியுமா? முடியும். பன்மை. ARE. அவ்ளோதான். ரொம்ப சிம்பிள்.",
  tl:"'Most of the water' — pettikkulla thanneer. Thanneerai enna mudiyumaa? Mudiyaadhu. Adhanaala orumai. IS. 'Most of the students' — pettikkulla maanavargal. Enna mudiyumaa? Mudiyum. Panmai. ARE."},
 {ta:"இப்போ முக்கியமான ஒரு எச்சரிக்கை. இந்த rule-ஐ Rule 50-ஓட குழப்பிக்காதீங்க. 'Each of the boys HAS' — இங்க boys பன்மையா இருந்தாலும் verb ஒருமை. ஏன்? ஏன்னா 'Each of' அப்படிங்கிறது நிலையான ஒருமை. ஆனா 'Most of the boys ARE' — இங்க பன்மை. வித்தியாசம் தெரியுதா? ரெண்டு list இருக்கு — ஒண்ணு நெகிழ்வான list, இன்னொண்ணு நிலையான list. இதை நல்லா மனசுல வெச்சுக்கோங்க.",
  tl:"Ippo mukkiyamaana oru echcharikkai. Indha rule-ai Rule 50-oda kuzhappikkaadheenga. 'Each of the boys HAS' — inga boys panmaiyaa irundhaalum verb orumai. Aanaa 'Most of the boys ARE' — inga panmai. Rendu list irukku — onnu negizhvaana list, innonnu nilaiyaana list."},
 {ta:"SSC-ஓட உண்மையான தந்திரம் என்னன்னா, அவங்க எண்ண முடியாத சொற்களை (uncountable nouns) பயன்படுத்துவாங்க. Information, furniture, luggage, equipment, machinery, advice, work — இதெல்லாம் நமக்கு எண்ணக்கூடியது மாதிரி தெரியும். 'Most of the informations were wrong' அப்படின்னு எழுதிடுவோம். ரெண்டு தப்பு — 'informations' அப்படின்னு ஒரு வார்த்தையே கிடையாது, மேலும் verb 'was' ஆ இருக்கணும். இந்த uncountable list-ஐ மனப்பாடம் பண்ணுங்க. இது SVA-ல மட்டும் இல்ல, Noun rule-லயும் உதவும்.",
  tl:"SSC-oda unmaiyaana thandhiram ennannaa, avanga enna mudiyaadha sorkalai (uncountable nouns) payanpaduththuvaanga. Information, furniture, luggage, equipment, machinery, advice, work — idhellaam namakku ennakkoodiyadhu maadhiri theriyum. Indha uncountable list-ai manappaadam pannunga."}]},

/* ========== RULE 38 ========== */
{n:38,rc:"SVA-08",d:"Hard",t:"A NUMBER OF is Plural — THE NUMBER OF is Singular",
 tam:"A number of = பலர் (பன்மை) · The number of = மொத்த எண்ணிக்கை (ஒருமை)",
 s1:{en:"'A number of' means 'many' and takes a PLURAL verb. 'The number of' refers to the total figure itself and takes a SINGULAR verb. Only the article changes, but the verb flips completely.",
  ta:"'A number of' என்றால் 'பலர்' என்று பொருள், அது பன்மை வினைச்சொல்லை எடுக்கும். 'The number of' என்றால் மொத்த எண்ணிக்கையைக் குறிக்கிறது, அது ஒருமை வினைச்சொல்லை எடுக்கும். Article மட்டுமே மாறுகிறது, ஆனால் வினைச்சொல் முற்றிலும் தலைகீழாகிறது.",
  tl:"'A number of' endraal 'palar' endru porul, adhu panmai vinaicholai edukkum. 'The number of' endraal moththa ennikkaiyaik kurikkiradhu, adhu orumai vinaicholai edukkum. Article mattume maarugiradhu, aanaal vinaichol mutrilum thalaigeezhaagiradhu.",
  formula:"A   number of + plural noun  →  PLURAL VERB   (A = All = many)\nTHE number of + plural noun  →  SINGULAR VERB (THE = Total)\n\nA number of students ARE absent.\nThe number of students IS fifty."},

 s2:[
 {h:"What is really the subject in each case",
  en:"In 'A number of students are absent', the real subject is 'students' — 'a number of' just means 'many'. In 'The number of students is fifty', the real subject is 'number' itself — you are stating a figure.",
  ta:"'A number of students are absent' இதில் உண்மையான Subject 'students' — 'a number of' என்பது வெறுமனே 'பலர்' என்று பொருள். 'The number of students is fifty' இதில் உண்மையான Subject 'number' — நீங்கள் ஒரு எண்ணிக்கையைச் சொல்கிறீர்கள்.",
  tl:"'A number of students are absent' idhil unmaiyaana Subject 'students' — 'a number of' enbadhu verumane 'palar' endru porul. 'The number of students is fifty' idhil unmaiyaana Subject 'number'."},
 {h:"A quick replacement test",
  en:"Try replacing the phrase with 'many'. 'A number of students are absent' → 'Many students are absent'. It works, so plural. Now try 'The number of students is fifty' → 'Many students is fifty'. It fails, so singular.",
  ta:"அந்தத் தொடரை 'many' என்று மாற்றிப் பாருங்கள். 'A number of students are absent' → 'Many students are absent'. பொருந்துகிறது, எனவே பன்மை. இப்போது 'The number of students is fifty' → 'Many students is fifty'. பொருந்தவில்லை, எனவே ஒருமை.",
  tl:"Andhath thodarai 'many' endru maatrip paarungal. 'A number of students are absent' → 'Many students are absent'. Porundhugiradhu, enave panmai. Ippodhu 'Many students is fifty' — porundhavillai, enave orumai."},
 {h:"Same pattern with other words",
  en:"'A variety of colours are available' but 'The variety of colours is amazing'. 'A total of ten men were arrested' but 'The total is ten'. The article carries the whole meaning.",
  ta:"இதே அமைப்பு வேறு சொற்களுக்கும் பொருந்தும். 'A variety of colours are available' ஆனால் 'The variety of colours is amazing'. 'A total of ten men were arrested' ஆனால் 'The total is ten'. Article-தான் முழுப் பொருளையும் சுமக்கிறது.",
  tl:"Idhe amaippu veru sorkalukkum porundhum. 'A variety of colours are available' aanaal 'The variety of colours is amazing'. Article-dhaan muzhup porulaiyum sumakkiradhu."}],

 s3:[
 {h:"One tiny letter changes everything",
  d:"  A  number of students  ARE  absent.\n  ↑                        ↑\n  A = All = MANY      →  plural verb\n\n  THE number of students  IS  fifty.\n   ↑                       ↑\n  THE = Total figure   →  singular verb"},
 {h:"Where the real subject sits",
  d:"  A number of STUDENTS are absent.\n               ╰────► real subject (plural)\n\n  The NUMBER of students is fifty.\n       ╰────► real subject (singular)"}],

 s4:{
 wrong:["\"Both phrases contain 'number', which is singular, so both take a singular verb.\" — Only 'the number of' does.",
  "\"'Students' is plural in both, so both take a plural verb.\" — Only 'a number of' does.",
  "\"The article is just decoration.\" — Here the article IS the question."],
 right:["Replace the phrase with 'many'. If the sentence still works, use a plural verb.",
  "Ask: am I talking about the PEOPLE or about the FIGURE?",
  "A = All = plural. THE = Total = singular."]},

 s5:[
 {en:"A number of students are absent today.",ta:"இன்று பல மாணவர்கள் வரவில்லை.",tl:"Indru pala maanavargal varavillai.",note:"'A number of' = many → ARE."},
 {en:"The number of students is fifty.",ta:"மாணவர்களின் எண்ணிக்கை ஐம்பது.",tl:"Maanavargalin ennikkai aimbadhu.",note:"'The number of' = the figure → IS."},
 {en:"A large number of files were destroyed in the fire.",ta:"தீ விபத்தில் ஏராளமான கோப்புகள் அழிக்கப்பட்டன.",tl:"Thee vibaththil eraalamaana koppugal azhikkappattana.",note:"'A large number of' → WERE."},
 {en:"The number of applicants has increased sharply.",ta:"விண்ணப்பதாரர்களின் எண்ணிக்கை கூர்மையாக அதிகரித்துள்ளது.",tl:"Vinnappadhaarargalin ennikkai koormaiyaaga adhigariththulladhu.",note:"'The number of' → HAS."}],

 s6:["a number of|பல / ஏராளமான|Pala / Eraalamaana",

  "are|இருக்கிறார்கள் (பன்மை)|Irukkiraargal (panmai)",
  "is|இருக்கிறது (ஒருமை)|Irukkiradhu (orumai)",

  "destroyed|அழிக்கப்பட்டன|Azhikkappattana"],

 s7:[

 "The number of boys ____ thirty.|is|Easy|'The number of' = figure → singular.",
 "A number of files ____ missing.|are|Easy|Plural.",
 "The number of files ____ ten.|is|Easy|Singular.",
 "A large number of people ____ gathered.|have|Medium|'A large number of' → plural.",
 "The number of accidents ____ risen this year.|has|Medium|Singular.",
 "A number of complaints ____ been received.|have|Medium|Plural.",
 "The number of complaints ____ alarming.|is|Medium|Singular.",
 "A great number of tourists ____ the fort daily.|visit|Hard|Plural.",
 "The number of tourists visiting the fort ____ dropped.|has|Hard|Singular.",
 "A variety of dishes ____ served at the party.|were|Hard|'A variety of' → plural.",
 "The variety of dishes ____ impressive.|was|Hard|'The variety of' → singular.",
 "A total of fifty candidates ____ shortlisted.|were|Expert|'A total of' → plural.",
 "The total of the two figures ____ one hundred.|is|Expert|'The total' → singular.",

 s8:[

 "The number of accidents have risen.|The number of accidents has risen.|Singular.",
 "A number of complaints has been received.|A number of complaints have been received.|Plural.",

 "The number of people attending have doubled.|The number of people attending has doubled.|Subject = 'the number'."],

 s9:[
 "Find the Error|The number of candidates (A) appearing for the exam (B) have increased (C) this year (D).|A;B;C;D|2|Part C. 'The number of' → 'has increased'.",
 "Fill in the Blank|A number of villagers ____ lost their homes in the flood.|has;have|1|'A number of' = many → HAVE.",
 "Sentence Improvement|A large number of books was donated to the library.|was;were;is|1|'A large number of' → WERE.",
 "Find the Error|A number of workers (A) in this factory (B) is demanding (C) higher wages (D).|A;B;C;D|2|Part C. 'A number of' → 'are demanding'.",
 "Fill in the Blank|The number of road accidents in the city ____ come down considerably.|has;have|0|'The number of' → HAS."],

 s10:{
  en:"This is a pure article question dressed up as a verb question. The exam prints a long sentence so that by the time you reach the verb you have forgotten whether the first word was 'A' or 'The'. Both versions look almost identical on the page. Train yourself to read the FIRST WORD of the subject before anything else, exactly as in Rule 34.",
  ta:"இது ஒரு வினைச்சொல் கேள்வி போல உடையணிந்த முழுக்க முழுக்க article கேள்வி. தேர்வு ஒரு நீளமான வாக்கியத்தை அச்சிடும், நீங்கள் வினைச்சொல்லை அடையும்போது முதல் வார்த்தை 'A'-வா 'The'-வா என்பதை மறந்துவிட வேண்டும் என்பதற்காக. இரண்டு வடிவங்களும் பக்கத்தில் கிட்டத்தட்ட ஒரே மாதிரியே தெரியும். Subject-ன் முதல் வார்த்தையை எல்லாவற்றுக்கும் முன்பு படிக்கும் பழக்கத்தை வளர்த்துக் கொள்ளுங்கள் — Rule 34-ல் இருந்தது போலவே.",
  tl:"Idhu oru vinaichol kelvi pola udaiyanindha muzhukka muzhukka article kelvi. Thervu oru neelamaana vaakkiyaththai achidum, neengal vinaicholai adaiyumbodhu mudhal vaarththai 'A'-vaa 'The'-vaa enbadhai marandhuvida vendum enbadharkaaga. Subject-in mudhal vaarththaiyai ellaavatrukkum munbu padikkum pazhakkaththai valarththuk kollungal."},

 s11:{
  en:"A = All = ARE.   THE = Total = IS.  Three letters decide the whole mark.",
  ta:"A = All (பலர்) = ARE. THE = Total (மொத்தம்) = IS. மூன்று எழுத்துக்கள் முழு mark-ஐயும் தீர்மானிக்கின்றன.",
  tl:"A = All (palar) = ARE. THE = Total (moththam) = IS. Moondru ezhuththukkal muzhu mark-aiyum theermaanikkindrana.",
  vis:"      A  →  A-ll   →  ARE   (plural)\n     THE →  Total  →  IS    (singular)\n\n   REPLACEMENT TEST:\n   Swap the phrase with 'MANY'.\n\n   Many students ARE absent.   ✔ works → plural\n   Many students IS fifty.     ✘ fails → singular"},

 s13:[
 "The number of applicants, along with the number of vacancies, ____ risen sharply this year.|have;has;had|1|Rule 31 removes 'along with...'. 'The number of' → HAS RISEN.",
 "A number of the villagers who ____ displaced by the dam ____ still awaiting compensation.|was-is;were-are;were-is|1|'Who' refers to 'villagers' → WERE. 'A number of' → ARE.",
 "Neither the number of teachers nor the number of classrooms ____ adequate for so many students.|are;is;were|1|'Neither...nor' takes the nearest → 'the number of classrooms' → IS.",
 "A large number of books ____ donated last year, but the number of readers ____ not increased.|were-has;was-have;were-have|0|'A large number of' → WERE. 'The number of' → HAS.",
 "The number of accidents on this highway, each of which ____ investigated separately, ____ come down.|were-have;was-has;were-has|1|'Each of which' → WAS. Main subject 'The number of' → HAS."],

 s14:{
  rule:"A number of = many = PLURAL verb. The number of = the total figure = SINGULAR verb.",
  formula:"A number of + plural noun → ARE / HAVE\nTHE number of + plural noun → IS / HAS",
  memory:"A = All = ARE.  THE = Total = IS.",
  ta:"A = All = ARE (பலர்). THE = Total = IS (மொத்த எண்ணிக்கை).",
  tl:"A = All = ARE (palar). THE = Total = IS (moththa ennikkai).",
  mistake:"Reading the plural noun and ignoring which article started the sentence.",
  exam:"SSC CGL / CHSL and Bank PO — a classic one-mark question, appears very frequently."},

 s15:[
 {ta:"இந்த rule-ல ஒரே ஒரு சின்ன வார்த்தைதான் எல்லாத்தையும் மாத்துது. 'A' இருந்தா ஒரு பதில், 'The' இருந்தா வேற பதில். இதுவரைக்கும் நீங்க கத்துக்கிட்ட rule-ல எல்லாமே பெயர்ச்சொல்லைப் பத்தி. இது மட்டும் article-ஐப் பத்தி.",
  tl:"Indha rule-la ore oru chinna vaarththai-dhaan ellaaththaiyum maaththudhu. 'A' irundhaa oru padhil, 'The' irundhaa veru padhil. Idhuvaraikkum neenga kaththukkitta rule-la ellaame peyarcholaip paththi. Idhu mattum article-aip paththi."},
 {ta:"இதை ரொம்ப எளிமையா புரிஞ்சுக்க ஒரு test சொல்லுறேன். அந்த தொடரை 'many' அப்படின்னு மாத்திப் பாருங்க. 'A number of students are absent' → 'Many students are absent'. சரியா இருக்கு. அதனால பன்மை. இப்போ 'The number of students is fifty' → 'Many students is fifty'. இது தப்பா இருக்கு இல்லையா? அதனால ஒருமை. இந்த ஒரு test போதும்.",
  tl:"Idhai romba elimaiyaa purinjukka oru test solluren. Andha thodarai 'many' appadinnu maaththip paarunga. 'A number of students are absent' → 'Many students are absent'. Sariyaa irukku. Adhanaala panmai. Ippo 'Many students is fifty' — idhu thappaa irukku illaiyaa? Adhanaala orumai."},
 {ta:"இன்னும் எளிமையா நினைவுல வெச்சுக்க: A அப்படின்னா A-ll — எல்லாரும், பலர். அதனால ARE. THE அப்படின்னா Total — மொத்த எண்ணிக்கை. அதனால IS. A-ARE, THE-IS. ரெண்டும் அதே எழுத்துல ஆரம்பிக்குது மாதிரி நினைச்சுக்கோங்க.",
  tl:"Innum elimaiyaa ninaivula vechukka: A appadinnaa A-ll — ellaarum, palar. Adhanaala ARE. THE appadinnaa Total — moththa ennikkai. Adhanaala IS. A-ARE, THE-IS."},
 {ta:"இப்போ அர்த்தத்தை யோசிச்சுப் பாருங்க — இதுதான் உண்மையான புரிதல். 'A number of students are absent' — இங்க நீங்க யாரைப் பத்தி பேசுறீங்க? மாணவர்களைப் பத்தி. அவங்க வரல. மனுஷங்க. பன்மை. ஆனா 'The number of students is fifty' — இங்க நீங்க யாரைப் பத்தி பேசுறீங்க? மாணவர்களைப் பத்தி இல்ல, எண்ணிக்கையைப் பத்தி. எண்ணிக்கை ஒண்ணுதான். ஐம்பது அப்படிங்கிற ஒரு எண். ஒருமை.",
  tl:"Ippo arththaththai yosichup paarunga — idhudhaan unmaiyaana purithal. 'A number of students are absent' — inga neenga yaaraip paththi pesureenga? Maanavargalaip paththi. Panmai. Aanaa 'The number of students is fifty' — inga ennikkaiyaip paththi. Ennikkai onnu-dhaan. Orumai."},
 {ta:"கடைசியா, இதே pattern வேற வார்த்தைகளுக்கும் வேலை செய்யும். 'A variety of' பன்மை, 'The variety of' ஒருமை. 'A total of' பன்மை, 'The total of' ஒருமை. 'A majority of' பன்மை, 'The majority of' சூழலைப் பொறுத்து. இந்த pattern-ஐ ஒரு தடவ புரிஞ்சுக்கிட்டா, மத்ததெல்லாம் தானா வரும்.",
  tl:"Kadaisiyaa, idhe pattern veru vaarththaigalukkum velai seyyum. 'A variety of' panmai, 'The variety of' orumai. 'A total of' panmai, 'The total of' orumai. Indha pattern-ai oru thadava purinjukkittaa, maththadhellaam thaanaa varum."}]},

/* ========== RULE 39 ========== */
{n:39,rc:"SVA-09",d:"Medium",t:"MANY A takes a Singular Noun and a Singular Verb",
 tam:"Many a + ஒருமை பெயர்ச்சொல் + ஒருமை வினைச்சொல் · Many a + orumai peyarchol + orumai vinaichol",
 s1:{en:"'Many a' is followed by a SINGULAR noun and a SINGULAR verb, even though the meaning is plural. 'Many' without the article takes a plural noun and a plural verb.",
  ta:"'Many a'-க்குப் பின் ஒருமைப் பெயர்ச்சொல்லும் ஒருமை வினைச்சொல்லும் வரும், பொருள் பன்மையாக இருந்தாலும். Article இல்லாத 'Many' பன்மைப் பெயர்ச்சொல்லையும் பன்மை வினைச்சொல்லையும் எடுக்கும்.",
  tl:"'Many a'-kkup pin orumaip peyarcholaiyum orumai vinaicholaiyum varum, porul panmaiyaaga irundhaalum. Article illaadha 'Many' panmaip peyarcholaiyum panmai vinaicholaiyum edukkum.",
  formula:"MANY A  +  singular noun  +  singular verb\nMANY    +  plural noun    +  plural verb\n\nMany a student HAS failed.   ✔\nMany students  HAVE failed.  ✔"},

 s2:[
 {h:"Why it stays singular",
  en:"'Many a' is an old, emphatic literary construction. The little word 'a' is an article, and an article can only sit before a singular noun. That single 'a' locks the whole structure into the singular.",
  ta:"'Many a' என்பது பழமையான, வலியுறுத்தும் இலக்கிய அமைப்பு. அந்தச் சின்ன 'a' ஒரு article, ஒரு article ஒருமைப் பெயர்ச்சொல்லுக்கு முன்னால் மட்டுமே வர முடியும். அந்த ஒரே ஒரு 'a' முழு அமைப்பையும் ஒருமையில் பூட்டிவிடுகிறது.",
  tl:"'Many a' enbadhu pazhamaiyaana, valiyuruththum ilakkiya amaippu. Andhach chinna 'a' oru article, oru article orumaip peyarcholukku munnaal mattume vara mudiyum. Andha ore oru 'a' muzhu amaippaiyum orumaiyil poottividugiradhu."},
 {h:"Meaning versus grammar, once again",
  en:"'Many a soldier has died' means MANY soldiers died. The meaning is plural, the grammar is singular. This is the same conflict you met in Rule 34 and Rule 36 — English counts one at a time for emphasis.",
  ta:"'Many a soldier has died' என்றால் பல வீரர்கள் இறந்தார்கள் என்று பொருள். பொருள் பன்மை, இலக்கணம் ஒருமை. இதே முரண்பாட்டை நீங்கள் Rule 34-லும் Rule 36-லும் சந்தித்தீர்கள் — ஆங்கிலம் வலியுறுத்துவதற்காக ஒவ்வொன்றாக எண்ணுகிறது.",
  tl:"'Many a soldier has died' endraal pala veerargal irandhaargal endru porul. Porul panmai, ilakkanam orumai. Idhe murangpaattai neengal Rule 34-lum Rule 36-lum sandhiththeergal."},
 {h:"The pronoun must match too",
  en:"'Many a man has lost HIS way', not 'their way'. Since the noun is singular, every pronoun referring back to it must also be singular.",
  ta:"பிரதிபெயரும் பொருந்த வேண்டும். 'Many a man has lost HIS way' — 'their way' அல்ல. பெயர்ச்சொல் ஒருமையாக இருப்பதால், அதைக் குறிக்கும் ஒவ்வொரு பிரதிபெயரும் ஒருமையாகவே இருக்க வேண்டும்.",
  tl:"Pirathibeyarum porundha vendum. 'Many a man has lost HIS way' — 'their way' alla. Peyarchol orumaiyaaga iruppadhaal, adhaik kurikkum ovvoru pirathibeyarum orumaiyaagave irukka vendum."}],

 s3:[
 {h:"The article 'a' is the switch",
  d:"  MANY  a  student  has  failed.\n         ↑     ↑        ↑\n     article  singular  singular\n     (this tiny 'a' controls everything)\n\n  MANY    students  have  failed.\n            ↑         ↑\n         plural     plural\n     (no article = normal plural)"},
 {h:"Same meaning, two grammars",
  d:"  Many a soldier HAS died.    ┐\n                               ├─ SAME MEANING\n  Many soldiers  HAVE died.    ┘\n\n  Both mean: a large number of soldiers died.\n  Only the grammar differs."}],

 s4:{
 wrong:["\"'Many' always means plural, so the verb is plural.\" — Not when the article 'a' follows it.",
  "\"'Many a students have failed' looks more natural.\" — It is doubly wrong: the noun must be singular AND the verb must be singular.",
  "\"'Many a man has lost their way' sounds fine.\" — The pronoun must also be singular: HIS."],
 right:["Look for the article 'a' right after 'many'. If it is there → everything singular.",
  "No 'a' → everything plural.",
  "Match the pronoun to the noun, not to the meaning."]},

 s5:[
 {en:"Many a student has failed this year.",ta:"இந்த ஆண்டு பல மாணவர்கள் தோல்வியடைந்துள்ளனர்.",tl:"Indha aandu pala maanavargal tholviyadaindhullanar.",note:"Singular noun 'student' + singular verb 'has'. Meaning is plural."},
 {en:"Many a man dreams of success.",ta:"பல மனிதர்கள் வெற்றியைக் கனவு காண்கிறார்கள்.",tl:"Pala manidhargal vetriyaik kanavu kaankiraargal.",note:"'Dreams' with -s is the singular form."},
 {en:"Many a flower blooms unseen in the forest.",ta:"காட்டில் பல மலர்கள் யாரும் காணாமலேயே மலர்கின்றன.",tl:"Kaattil pala malargal yaarum kaanaamaleye malargindrana.",note:"Classic literary line — singular throughout."},
 {en:"Many students have failed this year.",ta:"இந்த ஆண்டு பல மாணவர்கள் தோல்வியடைந்துள்ளனர்.",tl:"Indha aandu pala maanavargal tholviyadaindhullanar.",note:"No article 'a' → plural noun and plural verb. Same meaning."}],

 s6:["many a|பல (ஒவ்வொன்றாக)|Pala (ovvondraaga)",

 s7:[

 s9:[

 s10:{
  en:"The exam offers 'Many a students have' — which is wrong twice over, and looks natural because the meaning really is plural. It also tests the pronoun: 'Many a man has lost THEIR way' is offered because it sounds modern. And watch for 'Many an' before a vowel sound — 'Many an officer has' — where the unfamiliar 'an' distracts you from the singular verb.",
  ta:"தேர்வு 'Many a students have' என்று தரும் — இது இரண்டு விதங்களில் தவறு, ஆனால் பொருள் உண்மையிலேயே பன்மையாக இருப்பதால் இயற்கையாகத் தெரியும். அது pronoun-ஐயும் சோதிக்கும்: 'Many a man has lost THEIR way' நவீனமாகக் கேட்பதால் தரப்படும். மேலும் உயிர் ஒலிக்கு முன் வரும் 'Many an'-ஐக் கவனியுங்கள் — 'Many an officer has' — அங்கே பழக்கமில்லாத 'an' உங்களை ஒருமை வினைச்சொல்லிலிருந்து திசைதிருப்பும்.",
  tl:"Thervu 'Many a students have' endru tharum — idhu irandu vidhangalil thavaru, aanaal porul unmaiyileye panmaiyaaga iruppadhaal iyarkaiyaagath theriyum. Adhu pronoun-aiyum sodhikkum. Melum uyir olikku mun varum 'Many an'-aik kavaniyungal."},

 s11:{
  en:"THE LITTLE 'A' IS THE SWITCH. Many a = singular everything. Many = plural everything.",
  ta:"அந்தச் சின்ன 'A'-தான் switch. Many a = எல்லாமே ஒருமை. Many = எல்லாமே பன்மை.",
  tl:"Andhach chinna 'A'-dhaan switch. Many a = ellaame orumai. Many = ellaame panmai.",
  vis:"      LOOK FOR THE ARTICLE\n\n   MANY  a  student  has  his  book.\n          ↑    ↑      ↑    ↑\n         all four are SINGULAR\n\n   MANY   students  have  their books.\n            ↑         ↑      ↑\n         all three are PLURAL\n\n   One tiny 'a' flips the entire sentence."},

 s13:[
 "Many a student who ____ appeared for the test ____ since left the college.|has-has;have-has;has-have|0|'Who' refers to the singular 'student' → HAS appeared. Main verb also singular → HAS left.",
 "Many a soldier, along with his officers, ____ been decorated for bravery in that campaign.|have;has;had|1|Rule 31 removes 'along with his officers'. 'Many a' → HAS BEEN.",
 "Neither many a promise nor the actual schemes ____ improved the lives of the poor here.|has;have;had|1|'Neither...nor' takes the nearest → 'schemes' (plural) → HAVE.",
 "Many an officer and many a clerk ____ been asked to submit ____ report before Monday.|have-their;has-his;has-their|1|'Many a' before each noun forces the singular (like Rule 34) → HAS and HIS.",

 s14:{
  rule:"MANY A takes a singular noun, a singular verb and a singular pronoun.",
  formula:"MANY A + singular noun + singular verb\nMANY + plural noun + plural verb",
  memory:"The tiny article 'a' is the switch. Many a = all singular.",
  ta:"அந்த சின்ன 'a'-தான் switch. Many a = எல்லாமே ஒருமை. Many = எல்லாமே பன்மை.",
  tl:"Andha chinna 'a'-dhaan switch. Many a = ellaame orumai. Many = ellaame panmai.",
  mistake:"Writing 'Many a students have' — plural noun and plural verb after 'many a'.",
  exam:"SSC CGL / CHSL and RRB — a short, high-certainty question if you know the rule."},

 s15:[
 {ta:"'Many a' அப்படிங்கிற அமைப்பு கொஞ்சம் பழைய ஆங்கிலம். இப்போ பேச்சுல அதிகம் பயன்படுத்த மாட்டாங்க. ஆனா SSC-ல இது நிச்சயமா வரும், ஏன்னா இது ஒரு clean rule — தெரிஞ்சா ஒரு mark, தெரியலைன்னா ஒரு mark போச்சு.",
  tl:"'Many a' appadingira amaippu konjam pazhaiya Aangilam. Ippo pechula adhigam payanpaduththa maattaanga. Aanaa SSC-la idhu nichchayamaa varum, yennaa idhu oru clean rule — therinjaa oru mark, theriyalainnaa oru mark pochu."},
 {ta:"விதி ரொம்ப சிம்பிள். 'Many' அப்படின்னு எழுதிட்டு உடனே 'a' வந்தா, அதுக்கு அப்பறம் எல்லாமே ஒருமை. பெயர்ச்சொல் ஒருமை — 'student', 'students' இல்ல. வினைச்சொல் ஒருமை — 'has', 'have' இல்ல. பிரதிபெயர் ஒருமை — 'his', 'their' இல்ல. மூணுமே ஒருமை.",
  tl:"Vidhi romba simple. 'Many' appadinnu ezhudhittu udane 'a' vandhaa, adhukku apparam ellaame orumai. Peyarchol orumai — 'student', 'students' illa. Vinaichol orumai — 'has', 'have' illa. Pirathibeyar orumai — 'his', 'their' illa."},
 {ta:"ஏன் இப்படி? ஒரு சின்ன logic இருக்கு. 'a' அப்படிங்கிறது ஒரு article. Article எப்பவும் ஒருமை பெயர்ச்சொல்லுக்கு முன்னாடிதான் வரும். 'a students' அப்படின்னு எழுத முடியுமா? முடியாது. அதனால 'many a' அப்பறம் கண்டிப்பா ஒருமை. அந்த சின்ன 'a'-தான் முழு வாக்கியத்தையும் பூட்டி வெச்சிருக்கு.",
  tl:"Yen ippadi? Oru chinna logic irukku. 'a' appadingiradhu oru article. Article eppavum orumai peyarcholukku munnaadidhaan varum. 'a students' appadinnu ezhudha mudiyumaa? Mudiyaadhu. Adhanaala 'many a' apparam kandippaa orumai."},
 {ta:"இப்போ ஒரு முக்கியமான point. 'Many a student has failed' அப்படின்னு சொன்னா, அர்த்தம் என்ன? ஒரே ஒரு மாணவர் தோல்வியடைஞ்சாரா? இல்ல! பல மாணவர்கள் தோல்வியடைஞ்சாங்க. அர்த்தம் பன்மை, இலக்கணம் ஒருமை. இது Rule 34 (Each, Every) மற்றும் Rule 36 (Everyone) மாதிரியே. ஆங்கிலம் வலியுறுத்தறதுக்காக ஒவ்வொருத்தரா எண்ணுது.",
  tl:"Ippo oru mukkiyamaana point. 'Many a student has failed' appadinnu sonnaa, arththam enna? Ore oru maanavar tholviyadainjaaraa? Illa! Pala maanavargal tholviyadainjaanga. Arththam panmai, ilakkanam orumai. Idhu Rule 34 matrum Rule 36 maadhiriye."},
 {ta:"கடைசியா ஒரு எச்சரிக்கை. உயிர் ஒலியில் ஆரம்பிக்கிற வார்த்தை வந்தா 'Many an' அப்படின்னு வரும் — 'Many an officer has been transferred'. இங்க 'an' பார்த்து குழம்பாதீங்க. 'a'-வோ 'an'-ஓ, ரெண்டுமே article. ரெண்டுக்கும் அப்பறம் ஒருமைதான். SSC இந்த 'an'-ஐ வெச்சு உங்களை திசைதிருப்ப பார்க்கும்.",
  tl:"Kadaisiyaa oru echcharikkai. Uyir oliyil aarambikkira vaarththai vandhaa 'Many an' appadinnu varum — 'Many an officer has been transferred'. Inga 'an' paarththu kuzhambaadheenga. 'a'-vo 'an'-o, rendume article. Rendukkum apparam orumai-dhaan."}]},

/* ========== RULE 40 ========== */
{n:40,rc:"SVA-10",d:"Hard",t:"MORE THAN ONE takes a Singular Verb",
 tam:"More than one + ஒருமை பெயர்ச்சொல் = ஒருமை வினைச்சொல் · More than one = orumai vinaichol",
 s1:{en:"'More than one' followed by a SINGULAR noun takes a SINGULAR verb, even though the meaning is plural. But 'more than two', 'more than fifty' and 'more than a hundred' all take PLURAL verbs.",
  ta:"'More than one'-க்குப் பின் ஒருமைப் பெயர்ச்சொல் வந்தால், வினைச்சொல் ஒருமையாகவே இருக்கும், பொருள் பன்மையாக இருந்தாலும். ஆனால் 'more than two', 'more than fifty', 'more than a hundred' — இவை அனைத்தும் பன்மை வினைச்சொல்லை எடுக்கும்.",
  tl:"'More than one'-kkup pin orumaip peyarchol vandhaal, vinaichol orumaiyaagave irukkum, porul panmaiyaaga irundhaalum. Aanaal 'more than two', 'more than fifty' — ivai anaiththum panmai vinaicholai edukkum.",
  formula:"MORE THAN ONE  + singular noun + SINGULAR verb\nMORE THAN TWO  + plural noun   + PLURAL verb\n\nMore than one candidate WAS rejected.  ✔\nMore than two candidates WERE rejected. ✔"},

 s2:[
 {h:"The word closest to the noun decides",
  en:"In 'more than one candidate', the word standing immediately before the noun is 'one'. 'One' is singular, so the noun is singular and the verb follows. English is looking at the last number word, not at the total meaning.",
  ta:"'more than one candidate' இதில் பெயர்ச்சொல்லுக்கு உடனே முன்னால் நிற்கும் சொல் 'one'. 'One' ஒருமை, எனவே பெயர்ச்சொல்லும் ஒருமை, வினைச்சொல்லும் அதைப் பின்பற்றுகிறது. ஆங்கிலம் மொத்தப் பொருளைப் பார்க்கவில்லை, கடைசி எண் சொல்லைப் பார்க்கிறது.",
  tl:"'more than one candidate' idhil peyarcholukku udane munnaal nirkum sol 'one'. 'One' orumai, enave peyarcholum orumai, vinaicholum adhaip pinpatrugiradhu. Aangilam moththap porulaip paarkkavillai, kadaisi en sollaip paarkkiradhu."},
 {h:"But MORE THAN ONE OF is plural",
  en:"'More than one of the candidates WERE rejected'. Once 'of' appears with a plural noun, the verb becomes plural. The presence of 'of' changes the whole structure.",
  ta:"ஆனால் 'More than one OF' பன்மை. 'More than one of the candidates WERE rejected'. 'of'-உடன் ஒரு பன்மைப் பெயர்ச்சொல் வந்துவிட்டால், வினைச்சொல் பன்மையாகிவிடும். 'of' இருப்பது முழு அமைப்பையும் மாற்றிவிடுகிறது.",
  tl:"Aanaal 'More than one OF' panmai. 'More than one of the candidates WERE rejected'. 'of'-udan oru panmaip peyarchol vandhuvittaal, vinaichol panmaiyaagividum."},
 {h:"MORE THAN ONE AND MORE THAN ONE is plural",
  en:"When two 'more than one' phrases are joined by AND, the verb becomes plural: 'More than one boy and more than one girl WERE present.' Two compound units make a plural subject.",
  ta:"இரண்டு 'more than one' தொடர்கள் AND-ஆல் இணைக்கப்பட்டால், வினைச்சொல் பன்மையாகிவிடும்: 'More than one boy and more than one girl WERE present.' இரண்டு கூட்டு அலகுகள் ஒரு பன்மை Subject-ஆகின்றன.",
  tl:"Irandu 'more than one' thodargal AND-aal inaikkappattaal, vinaichol panmaiyaagividum. Irandu koottu alagugal oru panmai Subject-aagindrana."}],

 s3:[
 {h:"Read the last word before the noun",
  d:"  More than  ONE  candidate  WAS  rejected.\n              ↑        ↑         ↑\n         singular   singular  singular\n\n  More than  TWO  candidates  WERE  rejected.\n              ↑        ↑          ↑\n          plural    plural     plural"},
 {h:"The 'of' switch",
  d:"  More than one candidate     WAS  rejected.  (no 'of' → singular)\n  More than one OF the candidates WERE rejected.  ('of' → plural)\n                  ↑\n            this changes everything"}],

 s4:{
 wrong:["\"'More than one' obviously means at least two, so plural.\" — Meaning is plural, grammar is singular.",
  "\"The sentence sounds wrong with 'was'.\" — It sounds odd but it is correct.",
  "\"'More than one of the boys was' — 'one' is still there, so singular.\" — No. Once 'of' + plural noun appears, the verb turns plural."],
 right:["Read the word immediately before the noun. Is it 'one' or a bigger number?",
  "Check whether 'of' appears. 'Of' + plural noun → plural verb.",
  "Check whether two 'more than one' phrases are joined by AND → plural verb."]},

 s5:[

 {en:"More than one house has been damaged.",ta:"ஒன்றுக்கு மேற்பட்ட வீடு சேதமடைந்துள்ளது.",tl:"Ondrukku merpatta veedu sedhamadaindhulladhu.",note:"Singular noun 'house' → HAS."},
 {en:"More than two boys were absent yesterday.",ta:"நேற்று இரண்டுக்கு மேற்பட்ட பையன்கள் வரவில்லை.",tl:"Netru irandukku merpatta paiyangal varavillai.",note:"'Two boys' is plural → WERE."},
 {en:"More than one of the students were punished.",ta:"மாணவர்களில் ஒன்றுக்கு மேற்பட்டோர் தண்டிக்கப்பட்டனர்.",tl:"Maanavargalil ondrukku merpattor thandikkappattanar.",note:"'Of the students' makes it plural → WERE."}],

 s10:{
  en:"This rule feels wrong to everyone, which is exactly why it is asked. 'More than one candidate was rejected' means at least two candidates were rejected, yet the verb is singular. Students correct it to 'were' and lose the mark. The second trap is the 'of' version, which behaves in the opposite way. The paper will place both versions in the same question set to see if you know the difference.",
  ta:"இந்த விதி அனைவருக்கும் தவறாகத் தோன்றும், அதனால்தான் இது கேட்கப்படுகிறது. 'More than one candidate was rejected' என்றால் குறைந்தது இரண்டு வேட்பாளர்கள் நிராகரிக்கப்பட்டார்கள் என்று பொருள், இருந்தும் வினைச்சொல் ஒருமை. மாணவர்கள் அதை 'were' என்று திருத்தி mark-ஐ இழக்கிறார்கள். இரண்டாவது பொறி 'of' வடிவம், அது நேர் எதிராகச் செயல்படும். இரண்டு வடிவங்களையும் ஒரே கேள்வித் தொகுப்பில் வைத்து உங்களுக்கு வித்தியாசம் தெரியுமா என்று பார்ப்பார்கள்.",
  tl:"Indha vidhi anaivarukkum thavaraagath thondrum, adhanaal-dhaan idhu ketkappadugiradhu. 'More than one candidate was rejected' endraal kuraindhadhu irandu vetpaalargal niraagarikkappattaargal endru porul, irundhum vinaichol orumai. Maanavargal adhai 'were' endru thiruththi mark-ai izhakkiraargal."},

 s11:{
  en:"READ THE WORD JUST BEFORE THE NOUN. If it is ONE, the verb is singular. If it is any bigger number, the verb is plural. If 'of' appears, the verb is plural.",
  ta:"பெயர்ச்சொல்லுக்கு உடனே முன்னால் இருக்கும் சொல்லைப் படியுங்கள். அது ONE என்றால் வினைச்சொல் ஒருமை. அதைவிடப் பெரிய எண் என்றால் பன்மை. 'of' வந்தால் பன்மை.",
  tl:"Peyarcholukku udane munnaal irukkum sollaip padiyungal. Adhu ONE endraal vinaichol orumai. Adhaividap periya en endraal panmai. 'of' vandhaal panmai.",
  vis:"        THREE-WAY CHECK\n\n  more than ONE  + noun        →  SINGULAR  (was / has / is)\n  more than TWO+ + nouns       →  PLURAL    (were / have / are)\n  more than one OF the nouns   →  PLURAL    (were / have / are)\n                    ↑\n           the word 'of' flips it"},

 s13:[
 "More than one candidate who ____ applied for the post ____ later been disqualified.|have-has;has-has;has-have|1|'Who' refers to the singular 'candidate' → HAS applied. Main verb also singular → HAS BEEN.",
 "More than one of the villages, along with the nearby town, ____ affected by the cyclone.|was;were;is|1|'Of the villages' makes it plural → WERE. 'Along with the nearby town' is ignored (Rule 31).",
 "Neither more than one officer nor the clerks ____ willing to take responsibility for the lapse.|is;are;was|1|'Neither...nor' takes the nearest → 'clerks' (plural) → ARE.",
 "More than one shop and more than one godown ____ been sealed, and each of them ____ locked.|has-was;have-was;have-were|1|Two units joined by AND → HAVE BEEN. 'Each of them' → WAS.",
 "More than one hundred applications ____ received, but more than one applicant ____ found ineligible.|was-were;were-was;were-were|1|'One hundred applications' is plural → WERE. 'More than one applicant' → WAS."],

 s14:{
  rule:"MORE THAN ONE + singular noun takes a singular verb. More than two takes a plural verb.",
  formula:"more than ONE + singular noun → SINGULAR verb\nmore than TWO+ / more than one OF → PLURAL verb",
  memory:"Read the word just before the noun. ONE means singular. 'Of' flips it to plural.",
  ta:"பெயர்ச்சொல்லுக்கு முன்னாடி இருக்கிற வார்த்தைய பாருங்க. ONE-னா ஒருமை. 'of' வந்தா பன்மை.",
  tl:"Peyarcholukku munnaadi irukkira vaarththaiya paarunga. ONE-naa orumai. 'of' vandhaa panmai.",
  mistake:"Choosing a plural verb because 'more than one' obviously means two or more.",
  exam:"SSC CGL Tier-1 and Bank PO — a favourite because it defies common sense."},

 s15:[
 {ta:"இந்த rule-ஐ முதல்ல கேட்கும்போது எல்லாருக்கும் ஒரு எரிச்சல் வரும். 'More than one candidate was rejected' — இதுல 'more than one' அப்படின்னா குறைஞ்சது ரெண்டு பேரு இல்லையா? அப்புறம் ஏன் 'was'? 'were' இல்லையா சரி? நியாயமான கேள்வி. ஆனா ஆங்கிலம் இங்க logic-ஐ பார்க்கல, form-ஐ பார்க்குது.",
  tl:"Indha rule-ai mudhalla ketkumbodhu ellaarukkum oru erichal varum. 'More than one candidate was rejected' — idhula 'more than one' appadinnaa kurainjadhu rendu peru illaiyaa? Appuram yen 'was'? Niyaayamaana kelvi. Aanaa Aangilam inga logic-ai paarkkala, form-ai paarkkudhu."},
 {ta:"விளக்கம் இதுதான். பெயர்ச்சொல்லுக்கு உடனே முன்னாடி இருக்கிற வார்த்தையை பாருங்க. 'more than one CANDIDATE' — 'candidate'-க்கு முன்னாடி என்ன இருக்கு? 'one'. 'One' ஒருமை. அதனால 'candidate'-உம் ஒருமை ('candidates' இல்ல, கவனிச்சீங்களா?). பெயர்ச்சொல் ஒருமையா இருந்தா verb-உம் ஒருமைதான். WAS.",
  tl:"Vilakkam idhudhaan. Peyarcholukku udane munnaadi irukkira vaarththaiyai paarunga. 'more than one CANDIDATE' — 'candidate'-kku munnaadi enna irukku? 'one'. 'One' orumai. Adhanaala 'candidate'-um orumai ('candidates' illa, kavanichcheengalaa?). Peyarchol orumaiyaa irundhaa verb-um orumai-dhaan. WAS."},
 {ta:"இதை சோதிச்சுப் பாருங்க — 'More than one candidateS' அப்படின்னு எழுத முடியுமா? முடியாது இல்லையா? காதுக்கே சரியா கேட்காது. அதனாலதான் verb-உம் ஒருமை. பெயர்ச்சொல் ஒருமையா இருக்கும்போது verb எப்படி பன்மையா இருக்க முடியும்?",
  tl:"Idhai sodhichup paarunga — 'More than one candidateS' appadinnu ezhudha mudiyumaa? Mudiyaadhu illaiyaa? Kaadhukke sariyaa ketkaadhu. Adhanaaladhaan verb-um orumai. Peyarchol orumaiyaa irukkumbodhu verb eppadi panmaiyaa irukka mudiyum?"},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு switch — 'of'. 'More than one OF the candidates were rejected.' இங்க 'of' வந்துடுச்சு, அதுக்கு அப்பறம் 'candidates' பன்மை. இப்போ verb பன்மை. WERE. அதே 'more than one', ஆனா 'of' இருக்கிறதால முழு விதியும் மாறிடுச்சு. SSC இந்த ரெண்டையும் ஒரே தேர்வுல வெச்சு உங்களை test பண்ணும்.",
  tl:"Ippo romba mukkiyamaana oru switch — 'of'. 'More than one OF the candidates were rejected.' Inga 'of' vandhuduchu, adhukku apparam 'candidates' panmai. Ippo verb panmai. WERE. Adhe 'more than one', aanaa 'of' irukkiradhaala muzhu vidhiyum maaridhuchu."},
 {ta:"இன்னொரு switch — AND. 'More than one boy and more than one girl WERE present.' இங்க ரெண்டு 'more than one' தொடர் AND-ஆல இணைஞ்சிருக்கு. ரெண்டு அலகு. அதனால பன்மை. Rule 32-ஓட logic இங்க வேலை செய்யுது.",
  tl:"Innoru switch — AND. 'More than one boy and more than one girl WERE present.' Inga rendu 'more than one' thodar AND-aala inainjirukku. Rendu alagu. Adhanaala panmai. Rule 32-oda logic inga velai seyyudhu."},
 {ta:"கடைசியா ஒரு எளிமையான check-list மனசுல வெச்சுக்கோங்க. ஒண்ணு: பெயர்ச்சொல்லுக்கு முன்னாடி 'one'-ஆ இல்ல பெரிய எண்ணா? ரெண்டு: 'of' இருக்கா? மூணு: AND-ஆல ரெண்டு தொடர் இணைஞ்சிருக்கா? இந்த மூணு கேள்வியை கேட்டா, இந்த rule-ல நீங்க ஒருபோதும் தப்பு பண்ண மாட்டீங்க.",
  tl:"Kadaisiyaa oru elimaiyaana check-list manasula vechukkonga. Onnu: peyarcholukku munnaadi 'one'-aa illa periya ennaa? Rendu: 'of' irukkaa? Moonu: AND-aala rendu thodar inainjirukkaa? Indha moonu kelviyai kettaa, indha rule-la neenga orupodhum thappu panna maatteenga."}]},
/* ========== RULE 41 ========== */
{n:41,rc:"SVA-11",d:"Medium",t:"Plural-Looking Names, Titles and Diseases take a Singular Verb",
 tam:"பன்மை போலத் தோன்றும் பெயர்கள் ஒருமை வினைச்சொல் எடுக்கும் · Panmai polath thondrum peyargal orumai vinaichol edukkum",
 s1:{en:"Names of countries, books, films, organisations, newspapers and diseases that END IN -S are still ONE single thing, so they take a SINGULAR verb.",
  ta:"-S-ல் முடியும் நாடுகள், நூல்கள், திரைப்படங்கள், நிறுவனங்கள், செய்தித்தாள்கள் மற்றும் நோய்களின் பெயர்கள் — இவை அனைத்தும் ஒரே ஒரு பொருள்தான், எனவே ஒருமை வினைச்சொல்லை எடுக்கும்.",
  tl:"-S-l mudiyum naadugal, noolgal, thiraippadangal, niruvanangal, seydhiththaalgal matrum noygalin peyargal — ivai anaiththum ore oru porul-dhaan, enave orumai vinaicholai edukkum.",
  formula:"ONE NAME  =  ONE THING  =  ONE (SINGULAR) VERB\n\nThe United States   IS   a superpower.\nGulliver's Travels  IS   a classic.\nMeasles             IS   contagious.\nThe Philippines     HAS  many islands."},

 s2:[
 {h:"A name is a label, not a count",
  en:"'The United States' contains fifty states, but the NAME refers to one country. 'Gulliver's Travels' describes many journeys, but the NAME refers to one book. The -s belongs to the name, not to the grammar.",
  ta:"'The United States'-ல் ஐம்பது மாநிலங்கள் உள்ளன, ஆனால் அந்தப் பெயர் ஒரே ஒரு நாட்டைக் குறிக்கிறது. 'Gulliver's Travels' பல பயணங்களை விவரிக்கிறது, ஆனால் அந்தப் பெயர் ஒரே ஒரு நூலைக் குறிக்கிறது. அந்த -s பெயருக்குச் சொந்தமானது, இலக்கணத்திற்கு அல்ல.",
  tl:"'The United States'-l aimbadhu maanilangal ullana, aanaal andhap peyar ore oru naattaik kurikkiradhu. 'Gulliver's Travels' pala payanangalai vivarikkiradhu, aanaal andhap peyar ore oru noolaik kurikkiradhu. Andha -s peyarukkuch sondhamaanadhu, ilakkanaththirku alla."},
 {h:"The four families you must know",
  en:"COUNTRIES: The United States, The Netherlands, The Philippines, The United Arab Emirates, The West Indies. BOOKS AND FILMS: Gulliver's Travels, The Arabian Nights, Great Expectations, Hard Times. DISEASES: measles, mumps, rickets, diabetes, shingles, rabies. SUBJECTS: mathematics, physics, economics, politics, ethics, statistics, athletics, gymnastics.",
  ta:"தெரிந்திருக்க வேண்டிய நான்கு குடும்பங்கள். நாடுகள்: The United States, The Netherlands, The Philippines, The West Indies. நூல்கள்/திரைப்படங்கள்: Gulliver's Travels, The Arabian Nights, Great Expectations. நோய்கள்: measles, mumps, rickets, diabetes, rabies. பாடங்கள்: mathematics, physics, economics, politics, ethics, statistics.",
  tl:"Therindhirukka vendiya naangu kudumbangal. Naadugal: The United States, The Netherlands, The Philippines. Noolgal: Gulliver's Travels, The Arabian Nights. Noygal: measles, mumps, diabetes, rabies. Paadangal: mathematics, physics, economics, politics, statistics."},
 {h:"Two words that switch sides",
  en:"POLITICS and STATISTICS are singular as subject names ('Politics is a dirty game', 'Statistics is a branch of maths') but PLURAL when they mean personal views or actual figures ('His politics are unclear', 'These statistics are misleading').",
  ta:"POLITICS மற்றும் STATISTICS — இரண்டும் பாடப் பெயர்களாக வரும்போது ஒருமை ('Politics is a dirty game', 'Statistics is a branch of maths'), ஆனால் தனிப்பட்ட கருத்துக்களையோ உண்மையான புள்ளிவிவரங்களையோ குறிக்கும்போது பன்மை ('His politics are unclear', 'These statistics are misleading').",
  tl:"POLITICS matrum STATISTICS — rendum paadap peyargalaaga varumbodhu orumai, aanaal thanippatta karuththukkalaiyo unmaiyaana pullivivarangalaiyo kurikkumbodhu panmai."}],

 s3:[
 {h:"The -s is part of the name",
  d:"  The United States   IS  a superpower.\n         ↑\n     the -s is spelling, NOT a plural marker\n\n  Think of it as one flag, one map, one country.\n\n    🇺🇸  =  ONE  →  IS"},
 {h:"Same word, two meanings",
  d:"  SUBJECT NAME (singular)      ACTUAL FIGURES (plural)\n  ────────────────────────      ───────────────────────\n  Politics IS a dirty game.     His politics ARE unclear.\n  Statistics IS a science.      These statistics ARE wrong.\n  Economics IS my subject.      \n\n  Ask: am I naming a SUBJECT or describing REAL things?"}],

 s4:{
 wrong:["\"It ends in -s, so it must be plural.\" — The -s is part of the spelling of the name.",
  "\"'The United States' has fifty states, so plural.\" — The name refers to one country.",
  "\"'Mathematics' obviously covers many topics, so plural.\" — It is one subject.",
  "\"'The Philippines are islands' sounds right.\" — As a country name it is singular: 'The Philippines IS an archipelago.'"],
 right:["Ask: is this the NAME of one thing? If yes → singular verb.",
  "Memorise the four families: countries, books, diseases, subjects.",
  "For politics and statistics, ask whether you mean the SUBJECT or the actual FIGURES."]},

 s5:[
 {en:"The United States is a superpower today.",ta:"அமெரிக்க ஐக்கிய நாடு இன்று ஒரு வல்லரசாக உள்ளது.",tl:"America aikkiya naadu indru oru vallarasaaga ulladhu.",note:"One country name → IS, despite the -s."},
 {en:"Gulliver's Travels is a famous classic.",ta:"கல்லிவரின் பயணங்கள் ஒரு புகழ்பெற்ற செவ்வியல் நூல்.",tl:"Gulliver-in payanangal oru pugazhpetra sevviyal nool.",note:"One book → IS."},
 {en:"Measles is a contagious disease.",ta:"தட்டம்மை என்பது ஒரு தொற்று நோய்.",tl:"Thattammai enbadhu oru thotru noy.",note:"One disease → IS."},
 {en:"Mathematics is my favourite subject.",ta:"கணிதம் என்னுடைய விருப்பமான பாடம்.",tl:"Kanidham ennudaiya viruppamaana paadam.",note:"One subject → IS."},
 {en:"These statistics are misleading.",ta:"இந்தப் புள்ளிவிவரங்கள் தவறாக வழிநடத்துபவை.",tl:"Indhap pullivivarangal thavaraaga vazhinadaththubavai.",note:"Here 'statistics' means actual figures → ARE."}],

 s9:[
 "Find the Error|The United States (A) have imposed (B) new tariffs (C) on several countries (D).|A;B;C;D|1|Part B. A country name is singular → 'has imposed'.",
 "Fill in the Blank|Mumps ____ a viral infection that mainly affects children.|is;are|0|One disease → IS.",
 "Sentence Improvement|Economics are a very interesting subject to study.|are;is;were|1|A subject name is singular → IS.",
 "Find the Error|The statistics (A) presented in the report (B) is quite misleading (C) to the public (D).|A;B;C;D|2|Part C. Here 'statistics' means actual figures → 'are quite misleading'.",
 "Fill in the Blank|The Arabian Nights ____ been translated into many languages.|has;have|0|One book → HAS."],

 s10:{
  en:"The exam relies on the -s ending. Your eye sees 'States', 'Travels', 'Nights', 'measles' and immediately writes a plural verb. The deeper trap is politics and statistics, where the SAME word can be singular or plural depending on meaning. The paper will give you 'Statistics is a branch of mathematics' and 'These statistics are misleading' in the same set to check whether you understand or merely memorised.",
  ta:"தேர்வு -s விகுதியை நம்பியிருக்கிறது. உங்கள் கண் 'States', 'Travels', 'Nights', 'measles' ஆகியவற்றைப் பார்த்தவுடன் பன்மை வினைச்சொல்லை எழுதிவிடும். ஆழமான பொறி politics மற்றும் statistics — அங்கே ஒரே சொல் பொருளைப் பொறுத்து ஒருமையாகவோ பன்மையாகவோ இருக்கும். நீங்கள் புரிந்து வைத்திருக்கிறீர்களா அல்லது வெறுமனே மனப்பாடம் செய்திருக்கிறீர்களா என்று சோதிக்க இரண்டு வடிவங்களையும் ஒரே தொகுப்பில் தருவார்கள்.",
  tl:"Thervu -s vigudhiyai nambiyirukkiradhu. Ungal kan 'States', 'Travels', 'measles' aagiyavatraip paarththavudan panmai vinaicholai ezhudhividum. Aazhamaana pori politics matrum statistics — ange ore sol porulaip poruththu orumaiyaagavo panmaiyaagavo irukkum."},

 s11:{
  en:"ONE NAME = ONE THING = ONE VERB. The -s is spelling, not grammar.",
  ta:"ஒரு பெயர் = ஒரு பொருள் = ஒருமை வினைச்சொல். அந்த -s எழுத்துக்கூட்டல், இலக்கணம் அல்ல.",
  tl:"Oru peyar = oru porul = orumai vinaichol. Andha -s ezhuththukkoottal, ilakkanam alla.",
  vis:"    FOUR FAMILIES — ALL SINGULAR\n\n  🌍 COUNTRIES : United States, Netherlands, Philippines\n  📖 BOOKS     : Gulliver's Travels, The Arabian Nights\n  🤒 DISEASES  : measles, mumps, diabetes, rabies\n  📐 SUBJECTS  : mathematics, physics, economics, ethics\n\n  TWO THAT SWITCH:\n  politics / statistics  →  subject = IS,  figures = ARE"},
