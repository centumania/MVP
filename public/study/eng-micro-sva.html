<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Subject-Verb Agreement — 20 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="logo">CentuMania</div>
  <h2>Subject-Verb Agreement</h2>
  <div class="msub">Module 4 · 20 Micro-Classes · Rules 31–50</div>
  <div class="rlist" id="rlist"></div>
</aside>
<main>
  <div class="top">
    <h1 id="tt"></h1>
    <span class="badge" id="tdiff"></span>
    <span class="mono" id="trc"></span>
    <div class="navbtns">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn" id="allopen">Open all steps</button>
      <button class="btn pri" id="next">Next →</button>
    </div>
    <div class="tta" id="tta"></div>
  </div>
  <div class="body" id="body"></div>
  <footer>CentuMania · Subject-Verb Agreement Micro-Classes · 15-step teaching format · Tamil + Tanglish</footer>
</main>
</div>

<script>
/* ============ COMPACT DATA FORMAT ============
   s7  solved examples : "sentence|answer|Level|why"
   s8  wrong vs right  : "wrong|correct|why"
   s9  PYQ             : "Type|question|optA;optB;optC|ansIdx|solution"
   s12 practice        : "sentence with ____|optA;optB|ansIdx"
   s13 challenge       : "question|optA;optB;optC|ansIdx|solution"
   s6  word-by-word    : "word|tamil|tanglish"
============================================== */
const RULES=[
/* ========== RULE 31 ========== */
{n:31,rc:"SVA-01",d:"Hard",t:"With / Along with / As well as — the Hidden Subject Trap",
 tam:"இடையில் வரும் சொற்கள் வினைச்சொல்லை மாற்றாது · Idaiyil varum sorkal vinaicholai maatraathu",
 s1:{en:"Words placed between the subject and the verb NEVER change the verb. Phrases beginning with with, along with, as well as, together with, besides, in addition to, accompanied by, including, like and rather than are only extra information. The verb obeys the ORIGINAL subject.",
  ta:"Subject-க்கும் Verb-க்கும் இடையில் வரும் சொற்கள் ஒருபோதும் வினைச்சொல்லை மாற்றாது. 'with', 'along with', 'as well as' போன்ற தொடர்கள் வெறும் கூடுதல் தகவல் மட்டுமே. வினைச்சொல் எப்போதும் உண்மையான Subject-ஐப் பார்த்தே வரும்.",
  tl:"Subject-kkum Verb-kkum idaiyil varum sorkal orupothum vinaicholai maatraathu. 'with', 'along with', 'as well as' pondra thodargal verum koodudhal thagaval mattume. Vinaichol eppothum unmaiyaana Subject-aip paarthe varum.",
  formula:"Subject  +  [ with / as well as / along with ... ]  +  VERB\n   ↑                    ↑                            ↑\n REAL             IGNORE THIS                  follows\nSUBJECT          (extra info only)          the REAL subject"},

 s2:[
 {h:"The core idea",
  en:"English has a grammatical subject and an added companion. Only the grammatical subject controls the verb. The companion is grammatically invisible.",
  ta:"ஆங்கிலத்தில் ஒரு இலக்கண Subject உண்டு, அத்துடன் சேர்க்கப்படும் ஒரு துணைச் சொல்லும் உண்டு. இலக்கண Subject மட்டுமே வினைச்சொல்லைக் கட்டுப்படுத்தும். துணைச் சொல் இலக்கணத்தில் கண்ணுக்குத் தெரியாதது போலவே.",
  tl:"Aangilaththil oru ilakkana Subject undu, adhudan serkkappadum oru thunaichol-um undu. Ilakkana Subject mattume vinaicholai kattuppaduththum. Thunaichol ilakkanaththil kannukku theriyaadhadhu polave."},
 {h:"Why the comma is your best friend",
  en:"These phrases are almost always wrapped in commas. Whatever sits between two commas can be deleted and the sentence must still stand. If it can be deleted, it cannot control the verb.",
  ta:"இந்தத் தொடர்கள் எப்போதும் காற்புள்ளிகளுக்கு (comma) இடையில் வரும். இரண்டு comma-க்கு இடையில் இருப்பதை நீக்கிவிட்டாலும் வாக்கியம் நிற்க வேண்டும். நீக்க முடிகிறது என்றால், அது வினைச்சொல்லைக் கட்டுப்படுத்த முடியாது.",
  tl:"Indha thodargal eppothum caarpullikalukku (comma) idaiyil varum. Irandu comma-kku idaiyil iruppadhai neekkividdaalum vaakkiyam nirka vendum. Neekka mudigiradhu endraal, adhu vinaicholai kattuppaduththa mudiyaadhu."},
 {h:"Compare AND with AS WELL AS",
  en:"'Ram and Shyam are coming' is plural because AND joins two equal subjects. 'Ram as well as Shyam is coming' is singular because AS WELL AS only adds information about Ram. This one difference is the whole rule.",
  ta:"'Ram and Shyam are coming' — இங்கே AND இரண்டு சம Subject-களை இணைப்பதால் பன்மை. 'Ram as well as Shyam is coming' — இங்கே AS WELL AS என்பது Ram பற்றிய கூடுதல் தகவல் மட்டுமே தருவதால் ஒருமை. இந்த ஒரு வித்தியாசம்தான் முழு விதி.",
  tl:"'Ram and Shyam are coming' — inge AND irandu sama Subject-kalai inaippadhaal panmai. 'Ram as well as Shyam is coming' — inge AS WELL AS enbadhu Ram patriya koodudhal thagaval mattume tharuvadhaal orumai. Indha oru viththiyaasam-dhaan muzhu vidhi."},
 {h:"The full list you must memorise",
  en:"with, along with, as well as, together with, besides, in addition to, accompanied by, including, like, unlike, rather than, no less than, and not, but not, except, apart from, in the company of.",
  ta:"நினைவில் வைக்க வேண்டிய முழுப் பட்டியல்: with, along with, as well as, together with, besides, in addition to, accompanied by, including, like, unlike, rather than, no less than, and not, but not, except, apart from.",
  tl:"Ninaivil vaikka vendiya muzhu pattiyal: with, along with, as well as, together with, besides, in addition to, accompanied by, including, like, unlike, rather than, no less than, and not, but not, except, apart from."}],

 s3:[
 {h:"Cover the middle with your finger",
  d:"The captain , along with his eleven players , WAS felicitated.\n     ↑           └────── COVER THIS ──────┘        ↑\n  SUBJECT            (delete it mentally)        follows captain\n\nAfter covering:  The captain WAS felicitated.  ✔"},
 {h:"AND builds a bridge — AS WELL AS does not",
  d:"AND  (joins → makes plural)          AS WELL AS  (adds → stays singular)\n\n  Ram ═══╗                              Ram ──────► VERB (is)\n         ╠══► VERB (are)                  ╎\n Shyam ══╝                              (Shyam)  ← just extra info\n\n Ram and Shyam ARE coming.             Ram as well as Shyam IS coming."},
 {h:"Where the eye goes wrong",
  d:"The teacher , with her students , ____ coming.\n                          ↑\n              Your eye lands HERE (plural)  →  you write ARE  ✘\n\n        ↑\n Your eye MUST land HERE (singular) →  you write IS  ✔"}],

 s4:{
 wrong:[
  "\"I see 'students' just before the blank, so the verb must be plural.\" — The word nearest the verb is NOT automatically the subject.",
  "\"'As well as' means 'and', so it makes two subjects.\" — In meaning yes, in grammar no. 'As well as' is a preposition-like connector, not a coordinating conjunction.",
  "\"There are clearly two people, so the verb should be plural.\" — Grammar counts subjects, not people.",
  "\"'Along with his players' feels like part of the subject.\" — It is a parenthetical phrase, sealed off by commas."],
 right:[
  "Find the verb first. Then walk backwards and ask: WHO is doing this? That noun is the subject.",
  "Cover everything between the two commas with your finger. Read what remains.",
  "Only AND creates a compound plural subject. Nothing else on the list does.",
  "If the sentence still makes sense after deleting the phrase, the phrase is invisible to the verb."]},

 s5:[
 {en:"The captain, along with his players, was felicitated.",
  ta:"கேப்டன், அவருடைய வீரர்களுடன் சேர்ந்து, கௌரவிக்கப்பட்டார்.",
  tl:"Captain, avarudaiya veerargaludan serndhu, gauravikkappattaar.",
  note:"Subject = captain (singular) → WAS. 'Players' is only extra information."},
 {en:"Ram, as well as his brothers, has gone to Delhi.",
  ta:"ராம், அவனுடைய சகோதரர்களுடன் சேர்த்து, டெல்லிக்குச் சென்றுவிட்டான்.",
  tl:"Ram, avanudaiya sagodharargaludan serthu, Delhi-kkuch chendruvittaan.",
  note:"Subject = Ram (singular) → HAS. Not 'have', even though brothers is plural."},
 {en:"The manager, together with his assistants, is attending the meeting.",
  ta:"மேலாளர், அவருடைய உதவியாளர்களுடன் சேர்ந்து, கூட்டத்தில் கலந்து கொள்கிறார்.",
  tl:"Melaalar, avarudaiya udhaviyaalargaludan serndhu, koottaththil kalandhu kolgiraar.",
  note:"Subject = manager (singular) → IS."},
 {en:"The students, accompanied by their teacher, were taken to the museum.",
  ta:"மாணவர்கள், அவர்களுடைய ஆசிரியருடன், அருங்காட்சியகத்திற்கு அழைத்துச் செல்லப்பட்டனர்.",
  tl:"Maanavargal, avargaludaiya aasiriyarudan, arungaatchiyagaththirku azhaiththuch sellappattanar.",
  note:"Now the SUBJECT itself is plural (students) → WERE. The rule works both ways."},
 {en:"No one except the two brothers knows the truth.",
  ta:"அந்த இரண்டு சகோதரர்களைத் தவிர வேறு யாருக்கும் உண்மை தெரியாது.",
  tl:"Andha irandu sagodharargalaith thavira veru yaarukkum unmai theriyaadhu.",
  note:"Subject = No one (singular) → KNOWS. 'Except the two brothers' is invisible."}],

 s6:["The captain|கேப்டன் / தலைவர்|Captain / Thalaivar",
  "along with|உடன் சேர்ந்து|Udan serndhu",
  "his|அவருடைய|Avarudaiya",
  "players|வீரர்கள்|Veerargal",
  "was|இருந்தார் (ஒருமை)|Irundhaar (orumai)",
  "felicitated|கௌரவிக்கப்பட்டார்|Gauravikkappattaar",
  "as well as|அத்துடன் சேர்த்து|Adhudan serthu",
  "together with|ஒன்றாகச் சேர்ந்து|Ondraagach serndhu",
  "accompanied by|உடன் வந்த|Udan vandha",
  "besides|தவிர / கூடுதலாக|Thavira / Koodudhalaaga",
  "in addition to|கூடுதலாக|Koodudhalaaga",
  "including|உட்பட|Utpada",
  "rather than|அதற்குப் பதிலாக|Adharkup padhilaaga",
  "has gone|சென்றுவிட்டான் (ஒருமை)|Chendruvittaan (orumai)"],

 s7:[
 "Ram, with his friend, ____ going to school.|is|Easy|Subject = Ram (singular).",
 "The boy, along with his dog, ____ walking.|is|Easy|Subject = The boy.",
 "My father, as well as my uncle, ____ a farmer.|is|Easy|Subject = My father.",
 "The teacher, with her students, ____ visiting the zoo.|is|Easy|'With her students' is extra.",
 "The principal, along with the teachers, ____ present.|is|Medium|Subject = principal.",
 "The students, along with the principal, ____ present.|are|Medium|Subject is now 'students' — plural.",
 "Sita, as well as her sisters, ____ invited to the party.|was|Medium|Subject = Sita (singular past).",
 "The officer, accompanied by two guards, ____ entered the hall.|has|Medium|Subject = officer.",
 "The books, together with the pen, ____ on the table.|are|Medium|Subject = books (plural).",
 "Nobody except the twins ____ the answer.|knows|Hard|'Nobody' is singular.",
 "All the members, including the chairman, ____ signed the document.|have|Hard|Subject = All the members (plural).",
 "The quality of the mangoes, unlike the apples, ____ excellent.|is|Hard|Subject = quality (singular).",
 "The minister, no less than his officers, ____ responsible for the failure.|is|Hard|Subject = minister.",
 "Rice, rather than wheat, ____ grown in this district.|is|Hard|Subject = rice.",
 "The witnesses, apart from the accused, ____ questioned again.|were|Expert|Subject = witnesses (plural)."],

 s8:[
 "The captain along with his players were felicitated.|The captain along with his players was felicitated.|Subject is 'captain' — singular.",
 "Ram as well as his brothers have gone.|Ram as well as his brothers has gone.|'As well as' does not create a plural subject.",
 "The teacher with her students are coming.|The teacher with her students is coming.|'With her students' is extra information.",
 "The manager, together with his staff, are on leave.|The manager, together with his staff, is on leave.|Delete the phrase between commas and read again.",
 "The boys, accompanied by their coach, was late.|The boys, accompanied by their coach, were late.|Here the subject 'boys' is plural.",
 "Nobody except the two girls know the secret.|Nobody except the two girls knows the secret.|'Nobody' is singular.",
 "The quality of the products are poor.|The quality of the products is poor.|Subject = quality, not products.",
 "The list of items were long.|The list of items was long.|Subject = list, not items.",
 "The minister, besides his aides, were present.|The minister, besides his aides, was present.|'Besides his aides' is parenthetical.",
 "Tea, rather than coffee, are served here.|Tea, rather than coffee, is served here.|Subject = tea (singular)."],

 s9:[
 "Find the Error|The Collector, along with his subordinates, (A) were present (B) at the function (C) held yesterday (D).|A;B;C;D|0|Part A is wrong. Subject = 'The Collector' (singular), so it must be 'was present'.",
 "Fill in the Blank|The Chief Minister, accompanied by the officials, ____ inaugurated the bridge.|has;have|0|Subject = Chief Minister (singular) → HAS.",
 "Sentence Improvement|My brother, as well as my cousins, are going abroad.|are going;is going;were going|1|Subject = My brother → IS going.",
 "Find the Error|All the students (A), including the monitor (B), was asked (C) to leave the hall (D).|A;B;C;D|2|Part C. Subject = 'All the students' (plural) → 'were asked'.",
 "Fill in the Blank|Nothing but a few coins ____ found in his pocket.|was;were|0|'Nothing' is the subject and is singular."],

 s10:{
  en:"The exam deliberately places a PLURAL noun immediately before the blank so that your eye grabs it. In 'The captain, along with his eleven players, ____ felicitated', the word sitting next to the blank is 'players'. Your brain screams ARE. But 'players' is not the subject — 'captain' is. SSC has repeated this pattern in almost every single year of Tier-1.",
  ta:"தேர்வு வேண்டுமென்றே ஒரு பன்மைப் பெயர்ச்சொல்லை blank-க்கு அருகிலேயே வைக்கும், உங்கள் கண் அதைப் பிடிக்க வேண்டும் என்பதற்காக. 'The captain, along with his eleven players, ____ felicitated' இதில் blank-க்கு அருகில் இருப்பது 'players'. உங்கள் மூளை உடனே ARE என்று சொல்லும். ஆனால் 'players' Subject அல்ல — 'captain'தான் Subject. SSC Tier-1-ல் கிட்டத்தட்ட ஒவ்வொரு வருடமும் இதே pattern வந்திருக்கிறது.",
  tl:"Thervu vendumendre oru panmaip peyarcholai blank-kku arugileye vaikkum, ungal kan adhaip pidikka vendum enbadharkaaga. Indha vaakkiyaththil blank-kku arugil iruppadhu 'players'. Ungal moolai udane ARE endru sollum. Aanaal 'players' Subject alla — 'captain'-dhaan Subject. SSC Tier-1-l kittaththatta ovvoru varudamum idhe pattern vandhirukkiradhu."},

 s11:{
  en:"FINGER TEST: physically cover everything between the two commas. Read the sentence again. Whatever verb sounds right now IS right.",
  ta:"விரல் சோதனை: இரண்டு comma-க்கு இடையில் உள்ள அனைத்தையும் உங்கள் விரலால் மூடுங்கள். வாக்கியத்தை மீண்டும் படியுங்கள். இப்போது எந்த verb சரியாகத் தோன்றுகிறதோ, அதுவே சரி.",
  tl:"Viral sodhanai: irandu comma-kku idaiyil ulla anaiththaiyum ungal viralaal moodungal. Vaakkiyaththai meendum padiyungal. Ippodhu endha verb sariyaagath thondrugiradho, adhuve sari.",
  vis:"   ONLY 'AND' MAKES PLURAL.  EVERYTHING ELSE IS A GHOST.\n\n   and          →  PLURAL   ✔\n   with         →  ghost 👻  (no effect)\n   along with   →  ghost 👻\n   as well as   →  ghost 👻\n   together with→  ghost 👻\n   besides      →  ghost 👻\n   including    →  ghost 👻\n   accompanied by → ghost 👻"},

 s13:[

 s14:{
  rule:"Words between the subject and the verb never change the verb.",
  formula:"Subject + [with / as well as / along with / besides ...] + VERB → follows SUBJECT",
  memory:"Cover the commas with your finger. Only AND makes plural.",
  ta:"இடையில் வரும் தொடர் = கண்ணுக்குத் தெரியாத பேய். AND மட்டுமே பன்மை ஆக்கும்.",
  tl:"Idaiyil varum thodar = kannukkuth theriyaadha pey. AND mattume panmai aakkum.",
  mistake:"Choosing a plural verb because a plural noun sits just before the blank.",
  exam:"SSC CGL / CHSL / MTS / RRB NTPC — appears almost every year in Error Spotting."},

 s15:[
 {ta:"வாங்க, இந்த Rule-ஐ ஒரு வகுப்பறையில் இருப்பது போல பார்ப்போம். நான் board-ல ஒரு வாக்கியம் எழுதுறேன்: 'The captain, along with his eleven players, ____ felicitated.' இப்போ class-ல 90% பேரு ARE-ன்னு சொல்லுவாங்க. ஏன் தெரியுமா? ஏன்னா blank-க்கு பக்கத்துலயே 'players'-ன்னு ஒரு பன்மை வார்த்தை உட்கார்ந்து இருக்கு. நம்ம கண் அதைத்தான் முதல்ல பார்க்குது.",
  tl:"Vaanga, indha Rule-ai oru vagupparaiyil iruppadhu pola paarpom. Naan board-la oru vaakkiyam ezhudhuren: 'The captain, along with his eleven players, ____ felicitated.' Ippo class-la 90% peru ARE-nnu solluvaanga. Yen theriyumaa? Yennaa blank-kku pakkaththulaye 'players'-nnu oru panmai vaarththai utkaarndhu irukku. Namma kan adhaith-thaan mudhalla paarkkudhu."},
 {ta:"ஆனா ஒரு நிமிஷம் யோசிங்க. கௌரவிக்கப்பட்டது யாரு? கேப்டன். வீரர்கள் இல்ல. 'along with his eleven players' அப்படிங்கிறது வெறும் கூடுதல் தகவல் — 'கேப்டன் தனியா வரல, team-ஓட வந்தாரு' அப்படிங்கிற ஒரு சின்ன குறிப்பு. அவ்ளோதான். அதுக்கு verb-ஐ மாத்துற அதிகாரம் கிடையாது.",
  tl:"Aanaa oru nimisham yosinga. Gauravikkappattadhu yaaru? Captain. Veerargal illa. 'Along with his eleven players' appadingiradhu verum koodudhal thagaval — 'Captain thaniyaa varala, team-oda vandhaaru' appadingira oru chinna kurippu. Avlodhaan. Adhukku verb-ai maaththura adhigaaram kidaiyaadhu."},
 {ta:"இதை நான் 'பேய் விதி' (Ghost Rule) அப்படின்னு சொல்லுவேன். இரண்டு comma-க்கு நடுவுல இருக்கிற எல்லாமே பேய் மாதிரி — கண்ணுக்குத் தெரியும், ஆனா தொட முடியாது, verb-ஐ பாதிக்கவும் முடியாது. உங்க விரலை எடுத்து அந்த பகுதியை மூடுங்க. 'The captain ____ felicitated.' இப்போ சொல்லுங்க — WAS-ஆ ARE-ஆ? WAS. முடிஞ்சது.",
  tl:"Idhai naan 'Pey Vidhi' (Ghost Rule) appadinnu solluven. Irandu comma-kku naduvula irukkira ellaame pey maadhiri — kannukkuth theriyum, aanaa thoda mudiyaadhu, verb-ai paadhikkavum mudiyaadhu. Unga viralai eduththu andha paguthiyai moodunga. 'The captain ____ felicitated.' Ippo sollunga — WAS-aa ARE-aa? WAS. Mudinjadhu."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு point. 'and' மட்டும் இதுல வேற. 'Ram and Shyam are coming' — இங்க AND ரெண்டு பேரையும் சமமா இணைக்குது, அதனால பன்மை. ஆனா 'Ram as well as Shyam is coming' — இங்க as well as ரெண்டு பேரையும் இணைக்கல, Ram பத்தி கூடுதல் தகவல் மட்டும் தருது. அர்த்தத்துல ரெண்டும் ஒண்ணு மாதிரி தெரியும், ஆனா இலக்கணத்துல வேற வேற. SSC இந்த வித்தியாசத்தைத்தான் test பண்ணுது.",
  tl:"Ippo romba mukkiyamaana oru point. 'and' mattum idhula veru. 'Ram and Shyam are coming' — inga AND rendu perayum samamaa inaikkudhu, adhanaala panmai. Aanaa 'Ram as well as Shyam is coming' — inga as well as rendu perayum inaikkala, Ram paththi koodudhal thagaval mattum tharudhu. Arththaththula rendum onnu maadhiri theriyum, aanaa ilakkanaththula veru veru. SSC indha viththiyaasaththaith-thaan test pannudhu."},
 {ta:"இன்னொரு விஷயம் — இந்த விதி ரெண்டு பக்கமும் வேலை செய்யும். 'The students, along with the principal, ____ present.' இங்க Subject = students, பன்மை. அதனால ARE. நிறைய பேரு 'இந்த rule-ல எப்பவும் singular verb-தான்' அப்படின்னு தப்பா மனப்பாடம் பண்ணிடுவாங்க. இல்ல. விதி என்னன்னா — 'உண்மையான Subject-ஐப் பாரு'. அது ஒருமையா இருந்தா ஒருமை, பன்மையா இருந்தா பன்மை.",
  tl:"Innoru vishayam — indha vidhi rendu pakkamum velai seyyum. 'The students, along with the principal, ____ present.' Inga Subject = students, panmai. Adhanaala ARE. Neraiya peru 'indha rule-la eppavum singular verb-dhaan' appadinnu thappaa manappaadam pannuduvaanga. Illa. Vidhi ennanaa — 'unmaiyaana Subject-aip paaru'. Adhu orumaiyaa irundhaa orumai, panmaiyaa irundhaa panmai."},
 {ta:"கடைசியா ஒரு exam tip. Error Spotting-ல இந்த மாதிரி வாக்கியம் வந்தா, முதல்ல verb-ஐ கண்டுபிடிங்க. அப்புறம் பின்னாடி நடந்து 'யாரு இதைப் பண்றது?' அப்படின்னு கேளுங்க. அந்த கேள்விக்கு பதில் வர்ற வார்த்தைதான் Subject. Comma-க்கு நடுவுல இருக்கிறதை ஒருபோதும் Subject-ஆ எடுத்துக்காதீங்க. இந்த ஒரு பழக்கம் உங்களுக்கு ஒவ்வொரு தேர்விலயும் ஒரு mark நிச்சயமா தரும்.",
  tl:"Kadaisiyaa oru exam tip. Error Spotting-la indha maadhiri vaakkiyam vandhaa, mudhalla verb-ai kandupidinga. Appuram pinnaadi nadandhu 'yaaru idhaip pandradhu?' appadinnu kelunga. Andha kelvikku padhil varra vaarththai-dhaan Subject. Comma-kku naduvula irukkiradhai orupodhum Subject-aa eduththukkaadheenga. Indha oru pazhakkam ungalukku ovvoru thervilayum oru mark nichchayamaa tharum."}]},

/* ========== RULE 32 ========== */
{n:32,rc:"SVA-02",d:"Easy",t:"Two Subjects joined by AND take a Plural Verb",
 tam:"AND-ஆல் இணைந்த இரு Subject = பன்மை வினைச்சொல் · AND-aal inaindha iru Subject = panmai vinaichol",
 s1:{en:"When two or more DIFFERENT persons or things are joined by 'and', they form a compound subject, and a compound subject always takes a plural verb.",
  ta:"இரண்டு அல்லது அதற்கு மேற்பட்ட வெவ்வேறு நபர்கள் அல்லது பொருட்கள் 'and'-ஆல் இணைக்கப்பட்டால், அவை ஒரு கூட்டு Subject ஆகின்றன. கூட்டு Subject எப்போதும் பன்மை வினைச்சொல்லையே எடுக்கும்.",
  tl:"Irandu alladhu adharku merpatta vevveru nabargal alladhu porutkal 'and'-aal inaikkappattaal, avai oru koottu Subject aagindrana. Koottu Subject eppodhum panmai vinaicholaiye edukkum.",
  formula:"A  +  and  +  B   →   PLURAL VERB\n(different people or different things)\n\nRam and Shyam  →  ARE\nRice and dal   →  ARE  (two separate items)"},

 s2:[
 {h:"The simple logic",
  en:"One person is singular. One person plus another person is two people. Two is plural. English simply counts.",
  ta:"ஒரு நபர் என்றால் ஒருமை. ஒரு நபர் + இன்னொரு நபர் = இரண்டு பேர். இரண்டு என்றால் பன்மை. ஆங்கிலம் வெறுமனே எண்ணுகிறது, அவ்வளவுதான்.",
  tl:"Oru nabar endraal orumai. Oru nabar + innoru nabar = irandu per. Irandu endraal panmai. Aangilam verumane ennugiradhu, avvalavudhaan."},
 {h:"AND is the ONLY word that does this",
  en:"Out of every connector in English, only 'and' welds two subjects into one plural unit. With, as well as, along with, or, nor — none of them do it. This is why Rule 31 and Rule 32 must be learnt together.",
  ta:"ஆங்கிலத்தில் உள்ள எல்லா இணைப்புச் சொற்களிலும், 'and' மட்டுமே இரண்டு Subject-களை ஒரே பன்மை அலகாக இணைக்கிறது. With, as well as, along with, or, nor — இவை எதுவும் அப்படிச் செய்யாது. அதனால்தான் Rule 31-ஐயும் Rule 32-ஐயும் சேர்த்தே படிக்க வேண்டும்.",
  tl:"Aangilaththil ulla ellaa inaippuch sorkalilum, 'and' mattume irandu Subject-kalai ore panmai alagaaga inaikkiradhu. With, as well as, along with, or, nor — ivai edhuvum appadich seyyaadhu. Adhanaal-dhaan Rule 31-aiyum Rule 32-aiyum serthe padikka vendum."},
 {h:"Warning — one big exception is coming",
  en:"If the two nouns joined by 'and' describe the SAME person or a SINGLE idea, the verb becomes singular. That is Rule 33. Always check this before answering.",
  ta:"'and'-ஆல் இணைக்கப்பட்ட இரண்டு பெயர்ச்சொற்கள் ஒரே நபரையோ அல்லது ஒரே கருத்தையோ குறித்தால், வினைச்சொல் ஒருமையாக மாறிவிடும். அதுதான் Rule 33. பதில் சொல்வதற்கு முன் இதைச் சரிபார்க்கவும்.",
  tl:"'and'-aal inaikkappatta irandu peyarchorkal ore nabaraiyo alladhu ore karuththaiyo kurithaal, vinaichol orumaiyaaga maarividum. Adhudhaan Rule 33. Padhil solvadharku mun idhaich saripaarkkavum."}],

 s3:[
 {h:"AND welds two into one plural",
  d:"  Ram  ══╗\n          ╠═══►  compound SUBJECT  ═══►  ARE / WERE / HAVE\n Shyam ══╝                              (plural verb)\n\n  Ram and Shyam ARE friends.  ✔"},
 {h:"Count the people, not the words",
  d:"  My father and my uncle  →  2 people  →  ARE  ✔\n  The poet and novelist    →  1 person  →  IS   ✔  (see Rule 33)\n                ↑\n     only ONE article 'the' = one person"}],

 s4:{
 wrong:["\"'Ram and Shyam' — the last word Shyam is singular, so I will use IS.\" — With AND, you never look at the last word alone.",
  "\"The sentence sounds better with 'is'.\" — Sound is not a rule. Count the subjects.",
  "\"Rice and dal is a single meal, so singular.\" — Only if they are genuinely served as one dish. Two separate commodities = plural."],
 right:["Ask: are these two DIFFERENT things or people? If yes → plural verb.",
  "Check the articles. Two articles = two entities = plural verb.",
  "Check whether the phrase is a fixed single item like 'bread and butter'. If not, plural."]},

 s5:[
 {en:"Ram and Shyam are close friends.",ta:"ராமும் ஷ்யாமும் நெருங்கிய நண்பர்கள்.",tl:"Raamum Shyaamum nerungiya nanbargal.",note:"Two different people → ARE."},
 {en:"Honesty and hard work bring success.",ta:"நேர்மையும் கடின உழைப்பும் வெற்றியைக் கொண்டு வரும்.",tl:"Nermaiyum kadina uzhaippum vetriyaik kondu varum.",note:"Two different qualities → BRING (plural, no -s)."},
 {en:"The boy and the girl were selected.",ta:"அந்தப் பையனும் அந்தப் பெண்ணும் தேர்ந்தெடுக்கப்பட்டனர்.",tl:"Andhap paiyanum andhap pennum therndhedukkappattanar.",note:"Two articles = two people → WERE."},
 {en:"My pen and my book are on the table.",ta:"என்னுடைய பேனாவும் என்னுடைய புத்தகமும் மேசையில் இருக்கின்றன.",tl:"Ennudaiya penaavum ennudaiya puththagamum mesaiyil irukkindrana.",note:"Two objects → ARE."}],

 s6:["and|மற்றும் / -உம்|Matrum / -um",
  "Ram and Shyam|ராமும் ஷ்யாமும்|Raamum Shyaamum",
  "are|இருக்கிறார்கள் (பன்மை)|Irukkiraargal (panmai)",
  "were|இருந்தார்கள் (பன்மை)|Irundhaargal (panmai)",
  "have|கொண்டுள்ளனர் (பன்மை)|Kondullanar (panmai)",
  "bring|கொண்டு வரும் (பன்மை)|Kondu varum (panmai)",
  "friends|நண்பர்கள்|Nanbargal",
  "honesty|நேர்மை|Nermai",
  "hard work|கடின உழைப்பு|Kadina uzhaippu",
  "success|வெற்றி|Vetri",
  "selected|தேர்ந்தெடுக்கப்பட்டனர்|Therndhedukkappattanar"],

 s7:[
 "Ram and Sita ____ playing.|are|Easy|Two different people.",
 "The cat and the dog ____ fighting.|are|Easy|Two animals, two articles.",
 "Gold and silver ____ precious metals.|are|Easy|Two different metals.",
 "My brother and my sister ____ studying abroad.|are|Easy|Two people.",
 "Tea and coffee ____ available here.|are|Medium|Two separate drinks.",
 "Honesty and sincerity ____ rewarded.|are|Medium|Two different qualities.",
 "The teacher and the students ____ in the hall.|are|Medium|Two groups.",
 "Ravi and his brother ____ won the match.|have|Medium|Two people → HAVE.",
 "Health and wealth ____ not the same thing.|are|Medium|Two different concepts.",
 "The manager and the accountant ____ been suspended.|have|Hard|Two articles = two people.",
 "Reading and writing ____ essential skills.|are|Hard|Two separate gerund activities.",
 "Both the pen and the pencil ____ missing.|are|Hard|'Both...and' → plural.",
 "The rise and fall of the empire ____ well documented.|is|Expert|'The rise and fall' is treated as ONE historical event.",
 "Time and tide ____ for no man.|wait|Expert|Proverb — two separate forces → plural WAIT.",
 "The Chairman and the Managing Director ____ signed the deal.|have|Expert|Two articles = two persons → HAVE."],

 s8:[
 "Ram and Shyam is coming.|Ram and Shyam are coming.|Two people → plural verb.",
 "The boy and the girl was selected.|The boy and the girl were selected.|Two articles = two persons.",
 "Honesty and hard work brings success.|Honesty and hard work bring success.|Plural verb takes no -s.",
 "Gold and silver is costly.|Gold and silver are costly.|Two different metals.",
 "My father and my uncle is farmers.|My father and my uncle are farmers.|Two people.",
 "Tea and coffee is served here.|Tea and coffee are served here.|Two separate drinks.",
 "The manager and the clerk has resigned.|The manager and the clerk have resigned.|Two articles = two people.",
 "Reading and writing is important.|Reading and writing are important.|Two separate activities.",
 "Time and tide waits for no man.|Time and tide wait for no man.|Two forces → plural verb.",
 "Both Ram and Ravi was absent.|Both Ram and Ravi were absent.|'Both...and' is always plural."],

 s9:[
 "Find the Error|Ram and his brother (A) is going (B) to attend (C) the wedding tomorrow (D).|A;B;C;D|1|Part B. Two people joined by AND → 'are going'.",
 "Fill in the Blank|Poverty and unemployment ____ the biggest problems of our country.|is;are|1|Two different problems → ARE.",
 "Sentence Improvement|The principal and the vice-principal was present at the meeting.|was present;were present;is present|1|Two articles = two persons → WERE.",
 "Find the Error|Time and tide (A) waits for (B) no man (C), no error (D).|A;B;C;D|1|Part B. It must be 'wait for'.",
 "Fill in the Blank|Both the driver and the conductor ____ been arrested.|has;have|1|'Both...and' → plural HAVE."],

 s10:{
  en:"The trap here is the reverse of Rule 31 — the exam gives you a genuine AND sentence but writes a singular verb that SOUNDS fine, especially when the second noun is singular. 'Ram and his brother is going' sounds acceptable to an Indian ear because Tamil and Hindi both allow it. It is wrong. Also watch for the Rule 33 exception hiding inside AND sentences.",
  ta:"இங்கே உள்ள பொறி Rule 31-க்கு நேர் எதிரானது — தேர்வு உண்மையான AND வாக்கியத்தைத் தந்துவிட்டு, காதுக்கு நன்றாகக் கேட்கும் ஒருமை வினைச்சொல்லை எழுதிவிடும், குறிப்பாக இரண்டாவது பெயர்ச்சொல் ஒருமையாக இருக்கும்போது. 'Ram and his brother is going' என்பது இந்திய காதுக்கு சரியாகவே கேட்கும், ஏனெனில் தமிழிலும் இந்தியிலும் அப்படிச் சொல்ல முடியும். ஆனால் ஆங்கிலத்தில் அது தவறு. மேலும் AND வாக்கியங்களுக்குள் Rule 33 விதிவிலக்கு ஒளிந்திருக்கிறதா என்றும் பாருங்கள்.",
  tl:"Inge ulla pori Rule 31-kku ner edhiraanadhu — thervu unmaiyaana AND vaakkiyaththaith thandhuvittu, kaadhukku nandraagak ketkum orumai vinaicholai ezhudhividum, kurippaaga irandaavadhu peyarchol orumaiyaaga irukkumbodhu. 'Ram and his brother is going' enbadhu Indhiya kaadhukku sariyaagave ketkum, yenenil Thamizhilum Hindi-yilum appadich solla mudiyum. Aanaal Aangilaththil adhu thavaru."},

 s11:{
  en:"COUNT THE HUMANS. If you can point at two separate people or two separate things, use a plural verb.",
  ta:"மனிதர்களை எண்ணுங்கள். இரண்டு தனித்தனி நபர்களையோ இரண்டு தனித்தனி பொருட்களையோ கை நீட்டிக் காட்ட முடிந்தால், பன்மை வினைச்சொல்.",
  tl:"Manidhargalai ennungal. Irandu thanithani nabargalaiyo irandu thanithani porutkalaiyo kai neetik kaatta mudindhaal, panmai vinaichol.",
  vis:"     COUNT ARTICLES = COUNT PEOPLE\n\n  THE poet and THE novelist ARE dead.   → 2 articles → 2 people\n  THE poet and novelist    IS  dead.    → 1 article  → 1 person\n         ↑\n   this tiny 'the' is worth one full mark"},

 s13:[
 "Ram and his brother, along with their cousins, ____ attending the function.|is;are;was|1|Rule 31 removes 'along with their cousins'. Rule 32 then applies to 'Ram and his brother' → ARE.",
 "Neither gold nor silver ____ as useful as iron in daily life.|are;is;were|1|This is NOT an AND sentence. 'Neither...nor' uses the nearest-subject rule → silver → IS.",
 "The Collector and the Superintendent of Police ____ inspected the site before the rains started.|has;have;had|1|Two articles = two officers → HAVE. Past-completed sense is carried by 'started'.",
 "Bread and butter ____ all he could afford in those difficult days.|were;was;are|1|'Bread and butter' is ONE dish here (Rule 33) → WAS.",
 "Both the accused and the witness ____ been summoned to appear tomorrow.|has;have;was|1|'Both...and' → plural → HAVE BEEN."],

 s14:{
  rule:"Two different subjects joined by AND take a plural verb.",
  formula:"A + and + B  →  ARE / WERE / HAVE / plural verb",
  memory:"Two articles = two people = plural verb.",
  ta:"AND இரண்டைச் சேர்த்து ஒரு பன்மை ஆக்கும். இரண்டு article = இரண்டு நபர்.",
  tl:"AND irandaich serthu oru panmai aakkum. Irandu article = irandu nabar.",
  mistake:"Using a singular verb because the noun nearest the verb is singular.",
  exam:"SSC CGL / CHSL, RRB, Bank PO — foundation rule, often combined with Rule 31 or 33."},

 s15:[
 {ta:"இது ரொம்ப எளிமையான rule, ஆனா அதுவேதான் ஆபத்து. எளிமையான rule-ஐ நாம கவனிக்காம விட்டுடுவோம். 'Ram and Shyam' — ரெண்டு பேரு. ரெண்டு பேருன்னா பன்மை. அதனால ARE. அவ்ளோதான். ஆங்கிலம் இங்க வெறுமனே எண்ணுது, அதுக்கு மேல ஒண்ணுமில்ல.",
  tl:"Idhu romba elimaiyaana rule, aanaa adhuvedhaan aabaththu. Elimaiyaana rule-ai naama kavanikkaama vittuduvom. 'Ram and Shyam' — rendu peru. Rendu perunnaa panmai. Adhanaala ARE. Avlodhaan. Aangilam inga verumane ennudhu, adhukku mela onnumilla."},
 {ta:"ஆனா ஒரு பெரிய ஆபத்து இருக்கு. நம்ம தமிழ்ல 'ராமும் அவன் தம்பியும் போறான்' அப்படின்னு சொன்னாலும் தப்பில்ல மாதிரி தோணும். அதனால ஆங்கிலத்துலயும் 'Ram and his brother is going' அப்படின்னு எழுதிடுவோம். இது தப்பு. ஆங்கிலத்துல ரெண்டு பேரு இருந்தா verb கண்டிப்பா பன்மையா இருக்கணும் — 'are going'.",
  tl:"Aanaa oru periya aabaththu irukku. Namma Thamizh-la 'Raamum avan thambiyum poraan' appadinnu sonnaalum thappilla maadhiri thonum. Adhanaala Aangilaththulayum 'Ram and his brother is going' appadinnu ezhudhiduvom. Idhu thappu. Aangilaththula rendu peru irundhaa verb kandippaa panmaiyaa irukkanum — 'are going'."},
 {ta:"இப்போ ஒரு சின்ன secret சொல்லுறேன். Article-ஐ எண்ணுங்க. 'The poet and the novelist are dead' — ரெண்டு 'the' இருக்கு, அதனால ரெண்டு நபர், பன்மை. ஆனா 'The poet and novelist is dead' — ஒரே ஒரு 'the' தான் இருக்கு, அதனால ஒரே நபர், அவரு கவிஞரும் ஆவாரு நாவலாசிரியரும் ஆவாரு. ஒருமை. இந்த ஒரு சின்ன 'the' ஒரு முழு mark-ஐ தீர்மானிக்கும்.",
  tl:"Ippo oru chinna secret solluren. Article-ai ennunga. 'The poet and the novelist are dead' — rendu 'the' irukku, adhanaala rendu nabar, panmai. Aanaa 'The poet and novelist is dead' — ore oru 'the' dhaan irukku, adhanaala ore nabar, avaru kavignarum aavaaru naavalaasiriyarum aavaaru. Orumai. Indha oru chinna 'the' oru muzhu mark-ai theermaanikkum."},
 {ta:"கடைசியா ஒரு பழக்கத்தை உருவாக்குங்க. AND-ஐ பார்த்தவுடனே உங்க மனசுல ஒரு கேள்வி வரணும்: 'இது ரெண்டு தனித்தனி விஷயமா, இல்ல ஒரே விஷயமா?' தனித்தனி என்றால் பன்மை. ஒரே விஷயம் என்றால் ஒருமை — அதுதான் அடுத்த Rule 33. இந்த ரெண்டு rule-ம் ஒரு நாணயத்தோட ரெண்டு பக்கம் மாதிரி. சேர்த்தே படிங்க.",
  tl:"Kadaisiyaa oru pazhakkaththai uruvaakkunga. AND-ai paarththavudane unga manasula oru kelvi varanum: 'idhu rendu thanithani vishayamaa, illa ore vishayamaa?' Thanithani endraal panmai. Ore vishayam endraal orumai — adhudhaan aduththa Rule 33. Indha rendu rule-um oru naanayaththoda rendu pakkam maadhiri. Serthe padinga."}]},

/* ========== RULE 33 ========== */
{n:33,rc:"SVA-03",d:"Hard",t:"AND joining ONE person or ONE idea takes a Singular Verb",
 tam:"ஒரே நபர் அல்லது ஒரே கருத்து = ஒருமை வினைச்சொல் · Ore nabar alladhu ore karuththu = orumai vinaichol",
 s1:{en:"When two nouns joined by 'and' refer to the SAME person, the SAME thing, or form ONE single idea or one dish, the verb is SINGULAR. The article is your clue: one article means one entity.",
  ta:"'and'-ஆல் இணைக்கப்பட்ட இரண்டு பெயர்ச்சொற்கள் ஒரே நபரையோ, ஒரே பொருளையோ குறித்தால், அல்லது ஒரே கருத்தாக அல்லது ஒரே உணவாக இருந்தால், வினைச்சொல் ஒருமையாக இருக்கும். Article-தான் உங்களுக்கான குறிப்பு: ஒரு article என்றால் ஒரு பொருள்.",
  tl:"'and'-aal inaikkappatta irandu peyarchorkal ore nabaraiyo, ore porulaiyo kurithaal, alladhu ore karuththaaga alladhu ore unavaaga irundhaal, vinaichol orumaiyaaga irukkum. Article-dhaan ungalukkaana kurippu: oru article endraal oru porul.",
  formula:"THE + noun1 + and + noun2 + SINGULAR VERB   (one person)\nTHE + noun1 + and + THE + noun2 + PLURAL VERB (two people)\n\nThe poet and novelist  IS  dead.   ← 1 article, 1 person\nThe poet and the novelist ARE dead. ← 2 articles, 2 people"},

 s2:[
 {h:"Three situations where AND stays singular",
  en:"(1) One person holding two posts: 'The Collector and District Magistrate is...' (2) One dish or one fixed pair: 'Bread and butter is...' (3) One single idea or proverb: 'Slow and steady wins the race.'",
  ta:"AND இருந்தும் ஒருமையாக இருக்கும் மூன்று சூழல்கள்: (1) ஒரே நபர் இரண்டு பதவிகளை வகிக்கும்போது: 'The Collector and District Magistrate is...' (2) ஒரே உணவு அல்லது நிலையான ஜோடி: 'Bread and butter is...' (3) ஒரே கருத்து அல்லது பழமொழி: 'Slow and steady wins the race.'",
  tl:"AND irundhum orumaiyaaga irukkum moondru soozhalgal: (1) Ore nabar irandu padhavigalai vagikkumbodhu. (2) Ore unavu alladhu nilaiyaana jodi. (3) Ore karuththu alladhu pazhamozhi."},
 {h:"The article test — your single most reliable tool",
  en:"Look at how many times 'the', 'a', 'my', 'his' appear. If the determiner appears only ONCE before both nouns, it is one entity → singular verb. If it appears TWICE, it is two entities → plural verb.",
  ta:"'the', 'a', 'my', 'his' போன்ற சொற்கள் எத்தனை முறை வருகின்றன என்று பாருங்கள். இரண்டு பெயர்ச்சொற்களுக்கும் முன்னால் அது ஒரே ஒரு முறை மட்டும் வந்தால், அது ஒரே பொருள் → ஒருமை வினைச்சொல். இரண்டு முறை வந்தால், அவை இரண்டு பொருள்கள் → பன்மை வினைச்சொல்.",
  tl:"'the', 'a', 'my', 'his' pondra sorkal eththanai murai varugindrana endru paarungal. Irandu peyarchorkalukkum munnaal adhu ore oru murai mattum vandhaal, adhu ore porul → orumai vinaichol. Irandu murai vandhaal, avai irandu porulgal → panmai vinaichol."},
 {h:"Fixed pairs you must recognise instantly",
  en:"Bread and butter, rice and curry, slow and steady, time and tide (this one is plural — a proverb about two forces), law and order, horse and carriage, the rise and fall, trial and error, wear and tear, bow and arrow.",
  ta:"உடனடியாக அடையாளம் காண வேண்டிய நிலையான ஜோடிகள்: Bread and butter, rice and curry, slow and steady, law and order, the rise and fall, trial and error, wear and tear, bow and arrow.",
  tl:"Udanadiyaaga adaiyaalam kaana vendiya nilaiyaana jodigal: Bread and butter, rice and curry, slow and steady, law and order, the rise and fall, trial and error, wear and tear, bow and arrow."}],

 s3:[
 {h:"Count the articles, not the nouns",
  d:"ONE ARTICLE  →  ONE PERSON  →  SINGULAR VERB\n\n   The  secretary and treasurer   IS  present.\n    ↑                                ↑\n  only one                    one man holding both posts\n\nTWO ARTICLES →  TWO PEOPLE  →  PLURAL VERB\n\n   The secretary and THE treasurer   ARE present.\n    ↑                  ↑\n  first person    second person"},
 {h:"One plate = one verb",
  d:"    ┌─────────────────┐\n    │  Bread + Butter │  =  ONE BREAKFAST  →  IS\n    └─────────────────┘\n\n    ┌────────┐   ┌────────┐\n    │  Rice  │   │  Dal   │  =  TWO ITEMS  →  ARE\n    └────────┘   └────────┘"}],

 s4:{
 wrong:["\"I see AND, so it must be plural — always.\" — AND is plural only when it joins two DIFFERENT entities.",
  "\"'Bread and butter' is two words, so two things.\" — It is one dish, one idea, one breakfast.",
  "\"'Slow and steady' has two adjectives, so plural.\" — It names one single manner of doing things.",
  "\"'The Collector and District Magistrate' is obviously two officers.\" — In India it is one officer holding two designations. The single 'the' proves it."],
 right:["Count the determiners (the, a, my, his) before answering.",
  "Ask: can I point at TWO separate people or objects? If not, singular.",
  "Recognise fixed pairs as single units.",
  "If the sentence is a proverb, decide whether it names one manner (singular) or two forces (plural)."]},

 s5:[
 {en:"Slow and steady wins the race.",ta:"மெதுவாகவும் நிலையாகவும் செல்வதுதான் பந்தயத்தில் வெல்லும்.",tl:"Medhuvaagavum nilaiyaagavum selvadhudhaan bandhayaththil vellum.",note:"'Slow and steady' = ONE manner of working → WINS (singular)."},
 {en:"Bread and butter is my daily breakfast.",ta:"ரொட்டியும் வெண்ணெயும் சேர்ந்ததுதான் என்னுடைய தினசரி காலை உணவு.",tl:"Rottiyum venneyum serndhadhudhaan ennudaiya dhinasari kaalai unavu.",note:"One dish → IS."},
 {en:"The Collector and District Magistrate is visiting our town.",ta:"ஆட்சியரும் மாவட்ட நீதிபதியுமான அதே அதிகாரி எங்கள் ஊருக்கு வருகிறார்.",tl:"Aatchiyarum maavatta needhibadhiyumaana adhe adhigaari engal oorukku varugiraar.",note:"ONE officer, two designations, one 'the' → IS."},
 {en:"The poet and the novelist are both dead.",ta:"அந்தக் கவிஞரும் அந்த நாவலாசிரியரும் இருவரும் இறந்துவிட்டனர்.",tl:"Andhak kavignarum andha naavalaasiriyarum iruvarum irandhuvittanar.",note:"TWO articles → two different men → ARE."},
 {en:"The rise and fall of the Roman Empire is a fascinating story.",ta:"ரோமப் பேரரசின் எழுச்சியும் வீழ்ச்சியும் ஒரு கவர்ச்சிகரமான கதை.",tl:"Roma perarasin ezhuchiyum veezhchiyum oru kavarchigaramaana kadhai.",note:"One historical narrative → IS."}],

 s7:[

 s8:[

 "Rice and curry are served here.|Rice and curry is served here.|One meal.",

 s9:[
 "Find the Error|The Collector and District Magistrate (A) are visiting (B) our district (C) next week (D).|A;B;C;D|1|Part B. One article = one officer → 'is visiting'.",
 "Fill in the Blank|Slow and steady ____ the race, as the old proverb says.|win;wins|1|One manner of working → WINS.",
 "Sentence Improvement|Bread and butter are all that he can afford.|are;is;were|1|One dish → IS.",
 "Find the Error|Time and tide (A) waits for no man (B), so we (C) must hurry (D).|A;B;C;D|0|Part A. Two forces → 'wait for'.",
 "Fill in the Blank|The Principal and the Vice-Principal ____ addressed the gathering separately.|has;have|1|Two articles → two persons → HAVE."],

 s10:{
  en:"SSC loves this rule because it looks like Rule 32 but behaves oppositely. The exam prints 'The Chairman and Managing Director' with ONE 'the' and then offers 'are' as a tempting option. Students who memorised 'AND means plural' fall straight in. The single article is the entire question. Read the determiners before you read anything else.",
  ta:"SSC இந்த விதியை மிகவும் விரும்புகிறது, ஏனெனில் இது Rule 32 போலவே தோன்றும், ஆனால் நேர் எதிராகச் செயல்படும். தேர்வில் 'The Chairman and Managing Director' என்று ஒரே ஒரு 'the'-உடன் அச்சிடப்பட்டு, பிறகு 'are' ஒரு கவர்ச்சிகரமான option-ஆகத் தரப்படும். 'AND என்றால் பன்மை' என்று மனப்பாடம் செய்தவர்கள் நேராக அதில் விழுவார்கள். அந்த ஒரே ஒரு article-தான் முழு கேள்வியும். வேறு எதையும் படிப்பதற்கு முன் determiner-களைப் படியுங்கள்.",
  tl:"SSC indha vidhiyai migavum virumbugiradhu, yenenil idhu Rule 32 polave thondrum, aanaal ner edhiraagach seyalpadum. Thervil 'The Chairman and Managing Director' endru ore oru 'the'-udan achidappattu, piragu 'are' oru kavarchigaramaana option-aagath tharappadum. 'AND endraal panmai' endru manappaadam seydhavargal neraaga adhil vizhuvaargal. Andha ore oru article-dhaan muzhu kelviyum."},

 s11:{
  en:"ONE 'THE' = ONE PERSON = ONE VERB. Count the articles before you count the nouns.",
  ta:"ஒரு 'THE' = ஒரு நபர் = ஒரு (ஒருமை) வினைச்சொல். பெயர்ச்சொற்களை எண்ணுவதற்கு முன் article-களை எண்ணுங்கள்.",
  tl:"Oru 'THE' = oru nabar = oru (orumai) vinaichol. Peyarchorkalai ennuvadharku mun article-galai ennungal.",
  vis:"        ONE PLATE OR TWO PLATES?\n\n  Bread and butter   →  🍽️  one plate  →  IS\n  Rice and dal       →  🍽️🍽️ two items →  ARE\n\n        ONE BADGE OR TWO BADGES?\n\n  The Collector and DM        →  👤  one officer  →  IS\n  The Collector and the DM    →  👤👤 two officers →  ARE"},

 s13:[
 "The Principal and Correspondent of the school, along with the staff, ____ decided to extend the holidays.|has;have;had|0|One article = one person (Rule 33), and 'along with the staff' is ignored (Rule 31) → HAS.",
 "Neither bread and butter nor rice and dal ____ available in the hostel today.|are;is;were|1|Each pair is one dish. 'Neither...nor' takes the nearest → 'rice and dal' as one dish → IS.",
 "Slow and steady, rather than reckless speed, ____ always been the winning formula.|have;has;are|1|'Slow and steady' is one manner, and 'rather than' is ignored → HAS BEEN.",
 "The rise and fall of great civilisations ____ a subject that ____ fascinated historians.|is-has;are-have;is-have|0|Both blanks follow the singular subject 'The rise and fall' → IS and HAS.",
 "Time and tide, as the proverb goes, ____ for no man, and neither ____ opportunity.|wait-does;waits-does;wait-do|0|Two forces → WAIT. Then 'neither does opportunity' (singular) → DOES."],

 s14:{
  rule:"AND joining ONE person, ONE dish or ONE idea takes a singular verb.",
  formula:"ONE article + noun + and + noun  →  SINGULAR VERB",
  memory:"Count the articles, not the nouns. One 'the' = one person.",
  ta:"ஒரு 'the' = ஒரு நபர் = ஒருமை வினைச்சொல். Bread and butter = ஒரே தட்டு.",
  tl:"Oru 'the' = oru nabar = orumai vinaichol. Bread and butter = ore thattu.",
  mistake:"Blindly using a plural verb whenever AND appears.",
  exam:"SSC CGL Tier-1 favourite. Also RRB NTPC and Bank PO Error Spotting."},

 s15:[
 {ta:"இந்த rule-தான் Rule 32-ஓட ரகசிய இரட்டை சகோதரன். Rule 32 சொல்லுது 'AND-ன்னா பன்மை'. இந்த rule சொல்லுது 'எப்பவும் இல்ல!'. இந்த ரெண்டு rule-க்கும் நடுவுல இருக்கிற வித்தியாசத்தைப் புரிஞ்சுக்கிட்டா, SSC-ல ஒரு mark நிச்சயம்.",
  tl:"Indha rule-dhaan Rule 32-oda ragasiya irattai sagodharan. Rule 32 solludhu 'AND-nnaa panmai'. Indha rule solludhu 'eppavum illa!'. Indha rendu rule-kkum naduvula irukkira viththiyaasaththaip purinjukkittaa, SSC-la oru mark nichchayam."},
 {ta:"ஒரு உதாரணம் பார்ப்போம். 'The Collector and District Magistrate is visiting our town.' இதைப் பார்த்தவுடனே நிறைய பேரு 'ரெண்டு பேரு வராங்க, ஆட்சியர், மாவட்ட நீதிபதி' அப்படின்னு நினைப்பாங்க. ஆனா இல்ல. இந்தியால ஒரே அதிகாரிதான் ரெண்டு பதவியையும் வகிக்கிறாரு. அவரோட முழு designation-ஏ 'Collector and District Magistrate'. ஒரு மனுஷன். அதனால IS.",
  tl:"Oru udhaaranam paarpom. 'The Collector and District Magistrate is visiting our town.' Idhaip paarththavudane neraiya peru 'rendu peru varaanga' appadinnu ninaippaanga. Aanaa illa. India-la ore adhigaari-dhaan rendu padhaviyaiyum vagikkiraaru. Avaroda muzhu designation-e 'Collector and District Magistrate'. Oru manushan. Adhanaala IS."},
 {ta:"இதை எப்படி கண்டுபிடிக்கிறது? 'the' எத்தனை தடவை வருதுன்னு எண்ணுங்க. 'The Collector and District Magistrate' — ஒரே ஒரு 'the'. ஒரு நபர். IS. ஆனா 'The Collector and THE District Magistrate' — ரெண்டு 'the'. ரெண்டு நபர். ARE. அவ்ளோ சிம்பிள். அந்த ஒரு சின்ன வார்த்தைதான் முழு கேள்வியும்.",
  tl:"Idhai eppadi kandupidikkiradhu? 'the' eththanai thadavai varudhunnu ennunga. 'The Collector and District Magistrate' — ore oru 'the'. Oru nabar. IS. Aanaa 'The Collector and THE District Magistrate' — rendu 'the'. Rendu nabar. ARE. Avlo simple. Andha oru chinna vaarththai-dhaan muzhu kelviyum."},
 {ta:"சாப்பாட்டு உதாரணம் இன்னும் எளிது. 'Bread and butter is my breakfast.' நீங்க காலைல ரொட்டியை தனியா சாப்பிட்டு, வெண்ணெயை தனியா சாப்பிடுறீங்களா? இல்ல. ரெண்டையும் சேர்த்து ஒரே ஒரு உணவா சாப்பிடுறீங்க. ஒரு தட்டு. ஒரு உணவு. அதனால IS. ஆனா 'Rice and dal are cooked separately' — இங்க ரெண்டும் தனித்தனியா சமைக்கப்படுது, அதனால ARE.",
  tl:"Saappaattu udhaaranam innum eladhu. 'Bread and butter is my breakfast.' Neenga kaalaila rottiyai thaniyaa saappittu, venneyai thaniyaa saappiduringalaa? Illa. Rendaiyum serthu ore oru unavaa saappiduringa. Oru thattu. Oru unavu. Adhanaala IS."},
 {ta:"கடைசியா ஒரு எச்சரிக்கை. 'Time and tide wait for no man' — இது பன்மை! ஏன்? ஏன்னா நேரம் வேற, அலை வேற. ரெண்டும் தனித்தனி இயற்கை சக்திகள். ஒரே விஷயம் இல்ல. அதனால WAIT. நிறைய பேரு இதுல தப்பு பண்ணுவாங்க, ஏன்னா 'இது பழமொழி, அதனால ஒருமை' அப்படின்னு நினைப்பாங்க. பழமொழியா இருந்தாலும், அர்த்தத்தைப் பாருங்க. ஒரு விஷயமா ரெண்டு விஷயமா — அதுதான் கேள்வி.",
  tl:"Kadaisiyaa oru echcharikkai. 'Time and tide wait for no man' — idhu panmai! Yen? Yennaa neram veru, alai veru. Rendum thanithani iyarkai sakthigal. Ore vishayam illa. Adhanaala WAIT. Neraiya peru idhula thappu pannuvaanga. Pazhamozhiyaa irundhaalum, arththaththaip paarunga. Oru vishayamaa rendu vishayamaa — adhudhaan kelvi."}]},

/* ========== RULE 34 ========== */
{n:34,rc:"SVA-04",d:"Medium",t:"EACH, EVERY and NO force a Singular Verb",
 tam:"Each, Every, No — AND இருந்தாலும் ஒருமையே · Each, Every, No — AND irundhaalum orumaiye",
 s1:{en:"When 'each', 'every' or 'no' comes before singular nouns, the verb is SINGULAR — even when those nouns are joined by 'and'. These determiners overpower the AND rule completely.",
  ta:"'each', 'every', 'no' ஆகியவை ஒருமைப் பெயர்ச்சொற்களுக்கு முன்னால் வரும்போது, வினைச்சொல் ஒருமையாகவே இருக்கும் — அந்தப் பெயர்ச்சொற்கள் 'and'-ஆல் இணைக்கப்பட்டிருந்தாலும் கூட. இந்த determiner-கள் AND விதியை முற்றிலுமாக மேற்கொள்கின்றன.",
  tl:"'each', 'every', 'no' aagiyavai orumaip peyarchorkalukku munnaal varumbodhu, vinaichol orumaiyaagave irukkum — andhap peyarchorkal 'and'-aal inaikkappattirundhaalum kooda. Indha determiner-kal AND vidhiyai mutrilumaaga merkolgindrana.",
  formula:"EACH / EVERY / NO + noun + and + EACH / EVERY / NO + noun  →  SINGULAR VERB\n\nEach boy and each girl WAS given a prize.\nEvery man and woman HAS a duty.\nNo student and no teacher WAS absent."},

 s2:[
 {h:"Why the determiner wins",
  en:"'Each' and 'every' pick out members ONE AT A TIME. Even in a crowd of a thousand, 'every man' means 'this man, then that man, then the next'. The mind is looking at one person at any moment, so the verb is singular.",
  ta:"'Each' மற்றும் 'every' உறுப்பினர்களை ஒவ்வொருவராகத் தனித்தனியே எடுத்துப் பார்க்கின்றன. ஆயிரம் பேர் கூட்டத்தில் கூட, 'every man' என்றால் 'இந்த மனிதன், பிறகு அந்த மனிதன், பிறகு அடுத்தவர்' என்று பொருள். எந்த நேரத்திலும் மனம் ஒரே ஒரு நபரைத்தான் பார்க்கிறது, எனவே வினைச்சொல் ஒருமை.",
  tl:"'Each' matrum 'every' urupinargalai ovvoruvaraagath thanithaniye eduththup paarkkindrana. Aayiram per koottaththil kooda, 'every man' endraal 'indha manidhan, piragu andha manidhan, piragu aduththavar' endru porul. Endha neraththilum manam ore oru nabaraith-thaan paarkkiradhu, enave vinaichol orumai."},
 {h:"EACH OF and EVERY ONE OF are also singular",
  en:"'Each of the boys HAS...', 'Every one of the students WAS...'. The plural noun after 'of' does not matter. Only 'each' and 'every one' matter.",
  ta:"'Each of the boys HAS...', 'Every one of the students WAS...'. 'of'-க்குப் பின் வரும் பன்மைப் பெயர்ச்சொல் முக்கியமில்லை. 'each' மற்றும் 'every one' மட்டுமே முக்கியம்.",
  tl:"'Each of the boys HAS...', 'Every one of the students WAS...'. 'of'-kkup pin varum panmaip peyarchol mukkiyamillai. 'each' matrum 'every one' mattume mukkiyam."},
 {h:"EACH placed AFTER the subject behaves differently",
  en:"'The boys each have a book' — here 'each' comes after a plural subject, so the verb stays plural. Position changes everything.",
  ta:"'The boys each have a book' — இங்கே 'each' ஒரு பன்மை Subject-க்குப் பின்னால் வருகிறது, எனவே வினைச்சொல் பன்மையாகவே இருக்கும். இடம் மாறினால் எல்லாமே மாறும்.",
  tl:"'The boys each have a book' — inge 'each' oru panmai Subject-kkup pinnaal varugiradhu, enave vinaichol panmaiyaagave irukkum. Idam maarinaal ellaame maarum."}],

 s3:[
 {h:"EACH looks at one at a time",
  d:"  👦 👧 👦 👧 👦   ← a crowd of many\n   ↑\n EACH boy   →  the mind sees only ONE at a time  →  WAS  ✔\n\n  Each boy and each girl  WAS  given a prize.\n     ↑          ↑          ↑\n   one        one       singular (AND does NOT matter)"},
 {h:"Position matters",
  d:"BEFORE the subject → singular:\n   EACH boy has a pen.        ✔ has\n\n AFTER the subject → plural:\n   The boys EACH have a pen.  ✔ have"}],

 s4:{
 wrong:["\"There is an AND between the nouns, so the verb is plural.\" — 'Each' and 'every' cancel the AND rule.",
  "\"'Every man and woman' clearly means many people.\" — In meaning yes, in grammar it is one at a time.",
  "\"'Each of the boys' — boys is plural, so plural verb.\" — The subject is 'each', not 'boys'."],
 right:["Look at the FIRST word of the subject. If it is each, every or no → singular verb.",
  "'Each of / every one of / neither of / either of' + plural noun is still singular.",
  "Note where 'each' sits. Before the subject = singular. After a plural subject = plural."]},

 s5:[
 {en:"Each boy and each girl was given a prize.",ta:"ஒவ்வொரு பையனுக்கும் ஒவ்வொரு பெண்ணுக்கும் ஒரு பரிசு வழங்கப்பட்டது.",tl:"Ovvoru paiyanukkum ovvoru pennukkum oru parisu vazhangappattadhu.",note:"'Each' before both nouns → WAS, despite the AND."},
 {en:"Every man and woman has a duty to society.",ta:"ஒவ்வொரு ஆணுக்கும் பெண்ணுக்கும் சமூகத்திற்கு ஒரு கடமை உண்டு.",tl:"Ovvoru aanukkum pennukkum samoogaththirku oru kadamai undu.",note:"'Every' → HAS (singular)."},
 {en:"No student and no teacher was absent yesterday.",ta:"நேற்று எந்த மாணவரும் எந்த ஆசிரியரும் வரவில்லை என்பது இல்லை — அனைவரும் வந்தனர்.",tl:"Netru endha maanavarum endha aasiriyarum varaamal illai — anaivarum vandhanar.",note:"'No' → WAS (singular)."},
 {en:"Each of the players has received a medal.",ta:"ஒவ்வொரு வீரரும் ஒரு பதக்கத்தைப் பெற்றுள்ளார்.",tl:"Ovvoru veerarum oru padhakkaththaip petrullaar.",note:"Subject = 'each', not 'players' → HAS."}],

 s6:["each|ஒவ்வொரு (தனித்தனியாக)|Ovvoru (thanithaniyaaga)",
  "every|ஒவ்வொரு (அனைத்தும்)|Ovvoru (anaiththum)",
  "no|எந்த ... உம் இல்லை|Endha ... um illai",
  "each boy|ஒவ்வொரு பையனும்|Ovvoru paiyanum",
  "each girl|ஒவ்வொரு பெண்ணும்|Ovvoru pennum",
  "was given|வழங்கப்பட்டது|Vazhangappattadhu",
  "has|உள்ளது / உண்டு|Ulladhu / Undu",
  "duty|கடமை|Kadamai",
  "each of the boys|பையன்களில் ஒவ்வொருவரும்|Paiyangalil ovvoruvarum",
  "every one of|ஒவ்வொருவரும்|Ovvoruvarum",
  "absent|வராதவர் / இல்லாதவர்|Varaadhavar / Illaadhavar"],

 s7:[
 "Each boy ____ a pen.|has|Easy|'Each' is singular.",
 "Every student ____ present today.|is|Easy|'Every' is singular.",
 "No man ____ perfect.|is|Easy|'No' is singular.",
 "Each boy and each girl ____ a prize.|gets|Medium|'Each' cancels the AND.",
 "Every man and woman ____ the right to vote.|has|Medium|'Every' → HAS.",
 "No teacher and no student ____ allowed inside.|was|Medium|'No' → WAS.",
 "Each of the answers ____ correct.|is|Medium|Subject = each.",
 "Every one of the boys ____ passed.|has|Medium|Subject = every one.",
 "Each of the ten houses ____ a garden.|has|Hard|Subject = each, not houses.",
 "Every man, woman and child ____ counted.|was|Hard|'Every' governs the whole list.",
 "No book and no pen ____ found in the bag.|was|Hard|'No' → singular.",
 "The boys each ____ a separate room.|have|Hard|'Each' after a plural subject → plural.",
 "Each and every one of them ____ responsible.|is|Expert|Emphatic form, still singular.",
 "Every effort and every resource ____ been used.|has|Expert|'Every' → HAS BEEN.",
 "No excuse and no explanation ____ accepted by the committee.|was|Expert|'No' → singular."],

 s8:[
 "Each boy and each girl were given a prize.|Each boy and each girl was given a prize.|'Each' forces a singular verb.",
 "Every man and woman have a duty.|Every man and woman has a duty.|'Every' is singular.",
 "No student and no teacher were absent.|No student and no teacher was absent.|'No' is singular.",
 "Each of the answers are correct.|Each of the answers is correct.|Subject is 'each', not 'answers'.",
 "Every one of the boys have passed.|Every one of the boys has passed.|Subject is 'every one'.",
 "Each of the ten houses have a garden.|Each of the ten houses has a garden.|Subject is 'each'.",
 "Every man, woman and child were counted.|Every man, woman and child was counted.|'Every' governs the whole series.",
 "The boys each has a room.|The boys each have a room.|'Each' after a plural subject keeps the verb plural.",
 "Each and every one of them are guilty.|Each and every one of them is guilty.|Emphatic 'each and every' is still singular.",
 "No excuse and no reason were accepted.|No excuse and no reason was accepted.|'No' before each noun → singular."],

 s9:[
 "Find the Error|Each boy and each girl (A) were given (B) a certificate (C) at the function (D).|A;B;C;D|1|Part B. 'Each' forces 'was given'.",
 "Fill in the Blank|Every man and woman in this country ____ the right to education.|has;have|0|'Every' → HAS.",
 "Sentence Improvement|Each of the students have submitted the assignment.|have;has;had|1|Subject = 'each' → HAS.",
 "Find the Error|No teacher (A) and no student (B) were allowed (C) to enter the hall (D).|A;B;C;D|2|Part C. 'No' → 'was allowed'.",
 "Fill in the Blank|Every one of the candidates ____ been informed by email.|has;have|0|Subject = 'every one' → HAS BEEN."],

 s10:{
  en:"The exam writes a long list — 'Every man, woman and child in the village ____ counted' — hoping the sheer length makes you forget the tiny word 'Every' at the start. The determiner at the very beginning of the subject decides everything. Also watch for 'Each of the / Every one of the' followed by a fat plural noun placed right next to the blank.",
  ta:"தேர்வு ஒரு நீளமான பட்டியலை எழுதும் — 'Every man, woman and child in the village ____ counted' — அந்த நீளத்தைப் பார்த்து தொடக்கத்தில் இருக்கும் சின்ன வார்த்தையான 'Every'-ஐ நீங்கள் மறந்துவிட வேண்டும் என்பதற்காக. Subject-ன் ஆரம்பத்தில் இருக்கும் determiner-தான் எல்லாவற்றையும் தீர்மானிக்கிறது. மேலும் 'Each of the / Every one of the' என்பதற்குப் பின் ஒரு பெரிய பன்மைப் பெயர்ச்சொல் blank-க்கு அருகிலேயே வைக்கப்படுவதையும் கவனியுங்கள்.",
  tl:"Thervu oru neelamaana pattiyalai ezhudhum, andha neelaththaip paarththu thodakkaththil irukkum chinna vaarththaiyaana 'Every'-ai neengal marandhuvida vendum enbadharkaaga. Subject-in aarambaththil irukkum determiner-dhaan ellaavatraiyum theermaanikkiradhu."},

 s11:{
  en:"THE FIRST WORD RULES. If the subject begins with each, every or no, stop reading and write a singular verb.",
  ta:"முதல் வார்த்தையே ஆட்சி செய்யும். Subject 'each', 'every' அல்லது 'no'-வில் தொடங்கினால், படிப்பதை நிறுத்திவிட்டு ஒருமை வினைச்சொல்லை எழுதுங்கள்.",
  tl:"Mudhal vaarththaiye aatchi seyyum. Subject 'each', 'every' alladhu 'no'-vil thodanginaal, padippadhai niruththivittu orumai vinaicholai ezhudhungal.",
  vis:"   EACH  ┐\n   EVERY ├──►  SINGULAR VERB  (AND is powerless)\n   NO    ┘\n\n   Even this:\n   Every man, woman, child, soldier and officer  WAS  counted.\n     ↑                                            ↑\n  one word wins                              still singular"},

 s13:[
 "Each of the boys, along with their teacher, ____ been awarded a certificate.|has;have;had|0|Rule 31 removes 'along with their teacher'. Rule 34 makes 'each of the boys' singular → HAS BEEN.",
 "Every man and woman who ____ present at the meeting ____ asked to sign.|was-was;were-were;were-was|2|'Who' refers to 'man and woman' as a group → WERE present. The main subject 'Every man and woman' → WAS asked.",
 "Neither each candidate nor the examiners ____ satisfied with the arrangement.|was;were;is|1|'Neither...nor' overrides — the nearest subject 'examiners' is plural → WERE.",
 "No student and no teacher, not even the principal, ____ allowed to carry a phone into the hall.|were;was;are|1|'No' → singular, and 'not even the principal' is parenthetical → WAS.",
 "Each of the ten villages that ____ affected by the flood ____ received relief material.|were-has;was-have;were-have|0|'That' refers to 'villages' (plural) → WERE. Main subject 'Each' → HAS."],

 s14:{
  rule:"EACH, EVERY and NO always force a singular verb, even with AND.",
  formula:"EACH / EVERY / NO + noun (+ and + noun)  →  SINGULAR VERB",
  memory:"The first word of the subject rules. Each = one at a time.",
  ta:"Subject-ன் முதல் வார்த்தையே ஆட்சி செய்யும். Each = ஒவ்வொருவராகத் தனித்தனியே.",
  tl:"Subject-in mudhal vaarththaiye aatchi seyyum. Each = ovvoruvaraagath thanithaniye.",
  mistake:"Choosing a plural verb because of the AND or the plural noun after 'of'.",
  exam:"SSC CGL / CHSL, RRB NTPC, SBI and IBPS — very high frequency."},

 s15:[
 {ta:"இந்த rule-ஐ புரிஞ்சுக்க ஒரு படம் மனசுல வெச்சுக்கோங்க. உங்க முன்னாடி ஆயிரம் பேரு நிக்கிறாங்க. நீங்க 'every man' அப்படின்னு சொல்லும்போது, நீங்க ஆயிரம் பேரையும் ஒரே நேரத்துல பார்க்கல. ஒவ்வொருத்தரா — இவரு, அப்புறம் இவரு, அப்புறம் இவரு — அப்படித்தான் பார்க்கிறீங்க. எந்த ஒரு நொடியிலும் உங்க மனசுல ஒரே ஒரு நபர்தான். அதனாலதான் ஒருமை வினைச்சொல்.",
  tl:"Indha rule-ai purinjukka oru padam manasula vechukkonga. Unga munnaadi aayiram peru nikkiraanga. Neenga 'every man' appadinnu sollumbodhu, neenga aayiram perayum ore neraththula paarkkala. Ovvoruththaraa — ivaru, appuram ivaru — appadidhaan paarkkireenga. Endha oru nodiyilum unga manasula ore oru nabar-dhaan. Adhanaaladhaan orumai vinaichol."},
 {ta:"இப்போ SSC என்ன பண்ணும் தெரியுமா? ஒரு நீளமான வாக்கியம் எழுதும். 'Every man, woman, child, soldier and officer in the entire district ____ counted.' இவ்ளோ நீளமா படிச்சிட்டு வர்றப்போ, ஆரம்பத்துல இருந்த அந்த சின்ன 'Every'-ஐ நீங்க மறந்துடுவீங்க. கடைசில 'officer'-ஐ பார்த்து, இல்ல அந்த பெரிய பட்டியலைப் பார்த்து, WERE அப்படின்னு எழுதிடுவீங்க. தப்பு. WAS.",
  tl:"Ippo SSC enna pannum theriyumaa? Oru neelamaana vaakkiyam ezhudhum. Ivlo neelamaa padichittu varrappo, aarambaththula irundha andha chinna 'Every'-ai neenga marandhuduveenga. Kadaisila andha periya pattiyalaip paarththu, WERE appadinnu ezhudhiduveenga. Thappu. WAS."},
 {ta:"அதனால ஒரு பழக்கம் வெச்சுக்கோங்க: Subject-ஓட முதல் வார்த்தையை மட்டும் பாருங்க. அது each-ஆ? every-யா? no-வா? அப்படின்னா, மீதி வாக்கியத்தை படிக்கவே வேணாம். ஒருமை. முடிஞ்சது. இது ஒரு reflex மாதிரி வரணும்.",
  tl:"Adhanaala oru pazhakkam vechukkonga: Subject-oda mudhal vaarththaiyai mattum paarunga. Adhu each-aa? every-yaa? no-vaa? Appadinnaa, meedhi vaakkiyaththai padikkave venaam. Orumai. Mudinjadhu. Idhu oru reflex maadhiri varanum."},
 {ta:"இன்னொரு பொறி: 'Each of the boys has a pen.' இங்க 'boys' அப்படின்னு பன்மை வார்த்தை blank-க்கு பக்கத்துல உட்கார்ந்து இருக்கு. உங்க கண் அதைத்தான் பார்க்கும். ஆனா Subject 'boys' இல்ல — Subject 'Each'. 'of the boys' அப்படிங்கிறது வெறும் விளக்கம். இது Rule 31-ஓட அதே தந்திரம். ரெண்டையும் சேர்த்துப் புரிஞ்சுக்கோங்க.",
  tl:"Innoru pori: 'Each of the boys has a pen.' Inga 'boys' appadinnu panmai vaarththai blank-kku pakkaththula utkaarndhu irukku. Unga kan adhaith-thaan paarkkum. Aanaa Subject 'boys' illa — Subject 'Each'. 'of the boys' appadingiradhu verum vilakkam."},
 {ta:"கடைசியா ஒரு விதிவிலக்கு. 'The boys each have a room.' இங்க 'each' முன்னாடி வரல, பின்னாடி வருது. Subject 'The boys' — பன்மை. அதனால HAVE. இடம் மாறினா விதியும் மாறும். இதை மனசுல வெச்சுக்கோங்க: 'each' முன்னாடி இருந்தா ஒருமை, பின்னாடி இருந்தா பன்மை Subject-ஐ பாருங்க.",
  tl:"Kadaisiyaa oru vidhivilakku. 'The boys each have a room.' Inga 'each' munnaadi varala, pinnaadi varudhu. Subject 'The boys' — panmai. Adhanaala HAVE. Idam maarinaa vidhiyum maarum."}]},

/* ========== RULE 35 ========== */
{n:35,rc:"SVA-05",d:"Hard",t:"EITHER…OR / NEITHER…NOR — The Nearest Subject Rule",
 tam:"அருகில் இருக்கும் Subject-ஐப் பார்த்தே Verb வரும் · Arugil irukkum Subject-aip paarththe Verb varum",
 s1:{en:"With either…or, neither…nor, not only…but also, or, and nor, the verb agrees with the subject NEAREST to it — in both NUMBER and PERSON. The far subject is completely ignored.",
  ta:"either…or, neither…nor, not only…but also, or, nor ஆகியவற்றைப் பயன்படுத்தும்போது, வினைச்சொல் தனக்கு மிக அருகில் இருக்கும் Subject-ஐப் பார்த்தே வரும் — எண்ணிலும் (number) நபரிலும் (person). தூரத்தில் இருக்கும் Subject முற்றிலும் புறக்கணிக்கப்படும்.",
  tl:"either…or, neither…nor, not only…but also, or, nor aagiyavatraip payanpaduththumbodhu, vinaichol thanakku miga arugil irukkum Subject-aip paarththe varum — ennilum (number) nabarilum (person). Thooraththil irukkum Subject mutrilum purakkanikkappadum.",
  formula:"Either  A  or  B  +  VERB\n                  ↑     ↑\n              NEAREST  follows B only\n\nEither Ram or his friends ARE coming.   (friends = plural)\nEither the boys or Ram    IS  coming.   (Ram = singular)"},

 s2:[
 {h:"Why the nearest subject wins",
  en:"'Either…or' does not add two subjects together. It offers a CHOICE — one or the other, not both. Since only one of them is actually being asserted, English lets the closer one control the verb.",
  ta:"'Either…or' இரண்டு Subject-களைக் கூட்டிச் சேர்ப்பதில்லை. அது ஒரு தேர்வைத் தருகிறது — ஒன்று அல்லது இன்னொன்று, இரண்டும் சேர்ந்து அல்ல. உண்மையில் ஒன்றைப் பற்றி மட்டுமே சொல்லப்படுவதால், ஆங்கிலம் அருகில் இருப்பதை வினைச்சொல்லைக் கட்டுப்படுத்த அனுமதிக்கிறது.",
  tl:"'Either…or' irandu Subject-kalaik koottich serppadhillai. Adhu oru thervaith tharugiradhu — ondru alladhu innondru, irandum serndhu alla. Unmaiyil ondraip patri mattume sollappaduvadhaal, Aangilam arugil iruppadhai vinaicholaik kattuppaduththa anumadhikkiradhu."},
 {h:"PERSON also follows the nearest subject",
  en:"This is the part almost everyone misses. 'Neither he nor I AM responsible' — the verb matches 'I', not 'he'. Similarly 'Either you or he IS wrong' and 'Neither Ram nor you ARE at fault'.",
  ta:"இதைத்தான் கிட்டத்தட்ட அனைவரும் தவறவிடுகிறார்கள். 'Neither he nor I AM responsible' — வினைச்சொல் 'I'-ஐப் பொருத்தே வருகிறது, 'he'-ஐ அல்ல. அதேபோல 'Either you or he IS wrong' மற்றும் 'Neither Ram nor you ARE at fault'.",
  tl:"Idhaith-thaan kittaththatta anaivarum thavaravidugiraargal. 'Neither he nor I AM responsible' — vinaichol 'I'-aip poruththe varugiradhu, 'he'-ai alla. Adhepola 'Either you or he IS wrong'."},
 {h:"Good writing style — put the plural last",
  en:"Because 'Either the boys or Ram is coming' sounds awkward, good writers place the plural subject second: 'Either Ram or the boys are coming'. The exam, however, will deliberately give you the awkward order.",
  ta:"'Either the boys or Ram is coming' என்பது காதுக்கு சங்கடமாக இருப்பதால், நல்ல எழுத்தாளர்கள் பன்மை Subject-ஐ இரண்டாவதாக வைப்பார்கள்: 'Either Ram or the boys are coming'. ஆனால் தேர்வு வேண்டுமென்றே சங்கடமான வரிசையையே தரும்.",
  tl:"'Either the boys or Ram is coming' enbadhu kaadhukku sangadamaaga iruppadhaal, nalla ezhuththaalargal panmai Subject-ai irandaavadhaaga vaippaargal. Aanaal thervu vendumendre sangadamaana varisaiyaiye tharum."},
 {h:"The pairs must never be mixed",
  en:"EITHER always goes with OR. NEITHER always goes with NOR. 'Either…nor' and 'neither…or' are both wrong, and both appear as answer options.",
  ta:"EITHER எப்போதும் OR-உடன் வரும். NEITHER எப்போதும் NOR-உடன் வரும். 'Either…nor' மற்றும் 'neither…or' இரண்டுமே தவறு, மேலும் இரண்டுமே விடை option-களாகத் தரப்படும்.",
  tl:"EITHER eppodhum OR-udan varum. NEITHER eppodhum NOR-udan varum. 'Either…nor' matrum 'neither…or' irandume thavaru."}],

 s3:[
 {h:"The verb looks LEFT and picks the nearest",
  d:"    Ram    ──── OR ────  friends\n     ✗                        ✓\n  (ignored)              (NEAREST)\n                              │\n                              ▼\n                            ARE\n\n  Either Ram or his friends ARE coming.  ✔"},
 {h:"Reverse the order — the verb flips",
  d:"    boys   ──── OR ────    Ram\n     ✗                        ✓\n  (ignored)              (NEAREST)\n                              │\n                              ▼\n                             IS\n\n  Either the boys or Ram IS coming.  ✔"},
 {h:"PERSON follows too",
  d:"  Neither  he  nor   I   ____ responsible.\n            ✗          ✓\n                    (nearest = I)\n                        │\n                        ▼\n                       AM\n\n  Neither he nor I AM responsible.  ✔\n  (not IS, not ARE)"}],

 s4:{
 wrong:["\"Ram or friends — that is two subjects, so the verb must be plural (ARE).\" — WRONG. The exam does not count subjects here.",
  "\"'Either…or' means both, so plural.\" — It means ONE of the two, not both.",
  "\"'Neither he nor I' — 'he' comes first, so use IS.\" — Person also follows the nearest subject, which is 'I' → AM.",
  "\"The sentence sounds strange with IS, so ARE must be right.\" — Awkward but correct beats smooth but wrong."],
 right:["Find the word immediately before the verb. That is your subject.",
  "Check its NUMBER (singular or plural) AND its PERSON (I / you / he).",
  "Ignore everything before the 'or' or 'nor'.",
  "Verify the pair: either goes with or, neither goes with nor."]},

 s5:[
 {en:"Either Ram or his friends are coming.",
  ta:"ராம் அல்லது அவனுடைய நண்பர்கள் வருகிறார்கள்.",
  tl:"Ram alladhu avanudaiya nanbargal varugiraargal.",
  note:"Nearest = friends (plural) → ARE. Ram is ignored."},
 {en:"Either the boys or Ram is coming.",
  ta:"பையன்கள் அல்லது ராம் வருகிறார்.",
  tl:"Paiyangal alladhu Ram varugiraar.",
  note:"Nearest = Ram (singular) → IS. Boys is ignored."},
 {en:"Neither the teacher nor the students were present.",
  ta:"ஆசிரியரும் இல்லை, மாணவர்களும் இல்லை — யாரும் வரவில்லை.",
  tl:"Aasiriyarum illai, maanavargalum illai — yaarum varavillai.",
  note:"Nearest = students (plural) → WERE."},
 {en:"Neither he nor I am responsible for this loss.",
  ta:"இந்த இழப்புக்கு அவனும் பொறுப்பில்லை, நானும் பொறுப்பில்லை.",
  tl:"Indha izhappukku avanum poruppillai, naanum poruppillai.",
  note:"Nearest = I → AM. This is the PERSON trap."},
 {en:"Not only the players but also the coach was blamed.",
  ta:"வீரர்கள் மட்டுமல்ல, பயிற்சியாளரும் குற்றம் சாட்டப்பட்டார்.",
  tl:"Veerargal mattumalla, payirchiyaalarum kutram saattappattaar.",
  note:"Nearest = coach (singular) → WAS."}],

 s7:[
