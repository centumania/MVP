 s13:[
 "A lot of the equipment, along with several vehicles, ____ been damaged in the fire last night.|have;has;had|1|Rule 31 removes 'along with several vehicles'. 'Equipment' is uncountable → HAS BEEN.",
 "A large number of applications ____ received, but a large amount of data ____ still missing.|was-are;were-is;were-are|1|'Applications' is countable plural → WERE. 'Data' as a mass noun → IS.",
 "Neither a lot of money nor good intentions ____ enough to solve a problem of this size.|is;are;was|1|'Neither...nor' takes the nearest → 'good intentions' (plural) → ARE.",
 "The rest of the villagers who ____ affected ____ been given temporary shelter by the district administration.|was-has;were-have;were-has|1|'Who' refers to 'villagers' → WERE. Main verb also plural → HAVE BEEN.",
 "A great deal of effort ____ gone into this project, though the number of volunteers ____ steadily fallen.|have-have;has-has;has-have|1|'A great deal of' → HAS. 'The number of' → HAS (Rule 38)."],

 s14:{
  rule:"A lot of / plenty of / the rest of follow the noun after 'of'. A great deal of and a large amount of are always singular. A large number of is always plural.",
  formula:"A LOT OF / PLENTY OF / REST OF + NOUN → verb copies the NOUN\nA GREAT DEAL OF / A LARGE AMOUNT OF → SINGULAR\nA LARGE NUMBER OF → PLURAL",
  memory:"Can you count it? Countable = NUMBER + plural. Uncountable = AMOUNT + singular.",
  ta:"எண்ண முடியுமா? முடிஞ்சா NUMBER + பன்மை. முடியலைன்னா AMOUNT + ஒருமை.",
  tl:"Enna mudiyumaa? Mudinjaa NUMBER + panmai. Mudiyalainnaa AMOUNT + orumai.",
  mistake:"Writing 'a large amount of students' and treating uncountable nouns like equipment as plural.",
  exam:"SSC CGL / CHSL and Bank — appears mainly in Sentence Improvement and Fill in the Blank."},

 s15:[
 {ta:"இது Rule 37, Rule 46-ஓட மூணாவது சகோதரன். மூணுமே ஒரே இயந்திரம் — 'of'-ஐ தாண்டி குதிச்சு, அடுத்த பெயர்ச்சொல்ல இறங்குங்க. அதோட எண்ணை copy பண்ணுங்க. அவ்ளோதான்.",
  tl:"Idhu Rule 37, Rule 46-oda moonaavadhu sagodharan. Moonume ore iyandhiram — 'of'-ai thaandi kudhichu, aduththa peyarcholla irangunga. Adhoda ennai copy pannunga."},
 {ta:"ஆனா இந்த rule-ல ஒரு தனி விஷயம் இருக்கு — AMOUNT மற்றும் NUMBER. இது SSC-ல ரொம்ப அதிகமா கேட்கப்படுது, குறிப்பா Sentence Improvement-ல. உங்களுக்கு ஒரு கேள்வி வரும்: 'A large amount of students appeared for the exam.' இது சரியா தப்பா?",
  tl:"Aanaa indha rule-la oru thani vishayam irukku — AMOUNT matrum NUMBER. Idhu SSC-la romba adhigamaa ketkappadudhu, kurippaa Sentence Improvement-la."},
 {ta:"தப்பு. ஏன்? ஏன்னா மாணவர்களை எண்ண முடியும். ஒரு மாணவர், ரெண்டு மாணவர், மூணு மாணவர். எண்ண முடியுதுன்னா NUMBER பயன்படுத்தணும். 'A large NUMBER of students'. ஆனா தண்ணீரை எண்ண முடியுமா? ஒரு தண்ணீர், ரெண்டு தண்ணீர்? முடியாது. அதனால AMOUNT. 'A large AMOUNT of water'.",
  tl:"Thappu. Yennaa maanavargalai enna mudiyum. Oru maanavar, rendu maanavar, moonu maanavar. Enna mudiyudhunnaa NUMBER payanpaduththanum. Aanaa thanneerai enna mudiyumaa? Mudiyaadhu. Adhanaala AMOUNT."},
 {ta:"இதை ஒரு எளிமையான சோதனையா நினைச்சுக்கோங்க — 'எண்ண முடியுமா?' சோதனை. மனசுக்குள்ள 'ஒண்ணு, ரெண்டு, மூணு' அப்படின்னு சொல்லிப் பாருங்க. முடிஞ்சா NUMBER + பன்மை verb. முடியலைன்னா AMOUNT + ஒருமை verb. இந்த ஒரு சோதனை உங்களை எப்பவும் காப்பாத்தும்.",
  tl:"Idhai oru elimaiyaana sodhanaiyaa ninaichukkonga — 'enna mudiyumaa?' sodhanai. Manasukkulla 'onnu, rendu, moonu' appadinnu sollip paarunga. Mudinjaa NUMBER + panmai verb. Mudiyalainnaa AMOUNT + orumai verb."},
 {ta:"கடைசியா மூணு நிலையான தொடர் மனப்பாடம் பண்ணுங்க: 'A great deal of' — எப்பவும் ஒருமை. 'A large amount of' — எப்பவும் ஒருமை. 'A large number of' — எப்பவும் பன்மை. இந்த மூணு மட்டும் நிலையானது, மத்ததெல்லாம் பெயர்ச்சொல்லைப் பொறுத்து மாறும்.",
  tl:"Kadaisiyaa moonu nilaiyaana thodar manappaadam pannunga: 'A great deal of' — eppavum orumai. 'A large amount of' — eppavum orumai. 'A large number of' — eppavum panmai."}]},

/* ========== RULE 49 ========== */
{n:49,rc:"SVA-19",d:"Hard",t:"Inversion does not change the Agreement",
 tam:"Here, Never, Seldom — வாக்கியம் தலைகீழானாலும் Subject-ஐப் பாருங்கள்",
 s1:{en:"When a sentence is inverted — after here, there, never, seldom, hardly, rarely, scarcely, no sooner, only then, not only, or an adverbial phrase — the verb still agrees with the REAL SUBJECT, which now comes after the verb.",
  ta:"ஒரு வாக்கியம் தலைகீழாக மாறும்போது — here, there, never, seldom, hardly, rarely, scarcely, no sooner, only then, not only, அல்லது ஒரு adverbial தொடருக்குப் பின் — வினைச்சொல் இன்னும் உண்மையான Subject-உடன்தான் ஒத்துப்போகும், அது இப்போது வினைச்சொல்லுக்குப் பின் வருகிறது.",
  tl:"Oru vaakkiyam thalaigeezhaaga maarumbodhu — here, there, never, seldom, hardly, rarely, scarcely, no sooner, only then, not only — vinaichol innum unmaiyaana Subject-udan-dhaan oththuppogum, adhu ippodhu vinaicholukkup pin varugiradhu.",
  formula:"NORMAL   :  SUBJECT  +  VERB\nINVERTED :  ADVERB  +  VERB  +  SUBJECT\n                          ↑        ↑\n                    still agrees with this\n\nHere COMES the bus.        Here COME the buses.\nOn the wall HANG two paintings.\nNever HAVE I seen such a sight."},

 s2:[
 {h:"Word order changes, grammar does not",
  en:"Inversion is only a stylistic reshuffle for emphasis. Moving the subject to the end does not change what the subject is. Rewrite the sentence in normal order and the answer becomes obvious.",
  ta:"தலைகீழ் அமைப்பு என்பது வலியுறுத்துவதற்கான ஒரு நடைமாற்றம் மட்டுமே. Subject-ஐ கடைசிக்கு நகர்த்துவது Subject எது என்பதை மாற்றாது. வாக்கியத்தை சாதாரண வரிசையில் மீண்டும் எழுதுங்கள், பதில் தெளிவாகிவிடும்.",
  tl:"Thalaigeezh amaippu enbadhu valiyuruththuvadharkaana oru nadaimaatram mattume. Subject-ai kadaisikku nagarththuvadhu Subject edhu enbadhai maatraadhu. Vaakkiyaththai saadhaarana varisaiyil meendum ezhudhungal."},
 {h:"Two different inversion patterns",
  en:"PATTERN 1 — full verb moves first: 'Here comes the bus', 'On the wall hang two paintings'. PATTERN 2 — only the auxiliary moves first: 'Never have I seen', 'Seldom does he complain', 'Rarely is she late'.",
  ta:"இரண்டு வெவ்வேறு தலைகீழ் அமைப்புகள். அமைப்பு 1 — முழு வினைச்சொல் முதலில் வரும்: 'Here comes the bus', 'On the wall hang two paintings'. அமைப்பு 2 — துணை வினைச்சொல் மட்டும் முதலில் வரும்: 'Never have I seen', 'Seldom does he complain'.",
  tl:"Irandu vevveru thalaigeezh amaippugal. Amaippu 1 — muzhu vinaichol mudhalil varum. Amaippu 2 — thunai vinaichol mattum mudhalil varum."},
 {h:"Negative adverbs force inversion",
  en:"After never, seldom, hardly, rarely, scarcely, little, nowhere, no sooner, not only and only then, the sentence MUST be inverted. 'Never I have seen' is wrong; 'Never have I seen' is correct.",
  ta:"எதிர்மறை வினையுரிச்சொற்கள் தலைகீழ் அமைப்பைக் கட்டாயமாக்குகின்றன. never, seldom, hardly, rarely, scarcely, little, nowhere, no sooner, not only, only then ஆகியவற்றுக்குப் பின் வாக்கியம் கண்டிப்பாகத் தலைகீழாக இருக்க வேண்டும். 'Never I have seen' தவறு; 'Never have I seen' சரி.",
  tl:"Edhirmarai vinaiyurichorkal thalaigeezh amaippaik kattaayamaakkugindrana. 'Never I have seen' thavaru; 'Never have I seen' sari."}],

 s3:[
 {h:"Rewrite in normal order",
  d:"  Under the tree  SIT  two dogs.\n                    ↑      ↑\n                  verb   REAL SUBJECT (plural)\n\n  REWRITE:  Two dogs SIT under the tree.  ✔\n            Now the subject is obvious."},
 {h:"Negative adverb + auxiliary + subject",
  d:"  Never  HAVE  I  seen such a sight.\n    ↑      ↑    ↑\n negative auxiliary subject\n         moves first\n\n  Seldom DOES he complain.\n  Rarely IS   she late.\n  Hardly HAD  we sat down when the bell rang."}],

 s4:{
 wrong:["\"The first word is the subject, so match the verb to it.\" — 'Here', 'never' and 'on the wall' are never subjects.",
  "\"'Here come the bus' sounds fine.\" — 'Bus' is singular, so 'comes'.",
  "\"'Never I have seen such a thing' is correct.\" — After a negative adverb the auxiliary must come before the subject."],
 right:["Find the verb, then look AFTER it for the real subject.",
  "Rewrite the sentence in normal order before choosing.",
  "After never, seldom, hardly, rarely, no sooner, put the auxiliary before the subject."]},

 s5:[
 {en:"Here comes the bus we have been waiting for.",ta:"நாம் காத்திருந்த பேருந்து இதோ வருகிறது.",tl:"Naam kaaththirundha perundhu idho varugiradhu.",note:"Real subject = 'the bus' (singular) → COMES."},
 {en:"On the wall hang two beautiful paintings.",ta:"சுவரில் இரண்டு அழகான ஓவியங்கள் தொங்குகின்றன.",tl:"Suvaril irandu azhagaana oviyangal thongugindrana.",note:"Real subject = 'two paintings' (plural) → HANG."},
 {en:"Never have I seen such a beautiful sight.",ta:"இவ்வளவு அழகான காட்சியை நான் ஒருபோதும் பார்த்ததில்லை.",tl:"Ivvalavu azhagaana kaatchiyai naan orupodhum paarththadhillai.",note:"'Never' forces inversion: auxiliary HAVE before subject I."},
 {en:"Seldom does he complain about anything.",ta:"அவர் எதைப் பற்றியும் அரிதாகவே புகார் கூறுவார்.",tl:"Avar edhaip patriyum aridhaagave pugaar kooruvaar.",note:"'Seldom' forces inversion: DOES before 'he'."}],

 s7:[

 "On the table ____ two books.|lie|Medium|Real subject = 'two books'.",
 "On the table ____ a book.|lies|Medium|Real subject = 'a book'.",
 "Under the tree ____ two dogs.|sit|Medium|Plural subject.",
 "Never ____ I seen such a crowd.|have|Medium|'Never' forces inversion.",

 s9:[
 "Find the Error|On the wall of the old palace (A) hangs several (B) portraits of the (C) former rulers (D).|A;B;C;D|1|Part B. Real subject = 'several portraits' (plural) → 'hang several'.",
 "Fill in the Blank|Never ____ I come across such a well-written answer in my career.|have;has|0|Subject 'I' → HAVE. 'Never' forces inversion.",
 "Sentence Improvement|Seldom he complains about the extra work given to him.|he complains;does he complain;he does complain|1|'Seldom' forces inversion.",
 "Find the Error|Here come (A) the train (B) that we have been (C) waiting for since morning (D).|A;B;C;D|0|Part A. Real subject 'the train' is singular → 'Here comes'.",
 "Fill in the Blank|Hardly ____ the meeting begun when the power supply failed.|has;had|1|'Hardly...when' takes the past perfect → HAD."],

 s10:{
  en:"Because the subject arrives LAST, your eye has nothing to match the verb to except the opening word. So you match the verb to 'here', 'never' or 'on the wall' — none of which are subjects. The second trap is forgetting that negative adverbs force the auxiliary to come first: the exam offers 'Never I have seen' as a natural-looking option.",
  ta:"Subject கடைசியாக வருவதால், வினைச்சொல்லுடன் பொருத்துவதற்கு உங்கள் கண்ணுக்கு தொடக்கச் சொல்லைத் தவிர வேறு எதுவும் இல்லை. எனவே நீங்கள் வினைச்சொல்லை 'here', 'never' அல்லது 'on the wall'-உடன் பொருத்திவிடுவீர்கள் — இவை எதுவும் Subject அல்ல. இரண்டாவது பொறி எதிர்மறை வினையுரிச்சொற்கள் துணை வினைச்சொல்லை முதலில் வரவைக்கின்றன என்பதை மறப்பது.",
  tl:"Subject kadaisiyaaga varuvadhaal, vinaicholudan poruththuvadharku ungal kannukku thodakkach sollaith thavira veru edhuvum illai. Enave neengal vinaicholai 'here', 'never' alladhu 'on the wall'-udan poruththividuveergal — ivai edhuvum Subject alla."},

 s11:{
  en:"REWRITE IT IN NORMAL ORDER. Subject first, verb second. Then choose.",
  ta:"சாதாரண வரிசையில் மீண்டும் எழுதுங்கள். Subject முதலில், வினைச்சொல் இரண்டாவது. பிறகு தேர்ந்தெடுங்கள்.",
  tl:"Saadhaarana varisaiyil meendum ezhudhungal. Subject mudhalil, vinaichol irandaavadhu. Piragu therndhedungal.",
  vis:"       FLIP IT BACK\n\n  Under the tree SIT two dogs.\n            ↓ flip\n  Two dogs SIT under the tree.   ✔ obvious\n\n  NEGATIVE ADVERBS THAT FORCE INVERSION:\n  never · seldom · hardly · rarely · scarcely\n  little · nowhere · no sooner · not only · only then\n\n  Pattern:  ADVERB + AUXILIARY + SUBJECT + VERB\n            Never  +   have    +   I     +  seen"},

 s13:[
 "On the walls of the old hall ____ several portraits, each of which ____ over a century old.|hang-is;hangs-is;hang-are|0|Real subject 'several portraits' → HANG. 'Each of which' → IS (Rule 50).",
 "Never ____ the police been able to trace the men who ____ responsible for the theft.|have-was;has-were;have-were|2|Subject 'the police' is always plural (Rule 47) → HAVE. 'Who' refers to 'men' → WERE.",
 "Hardly ____ the number of complaints fallen when a lot of new problems ____ reported.|has-was;had-were;had-was|1|'Hardly...when' takes the past perfect → HAD. 'A lot of new problems' → WERE.",
 "Seldom ____ one of the villagers who ____ been displaced complain about the delay.|do-has;does-have;does-has|1|Inverted subject is 'one of the villagers' → DOES. 'Who' refers to 'villagers' → HAVE.",
 "Under the bridge ____ two-thirds of the rubbish that the workers ____ failed to clear.|lies-has;lie-have;lies-have|2|'Two-thirds of the rubbish' is uncountable → LIES. 'Workers' → HAVE."],

 s14:{
  rule:"In inverted sentences the verb still agrees with the real subject, which follows the verb.",
  formula:"ADVERB / HERE / THERE  +  VERB  +  REAL SUBJECT\nNEGATIVE ADVERB + AUXILIARY + SUBJECT + VERB",
  memory:"Flip the sentence back to normal order, then choose the verb.",
  ta:"வாக்கியத்தை சாதாரண வரிசைக்கு திருப்பிப் போடுங்க, அப்புறம் verb தேர்ந்தெடுங்க.",
  tl:"Vaakkiyaththai saadhaarana varisaikku thirumbip podunga, appuram verb therndhedunga.",
  mistake:"Matching the verb to the opening adverb instead of the real subject, and writing 'Never I have seen'.",
  exam:"SSC CGL Tier-1, CDS and Bank PO — often combined with the hardly-when and no-sooner-than structures."},

 s15:[
 {ta:"இந்த rule கொஞ்சம் வித்தியாசமானது. ஏன்னா இங்க வாக்கியம் தலைகீழா இருக்கு. சாதாரணமா ஆங்கிலத்துல Subject முதல்ல, Verb ரெண்டாவது. ஆனா சில வாக்கியங்கள்ல Verb முதல்ல வந்து, Subject கடைசில வரும்.",
  tl:"Indha rule konjam viththiyaasamaanadhu. Yennaa inga vaakkiyam thalaigeezhaa irukku. Saadhaaranamaa Aangilaththula Subject mudhalla, Verb randaavadhu. Aanaa sila vaakkiyangalla Verb mudhalla vandhu, Subject kadaisila varum."},
 {ta:"'Under the tree sit two dogs.' இதுல Subject எது? 'Under the tree' இல்ல — அது ஒரு இட வர்ணனை. Subject 'two dogs'. பன்மை. அதனால SIT. ஆனா நம்ம கண் ஆரம்பத்துல இருக்கிற 'tree'-ஐ பார்க்கும், அது ஒருமை, அதனால SITS போட்டுடுவோம். தப்பு.",
  tl:"'Under the tree sit two dogs.' Idhula Subject edhu? 'Under the tree' illa — adhu oru ida varnanai. Subject 'two dogs'. Panmai. Adhanaala SIT. Aanaa namma kan aarambaththula irukkira 'tree'-ai paarkkum, adhu orumai, adhanaala SITS poduduvom. Thappu."},
 {ta:"தீர்வு ரொம்ப சிம்பிள் — வாக்கியத்தை திருப்பிப் போடுங்க. 'Under the tree sit two dogs' → 'Two dogs sit under the tree.' இப்போ Subject தெளிவா தெரியுது. 'Two dogs'. பன்மை. SIT. இந்த ஒரு பழக்கம் இருந்தா, இந்த rule-ல நீங்க ஒருபோதும் தப்பு பண்ண மாட்டீங்க.",
  tl:"Theervu romba simple — vaakkiyaththai thirumbip podunga. 'Under the tree sit two dogs' → 'Two dogs sit under the tree.' Ippo Subject thelivaa theriyudhu. 'Two dogs'. Panmai. SIT."},
 {ta:"இப்போ ரெண்டாவது பகுதி — எதிர்மறை வினையுரிச்சொல். Never, Seldom, Hardly, Rarely, Scarcely, No sooner, Not only, Only then. இந்த வார்த்தையில வாக்கியம் ஆரம்பிச்சா, அடுத்து துணை வினைச்சொல் (auxiliary) வரணும், அப்புறம்தான் Subject. 'Never HAVE I seen' — சரி. 'Never I have seen' — தப்பு.",
  tl:"Ippo randaavadhu paguthi — edhirmarai vinaiyurichol. Never, Seldom, Hardly, Rarely, Scarcely, No sooner, Not only, Only then. Indha vaarththaiyila vaakkiyam aarambichaa, aduththu thunai vinaichol (auxiliary) varanum, appuram-dhaan Subject."},
 {ta:"ஏன் இப்படி? ஏன்னா இது கேள்வி வடிவம் மாதிரி. 'Have I seen?' அப்படிங்கிற வரிசை. முன்னாடி 'Never' வெச்சா, 'Never have I seen'. 'Does he complain?' → 'Seldom does he complain'. கேள்வி வரிசையை நினைச்சுக்கிட்டா இது எளிது.",
  tl:"Yen ippadi? Yennaa idhu kelvi vadivam maadhiri. 'Have I seen?' appadingira varisai. Munnaadi 'Never' vechaa, 'Never have I seen'. 'Does he complain?' → 'Seldom does he complain'."},
 {ta:"கடைசியா ஒரு practical tip. தேர்வுல வாக்கியம் ஒரு வினையுரிச்சொல்லோட ஆரம்பிச்சா, உடனே alert ஆயிடுங்க. ரெண்டு விஷயம் பாருங்க: ஒண்ணு — Subject எங்க இருக்கு? அது ஒருமையா பன்மையா? ரெண்டு — auxiliary Subject-க்கு முன்னாடி இருக்கா? இந்த ரெண்டு சரியா இருந்தா வாக்கியம் சரி.",
  tl:"Kadaisiyaa oru practical tip. Thervula vaakkiyam oru vinaiyurichollota aarambichaa, udane alert aayidunga. Rendu vishayam paarunga: onnu — Subject enga irukku? Adhu orumaiyaa panmaiyaa? Rendu — auxiliary Subject-kku munnaadi irukkaa?"}]},

/* ========== RULE 50 ========== */
{n:50,rc:"SVA-20",d:"Hard",t:"EITHER OF, NEITHER OF, EACH OF, ONE OF, ANY OF are Singular",
 tam:"Either of, Neither of, Each of, One of — எப்போதும் ஒருமை வினைச்சொல்",
 s1:{en:"Either of, neither of, each of, one of, every one of, any one of and none other than are ALWAYS followed by a SINGULAR verb — even when a plural noun sits between them and the verb.",
  ta:"Either of, neither of, each of, one of, every one of, any one of — இவற்றுக்குப் பின் எப்போதும் ஒருமை வினைச்சொல்லே வரும் — அவற்றுக்கும் வினைச்சொல்லுக்கும் இடையில் ஒரு பன்மைப் பெயர்ச்சொல் அமர்ந்திருந்தாலும் கூட.",
  tl:"Either of, neither of, each of, one of, every one of, any one of — ivatrukkup pin eppodhum orumai vinaicholle varum — avatrukkum vinaicholukkum idaiyil oru panmaip peyarchol amarndhirundhaalum kooda.",
  formula:"EITHER OF / NEITHER OF / EACH OF / ONE OF  +  plural noun  +  SINGULAR VERB\n\nEither of the two answers   IS  correct.\nNeither of the boys         WAS present.\nEach of the players         HAS a jersey.\nOne of my friends           LIVES here."},

 s2:[
 {h:"They select ONE out of the group",
  en:"'One of the boys' means one single boy. 'Each of the players' means each single player, taken one at a time. 'Neither of the two' means not this one and not that one — still one at a time. The group is mentioned only to say WHERE that one comes from.",
  ta:"இவை குழுவிலிருந்து ஒன்றைத் தேர்ந்தெடுக்கின்றன. 'One of the boys' என்றால் ஒரே ஒரு பையன். 'Each of the players' என்றால் ஒவ்வொரு வீரரும், ஒவ்வொருவராகத் தனித்தனியே. 'Neither of the two' என்றால் இதுவும் இல்லை அதுவும் இல்லை — இன்னும் ஒவ்வொன்றாகத்தான். அந்த ஒருவர் எங்கிருந்து வருகிறார் என்பதைச் சொல்லவே குழு குறிப்பிடப்படுகிறது.",
  tl:"Ivai kuzhuvilirundhu ondraith therndhedukkindrana. 'One of the boys' endraal ore oru paiyan. 'Each of the players' endraal ovvoru veerarum, ovvoruvaraagath thanithaniye. Andha oruvar engirundhu varugiraar enbadhaich sollave kuzhu kurippidappadugiradhu."},
 {h:"The OPPOSITE of Rule 37 and Rule 46",
  en:"'Most of the boys ARE' is plural because 'most of' is flexible. 'Each of the boys IS' is singular because 'each of' is fixed. Two lists, two behaviours. This is the single most confused pair in the whole module.",
  ta:"இது Rule 37 மற்றும் Rule 46-க்கு நேர் எதிரானது. 'Most of the boys ARE' பன்மை, ஏனெனில் 'most of' நெகிழ்வானது. 'Each of the boys IS' ஒருமை, ஏனெனில் 'each of' நிலையானது. இரண்டு பட்டியல்கள், இரண்டு நடத்தைகள். இந்த முழு module-லும் மிக அதிகமாகக் குழப்பப்படும் ஜோடி இதுதான்.",
  tl:"Idhu Rule 37 matrum Rule 46-kku ner edhiraanadhu. 'Most of the boys ARE' panmai. 'Each of the boys IS' orumai. Irandu pattiyalgal, irandu nadaththaigal."},
 {h:"Do not confuse this with Rule 35 or Rule 44",
  en:"'Neither the boy NOR the girls ARE' uses the nearest-subject rule (Rule 35) because of NOR. 'One of the boys WHO HAVE passed' uses the relative-clause rule (Rule 44) because of WHO. But plain 'Neither OF the boys WAS' is this rule. Look for the word 'of'.",
  ta:"இதை Rule 35 அல்லது Rule 44-உடன் குழப்பிக் கொள்ளாதீர்கள். 'Neither the boy NOR the girls ARE' — இது NOR இருப்பதால் அருகில் இருக்கும் Subject விதி (Rule 35). 'One of the boys WHO HAVE passed' — இது WHO இருப்பதால் relative clause விதி (Rule 44). ஆனால் வெறும் 'Neither OF the boys WAS' — இதுதான் இந்த விதி. 'of' என்ற சொல்லைத் தேடுங்கள்.",
  tl:"Idhai Rule 35 alladhu Rule 44-udan kuzhappik kollaadheergal. 'of' endra sollaith thedungal."}],

 s3:[
 {h:"The group is only an address",
  d:"  ONE  of the boys  IS  absent.\n   ↑        ↑          ↑\n REAL   just tells   singular\n SUBJECT you WHERE\n         he came from\n\n  Think of 'of the boys' as an address label.\n  You are still talking about ONE boy."},
 {h:"The two lists — memorise the difference",
  d:"  ALWAYS SINGULAR          FOLLOW THE NOUN\n  ───────────────          ────────────────\n   each of                  most of\n   either of                some of\n   neither of               all of\n   one of                   half of\n   every one of             none of\n   any one of               a lot of / plenty of\n                            two-thirds of / 60% of\n                            the majority of / rest of"},
 {h:"Three lookalikes that behave differently",
  d:"  Neither OF the boys        WAS  present.  ← Rule 50 (of)\n  Neither the boy NOR the girls WERE present. ← Rule 35 (nor)\n  One of the boys WHO         HAVE passed.    ← Rule 44 (who)\n\n  Look for the signal word: OF / NOR / WHO"}],

 s4:{
 wrong:["\"'Boys' is plural and sits right before the verb, so plural verb.\" — The subject is 'neither', not 'boys'.",
  "\"'Neither of the boys were present' sounds completely normal.\" — Normal in speech, wrong in the exam.",
  "\"All 'of' phrases work the same way.\" — No. 'Each of' is fixed singular; 'most of' is flexible.",
  "\"'One of the students have passed' — I saw 'students', so plural.\" — Without 'who', the verb follows 'one'."],
 right:["Look at the FIRST word: each, either, neither, one, every one, any one → singular verb.",
  "Treat 'of the boys' as an address label, not as the subject.",
  "Check for the signal words OF, NOR and WHO to decide which rule applies."]},

 s5:[
 {en:"Either of the two answers is correct.",ta:"இரண்டு விடைகளில் ஏதேனும் ஒன்று சரியானது.",tl:"Irandu vidaigalil edhenum ondru sariyaanadhu.",note:"'Either of' → IS. The subject is 'either', not 'answers'."},
 {en:"Neither of the boys was present yesterday.",ta:"நேற்று அந்த இரண்டு பையன்களில் யாருமே வரவில்லை.",tl:"Netru andha irandu paiyangalil yaarume varavillai.",note:"'Neither of' → WAS."},
 {en:"Each of the players has a separate jersey.",ta:"ஒவ்வொரு வீரருக்கும் தனித்தனி சட்டை உண்டு.",tl:"Ovvoru veerarukkum thanithani sattai undu.",note:"'Each of' → HAS."},
 {en:"One of my friends lives in Chennai.",ta:"என்னுடைய நண்பர்களில் ஒருவர் சென்னையில் வசிக்கிறார்.",tl:"Ennudaiya nanbargalil oruvar Chennaiyil vasikkiraar.",note:"'One of' → LIVES (singular verb with -s)."},
 {en:"Neither of the answers was acceptable to the examiner.",ta:"இரண்டு விடைகளுமே தேர்வாளருக்கு ஏற்புடையதாக இல்லை.",tl:"Irandu vidaigalume thervaalarukku erpudaiyadhaaga illai.",note:"'Neither of' → WAS."}],

 s10:{
  en:"This is the biggest single trap in the whole module, for two reasons. First, a fat plural noun sits right before the verb: 'Neither of the BOYS ____ present'. Second, students who learnt Rule 37 ('most of the boys ARE') apply the same logic here and get it wrong. And third, 'Neither of the boys were' is said constantly in real speech. Three forces pushing you to the wrong answer. Learn the two lists cold.",
  ta:"இது இந்த முழு module-லும் மிகப்பெரிய ஒற்றைப் பொறி, இரண்டு காரணங்களுக்காக. முதலாவது, ஒரு பெரிய பன்மைப் பெயர்ச்சொல் வினைச்சொல்லுக்கு உடனே முன்னால் அமர்ந்திருக்கும்: 'Neither of the BOYS ____ present'. இரண்டாவது, Rule 37 ('most of the boys ARE') கற்றுக்கொண்ட மாணவர்கள் அதே logic-ஐ இங்கேயும் பயன்படுத்தித் தவறு செய்கிறார்கள். மூன்றாவது, 'Neither of the boys were' என்பது உண்மையான பேச்சில் தொடர்ந்து சொல்லப்படுகிறது. மூன்று சக்திகள் உங்களைத் தவறான பதிலை நோக்கித் தள்ளுகின்றன. இரண்டு பட்டியல்களையும் நன்றாகக் கற்றுக்கொள்ளுங்கள்.",
  tl:"Idhu indha muzhu module-lum migapperiya otraip pori, irandu kaaranangalukkaaga. Mudhalaavadhu, oru periya panmaip peyarchol vinaicholukku udane munnaal amarndhirukkum. Irandaavadhu, Rule 37 katrukkonda maanavargal adhe logic-ai ingeyum payanpaduththith thavaru seygiraargal. Irandu pattiyalgalaiyum nandraagak katrukkollungal."},

 s11:{
  en:"'OF THE BOYS' IS ONLY AN ADDRESS LABEL. The subject is EACH, EITHER, NEITHER or ONE — always singular.",
  ta:"'OF THE BOYS' என்பது வெறும் முகவரிச் சீட்டு மட்டுமே. Subject என்பது EACH, EITHER, NEITHER அல்லது ONE — எப்போதும் ஒருமை.",
  tl:"'OF THE BOYS' enbadhu verum mugavarich seettu mattume. Subject enbadhu EACH, EITHER, NEITHER alladhu ONE — eppodhum orumai.",
  vis:"      COVER THE 'OF' PHRASE\n\n  Neither ~~of the boys~~ WAS present.\n     ↑                     ↑\n  SUBJECT              singular verb\n\n  Read only: \"Neither was present.\"  ✔\n\n  SIGNAL-WORD CHECK:\n  see OF   →  Rule 50  →  SINGULAR\n  see NOR  →  Rule 35  →  nearest subject\n  see WHO  →  Rule 44  →  plural (unless 'the only')"},

 s14:{
  rule:"Either of, neither of, each of, one of and every one of always take a singular verb.",
  formula:"EACH / EITHER / NEITHER / ONE  +  OF  +  plural noun  →  SINGULAR VERB",
  memory:"Cover the 'of' phrase. Read only the first word. That is the subject.",
  ta:"'of' தொடரை மூடிடுங்க. முதல் வார்த்தையை மட்டும் படிங்க. அதுதான் Subject.",
  tl:"'of' thodarai moodidunga. Mudhal vaarththaiyai mattum padinga. Adhudhaan Subject.",
  mistake:"Using a plural verb because a plural noun sits between the subject and the verb, and confusing this with Rule 37.",
  exam:"The most repeated SVA rule after Rule 35. Appears in SSC CGL, CHSL, MTS, RRB, SBI and IBPS every year."},

 s15:[

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[
 ["What is the Rule?","விதி என்ன? · Vidhi enna?"],
 ["Why does this rule exist?","ஏன் இந்த விதி? · Yen indha vidhi?"],
 ["Visual Diagram","படம் மூலம் புரிதல் · Padam moolam purithal"],
 ["Wrong Thinking vs Right Thinking","தவறான சிந்தனை · Thavaraana sinthanai"],
 ["Tamil Translation of Examples","உதாரணங்களின் தமிழ் · Udhaaranangalin Tamil"],
 ["Word-by-Word Meaning","சொல்லுக்குச் சொல் · Sollukku sol"],
 ["Solved Examples — Easy to Hard","தீர்க்கப்பட்ட உதாரணங்கள்"],
 ["Wrong vs Correct","தவறு vs சரி · Thavaru vs Sari"],
 ["SSC / Bank PYQ Style","முந்தைய வினாத்தாள் பாணி"],
 ["Exam Trap","தேர்வு பொறி · Thervu pori"],
 ["Memory Trick","நினைவு உத்தி · Ninaivu utthi"],
 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],
 ["Challenge Round","சவால் சுற்று · Savaal sutru"],
 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],
 ["Centu AI Explains","சென்டு AI விளக்கம்"]
];

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)

 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-sva', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
</body>
</html>
