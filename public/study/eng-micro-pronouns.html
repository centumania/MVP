<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Pronouns — 10 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

  tl:"Nermaraiyaana kootril varisai: irandaam nabar, moondraam nabar, mudhal nabar — You, he and I. Aanaal oru thavarai oppukkollumbodhu, varisai thalaigeezhaagi mudhal, irandaam, moondraam aagiradhu — I, you and he.",

 s2:[

  en:"When something GOOD is happening, courtesy says you mention the other person before yourself. 'You, he and I will receive the award' — you place yourself last because it is polite. This is a rule of manners built into English grammar.",
  ta:"நல்லது நடக்கும்போது, மரியாதை மற்றவரை உங்களுக்கு முன் குறிப்பிடச் சொல்கிறது. 'You, he and I will receive the award' — நாகரிகமாக இருப்பதற்காக உங்களைக் கடைசியில் வைக்கிறீர்கள். இது ஆங்கில இலக்கணத்திற்குள் கட்டப்பட்ட ஒரு பண்பாட்டு விதி.",

 {h:"Responsibility puts YOU first",

  ta:"பொறுப்பு உங்களை முதலில் வைக்கிறது. கெட்டது நடந்திருக்கும்போது, முதலில் பழியை ஏற்பது ஒழுக்கமான செயல். 'I, you and he are responsible for this mistake' — நீங்கள் முதலில் முன்வருகிறீர்கள். அதே மரியாதை, எதிர் திசையில்.",

 "____ deserve the scholarship equally.|He and I|Hard|Positive → 3-1.",
 "____ admit that we were careless.|I, you and they|Expert|Confession → 123.",
 "____ have been selected for the team.|You, Ravi and I|Expert|Positive → 231.",
 "____ are to be punished for cheating.|I, you and she|Expert|Fault → 123.",
 "____ shall visit the museum on Sunday.|My sister and I|Expert|Names are third person → 3-1."],

 s8:[
 "I, you and he will receive the award.|You, he and I will receive the award.|Positive news takes the 231 order.",
 "You, he and I are guilty of the crime.|I, you and he are guilty of the crime.|Admitting fault takes the 123 order.",
 "I and Ram have won the match.|Ram and I have won the match.|For good news, put yourself last.",
 "I and you must finish this work.|You and I must finish this work.|Neutral statement takes 2-1.",
 "My brother and I broke the window.|I and my brother broke the window.|Confessing a fault puts 'I' first.",
 "I, she and you are going for the picnic.|You, she and I are going for the picnic.|Positive news takes 231.",
 "You, I and Ravi made this mistake.|I, you and Ravi made this mistake.|Fault takes 123.",
 "I and he were praised by the principal.|He and I were praised by the principal.|Positive news puts 'I' last.",
 "I and my sister will visit the museum.|My sister and I will visit the museum.|Neutral or positive puts 'I' last.",
 "You and I are to be punished for cheating.|I, you and he are to be punished for cheating.|Fault takes 123 with 'I' first."],

 s9:[

 s10:{
  en:"The exam plants a sentence that clearly admits a MISTAKE but writes it in the polite 231 order. 'You, he and I are guilty' looks correct because we are trained to put 'I' last always. It is wrong — guilt requires 'I' first. The second trap is names: students forget that 'Ram' counts as third person, so 'I and Ram won' feels acceptable when it should be 'Ram and I won'.",
  ta:"தேர்வு ஒரு தவறை வெளிப்படையாக ஒப்புக்கொள்ளும் வாக்கியத்தை எழுதி, அதை நாகரிகமான 231 வரிசையில் வைக்கும். 'You, he and I are guilty' சரியாகத் தெரிகிறது, ஏனெனில் 'I'-ஐ எப்போதும் கடைசியில் வைக்கப் பயிற்றுவிக்கப்பட்டிருக்கிறோம். அது தவறு — குற்றத்திற்கு 'I' முதலில் வர வேண்டும். இரண்டாவது பொறி பெயர்கள்: 'Ram' மூன்றாம் நபர் என்பதை மாணவர்கள் மறந்துவிடுகிறார்கள், எனவே 'I and Ram won' ஏற்கத்தக்கதாகத் தோன்றுகிறது.",
  tl:"Thervu oru thavarai velippadaiyaaga oppukkollum vaakkiyaththai ezhudhi, adhai naagarigamaana 231 varisaiyil vaikkum. 'You, he and I are guilty' sariyaagath therigiradhu. Adhu thavaru — kutraththirku 'I' mudhalil vara vendum. Irandaavadhu pori peyargal."},

 s11:{
  en:"PRIZE OR BLAME? Prize → you last (231). Blame → you first (123).",
  ta:"பரிசா, பழியா? பரிசு → நீங்கள் கடைசி (231). பழி → நீங்கள் முதலில் (123).",
  tl:"Parisaa, pazhiyaa? Parisu → neengal kadaisi (231). Pazhi → neengal mudhalil (123).",
  vis:"        THE COURTESY TEST\n\n   🏆 SOMETHING GOOD is coming?\n      Step BACK, let others go first.\n      YOU (2) · HE (3) · I (1)   →  231\n\n   💥 SOMETHING BAD has happened?\n      Step FORWARD, take the blame first.\n      I (1) · YOU (2) · HE (3)   →  123\n\n   HUNT FOR THESE FAULT WORDS:\n   guilty · to blame · responsible for the loss\n   mistake · failed · careless · punished\n\n   ⚠ NAMES ARE THIRD PERSON:\n     Ram and I  ✔     I and Ram  ✘  (for good news)"},

 s13:[
 "____ have been selected, but ____ are responsible for the earlier failure.|Ram and I-I and Ram;I and Ram-Ram and I;Ram and I-Ram and I|0|Good news → 'Ram and I'. Fault → 'I and Ram'.",
 "____ will receive ____ prize, though ____ made ____ small mistake at first.|You and I-the-I and you-a;I and you-a-you and I-the;You and I-a-I and you-the|0|Good → 2-1. Specific prize → THE. Fault → 1-2. 'Small' → A.",
 "____ admit that ____ and my brother broke ____ window of ____ old house.|I-I-the-the;We-I-a-the;I-we-the-a|0|Confession → 'I' first, twice. Specific window and house → THE.",

 s14:{
  rule:"Positive statements take the 231 order (you, he and I). Confessions of fault take the 123 order (I, you and he).",
  formula:"GOOD news → 2-3-1 (You, he and I)\nFAULT → 1-2-3 (I, you and he)\nNames count as THIRD person",
  memory:"Prize → you last. Blame → you first.",
  ta:"பரிசுன்னா நீங்க கடைசி. பழின்னா நீங்க முதல்ல.",
  tl:"Parisunnaa neenga kadaisi. Pazhinnaa neenga mudhalla.",
  mistake:"Using the polite 231 order in a sentence that admits guilt, and forgetting that names are third person.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"Pronouns module-ஐ ஆரம்பிக்கலாம். இந்த முதல் rule கொஞ்சம் வித்தியாசமானது — இது இலக்கண rule மட்டும் இல்ல, இது ஒரு பண்பாட்டு rule. ஆங்கிலம் நாகரிகத்தை இலக்கணத்துக்குள்ளேயே கொண்டு வந்திருக்கு.",
  tl:"Pronouns module-ai aarambikkalaam. Indha mudhal rule konjam viththiyaasamaanadhu — idhu ilakkana rule mattum illa, idhu oru panbaattu rule. Aangilam naagarigaththai ilakkanaththukkulleye kondu vandhirukku."},
 {ta:"நமக்கு school-ல ஒரு விஷயம் சொல்லிக் கொடுத்தாங்க — 'I-ஐ எப்பவும் கடைசில போடு'. 'Ram and I', 'You and I'. இது 80% நேரம் சரி. ஆனா SSC அந்த மீதி 20%-ஐதான் கேட்குது.",
  tl:"Namakku school-la oru vishayam sollik koduththaanga — 'I-ai eppavum kadaisila podu'. 'Ram and I', 'You and I'. Idhu 80% neram sari. Aanaa SSC andha meedhi 20%-aidhaan ketkudhu."},
 {ta:"ஏன் I கடைசில வருது? யோசிச்சுப் பாருங்க. ஒரு பரிசு வழங்கறாங்க. நீங்க முன்னாடி போய் 'நான், அப்பறம் நீங்க' அப்படின்னு சொல்வீங்களா? இல்ல. 'நீங்க முதல்ல போங்க' அப்படின்னு சொல்வீங்க. அதே நாகரிகம்தான் இலக்கணத்துலயும்.",
  tl:"Yen I kadaisila varudhu? Yosichup paarunga. Oru parisu vazhangaraanga. Neenga munnaadi poy 'naan, apparam neenga' appadinnu solveengalaa? Illa. 'Neenga mudhalla ponga' appadinnu solveenga. Adhe naagarigam-dhaan ilakkanaththulayum."},
 {ta:"இப்போ தலைகீழ் சூழல். ஒரு தப்பு நடந்திருக்கு. Class-ல ஜன்னல் உடைஞ்சிருக்கு. Teacher கேட்குறாரு — 'யாரு உடைச்சது?' இப்போ நீங்க என்ன சொல்வீங்க? 'நீங்களும், அவனும், நானும்' அப்படின்னா? இல்ல. நீங்க முன்னாடி வந்து 'நான், அப்பறம் இவங்க' அப்படின்னு சொல்வீங்க. அதுதான் ஒழுக்கம். அதனால தப்புன்னா 'I' முதல்ல.",
  tl:"Ippo thalaigeezh soozhal. Oru thappu nadandhirukku. Class-la jannal udainjirukku. Teacher ketkuraaru — 'yaaru udaichadhu?' Ippo neenga enna solveenga? Neenga munnaadi vandhu 'naan, apparam ivanga' appadinnu solveenga. Adhuthaan ozhukkam."},
 {ta:"அப்போ ஒரு எளிய கேள்வி கேட்டுக்கோங்க: 'இந்த வாக்கியம் பரிசைப் பத்தியா, இல்ல பழியைப் பத்தியா?' பரிசுன்னா 231 — You, he and I. பழின்னா 123 — I, you and he. SSC உங்களுக்கு வாக்கியத்துலயே clue தரும் — 'guilty', 'to blame', 'mistake', 'responsible for the loss', 'punished'. இந்த வார்த்தை பார்த்தா உடனே 'I' முதல்ல போடுங்க.",
  tl:"Appo oru eliya kelvi kettukkonga: 'indha vaakkiyam parisaip paththiyaa, illa pazhiyaip paththiyaa?' Parisunnaa 231. Pazhinnaa 123. SSC ungalukku vaakkiyaththulaye clue tharum — 'guilty', 'to blame', 'mistake', 'punished'."},
 {ta:"கடைசியா ஒரு பொறி சொல்லுறேன், இது ரொம்ப பேரு தவறவிடுவாங்க. பெயர்கள் மூன்றாம் நபர். 'Ram', 'Sita', 'my brother', 'the teacher' — இதெல்லாம் third person. அதனால 'Ram and I' அப்படின்னா 3-1, சரியான நல்ல செய்தி வரிசை. ஆனா நிறைய பேரு 'I and Ram went to the market' அப்படின்னு எழுதிடுவாங்க. இது தப்பு. 'My friend and I', 'Ram and I', 'My sister and I' — இப்படித்தான் வரணும்.",
  tl:"Kadaisiyaa oru pori solluren, idhu romba peru thavaraviduvaanga. Peyargal moondraam nabar. 'Ram', 'Sita', 'my brother', 'the teacher' — idhellaam third person. Adhanaala 'Ram and I' appadinnaa 3-1, sariyaana nalla seydhi varisai. 'My friend and I', 'Ram and I' — ippadidhaan varanum."}]},

/* ========== RULE 22 ========== */
{n:22,rc:"PRO-02",d:"Hard",t:"Case after THAN and AS",
 tam:"'than' / 'as' பின் மறைந்த வினைச்சொல் இருந்தால் subjective case",
 s1:{en:"After 'than' or 'as' in a comparison, use the SUBJECTIVE case (I, he, she, they) if a verb is understood after the pronoun. The full sentence would be 'He is taller than I AM' — so the pronoun is a SUBJECT.",
  ta:"ஒப்பீட்டில் 'than' அல்லது 'as'-க்குப் பின், பிரதிபெயருக்குப் பின் ஒரு வினைச்சொல் மறைந்திருந்தால் subjective case (I, he, she, they) பயன்படுத்த வேண்டும். முழு வாக்கியம் 'He is taller than I AM' — எனவே அந்தப் பிரதிபெயர் ஒரு Subject.",
  tl:"Oppeettil 'than' alladhu 'as'-kkup pin, pirathibeyarukkup pin oru vinaichol maraindhirundhaal subjective case (I, he, she, they) payanpaduththa vendum. Muzhu vaakkiyam 'He is taller than I AM' — enave andhap pirathibeyar oru Subject.",
  formula:"THAN / AS  +  SUBJECTIVE CASE  (hidden verb)\n\n  He is taller than I (am).        ✔\n  She works as hard as he (does).  ✔\n  No one is wiser than she (is).   ✔\n\n  TEST: add the hidden verb.\n  If it fits → use I / he / she / we / they."},

 s2:[
 {h:"The sentence is incomplete on purpose",
  en:"'He is taller than I' is a shortened form of 'He is taller than I AM'. English drops the second verb to avoid repetition, but the pronoun keeps its subject role. Put the verb back and the answer becomes obvious.",
  ta:"வாக்கியம் வேண்டுமென்றே முழுமையற்றது. 'He is taller than I' என்பது 'He is taller than I AM' என்பதன் சுருக்கமான வடிவம். மீண்டும் மீண்டும் சொல்வதைத் தவிர்க்க ஆங்கிலம் இரண்டாவது வினைச்சொல்லைக் கைவிடுகிறது, ஆனால் பிரதிபெயர் தன் Subject பாத்திரத்தைத் தக்கவைத்துக் கொள்கிறது. வினைச்சொல்லைத் திரும்ப வையுங்கள், பதில் தெளிவாகிவிடும்.",
  tl:"Vaakkiyam vendumendre muzhumaiyatradhu. 'He is taller than I' enbadhu 'He is taller than I AM' enbadhan surukkamaana vadivam. Vinaicholaith thirumba vaiyungal, padhil thelivaagividum."},
 {h:"Sometimes the objective case IS correct",
  en:"'I like him more than her' can mean two things. 'More than SHE (does)' means she also likes him. 'More than HER' means I like him more than I like her. Both are correct English — the case changes the meaning.",
  ta:"சில நேரங்களில் objective case சரியாகவே இருக்கும். 'I like him more than her' இரண்டு பொருள் தரலாம். 'More than SHE (does)' என்றால் அவளும் அவனை விரும்புகிறாள். 'More than HER' என்றால் நான் அவளை விரும்புவதை விட அவனை அதிகம் விரும்புகிறேன். இரண்டுமே சரியான ஆங்கிலம் — case பொருளை மாற்றுகிறது.",
  tl:"Sila nerangalil objective case sariyaagave irukkum. 'More than SHE (does)' endraal avalum avanai virumbugiraal. 'More than HER' endraal naan avalai virumbuvadhai vida avanai adhigam virumbugiren."},
 {h:"Spoken English versus exam English",
  en:"In everyday speech people say 'taller than me' and no one objects. But SSC, Banking and CDS answer keys follow the formal rule and expect 'taller than I'. Know the exam standard, not the street standard.",
  ta:"பேச்சு ஆங்கிலம் மற்றும் தேர்வு ஆங்கிலம். அன்றாடப் பேச்சில் மக்கள் 'taller than me' என்று சொல்கிறார்கள், யாரும் ஆட்சேபிப்பதில்லை. ஆனால் SSC, Banking, CDS விடைத்தாள்கள் முறையான விதியைப் பின்பற்றி 'taller than I' எதிர்பார்க்கின்றன. தெருவின் தரம் அல்ல, தேர்வின் தரம் தெரிந்திருக்க வேண்டும்.",
  tl:"Pechu Aangilam matrum thervu Aangilam. Andraadap pechil makkal 'taller than me' endru solgiraargal. Aanaal SSC, Banking, CDS vidaiththaalgal muraiyaana vidhiyaip pinpatri 'taller than I' edhirpaarkkindrana."},
 {h:"AS ... AS works the same way",
  en:"'She works as hard as he (does)', 'He is as tall as I (am)', 'They are as clever as we (are)'. The second 'as' behaves exactly like 'than' — a verb is understood after the pronoun.",
  ta:"AS ... AS-ம் அதேபோலவே செயல்படுகிறது. 'She works as hard as he (does)', 'He is as tall as I (am)', 'They are as clever as we (are)'. இரண்டாவது 'as' சரியாக 'than' போலவே செயல்படுகிறது — பிரதிபெயருக்குப் பின் ஒரு வினைச்சொல் மறைந்திருக்கிறது.",
  tl:"AS ... AS-um adhepolave seyalpadugiradhu. 'She works as hard as he (does)', 'He is as tall as I (am)'. Irandaavadhu 'as' sariyaaga 'than' polave seyalpadugiradhu."}],

 s3:[
 {h:"Put the hidden verb back",
  d:"   He is taller than I ____.\n                        ↓ add the hidden verb\n   He is taller than I  AM.        ✔ works\n\n   He is taller than ME am.        ✘ nonsense\n\n   If the hidden verb fits after the pronoun,\n   use the SUBJECTIVE case."},
 {h:"The case changes the meaning",
  d:"  I like him more than SHE.\n     → more than SHE likes him\n     (she is also a liker)\n\n  I like him more than HER.\n     → more than I like HER\n     (she is the one being liked)\n\n  Both correct. Different meanings."},
 {h:"Subjective versus objective",
  d:"  SUBJECTIVE (use after than/as)   OBJECTIVE\n  ─────────────────────────────    ─────────\n     I                                me\n     he                               him\n     she                              her\n     we                               us\n     they                             them\n     you                              you"}],

 s4:{
 wrong:["\"'Taller than me' is what everybody says.\" — Correct in speech, marked wrong in exams.",
  "\"'Than' is a preposition, so it takes the objective case.\" — Here 'than' is a conjunction joining two clauses.",
  "\"There is no verb after the pronoun, so it cannot be a subject.\" — The verb is understood, not absent.",
  "\"'Than her' is always wrong.\" — It is correct when 'her' is genuinely the object."],
 right:["Mentally add the hidden verb: am, is, does, did, can.",
  "If the verb fits → subjective case: I, he, she, we, they.",
  "Ask what the sentence MEANS before choosing.",
  "Follow the formal rule in exams, not spoken habit."]},

 s5:[
 {en:"He is taller than I am.",ta:"அவன் என்னைவிட உயரமானவன்.",tl:"Avan ennaivida uyaramaanavan.",note:"The full form shows 'I' is a subject."},
 {en:"She works as hard as he does.",ta:"அவள் அவனைப் போலவே கடினமாக உழைக்கிறாள்.",tl:"Aval avanaip polave kadinamaaga uzhaikkiraal.",note:"'He does' is understood → subjective case."},
 {en:"No one is wiser than she.",ta:"அவளைவிட ஞானமுள்ளவர் யாரும் இல்லை.",tl:"Avalaivida gnaanamullavar yaarum illai.",note:"'Than she is' is understood."},
 {en:"I like him more than she.",ta:"அவள் அவனை விரும்புவதைவிட நான் அதிகம் விரும்புகிறேன்.",tl:"Aval avanai virumbuvadhaivida naan adhigam virumbugiren.",note:"'Than she does' — she is also a liker."},
 {en:"I like him more than her.",ta:"நான் அவளை விரும்புவதைவிட அவனை அதிகம் விரும்புகிறேன்.",tl:"Naan avalai virumbuvadhaivida avanai adhigam virumbugiren.",note:"'Than I like her' — she is the object."}],

 s7:[
 "He is taller than ____.|I|Easy|'Than I am' is understood.",
 "She is cleverer than ____.|he|Easy|'Than he is' is understood.",
 "My brother is smarter than ____.|I|Easy|'Than I am' is understood.",
 "She sings as sweetly as ____.|he|Medium|'As he does' is understood.",
 "No one works harder than ____.|she|Medium|'Than she does' is understood.",
 "They are as rich as ____.|we|Medium|'As we are' is understood.",
 "He earns more than ____.|I|Medium|'Than I earn' is understood.",
 "You are as tall as ____.|I|Hard|'As I am' is understood.",
 "I like him more than ____ likes him.|she|Hard|'She' is the subject of the second clause.",
 "I like him more than ____, whom I hardly know.|her|Hard|Here 'her' is genuinely the object.",
 "Nobody is more punctual than ____.|he|Hard|'Than he is' is understood.",
 "She can run faster than ____ can.|I|Expert|The verb 'can' is stated.",
 "He is not so intelligent as ____.|she|Expert|'As she is' is understood.",
 "We work as sincerely as ____.|they|Expert|'As they do' is understood.",
 "My sister is younger than ____.|I|Expert|'Than I am' is understood."],

 s8:[
 "He is taller than me.|He is taller than I.|The hidden verb 'am' makes it a subject.",
 "She is cleverer than him.|She is cleverer than he.|The hidden verb 'is' makes it a subject.",
 "My brother is smarter than me.|My brother is smarter than I.|Formal English requires the subjective case.",
 "She sings as sweetly as him.|She sings as sweetly as he.|'As he does' is understood.",
 "No one works harder than her.|No one works harder than she.|'Than she does' is understood.",
 "They are as rich as us.|They are as rich as we.|'As we are' is understood.",
 "He earns more than me.|He earns more than I.|'Than I earn' is understood.",
 "You are as tall as me.|You are as tall as I.|'As I am' is understood.",
 "Nobody is more punctual than him.|Nobody is more punctual than he.|'Than he is' is understood.",
 "My sister is younger than me.|My sister is younger than I.|Formal English requires the subjective case."],

 s9:[
 "Fill in the Blank|My elder brother is far more hardworking than ____ has ever been.|me;I|1|The stated verb 'has been' proves it is a subject.",
 "Find the Error|She works as hard (A) as him (B) but earns (C) much less than he does (D).|A;B;C;D|1|Part B. 'As he does' is understood → 'as he'.",
 "Sentence Improvement|Nobody in this office is more punctual than him in reporting for duty.|than him;than he;than his|1|'Than he is' is understood.",
 "Fill in the Blank|They are not so experienced as ____ in handling this kind of situation.|us;we|1|'As we are' is understood.",
 "Find the Error|My sister is (A) two years younger (B) than me (C) but much taller (D).|A;B;C;D|2|Part C. It must be 'than I'."],

 s10:{
  en:"This rule fights against everyday speech. Every Indian speaker says 'taller than me', so the wrong option feels completely natural and the right one feels stiff. The exam relies on that discomfort. The deeper trap is the meaning switch: 'I like him more than she' and 'I like him more than her' are BOTH correct but mean different things, and the paper sometimes asks which one fits the context.",
  ta:"இந்த விதி அன்றாடப் பேச்சுக்கு எதிராகப் போராடுகிறது. ஒவ்வொரு இந்தியப் பேச்சாளரும் 'taller than me' என்று சொல்கிறார், எனவே தவறான option முற்றிலும் இயற்கையாகவும் சரியானது இறுக்கமாகவும் தோன்றுகிறது. தேர்வு அந்த அசௌகரியத்தை நம்பியிருக்கிறது. ஆழமான பொறி பொருள் மாற்றம்: 'I like him more than she' மற்றும் 'I like him more than her' இரண்டுமே சரி ஆனால் வெவ்வேறு பொருள் தரும்.",
  tl:"Indha vidhi andraadap pechukku edhiraagap poraadugiradhu. Ovvoru Indhiyap pechaalarum 'taller than me' endru solgiraar, enave thavaraana option mutrilum iyarkaiyaagath thondrugiradhu. Aazhamaana pori porul maatram."},

 s11:{
  en:"ADD THE HIDDEN VERB. If 'am', 'is' or 'does' fits after the pronoun, use I, he, she, we or they.",
  ta:"மறைந்த வினைச்சொல்லைச் சேருங்கள். பிரதிபெயருக்குப் பின் 'am', 'is' அல்லது 'does' பொருந்தினால், I, he, she, we அல்லது they பயன்படுத்துங்கள்.",
  tl:"Maraindha vinaicholaich serungal. Pirathibeyarukkup pin 'am', 'is' alladhu 'does' porundhinaal, I, he, she, we alladhu they payanpaduththungal.",
  vis:"      THE HIDDEN-VERB TEST\n\n   He is taller than ____ .\n\n   Try:  \"than I AM\"    ✔ makes sense  →  use  I\n         \"than ME am\"   ✘ nonsense\n\n   THE VERBS THAT HIDE:\n   am · is · are · was · were\n   do · does · did · can · has · have\n\n   AFTER THAN / AS USE:\n   ┌────────────────────────────┐\n   │  I · he · she · we · they   │\n   └────────────────────────────┘\n   NOT: me · him · her · us · them\n\n   ⚠ MEANING CHECK:\n     more than SHE  →  she also does it\n     more than HER  →  she is the object"},

 s13:[
 "My brother is taller than ____, though ____ and he ____ the same age.|I-he-are;me-I-am;I-I-are|0|Hidden verb → I. Good-news order 3-1 → 'he and I'. Plural subject → ARE.",
 "She works as hard as ____, but ____ pains taken by her ____ greater than mine.|he-the-are;him-a-is;he-the-is|0|'As he does' → HE. Specific effort → THE. 'Pains' means effort and is plural → ARE.",
 "Nobody is more punctual than ____, and each of the clerks ____ agreed with ____.|he-has-me;him-have-I;he-have-me|0|Hidden verb → HE. 'Each of' is fixed singular → HAS. After 'with' use the objective case → ME.",
 "They are not so experienced as ____ in handling ____ MLA's complaints.|we-an;us-a;we-a|0|'As we are' → WE. 'MLA' = 'em' → AN.",
 "You are taller than ____, but ____ scissors on the shelf ____ beyond your reach.|I-the-are;me-a-is;I-a-are|0|Hidden verb → I. Specific scissors → THE. 'Scissors' always plural → ARE."],

 s14:{
  rule:"After 'than' or 'as', use the subjective case when a verb is understood after the pronoun.",
  formula:"THAN / AS + I / he / she / we / they  (hidden verb)\nAdd the verb mentally to test it",
  memory:"Add the hidden verb. 'Than I AM' works, 'than ME am' does not.",
  ta:"மறைந்த verb-ஐ சேர்த்துப் பாருங்க. 'Than I AM' சரி, 'than ME am' தப்பு.",
  tl:"Maraindha verb-ai serthup paarunga. 'Than I AM' sari, 'than ME am' thappu.",
  mistake:"Writing 'taller than me' because that is how everyone speaks.",
  exam:"SSC CGL / CHSL, CDS and Bank — a steady Error Spotting question."},

 s15:[
 {ta:"இந்த rule நமக்கு ரொம்ப சங்கடமா இருக்கும். ஏன்? ஏன்னா நாம எல்லாருமே 'He is taller than me' அப்படித்தான் பேசுறோம். திரைப்படத்துலயும் அப்படித்தான். ஆனா தேர்வுல 'than I' தான் சரி.",
  tl:"Indha rule namakku romba sangadamaa irukkum. Yennaa naama ellaarume 'He is taller than me' appadidhaan pesurom. Thiraippadaththulayum appadidhaan. Aanaa thervula 'than I' dhaan sari."},
 {ta:"ஏன்? ஒரு ரகசியம் சொல்லுறேன். அந்த வாக்கியம் உண்மையில முழுசா இல்ல. முழு வாக்கியம் என்னன்னா — 'He is taller than I AM.' ஆங்கிலம் மறுபடி 'am' சொல்ல விரும்பாம அதை விட்டுடுது. ஆனா 'I' அங்க Subject-ஆவே இருக்கு.",
  tl:"Yen? Oru ragasiyam solluren. Andha vaakkiyam unmaiyila muzhusaa illa. Muzhu vaakkiyam ennannaa — 'He is taller than I AM.' Aangilam marubadi 'am' solla virumbaama adhai vittududhu. Aanaa 'I' anga Subject-aave irukku."},
 {ta:"அதனால ஒரு எளிய சோதனை இருக்கு — 'மறைந்த வினைச்சொல் சோதனை'. அந்த மறைஞ்ச verb-ஐ மனசுல சேர்த்துப் பாருங்க. 'He is taller than I AM' — சரியா இருக்கு. இப்போ 'He is taller than ME am' — சரியா இருக்கா? இல்ல, அபத்தமா இருக்கு. அதனால 'I'-தான் சரி.",
  tl:"Adhanaala oru eliya sodhanai irukku — 'maraindha vinaichol sodhanai'. Andha marainja verb-ai manasula serthup paarunga. 'He is taller than I AM' — sariyaa irukku. Ippo 'He is taller than ME am' — sariyaa irukkaa? Illa, abaththamaa irukku."},
 {ta:"மறைஞ்ச verb-கள் என்னென்ன? am, is, are, was, were, do, does, did, can, has, have. 'She works as hard as he DOES.' 'They are as rich as we ARE.' 'He earns more than I DO.' இதுல ஏதாவது ஒண்ணு பொருந்தினா, subjective case போடுங்க.",
  tl:"Marainja verb-kal ennenna? am, is, are, was, were, do, does, did, can, has, have. 'She works as hard as he DOES.' 'They are as rich as we ARE.' Idhula edhaavadhu onnu porundhinaa, subjective case podunga."},
 {ta:"இப்போ ஒரு ரொம்ப சுவாரஸ்யமான விஷயம் சொல்லுறேன். சில நேரம் 'her' கூட சரியா இருக்கும்! 'I like him more than SHE' — அர்த்தம்: அவளும் அவனை விரும்புறா, ஆனா நான் அதிகம் விரும்புறேன். 'I like him more than HER' — அர்த்தம்: நான் அவளை விரும்புறதைவிட அவனை அதிகம் விரும்புறேன். ரெண்டுமே சரியான ஆங்கிலம், ஆனா அர்த்தம் வேற!",
  tl:"Ippo oru romba suvaarasyamaana vishayam solluren. Sila neram 'her' kooda sariyaa irukkum! 'I like him more than SHE' — arththam: avalum avanai virumbura. 'I like him more than HER' — arththam: naan avalai virumburadhaivida avanai adhigam virumburen. Rendume sariyaana Aangilam, aanaa arththam veru!"},
 {ta:"அதனால கடைசி ஆலோசனை — முதல்ல அர்த்தத்தை புரிஞ்சுக்கோங்க, அப்பறம் case-ஐ தேர்ந்தெடுங்க. பெரும்பாலான கேள்விகள்ல subjective case-தான் சரியா இருக்கும் (than I, than he, than she). ஆனா அர்த்தம் தெளிவா object-ஐ காட்டினா, objective case-ம் சரி. தேர்வுல 90% கேள்விகள்ல 'than I / than he' தான் பதில்.",
  tl:"Adhanaala kadaisi aalosanai — mudhalla arththaththai purinjukkonga, apparam case-ai therndhedunga. Perumbaalaana kelvigalla subjective case-dhaan sariyaa irukkum. Thervula 90% kelvigalla 'than I / than he' dhaan padhil."}]},

/* ========== RULE 23 ========== */
{n:23,rc:"PRO-03",d:"Easy",t:"Objective Case after a PREPOSITION",
 tam:"முன்னுருபுக்குப் பின் objective case — Between you and ME",
 s1:{en:"A pronoun that follows a PREPOSITION must be in the OBJECTIVE case: me, him, her, us, them. Prepositions govern objects, and objects require the objective form.",
  ta:"ஒரு முன்னுருபுக்குப் பின் வரும் பிரதிபெயர் objective case-ல் இருக்க வேண்டும்: me, him, her, us, them. முன்னுருபுகள் objects-ஐ ஆளுகின்றன, objects-க்கு objective வடிவம் தேவை.",
  tl:"Oru munnurubukkup pin varum pirathibeyar objective case-l irukka vendum: me, him, her, us, them. Munnurubugal objects-ai aalugindrana, objects-kku objective vadivam thevai.",
  formula:"PREPOSITION  +  OBJECTIVE CASE\n\n  between you and ME      ✔  (not 'and I')\n  for her and ME          ✔\n  among THEM              ✔\n  to him and ME           ✔\n  with US                 ✔\n\n  COMMON PREPOSITIONS:\n  to · for · with · from · by · of · at\n  in · on · between · among · without · besides"},

 s2:[
 {h:"'Between you and I' is the classic hypercorrection",
  en:"Students are taught so often that 'and I' is polite that they start using it everywhere — even after a preposition, where it is wrong. 'Between you and I' is the single most famous grammatical error in English. It must be 'between you and me'.",
  ta:"'Between you and I' என்பது புகழ்பெற்ற மிகைத்திருத்தம். 'And I' நாகரிகமானது என்று மாணவர்களுக்கு அடிக்கடி சொல்லிக் கொடுக்கப்படுவதால், அவர்கள் அதை எல்லா இடத்திலும் பயன்படுத்தத் தொடங்குகிறார்கள் — முன்னுருபுக்குப் பின்னும் கூட, அங்கே அது தவறு. 'Between you and I' என்பது ஆங்கிலத்தின் மிகப் புகழ்பெற்ற இலக்கணத் தவறு. அது 'between you and me' என்றுதான் இருக்க வேண்டும்.",
  tl:"'Between you and I' enbadhu pugazhpetra migaiththiruththam. 'And I' naagarigamaanadhu endru maanavargalukku adikkadi sollik kodukkappaduvadhaal, avargal adhai ellaa idaththilum payanpaduththath thodangugiraargal. Adhu 'between you and me' endrudhaan irukka vendum."},
 {h:"The one-pronoun test",
  en:"Delete the other person and read the sentence again. 'This gift is for her and I' → delete 'her and' → 'This gift is for I' — obviously wrong. So it must be 'for her and me'. This test never fails.",
  ta:"ஒரு-பிரதிபெயர் சோதனை. மற்றவரை நீக்கிவிட்டு வாக்கியத்தை மீண்டும் படியுங்கள். 'This gift is for her and I' → 'her and' நீக்குங்கள் → 'This gift is for I' — வெளிப்படையாகத் தவறு. எனவே 'for her and me' என்றுதான் இருக்க வேண்டும். இந்தச் சோதனை ஒருபோதும் தோற்பதில்லை.",
  tl:"Oru-pirathibeyar sodhanai. Matravarai neekkividdu vaakkiyaththai meendum padiyungal. 'This gift is for her and I' → 'This gift is for I' — velippadaiyaagath thavaru. Enave 'for her and me' endrudhaan irukka vendum."},
 {h:"Order still applies inside the phrase",
  en:"'Between you and me' is 2-1 order, which is correct. 'For him and me' is 3-1, also correct. Rule 21 still governs the ORDER while Rule 23 governs the CASE. Both must be right at once.",
  ta:"தொடருக்குள் வரிசையும் பொருந்தும். 'Between you and me' என்பது 2-1 வரிசை, அது சரி. 'For him and me' என்பது 3-1, அதுவும் சரி. Rule 21 வரிசையை ஆளுகிறது, Rule 23 case-ஐ ஆளுகிறது. இரண்டும் ஒரே நேரத்தில் சரியாக இருக்க வேண்டும்.",
  tl:"Thodarukkul varisaiyum porundhum. 'Between you and me' enbadhu 2-1 varisai, adhu sari. 'For him and me' enbadhu 3-1, adhuvum sari. Rule 21 varisaiyai aalugiradhu, Rule 23 case-ai aalugiradhu."},
 {h:"Verbs also take the objective case",
  en:"Not just prepositions. Any verb that takes an object needs the objective case: 'She invited him and me', 'The teacher praised us', 'They saw her and me at the station'.",
  ta:"வினைச்சொற்களும் objective case எடுக்கும். முன்னுருபுகள் மட்டும் அல்ல. Object எடுக்கும் எந்த வினைச்சொல்லுக்கும் objective case தேவை: 'She invited him and me', 'The teacher praised us', 'They saw her and me at the station'.",
  tl:"Vinaichorkalum objective case edukkum. Munnurubugal mattum alla. Object edukkum endha vinaicholukkum objective case thevai: 'She invited him and me', 'The teacher praised us'."}],

 s3:[
 {h:"The delete test",
  d:"   This gift is for her and ____ .\n\n   Step 1: delete 'her and'\n   This gift is for ____ .\n\n   Step 2: try both\n   \"for I\"   ✘ obviously wrong\n   \"for me\"  ✔ obviously right\n\n   Answer: for her and ME"},
 {h:"Two rules at once",
  d:"   between  YOU  and  ME\n              ↑        ↑\n         Rule 21    Rule 23\n         (order)    (case)\n\n   2 comes before 1  →  order correct ✔\n   preposition → objective  →  case correct ✔\n\n   BOTH must be right in the same phrase."},
 {h:"The preposition family",
  d:"   to · for · with · from · by · of\n   at · in · on · into · onto · upon\n   between · among · without · besides\n   about · above · under · over · through\n\n   ALL of these are followed by:\n   me · him · her · us · them"}],

 s4:{
 wrong:["\"'Between you and I' sounds educated and polite.\" — It is the most famous error in English.",
  "\"'And I' is always more correct than 'and me'.\" — Only when it is the subject.",
  "\"After a preposition either case is acceptable.\" — Only the objective case is correct.",
  "\"This applies only to 'between'.\" — It applies after every preposition and every verb object."],
 right:["Delete the other person and read the sentence again.",
  "'For I' sounds wrong, so it must be 'for me'.",
  "After to, for, with, between, among → me, him, her, us, them.",
  "Check the order too: 'you and me', not 'me and you'."]},

 s5:[
 {en:"Between you and me, this is a secret.",ta:"உனக்கும் எனக்கும் இடையே, இது ஒரு ரகசியம்.",tl:"Unakkum enakkum idaiye, idhu oru ragasiyam.",note:"'Between' is a preposition → objective case ME."},
 {en:"This gift is for her and me.",ta:"இந்தப் பரிசு அவளுக்கும் எனக்கும் உரியது.",tl:"Indhap parisu avalukkum enakkum uriyadhu.",note:"'For' is a preposition → objective case ME."},
 {en:"Divide the sweets among them.",ta:"இனிப்புகளை அவர்களுக்கு இடையே பிரித்துக் கொடுங்கள்.",tl:"Inippugalai avargalukku idaiye piriththuk kodungal.",note:"'Among' is a preposition → THEM."},
 {en:"The teacher praised him and me.",ta:"ஆசிரியர் அவனையும் என்னையும் பாராட்டினார்.",tl:"Aasiriyar avanaiyum ennaiyum paaraattinaar.",note:"The verb 'praised' takes an object → ME."},
 {en:"There is no quarrel between you and me.",ta:"உனக்கும் எனக்கும் இடையே எந்தச் சண்டையும் இல்லை.",tl:"Unakkum enakkum idaiye endhach sandaiyum illai.",note:"After 'between' always use ME."}],

 s8:[
 "Between you and I, this is a secret.|Between you and me, this is a secret.|'Between' is a preposition.",
 "This gift is for she and I.|This gift is for her and me.|'For' requires the objective case.",
 "Divide the sweets among they.|Divide the sweets among them.|'Among' requires the objective case.",
 "He came with we to the station.|He came with us to the station.|'With' requires the objective case.",
 "The teacher praised he and I.|The teacher praised him and me.|The verb takes objects.",
 "There is no quarrel between you and I.|There is no quarrel between you and me.|'Between' is a preposition.",
 "She sent a letter to he and I.|She sent a letter to him and me.|'To' requires the objective case.",
 "Nobody except I knew the answer.|Nobody except me knew the answer.|'Except' behaves as a preposition.",
 "They invited my brother and I.|They invited my brother and me.|The verb takes an object.",
 "It was kind of you and I to help.|It was kind of you and me to help.|'Of' requires the objective case."],

 s9:[
 "Fill in the Blank|The entire matter was settled quietly between him and ____ last evening.|I;me|1|'Between' is a preposition.",
 "Find the Error|Between you and I (A), this project (B) will never be completed (C) on time (D).|A;B;C;D|0|Part A. It must be 'Between you and me'.",
 "Sentence Improvement|The principal congratulated my friend and I on winning the debate.|my friend and I;my friend and me;I and my friend|1|The verb takes an object → objective case.",
 "Fill in the Blank|The prize money was equally divided among ____ four after the tournament.|we;us|1|'Among' is a preposition.",
 "Find the Error|It was very kind (A) of you and I (B) to visit him (C) in the hospital (D).|A;B;C;D|1|Part B. 'Of' is a preposition → 'of you and me'."],

 s10:{
  en:"This error happens because students OVER-apply Rule 21. They learn that 'and I' is polite, then use it everywhere — including after prepositions where it is flatly wrong. 'Between you and I' is planted in almost every SSC paper because it sounds more educated than the correct form. The cure is the delete test: remove the other person and the wrongness becomes obvious.",
  ta:"மாணவர்கள் Rule 21-ஐ அளவுக்கு அதிகமாகப் பயன்படுத்துவதால் இந்தத் தவறு நிகழ்கிறது. 'And I' நாகரிகமானது என்று கற்றுக்கொண்டு, பிறகு அதை எல்லா இடத்திலும் பயன்படுத்துகிறார்கள் — முன்னுருபுகளுக்குப் பின்னும் கூட, அங்கே அது முற்றிலும் தவறு. 'Between you and I' கிட்டத்தட்ட ஒவ்வொரு SSC தேர்வுத்தாளிலும் நடப்படுகிறது, ஏனெனில் அது சரியான வடிவத்தைவிட அதிகம் படித்தவர் போலத் தோன்றுகிறது. மருந்து நீக்கல் சோதனை.",
  tl:"Maanavargal Rule 21-ai alavukku adhigamaagap payanpaduththuvadhaal indhath thavaru nigazhgiradhu. 'Between you and I' kittaththatta ovvoru SSC thervuththaalilum nadappadugiradhu, yenenil adhu sariyaana vadivaththaivida adhigam padiththavar polath thondrugiradhu."},

 s11:{
  en:"DELETE THE OTHER PERSON. 'For I' is wrong, so it must be 'for me'.",
  ta:"மற்றவரை நீக்குங்கள். 'For I' தவறு, எனவே அது 'for me' என்றுதான் இருக்க வேண்டும்.",
  tl:"Matravarai neekkungal. 'For I' thavaru, enave adhu 'for me' endrudhaan irukka vendum.",
  vis:"       THE DELETE TEST\n\n   \"This gift is for her and ____ .\"\n\n   ✂️  Delete 'her and'\n\n   \"This gift is for ____ .\"\n\n        for I   ✘  →  nobody says this\n        for me  ✔  →  obviously right\n\n   ANSWER:  for her and ME\n\n   ⚠ THE FAMOUS ERROR:\n     Between you and I   ✘\n     Between you and me  ✔\n\n   This one line appears in almost every SSC paper."},

 s13:[
 "Between you and ____, ____ and I ____ the only ones who know ____ truth.|me-he-are-the;I-he-are-a;me-I-am-the|0|Preposition → ME. Good-news order 3-1 → 'he and I'. Plural → ARE. Specific truth → THE.",
 "____ gift was given to my sister and ____ by ____ MLA who visited ____ school.|The-me-an-the;A-I-a-a;The-me-a-the|0|Specific gift → THE. Preposition → ME. 'MLA' = 'em' → AN. Visiting the building → THE school.",
 "Nobody except ____ knew that ____ news ____ already been announced.|me-the-had;I-a-has;me-a-had|0|'Except' is a preposition → ME. 'News' takes THE and is singular → HAD BEEN.",
 "It was kind of you and ____ to take ____ pains to help ____ poor.|me-the-the;I-a-a;me-a-the|0|Preposition → ME. Effort → 'the pains'. 'The poor' as a class → THE.",
 "The prize was divided among ____ three, though he is taller than ____.|us-I;we-me;us-me|0|'Among' is a preposition → US. Hidden verb after 'than' → I."],

 s14:{
  rule:"A pronoun following a preposition or a verb object must be in the objective case.",
  formula:"PREPOSITION / VERB OBJECT + me / him / her / us / them\nNEVER: between you and I",
  memory:"Delete the other person. 'For I' is wrong, so use 'for me'.",
  ta:"மற்றவரை நீக்கிப் பாருங்க. 'For I' தப்பு, அதனால 'for me'.",
  tl:"Matravarai neekkip paarunga. 'For I' thappu, adhanaala 'for me'.",
  mistake:"Writing 'between you and I' by over-applying the politeness rule.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — one of the most repeated pronoun errors."},

 s15:[
 {ta:"இந்த rule ரொம்ப எளிமையானது, ஆனா அதுவேதான் ஆபத்து. 'Between you and I' அப்படின்னு நிறைய படிச்சவங்க கூட சொல்லுவாங்க. TV-ல, செய்திதாள்ல கூட வரும். ஆனா இது தப்பு.",
  tl:"Indha rule romba elimaiyaanadhu, aanaa adhuvedhaan aabaththu. 'Between you and I' appadinnu neraiya padichavanga kooda solluvaanga. TV-la, seydhithaalla kooda varum. Aanaa idhu thappu."},
 {ta:"ஏன் இந்த தப்பு நடக்குது? Rule 21-ல நாம கத்துக்கிட்டோம் — 'I-ஐ கடைசில போடு, அது நாகரிகம்'. அந்த பாடம் நம்ம மனசுல ஆழமா பதிஞ்சுடுச்சு. அதனால எல்லா இடத்துலயும் 'and I' போட்டுடுவோம். இதை ஆங்கிலத்துல 'hypercorrection' அப்படின்னு சொல்லுவாங்க — அதிகமா சரி பண்ண போய் தப்பு பண்றது.",
  tl:"Yen indha thappu nadakkudhu? Rule 21-la naama kaththukkittom — 'I-ai kadaisila podu, adhu naagarigam'. Andha paadam namma manasula aazhamaa padhinjuduchu. Adhanaala ellaa idaththulayum 'and I' poduduvom. Idhai Aangilaththula 'hypercorrection' appadinnu solluvaanga."},
 {ta:"ஆனா விதி என்னன்னா — முன்னுருபுக்கு (preposition) அப்பறம் எப்பவும் objective case. 'Between', 'for', 'to', 'with', 'from', 'among', 'of' — இதெல்லாம் preposition. இவற்றுக்கு அப்பறம் me, him, her, us, them.",
  tl:"Aanaa vidhi ennannaa — munnurubukku (preposition) apparam eppavum objective case. 'Between', 'for', 'to', 'with', 'from', 'among', 'of' — idhellaam preposition. Ivatrukku apparam me, him, her, us, them."},
 {ta:"இப்போ ஒரு அருமையான trick சொல்லுறேன் — 'நீக்கல் சோதனை'. 'This gift is for her and I' — இதுல 'her and' அப்படிங்கிறத நீக்கிடுங்க. என்ன மிச்சம்? 'This gift is for I.' இது சரியா இருக்கா? கண்டிப்பா இல்ல! யாருமே இப்படி சொல்ல மாட்டாங்க. அதனால 'for me' தான் சரி. முழு வாக்கியம்: 'This gift is for her and me.'",
  tl:"Ippo oru arumaiyaana trick solluren — 'neekkal sodhanai'. 'This gift is for her and I' — idhula 'her and' appadingiradha neekkidunga. Enna micham? 'This gift is for I.' Idhu sariyaa irukkaa? Kandippaa illa! Adhanaala 'for me' dhaan sari."},
 {ta:"இந்த சோதனை ஒருபோதும் தோக்காது. 'Between you and I' → 'you and' நீக்கு → 'Between I' — தப்பு. அதனால 'between me' → முழுசா 'between you and me'. 'The teacher praised he and I' → 'he and' நீக்கு → 'The teacher praised I' — தப்பு. அதனால 'praised him and me'.",
  tl:"Indha sodhanai orupodhum thokkaadhu. 'Between you and I' → 'Between I' — thappu. Adhanaala 'between you and me'. 'The teacher praised he and I' → 'The teacher praised I' — thappu. Adhanaala 'praised him and me'."},
 {ta:"கடைசியா ஒரு விஷயம் — இங்க ரெண்டு rule ஒரே நேரத்துல வேலை செய்யுது. 'Between you and me' — 'you' முதல்ல வருது (அது Rule 21, வரிசை), மேலும் 'me' objective case-ல இருக்கு (அது Rule 23, case). ரெண்டுமே சரியா இருக்கணும். SSC சில நேரம் வரிசையை மாத்தி கேட்கும், சில நேரம் case-ஐ மாத்தி கேட்கும். ரெண்டையும் கவனிங்க.",
  tl:"Kadaisiyaa oru vishayam — inga rendu rule ore neraththula velai seyyudhu. 'Between you and me' — 'you' mudhalla varudhu (Rule 21, varisai), melum 'me' objective case-la irukku (Rule 23, case). Rendume sariyaa irukkanum."}]},

/* ========== RULE 24 ========== */
{n:24,rc:"PRO-04",d:"Hard",t:"Verbs that REQUIRE a Reflexive Pronoun",
 tam:"Absent, Avail, Enjoy, Apply — இவற்றுக்குப் பின் reflexive pronoun கட்டாயம்",
 s1:{en:"Certain verbs MUST be followed by a reflexive pronoun (myself, yourself, himself, herself, ourselves, themselves): absent, avail, enjoy, apply, adapt, adjust, resign, acquit, pride, avenge, overreach, exert, reconcile and behave.",
  ta:"சில வினைச்சொற்களுக்குப் பின் reflexive pronoun (myself, yourself, himself, herself, ourselves, themselves) கண்டிப்பாக வர வேண்டும்: absent, avail, enjoy, apply, adapt, adjust, resign, acquit, pride, avenge, overreach, exert, reconcile, behave.",
  tl:"Sila vinaichorkalukkup pin reflexive pronoun (myself, yourself, himself, herself, ourselves, themselves) kandippaaga vara vendum: absent, avail, enjoy, apply, adapt, adjust, resign, acquit, pride, avenge, exert, behave.",
  formula:"VERB  +  REFLEXIVE PRONOUN (compulsory)\n\n  He absented HIMSELF from class.      ✔\n  Avail YOURSELF of this offer.        ✔\n  They enjoyed THEMSELVES at the party.✔\n  She applied HERSELF to the task.     ✔\n  He resigned HIMSELF to his fate.     ✔"},

 s2:[
 {h:"The action turns back on the doer",
  en:"A reflexive pronoun is used when the subject and the object are the SAME person. 'He absented himself' — he is the one doing the absenting AND the one being absented. These verbs describe actions you perform on yourself.",
  ta:"செயல் செய்பவரையே திரும்பிப் பாதிக்கிறது. Subject-உம் Object-உம் ஒரே நபராக இருக்கும்போது reflexive pronoun பயன்படுத்தப்படுகிறது. 'He absented himself' — அவர்தான் விலகச் செய்பவர், அவர்தான் விலகுபவரும். இந்த வினைச்சொற்கள் உங்கள் மீதே நீங்கள் செய்யும் செயல்களை விவரிக்கின்றன.",
  tl:"Seyal seybavaraiye thirumbip paadhikkiradhu. Subject-um Object-um ore nabaraaga irukkumbodhu reflexive pronoun payanpaduththappadugiradhu. 'He absented himself' — avardhaan vilagach seybavar, avardhaan vilagubavarum."},
 {h:"Verbs that must NOT take a reflexive pronoun",
  en:"Keep, hide, stop, turn, rest, qualify, spread, gather, move, bathe and feel do NOT take a reflexive pronoun. 'Keep quiet' not 'keep yourself quiet'. 'He hid behind the tree' not 'he hid himself behind the tree'.",
  ta:"Reflexive pronoun எடுக்கக் கூடாத வினைச்சொற்கள்: keep, hide, stop, turn, rest, qualify, spread, gather, move, bathe, feel. 'Keep quiet' — 'keep yourself quiet' அல்ல. 'He hid behind the tree' — 'he hid himself behind the tree' அல்ல.",
  tl:"Reflexive pronoun edukkak koodaadha vinaichorkal: keep, hide, stop, turn, rest, qualify, spread, gather, move, bathe, feel. 'Keep quiet' — 'keep yourself quiet' alla."},
 {h:"ENJOY takes it only without another object",
  en:"'They enjoyed themselves' (no other object) but 'They enjoyed the film' (film is the object). When another object is present, no reflexive pronoun is needed. Same for 'apply': 'apply yourself to the work' but 'apply the rule'.",
  ta:"ENJOY-க்கு வேறு object இல்லாதபோது மட்டுமே reflexive வரும். 'They enjoyed themselves' (வேறு object இல்லை) ஆனால் 'They enjoyed the film' (film-தான் object). வேறு object இருக்கும்போது reflexive pronoun தேவையில்லை. 'Apply'-க்கும் அதேதான்: 'apply yourself to the work' ஆனால் 'apply the rule'.",
  tl:"ENJOY-kku veru object illaadhabodhu mattume reflexive varum. 'They enjoyed themselves' aanaal 'They enjoyed the film'. Veru object irukkumbodhu reflexive pronoun thevaiyillai."},
 {h:"Emphatic use is different",
  en:"'I myself saw it' and 'The Prime Minister himself came' use the same words but for EMPHASIS, not reflection. Here the pronoun can be removed and the sentence still stands. In the reflexive use it cannot be removed.",
  ta:"வலியுறுத்தும் பயன்பாடு வேறு. 'I myself saw it' மற்றும் 'The Prime Minister himself came' — இவை அதே சொற்களை வலியுறுத்தலுக்காகப் பயன்படுத்துகின்றன, திரும்புதலுக்காக அல்ல. இங்கே அந்தப் பிரதிபெயரை நீக்கிவிட்டாலும் வாக்கியம் நிற்கும். Reflexive பயன்பாட்டில் அதை நீக்க முடியாது.",
  tl:"Valiyuruththum payanpaadu veru. 'I myself saw it' matrum 'The Prime Minister himself came' — ivai valiyuruththalukkaaga payanpaduththugindrana. Inge andhap pirathibeyarai neekkividdaalum vaakkiyam nirkum."}],

 s3:[
 {h:"The action loops back",
  d:"   He absented  ────────►  HIMSELF\n    ↑                          │\n    └──────────────────────────┘\n     doer and receiver are the SAME person\n\n   That loop is what a reflexive pronoun shows."},
 {h:"The compulsory list",
  d:"   ✔ MUST take a reflexive pronoun:\n     absent · avail · enjoy · apply\n     adapt · adjust · resign · acquit\n     pride · avenge · exert · behave\n\n   ✘ MUST NOT take one:\n     keep · hide · stop · turn · rest\n     qualify · spread · gather · move · bathe"},
 {h:"Reflexive versus emphatic",
  d:"  REFLEXIVE (cannot remove it)\n    He absented HIMSELF from class.\n    Remove it → \"He absented from class\" ✘\n\n  EMPHATIC (can remove it)\n    I MYSELF saw the accident.\n    Remove it → \"I saw the accident\"  ✔ still fine"}],

 s4:{
 wrong:["\"'He absented from class' sounds complete.\" — 'Absent' as a verb needs a reflexive pronoun.",
  "\"'Avail of this offer' is what advertisements say.\" — It must be 'avail yourself of this offer'.",
  "\"All verbs can take a reflexive pronoun.\" — Keep, hide and stop must not.",
  "\"'Keep yourself quiet' is more polite.\" — 'Keep quiet' is the correct form."],
 right:["Memorise the compulsory list: absent, avail, enjoy, apply, adapt, adjust, resign, acquit, pride.",
  "Memorise the forbidden list: keep, hide, stop, turn, rest, qualify.",
  "For 'enjoy' and 'apply', check whether another object is present.",
  "Test whether the pronoun can be removed — if yes, it is emphatic, not reflexive."]},

 s5:[
 {en:"He absented himself from the class yesterday.",ta:"அவர் நேற்று வகுப்பிலிருந்து விலகியிருந்தார்.",tl:"Avar netru vagupilirundhu vilagiyirundhaar.",note:"'Absent' as a verb requires HIMSELF."},
 {en:"Avail yourself of this golden opportunity.",ta:"இந்த அரிய வாய்ப்பை நீங்கள் பயன்படுத்திக் கொள்ளுங்கள்.",tl:"Indha ariya vaayppai neengal payanpaduththik kollungal.",note:"'Avail' requires YOURSELF."},
 {en:"The children enjoyed themselves at the fair.",ta:"குழந்தைகள் திருவிழாவில் மகிழ்ச்சியாகப் பொழுதைக் கழித்தார்கள்.",tl:"Kuzhandhaigal thiruvizhaavil magizhchiyaagap pozhudhaik kazhiththaargal.",note:"No other object → THEMSELVES is required."},
 {en:"They enjoyed the film very much.",ta:"அவர்கள் அந்தத் திரைப்படத்தை மிகவும் ரசித்தார்கள்.",tl:"Avargal andhath thiraippadaththai migavum rasiththaargal.",note:"'The film' is the object → no reflexive pronoun."},
 {en:"Please keep quiet during the examination.",ta:"தேர்வின் போது தயவுசெய்து அமைதியாக இருங்கள்.",tl:"Thervin podhu thayavuseydhu amaidhiyaaga irungal.",note:"'Keep' must NOT take a reflexive pronoun."}],

 "She applied to her studies seriously.|She applied herself to her studies seriously.|'Apply' requires a reflexive pronoun.",
 "He resigned to his fate quietly.|He resigned himself to his fate quietly.|'Resign' requires a reflexive pronoun.",
 "They adapted to the new climate quickly.|They adapted themselves to the new climate quickly.|'Adapt' requires a reflexive pronoun.",
 "Please keep yourself quiet in the hall.|Please keep quiet in the hall.|'Keep' must not take a reflexive pronoun.",
 "The thief hid himself behind the tree.|The thief hid behind the tree.|'Hide' must not take a reflexive pronoun.",
 "They enjoyed themselves the film very much.|They enjoyed the film very much.|'The film' is already the object.",

 s9:[
 "Fill in the Blank|You must avail ____ of this rare opportunity before the last date.|—;yourself|1|'Avail' requires a reflexive pronoun.",
 "Find the Error|He absented (A) from the meeting (B) without informing (C) his superior officer (D).|A;B;C;D|0|Part A. It must be 'He absented himself'.",
 "Sentence Improvement|The students enjoyed very much at the annual cultural festival yesterday.|enjoyed very much;enjoyed themselves very much;enjoyed them very much|1|Without another object, 'enjoy' needs a reflexive pronoun.",
 "Fill in the Blank|Please keep ____ quiet while the examination is going on in this hall.|yourself;no word needed|1|'Keep' must not take a reflexive pronoun.",
 "Find the Error|She applied (A) to her studies (B) with great sincerity (C) after the warning (D).|A;B;C;D|0|Part A. It must be 'She applied herself'."],

 s10:{
  en:"Indian advertisements say 'Avail of this offer' everywhere, so the wrong form is burned into memory. Similarly 'They enjoyed at the party' feels complete. The reverse trap is equally common: 'Keep yourself quiet' sounds more polite but is wrong. You need BOTH lists — the verbs that demand a reflexive pronoun and the verbs that forbid it.",
  ta:"இந்திய விளம்பரங்கள் எல்லா இடத்திலும் 'Avail of this offer' என்று சொல்கின்றன, எனவே தவறான வடிவம் நினைவில் பதிந்துவிட்டது. அதேபோல 'They enjoyed at the party' முழுமையாகத் தோன்றுகிறது. தலைகீழ் பொறியும் அதே அளவு பொதுவானது: 'Keep yourself quiet' அதிக நாகரிகமாகக் கேட்கிறது ஆனால் தவறு. உங்களுக்கு இரண்டு பட்டியல்களும் தேவை — reflexive pronoun கோரும் வினைச்சொற்கள் மற்றும் அதைத் தடுக்கும் வினைச்சொற்கள்.",
  tl:"Indhiya vilambarangal ellaa idaththilum 'Avail of this offer' endru solgindrana, enave thavaraana vadivam ninaivil padhindhuvittadhu. Thalaigeezh poriyum adhe alavu podhuvaanadhu: 'Keep yourself quiet' adhiga naagarigamaagak ketkiradhu aanaal thavaru."},

 s11:{

  tl:"AAEAARAP — Absent, Avail, Enjoy, Apply, Adapt, Resign, Acquit, Pride. Ellaaththukkum SELF venum.",
  vis:"     THE TWO LISTS — LEARN BOTH\n\n  ✔ MUST TAKE 'SELF'   ✘ MUST NOT TAKE 'SELF'\n  ──────────────────   ──────────────────────\n    Absent               Keep\n    Avail                Hide\n    Enjoy                Stop\n    Apply                Turn\n    Adapt / Adjust       Rest\n    Resign               Qualify\n    Acquit               Spread\n    Pride                Gather\n    Avenge / Exert       Move / Bathe\n\n  MEMORY WORD:  A-A-E-A-A-R-A-P\n\n  ⚠ WATCH FOR ANOTHER OBJECT:\n    enjoyed THEMSELVES  (no object) ✔\n    enjoyed THE FILM    (object)    ✔ no reflexive"},

 s13:[
 "He absented ____ from ____ school because he was in ____ hospital with ____ fever.|himself-—-—-a;—-the-the-a;himself-the-—-a|0|'Absent' needs HIMSELF. Student's school → no article. Patient → 'in hospital'. 'Fever' → A.",
 "Avail ____ of ____ offer, but keep ____ quiet about it between you and ____.|yourself-the-—-me;—-a-yourself-I;yourself-the-yourself-me|0|'Avail' needs YOURSELF. Specific offer → THE. 'Keep' takes no reflexive. Preposition → ME.",
 "They enjoyed ____ at ____ party, though neither of them ____ danced.|themselves-the-has;—-a-have;themselves-the-have|0|'Enjoy' with no object → THEMSELVES. Specific party → THE. 'Neither of' is fixed singular → HAS.",
 "She applied ____ to ____ work and took great ____ to finish it before ____ hour was over.|herself-the-pains-an;—-a-pain-a;herself-a-pains-an|0|'Apply' needs HERSELF. Specific work → THE. Effort → PAINS. 'Hour' silent H → AN.",
 "He prides ____ on his manners, but his manners ____ worse than ____.|himself-are-mine;—-is-mine;himself-are-me|0|'Pride' needs HIMSELF. 'Manners' plural → ARE. Comparison with possession → MINE."],

 s14:{
  rule:"Absent, avail, enjoy, apply, adapt, resign, acquit and pride must be followed by a reflexive pronoun. Keep, hide, stop and rest must not.",
  formula:"MUST: absent / avail / enjoy / apply / adapt / resign / acquit / pride + SELF\nMUST NOT: keep / hide / stop / turn / rest / qualify",
  memory:"AAEAARAP — Absent, Avail, Enjoy, Apply, Adapt, Resign, Acquit, Pride.",
  ta:"AAEAARAP — இந்த எட்டுக்கும் SELF வேணும். Keep, Hide, Stop-க்கு SELF வேணாம்.",
  tl:"AAEAARAP — indha ettukkum SELF venum. Keep, Hide, Stop-kku SELF venaam.",
  mistake:"Writing 'avail of this offer' and 'enjoyed at the party', or adding a reflexive to 'keep quiet'.",
  exam:"SSC CGL / CHSL and Bank — 'avail yourself of' is one of the most repeated corrections."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு பட்டியல் இருக்கு, ரெண்டையும் தெரிஞ்சுக்கணும். ஒரு பட்டியல்ல இருக்கிற வினைச்சொல்லுக்கு கண்டிப்பா 'self' வேணும். இன்னொரு பட்டியல்ல இருக்கிறதுக்கு கண்டிப்பா 'self' வரக்கூடாது.",
  tl:"Indha rule-la rendu pattiyal irukku, rendaiyum therinjukkanum. Oru pattiyalla irukkira vinaicholukku kandippaa 'self' venum. Innoru pattiyalla irukkiradhukku kandippaa 'self' varakkoodaadhu."},
 {ta:"முதல்ல ஏன் இப்படி அப்படின்னு புரிஞ்சுக்கலாம். 'He absented himself from class' — யாரு விலகினாரு? அவரு. யாரை விலக வெச்சாரு? அவரையே. செய்பவரும் அவரு, பெறுபவரும் அவரு. அதனால 'himself'. செயல் திரும்பி அவரையே பாதிக்குது.",
  tl:"Mudhalla yen ippadi appadinnu purinjukkalaam. 'He absented himself from class' — yaaru vilaginaaru? Avaru. Yaarai vilaga vechaaru? Avaraiye. Seybavarum avaru, perubavarum avaru. Adhanaala 'himself'."},
 {ta:"இப்போ இந்தியால நமக்கு ஒரு பெரிய பிரச்சனை இருக்கு. கடைகள்ல, விளம்பரங்கள்ல 'Avail of this offer' அப்படின்னு எழுதி இருக்கும். நாம தினமும் பார்க்குறோம். அதனால நமக்கு அது சரி மாதிரி தோணும். ஆனா தப்பு. சரியான வடிவம்: 'Avail yourself of this offer.'",
  tl:"Ippo India-la namakku oru periya prachanai irukku. Kadaigalla, vilambarangalla 'Avail of this offer' appadinnu ezhudhi irukkum. Naama dhinamum paarkkurom. Adhanaala namakku adhu sari maadhiri thonum. Aanaa thappu. Sariyaana vadivam: 'Avail yourself of this offer.'"},
 {ta:"பட்டியலை மனப்பாடம் பண்ண ஒரு சொல் தாறேன் — AAEAARAP. Absent, Avail, Enjoy, Apply, Adapt, Resign, Acquit, Pride. இந்த எட்டுக்கும் 'self' கண்டிப்பா வரணும். இதோட Avenge, Exert, Adjust, Behave-ம் சேர்த்துக்கோங்க.",
  tl:"Pattiyalai manappaadam panna oru sol thaaren — AAEAARAP. Absent, Avail, Enjoy, Apply, Adapt, Resign, Acquit, Pride. Indha ettukkum 'self' kandippaa varanum."},
 {ta:"இப்போ மறுபக்கம். சில வினைச்சொல்லுக்கு 'self' வரவே கூடாது. Keep, Hide, Stop, Turn, Rest, Qualify, Move, Bathe. 'Keep quiet' அப்படித்தான் சொல்லணும், 'keep yourself quiet' இல்ல. 'He hid behind the tree' — 'hid himself' இல்ல. இது கொஞ்சம் விசித்திரமா தோணும், ஆனா இதுதான் விதி.",
  tl:"Ippo marupakkam. Sila vinaicholukku 'self' varave koodaadhu. Keep, Hide, Stop, Turn, Rest, Qualify. 'Keep quiet' appadidhaan sollanum, 'keep yourself quiet' illa. 'He hid behind the tree' — 'hid himself' illa."},
 {ta:"கடைசியா ஒரு நுட்பமான விஷயம் — 'Enjoy' மற்றும் 'Apply'. இதுக்கு வேற object இருந்தா 'self' வேணாம். 'They enjoyed THEMSELVES' (வேற object இல்ல) ஆனா 'They enjoyed THE FILM' (film-தான் object, அதனால self வேணாம்). அதே மாதிரி 'apply yourself to the work' ஆனா 'apply the rule'. வாக்கியத்துல வேற object இருக்கானு பாருங்க. இருந்தா self வேணாம்.",
  tl:"Kadaisiyaa oru nutpamaana vishayam — 'Enjoy' matrum 'Apply'. Idhukku veru object irundhaa 'self' venaam. 'They enjoyed THEMSELVES' aanaa 'They enjoyed THE FILM'. Vaakkiyaththula veru object irukkaanu paarunga. Irundhaa self venaam."}]},

/* ========== RULE 25 ========== */
{n:25,rc:"PRO-05",d:"Medium",t:"LET, LIKE, BUT and EXCEPT take the Objective Case",
 tam:"Let, Like, But, Except — இவற்றுக்குப் பின் objective case",
 s1:{en:"Pronouns following LET, LIKE, BUT (meaning 'except') and EXCEPT must be in the OBJECTIVE case: me, him, her, us, them. These words function as verbs or prepositions that govern objects.",
  ta:"LET, LIKE, BUT ('except' என்ற பொருளில்), EXCEPT ஆகியவற்றுக்குப் பின் வரும் பிரதிபெயர்கள் objective case-ல் இருக்க வேண்டும்: me, him, her, us, them. இந்தச் சொற்கள் objects-ஐ ஆளும் வினைச்சொற்களாகவோ முன்னுருபுகளாகவோ செயல்படுகின்றன.",
  tl:"LET, LIKE, BUT ('except' endra porulil), EXCEPT aagiyavatrukkup pin varum pirathibeyargal objective case-l irukka vendum: me, him, her, us, them.",
  formula:"LET / LIKE / BUT / EXCEPT  +  OBJECTIVE CASE\n\n  Let HIM go now.              ✔  (not 'let he')\n  Nobody but ME knew it.       ✔  (not 'but I')\n  All except HER attended.     ✔  (not 'except she')\n  A man like HIM will succeed. ✔  (not 'like he')"},

 s2:[
 {h:"LET is a verb that takes an object",
  en:"'Let him go' is really 'permit him to go'. 'Him' is the object of 'let'. Because 'let' is a transitive verb, whatever follows it must be in the objective case, exactly like 'ask him' or 'tell her'.",
  ta:"LET ஒரு object எடுக்கும் வினைச்சொல். 'Let him go' என்பது உண்மையில் 'permit him to go'. 'Him' என்பது 'let'-ன் object. 'Let' ஒரு செயப்படுபொருள் வினைச்சொல் என்பதால், அதற்குப் பின் வருவது objective case-ல் இருக்க வேண்டும், சரியாக 'ask him' அல்லது 'tell her' போலவே.",
  tl:"LET oru object edukkum vinaichol. 'Let him go' enbadhu unmaiyil 'permit him to go'. 'Him' enbadhu 'let'-in object. 'Let' oru seyappaduporul vinaichol enbadhaal, adharkup pin varuvadhu objective case-l irukka vendum."},
 {h:"BUT meaning EXCEPT is a preposition",
  en:"'Nobody but me knew it' — here 'but' does not mean 'however', it means 'except'. In that meaning it is a PREPOSITION, so the objective case follows. This is the trap: 'but' looks like a conjunction.",
  ta:"'Except' என்ற பொருளில் BUT ஒரு முன்னுருபு. 'Nobody but me knew it' — இங்கே 'but' 'however' என்று பொருள்படவில்லை, 'except' என்று பொருள்படுகிறது. அந்தப் பொருளில் அது ஒரு முன்னுருபு, எனவே objective case பின்வருகிறது. இதுதான் பொறி: 'but' ஒரு இணைப்புச் சொல் போலத் தெரிகிறது.",
  tl:"'Except' endra porulil BUT oru munnurubu. 'Nobody but me knew it' — inge 'but' 'except' endru porulpadugiradhu. Andhap porulil adhu oru munnurubu, enave objective case pinvarugiradhu. Idhudhaan pori."},
 {h:"LET US versus LET'S",
  en:"'Let us go' and 'Let's go' are the same. But note that 'Let us go' can also mean 'permit us to go' — a request to someone else. The pronoun after 'let' is always objective: us, him, her, them.",
  ta:"LET US மற்றும் LET'S. 'Let us go' மற்றும் 'Let's go' ஒன்றுதான். ஆனால் 'Let us go' என்பது 'எங்களைப் போக அனுமதியுங்கள்' என்றும் பொருள்படலாம் — வேறு ஒருவரிடம் ஒரு வேண்டுகோள். 'Let'-க்குப் பின் வரும் பிரதிபெயர் எப்போதும் objective: us, him, her, them.",
  tl:"LET US matrum LET'S. 'Let us go' matrum 'Let's go' ondrudhaan. 'Let'-kkup pin varum pirathibeyar eppodhum objective: us, him, her, them."},
 {h:"LIKE is a preposition too",
  en:"'A man like him will succeed', 'She sings like her mother'. 'Like' meaning 'similar to' is a preposition and takes the objective case. Do not confuse it with the verb 'like' meaning 'to enjoy'.",
  ta:"LIKE-ம் ஒரு முன்னுருபுதான். 'A man like him will succeed', 'She sings like her mother'. 'ஒத்த' என்று பொருள்படும் 'like' ஒரு முன்னுருபு, objective case எடுக்கும். 'விரும்புதல்' என்று பொருள்படும் 'like' வினைச்சொல்லுடன் இதைக் குழப்பிக் கொள்ளாதீர்கள்.",
  tl:"LIKE-um oru munnurubudhaan. 'A man like him will succeed', 'She sings like her mother'. 'Oththa' endru porulpadum 'like' oru munnurubu, objective case edukkum."}],

 s3:[
 {h:"LET is a verb with an object",
  d:"   Let  HIM  go.\n    ↑     ↑\n   verb  object  →  objective case\n\n   Compare with other verbs:\n     ask HIM · tell HER · help THEM\n     let HIM · let HER · let US\n\n   Same pattern, same case."},
 {h:"BUT wears a disguise",
  d:"  BUT meaning 'however'  →  conjunction\n     He tried, BUT he failed.\n\n  BUT meaning 'except'   →  PREPOSITION\n     Nobody BUT me knew it.\n            ↑\n     objective case follows\n\n  Test: replace 'but' with 'except'.\n  If it fits → objective case."},
 {h:"The four words",
  d:"   LET     →  let him · let her · let them · let us\n   LIKE    →  like him · like her · like me\n   BUT     →  nobody but me · none but him\n   EXCEPT  →  all except her · everyone except us\n\n   MEMORY SENTENCE:\n   \"LET HIM, LIKE ME, BUT NOT HER, EXCEPT US.\""}],

 s4:{
 wrong:["\"'Let he go' — 'he' is the one going, so it is the subject.\" — 'He' is the object of 'let'.",
  "\"'But' is a conjunction, so the subjective case follows.\" — When it means 'except' it is a preposition.",
  "\"'Nobody but I knew the answer' sounds educated.\" — It must be 'but me'.",
  "\"'Like' is a verb, so it takes a subject after it.\" — Meaning 'similar to', it is a preposition."],
 right:["After LET, always use him, her, them, us, me.",
  "Replace 'but' with 'except'. If it fits, it is a preposition.",
  "After LIKE meaning 'similar to', use the objective case.",
  "Remember the sentence: Let him, like me, but not her, except us."]},

 s5:[
 {en:"Let him go home now.",ta:"அவனை இப்போது வீட்டுக்குப் போக விடுங்கள்.",tl:"Avanai ippodhu veettukkup poga vidungal.",note:"'Let' is a verb → objective case HIM."},
 {en:"Nobody but me knew the answer.",ta:"என்னைத் தவிர வேறு யாருக்கும் பதில் தெரியாது.",tl:"Ennaith thavira veru yaarukkum padhil theriyaadhu.",note:"'But' means 'except' → objective case ME."},
 {en:"All except her attended the meeting.",ta:"அவளைத் தவிர அனைவரும் கூட்டத்தில் கலந்து கொண்டனர்.",tl:"Avalaith thavira anaivarum koottaththil kalandhu kondanar.",note:"'Except' is a preposition → HER."},
 {en:"A man like him will surely succeed.",ta:"அவனைப் போன்ற ஒரு மனிதன் நிச்சயம் வெற்றி பெறுவான்.",tl:"Avanaip pondra oru manidhan nichchayam vetri peruvaan.",note:"'Like' means 'similar to' → HIM."},
 {en:"Let them complete the work themselves.",ta:"அவர்களே அந்த வேலையை முடிக்கட்டும்.",tl:"Avargale andha velaiyai mudikkattum.",note:"'Let' → objective case THEM."}],

 s8:[

 "A man like he will surely succeed.|A man like him will surely succeed.|'Like' takes the objective case.",
 "Let they finish the work themselves.|Let them finish the work themselves.|'Let' takes the objective case.",

 s9:[
 "Fill in the Blank|Everyone attended the seminar except ____ and his younger brother.|he;him|1|'Except' is a preposition.",
 "Find the Error|Let he (A) and his friend (B) complete the project (C) before Friday (D).|A;B;C;D|0|Part A. 'Let' takes the objective case → 'Let him'.",
 "Sentence Improvement|Nobody but I was aware of the sudden change in the timetable.|but I;but me;but myself|1|'But' meaning 'except' takes the objective case.",
 "Fill in the Blank|A hardworking student like ____ certainly deserves this scholarship.|she;her|1|'Like' is a preposition.",
 "Find the Error|All except we (A) were informed (B) about the postponement (C) of the exam (D).|A;B;C;D|0|Part A. 'Except' takes the objective case → 'All except us'."],

 s10:{
  en:"'But' is the real trap here. Students know 'but' as a conjunction joining two clauses, so when they see 'Nobody but ___ knew it' they choose the subjective case. But 'but' meaning 'except' is a PREPOSITION. The second trap is 'let': 'Let he go' feels right because 'he' is the one going, but 'he' is grammatically the object of 'let'.",
  ta:"'But'-தான் இங்கே உண்மையான பொறி. மாணவர்கள் 'but'-ஐ இரண்டு clause-களை இணைக்கும் ஒரு இணைப்புச் சொல்லாக அறிவார்கள், எனவே 'Nobody but ___ knew it' என்று பார்க்கும்போது subjective case-ஐத் தேர்ந்தெடுக்கிறார்கள். ஆனால் 'except' என்று பொருள்படும் 'but' ஒரு முன்னுருபு. இரண்டாவது பொறி 'let': 'Let he go' சரியெனத் தோன்றுகிறது, ஏனெனில் 'he'தான் போகிறவர், ஆனால் இலக்கண ரீதியாக 'he' என்பது 'let'-ன் object.",
  tl:"'But'-dhaan inge unmaiyaana pori. Maanavargal 'but'-ai oru inaippuch sollaaga arivaargal. Aanaal 'except' endru porulpadum 'but' oru munnurubu. Irandaavadhu pori 'let': 'Let he go' sariyenath thondrugiradhu, aanaal ilakkana reedhiyaaga 'he' enbadhu 'let'-in object."},

 s11:{
  en:"LET HIM, LIKE ME, BUT NOT HER, EXCEPT US. All four take the objective case.",
  ta:"LET HIM, LIKE ME, BUT NOT HER, EXCEPT US. நான்குமே objective case எடுக்கும்.",
  tl:"LET HIM, LIKE ME, BUT NOT HER, EXCEPT US. Naangume objective case edukkum.",
  vis:"     THE MEMORY SENTENCE\n\n   \"LET HIM, LIKE ME,\n    BUT NOT HER, EXCEPT US.\"\n\n   Every pronoun in that line is OBJECTIVE.\n   Say it once and all four rules are stored.\n\n   THE 'EXCEPT' TEST FOR 'BUT':\n   Nobody BUT me knew it.\n            ↓ replace with 'except'\n   Nobody EXCEPT me knew it.   ✔ fits\n   → so 'but' is a preposition → objective case\n\n   ⚠ 'LET' IS A VERB LIKE ANY OTHER:\n     ask HIM · tell HER · let THEM"},
