 s13:[
 "Let ____ and ____ settle this matter between ____ and him.|him-me-me;he-I-I;him-me-I|0|'Let' → objective for both. 'Between' → ME.",
 "Nobody but ____ knew that ____ news of ____ MLA's visit ____ false.|me-the-an-was;I-a-a-were;me-a-an-was|0|'But' → ME. 'News' takes THE and is singular → WAS. 'MLA' = 'em' → AN.",
 "All except ____ enjoyed ____ at ____ party held in ____ hotel.|her-themselves-the-a;she-—-a-an;her-themselves-a-the|0|'Except' → HER. 'Enjoy' with no object → THEMSELVES. Specific party → THE. 'Hotel' spoken H → A.",
 "A man like ____ prides ____ on ____ manners that are better than ____.|him-himself-the-mine;he-—-a-me;him-himself-a-mine|0|'Like' → HIM. 'Pride' needs HIMSELF. Specific manners → THE. Possession → MINE.",
 "Let ____ avail ____ of ____ opportunity before ____ hour is over.|us-ourselves-the-an;we-—-a-a;us-ourselves-a-an|0|'Let' → US. 'Avail' needs OURSELVES. Specific opportunity → THE. 'Hour' silent H → AN."],

 s14:{
  rule:"Pronouns after let, like, but (meaning except) and except must be in the objective case.",
  formula:"LET / LIKE / BUT / EXCEPT + me / him / her / us / them",
  memory:"Let him, like me, but not her, except us.",
  ta:"'Let him, like me, but not her, except us.' இந்த வரி ஞாபகம் வெச்சுக்கோங்க.",
  tl:"'Let him, like me, but not her, except us.' Indha vari gnaabagam vechukkonga.",
  mistake:"Writing 'Let he go' and 'Nobody but I knew it' because they look like subjects.",
  exam:"SSC CGL / CHSL and Bank — 'let him' and 'nobody but me' are steady Error Spotting items."},

 s15:[
 {ta:"இந்த rule Rule 23-ஓட தொடர்ச்சி. அங்க preposition-க்கு அப்பறம் objective case அப்படின்னு பார்த்தோம். இங்க நாலு வித்தியாசமான வார்த்தை பார்க்கப் போறோம் — Let, Like, But, Except. இதெல்லாம் preposition மாதிரி தெரியாது, ஆனா அதே மாதிரிதான் வேலை செய்யும்.",
  tl:"Indha rule Rule 23-oda thodarchi. Anga preposition-kku apparam objective case appadinnu paarththom. Inga naalu viththiyaasamaana vaarththai paarkkap porom — Let, Like, But, Except."},
 {ta:"முதல்ல 'Let'. 'Let him go' — இங்க 'him' ஏன்? 'He' இல்ல? ஏன்னா 'let' ஒரு வினைச்சொல், அதுக்கு object வேணும். யோசிச்சுப் பாருங்க — 'ask him', 'tell her', 'help them' அப்படின்னு சொல்லுவோம் இல்லையா? அதே மாதிரி 'let him'. 'Let' மத்த verb மாதிரிதான்.",
  tl:"Mudhalla 'Let'. 'Let him go' — inga 'him' yen? 'He' illa? Yennaa 'let' oru vinaichol, adharku object venum. Yosichup paarunga — 'ask him', 'tell her', 'help them' appadinnu solluvom illaiyaa? Adhe maadhiri 'let him'."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒண்ணு — 'But'. நமக்கு 'but' அப்படின்னா 'ஆனா' அப்படிங்கிற அர்த்தம்தான் தெரியும். 'He tried but he failed.' அங்க 'but' ஒரு conjunction. ஆனா இன்னொரு 'but' இருக்கு — 'தவிர' அப்படிங்கிற அர்த்தத்துல. 'Nobody but me knew it' = 'என்னைத் தவிர யாருக்கும் தெரியாது'.",
  tl:"Ippo romba mukkiyamaana onnu — 'But'. Namakku 'but' appadinnaa 'aanaa' appadingira arththam-dhaan theriyum. Aanaa innoru 'but' irukku — 'thavira' appadingira arththaththula. 'Nobody but me knew it' = 'ennaith thavira yaarukkum theriyaadhu'."},
 {ta:"அந்த ரெண்டாவது 'but' ஒரு preposition. அதனால அதுக்கு அப்பறம் objective case — 'me', 'him', 'her'. ஒரு சோதனை சொல்லுறேன்: 'but'-ஐ 'except' அப்படின்னு மாத்திப் பாருங்க. 'Nobody except me knew it' — பொருந்துதா? பொருந்துனா அது preposition, objective case போடுங்க.",
  tl:"Andha randaavadhu 'but' oru preposition. Adhanaala adhukku apparam objective case — 'me', 'him', 'her'. Oru sodhanai solluren: 'but'-ai 'except' appadinnu maaththip paarunga. Porundhunaa adhu preposition, objective case podunga."},
 {ta:"'Like'-ம் அப்படித்தான். 'A man like him will succeed' — இங்க 'like' அப்படின்னா 'விரும்புதல்' இல்ல, 'ஒத்த' அப்படிங்கிற அர்த்தம். அது preposition. அதனால 'him'. 'She sings like her mother' — 'like her mother', 'like she mother' இல்ல.",
  tl:"'Like'-um appadidhaan. 'A man like him will succeed' — inga 'like' appadinnaa 'oththa' appadingira arththam. Adhu preposition. Adhanaala 'him'."},
 {ta:"கடைசியா ஒரு வாக்கியம் தாறேன், இதை மனப்பாடம் பண்ணுங்க: 'LET HIM, LIKE ME, BUT NOT HER, EXCEPT US.' இந்த ஒரு வரியில நாலு வார்த்தையும் இருக்கு, நாலு objective pronoun-ம் இருக்கு. இதை ஒரு தடவ மனப்பாடம் பண்ணிட்டா, தேர்வுல இந்த நாலு வார்த்தையை பார்த்தவுடனே objective case-ன்னு நினைவு வரும்.",
  tl:"Kadaisiyaa oru vaakkiyam thaaren, idhai manappaadam pannunga: 'LET HIM, LIKE ME, BUT NOT HER, EXCEPT US.' Indha oru variyila naalu vaarththaiyum irukku, naalu objective pronoun-um irukku."}]},
/* ========== RULE 26 ========== */
{n:26,rc:"PRO-06",d:"Easy",t:"EACH OTHER for Two, ONE ANOTHER for More than Two",
 tam:"இருவருக்கு 'each other', இரண்டுக்கு மேற்பட்டோருக்கு 'one another'",
 s1:{en:"Use EACH OTHER when only TWO persons or things are involved, and ONE ANOTHER when MORE THAN TWO are involved. English keeps a formal distinction between a pair and a group.",
  ta:"இரண்டு நபர்கள் அல்லது பொருட்கள் மட்டும் சம்பந்தப்பட்டிருக்கும்போது EACH OTHER-ஐயும், இரண்டுக்கு மேற்பட்டவை சம்பந்தப்பட்டிருக்கும்போது ONE ANOTHER-ஐயும் பயன்படுத்தவும். ஆங்கிலம் ஒரு ஜோடிக்கும் ஒரு குழுவுக்கும் இடையே ஒரு முறையான வேறுபாட்டைப் பேணுகிறது.",
  tl:"Irandu nabargal alladhu porutkal mattum sambandhappattirukkumbodhu EACH OTHER-aiyum, irandukku merpattavai sambandhappattirukkumbodhu ONE ANOTHER-aiyum payanpaduththavum.",
  formula:"TWO  →  EACH OTHER\n  The two brothers love EACH OTHER.\n  Ram and Shyam blamed EACH OTHER.\n\nMORE THAN TWO  →  ONE ANOTHER\n  All the students helped ONE ANOTHER.\n  The team members supported ONE ANOTHER."},

 s2:[
 {h:"The number is hidden earlier in the sentence",
  en:"You will rarely be told 'there are two people'. Instead the sentence says 'the two brothers', 'both the sisters', 'Ram and Shyam' — these all mean two. Or it says 'all the students', 'the team', 'the villagers' — these mean more than two. Read backwards to find the number.",
  ta:"எண்ணிக்கை வாக்கியத்தில் முன்னதாகவே மறைந்திருக்கும். 'இரண்டு பேர் இருக்கிறார்கள்' என்று உங்களுக்கு அரிதாகவே சொல்லப்படும். மாறாக வாக்கியம் 'the two brothers', 'both the sisters', 'Ram and Shyam' என்று சொல்கிறது — இவை அனைத்தும் இரண்டைக் குறிக்கின்றன. அல்லது 'all the students', 'the team', 'the villagers' — இவை இரண்டுக்கு மேற்பட்டவை. எண்ணிக்கையைக் கண்டறிய பின்னோக்கிப் படியுங்கள்.",
  tl:"Ennikkai vaakkiyaththil munnadhaagave maraindhirukkum. Vaakkiyam 'the two brothers', 'both the sisters', 'Ram and Shyam' endru solgiradhu — ivai anaiththum irandaik kurikkindrana. Alladhu 'all the students', 'the team' — ivai irandukku merpattavai."},
 {h:"Both are reciprocal pronouns",
  en:"'Each other' and 'one another' are called RECIPROCAL pronouns because the action goes both ways. 'They love each other' means A loves B and B loves A. The action bounces back and forth.",
  ta:"இரண்டுமே பரஸ்பரப் பிரதிபெயர்கள். 'Each other' மற்றும் 'one another' பரஸ்பரப் பிரதிபெயர்கள் எனப்படுகின்றன, ஏனெனில் செயல் இரு வழிகளிலும் செல்கிறது. 'They love each other' என்றால் A, B-ஐ நேசிக்கிறார், B, A-ஐ நேசிக்கிறார். செயல் முன்னும் பின்னும் தாவுகிறது.",
  tl:"Irandume parasparap pirathibeyargal. 'Each other' matrum 'one another' parasparap pirathibeyargal enappadugindrana, yenenil seyal iru vazhigalilum selgiradhu."},
 {h:"The possessive forms",
  en:"'They shook each other's hands', 'The students corrected one another's papers'. The apostrophe-s goes at the END of the whole phrase, and the noun after it is usually plural.",
  ta:"உடைமை வடிவங்கள். 'They shook each other's hands', 'The students corrected one another's papers'. Apostrophe-s முழுத் தொடரின் இறுதியில் வருகிறது, அதற்குப் பின் வரும் பெயர்ச்சொல் பொதுவாகப் பன்மையாக இருக்கும்.",
  tl:"Udaimai vadivangal. 'They shook each other's hands', 'The students corrected one another's papers'. Apostrophe-s muzhuth thodarin irudhiyil varugiradhu."},
 {h:"Modern usage is relaxing, but exams are not",
  en:"In modern spoken English many writers use the two interchangeably. But SSC, Banking and CDS answer keys still enforce the strict two-versus-more-than-two rule. Follow the exam standard.",
  ta:"நவீன பயன்பாடு தளர்வடைந்து வருகிறது, ஆனால் தேர்வுகள் அல்ல. நவீன பேச்சு ஆங்கிலத்தில் பல எழுத்தாளர்கள் இரண்டையும் மாற்றி மாற்றிப் பயன்படுத்துகிறார்கள். ஆனால் SSC, Banking, CDS விடைத்தாள்கள் இன்னும் கடுமையான இரண்டு-மற்றும்-இரண்டுக்கு-மேல் விதியை அமல்படுத்துகின்றன. தேர்வுத் தரத்தைப் பின்பற்றுங்கள்.",
  tl:"Naveena payanpaadu thalarvadaindhu varugiradhu, aanaal thervugal alla. Aanaal SSC, Banking, CDS vidaiththaalgal innum kadumaiyaana irandu-matrum-irandukku-mel vidhiyai amalpaduththugindrana."}],

 s3:[
 {h:"Two versus many",
  d:"   👤 ↔ 👤        →  EACH OTHER\n   two people, one relationship\n\n   👤 ↔ 👤 ↔ 👤 ↔ 👤  →  ONE ANOTHER\n   many people, many relationships\n\n   The two brothers love EACH OTHER.\n   All the students helped ONE ANOTHER."},
 {h:"Where the number hides",
  d:"  SIGNALS FOR 'TWO'        SIGNALS FOR 'MANY'\n  ─────────────────        ──────────────────\n   the two ...              all the ...\n   both ...                 the team\n   Ram and Shyam            the members\n   the pair                 the villagers\n   husband and wife         the crowd\n   the twins                the students\n\n  Read the sentence BACKWARDS to find the number."},
 {h:"The possessive form",
  d:"   They shook EACH OTHER'S hands.\n                          ↑\n              apostrophe at the END\n\n   The students corrected ONE ANOTHER'S papers.\n\n   ⚠ Not 'each's other hands'\n     Not 'one's another papers'"}],

 s4:{
 wrong:["\"'One another' sounds more formal, so it is always safer.\" — With exactly two it is wrong.",
  "\"Modern English allows either form.\" — Not in SSC answer keys.",
  "\"'Ram and Shyam helped one another' is fine.\" — Only two people → 'each other'.",
  "\"'The team helped each other' is correct.\" — A team has many members → 'one another'."],
 right:["Read backwards and count the people.",
  "Two → each other. More than two → one another.",
  "Look for signals: 'the two', 'both', two names → each other.",
  "Look for 'all', 'the team', 'the members' → one another."]},

 s5:[
 {en:"The two brothers love each other deeply.",ta:"அந்த இரு சகோதரர்களும் ஒருவரையொருவர் ஆழமாக நேசிக்கிறார்கள்.",tl:"Andha iru sagodharargalum oruvaraiyoruvar aazhamaaga nesikkiraargal.",note:"'The two' → only two people → EACH OTHER."},
 {en:"All the students helped one another during the exam preparation.",ta:"தேர்வுத் தயாரிப்பின்போது அனைத்து மாணவர்களும் ஒருவருக்கொருவர் உதவினர்.",tl:"Thervuth thayaarippinbodhu anaiththu maanavargalum oruvarukkoruvar udhavinar.",note:"'All the students' → many → ONE ANOTHER."},
 {en:"Ram and Shyam blamed each other for the mistake.",ta:"ராமும் ஷ்யாமும் அந்தத் தவறுக்கு ஒருவரையொருவர் குற்றம் சாட்டினர்.",tl:"Raamum Shyaamum andhath thavarukku oruvaraiyoruvar kutram saattinar.",note:"Two names → only two → EACH OTHER."},
 {en:"The team members supported one another throughout.",ta:"அணி உறுப்பினர்கள் முழுவதும் ஒருவருக்கொருவர் ஆதரவளித்தனர்.",tl:"Ani uruppinargal muzhuvadhum oruvarukkoruvar aadharavaliththanar.",note:"A team has many members → ONE ANOTHER."},
 {en:"They shook each other's hands warmly.",ta:"அவர்கள் ஒருவரோடொருவர் அன்புடன் கை குலுக்கிக் கொண்டனர்.",tl:"Avargal oruvarodoruvar anbudan kai kulukkik kondanar.",note:"Possessive form with the apostrophe at the end."}],

 s6:["each other|ஒருவரையொருவர் (இருவர்)|Oruvaraiyoruvar (iruvar)",

  "the team members|அணி உறுப்பினர்கள்|Ani uruppinargal",

 s7:[
 "The two sisters quarrelled with ____.|each other|Easy|Only two people.",
 "All the members helped ____.|one another|Easy|Many people.",
 "Ram and Ravi blamed ____.|each other|Easy|Two names → two people.",
 "The team supported ____ well.|one another|Medium|A team has many members.",
 "Both the boys hate ____.|each other|Medium|'Both' means two.",
 "The villagers helped ____ in the flood.|one another|Medium|Many people.",
 "Husband and wife trust ____.|each other|Medium|Exactly two people.",
 "The five friends wrote to ____.|one another|Hard|Five people.",
 "They shook ____ hands warmly.|each other's|Hard|Possessive with two people.",
 "The students corrected ____ papers.|one another's|Hard|Many students, possessive form.",
 "The twins resemble ____ closely.|each other|Hard|Twins means two.",
 "All the nations should respect ____.|one another|Expert|Many nations.",
 "The two countries signed a treaty with ____.|each other|Expert|Only two countries.",
 "The committee members disagreed with ____.|one another|Expert|Many members.",
 "The pair of shoes matched ____ perfectly.|each other|Expert|A pair means two."],

 s8:[
 "The two sisters quarrelled with one another.|The two sisters quarrelled with each other.|Only two people are involved.",
 "All the members helped each other.|All the members helped one another.|More than two people are involved.",
 "Ram and Ravi blamed one another.|Ram and Ravi blamed each other.|Two names mean two people.",
 "The team supported each other well.|The team supported one another well.|A team has many members.",
 "Both the boys hate one another.|Both the boys hate each other.|'Both' means exactly two.",
 "The villagers helped each other in the flood.|The villagers helped one another in the flood.|Many people are involved.",
 "The five friends wrote to each other.|The five friends wrote to one another.|Five people means more than two.",
 "They shook each others hands.|They shook each other's hands.|The possessive needs an apostrophe.",
 "The students corrected each other papers.|The students corrected one another's papers.|Many students and a possessive form.",
 "The twins resemble one another closely.|The twins resemble each other closely.|Twins means exactly two."],

 s9:[
 "Fill in the Blank|The two neighbouring countries have agreed to help ____ in times of crisis.|one another;each other|1|Only two countries are involved.",
 "Find the Error|All the members of the club (A) helped each other (B) during the flood (C) relief work (D).|A;B;C;D|1|Part B. Many members → 'helped one another'.",
 "Sentence Improvement|The two brothers have not spoken to one another since their father's death.|to one another;to each other;to themselves|1|'The two brothers' means exactly two.",
 "Fill in the Blank|The students in the hostel usually correct ____ answer sheets before the test.|each others;one another's|1|Many students, so the possessive of 'one another'.",
 "Find the Error|Both the sisters (A) blamed one another (B) for the loss (C) of the jewellery (D).|A;B;C;D|1|Part B. 'Both' means two → 'each other'."],

 s10:{
  en:"The exam never announces the number directly. It hides it in phrases like 'the two brothers', 'both the sisters', 'the team members' or 'all the villagers'. Students read the second half of the sentence, see 'helped', and pick whichever pronoun sounds nicer. The number is always in the FIRST half. Read backwards before choosing.",
  ta:"தேர்வு எண்ணிக்கையை ஒருபோதும் நேரடியாக அறிவிப்பதில்லை. அதை 'the two brothers', 'both the sisters', 'the team members' அல்லது 'all the villagers' போன்ற தொடர்களில் மறைத்துவிடும். மாணவர்கள் வாக்கியத்தின் இரண்டாவது பாதியைப் படித்து, 'helped' என்று பார்த்து, எந்தப் பிரதிபெயர் நன்றாகக் கேட்கிறதோ அதைத் தேர்ந்தெடுக்கிறார்கள். எண்ணிக்கை எப்போதும் முதல் பாதியில் இருக்கும். தேர்ந்தெடுப்பதற்கு முன் பின்னோக்கிப் படியுங்கள்.",
  tl:"Thervu ennikkaiyai orupodhum neradiyaaga arivippadhillai. Adhai 'the two brothers', 'both the sisters', 'the team members' pondra thodargalil maraiththividum. Ennikkai eppodhum mudhal paadhiyil irukkum. Therndhedupparku mun pinnokkip padiyungal."},

 s11:{
  en:"COUNT THE PEOPLE FIRST. Two = EACH other (both have 'tw' sound in Tamil இரண்டு). Many = ONE another.",
  ta:"முதலில் மனிதர்களை எண்ணுங்கள். இரண்டு = EACH other. பலர் = ONE another.",
  tl:"Mudhalil manidhargalai ennungal. Irandu = EACH other. Palar = ONE another.",
  vis:"      READ BACKWARDS FIRST\n\n   \"The two brothers love ____ .\"\n         ↑\n    the number is HERE, not at the blank\n\n   TWO SIGNALS:\n   the two · both · the pair · the twins\n   Ram and Shyam · husband and wife\n        →  EACH OTHER\n\n   MANY SIGNALS:\n   all · the team · the members · the villagers\n   the students · the nations · the committee\n        →  ONE ANOTHER\n\n   ⚠ POSSESSIVE FORM:\n     each other'S hands · one another'S papers\n     (apostrophe at the END)"},

 s13:[
 "The two brothers, along with their father, ____ helped ____ during ____ crisis.|has-one another-a;have-each other-the;have-one another-the|1|SVA Rule 31 ignores 'along with' → 'brothers' plural → HAVE. Two brothers → EACH OTHER. Specific crisis → THE.",
 "All the villagers helped ____ , but neither of the two leaders ____ willing to help ____.|one another-was-them;each other-were-they;one another-were-them|0|Many villagers → ONE ANOTHER. 'Neither of' is fixed singular → WAS. Preposition object → THEM.",
 "The twins resemble ____ so closely that even ____ mother cannot tell them apart.|one another-their;each other-their;each other-there|1|Twins means two → EACH OTHER. Possessive → THEIR.",
 "The team members corrected ____ papers, and each of them ____ great pains over it.|each other's-took;one another's-took;one another's-take|1|Many members → ONE ANOTHER'S. 'Each of' is singular → TOOK. Effort → PAINS.",
 "Both the countries trust ____ , though ____ news of the treaty ____ not yet been announced.|one another-a-has;each other-the-has;each other-the-have|1|'Both' means two → EACH OTHER. 'News' takes THE and is singular → HAS."],

 s14:{
  rule:"Use 'each other' for exactly two and 'one another' for more than two.",
  formula:"TWO → each other   |   MORE THAN TWO → one another\nPossessive: each other'S · one another'S",
  memory:"Count the people first. Two = each other. Many = one another.",
  ta:"முதல்ல மனுஷங்கள எண்ணுங்க. இரண்டு = each other. பலர் = one another.",
  tl:"Mudhalla manushangala ennunga. Irandu = each other. Palar = one another.",
  mistake:"Choosing by sound instead of counting, and writing 'each others' without the apostrophe.",
  exam:"SSC CGL / CHSL / MTS and RRB — a short, high-certainty question if you count first."},

 s15:[
 {ta:"இந்த rule ரொம்ப எளிமையானது, ஆனா ஒரு நிபந்தனை இருக்கு — நீங்க எண்ணணும். 'Each other' அப்படின்னா இரண்டு பேரு. 'One another' அப்படின்னா இரண்டுக்கு மேல. அவ்ளோதான்.",
  tl:"Indha rule romba elimaiyaanadhu, aanaa oru nibandhanai irukku — neenga ennanum. 'Each other' appadinnaa rendu peru. 'One another' appadinnaa rendukku mela. Avlodhaan."},
 {ta:"ஆனா இங்க ஒரு பிரச்சனை இருக்கு. SSC உங்களுக்கு 'இங்க ரெண்டு பேரு இருக்காங்க' அப்படின்னு நேரடியா சொல்ல மாட்டாங்க. அவங்க அதை மறைச்சு வெப்பாங்க. 'The two brothers' — ரெண்டு. 'Both the sisters' — ரெண்டு. 'Ram and Shyam' — ரெண்டு. 'The twins' — ரெண்டு. 'Husband and wife' — ரெண்டு.",
  tl:"Aanaa inga oru prachanai irukku. SSC ungalukku neradiyaa solla maattaanga. Avanga adhai maraichu veppaanga. 'The two brothers' — rendu. 'Both the sisters' — rendu. 'Ram and Shyam' — rendu. 'The twins' — rendu."},
 {ta:"மறுபக்கம் — 'All the students' — பலர். 'The team members' — பலர். 'The villagers' — பலர். 'The committee' — பலர். 'The five friends' — அஞ்சு பேரு, அதனால பலர். இதெல்லாம் 'one another'.",
  tl:"Marupakkam — 'All the students' — palar. 'The team members' — palar. 'The villagers' — palar. 'The committee' — palar. 'The five friends' — anju peru. Idhellaam 'one another'."},
 {ta:"அதனால ஒரு பழக்கம் வெச்சுக்கோங்க — blank-ஐ பார்க்கிறதுக்கு முன்னாடி, வாக்கியத்தோட ஆரம்பத்தை படிங்க. எத்தனை பேரு? அதுதான் முழு கேள்வியும். Blank பக்கத்துல பதில் இல்ல, ஆரம்பத்துல இருக்கு.",
  tl:"Adhanaala oru pazhakkam vechukkonga — blank-ai paarkkiradhukku munnaadi, vaakkiyaththoda aarambaththai padinga. Eththanai peru? Adhudhaan muzhu kelviyum. Blank pakkaththula padhil illa, aarambaththula irukku."},
 {ta:"இப்போ உடைமை வடிவம் பத்தி சொல்லுறேன். 'They shook each other's hands' — apostrophe எங்க இருக்கு? கடைசில, 'other'-க்கு அப்பறம். 'Each others hands' இல்ல, 'each other's hands'. அதே மாதிரி 'one another's papers'. இந்த apostrophe-ஐ SSC அடிக்கடி சோதிக்கும்.",
  tl:"Ippo udaimai vadivam paththi solluren. 'They shook each other's hands' — apostrophe enga irukku? Kadaisila, 'other'-kku apparam. 'Each others hands' illa, 'each other's hands'. Adhe maadhiri 'one another's papers'."},
 {ta:"கடைசியா ஒரு நேர்மையான விஷயம் சொல்லணும். நவீன ஆங்கிலத்துல நிறைய எழுத்தாளர்கள் இந்த ரெண்டையும் மாத்தி மாத்திப் பயன்படுத்துறாங்க. 'The two friends helped one another' அப்படின்னு எழுதினாலும் யாரும் தப்புன்னு சொல்ல மாட்டாங்க. ஆனா SSC விடைத்தாள்ல இன்னும் கடுமையான விதிதான். அதனால தேர்வுக்கு விதியை பின்பற்றுங்க, தெருவுக்கு இல்ல.",
  tl:"Kadaisiyaa oru nermaiyaana vishayam sollanum. Naveena Aangilaththula neraiya ezhuththaalargal indha rendaiyum maaththi maaththip payanpaduththuraanga. Aanaa SSC vidaiththaalla innum kadumaiyaana vidhidhaan. Adhanaala thervukku vidhiyai pinpatrunga."}]},

/* ========== RULE 27 ========== */
{n:27,rc:"PRO-07",d:"Medium",t:"ONE must be followed by ONE'S",
 tam:"'One' -ல் தொடங்கினால் 'one's', 'oneself' என்றே தொடர வேண்டும்",
 s1:{en:"If a sentence begins with the impersonal pronoun ONE, you must continue with ONE'S and ONESELF — never with his, him or himself. British usage, which Indian exams follow, demands this consistency.",
  ta:"ஒரு வாக்கியம் ஆள்சாராப் பிரதிபெயரான ONE-ல் தொடங்கினால், ONE'S மற்றும் ONESELF என்றே தொடர வேண்டும் — ஒருபோதும் his, him அல்லது himself அல்ல. இந்தியத் தேர்வுகள் பின்பற்றும் பிரிட்டிஷ் வழக்கு இந்த நிலைத்தன்மையைக் கோருகிறது.",
  tl:"Oru vaakkiyam aalsaaraap pirathibeyaraana ONE-l thodanginaal, ONE'S matrum ONESELF endre thodara vendum — orupodhum his, him alladhu himself alla.",
  formula:"ONE  →  ONE'S  →  ONESELF\n\n  One must do ONE'S duty.           ✔\n  One should not deceive ONESELF.   ✔\n  One should respect ONE'S parents. ✔\n\n  WRONG:\n  One must do HIS duty.             ✘\n  One should not deceive HIMSELF.   ✘"},

 s2:[
 {h:"ONE is deliberately genderless",
  en:"'One' is used exactly because you do NOT want to say he or she. It means 'any person at all'. Switching to 'his' halfway destroys that neutrality and makes the sentence inconsistent.",
  ta:"ONE வேண்டுமென்றே பாலினமற்றது. நீங்கள் 'he' அல்லது 'she' சொல்ல விரும்பாததால்தான் 'one' பயன்படுத்தப்படுகிறது. அது 'எந்த ஒரு நபரும்' என்று பொருள்படுகிறது. பாதியில் 'his'-க்கு மாறுவது அந்த நடுநிலையை அழித்து வாக்கியத்தை முரண்பாடானதாக்குகிறது.",
  tl:"ONE vendumendre paalinamatradhu. Neengal 'he' alladhu 'she' solla virumbaadhadhaal-dhaan 'one' payanpaduththappadugiradhu. Adhu 'endha oru nabarum' endru porulpadugiradhu."},
 {h:"American usage differs — follow British",
  en:"Americans often write 'One must do HIS duty'. That is accepted in the United States. But SSC, Banking, CDS and all Indian competitive exams follow British usage, which requires 'one's'. Know which standard your exam uses.",
  ta:"அமெரிக்க வழக்கு வேறுபடுகிறது — பிரிட்டிஷ் வழக்கைப் பின்பற்றுங்கள். அமெரிக்கர்கள் அடிக்கடி 'One must do HIS duty' என்று எழுதுகிறார்கள். அது அமெரிக்காவில் ஏற்கப்படுகிறது. ஆனால் SSC, Banking, CDS மற்றும் அனைத்து இந்தியப் போட்டித் தேர்வுகளும் 'one's' கோரும் பிரிட்டிஷ் வழக்கைப் பின்பற்றுகின்றன.",
  tl:"America vazhakku verupadugiradhu — British vazhakkaip pinpatrungal. Americargal adikkadi 'One must do HIS duty' endru ezhudhugiraargal. Aanaal SSC, Banking, CDS matrum anaiththu Indhiyap pottith thervugalum British vazhakkaip pinpatrugindrana."},
 {h:"The three forms",
  en:"ONE (subject), ONE'S (possessive), ONESELF (reflexive). 'One should keep one's promises and never deceive oneself.' All three appear in the same sentence and all three must stay in the 'one' family.",
  ta:"மூன்று வடிவங்கள். ONE (எழுவாய்), ONE'S (உடைமை), ONESELF (தன்வினை). 'One should keep one's promises and never deceive oneself.' மூன்றுமே ஒரே வாக்கியத்தில் வருகின்றன, மூன்றுமே 'one' குடும்பத்திலேயே இருக்க வேண்டும்.",
  tl:"Moondru vadivangal. ONE (ezhuvaay), ONE'S (udaimai), ONESELF (thanvinai). 'One should keep one's promises and never deceive oneself.'"},
 {h:"Do not confuse with 'one of the'",
  en:"'One of the boys has lost HIS book' is perfectly correct, because here 'one' means 'one particular boy', not 'any person'. The rule applies only to the impersonal 'one' standing alone as the subject.",
  ta:"'One of the' உடன் குழப்பிக் கொள்ளாதீர்கள். 'One of the boys has lost HIS book' முற்றிலும் சரி, ஏனெனில் இங்கே 'one' என்பது 'ஒரு குறிப்பிட்ட பையன்' என்று பொருள்படுகிறது, 'எந்த ஒரு நபரும்' அல்ல. இந்த விதி Subject-ஆகத் தனியாக நிற்கும் ஆள்சாரா 'one'-க்கு மட்டுமே பொருந்தும்.",
  tl:"'One of the' udan kuzhappik kollaadheergal. 'One of the boys has lost HIS book' mutrilum sari, yenenil inge 'one' enbadhu 'oru kurippitta paiyan' endru porulpadugiradhu."}],

 s3:[
 {h:"Stay in the family",
  d:"   ONE  ──►  ONE'S  ──►  ONESELF\n    │                        │\n    └────────────────────────┘\n        the whole sentence\n        stays inside this family\n\n   One must do ONE'S duty and respect ONESELF. ✔\n   One must do HIS duty and respect HIMSELF.   ✘"},
 {h:"British versus American",
  d:"  BRITISH (Indian exams follow this)\n    One must do ONE'S duty.        ✔\n\n  AMERICAN (accepted in the USA only)\n    One must do HIS duty.          ✘ in SSC\n\n  Films and websites are mostly American.\n  Your answer key is British."},
 {h:"Two different 'ones'",
  d:"  IMPERSONAL 'ONE' (any person)\n    One should do ONE'S duty.      ✔\n\n  'ONE OF THE' (a particular person)\n    One of the boys lost HIS book. ✔\n\n  Only the FIRST kind follows this rule."}],

 s4:{
 wrong:["\"'One must do his duty' sounds more natural.\" — That is American usage, not British.",
  "\"'One's' looks awkward, so 'his' must be better.\" — Awkward but correct beats natural but wrong.",
  "\"'One' can be male, so 'himself' is fine.\" — 'One' is deliberately genderless.",
  "\"This rule applies to 'one of the boys' too.\" — No, that 'one' means a particular person."],
 right:["Once you write 'one', stay with 'one's' and 'oneself'.",
  "Follow British usage in Indian exams.",
  "Check whether 'one' means 'any person' or 'one particular person'.",
  "All three forms must match in the same sentence."]},

 s5:[
 {en:"One must do one's duty honestly.",ta:"ஒருவர் தன்னுடைய கடமையை நேர்மையாகச் செய்ய வேண்டும்.",tl:"Oruvar thannudaiya kadamaiyai nermaiyaagach seyya vendum.",note:"'One' must continue as 'one's'."},
 {en:"One should not deceive oneself.",ta:"ஒருவர் தன்னைத் தானே ஏமாற்றிக் கொள்ளக் கூடாது.",tl:"Oruvar thannaith thaane emaatrik kollak koodaadhu.",note:"The reflexive form is 'oneself', not 'himself'."},
 {en:"One should always respect one's parents.",ta:"ஒருவர் எப்போதும் தன்னுடைய பெற்றோரை மதிக்க வேண்டும்.",tl:"Oruvar eppodhum thannudaiya petrorai madhikka vendum.",note:"Possessive form is 'one's'."},
 {en:"One cannot succeed unless one works hard.",ta:"கடினமாக உழைத்தால் ஒழிய ஒருவர் வெற்றி பெற முடியாது.",tl:"Kadinamaaga uzhaiththaal ozhiya oruvar vetri pera mudiyaadhu.",note:"The second 'one' repeats instead of switching to 'he'."},
 {en:"One of the boys has lost his book.",ta:"பையன்களில் ஒருவன் தன்னுடைய புத்தகத்தைத் தொலைத்துவிட்டான்.",tl:"Paiyangalil oruvan thannudaiya puththagaththaith tholaiththuvittaan.",note:"Here 'one of the' means a particular boy → HIS is correct."}],

 s8:[

 s9:[
 "Fill in the Blank|One should always try to fulfil ____ responsibilities towards society.|his;one's|1|'One' must continue as 'one's'.",
 "Find the Error|One must never (A) deceive himself (B) about the true nature (C) of the problem (D).|A;B;C;D|1|Part B. It must be 'deceive oneself'.",
 "Sentence Improvement|One cannot achieve success unless he is prepared to work very hard.|unless he is;unless one is;unless they are|1|The second pronoun must repeat 'one'.",
 "Fill in the Blank|One of the students in the class has left ____ notebook on the bench.|one's;his|1|'One of the' refers to a particular student.",
 "Find the Error|One should be (A) proud of his (B) country and (C) its rich heritage (D).|A;B;C;D|1|Part B. It must be 'proud of one's country'."],

 s10:{
  en:"Every film, website and American textbook writes 'One must do HIS duty', so the wrong form is everywhere in your daily reading. The correct 'one's' feels stiff and unnatural. The second trap is the reverse: 'One of the boys lost ONE'S book' is wrong because that 'one' means a particular boy. You must tell the two 'ones' apart.",
  ta:"ஒவ்வொரு திரைப்படமும், இணையதளமும், அமெரிக்கப் பாடநூலும் 'One must do HIS duty' என்று எழுதுகின்றன, எனவே தவறான வடிவம் உங்கள் அன்றாட வாசிப்பில் எல்லா இடத்திலும் இருக்கிறது. சரியான 'one's' இறுக்கமாகவும் இயற்கைக்கு மாறாகவும் தோன்றுகிறது. இரண்டாவது பொறி தலைகீழ்: 'One of the boys lost ONE'S book' தவறு, ஏனெனில் அந்த 'one' ஒரு குறிப்பிட்ட பையனைக் குறிக்கிறது. இரண்டு 'one'-களையும் வேறுபடுத்திப் பார்க்க வேண்டும்.",
  tl:"Ovvoru thiraippadamum, inaiyathalamum, America paadanoolum 'One must do HIS duty' endru ezhudhugindrana. Sariyaana 'one's' irukkamaagavum iyarkaikku maaraagavum thondrugiradhu. Irandaavadhu pori thalaigeezh."},

 s11:{
  en:"ONCE YOU SAY 'ONE', STAY WITH 'ONE'. One → one's → oneself.",
  ta:"ஒருமுறை 'ONE' சொன்னால், 'ONE'-உடனேயே இருங்கள். One → one's → oneself.",
  tl:"Orumurai 'ONE' sonnaal, 'ONE'-udaneye irungal. One → one's → oneself.",
  vis:"      THE ONE FAMILY\n\n   ┌──────────────────────────────┐\n   │  ONE  →  ONE'S  →  ONESELF   │\n   └──────────────────────────────┘\n     never leave this box mid-sentence\n\n   One must do ONE'S duty\n   and never deceive ONESELF.        ✔\n\n   One must do HIS duty\n   and never deceive HIMSELF.        ✘\n\n   ⚠ TWO DIFFERENT 'ONES':\n     One should do one's duty.       (any person)\n     One of the boys lost his book.  (a particular boy)\n\n   Only the first kind follows this rule."},

 s13:[
 "One must do ____ duty and never deceive ____ , however hard ____ task may be.|one's-oneself-the;his-himself-a;one's-himself-the|0|All three must stay in the 'one' family. Specific task → THE.",
 "One of the boys has lost ____ book, but one should always keep ____ belongings safe.|his-one's;one's-his;his-his|0|'One of the' → HIS. Impersonal 'one' → ONE'S.",
 "One should apply ____ to ____ work, for one cannot succeed unless ____ works hard.|oneself-one's-one;himself-his-he;oneself-one's-he|0|'Apply' needs a reflexive → ONESELF. Possessive → ONE'S. The second pronoun repeats → ONE.",
 "One must avail ____ of ____ opportunity, since one rarely gets ____ second chance.|oneself-the-a;himself-a-the;oneself-a-a|0|'Avail' needs a reflexive → ONESELF. Specific opportunity → THE. 'Second' here is a countable chance → A.",
 "One should respect ____ parents, and one of my friends ____ told me ____ same thing.|one's-has-the;his-have-a;one's-have-the|0|Impersonal → ONE'S. 'One of' is fixed singular → HAS. 'The same' always takes THE."],

 s14:{
  rule:"An impersonal 'one' must be followed by 'one's' and 'oneself', never by his or himself.",
  formula:"ONE → ONE'S → ONESELF\n('One of the boys' is different — it takes HIS)",
  memory:"Once you say 'one', stay with 'one' throughout the sentence.",
  ta:"ஒரு தடவ 'one' சொன்னா, வாக்கியம் முழுக்க 'one'-ஓடேயே இருங்க.",
  tl:"Oru thadava 'one' sonnaa, vaakkiyam muzhukka 'one'-odeye irunga.",
  mistake:"Switching to 'his' or 'himself' because American writing does so.",
  exam:"SSC CGL / CHSL, CDS and Bank — a clean one-mark question if you know the British standard."},

 s15:[
 {ta:"இந்த rule-ல ஒரு எளிமையான கொள்கை இருக்கு — நிலைத்தன்மை. நீங்க 'one' அப்படின்னு ஆரம்பிச்சா, வாக்கியம் முழுக்க 'one'-ஓடேயே இருக்கணும். நடுவுல 'his' அப்படின்னு மாறக்கூடாது.",
  tl:"Indha rule-la oru elimaiyaana kolgai irukku — nilaiththanmai. Neenga 'one' appadinnu aarambichaa, vaakkiyam muzhukka 'one'-odeye irukkanum. Naduvula 'his' appadinnu maarakkoodaadhu."},
 {ta:"ஏன்? 'One' அப்படிங்கிற வார்த்தை ஏன் பயன்படுத்துறோம்? ஏன்னா நமக்கு 'he' அப்படின்னு சொல்ல விருப்பம் இல்ல, 'she' அப்படின்னும் சொல்ல விருப்பம் இல்ல. 'எந்த ஒரு நபரும்' அப்படிங்கிற பொது அர்த்தம் வேணும். அதனால 'one'. இப்போ நடுவுல 'his' போட்டா, அந்த பொதுத்தன்மையே போயிடும்.",
  tl:"Yen? 'One' appadingira vaarththai yen payanpaduththurom? Yennaa namakku 'he' appadinnu solla viruppam illa, 'she' appadinnum solla viruppam illa. 'Endha oru nabarum' appadingira podhu arththam venum. Ippo naduvula 'his' pottaa, andha podhuththanmaiye poyidum."},
 {ta:"மூணு வடிவம் நினைவு வெச்சுக்கோங்க: ONE (எழுவாய்), ONE'S (உடைமை), ONESELF (தன்வினை). 'One should keep one's promises and never deceive oneself.' — மூணுமே ஒரே வாக்கியத்துல, மூணுமே 'one' குடும்பத்துல.",
  tl:"Moonu vadivam ninaivu vechukkonga: ONE (ezhuvaay), ONE'S (udaimai), ONESELF (thanvinai). 'One should keep one's promises and never deceive oneself.'"},
 {ta:"இப்போ ஒரு நேர்மையான விஷயம் சொல்லணும். நீங்க படம் பார்க்கும்போது, இணையத்துல படிக்கும்போது 'One must do his duty' அப்படித்தான் பார்ப்பீங்க. அது தப்பு இல்ல — அது அமெரிக்க ஆங்கிலம். அமெரிக்காவுல அது சரி. ஆனா SSC, Banking, CDS — இதெல்லாம் பிரிட்டிஷ் ஆங்கிலம் பின்பற்றுது. அங்க 'one's'-தான் சரி.",
  tl:"Ippo oru nermaiyaana vishayam sollanum. Neenga padam paarkkumbodhu 'One must do his duty' appadidhaan paarppeenga. Adhu thappu illa — adhu America Aangilam. Aanaa SSC, Banking, CDS — idhellaam British Aangilam pinpatrudhu."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு வித்தியாசம் சொல்லுறேன். ரெண்டு விதமான 'one' இருக்கு! ஒண்ணு — ஆள்சாரா 'one', அர்த்தம் 'எந்த ஒரு நபரும்'. 'One should do one's duty.' இதுக்கு இந்த rule பொருந்தும். ரெண்டு — 'one of the', அர்த்தம் 'ஒரு குறிப்பிட்ட நபர்'. 'One of the boys has lost HIS book.' இங்க 'his' சரி!",
  tl:"Ippo romba mukkiyamaana oru viththiyaasam solluren. Rendu vidhamaana 'one' irukku! Onnu — aalsaaraa 'one', arththam 'endha oru nabarum'. Rendu — 'one of the', arththam 'oru kurippitta nabar'. 'One of the boys has lost HIS book.' Inga 'his' sari!"},
 {ta:"ஏன் வித்தியாசம்? ஏன்னா 'one of the boys' அப்படின்னா ஒரு குறிப்பிட்ட பையனைப் பத்தி பேசுறோம். அவரு ஆண். அதனால 'his'. ஆனா 'One should do one's duty' அப்படின்னா யாரையும் குறிப்பிடல, பொதுவா சொல்றோம். அதனால 'one's'. இந்த வித்தியாசத்தை SSC சோதிக்கும் — ஒரே கேள்வித் தொகுப்புல ரெண்டையும் வெப்பாங்க. கவனமா படிங்க.",
  tl:"Yen viththiyaasam? Yennaa 'one of the boys' appadinnaa oru kurippitta paiyanaip paththi pesurom. Avaru aan. Adhanaala 'his'. Aanaa 'One should do one's duty' appadinnaa yaaraiyum kurippidala, podhuvaa solrom. Adhanaala 'one's'."}]},

/* ========== RULE 28 ========== */
{n:28,rc:"PRO-08",d:"Hard",t:"Choosing the Right Relative Pronoun",
 tam:"நபருக்கு WHO, பொருளுக்கு WHICH, Superlative-க்குப் பின் THAT",
 s1:{en:"Use WHO for persons, WHICH for animals and things, and THAT after superlatives and after ALL, ONLY, SAME, NONE, NOTHING, ANY and the very first or last.",
  ta:"நபர்களுக்கு WHO, விலங்குகள் மற்றும் பொருட்களுக்கு WHICH, மேலும் superlative-க்குப் பின்னும், ALL, ONLY, SAME, NONE, NOTHING, ANY, முதல் அல்லது கடைசி ஆகியவற்றுக்குப் பின்னும் THAT பயன்படுத்தவும்.",
  tl:"Nabargalukku WHO, vilangugal matrum porutkalukku WHICH, melum superlative-kkup pinnum, ALL, ONLY, SAME, NONE, NOTHING, ANY aagiyavatrukkup pinnum THAT payanpaduththavum.",
  formula:"WHO    →  persons\n  This is the boy WHO won the prize.\n\nWHICH  →  animals and things\n  The book WHICH you gave me is useful.\n\nTHAT   →  after superlatives and after\n           all · only · same · none · nothing · any\n  It is the best film THAT I have seen.\n  All THAT glitters is not gold."},

 s2:[
 {h:"WHO, WHOM and WHOSE",
  en:"WHO is the subject form ('the boy who won'). WHOM is the object form ('the boy whom I met'). WHOSE is the possessive form ('the boy whose father is a doctor'). Test by replacing with he/him/his.",
  ta:"WHO, WHOM மற்றும் WHOSE. WHO என்பது எழுவாய் வடிவம் ('the boy who won'). WHOM என்பது செயப்படுபொருள் வடிவம் ('the boy whom I met'). WHOSE என்பது உடைமை வடிவம் ('the boy whose father is a doctor'). He/him/his என்று மாற்றிச் சோதியுங்கள்.",
  tl:"WHO, WHOM matrum WHOSE. WHO ezhuvaay vadivam. WHOM seyappaduporul vadivam. WHOSE udaimai vadivam. He/him/his endru maatrich sodhiyungal."},
 {h:"The THAT triggers",
  en:"THAT is required after: a superlative (the best, the tallest), ALL, ONLY, SAME, NONE, NOTHING, ANY, ANYTHING, EVERYTHING, LITTLE, MUCH, and after 'the first' or 'the last'. Memorise this list — it is the whole exam question.",
  ta:"THAT-ஐக் கட்டாயமாக்கும் தூண்டுதல்கள்: superlative (the best, the tallest), ALL, ONLY, SAME, NONE, NOTHING, ANY, ANYTHING, EVERYTHING, LITTLE, MUCH, மேலும் 'the first' அல்லது 'the last'-க்குப் பின். இந்தப் பட்டியலை மனப்பாடம் செய்யுங்கள் — இதுதான் முழுத் தேர்வுக் கேள்வியும்.",
  tl:"THAT-aik kattaayamaakkum thoondudhalgal: superlative, ALL, ONLY, SAME, NONE, NOTHING, ANY, ANYTHING, EVERYTHING, LITTLE, MUCH, melum 'the first' alladhu 'the last'-kkup pin."},
 {h:"THAT covers both persons and things",
  en:"Unlike who and which, THAT can refer to people or objects: 'the best boy that I know', 'the best book that I read'. This is why it works as the universal choice after superlatives.",
  ta:"THAT நபர்களையும் பொருட்களையும் உள்ளடக்கும். Who மற்றும் which போலல்லாமல், THAT மனிதர்களையோ பொருட்களையோ குறிக்கலாம்: 'the best boy that I know', 'the best book that I read'. அதனால்தான் superlative-க்குப் பின் அது உலகளாவிய தேர்வாகச் செயல்படுகிறது.",
  tl:"THAT nabargalaiyum porutkalaiyum ulladakkum. Who matrum which polallaamal, THAT manidhargalaiyo porutkalaiyo kurikkalaam."},
 {h:"THAT cannot follow a preposition or a comma",
  en:"You can say 'the man to whom I spoke' but not 'the man to that I spoke'. And in a non-defining clause with commas — 'My brother, who lives in Delhi, is a doctor' — you must use who or which, never that.",
  ta:"முன்னுருபுக்குப் பின்னோ காற்புள்ளிக்குப் பின்னோ THAT வர முடியாது. 'The man to whom I spoke' என்று சொல்லலாம், ஆனால் 'the man to that I spoke' அல்ல. மேலும் காற்புள்ளிகளுடன் வரும் non-defining clause-ல் — 'My brother, who lives in Delhi, is a doctor' — who அல்லது which பயன்படுத்த வேண்டும், ஒருபோதும் that அல்ல.",
  tl:"Munnurubukkup pinno caarpullikkup pinno THAT vara mudiyaadhu. 'The man to whom I spoke' endru sollalaam, aanaal 'the man to that I spoke' alla."}],

 s3:[
 {h:"Three pronouns, three jobs",
  d:"   👤 PERSON      →  WHO / WHOM / WHOSE\n      the boy WHO won\n      the boy WHOM I met\n      the boy WHOSE father came\n\n   📖 THING/ANIMAL →  WHICH\n      the book WHICH you gave me\n      the dog WHICH barked\n\n   ⭐ AFTER TRIGGERS →  THAT\n      the best film THAT I have seen"},
 {h:"The THAT trigger list",
  d:"   Put THAT after any of these:\n\n   ⭐ superlatives : the best · the tallest · the first\n   ALL     :  All THAT glitters is not gold.\n   ONLY    :  the only book THAT I own\n   SAME    :  the same man THAT came yesterday\n   NONE    :  none THAT I know of\n   NOTHING :  nothing THAT can be done\n   ANY     :  any student THAT works hard\n   THE LAST:  the last person THAT left"},
 {h:"Who or whom?",
  d:"   Replace with HE or HIM:\n\n   The boy ____ won the prize.\n     → HE won    ✔  →  use WHO\n\n   The boy ____ I met yesterday.\n     → I met HIM ✔  →  use WHOM\n\n   HE = WHO      HIM = WHOM\n   (both end in the same letter sound)"}],

 s4:{
 wrong:["\"'Which' is more formal, so it is safer everywhere.\" — Never use 'which' for a person.",
  "\"'The best film which I have seen' sounds fine.\" — After a superlative it must be 'that'.",
  "\"'That' can replace 'who' and 'which' anywhere.\" — Not after a preposition or in a comma clause.",
  "\"'Whom' is old-fashioned and never needed.\" — SSC still tests who versus whom."],
 right:["Person → who. Thing → which. After a trigger word → that.",
  "Memorise the trigger list: superlative, all, only, same, none, nothing, any, first, last.",
  "Test who versus whom by replacing with he or him.",
  "Never put 'that' after a preposition or after a comma."]},

 s5:[
 {en:"This is the boy who won the first prize.",ta:"முதல் பரிசை வென்ற பையன் இவன்தான்.",tl:"Mudhal parisai vendra paiyan ivandhaan.",note:"'Boy' is a person and the subject → WHO."},
 {en:"The book which you gave me is very useful.",ta:"நீங்கள் எனக்குக் கொடுத்த புத்தகம் மிகவும் பயனுள்ளது.",tl:"Neengal enakkuk koduththa puththagam migavum payanulladhu.",note:"'Book' is a thing → WHICH."},
 {en:"It is the best film that I have ever seen.",ta:"நான் இதுவரை பார்த்ததிலேயே சிறந்த திரைப்படம் இதுதான்.",tl:"Naan idhuvarai paarththadhileye sirandha thiraippadam idhudhaan.",note:"After a superlative → THAT."},
 {en:"All that glitters is not gold.",ta:"மின்னுவதெல்லாம் பொன்னல்ல.",tl:"Minnuvadhellaam ponnalla.",note:"After 'all' → THAT."},
 {en:"The man whom I met yesterday is a lawyer.",ta:"நான் நேற்று சந்தித்த மனிதர் ஒரு வழக்கறிஞர்.",tl:"Naan netru sandhiththa manidhar oru vazhakkarignar.",note:"'I met him' → object form WHOM."}],

 s7:[

 s8:[
 "This is the boy which won the prize.|This is the boy who won the prize.|'Which' is never used for a person.",
 "The book who you gave me is useful.|The book which you gave me is useful.|'Who' is not used for a thing.",
 "It is the best film which I have seen.|It is the best film that I have seen.|After a superlative use 'that'.",
 "All which glitters is not gold.|All that glitters is not gold.|After 'all' use 'that'.",
 "The man who I met is a lawyer.|The man whom I met is a lawyer.|The object form is 'whom'.",
 "This is the only book which I own.|This is the only book that I own.|After 'only' use 'that'.",
 "She is the girl who father is a doctor.|She is the girl whose father is a doctor.|The possessive form is 'whose'.",
 "There is nothing which can be done.|There is nothing that can be done.|After 'nothing' use 'that'.",
 "The man to that I spoke has left.|The man to whom I spoke has left.|'That' cannot follow a preposition.",
 "My brother, that lives in Delhi, is a doctor.|My brother, who lives in Delhi, is a doctor.|'That' cannot follow a comma."],

 s9:[

 s10:{
  en:"The superlative trap is the big one. 'The best film WHICH I have seen' sounds completely natural and is wrong — it must be 'that'. The trigger list is the entire question: all, only, same, none, nothing, any, first, last, plus every superlative. The second trap is who versus whom, which most students avoid by always writing 'who'.",
  ta:"Superlative பொறிதான் பெரியது. 'The best film WHICH I have seen' முற்றிலும் இயற்கையாகக் கேட்கிறது, ஆனால் தவறு — அது 'that' என்றுதான் இருக்க வேண்டும். தூண்டுதல் பட்டியல்தான் முழுக் கேள்வியும்: all, only, same, none, nothing, any, first, last, மேலும் ஒவ்வொரு superlative-ம். இரண்டாவது பொறி who மற்றும் whom, பெரும்பாலான மாணவர்கள் எப்போதும் 'who' எழுதி அதைத் தவிர்க்கிறார்கள்.",
  tl:"Superlative poridhaan periyadhu. 'The best film WHICH I have seen' mutrilum iyarkaiyaagak ketkiradhu, aanaal thavaru. Thoondudhal pattiyal-dhaan muzhuk kelviyum: all, only, same, none, nothing, any, first, last."},

 s11:{
  en:"SUPERLATIVE, ALL, ONLY, SAME, NONE, NOTHING, ANY → THAT. Person → WHO. Thing → WHICH.",
  ta:"Superlative, ALL, ONLY, SAME, NONE, NOTHING, ANY → THAT. நபர் → WHO. பொருள் → WHICH.",
  tl:"Superlative, ALL, ONLY, SAME, NONE, NOTHING, ANY → THAT. Nabar → WHO. Porul → WHICH.",
  vis:"      THE THAT-TRIGGER LIST\n\n   ⭐ ANY SUPERLATIVE  (best · tallest · finest)\n   ALL      ONLY      SAME\n   NONE     NOTHING   ANY\n   THE FIRST          THE LAST\n\n   See any of these → write THAT\n\n   MEMORY LINE:\n   \"ALL THAT glitters is not gold —\n    the ONLY THING THAT is true.\"\n\n   WHO vs WHOM TEST:\n     replace with HE  →  use WHO\n     replace with HIM →  use WHOM\n\n   ⚠ 'THAT' IS BANNED:\n     after a preposition (to whom, not to that)\n     after a comma (My brother, who ...)"},

 s13:[
 "He is the only one of the boys ____ ____ passed ____ examination.|who-have-the;that-has-the;who-has-a|1|'The only' → THAT. 'The only one' makes the verb singular → HAS (SVA Rule 44). Specific exam → THE.",

 "The man to ____ I spoke ____ the same person ____ came here yesterday.|whom-is-that;who-is-which;whom-was-which|0|After a preposition → WHOM. 'The same' → THAT.",
 "All ____ glitters is not gold, and nothing ____ he said ____ true.|that-that-was;which-which-were;that-which-was|0|After 'all' → THAT. After 'nothing' → THAT. Noun clause subject → WAS.",

 s14:{
  rule:"Use WHO for persons, WHICH for things, and THAT after superlatives and after all, only, same, none, nothing and any.",
  formula:"WHO → persons | WHICH → things\nTHAT → after superlative / all / only / same / none / nothing / any / first / last",
  memory:"All THAT glitters is not gold — the ONLY thing THAT is true.",
  ta:"Superlative, All, Only, Same, None, Nothing, Any பார்த்தா உடனே THAT.",
  tl:"Superlative, All, Only, Same, None, Nothing, Any paarththaa udane THAT.",
  mistake:"Writing 'the best film which' after a superlative, and using 'who' where 'whom' is needed.",
  exam:"SSC CGL / CHSL and Bank — the superlative-plus-that pattern is very frequent."},

 s15:[
 {ta:"இந்த rule-ல மூணு வார்த்தை இருக்கு — who, which, that. ஒவ்வொண்ணுக்கும் ஒரு வேலை. Who — நபருக்கு. Which — பொருளுக்கு, விலங்குக்கு. That — சில குறிப்பிட்ட சூழல்ல.",
  tl:"Indha rule-la moonu vaarththai irukku — who, which, that. Ovvonnukkum oru velai. Who — nabarukku. Which — porulukku, vilangukku. That — sila kurippitta soozhalla."},
 {ta:"முதல் ரெண்டு எளிது. 'This is the boy WHO won' — பையன், நபர், அதனால who. 'The book WHICH you gave me' — புத்தகம், பொருள், அதனால which. இதுல குழப்பம் இல்ல.",
  tl:"Mudhal rendu eladhu. 'This is the boy WHO won' — paiyan, nabar, adhanaala who. 'The book WHICH you gave me' — puththagam, porul, adhanaala which."},
 {ta:"ஆனா SSC-ஓட உண்மையான களம் 'that'. இதுதான் நிறைய பேரு தப்பு பண்றது. கேள்வி: 'It is the best film ____ I have seen.' இப்போ என்ன போடுவீங்க? பெரும்பாலானவங்க 'which' போடுவாங்க. ஏன்? ஏன்னா film ஒரு பொருள். logic சரிதான், ஆனா பதில் தப்பு. சரியான பதில் 'that'.",
  tl:"Aanaa SSC-oda unmaiyaana kalam 'that'. Idhudhaan neraiya peru thappu panradhu. Kelvi: 'It is the best film ____ I have seen.' Perumbaalaanavanga 'which' poduvaanga. Aanaa padhil thappu. Sariyaana padhil 'that'."},
 {ta:"ஏன்? ஏன்னா 'best' அப்படிங்கிறது ஒரு superlative. Superlative-க்கு அப்பறம் எப்பவும் 'that'. இதோட ஒரு பட்டியல் இருக்கு — இதை மனப்பாடம் பண்ணுங்க: superlative, ALL, ONLY, SAME, NONE, NOTHING, ANY, THE FIRST, THE LAST. இந்த வார்த்தை பார்த்தவுடனே 'that' போடுங்க.",
  tl:"Yennaa 'best' appadingiradhu oru superlative. Superlative-kku apparam eppavum 'that'. Idhoda oru pattiyal irukku — idhai manappaadam pannunga: superlative, ALL, ONLY, SAME, NONE, NOTHING, ANY, THE FIRST, THE LAST."},
 {ta:"ஒரு வரி நினைவு வெச்சுக்கோங்க — 'All THAT glitters is not gold.' இது ஒரு பழமொழி, எல்லாருக்கும் தெரியும். இதுல 'all'-க்கு அப்பறம் 'that' வருது. இந்த ஒரு வரி உங்களுக்கு rule-ஐ ஞாபகப்படுத்தும்.",
  tl:"Oru vari ninaivu vechukkonga — 'All THAT glitters is not gold.' Idhu oru pazhamozhi, ellaarukkum theriyum. Idhula 'all'-kku apparam 'that' varudhu."},
 {ta:"கடைசியா who மற்றும் whom. ஒரு எளிய சோதனை — 'he' அல்லது 'him' போட்டுப் பாருங்க. 'The boy ____ won the prize' → 'HE won' — சரி. HE-க்கு WHO. 'The man ____ I met' → 'I met HIM' — சரி. HIM-க்கு WHOM. HE-WHO, HIM-WHOM. ரெண்டுமே ஒரே ஒலியில முடியுது, அப்படி நினைச்சுக்கோங்க. மேலும் ஒரு எச்சரிக்கை — preposition-க்கு அப்பறம் 'that' வராது ('to whom' சரி, 'to that' தப்பு), comma-க்கு அப்பறமும் வராது ('My brother, who...' சரி).",
  tl:"Kadaisiyaa who matrum whom. Oru eliya sodhanai — 'he' alladhu 'him' pottup paarunga. 'HE won' — HE-kku WHO. 'I met HIM' — HIM-kku WHOM. HE-WHO, HIM-WHOM. Melum oru echcharikkai — preposition-kku apparam 'that' varaadhu, comma-kku apparamum varaadhu."}]},

/* ========== RULE 29 ========== */
{n:29,rc:"PRO-09",d:"Hard",t:"A Pronoun must AGREE with its Antecedent",
 tam:"பிரதிபெயர் தான் குறிக்கும் சொல்லுடன் ஒத்துப்போக வேண்டும்",
 s1:{en:"A pronoun must agree with its ANTECEDENT (the noun it refers to) in NUMBER, GENDER and PERSON. Everyone, everybody, each, either, neither, anyone and nobody are SINGULAR and take singular pronouns.",
  ta:"ஒரு பிரதிபெயர் தான் குறிக்கும் பெயர்ச்சொல்லுடன் (antecedent) எண், பாலினம், நபர் ஆகியவற்றில் ஒத்துப்போக வேண்டும். Everyone, everybody, each, either, neither, anyone, nobody ஆகியவை ஒருமை, ஒருமைப் பிரதிபெயர்களை எடுக்கும்.",
  tl:"Oru pirathibeyar thaan kurikkum peyarcholudan (antecedent) en, paalinam, nabar aagiyavatril oththuppoga vendum. Everyone, everybody, each, either, neither, anyone, nobody aagiyavai orumai.",
  formula:"SINGULAR ANTECEDENT  →  SINGULAR PRONOUN\n\n  Everyone must do HIS duty.            ✔\n  Each of the boys has finished HIS work. ✔\n  Neither of the girls brought HER book. ✔\n  Nobody raised HIS hand.               ✔\n\n  PLURAL ANTECEDENT  →  PLURAL PRONOUN\n  All the boys have finished THEIR work. ✔"},

 s2:[
 {h:"This is the pronoun side of SVA Rules 34 and 36",
  en:"In the Subject-Verb Agreement module you learnt that 'Each of the boys HAS' takes a singular verb. Here you are learning that it also takes a singular PRONOUN — 'his', not 'their'. Same rule, two halves.",
  ta:"இது SVA Rules 34 மற்றும் 36-ன் பிரதிபெயர் பக்கம். Subject-Verb Agreement module-ல் 'Each of the boys HAS' ஒருமை வினைச்சொல் எடுக்கும் என்று கற்றுக்கொண்டீர்கள். இங்கே அது ஒருமைப் பிரதிபெயரையும் எடுக்கும் என்று கற்றுக்கொள்கிறீர்கள் — 'his', 'their' அல்ல. ஒரே விதி, இரண்டு பாதிகள்.",
  tl:"Idhu SVA Rules 34 matrum 36-in pirathibeyar pakkam. 'Each of the boys HAS' orumai vinaichol edukkum endru katrukkondeergal. Inge adhu orumaip pirathibeyaraiyum edukkum. Ore vidhi, irandu paadhigal."},
 {h:"The verb and the pronoun must MATCH",
  en:"'Everyone HAS done THEIR duty' is wrong twice — well, once. The verb is singular but the pronoun is plural. Both must be singular: 'Everyone HAS done HIS duty'. Check both in the same sentence.",
  ta:"வினைச்சொல்லும் பிரதிபெயரும் பொருந்த வேண்டும். 'Everyone HAS done THEIR duty' தவறு — வினைச்சொல் ஒருமை ஆனால் பிரதிபெயர் பன்மை. இரண்டும் ஒருமையாக இருக்க வேண்டும்: 'Everyone HAS done HIS duty'. ஒரே வாக்கியத்தில் இரண்டையும் சரிபாருங்கள்.",
  tl:"Vinaicholum pirathibeyarum porundha vendum. 'Everyone HAS done THEIR duty' thavaru — vinaichol orumai aanaal pirathibeyar panmai. Irandum orumaiyaaga irukka vendum."},
 {h:"Singular 'they' is modern but not exam English",
  en:"Modern spoken and written English widely accepts 'Everyone must do their duty'. But SSC, Banking and CDS answer keys still mark 'his' or 'his or her' as correct. Know the exam standard.",
  ta:"ஒருமை 'they' நவீனமானது ஆனால் தேர்வு ஆங்கிலம் அல்ல. நவீன பேச்சு மற்றும் எழுத்து ஆங்கிலம் 'Everyone must do their duty'-ஐ பரவலாக ஏற்றுக்கொள்கிறது. ஆனால் SSC, Banking, CDS விடைத்தாள்கள் இன்னும் 'his' அல்லது 'his or her'-ஐச் சரியாகக் குறிக்கின்றன. தேர்வுத் தரம் தெரிந்திருக்க வேண்டும்.",
  tl:"Orumai 'they' naveenamaanadhu aanaal thervu Aangilam alla. Aanaal SSC, Banking, CDS vidaiththaalgal innum 'his' alladhu 'his or her'-aich sariyaagak kurikkindrana."},
 {h:"Gender must match too",
  en:"'Neither of the GIRLS brought HER book' — the antecedent is girls, so the pronoun must be feminine. 'Each of the BOYS has HIS book' — masculine. Read the antecedent to fix the gender.",
  ta:"பாலினமும் பொருந்த வேண்டும். 'Neither of the GIRLS brought HER book' — antecedent பெண்கள், எனவே பிரதிபெயர் பெண்பாலாக இருக்க வேண்டும். 'Each of the BOYS has HIS book' — ஆண்பால். பாலினத்தை நிர்ணயிக்க antecedent-ஐப் படியுங்கள்.",
  tl:"Paalinamum porundha vendum. 'Neither of the GIRLS brought HER book' — antecedent pengal, enave pirathibeyar penpaalaaga irukka vendum. 'Each of the BOYS has HIS book' — aanpaal."}],

 s3:[
 {h:"The antecedent controls everything",
  d:"   EVERYONE  must do  HIS  duty.\n      ↑                  ↑\n  antecedent      pronoun must match it\n\n   singular antecedent → singular pronoun\n   masculine antecedent → masculine pronoun\n\n   EACH OF THE GIRLS brought HER book.\n            ↑                  ↑\n      feminine, singular   feminine, singular"},
 {h:"Verb and pronoun must both match",
  d:"   Everyone HAS done HIS duty.     ✔ both singular\n   Everyone HAVE done THEIR duty.  ✘ both plural\n   Everyone HAS done THEIR duty.   ✘ mismatched\n\n   SSC often makes the VERB correct\n   and the PRONOUN wrong.\n   Check BOTH in every sentence."},
 {h:"The singular family",
  d:"   ALWAYS SINGULAR → take HIS / HER / ITS\n\n   everyone · everybody · everything\n   someone · somebody · something\n   anyone · anybody · anything\n   no one · nobody · nothing\n   each · either · neither · one\n   each of · either of · neither of · one of"}],

 s4:{
 wrong:["\"'Everyone must do their duty' is what everybody writes.\" — Correct in modern usage, wrong in SSC.",
  "\"'Everyone' means many people, so 'their' is logical.\" — Grammatically it is singular.",
  "\"Only the verb is tested, not the pronoun.\" — The pronoun is very often the planted error.",
  "\"'Each of the girls has his book' — 'each' is masculine by default.\" — The antecedent is girls, so it must be 'her'."],
 right:["Find the antecedent first, then match the pronoun to it.",
  "Everyone, each, either, neither, nobody → singular pronoun.",
  "Check the verb AND the pronoun in the same sentence.",
  "Read the antecedent to fix the gender: boys → his, girls → her."]},

 s5:[
 {en:"Everyone must do his duty sincerely.",ta:"ஒவ்வொருவரும் தன்னுடைய கடமையை நேர்மையாகச் செய்ய வேண்டும்.",tl:"Ovvoruvarum thannudaiya kadamaiyai nermaiyaagach seyya vendum.",note:"'Everyone' is singular → HIS."},
 {en:"Each of the boys has finished his work.",ta:"ஒவ்வொரு பையனும் தன்னுடைய வேலையை முடித்துவிட்டான்.",tl:"Ovvoru paiyanum thannudaiya velaiyai mudiththuvittaan.",note:"'Each of' is singular and the antecedent is boys → HIS."},
 {en:"Neither of the girls has brought her book.",ta:"இரு பெண்களில் யாரும் தங்கள் புத்தகத்தைக் கொண்டுவரவில்லை.",tl:"Iru pengalil yaarum thangal puththagaththaik konduvaravillai.",note:"'Neither of' is singular and the antecedent is girls → HER."},
 {en:"Nobody raised his hand in the class.",ta:"வகுப்பில் யாரும் கை உயர்த்தவில்லை.",tl:"Vagupil yaarum kai uyarththavillai.",note:"'Nobody' is singular → HIS."},
 {en:"All the students have submitted their assignments.",ta:"அனைத்து மாணவர்களும் தங்கள் பணிகளைச் சமர்ப்பித்துவிட்டனர்.",tl:"Anaiththu maanavargalum thangal panigalaich samarppiththuvittanar.",note:"'All the students' is plural → THEIR."}],

 s10:{
  en:"This is the trap where modern English and exam English disagree most sharply. Everyone writes 'Everyone must do their duty' in real life, and it is now accepted almost everywhere except in Indian competitive exams. SSC will often make the VERB correct and hide the error in the PRONOUN — 'Everyone HAS submitted THEIR form' has a right verb and a wrong pronoun.",
  ta:"நவீன ஆங்கிலமும் தேர்வு ஆங்கிலமும் மிகக் கூர்மையாக முரண்படும் பொறி இதுதான். நிஜ வாழ்க்கையில் எல்லோரும் 'Everyone must do their duty' என்று எழுதுகிறார்கள், இந்தியப் போட்டித் தேர்வுகளைத் தவிர கிட்டத்தட்ட எல்லா இடத்திலும் அது இப்போது ஏற்கப்படுகிறது. SSC அடிக்கடி வினைச்சொல்லைச் சரியாக வைத்து, தவறை பிரதிபெயரில் மறைக்கும் — 'Everyone HAS submitted THEIR form' இதில் வினைச்சொல் சரி, பிரதிபெயர் தவறு.",
  tl:"Naveena Aangilamum thervu Aangilamum migak koormaiyaaga muranpadum pori idhudhaan. SSC adikkadi vinaicholaich sariyaaga vaiththu, thavarai pirathibeyaril maraikkum — 'Everyone HAS submitted THEIR form'."},

 s11:{
  en:"FIND THE ANTECEDENT FIRST. Match the pronoun to it in number and gender. Check the verb too.",
  ta:"முதலில் antecedent-ஐக் கண்டறியுங்கள். எண்ணிலும் பாலினத்திலும் பிரதிபெயரை அதனுடன் பொருத்துங்கள். வினைச்சொல்லையும் சரிபாருங்கள்.",
  tl:"Mudhalil antecedent-aik kandariyungal. Ennilum paalinaththilum pirathibeyarai adhanudan poruththungal.",
  vis:"      THE TWO-CHECK METHOD\n\n   \"Everyone ____ done ____ duty.\"\n\n   CHECK 1 — the VERB:\n     Everyone is singular  →  HAS\n\n   CHECK 2 — the PRONOUN:\n     Everyone is singular  →  HIS\n\n   Both must be singular:\n     Everyone HAS done HIS duty.   ✔\n\n   ⚠ SSC OFTEN GETS THE VERB RIGHT\n     AND HIDES THE ERROR IN THE PRONOUN.\n\n   GENDER FROM THE ANTECEDENT:\n     each of the BOYS  →  HIS\n     each of the GIRLS →  HER"},

 s14:{
  rule:"A pronoun must agree with its antecedent in number, gender and person. Everyone, each, either, neither and nobody are singular.",
  formula:"SINGULAR antecedent → HIS / HER / ITS\nPLURAL antecedent → THEIR\nCheck the VERB and the PRONOUN together",
  memory:"Find the antecedent first. Everyone = singular = his.",
  ta:"முதல்ல antecedent-ஐ கண்டுபிடிங்க. Everyone = ஒருமை = his.",
  tl:"Mudhalla antecedent-ai kandupidinga. Everyone = orumai = his.",
  mistake:"Writing 'Everyone must do their duty' because modern usage allows it.",
  exam:"SSC CGL / CHSL, CDS and Bank — the pronoun is very often the planted error, not the verb."},

 s15:[
 {ta:"இந்த rule நமக்கு ரொம்ப சிரமமா இருக்கும். ஏன்? ஏன்னா இங்க நவீன ஆங்கிலமும் தேர்வு ஆங்கிலமும் நேர் எதிரா இருக்கு.",
  tl:"Indha rule namakku romba siramamaa irukkum. Yennaa inga naveena Aangilamum thervu Aangilamum ner edhiraa irukku."},
 {ta:"இன்னைக்கு உலகம் முழுக்க 'Everyone must do their duty' அப்படித்தான் எழுதுறாங்க. செய்திதாள்ல, புத்தகத்துல, இணையத்துல — எல்லா இடத்துலயும். அது இப்போ ஏத்துக்கப்படுது, ஏன்னா 'his' அப்படின்னு போட்டா ஆண்களை மட்டும் குறிக்கிற மாதிரி ஆயிடுது.",
  tl:"Innaikku ulagam muzhukka 'Everyone must do their duty' appadidhaan ezhudhuraanga. Seydhithaalla, puththagaththula, inaiyaththula — ellaa idaththulayum. Adhu ippo eththukkappadudhu."},
 {ta:"ஆனா SSC, Banking, CDS விடைத்தாள்ல இன்னும் பழைய விதிதான். 'Everyone' ஒருமை, அதனால 'his'. இது நியாயமா இல்லாம இருக்கலாம், ஆனா தேர்வுல mark வேணும்னா இதை பின்பற்றணும். சில நேரம் 'his or her' அப்படின்னும் ஏத்துப்பாங்க.",
  tl:"Aanaa SSC, Banking, CDS vidaiththaalla innum pazhaiya vidhidhaan. 'Everyone' orumai, adhanaala 'his'. Idhu niyaayamaa illaama irukkalaam, aanaa thervula mark venumnaa idhai pinpatranum."},
 {ta:"இப்போ ஒரு முக்கியமான இணைப்பு சொல்லுறேன். நீங்க SVA module-ல Rule 34 மற்றும் Rule 36 படிச்சீங்க — 'Each of the boys HAS', 'Everyone IS'. அது வினைச்சொல் பக்கம். இப்போ இது பிரதிபெயர் பக்கம். ஒரே rule, ரெண்டு பாதி. 'Each of the boys HAS finished HIS work' — verb ஒருமை, pronoun-ம் ஒருமை.",
  tl:"Ippo oru mukkiyamaana inaippu solluren. Neenga SVA module-la Rule 34 matrum Rule 36 padicheenga — 'Each of the boys HAS', 'Everyone IS'. Adhu vinaichol pakkam. Ippo idhu pirathibeyar pakkam. Ore rule, rendu paadhi."},
 {ta:"இங்க SSC-ஓட ஒரு கெட்ட புத்தி சொல்லுறேன். அவங்க verb-ஐ சரியா வெப்பாங்க, error-ஐ pronoun-ல மறைப்பாங்க. உதாரணம்: 'Everyone HAS submitted THEIR form.' இதுல verb 'has' — சரி! நீங்க verb-ஐ மட்டும் பார்த்து 'error இல்ல' அப்படின்னு நினைப்பீங்க. ஆனா 'their' தப்பு. 'his' தான் சரி. அதனால ரெண்டையும் பாருங்க.",
  tl:"Inga SSC-oda oru ketta puththi solluren. Avanga verb-ai sariyaa veppaanga, error-ai pronoun-la maraippaanga. Udhaaranam: 'Everyone HAS submitted THEIR form.' Idhula verb 'has' — sari! Aanaa 'their' thappu. Adhanaala rendaiyum paarunga."},
 {ta:"கடைசியா பாலினம் பத்தி. Pronoun-ஓட பாலினம் antecedent-ஐ பொறுத்து. 'Each of the BOYS has HIS book' — பையன்கள், அதனால 'his'. 'Each of the GIRLS has HER book' — பெண்கள், அதனால 'her'. 'Each' அப்படிங்கிறது தானா ஆண்பால் இல்ல — அதுக்கு முன்னாடி இருக்கிற பெயர்ச்சொல்லை பாருங்க. SSC இதையும் சோதிக்கும்.",
  tl:"Kadaisiyaa paalinam paththi. Pronoun-oda paalinam antecedent-ai poruththu. 'Each of the BOYS has HIS book'. 'Each of the GIRLS has HER book'. 'Each' appadingiradhu thaanaa aanpaal illa — adhukku munnaadi irukkira peyarcholai paarunga."}]},

/* ========== RULE 30 ========== */
{n:30,rc:"PRO-10",d:"Medium",t:"WHOSE for Persons, OF WHICH for Things",
 tam:"உயிருள்ளவற்றுக்கு WHOSE, உயிரற்றவற்றுக்கு OF WHICH",
 s1:{en:"Use WHOSE for persons and living beings, and OF WHICH for lifeless things in formal English. 'Whose' is the possessive form of 'who', and 'who' refers to people.",
  ta:"முறையான ஆங்கிலத்தில் நபர்கள் மற்றும் உயிரினங்களுக்கு WHOSE-ஐயும், உயிரற்ற பொருட்களுக்கு OF WHICH-ஐயும் பயன்படுத்தவும். 'Whose' என்பது 'who'-ன் உடைமை வடிவம், 'who' மனிதர்களைக் குறிக்கிறது.",
  tl:"Muraiyaana Aangilaththil nabargal matrum uyirinangalukku WHOSE-aiyum, uyiratra porutkalukku OF WHICH-aiyum payanpaduththavum. 'Whose' enbadhu 'who'-in udaimai vadivam.",
  formula:"PERSON  →  WHOSE\n  This is the boy WHOSE father is a doctor.\n  I met a girl WHOSE brother is an IAS officer.\n\nLIFELESS THING  →  OF WHICH\n  The house, the roof OF WHICH is red, is mine.\n  The book, the cover OF WHICH is torn, is old."},

 s2:[
 {h:"WHOSE belongs to the WHO family",
  en:"WHO (subject), WHOM (object), WHOSE (possessive) — all three refer to PEOPLE. Since 'who' is only for persons, its possessive 'whose' is naturally only for persons too, at least in strict formal usage.",
  ta:"WHOSE என்பது WHO குடும்பத்தைச் சேர்ந்தது. WHO (எழுவாய்), WHOM (செயப்படுபொருள்), WHOSE (உடைமை) — மூன்றுமே மனிதர்களைக் குறிக்கின்றன. 'Who' நபர்களுக்கு மட்டுமே என்பதால், அதன் உடைமை வடிவமான 'whose'-ம் இயல்பாகவே நபர்களுக்கு மட்டுமே, குறைந்தபட்சம் கடுமையான முறையான பயன்பாட்டில்.",
  tl:"WHOSE enbadhu WHO kudumbaththaich serndhadhu. WHO (ezhuvaay), WHOM (seyappaduporul), WHOSE (udaimai) — moondrume manidhargalaik kurikkindrana."},
 {h:"Modern usage allows 'whose' for things",
  en:"'The house whose roof is red' is now widely accepted, because 'of which' sounds clumsy. But SSC and CDS answer keys often still prefer 'of which' for lifeless things. If both appear as options, choose 'of which' for objects.",
  ta:"நவீன பயன்பாடு பொருட்களுக்கும் 'whose' அனுமதிக்கிறது. 'The house whose roof is red' இப்போது பரவலாக ஏற்கப்படுகிறது, ஏனெனில் 'of which' தடுமாற்றமாக ஒலிக்கிறது. ஆனால் SSC மற்றும் CDS விடைத்தாள்கள் உயிரற்ற பொருட்களுக்கு இன்னும் 'of which'-ஐ விரும்புகின்றன. இரண்டும் option-ஆக வந்தால், பொருட்களுக்கு 'of which' தேர்ந்தெடுங்கள்.",
  tl:"Naveena payanpaadu porutkalukkum 'whose' anumadhikkiradhu. Aanaal SSC matrum CDS vidaiththaalgal uyiratra porutkalukku innum 'of which'-ai virumbugindrana."},
 {h:"The classic planted error",
  en:"'The man OF WHICH the son is a doctor' is always wrong — a man is a person, so it must be 'whose son'. This reverse error appears far more often in exams than the 'whose roof' question.",
  ta:"பாரம்பரியமாக நடப்படும் தவறு. 'The man OF WHICH the son is a doctor' எப்போதுமே தவறு — ஒரு மனிதர் ஒரு நபர், எனவே 'whose son' என்றுதான் இருக்க வேண்டும். இந்தத் தலைகீழ் தவறு 'whose roof' கேள்வியைவிட தேர்வுகளில் மிக அதிகமாக வருகிறது.",
  tl:"Paaramparyamaaga nadappadum thavaru. 'The man OF WHICH the son is a doctor' eppodhume thavaru — oru manidhar oru nabar, enave 'whose son' endrudhaan irukka vendum."},
 {h:"Animals can take either form",
  en:"'The dog whose leg was broken' and 'the dog, the leg of which was broken' are both acceptable. Animals sit between persons and things, so English allows both. Exams rarely test animals for this reason.",
  ta:"விலங்குகள் இரு வடிவங்களையும் எடுக்கலாம். 'The dog whose leg was broken' மற்றும் 'the dog, the leg of which was broken' இரண்டுமே ஏற்கத்தக்கவை. விலங்குகள் நபர்களுக்கும் பொருட்களுக்கும் இடையே இருக்கின்றன, எனவே ஆங்கிலம் இரண்டையும் அனுமதிக்கிறது. இந்தக் காரணத்தால் தேர்வுகள் விலங்குகளை அரிதாகவே சோதிக்கின்றன.",
  tl:"Vilangugal iru vadivangalaiyum edukkalaam. 'The dog whose leg was broken' matrum 'the dog, the leg of which was broken' irandume erkaththakkavai."}],

 s3:[
 {h:"The WHO family",
  d:"   👤 PERSON\n   ┌────────────────────────────┐\n   │ WHO   →  subject           │\n   │ WHOM  →  object            │\n   │ WHOSE →  possessive        │\n   └────────────────────────────┘\n\n   the boy WHO won\n   the boy WHOM I met\n   the boy WHOSE father came"},
 {h:"Person versus thing",
  d:"   👤 the boy WHOSE father is a doctor      ✔\n   👤 the boy OF WHICH the father is a doctor ✘\n\n   🏠 the house, the roof OF WHICH is red    ✔ formal\n   🏠 the house WHOSE roof is red            ✔ modern\n\n   ⚠ The reverse error is the tested one:\n     never use OF WHICH for a person."},
 {h:"Where the comma goes",
  d:"   The house, the roof OF WHICH is red, is mine.\n              ↑                        ↑\n         commas wrap the whole clause\n\n   The structure is:\n     noun , the PART of which ... , main verb"}],

 s4:{
 wrong:["\"'Of which' sounds formal, so it works for people too.\" — Never use it for a person.",
  "\"'Whose' can only be used for people, never for things.\" — Modern usage allows it for things.",
  "\"'The man of which the son is a doctor' is elegant.\" — It is always wrong.",
  "\"'Whose' and 'who's' are the same word.\" — 'Who's' means 'who is'."],
 right:["Person → whose, always.",
  "Lifeless thing → 'of which' in formal exam English.",
  "Never use 'of which' for a person — that is the tested error.",
  "Remember whose belongs to the who family: who, whom, whose."]},

 s5:[
 {en:"This is the boy whose father is a doctor.",ta:"இவனுடைய தந்தை ஒரு மருத்துவர்.",tl:"Ivanudaiya thandhai oru maruththuvar.",note:"A person → WHOSE."},
 {en:"I met a girl whose brother is an IAS officer.",ta:"ஒரு பெண்ணைச் சந்தித்தேன், அவளுடைய சகோதரர் ஒரு IAS அதிகாரி.",tl:"Oru pennaich sandhiththen, avaludaiya sagodharar oru IAS adhigaari.",note:"A person → WHOSE."},
 {en:"The house, the roof of which is red, belongs to us.",ta:"சிவப்புக் கூரை கொண்ட அந்த வீடு எங்களுக்குச் சொந்தமானது.",tl:"Sivappuk koorai konda andha veedu engalukkuch sondhamaanadhu.",note:"A lifeless thing → OF WHICH in formal English."},
 {en:"The book, the cover of which is torn, is very old.",ta:"கிழிந்த அட்டையைக் கொண்ட அந்தப் புத்தகம் மிகவும் பழையது.",tl:"Kizhindha attaiyaik konda andhap puththagam migavum pazhaiyadhu.",note:"A lifeless thing → OF WHICH."},
 {en:"The lady whose bag was stolen has filed a complaint.",ta:"பை திருடப்பட்ட அந்தப் பெண்மணி புகார் அளித்துள்ளார்.",tl:"Pai thirudappatta andhap penmani pugaar aliththullaar.",note:"A person → WHOSE."}],

 s10:{
  en:"The tested error is almost always the REVERSE one — 'the man OF WHICH the son' instead of 'the man WHOSE son'. Students who learn 'whose is for people, of which is for things' sometimes over-apply it and start using 'of which' for people because it sounds more formal. Never do that. For things, 'whose' is now acceptable, but for people 'of which' never is.",
  ta:"சோதிக்கப்படும் தவறு எப்போதும் கிட்டத்தட்ட தலைகீழானதுதான் — 'the man WHOSE son'-க்குப் பதிலாக 'the man OF WHICH the son'. 'நபர்களுக்கு whose, பொருட்களுக்கு of which' என்று கற்றுக்கொள்ளும் மாணவர்கள் சில நேரங்களில் அதை அளவுக்கு அதிகமாகப் பயன்படுத்தி, அதிக முறையாகத் தோன்றுவதால் நபர்களுக்கும் 'of which' பயன்படுத்தத் தொடங்குகிறார்கள். ஒருபோதும் அப்படிச் செய்யாதீர்கள். பொருட்களுக்கு 'whose' இப்போது ஏற்கத்தக்கது, ஆனால் நபர்களுக்கு 'of which' ஒருபோதும் அல்ல.",
  tl:"Sodhikkappadum thavaru eppodhum kittaththatta thalaigeezhaanadhudhaan — 'the man OF WHICH the son'. Porutkalukku 'whose' ippodhu erkaththakkadhu, aanaal nabargalukku 'of which' orupodhum alla."},

 s11:{
  en:"PERSON → WHOSE, always. THING → OF WHICH in formal exam English.",
  ta:"நபர் → WHOSE, எப்போதும். பொருள் → முறையான தேர்வு ஆங்கிலத்தில் OF WHICH.",
  tl:"Nabar → WHOSE, eppodhum. Porul → muraiyaana thervu Aangilaththil OF WHICH.",
  vis:"      THE WHO FAMILY\n\n   ┌───────────────────────────────┐\n   │  WHO  ·  WHOM  ·  WHOSE       │\n   │      all for PEOPLE           │\n   └───────────────────────────────┘\n\n   the boy WHO won\n   the boy WHOM I met\n   the boy WHOSE father came\n\n   FOR LIFELESS THINGS:\n     the house, the roof OF WHICH is red\n\n   ⚠ THE TESTED ERROR IS THE REVERSE:\n     the man OF WHICH the son ...   ✘ NEVER\n     the man WHOSE son ...          ✔ ALWAYS\n\n   ⚠ 'WHOSE' vs 'WHO'S':\n     whose = belonging to whom\n     who's = who is"},

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

 }

 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>

   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){

 }
 if(i===6){

 }

 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>

    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
