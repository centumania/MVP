 s13:[
 "The rose smells ____ , and it is ____ than any ____ flower in the garden.|sweet-sweeter-other;sweetly-more sweeter-other;sweet-sweeter-—|0|'Smells' is linking → an adjective. No double comparative (Rule 95). Same group → OTHER (Rule 96).",
 "He works ____ , but he ____ earns enough, and the reason ____ ____ wages are low.|hard-hardly-is-that;hardly-hard-is-because;hard-hardly-is-because|0|HARD = with effort, HARDLY = almost not. 'The reason … is THAT' (Rule 91).",
 "She looks ____ , although she ____ not been well ____ .|beautiful-has-lately;beautifully-have-late;beautiful-have-lately|0|'Looks' is linking → an adjective. Singular → HAS. LATELY = recently.",
 "The milk turned ____ , and neither the fridge ____ the cooler ____ working.|sour-nor-was;sourly-or-were;sour-nor-were|0|'Turned' is linking → an adjective. NEITHER pairs with NOR (Rule 86). Nearest subject → WAS.",
 "He is ____ respected, and of the two officers he is ____ .|highly-the senior;high-the most senior;highly-the most senior|0|HIGHLY = degree. 'Of the two' → THE + comparative (Rule 94), and 'senior' is already comparative."],

 s14:{
  rule:"A linking verb is followed by an adjective; an action verb is followed by an adverb.",
  formula:"LINKING: be, seem, appear, look, feel, smell, taste,\n  sound, become, grow, turn, remain, stay, prove → ADJECTIVE\nACTION → ADVERB\nTEST: replace the verb with 'is'\nHARD/HARDLY · LATE/LATELY · NEAR/NEARLY · HIGH/HIGHLY are opposites",
  memory:"Replace the verb with 'is'. If it works, use an adjective.",
  ta:"Verb-ஐ 'is'-ஆ மாத்திப் பாருங்க. வேலை செஞ்சா பெயரடை போடுங்க.",
  tl:"Verb-ai 'is'-aa maaththip paarunga. Velai senjaa peyaradai podunga.",
  mistake:"Writing 'smells sweetly' and confusing 'hardly' with 'hard'.",
  exam:"SSC CGL / CHSL and Bank — the linking-verb error and the hard/hardly pair are both frequent."},

 s15:[
 {ta:"இப்போ நாம Adverbs பக்கம் வர்றோம். இந்த rule ரொம்ப முக்கியம், ஏன்னா இது நமக்கு பள்ளியில கத்துக்கொடுத்ததுக்கு எதிரா இருக்கும் மாதிரி தோணும்.",
  tl:"Ippo naama Adverbs pakkam varrom. Indha rule romba mukkiyam, yennaa idhu namakku palliyila kaththukkoduththadhukku edhiraa irukkum maadhiri thonum."},
 {ta:"நமக்கு சொல்லிக் கொடுத்தது — 'வினையடை (adverb) வினைச்சொல்லை விவரிக்கும்'. அதனால 'The flower smells SWEETLY' சரின்னு தோணும். ஆனா தப்பு! 'The flower smells SWEET' தான் சரி.",
  tl:"Namakku sollik koduththadhu — 'vinaiyadai (adverb) vinaicholai vivarikkum'. Adhanaala 'The flower smells SWEETLY' sarinnu thonum. Aanaa thappu! 'The flower smells SWEET' thaan sari."},
 {ta:"ஏன்? ஒரு நொடி யோசிங்க — 'sweet' எதை விவரிக்குது? மணப்பதையா, இல்ல பூவையா? பூவைத்தான்! பூ இனிமையா இருக்கு. பெயர்ச்சொல்லை விவரிக்கிறது பெயரடை. அதனால 'sweet'.",
  tl:"Yen? Oru nodi yosinga — 'sweet' edhai vivarikkudhu? Manappadhaiyaa, illa poovaiyaa? Poovaiththaan! Poo inimaiyaa irukku. Peyarcholai vivarikkiradhu peyaradai."},
 {ta:"இப்படிப்பட்ட வினைச்சொல்லை LINKING VERB அப்படின்னு சொல்லுவாங்க. பட்டியல் இதோ — be, seem, appear, look, feel, smell, taste, sound, become, grow, turn, remain, stay, prove. இதுக்கு அப்பறம் எப்பவும் பெயரடை.",
  tl:"Ippadippatta vinaicholai LINKING VERB appadinnu solluvaanga. Pattiyal idho — be, seem, appear, look, feel, smell, taste, sound, become, grow, turn, remain, stay, prove."},
 {ta:"ஒரு அருமையான சோதனை சொல்லுறேன் — 'IS சோதனை'. வினைச்சொல்லை 'is'-ஆ மாத்திப் பாருங்க. 'The flower smells sweet' → 'The flower IS sweet' — அர்த்தம் இருக்கா? இருக்கு! அப்படின்னா linking verb, பெயரடை போடுங்க. 'He smelled the flower carefully' → 'He IS the flower carefully' — அபத்தம்! அப்படின்னா action verb, வினையடை போடுங்க.",
  tl:"Oru arumaiyaana sodhanai solluren — 'IS sodhanai'. Vinaicholai 'is'-aa maaththip paarunga. 'The flower IS sweet' — arththam irukkaa? Irukku! Appadinnaa linking verb, peyaradai podunga."},
 {ta:"கடைசியா இன்னொரு பெரிய பொறி — -ly ஜோடிகள். இதுல 'hardly' அப்படிங்கிறது 'hard'-ஓட வலுவான வடிவம் இல்ல! 'HARD' = கடினமா, முயற்சியோட. 'HARDLY' = கிட்டத்தட்ட இல்ல! ரெண்டும் நேர் எதிரு. 'He works HARD' = கடினமா உழைக்கிறாரு. 'He HARDLY works' = அவரு வேலையே செய்யல! அதே மாதிரி LATE (தாமதம்) மற்றும் LATELY (சமீபத்தில), NEAR (அருகில) மற்றும் NEARLY (கிட்டத்தட்ட), HIGH (உயரம்) மற்றும் HIGHLY (அளவு).",
  tl:"Kadaisiyaa innoru periya pori — -ly jodigal. 'HARD' = kadinamaa. 'HARDLY' = kittaththatta illa! Rendum ner edhiru. 'He works HARD' vs 'He HARDLY works'. Adhe maadhiri LATE/LATELY, NEAR/NEARLY, HIGH/HIGHLY."}]},

/* ========== RULE 100 ========== */
{n:100,rc:"ADJ-06",d:"Hard",t:"The ORDER of Adjectives before a Noun",
 tam:"OSASCOMP — பல பெயரடைகளின் சரியான வரிசை",
 s1:{en:"When several adjectives describe one noun, they follow a fixed order: OPINION, SIZE, AGE, SHAPE, COLOUR, ORIGIN, MATERIAL, PURPOSE. Remember it as OSASCOMP.",
  ta:"பல பெயரடைகள் ஒரே பெயர்ச்சொல்லை விவரிக்கும்போது, அவை ஒரு நிலையான வரிசையைப் பின்பற்றுகின்றன: OPINION, SIZE, AGE, SHAPE, COLOUR, ORIGIN, MATERIAL, PURPOSE. அதை OSASCOMP என்று நினைவில் வையுங்கள்.",
  tl:"Pala peyaradaigal ore peyarcholai vivarikkumbodhu, avai oru nilaiyaana varisaiyaip pinpatrugindrana: OPINION, SIZE, AGE, SHAPE, COLOUR, ORIGIN, MATERIAL, PURPOSE. Adhai OSASCOMP endru ninaivil vaiyungal.",
  formula:"O S A S C O M P\n\n  Opinion   beautiful, ugly, lovely, nice\n  Size      big, small, tall, short, long\n  Age       old, new, young, ancient\n  Shape     round, square, flat, thin\n  Colour    red, blue, green, black\n  Origin    Indian, Chinese, French\n  Material  wooden, golden, silk, plastic\n  Purpose   sleeping (bag), writing (desk)\n\n  a beautiful  small  old  round  red\n  Indian  wooden  writing  desk"},

 s2:[
 {h:"Native speakers feel this order without knowing it",
  en:"'A big red ball' sounds right; 'a red big ball' sounds wrong — yet almost nobody can say why. The reason is the OSASCOMP order. Once you learn it, you can produce and check the order deliberately.",
  ta:"தாய்மொழிப் பேச்சாளர்கள் இந்த வரிசையை அறியாமலேயே உணர்கிறார்கள். 'A big red ball' சரியாக ஒலிக்கிறது; 'a red big ball' தவறாக ஒலிக்கிறது — இருந்தும் ஏன் என்று கிட்டத்தட்ட யாராலும் சொல்ல முடியாது. காரணம் OSASCOMP வரிசை. நீங்கள் அதைக் கற்றுக்கொண்டவுடன், வரிசையை வேண்டுமென்றே உருவாக்கவும் சரிபார்க்கவும் முடியும்.",
  tl:"Thaaymozhip pechaalargal indha varisaiyai ariyaamaleye unargiraargal. 'A big red ball' sariyaaga olikkiradhu; 'a red big ball' thavaraaga olikkiradhu. Kaaranam OSASCOMP varisai."},
 {h:"OPINION always comes first",
  en:"Opinion adjectives — beautiful, ugly, lovely, terrible, wonderful — are what YOU think. Facts follow. 'A beautiful old house', never 'an old beautiful house'. Opinion before fact is the strongest part of the rule.",
  ta:"OPINION எப்போதும் முதலில் வருகிறது. Opinion பெயரடைகள் — beautiful, ugly, lovely, terrible, wonderful — நீங்கள் நினைப்பது. உண்மைகள் பின்வருகின்றன. 'A beautiful old house', ஒருபோதும் 'an old beautiful house' அல்ல. உண்மைக்கு முன் கருத்து விதியின் வலுவான பகுதி.",
  tl:"OPINION eppodhum mudhalil varugiradhu. Opinion peyaradaigal — beautiful, ugly, lovely, terrible, wonderful — neengal ninaippadhu. Unmaigal pinvarugindrana. 'A beautiful old house', orupodhum 'an old beautiful house' alla."},
 {h:"Numbers come before all adjectives",
  en:"'Three beautiful old houses' — the number sits in front of everything. Determiners (a, the, my, these) come even before the number: 'my three beautiful old houses'.",
  ta:"எண்கள் அனைத்து பெயரடைகளுக்கும் முன் வருகின்றன. 'Three beautiful old houses' — எண் எல்லாவற்றுக்கும் முன்னால் அமர்கிறது. Determiner-கள் (a, the, my, these) எண்ணுக்கும் முன்னால் வருகின்றன: 'my three beautiful old houses'.",
  tl:"Engal anaiththu peyaradaigalukkum mun varugindrana. 'Three beautiful old houses' — en ellaavatrukkum munnaal amargiradhu. Determiner-gal (a, the, my, these) ennukkum munnaal varugindrana."},
 {h:"You rarely use more than three at once",
  en:"In real writing two or three adjectives is normal. Exams test the ORDER of two or three, not eight. So focus on the common sequences: opinion before size, size before age, age before colour, colour before material.",
  ta:"நீங்கள் ஒரே நேரத்தில் மூன்றுக்கு மேல் அரிதாகவே பயன்படுத்துவீர்கள். உண்மையான எழுத்தில் இரண்டு அல்லது மூன்று பெயரடைகள் சாதாரணம். தேர்வுகள் இரண்டு அல்லது மூன்றின் வரிசையைச் சோதிக்கின்றன, எட்டு அல்ல. எனவே பொதுவான வரிசைகளில் கவனம் செலுத்துங்கள்: அளவுக்கு முன் கருத்து, வயதுக்கு முன் அளவு, நிறத்திற்கு முன் வயது, பொருளுக்கு முன் நிறம்.",
  tl:"Neengal ore neraththil moondrukku mel aridhaagave payanpaduththuveergal. Thervugal irandu alladhu moondrin varisaiyaich sodhikkindrana, ettu alla."}],

 s3:[
 {h:"OSASCOMP",
  d:"   O  Opinion    beautiful · ugly · lovely\n   S  Size        big · small · tall · long\n   A  Age         old · new · young · ancient\n   S  Shape       round · square · flat · thin\n   C  Colour      red · blue · green · black\n   O  Origin      Indian · Chinese · French\n   M  Material    wooden · silk · golden · plastic\n   P  Purpose     sleeping (bag) · writing (desk)"},
 {h:"The full sequence",
  d:"   my   three   beautiful   small   old\n    ↑      ↑         ↑          ↑       ↑\n  determiner number  opinion   size    age\n\n   round    red    Indian   wooden   writing   desk\n     ↑       ↑        ↑        ↑         ↑        ↑\n   shape  colour   origin  material  purpose   NOUN"},
 {h:"The common exam pairs",
  d:"   OPINION before SIZE\n     a lovely big house      ✔\n     a big lovely house     ✘\n\n   SIZE before AGE\n     a big old house         ✔\n     an old big house        ✘\n\n   AGE before COLOUR\n     an old red car          ✔\n     a red old car           ✘\n\n   COLOUR before MATERIAL\n     a black leather bag     ✔\n     a leather black bag     ✘"}],

 s4:{
 wrong:["\"Adjective order does not matter as long as the meaning is clear.\" — Exams test it directly.",
  "\"'A red big ball' is acceptable.\" — Size comes before colour.",
  "\"'An old beautiful house' shows the age first.\" — Opinion always comes first.",
  "\"The number goes with the other adjectives.\" — The number comes before all of them."],
 right:["Learn OSASCOMP by heart.",
  "Opinion always comes first, before every fact.",
  "Determiners and numbers come before all adjectives.",
  "Focus on the common exam pairs: opinion/size, size/age, age/colour, colour/material."]},

 s5:[
 {en:"She bought a beautiful old wooden table.",ta:"அவர் ஒரு அழகான பழைய மரமேசையை வாங்கினார்.",tl:"Avar oru azhagaana pazhaiya maramesaiyai vaanginaar.",note:"Opinion → age → material."},
 {en:"He wore a nice big blue shirt to the party.",ta:"அவர் விருந்துக்கு ஒரு அழகான பெரிய நீல சட்டை அணிந்தார்.",tl:"Avar virundhukku oru azhagaana periya neela sattai anindhaar.",note:"Opinion → size → colour."},
 {en:"They live in a small old Indian house.",ta:"அவர்கள் ஒரு சிறிய பழைய இந்திய வீட்டில் வசிக்கிறார்கள்.",tl:"Avargal oru siriya pazhaiya Indhiya veettil vasikkiraargal.",note:"Size → age → origin."},
 {en:"I need a large round black plastic box.",ta:"எனக்கு ஒரு பெரிய வட்டமான கருப்பு பிளாஸ்டிக் பெட்டி வேண்டும்.",tl:"Enakku oru periya vattamaana karuppu plastic petti vendum.",note:"Size → shape → colour → material."},
 {en:"She owns three lovely small silk sarees.",ta:"அவரிடம் மூன்று அழகான சிறிய பட்டுப் புடவைகள் உள்ளன.",tl:"Avaridam moondru azhagaana siriya pattup pudavaigal ullana.",note:"Number → opinion → size → material."}],

 s9:[
 "Fill in the Blank|My grandmother still keeps a beautiful ____ wooden chest in her bedroom.|old;wooden old|0|Opinion → age → material: 'beautiful old wooden'.",
 "Find the Error|He arrived wearing (A) a red big (B) woollen sweater (C) that his mother had knitted (D).|A;B;C;D|1|Part B. Size comes before colour → 'a big red woollen sweater'.",
 "Sentence Improvement|She showed us a leather small black purse she had bought abroad.|a leather small black purse;a small black leather purse;a black small leather purse|1|Size → colour → material.",
 "Fill in the Blank|They have restored a ____ ancient stone temple on the outskirts of the town.|huge;stone huge|0|Size comes before age.",
 "Find the Error|The museum displays (A) an old beautiful (B) Chinese painting (C) from the Ming period (D).|A;B;C;D|1|Part B. Opinion comes before age → 'a beautiful old Chinese painting'."],

 s10:{
  en:"You already know this rule by ear — 'a red big ball' sounds wrong to you even now. The problem is that in exam conditions, under time pressure, the ear is unreliable. OSASCOMP gives you a mechanical check. The most tested pairs are opinion-before-size and size-before-colour.",
  ta:"நீங்கள் ஏற்கனவே இந்த விதியை காதால் அறிவீர்கள் — 'a red big ball' இப்போதும் உங்களுக்குத் தவறாக ஒலிக்கிறது. பிரச்சனை என்னவென்றால், தேர்வுச் சூழலில், நேர அழுத்தத்தின் கீழ், காது நம்பகமற்றது. OSASCOMP உங்களுக்கு ஒரு இயந்திரச் சரிபார்ப்பைத் தருகிறது. மிக அதிகமாகச் சோதிக்கப்படும் ஜோடிகள் அளவுக்கு முன் கருத்து மற்றும் நிறத்திற்கு முன் அளவு.",
  tl:"Neengal erkanave indha vidhiyai kaadhaal ariveergal — 'a red big ball' ippodhum ungalukkuth thavaraaga olikkiradhu. Pirachanai ennavendraal, thervuch soozhalil, nera azhuththaththin keezh, kaadhu nambagamatradhu."},

 s13:[
 "She bought a beautiful ____ wooden table, which is ____ than the one we saw.|old-better;wooden old-more better;old-more better|0|Opinion → age → material. No double comparative (Rule 95).",
 "He wore a nice ____ blue shirt, and he looked ____ in it.|big-smart;blue big-smartly;big-smartly|0|Opinion → size → colour. 'Looked' is linking → an adjective (Rule 99).",
 "They live in a small ____ Indian house, which is ____ than any ____ house here.|old-older-other;Indian old-elder-other;old-elder-other|0|Size → age → origin. Not family → OLDER (Rule 98). Same group → OTHER (Rule 96).",
 "She owns ____ lovely silk sarees, and neither of them ____ ever been worn.|three-has;lovely three-have;three-have|0|The number comes first. 'Neither of' is fixed singular → HAS (SVA Rule 50).",

 s14:{

  memory:"OSASCOMP. Opinion always comes first.",
  ta:"OSASCOMP. கருத்து (opinion) எப்பவும் முதல்ல.",

 s15:[
 {ta:"இந்த rule-ஓட ஒரு வேடிக்கையான விஷயம் — உங்களுக்கு இது ஏற்கனவே தெரியும்! நம்பலைன்னா ஒரு சோதனை பண்ணுங்க.",
  tl:"Indha rule-oda oru vedikkaiyaana vishayam — ungalukku idhu erkanave theriyum! Nambalainnaa oru sodhanai pannunga."},
 {ta:"'A big red ball' — சரியா தோணுது இல்லையா? இப்போ 'a red big ball' — தப்பா தோணுது! ஏன்? உங்களால சொல்ல முடியுமா? பெரும்பாலான ஆளுங்களால முடியாது. ஆனா காது சரியா கண்டுபிடிக்குது.",
  tl:"'A big red ball' — sariyaa thonudhu illaiyaa? Ippo 'a red big ball' — thappaa thonudhu! Yen? Ungalaala solla mudiyumaa? Perumbaalaana aalungalaala mudiyaadhu."},
 {ta:"அதுக்கு காரணம் ஒரு நிலையான வரிசை இருக்கு — OSASCOMP. Opinion, Size, Age, Shape, Colour, Origin, Material, Purpose. கருத்து, அளவு, வயது, வடிவம், நிறம், தோற்றம், பொருள், நோக்கம்.",
  tl:"Adhukku kaaranam oru nilaiyaana varisai irukku — OSASCOMP. Opinion, Size, Age, Shape, Colour, Origin, Material, Purpose."},
 {ta:"முழு உதாரணம் — 'my three beautiful small old round red Indian wooden writing desk'. இப்படி எட்டு பெயரடையும் ஒண்ணா யாரும் பயன்படுத்த மாட்டாங்க, ஆனா வரிசையை புரிஞ்சுக்க இது நல்லது.",
  tl:"Muzhu udhaaranam — 'my three beautiful small old round red Indian wooden writing desk'. Ippadi ettu peyaradaiyum onnaa yaarum payanpaduththa maattaanga, aanaa varisaiyai purinjukka idhu nalladhu."},
 {ta:"மிக முக்கியமான விதி — OPINION எப்பவும் முதல்ல! ஏன்? ஏன்னா opinion அப்படிங்கிறது நீங்க நினைக்கிறது, அது உண்மை இல்ல. உண்மைகள் (size, age, colour) அதுக்கு அப்பறம் வரும். 'A BEAUTIFUL old house' சரி. 'An old beautiful house' தப்பு.",
  tl:"Miga mukkiyamaana vidhi — OPINION eppavum mudhalla! Yennaa opinion appadingiradhu neenga ninaikkiradhu, adhu unmai illa. Unmaigal (size, age, colour) adhukku apparam varum."},
 {ta:"தேர்வுல எட்டு பெயரடையும் சேர்த்து கேட்க மாட்டாங்க. ரெண்டு அல்லது மூணுதான். அதனால இந்த நாலு ஜோடியை மட்டும் நல்லா கவனிங்க: OPINION-க்கு முன்னாடி SIZE வராது. SIZE-க்கு முன்னாடி AGE வராது. AGE-க்கு முன்னாடி COLOUR வராது. COLOUR-க்கு முன்னாடி MATERIAL வராது. இந்த நாலு போதும். மேலும் எண் (three) மற்றும் சுட்டுச்சொல் (my, the) எல்லாத்துக்கும் முன்னாடி வரும்.",
  tl:"Thervula ettu peyaradaiyum serthu ketka maattaanga. Rendu alladhu moonu-dhaan. Indha naalu jodiyai mattum nallaa kavaninga: opinion<size, size<age, age<colour, colour<material."}]},

/* ========== RULE 101 ========== */
{n:101,rc:"ADV-02",d:"Hard",t:"MISPLACED Modifiers — put ONLY next to what it limits",
 tam:"Only · Even · Also — சரியான இடத்தில் வைக்க வேண்டும்",
 s1:{en:"Place ONLY, EVEN, ALSO, MERELY, NEARLY, ALMOST and JUST immediately BEFORE the word they limit. Moving the word changes the meaning of the whole sentence.",
  ta:"ONLY, EVEN, ALSO, MERELY, NEARLY, ALMOST மற்றும் JUST-ஐ அவை வரையறுக்கும் சொல்லுக்கு உடனடியாக முன் வையுங்கள். சொல்லை நகர்த்துவது முழு வாக்கியத்தின் பொருளையும் மாற்றுகிறது.",
  tl:"ONLY, EVEN, ALSO, MERELY, NEARLY, ALMOST matrum JUST-ai avai varaiyarukkum sollukku udanadiyaaga mun vaiyungal. Sollai nagarththuvadhu muzhu vaakkiyaththin porulaiyum maatrugiradhu.",
  formula:"ONLY  changes meaning by POSITION\n\n  ONLY he gave me a book yesterday.\n     — nobody else gave it\n  He ONLY gave me a book yesterday.\n     — he only gave, did not sell\n  He gave ONLY me a book yesterday.\n     — nobody else received it\n  He gave me ONLY a book yesterday.\n     — nothing but a book\n  He gave me a book ONLY yesterday.\n     — not on any other day\n\n⚠ FIVE POSITIONS. FIVE DIFFERENT MEANINGS."},

 s2:[
 {h:"The position IS the meaning",
  en:"'I only read the first page' means reading was all I did. 'I read only the first page' means the first page was all I read. Both are grammatical; only one says what you mean.",
  ta:"இடமே பொருள். 'I only read the first page' என்றால் படிப்பது மட்டுமே நான் செய்தது. 'I read only the first page' என்றால் முதல் பக்கம் மட்டுமே நான் படித்தது. இரண்டும் இலக்கண ரீதியாகச் சரி; ஒன்று மட்டுமே நீங்கள் சொல்ல நினைப்பதைச் சொல்கிறது.",
  tl:"Idame porul. 'I only read the first page' endraal padippadhu mattume naan seydhadhu. 'I read only the first page' endraal mudhal pakkam mattume naan padiththadhu."},
 {h:"In speech we place 'only' loosely",
  en:"Everyday speech tolerates 'I only came to help you' when we mean 'I came only to help you'. Written exam English does not. Place the modifier immediately before the word it limits.",
  ta:"பேச்சில் நாம் 'only'-ஐ தளர்வாக வைக்கிறோம். அன்றாடப் பேச்சு 'I came only to help you' என்று அர்த்தப்படுத்தும்போது 'I only came to help you' -ஐ பொறுத்துக்கொள்கிறது. எழுத்துத் தேர்வு ஆங்கிலம் பொறுக்காது. அது வரையறுக்கும் சொல்லுக்கு உடனடியாக முன் modifier-ஐ வையுங்கள்.",
  tl:"Pechil naam 'only'-ai thalarvaaga vaikkirom. Andraadap pechu 'I only came to help you'-ai poruththukkolgiradhu. Ezhuththuth thervu Aangilam porukkaadhu."},
 {h:"Dangling participles are the same problem",
  en:"'Walking down the road, a snake bit him' says the SNAKE was walking. It must be 'Walking down the road, he was bitten by a snake'. The opening phrase must describe the subject that follows it.",
  ta:"தொங்கும் participle-கள் அதே பிரச்சனை. 'Walking down the road, a snake bit him' பாம்பு நடந்து கொண்டிருந்தது என்று சொல்கிறது. அது 'Walking down the road, he was bitten by a snake' என்றுதான் இருக்க வேண்டும். தொடக்கத் தொடர் அதைத் தொடர்ந்து வரும் Subject-ஐ விவரிக்க வேண்டும்.",
  tl:"Thongum participle-gal adhe pirachanai. 'Walking down the road, a snake bit him' paambu nadandhu kondirundhadhu endru solgiradhu. Adhu 'Walking down the road, he was bitten by a snake' endrudhaan irukka vendum."},
 {h:"Adverbs of frequency go before the main verb",
  en:"ALWAYS, NEVER, OFTEN, SELDOM, USUALLY, RARELY sit before the main verb but after 'be' and after the first auxiliary. 'He ALWAYS comes late', 'He is ALWAYS late', 'He has ALWAYS come late'.",
  ta:"அதிர்வெண் வினையடைகள் முதன்மை வினைச்சொல்லுக்கு முன் செல்கின்றன. ALWAYS, NEVER, OFTEN, SELDOM, USUALLY, RARELY முதன்மை வினைச்சொல்லுக்கு முன் அமர்கின்றன ஆனால் 'be'-க்குப் பிறகும் முதல் துணை வினைச்சொல்லுக்குப் பிறகும். 'He ALWAYS comes late', 'He is ALWAYS late', 'He has ALWAYS come late'.",
  tl:"Adhirven vinaiyadaigal mudhanmai vinaicholukku mun selgindrana. 'He ALWAYS comes late', 'He is ALWAYS late', 'He has ALWAYS come late'."}],

 s3:[
 {h:"Five positions, five meanings",
  d:"   ONLY he gave me a book yesterday.\n     → nobody else GAVE it\n\n   He ONLY gave me a book yesterday.\n     → he only GAVE, did not sell\n\n   He gave ONLY me a book yesterday.\n     → nobody else RECEIVED it\n\n   He gave me ONLY a book yesterday.\n     → nothing but a BOOK\n\n   He gave me a book ONLY yesterday.\n     → not on any other DAY"},
 {h:"The rule in one line",
  d:"   PUT THE MODIFIER IMMEDIATELY BEFORE\n   THE WORD IT LIMITS.\n\n   ONLY · EVEN · ALSO · MERELY\n   NEARLY · ALMOST · JUST\n\n   ✘ I only read the first page.\n      (if you mean the page)\n   ✔ I read only the first page."},
 {h:"Dangling participles",
  d:"   ✘ Walking down the road, a snake bit him.\n        who was walking? the SNAKE!\n\n   ✔ Walking down the road, HE was bitten\n     by a snake.\n\n   ⚠ THE OPENING PHRASE MUST DESCRIBE\n     THE SUBJECT THAT FOLLOWS IT.\n\n   ADVERBS OF FREQUENCY:\n     before the main verb  — He ALWAYS comes.\n     after 'be'            — He is ALWAYS late.\n     after the 1st auxiliary — He has ALWAYS come."}],

 s4:{
 wrong:["\"'Only' can go anywhere as long as the meaning is clear.\" — Its position IS the meaning.",
  "\"'I only came to help you' is normal English.\" — In exams it must be 'I came only to help you'.",
  "\"'Walking down the road, a snake bit him' is fine.\" — It says the snake was walking.",
  "\"Frequency adverbs go at the end.\" — They go before the main verb."],
 right:["Place 'only' immediately before the word it limits.",
  "Read the sentence back and ask what 'only' is actually limiting.",
  "Make the opening participle phrase describe the subject that follows.",
  "Put frequency adverbs before the main verb, after 'be' and after the first auxiliary."]},

 s5:[
 {en:"He gave me only a book, nothing else.",ta:"அவர் எனக்கு ஒரு புத்தகம் மட்டுமே கொடுத்தார், வேறு எதுவும் இல்லை.",tl:"Avar enakku oru puththagam mattume koduththaar, veru edhuvum illai.",note:"'Only' limits 'a book'."},
 {en:"Only he gave me a book; nobody else did.",ta:"அவர் மட்டுமே எனக்குப் புத்தகம் கொடுத்தார்; வேறு யாரும் இல்லை.",tl:"Avar mattume enakkup puththagam koduththaar; veru yaarum illai.",note:"'Only' limits 'he'."},
 {en:"I read only the first page of the book.",ta:"நான் புத்தகத்தின் முதல் பக்கத்தை மட்டுமே படித்தேன்.",tl:"Naan puththagaththin mudhal pakkaththai mattume padiththen.",note:"'Only' limits 'the first page'."},
 {en:"Walking down the road, he was bitten by a snake.",ta:"சாலையில் நடந்து கொண்டிருந்தபோது அவரை ஒரு பாம்பு கடித்தது.",tl:"Saalaiyil nadandhu kondirundhabodhu avarai oru paambu kadiththadhu.",note:"The opening phrase describes 'he', not the snake."},
 {en:"He has always come late to the office.",ta:"அவர் எப்போதும் அலுவலகத்திற்கு தாமதமாகவே வந்திருக்கிறார்.",tl:"Avar eppodhum aluvalagaththirku thaamadhamaagave vandhirukkiraar.",note:"'Always' comes after the first auxiliary."}],

 s8:[

 "I only read the first page of the book.|I read only the first page of the book.|'Only' must sit before 'the first page'.",
 "Walking down the road, a snake bit him.|Walking down the road, he was bitten by a snake.|The opening phrase must describe the subject.",
 "He always has come late to the office.|He has always come late to the office.|'Always' comes after the first auxiliary.",

 s9:[
 "Fill in the Blank|He gave me ____ a small notebook, not the reference material I had asked for.|only;merely only|0|'Only' must limit 'a small notebook'.",
 "Find the Error|Walking along the (A) riverbank in the evening (B), a large snake (C) suddenly bit him (D).|A;B;C;D|2|Part C. The opening phrase must describe the person, not the snake.",
 "Sentence Improvement|He only reads the newspaper in the morning and never touches it again all day.|He only reads;He reads only;Only he reads|1|'Only' should limit 'in the morning' — the corrected form places it after the verb.",

 s10:{
  en:"'Only' is the most powerful little word in English grammar because moving it three words changes the entire claim. Everyday speech is loose about this, so the exam version feels stiff. The related trap is the dangling participle — 'Walking down the road, a snake bit him' passes unnoticed because the meaning is obvious, but grammatically the snake is doing the walking.",
  ta:"'Only' ஆங்கில இலக்கணத்தில் மிகச் சக்திவாய்ந்த சிறிய சொல், ஏனெனில் அதை மூன்று சொற்கள் நகர்த்துவது முழு கூற்றையும் மாற்றுகிறது. அன்றாடப் பேச்சு இதைப் பற்றி தளர்வானது, எனவே தேர்வுப் பதிப்பு இறுக்கமாக உணரப்படுகிறது. தொடர்புடைய பொறி தொங்கும் participle — 'Walking down the road, a snake bit him' கவனிக்கப்படாமல் கடந்து செல்கிறது, ஏனெனில் பொருள் தெளிவானது, ஆனால் இலக்கண ரீதியாக பாம்புதான் நடந்து கொண்டிருக்கிறது.",
  tl:"'Only' Aangila ilakkanaththil migach sakthivaayndha siriya sol, yenenil adhai moondru sorkal nagarththuvadhu muzhu kootraiyum maatrugiradhu. Andraadap pechu idhaip patri thalarvaanadhu."},

 s11:{
  en:"PUT THE MODIFIER IMMEDIATELY BEFORE THE WORD IT LIMITS.",
  ta:"Modifier-ஐ அது வரையறுக்கும் சொல்லுக்கு உடனடியாக முன் வையுங்கள்.",
  tl:"Modifier-ai adhu varaiyarukkum sollukku udanadiyaaga mun vaiyungal.",
  vis:"      ONE WORD, FIVE MEANINGS\n\n   ONLY he gave me a book yesterday.\n      → nobody else GAVE it\n   He ONLY gave me a book yesterday.\n      → he only GAVE, did not sell\n   He gave ONLY me a book yesterday.\n      → nobody else RECEIVED it\n   He gave me ONLY a book yesterday.\n      → nothing but a BOOK\n   He gave me a book ONLY yesterday.\n      → not on any other DAY\n\n   THE FAMILY: only · even · also · merely\n                nearly · almost · just\n\n   ⚠ DANGLING PARTICIPLE:\n     ✘ Walking down the road, a snake bit him.\n     ✔ Walking down the road, HE was bitten.\n\n   ⚠ FREQUENCY ADVERBS:\n     before the main verb · after 'be'\n     after the first auxiliary"},

 s13:[
 "He gave me ____ a book, and it was ____ than any ____ gift I received.|only-better-other;only gave-more better-other;only-better-—|0|'Only' limits 'a book'. No double comparative (Rule 95). Same group → OTHER (Rule 96).",

 s14:{
  rule:"Place only, even, also, merely, nearly and almost immediately before the word they limit.",
  formula:"ONLY changes meaning by position — five slots, five meanings\nOpening participle phrase must describe the subject that follows\nFrequency adverbs: before the main verb, after 'be',\n  after the first auxiliary",
  memory:"Put the modifier immediately before the word it limits.",
  ta:"எந்த வார்த்தையை வரையறுக்குதோ, அதுக்கு உடனே முன்னாடி வையுங்க.",
  tl:"Endha vaarththaiyai varaiyarukkudho, adhukku udane munnaadi vaiyunga.",
  mistake:"Writing 'I only read the first page' and 'Walking down the road, a snake bit him'.",
  exam:"SSC CGL / CHSL and Bank — 'only' placement is a repeated Sentence Improvement item."},

 s15:[
 {ta:"இந்த rule ஆங்கிலத்துல ரொம்ப சக்திவாய்ந்த ஒண்ணு. ஒரே ஒரு வார்த்தையை நகர்த்துனா, முழு வாக்கியத்தோட அர்த்தமும் மாறிடும்!",
  tl:"Indha rule Aangilaththula romba sakthivaayndha onnu. Ore oru vaarththaiyai nagarththunaa, muzhu vaakkiyaththoda arththamum maaridum!"},
 {ta:"'Only' -ஐ வெச்சு பாருங்க. ஐந்து இடத்துல வெக்கலாம், ஐந்து வேற வேற அர்த்தம் வரும்!",
  tl:"'Only'-ai vechu paarunga. Aindhu idaththula vekkalaam, aindhu veru veru arththam varum!"},
 {ta:"'ONLY he gave me a book' — அவரு மட்டும்தான் கொடுத்தாரு, வேற யாரும் இல்ல. 'He ONLY gave me a book' — அவரு கொடுத்தார் மட்டும், விக்கல. 'He gave ONLY me a book' — எனக்கு மட்டும்தான் கொடுத்தாரு, வேற யாருக்கும் இல்ல.",
  tl:"'ONLY he gave me a book' — avaru mattum-dhaan koduththaaru. 'He ONLY gave me a book' — avaru koduththaar mattum, vikkala. 'He gave ONLY me a book' — enakku mattum-dhaan koduththaaru."},
 {ta:"'He gave me ONLY a book' — புத்தகம் மட்டும்தான், வேற எதுவும் இல்ல. 'He gave me a book ONLY yesterday' — நேத்து மட்டும்தான், வேற நாள் இல்ல. பாத்தீங்களா? ஒரே வார்த்தை, ஐந்து இடம், ஐந்து அர்த்தம்!",
  tl:"'He gave me ONLY a book' — puththagam mattum-dhaan. 'He gave me a book ONLY yesterday' — nethu mattum-dhaan. Paaththeengalaa? Ore vaarththai, aindhu idam, aindhu arththam!"},
 {ta:"பேச்சுல நாம 'only' -ஐ எங்கயோ போட்டுடுவோம், அர்த்தம் புரிஞ்சா போதும். ஆனா எழுத்துத் தேர்வுல அப்படி இல்ல. விதி ஒரு வரி — 'எந்த வார்த்தையை வரையறுக்குதோ, அதுக்கு உடனே முன்னாடி வையுங்க'. Only, even, also, merely, nearly, almost, just — இதெல்லாத்துக்கும் அதே விதி.",
  tl:"Pechula naama 'only'-ai engayo pottuduvom. Aanaa ezhuththuth thervula appadi illa. Vidhi oru vari — 'endha vaarththaiyai varaiyarukkudho, adhukku udane munnaadi vaiyunga'."},
 {ta:"கடைசியா ஒரு தொடர்புடைய பொறி — தொங்கும் participle. 'Walking down the road, a snake bit him.' அர்த்தம் புரியுது இல்ல? ஆனா இலக்கணப்படி பாருங்க — 'Walking down the road' யாரை விவரிக்குது? அடுத்து வர்ற subject-ஐ! அடுத்து என்ன வருது? 'A snake'! அப்படின்னா பாம்பு சாலையில நடந்துச்சு! சரியான வடிவம் — 'Walking down the road, HE was bitten by a snake.' தொடக்கத் தொடர் அடுத்து வர்ற subject-ஐ விவரிக்கணும்.",
  tl:"Kadaisiyaa oru thodarpudaiya pori — thongum participle. 'Walking down the road, a snake bit him.' Ilakkanappadi paarunga — 'Walking down the road' yaarai vivarikkudhu? Aduththu varra subject-ai! 'A snake'! Sariyaana vadivam — 'Walking down the road, HE was bitten by a snake.'"}]},

/* ========== RULE 102 ========== */
{n:102,rc:"ADV-03",d:"Hard",t:"NEGATIVE Adverbs take NO second negative and cause INVERSION",
 tam:"Hardly · Scarcely · Seldom · Rarely — எதிர்மறை ஏற்கனவே உள்ளது",
 s1:{en:"HARDLY, SCARCELY, BARELY, SELDOM, RARELY, NEVER and NOWHERE are already NEGATIVE. Never add 'not' or 'no'. When any of them BEGINS a sentence, the auxiliary comes before the subject.",
  ta:"HARDLY, SCARCELY, BARELY, SELDOM, RARELY, NEVER மற்றும் NOWHERE ஏற்கனவே எதிர்மறையானவை. ஒருபோதும் 'not' அல்லது 'no' சேர்க்காதீர்கள். அவற்றில் ஏதேனும் ஒன்று ஒரு வாக்கியத்தைத் தொடங்கும்போது, துணை வினைச்சொல் Subject-க்கு முன் வருகிறது.",
  tl:"HARDLY, SCARCELY, BARELY, SELDOM, RARELY, NEVER matrum NOWHERE erkanave edhirmaraiyaanavai. Orupodhum 'not' alladhu 'no' serkkaadheergal. Avatril edhenum ondru oru vaakkiyaththaith thodangumbodhu, thunai vinaichol Subject-kku mun varugiradhu.",
  formula:"ALREADY NEGATIVE — no second negative\n\n  He HARDLY works.        ✔\n  He does NOT hardly work. ✘\n  I SELDOM go there.      ✔\n  I do NOT seldom go there. ✘\n\nAT THE START → INVERSION\n\n  HARDLY had he arrived WHEN it rained.\n  SELDOM DOES he visit us.\n  NEVER HAVE I seen such a sight.\n  NO SOONER had he left THAN it began."},

 s2:[
 {h:"The negative is inside the word",
  en:"'Hardly' means 'almost not'. 'Seldom' means 'not often'. 'Never' means 'not ever'. Adding another negative cancels it — 'He does not hardly work' would mean he does work.",
  ta:"எதிர்மறை சொல்லுக்குள் இருக்கிறது. 'Hardly' என்றால் 'கிட்டத்தட்ட இல்லை'. 'Seldom' என்றால் 'அடிக்கடி இல்லை'. 'Never' என்றால் 'எப்போதும் இல்லை'. இன்னொரு எதிர்மறை சேர்ப்பது அதை ரத்து செய்கிறது — 'He does not hardly work' அவர் வேலை செய்கிறார் என்று பொருள்படும்.",
  tl:"Edhirmarai sollukkul irukkiradhu. 'Hardly' endraal 'kittaththatta illai'. 'Seldom' endraal 'adikkadi illai'. Innoru edhirmarai serppadhu adhai raththu seygiradhu."},
 {h:"At the start, the sentence turns into a question shape",
  en:"'Seldom he visits us' is wrong. It must be 'Seldom DOES HE visit us' — auxiliary before subject, exactly like a question. 'Never I have seen' must be 'Never HAVE I seen'.",
  ta:"தொடக்கத்தில், வாக்கியம் ஒரு கேள்வி வடிவமாக மாறுகிறது. 'Seldom he visits us' தவறு. அது 'Seldom DOES HE visit us' என்றுதான் இருக்க வேண்டும் — துணை வினைச்சொல் Subject-க்கு முன், சரியாக ஒரு கேள்வி போல. 'Never I have seen' 'Never HAVE I seen' என்று இருக்க வேண்டும்.",
  tl:"Thodakkaththil, vaakkiyam oru kelvi vadivamaaga maarugiradhu. 'Seldom he visits us' thavaru. Adhu 'Seldom DOES HE visit us' endrudhaan irukka vendum — thunai vinaichol Subject-kku mun."},
 {h:"HARDLY takes WHEN, NO SOONER takes THAN",
  en:"'HARDLY had he arrived WHEN it rained'. 'SCARCELY had we sat down WHEN it began'. 'NO SOONER had he left THAN the phone rang'. This is Conjunction Rule 86 seen from the adverb side.",
  ta:"HARDLY WHEN எடுக்கிறது, NO SOONER THAN எடுக்கிறது. 'HARDLY had he arrived WHEN it rained'. 'SCARCELY had we sat down WHEN it began'. 'NO SOONER had he left THAN the phone rang'. இது வினையடைப் பக்கத்திலிருந்து பார்க்கப்படும் Conjunction Rule 86.",
  tl:"HARDLY WHEN edukkiradhu, NO SOONER THAN edukkiradhu. 'HARDLY had he arrived WHEN it rained'. Idhu vinaiyadaip pakkaththilirundhu paarkkappadum Conjunction Rule 86."},
 {h:"The tense pattern with hardly and no sooner",
  en:"The first clause takes HAD + V3 and the second takes the simple past: 'Hardly HAD he ARRIVED when it BEGAN to rain'. The earlier action gets the past perfect — that is Tense Rule 54.",
  ta:"Hardly மற்றும் no sooner-உடன் கால அமைப்பு. முதல் clause HAD + V3 எடுக்கிறது, இரண்டாவது எளிய இறந்த காலம் எடுக்கிறது: 'Hardly HAD he ARRIVED when it BEGAN to rain'. முந்தைய செயலுக்கு past perfect கிடைக்கிறது — அது Tense Rule 54.",
  tl:"Hardly matrum no sooner-udan kaala amaippu. Mudhal clause HAD + V3 edukkiradhu, irandaavadhu eliya irandha kaalam. 'Hardly HAD he ARRIVED when it BEGAN to rain'."}],

 s3:[
 {h:"Already negative",
  d:"   HARDLY   =  almost not\n   SCARCELY =  almost not\n   BARELY   =  almost not\n   SELDOM   =  not often\n   RARELY   =  not often\n   NEVER    =  not ever\n   NOWHERE  =  not anywhere\n\n   ✘ does NOT hardly work\n   ✘ do NOT seldom go\n   ✔ hardly works · seldom go"},
 {h:"At the start → inversion",
  d:"   NORMAL:   He SELDOM visits us.\n   INVERTED: SELDOM DOES HE visit us.\n                    ↑    ↑\n              auxiliary subject\n\n   Never HAVE I seen such a sight.\n   Hardly HAD HE arrived when it rained.\n   Seldom DOES SHE speak in public.\n   Nowhere COULD WE find the file.\n\n   The shape is exactly like a QUESTION."},
 {h:"The fixed partners and tenses",
  d:"   HARDLY   ─────►  WHEN\n   SCARCELY ─────►  WHEN\n   NO SOONER─────►  THAN\n\n   TENSE PATTERN:\n     HAD + V3  ,  simple past\n\n   Hardly HAD he ARRIVED\n     when it BEGAN to rain.\n   No sooner HAD he LEFT\n     than the phone RANG.\n\n   (Conjunction Rule 86 · Tense Rule 54)"}],

 s4:{
 wrong:["\"'He does not hardly work' makes the negative stronger.\" — It cancels the negative.",
  "\"'Seldom he visits us' is fine at the start.\" — Sentence-initial negatives require inversion.",
  "\"'Hardly … than' sounds natural.\" — 'Hardly' pairs with 'when'.",
  "\"Inversion is only for questions.\" — Negative adverbs at the start force it too."],
 right:["Never add 'not' after hardly, scarcely, seldom, rarely or never.",
  "If a negative adverb starts the sentence, invert the auxiliary and subject.",
  "Hardly and scarcely take 'when'; no sooner takes 'than'.",
  "Use HAD + V3 in the first clause and the simple past in the second."]},

 s5:[
 {en:"He hardly works on Sundays at all.",ta:"அவர் ஞாயிற்றுக்கிழமைகளில் வேலையே செய்வதில்லை.",tl:"Avar gnaayitrukkizhamaigalil velaiye seyvadhillai.",note:"'Hardly' is already negative — no 'not'."},
 {en:"Seldom does he visit his old friends.",ta:"அவர் தன் பழைய நண்பர்களை அரிதாகவே சந்திக்கிறார்.",tl:"Avar than pazhaiya nanbargalai aridhaagave sandhikkiraar.",note:"'Seldom' at the start → inversion DOES HE."},
 {en:"Never have I seen such a beautiful sight.",ta:"இவ்வளவு அழகான காட்சியை நான் ஒருபோதும் பார்த்ததில்லை.",tl:"Ivvalavu azhagaana kaatchiyai naan orupodhum paarththadhillai.",note:"'Never' at the start → inversion HAVE I."},
 {en:"Hardly had he arrived when it began to rain.",ta:"அவர் வந்தவுடனேயே மழை பெய்யத் தொடங்கியது.",tl:"Avar vandhavudaneye mazhai peyyath thodangiyadhu.",note:"HARDLY … WHEN, with HAD + V3 then the simple past."},
 {en:"No sooner had he left than the phone rang.",ta:"அவர் கிளம்பியவுடனேயே தொலைபேசி ஒலித்தது.",tl:"Avar kilambiyavudaneye tholaipesi oliththadhu.",note:"NO SOONER … THAN, with HAD + V3 then the simple past."}],

 s7:[
 "He ____ works on Sundays at all.|hardly|Easy|Already negative — no 'not'.",
 "Seldom ____ he visit his old friends.|does|Easy|Inversion after 'seldom'.",
 "Never ____ I seen such a sight.|have|Easy|Inversion after 'never'.",
 "Hardly had he arrived ____ it rained.|when|Medium|HARDLY pairs with WHEN.",
 "No sooner had he left ____ the phone rang.|than|Medium|NO SOONER pairs with THAN.",
 "Rarely ____ she speak in public now.|does|Medium|Inversion after 'rarely'.",
 "Scarcely had we sat down ____ it began.|when|Medium|SCARCELY pairs with WHEN.",
 "Nowhere ____ we find the missing file.|could|Hard|Inversion after 'nowhere'.",
 "Hardly ____ he finished when the bell rang.|had|Hard|HAD + V3 in the first clause.",
 "He ____ ever visits us these days.|hardly|Hard|Already negative.",
 "Seldom ____ they gone abroad together.|have|Hard|Inversion after 'seldom'.",
 "No sooner ____ the bell rung than we ran.|had|Expert|HAD + V3 in the first clause.",
 "Never ____ he been late to a class.|has|Expert|Inversion after 'never'.",
 "Barely ____ she spoken when he interrupted.|had|Expert|HAD + V3 in the first clause.",
 "Rarely ____ such a chance come again.|will|Expert|Inversion after 'rarely'."],

 s8:[
 "He does not hardly work on Sundays.|He hardly works on Sundays.|'Hardly' is already negative.",
 "Seldom he visits his old friends.|Seldom does he visit his old friends.|A sentence-initial negative requires inversion.",
 "Never I have seen such a beautiful sight.|Never have I seen such a beautiful sight.|A sentence-initial negative requires inversion.",
 "Hardly had he arrived than it began to rain.|Hardly had he arrived when it began to rain.|'Hardly' pairs with 'when'.",
 "No sooner had he left when the phone rang.|No sooner had he left than the phone rang.|'No sooner' pairs with 'than'.",
 "Rarely she does not speak in public now.|Rarely does she speak in public now.|'Rarely' is already negative and requires inversion.",
 "Scarcely we had sat down when it began.|Scarcely had we sat down when it began.|A sentence-initial negative requires inversion.",
 "Nowhere we could find the missing file.|Nowhere could we find the missing file.|A sentence-initial negative requires inversion.",
 "Hardly he had finished when the bell rang.|Hardly had he finished when the bell rang.|A sentence-initial negative requires inversion.",
 "He does not never visit us these days.|He never visits us these days.|'Never' is already negative."],

 s9:[
 "Fill in the Blank|Seldom ____ such an opportunity present itself to a young officer these days.|it does;does|1|A sentence-initial negative requires inversion.",
 "Find the Error|Hardly had the meeting (A) started than the (B) power supply failed (C) in the entire building (D).|A;B;C;D|1|Part B. 'Hardly' pairs with 'when'.",
 "Sentence Improvement|Never I have come across a more carefully prepared report in my entire career.|Never I have;Never have I;I never have|1|A sentence-initial negative requires inversion.",
 "Fill in the Blank|No sooner ____ the results announced than the students began celebrating loudly.|were;had been|1|The passive with 'no sooner' takes HAD BEEN.",
 "Find the Error|He does not hardly (A) attend any of the (B) evening classes (C) these days (D).|A;B;C;D|0|Part A. 'Hardly' is already negative → 'He hardly attends'."],

 s10:{
  en:"Two errors ride together here. The double negative — 'does not hardly' — happens because a negative adverb feels weak on its own. The inversion is missed because it looks like a question, and students think questions need a question mark. Both are tested in the same sentence, so check the negative AND the word order.",
  ta:"இரண்டு தவறுகள் இங்கே ஒன்றாகப் பயணிக்கின்றன. இரட்டை எதிர்மறை — 'does not hardly' — நிகழ்கிறது, ஏனெனில் ஒரு எதிர்மறை வினையடை தனியாக பலவீனமாக உணரப்படுகிறது. தலைகீழாக்கம் தவறவிடப்படுகிறது, ஏனெனில் அது ஒரு கேள்வி போலத் தெரிகிறது, மாணவர்கள் கேள்விகளுக்கு கேள்விக்குறி தேவை என்று நினைக்கிறார்கள். இரண்டும் ஒரே வாக்கியத்தில் சோதிக்கப்படுகின்றன, எனவே எதிர்மறையையும் சொல் வரிசையையும் சரிபாருங்கள்.",
  tl:"Irandu thavarugal inge ondraagap payanikkindrana. Irattai edhirmarai — 'does not hardly'. Thalaigeezhaakkam thavaravidappadugiradhu, yenenil adhu oru kelvi polath therigiradhu."},

 s11:{
  en:"NEGATIVE ADVERBS ARE ALREADY NEGATIVE. At the start, invert like a question.",
  ta:"எதிர்மறை வினையடைகள் ஏற்கனவே எதிர்மறையானவை. தொடக்கத்தில், ஒரு கேள்வி போல தலைகீழாக்குங்கள்.",
  tl:"Edhirmarai vinaiyadaigal erkanave edhirmaraiyaanavai. Thodakkaththil, oru kelvi pola thalaigeezhaakkungal.",
  vis:"      ALREADY NEGATIVE\n\n   HARDLY · SCARCELY · BARELY\n   SELDOM · RARELY · NEVER · NOWHERE\n\n   ✘ does NOT hardly work\n   ✔ hardly works\n\n   ⚠ AT THE START → INVERSION\n\n   He SELDOM visits us.\n        ↓\n   SELDOM DOES HE visit us.\n           ↑     ↑\n      auxiliary subject   (question shape)\n\n   NEVER HAVE I seen ...\n   HARDLY HAD HE arrived ...\n   NOWHERE COULD WE find ...\n\n   ⚠ FIXED PARTNERS:\n     HARDLY / SCARCELY ──► WHEN\n     NO SOONER ─────────► THAN\n\n   ⚠ TENSE: HAD + V3 , then simple past"},

 s13:[
 "Hardly ____ he arrived ____ it began to rain, and he ____ no umbrella.|had-when-had;did-than-had;had-than-had|0|Inversion → HAD HE. HARDLY pairs with WHEN (Rule 86). Past → HAD.",
 "Seldom ____ he visit us, and neither his wife ____ his children ____ come either.|does-nor-do;he does-or-does;does-nor-does|0|Inversion → DOES HE. NEITHER pairs with NOR (Rule 86). Nearest subject 'children' → DO.",
 "Never ____ I seen ____ a beautiful sight, and it was ____ lovely that I stayed an hour.|have-such-so;I have-so-such;have-so-such|0|Inversion → HAVE I. SUCH before a noun phrase, SO before an adjective (Rule 93).",
 "No sooner ____ the results announced ____ the students began ____ loudly.|were-than-celebrating;had-when-to celebrate;were-when-celebrating|0|Passive → WERE announced. NO SOONER pairs with THAN. 'Began' takes either form; celebrating fits.",
 "He ____ works, and the reason ____ ____ he is not so ____ as he used to be.|hardly-is-that-strong;does not hardly-is-because-strong;hardly-is-because-stronger|0|'Hardly' is already negative. 'The reason … is THAT' (Rule 91). 'Not so … as' takes the positive degree (Rule 94)."],

 s14:{
  rule:"Hardly, scarcely, seldom, rarely and never are already negative and force inversion when they begin a sentence.",
  formula:"Never add 'not' after hardly / scarcely / seldom / rarely / never\nAT THE START → auxiliary before subject (question shape)\nHARDLY / SCARCELY ──► WHEN\nNO SOONER ─────────► THAN\nTENSE: HAD + V3, then simple past",
  memory:"Already negative. At the start, invert like a question.",
  ta:"ஏற்கனவே எதிர்மறை. ஆரம்பத்துல வந்தா கேள்வி மாதிரி தலைகீழ்.",
  tl:"Erkanave edhirmarai. Aarambaththula vandhaa kelvi maadhiri thalaigeezh.",
  mistake:"Writing 'does not hardly work' and 'Seldom he visits us'.",
  exam:"SSC CGL / CHSL, CDS and Bank — inversion after a sentence-initial negative is a repeated item."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு விஷயம் சேர்ந்து வரும், ரெண்டுமே SSC-ல அடிக்கடி கேட்கப்படுது.",
  tl:"Indha rule-la rendu vishayam serndhu varum, rendume SSC-la adikkadi ketkappadudhu."},
 {ta:"முதல் விஷயம் — HARDLY, SCARCELY, BARELY, SELDOM, RARELY, NEVER, NOWHERE. இதெல்லாத்துலயும் ஏற்கனவே எதிர்மறை இருக்கு! 'Hardly' = கிட்டத்தட்ட இல்ல. 'Seldom' = அடிக்கடி இல்ல. 'Never' = எப்பவும் இல்ல.",
  tl:"Mudhal vishayam — HARDLY, SCARCELY, BARELY, SELDOM, RARELY, NEVER, NOWHERE. Idhellaaththulayum erkanave edhirmarai irukku!"},
 {ta:"அதனால 'He does NOT HARDLY work' அப்படின்னு எழுதக்கூடாது! அது இரட்டை எதிர்மறை. 'He HARDLY works' தான் சரி. இது நீங்க Rule 89-ல 'lest'-ல பார்த்த அதே கொள்கை — வார்த்தைக்குள்ளேயே எதிர்மறை இருக்கு.",
  tl:"Adhanaala 'He does NOT HARDLY work' appadinnu ezhudhakkoodaadhu! Adhu irattai edhirmarai. 'He HARDLY works' thaan sari. Idhu Rule 89-la 'lest'-la paarththa adhe kolgai."},
 {ta:"ரெண்டாவது விஷயம் — தலைகீழாக்கம். இது ரொம்ப முக்கியம். இந்த எதிர்மறை வினையடை வாக்கியத்தோட ஆரம்பத்துல வந்தா, துணை வினைச்சொல் subject-க்கு முன்னாடி வரும்!",
  tl:"Randaavadhu vishayam — thalaigeezhaakkam. Idhu romba mukkiyam. Indha edhirmarai vinaiyadai vaakkiyaththoda aarambaththula vandhaa, thunai vinaichol subject-kku munnaadi varum!"},
 {ta:"சாதாரண வடிவம் — 'He SELDOM visits us.' தலைகீழ் வடிவம் — 'SELDOM DOES HE visit us.' பாருங்க — 'does' முன்னாடி, 'he' பின்னாடி! கேள்வி மாதிரியே இருக்கு, ஆனா கேள்வி இல்ல. 'Never HAVE I seen', 'Hardly HAD HE arrived', 'Nowhere COULD WE find'.",
  tl:"Saadhaarana vadivam — 'He SELDOM visits us.' Thalaigeezh vadivam — 'SELDOM DOES HE visit us.' Paarunga — 'does' munnaadi, 'he' pinnaadi! Kelvi maadhiriye irukku, aanaa kelvi illa."},
 {ta:"கடைசியா ஜோடி மற்றும் காலம். HARDLY மற்றும் SCARCELY -க்கு WHEN. NO SOONER -க்கு THAN. இது நீங்க Conjunction Rule 86-ல படிச்சது! மேலும் காலம் — முதல் clause-ல HAD + V3, ரெண்டாவதுல எளிய இறந்த காலம். 'Hardly HAD he ARRIVED when it BEGAN to rain.' இது Tense Rule 54 — முந்தைய செயலுக்கு past perfect. மூணு module-ல இருந்து மூணு விதி ஒரே வாக்கியத்துல!",
  tl:"Kadaisiyaa jodi matrum kaalam. HARDLY matrum SCARCELY-kku WHEN. NO SOONER-kku THAN. Idhu Conjunction Rule 86! Melum kaalam — mudhal clause-la HAD + V3, randaavadhula eliya irandha kaalam. Idhu Tense Rule 54!"}]},

/* ========== RULE 103 ========== */
{n:103,rc:"ADJ-07",d:"Medium",t:"QUANTIFIERS — MANY/MUCH, FEW/LITTLE, LESS/FEWER",
 tam:"Countable-க்கு many, few, fewer · Uncountable-க்கு much, little, less",
 s1:{en:"Use MANY, FEW, FEWER, NUMBER OF with COUNTABLE nouns. Use MUCH, LITTLE, LESS, AMOUNT OF with UNCOUNTABLE nouns. And note: A FEW means some, FEW means almost none.",
  ta:"எண்ணக்கூடிய பெயர்ச்சொற்களுடன் MANY, FEW, FEWER, NUMBER OF பயன்படுத்தவும். எண்ண முடியாத பெயர்ச்சொற்களுடன் MUCH, LITTLE, LESS, AMOUNT OF பயன்படுத்தவும். மேலும் கவனிக்கவும்: A FEW என்றால் சில, FEW என்றால் கிட்டத்தட்ட இல்லை.",
  tl:"Ennakkoodiya peyarchorkaludan MANY, FEW, FEWER, NUMBER OF payanpaduththavum. Enna mudiyaadha peyarchorkaludan MUCH, LITTLE, LESS, AMOUNT OF. Melum kavanikkavum: A FEW endraal sila, FEW endraal kittaththatta illai.",
  formula:"COUNTABLE          UNCOUNTABLE\n  many books         much water\n  few books          little water\n  fewer books        less water\n  a number of books  an amount of water\n\nTHE ARTICLE CHANGES THE MEANING\n\n  A FEW friends    = some (positive)\n  FEW friends      = almost none (negative)\n  A LITTLE water   = some (positive)\n  LITTLE water     = almost none (negative)"},

 s2:[
 {h:"Countable or uncountable?",
  en:"If you can put a number in front — one book, two books — it is countable. If you cannot — you cannot say 'two waters' meaning two amounts of water — it is uncountable. That single test decides the quantifier.",
  ta:"எண்ணக்கூடியதா, எண்ண முடியாததா? முன்னால் ஒரு எண்ணை வைக்க முடிந்தால் — one book, two books — அது எண்ணக்கூடியது. முடியாவிட்டால் — இரண்டு அளவு தண்ணீர் என்று அர்த்தப்படுத்த 'two waters' என்று சொல்ல முடியாது — அது எண்ண முடியாதது. அந்த ஒரே சோதனை quantifier-ஐத் தீர்மானிக்கிறது.",
  tl:"Ennakkoodiyadhaa, enna mudiyaadhadhaa? Munnaal oru ennai vaikka mudindhaal — one book, two books — adhu ennakkoodiyadhu. Mudiyaavittaal — adhu enna mudiyaadhadhu."},
 {h:"'A' turns a negative into a positive",
  en:"'I have FEW friends' is sad — almost none. 'I have A FEW friends' is fine — I have some. The tiny word 'a' flips the whole feeling of the sentence. Same for 'little' and 'a little'.",
  ta:"'A' ஒரு எதிர்மறையை நேர்மறையாக மாற்றுகிறது. 'I have FEW friends' சோகமானது — கிட்டத்தட்ட யாரும் இல்லை. 'I have A FEW friends' நன்றாக இருக்கிறது — எனக்கு சிலர் இருக்கிறார்கள். சிறிய சொல் 'a' வாக்கியத்தின் முழு உணர்வையும் புரட்டுகிறது. 'Little' மற்றும் 'a little'-க்கும் அதேதான்.",
  tl:"'A' oru edhirmaraiyai nermaraiyaaga maatrugiradhu. 'I have FEW friends' sogamaanadhu — kittaththatta yaarum illai. 'I have A FEW friends' nandraaga irukkiradhu — enakku silar irukkiraargal."},
 {h:"LESS versus FEWER is the most tested pair",
  en:"'FEWER students' — you can count students. 'LESS water' — you cannot count water. Shop signs saying 'ten items or less' are wrong; it should be 'ten items or fewer'. SSC tests this directly.",
  ta:"LESS மற்றும் FEWER மிக அதிகமாகச் சோதிக்கப்படும் ஜோடி. 'FEWER students' — மாணவர்களை எண்ண முடியும். 'LESS water' — தண்ணீரை எண்ண முடியாது. 'Ten items or less' என்று சொல்லும் கடை அறிவிப்புகள் தவறு; அது 'ten items or fewer' என்றுதான் இருக்க வேண்டும். SSC இதை நேரடியாகச் சோதிக்கிறது.",
  tl:"LESS matrum FEWER miga adhigamaaga sodhikkappadum jodi. 'FEWER students' — maanavargalai enna mudiyum. 'LESS water' — thanneerai enna mudiyaadhu."},
 {h:"'A number of' is plural, 'the number of' is singular",
  en:"'A NUMBER OF students ARE absent' — plural. 'THE NUMBER OF students IS rising' — singular. One article changes the verb. That is SVA Rule 43, seen from the quantifier side.",
  ta:"'A number of' பன்மை, 'the number of' ஒருமை. 'A NUMBER OF students ARE absent' — பன்மை. 'THE NUMBER OF students IS rising' — ஒருமை. ஒரு article வினைச்சொல்லை மாற்றுகிறது. அது quantifier பக்கத்திலிருந்து பார்க்கப்படும் SVA Rule 43.",
  tl:"'A number of' panmai, 'the number of' orumai. 'A NUMBER OF students ARE absent' — panmai. 'THE NUMBER OF students IS rising' — orumai. Adhu SVA Rule 43."}],

 s3:[
 {h:"Can you count it?",
  d:"   CAN YOU PUT A NUMBER IN FRONT?\n\n   one book, two books  → COUNTABLE\n     many · few · fewer · a number of\n\n   two waters?  ✘        → UNCOUNTABLE\n     much · little · less · an amount of\n\n   COUNTABLE:   books, students, chairs,\n                friends, mistakes, items\n   UNCOUNTABLE: water, milk, advice, furniture,\n                information, luggage, work, money"},
 {h:"The article flips the meaning",
  d:"   A FEW friends    →  😊 some, enough\n   FEW friends      →  😞 almost none\n\n   A LITTLE water   →  😊 some, enough\n   LITTLE water     →  😞 almost none\n\n   'I have A FEW friends.'  = I am fine.\n   'I have FEW friends.'    = I am lonely.\n\n   One letter changes the whole feeling."},
 {h:"LESS and FEWER · number of",
  d:"   FEWER + countable\n     FEWER students · FEWER mistakes\n   LESS  + uncountable\n     LESS water · LESS money · LESS time\n\n   ✘ 'ten items or less'\n   ✔ 'ten items or fewer'\n\n   ⚠ A NUMBER OF students ARE absent. (plural)\n   ⚠ THE NUMBER OF students IS rising. (singular)\n     (SVA Rule 43)"}],

 s4:{
 wrong:["\"'Less students' is normal English.\" — Students are countable, so 'fewer'.",
  "\"'Few' and 'a few' mean the same.\" — One is negative, the other positive.",
  "\"'Much books' is acceptable if there are many.\" — Books are countable, so 'many'.",
  "\"'A number of' and 'the number of' take the same verb.\" — One is plural, one singular."],
 right:["Test whether you can put a number in front of the noun.",
  "Countable → many, few, fewer. Uncountable → much, little, less.",
  "'A few' and 'a little' are positive; 'few' and 'little' are negative.",
  "'A number of' takes a plural verb; 'the number of' takes a singular verb."]},

 s5:[
 {en:"There are fewer students in the class this year.",ta:"இந்த ஆண்டு வகுப்பில் குறைவான மாணவர்கள் உள்ளனர்.",tl:"Indha aandu vaguppil kuraivaana maanavargal ullanar.",note:"Students are countable → FEWER."},
 {en:"There is less water in the tank today.",ta:"இன்று தொட்டியில் குறைவான தண்ணீர் உள்ளது.",tl:"Indru thottiyil kuraivaana thanneer ulladhu.",note:"Water is uncountable → LESS."},
 {en:"I have a few good friends I can rely on.",ta:"என்னால் நம்ப முடிந்த சில நல்ல நண்பர்கள் எனக்கு இருக்கிறார்கள்.",tl:"Ennaal namba mudindha sila nalla nanbargal enakku irukkiraargal.",note:"A FEW = some, a positive sense."},
 {en:"He has few friends and feels quite lonely.",ta:"அவருக்கு நண்பர்கள் மிகக் குறைவு, அவர் தனிமையாக உணர்கிறார்.",tl:"Avarukku nanbargal migak kuraivu, avar thanimaiyaaga unargiraar.",note:"FEW = almost none, a negative sense."},
 {en:"The number of applicants is rising every year.",ta:"விண்ணப்பதாரர்களின் எண்ணிக்கை ஆண்டுதோறும் அதிகரித்து வருகிறது.",tl:"Vinnappadhaarargalin ennikkai aandudhorum adhigariththu varugiradhu.",note:"'THE number of' takes a singular verb."}],

 s7:[
 "There are ____ students this year.|fewer|Easy|Students are countable → FEWER.",
 "There is ____ water in the tank.|less|Easy|Water is uncountable → LESS.",
 "I have ____ good friends I can trust.|a few|Easy|A positive sense → A FEW.",
 "He has ____ friends and feels lonely.|few|Medium|A negative sense → FEW.",
 "The number of applicants ____ rising.|is|Medium|'THE number of' → singular.",
 "A number of students ____ absent today.|are|Medium|'A number of' → plural.",
 "He does not have ____ money left.|much|Medium|Money is uncountable → MUCH.",
 "There are ____ mistakes in this essay.|many|Hard|Mistakes are countable → MANY.",
 "Give me ____ milk, just a spoonful.|a little|Hard|A positive sense → A LITTLE.",
 "There is ____ hope of his recovery now.|little|Hard|A negative sense → LITTLE.",
 "She gave me ____ useful advice.|much|Hard|Advice is uncountable → MUCH.",
 "____ furniture was damaged in the fire.|Much|Expert|Furniture is uncountable → MUCH.",
 "He made ____ errors than last time.|fewer|Expert|Errors are countable → FEWER.",
 "We have ____ time before the train leaves.|little|Expert|A negative sense with an uncountable noun.",
 "____ of the luggage was lost in transit.|Much|Expert|Luggage is uncountable → MUCH."],

 s8:[
 "There are less students in the class this year.|There are fewer students in the class this year.|Students are countable.",
 "There is fewer water in the tank today.|There is less water in the tank today.|Water is uncountable.",
 "I have few good friends I can rely on, so I am happy.|I have a few good friends I can rely on.|'A few' is the positive form.",
 "He has a few friends and feels quite lonely.|He has few friends and feels quite lonely.|'Few' is the negative form.",
 "The number of applicants are rising every year.|The number of applicants is rising every year.|'The number of' takes a singular verb.",
 "A number of students is absent today.|A number of students are absent today.|'A number of' takes a plural verb.",
 "There are much mistakes in this essay.|There are many mistakes in this essay.|Mistakes are countable.",
 "She gave me many useful advice.|She gave me much useful advice.|Advice is uncountable.",
 "Many furniture was damaged in the fire.|Much furniture was damaged in the fire.|Furniture is uncountable.",
 "He made less errors than he did last time.|He made fewer errors than he did last time.|Errors are countable."],

 s9:[
 "Fill in the Blank|There were ____ candidates at the centre this year than the organisers had expected.|less;fewer|1|Candidates are countable → FEWER.",
 "Find the Error|The number of applications (A) received this year (B) are far higher (C) than last year (D).|A;B;C;D|2|Part C. 'The number of' takes a singular verb → IS.",
 "Sentence Improvement|He has few close friends in this city, so he is never short of company.|has few close friends;has a few close friends;has fewer close friends|1|A positive sense requires 'a few'.",
 "Fill in the Blank|Despite repeated reminders, very ____ progress has been made on the project.|few;little|1|'Progress' is uncountable and the sense is negative.",
 "Find the Error|A number of students (A) from this college (B) has been selected (C) for the national event (D).|A;B;C;D|2|Part C. 'A number of' takes a plural verb → HAVE."],

 s10:{
  en:"'Less students' is now so common in speech and even in shop signs that it sounds normal — but students are countable, so it must be 'fewer'. The subtler trap is the article: 'few' and 'a few' differ by one letter but by the entire emotional direction of the sentence. Exams often build a whole sentence around that difference.",
  ta:"'Less students' இப்போது பேச்சிலும் கடை அறிவிப்புகளிலும் மிகவும் பொதுவானது, அது சாதாரணமாக ஒலிக்கிறது — ஆனால் மாணவர்கள் எண்ணக்கூடியவர்கள், எனவே அது 'fewer' என்றுதான் இருக்க வேண்டும். நுட்பமான பொறி article: 'few' மற்றும் 'a few' ஒரு எழுத்தால் வேறுபடுகின்றன ஆனால் வாக்கியத்தின் முழு உணர்வுத் திசையாலும். தேர்வுகள் அந்த வேறுபாட்டைச் சுற்றி ஒரு முழு வாக்கியத்தையும் கட்டமைக்கின்றன.",
  tl:"'Less students' ippodhu pechilum kadai arivippugalilum migavum podhuvaanadhu. Aanaal maanavargal ennakkoodiyavargal, enave adhu 'fewer' endrudhaan irukka vendum."},

 s11:{
  en:"CAN YOU PUT A NUMBER IN FRONT? Then use MANY, FEW, FEWER.",
  ta:"முன்னால் ஒரு எண்ணை வைக்க முடியுமா? அப்படியானால் MANY, FEW, FEWER பயன்படுத்துங்கள்.",
  tl:"Munnaal oru ennai vaikka mudiyumaa? Appadiyaanaal MANY, FEW, FEWER payanpaduththungal.",
  vis:"      COUNTABLE OR NOT?\n\n   CAN YOU SAY 'TWO ___'?\n\n   YES → COUNTABLE\n     many · few · fewer · a number of\n     books · students · mistakes · items\n\n   NO  → UNCOUNTABLE\n     much · little · less · an amount of\n     water · advice · furniture · luggage\n     information · money · work · progress\n\n   ⚠ THE ARTICLE FLIPS THE FEELING:\n     A FEW friends   = some   😊\n     FEW friends     = almost none 😞\n     A LITTLE water  = some   😊\n     LITTLE water    = almost none 😞\n\n   ⚠ A NUMBER OF students ARE ... (plural)\n     THE NUMBER OF students IS ... (singular)\n     (SVA Rule 43)"},

 s13:[
 "There are ____ students this year, and the number of applicants ____ also falling.|fewer-is;less-are;fewer-are|0|Students are countable → FEWER. 'THE number of' → singular IS (SVA Rule 43).",
 "I have ____ good friends, and neither of them ____ ever let me down.|a few-has;few-have;a few-have|0|A positive sense → A FEW. 'Neither of' is fixed singular → HAS (SVA Rule 50).",
 "There is ____ hope now, and the reason ____ ____ the funds ran out.|little-is-that;a little-is-because;little-is-because|0|A negative sense → LITTLE. 'The reason … is THAT' (Rule 91).",
 "A number of students ____ absent, ____ the principal ____ warned them twice.|are-although-had;is-although but-had;are-although but-had|0|'A number of' → plural ARE. One conjunction only (Rule 88). Earlier past → HAD.",
 "He made ____ errors than last time, and his work is ____ to what he did before.|fewer-superior;less-more superior;fewer-more superior|0|Errors are countable → FEWER. 'Superior' is already comparative (Rule 95)."],

 s14:{
  rule:"Countable nouns take many, few and fewer; uncountable nouns take much, little and less.",
  formula:"COUNTABLE: many, few, fewer, a number of\nUNCOUNTABLE: much, little, less, an amount of\nA FEW / A LITTLE = some (positive)\nFEW / LITTLE = almost none (negative)\nA NUMBER OF + plural verb | THE NUMBER OF + singular verb",
  memory:"Can you put a number in front? Then many, few, fewer.",
  ta:"முன்னாடி ஒரு எண் போட முடியுமா? முடிஞ்சா many, few, fewer.",
  tl:"Munnaadi oru en poda mudiyumaa? Mudinjaa many, few, fewer.",
  mistake:"Writing 'less students' and confusing 'few' with 'a few'.",
  exam:"SSC CGL / CHSL and Bank — 'less versus fewer' and 'few versus a few' are both repeated items."},

 s15:[
 {ta:"நாம Adjectives மற்றும் Adverbs module-ஓட கடைசி rule-க்கு வந்துட்டோம். இது quantifier பத்தி — அளவு காட்டுற சொல்.",
  tl:"Naama Adjectives matrum Adverbs module-oda kadaisi rule-kku vandhuttom. Idhu quantifier paththi — alavu kaattura sol."},
 {ta:"முதல்ல ஒரு எளிய சோதனை — 'இதுக்கு முன்னாடி ஒரு எண் போட முடியுமா?' 'Two books' — முடியுது! அதனால books எண்ணக்கூடியது. 'Two waters' — முடியாது! அதனால water எண்ண முடியாதது.",
  tl:"Mudhalla oru eliya sodhanai — 'idhukku munnaadi oru en poda mudiyumaa?' 'Two books' — mudiyudhu! 'Two waters' — mudiyaadhu!"},
 {ta:"எண்ணக்கூடியதுக்கு — MANY, FEW, FEWER, A NUMBER OF. எண்ண முடியாததுக்கு — MUCH, LITTLE, LESS, AN AMOUNT OF. 'Many books' சரி, 'much books' தப்பு. 'Much water' சரி, 'many water' தப்பு.",
  tl:"Ennakkoodiyadhukku — MANY, FEW, FEWER, A NUMBER OF. Enna mudiyaadhadhukku — MUCH, LITTLE, LESS, AN AMOUNT OF."},
 {ta:"இப்போ SSC-ல ரொம்ப அடிக்கடி வர்ற ஜோடி — LESS மற்றும் FEWER. 'FEWER students' சரி (மாணவர்களை எண்ணலாம்). 'LESS water' சரி (தண்ணீரை எண்ண முடியாது). கடைல 'ten items or less' அப்படின்னு எழுதி வெப்பாங்க — அது தப்பு! 'Ten items or FEWER' தான் சரி.",
  tl:"Ippo SSC-la romba adikkadi varra jodi — LESS matrum FEWER. 'FEWER students' sari. 'LESS water' sari. Kadaila 'ten items or less' appadinnu ezhudhi veppaanga — adhu thappu!"},
 {ta:"இப்போ ஒரு அழகான விஷயம் — 'A' அப்படிங்கிற ஒரு சின்ன எழுத்து முழு உணர்வையும் மாத்திடும்! 'I have A FEW friends' — எனக்கு சில நண்பர்கள் இருக்காங்க. நல்ல விஷயம். 😊 ஆனா 'I have FEW friends' — எனக்கு நண்பர்களே இல்ல. சோகமான விஷயம். 😞",
  tl:"Ippo oru azhagaana vishayam — 'A' appadingira oru chinna ezhuththu muzhu unarvaiyum maaththidum! 'I have A FEW friends' — nalla vishayam. Aanaa 'I have FEW friends' — sogamaana vishayam."},
 {ta:"அதே மாதிரி 'A LITTLE water' — கொஞ்சம் தண்ணி இருக்கு, போதும். ஆனா 'LITTLE water' — தண்ணியே இல்ல, பிரச்சனை! ஒரு எழுத்து, முழு அர்த்தமும் மாறுது. கடைசியா ஒரு இணைப்பு — 'A NUMBER OF students ARE absent' (பன்மை) ஆனா 'THE NUMBER OF students IS rising' (ஒருமை). இது நீங்க SVA Rule 43-ல படிச்சது! இதோட Module 9 முடிஞ்சது — பத்து rule-ம் நீங்க கத்துக்கிட்டீங்க.",
  tl:"Adhe maadhiri 'A LITTLE water' vs 'LITTLE water'. Oru ezhuththu, muzhu arththamum maarudhu. Kadaisiyaa oru inaippu — 'A NUMBER OF students ARE absent' aanaa 'THE NUMBER OF students IS rising'. Idhu SVA Rule 43!"}]}
];

/* ================== ENGINE ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[
 ["What is the Rule?","விதி என்ன? · Vidhi enna?"],
 ["Why does this rule exist?","ஏன் இந்த விதி? · Yen indha vidhi?"],
 ["Visual Diagram","படம் மூலம் புரிதல் · Padam moolam purithal"],
 ["Wrong Thinking vs Right Thinking","தவறான சிந்தனை · Thavaraana sinthanai"],
 ["Tamil Translation of Examples","உதாரணங்களின் தமிழ் · Udhaaranangalin Tamil"],
 ["Word-by-Word Meaning","சொல்லுக்குச் சொல் · Sollukku sol"],
 ["Solved Examples — Easy to Hard","தீர்க்கப்பட்ட உதாரணங்கள்"],
 ["Wrong vs Correct","தவறு vs சரி · Thavaru vs Sari"],
 ["SSC / Bank PYQ Style","முந்தைய வினாத்தாள் பாணி"],
 ["Exam Trap","தேர்வு பொறி · Thervu pori"],
 ["Memory Trick","நினைவு உத்தி · Ninaivu utthi"],
 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],
 ["Challenge Round","சவால் சுற்று · Savaal sutru"],
 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],
 ["Centu AI Explains","சென்டு AI விளக்கம்"]
];

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-adjectives-adverbs', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
