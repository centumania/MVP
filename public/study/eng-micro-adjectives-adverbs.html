<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Adjectives &amp; Adverbs — 10 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

  ta:"ஒரு பொருளுக்கு அல்லது சமத்துவத்திற்கு (as … as) POSITIVE degree பயன்படுத்தவும். சரியாக இரண்டு பொருட்களுக்கு THAN-உடன் COMPARATIVE பயன்படுத்தவும். மூன்று அல்லது அதற்கு மேற்பட்டவற்றுக்கு THE-உடன் SUPERLATIVE பயன்படுத்தவும்.",
  tl:"Oru porulukku alladhu samaththuvaththirku (as … as) POSITIVE degree payanpaduththavum. Sariyaaga irandu porutkalukku THAN-udan COMPARATIVE. Moondru alladhu adharku merpattavatrukku THE-udan SUPERLATIVE.",
  formula:"POSITIVE     →  one thing, or equality\n  Ram is tall.\n  Ram is AS tall AS Shyam.\n\nCOMPARATIVE  →  exactly TWO, with THAN\n  Ram is TALLER THAN Shyam.\n\nSUPERLATIVE  →  THREE or more, with THE\n  Ram is THE TALLEST boy in the class.\n\n⚠ COUNT THE THINGS BEING COMPARED.\n  two → comparative · three or more → superlative"},

  ta:"தேர்ந்தெடுப்பதற்கு முன் பொருட்களை எண்ணுங்கள். 'Of the two boys, Ram is the taller' — இரண்டு பொருட்கள், எனவே comparative, 'the' தோன்றினாலும் கூட. 'Of the three boys, Ram is the tallest' — மூன்று பொருட்கள், எனவே superlative. எப்போதும் முதலில் எண்ணுங்கள்.",

 {h:"How the three degrees are formed",
  en:"Short words add -er and -est: tall, taller, tallest. Longer words take more and most: beautiful, more beautiful, most beautiful. A few are irregular: good, better, best; bad, worse, worst; little, less, least; much/many, more, most.",
  ta:"மூன்று degree-கள் எப்படி உருவாக்கப்படுகின்றன. சிறிய சொற்கள் -er மற்றும் -est சேர்க்கின்றன: tall, taller, tallest. நீளமான சொற்கள் more மற்றும் most எடுக்கின்றன: beautiful, more beautiful, most beautiful. சில ஒழுங்கற்றவை: good, better, best; bad, worse, worst; little, less, least; much/many, more, most.",

  ta:"AS … AS மற்றும் NOT SO … AS. Positive ஒப்பீடு உடன்பாட்டில் 'as … as' பயன்படுத்துகிறது: 'He is AS tall AS his brother'. எதிர்மறையில், 'not as … as' மற்றும் 'not so … as' இரண்டும் ஏற்கப்படுகின்றன, இருந்தும் தேர்வுகளில் 'not so … as' பழைய விருப்பமான வடிவம்.",

 "This book is interestinger than that one.|This book is more interesting than that one.|A long adjective takes 'more'.",

 "He is the cleverer student of them all.|He is the cleverest student of them all.|More than two requires the superlative.",
 "Gold is more costlier than silver.|Gold is costlier than silver.|'More' with '-er' is a double comparative.",
 "Of the three roads, this is the shorter.|Of the three roads, this is the shortest.|Three items require the superlative.",
 "This is the worse film I have ever seen.|This is the worst film I have ever seen.|Many items require the superlative.",
 "He is not so stronger as his father.|He is not so strong as his father.|'So … as' takes the positive degree.",
 "Of the two sisters, she is the eldest.|Of the two sisters, she is the elder.|Two items require the comparative."],

 s9:[
 "Fill in the Blank|Of the two candidates interviewed today, the second one was clearly ____ .|the best;the better|1|'Of the two' requires THE + comparative.",
 "Find the Error|Ram is undoubtedly (A) the tallest (B) of the two boys (C) in the front row (D).|A;B;C;D|1|Part B. Two items require the comparative → 'the taller'.",
 "Sentence Improvement|This is the most worst performance the team has given in recent years.|the most worst;the worst;the worse|1|'Worst' is already superlative.",
 "Fill in the Blank|Among all the schemes announced this year, this one is ____ practical.|more;the most|1|Comparing many requires THE + superlative.",
 "Find the Error|Her handwriting is (A) far more neater (B) than that of (C) anyone else in the class (D).|A;B;C;D|1|Part B. 'More' with '-er' is a double comparative → 'far neater'."],

 s10:{
  en:"'The tallest of the two' is the single most repeated error in this whole module, because 'the' pulls students towards the superlative. Count the items: two means comparative, and 'of the two' still needs 'the'. The second trap is applying '-er' to long adjectives, which produces forms like 'interestinger' and 'beautifuller'.",
  ta:"'The tallest of the two' இந்த முழு module-லும் மிக அதிகமாக மீண்டும் வரும் ஒற்றைத் தவறு, ஏனெனில் 'the' மாணவர்களை superlative நோக்கி இழுக்கிறது. பொருட்களை எண்ணுங்கள்: இரண்டு என்றால் comparative, மேலும் 'of the two'-க்கு இன்னும் 'the' தேவை. இரண்டாவது பொறி நீளமான பெயரடைகளுக்கு '-er' பயன்படுத்துவது, அது 'interestinger' மற்றும் 'beautifuller' போன்ற வடிவங்களை உருவாக்குகிறது.",
  tl:"'The tallest of the two' indha muzhu module-lum miga adhigamaaga meendum varum otraith thavaru. Porutkalai ennungal: irandu endraal comparative."},

 s11:{
  en:"COUNT THE ITEMS. Two → the comparative. Three or more → the superlative.",
  ta:"பொருட்களை எண்ணுங்கள். இரண்டு → comparative. மூன்று அல்லது அதற்கு மேல் → superlative.",
  tl:"Porutkalai ennungal. Irandu → comparative. Moondru alladhu adharku mel → superlative.",
  vis:"      COUNT FIRST, THEN CHOOSE\n\n   1 thing        →  POSITIVE\n                     Ram is tall.\n\n   2 things       →  COMPARATIVE + THAN\n                     Ram is TALLER THAN Shyam.\n\n   3 or more      →  THE + SUPERLATIVE\n                     Ram is THE TALLEST in the class.\n\n   ⚠ THE FAVOURITE SSC PATTERN:\n     'Of the TWO, ... is THE + comparative'\n     Of the two, Ram is THE TALLER.  ✔\n     Of the two, Ram is THE TALLEST. ✘\n\n   ⚠ IRREGULAR FORMS:\n     good · better · best\n     bad  · worse  · worst\n     little · less · least\n     much/many · more · most"},

 "Ram is ____ than Shyam, but he is not so ____ as their eldest brother.|taller-tall;tallest-taller;taller-taller|0|Two people → comparative. 'Not so … as' takes the positive degree.",

 s14:{
  rule:"Positive for one or for equality, comparative for two with 'than', superlative for three or more with 'the'.",
  formula:"POSITIVE: Ram is tall / as tall as\nCOMPARATIVE: taller THAN (two items)\nSUPERLATIVE: THE tallest (three or more)\n'Of the two' → THE + comparative\nIrregular: good/better/best, bad/worse/worst, little/less/least",
  memory:"Count the items. Two means comparative. Three or more means superlative.",
  ta:"பொருளை எண்ணுங்க. ரெண்டுன்னா comparative. மூணு அல்லது அதுக்கு மேலன்னா superlative.",
  tl:"Porulai ennunga. Rendunnaa comparative. Moonu alladhu adhukku melannaa superlative.",
  mistake:"Writing 'the tallest of the two' and 'interestinger'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — 'of the two' appears almost every year."},

 s15:[
 {ta:"Adjectives module ஆரம்பிக்குது. இதுல முதல் ஐந்து rule ஒப்பீடு (comparison) பத்தி. இது SSC-ல மிக அதிகமா வர்ற பகுதி.",
  tl:"Adjectives module aarambikkudhu. Idhula mudhal aindhu rule oppeedu (comparison) paththi. Idhu SSC-la miga adhigamaa varra paguthi."},
 {ta:"மூணு நிலை இருக்கு. POSITIVE — 'Ram is tall'. ஒரு பொருள் மட்டும், அல்லது சமத்துவம் ('as tall as'). COMPARATIVE — 'Ram is taller THAN Shyam'. சரியா ரெண்டு பொருள். SUPERLATIVE — 'Ram is THE tallest'. மூணு அல்லது அதுக்கு மேல.",
  tl:"Moonu nilai irukku. POSITIVE — 'Ram is tall'. COMPARATIVE — 'Ram is taller THAN Shyam'. Sariyaa rendu porul. SUPERLATIVE — 'Ram is THE tallest'. Moonu alladhu adhukku mela."},
 {ta:"இப்போ SSC-ஓட மிக பிரபலமான பொறி — 'OF THE TWO'. 'Of the two boys, Ram is the ____ .' இங்க என்ன போடுவீங்க? 'The' இருக்குதுல்ல, அதனால 'tallest' போடலாம்-னு தோணும். ஆனா தப்பு!",
  tl:"Ippo SSC-oda miga pirabalamaana pori — 'OF THE TWO'. 'Of the two boys, Ram is the ____ .' Inga enna poduveenga? 'The' irukkudhulla, adhanaala 'tallest' podalaam-nu thonum. Aanaa thappu!"},
 {ta:"'Of the two' அப்படின்னா ரெண்டு பொருள் மட்டும். ரெண்டுன்னா comparative. அதனால 'Of the two boys, Ram is THE TALLER' தான் சரி. 'The' வரும், ஆனா comparative வடிவம் வரும். இந்த ஒரு point-ஐ மட்டும் சரியா புரிஞ்சுக்கிட்டா, ஒவ்வொரு வருஷமும் ஒரு mark நிச்சயம்.",
  tl:"'Of the two' appadinnaa rendu porul mattum. Rendunnaa comparative. Adhanaala 'Of the two boys, Ram is THE TALLER' thaan sari. 'The' varum, aanaa comparative vadivam varum."},
 {ta:"இப்போ வடிவம் எப்படி உருவாக்குறதுன்னு பாருங்க. சின்ன வார்த்தைக்கு -er, -est: tall, taller, tallest. நீளமான வார்த்தைக்கு more, most: beautiful, MORE beautiful, MOST beautiful. 'Beautifuller' அப்படின்னு எழுதக்கூடாது!",
  tl:"Ippo vadivam eppadi uruvaakkuradhunnu paarunga. Chinna vaarththaikku -er, -est. Neelamaana vaarththaikku more, most. 'Beautifuller' appadinnu ezhudhakkoodaadhu!"},
 {ta:"கடைசியா ஒழுங்கற்ற வடிவங்கள் — இதெல்லாம் மனப்பாடம்தான். good/better/best. bad/worse/worst. little/less/least. much அல்லது many/more/most. far/farther அல்லது further/farthest அல்லது furthest. இதுல 'good, better, best' மற்றும் 'bad, worse, worst' ரொம்ப அடிக்கடி வரும்.",
  tl:"Kadaisiyaa ozhungatra vadivangal — idhellaam manappaadam-dhaan. good/better/best. bad/worse/worst. little/less/least. much/many/more/most. Idhula 'good, better, best' matrum 'bad, worse, worst' romba adikkadi varum."}]},

/* ========== RULE 95 ========== */
{n:95,rc:"ADJ-02",d:"Medium",t:"Never form a DOUBLE Comparative or Superlative",
 tam:"More better · Most best · Very unique — மிகைப்படுத்தல் தவறு",
 s1:{en:"Never combine MORE or MOST with a form that is already comparative or superlative. Also, ABSOLUTE adjectives — unique, perfect, complete, round, dead, empty, full, ideal — cannot be compared at all.",
  ta:"ஏற்கனவே comparative அல்லது superlative ஆக இருக்கும் வடிவத்துடன் MORE அல்லது MOST-ஐ ஒருபோதும் இணைக்காதீர்கள். மேலும், முழுமையான பெயரடைகள் — unique, perfect, complete, round, dead, empty, full, ideal — ஒப்பிடவே முடியாது.",
  tl:"Erkanave comparative alladhu superlative aaga irukkum vadivaththudan MORE alladhu MOST-ai orupodhum inaikkaadheergal. Melum, muzhumaiyaana peyaradaigal — unique, perfect, complete, round, dead, empty, full, ideal — oppidave mudiyaadhu.",
  formula:"NEVER DOUBLE THE COMPARISON\n\n  ✘ more better    ✔ better\n  ✘ most best      ✔ best\n  ✘ more taller    ✔ taller\n  ✘ most cleverest ✔ cleverest\n  ✘ more superior  ✔ superior\n\nABSOLUTE ADJECTIVES CANNOT BE COMPARED\n\n  ✘ very unique    ✔ unique\n  ✘ more perfect   ✔ perfect\n  ✘ most complete  ✔ complete\n  ✘ more round     ✔ round"},

 s2:[
 {h:"'-er' and 'more' do the same job",
  en:"'Taller' already means 'more tall'. Writing 'more taller' says 'more more tall'. The same applies to '-est' and 'most'. Choose one method, never both.",
  ta:"'-er' மற்றும் 'more' ஒரே வேலையைச் செய்கின்றன. 'Taller' ஏற்கனவே 'more tall' என்று பொருள்படுகிறது. 'More taller' எழுதுவது 'more more tall' என்று சொல்கிறது. '-est' மற்றும் 'most'-க்கும் அதேதான். ஒரு முறையைத் தேர்ந்தெடுங்கள், ஒருபோதும் இரண்டையும் அல்ல.",
  tl:"'-er' matrum 'more' ore velaiyaich seygindrana. 'Taller' erkanave 'more tall' endru porulpadugiradhu. 'More taller' ezhudhuvadhu 'more more tall' endru solgiradhu."},
 {h:"The Latin comparatives are already comparative",
  en:"SUPERIOR, INFERIOR, SENIOR, JUNIOR, PRIOR, MAJOR, MINOR, PREFERABLE — these already carry comparison, so 'more superior' and 'more preferable' are wrong. They also take 'to', never 'than' — that is Preposition Rule 84.",
  ta:"லத்தீன் comparative-கள் ஏற்கனவே comparative. SUPERIOR, INFERIOR, SENIOR, JUNIOR, PRIOR, MAJOR, MINOR, PREFERABLE — இவை ஏற்கனவே ஒப்பீட்டைச் சுமக்கின்றன, எனவே 'more superior' மற்றும் 'more preferable' தவறு. அவை 'to'-ம் எடுக்கின்றன, ஒருபோதும் 'than' அல்ல — அது Preposition Rule 84.",
  tl:"Latin comparative-gal erkanave comparative. SUPERIOR, INFERIOR, SENIOR, JUNIOR, PRIOR, MAJOR, MINOR, PREFERABLE — ivai erkanave oppeettaich sumakkindrana. Avai 'to'-um edukkindrana, orupodhum 'than' alla."},
 {h:"Absolute adjectives have no degrees",
  en:"Something is either UNIQUE or it is not — it cannot be 'more unique'. The same for perfect, complete, round, square, dead, empty, full, ideal, universal, eternal, supreme. Use 'almost unique' or 'nearly perfect' instead.",
  ta:"முழுமையான பெயரடைகளுக்கு degree இல்லை. ஏதோ ஒன்று UNIQUE அல்லது இல்லை — அது 'more unique' ஆக முடியாது. Perfect, complete, round, square, dead, empty, full, ideal, universal, eternal, supreme-க்கும் அதேதான். அதற்குப் பதிலாக 'almost unique' அல்லது 'nearly perfect' பயன்படுத்துங்கள்.",
  tl:"Muzhumaiyaana peyaradaigalukku degree illai. Edho ondru UNIQUE alladhu illai — adhu 'more unique' aaga mudiyaadhu. Adharkup padhilaaga 'almost unique' alladhu 'nearly perfect' payanpaduththungal."},
 {h:"This belongs to the redundancy family of Rule 91",
  en:"'More better' is the same kind of error as 'return back' and 'the reason is because'. Each says one idea twice. If you learnt Rule 91, this rule is its adjective version.",
  ta:"இது Rule 91-ன் மிகைப்படுத்தல் குடும்பத்தைச் சேர்ந்தது. 'More better' 'return back' மற்றும் 'the reason is because' போன்ற அதே வகைத் தவறு. ஒவ்வொன்றும் ஒரு கருத்தை இரண்டு முறை சொல்கிறது. நீங்கள் Rule 91-ஐக் கற்றிருந்தால், இந்த விதி அதன் பெயரடைப் பதிப்பு.",
  tl:"Idhu Rule 91-in migaippaduththal kudumbaththaich serndhadhu. 'More better' 'return back' matrum 'the reason is because' pondra adhe vagaith thavaru. Neengal Rule 91-aik kathirundhaal, indha vidhi adhan peyaradaip padhippu."}],

 s3:[
 {h:"One method only",
  d:"   METHOD 1: add -er / -est\n     tall  →  taller  →  tallest\n\n   METHOD 2: use more / most\n     useful → more useful → most useful\n\n   ✘ NEVER MIX THEM:\n     more taller   = more more tall\n     most tallest  = most most tall\n     more better   = more more good"},
 {h:"The Latin family is already comparative",
  d:"   SUPERIOR  INFERIOR  SENIOR  JUNIOR\n   PRIOR     MAJOR     MINOR   PREFERABLE\n\n   ✘ more superior   ✔ superior\n   ✘ most preferable ✔ preferable\n\n   ⚠ THEY ALSO TAKE 'TO', NOT 'THAN'\n     superior TO   ✔\n     superior THAN ✘\n     (Preposition Rule 84)"},
 {h:"Absolute adjectives cannot be compared",
  d:"   unique · perfect · complete · round\n   square · dead   · empty    · full\n   ideal  · supreme· universal· eternal\n\n   ✘ very unique     ✔ unique\n   ✘ more perfect    ✔ perfect\n   ✘ most complete   ✔ complete\n\n   ⚠ USE 'ALMOST' OR 'NEARLY' INSTEAD:\n     almost unique · nearly perfect"}],

 s4:{
 wrong:["\"'More better' is stronger than 'better'.\" — It repeats the comparison.",
  "\"'Very unique' emphasises how special it is.\" — 'Unique' has no degrees.",
  "\"'More superior' is more formal.\" — 'Superior' is already comparative.",
  "\"'Most perfect' shows the highest quality.\" — 'Perfect' cannot be graded."],
 right:["Choose '-er' OR 'more', never both.",
  "The Latin family — superior, inferior, senior, junior — is already comparative.",
  "Absolute adjectives take no degrees at all.",
  "Use 'almost' or 'nearly' with absolutes."]},

 s8:[

 "This cloth is more superior than that one.|This cloth is superior to that one.|'Superior' is already comparative and takes 'to'.",
 "This painting is very unique in every way.|This painting is unique in every way.|'Unique' cannot be graded.",
 "The design is more perfect than the earlier one.|The design is almost perfect.|'Perfect' cannot be graded.",
 "She is the most cleverest girl in the class.|She is the cleverest girl in the class.|'-est' and 'most' do the same job.",
 "Health is more preferable than wealth.|Health is preferable to wealth.|'Preferable' is already comparative and takes 'to'.",
 "This is the most best book of them all.|This is the best book of them all.|'Best' is already superlative.",
 "The list is now more complete than before.|The list is now complete.|'Complete' cannot be graded.",
 "He is more senior than me in service.|He is senior to me in service.|'Senior' is already comparative and takes 'to'."],

 s9:[
 "Fill in the Blank|The revised design is ____ than the one submitted last month by the same firm.|more better;better|1|'Better' is already comparative.",
 "Find the Error|The quality of (A) this fabric is (B) far more superior than (C) the sample we saw (D).|A;B;C;D|2|Part C. 'Superior' is already comparative and takes 'to' → 'far superior to'.",
 "Sentence Improvement|The manuscript he submitted was the most unique document in the entire collection.|the most unique;unique;more unique|1|'Unique' cannot be graded.",
 "Fill in the Blank|Of all the answers submitted, hers was undoubtedly ____ written.|the most best;the best|1|'Best' is already superlative.",
 "Find the Error|His performance this year (A) has been much (B) more worse than (C) it was last season (D).|A;B;C;D|2|Part C. 'Worse' is already comparative → 'much worse than'."],

 s10:{
  en:"'More better' and 'most best' feel emphatic, which is exactly why they slip through. The subtler layer is the Latin family — 'more superior' looks perfectly formal but is a double comparative, and it also takes the wrong preposition. The third layer is absolutes: 'very unique' is so common in advertising that it sounds normal.",
  ta:"'More better' மற்றும் 'most best' வலியுறுத்தலாக உணரப்படுகின்றன, அதனால்தான் அவை கவனிக்கப்படாமல் நழுவுகின்றன. நுட்பமான அடுக்கு லத்தீன் குடும்பம் — 'more superior' முற்றிலும் முறையானதாகத் தெரிகிறது ஆனால் ஒரு இரட்டை comparative, மேலும் அது தவறான முன்னுருபையும் எடுக்கிறது. மூன்றாவது அடுக்கு முழுமையானவை: 'very unique' விளம்பரத்தில் மிகவும் பொதுவானது, அதனால் அது சாதாரணமாக ஒலிக்கிறது.",
  tl:"'More better' matrum 'most best' valiyuruththalaaga unarappadugindrana. Nutpamaana adukku Latin kudumbam — 'more superior' mutrilum muraiyaanadhaagath therigiradhu aanaal oru irattai comparative."},

 s11:{
  en:"ONE COMPARISON PER ADJECTIVE. Absolutes have no degrees at all.",
  ta:"ஒரு பெயரடைக்கு ஒரு ஒப்பீடு. முழுமையானவற்றுக்கு degree-யே இல்லை.",
  tl:"Oru peyaradaikku oru oppeedu. Muzhumaiyaanavatrukku degree-ye illai.",
  vis:"      ONE COMPARISON, NOT TWO\n\n   ✘ more better    ✔ better\n   ✘ most best      ✔ best\n   ✘ more taller    ✔ taller\n   ✘ most cleverest ✔ cleverest\n   ✘ more worse     ✔ worse\n\n   THE LATIN FAMILY IS ALREADY COMPARATIVE:\n     superior · inferior · senior · junior\n     prior · major · minor · preferable\n     ✘ more superior   ✔ superior TO\n\n   ABSOLUTES CANNOT BE GRADED:\n     unique · perfect · complete · round\n     square · dead · empty · full · ideal\n     supreme · universal · eternal\n     ✘ very unique  ✔ unique\n     ✔ ALMOST unique · NEARLY perfect\n\n   Same principle as Rule 91."},

 s13:[
 "This design is ____ than that one, and it is also ____ to the earlier model.|better-superior;more better-more superior;better-more superior|0|No double comparative. 'Superior' is already comparative.",
 "Her painting is ____ , and of the two entries it is ____ .|unique-the better;very unique-the best;unique-the best|0|'Unique' cannot be graded. 'Of the two' → THE + comparative (Rule 94).",
 "He is ____ to me in service, although he ____ younger ____ I am.|senior-is-than;more senior-is-than;senior-are-than|0|'Senior' is already comparative and takes TO. Singular → IS. Ordinary comparison → THAN.",
 "This is ____ film I have seen, and it is ____ boring that nobody ____ till the end.|the worst-so-stayed;the most worst-such-stayed;the worst-such-stayed|0|'Worst' is already superlative. SO before an adjective (Rule 93). Past → STAYED.",
 "The bottle is nearly ____ , and the reason ____ ____ nobody refilled it.|empty-is-that;more empty-is-because;empty-are-that|0|'Empty' cannot be graded. 'The reason … is THAT' (Rule 91)."],

 s14:{
  rule:"Never use 'more' or 'most' with a form that is already comparative or superlative, and never grade an absolute adjective.",
  formula:"✘ more better · most best · more taller · most cleverest\n✘ more superior / inferior / senior / junior / preferable\n✘ very unique · more perfect · most complete\n✔ almost unique · nearly perfect",
  memory:"One comparison per adjective. Absolutes have no degrees.",
  ta:"ஒரு பெயரடைக்கு ஒரு ஒப்பீடு. முழுமையான பெயரடைக்கு degree கிடையாது.",
  tl:"Oru peyaradaikku oru oppeedu. Muzhumaiyaana peyaradaikku degree kidaiyaadhu.",
  mistake:"Writing 'more better', 'most best', 'more superior' and 'very unique'.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule Rule 91-ஓட நேரடி உறவினர். அங்க 'return back', 'the reason is because' பத்தி பார்த்தோம் இல்லையா? அதே கொள்கை — ஒரே விஷயத்தை ரெண்டு தடவ சொல்லக்கூடாது.",
  tl:"Indha rule Rule 91-oda neradi uravinar. Anga 'return back', 'the reason is because' paththi paarththom illaiyaa? Adhe kolgai — ore vishayaththai rendu thadava sollakkoodaadhu."},
 {ta:"ஆங்கிலத்துல ஒப்பீடு பண்ண ரெண்டு வழி இருக்கு. வழி 1 — '-er' சேர்க்கிறது: tall → taller. வழி 2 — 'more' போடுறது: useful → more useful. ஒரு வார்த்தைக்கு ஏதோ ஒரு வழி மட்டும்தான்!",
  tl:"Aangilaththula oppeedu panna rendu vazhi irukku. Vazhi 1 — '-er' serkkiradhu. Vazhi 2 — 'more' poduradhu. Oru vaarththaikku edho oru vazhi mattum-dhaan!"},
 {ta:"'More taller' அப்படின்னா என்ன அர்த்தம்? 'Taller' -லயே 'more tall' இருக்கு. அதனால 'more taller' = 'more more tall'! அபத்தம். அதே மாதிரி 'most best' = 'most most good'.",
  tl:"'More taller' appadinnaa enna arththam? 'Taller'-layae 'more tall' irukku. Adhanaala 'more taller' = 'more more tall'! Abaththam."},
 {ta:"இப்போ இன்னும் நுட்பமான ஒரு விஷயம் — லத்தீன் குடும்பம். SUPERIOR, INFERIOR, SENIOR, JUNIOR, PRIOR, MAJOR, MINOR, PREFERABLE. இதுல ஏற்கனவே ஒப்பீடு இருக்கு! 'More superior' தப்பு. 'Superior' மட்டும் போதும்.",
  tl:"Ippo innum nutpamaana oru vishayam — Latin kudumbam. SUPERIOR, INFERIOR, SENIOR, JUNIOR, PRIOR, MAJOR, MINOR, PREFERABLE. Idhula erkanave oppeedu irukku! 'More superior' thappu."},
 {ta:"இந்த லத்தீன் குடும்பத்தை நீங்க Preposition Rule 84-ல ஏற்கனவே பார்த்தீங்க! அங்க 'superior TO', 'senior TO' -ன்னு படிச்சோம். இப்போ இங்க 'more superior' தப்புன்னு பார்க்குறோம். ஒரே குடும்பம், ரெண்டு கோணம். SSC ரெண்டு தப்பையும் ஒரே கேள்வியில வெப்பாங்க — 'more superior than'!",
  tl:"Indha Latin kudumbaththai neenga Preposition Rule 84-la erkanave paarththeenga! Anga 'superior TO', 'senior TO'-nnu padichom. SSC rendu thappaiyum ore kelviyila veppaanga — 'more superior than'!"},
 {ta:"கடைசியா மூணாவது வகை — முழுமையான பெயரடை. UNIQUE, PERFECT, COMPLETE, ROUND, SQUARE, DEAD, EMPTY, FULL, IDEAL. இதுக்கு degree-யே கிடையாது! ஏன்? ஒரு பொருள் தனித்துவமா இருக்கும் அல்லது இருக்காது — 'கொஞ்சம் தனித்துவம்' அப்படின்னு ஒண்ணு இல்ல. 'Very unique' தப்பு, 'unique' மட்டும் சரி. ஆனா 'ALMOST unique', 'NEARLY perfect' அப்படின்னு சொல்லலாம் — ஏன்னா அது 'கிட்டத்தட்ட அந்த நிலைக்கு வந்துடுச்சு' அப்படிங்கிற அர்த்தம்.",
  tl:"Kadaisiyaa moonaavadhu vagai — muzhumaiyaana peyaradai. UNIQUE, PERFECT, COMPLETE, ROUND, DEAD, EMPTY, FULL, IDEAL. Idhukku degree-ye kidaiyaadhu! 'Very unique' thappu. Aanaa 'ALMOST unique', 'NEARLY perfect' appadinnu sollalaam."}]},

/* ========== RULE 96 ========== */
{n:96,rc:"ADJ-03",d:"Hard",t:"Comparative Traps — OTHER, ANY OTHER and ALL OTHER",
 tam:"Comparative-ல் 'any other' · Superlative-ல் 'any' — ஒப்பீட்டுக் குழு",
 s1:{en:"When a comparative compares a member WITH ITS OWN GROUP, you must add OTHER: 'Ram is taller than ANY OTHER boy in the class'. If the group is DIFFERENT, do not add 'other': 'Ram is taller than any boy in the other class'.",
  ta:"ஒரு comparative ஒரு உறுப்பினரை அவனுடைய சொந்தக் குழுவுடன் ஒப்பிடும்போது, நீங்கள் OTHER சேர்க்க வேண்டும்: 'Ram is taller than ANY OTHER boy in the class'. குழு வேறுபட்டால், 'other' சேர்க்காதீர்கள்: 'Ram is taller than any boy in the other class'.",
  tl:"Oru comparative oru uruppinarai avanudaiya sondhak kuzhuvudan oppidumbodhu, neengal OTHER serkka vendum. Kuzhu verupattaal, 'other' serkkaadheergal.",
  formula:"SAME GROUP  →  add OTHER\n\n  Ram is taller than ANY OTHER boy in the class. ✔\n  Ram is taller than ALL THE OTHER boys.        ✔\n  Ram is taller than ANY boy in the class.      ✘\n\nDIFFERENT GROUP  →  no OTHER\n\n  Ram is taller than ANY boy in the other class. ✔\n\nSUPERLATIVE  →  no OTHER at all\n\n  Ram is the tallest boy in the class.           ✔"},

 s2:[
 {h:"Why 'other' is needed",
  en:"'Ram is taller than any boy in the class' includes Ram himself — it says Ram is taller than Ram, which is impossible. Adding 'other' removes Ram from the group he is being compared with.",
  ta:"'Other' ஏன் தேவை. 'Ram is taller than any boy in the class' ராமையே உள்ளடக்குகிறது — அது ராம் ராமைவிட உயரமானவன் என்று சொல்கிறது, அது சாத்தியமற்றது. 'Other' சேர்ப்பது ராம் ஒப்பிடப்படும் குழுவிலிருந்து அவனை நீக்குகிறது.",
  tl:"'Other' yen thevai. 'Ram is taller than any boy in the class' Raamaiye ulladakkugiradhu — adhu Raam Raamaivida uyaramaanavan endru solgiradhu, adhu saaththiyamatradhu."},
 {h:"ANY OTHER is singular, ALL OTHER is plural",
  en:"'Taller than ANY OTHER boy' — singular noun. 'Taller than ALL THE OTHER boys' — plural noun. Both are correct; only the number changes. 'Any other boys' and 'all other boy' are both wrong.",
  ta:"ANY OTHER ஒருமை, ALL OTHER பன்மை. 'Taller than ANY OTHER boy' — ஒருமைப் பெயர்ச்சொல். 'Taller than ALL THE OTHER boys' — பன்மைப் பெயர்ச்சொல். இரண்டும் சரி; எண் மட்டுமே மாறுகிறது. 'Any other boys' மற்றும் 'all other boy' இரண்டுமே தவறு.",
  tl:"ANY OTHER orumai, ALL OTHER panmai. 'Taller than ANY OTHER boy' — orumaip peyarchol. 'Taller than ALL THE OTHER boys' — panmaip peyarchol. Irandum sari; en mattume maarugiradhu."},
 {h:"The superlative never takes 'other'",
  en:"'Ram is the tallest boy in the class' is complete. 'The tallest of any other boy' is wrong. 'Other' belongs only to the comparative, because only the comparative needs the speaker removed from the group.",
  ta:"Superlative ஒருபோதும் 'other' எடுக்காது. 'Ram is the tallest boy in the class' முழுமையானது. 'The tallest of any other boy' தவறு. 'Other' comparative-க்கு மட்டுமே சொந்தம், ஏனெனில் comparative-க்கு மட்டுமே பேசுபவரை குழுவிலிருந்து நீக்குவது தேவை.",
  tl:"Superlative orupodhum 'other' edukkaadhu. 'Ram is the tallest boy in the class' muzhumaiyaanadhu. 'Other' comparative-kku mattume sondham."},
 {h:"Converting between comparative and superlative",
  en:"'Ram is the tallest boy in the class' = 'Ram is taller than any other boy in the class' = 'No other boy in the class is as tall as Ram'. SSC gives one form and asks for another. Notice that only the middle one takes 'other' with a comparative.",
  ta:"Comparative மற்றும் superlative-க்கு இடையே மாற்றுதல். 'Ram is the tallest boy in the class' = 'Ram is taller than any other boy in the class' = 'No other boy in the class is as tall as Ram'. SSC ஒரு வடிவத்தைத் தந்து மற்றொன்றைக் கேட்கிறது. நடுவில் உள்ளது மட்டுமே comparative-உடன் 'other' எடுக்கிறது என்பதைக் கவனியுங்கள்.",
  tl:"Comparative matrum superlative-kku idaiye maatrudhal. 'Ram is the tallest boy in the class' = 'Ram is taller than any other boy in the class' = 'No other boy in the class is as tall as Ram'."}],

 s3:[
 {h:"Why 'other' matters",
  d:"   ✘ Ram is taller than ANY boy in the class.\n        Ram is IN the class!\n        → Ram is taller than Ram   impossible\n\n   ✔ Ram is taller than ANY OTHER boy in the class.\n        'other' removes Ram from the group\n\n   ┌──── the class ────┐\n   │  Ram   A  B  C  D │\n   │   ↑    └── others ┘\n   └───────────────────┘"},
 {h:"Same group or different group?",
  d:"   SAME GROUP → add OTHER\n     Ram is taller than any OTHER boy\n     in the class.\n\n   DIFFERENT GROUP → no OTHER\n     Ram is taller than any boy\n     in the OTHER class.\n     (Ram is not in that class)\n\n   Ask: is the speaker inside the group?"},
 {h:"The three equivalent forms",
  d:"   SUPERLATIVE:\n     Ram is THE TALLEST boy in the class.\n\n   COMPARATIVE (needs 'other'):\n     Ram is TALLER THAN ANY OTHER boy\n     in the class.\n\n   POSITIVE (needs 'no other'):\n     NO OTHER boy in the class is\n     AS TALL AS Ram.\n\n   ⚠ SUPERLATIVE NEVER TAKES 'OTHER'."}],

 s4:{
 wrong:["\"'Taller than any boy in the class' is complete.\" — It includes Ram himself.",
  "\"'Other' is optional decoration.\" — Without it the sentence is illogical.",
  "\"'The tallest of any other boy' is emphatic.\" — Superlatives never take 'other'.",
  "\"'Any other boys' is plural, so it must be right.\" — 'Any other' takes a singular noun."],
 right:["Ask whether the subject belongs to the group being compared.",
  "Same group → add 'other'. Different group → no 'other'.",
  "'Any other' + singular. 'All the other' + plural.",
  "Superlatives never take 'other'."]},

 s5:[
 {en:"Ram is taller than any other boy in the class.",ta:"வகுப்பில் உள்ள மற்ற எந்தப் பையனையும் விட ராம் உயரமானவன்.",tl:"Vaguppil ulla matra endhap paiyanaiyum vida Raam uyaramaanavan.",note:"Same group → ANY OTHER + singular."},
 {en:"Ram is taller than all the other boys in the class.",ta:"வகுப்பில் உள்ள மற்ற எல்லாப் பையன்களையும் விட ராம் உயரமானவன்.",tl:"Vaguppil ulla matra ellaap paiyangalaiyum vida Raam uyaramaanavan.",note:"Same group → ALL THE OTHER + plural."},
 {en:"Ram is taller than any boy in the other class.",ta:"மற்ற வகுப்பில் உள்ள எந்தப் பையனையும் விட ராம் உயரமானவன்.",tl:"Matra vaguppil ulla endhap paiyanaiyum vida Raam uyaramaanavan.",note:"Different group → no 'other' after 'any'."},
 {en:"Ram is the tallest boy in the class.",ta:"வகுப்பிலேயே ராம்தான் மிக உயரமான பையன்.",tl:"Vaguppileye Raam-dhaan miga uyaramaana paiyan.",note:"A superlative — no 'other' at all."},
 {en:"No other boy in the class is as tall as Ram.",ta:"வகுப்பில் வேறு எந்தப் பையனும் ராமைப் போல உயரமானவன் அல்ல.",tl:"Vaguppil veru endhap paiyanum Raamaip pola uyaramaanavan alla.",note:"The positive-degree version of the same idea."}],

 s7:[
 "Ram is taller than any ____ boy in the class.|other|Easy|Same group → ANY OTHER.",
 "Ram is taller than all the ____ boys.|other|Easy|Same group → ALL THE OTHER.",
 "Ram is taller than any boy in the ____ class.|other|Easy|A different group → 'the other class'.",
 "Ram is the ____ boy in the class.|tallest|Medium|A superlative takes no 'other'.",
 "No ____ boy is as tall as Ram.|other|Medium|The positive version takes 'no other'.",
 "Delhi is larger than any ____ city in India.|other|Medium|Same group → ANY OTHER.",
 "Gold is costlier than any ____ metal.|other|Medium|Same group → ANY OTHER.",
 "This is better than all the ____ options.|other|Hard|Same group → ALL THE OTHER.",
 "He works harder than any ____ employee here.|other|Hard|Same group → ANY OTHER.",
 "No ____ mountain is as high as Everest.|other|Hard|The positive version takes 'no other'.",
 "Iron is more useful than any ____ metal.|other|Hard|Same group → ANY OTHER.",
 "She sings better than all the ____ girls.|other|Expert|Same group → ALL THE OTHER.",
 "Everest is the ____ mountain in the world.|highest|Expert|A superlative takes no 'other'.",
 "This road is longer than any road in the ____ district.|other|Expert|A different group.",
 "No ____ student scored as much as he did.|other|Expert|The positive version takes 'no other'."],

 s8:[

 "Ram is the tallest of any other boy.|Ram is the tallest boy in the class.|A superlative never takes 'other'.",
 "Delhi is larger than any city in India.|Delhi is larger than any other city in India.|Delhi is in India, so 'other' is needed.",
 "No boy in the class is as tall as Ram.|No other boy in the class is as tall as Ram.|Ram is in the class, so 'other' is needed.",
 "Gold is costlier than any metal.|Gold is costlier than any other metal.|Gold is a metal, so 'other' is needed.",
 "He works harder than any other employees here.|He works harder than any other employee here.|'Any other' takes a singular noun.",
 "This is better than all the other option.|This is better than all the other options.|'All the other' takes a plural noun.",
 "Everest is higher than any other mountain in the world, the highest of all others.|Everest is the highest mountain in the world.|A superlative never takes 'other'.",
 "She sings better than all girls in the choir.|She sings better than all the other girls in the choir.|She is in the choir, so 'other' is needed."],

 s9:[

 s10:{
  en:"The logic is invisible when you read for meaning. 'Ram is taller than any boy in the class' sounds completely normal, but it quietly claims Ram is taller than himself. SSC plants this in Error Spotting because most candidates never test the logic. The second layer is number — 'any other' must take a singular noun, 'all the other' a plural one.",
  ta:"நீங்கள் பொருளுக்காகப் படிக்கும்போது தர்க்கம் கண்ணுக்குத் தெரியாது. 'Ram is taller than any boy in the class' முற்றிலும் சாதாரணமாக ஒலிக்கிறது, ஆனால் அது ராம் அவனையே விட உயரமானவன் என்று அமைதியாகக் கூறுகிறது. பெரும்பாலான தேர்வர்கள் தர்க்கத்தைச் சோதிப்பதில்லை என்பதால் SSC இதை Error Spotting-ல் வைக்கிறது. இரண்டாவது அடுக்கு எண் — 'any other' ஒருமைப் பெயர்ச்சொல்லை எடுக்க வேண்டும், 'all the other' பன்மையை.",
  tl:"Neengal porulukkaagap padikkumbodhu tharkkam kannukkuth theriyaadhu. 'Ram is taller than any boy in the class' mutrilum saadhaaranamaaga olikkiradhu, aanaal adhu Raam avanaiye vida uyaramaanavan endru amaidhiyaagak koorugiradhu."},

 s11:{
  en:"IS THE SUBJECT INSIDE THE GROUP? Then add OTHER.",
  ta:"Subject குழுவுக்குள் இருக்கிறாரா? அப்படியானால் OTHER சேர்க்கவும்.",
  tl:"Subject kuzhuvukkul irukkiraaraa? Appadiyaanaal OTHER serkkavum.",
  vis:"      IS HE INSIDE THE GROUP?\n\n   ┌──── the class ────┐\n   │  RAM   A  B  C  D │\n   │   ↑                │\n   └───────────────────┘\n   Ram is INSIDE → add OTHER\n     taller than ANY OTHER boy in the class ✔\n\n   ┌─ this class ─┐  ┌─ other class ─┐\n   │   RAM        │  │  A  B  C  D   │\n   └──────────────┘  └───────────────┘\n   Ram is OUTSIDE → no OTHER\n     taller than ANY boy in the OTHER class ✔\n\n   ⚠ NUMBER:\n     ANY OTHER    + singular noun\n     ALL THE OTHER+ plural noun\n\n   ⚠ SUPERLATIVE NEVER TAKES 'OTHER':\n     Ram is THE TALLEST boy in the class. ✔"},

 s13:[
 "Ram is taller than any ____ boy in the class, and he is also ____ of the two brothers.|other-the taller;—-the tallest;other-the tallest|0|Same group → OTHER. 'Of the two' → THE + comparative (Rule 94).",
 "Delhi is larger than any ____ city in India, but it is not so ____ as Mumbai.|other-crowded;—-crowded;other-more crowded|0|Same group → OTHER. 'Not so … as' takes the positive degree.",

 s14:{
  rule:"A comparative comparing a member with its own group must take 'other'; a superlative never does.",
  formula:"SAME GROUP → any OTHER + singular / all the OTHER + plural\nDIFFERENT GROUP → no 'other' after 'any'\nSUPERLATIVE → never takes 'other'\nThree equivalents: the tallest = taller than any other = no other is as tall as",
  memory:"Is the subject inside the group? Then add OTHER.",
  ta:"Subject அந்தக் குழுவுக்குள்ள இருக்கானா? அப்போ OTHER போடுங்க.",
  tl:"Subject andhak kuzhuvukkulla irukkaanaa? Appo OTHER podunga.",
  mistake:"Writing 'taller than any boy in the class' when the speaker is in that class.",
  exam:"SSC CGL / CHSL and Bank — a favourite Error Spotting item because the logic is invisible."},

 s15:[
 {ta:"இந்த rule-ஓட அழகு என்னன்னா, இது இலக்கணம் மட்டும் இல்ல — இது தர்க்கம். ஒரு நொடி யோசிச்சா புரிஞ்சுடும், ஆனா யோசிக்காம படிச்சா தப்பு தெரியாது.",
  tl:"Indha rule-oda azhagu ennannaa, idhu ilakkanam mattum illa — idhu tharkkam. Oru nodi yosichaa purinjudum, aanaa yosikkaama padichaa thappu theriyaadhu."},
 {ta:"'Ram is taller than any boy in the class.' — இது சரியா தோணும் இல்லையா? ஆனா ஒரு நொடி யோசிங்க. ராம் எங்க இருக்கான்? அதே வகுப்புல! அப்போ 'any boy in the class' -ல ராமும் அடங்குவான்!",
  tl:"'Ram is taller than any boy in the class.' — idhu sariyaa thonum illaiyaa? Aanaa oru nodi yosinga. Raam enga irukkaan? Adhe vaguppula! Appo 'any boy in the class'-la Raamum adanguvaan!"},
 {ta:"அப்படின்னா அந்த வாக்கியம் சொல்லுது — 'ராம் ராமை விட உயரமானவன்'! இது சாத்தியமா? இல்ல! அதனால 'OTHER' சேர்க்கணும். 'Ram is taller than any OTHER boy in the class' — இப்போ ராம் அந்தக் குழுவுல இருந்து விலக்கப்பட்டான். சரி!",
  tl:"Appadinnaa andha vaakkiyam solludhu — 'Raam Raamai vida uyaramaanavan'! Idhu saaththiyamaa? Illa! Adhanaala 'OTHER' serkkanum. 'Ram is taller than any OTHER boy in the class' — ippo Raam andhak kuzhuvula irundhu vilakkappattaan. Sari!"},
 {ta:"ஆனா கவனிங்க — குழு வேறன்னா 'other' தேவையில்ல! 'Ram is taller than any boy in the OTHER class' — இங்க ராம் அந்த வகுப்புல இல்ல, அதனால அவனை விலக்க தேவையில்ல. ஒரே கேள்வி கேளுங்க — 'இந்த ஆளு அந்தக் குழுவுக்குள்ள இருக்கானா?'",
  tl:"Aanaa kavaninga — kuzhu verannaa 'other' thevaiyilla! 'Ram is taller than any boy in the OTHER class' — inga Raam andha vaguppula illa. Ore kelvi kelunga — 'indha aalu andhak kuzhuvukkulla irukkaanaa?'"},
 {ta:"எண்ணையும் கவனிங்க. 'ANY OTHER' -க்கு அப்பறம் ஒருமை: 'any other BOY'. 'ALL THE OTHER' -க்கு அப்பறம் பன்மை: 'all the other BOYS'. 'Any other boys' தப்பு!",
  tl:"Ennaiyum kavaninga. 'ANY OTHER'-kku apparam orumai: 'any other BOY'. 'ALL THE OTHER'-kku apparam panmai: 'all the other BOYS'. 'Any other boys' thappu!"},
 {ta:"கடைசியா ஒரு முக்கியமான விஷயம் — SUPERLATIVE-க்கு 'other' ஒருபோதும் வராது! 'Ram is THE TALLEST boy in the class' — அவ்ளோதான், முடிஞ்சது. 'The tallest of any other boy' தப்பு. ஏன்? ஏன்னா superlative-லயே 'எல்லாரையும் விட' அப்படிங்கிற அர்த்தம் இருக்கு. மேலும் SSC மூணு வடிவத்தை மாத்திச் சொல்லச் சொல்லும்: 'Ram is THE TALLEST' = 'Ram is TALLER THAN ANY OTHER boy' = 'NO OTHER boy is AS TALL AS Ram'. இந்த மூணையும் சேர்த்து மனப்பாடம் பண்ணுங்க.",
  tl:"Kadaisiyaa oru mukkiyamaana vishayam — SUPERLATIVE-kku 'other' orupodhum varaadhu! Melum SSC moonu vadivaththai maaththich sollach sollum: 'Ram is THE TALLEST' = 'Ram is TALLER THAN ANY OTHER boy' = 'NO OTHER boy is AS TALL AS Ram'."}]},

/* ========== RULE 97 ========== */
{n:97,rc:"ADJ-04",d:"Hard",t:"Parallel Comparison and DOUBLE Comparatives with THE",
 tam:"The more...the better · Compare like with like",
 s1:{en:"When two comparatives move together, both take THE: 'THE MORE you read, THE MORE you learn'. And a comparison must compare LIKE WITH LIKE — a thing with a thing, not a thing with a person's possession.",
  ta:"இரண்டு comparative-கள் ஒன்றாக நகரும்போது, இரண்டும் THE எடுக்கின்றன: 'THE MORE you read, THE MORE you learn'. மேலும் ஒரு ஒப்பீடு ஒத்ததை ஒத்ததுடன் ஒப்பிட வேண்டும் — ஒரு பொருளை ஒரு பொருளுடன், ஒரு நபரின் உடைமையுடன் அல்ல.",
  tl:"Irandu comparative-gal ondraaga nagarumbodhu, irandum THE edukkindrana: 'THE MORE you read, THE MORE you learn'. Melum oru oppeedu oththadhai oththadhudan oppida vendum.",
  formula:"PARALLEL COMPARISON\n\n  THE + comparative … , THE + comparative …\n\n  THE HIGHER you climb, THE COLDER it gets.\n  THE MORE you read, THE MORE you learn.\n  THE SOONER, THE BETTER.\n\nCOMPARE LIKE WITH LIKE\n\n  ✔ My handwriting is better than YOURS.\n  ✔ My handwriting is better than THAT OF Ram.\n  ✘ My handwriting is better than RAM.\n     (compares handwriting with a person)"},

 s2:[
 {h:"Both halves need 'the'",
  en:"'More you read, more you learn' is wrong. Both comparatives take 'the': 'THE more you read, THE more you learn'. This 'the' is not the ordinary article — it is a special adverbial 'the' used only in this structure.",
  ta:"இரு பாதிகளுக்கும் 'the' தேவை. 'More you read, more you learn' தவறு. இரண்டு comparative-களும் 'the' எடுக்கின்றன: 'THE more you read, THE more you learn'. இந்த 'the' சாதாரண article அல்ல — இது இந்த அமைப்பில் மட்டுமே பயன்படுத்தப்படும் ஒரு சிறப்பு வினையடை 'the'.",
  tl:"Iru paadhigalukkum 'the' thevai. 'More you read, more you learn' thavaru. Irandu comparative-galum 'the' edukkindrana. Indha 'the' saadhaarana article alla."},
 {h:"Compare handwriting with handwriting",
  en:"'My handwriting is better than Ram' compares HANDWRITING with a PERSON. It must be 'better than Ram's' or 'better than that of Ram'. This is the most tested comparison error after 'any other'.",
  ta:"கையெழுத்தை கையெழுத்துடன் ஒப்பிடுங்கள். 'My handwriting is better than Ram' கையெழுத்தை ஒரு நபருடன் ஒப்பிடுகிறது. அது 'better than Ram's' அல்லது 'better than that of Ram' என்றுதான் இருக்க வேண்டும். 'Any other'-க்குப் பிறகு இதுதான் மிக அதிகமாகச் சோதிக்கப்படும் ஒப்பீட்டுத் தவறு.",
  tl:"Kaiyezhuththai kaiyezhuththudan oppidungal. 'My handwriting is better than Ram' kaiyezhuththai oru nabarudan oppidugiradhu. Adhu 'better than Ram's' alladhu 'better than that of Ram' endrudhaan irukka vendum."},
 {h:"THAT OF for singular, THOSE OF for plural",
  en:"'The climate of Chennai is hotter than THAT OF Delhi' — 'climate' is singular. 'The roads of Chennai are wider than THOSE OF Delhi' — 'roads' is plural. Match the number of the noun being compared.",
  ta:"ஒருமைக்கு THAT OF, பன்மைக்கு THOSE OF. 'The climate of Chennai is hotter than THAT OF Delhi' — 'climate' ஒருமை. 'The roads of Chennai are wider than THOSE OF Delhi' — 'roads' பன்மை. ஒப்பிடப்படும் பெயர்ச்சொல்லின் எண்ணுடன் பொருத்துங்கள்.",
  tl:"Orumaikku THAT OF, panmaikku THOSE OF. 'The climate of Chennai is hotter than THAT OF Delhi' — 'climate' orumai. 'The roads of Chennai are wider than THOSE OF Delhi' — 'roads' panmai."},
 {h:"'The' also appears before a comparative used adverbially",
  en:"'He is none THE worse for the accident', 'She is all THE better for the rest', 'So much THE better'. These fixed phrases all keep the 'the' before the comparative.",
  ta:"வினையடையாகப் பயன்படுத்தப்படும் comparative-க்கு முன்னும் 'the' தோன்றுகிறது. 'He is none THE worse for the accident', 'She is all THE better for the rest', 'So much THE better'. இந்த நிலையான தொடர்கள் அனைத்தும் comparative-க்கு முன் 'the'-ஐ வைத்திருக்கின்றன.",
  tl:"Vinaiyadaiyaagap payanpaduththappadum comparative-kku munnum 'the' thondrugiradhu. 'He is none THE worse for the accident', 'She is all THE better for the rest'."}],

 s3:[
 {h:"Both halves take THE",
  d:"   THE + comparative ,  THE + comparative\n\n   THE HIGHER you climb, THE COLDER it gets.\n   THE MORE you read,    THE MORE you learn.\n   THE SOONER,           THE BETTER.\n\n   ✘ More you read, more you learn.\n   ✘ The more you read, more you learn."},
 {h:"Compare like with like",
  d:"   ✘ My handwriting is better than RAM.\n        handwriting  vs  a person   ✘\n\n   ✔ My handwriting is better than RAM'S.\n   ✔ My handwriting is better than\n        THAT OF Ram.\n        handwriting  vs  handwriting  ✔"},
 {h:"THAT OF or THOSE OF?",
  d:"   SINGULAR noun  →  THAT OF\n     The climate of Chennai is hotter\n     than THAT OF Delhi.\n\n   PLURAL noun    →  THOSE OF\n     The roads of Chennai are wider\n     than THOSE OF Delhi.\n\n   ⚠ FIXED PHRASES WITH 'THE':\n     none THE worse · all THE better\n     so much THE better · none THE wiser"}],

 s4:{
 wrong:["\"'More you read, more you learn' is a proverb, so it is fine.\" — Both halves need 'the'.",
  "\"'Better than Ram' is short and clear.\" — It compares handwriting with a person.",
  "\"'That of' sounds unnecessarily formal.\" — It is required to compare like with like.",
  "\"'Those of' and 'that of' are interchangeable.\" — One is plural, one is singular."],
 right:["Put 'the' before BOTH comparatives in a parallel comparison.",
  "Check what is really being compared on each side.",
  "Use 'that of' for a singular noun, 'those of' for a plural.",
  "'Ram's' is a shorter correct alternative to 'that of Ram'."]},

 s5:[

 s9:[

 s10:{
  en:"'My handwriting is better than Ram' is invisible because the meaning is obvious. But grammatically it compares a piece of writing with a human being. The exam plants this in Error Spotting constantly. The second trap is the parallel structure — students remember the first 'the' and drop the second, giving 'The sooner you start, better it is'.",
  ta:"'My handwriting is better than Ram' கண்ணுக்குத் தெரியாது, ஏனெனில் பொருள் தெளிவாக இருக்கிறது. ஆனால் இலக்கண ரீதியாக அது ஒரு எழுத்துத் துண்டை ஒரு மனிதனுடன் ஒப்பிடுகிறது. தேர்வு இதை Error Spotting-ல் தொடர்ந்து வைக்கிறது. இரண்டாவது பொறி இணை அமைப்பு — மாணவர்கள் முதல் 'the'-ஐ நினைவில் வைத்து இரண்டாவதை விட்டுவிடுகிறார்கள், 'The sooner you start, better it is' என்று தருகிறார்கள்.",
  tl:"'My handwriting is better than Ram' kannukkuth theriyaadhu, yenenil porul thelivaaga irukkiradhu. Aanaal ilakkana reedhiyaaga adhu oru ezhuththuth thundai oru manidhanudan oppidugiradhu."},

 s11:{
  en:"BOTH HALVES TAKE 'THE'. And always ask: what exactly is being compared with what?",
  ta:"இரு பாதிகளும் 'THE' எடுக்கும். மேலும் எப்போதும் கேளுங்கள்: எது எதனுடன் ஒப்பிடப்படுகிறது?",
  tl:"Iru paadhigalum 'THE' edukkum. Melum eppodhum kelungal: edhu edhanudan oppidappadugiradhu?",
  vis:"      TWO RULES IN ONE\n\n   1. PARALLEL COMPARISON — both take THE\n\n      THE HIGHER you climb, THE COLDER it gets.\n      THE MORE you read,    THE MORE you learn.\n      THE SOONER,           THE BETTER.\n\n      ✘ More you read, more you learn.\n\n   2. COMPARE LIKE WITH LIKE\n\n      ✘ My handwriting is better than RAM.\n           writing  vs  person\n      ✔ My handwriting is better than RAM'S.\n      ✔ ... better than THAT OF Ram.\n           writing  vs  writing\n\n      SINGULAR → THAT OF\n      PLURAL   → THOSE OF\n\n   ⚠ FIXED PHRASES:\n     none THE worse · all THE better\n     so much THE better · none THE wiser"},

 s13:[

 s14:{
  rule:"In a parallel comparison both comparatives take 'the'; and a comparison must compare like with like.",
  formula:"THE + comparative, THE + comparative\nCOMPARE LIKE WITH LIKE:\n  singular noun → THAT OF\n  plural noun → THOSE OF\n  or use the possessive: Ram's\nFixed: none the worse, all the better, none the wiser",
  memory:"Both halves take THE. Ask what is being compared with what.",
  ta:"ரெண்டு பாதியிலயும் THE வரும். எது எதோட ஒப்பிடப்படுதுன்னு கேளுங்க.",
  tl:"Rendu paadhiyilayum THE varum. Edhu edhoda oppidappadudhunnu kelunga.",
  mistake:"Writing 'My handwriting is better than Ram' and 'The sooner you start, better it is'.",
  exam:"SSC CGL / CHSL and Bank — 'than that of' versus 'than those of' is a repeated one-mark item."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு தனித்தனி விஷயம் இருக்கு. ரெண்டுமே ஒப்பீடு பத்தி, ஆனா வேற வேற கோணத்துல.",
  tl:"Indha rule-la rendu thanithani vishayam irukku. Rendume oppeedu paththi, aanaa veru veru konaththula."},
 {ta:"முதல் விஷயம் — இணை ஒப்பீடு. 'THE more you read, THE more you learn.' ரெண்டு பாதியிலயும் 'the' வரும். நிறைய பேரு முதல் 'the' போட்டுட்டு ரெண்டாவதை மறந்துடுவாங்க — 'The sooner you start, better it is' — தப்பு! 'The better it is' தான் சரி.",
  tl:"Mudhal vishayam — inai oppeedu. 'THE more you read, THE more you learn.' Rendu paadhiyilayum 'the' varum. Neraiya peru mudhal 'the' pottuttu randaavadhai marandhuduvaanga."},
 {ta:"இந்த 'the' சாதாரண article இல்ல. இது ஒரு சிறப்பு வடிவம், இந்த அமைப்புல மட்டும் வரும். 'The higher you climb, the colder it gets.' 'The more, the merrier.' 'The sooner, the better.'",
  tl:"Indha 'the' saadhaarana article illa. Idhu oru sirappu vadivam, indha amaippula mattum varum. 'The higher you climb, the colder it gets.' 'The sooner, the better.'"},
 {ta:"இப்போ ரெண்டாவது விஷயம் — இது SSC-ல ரொம்ப அடிக்கடி வரும். 'My handwriting is better than Ram.' அர்த்தம் புரியுது இல்லையா? ஆனா இலக்கணப்படி பாருங்க — நீங்க எதை எதோட ஒப்பிடுறீங்க? 'கையெழுத்து'-ஐ 'ராம்'-ஓட! ஒரு எழுத்தை ஒரு மனுஷனோட ஒப்பிடமுடியுமா?",
  tl:"Ippo randaavadhu vishayam — idhu SSC-la romba adikkadi varum. 'My handwriting is better than Ram.' Aanaa ilakkanappadi paarunga — neenga edhai edhoda oppidureenga? 'Kaiyezhuththu'-ai 'Raam'-oda!"},
 {ta:"சரியான வடிவம் ரெண்டு இருக்கு. ஒண்ணு — 'better than RAM'S' (ராமுடையதை விட). ரெண்டு — 'better than THAT OF Ram'. ரெண்டுமே கையெழுத்தை கையெழுத்தோட ஒப்பிடுது.",
  tl:"Sariyaana vadivam rendu irukku. Onnu — 'better than RAM'S'. Rendu — 'better than THAT OF Ram'. Rendume kaiyezhuththai kaiyezhuththoda oppidudhu."},
 {ta:"கடைசியா ஒரு முக்கியமான நுட்பம் — THAT OF மற்றும் THOSE OF. இது எண்ணை பொறுத்தது! 'The CLIMATE of Chennai is hotter than THAT OF Delhi' — climate ஒருமை, அதனால 'that of'. 'The ROADS of Chennai are wider than THOSE OF Delhi' — roads பன்மை, அதனால 'those of'. SSC இதை மாத்தி மாத்தி கேட்கும். எப்பவும் ஒப்பிடப்படுற பெயர்ச்சொல்லை பாருங்க — அது ஒருமையா பன்மையா?",
  tl:"Kadaisiyaa oru mukkiyamaana nutpam — THAT OF matrum THOSE OF. Idhu ennai poruththadhu! 'The CLIMATE ... THAT OF Delhi' — climate orumai. 'The ROADS ... THOSE OF Delhi' — roads panmai."}]},

/* ========== RULE 98 ========== */
{n:98,rc:"ADJ-05",d:"Medium",t:"Adjective Pairs that are Commonly Confused",
 tam:"Elder/Older · Latest/Last · Farther/Further · Later/Latter",
 s1:{en:"Several adjective pairs look alike but split by meaning. ELDER/ELDEST is for family only; OLDER/OLDEST for everything. LATEST is most recent; LAST is final. FARTHER is distance; FURTHER is additional. LATER is time; LATTER is the second of two.",
  ta:"பல பெயரடை ஜோடிகள் ஒரே மாதிரி தெரிகின்றன ஆனால் பொருளால் பிரிகின்றன. ELDER/ELDEST குடும்பத்திற்கு மட்டும்; OLDER/OLDEST எல்லாவற்றுக்கும். LATEST மிக சமீபத்தியது; LAST இறுதியானது. FARTHER தூரம்; FURTHER கூடுதலானது. LATER நேரம்; LATTER இரண்டில் இரண்டாவது.",
  tl:"Pala peyaradai jodigal ore maadhiri therigindrana aanaal porulaal pirigindrana. ELDER/ELDEST kudumbaththirku mattum; OLDER/OLDEST ellaavatrukkum. LATEST miga sameebaththiyadhu; LAST irudhiyaanadhu.",
  formula:"ELDER / ELDEST  →  family only, no 'than'\n  My ELDER brother · the ELDEST son\nOLDER / OLDEST  →  everything, takes 'than'\n  This building is OLDER THAN that one.\n\nLATEST  →  most recent      LAST  →  final\n  the LATEST news             the LAST chapter\n\nFARTHER →  physical distance FURTHER → additional\n  ten km FARTHER              FURTHER information\n\nLATER   →  time              LATTER → second of two\n  I will call LATER.          the LATTER half"},

 s2:[
 {h:"ELDER stays inside the family",
  en:"'My elder brother', 'my eldest sister', 'the elder of the two sons'. But you cannot say 'He is elder than me' — 'elder' never takes 'than'. Use 'older than' for that. And a building or a tree is always 'older', never 'elder'.",
  ta:"ELDER குடும்பத்திற்குள்ளேயே இருக்கிறது. 'My elder brother', 'my eldest sister', 'the elder of the two sons'. ஆனால் 'He is elder than me' என்று சொல்ல முடியாது — 'elder' ஒருபோதும் 'than' எடுக்காது. அதற்கு 'older than' பயன்படுத்துங்கள். மேலும் ஒரு கட்டிடம் அல்லது ஒரு மரம் எப்போதும் 'older', ஒருபோதும் 'elder' அல்ல.",
  tl:"ELDER kudumbaththirkulleye irukkiradhu. 'My elder brother', 'my eldest sister'. Aanaal 'He is elder than me' endru solla mudiyaadhu — 'elder' orupodhum 'than' edukkaadhu."},
 {h:"LATEST is recent, LAST is final",
  en:"'His latest novel' means the most recent one and more may follow. 'His last novel' means the final one — he may have died or stopped writing. The difference is important and SSC tests it.",
  ta:"LATEST சமீபத்தியது, LAST இறுதியானது. 'His latest novel' மிக சமீபத்திய ஒன்றைக் குறிக்கிறது, இன்னும் வரலாம். 'His last novel' இறுதியானதைக் குறிக்கிறது — அவர் இறந்திருக்கலாம் அல்லது எழுதுவதை நிறுத்தியிருக்கலாம். வேறுபாடு முக்கியமானது, SSC அதைச் சோதிக்கிறது.",
  tl:"LATEST sameebaththiyadhu, LAST irudhiyaanadhu. 'His latest novel' miga sameebaththiya ondraik kurikkiradhu, innum varalaam. 'His last novel' irudhiyaanadhaik kurikkiradhu."},
 {h:"FARTHER is measurable, FURTHER is abstract",
  en:"'The school is two kilometres farther' — you can measure it. 'We need further information' — you cannot measure information. In modern usage 'further' is accepted for both, but exams still prefer 'farther' for physical distance.",
  ta:"FARTHER அளவிடக்கூடியது, FURTHER சுருக்கமானது. 'The school is two kilometres farther' — அதை அளவிட முடியும். 'We need further information' — தகவலை அளவிட முடியாது. நவீன பயன்பாட்டில் இரண்டுக்கும் 'further' ஏற்கப்படுகிறது, ஆனால் தேர்வுகள் இன்னும் உடல் தூரத்திற்கு 'farther' விரும்புகின்றன.",
  tl:"FARTHER alavidakkoodiyadhu, FURTHER surukkamaanadhu. 'The school is two kilometres farther' — adhai alavida mudiyum. 'We need further information' — thagavalai alavida mudiyaadhu."},
 {h:"LATTER always has a FORMER",
  en:"'Of Ram and Shyam, the FORMER is a doctor and the LATTER an engineer' — former is the first, latter is the second. 'Latter' works only with exactly two items, and 'later' is about time, never about order.",
  ta:"LATTER-க்கு எப்போதும் ஒரு FORMER உண்டு. 'Of Ram and Shyam, the FORMER is a doctor and the LATTER an engineer' — former முதலாவது, latter இரண்டாவது. 'Latter' சரியாக இரண்டு பொருட்களுடன் மட்டுமே வேலை செய்கிறது, மேலும் 'later' நேரம் பற்றியது, ஒருபோதும் வரிசை பற்றியது அல்ல.",
  tl:"LATTER-kku eppodhum oru FORMER undu. 'Of Ram and Shyam, the FORMER is a doctor and the LATTER an engineer'. 'Latter' sariyaaga irandu porutkaludan mattume velai seygiradhu."}],

 s3:[
 {h:"ELDER versus OLDER",
  d:"   ELDER / ELDEST  →  FAMILY ONLY\n     my ELDER brother\n     the ELDEST son\n     ⚠ NEVER takes 'than'\n\n   OLDER / OLDEST  →  EVERYTHING\n     This building is OLDER THAN that.\n     He is OLDER THAN me.\n\n   ✘ He is elder than me.\n   ✔ He is older than me.\n   ✔ He is my elder brother."},
 {h:"LATEST / LAST · FARTHER / FURTHER",
  d:"   LATEST  →  most recent, more may follow\n     the LATEST news · his LATEST film\n   LAST    →  final, nothing after\n     the LAST chapter · his LAST words\n\n   FARTHER →  physical distance (measurable)\n     ten kilometres FARTHER\n   FURTHER →  additional (abstract)\n     FURTHER information · FURTHER delay"},
 {h:"LATER / LATTER and FORMER",
  d:"   LATER   →  time\n     I will call you LATER.\n\n   LATTER  →  the SECOND of two\n   FORMER  →  the FIRST of two\n\n     Of Ram and Shyam,\n     the FORMER is a doctor,\n     the LATTER an engineer.\n\n   ⚠ 'Latter' needs exactly TWO items."}],

 s4:{
 wrong:["\"'He is elder than me' is respectful English.\" — 'Elder' never takes 'than'.",
  "\"'Latest' and 'last' mean the same.\" — One is recent, the other is final.",
  "\"'Further' always works for distance.\" — Exams prefer 'farther' for physical distance.",
  "\"'Later' and 'latter' are spelling variants.\" — One is time, the other is order."],
 right:["Elder for family, older for everything, and only 'older' takes 'than'.",
  "Latest = most recent. Last = final.",
  "Farther for measurable distance, further for additional.",
  "Latter is the second of two and always pairs with 'former'."]},

 s6:["elder|மூத்த (குடும்பம்)|Mooththa (kudumbam)",
  "older|பழைய / வயதான|Pazhaiya / vayadhaana",

 s9:[

 s10:{
  en:"'He is elder than me' is the single most common of these errors in Indian English, because 'elder' feels more respectful. The rule is mechanical: 'elder' can never be followed by 'than'. The 'latest/last' pair matters because the meanings genuinely differ, and 'latter/later' differ by one letter but by a whole category.",
  ta:"'He is elder than me' இந்திய ஆங்கிலத்தில் இந்தத் தவறுகளில் மிகப் பொதுவானது, ஏனெனில் 'elder' அதிக மரியாதையாக உணரப்படுகிறது. விதி இயந்திரத்தனமானது: 'elder'-ஐத் தொடர்ந்து ஒருபோதும் 'than' வர முடியாது. 'Latest/last' ஜோடி முக்கியம், ஏனெனில் பொருள்கள் உண்மையிலேயே வேறுபடுகின்றன, மேலும் 'latter/later' ஒரு எழுத்தால் வேறுபடுகின்றன ஆனால் ஒரு முழு வகையால்.",
  tl:"'He is elder than me' Indhiya Aangilaththil indhath thavarugalil migap podhuvaanadhu. Vidhi iyandhiraththanamaanadhu: 'elder'-aith thodarndhu orupodhum 'than' vara mudiyaadhu."},

 s11:{
  en:"ELDER never takes THAN. LATEST is recent, LAST is final. FARTHER you can measure.",
  ta:"ELDER ஒருபோதும் THAN எடுக்காது. LATEST சமீபத்தியது, LAST இறுதியானது. FARTHER-ஐ அளவிட முடியும்.",
  tl:"ELDER orupodhum THAN edukkaadhu. LATEST sameebaththiyadhu, LAST irudhiyaanadhu. FARTHER-ai alavida mudiyum.",
  vis:"      FOUR CONFUSED PAIRS\n\n   ELDER / ELDEST   →  family only, NO 'than'\n     my ELDER brother · the ELDEST son\n   OLDER / OLDEST   →  everything, takes 'than'\n     OLDER THAN me · the OLDEST tree\n\n   LATEST  →  most recent (more may follow)\n   LAST    →  final (nothing after)\n\n   FARTHER →  physical distance (measurable)\n   FURTHER →  additional (abstract)\n\n   LATER   →  time\n   LATTER  →  the SECOND of two\n   FORMER  →  the FIRST of two\n\n   ⚠ THE INDIAN-ENGLISH TRAP:\n     'He is ELDER THAN me'  ✘\n     'He is OLDER THAN me'  ✔\n     'He is my ELDER brother' ✔"},

 s14:{
  rule:"Elder is for family and never takes 'than'; latest is recent and last is final; farther is distance and further is additional; latter is the second of two.",
  formula:"ELDER/ELDEST → family only, no 'than'\nOLDER/OLDEST → everything, takes 'than'\nLATEST = most recent | LAST = final\nFARTHER = measurable distance | FURTHER = additional\nLATER = time | LATTER = second of two (pairs with FORMER)",
  memory:"Elder never takes 'than'. Farther you can measure.",
  ta:"Elder-க்கு 'than' வராது. Farther-ஐ அளக்க முடியும்.",
  tl:"Elder-kku 'than' varaadhu. Farther-ai alakka mudiyum.",
  mistake:"Writing 'He is elder than me' and using 'last' when 'latest' is meant.",
  exam:"SSC CGL / CHSL and Bank — 'elder than' is one of the most repeated Indian-English errors."},

 s15:[
 {ta:"இந்த rule-ல நாலு ஜோடி இருக்கு. ஒவ்வொண்ணும் ஒரே மாதிரி தெரியும், ஆனா அர்த்தம் வேற.",
  tl:"Indha rule-la naalu jodi irukku. Ovvonnum ore maadhiri theriyum, aanaa arththam veru."},
 {ta:"முதல் ஜோடி — ELDER மற்றும் OLDER. இதுல ஒரு தப்பு நாம எல்லாருமே பண்ணுவோம். 'He is ELDER than me' — இது தப்பு! ஏன்? ஏன்னா 'elder' -க்கு 'than' ஒருபோதும் வராது!",
  tl:"Mudhal jodi — ELDER matrum OLDER. Idhula oru thappu naama ellaarume pannuvom. 'He is ELDER than me' — idhu thappu! Yennaa 'elder'-kku 'than' orupodhum varaadhu!"},
 {ta:"'Elder' குடும்பத்துக்குள்ள மட்டும் வரும், அதுவும் பெயர்ச்சொல்லுக்கு முன்னாடி. 'My ELDER brother' சரி. 'The ELDEST son' சரி. ஆனா ஒப்பீடு பண்ணனும்னா 'OLDER than' தான். 'He is OLDER than me' சரி. மேலும் — கட்டிடம், மரம், பொருள் எதுவானாலும் 'older' தான், 'elder' இல்ல.",
  tl:"'Elder' kudumbaththukkulla mattum varum. 'My ELDER brother' sari. Aanaa oppeedu pannanumnaa 'OLDER than' thaan. Melum — kattidam, maram, porul edhuvaanaalum 'older' thaan."},
 {ta:"ரெண்டாவது ஜோடி — LATEST மற்றும் LAST. இது அர்த்தத்துல பெரிய வித்தியாசம்! 'His LATEST novel' — சமீபத்தில வந்த நாவல், இன்னும் வரலாம். 'His LAST novel' — கடைசி நாவல், இனிமே வராது, அவரு இறந்திருக்கலாம் அல்லது எழுதுவதை நிறுத்தியிருக்கலாம்.",
  tl:"Randaavadhu jodi — LATEST matrum LAST. 'His LATEST novel' — sameebaththila vandha naaval, innum varalaam. 'His LAST novel' — kadaisi naaval, inime varaadhu."},
 {ta:"மூணாவது — FARTHER மற்றும் FURTHER. FARTHER அளக்கக்கூடிய தூரம். 'Two kilometres FARTHER'. FURTHER சுருக்கமான கூடுதல். 'FURTHER information', 'FURTHER delay'. எளிய சோதனை — 'இதை மீட்டர்ல அளக்க முடியுமா?' முடிஞ்சா farther, முடியலைன்னா further.",
  tl:"Moonaavadhu — FARTHER matrum FURTHER. FARTHER alakkakkoodiya thooram. FURTHER surukkamaana koodudhal. Eliya sodhanai — 'idhai meter-la alakka mudiyumaa?'"},
 {ta:"கடைசி ஜோடி — LATER மற்றும் LATTER. ஒரு எழுத்து வித்தியாசம், ஆனா முழு அர்த்தமும் வேற! LATER நேரம் — 'I will call you LATER'. LATTER வரிசை — 'Of Ram and Shyam, the LATTER is an engineer' (ரெண்டாமவரு). LATTER-க்கு எப்பவும் ஒரு FORMER இருக்கும் (முதலாமவரு). மேலும் LATTER சரியா ரெண்டு பொருளுக்கு மட்டும்தான் — மூணு இருந்தா 'the last' சொல்லணும்.",
  tl:"Kadaisi jodi — LATER matrum LATTER. Oru ezhuththu viththiyaasam, aanaa muzhu arththamum veru! LATER neram. LATTER varisai — 'the LATTER is an engineer'. LATTER-kku eppavum oru FORMER irukkum."}]},
/* ========== RULE 99 ========== */
{n:99,rc:"ADV-01",d:"Hard",t:"ADJECTIVE or ADVERB? The Linking-Verb Rule",
 tam:"Linking verb-க்கு அப்பறம் பெயரடை · Action verb-க்கு அப்பறம் வினையடை",
 s1:{en:"After a LINKING verb — BE, SEEM, APPEAR, LOOK, FEEL, SMELL, TASTE, SOUND, BECOME, GROW, TURN, REMAIN — use an ADJECTIVE, not an adverb. After an ACTION verb, use an ADVERB.",
  ta:"ஒரு LINKING verb-க்குப் பிறகு — BE, SEEM, APPEAR, LOOK, FEEL, SMELL, TASTE, SOUND, BECOME, GROW, TURN, REMAIN — ஒரு பெயரடை பயன்படுத்தவும், வினையடை அல்ல. ஒரு ACTION verb-க்குப் பிறகு ஒரு வினையடை பயன்படுத்தவும்.",
  tl:"Oru LINKING verb-kkup piragu — BE, SEEM, APPEAR, LOOK, FEEL, SMELL, TASTE, SOUND, BECOME, GROW, TURN, REMAIN — oru peyaradai payanpaduththavum, vinaiyadai alla. Oru ACTION verb-kkup piragu oru vinaiyadai.",
  formula:"LINKING VERB  +  ADJECTIVE\n  The flower smells SWEET.      ✔\n  The flower smells SWEETLY.    ✘\n  She looks BEAUTIFUL.          ✔\n  He feels BAD about it.        ✔\n\nACTION VERB  +  ADVERB\n  He runs QUICKLY.              ✔\n  She sang BEAUTIFULLY.         ✔\n  He smelled the flower CAREFULLY. ✔\n     (here 'smelled' is an action)"},

 s2:[
 {h:"A linking verb describes the SUBJECT",
  en:"'The flower smells sweet' does not describe the smelling — it describes the FLOWER. Since it describes a noun, it must be an adjective. 'The soup tastes good' describes the soup, not the tasting.",
  ta:"ஒரு linking verb Subject-ஐ விவரிக்கிறது. 'The flower smells sweet' மணப்பதை விவரிக்கவில்லை — அது பூவை விவரிக்கிறது. அது ஒரு பெயர்ச்சொல்லை விவரிப்பதால், அது ஒரு பெயரடையாக இருக்க வேண்டும். 'The soup tastes good' சூப்பை விவரிக்கிறது, சுவைப்பதை அல்ல.",
  tl:"Oru linking verb Subject-ai vivarikkiradhu. 'The flower smells sweet' manappadhai vivarikkavillai — adhu poovai vivarikkiradhu. Adhu oru peyarcholai vivarippadhaal, adhu oru peyaradaiyaaga irukka vendum."},
 {h:"The same verb can be either",
  en:"'The flower smells sweet' — linking, so adjective. 'He smelled the flower carefully' — action, so adverb. Replace the verb with 'is': if the sentence still makes sense, it is a linking verb.",
  ta:"ஒரே வினைச்சொல் இரண்டாகவும் இருக்கலாம். 'The flower smells sweet' — linking, எனவே பெயரடை. 'He smelled the flower carefully' — action, எனவே வினையடை. வினைச்சொல்லை 'is'-ஆல் மாற்றுங்கள்: வாக்கியம் இன்னும் பொருள்படுமானால், அது ஒரு linking verb.",
  tl:"Ore vinaichol irandaagavum irukkalaam. 'The flower smells sweet' — linking, enave peyaradai. 'He smelled the flower carefully' — action, enave vinaiyadai. Vinaicholai 'is'-aal maatrungal."},
 {h:"GOOD is an adjective, WELL is an adverb",
  en:"'He plays WELL' — an action, so an adverb. 'He looks GOOD' — linking, so an adjective. But careful: 'He looks WELL' is also correct, because 'well' can be an adjective meaning 'in good health'.",
  ta:"GOOD ஒரு பெயரடை, WELL ஒரு வினையடை. 'He plays WELL' — ஒரு செயல், எனவே ஒரு வினையடை. 'He looks GOOD' — linking, எனவே ஒரு பெயரடை. ஆனால் கவனம்: 'He looks WELL'-ம் சரி, ஏனெனில் 'well' 'நல்ல உடல்நலத்தில்' என்று பொருள்படும் ஒரு பெயரடையாகவும் இருக்கலாம்.",
  tl:"GOOD oru peyaradai, WELL oru vinaiyadai. 'He plays WELL' — oru seyal, enave oru vinaiyadai. 'He looks GOOD' — linking, enave oru peyaradai. Aanaal kavanam: 'He looks WELL'-um sari."},
 {h:"Some adverbs have two forms with different meanings",
  en:"HARD means with effort; HARDLY means almost not. LATE means not on time; LATELY means recently. NEAR means close; NEARLY means almost. HIGH is position; HIGHLY is degree. These pairs are tested constantly.",
  ta:"சில வினையடைகளுக்கு வெவ்வேறு பொருள்களுடன் இரண்டு வடிவங்கள் உள்ளன. HARD என்றால் முயற்சியுடன்; HARDLY என்றால் கிட்டத்தட்ட இல்லை. LATE என்றால் நேரத்தில் இல்லை; LATELY என்றால் சமீபத்தில். NEAR என்றால் அருகில்; NEARLY என்றால் கிட்டத்தட்ட. HIGH நிலை; HIGHLY அளவு. இந்த ஜோடிகள் தொடர்ந்து சோதிக்கப்படுகின்றன.",
  tl:"Sila vinaiyadaigalukku vevveru porulgaludan irandu vadivangal ullana. HARD endraal muyarchiyudan; HARDLY endraal kittaththatta illai. LATE endraal neraththil illai; LATELY endraal sameebaththil."}],

 s3:[
 {h:"Who is being described?",
  d:"   The flower smells SWEET.\n        ↑              ↑\n     describes the FLOWER (a noun)\n     → must be an ADJECTIVE\n\n   He runs QUICKLY.\n           ↑\n     describes the RUNNING (an action)\n     → must be an ADVERB"},
 {h:"The 'is' test",
  d:"   Replace the verb with 'IS':\n\n   'The flower smells sweet'\n     → 'The flower IS sweet'  ✔ makes sense\n     → LINKING verb → ADJECTIVE\n\n   'He smelled the flower carefully'\n     → 'He IS the flower carefully' ✘ nonsense\n     → ACTION verb → ADVERB\n\n   THE LINKING VERBS:\n     be · seem · appear · look · feel\n     smell · taste · sound · become\n     grow · turn · remain · stay · prove"},
 {h:"Adverb pairs with different meanings",
  d:"   HARD    with effort     HARDLY  almost not\n     works HARD              HARDLY works\n\n   LATE    not on time      LATELY  recently\n     came LATE               has come LATELY\n\n   NEAR    close            NEARLY  almost\n     stood NEAR              NEARLY fell\n\n   HIGH    position         HIGHLY  degree\n     flew HIGH               HIGHLY respected\n\n   ⚠ These are opposite in meaning, not variants."}],

 s4:{
 wrong:["\"'The flower smells sweetly' is more correct English.\" — 'Sweet' describes the flower.",
  "\"Adverbs always end in -ly.\" — 'Hard', 'fast' and 'late' are adverbs without -ly.",
  "\"'Hardly' is just a stronger 'hard'.\" — It means almost not.",
  "\"'He looks good' should be 'looks well'.\" — Both are correct, with different meanings."],
 right:["Ask whether the word describes the subject or the action.",
  "Replace the verb with 'is' — if it works, use an adjective.",
  "Learn the linking-verb list by heart.",
  "Hard/hardly, late/lately, near/nearly are opposites, not variants."]},

 s5:[
 {en:"The rose in the garden smells very sweet.",ta:"தோட்டத்தில் உள்ள ரோஜா மிக இனிமையாக மணக்கிறது.",tl:"Thottaththil ulla roja miga inimaiyaaga manakkiradhu.",note:"'Smells' is linking → the adjective SWEET."},
 {en:"He smelled the flower carefully before buying it.",ta:"வாங்குவதற்கு முன் அவர் பூவை கவனமாக முகர்ந்து பார்த்தார்.",tl:"Vaanguvadharku mun avar poovai kavanamaaga mugarndhu paarththaar.",note:"'Smelled' is an action → the adverb CAREFULLY."},
 {en:"She looks beautiful in that blue saree.",ta:"அந்த நீல புடவையில் அவர் அழகாக இருக்கிறார்.",tl:"Andha neela pudavaiyil avar azhagaaga irukkiraar.",note:"'Looks' is linking → the adjective BEAUTIFUL."},
 {en:"He works hard but hardly earns enough.",ta:"அவர் கடினமாக உழைக்கிறார் ஆனால் போதுமான அளவு சம்பாதிப்பதில்லை.",tl:"Avar kadinamaaga uzhaikkiraar aanaal podhumaana alavu sambaadhippadhillai.",note:"HARD = with effort; HARDLY = almost not."},
 {en:"The soup tastes good but looks bad.",ta:"சூப் நன்றாக இருக்கிறது ஆனால் பார்க்க மோசமாக இருக்கிறது.",tl:"Soup nandraaga irukkiradhu aanaal paarkka mosamaaga irukkiradhu.",note:"Both verbs are linking → adjectives GOOD and BAD."}],

 s6:["linking verb|இணைப்பு வினைச்சொல்|Inaippu vinaichol",
  "action verb|செயல் வினைச்சொல்|Seyal vinaichol",

  "adverb|வினையடை|Vinaiyadai",
  "smells sweet|இனிமையாக மணக்கிறது|Inimaiyaaga manakkiradhu",
  "tastes good|நன்றாக இருக்கிறது|Nandraaga irukkiradhu",
  "hard|கடினமாக|Kadinamaaga",
  "hardly|கிட்டத்தட்ட இல்லை|Kittaththatta illai",

  "lately|சமீபத்தில்|Sameebaththil",

 s7:[
 "The rose smells very ____ .|sweet|Easy|'Smells' is linking → an adjective.",
 "He smelled the flower ____ .|carefully|Easy|'Smelled' is an action → an adverb.",
 "She looks ____ in that saree.|beautiful|Easy|'Looks' is linking → an adjective.",
 "He runs very ____ .|quickly|Medium|'Runs' is an action → an adverb.",
 "The soup tastes ____ .|good|Medium|'Tastes' is linking → an adjective.",
 "He works ____ every single day.|hard|Medium|HARD = with effort.",
 "He ____ earns enough to survive.|hardly|Medium|HARDLY = almost not.",
 "The music sounds ____ to my ears.|pleasant|Hard|'Sounds' is linking → an adjective.",
 "She sang the song ____ .|beautifully|Hard|'Sang' is an action → an adverb.",
 "He came ____ to the meeting today.|late|Hard|LATE = not on time.",
 "I have not seen him ____ .|lately|Hard|LATELY = recently.",
 "The milk turned ____ overnight.|sour|Expert|'Turned' is linking → an adjective.",
 "He is ____ respected in his field.|highly|Expert|HIGHLY = degree.",
 "The bird flew ____ above the trees.|high|Expert|HIGH = position.",
 "She ____ fell down the stairs.|nearly|Expert|NEARLY = almost."],

 s8:[
 "The rose smells very sweetly.|The rose smells very sweet.|'Smells' is linking, so an adjective is needed.",
 "He smelled the flower careful.|He smelled the flower carefully.|'Smelled' is an action, so an adverb is needed.",
 "She looks beautifully in that saree.|She looks beautiful in that saree.|'Looks' is linking, so an adjective is needed.",
 "He runs very quick.|He runs very quickly.|'Runs' is an action, so an adverb is needed.",
 "The soup tastes well.|The soup tastes good.|'Tastes' is linking, so an adjective is needed.",
 "He works hardly every single day.|He works hard every single day.|'Hardly' means almost not.",
 "The music sounds pleasantly to my ears.|The music sounds pleasant to my ears.|'Sounds' is linking, so an adjective is needed.",
 "She sang the song beautiful.|She sang the song beautifully.|'Sang' is an action, so an adverb is needed.",
 "I have not seen him late.|I have not seen him lately.|'Lately' means recently.",
 "The milk turned sourly overnight.|The milk turned sour overnight.|'Turned' is linking, so an adjective is needed."],

 s9:[
 "Fill in the Blank|The freshly baked bread in the corner shop smells absolutely ____ .|wonderfully;wonderful|1|'Smells' is a linking verb, so an adjective is needed.",
 "Find the Error|She looked very (A) beautifully in the (B) blue silk saree (C) she wore yesterday (D).|A;B;C;D|1|Part B. 'Looked' is linking → the adjective 'beautiful'.",
 "Sentence Improvement|He works hardly from morning till night and still earns very little.|works hardly;works hard;hardly works|1|'Hard' means with effort; 'hardly' means almost not.",
 "Fill in the Blank|I have not met him ____ , though we used to see each other every week.|late;lately|1|LATELY means recently.",
 "Find the Error|The milk kept (A) outside the fridge (B) turned sourly (C) within a few hours (D).|A;B;C;D|2|Part C. 'Turned' is linking → the adjective 'sour'."],

 s10:{
  en:"'The flower smells sweetly' feels correct because we are taught that adverbs describe verbs. But 'smells' here is a linking verb — it describes the flower, not the smelling. The second trap is the -ly pairs: 'hardly', 'lately' and 'nearly' are not intensified forms of 'hard', 'late' and 'near'. They mean something entirely different.",
  ta:"'The flower smells sweetly' சரியென உணரப்படுகிறது, ஏனெனில் வினையடைகள் வினைச்சொற்களை விவரிக்கின்றன என்று நமக்குக் கற்பிக்கப்படுகிறது. ஆனால் இங்கே 'smells' ஒரு linking verb — அது பூவை விவரிக்கிறது, மணப்பதை அல்ல. இரண்டாவது பொறி -ly ஜோடிகள்: 'hardly', 'lately' மற்றும் 'nearly' 'hard', 'late' மற்றும் 'near'-ன் தீவிரப்படுத்தப்பட்ட வடிவங்கள் அல்ல. அவை முற்றிலும் வேறு ஒன்றைக் குறிக்கின்றன.",
  tl:"'The flower smells sweetly' sariyena unarappadugiradhu. Aanaal inge 'smells' oru linking verb — adhu poovai vivarikkiradhu, manappadhai alla. Irandaavadhu pori -ly jodigal."},

 s11:{
  en:"REPLACE THE VERB WITH 'IS'. If it still makes sense, use an adjective.",
  ta:"வினைச்சொல்லை 'IS'-ஆல் மாற்றுங்கள். இன்னும் பொருள்படுமானால், ஒரு பெயரடை பயன்படுத்துங்கள்.",
  tl:"Vinaicholai 'IS'-aal maatrungal. Innum porulpadumaanaal, oru peyaradai payanpaduththungal.",
  vis:"      THE 'IS' TEST\n\n   'The flower smells sweet'\n     → 'The flower IS sweet'   ✔ works\n     → LINKING → ADJECTIVE\n\n   'He smelled the flower carefully'\n     → 'He IS the flower ...'  ✘ nonsense\n     → ACTION → ADVERB\n\n   THE LINKING VERBS:\n     be · seem · appear · look · feel\n     smell · taste · sound · become\n     grow · turn · remain · stay · prove\n\n   ⚠ ADVERB PAIRS THAT ARE NOT VARIANTS:\n     HARD (with effort)  vs HARDLY (almost not)\n     LATE (not on time)  vs LATELY (recently)\n     NEAR (close)        vs NEARLY (almost)\n     HIGH (position)     vs HIGHLY (degree)\n     MOST (superlative)  vs MOSTLY (mainly)"},
