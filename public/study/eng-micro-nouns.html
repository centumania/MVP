 s13:[
 "Most of the equipment, along with some furniture, ____ been damaged in ____ fire.|have-a;has-the;has-a|1|'Equipment' uncountable → HAS (SVA Rule 37). A specific fire → THE.",
 "He gave me ____ piece of advice and ____ information that ____ very useful.|a-some-was;an-an-were;a-an-was|0|Unit phrase 'a piece of'. 'Some information' takes no article. Uncountable → WAS.",
 "Neither the luggage nor the documents ____ arrived, though much of the furniture ____ already here.|has-are;have-is;have-are|1|'Neither...nor' takes the nearest → 'documents' → HAVE. 'Furniture' uncountable → IS.",
 "Two-thirds of the machinery ____ obsolete, and a large amount of stationery ____ been wasted.|are-have;is-has;is-have|1|'Machinery' uncountable → IS (SVA Rule 46). 'A large amount of' → HAS.",
 "____ number of complaints ____ risen, but there ____ very little evidence against him.|The-has-is;A-have-are;The-have-is|0|'The number of' → HAS (SVA Rule 38). 'Evidence' uncountable → IS."],

 s14:{
  rule:"Uncountable nouns take no -s, no a/an, a singular verb, and much/little instead of many/few.",
  formula:"UNCOUNTABLE → no -s, no a/an, singular verb, much/little\nTO COUNT → a piece of / an item of / a bit of",
  memory:"I gave him a piece of advice and some information about the furniture and luggage.",
  ta:"எண்ண முடியலைன்னா -s இல்ல, a/an இல்ல, ஒருமை verb. எண்ண 'a piece of' போடுங்க.",
  tl:"Enna mudiyalainnaa -s illa, a/an illa, orumai verb. Enna 'a piece of' podunga.",
  mistake:"Writing 'informations', 'furnitures', 'an advice' and 'many luggages'.",
  exam:"SSC CGL / CHSL / MTS, RRB, Bank — one of the most repeated noun errors of all."},

 s15:[
 {ta:"இந்த rule நமக்கு ரொம்ப கஷ்டமா இருக்கும், ஏன்னா நம்ம மொழியில இதெல்லாம் எண்ணக்கூடியது. தமிழ்ல 'தகவல்கள்' அப்படின்னு பன்மையா சொல்லுவோம். 'தளவாடங்கள்' அப்படின்னு பன்மையா சொல்லுவோம். ஆனா ஆங்கிலத்துல முடியாது.",
  tl:"Indha rule namakku romba kashtamaa irukkum, yennaa namma mozhiyila idhellaam ennakkoodiyadhu. Tamil-la 'thagavalgal' appadinnu panmaiyaa solluvom. 'Thalavaadangal' appadinnu panmaiyaa solluvom. Aanaa Aangilaththula mudiyaadhu."},
 {ta:"ஏன் இப்படி? ஒரு உதாரணம் சொல்லுறேன். 'Furniture' அப்படின்னா என்ன? ஒரு நாற்காலியா? இல்ல. நாற்காலி, மேசை, கட்டில், அலமாரி — இதெல்லாம் சேர்ந்த ஒரு முழு வகை. ஒரு திரள். திரளை எண்ண முடியாது. அதனால -s இல்ல.",
  tl:"Yen ippadi? Oru udhaaranam solluren. 'Furniture' appadinnaa enna? Oru naarkaaliyaa? Illa. Naarkaali, mesai, kattil, alamaari — idhellaam serndha oru muzhu vagai. Oru thiral. Thiralai enna mudiyaadhu. Adhanaala -s illa."},
 {ta:"அப்போ ஒரு நாற்காலியை மட்டும் எப்படி சொல்றது? 'A piece of furniture' அல்லது 'an item of furniture'. இதை 'அலகுத் தொடர்' அப்படின்னு சொல்லலாம். அதே மாதிரி 'a piece of advice', 'a piece of information', 'a piece of evidence', 'a loaf of bread'. இந்த தொடர்களை மனப்பாடம் பண்ணுங்க.",
  tl:"Appo oru naarkaaliyai mattum eppadi solradhu? 'A piece of furniture' alladhu 'an item of furniture'. Adhe maadhiri 'a piece of advice', 'a piece of information', 'a piece of evidence', 'a loaf of bread'."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு point. SSC இந்த வார்த்தையை வெச்சு இரட்டைப் பொறி வெப்பாங்க. 'Many informations were given' — இதுல ரெண்டு தப்பு இருக்கு! ஒண்ணு — 'informations' அப்படிங்கிற வார்த்தையே கிடையாது. ரெண்டு — 'many' அப்படிங்கிறது எண்ணக்கூடியவற்றுக்குதான், எண்ண முடியாதவற்றுக்கு 'much'. சரியான வாக்கியம்: 'Much information was given.'",
  tl:"Ippo romba mukkiyamaana oru point. SSC indha vaarththaiyai vechu irattaip pori veppaanga. 'Many informations were given' — idhula rendu thappu irukku! Onnu — 'informations' appadingira vaarththaiye kidaiyaadhu. Rendu — 'many' ennakkoodiyavatrukkudhaan. Sariyaana vaakkiyam: 'Much information was given.'"},
 {ta:"quantifier-ஐயும் நினைவுல வெச்சுக்கோங்க. எண்ண முடியாதவற்றுக்கு: much, little, a little, a great deal of, a large amount of. எண்ணக்கூடியவற்றுக்கு: many, few, a few, a large number of. இதை SVA module-ல Rule 48-ல படிச்சிருப்பீங்க — 'a large amount of water' ஆனா 'a large number of bottles'. ஒரே கொள்கை.",
  tl:"Quantifier-aiyum ninaivula vechukkonga. Enna mudiyaadhavatrukku: much, little, a little, a great deal of. Ennakkoodiyavatrukku: many, few, a few, a large number of. Idhai SVA module-la Rule 48-la padichiruppeenga."},
 {ta:"கடைசியா ஒரு வாக்கியம் தாறேன், தினமும் ஒரு தடவ சொல்லுங்க: 'I gave him A PIECE OF ADVICE and SOME INFORMATION about the FURNITURE, the LUGGAGE and the EQUIPMENT.' இந்த ஒரு வாக்கியத்துல அஞ்சு முக்கியமான எண்ண முடியாத வார்த்தை இருக்கு. இதை மனப்பாடம் பண்ணிட்டா, தேர்வுல இந்த வார்த்தை பார்த்தவுடனே -s போடக்கூடாதுன்னு உங்களுக்கு நினைவு வரும்.",
  tl:"Kadaisiyaa oru vaakkiyam thaaren, dhinamum oru thadava sollunga: 'I gave him A PIECE OF ADVICE and SOME INFORMATION about the FURNITURE, the LUGGAGE and the EQUIPMENT.' Indha oru vaakkiyaththula anju mukkiyamaana enna mudiyaadha vaarththai irukku."}]},
/* ========== RULE 16 ========== */
{n:16,rc:"NOU-06",d:"Medium",t:"Use OF, not Apostrophe-S, for Lifeless Things",
 tam:"உயிரற்ற பொருட்களுக்கு apostrophe-s அல்ல, 'OF' பயன்படுத்தவும்",
 s1:{en:"The possessive apostrophe (-'s) is used mainly with LIVING beings. Lifeless objects normally take the 'of' form. But time, distance, weight, personified nouns and country names are accepted exceptions.",
  ta:"உடைமை apostrophe (-'s) முக்கியமாக உயிருள்ளவற்றுடன் பயன்படுத்தப்படுகிறது. உயிரற்ற பொருட்கள் பொதுவாக 'of' வடிவத்தை எடுக்கும். ஆனால் நேரம், தூரம், எடை, உயிரூட்டப்பட்ட பெயர்கள், நாட்டுப் பெயர்கள் ஏற்கப்பட்ட விதிவிலக்குகள்.",
  tl:"Udaimai apostrophe (-'s) mukkiyamaaga uyirullavatrudan payanpaduththappadugiradhu. Uyiratra porutkal podhuvaaga 'of' vadivaththai edukkum. Aanaal neram, dhooram, edai, uyirootappatta peyargal, naattup peyargal erkappatta vidhivilakkugal.",
  formula:"LIVING  →  apostrophe-s\n  Ram's book · the boy's bag · the dog's tail\n\nLIFELESS  →  of\n  the leg OF the table · the roof OF the house\n\nACCEPTED EXCEPTIONS (take -'s):\n  TIME     : a day's journey, a week's leave\n  DISTANCE : a stone's throw, a mile's walk\n  WEIGHT   : a ton's weight\n  COUNTRY  : India's history, Delhi's traffic\n  PERSONIFIED : Nature's law, Fortune's favour"},

 s2:[
 {h:"Why only living things own",
  en:"Ownership is an act of a living being. Ram OWNS a book. A table does not own its leg — the leg is simply part of it. English marks real ownership with -'s and mere connection with 'of'.",
  ta:"உயிருள்ளவை மட்டும் ஏன் உடைமை கொள்கின்றன? உடைமை என்பது ஒரு உயிரினத்தின் செயல். ராம் ஒரு புத்தகத்தை சொந்தமாக்குகிறார். ஒரு மேசை தன் காலைச் சொந்தமாக்குவதில்லை — கால் என்பது அதன் ஒரு பகுதி மட்டுமே. ஆங்கிலம் உண்மையான உடைமையை -'s-ஆலும், வெறும் தொடர்பை 'of'-ஆலும் குறிக்கிறது.",
  tl:"Uyirullavai mattum yen udaimai kolgindrana? Udaimai enbadhu oru uyirinaththin seyal. Ram oru puththagaththai sondhamaakkugiraar. Oru mesai than kaalaich sondhamaakkuvadhillai — kaal enbadhu adhan oru paguthi mattume."},
 {h:"The five accepted exceptions",
  en:"TIME: a day's journey, a month's salary, two years' experience. DISTANCE: a stone's throw, a mile's walk. WEIGHT: a ton's weight. COUNTRIES AND CITIES: India's growth, Chennai's climate. PERSONIFICATION: Nature's beauty, Death's cold hand, Fortune's wheel.",
  ta:"ஏற்கப்பட்ட ஐந்து விதிவிலக்குகள். நேரம்: a day's journey, a month's salary, two years' experience. தூரம்: a stone's throw, a mile's walk. எடை: a ton's weight. நாடு மற்றும் நகரம்: India's growth, Chennai's climate. உயிரூட்டல்: Nature's beauty, Death's cold hand, Fortune's wheel.",
  tl:"Erkappatta aindhu vidhivilakkugal. Neram: a day's journey, a month's salary. Dhooram: a stone's throw. Edai: a ton's weight. Naadu: India's growth. Uyirootal: Nature's beauty, Fortune's wheel."},
 {h:"Where to put the apostrophe",
  en:"Singular noun → add 's: the boy's bag. Plural noun ending in -s → add only the apostrophe: the boys' bags. Irregular plural → add 's: the children's toys, the men's club.",
  ta:"Apostrophe-ஐ எங்கே வைப்பது? ஒருமைப் பெயர்ச்சொல் → 's சேர்க்கவும்: the boy's bag. -s-ல் முடியும் பன்மைப் பெயர்ச்சொல் → apostrophe மட்டும் சேர்க்கவும்: the boys' bags. ஒழுங்கற்ற பன்மை → 's சேர்க்கவும்: the children's toys, the men's club.",
  tl:"Apostrophe-ai enge vaippadhu? Orumaip peyarchol → 's serkkavum: the boy's bag. -s-l mudiyum panmaip peyarchol → apostrophe mattum: the boys' bags. Ozhungatra panmai → 's serkkavum: the children's toys, the men's club."},
 {h:"Compound nouns take -'s at the end",
  en:"'My father-in-law's house', 'the Commander-in-Chief's order'. Even though the plural goes on the principal word (Rule 18), the POSSESSIVE goes at the very end of the whole phrase.",
  ta:"கூட்டுப் பெயர்கள் இறுதியில் -'s எடுக்கும். 'My father-in-law's house', 'the Commander-in-Chief's order'. பன்மை முக்கியச் சொல்லில் வந்தாலும் (Rule 18), உடைமை முழுத் தொடரின் இறுதியிலேயே வரும்.",
  tl:"Koottup peyargal irudhiyil -'s edukkum. 'My father-in-law's house', 'the Commander-in-Chief's order'. Panmai mukkiyach solil vandhaalum (Rule 18), udaimai muzhuth thodarin irudhiyileye varum."}],

 s3:[
 {h:"Living owns, lifeless connects",
  d:"   👦 Ram's book        →  Ram OWNS it        →  -'s ✔\n   🐕 the dog's tail     →  living being       →  -'s ✔\n\n   🪑 the leg OF the table  →  just a part      →  of  ✔\n   🏠 the roof OF the house →  just a part      →  of  ✔\n\n   the table's leg   ✘   (a table cannot own)"},
 {h:"The five exception families",
  d:"  ⏰ TIME      : a day's journey · a week's leave\n                 two years' experience\n  📏 DISTANCE  : a stone's throw · a mile's walk\n  ⚖️ WEIGHT    : a ton's weight\n  🌍 COUNTRY   : India's history · Delhi's traffic\n  🌿 PERSONIFIED: Nature's law · Fortune's wheel\n\n  These are LIFELESS but still take -'s."},
 {h:"Apostrophe placement",
  d:"  SINGULAR          →  boy's     bag\n  PLURAL ending -s  →  boys'     bags\n  IRREGULAR PLURAL  →  children's toys\n                       men's      club\n                       women's    hostel\n\n  COMPOUND          →  father-in-law's house\n                       Commander-in-Chief's order"}],

 s4:{
 wrong:["\"'The table's leg' is shorter, so it must be better.\" — A table cannot own anything.",
  "\"Apostrophe-s never goes with lifeless things.\" — Time, distance and country names are exceptions.",
  "\"'The boys bags' — the plural already shows possession.\" — You still need the apostrophe: boys' bags.",
  "\"'Childrens' toys' — add -s then the apostrophe.\" — 'Children' is already plural, so it is children's."],
 right:["Ask: can this thing actually OWN something? Living → -'s. Lifeless → of.",
  "Memorise the five exception families: time, distance, weight, country, personification.",
  "Place the apostrophe correctly: boy's, boys', children's.",
  "For compound nouns, put -'s at the very end of the phrase."]},

 s8:[
 "The table's leg is broken.|The leg of the table is broken.|A table is lifeless.",
 "The house's roof leaks badly.|The roof of the house leaks badly.|A house is lifeless.",

 "They made a journey of a day.|They made a day's journey.|Time takes the apostrophe form.",
 "The economy of India is growing.|India's economy is growing.|Country names take -'s.",
 "The childrens toys are here.|The children's toys are here.|'Children' is already plural.",
 "The girl's hostel houses two hundred students.|The girls' hostel houses two hundred students.|Plural 'girls' takes the apostrophe after the -s.",
 "It is a throw of a stone from here.|It is a stone's throw from here.|Distance takes the apostrophe form.",

 s10:{
  en:"The exam plants 'the table's leg' and 'the house's roof' because they sound compact and modern. It also tests apostrophe PLACEMENT — 'the boys bags' versus 'the boys' bags' versus 'the boy's bags' all appear as options and mean different things. The third trap is the exception list: 'a day's journey' is correct even though a day is lifeless.",
  ta:"தேர்வு 'the table's leg' மற்றும் 'the house's roof' ஆகியவற்றை நடுகிறது, ஏனெனில் அவை சுருக்கமாகவும் நவீனமாகவும் ஒலிக்கின்றன. அது apostrophe இடத்தையும் சோதிக்கிறது — 'the boys bags', 'the boys' bags', 'the boy's bags' அனைத்தும் option-களாக வரும், அனைத்தும் வெவ்வேறு பொருள் தரும். மூன்றாவது பொறி விதிவிலக்குப் பட்டியல்: ஒரு நாள் உயிரற்றது என்றாலும் 'a day's journey' சரி.",
  tl:"Thervu 'the table's leg' matrum 'the house's roof' aagiyavatrai nadugiradhu. Adhu apostrophe idaththaiyum sodhikkiradhu — 'the boys bags', 'the boys' bags', 'the boy's bags' anaiththum option-galaaga varum. Moondraavadhu pori vidhivilakkup pattiyal."},

 s11:{
  en:"CAN IT OWN? Living → -'s. Lifeless → of. Except time, distance, weight and countries.",
  ta:"அது சொந்தமாக்க முடியுமா? உயிருள்ளது → -'s. உயிரற்றது → of. நேரம், தூரம், எடை, நாடு தவிர.",
  tl:"Adhu sondhamaakka mudiyumaa? Uyirulladhu → -'s. Uyiratradhu → of. Neram, dhooram, edai, naadu thavira.",
  vis:"      THE OWNERSHIP TEST\n\n   Ask: can this thing WALK INTO A SHOP\n        and BUY something?\n\n   YES → it can own → use  -'s\n         Ram's book · the dog's tail\n\n   NO  → it cannot own → use  of\n         the leg OF the table\n\n   ⚠ FIVE EXCEPTIONS THAT STILL TAKE -'s:\n     ⏰ a day's journey    📏 a stone's throw\n     ⚖️ a ton's weight     🌍 India's history\n     🌿 Nature's law\n\n   APOSTROPHE PLACEMENT:\n     boy's · boys' · children's · men's"},

 s13:[
 "The leg of ____ table and ____ children's toys ____ damaged in the shifting.|the-the-were;a-the-was;the-a-were|0|A table is lifeless → 'of'. Irregular plural → children's. Two items joined by AND → WERE.",
 "He applied for ____ month's leave after completing two years' service in ____ office.|a-the;an-a;a-a|0|Time takes -'s. A specific office → THE.",
 "____ India's growth ____ been steady, though ____ roof of the old building ____ leaking.|—-has-the-is;The-have-a-are;—-have-the-is|0|Country name takes no article + -'s. 'Growth' uncountable → HAS. 'Roof of' → THE + IS.",

 s14:{
  rule:"Use apostrophe-s for living beings and 'of' for lifeless things, except time, distance, weight, countries and personified nouns.",
  formula:"LIVING → -'s   |   LIFELESS → of\nEXCEPTIONS taking -'s: time, distance, weight, country, personification",
  memory:"Can it walk into a shop and buy something? If yes, it can own.",
  ta:"அது கடைக்குப் போய் ஏதாவது வாங்க முடியுமா? முடிஞ்சா அது சொந்தமாக்க முடியும்.",
  tl:"Adhu kadaikkup poy edhaavadhu vaanga mudiyumaa? Mudinjaa adhu sondhamaakka mudiyum.",
  mistake:"Writing 'the table's leg', and misplacing the apostrophe in boys' / children's.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule-ஐ ஒரு எளிமையான கேள்வியால புரிஞ்சுக்கலாம்: 'இந்த பொருள் ஏதாவது சொந்தமாக்க முடியுமா?' ராம் ஒரு புத்தகத்தை சொந்தமாக்க முடியுமா? முடியும். அவரு கடைக்குப் போய் வாங்குவாரு. அதனால 'Ram's book'.",
  tl:"Indha rule-ai oru elimaiyaana kelviyaala purinjukkalaam: 'indha porul edhaavadhu sondhamaakka mudiyumaa?' Ram oru puththagaththai sondhamaakka mudiyumaa? Mudiyum. Avaru kadaikkup poy vaanguvaaru. Adhanaala 'Ram's book'."},
 {ta:"இப்போ ஒரு மேசை. மேசை தன்னோட காலை சொந்தமாக்க முடியுமா? முடியாது. மேசைக்கு உரிமை கிடையாது. அந்த கால் மேசையோட ஒரு பகுதி மட்டும்தான். அதனால 'the leg OF the table'. 'The table's leg' இல்ல.",
  tl:"Ippo oru mesai. Mesai thannoda kaalai sondhamaakka mudiyumaa? Mudiyaadhu. Mesaikku urimai kidaiyaadhu. Andha kaal mesaiyoda oru paguthi mattum-dhaan. Adhanaala 'the leg OF the table'."},
 {ta:"ஒரு எளிய சோதனை சொல்லுறேன் — 'கடை சோதனை'. அந்த பொருள் கடைக்கு நடந்து போய், பணம் கொடுத்து, ஏதாவது வாங்க முடியுமா? ராம் முடியும். நாய் — கிட்டத்தட்ட, அது ஒரு உயிரினம். மேசை — கண்டிப்பா முடியாது. முடியலைன்னா 'of' போடுங்க.",
  tl:"Oru eliya sodhanai solluren — 'kadai sodhanai'. Andha porul kadaikku nadandhu poy, panam koduththu, edhaavadhu vaanga mudiyumaa? Ram mudiyum. Naay — kittaththatta, adhu oru uyirinam. Mesai — kandippaa mudiyaadhu. Mudiyalainnaa 'of' podunga."},
 {ta:"ஆனா இப்போ ஒரு விதிவிலக்கு பட்டியல் இருக்கு. 'A day's journey' — ஒரு நாள் உயிருள்ளதா? இல்ல. ஆனா -'s சரி. ஏன்? ஏன்னா நேரம், தூரம், எடை, நாடு, உயிரூட்டல் — இந்த அஞ்சு குடும்பம் பாரம்பரியமா -'s எடுக்குது. 'A month's salary', 'a stone's throw', 'India's history', 'Nature's law'.",
  tl:"Aanaa ippo oru vidhivilakku pattiyal irukku. 'A day's journey' — oru naal uyirulladhaa? Illa. Aanaa -'s sari. Yennaa neram, dhooram, edai, naadu, uyirootal — indha anju kudumbam paaramparyamaa -'s edukkudhu."},
 {ta:"இப்போ இன்னொரு முக்கியமான பகுதி — apostrophe எங்க வைக்கிறது? ஒருமை என்றால் 's — 'the boy's bag' (ஒரு பையனோட பை). பன்மை -s-ல முடிஞ்சா, apostrophe மட்டும் — 'the boys' bags' (பல பையன்களோட பைகள்). ஒழுங்கற்ற பன்மை என்றால் 's — 'the children's toys', 'the men's club', 'the women's hostel'.",
  tl:"Ippo innoru mukkiyamaana paguthi — apostrophe enga vaikkiradhu? Orumai endraal 's — 'the boy's bag'. Panmai -s-la mudinjaa, apostrophe mattum — 'the boys' bags'. Ozhungatra panmai endraal 's — 'the children's toys', 'the men's club'."},
 {ta:"கடைசியா ஒரு பொறி — கூட்டுப் பெயர். 'My father-in-law's house' — apostrophe எங்க இருக்கு? கடைசில. 'Father's-in-law' இல்ல. முழு தொடரும் ஒரே பெயர் மாதிரி, அதனால -'s கடைசில வரும். ஆனா கவனிங்க — Rule 18-ல பன்மை பார்ப்போம், அங்க -s நடுவுல வரும்: 'sons-in-law'. உடைமை கடைசில, பன்மை நடுவுல. இதை குழப்பிக்காதீங்க.",
  tl:"Kadaisiyaa oru pori — koottup peyar. 'My father-in-law's house' — apostrophe enga irukku? Kadaisila. 'Father's-in-law' illa. Aanaa kavaninga — Rule 18-la panmai paarpom, anga -s naduvula varum: 'sons-in-law'. Udaimai kadaisila, panmai naduvula."}]},

/* ========== RULE 17 ========== */
{n:17,rc:"NOU-07",d:"Hard",t:"The Double Possessive",
 tam:"a friend of mine / a friend of my father's — இரட்டை உடைமை",
 s1:{en:"When 'of' expresses possession before a pronoun or a person's name, BOTH the 'of' AND the possessive form are required. This is called the double possessive: 'a friend of mine', 'a book of my brother's'.",
  ta:"ஒரு பிரதிபெயருக்கு முன்னாலோ ஒரு நபரின் பெயருக்கு முன்னாலோ 'of' உடைமையை வெளிப்படுத்தும்போது, 'of'-ம் உடைமை வடிவமும் இரண்டுமே தேவை. இது இரட்டை உடைமை எனப்படுகிறது: 'a friend of mine', 'a book of my brother's'.",
  tl:"Oru pirathibeyarukku munnaalo oru nabarin peyarukku munnaalo 'of' udaimaiyai velippaduththumbodhu, 'of'-um udaimai vadivamum irandume thevai. Idhu irattai udaimai enappadugiradhu.",
  formula:"OF  +  POSSESSIVE FORM\n\n  a friend OF MINE        ✔   (not 'of me')\n  a friend OF YOURS       ✔   (not 'of you')\n  a cousin OF HERS        ✔   (not 'of her')\n  a book OF MY BROTHER'S  ✔   (not 'of my brother')\n\n  MEANING: 'one of my friends', 'one of my brother's books'"},

 s2:[
 {h:"Why both markers are needed",
  en:"'A friend of mine' really means 'one of my friends'. The 'of' carries the idea of 'one out of a group', and the possessive carries the idea of 'belonging to me'. Both ideas are present, so both markers appear.",
  ta:"இரண்டு குறிப்பான்களும் ஏன் தேவை? 'A friend of mine' என்பதன் உண்மையான பொருள் 'என்னுடைய நண்பர்களில் ஒருவர்'. 'Of' என்பது 'ஒரு குழுவிலிருந்து ஒருவர்' என்ற கருத்தைச் சுமக்கிறது, உடைமை வடிவம் 'எனக்குச் சொந்தமான' என்ற கருத்தைச் சுமக்கிறது. இரண்டு கருத்தும் இருப்பதால், இரண்டு குறிப்பான்களும் தோன்றுகின்றன.",
  tl:"Irandu kurippaangalum yen thevai? 'A friend of mine' enbadhan unmaiyaana porul 'ennudaiya nanbargalil oruvar'. 'Of' enbadhu 'oru kuzhuvilirundhu oruvar' endra karuththaich sumakkiradhu, udaimai vadivam 'enakkuch sondhamaana' endra karuththaich sumakkiradhu."},
 {h:"The possessive pronoun forms",
  en:"of MINE (not of me), of YOURS (not of you), of HIS, of HERS (not of her), of OURS (not of us), of THEIRS (not of them). Note that 'of his' looks the same in both forms, which is why it never appears in exams.",
  ta:"உடைமைப் பிரதிபெயர் வடிவங்கள்: of MINE (of me அல்ல), of YOURS (of you அல்ல), of HIS, of HERS (of her அல்ல), of OURS (of us அல்ல), of THEIRS (of them அல்ல). 'Of his' இரண்டு வடிவங்களிலும் ஒரே மாதிரி இருக்கிறது, அதனால்தான் அது தேர்வுகளில் ஒருபோதும் வருவதில்லை.",
  tl:"Udaimaip pirathibeyar vadivangal: of MINE, of YOURS, of HIS, of HERS, of OURS, of THEIRS. 'Of his' irandu vadivangalilum ore maadhiri irukkiradhu, adhanaal-dhaan adhu thervugalil orupodhum varuvadhillai."},
 {h:"With a name, add -'s",
  en:"'A book of my brother's', 'a friend of Ram's', 'a painting of my uncle's'. The name or noun takes the apostrophe form even though 'of' is already there.",
  ta:"ஒரு பெயருடன் -'s சேர்க்கவும். 'A book of my brother's', 'a friend of Ram's', 'a painting of my uncle's'. 'Of' ஏற்கனவே இருந்தாலும் அந்தப் பெயர் அல்லது பெயர்ச்சொல் apostrophe வடிவத்தை எடுக்கும்.",
  tl:"Oru peyarudan -'s serkkavum. 'A book of my brother's', 'a friend of Ram's', 'a painting of my uncle's'. 'Of' erkanave irundhaalum andhap peyar apostrophe vadivaththai edukkum."},
 {h:"A meaning difference worth knowing",
  en:"'A picture OF my brother' means a picture SHOWING him. 'A picture OF MY BROTHER'S' means a picture that BELONGS to him. The apostrophe completely changes the meaning.",
  ta:"தெரிந்திருக்க வேண்டிய ஒரு பொருள் வேறுபாடு. 'A picture OF my brother' என்றால் அவரைக் காட்டும் ஒரு படம். 'A picture OF MY BROTHER'S' என்றால் அவருக்குச் சொந்தமான ஒரு படம். Apostrophe பொருளை முற்றிலும் மாற்றிவிடுகிறது.",
  tl:"Therindhirukka vendiya oru porul verupaadu. 'A picture OF my brother' endraal avaraik kaattum oru padam. 'A picture OF MY BROTHER'S' endraal avarukkuch sondhamaana oru padam."}],

 s3:[
 {h:"It means 'one out of my group'",
  d:"   a friend OF MINE\n        ↓ really means\n   ONE  of  MY FRIENDS\n     ↑        ↑\n   'of' idea  possessive idea\n\n   BOTH ideas present → BOTH markers needed"},
 {h:"The correct pronoun forms",
  d:"  ✔ of MINE     ✘ of me\n  ✔ of YOURS    ✘ of you\n  ✔ of HERS     ✘ of her\n  ✔ of OURS     ✘ of us\n  ✔ of THEIRS   ✘ of them\n  ✔ of HIS      (same in both forms)"},
 {h:"The apostrophe changes the meaning",
  d:"  a picture OF my brother      →  📷 shows HIM\n  a picture OF my brother'S    →  📷 BELONGS to him\n\n  One tiny apostrophe, two different pictures."}],

 s4:{
 wrong:["\"'A friend of me' is simpler and shorter.\" — It is always wrong.",
  "\"'Of' already shows possession, so I do not need the apostrophe.\" — Both are required.",
  "\"'A book of my brother' is fine.\" — For possession it must be 'my brother's'.",
  "\"'Of him' and 'of his' mean the same thing.\" — 'A friend of his' is correct; 'a friend of him' is not."],
 right:["Rewrite the phrase as 'one of my friends' to check the meaning.",
  "After 'of', always use MINE, YOURS, HIS, HERS, OURS, THEIRS.",
  "With a name or noun, add -'s: a friend of Ram's.",
  "Check whether you mean 'shows him' or 'belongs to him'."]},

 s5:[
 {en:"He is a friend of mine.",ta:"அவர் என்னுடைய நண்பர்களில் ஒருவர்.",tl:"Avar ennudaiya nanbargalil oruvar.",note:"'Of mine', never 'of me'."},
 {en:"That is a book of my brother's.",ta:"அது என் சகோதரனுடைய புத்தகங்களில் ஒன்று.",tl:"Adhu en sagodharanudaiya puththagangalil ondru.",note:"The name takes -'s even after 'of'."},
 {en:"A cousin of hers visited us last week.",ta:"அவளுடைய உறவினர்களில் ஒருவர் கடந்த வாரம் எங்களைப் பார்க்க வந்தார்.",tl:"Avaludaiya uravinargalil oruvar kadandha vaaram engalaip paarkka vandhaar.",note:"'Of hers', never 'of her'."},
 {en:"This is a picture of my brother.",ta:"இது என்னுடைய சகோதரனின் புகைப்படம் — அவரைக் காட்டுவது.",tl:"Idhu ennudaiya sagodharanin pugaippadam — avaraik kaattuvadhu.",note:"No apostrophe → the picture SHOWS him."},
 {en:"This is a picture of my brother's.",ta:"இது என் சகோதரனுக்குச் சொந்தமான ஒரு படம்.",tl:"Idhu en sagodharanukkuch sondhamaana oru padam.",note:"With apostrophe → the picture BELONGS to him."}],

  "of hers|அவளுக்குச் சொந்தமான|Avalukkuch sondhamaana",
  "of ours|எங்களுக்குச் சொந்தமான|Engalukkuch sondhamaana",
  "of theirs|அவர்களுக்குச் சொந்தமான|Avargalukkuch sondhamaana",
  "my brother's|என் சகோதரனுடைய|En sagodharanudaiya",
  "a cousin|ஒரு உறவினர்|Oru uravinar",
  "visited|பார்க்க வந்தார்|Paarkka vandhaar",
  "picture|படம்|Padam",
  "belongs to|-க்குச் சொந்தமானது|-kkuch sondhamaanadhu"],

 s8:[

 "She is a colleague of you.|She is a colleague of yours.|Use the possessive pronoun.",
 "A cousin of her visited us.|A cousin of hers visited us.|Use the possessive pronoun.",
 "That is a book of my brother.|That is a book of my brother's.|Possession requires the apostrophe form.",
 "A relative of us works there.|A relative of ours works there.|Use the possessive pronoun.",
 "That old car of them broke down.|That old car of theirs broke down.|Use the possessive pronoun.",
 "A painting of my uncle was sold by the gallery.|A painting of my uncle's was sold by the gallery.|Possession requires -'s.",
 "A friend of Ram has just called.|A friend of Ram's has just called.|Names take -'s after 'of'.",
 "That habit of him will ruin him.|That habit of his will ruin him.|Use the possessive pronoun.",
 "Those neighbours of us are very noisy.|Those neighbours of ours are very noisy.|Use the possessive pronoun."],

 s9:[
 "Fill in the Blank|He is an old friend of ____ from my school days in Madurai.|me;mine|1|The double possessive requires 'mine'.",
 "Find the Error|A cousin of her (A) visited our house (B) last Sunday (C) with her family (D).|A;B;C;D|0|Part A. It must be 'A cousin of hers'.",
 "Sentence Improvement|That is a very old book of my grandfather which he bought in 1950.|of my grandfather;of my grandfather's;of my grandfathers|1|Possession requires the apostrophe form.",
 "Fill in the Blank|That careless habit of ____ will one day get him into serious trouble.|him;his|1|'Of his' is the correct possessive form.",
 "Find the Error|Some neighbours of us (A) have complained (B) about the noise (C) from the party (D).|A;B;C;D|0|Part A. It must be 'Some neighbours of ours'."],

 s10:{
  en:"'A friend of me' feels perfectly logical to a Tamil-medium learner, because Tamil marks possession once, not twice. English demands it twice here. The deeper trap is the meaning switch: 'a picture of my brother' and 'a picture of my brother's' are BOTH correct English but mean different things. The exam sometimes tests which one fits the context.",
  ta:"'A friend of me' தமிழ் வழி மாணவருக்கு முற்றிலும் தர்க்கரீதியாகத் தோன்றும், ஏனெனில் தமிழ் உடைமையை ஒரு முறைதான் குறிக்கிறது, இரண்டு முறை அல்ல. ஆங்கிலம் இங்கே இரண்டு முறை கோருகிறது. ஆழமான பொறி பொருள் மாற்றம்: 'a picture of my brother' மற்றும் 'a picture of my brother's' இரண்டுமே சரியான ஆங்கிலம் ஆனால் வெவ்வேறு பொருள் தரும். எது சூழலுக்குப் பொருந்தும் என்று தேர்வு சில நேரங்களில் சோதிக்கும்.",
  tl:"'A friend of me' Tamil vazhi maanavarukku mutrilum tharkkareedhiyaagath thondrum, yenenil Tamil udaimaiyai oru muraidhaan kurikkiradhu. Aangilam inge irandu murai korugiradhu. Aazhamaana pori porul maatram."},

 s11:{
  en:"REWRITE IT AS 'ONE OF MY FRIENDS'. If that works, you need the double possessive.",
  ta:"அதை 'ONE OF MY FRIENDS' என்று மாற்றி எழுதுங்கள். அது பொருந்தினால், உங்களுக்கு இரட்டை உடைமை தேவை.",
  tl:"Adhai 'ONE OF MY FRIENDS' endru maatri ezhudhungal. Adhu porundhinaal, ungalukku irattai udaimai thevai.",
  vis:"     THE REWRITE TEST\n\n   a friend of mine\n        ↓ rewrite\n   one of MY FRIENDS      ✔ works → double possessive\n\n   AFTER 'OF' ALWAYS USE:\n   ┌──────────────────────────┐\n   │  MINE · YOURS · HIS      │\n   │  HERS · OURS · THEIRS    │\n   └──────────────────────────┘\n   NEVER: me · you · her · us · them\n\n   WITH A NAME, ADD -'s:\n   a friend of RAM'S · a book of my BROTHER'S\n\n   ⚠ MEANING SWITCH:\n   picture OF my brother    →  shows him\n   picture OF my brother'S  →  belongs to him"},

 s13:[
 "A friend of ____ gave me ____ piece of advice about ____ university admission.|mine-a-the;me-an-a;mine-an-the|0|Double possessive → MINE. 'Advice' uncountable → a piece of. 'University' /yu/ → THE for a specific admission.",
 "A cousin of ____ and a colleague of my ____ ____ both attending the function.|hers-brother's-are;her-brother-is;hers-brother-are|0|Possessive pronoun HERS. Name takes -'s. Two people joined by AND → ARE.",
 "That habit of ____ ____ caused him ____ great deal of trouble over ____ years.|his-has-a-the;him-have-a-the;his-have-an-the|0|'Of his' correct. Singular subject → HAS. 'A great deal of' is fixed. Specific years → THE.",
 "Some neighbours of ____ ____ complained about ____ noise from ____ MLA's house.|ours-have-the-an;us-has-a-a;ours-has-the-an|0|Possessive OURS. Plural → HAVE. Specific noise → THE. 'MLA' = 'em' → AN.",
 "A picture of my brother ____ hanging there, but a picture of my brother's ____ been sold.|is-has;are-have;is-have|0|Both subjects are singular → IS and HAS. Note the meaning difference the apostrophe creates."],

 s14:{
  rule:"When 'of' expresses possession, use both the 'of' and the possessive form.",
  formula:"OF + MINE / YOURS / HIS / HERS / OURS / THEIRS\nOF + name + -'s  (a friend of Ram's)",
  memory:"Rewrite as 'one of my friends'. If it works, use the double possessive.",
  ta:"'One of my friends' அப்படின்னு மாத்தி எழுதிப் பாருங்க. பொருந்தினா இரட்டை உடைமை.",
  tl:"'One of my friends' appadinnu maaththi ezhudhip paarunga. Porundhinaa irattai udaimai.",
  mistake:"Writing 'a friend of me' or 'a book of my brother' without the possessive form.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule நமக்கு விசித்திரமா தோணும், ஏன்னா ஆங்கிலம் இங்க ஒரே விஷயத்தை ரெண்டு தடவ சொல்லுது. 'A friend of mine' — இங்க 'of'-ம் உடைமையை காட்டுது, 'mine'-ம் உடைமையை காட்டுது. ரெண்டும் ஒரே நேரத்துல.",
  tl:"Indha rule namakku visiththiramaa thonum, yennaa Aangilam inga ore vishayaththai rendu thadava solludhu. 'A friend of mine' — inga 'of'-um udaimaiyai kaattudhu, 'mine'-um udaimaiyai kaattudhu."},
 {ta:"ஏன் இப்படி? அர்த்தத்தை யோசிச்சுப் பாருங்க. 'A friend of mine' அப்படின்னா என்ன? 'என்னோட நண்பர்களில் ஒருவர்.' இங்க ரெண்டு கருத்து இருக்கு. ஒண்ணு — 'ஒரு குழுவில இருந்து ஒருவர்' (அதை 'of' காட்டுது). ரெண்டு — 'எனக்கு சொந்தமான' (அதை 'mine' காட்டுது). ரெண்டு கருத்து, ரெண்டு குறியீடு.",
  tl:"Yen ippadi? Arththaththai yosichup paarunga. 'A friend of mine' appadinnaa enna? 'Ennoda nanbargalil oruvar.' Inga rendu karuththu irukku. Onnu — 'oru kuzhuvila irundhu oruvar' (adhai 'of' kaattudhu). Rendu — 'enakku sondhamaana' (adhai 'mine' kaattudhu)."},
 {ta:"நமக்கு தமிழ்ல இப்படி இல்ல. நாம 'என் நண்பன்' அப்படின்னு ஒரு தடவ மட்டும் சொல்லுவோம். அதனால ஆங்கிலத்துல 'a friend of me' அப்படின்னு எழுதிடுவோம். இது தப்பு. கண்டிப்பா 'a friend of mine'.",
  tl:"Namakku Tamil-la ippadi illa. Naama 'en nanban' appadinnu oru thadava mattum solluvom. Adhanaala Aangilaththula 'a friend of me' appadinnu ezhudhiduvom. Idhu thappu. Kandippaa 'a friend of mine'."},
 {ta:"பட்டியல் ஞாபகம் வெச்சுக்கோங்க: of MINE, of YOURS, of HIS, of HERS, of OURS, of THEIRS. 'Of me', 'of you', 'of her', 'of us', 'of them' — இதெல்லாம் தப்பு. ஒரு எளிய சோதனை: 'one of my friends' அப்படின்னு மாத்திப் பாருங்க. பொருந்துதா? அப்படின்னா இரட்டை உடைமை வேணும்.",
  tl:"Pattiyal gnaabagam vechukkonga: of MINE, of YOURS, of HIS, of HERS, of OURS, of THEIRS. 'Of me', 'of you', 'of her' — idhellaam thappu. Oru eliya sodhanai: 'one of my friends' appadinnu maaththip paarunga."},
 {ta:"பெயர் வந்தா என்ன பண்றது? -'s சேருங்க. 'A book of my brother's', 'a friend of Ram's', 'a painting of my uncle's'. 'Of' இருந்தாலும் apostrophe வேணும். இது கொஞ்சம் அதிகமா தோணும், ஆனா இதுதான் விதி.",
  tl:"Peyar vandhaa enna panradhu? -'s serunga. 'A book of my brother's', 'a friend of Ram's', 'a painting of my uncle's'. 'Of' irundhaalum apostrophe venum."},
 {ta:"கடைசியா ஒரு அழகான விஷயம் சொல்லுறேன். 'A picture of my brother' மற்றும் 'A picture of my brother's' — ரெண்டுமே சரியான ஆங்கிலம்! ஆனா அர்த்தம் வேற. முதலாவது — அந்த படத்துல என் சகோதரன் இருக்காரு, அவரோட புகைப்படம். ரெண்டாவது — அந்த படம் என் சகோதரனுக்கு சொந்தம், அதுல யாரு இருக்காங்கன்னு தெரியாது. ஒரே ஒரு apostrophe, ரெண்டு வேற வேற படம். இதை SSC கேட்கும்.",
  tl:"Kadaisiyaa oru azhagaana vishayam solluren. 'A picture of my brother' matrum 'A picture of my brother's' — rendume sariyaana Aangilam! Aanaa arththam veru. Mudhalaavadhu — andha padaththula en sagodharan irukkaaru. Randaavadhu — andha padam en sagodharanukku sondham. Ore oru apostrophe, rendu veru veru padam."}]},

/* ========== RULE 18 ========== */
{n:18,rc:"NOU-08",d:"Hard",t:"Compound Nouns: Pluralise the PRINCIPAL Word",
 tam:"கூட்டுப்பெயரில் முக்கிய சொல்லுக்கே பன்மை விகுதி",
 s1:{en:"In a compound noun, add the plural -s to the PRINCIPAL word — the one that carries the main meaning — not automatically to the last word.",
  ta:"ஒரு கூட்டுப் பெயரில், முக்கியப் பொருளைச் சுமக்கும் முக்கியச் சொல்லுக்கே பன்மை -s சேர்க்க வேண்டும் — தானாகவே கடைசிச் சொல்லுக்கு அல்ல.",
  tl:"Oru koottup peyaril, mukkiyap porulaich sumakkum mukkiyach sollukke panmai -s serkka vendum — thaanaagave kadaisich sollukku alla.",
  formula:"FIND THE HEAD NOUN  →  ADD -s THERE\n\n  son-in-law        →  sonS-in-law\n  passer-by         →  passerS-by\n  commander-in-chief→  commanderS-in-chief\n  looker-on         →  lookerS-on\n  step-son          →  step-sonS\n\n  NO CLEAR HEAD NOUN  →  -s AT THE END\n  forget-me-not  →  forget-me-notS\n  higher-up      →  higher-upS"},

 s2:[
 {h:"Find the head noun",
  en:"Ask: what is this thing actually? A son-in-law is a SON (related by law). A passer-by is a PASSER (who passes by). A commander-in-chief is a COMMANDER. The head noun carries the meaning, and the -s goes there.",
  ta:"முக்கியப் பெயர்ச்சொல்லைக் கண்டறியுங்கள். கேளுங்கள்: இந்த விஷயம் உண்மையில் என்ன? A son-in-law என்பது ஒரு SON (சட்டப்படி உறவு). A passer-by என்பது ஒரு PASSER (கடந்து செல்பவர்). A commander-in-chief என்பது ஒரு COMMANDER. முக்கியப் பெயர்ச்சொல் பொருளைச் சுமக்கிறது, -s அங்கேதான் செல்கிறது.",
  tl:"Mukkiyap peyarcholaik kandariyungal. Kelungal: indha vishayam unmaiyil enna? A son-in-law enbadhu oru SON. A passer-by enbadhu oru PASSER. A commander-in-chief enbadhu oru COMMANDER."},
 {h:"The high-frequency list",
  en:"sons-in-law, daughters-in-law, fathers-in-law, mothers-in-law, brothers-in-law, sisters-in-law, passers-by, lookers-on, runners-up, commanders-in-chief, editors-in-chief, men-of-war, courts-martial, attorneys-general, poets laureate.",
  ta:"அடிக்கடி வரும் பட்டியல்: sons-in-law, daughters-in-law, fathers-in-law, mothers-in-law, brothers-in-law, sisters-in-law, passers-by, lookers-on, runners-up, commanders-in-chief, editors-in-chief, courts-martial, attorneys-general.",
  tl:"Adikkadi varum pattiyal: sons-in-law, daughters-in-law, fathers-in-law, mothers-in-law, brothers-in-law, sisters-in-law, passers-by, lookers-on, runners-up, commanders-in-chief, editors-in-chief, courts-martial."},
 {h:"When there is no head noun, -s goes at the end",
  en:"Forget-me-nots, higher-ups, good-for-nothings, grown-ups, drawbacks, breakdowns, take-offs, hold-ups. In these, no single word is the main noun, so the plural falls at the end.",
  ta:"முக்கியப் பெயர்ச்சொல் இல்லாதபோது, -s இறுதியில் வரும். Forget-me-nots, higher-ups, good-for-nothings, grown-ups, drawbacks, breakdowns, take-offs. இவற்றில் எந்த ஒரு சொல்லும் முக்கியப் பெயர்ச்சொல் அல்ல, எனவே பன்மை இறுதியில் விழுகிறது.",
  tl:"Mukkiyap peyarchol illaadhabodhu, -s irudhiyil varum. Forget-me-nots, higher-ups, good-for-nothings, grown-ups, drawbacks, breakdowns, take-offs."},
 {h:"Plural and possessive go in different places",
  en:"PLURAL goes on the head word: 'sons-in-law'. POSSESSIVE goes at the very end: 'my son-in-law's house'. Both together: 'my sons-in-law's houses'. Do not confuse Rule 16 with Rule 18.",
  ta:"பன்மையும் உடைமையும் வெவ்வேறு இடங்களில் வரும். பன்மை முக்கியச் சொல்லில்: 'sons-in-law'. உடைமை இறுதியில்: 'my son-in-law's house'. இரண்டும் சேர்ந்து: 'my sons-in-law's houses'. Rule 16-ஐயும் Rule 18-ஐயும் குழப்பிக் கொள்ளாதீர்கள்.",
  tl:"Panmaiyum udaimaiyum vevveru idangalil varum. Panmai mukkiyach solil: 'sons-in-law'. Udaimai irudhiyil: 'my son-in-law's house'. Rule 16-aiyum Rule 18-aiyum kuzhappik kollaadheergal."}],

 s3:[
 {h:"Ask what the thing really is",
  d:"   son-in-law        →  it is a SON        →  sonS-in-law\n   passer-by         →  it is a PASSER     →  passerS-by\n   commander-in-chief→  it is a COMMANDER  →  commanderS-in-chief\n   runner-up         →  it is a RUNNER     →  runnerS-up\n\n   The -s follows the MEANING, not the position."},
 {h:"Two different patterns",
  d:"  HEAD NOUN PRESENT  →  -s on the head\n    sons-in-law · passers-by · runners-up\n    commanders-in-chief · courts-martial\n\n  NO HEAD NOUN       →  -s at the end\n    forget-me-nots · higher-ups\n    good-for-nothings · grown-ups · breakdowns"},
 {h:"Plural vs possessive placement",
  d:"  PLURAL     →  sonS-in-law          (middle)\n  POSSESSIVE →  son-in-law'S house    (end)\n  BOTH       →  sonS-in-law'S houses\n\n  Rule 18 = plural = middle\n  Rule 16 = possessive = end"}],

 s4:{
 wrong:["\"The -s always goes at the end of a word.\" — In compounds it goes on the head noun.",
  "\"'Son-in-laws' sounds natural.\" — It must be 'sons-in-law'.",
  "\"All hyphenated words follow the same pattern.\" — Only those with a clear head noun.",
  "\"Plural and possessive both go at the end.\" — Plural goes in the middle, possessive at the end."],
 right:["Ask: what IS this thing? A son-in-law is a SON.",
  "Put the -s on that head noun.",
  "If no word is clearly the head, put -s at the end.",
  "Remember: plural in the middle, possessive at the end."]},

 s5:[
 {en:"Both his sons-in-law live abroad.",ta:"அவருடைய இரு மருமகன்களும் வெளிநாட்டில் வசிக்கிறார்கள்.",tl:"Avarudaiya iru marumagangalum velinaattil vasikkiraargal.",note:"'Son' is the head noun → sons-in-law."},
 {en:"The two passers-by were questioned by the police.",ta:"வழியில் சென்ற இரு நபர்களும் காவல்துறையால் விசாரிக்கப்பட்டனர்.",tl:"Vazhiyil sendra iru nabargalum kaavalthuraiyaal visaarikkappattanar.",note:"'Passer' is the head noun → passers-by."},
 {en:"The commanders-in-chief met in Delhi.",ta:"தலைமைத் தளபதிகள் டெல்லியில் சந்தித்தனர்.",tl:"Thalaimaith thalapadhigal Delhiyil sandhiththanar.",note:"'Commander' is the head noun."},
 {en:"The runners-up received silver medals.",ta:"இரண்டாம் இடம் பிடித்தவர்கள் வெள்ளிப் பதக்கங்களைப் பெற்றனர்.",tl:"Irandaam idam pidiththavargal vellip padhakkangalaip petranar.",note:"'Runner' is the head noun."},
 {en:"She planted forget-me-nots along the wall.",ta:"அவர் சுவர் ஓரமாக மறவாமல் இருப்பாய் மலர்களை நட்டார்.",tl:"Avar suvar oramaaga 'forget-me-not' malargalai nattaar.",note:"No head noun → the -s goes at the end."}],

 s10:{
  en:"'Son-in-laws' sounds completely natural because English usually puts -s at the end. The exam relies on that instinct. The second trap is knowing which compounds have NO head noun — 'forget-me-nots' and 'higher-ups' correctly take -s at the end, so a student who over-applies the rule writes 'forgets-me-not' and is wrong again.",
  ta:"'Son-in-laws' முற்றிலும் இயற்கையாகத் தோன்றுகிறது, ஏனெனில் ஆங்கிலம் பொதுவாக -s-ஐ இறுதியில் வைக்கிறது. தேர்வு அந்த உள்ளுணர்வை நம்பியிருக்கிறது. இரண்டாவது பொறி எந்தக் கூட்டுச் சொற்களுக்கு முக்கியப் பெயர்ச்சொல் இல்லை என்று அறிவது — 'forget-me-nots' மற்றும் 'higher-ups' சரியாகவே இறுதியில் -s எடுக்கின்றன, எனவே விதியை அளவுக்கு அதிகமாகப் பயன்படுத்தும் மாணவர் 'forgets-me-not' என்று எழுதி மீண்டும் தவறு செய்கிறார்.",
  tl:"'Son-in-laws' mutrilum iyarkaiyaagath thondrugiradhu, yenenil Aangilam podhuvaaga -s-ai irudhiyil vaikkiradhu. Irandaavadhu pori endhak koottuch sorkalukku mukkiyap peyarchol illai endru arivadhu."},

 s11:{
  en:"ASK: WHAT IS IT? A son-in-law is a SON. Put the -s there.",
  ta:"கேளுங்கள்: இது என்ன? A son-in-law என்பது ஒரு SON. -s-ஐ அங்கே வையுங்கள்.",
  tl:"Kelungal: idhu enna? A son-in-law enbadhu oru SON. -s-ai ange vaiyungal.",
  vis:"      THE 'WHAT IS IT?' TEST\n\n   son-in-law         →  it IS a son      →  sonS-in-law\n   passer-by          →  it IS a passer   →  passerS-by\n   runner-up          →  it IS a runner   →  runnerS-up\n   commander-in-chief →  it IS a commander→  commanderS-in-chief\n   court-martial      →  it IS a court    →  courtS-martial\n\n   NO CLEAR ANSWER → -s AT THE END:\n   forget-me-notS · higher-upS\n   good-for-nothingS · grown-upS · drawbackS\n\n   ⚠ DO NOT CONFUSE:\n     PLURAL     → sonS-in-law       (middle)\n     POSSESSIVE → son-in-law'S      (end)"},

 "The commanders-in-chief of ____ three forces ____ met, and each of them ____ submitted a report.|the-have-has;a-has-have;the-has-has|0|Specific forces → THE. Plural → HAVE MET. 'Each of them' → HAS."],

 s14:{
  rule:"In compound nouns, add the plural -s to the principal word, not automatically to the last word.",
  formula:"HEAD NOUN present → -s on the head (sons-in-law)\nNO head noun → -s at the end (forget-me-nots)",
  memory:"Ask what the thing IS. A son-in-law is a SON, so sons-in-law.",
  ta:"அது என்னன்னு கேளுங்க. A son-in-law ஒரு SON, அதனால sons-in-law.",
  tl:"Adhu ennannu kelunga. A son-in-law oru SON, adhanaala sons-in-law.",
  mistake:"Writing 'son-in-laws' and 'passer-bys', and over-applying the rule to 'forgets-me-not'.",
  exam:"SSC CGL / CHSL and RRB — a short, high-certainty question if you know the head-noun test."},

 s15:[
 {ta:"இந்த rule-ல ஒரு எளிமையான கேள்வி கேட்டா போதும்: 'இது என்ன?' அவ்ளோதான். 'Son-in-law' அப்படின்னா என்ன? ஒரு மகன். சட்டப்படி வந்த மகன், ஆனா மகன்தான். அதனால பன்மை எங்க வரும்? 'Son'-ல. 'Sons-in-law'.",
  tl:"Indha rule-la oru elimaiyaana kelvi kettaa podhum: 'idhu enna?' Avlodhaan. 'Son-in-law' appadinnaa enna? Oru magan. Sattappadi vandha magan, aanaa magan-dhaan. Adhanaala panmai enga varum? 'Son'-la. 'Sons-in-law'."},
 {ta:"நமக்கு 'son-in-laws' அப்படின்னு எழுத தோணும். ஏன்? ஏன்னா ஆங்கிலத்துல பொதுவா -s கடைசில வரும். 'books', 'cars', 'boys'. அதனால இங்கயும் கடைசில போட்டுடுவோம். ஆனா கூட்டுப் பெயர்ல அது வேலை செய்யாது.",
  tl:"Namakku 'son-in-laws' appadinnu ezhudha thonum. Yennaa Aangilaththula podhuvaa -s kadaisila varum. 'books', 'cars', 'boys'. Adhanaala ingayum kadaisila poduduvom. Aanaa koottup peyarla adhu velai seyyaadhu."},
 {ta:"இன்னும் சில உதாரணம். 'Passer-by' அப்படின்னா என்ன? கடந்து போறவரு — ஒரு 'passer'. அதனால 'passers-by'. 'Runner-up' அப்படின்னா என்ன? ஓடினவரு, ரெண்டாவது வந்தவரு — ஒரு 'runner'. அதனால 'runners-up'. 'Commander-in-chief' — ஒரு 'commander'. அதனால 'commanders-in-chief'.",
  tl:"Innum sila udhaaranam. 'Passer-by' appadinnaa enna? Kadandhu poravaru — oru 'passer'. Adhanaala 'passers-by'. 'Runner-up' appadinnaa enna? Oru 'runner'. Adhanaala 'runners-up'."},
 {ta:"இப்போ ஒரு எச்சரிக்கை. எல்லா கூட்டுப் பெயருக்கும் இப்படி இல்ல. 'Forget-me-not' அப்படின்னா என்ன? அது ஒரு மலரோட பெயர். 'Forget' அப்படிங்கிறது பெயர்ச்சொல் இல்ல, 'me' இல்ல, 'not' இல்ல. முக்கியச் சொல்லே இல்ல. அப்படின்னா -s எங்க போடுறது? கடைசில. 'Forget-me-nots'.",
  tl:"Ippo oru echcharikkai. Ellaa koottup peyarukkum ippadi illa. 'Forget-me-not' appadinnaa enna? Adhu oru malaroda peyar. Mukkiyach solle illa. Appadinnaa -s enga poduradhu? Kadaisila. 'Forget-me-nots'."},
 {ta:"அதே மாதிரி 'higher-up' (உயர் அதிகாரி), 'grown-up' (வளர்ந்தவர்), 'good-for-nothing' (பயனற்றவர்), 'drawback' (குறை), 'breakdown' (பழுது). இவற்றுல முக்கியச் சொல் இல்ல, அதனால -s கடைசில. 'Higher-ups', 'grown-ups', 'good-for-nothings', 'drawbacks', 'breakdowns'.",
  tl:"Adhe maadhiri 'higher-up', 'grown-up', 'good-for-nothing', 'drawback', 'breakdown'. Ivatrula mukkiyach sol illa, adhanaala -s kadaisila. 'Higher-ups', 'grown-ups', 'good-for-nothings', 'drawbacks', 'breakdowns'."},
 {ta:"கடைசியா ஒரு ரொம்ப முக்கியமான விஷயம் — பன்மை வேற, உடைமை வேற. பன்மை நடுவுல: 'sons-in-law'. உடைமை கடைசில: 'my son-in-law's house'. ரெண்டும் சேர்ந்து வந்தா: 'my sons-in-law's houses'. Rule 16-ல உடைமை படிச்சோம், இங்க பன்மை படிக்கிறோம். ரெண்டையும் குழப்பிக்காதீங்க — பன்மை நடுவுல, உடைமை கடைசில.",
  tl:"Kadaisiyaa oru romba mukkiyamaana vishayam — panmai veru, udaimai veru. Panmai naduvula: 'sons-in-law'. Udaimai kadaisila: 'my son-in-law's house'. Rendum serndhu vandhaa: 'my sons-in-law's houses'. Panmai naduvula, udaimai kadaisila."}]},

/* ========== RULE 19 ========== */
{n:19,rc:"NOU-09",d:"Medium",t:"A Noun used as an ADJECTIVE stays Singular",
 tam:"பெயரடையாக வரும் பெயர்ச்சொல் ஒருமையிலேயே இருக்கும்",
 s1:{en:"When a noun of NUMBER or MEASURE is placed before another noun to describe it, it becomes a compound ADJECTIVE, stays SINGULAR, and is usually hyphenated.",
  ta:"ஒரு எண் அல்லது அளவைக் குறிக்கும் பெயர்ச்சொல் மற்றொரு பெயர்ச்சொல்லை விவரிக்க அதற்கு முன் வைக்கப்படும்போது, அது ஒரு கூட்டுப் பெயரடையாக மாறி, ஒருமையிலேயே இருந்து, பொதுவாக இணைப்புக்குறியிடப்படும்.",
  tl:"Oru en alladhu alavaik kurikkum peyarchol matroru peyarcholai vivarikka adharku mun vaikkappadumbodhu, adhu oru koottup peyaradaiyaaga maari, orumaiyileye irundhu, podhuvaaga inaippukkuriyidappadum.",
  formula:"NUMBER + NOUN + NOUN  →  hyphenated, SINGULAR\n\n  a ten-rupee note      (not ten-rupees)\n  a five-year plan      (not five-years)\n  a three-hour journey  (not three-hours)\n  a six-foot wall       (not six-feet)\n  a two-day strike      (not two-days)\n\nREMOVE THE HYPHEN → the plural returns:\n  a journey OF THREE HOURS  ✔"},

 s2:[
 {h:"Adjectives never take -s in English",
  en:"'A ten-rupee note' — here 'ten-rupee' is describing what KIND of note it is, exactly like 'red' in 'a red note'. Adjectives in English never take -s. You would never write 'a reds note'.",
  ta:"ஆங்கிலத்தில் பெயரடைகள் ஒருபோதும் -s எடுப்பதில்லை. 'A ten-rupee note' — இங்கே 'ten-rupee' அது எந்த வகை நோட்டு என்பதை விவரிக்கிறது, 'a red note'-ல் உள்ள 'red' போலவே. ஆங்கிலத்தில் பெயரடைகள் ஒருபோதும் -s எடுப்பதில்லை. 'A reds note' என்று ஒருபோதும் எழுத மாட்டீர்கள்.",
  tl:"Aangilaththil peyaradaigal orupodhum -s eduppadhillai. 'A ten-rupee note' — inge 'ten-rupee' adhu endha vagai nottu enbadhai vivarikkiradhu, 'a red note'-l ulla 'red' polave."},
 {h:"The hyphen is the signal",
  en:"If the words are hyphenated and sit BEFORE a noun, the measure stays singular. If they stand alone after 'of', the plural returns: 'a three-hour journey' but 'a journey of three hours'. Both are correct in their own place.",
  ta:"இணைப்புக்குறிதான் அறிகுறி. சொற்கள் இணைப்புக்குறியிடப்பட்டு ஒரு பெயர்ச்சொல்லுக்கு முன் இருந்தால், அளவு ஒருமையாகவே இருக்கும். 'Of'-க்குப் பின் தனியாக நின்றால், பன்மை திரும்பி வரும்: 'a three-hour journey' ஆனால் 'a journey of three hours'. இரண்டும் அவரவர் இடத்தில் சரி.",
  tl:"Inaippukkuridhaan arikuri. Sorkal inaippukkuriyidappattu oru peyarcholukku mun irundhaal, alavu orumaiyaagave irukkum. 'Of'-kkup pin thaniyaaga nindraal, panmai thirumbi varum."},
 {h:"Same idea with age and distance",
  en:"'A five-year-old boy' but 'The boy is five years old'. 'A ten-kilometre walk' but 'a walk of ten kilometres'. Before the noun → singular and hyphenated. After the verb or 'of' → plural.",
  ta:"வயது மற்றும் தூரத்திற்கும் அதே கருத்து. 'A five-year-old boy' ஆனால் 'The boy is five years old'. 'A ten-kilometre walk' ஆனால் 'a walk of ten kilometres'. பெயர்ச்சொல்லுக்கு முன் → ஒருமை மற்றும் இணைப்புக்குறி. வினைச்சொல் அல்லது 'of'-க்குப் பின் → பன்மை.",
  tl:"Vayadhu matrum dhooraththirkum adhe karuththu. 'A five-year-old boy' aanaal 'The boy is five years old'. 'A ten-kilometre walk' aanaal 'a walk of ten kilometres'."},
 {h:"This connects to SVA Rule 42",
  en:"In the SVA module you learnt that 'Ten thousand rupees IS a big amount' — money as ONE measurement takes a singular verb. Here you are seeing the same idea in the noun's FORM. One measurement, one singular word.",
  ta:"இது SVA Rule 42-உடன் தொடர்புடையது. SVA module-ல் 'Ten thousand rupees IS a big amount' என்று கற்றுக்கொண்டீர்கள் — பணம் ஒரே அளவீடாக ஒருமை வினைச்சொல்லை எடுக்கும். இங்கே அதே கருத்தை பெயர்ச்சொல்லின் வடிவத்தில் பார்க்கிறீர்கள். ஒரு அளவீடு, ஒரு ஒருமைச் சொல்.",
  tl:"Idhu SVA Rule 42-udan thodarpudaiyadhu. SVA module-l 'Ten thousand rupees IS a big amount' endru katrukkondeergal. Inge adhe karuththai peyarcholin vadivaththil paarkkireergal."}],

 s3:[
 {h:"It is describing, not counting",
  d:"   a RED note        →  what kind? red\n   a TEN-RUPEE note  →  what kind? ten-rupee\n           ↑\n     both are ADJECTIVES\n     adjectives never take -s\n\n   a ten-rupees note   ✘\n   a reds note         ✘   (same mistake)"},
 {h:"The hyphen switch",
  d:"  BEFORE the noun (hyphenated) → SINGULAR\n    a three-hour journey     ✔\n    a five-year plan         ✔\n    a six-foot wall          ✔\n\n  AFTER 'of' or the verb → PLURAL\n    a journey of three hours ✔\n    The wall is six feet high ✔\n    The boy is five years old ✔"}],

 s4:{
 wrong:["\"Ten is more than one, so I must write 'ten-rupees'.\" — As an adjective it stays singular.",
  "\"'A five-years plan' shows it lasts five years.\" — Before a noun it must be 'five-year'.",
  "\"The hyphen makes no difference.\" — The hyphen is exactly what signals the adjective use.",
  "\"'A journey of three hour' is correct.\" — After 'of' the plural returns: three hours."],
 right:["Ask: is this describing the noun that follows? If yes → singular and hyphenated.",
  "Look for the hyphen. Hyphen before a noun → singular.",
  "After 'of' or after the verb → plural returns.",
  "Test it against 'a red note' — adjectives never take -s."]},

 {en:"The journey took three hours by bus.",ta:"அந்தப் பயணம் பேருந்தில் மூன்று மணி நேரம் எடுத்தது.",tl:"Andhap payanam perundhil moondru mani neram eduththadhu.",note:"Standing alone after the verb → plural HOURS."},

 s10:{
  en:"Both forms exist and both are correct — in different positions. 'A three-hour journey' and 'a journey of three hours' are BOTH right. The exam gives you one position and the wrong form. The hyphen is your signal: hyphen before a noun means singular. Watch also for the verb position: 'The wall is six FEET high' is plural because it comes after the verb.",
  ta:"இரண்டு வடிவங்களும் இருக்கின்றன, இரண்டுமே சரி — வெவ்வேறு இடங்களில். 'A three-hour journey' மற்றும் 'a journey of three hours' இரண்டுமே சரி. தேர்வு உங்களுக்கு ஒரு இடத்தையும் தவறான வடிவத்தையும் தரும். இணைப்புக்குறிதான் உங்கள் அறிகுறி: பெயர்ச்சொல்லுக்கு முன் இணைப்புக்குறி என்றால் ஒருமை. வினைச்சொல் இடத்தையும் கவனியுங்கள்: 'The wall is six FEET high' பன்மை, ஏனெனில் அது வினைச்சொல்லுக்குப் பின் வருகிறது.",
  tl:"Irandu vadivangalum irukkindrana, irandume sari — vevveru idangalil. Thervu ungalukku oru idaththaiyum thavaraana vadivaththaiyum tharum. Inaippukkuridhaan ungal arikuri."},

 s11:{
  en:"HYPHEN BEFORE A NOUN → SINGULAR. Test it against 'a red note' — adjectives never take -s.",
  ta:"பெயர்ச்சொல்லுக்கு முன் இணைப்புக்குறி → ஒருமை. 'A red note'-உடன் சோதியுங்கள் — பெயரடைகள் ஒருபோதும் -s எடுப்பதில்லை.",
  tl:"Peyarcholukku mun inaippukkuri → orumai. 'A red note'-udan sodhiyungal — peyaradaigal orupodhum -s eduppadhillai.",
  vis:"       THE POSITION TEST\n\n   BEFORE the noun, with hyphen  →  SINGULAR\n     a ten-rupee note\n     a five-year plan\n     a three-hour journey\n     a six-foot wall\n\n   AFTER 'of' or AFTER the verb  →  PLURAL\n     a note of ten rupees\n     a journey of three hours\n     The wall is six feet high\n     The boy is five years old\n\n   THE RED-NOTE TEST:\n   Would you write 'a redS note'? No.\n   Then do not write 'a ten-rupeeS note'."},

 "It was ____ three-hour journey, but ____ journey of three hours ____ nothing for him.|a-a-was;a-the-were;the-a-was|0|Before the noun → singular. After 'of' → plural. One period → WAS (SVA Rule 42).",
 "He handed over ____ five-hundred-rupee note, which ____ ____ large amount for him.|a-was-a;a-were-a;the-was-an|0|Compound adjective → singular. Money as one amount → WAS.",
 "She has ____ five-year-old son who is nearly four ____ tall now.|a-feet;a-foot;an-feet|0|Before the noun → 'five-year-old'. After the verb → 'feet'.",
 "____ two-day strike by the workers ____ caused losses of ____ crores of rupees.|A-has-—;The-has-—;A-have-the|0|Compound adjective → 'two-day'. Singular subject → HAS. 'Crores of' needs no article."],

 s14:{
  rule:"A noun of number or measure used before another noun becomes an adjective, stays singular and is hyphenated.",
  formula:"NUMBER-NOUN + noun → singular, hyphenated (a ten-rupee note)\nafter 'of' or the verb → plural (a note of ten rupees)",
  memory:"Would you write 'a reds note'? No. So no 'a ten-rupees note' either.",
  ta:"'A reds note' அப்படின்னு எழுதுவீங்களா? இல்ல. அப்படின்னா 'a ten-rupees note'-ம் இல்ல.",
  tl:"'A reds note' appadinnu ezhudhuveengalaa? Illa. Appadinnaa 'a ten-rupees note'-um illa.",
  mistake:"Writing 'a five-years plan' and 'a six-feet wall' before a noun.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule-ல ஒரு அழகான தர்க்கம் இருக்கு. 'A ten-rupee note' அப்படின்னு எழுதுறோம், 'ten-rupees' இல்ல. ஏன்? பத்து ரூபாய்ன்னா பன்மை இல்லையா?",
  tl:"Indha rule-la oru azhagaana tharkkam irukku. 'A ten-rupee note' appadinnu ezhudhurom, 'ten-rupees' illa. Yen? Paththu roobaaynnaa panmai illaiyaa?"},
 {ta:"இங்க கவனிங்க — 'ten-rupee' அப்படிங்கிறது பணத்தை எண்ணல. அது நோட்டை விவரிக்குது. எந்த மாதிரி நோட்டு? பத்து ரூபாய் நோட்டு. அது ஒரு பெயரடை (adjective). ஆங்கிலத்துல பெயரடைக்கு எப்பவும் -s கிடையாது.",
  tl:"Inga kavaninga — 'ten-rupee' appadingiradhu panaththai ennala. Adhu nottai vivarikkudhu. Endha maadhiri nottu? Paththu roobaay nottu. Adhu oru peyaradai (adjective). Aangilaththula peyaradaikku eppavum -s kidaiyaadhu."},
 {ta:"இதை சோதிக்க ஒரு அருமையான வழி — நான் இதை 'சிவப்பு நோட்டு சோதனை' அப்படின்னு சொல்லுவேன். 'A red note' அப்படின்னு எழுதுறோம் இல்லையா? 'A reds note' அப்படின்னு எழுதுவீங்களா? கண்டிப்பா இல்ல. அதே மாதிரி 'a ten-rupee note' — 'ten-rupees' இல்ல. ரெண்டுமே பெயரடை.",
  tl:"Idhai sodhikka oru arumaiyaana vazhi — naan idhai 'sivappu nottu sodhanai' appadinnu solluven. 'A red note' appadinnu ezhudhurom illaiyaa? 'A reds note' appadinnu ezhudhuveengalaa? Kandippaa illa. Adhe maadhiri 'a ten-rupee note'."},
 {ta:"இப்போ இணைப்புக்குறி (hyphen) பத்தி சொல்லுறேன். அதுதான் உங்க அறிகுறி. Hyphen இருக்கு, பெயர்ச்சொல்லுக்கு முன்னாடி இருக்கு — அப்படின்னா ஒருமை. 'A three-hour journey', 'a five-year plan', 'a six-foot wall'. எல்லாமே ஒருமை.",
  tl:"Ippo inaippukkuri (hyphen) paththi solluren. Adhudhaan unga arikuri. Hyphen irukku, peyarcholukku munnaadi irukku — appadinnaa orumai. 'A three-hour journey', 'a five-year plan', 'a six-foot wall'."},
 {ta:"ஆனா இடம் மாறினா என்ன ஆகும்? 'A journey of three hours' — இப்போ 'hours' பன்மை! ஏன்? ஏன்னா இப்போ அது பெயரடை இல்ல, அது ஒரு உண்மையான பெயர்ச்சொல். 'Of'-க்கு அப்பறம் வருது. அதே மாதிரி 'The wall is six feet high' — verb-க்கு அப்பறம், அதனால 'feet' பன்மை.",
  tl:"Aanaa idam maarinaa enna aagum? 'A journey of three hours' — ippo 'hours' panmai! Yennaa ippo adhu peyaradai illa, adhu oru unmaiyaana peyarchol. Adhe maadhiri 'The wall is six feet high' — verb-kku apparam, adhanaala 'feet' panmai."},
 {ta:"அதனால கடைசி கேள்வி இதுதான்: 'இது என்னைத் தொடர்ந்து வர்ற பெயர்ச்சொல்லை விவரிக்குதா?' விவரிச்சா ஒருமை, hyphen. விவரிக்கலைன்னா, தனியா நிக்குதுன்னா, பன்மை. மேலும் இதை SVA Rule 42-ஓட இணைச்சுப் பாருங்க — அங்க 'Ten thousand rupees IS a big amount' அப்படின்னு படிச்சோம். ஒரே அளவீடு, ஒருமை. இங்கயும் அதே கருத்து, ஆனா verb-ல இல்ல, வார்த்தையோட வடிவத்துல.",
  tl:"Adhanaala kadaisi kelvi idhudhaan: 'idhu ennaith thodarndhu varra peyarcholai vivarikkudhaa?' Vivarichaa orumai, hyphen. Vivarikkalainnaa, thaniyaa nikkudhunnaa, panmai. Melum idhai SVA Rule 42-oda inaichup paarunga."}]},

/* ========== RULE 20 ========== */
{n:20,rc:"NOU-10",d:"Hard",t:"Nouns that CHANGE MEANING in the Plural",
 tam:"பன்மையில் வேறு பொருள் தரும் பெயர்ச்சொற்கள்",
 s1:{en:"Some nouns carry a COMPLETELY DIFFERENT meaning in the plural. Pain means suffering, but PAINS means careful effort. Air means atmosphere, but AIRS means arrogance. The plural is not just 'more of the same'.",
  ta:"சில பெயர்ச்சொற்கள் பன்மையில் முற்றிலும் வேறுபட்ட பொருளைச் சுமக்கின்றன. Pain என்றால் துன்பம், ஆனால் PAINS என்றால் கவனமான முயற்சி. Air என்றால் காற்று, ஆனால் AIRS என்றால் ஆணவம். பன்மை என்பது வெறும் 'அதே பொருளின் அதிகம்' அல்ல.",
  tl:"Sila peyarchorkal panmaiyil mutrilum verupatta porulaich sumakkindrana. Pain endraal thunbam, aanaal PAINS endraal kavanamaana muyarchi. Air endraal kaatru, aanaal AIRS endraal aanavam.",
  formula:"SINGULAR meaning  vs  PLURAL meaning\n\n  pain   (suffering)    →  painS   (careful effort)\n  air    (atmosphere)   →  airS    (arrogance)\n  good   (benefit)      →  goodS   (merchandise)\n  wood   (timber)       →  woodS   (forest)\n  force  (strength)     →  forceS  (army)\n  respect(regard)       →  respectS(greetings)\n  quarter(one fourth)   →  quarterS(residence)\n  manner (method)       →  mannerS (behaviour)"},

 s2:[
 {h:"PAINS is the most tested pair",
  en:"'He is in pain' means he is suffering. 'He takes great pains over his work' means he puts in careful effort. SSC tests this pair more than all the others combined. 'Take pains' is a fixed idiom meaning 'work carefully'.",
  ta:"PAINS-தான் மிக அதிகமாகச் சோதிக்கப்படும் ஜோடி. 'He is in pain' என்றால் அவர் துன்பப்படுகிறார். 'He takes great pains over his work' என்றால் அவர் கவனமான முயற்சி எடுக்கிறார். SSC இந்த ஜோடியை மற்ற அனைத்தையும் விட அதிகமாகச் சோதிக்கிறது. 'Take pains' என்பது 'கவனமாக உழைப்பது' என்று பொருள்படும் ஒரு நிலையான மரபுத்தொடர்.",
  tl:"PAINS-dhaan miga adhigamaagach sodhikkappadum jodi. 'He is in pain' endraal avar thunbappadugiraar. 'He takes great pains over his work' endraal avar kavanamaana muyarchi edukkiraar. 'Take pains' enbadhu oru nilaiyaana marabuththodar."},
 {h:"The full high-frequency list",
  en:"pain/pains, air/airs, good/goods, wood/woods, force/forces, respect/respects, quarter/quarters, manner/manners, letter/letters, spectacle/spectacles, iron/irons, custom/customs, content/contents, arm/arms, effect/effects, premise/premises, sand/sands.",
  ta:"முழு அடிக்கடி வரும் பட்டியல்: pain/pains, air/airs, good/goods, wood/woods, force/forces, respect/respects, quarter/quarters, manner/manners, letter/letters, iron/irons, custom/customs, content/contents, arm/arms, effect/effects, premise/premises.",
  tl:"Muzhu adikkadi varum pattiyal: pain/pains, air/airs, good/goods, wood/woods, force/forces, respect/respects, quarter/quarters, manner/manners, letter/letters, iron/irons, custom/customs, content/contents, arm/arms, effect/effects."},
 {h:"Some plurals also change the verb",
  en:"'The goods HAVE arrived' — 'goods' meaning merchandise is always plural and takes a plural verb. 'The premises ARE locked'. 'His manners ARE good'. Once the meaning changes, the number often changes with it.",
  ta:"சில பன்மைகள் வினைச்சொல்லையும் மாற்றுகின்றன. 'The goods HAVE arrived' — சரக்கு என்று பொருள்படும் 'goods' எப்போதும் பன்மை, பன்மை வினைச்சொல்லை எடுக்கும். 'The premises ARE locked'. 'His manners ARE good'. பொருள் மாறியவுடன், எண்ணும் அதனுடன் மாறுகிறது.",
  tl:"Sila panmaigal vinaicholaiyum maatrugindrana. 'The goods HAVE arrived' — sarakku endru porulpadum 'goods' eppodhum panmai. 'The premises ARE locked'. 'His manners ARE good'."},
 {h:"Read the whole sentence for the meaning",
  en:"You cannot choose between 'pain' and 'pains' without reading what the sentence is about. If it is about effort → pains. If it is about suffering → pain. The context is the only guide.",
  ta:"பொருளுக்காக முழு வாக்கியத்தையும் படியுங்கள். வாக்கியம் எதைப் பற்றியது என்று படிக்காமல் 'pain' மற்றும் 'pains' இடையே தேர்ந்தெடுக்க முடியாது. முயற்சி பற்றியது என்றால் → pains. துன்பம் பற்றியது என்றால் → pain. சூழல் மட்டுமே வழிகாட்டி.",
  tl:"Porulukkaaga muzhu vaakkiyaththaiyum padiyungal. Muyarchi patriyadhu endraal → pains. Thunbam patriyadhu endraal → pain. Soozhal mattume vazhikaatti."}],

 s3:[
 {h:"The plural is a different word",
  d:"   PAIN    😣 suffering        PAINS    💪 careful effort\n   AIR     🌬️ atmosphere       AIRS     😤 arrogance\n   GOOD    😊 benefit           GOODS    📦 merchandise\n   WOOD    🪵 timber            WOODS    🌲 forest\n   FORCE   💪 strength          FORCES   🪖 army\n   MANNER  📋 method            MANNERS  🙏 behaviour\n\n   The -s does NOT mean 'more of the same'."},
 {h:"The two most tested pairs",
  d:"  He is in PAIN.\n     →  he is suffering  😣\n\n  He takes great PAINS over his work.\n     →  he works with care  💪\n     (fixed idiom: TAKE PAINS = work carefully)\n\n  She puts on AIRS.\n     →  she behaves arrogantly  😤\n     (fixed idiom: PUT ON AIRS)"},
 {h:"Some plurals force a plural verb",
  d:"  The goods HAVE arrived.       (merchandise)\n  The premises ARE locked.       (building)\n  His manners ARE excellent.     (behaviour)\n  The armed forces ARE ready.    (army)\n\n  Meaning changes → number changes → verb changes."}],

 s4:{
 wrong:["\"'Pains' just means a lot of pain.\" — It means careful effort, a completely different idea.",
  "\"'Airs' means more than one air.\" — It means arrogant behaviour.",
  "\"'He took great pain to finish it' is correct.\" — For effort it must be 'pains'.",
  "\"'The goods has arrived' — goods is one shipment.\" — 'Goods' is always plural and takes a plural verb."],
 right:["Read the whole sentence and decide what it is ABOUT.",
  "Effort → pains. Suffering → pain.",
  "Learn the fixed idioms: take pains, put on airs, pay respects.",
  "Check the verb too: goods HAVE, premises ARE, manners ARE."]},

 s5:[
 {en:"He takes great pains over his work.",ta:"அவர் தன்னுடைய வேலையில் மிகுந்த முயற்சி எடுக்கிறார்.",tl:"Avar thannudaiya velaiyil migundha muyarchi edukkiraar.",note:"'Pains' means careful effort, not suffering."},
 {en:"He is in great pain after the accident.",ta:"விபத்துக்குப் பிறகு அவர் கடுமையான வலியில் இருக்கிறார்.",tl:"Vibaththukkup piragu avar kadumaiyaana valiyil irukkiraar.",note:"'Pain' means physical suffering."},
 {en:"She always puts on airs before guests.",ta:"விருந்தினர்கள் முன் அவர் எப்போதும் ஆணவமாக நடந்துகொள்கிறார்.",tl:"Virundhinargal mun avar eppodhum aanavamaaga nadandhukolgiraar.",note:"'Airs' means arrogant behaviour."},
 {en:"The goods have arrived at the warehouse.",ta:"சரக்குகள் கிடங்கிற்கு வந்துவிட்டன.",tl:"Sarakkugal kidangirku vandhuvittana.",note:"'Goods' means merchandise and is always plural."},
 {en:"They lost their way in the woods.",ta:"அவர்கள் காட்டில் வழி தவறிவிட்டனர்.",tl:"Avargal kaattil vazhi thavarivittanar.",note:"'Woods' means a forest, not timber."}],

 s7:[
 "He takes great ____ over his work.|pains|Easy|Effort → plural.",
 "He is in great ____ after the fall.|pain|Easy|Suffering → singular.",
 "She puts on ____ before guests.|airs|Easy|Arrogance → plural.",
 "The ____ have arrived at the depot.|goods|Medium|Merchandise → always plural.",
 "They lost their way in the ____.|woods|Medium|Forest → plural.",
 "The table is made of ____.|wood|Medium|Timber → singular.",
 "His ____ are very good at table.|manners|Medium|Behaviour → plural.",
 "He did it in this ____.|manner|Hard|Method → singular.",
 "The armed ____ are on alert.|forces|Hard|Army → plural.",
 "He used ____ to open the door.|force|Hard|Strength → singular.",
 "He paid his ____ to the elders.|respects|Hard|Greetings → plural.",
 "I have great ____ for my teacher.|respect|Expert|Regard → singular.",
 "The officers live in these ____.|quarters|Expert|Residence → plural.",
 "He gave me a ____ of the cake.|quarter|Expert|One fourth → singular.",
 "The ____ of the book are listed inside.|contents|Expert|Table of contents → plural."],

 s8:[
 "He took great pain to finish the project.|He took great pains to finish the project.|Effort requires 'pains'.",
 "He is in great pains after the accident.|He is in great pain after the accident.|Suffering requires 'pain'.",
 "She puts on air before her guests.|She puts on airs before her guests.|Arrogance requires 'airs'.",
 "The goods has arrived at the depot.|The goods have arrived at the depot.|'Goods' is always plural.",
 "They lost their way in the wood.|They lost their way in the woods.|A forest requires 'woods'.",
 "The table is made of woods.|The table is made of wood.|Timber requires 'wood'.",
 "His manner are very good.|His manners are very good.|Behaviour requires 'manners' and a plural verb.",
 "The armed force is on alert.|The armed forces are on alert.|An army requires 'forces'.",
 "He paid his respect to the elders.|He paid his respects to the elders.|Greetings require 'respects'.",
 "The officers live in this quarter.|The officers live in these quarters.|Residence requires 'quarters'."],

 s9:[
 "Fill in the Blank|The young scientist took great ____ to verify every single reading.|pain;pains|1|Careful effort requires 'pains'.",
 "Find the Error|The goods (A) has been (B) despatched by (C) the morning train (D).|A;B;C;D|1|Part B. 'Goods' is always plural → 'have been despatched'.",
 "Sentence Improvement|She always puts on air whenever important guests visit the house.|puts on air;puts on airs;put on airs|1|Arrogance requires the idiom 'put on airs'.",
 "Fill in the Blank|The children got lost in the ____ behind their grandfather's village.|wood;woods|1|A forest requires 'woods'.",
 "Find the Error|He paid his respect (A) to the elders (B) before leaving (C) for the city (D).|A;B;C;D|0|Part A. Greetings require 'respects'."],

 s10:{
  en:"This rule cannot be solved by grammar alone — you must know the MEANING of each pair. The exam builds a sentence about EFFORT and offers 'pain', which looks harmless. Or it builds a sentence about a FOREST and offers 'wood'. The pain/pains pair is the single most repeated. The secondary trap is the verb: 'The goods HAS arrived' is wrong because 'goods' is always plural.",
  ta:"இந்த விதியை இலக்கணத்தால் மட்டும் தீர்க்க முடியாது — ஒவ்வொரு ஜோடியின் பொருளையும் நீங்கள் தெரிந்திருக்க வேண்டும். தேர்வு முயற்சி பற்றிய ஒரு வாக்கியத்தை உருவாக்கி 'pain'-ஐத் தரும், அது பாதிப்பில்லாததாகத் தெரியும். அல்லது ஒரு காடு பற்றிய வாக்கியத்தை உருவாக்கி 'wood'-ஐத் தரும். pain/pains ஜோடிதான் மிக அதிகமாக மீண்டும் மீண்டும் வருகிறது. இரண்டாம் நிலைப் பொறி வினைச்சொல்: 'The goods HAS arrived' தவறு, ஏனெனில் 'goods' எப்போதும் பன்மை.",
  tl:"Indha vidhiyai ilakkanaththaal mattum theerkka mudiyaadhu — ovvoru jodiyin porulaiyum neengal therindhirukka vendum. Pain/pains jodidhaan miga adhigamaaga meendum meendum varugiradhu. Irandaam nilaip pori vinaichol."},

 s11:{

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[

 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-nouns', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
