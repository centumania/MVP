<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Nouns — 10 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

const RULES=[
/* ========== RULE 11 ========== */
{n:11,rc:"NOU-01",d:"Easy",t:"Nouns that are ALWAYS Plural",
 tam:"Scissors, Trousers, Spectacles — எப்போதும் பன்மை · Eppodhum panmai",
 s1:{en:"Scissors, trousers, spectacles, tongs, pliers, pincers, scales, shorts, jeans, pyjamas, binoculars, goggles and bellows are ALWAYS plural. They take a PLURAL verb and have no singular form.",
  ta:"Scissors, trousers, spectacles, tongs, pliers, scales, shorts, jeans, pyjamas, binoculars, goggles — இவை எப்போதும் பன்மை. இவை பன்மை வினைச்சொல்லை எடுக்கும், இவற்றுக்கு ஒருமை வடிவமே கிடையாது.",
  tl:"Scissors, trousers, spectacles, tongs, pliers, scales, shorts, jeans, pyjamas, binoculars, goggles — ivai eppodhum panmai. Ivai panmai vinaicholai edukkum, ivatrukku orumai vadivame kidaiyaadhu.",
  formula:"TWO-PART OBJECTS  →  ALWAYS PLURAL VERB\n\n  My spectacles ARE broken.\n  These trousers ARE too tight.\n  The scissors ARE on the table.\n\n  TO MAKE IT SINGULAR, use 'A PAIR OF':\n  A pair of scissors IS missing."},

 s2:[
 {h:"Why two-part objects are plural",
  en:"Look at a pair of scissors. It has TWO blades joined at a pivot. Trousers have TWO legs. Spectacles have TWO lenses. English sees the two matching halves and treats the object as inherently plural.",
  ta:"இரு பகுதி பொருட்கள் ஏன் பன்மை? ஒரு கத்தரிக்கோலைப் பாருங்கள். அதற்கு ஒரு அச்சில் இணைந்த இரண்டு கத்திகள் உள்ளன. Trousers-க்கு இரண்டு கால்கள். Spectacles-க்கு இரண்டு கண்ணாடிகள். ஆங்கிலம் அந்த இரண்டு பொருந்தும் பாதிகளைப் பார்த்து அந்தப் பொருளை இயல்பாகவே பன்மையாகக் கருதுகிறது.",
  tl:"Iru paguthi porutkal yen panmai? Oru kaththarikkolaip paarungal. Adharku oru achil inaindha irandu kaththigal ullana. Trousers-kku irandu kaalgal. Spectacles-kku irandu kannaadigal. Aangilam andha irandu porundhum paadhigalaip paarththu andhap porulai iyalbaagave panmaiyaagak karudhugiradhu."},
 {h:"'A pair of' switches the verb to singular",
  en:"When you put 'a pair of' in front, the subject becomes 'pair' — which is singular. 'A pair of scissors IS missing.' 'Two pairs of shoes WERE stolen.' The word 'pair' now controls the verb, not the object.",
  ta:"'A pair of' வினைச்சொல்லை ஒருமைக்கு மாற்றும். நீங்கள் 'a pair of' -ஐ முன்னால் வைக்கும்போது, Subject 'pair' ஆகிவிடும் — அது ஒருமை. 'A pair of scissors IS missing.' 'Two pairs of shoes WERE stolen.' இப்போது 'pair' என்ற சொல்தான் வினைச்சொல்லைக் கட்டுப்படுத்துகிறது, பொருள் அல்ல.",
  tl:"'A pair of' vinaicholai orumaikku maatrum. Neengal 'a pair of'-ai munnaal vaikkumbodhu, Subject 'pair' aagividum — adhu orumai. 'A pair of scissors IS missing.' Ippodhu 'pair' endra sol-dhaan vinaicholaik kattuppaduththugiradhu."},
 {h:"You cannot count them directly",
  en:"You cannot say 'two scissors' or 'three trousers'. You must say 'two pairs of scissors', 'three pairs of trousers'. And you can never write 'a scissor', 'a trouser' or 'a spectacle' with this meaning.",
  ta:"இவற்றை நேரடியாக எண்ண முடியாது. 'Two scissors' அல்லது 'three trousers' என்று சொல்ல முடியாது. 'Two pairs of scissors', 'three pairs of trousers' என்றுதான் சொல்ல வேண்டும். மேலும் இந்தப் பொருளில் 'a scissor', 'a trouser' அல்லது 'a spectacle' என்று ஒருபோதும் எழுத முடியாது.",
  tl:"Ivatrai neradiyaaga enna mudiyaadhu. 'Two scissors' alladhu 'three trousers' endru solla mudiyaadhu. 'Two pairs of scissors', 'three pairs of trousers' endrudhaan solla vendum. Melum indhap porulil 'a scissor', 'a trouser' endru orupodhum ezhudha mudiyaadhu."}],

 s3:[
 {h:"Two halves make it plural",
  d:"   ✂️  SCISSORS  →  two blades   →  ARE\n   👖  TROUSERS  →  two legs     →  ARE\n   👓  SPECTACLES→  two lenses   →  ARE\n   🔧  PLIERS    →  two arms     →  ARE\n\n   Every one of these has TWO matching parts.\n   That is why English calls them plural."},
 {h:"The 'pair of' switch",
  d:"   My scissors        ARE  sharp.      (plural verb)\n           ↑\n     object is subject\n\n   A pair of scissors IS   sharp.      (singular verb)\n     ↑\n   'pair' is now the subject → singular\n\n   Two pairs of scissors ARE sharp.    (pairs = plural)"}],

 s4:{
 wrong:["\"'Scissors' is one object, so singular verb.\" — English counts the two halves, not the one tool.",
  "\"I will write 'a scissor' to make it singular.\" — That word does not exist in this meaning.",
  "\"'A pair of scissors are missing' — scissors is plural.\" — The subject is 'pair', which is singular.",
  "\"'Two trousers' is fine.\" — It must be 'two pairs of trousers'."],
 right:["Ask: does this object have two matching halves? If yes → plural verb.",
  "To make it singular, add 'a pair of' — then the verb follows 'pair'.",
  "Never write 'a scissor', 'a trouser' or 'a spectacle'.",
  "Count with 'pairs': two pairs of shoes, three pairs of trousers."]},

 s5:[
 {en:"My spectacles are broken.",ta:"என்னுடைய கண்ணாடி உடைந்துவிட்டது.",tl:"Ennudaiya kannaadi udaindhuvittadhu.",note:"Two lenses → plural verb ARE."},
 {en:"These trousers are too tight for me.",ta:"இந்தக் கால்சட்டை எனக்கு மிகவும் இறுக்கமாக இருக்கிறது.",tl:"Indhak kaalsattai enakku migavum irukkamaaga irukkiradhu.",note:"Two legs → plural verb ARE."},
 {en:"The scissors are lying on the table.",ta:"கத்தரிக்கோல் மேசையின் மீது கிடக்கிறது.",tl:"Kaththarikkol mesaiyin meedhu kidakkiradhu.",note:"Two blades → plural verb ARE."},
 {en:"A pair of scissors is missing from the drawer.",ta:"இழுப்பறையிலிருந்து ஒரு கத்தரிக்கோல் காணாமல் போயிருக்கிறது.",tl:"Izhupparaiyilirundhu oru kaththarikkol kaanaamal poyirukkiradhu.",note:"Subject is now 'pair' (singular) → IS."},
 {en:"Two pairs of shoes were kept outside.",ta:"இரண்டு ஜோடி காலணிகள் வெளியே வைக்கப்பட்டிருந்தன.",tl:"Irandu jodi kaalanigal veliye vaikkappattirundhana.",note:"'Pairs' is plural → WERE."}],

 s6:["scissors|கத்தரிக்கோல்|Kaththarikkol",
  "trousers|கால்சட்டை|Kaalsattai",
  "spectacles|கண்ணாடி|Kannaadi",

 s7:[

 "Two trousers were bought.|Two pairs of trousers were bought.|Count with 'pairs'.",

 s9:[
 "Fill in the Blank|My new spectacles ____ much lighter than the old ones.|is;are|1|The word is always plural.",
 "Find the Error|A pair of scissors (A) are lying (B) on the table (C) in the classroom (D).|A;B;C;D|1|Part B. The subject is 'pair' → 'is lying'.",
 "Sentence Improvement|He bought two trousers and a shirt from the new showroom.|two trousers;two pairs of trousers;two trouser|1|Count these nouns with 'pairs'.",
 "Fill in the Blank|The tongs used in the kitchen ____ made of stainless steel.|is;are|1|'Tongs' is always plural.",
 "Find the Error|This trouser (A) is too tight (B) for me to wear (C) to the function (D).|A;B;C;D|0|Part A. It must be 'These trousers'."],

 s10:{
  en:"The exam plays both sides. Sometimes it writes 'My spectacle is broken' and expects you to make it plural. Sometimes it writes 'A pair of scissors ARE missing' and expects you to make it singular. Students who memorise only 'scissors is plural' fall into the second trap. The real skill is spotting whether 'a pair of' is present.",
  ta:"தேர்வு இரண்டு பக்கமும் விளையாடுகிறது. சில நேரங்களில் 'My spectacle is broken' என்று எழுதி அதைப் பன்மையாக்க எதிர்பார்க்கும். சில நேரங்களில் 'A pair of scissors ARE missing' என்று எழுதி அதை ஒருமையாக்க எதிர்பார்க்கும். 'scissors பன்மை' என்று மட்டும் மனப்பாடம் செய்தவர்கள் இரண்டாவது பொறியில் விழுவார்கள். உண்மையான திறமை 'a pair of' இருக்கிறதா என்று கண்டறிவதுதான்.",
  tl:"Thervu irandu pakkamum vilaiyaadugiradhu. Sila nerangalil 'My spectacle is broken' endru ezhudhi adhaip panmaiyaakka edhirpaarkkum. Sila nerangalil 'A pair of scissors ARE missing' endru ezhudhi adhai orumaiyaakka edhirpaarkkum. Unmaiyaana thiramai 'a pair of' irukkiradhaa endru kandarivadhudhaan."},

 s11:{
  en:"TWO HALVES = PLURAL VERB. Add 'A PAIR OF' and the verb turns singular.",
  ta:"இரு பாதிகள் = பன்மை வினைச்சொல். 'A PAIR OF' சேர்த்தால் வினைச்சொல் ஒருமையாகும்.",
  tl:"Iru paadhigal = panmai vinaichol. 'A PAIR OF' serthaal vinaichol orumaiyaagum.",
  vis:"     THE TWO-HALVES FAMILY\n\n  ✂️ scissors   👖 trousers   👓 spectacles\n  🔧 pliers     👖 jeans      🕶️ goggles\n  🥢 tongs      ⚖️ scales     🔭 binoculars\n  🩳 shorts     👘 pyjamas    🪛 pincers\n\n     ALL PLURAL. NO SINGULAR FORM.\n\n  MEMORY LINE:\n  \"Two blades, two legs, two lenses — so ARE.\"\n\n  ⚠ THE SWITCH:\n     scissors        ARE  (object = subject)\n     a pair of scissors IS  (pair = subject)"},

 s13:[
 "A pair of scissors and a pair of pliers ____ kept in ____ toolbox near ____ window.|was-the-the;were-the-the;was-a-the|1|Two pairs joined by AND → plural WERE (SVA Rule 32). Specific toolbox and window → THE.",
 "My spectacles, along with my goggles, ____ been misplaced somewhere in ____ hostel room.|has-the;have-the;have-a|1|SVA Rule 31 ignores 'along with'. 'Spectacles' is plural → HAVE BEEN.",
 "Neither the scissors nor the knife ____ sharp enough to cut ____ thick rope.|are;is;were|1|'Neither...nor' takes the nearest → 'knife' (singular) → IS.",
 "Each of the three pairs of trousers ____ been altered by ____ tailor near ____ market.|have-the-the;has-the-the;has-a-the|1|'Each of' is fixed singular (SVA Rule 50) → HAS BEEN.",
 "Two pairs of shoes ____ stolen, but ____ pair of spectacles ____ still in the room.|were-the-was;was-a-were;were-a-was|0|'Pairs' plural → WERE. 'The pair' specific → THE. 'Pair' singular → WAS."],

 s14:{
  rule:"Two-part objects like scissors and trousers are always plural. 'A pair of' makes the verb singular.",
  formula:"two-part object → PLURAL verb\nA PAIR OF + object → SINGULAR verb",
  memory:"Two blades, two legs, two lenses — so ARE. Add 'a pair of' and it becomes IS.",
  ta:"ரெண்டு கத்தி, ரெண்டு கால், ரெண்டு கண்ணாடி — அதனால ARE. 'A pair of' சேர்த்தா IS.",
  tl:"Rendu kaththi, rendu kaal, rendu kannaadi — adhanaala ARE. 'A pair of' serthaa IS.",
  mistake:"Writing 'a scissor' or 'this trouser', and using a plural verb after 'a pair of'.",
  exam:"SSC CGL / CHSL / MTS and RRB — appears in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"Nouns module-ஐ ஆரம்பிக்கலாம். இந்த module முழுக்க ஒரு பெரிய கேள்வியைச் சுத்தி வரும் — 'இந்த வார்த்தை ஒருமையா, பன்மையா?' முதல் rule-லயே ஒரு வித்தியாசமான குடும்பம் பார்க்கப் போறோம்.",
  tl:"Nouns module-ai aarambikkalaam. Indha module muzhukka oru periya kelviyaich suththi varum — 'indha vaarththai orumaiyaa, panmaiyaa?' Mudhal rule-layee oru viththiyaasamaana kudumbam paarkkap porom."},
 {ta:"ஒரு கத்தரிக்கோலை கையில எடுத்துப் பாருங்க. அது ஒரு பொருள்தான் இல்லையா? ஆனா ஆங்கிலம் அதை 'scissors' அப்படின்னு பன்மையா சொல்லுது. ஏன்? ஏன்னா அதுல ரெண்டு கத்தி இருக்கு. ஒரு அச்சுல இணைஞ்ச ரெண்டு பாகம். ஆங்கிலம் அந்த ரெண்டைப் பார்க்குது.",
  tl:"Oru kaththarikkolai kaiyila eduththup paarunga. Adhu oru porul-dhaan illaiyaa? Aanaa Aangilam adhai 'scissors' appadinnu panmaiyaa solludhu. Yennaa adhula rendu kaththi irukku. Oru achula inainja rendu paagam. Aangilam andha rendaip paarkkudhu."},
 {ta:"அதே logic எல்லாத்துக்கும். Trousers — ரெண்டு கால். Spectacles — ரெண்டு கண்ணாடி. Pliers — ரெண்டு கை. Tongs — ரெண்டு பக்கம். Binoculars — ரெண்டு குழாய். எல்லாத்துலயும் ரெண்டு பாகம். அதனால எல்லாமே பன்மை. 'My spectacles ARE broken.'",
  tl:"Adhe logic ellaaththukkum. Trousers — rendu kaal. Spectacles — rendu kannaadi. Pliers — rendu kai. Tongs — rendu pakkam. Ellaaththulayum rendu paagam. Adhanaala ellaame panmai."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு point. நாம தமிழ்ல 'என் கண்ணாடி உடைஞ்சிடுச்சு' அப்படின்னு ஒருமையா சொல்லுவோம். அதனால ஆங்கிலத்துலயும் 'My spectacle is broken' அப்படின்னு எழுதிடுவோம். ரெண்டு தப்பு — 'spectacle' அப்படிங்கிற வார்த்தையே இந்த அர்த்தத்துல கிடையாது, மேலும் verb பன்மையா இருக்கணும்.",
  tl:"Ippo romba mukkiyamaana oru point. Naama Tamil-la 'en kannaadi udainjiduchu' appadinnu orumaiyaa solluvom. Adhanaala Aangilaththulayum 'My spectacle is broken' appadinnu ezhudhiduvom. Rendu thappu."},
 {ta:"இப்போ switch பத்தி சொல்லுறேன். இந்த வார்த்தையை ஒருமையாக்கணும்னா, 'a pair of' சேருங்க. 'A pair of scissors IS missing.' இப்போ verb ஒருமை. ஏன்? ஏன்னா இப்போ Subject 'scissors' இல்ல, Subject 'pair'. ஒரு ஜோடி. ஒண்ணு. IS.",
  tl:"Ippo switch paththi solluren. Indha vaarththaiyai orumaiyaakkanumnaa, 'a pair of' serunga. 'A pair of scissors IS missing.' Ippo verb orumai. Yennaa ippo Subject 'scissors' illa, Subject 'pair'. Oru jodi. Onnu. IS."},
 {ta:"SSC இதை ரெண்டு பக்கமும் கேட்கும். சில நேரம் 'My spectacle is broken' அப்படின்னு தந்து, நீங்க 'spectacles are' அப்படின்னு சரி பண்ணணும். சில நேரம் 'A pair of scissors ARE missing' அப்படின்னு தந்து, நீங்க 'is' அப்படின்னு சரி பண்ணணும். அதனால 'scissors எப்பவும் பன்மை' அப்படின்னு மட்டும் மனப்பாடம் பண்ணாதீங்க. 'a pair of' இருக்கானு பாருங்க — அதுதான் முழு கேள்வியும்.",
  tl:"SSC idhai rendu pakkamum ketkum. Sila neram 'My spectacle is broken' appadinnu thandhu, neenga sari pannanum. Sila neram 'A pair of scissors ARE missing' appadinnu thandhu, neenga 'is' appadinnu sari pannanum. 'a pair of' irukkaanu paarunga — adhudhaan muzhu kelviyum."}]},

/* ========== RULE 12 ========== */
{n:12,rc:"NOU-02",d:"Medium",t:"Plural in FORM but Singular in MEANING",
 tam:"News, Mathematics, Physics — பன்மை போலத் தோன்றும், ஆனால் ஒருமை",
 s1:{en:"News, mathematics, physics, economics, politics, ethics, statistics, athletics, gymnastics, innings, measles, mumps and rickets END IN -S but are SINGULAR. They take a SINGULAR verb.",
  ta:"News, mathematics, physics, economics, politics, ethics, statistics, athletics, gymnastics, innings, measles, mumps — இவை -S-ல் முடிகின்றன ஆனால் ஒருமை. இவை ஒருமை வினைச்சொல்லை எடுக்கும்.",
  tl:"News, mathematics, physics, economics, politics, ethics, statistics, athletics, gymnastics, innings, measles, mumps — ivai -S-l mudigindrana aanaal orumai. Ivai orumai vinaicholai edukkum.",
  formula:"-S ENDING  BUT  SINGULAR VERB\n\n  No news IS good news.\n  Mathematics IS my favourite subject.\n  Politics IS a dirty game.\n  Measles IS a contagious disease.\n  The second innings WAS washed out."},

 s2:[
 {h:"Three families to recognise",
  en:"SUBJECTS: mathematics, physics, economics, politics, ethics, statistics, linguistics, civics. DISEASES: measles, mumps, rickets, shingles, diabetes. GAMES AND EVENTS: athletics, gymnastics, billiards, draughts, innings. Plus the single word NEWS.",
  ta:"அடையாளம் காண வேண்டிய மூன்று குடும்பங்கள். பாடங்கள்: mathematics, physics, economics, politics, ethics, statistics, civics. நோய்கள்: measles, mumps, rickets, shingles, diabetes. விளையாட்டுகள்: athletics, gymnastics, billiards, draughts, innings. மேலும் ஒற்றைச் சொல் NEWS.",
  tl:"Adaiyaalam kaana vendiya moondru kudumbangal. Paadangal: mathematics, physics, economics, politics, ethics, statistics. Noygal: measles, mumps, rickets, diabetes. Vilaiyaattugal: athletics, gymnastics, billiards, innings. Melum otraich sol NEWS."},
 {h:"POLITICS and STATISTICS switch sides",
  en:"As the NAME of a subject they are singular: 'Politics IS a dirty game', 'Statistics IS a branch of mathematics'. But when they mean someone's VIEWS or actual FIGURES they turn plural: 'His politics ARE unclear', 'These statistics ARE misleading'.",
  ta:"POLITICS மற்றும் STATISTICS பக்கம் மாறும். ஒரு பாடத்தின் பெயராக அவை ஒருமை: 'Politics IS a dirty game', 'Statistics IS a branch of mathematics'. ஆனால் அவை ஒருவரின் கருத்துக்களையோ உண்மையான புள்ளிவிவரங்களையோ குறிக்கும்போது பன்மையாகும்: 'His politics ARE unclear', 'These statistics ARE misleading'.",
  tl:"POLITICS matrum STATISTICS pakkam maarum. Oru paadaththin peyaraaga avai orumai. Aanaal avai oruvarin karuththukkalaiyo unmaiyaana pullivivarangalaiyo kurikkumbodhu panmaiyaagum."},
 {h:"NEWS is the most tested word",
  en:"'News' has NO singular form. You cannot write 'a news' or 'newses'. To count it, say 'a piece of news' or 'an item of news'. And the verb is always singular: 'The news IS shocking', never 'are'.",
  ta:"NEWS-தான் மிக அதிகமாகச் சோதிக்கப்படும் சொல். 'News'-க்கு ஒருமை வடிவமே கிடையாது. 'A news' அல்லது 'newses' என்று எழுத முடியாது. அதை எண்ண, 'a piece of news' அல்லது 'an item of news' என்று சொல்லுங்கள். மேலும் வினைச்சொல் எப்போதும் ஒருமை: 'The news IS shocking', ஒருபோதும் 'are' அல்ல.",
  tl:"NEWS-dhaan miga adhigamaagach sodhikkappadum sol. 'News'-kku orumai vadivame kidaiyaadhu. 'A news' alladhu 'newses' endru ezhudha mudiyaadhu. Adhai enna, 'a piece of news' endru sollungal."},
 {h:"Compare with Rule 11 — the exact opposite",
  en:"Rule 11 words look singular but are plural (scissors). Rule 12 words look plural but are singular (news). Together they cover both directions of the same trap. Learn them as a pair.",
  ta:"Rule 11-உடன் ஒப்பிடுங்கள் — நேர் எதிர். Rule 11 சொற்கள் ஒருமை போலத் தெரியும் ஆனால் பன்மை (scissors). Rule 12 சொற்கள் பன்மை போலத் தெரியும் ஆனால் ஒருமை (news). இரண்டும் சேர்ந்து ஒரே பொறியின் இரு திசைகளையும் மறைக்கின்றன. ஜோடியாகக் கற்றுக்கொள்ளுங்கள்.",
  tl:"Rule 11-udan oppidungal — ner edhir. Rule 11 sorkal orumai polath theriyum aanaal panmai (scissors). Rule 12 sorkal panmai polath theriyum aanaal orumai (news). Jodiyaagak katrukkollungal."}],

 s3:[
 {h:"The -s is a costume",
  d:"   NEWS         →  looks plural  👁️\n                →  IS singular   👂\n\n   MATHEMATICS  →  looks plural\n                →  IS singular\n\n   The -s is a COSTUME, not a plural marker.\n   Underneath, each names ONE subject or ONE disease."},
 {h:"The two-way trap",
  d:"  RULE 11: looks SINGULAR, is PLURAL\n     scissors · trousers · spectacles  →  ARE\n\n  RULE 12: looks PLURAL, is SINGULAR\n     news · mathematics · measles      →  IS\n\n  SSC tests BOTH directions in one paper."},
 {h:"Politics wears two hats",
  d:"  SUBJECT NAME (singular)     PERSONAL VIEWS (plural)\n  ────────────────────────    ──────────────────────\n  Politics IS a dirty game.   His politics ARE unclear.\n  Statistics IS a science.    These statistics ARE wrong.\n\n  ASK: am I naming a SUBJECT, or describing REAL things?"}],

 s4:{
 wrong:["\"'News' ends in -s, so plural verb.\" — It is singular and has no plural form.",
  "\"'A news came from Delhi' is fine.\" — It must be 'a piece of news'.",
  "\"'Mathematics are difficult' — the subject covers many topics.\" — It is one subject.",
  "\"'Statistics' is always singular.\" — As real figures it is plural: 'These statistics are wrong.'"],
 right:["Ask: is this the NAME of a subject, disease or event? If yes → singular verb.",
  "For 'news', use 'a piece of news' to count it.",
  "For politics and statistics, ask whether you mean the subject or the actual figures.",
  "Pair this rule with Rule 11 — they are opposite sides of one trap."]},

 "Politics are a dirty game.|Politics is a dirty game.|As a subject name it is singular.",
 "His politics is unclear.|His politics are unclear.|Personal views are plural.",
 "Statistics are a branch of mathematics.|Statistics is a branch of mathematics.|Subject name.",
 "The second innings were rained out.|The second innings was rained out.|'Innings' is singular.",

 s9:[
 "Fill in the Blank|The news of his sudden promotion ____ spread across the whole office.|has;have|0|'News' is singular → HAS.",
 "Find the Error|Mathematics (A) are considered (B) the toughest subject (C) in the syllabus (D).|A;B;C;D|1|Part B. A subject name is singular → 'is considered'.",
 "Sentence Improvement|A news about the strike was published in the morning paper.|A news;A piece of news;The newses|1|'News' has no singular form.",
 "Fill in the Blank|The statistics presented by the committee ____ been questioned by many members.|has;have|1|Here 'statistics' means actual figures → HAVE.",
 "Find the Error|Measles (A) are a highly (B) contagious disease (C) among small children (D).|A;B;C;D|1|Part B. A disease name is singular → 'is a highly contagious disease'."],

 s10:{
  en:"NEWS is the single most tested word in this rule, and the trap is doubled — the verb AND the article. 'A news was published' is wrong twice over. The second big trap is POLITICS and STATISTICS, where the SAME word flips between singular and plural depending on meaning. The exam will put both versions in one question set to check whether you understood or merely memorised.",
  ta:"NEWS-தான் இந்த விதியில் மிக அதிகமாகச் சோதிக்கப்படும் சொல், மேலும் பொறி இரட்டிப்பாகிறது — வினைச்சொல்லும் article-ம். 'A news was published' இரண்டு விதங்களில் தவறு. இரண்டாவது பெரிய பொறி POLITICS மற்றும் STATISTICS — அங்கே ஒரே சொல் பொருளைப் பொறுத்து ஒருமைக்கும் பன்மைக்கும் மாறுகிறது. நீங்கள் புரிந்துகொண்டீர்களா அல்லது வெறுமனே மனப்பாடம் செய்தீர்களா என்று சோதிக்க இரண்டு வடிவங்களையும் ஒரே தொகுப்பில் வைப்பார்கள்.",
  tl:"NEWS-dhaan indha vidhiyil miga adhigamaagach sodhikkappadum sol, melum pori irattippaagiradhu — vinaicholum article-um. 'A news was published' irandu vidhangalil thavaru. Irandaavadhu periya pori POLITICS matrum STATISTICS."},

 s11:{
  en:"THE -S IS A COSTUME. One subject, one disease, one event — one verb.",
  ta:"அந்த -S ஒரு வேடம் மட்டுமே. ஒரு பாடம், ஒரு நோய், ஒரு நிகழ்வு — ஒரு (ஒருமை) வினைச்சொல்.",
  tl:"Andha -S oru vedam mattume. Oru paadam, oru noy, oru nigazhvu — oru (orumai) vinaichol.",
  vis:"    THREE FAMILIES — ALL SINGULAR\n\n  📐 SUBJECTS : mathematics · physics · economics\n                politics · ethics · statistics · civics\n  🤒 DISEASES : measles · mumps · rickets · diabetes\n  🏃 EVENTS   : athletics · gymnastics · billiards · innings\n  📰 PLUS     : NEWS\n\n  MEMORY LINE:\n  \"NO NEWS IS GOOD NEWS.\"\n  (the sentence itself proves the rule)\n\n  ⚠ TWO THAT SWITCH:\n   politics / statistics\n   subject name = IS   |   real figures = ARE"},

 s13:[
 "The news that ____ published yesterday ____ shocked the entire department.|were-have;was-has;was-have|1|'News' is singular → WAS published and HAS shocked.",
 "Mathematics and physics ____ my two favourite subjects, but economics ____ the hardest.|is-is;are-is;are-are|1|Two subjects joined by AND → ARE (SVA Rule 32). 'Economics' alone → IS.",
 "Politics ____ a dirty game, and his politics ____ never been clear to anyone.|is-has;is-have;are-have|1|Subject name → IS. Personal views → HAVE.",
 "____ piece of news about ____ MLA reached us after ____ hour of waiting.|A-an-an;The-a-a;A-a-an|0|'News' needs 'a piece of'. 'MLA' = 'em' → AN. 'Hour' silent H → AN.",
 "Neither measles nor mumps ____ dangerous today, since each of them ____ preventable.|are-are;is-is;is-are|1|'Neither...nor' takes the nearest → 'mumps' (singular) → IS. 'Each of them' → IS."],

 s14:{
  rule:"Words ending in -s that name a subject, disease or event are singular and take a singular verb.",
  formula:"-S ending + subject / disease / event → SINGULAR VERB\nNEWS → always singular, count as 'a piece of news'",
  memory:"No news IS good news. The -s is a costume, not a plural.",
  ta:"'No news IS good news.' அந்த -s ஒரு வேடம், பன்மை இல்ல.",
  tl:"'No news IS good news.' Andha -s oru vedam, panmai illa.",
  mistake:"Writing 'The news are' and 'a news', and forgetting that politics and statistics can turn plural.",
  exam:"SSC CGL / CHSL / MTS, RRB, Bank — 'news' appears almost every year."},

 s15:[
 {ta:"Rule 11-ல நாம பார்த்தோம் — ஒருமை மாதிரி தெரியும், ஆனா பன்மை. இப்போ சரியா அதுக்கு எதிர் — பன்மை மாதிரி தெரியும், ஆனா ஒருமை. ரெண்டையும் சேர்த்து படிச்சா, SSC-ஓட பொறி ரெண்டு பக்கமும் உங்களுக்கு தெரியும்.",
  tl:"Rule 11-la naama paarththom — orumai maadhiri theriyum, aanaa panmai. Ippo sariyaa adhukku edhir — panmai maadhiri theriyum, aanaa orumai. Rendaiyum serthu padichaa, SSC-oda pori rendu pakkamum ungalukku theriyum."},
 {ta:"முக்கியமான வார்த்தை 'news'. இது SSC-ல ஒவ்வொரு வருஷமும் வரும். 'The news IS shocking' — 'are' இல்ல. ஏன்? ஏன்னா 'news' கடைசில 's' இருந்தாலும், அது ஒரு பன்மை விகுதி இல்ல. அது வார்த்தையோட ஒரு பகுதி.",
  tl:"Mukkiyamaana vaarththai 'news'. Idhu SSC-la ovvoru varushamum varum. 'The news IS shocking' — 'are' illa. Yennaa 'news' kadaisila 's' irundhaalum, adhu oru panmai vigudhi illa. Adhu vaarththaiyoda oru paguthi."},
 {ta:"இன்னும் ஒரு விஷயம் — 'news'-க்கு ஒருமை வடிவமே கிடையாது. 'A news' அப்படின்னு எழுத முடியாது. 'Newses' அப்படின்னும் கிடையாது. அப்போ ஒரே ஒரு செய்தியை எப்படி சொல்றது? 'A piece of news' அப்படின்னு சொல்லணும். இது SSC-ல Sentence Improvement-ல அடிக்கடி வரும்.",
  tl:"Innum oru vishayam — 'news'-kku orumai vadivame kidaiyaadhu. 'A news' appadinnu ezhudha mudiyaadhu. 'Newses' appadinnum kidaiyaadhu. Appo ore oru seydhiyai eppadi solradhu? 'A piece of news' appadinnu sollanum."},
 {ta:"இப்போ மூணு குடும்பம் சொல்லுறேன். ஒண்ணு — பாடங்கள்: mathematics, physics, economics, politics, ethics, statistics, civics. ரெண்டு — நோய்கள்: measles, mumps, rickets, diabetes. மூணு — விளையாட்டு: athletics, gymnastics, billiards, innings. இதெல்லாம் -s-ல முடிஞ்சாலும் ஒருமை. ஏன்? ஏன்னா ஒவ்வொண்ணும் ஒரே ஒரு விஷயத்தை குறிக்குது — ஒரு பாடம், ஒரு நோய், ஒரு நிகழ்வு.",
  tl:"Ippo moonu kudumbam solluren. Onnu — paadangal: mathematics, physics, economics, politics, ethics, statistics. Rendu — noygal: measles, mumps, rickets, diabetes. Moonu — vilaiyaattu: athletics, gymnastics, innings. Idhellaam -s-la mudinjaalum orumai."},
 {ta:"இப்போ ரொம்ப சுவாரஸ்யமான பகுதி — Politics மற்றும் Statistics. இந்த ரெண்டு வார்த்தையும் இரட்டை வேடம் போடும். 'Politics IS a dirty game' — இங்க politics அப்படின்னா அரசியல் அப்படிங்கிற துறை. ஒரு விஷயம். ஒருமை. ஆனா 'His politics ARE unclear' — இங்க politics அப்படின்னா அவரோட அரசியல் கருத்துக்கள். பல கருத்து. பன்மை.",
  tl:"Ippo romba suvaarasyamaana paguthi — Politics matrum Statistics. Indha rendu vaarththaiyum irattai vedam podum. 'Politics IS a dirty game' — inga oru vishayam. Orumai. Aanaa 'His politics ARE unclear' — inga pala karuththu. Panmai."},
 {ta:"Statistics-ம் அப்படித்தான். 'Statistics IS a branch of mathematics' — புள்ளியியல் அப்படிங்கிற பாடம். ஒருமை. 'These statistics ARE misleading' — உண்மையான எண்கள். பன்மை. உங்களுக்கு ஒரு எளிய கேள்வி: 'இது ஒரு பாடத்தோட பெயரா, இல்ல உண்மையான எண்களா?' பாடம்னா IS. எண்கள்னா ARE. இந்த ஒரு கேள்வி போதும்.",
  tl:"Statistics-um appadidhaan. 'Statistics IS a branch of mathematics' — paadam. Orumai. 'These statistics ARE misleading' — unmaiyaana engal. Panmai. Ungalukku oru eliya kelvi: 'idhu oru paadaththoda peyaraa, illa unmaiyaana engalaa?'"}]},

/* ========== RULE 13 ========== */
{n:13,rc:"NOU-03",d:"Medium",t:"No Plural after a DEFINITE NUMBER",
 tam:"குறிப்பிட்ட எண்ணுக்குப் பின் Dozen, Hundred, Thousand — பன்மை விகுதி இல்லை",
 s1:{en:"Dozen, score, gross, hundred, thousand, lakh, crore, million, pair and stone do NOT take -s when a DEFINITE NUMBER comes before them. Without a number, and with 'of', the -s returns.",
  ta:"Dozen, score, gross, hundred, thousand, lakh, crore, million, pair, stone — இவற்றுக்கு முன் ஒரு குறிப்பிட்ட எண் வரும்போது -s விகுதி எடுக்காது. எண் இல்லாமல், 'of'-உடன் வரும்போது -s திரும்பி வரும்.",
  tl:"Dozen, score, gross, hundred, thousand, lakh, crore, million, pair, stone — ivatrukku mun oru kurippitta en varumbodhu -s vigudhi edukkaadhu. En illaamal, 'of'-udan varumbodhu -s thirumbi varum.",
  formula:"DEFINITE NUMBER + word  →  NO -s\n  two dozen eggs\n  three hundred students\n  five thousand rupees\n  four pair of shoes\n\nNO NUMBER + word + OF  →  ADD -s\n  dozens of eggs\n  hundreds of people\n  thousands of rupees"},

 s2:[
 {h:"With a number they act as adjectives",
  en:"'Two dozen eggs' — here 'dozen' is measuring the eggs, working like an adjective. Adjectives never take -s in English. Without the number, 'dozens' becomes a real countable noun again and takes -s.",
  ta:"எண்ணுடன் அவை பெயரடைகளாகச் செயல்படுகின்றன. 'Two dozen eggs' — இங்கே 'dozen' முட்டைகளை அளக்கிறது, ஒரு பெயரடை போலச் செயல்படுகிறது. ஆங்கிலத்தில் பெயரடைகள் ஒருபோதும் -s எடுப்பதில்லை. எண் இல்லாமல், 'dozens' மீண்டும் ஒரு உண்மையான எண்ணக்கூடிய பெயர்ச்சொல்லாகி -s எடுக்கிறது.",
  tl:"Ennudan avai peyaradaigalaagach seyalpadugindrana. 'Two dozen eggs' — inge 'dozen' muttaigalai alakkiradhu, oru peyaradai polach seyalpadugiradhu. Aangilaththil peyaradaigal orupodhum -s eduppadhillai."},
 {h:"'Of' is the signal for -s",
  en:"Look for the word 'of'. 'Hundreds OF people', 'thousands OF rupees', 'dozens OF eggs' — the 'of' tells you the word has become a noun and needs -s. No 'of' and a number in front means no -s.",
  ta:"'Of'-தான் -s-க்கான அறிகுறி. 'Of' என்ற சொல்லைத் தேடுங்கள். 'Hundreds OF people', 'thousands OF rupees', 'dozens OF eggs' — அந்த 'of' அந்தச் சொல் ஒரு பெயர்ச்சொல்லாகிவிட்டது, -s தேவை என்று சொல்கிறது. 'Of' இல்லாமல் முன்னால் ஒரு எண் இருந்தால் -s இல்லை.",
  tl:"'Of'-dhaan -s-kkaana arikuri. 'Of' endra sollaith thedungal. 'Hundreds OF people', 'thousands OF rupees' — andha 'of' andhach sol oru peyarcholaagividdadhu, -s thevai endru solgiradhu."},
 {h:"'Several' and 'many' behave like a number",
  en:"'Several dozen eggs', 'many thousand rupees' — words like several, many and a few act as indefinite numbers and still block the -s. But 'several dozens of eggs' with 'of' takes -s again.",
  ta:"'Several' மற்றும் 'many' ஒரு எண் போலவே செயல்படுகின்றன. 'Several dozen eggs', 'many thousand rupees' — several, many, a few போன்ற சொற்கள் வரையறுக்கப்படாத எண்களாகச் செயல்பட்டு இன்னும் -s-ஐத் தடுக்கின்றன. ஆனால் 'of'-உடன் வரும் 'several dozens of eggs' மீண்டும் -s எடுக்கும்.",
  tl:"'Several' matrum 'many' oru en polave seyalpadugindrana. 'Several dozen eggs', 'many thousand rupees' — several, many, a few pondra sorkal varaiyarukkappadaadha engalaagach seyalpattu innum -s-aith thadukkindrana."}],

 s3:[
 {h:"Number in front blocks the -s",
  d:"  two DOZEN eggs        ✔     two DOZENS eggs      ✘\n   ↑\n  a definite number blocks the -s\n\n  DOZENS OF eggs        ✔     DOZEN OF eggs        ✘\n         ↑\n  no number + 'of' → the -s returns"},
 {h:"The complete family",
  d:"   dozen · score · gross\n   hundred · thousand · lakh · crore · million\n   pair · stone · head (of cattle)\n\n   WITH A NUMBER →  no -s\n     three hundred students\n     five thousand rupees\n     two dozen bananas\n\n   WITH 'OF' AND NO NUMBER →  add -s\n     hundreds of students\n     thousands of rupees\n     dozens of bananas"}],

 s4:{
 wrong:["\"Two is more than one, so I must write 'two dozens'.\" — With a number, no -s.",
  "\"'Hundred of people came' is correct.\" — Without a number, it must be 'hundreds of'.",
  "\"'Score' always means twenty, so it never changes.\" — 'Scores of people' is correct without a number.",
  "\"'Several dozens eggs' is fine.\" — Either 'several dozen eggs' or 'several dozens of eggs'."],
 right:["Look in front: is there a definite number? If yes → no -s.",
  "Look behind: is there an 'of'? If yes → add -s.",
  "Never write both a number AND -s: 'two dozens' is always wrong.",
  "Treat several, many and a few like numbers."]},

 s5:[
 {en:"He bought two dozen eggs from the market.",ta:"அவர் சந்தையிலிருந்து இரண்டு டஜன் முட்டைகள் வாங்கினார்.",tl:"Avar sandhaiyilirundhu irandu dozen muttaigal vaanginaar.",note:"A definite number precedes it → no -s."},
 {en:"Dozens of eggs were broken in transit.",ta:"போக்குவரத்தில் டஜன் கணக்கான முட்டைகள் உடைந்தன.",tl:"Pokkuvaraththil dozen kanakkaana muttaigal udaindhana.",note:"No number, and 'of' follows → add -s."},
 {en:"Three hundred students attended the seminar.",ta:"முந்நூறு மாணவர்கள் கருத்தரங்கில் கலந்து கொண்டனர்.",tl:"Munnooru maanavargal karuththarangil kalandhu kondanar.",note:"A definite number → no -s."},
 {en:"Hundreds of people gathered at the rally.",ta:"நூற்றுக்கணக்கான மக்கள் பேரணியில் கூடினர்.",tl:"Nootrukkanakkaana makkal peraniyil koodinar.",note:"No number, and 'of' follows → add -s."},
 {en:"She owns four pairs of shoes.",ta:"அவரிடம் நான்கு ஜோடி காலணிகள் உள்ளன.",tl:"Avaridam naangu jodi kaalanigal ullana.",note:"'Pair' takes -s here because 'of' follows it."}],

 s9:[
 "Fill in the Blank|The trader ordered five ____ bricks for the new construction.|thousand;thousands|0|A definite number precedes it → no -s.",
 "Find the Error|Hundred of villagers (A) gathered outside (B) the collectorate (C) yesterday morning (D).|A;B;C;D|0|Part A. Without a number it must be 'Hundreds of villagers'.",
 "Sentence Improvement|He purchased two dozens bananas from the fruit seller near the temple.|two dozens bananas;two dozen bananas;two dozens of banana|1|A definite number blocks the -s.",
 "Fill in the Blank|____ of rupees were lost in the fire that broke out last night.|Thousand;Thousands|1|'Of' follows and there is no number → add -s.",
 "Find the Error|She bought (A) three pair (B) of shoes (C) from the new showroom (D).|A;B;C;D|1|Part B. Before 'of', it must be 'three pairs'."],

 s10:{
  en:"The trap is that both forms exist and both look correct. 'Two dozen' and 'dozens of' are BOTH right — in different places. The exam gives you 'two dozens eggs' (number AND -s, wrong twice) or 'hundred of people' (no number, no -s, also wrong). Watch out for 'pair': 'four pair of shoes' is wrong because 'of' follows — it must be 'four pairs of shoes'.",
  ta:"பொறி என்னவென்றால் இரண்டு வடிவங்களுமே இருக்கின்றன, இரண்டுமே சரியாகத் தெரிகின்றன. 'Two dozen' மற்றும் 'dozens of' இரண்டுமே சரி — வெவ்வேறு இடங்களில். தேர்வு 'two dozens eggs' (எண்ணும் -s-ம், இரண்டு விதங்களில் தவறு) அல்லது 'hundred of people' (எண்ணும் இல்லை, -s-ம் இல்லை, அதுவும் தவறு) தரும். 'Pair' குறித்து எச்சரிக்கையாக இருங்கள்: 'four pair of shoes' தவறு, ஏனெனில் 'of' பின்வருகிறது.",
  tl:"Pori ennavendraal irandu vadivangalume irukkindrana, irandume sariyaagath therigindrana. 'Two dozen' matrum 'dozens of' irandume sari — vevveru idangalil. 'Pair' kurithu echcharikkaiyaaga irungal."},

 s11:{
  en:"NUMBER IN FRONT → no -s. 'OF' BEHIND with no number → add -s. Never both.",
  ta:"முன்னால் எண் → -s இல்லை. பின்னால் 'of' மற்றும் எண் இல்லை → -s சேர்க்கவும். இரண்டும் ஒருபோதும் சேராது.",
  tl:"Munnaal en → -s illai. Pinnaal 'of' matrum en illai → -s serkkavum. Irandum orupodhum seraadhu.",
  vis:"       THE TWO-WAY CHECK\n\n   STEP 1: Look IN FRONT\n     Is there a number (two, three, several, many)?\n     YES → NO -s        two dozen eggs\n\n   STEP 2: Look BEHIND\n     Is there an 'of' with NO number in front?\n     YES → ADD -s       dozens of eggs\n\n   ⚠ NEVER BOTH:\n     two dozens eggs    ✘\n     dozen of eggs      ✘\n\n   ⚠ 'PAIR' EXCEPTION:\n     four pairs OF shoes ✔  (of → -s)\n     four pair shoes     ✘"},

 s14:{
  rule:"Dozen, hundred, thousand and pair take no -s after a definite number, but take -s before 'of' with no number.",
  formula:"NUMBER + dozen/hundred/thousand → NO -s\n(no number) + dozens/hundreds/thousands + OF → ADD -s",
  memory:"Number in front blocks the -s. 'Of' behind brings it back.",
  ta:"முன்னாடி எண் இருந்தா -s இல்ல. பின்னாடி 'of' இருந்தா -s வரும்.",
  tl:"Munnaadi en irundhaa -s illa. Pinnaadi 'of' irundhaa -s varum.",
  mistake:"Writing 'two dozens eggs' or 'hundred of people', and 'three pair of shoes' instead of 'pairs'.",
  exam:"SSC CGL / CHSL and RRB — steady Error Spotting and Sentence Improvement question."},

 s15:[
 {ta:"இந்த rule-ல ஒரு சின்ன தர்க்கம் இருக்கு, அதை புரிஞ்சுக்கிட்டா வாழ்நாள் முழுக்க மறக்காது. கேள்வி இதுதான்: 'two dozen' ஆ, 'two dozens' ஆ?",
  tl:"Indha rule-la oru chinna tharkkam irukku, adhai purinjukkittaa vaazhnaal muzhukka marakkaadhu. Kelvi idhudhaan: 'two dozen' aa, 'two dozens' aa?"},
 {ta:"பதில் — 'two dozen'. -s இல்ல. ஏன்? ஏன்னா இங்க 'dozen' ஒரு பெயர்ச்சொல்லா வேலை செய்யல, ஒரு பெயரடையா (adjective) வேலை செய்யுது. அது முட்டையை அளக்குது. ஆங்கிலத்துல adjective-க்கு எப்பவும் -s கிடையாது. 'Two red apples' அப்படின்னு சொல்லுவோம், 'two reds apples' இல்ல இல்லையா? அதே logic.",
  tl:"Padhil — 'two dozen'. -s illa. Yennaa inga 'dozen' oru peyarcholaa velai seyyala, oru peyaradaiyaa (adjective) velai seyyudhu. Aangilaththula adjective-kku eppavum -s kidaiyaadhu. 'Two red apples' appadinnu solluvom, 'two reds apples' illa illaiyaa?"},
 {ta:"இப்போ மறுபக்கம். 'Hundreds of people gathered.' இங்க -s இருக்கு. ஏன்? ஏன்னா இங்க முன்னாடி எண் இல்ல. 'Hundreds' இப்போ ஒரு உண்மையான பெயர்ச்சொல் — 'நூற்றுக்கணக்கானவை'. பெயர்ச்சொல்லுக்கு பன்மை விகுதி வரும். அதனால -s.",
  tl:"Ippo marupakkam. 'Hundreds of people gathered.' Inga -s irukku. Yennaa inga munnaadi en illa. 'Hundreds' ippo oru unmaiyaana peyarchol. Peyarcholukku panmai vigudhi varum. Adhanaala -s."},
 {ta:"அப்போ ஒரு எளிய சோதனை. ரெண்டு பக்கமும் பாருங்க. முன்னாடி எண் இருக்கா? — two, three, five, several, many? இருந்தா -s இல்ல. பின்னாடி 'of' இருக்கா, முன்னாடி எண் இல்லாம? இருந்தா -s சேருங்க. ரெண்டும் ஒரே நேரத்துல வராது.",
  tl:"Appo oru eliya sodhanai. Rendu pakkamum paarunga. Munnaadi en irukkaa — two, three, five, several, many? Irundhaa -s illa. Pinnaadi 'of' irukkaa, munnaadi en illaama? Irundhaa -s serunga. Rendum ore neraththula varaadhu."},
 {ta:"இப்போ ஒரு விதிவிலக்கு கவனிங்க — 'pair'. 'Three pairs OF shoes' — இங்க எண் இருக்கு, ஆனா -s-ம் இருக்கு! ஏன்? ஏன்னா 'of' வந்துடுச்சு. 'Of' வந்தா 'pair' ஒரு உண்மையான பெயர்ச்சொல் ஆயிடும். அதனால -s. இது SSC-ல அடிக்கடி வரும் பொறி.",
  tl:"Ippo oru vidhivilakku kavaninga — 'pair'. 'Three pairs OF shoes' — inga en irukku, aanaa -s-um irukku! Yennaa 'of' vandhuduchu. 'Of' vandhaa 'pair' oru unmaiyaana peyarchol aayidum. Adhanaala -s."},
 {ta:"கடைசியா — 'several', 'many', 'a few' இதெல்லாம் எண் மாதிரியே வேலை செய்யும். 'Several hundred people were hurt' — 'several' ஒரு எண் மாதிரி, அதனால 'hundred'-க்கு -s இல்ல. இதை நினைவுல வெச்சுக்கோங்க: எண்ணா இருந்தாலும் சரி, எண் மாதிரி இருந்தாலும் சரி — -s-ஐ தடுக்கும்.",
  tl:"Kadaisiyaa — 'several', 'many', 'a few' idhellaam en maadhiriye velai seyyum. 'Several hundred people were hurt' — 'several' oru en maadhiri, adhanaala 'hundred'-kku -s illa."}]},

/* ========== RULE 14 ========== */
{n:14,rc:"NOU-04",d:"Hard",t:"Collective Nouns: Unit versus Individuals",
 tam:"கூட்டுப்பெயர் — ஒரே அலகாக ஒருமை, தனித்தனியாக பன்மை",
 s1:{en:"A collective noun (committee, jury, team, family, government, audience, staff, crowd, class) takes a SINGULAR verb when the group acts as ONE UNIT, and a PLURAL verb when its MEMBERS act individually.",
  ta:"ஒரு கூட்டுப்பெயர் (committee, jury, team, family, government, audience, staff, crowd, class) அந்தக் குழு ஒரே அலகாகச் செயல்படும்போது ஒருமை வினைச்சொல்லையும், அதன் உறுப்பினர்கள் தனித்தனியாகச் செயல்படும்போது பன்மை வினைச்சொல்லையும் எடுக்கும்.",
  tl:"Oru koottuppeyar (committee, jury, team, family, government, audience, staff, crowd, class) andhak kuzhu ore alagaagach seyalpadumbodhu orumai vinaicholaiyum, adhan uruppinargal thanithaniyaagach seyalpadumbodhu panmai vinaicholaiyum edukkum.",
  formula:"ACTING AS ONE UNIT  →  SINGULAR VERB\n  The committee HAS taken a decision.\n  The jury WAS unanimous.\n  The team HAS won the match.\n\nMEMBERS ACTING SEPARATELY  →  PLURAL VERB\n  The committee ARE divided in their opinions.\n  The jury WERE unable to agree.\n  The team ARE arguing among themselves."},

 s2:[
 {h:"The verb follows the MEANING, not the form",
  en:"'Committee' looks singular in every sentence. What changes is the picture in your mind. If you see one body making one decision → singular. If you see individual members disagreeing → plural. The word never changes; the meaning does.",
  ta:"வினைச்சொல் வடிவத்தை அல்ல, பொருளைப் பின்பற்றுகிறது. 'Committee' ஒவ்வொரு வாக்கியத்திலும் ஒருமை போலவே தெரியும். மாறுவது உங்கள் மனதில் உள்ள படம். ஒரே அமைப்பு ஒரே முடிவை எடுப்பதைப் பார்த்தால் → ஒருமை. உறுப்பினர்கள் தனித்தனியாக முரண்படுவதைப் பார்த்தால் → பன்மை. சொல் ஒருபோதும் மாறாது; பொருள் மாறுகிறது.",
  tl:"Vinaichol vadivaththai alla, porulaip pinpatrugiradhu. 'Committee' ovvoru vaakkiyaththilum orumai polave theriyum. Maaruvadhu ungal manadhil ulla padam. Sol orupodhum maaraadhu; porul maarugiradhu."},
 {h:"Signal words that force a PLURAL verb",
  en:"divided, disagree, quarrel, argue, differ, dispute, are of different opinions, among themselves, each other. If you see any of these, the members are acting individually → plural verb.",
  ta:"பன்மை வினைச்சொல்லைக் கட்டாயமாக்கும் அறிகுறிச் சொற்கள்: divided, disagree, quarrel, argue, differ, dispute, are of different opinions, among themselves, each other. இவற்றில் ஏதேனும் தென்பட்டால், உறுப்பினர்கள் தனித்தனியாகச் செயல்படுகிறார்கள் → பன்மை வினைச்சொல்.",
  tl:"Panmai vinaicholaik kattaayamaakkum arikurich sorkal: divided, disagree, quarrel, argue, differ, dispute, among themselves, each other. Ivatril edhenum thenpattaal, uruppinargal thanithaniyaagach seyalpadugiraargal → panmai vinaichol."},
 {h:"Signal words that force a SINGULAR verb",
  en:"unanimous, as a whole, one voice, decided, resolved, met, was formed, consists of. These describe the body acting together → singular verb.",
  ta:"ஒருமை வினைச்சொல்லைக் கட்டாயமாக்கும் அறிகுறிச் சொற்கள்: unanimous, as a whole, one voice, decided, resolved, met, was formed, consists of. இவை அந்த அமைப்பு ஒன்றாகச் செயல்படுவதை விவரிக்கின்றன → ஒருமை வினைச்சொல்.",
  tl:"Orumai vinaicholaik kattaayamaakkum arikurich sorkal: unanimous, as a whole, one voice, decided, resolved, met, consists of. Ivai andha amaippu ondraagach seyalpaduvadhai vivarikkindrana → orumai vinaichol."},
 {h:"The pronoun must match the verb",
  en:"'The committee HAS given ITS decision' (singular verb, singular pronoun). 'The committee ARE divided in THEIR opinions' (plural verb, plural pronoun). Never mix them: 'The committee has given their decision' is wrong.",
  ta:"பிரதிபெயர் வினைச்சொல்லுடன் பொருந்த வேண்டும். 'The committee HAS given ITS decision' (ஒருமை வினைச்சொல், ஒருமைப் பிரதிபெயர்). 'The committee ARE divided in THEIR opinions' (பன்மை வினைச்சொல், பன்மைப் பிரதிபெயர்). ஒருபோதும் கலக்காதீர்கள்: 'The committee has given their decision' தவறு.",
  tl:"Pirathibeyar vinaicholudan porundha vendum. 'The committee HAS given ITS decision'. 'The committee ARE divided in THEIR opinions'. Orupodhum kalakkaadheergal."}],

 s3:[
 {h:"One body or many heads?",
  d:"   UNITED  →  🏛️  one body, one decision\n              The committee HAS decided.\n              The jury WAS unanimous.\n\n   DIVIDED →  🧑🧑🧑  separate people arguing\n              The committee ARE divided.\n              The jury WERE unable to agree."},
 {h:"Read the signal word",
  d:"  PLURAL SIGNALS          SINGULAR SIGNALS\n  ──────────────          ────────────────\n  divided                 unanimous\n  disagree                as a whole\n  quarrel / argue         decided / resolved\n  differ / dispute        met / was formed\n  among themselves        consists of\n  each other              one voice\n\n  Find the signal word BEFORE choosing the verb."},
 {h:"Verb and pronoun must agree",
  d:"  The committee HAS given ITS  decision.   ✔\n  The committee ARE divided in THEIR opinions. ✔\n\n  The committee HAS given THEIR decision.  ✘\n  The committee ARE divided in ITS opinions. ✘\n\n  Both must be singular, or both plural."}],

 s4:{
 wrong:["\"'Committee' is one word, so always singular.\" — Not when the members act individually.",
  "\"'Team' is plural because a team has many players.\" — Not when the team acts as one unit.",
  "\"I can choose either verb, both are acceptable.\" — The signal word in the sentence decides.",
  "\"'The jury has given their verdict' is fine.\" — Verb and pronoun must match."],
 right:["Read the whole sentence and find the signal word.",
  "Divided, disagree, quarrel, among themselves → plural verb.",
  "Unanimous, decided, as a whole → singular verb.",
  "Match the pronoun to the verb: HAS...ITS, or ARE...THEIR."]},

 s5:[
 {en:"The committee has taken a unanimous decision.",ta:"குழு ஒருமனதான முடிவை எடுத்துள்ளது.",tl:"Kuzhu orumanadhaana mudivai eduththulladhu.",note:"'Unanimous' shows one body → HAS."},
 {en:"The committee are divided in their opinions.",ta:"குழு உறுப்பினர்கள் தங்கள் கருத்துக்களில் பிளவுபட்டுள்ளனர்.",tl:"Kuzhu uruppinargal thangal karuththukkalil pilavupattullanar.",note:"'Divided' shows individual members → ARE."},
 {en:"The jury was unanimous in its verdict.",ta:"நடுவர் குழு தன் தீர்ப்பில் ஒருமனதாக இருந்தது.",tl:"Naduvar kuzhu than theerppil orumanadhaaga irundhadhu.",note:"Singular verb WAS with singular pronoun ITS."},
 {en:"The jury were unable to agree among themselves.",ta:"நடுவர் குழு உறுப்பினர்கள் தங்களுக்குள் உடன்பட முடியவில்லை.",tl:"Naduvar kuzhu uruppinargal thangalukkul udanpada mudiyavillai.",note:"'Among themselves' shows individuals → WERE."},
 {en:"The team has won the championship.",ta:"அந்த அணி சாம்பியன்ஷிப்பை வென்றுள்ளது.",tl:"Andha ani championship-ai vendrulladhu.",note:"The team acted as one unit → HAS."}],

 s9:[
 "Fill in the Blank|The jury ____ divided in their opinion about the guilt of the accused.|was;were|1|'Divided' and 'their' show individual members → WERE.",
 "Find the Error|The committee (A) have decided (B) unanimously to (C) reject the proposal (D).|A;B;C;D|1|Part B. 'Unanimously' shows one body → 'has decided'.",
 "Sentence Improvement|The team have won the championship for the third year running.|have won;has won;had won|1|The team acted as one unit → HAS.",
 "Fill in the Blank|The audience ____ on their feet, cheering and whistling loudly.|was;were|1|Individual people acting separately → WERE.",
 "Find the Error|The committee (A) has submitted (B) their final report (C) to the ministry (D).|A;B;C;D|2|Part C. A singular verb needs a singular pronoun → 'its final report'."],

 s10:{
  en:"There is no fixed answer for a collective noun — the SENTENCE decides. That is what makes this hard. The exam always plants a signal word: 'unanimously' (singular) or 'divided in their opinions' (plural). The deeper trap is the PRONOUN: 'The committee has submitted THEIR report' is wrong because the verb is singular but the pronoun is plural. Check both.",
  ta:"ஒரு கூட்டுப்பெயருக்கு நிலையான விடை கிடையாது — வாக்கியம்தான் தீர்மானிக்கிறது. அதுதான் இதைக் கடினமாக்குகிறது. தேர்வு எப்போதும் ஒரு அறிகுறிச் சொல்லை நடும்: 'unanimously' (ஒருமை) அல்லது 'divided in their opinions' (பன்மை). ஆழமான பொறி பிரதிபெயர்: 'The committee has submitted THEIR report' தவறு, ஏனெனில் வினைச்சொல் ஒருமை ஆனால் பிரதிபெயர் பன்மை. இரண்டையும் சரிபாருங்கள்.",
  tl:"Oru koottuppeyarukku nilaiyaana vidai kidaiyaadhu — vaakkiyam-dhaan theermaanikkiradhu. Thervu eppodhum oru arikurich sollai nadum. Aazhamaana pori pirathibeyar. Irandaiyum saripaarungal."},

 s11:{
  en:"UNITED = SINGULAR. DIVIDED = PLURAL. Find the signal word first.",
  ta:"ஒன்றுபட்டால் = ஒருமை. பிளவுபட்டால் = பன்மை. முதலில் அறிகுறிச் சொல்லைக் கண்டறியுங்கள்.",
  tl:"Ondrupattaal = orumai. Pilavupattaal = panmai. Mudhalil arikurich sollaik kandariyungal.",
  vis:"      THE PICTURE TEST\n\n  Close your eyes and picture the group.\n\n  Do you see ONE BODY doing ONE thing?\n     🏛️  →  SINGULAR  (has, was, its)\n\n  Do you see SEPARATE PEOPLE arguing?\n     🧑🧑🧑  →  PLURAL  (have, were, their)\n\n  SIGNAL WORDS TO HUNT FOR:\n  divided · disagree · quarrel · among themselves\n     → these ALWAYS mean plural\n\n  unanimous · as a whole · decided · resolved\n     → these ALWAYS mean singular\n\n  ⚠ MATCH THE PRONOUN:\n    HAS ... ITS    |    ARE ... THEIR"},

 s13:[
 "The committee, along with its advisers, ____ decided unanimously to reject ____ proposal.|have-the;has-the;has-a|1|SVA Rule 31 ignores 'along with'. 'Unanimously' → HAS. A specific proposal → THE.",
 "The jury ____ divided in ____ opinions, and neither of the two verdicts ____ acceptable.|were-their-was;was-its-were;were-their-were|0|'Divided' → WERE + THEIR. 'Neither of' is fixed singular → WAS.",
 "The team ____ won ____ trophy, but the players ____ quarrelling among themselves.|has-the-are;have-a-is;has-the-is|0|One unit → HAS. Specific trophy → THE. 'Players' plural → ARE.",
 "The audience ____ on ____ feet cheering, though the committee ____ still in session.|were-their-was;was-its-were;were-their-were|0|Individuals → WERE + THEIR. One body in session → WAS.",
 "The government ____ announced that ____ number of new schemes ____ been approved.|has-the-has;have-a-have;has-a-have|0|One body → HAS. 'The number of' → HAS (SVA Rule 38)."],

 s14:{
  rule:"A collective noun takes a singular verb when the group acts as one unit and a plural verb when members act individually.",
  formula:"ONE UNIT → singular verb + ITS\nINDIVIDUALS → plural verb + THEIR",
  memory:"United = singular. Divided = plural. Hunt for the signal word.",
  ta:"ஒன்றுபட்டா ஒருமை. பிளவுபட்டா பன்மை. அறிகுறிச் சொல்லை தேடுங்க.",
  tl:"Ondrupattaa orumai. Pilavupattaa panmai. Arikurich sollai thedunga.",
  mistake:"Choosing the verb without reading the signal word, and mismatching the pronoun (has...their).",
  exam:"SSC CGL Tier-1 and Bank PO — closely linked to SVA Rule 14."},

 s15:[
 {ta:"இந்த rule கொஞ்சம் வித்தியாசமானது. இதுவரைக்கும் நாம பார்த்த rule-ல எல்லாம் ஒரு நிலையான பதில் இருந்தது — 'news எப்பவும் ஒருமை', 'scissors எப்பவும் பன்மை'. ஆனா இங்க நிலையான பதிலே கிடையாது. வாக்கியத்தைப் பொறுத்து பதில் மாறும்.",
  tl:"Indha rule konjam viththiyaasamaanadhu. Idhuvaraikkum naama paarththa rule-la ellaam oru nilaiyaana padhil irundhadhu. Aanaa inga nilaiyaana padhile kidaiyaadhu. Vaakkiyaththaip poruththu padhil maarum."},
 {ta:"ஒரு படம் மனசுல வெச்சுக்கோங்க. 'The committee' அப்படின்னு சொன்னா, உங்க மனசுல என்ன தெரியுது? ரெண்டு விதமா பார்க்கலாம். ஒண்ணு — ஒரு அமைப்பு, ஒரு நிறுவனம், ஒரே குரல். ரெண்டு — உள்ள உட்கார்ந்து இருக்கிற பத்து பேரு, ஒவ்வொருத்தரும் வேற வேற கருத்து சொல்றாங்க.",
  tl:"Oru padam manasula vechukkonga. 'The committee' appadinnu sonnaa, unga manasula enna theriyudhu? Rendu vidhamaa paarkkalaam. Onnu — oru amaippu, ore kural. Rendu — ulla utkaarndhu irukkira paththu peru, ovvoruththarum veru veru karuththu solraanga."},
 {ta:"முதல் படம் தெரிஞ்சா — ஒருமை. 'The committee HAS taken a decision.' ஒரு அமைப்பு, ஒரு முடிவு. ரெண்டாவது படம் தெரிஞ்சா — பன்மை. 'The committee ARE divided in their opinions.' பத்து பேரு, பத்து கருத்து.",
  tl:"Mudhal padam therinjaa — orumai. 'The committee HAS taken a decision.' Oru amaippu, oru mudivu. Randaavadhu padam therinjaa — panmai. 'The committee ARE divided in their opinions.' Paththu peru, paththu karuththu."},
 {ta:"அப்போ எப்படி தெரிஞ்சுக்கிறது? SSC உங்களுக்கு எப்பவும் ஒரு clue தரும் — நான் அதை 'அறிகுறிச் சொல்' அப்படின்னு சொல்லுவேன். சில வார்த்தை பார்த்தா உடனே பன்மைன்னு தெரிஞ்சுக்கலாம்: divided, disagree, quarrel, argue, differ, among themselves, each other. இந்த வார்த்தை இருந்தா, உறுப்பினர்கள் தனித்தனியா செயல்படுறாங்க. பன்மை.",
  tl:"Appo eppadi therinjukkiradhu? SSC ungalukku eppavum oru clue tharum — naan adhai 'arikurich sol' appadinnu solluven. Sila vaarththai paarththaa udane panmainnu therinjukkalaam: divided, disagree, quarrel, argue, among themselves, each other."},
 {ta:"மறுபக்கம், சில வார்த்தை ஒருமையை காட்டும்: unanimous, unanimously, as a whole, decided, resolved, met, consists of. இந்த வார்த்தை இருந்தா, குழு ஒரே அலகா செயல்படுது. ஒருமை. அதனால கேள்வி படிக்கும்போது முதல்ல இந்த அறிகுறிச் சொல்லை தேடுங்க. அது கிடைச்சா பதில் தானா வரும்.",
  tl:"Marupakkam, sila vaarththai orumaiyai kaattum: unanimous, as a whole, decided, resolved, met, consists of. Indha vaarththai irundhaa, kuzhu ore alagaa seyalpadudhu. Orumai."},
 {ta:"கடைசியா ஒரு ஆழமான பொறி சொல்லுறேன், இது ரொம்ப பேரு தவறவிடுவாங்க. Verb மட்டும் இல்ல, pronoun-ம் பொருந்தணும். 'The committee HAS submitted ITS report' — ரெண்டும் ஒருமை. சரி. 'The committee ARE divided in THEIR views' — ரெண்டும் பன்மை. சரி. ஆனா 'The committee HAS submitted THEIR report' — verb ஒருமை, pronoun பன்மை. தப்பு! SSC இந்த மாதிரி கேள்விய Error Spotting-ல வெப்பாங்க, error verb-ல இல்ல, pronoun-ல இருக்கும். கவனமா படிங்க.",
  tl:"Kadaisiyaa oru aazhamaana pori solluren, idhu romba peru thavaraviduvaanga. Verb mattum illa, pronoun-um porundhanum. 'The committee HAS submitted ITS report' — sari. 'The committee ARE divided in THEIR views' — sari. Aanaa 'The committee HAS submitted THEIR report' — thappu! SSC indha maadhiri kelviya Error Spotting-la veppaanga."}]},

/* ========== RULE 15 ========== */
{n:15,rc:"NOU-05",d:"Medium",t:"Uncountable Nouns take NO Plural and NO A/AN",
 tam:"Information, Furniture, Advice — பன்மை விகுதியோ a/an-ஓ வராது",
 s1:{en:"Information, furniture, luggage, baggage, advice, equipment, machinery, stationery, poetry, scenery, work, bread, money, news, evidence, knowledge, progress and traffic are UNCOUNTABLE. They take NO -s and NO a/an. To count them, use a unit phrase.",
  ta:"Information, furniture, luggage, baggage, advice, equipment, machinery, stationery, poetry, scenery, work, bread, money, news, evidence, knowledge, progress, traffic — இவை எண்ண முடியாதவை. இவை -s விகுதியோ a/an-ஓ எடுக்காது. இவற்றை எண்ண, ஒரு அலகுத் தொடரைப் பயன்படுத்தவும்.",
  tl:"Information, furniture, luggage, baggage, advice, equipment, machinery, stationery, poetry, scenery, work, bread, money, evidence, knowledge, progress, traffic — ivai enna mudiyaadhavai. Ivai -s vigudhiyo a/an-o edukkaadhu.",
  formula:"UNCOUNTABLE  →  NO -s,  NO a/an,  SINGULAR VERB\n\n  He gave me useful information.   ✔\n  He gave me useful informations.  ✘\n  He gave me an information.       ✘\n\nTO COUNT, USE A UNIT PHRASE:\n  a piece of advice · an item of furniture\n  a bit of information · a loaf of bread\n  a piece of luggage · a piece of evidence"},

 s2:[
 {h:"They name a mass, not separate items",
  en:"'Furniture' is not one chair — it is the whole category of chairs, tables and beds together. 'Luggage' is not one bag — it is everything you are carrying. Because they name a mass, you cannot put a number on them directly.",
  ta:"அவை தனித்தனிப் பொருட்களை அல்ல, ஒரு திரளைக் குறிக்கின்றன. 'Furniture' என்பது ஒரு நாற்காலி அல்ல — அது நாற்காலி, மேசை, கட்டில் அனைத்தையும் சேர்ந்த முழு வகை. 'Luggage' என்பது ஒரு பை அல்ல — நீங்கள் எடுத்துச் செல்லும் அனைத்தும். அவை ஒரு திரளைக் குறிப்பதால், அவற்றின் மீது நேரடியாக ஒரு எண்ணை வைக்க முடியாது.",
  tl:"Avai thanithanip porutkalai alla, oru thiralaik kurikkindrana. 'Furniture' enbadhu oru naarkaali alla — adhu naarkaali, mesai, kattil anaiththaiyum serndha muzhu vagai. Avai oru thiralaik kurippadhaal, avatrin meedhu neradiyaaga oru ennai vaikka mudiyaadhu."},
 {h:"The unit phrases you must know",
  en:"a piece of advice, a piece of information, a piece of evidence, a piece of furniture, a piece of luggage, an item of furniture, a bit of information, a loaf of bread, a slice of bread, a bottle of water, a glass of milk, a grain of rice.",
  ta:"தெரிந்திருக்க வேண்டிய அலகுத் தொடர்கள்: a piece of advice, a piece of information, a piece of evidence, a piece of furniture, a piece of luggage, an item of furniture, a bit of information, a loaf of bread, a slice of bread, a bottle of water, a glass of milk, a grain of rice.",
  tl:"Therindhirukka vendiya alaguth thodargal: a piece of advice, a piece of information, a piece of evidence, a piece of furniture, an item of furniture, a loaf of bread, a slice of bread, a bottle of water, a glass of milk."},
 {h:"Use MUCH and LITTLE, not MANY and FEW",
  en:"Uncountable nouns take much, little, a little and a great deal of. Countable nouns take many, few, a few and a large number of. 'Much information' is right; 'many informations' is wrong twice over.",
  ta:"MUCH மற்றும் LITTLE பயன்படுத்தவும், MANY மற்றும் FEW அல்ல. எண்ண முடியாத பெயர்ச்சொற்கள் much, little, a little, a great deal of எடுக்கும். எண்ணக்கூடிய பெயர்ச்சொற்கள் many, few, a few, a large number of எடுக்கும். 'Much information' சரி; 'many informations' இரண்டு விதங்களில் தவறு.",
  tl:"MUCH matrum LITTLE payanpaduththavum, MANY matrum FEW alla. Enna mudiyaadha peyarchorkal much, little, a little, a great deal of edukkum. Ennakkoodiya peyarchorkal many, few, a few edukkum."},
 {h:"They always take a SINGULAR verb",
  en:"'The furniture IS new', 'The luggage HAS arrived', 'This information IS useful'. Because there is no plural form, there can be no plural verb. This links directly to SVA Rules 37 and 48.",
  ta:"அவை எப்போதும் ஒருமை வினைச்சொல்லை எடுக்கும். 'The furniture IS new', 'The luggage HAS arrived', 'This information IS useful'. பன்மை வடிவமே இல்லாததால், பன்மை வினைச்சொல்லும் இருக்க முடியாது. இது SVA Rules 37 மற்றும் 48-உடன் நேரடியாகத் தொடர்புடையது.",
  tl:"Avai eppodhum orumai vinaicholai edukkum. 'The furniture IS new', 'The luggage HAS arrived'. Panmai vadivame illaadhadhaal, panmai vinaicholum irukka mudiyaadhu."}],

 s3:[
 {h:"A mass, not items",
  d:"   🪑🛏️🪑  ALL OF THIS  =  FURNITURE  (one mass)\n\n   You cannot say:  two furnitures   ✘\n   You must say  :  two pieces of furniture  ✔\n                    two items of furniture   ✔\n\n   Same for: luggage · advice · information · equipment"},
 {h:"The much/many divide",
  d:"  UNCOUNTABLE            COUNTABLE\n  ───────────            ─────────\n  much information       many books\n  little advice          few students\n  a great deal of work   a large number of files\n  a piece of furniture   two chairs\n\n  ⚠ 'many informations' is wrong TWICE:\n     wrong quantifier + wrong plural"},
 {h:"The high-frequency SSC list",
  d:"  📄 information · evidence · knowledge · advice\n  🪑 furniture · equipment · machinery · stationery\n  🧳 luggage · baggage\n  📰 news · progress · traffic · weather\n  🍞 bread · money · work · poetry · scenery\n\n  NONE of these ever takes -s or a/an."}],

 s4:{
 wrong:["\"'Informations' shows there is more than one piece.\" — The word has no plural form.",
  "\"'He gave me an advice' is polite English.\" — It must be 'a piece of advice'.",
  "\"'Many equipments were bought' is fine.\" — Both the quantifier and the plural are wrong.",
  "\"'Furnitures' is used in shops, so it must be correct.\" — Indian shop signs are not exam English."],
 right:["Memorise the uncountable list — it is short and highly repeated.",
  "To count, insert a unit phrase: a piece of, an item of, a bit of.",
  "Use much and little, never many and few.",
  "Always use a singular verb."]},

 s5:[
 {en:"He gave me some useful information.",ta:"அவர் எனக்கு சில பயனுள்ள தகவல்களைத் தந்தார்.",tl:"Avar enakku sila payanulla thagavalgalaith thandhaar.",note:"'Information' takes no -s → no 'informations'."},
 {en:"We bought new furniture for the office.",ta:"நாங்கள் அலுவலகத்திற்குப் புதிய தளவாடங்களை வாங்கினோம்.",tl:"Naangal aluvalagaththirkup pudhiya thalavaadangalai vaanginom.",note:"'Furniture' is uncountable → no -s."},
 {en:"She gave me a piece of advice.",ta:"அவர் எனக்கு ஒரு அறிவுரை வழங்கினார்.",tl:"Avar enakku oru arivurai vazhanginaar.",note:"Use 'a piece of' to count advice."},
 {en:"He carried too much luggage to the station.",ta:"அவர் நிலையத்திற்கு மிக அதிக சாமான்களை எடுத்துச் சென்றார்.",tl:"Avar nilaiyaththirku miga adhiga saamaangalai eduththuch sendraar.",note:"'Much', not 'many', with an uncountable noun."},

 s8:[
 "He gave me useful informations.|He gave me useful information.|'Information' has no plural form.",
 "We bought new furnitures.|We bought new furniture.|'Furniture' has no plural form.",
 "She gave me an advice.|She gave me a piece of advice.|'Advice' is uncountable and needs a unit phrase.",
 "He carried too many luggages.|He carried too much luggage.|Wrong quantifier and wrong plural.",
 "Many equipments were purchased.|Much equipment was purchased.|Uncountable takes 'much' and a singular verb.",
 "The furnitures in this room are old.|The furniture in this room is old.|No plural form and a singular verb.",
 "The police found no evidences.|The police found no evidence.|'Evidence' is uncountable.",
 "He has made a good progress.|He has made good progress.|'Progress' takes no article.",
 "She bought two breads.|She bought two loaves of bread.|Use a unit phrase.",
 "There were many works to finish.|There was much work to finish.|'Work' here is uncountable."],

 s9:[
 "Fill in the Blank|The officer gave us some valuable ____ about the missing documents.|information;informations|0|'Information' has no plural form.",
 "Find the Error|He carried (A) too many luggages (B) to the railway station (C) that morning (D).|A;B;C;D|1|Part B. It must be 'too much luggage'.",
 "Sentence Improvement|My father gave me an advice which I shall never forget.|an advice;a piece of advice;advices|1|'Advice' is uncountable and needs a unit phrase.",
 "Fill in the Blank|All the ____ in the new office ____ been bought from a local dealer.|furniture-has;furnitures-have;furniture-have|0|'Furniture' is uncountable → no -s and a singular verb.",
 "Find the Error|The committee found (A) no evidences (B) against the accused (C) in this case (D).|A;B;C;D|1|Part B. 'Evidence' is uncountable → 'no evidence'."],

 s10:{
  en:"These words FEEL countable to an Indian learner because Tamil and Hindi allow plurals for them. You can point at three chairs, so 'three furnitures' feels natural. The exam knows this and plants 'informations', 'furnitures', 'advices', 'luggages' and 'equipments' constantly. The double trap is the quantifier: 'many informations' is wrong twice, once for 'many' and once for the -s.",
  ta:"இந்தச் சொற்கள் இந்திய மாணவருக்கு எண்ணக்கூடியவையாக உணரப்படுகின்றன, ஏனெனில் தமிழும் இந்தியும் அவற்றுக்குப் பன்மையை அனுமதிக்கின்றன. மூன்று நாற்காலிகளைக் கை நீட்டிக் காட்ட முடியும், எனவே 'three furnitures' இயற்கையாகத் தோன்றுகிறது. தேர்வுக்கு இது தெரியும், எனவே 'informations', 'furnitures', 'advices', 'luggages', 'equipments' ஆகியவற்றைத் தொடர்ந்து நடுகிறது. இரட்டைப் பொறி quantifier: 'many informations' இரண்டு விதங்களில் தவறு.",
  tl:"Indhach sorkal Indhiya maanavarukku ennakkoodiyavaiyaaga unarappadugindrana, yenenil Thamizhum Hindiyum avatrukkup panmaiyai anumadhikkindrana. Thervukku idhu theriyum, enave 'informations', 'furnitures', 'advices', 'luggages' aagiyavatraith thodarndhu nadugiradhu."},

 s11:{
  en:"CANNOT COUNT IT → no -s, no a/an, singular verb. Use 'A PIECE OF' to count.",
  ta:"எண்ண முடியாது → -s இல்லை, a/an இல்லை, ஒருமை வினைச்சொல். எண்ண 'A PIECE OF' பயன்படுத்துங்கள்.",
  tl:"Enna mudiyaadhu → -s illai, a/an illai, orumai vinaichol. Enna 'A PIECE OF' payanpaduththungal.",
  vis:"    MEMORY SENTENCE — say it daily:\n\n  \"I gave him A PIECE OF ADVICE and\n   SOME INFORMATION about the FURNITURE,\n   the LUGGAGE and the EQUIPMENT.\"\n\n  Every capitalised word is UNCOUNTABLE.\n  None of them ever takes -s or a/an.\n\n  THE THREE CHECKS:\n  1. No -s          →  information, not informations\n  2. No a/an        →  a piece of advice, not an advice\n  3. Singular verb  →  the furniture IS, not ARE\n  4. much/little    →  much information, not many"},
