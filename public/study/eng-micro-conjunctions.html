 s14:{
  rule:"UNLESS means 'if not' and UNTIL means 'not before', so neither may take another 'not'.",
  formula:"UNLESS = IF … NOT\nUNTIL = up to that point, not before\nNever add 'not' inside either clause\nBoth clauses take the PRESENT tense for future meaning",
  memory:"The NOT is already inside UNLESS and UNTIL. Keep the clause in the present.",
  ta:"'NOT' ஏற்கனவே UNLESS-லயும் UNTIL-லயும் இருக்கு. தொடரை நிகழ்காலத்துல வையுங்க.",
  tl:"'NOT' erkanave UNLESS-layum UNTIL-layum irukku. Thodarai nigazhkaalaththula vaiyunga.",
  mistake:"Writing 'unless you do not work hard' and 'until he will come'.",
  exam:"SSC CGL / CHSL, RRB and Bank — the double negative and the wrong tense are both planted."},

 s15:[
 {ta:"Rule 89-ல 'lest'-க்குள்ள எதிர்மறை ஒளிஞ்சிருக்குன்னு பார்த்தோம். இப்போ இன்னும் ரெண்டு வார்த்தை — UNLESS மற்றும் UNTIL. ரெண்டுலயும் அதே கதைதான்.",
  tl:"Rule 89-la 'lest'-kkulla edhirmarai olinjirukkunnu paarththom. Ippo innum rendu vaarththai — UNLESS matrum UNTIL. Rendulayum adhe kadhaidhaan."},
 {ta:"UNLESS அப்படின்னா என்ன? 'IF … NOT'. அவ்ளோதான். 'UNLESS you work hard' = 'IF you do NOT work hard'. ரெண்டுமே ஒரே அர்த்தம். 'Not' அந்த வார்த்தைக்குள்ளேயே மடிஞ்சிருக்கு.",
  tl:"UNLESS appadinnaa enna? 'IF … NOT'. Avlodhaan. 'UNLESS you work hard' = 'IF you do NOT work hard'. Rendume ore arththam."},
 {ta:"இப்போ 'UNLESS you do NOT work hard' அப்படின்னு எழுதினா என்ன ஆகும்? 'IF you do not NOT work hard' = 'IF you DO work hard'! அர்த்தம் தலைகீழ்! நீங்க சொல்ல வந்தது 'கடினமா உழைக்கலைன்னா தோற்பீங்க', ஆனா எழுதினது 'கடினமா உழைச்சா தோற்பீங்க'!",
  tl:"Ippo 'UNLESS you do NOT work hard' appadinnu ezhudhinaa enna aagum? 'IF you DO work hard'! Arththam thalaigeezh! Neenga solla vandhadhu 'kadinamaa uzhaikkalainnaa thorpeenga', aanaa ezhudhinadhu 'kadinamaa uzhaichaa thorpeenga'!"},
 {ta:"UNTIL-ம் அப்படித்தான். 'Wait here UNTIL I return' — நான் திரும்பி வர்ற வரைக்கும் காத்திருங்க. அதுக்குள்ள 'அதுக்கு முன்னாடி கிளம்பாதீங்க' அப்படிங்கிற எதிர்மறை இருக்கு. 'Until I do NOT return' அப்படின்னு எழுதினா, வாக்கியமே அர்த்தமில்லாமப் போயிடும்.",
  tl:"UNTIL-um appadi-dhaan. 'Wait here UNTIL I return'. Adhukkulla 'adhukku munnaadi kilambaadheenga' appadingira edhirmarai irukku. 'Until I do NOT return' appadinnu ezhudhinaa, vaakkiyame arththamillaamap poyidum."},
 {ta:"இப்போ ரெண்டாவது அடுக்கு — காலம். SSC இங்க ஒரு நல்ல பொறி வெக்கும். 'Unless he WILL COME, we will not start' — தப்பு! 'Unless he COMES' தான் சரி. ஏன்? ஏன்னா நிபந்தனை மற்றும் நேரத் தொடர்ல எதிர்காலப் பொருள் இருந்தாலும் நிகழ்காலம்தான் வரும்.",
  tl:"Ippo randaavadhu adukku — kaalam. SSC inga oru nalla pori vekkum. 'Unless he WILL COME, we will not start' — thappu! 'Unless he COMES' thaan sari."},
 {ta:"இது நீங்க ஏற்கனவே Tense module-ல Rule 62-ல படிச்சது! WHEN, BEFORE, AFTER, AS SOON AS, UNTIL, UNLESS — இதெல்லாத்துக்கும் அப்பறம் நிகழ்காலம். 'Wait until he ARRIVES', 'I will call when he COMES'. ஒரே குடும்பம். ஒரு கேள்வியில ரெண்டு தப்பையும் சேர்த்து வெப்பாங்க — எதிர்மறை மற்றும் காலம். ரெண்டையும் பாருங்க.",
  tl:"Idhu neenga erkanave Tense module-la Rule 62-la padichadhu! WHEN, BEFORE, AFTER, AS SOON AS, UNTIL, UNLESS — idhellaaththukkum apparam nigazhkaalam. Oru kelviyila rendu thappaiyum serthu veppaanga."}]},

/* ========== RULE 91 ========== */
{n:91,rc:"CON-06",d:"Medium",t:"THE REASON IS THAT, never THE REASON IS BECAUSE",
 tam:"'The reason is that' — 'reason' மற்றும் 'because' சேர்ந்து வரக்கூடாது",
 s1:{en:"When a sentence begins with THE REASON, it must continue with THAT, not with BECAUSE or WHY. 'Reason' and 'because' both express cause, so using both repeats the same idea.",
  ta:"ஒரு வாக்கியம் THE REASON-உடன் தொடங்கினால், அது THAT-உடன் தொடர வேண்டும், BECAUSE அல்லது WHY-உடன் அல்ல. 'Reason' மற்றும் 'because' இரண்டுமே காரணத்தை வெளிப்படுத்துகின்றன, எனவே இரண்டையும் பயன்படுத்துவது ஒரே கருத்தை மீண்டும் சொல்கிறது.",
  tl:"Oru vaakkiyam THE REASON-udan thodanginaal, adhu THAT-udan thodara vendum, BECAUSE alladhu WHY-udan alla. 'Reason' matrum 'because' irandume kaaranaththai velippaduththugindrana.",
  formula:"THE REASON  …  IS  …  THAT\n\n  The reason for his absence is THAT he was ill.   ✔\n  The reason for his absence is BECAUSE he was ill. ✘\n  The reason for his absence is WHY he was ill.     ✘\n\nOR DROP 'THE REASON' ALTOGETHER:\n  He was absent BECAUSE he was ill.                 ✔"},

 s2:[
 {h:"'Reason' already carries the cause",
  en:"The noun 'reason' means 'the cause'. 'Because' also means 'for the cause that'. Putting both in one sentence says 'the cause is for the cause that…'. Use one or the other.",
  ta:"'Reason' ஏற்கனவே காரணத்தைச் சுமக்கிறது. 'Reason' என்ற பெயர்ச்சொல் 'காரணம்' என்று பொருள்படுகிறது. 'Because'-ம் 'இந்தக் காரணத்திற்காக' என்று பொருள்படுகிறது. இரண்டையும் ஒரே வாக்கியத்தில் வைப்பது 'காரணம் இந்தக் காரணத்திற்காக…' என்று சொல்கிறது. ஒன்றைப் பயன்படுத்துங்கள்.",
  tl:"'Reason' erkanave kaaranaththaich sumakkiradhu. Irandaiyum ore vaakkiyaththil vaippadhu 'kaaranam indhak kaaranaththirkaaga…' endru solgiradhu. Ondraip payanpaduththungal."},
 {h:"There are always two correct fixes",
  en:"'The reason is THAT he was ill' ✔ or 'He was absent BECAUSE he was ill' ✔. Either keep 'the reason' and use 'that', or drop 'the reason' and use 'because'. Both give a clean sentence.",
  ta:"எப்போதும் இரண்டு சரியான திருத்தங்கள் உள்ளன. 'The reason is THAT he was ill' சரி அல்லது 'He was absent BECAUSE he was ill' சரி. 'The reason'-ஐ வைத்துக்கொண்டு 'that' பயன்படுத்துங்கள், அல்லது 'the reason'-ஐ நீக்கிவிட்டு 'because' பயன்படுத்துங்கள். இரண்டும் தெளிவான வாக்கியத்தைத் தருகின்றன.",
  tl:"Eppodhum irandu sariyaana thiruththangal ullana. 'The reason'-ai vaiththukkondu 'that' payanpaduththungal, alladhu 'the reason'-ai neekkivittu 'because' payanpaduththungal."},
 {h:"This is the same principle as Rule 88",
  en:"Rule 88 said never use two conjunctions for one relationship. This rule says never use a cause-noun and a cause-conjunction for one relationship. Both are cases of saying the same thing twice.",
  ta:"இது Rule 88-ன் அதே கொள்கை. Rule 88 ஒரே தொடர்புக்கு இரண்டு இணைப்புச் சொற்களைப் பயன்படுத்தாதே என்று சொன்னது. இந்த விதி ஒரே தொடர்புக்கு ஒரு காரணப் பெயர்ச்சொல்லையும் ஒரு காரண இணைப்புச் சொல்லையும் பயன்படுத்தாதே என்று சொல்கிறது. இரண்டுமே ஒரே விஷயத்தை இரண்டு முறை சொல்லும் வழக்குகள்.",
  tl:"Idhu Rule 88-in adhe kolgai. Rule 88 ore thodarbukku irandu inaippuch sorkalaip payanpaduththaadhe endru sonnadhu. Irandume ore vishayaththai irandu murai sollum vazhakkugal."},
 {h:"Related redundancy traps",
  en:"'Return back', 'repeat again', 'revert back', 'the reason why is because', 'more better', 'most best', 'cousin brother' — all repeat an idea already present. Exams test these together.",
  ta:"தொடர்புடைய மிகைப்படுத்தல் பொறிகள். 'Return back', 'repeat again', 'revert back', 'the reason why is because', 'more better', 'most best', 'cousin brother' — அனைத்தும் ஏற்கனவே இருக்கும் ஒரு கருத்தை மீண்டும் சொல்கின்றன. தேர்வுகள் இவற்றைச் சேர்த்துச் சோதிக்கின்றன.",
  tl:"Thodarpudaiya migaippaduththal porigal. 'Return back', 'repeat again', 'revert back', 'more better', 'most best', 'cousin brother' — anaiththum erkanave irukkum oru karuththai meendum solgindrana."}],

 s3:[
 {h:"The cause is stated twice",
  d:"   THE REASON  is  BECAUSE ...\n        ↑            ↑\n     cause        cause\n\n   = 'the cause is for the cause that ...'\n\n   ONE of them must go."},
 {h:"Two correct fixes",
  d:"   ✘ The reason he failed is BECAUSE he was lazy.\n\n   FIX 1 — keep 'the reason', use THAT:\n     The reason he failed is THAT he was lazy.  ✔\n\n   FIX 2 — drop 'the reason', use BECAUSE:\n     He failed BECAUSE he was lazy.             ✔"},
 {h:"The redundancy family",
  d:"   ✘ the reason is because   ✔ the reason is that\n   ✘ return back             ✔ return\n   ✘ repeat again            ✔ repeat\n   ✘ revert back             ✔ revert\n   ✘ more better             ✔ better\n   ✘ most best               ✔ best\n   ✘ cousin brother          ✔ cousin\n\n   Each says one idea twice."}],

 s4:{
 wrong:["\"'The reason is because' explains the cause clearly.\" — It states the cause twice.",
  "\"'The reason why is because' is emphatic.\" — It states the cause three times.",
  "\"'That' sounds too weak here.\" — 'That' is the only correct link after 'the reason is'.",
  "\"'Return back' shows the direction.\" — 'Return' already means to come back."],
 right:["After 'the reason … is', always write 'that'.",
  "Or drop 'the reason' and use 'because'.",
  "Never use a cause-noun and a cause-conjunction together.",
  "Watch the whole redundancy family: return back, repeat again, more better."]},

 s5:[
 {en:"The reason for his absence is that he was ill.",ta:"அவர் வராததற்குக் காரணம் அவர் உடல்நலமில்லாமல் இருந்ததுதான்.",tl:"Avar varaadhadharkuk kaaranam avar udalnalamillaamal irundhadhudhaan.",note:"'The reason … is THAT'."},
 {en:"He was absent because he was ill.",ta:"உடல்நலமில்லாததால் அவர் வரவில்லை.",tl:"Udalnalamillaadhadhaal avar varavillai.",note:"The 'because' version, with 'the reason' dropped."},
 {en:"The reason she resigned is that she got a better offer.",ta:"அவர் ராஜினாமா செய்ததற்குக் காரணம் சிறந்த வாய்ப்பு கிடைத்ததுதான்.",tl:"Avar raajinaamaa seydhadharkuk kaaranam sirandha vaayppu kidaiththadhudhaan.",note:"'The reason … is THAT'."},
 {en:"Please return the book by Monday.",ta:"தயவுசெய்து புத்தகத்தைத் திங்கட்கிழமைக்குள் திருப்பித் தாருங்கள்.",tl:"Dhayavuseydhu puththagaththaith thingatkizhamaikkul thiruppith thaarungal.",note:"'Return' alone — 'return back' is redundant."},
 {en:"The reason for the delay is that the road was blocked.",ta:"தாமதத்திற்குக் காரணம் சாலை அடைக்கப்பட்டிருந்ததுதான்.",tl:"Thaamadhaththirkuk kaaranam saalai adaikkappattirundhadhudhaan.",note:"'The reason … is THAT'."}],

 s8:[
 "The reason for his absence is because he was ill.|The reason for his absence is that he was ill.|'Reason' and 'because' state the cause twice.",
 "The reason why he failed is because he was lazy.|The reason he failed is that he was lazy.|'Reason why … because' states the cause three times.",
 "Please return back the book by Monday.|Please return the book by Monday.|'Return' already means to give back.",
 "Kindly repeat again the last question.|Kindly repeat the last question.|'Repeat' already means to say again.",
 "The reason for the delay is because the road was shut.|The reason for the delay is that the road was shut.|'Reason' and 'because' are redundant together.",
 "She is more better than her sister at maths.|She is better than her sister at maths.|'Better' is already comparative.",
 "This is the most best solution of all.|This is the best solution of all.|'Best' is already superlative.",
 "He is my cousin brother, not my own brother.|He is my cousin, not my own brother.|'Cousin' does not take 'brother'.",
 "Kindly revert back to my letter of 5 May.|Kindly revert to my letter of 5 May.|'Revert' already means to come back.",
 "The reason he refused is because he was busy.|The reason he refused is that he was busy.|'Reason' and 'because' are redundant together."],

 s9:[
 "Fill in the Blank|The reason for the sudden postponement is ____ the chief guest could not travel.|because;that|1|'The reason … is THAT'.",
 "Find the Error|The main reason (A) for his repeated failure (B) is because he (C) never revised his notes (D).|A;B;C;D|2|Part C. 'Reason … because' is redundant → 'is that he'.",
 "Sentence Improvement|Kindly return back all the library books before the end of this month.|return back;return;returning back|1|'Return' already means to give back.",
 "Fill in the Blank|The reason the project was abandoned is ____ the funds were exhausted midway.|why;that|1|'The reason … is THAT'.",
 "Find the Error|She requested the speaker (A) to repeat again (B) the last part (C) of his lecture (D).|A;B;C;D|1|Part B. 'Repeat' already means to say again."],

 s10:{
  en:"'The reason is because' is one of the most natural-sounding errors in English, and even fluent speakers use it. The exam pairs it with 'the reason why is because', which triples the cause. The wider trap is the whole redundancy family — return back, repeat again, revert back, more better — which appear in the same Error Spotting sets.",
  ta:"'The reason is because' ஆங்கிலத்தில் மிக இயற்கையாக ஒலிக்கும் தவறுகளில் ஒன்று, சரளமாகப் பேசுபவர்களும் கூட அதைப் பயன்படுத்துகிறார்கள். தேர்வு அதை 'the reason why is because'-உடன் இணைக்கிறது, அது காரணத்தை மூன்று மடங்காக்குகிறது. பரந்த பொறி முழு மிகைப்படுத்தல் குடும்பம் — return back, repeat again, revert back, more better — அவை அதே Error Spotting தொகுப்புகளில் வருகின்றன.",
  tl:"'The reason is because' Aangilaththil miga iyarkaiyaaga olikkum thavarugalil ondru. Parandha pori muzhu migaippaduththal kudumbam — return back, repeat again, revert back, more better."},

 s11:{
  en:"THE REASON IS THAT. Never 'is because'. One cause word per sentence.",
  ta:"THE REASON IS THAT. ஒருபோதும் 'is because' அல்ல. ஒரு வாக்கியத்திற்கு ஒரு காரணச் சொல்.",
  tl:"THE REASON IS THAT. Orupodhum 'is because' alla. Oru vaakkiyaththirku oru kaaranach sol.",
  vis:"      ONE CAUSE WORD PER SENTENCE\n\n   THE REASON  is  BECAUSE ...\n        ↑            ↑\n     cause        cause     ✘ twice\n\n   FIX 1 — keep 'the reason':\n     The reason is THAT he was ill.  ✔\n\n   FIX 2 — drop 'the reason':\n     He was absent BECAUSE he was ill. ✔\n\n   THE REDUNDANCY FAMILY:\n     ✘ return back      ✔ return\n     ✘ repeat again     ✔ repeat\n     ✘ revert back      ✔ revert\n     ✘ more better      ✔ better\n     ✘ most best        ✔ best\n     ✘ cousin brother   ✔ cousin\n\n   Same principle as Rule 88."},

 s13:[
 "The reason for his absence is ____ he was ill, and neither the principal ____ the teachers ____ informed.|that-nor-were;because-or-was;that-or-were|0|'The reason … is THAT'. NEITHER pairs with NOR (Rule 86). Nearest subject → WERE.",
 "The reason it failed is ____ funds ran out, although the team ____ worked ____ hard.|that-had-very;because-has-more;that-has-very|0|'The reason … is THAT'. The earlier past action → HAD. 'More hard' is redundant → VERY hard.",
 "Kindly ____ the book, and the reason for the recall is ____ the library ____ short of copies.|return-that-is;return back-because-is;return-because-are|0|'Return' alone. 'The reason … is THAT'. Singular subject → IS.",
 "The reason she resigned is ____ she got a better offer, which was superior ____ her old post.|that-to;because-than;that-than|0|'The reason … is THAT'. 'Superior to' — a Latin comparative (Preposition Rule 84).",
 "The reason nobody spoke is ____ all were afraid lest the officer ____ angry.|that-should be;because-would be;that-should not be|0|'The reason … is THAT'. LEST + SHOULD with no 'not' (Rule 89)."],

 s14:{
  rule:"After 'the reason … is', use THAT, never BECAUSE or WHY.",
  formula:"THE REASON … IS … THAT  ✔\nTHE REASON … IS … BECAUSE  ✘\nOr drop 'the reason' and use BECAUSE\nSame family: return back, repeat again, revert back, more better, most best, cousin brother",
  memory:"One cause word per sentence. 'The reason is THAT'.",
  ta:"ஒரு வாக்கியத்துக்கு ஒரு காரணச் சொல். 'The reason is THAT'.",
  tl:"Oru vaakkiyaththukku oru kaaranach sol. 'The reason is THAT'.",
  mistake:"Writing 'the reason is because' and 'the reason why is because'.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting alongside the other redundancy errors."},

 s15:[
 {ta:"இந்த rule Rule 88-ஓட நேரடி தொடர்ச்சி. அங்க ரெண்டு இணைப்புச் சொல் சேர்த்து போடக்கூடாதுன்னு பார்த்தோம். இங்க ஒரு காரணப் பெயர்ச்சொல்லும் ஒரு காரண இணைப்புச் சொல்லும் சேர்ந்து வரக்கூடாதுன்னு பார்க்கப் போறோம்.",
  tl:"Indha rule Rule 88-oda neradi thodarchi. Anga rendu inaippuch sol serthu podakkoodaadhunnu paarththom. Inga oru kaaranap peyarcholum oru kaarana inaippuch sollum serndhu varakkoodaadhunnu paarkkap porom."},
 {ta:"'The reason for his absence is BECAUSE he was ill.' — இது நமக்கு ரொம்ப சரியா தோணும். ஆனா தப்பு! ஏன்? 'Reason' அப்படிங்கிற வார்த்தையே 'காரணம்'. 'Because'-ம் 'இந்தக் காரணத்துக்காக'. ரெண்டையும் சேர்த்தா — 'காரணம் என்பது இந்தக் காரணத்துக்காக' — மிகைப்படுத்தல்.",
  tl:"'The reason for his absence is BECAUSE he was ill.' — idhu namakku romba sariyaa thonum. Aanaa thappu! 'Reason' appadingira vaarththaiye 'kaaranam'. 'Because'-um 'indhak kaaranaththukkaaga'."},
 {ta:"சரியான வடிவம் ரெண்டு இருக்கு. ஒண்ணு — 'the reason' -ஐ வெச்சுக்கிட்டு 'THAT' போடுங்க: 'The reason for his absence is THAT he was ill.' ரெண்டு — 'the reason' -ஐ முழுசா தூக்கிட்டு 'because' போடுங்க: 'He was absent BECAUSE he was ill.'",
  tl:"Sariyaana vadivam rendu irukku. Onnu — 'the reason'-ai vechukkittu 'THAT' podunga. Rendu — 'the reason'-ai muzhusaa thookkittu 'because' podunga."},
 {ta:"இன்னும் மோசமான ஒரு வடிவம் இருக்கு — 'The reason WHY he failed is BECAUSE he was lazy.' இங்க காரணம் மூணு தடவ சொல்லப்படுது! Reason, why, because. இதை SSC ரொம்ப விரும்பி கேட்குது.",
  tl:"Innum mosamaana oru vadivam irukku — 'The reason WHY he failed is BECAUSE he was lazy.' Inga kaaranam moonu thadava sollappadudhu! Reason, why, because."},
 {ta:"இப்போ இதே கொள்கை வேற இடத்துலயும் வரும் — மிகைப்படுத்தல் குடும்பம். 'Return BACK' — 'return' அப்படின்னாலே 'திரும்ப தா' அப்படிங்கிற அர்த்தம், 'back' தேவையில்ல. 'Repeat AGAIN' — 'repeat' அப்படின்னாலே 'மறுபடி சொல்', 'again' தேவையில்ல. 'Revert BACK' — அதே கதை.",
  tl:"Ippo idhe kolgai veru idaththulayum varum — migaippaduththal kudumbam. 'Return BACK' — 'return' appadinnaale 'thirumba thaa', 'back' thevaiyilla. 'Repeat AGAIN', 'Revert BACK' — adhe kadhai."},
 {ta:"இன்னும் சில — 'MORE better' (better-லயே ஒப்பீடு இருக்கு), 'MOST best' (best-லயே உச்சம் இருக்கு), 'COUSIN brother' (இது இந்திய ஆங்கிலம், cousin மட்டும் போதும்). இதெல்லாம் ஒரே Error Spotting தொகுப்புல சேர்த்து வரும். ஒரே கேள்வி மனசுல வெச்சுக்கோங்க — 'இந்த வாக்கியத்துல ஒரே விஷயம் ரெண்டு தடவ சொல்லப்படுதா?'",
  tl:"Innum sila — 'MORE better', 'MOST best', 'COUSIN brother'. Idhellaam ore Error Spotting thoguppula serthu varum. Ore kelvi manasula vechukkonga — 'indha vaakkiyaththula ore vishayam rendu thadava sollappadudhaa?'"}]},

/* ========== RULE 92 ========== */
{n:92,rc:"CON-07",d:"Medium",t:"BOTH pairs only with AND; AS WELL AS is different",
 tam:"Both...and மட்டுமே · As well as என்பது வேறு அமைப்பு",
 s1:{en:"BOTH takes only AND — never 'as well as', never 'or'. And AS WELL AS is not a conjunction like 'and': it adds extra information, so the VERB agrees with the FIRST subject only.",
  ta:"BOTH AND-ஐ மட்டுமே எடுக்கும் — ஒருபோதும் 'as well as' அல்ல, ஒருபோதும் 'or' அல்ல. மேலும் AS WELL AS 'and' போன்ற ஒரு இணைப்புச் சொல் அல்ல: அது கூடுதல் தகவலைச் சேர்க்கிறது, எனவே வினைச்சொல் முதல் Subject-உடன் மட்டுமே ஒத்துப்போகிறது.",
  tl:"BOTH AND-ai mattume edukkum — orupodhum 'as well as' alla. Melum AS WELL AS 'and' pondra oru inaippuch sol alla: adhu koodudhal thagavalaich serkkiradhu, enave vinaichol mudhal Subject-udan mattume oththuppogiradhu.",
  formula:"BOTH  ………  AND      (nothing else)\n\n  BOTH Ram AND Shyam are present.        ✔\n  BOTH Ram AS WELL AS Shyam are present. ✘\n  BOTH Ram OR Shyam are present.         ✘\n\nAS WELL AS  →  verb follows the FIRST subject\n\n  Ram, AS WELL AS his friends, IS present.  ✔\n  Ram, AS WELL AS his friends, ARE present. ✘"},

 s2:[
 {h:"BOTH has exactly one partner",
  en:"Unlike 'either', which pairs only with 'or', and 'neither', which pairs only with 'nor', 'both' pairs only with 'and'. There is no second option. 'Both … as well as' is one of the most planted errors in SSC.",
  ta:"BOTH-க்கு சரியாக ஒரே ஒரு துணை உண்டு. 'Or'-உடன் மட்டுமே ஜோடி சேரும் 'either' போலவும், 'nor'-உடன் மட்டுமே ஜோடி சேரும் 'neither' போலவும், 'both' 'and'-உடன் மட்டுமே ஜோடி சேரும். இரண்டாவது தேர்வு இல்லை. 'Both … as well as' SSC-ல் மிக அதிகமாக வைக்கப்படும் தவறுகளில் ஒன்று.",
  tl:"BOTH-kku sariyaaga ore oru thunai undu. 'Both' 'and'-udan mattume jodi serum. Irandaavadhu thervu illai. 'Both … as well as' SSC-l miga adhigamaaga vaikkappadum thavarugalil ondru."},
 {h:"AS WELL AS is an ADD-ON, not a joiner",
  en:"'And' truly joins two subjects into a plural. 'As well as' merely adds extra information about the first subject, like a parenthesis. So 'Ram, as well as his friends, IS present' — the verb looks only at Ram.",
  ta:"AS WELL AS ஒரு கூடுதல் இணைப்பு, சேர்ப்பான் அல்ல. 'And' உண்மையிலேயே இரண்டு Subject-களை ஒரு பன்மையாக இணைக்கிறது. 'As well as' முதல் Subject-ஐப் பற்றிய கூடுதல் தகவலைச் சேர்க்கிறது, ஒரு அடைப்புக்குறி போல. எனவே 'Ram, as well as his friends, IS present' — வினைச்சொல் Ram-ஐ மட்டுமே பார்க்கிறது.",
  tl:"AS WELL AS oru koodudhal inaippu, serppaan alla. 'And' unmaiyileye irandu Subject-galai oru panmaiyaaga inaikkiradhu. 'As well as' mudhal Subject-aip patriya koodudhal thagavalaich serkkiradhu."},
 {h:"The whole ADD-ON family behaves the same way",
  en:"AS WELL AS, ALONG WITH, TOGETHER WITH, IN ADDITION TO, BESIDES, ACCOMPANIED BY, WITH, LIKE, RATHER THAN, AND NOT — all of these leave the verb with the first subject. This is SVA Rule 33.",
  ta:"முழு கூடுதல் இணைப்புக் குடும்பமும் அதே வழியில் நடந்துகொள்கிறது. AS WELL AS, ALONG WITH, TOGETHER WITH, IN ADDITION TO, BESIDES, ACCOMPANIED BY, WITH, LIKE, RATHER THAN, AND NOT — இவை அனைத்தும் வினைச்சொல்லை முதல் Subject-உடன் விட்டுவிடுகின்றன. இது SVA Rule 33.",
  tl:"Muzhu koodudhal inaippuk kudumbamum adhe vazhiyil nadandhukolgiradhu. AS WELL AS, ALONG WITH, TOGETHER WITH, IN ADDITION TO, BESIDES, ACCOMPANIED BY — ivai anaiththum vinaicholai mudhal Subject-udan vittuvidugindrana."},
 {h:"The comma test",
  en:"'As well as' phrases are usually set off by commas: 'Ram, as well as his friends, is present'. Cover everything between the commas and the sentence must still work — 'Ram … is present'. That is why the verb stays singular.",
  ta:"காற்புள்ளி சோதனை. 'As well as' தொடர்கள் பொதுவாக காற்புள்ளிகளால் பிரிக்கப்படுகின்றன: 'Ram, as well as his friends, is present'. காற்புள்ளிகளுக்கு இடையில் உள்ள அனைத்தையும் மூடினால் வாக்கியம் இன்னும் வேலை செய்ய வேண்டும் — 'Ram … is present'. அதனால்தான் வினைச்சொல் ஒருமையாகவே இருக்கிறது.",
  tl:"Kaarpulli sodhanai. 'As well as' thodargal podhuvaaga kaarpulligalaal pirikkappadugindrana. Kaarpulligalukku idaiyil ulla anaiththaiyum moodinaal vaakkiyam innum velai seyya vendum."}],

 s3:[
 {h:"One partner only",
  d:"   EITHER   ─────►  OR\n   NEITHER  ─────►  NOR\n   BOTH     ─────►  AND\n\n   ✘ both … as well as\n   ✘ both … or\n   ✘ both … but also\n\n   BOTH has exactly ONE partner."},
 {h:"AND joins, AS WELL AS adds",
  d:"   AND  ──  a true joiner\n     Ram AND Shyam  →  TWO people  →  ARE\n\n   AS WELL AS  ──  an add-on\n     Ram, as well as Shyam,  →  still RAM  →  IS\n              ↑\n        extra information only\n\n   The verb never looks past the commas."},
 {h:"The whole add-on family",
  d:"   THESE ALL LEAVE THE VERB WITH SUBJECT 1:\n\n     as well as        along with\n     together with     in addition to\n     besides           accompanied by\n     with              like\n     rather than       and not\n\n   Ram, ALONG WITH his friends, IS coming.\n   Ram, BESIDES his brothers, WAS there.\n\n   (SVA Rule 33)"}],

 s4:{
 wrong:["\"'Both … as well as' is stronger than 'both … and'.\" — 'Both' takes only 'and'.",
  "\"'As well as' means the same as 'and', so the verb is plural.\" — It is an add-on, not a joiner.",
  "\"'Ram as well as his friends are coming' sounds right.\" — The verb follows Ram alone.",
  "\"The commas do not matter.\" — They show that the phrase is extra information."],
 right:["Both pairs only with AND.",
  "'As well as' adds; the verb stays with the first subject.",
  "Cover everything between the commas and check the verb.",
  "The whole family behaves this way: along with, together with, besides, accompanied by."]},

 s10:{
  en:"Two traps sit in one rule. The first is 'both … as well as', which feels more emphatic than 'both … and'. The second is subtler: because 'as well as' MEANS 'and', students make the verb plural. But it is an add-on phrase, not a joiner — the verb never looks past the commas.",
  ta:"ஒரே விதியில் இரண்டு பொறிகள் இருக்கின்றன. முதலாவது 'both … as well as', அது 'both … and'-ஐ விட அதிக வலியுறுத்தலாகத் தோன்றுகிறது. இரண்டாவது நுட்பமானது: 'as well as' 'and' என்று பொருள்படுவதால், மாணவர்கள் வினைச்சொல்லைப் பன்மையாக்குகிறார்கள். ஆனால் அது ஒரு கூடுதல் தொடர், சேர்ப்பான் அல்ல — வினைச்சொல் ஒருபோதும் காற்புள்ளிகளுக்கு அப்பால் பார்ப்பதில்லை.",
  tl:"Ore vidhiyil irandu porigal irukkindrana. Mudhalaavadhu 'both … as well as'. Irandaavadhu nutpamaanadhu: 'as well as' 'and' endru porulpaduvadhaal, maanavargal vinaicholaip panmaiyaakkugiraargal."},

 s11:{
  en:"BOTH takes only AND. AS WELL AS leaves the verb with the FIRST subject.",
  ta:"BOTH AND-ஐ மட்டுமே எடுக்கும். AS WELL AS வினைச்சொல்லை முதல் Subject-உடன் விட்டுவிடும்.",
  tl:"BOTH AND-ai mattume edukkum. AS WELL AS vinaicholai mudhal Subject-udan vittuvidum.",
  vis:"      TWO RULES IN ONE\n\n   1. BOTH  ─────►  AND    (only)\n      ✘ both … as well as\n      ✘ both … or\n\n   2. AS WELL AS  =  an ADD-ON\n\n      Ram, as well as his friends, IS coming.\n       ↑    └── cover this ──┘      ↑\n      the verb looks ONLY here\n\n   THE WHOLE ADD-ON FAMILY:\n     as well as · along with\n     together with · in addition to\n     besides · accompanied by\n     with · like · rather than · and not\n\n   ⚠ THE COMMA TEST:\n     cover everything between the commas.\n     The sentence must still work."},

 s14:{
  rule:"BOTH pairs only with AND; AS WELL AS is an add-on and leaves the verb with the first subject.",
  formula:"BOTH … AND (only)\nAS WELL AS, ALONG WITH, TOGETHER WITH, IN ADDITION TO,\nBESIDES, ACCOMPANIED BY, WITH, LIKE, RATHER THAN, AND NOT\n→ the verb follows the FIRST subject (SVA Rule 33)",
  memory:"Both takes only AND. As well as adds — the verb never looks past the commas.",
  ta:"Both-க்கு AND மட்டும். As well as கூடுதல் தகவல் — verb காற்புள்ளிக்கு அப்பால் பார்க்காது.",
  tl:"Both-kku AND mattum. As well as koodudhal thagaval — verb kaarpullikku appaal paarkkaadhu.",
  mistake:"Writing 'both … as well as' and making the verb plural after 'as well as'.",
  exam:"SSC CGL / CHSL and Bank — tested both as a conjunction error and as an SVA error."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு விஷயம் சேர்ந்து இருக்கு. முதல்ல எளிமையானது — BOTH-க்கு AND மட்டும்தான் ஜோடி. வேற எதுவும் இல்ல.",
  tl:"Indha rule-la rendu vishayam serndhu irukku. Mudhalla elimaiyaanadhu — BOTH-kku AND mattum-dhaan jodi. Veru edhuvum illa."},
 {ta:"'BOTH Ram AS WELL AS Shyam are present' — தப்பு! 'BOTH Ram AND Shyam are present' — சரி. SSC இதை ரொம்ப அடிக்கடி வெக்குது, ஏன்னா 'as well as' வலியுறுத்துற மாதிரி தோணுது.",
  tl:"'BOTH Ram AS WELL AS Shyam are present' — thappu! 'BOTH Ram AND Shyam are present' — sari. SSC idhai romba adikkadi vekkudhu."},
 {ta:"இப்போ ரெண்டாவது விஷயம் — இது இன்னும் நுட்பமானது. 'AS WELL AS' அப்படிங்கிறது 'AND' மாதிரியே அர்த்தம் தருது, ஆனா இலக்கணத்துல அது வேற வேலை செய்யுது.",
  tl:"Ippo randaavadhu vishayam — idhu innum nutpamaanadhu. 'AS WELL AS' appadingiradhu 'AND' maadhiriye arththam tharudhu, aanaa ilakkanaththula adhu veru velai seyyudhu."},
 {ta:"'AND' உண்மையா ரெண்டு subject-ஐ சேர்த்து பன்மையாக்குது. 'Ram AND Shyam ARE coming' — ரெண்டு பேரு, பன்மை. ஆனா 'AS WELL AS' சேர்க்கல, அது கூடுதல் தகவல் மட்டும்தான் தருது. 'Ram, AS WELL AS his friends, IS coming' — verb Ram-ஐ மட்டும்தான் பார்க்குது!",
  tl:"'AND' unmaiyaa rendu subject-ai serthu panmaiyaakkudhu. 'Ram AND Shyam ARE coming'. Aanaa 'AS WELL AS' serkkala, adhu koodudhal thagaval mattum-dhaan tharudhu. 'Ram, AS WELL AS his friends, IS coming'!"},
 {ta:"இதை புரிஞ்சுக்க ஒரு அருமையான சோதனை — 'காற்புள்ளி சோதனை'. 'Ram, as well as his friends, is coming.' ரெண்டு காற்புள்ளிக்கு நடுவுல இருக்கிறதை மூடுங்க. என்ன மிச்சம்? 'Ram … is coming.' ஒருமை! அதனாலதான் 'is'.",
  tl:"Idhai purinjukka oru arumaiyaana sodhanai — 'kaarpulli sodhanai'. Rendu kaarpullikku naduvula irukkiradhai moodunga. Enna micham? 'Ram … is coming.' Orumai!"},
 {ta:"இந்த குடும்பம் பெரிசு — AS WELL AS, ALONG WITH, TOGETHER WITH, IN ADDITION TO, BESIDES, ACCOMPANIED BY, WITH, LIKE, RATHER THAN, AND NOT. இதெல்லாத்துக்கும் verb முதல் subject-ஐ பார்க்கும். இது நீங்க SVA module-ல Rule 33-ல ஏற்கனவே படிச்சது! இப்போ Conjunctions பக்கத்துலயிருந்து அதே விதியை பார்க்குறோம். SSC ஒரே கேள்வியில ரெண்டு தப்பையும் வெப்பாங்க — 'both…as well as' மற்றும் verb பன்மை. ரெண்டையும் சரிபாருங்க.",
  tl:"Indha kudumbam perisu — AS WELL AS, ALONG WITH, TOGETHER WITH, IN ADDITION TO, BESIDES, ACCOMPANIED BY. Idhellaaththukkum verb mudhal subject-ai paarkkum. Idhu neenga SVA module-la Rule 33-la erkanave padichadhu!"}]},

/* ========== RULE 93 ========== */
{n:93,rc:"CON-08",d:"Hard",t:"SO…THAT, SUCH…THAT and TOO…TO",
 tam:"So + பெயரடை · Such + பெயர்ச்சொல் · Too...to = எதிர்மறை விளைவு",
 s1:{en:"SO comes before an ADJECTIVE or ADVERB. SUCH comes before a NOUN PHRASE. Both are completed by THAT. TOO … TO expresses a NEGATIVE result and never takes 'that' or a second negative.",
  ta:"SO ஒரு பெயரடை அல்லது வினையடைக்கு முன் வருகிறது. SUCH ஒரு பெயர்ச்சொல் தொடருக்கு முன் வருகிறது. இரண்டும் THAT-ஆல் முடிக்கப்படுகின்றன. TOO … TO ஒரு எதிர்மறை விளைவை வெளிப்படுத்துகிறது, ஒருபோதும் 'that' அல்லது இரண்டாவது எதிர்மறையை எடுக்காது.",
  tl:"SO oru peyaradai alladhu vinaiyadaikku mun varugiradhu. SUCH oru peyarchol thodarukku mun varugiradhu. Irandum THAT-aal mudikkappadugindrana. TOO … TO oru edhirmarai vilaivai velippaduththugiradhu.",
  formula:"SO   + adjective / adverb  + THAT\n  He is SO tired THAT he cannot walk.\n\nSUCH + a / an + adjective + noun + THAT\n  It was SUCH a hot day THAT we stayed in.\n\nTOO  + adjective + TO + V1   (negative result)\n  He is TOO tired TO walk.\n     = He is so tired that he CANNOT walk.\n\n⚠ NEVER: too tired that he cannot walk  ✘\n⚠ NEVER: too tired to not walk          ✘"},

 s2:[
 {h:"SO takes an adjective, SUCH takes a noun",
  en:"'SO hot' — 'hot' is an adjective, so 'so' is right. 'SUCH a hot day' — 'day' is a noun, so 'such' is right. If a noun follows, use 'such'; if only an adjective or adverb follows, use 'so'.",
  ta:"SO ஒரு பெயரடையை எடுக்கிறது, SUCH ஒரு பெயர்ச்சொல்லை எடுக்கிறது. 'SO hot' — 'hot' ஒரு பெயரடை, எனவே 'so' சரி. 'SUCH a hot day' — 'day' ஒரு பெயர்ச்சொல், எனவே 'such' சரி. ஒரு பெயர்ச்சொல் பின்வந்தால் 'such' பயன்படுத்துங்கள்; ஒரு பெயரடை அல்லது வினையடை மட்டும் பின்வந்தால் 'so' பயன்படுத்துங்கள்.",
  tl:"SO oru peyaradaiyai edukkiradhu, SUCH oru peyarcholai edukkiradhu. 'SO hot' — 'hot' oru peyaradai. 'SUCH a hot day' — 'day' oru peyarchol."},
 {h:"TOO already contains the negative",
  en:"'He is TOO tired TO walk' means 'he is so tired that he CANNOT walk'. The negative is inside 'too'. So 'too tired to not walk' is a double negative, and 'too tired that he cannot walk' mixes two different structures.",
  ta:"TOO-ல் ஏற்கனவே எதிர்மறை உள்ளது. 'He is TOO tired TO walk' என்றால் 'அவர் மிகவும் களைப்பாக இருப்பதால் நடக்க முடியாது'. எதிர்மறை 'too'-க்குள் இருக்கிறது. எனவே 'too tired to not walk' ஒரு இரட்டை எதிர்மறை, மேலும் 'too tired that he cannot walk' இரண்டு வெவ்வேறு அமைப்புகளைக் கலக்குகிறது.",
  tl:"TOO-l erkanave edhirmarai ulladhu. 'He is TOO tired TO walk' endraal 'avar migavum kalaippaaga iruppadhaal nadakka mudiyaadhu'. Edhirmarai 'too'-kkul irukkiradhu."},
 {h:"VERY is positive, TOO is negative",
  en:"'He is VERY tired but he can walk' — 'very' is neutral or positive. 'He is TOO tired to walk' — 'too' means excessively, with a bad result. Never use 'too' where you simply mean 'very'.",
  ta:"VERY நேர்மறை, TOO எதிர்மறை. 'He is VERY tired but he can walk' — 'very' நடுநிலை அல்லது நேர்மறை. 'He is TOO tired to walk' — 'too' என்றால் அதிகப்படியாக, ஒரு மோசமான விளைவுடன். வெறுமனே 'very' என்று அர்த்தப்படுத்தும்போது 'too' பயன்படுத்தாதீர்கள்.",
  tl:"VERY nermarai, TOO edhirmarai. 'He is VERY tired but he can walk'. 'He is TOO tired to walk' — 'too' endraal adhigappadiyaaga, oru mosamaana vilaivudan."},
 {h:"Converting between the two structures",
  en:"'He is too weak to lift it' = 'He is so weak that he cannot lift it'. SSC often asks you to transform one into the other. When you convert 'too … to' into 'so … that', you must ADD the 'cannot'.",
  ta:"இரண்டு அமைப்புகளுக்கு இடையே மாற்றுதல். 'He is too weak to lift it' = 'He is so weak that he cannot lift it'. SSC அடிக்கடி ஒன்றை மற்றொன்றாக மாற்றச் சொல்கிறது. 'Too … to'-ஐ 'so … that'-ஆக மாற்றும்போது, நீங்கள் 'cannot' சேர்க்க வேண்டும்.",
  tl:"Irandu amaippugalukku idaiye maatrudhal. 'He is too weak to lift it' = 'He is so weak that he cannot lift it'. 'Too … to'-ai 'so … that'-aaga maatrumbodhu, neengal 'cannot' serkka vendum."}],

 s3:[
 {h:"Look at what follows",
  d:"   SO   + ADJECTIVE / ADVERB + THAT\n     He is SO tired THAT he cannot walk.\n            ↑ adjective\n\n   SUCH + A/AN + adjective + NOUN + THAT\n     It was SUCH a hot day THAT we stayed in.\n                        ↑ noun\n\n   Is there a NOUN after it?\n     yes → SUCH      no → SO"},
 {h:"TOO hides a 'cannot'",
  d:"   He is TOO tired TO walk.\n            ↑\n   = He is SO tired THAT he CANNOT walk.\n                              ↑\n                     the negative lives inside 'too'\n\n   ✘ too tired THAT he cannot walk\n   ✘ too tired TO NOT walk\n   ✘ too tired to walk that he stopped"},
 {h:"VERY versus TOO",
  d:"   VERY  →  neutral, no bad result\n     He is VERY tired, but he can walk.\n\n   TOO   →  excessive, with a BAD result\n     He is TOO tired to walk.\n\n   ⚠ THE CONVERSION:\n     TOO … TO  ⟷  SO … THAT … CANNOT\n     too weak to lift it\n       = so weak that he CANNOT lift it"}],

 s4:{
 wrong:["\"'Such hot that' and 'so hot that' are the same.\" — 'Such' needs a noun after it.",
  "\"'Too tired that he cannot walk' is complete.\" — 'Too' takes 'to', not 'that'.",
  "\"'Too' and 'very' mean the same.\" — 'Too' implies a bad result.",
  "\"'Too tired to not walk' adds emphasis.\" — It is a double negative."],
 right:["Look at the word after: a noun → such, an adjective → so.",
  "'Too' is completed by 'to', never by 'that'.",
  "'Too' already means 'so … that … cannot'.",
  "Use 'very' when there is no bad result."]},

 s5:[
 {en:"He is so tired that he cannot walk any further.",ta:"அவர் மிகவும் களைப்பாக இருப்பதால் இனி நடக்க முடியாது.",tl:"Avar migavum kalaippaaga iruppadhaal ini nadakka mudiyaadhu.",note:"SO + adjective + THAT."},
 {en:"It was such a hot day that we stayed indoors.",ta:"அவ்வளவு வெப்பமான நாளாக இருந்ததால் நாங்கள் வீட்டிற்குள்ளேயே இருந்தோம்.",tl:"Avvalavu veppamaana naalaaga irundhadhaal naangal veettirkulleye irundhom.",note:"SUCH + a + adjective + noun + THAT."},
 {en:"He is too tired to walk any further.",ta:"அவர் இனி நடக்க முடியாத அளவுக்குக் களைப்பாக இருக்கிறார்.",tl:"Avar ini nadakka mudiyaadha alavukkuk kalaippaaga irukkiraar.",note:"TOO + adjective + TO — the same meaning as the first sentence."},
 {en:"She spoke so softly that nobody could hear her.",ta:"அவர் மிக மெதுவாகப் பேசியதால் யாராலும் கேட்க முடியவில்லை.",tl:"Avar miga medhuvaagap pesiyadhaal yaaraalum ketka mudiyavillai.",note:"SO + adverb + THAT."},
 {en:"He is very tired, but he can still walk.",ta:"அவர் மிகவும் களைப்பாக இருக்கிறார், ஆனாலும் நடக்க முடியும்.",tl:"Avar migavum kalaippaaga irukkiraar, aanaalum nadakka mudiyum.",note:"VERY — no bad result, so 'too' would be wrong."}],

 s9:[
 "Fill in the Blank|It was ____ an interesting lecture that nobody left the hall before it ended.|so;such|1|SUCH comes before a noun phrase.",
 "Find the Error|The old man was (A) too weak that he (B) could not climb (C) the steep staircase (D).|A;B;C;D|1|Part B. TOO is completed by TO → 'too weak to climb'.",
 "Sentence Improvement|The instructions were so complicated that most of the candidates could not follow them.|so complicated that;such complicated that;too complicated that|0|SO is correct before the adjective 'complicated'.",
 "Fill in the Blank|The tea was far ____ hot for the child to drink without burning his tongue.|so;too|1|'Too … for … to' expresses a negative result.",
 "Find the Error|She spoke in (A) so soft a manner (B) that nobody sitting (C) at the back could hear (D).|A;B;C;D|1|Part B. Before the noun phrase 'a soft voice', use SUCH → 'such a soft voice'."],

 s10:{
  en:"Three structures overlap here and the exam mixes them. 'Such hot' and 'so a hot day' are the swap errors. 'Too tired that he cannot walk' fuses 'too…to' with 'so…that' and produces a double negative, because 'too' already means 'cannot'. And 'too' used where 'very' is meant appears in Sentence Improvement.",
  ta:"மூன்று அமைப்புகள் இங்கே ஒன்றுடன் ஒன்று மேவுகின்றன, தேர்வு அவற்றைக் கலக்குகிறது. 'Such hot' மற்றும் 'so a hot day' மாற்றுத் தவறுகள். 'Too tired that he cannot walk' 'too…to'-ஐ 'so…that'-உடன் இணைத்து ஒரு இரட்டை எதிர்மறையை உருவாக்குகிறது, ஏனெனில் 'too' ஏற்கனவே 'cannot' என்று பொருள்படுகிறது. மேலும் 'very' அர்த்தப்படுத்தும் இடத்தில் 'too' பயன்படுத்துவது Sentence Improvement-ல் வருகிறது.",
  tl:"Moondru amaippugal inge ondrudan ondru mevugindrana, thervu avatraik kalakkugiradhu. 'Too tired that he cannot walk' oru irattai edhirmaraiyai uruvaakkugiradhu, yenenil 'too' erkanave 'cannot' endru porulpadugiradhu."},

 s11:{
  en:"A NOUN after it → SUCH. Only an adjective → SO. TOO already means 'cannot'.",
  ta:"அதற்குப் பின் ஒரு பெயர்ச்சொல் → SUCH. ஒரு பெயரடை மட்டும் → SO. TOO ஏற்கனவே 'cannot' என்று பொருள்படுகிறது.",
  tl:"Adharkup pin oru peyarchol → SUCH. Oru peyaradai mattum → SO. TOO erkanave 'cannot' endru porulpadugiradhu.",
  vis:"      THREE STRUCTURES\n\n   SO   + adjective/adverb + THAT\n     He is SO tired THAT he cannot walk.\n\n   SUCH + a/an + adj + NOUN + THAT\n     It was SUCH a hot day THAT we stayed in.\n\n   TOO  + adjective + TO + V1\n     He is TOO tired TO walk.\n\n   ⚠ THE TEST:\n     Is there a NOUN after it?\n       yes → SUCH        no → SO\n\n   ⚠ 'TOO' ALREADY MEANS 'CANNOT':\n     too tired TO walk\n       = so tired THAT he CANNOT walk\n\n     ✘ too tired THAT he cannot walk\n     ✘ too tired TO NOT walk\n\n   ⚠ VERY = no bad result\n     TOO  = excessive, bad result"},

 s13:[
 "It was ____ a hot day that we stayed in, and nobody ____ willing to go out.|such-was;so-were;such-were|0|SUCH before a noun phrase. 'Nobody' is singular → WAS.",
 "He is ____ tired ____ walk, which means he is ____ tired that he cannot walk.|too-to-so;so-that-too;too-that-so|0|TOO + TO. The equivalent is SO + THAT + CANNOT.",
 "She spoke ____ softly that neither the boys ____ the girls ____ hear her.|so-nor-could;such-or-could;so-or-could|0|SO before an adverb. NEITHER pairs with NOR (Rule 86). Past ability → COULD.",
 "The tea was ____ hot ____ drink, so we waited until it ____ .|too-to-cooled;so-that-cooled;too-that-cooled|0|TOO + TO. The until-clause takes the past here → COOLED (Rule 90).",
 "It was ____ an easy paper that all passed, although the reason ____ ____ they had prepared well.|such-is-that;so-is-because;such-was-because|0|SUCH before a noun phrase. 'The reason … is THAT' (Rule 91)."],

 s14:{
  rule:"SO goes before an adjective or adverb, SUCH before a noun phrase, and both take THAT. TOO takes TO and already means 'cannot'.",
  formula:"SO + adjective/adverb + THAT\nSUCH + a/an + adjective + noun + THAT\nTOO + adjective + TO + V1 (negative result)\nTOO … TO = SO … THAT … CANNOT\nVERY = no bad result | TOO = excessive",
  memory:"A noun after it means SUCH. Only an adjective means SO. TOO already means CANNOT.",
  ta:"அப்பறம் பெயர்ச்சொல் இருந்தா SUCH. பெயரடை மட்டும்னா SO. TOO-லயே 'cannot' இருக்கு.",
  tl:"Apparam peyarchol irundhaa SUCH. Peyaradai mattumnaa SO. TOO-layae 'cannot' irukku.",
  mistake:"Writing 'such hot that', 'so a hot day' and 'too tired that he cannot walk'.",
  exam:"SSC CGL / CHSL and Bank — appears in Sentence Improvement and in transformation questions."},

 s15:[
 {ta:"நாம Conjunctions module-ஓட கடைசி rule-க்கு வந்துட்டோம். இதுல மூணு அமைப்பு இருக்கு — SO…THAT, SUCH…THAT, TOO…TO. இந்த மூணும் ஒன்னோட ஒன்னு குழம்பும், அதனாலதான் SSC இதை விரும்புது.",
  tl:"Naama Conjunctions module-oda kadaisi rule-kku vandhuttom. Idhula moonu amaippu irukku — SO…THAT, SUCH…THAT, TOO…TO. Indha moonum onnoda onnu kuzhambum."},
 {ta:"முதல்ல SO மற்றும் SUCH. வித்தியாசம் ரொம்ப எளிது — அப்பறம் என்ன வருதுன்னு பாருங்க. 'He is SO tired' — 'tired' ஒரு பெயரடை. 'It was SUCH a hot day' — 'day' ஒரு பெயர்ச்சொல்!",
  tl:"Mudhalla SO matrum SUCH. Viththiyaasam romba eladhu — apparam enna varudhunnu paarunga. 'He is SO tired' — 'tired' oru peyaradai. 'It was SUCH a hot day' — 'day' oru peyarchol!"},
 {ta:"அப்பறம் பெயர்ச்சொல் இருந்தா SUCH. பெயரடை அல்லது வினையடை மட்டும் இருந்தா SO. இது ஒரு நொடியில முடிவு பண்ணலாம். 'so a hot day' — தப்பு. 'such hot' — தப்பு.",

 {ta:"இப்போ மூணாவது அமைப்பு — TOO…TO. இது கொஞ்சம் தனி. 'He is TOO tired TO walk.' இதுல ஒரு எதிர்மறை ஒளிஞ்சிருக்கு! 'Too tired to walk' அப்படின்னா 'நடக்க முடியாத அளவுக்கு களைப்பா இருக்காரு'.",
  tl:"Ippo moonaavadhu amaippu — TOO…TO. Idhu konjam thani. 'He is TOO tired TO walk.' Idhula oru edhirmarai olinjirukku! 'Nadakka mudiyaadha alavukku kalaippaa irukkaaru'."},
 {ta:"அதனால 'He is TOO tired THAT he cannot walk' — தப்பு! ரெண்டு காரணம். ஒண்ணு — 'too' -க்கு 'to' தான் வரணும், 'that' இல்ல. ரெண்டு — 'too'-லயே 'cannot' இருக்கு, மறுபடி 'cannot' போட்டா இரட்டை எதிர்மறை.",
  tl:"Adhanaala 'He is TOO tired THAT he cannot walk' — thappu! Rendu kaaranam. Onnu — 'too'-kku 'to' thaan varanum. Rendu — 'too'-layae 'cannot' irukku."},
 {ta:"கடைசியா ஒரு முக்கியமான வித்தியாசம் — VERY மற்றும் TOO. 'He is VERY tired, but he can walk' — 'very' நடுநிலை, மோசமான விளைவு இல்ல. 'He is TOO tired to walk' — 'too' அப்படின்னா 'அளவுக்கு அதிகமா', மோசமான விளைவு இருக்கு. மேலும் மாற்றம் தெரிஞ்சுக்கோங்க: 'too weak to lift it' = 'so weak that he CANNOT lift it'. SSC இதை மாத்திச் சொல்லச் சொல்லும். இதோட எட்டு rule-ம் முடிஞ்சது — Conjunctions module complete!",
  tl:"Kadaisiyaa oru mukkiyamaana viththiyaasam — VERY matrum TOO. 'He is VERY tired, but he can walk'. 'He is TOO tired to walk' — 'too' appadinnaa 'alavukku adhigamaa'. Melum maatram therinjukkonga: 'too weak to lift it' = 'so weak that he CANNOT lift it'."}]}

/* ================== ENGINE ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[
 ["What is the Rule?","விதி என்ன? · Vidhi enna?"],
 ["Why does this rule exist?","ஏன் இந்த விதி? · Yen indha vidhi?"],
 ["Visual Diagram","படம் மூலம் புரிதல் · Padam moolam purithal"],
 ["Wrong Thinking vs Right Thinking","தவறான சிந்தனை · Thavaraana sinthanai"],
 ["Tamil Translation of Examples","உதாரணங்களின் தமிழ் · Udhaaranangalin Tamil"],
 ["Word-by-Word Meaning","சொல்லுக்குச் சொல் · Sollukku sol"],
 ["Solved Examples — Easy to Hard","தீர்க்கப்பட்ட உதாரணங்கள்"],
 ["Wrong vs Correct","தவறு vs சரி · Thavaru vs Sari"],
 ["SSC / Bank PYQ Style","முந்தைய வினாத்தாள் பாணி"],
 ["Exam Trap","தேர்வு பொறி · Thervu pori"],
 ["Memory Trick","நினைவு உத்தி · Ninaivu utthi"],
 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],
 ["Challenge Round","சவால் சுற்று · Savaal sutru"],
 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],
 ["Centu AI Explains","சென்டு AI விளக்கம்"]
];

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-conjunctions', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
