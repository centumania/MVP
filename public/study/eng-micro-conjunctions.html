<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Conjunctions — 8 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="logo">CentuMania</div>
  <h2>Conjunctions — Joining &amp; Balance</h2>
  <div class="msub">Module 8 · 8 Micro-Classes · Rules 86–93</div>
  <div class="rlist" id="rlist"></div>
</aside>
<main>
  <div class="top">
    <h1 id="tt"></h1>
    <span class="badge" id="tdiff"></span>
    <span class="mono" id="trc"></span>
    <div class="navbtns">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn" id="allopen">Open all steps</button>
      <button class="btn pri" id="next">Next →</button>
    </div>
    <div class="tta" id="tta"></div>
  </div>
  <div class="body" id="body"></div>
  <footer>CentuMania · Conjunctions Micro-Classes · 15-step teaching format · Tamil + Tanglish</footer>
</main>
</div>

<script>
/* ============ COMPACT DATA FORMAT ============
   s7  solved examples : "sentence|answer|Level|why"
   s8  wrong vs right  : "wrong|correct|why"
   s9  PYQ             : "Type|question|optA;optB;optC|ansIdx|solution"
   s12 practice        : "sentence with ____|optA;optB|ansIdx"
   s13 challenge       : "question|optA;optB;optC|ansIdx|solution"
   s6  word-by-word    : "word|tamil|tanglish"
============================================== */
const RULES=[
/* ========== RULE 86 ========== */
{n:86,rc:"CON-01",d:"Medium",t:"Correlative Conjunctions must be used in their CORRECT PAIRS",
 tam:"Either...or · Neither...nor · Both...and — ஜோடி மாறக்கூடாது",
 s1:{en:"Correlative conjunctions come in FIXED PAIRS that can never be mixed: EITHER…OR, NEITHER…NOR, BOTH…AND, NOT ONLY…BUT ALSO, WHETHER…OR, SO…THAT, SUCH…THAT, HARDLY…WHEN, SCARCELY…WHEN, NO SOONER…THAN.",
  ta:"இணைச் சொற்கள் நிலையான ஜோடிகளாக வருகின்றன, அவற்றை ஒருபோதும் கலக்க முடியாது: EITHER…OR, NEITHER…NOR, BOTH…AND, NOT ONLY…BUT ALSO, WHETHER…OR, SO…THAT, SUCH…THAT, HARDLY…WHEN, SCARCELY…WHEN, NO SOONER…THAN.",
  tl:"Inaich sorkal nilaiyaana jodigalaaga varugindrana, avatrai orupodhum kalakka mudiyaadhu: EITHER…OR, NEITHER…NOR, BOTH…AND, NOT ONLY…BUT ALSO, WHETHER…OR, HARDLY…WHEN, NO SOONER…THAN.",
  formula:"THE TEN FIXED PAIRS\n\n  EITHER ……… OR          NEITHER ……… NOR\n  BOTH ……… AND          NOT ONLY ……… BUT ALSO\n  WHETHER ……… OR        SO ……… THAT\n  SUCH ……… THAT         HARDLY ……… WHEN\n  SCARCELY ……… WHEN     NO SOONER ……… THAN\n\n⚠ NEVER MIX:\n  either … nor   ✘      neither … or   ✘\n  both … as well as ✘   no sooner … when ✘"},

 s2:[
 {h:"Each pair is one grammatical unit",
  en:"'Either…or' is not two separate words — it is a single frame with a gap in the middle. Breaking the frame breaks the sentence. Once you write 'either', the word 'or' is already decided for you.",
  ta:"ஒவ்வொரு ஜோடியும் ஒரு இலக்கண அலகு. 'Either…or' இரண்டு தனித்தனி சொற்கள் அல்ல — அது நடுவில் ஒரு இடைவெளியுடன் கூடிய ஒரே ஒரு சட்டகம். சட்டகத்தை உடைத்தால் வாக்கியம் உடைகிறது. நீங்கள் 'either' எழுதியவுடன், 'or' என்ற சொல் ஏற்கனவே உங்களுக்காகத் தீர்மானிக்கப்பட்டுவிட்டது.",
  tl:"Ovvoru jodiyum oru ilakkana alagu. 'Either…or' irandu thanithani sorkal alla — adhu naduvil oru idaiveliyudan koodiya ore oru sattagam. Neengal 'either' ezhudhiyavudan, 'or' endra sol erkanave theermaanikkappattuvittadhu."},
 {h:"The letter clue for EITHER and NEITHER",
  en:"EithEr goes with Or. NeitheR goes with NoR. Both halves of the negative pair start with N — Neither…Nor. That single observation solves the most tested pair in the module.",
  ta:"EITHER மற்றும் NEITHER-க்கான எழுத்துக் குறிப்பு. EithEr, Or-உடன் செல்கிறது. NeitheR, NoR-உடன் செல்கிறது. எதிர்மறை ஜோடியின் இரு பாதிகளும் N-ல் தொடங்குகின்றன — Neither…Nor. அந்த ஒரே கவனிப்பு module-ல் மிக அதிகமாகச் சோதிக்கப்படும் ஜோடியைத் தீர்க்கிறது.",
  tl:"EITHER matrum NEITHER-kkaana ezhuththuk kurippu. EithEr, Or-udan selgiradhu. NeitheR, NoR-udan selgiradhu. Edhirmarai jodiyin iru paadhigalum N-l thodangugindrana — Neither…Nor."},
 {h:"BOTH pairs only with AND",
  en:"'Both Ram AS WELL AS Shyam' is wrong, even though it sounds emphatic. 'Both' has only one partner: AND. This gets its own micro-class in Rule 92 because the error is so common.",
  ta:"BOTH AND-உடன் மட்டுமே ஜோடி சேரும். 'Both Ram AS WELL AS Shyam' தவறு, அது வலியுறுத்துவது போலத் தோன்றினாலும். 'Both'-க்கு ஒரே ஒரு துணைதான்: AND. இந்தத் தவறு மிகவும் பொதுவானது என்பதால் Rule 92-ல் இதற்குத் தனி micro-class உண்டு.",
  tl:"BOTH AND-udan mattume jodi serum. 'Both Ram AS WELL AS Shyam' thavaru. 'Both'-kku ore oru thunaidhaan: AND. Indhath thavaru migavum podhuvaanadhu enbadhaal Rule 92-l idharkuth thani micro-class undu."},
 {h:"These pairs also control the verb",
  en:"With either…or and neither…nor, the verb agrees with the NEAREST subject — 'Either Ram or his friends ARE coming'. That is SVA Rule 35. The conjunction and the verb are always tested together.",
  ta:"இந்த ஜோடிகள் வினைச்சொல்லையும் கட்டுப்படுத்துகின்றன. either…or மற்றும் neither…nor-உடன், வினைச்சொல் அருகில் இருக்கும் Subject-உடன் ஒத்துப்போகிறது — 'Either Ram or his friends ARE coming'. அதுதான் SVA Rule 35. இணைச்சொல்லும் வினைச்சொல்லும் எப்போதும் சேர்ந்தே சோதிக்கப்படுகின்றன.",
  tl:"Indha jodigal vinaicholaiyum kattuppaduththugindrana. either…or matrum neither…nor-udan, vinaichol arugil irukkum Subject-udan oththuppogiradhu. Adhudhaan SVA Rule 35."}],

 s3:[
 {h:"A frame with a gap",
  d:"   EITHER ………………… OR\n     ↑                  ↑\n   one frame, one gap in the middle\n\n   Once you write EITHER,\n   the second half is already fixed.\n\n   Either Ram ……… OR his brother.  ✔\n   Either Ram ……… NOR his brother. ✘"},
 {h:"The ten fixed pairs",
  d:"   EITHER    ─────►  OR\n   NEITHER   ─────►  NOR\n   BOTH      ─────►  AND\n   NOT ONLY  ─────►  BUT ALSO\n   WHETHER   ─────►  OR\n   SO        ─────►  THAT\n   SUCH      ─────►  THAT\n   HARDLY    ─────►  WHEN\n   SCARCELY  ─────►  WHEN\n   NO SOONER ─────►  THAN"},
 {h:"The letter clue",
  d:"   EithE r  ──►  O r      (both end in R after a vowel)\n   N eitheR ──►  N oR     (BOTH START WITH N)\n\n   The negative pair is the easy one:\n   N goes with N.\n\n   ⚠ THE FOUR PLANTED ERRORS:\n     either … nor       ✘\n     neither … or       ✘\n     both … as well as  ✘\n     no sooner … when   ✘"}],

 s4:{

  "\"'Both Ram as well as Shyam' is more emphatic.\" — 'Both' takes only 'and'.",

  "\"The second half of the pair does not matter much.\" — It is exactly what the exam tests."],
 right:["Once you see the first half, the second half is already decided.",

 s5:[

 {en:"Neither the teacher nor the students were present.",ta:"ஆசிரியரும் இல்லை, மாணவர்களும் இல்லை.",tl:"Aasiriyarum illai, maanavargalum illai.",note:"NEITHER pairs with NOR."},
 {en:"Both the students and the teacher were praised.",ta:"மாணவர்களும் ஆசிரியரும் இருவரும் பாராட்டப்பட்டனர்.",tl:"Maanavargalum aasiriyarum iruvarum paaraattappattanar.",note:"BOTH pairs only with AND."},
 {en:"Not only did he fail, but he also lost interest.",ta:"அவர் தோல்வியடைந்தது மட்டுமல்ல, ஆர்வத்தையும் இழந்தார்.",tl:"Avar tholviyadaindhadhu mattumalla, aarvaththaiyum izhandhaar.",note:"NOT ONLY pairs with BUT ALSO."},
 {en:"No sooner had he arrived than it began to rain.",ta:"அவர் வந்தவுடனேயே மழை பெய்யத் தொடங்கியது.",tl:"Avar vandhavudaneye mazhai peyyath thodangiyadhu.",note:"NO SOONER pairs with THAN."}],

 s6:["either...or|இரண்டில் ஒன்று|Irandil ondru",

 s7:[
 "Either he ____ his brother will come.|or|Easy|EITHER pairs with OR.",
 "Neither the teacher ____ the students came.|nor|Easy|NEITHER pairs with NOR.",
 "Both the boys ____ the girls were praised.|and|Easy|BOTH pairs with AND.",
 "Not only did he fail ____ he also gave up.|but|Easy|NOT ONLY pairs with BUT ALSO.",

 "Hardly had she spoken ____ the bell rang.|when|Medium|HARDLY pairs with WHEN.",
 "I do not know whether he will come ____ not.|or|Medium|WHETHER pairs with OR.",
 "He is ____ tall that he can touch the roof.|so|Medium|SO pairs with THAT before an adjective.",
 "It was ____ a hot day that we stayed in.|such|Hard|SUCH pairs with THAT before a noun phrase.",
 "Scarcely had we sat down ____ it started.|when|Hard|SCARCELY pairs with WHEN.",
 "Neither Ram ____ Shyam was selected.|nor|Hard|NEITHER pairs with NOR.",
 "Either you apologise ____ you leave.|or|Hard|EITHER pairs with OR.",
 "Not only the players ____ also the coach came.|but|Expert|NOT ONLY pairs with BUT ALSO.",
 "Both hard work ____ luck matter in life.|and|Expert|BOTH pairs only with AND.",
 "No sooner did the bell ring ____ we ran out.|than|Expert|NO SOONER pairs with THAN."],

 s8:[
 "Either he nor his brother will come.|Either he or his brother will come.|EITHER pairs with OR.",
 "Neither the teacher or the students came.|Neither the teacher nor the students came.|NEITHER pairs with NOR.",
 "Both the boys as well as the girls were praised.|Both the boys and the girls were praised.|BOTH pairs only with AND.",
 "Not only he failed but also lost interest.|Not only did he fail but he also lost interest.|NOT ONLY needs inversion and BUT ALSO.",
 "No sooner had he arrived when it rained.|No sooner had he arrived than it rained.|NO SOONER pairs with THAN.",
 "Hardly had she spoken than the bell rang.|Hardly had she spoken when the bell rang.|HARDLY pairs with WHEN.",
 "I do not know whether he will come and not.|I do not know whether he will come or not.|WHETHER pairs with OR.",
 "He is such tall that he can touch the roof.|He is so tall that he can touch the roof.|SO comes before an adjective.",
 "It was so a hot day that we stayed in.|It was such a hot day that we stayed in.|SUCH comes before a noun phrase.",
 "Scarcely had we sat down than it started.|Scarcely had we sat down when it started.|SCARCELY pairs with WHEN."],

 s9:[
 "Fill in the Blank|Neither the principal ____ the teachers were informed about the sudden change.|or;nor|1|NEITHER pairs with NOR.",
 "Find the Error|Both the senior officers (A) as well as the clerks (B) were present (C) at the meeting (D).|A;B;C;D|1|Part B. BOTH pairs only with AND.",
 "Sentence Improvement|No sooner had the results been declared when the students started celebrating.|when the students;than the students;then the students|1|NO SOONER pairs with THAN.",
 "Fill in the Blank|Either you complete the assignment today ____ you face the consequences.|nor;or|1|EITHER pairs with OR.",
 "Find the Error|Hardly had he reached (A) the platform than (B) the train started (C) moving slowly (D).|A;B;C;D|1|Part B. HARDLY pairs with WHEN."],

 s10:{
  en:"The exam almost never gives you the first half wrong — it swaps the SECOND half. 'Either…nor' and 'neither…or' look balanced because both contain a negative feel. 'No sooner…when' feels natural because 'when' is the common time word. The paper counts on you reading the first half quickly and not checking the partner.",
  ta:"தேர்வு முதல் பாதியை கிட்டத்தட்ட ஒருபோதும் தவறாகத் தருவதில்லை — அது இரண்டாவது பாதியை மாற்றுகிறது. 'Either…nor' மற்றும் 'neither…or' சமநிலையாகத் தெரிகின்றன, ஏனெனில் இரண்டிலும் ஒரு எதிர்மறை உணர்வு இருக்கிறது. 'No sooner…when' இயற்கையாகத் தோன்றுகிறது, ஏனெனில் 'when' பொதுவான நேரச் சொல். நீங்கள் முதல் பாதியை வேகமாகப் படித்து துணையைச் சரிபார்க்க மாட்டீர்கள் என்று தேர்வுத்தாள் நம்புகிறது.",
  tl:"Thervu mudhal paadhiyai kittaththatta orupodhum thavaraagath tharuvadhillai — adhu irandaavadhu paadhiyai maatrugiradhu. 'Either…nor' matrum 'neither…or' samanilaiyaagath therigindrana."},

 s11:{
  en:"ONCE YOU SEE THE FIRST HALF, THE SECOND IS ALREADY DECIDED. Neither…Nor — both start with N.",
  ta:"முதல் பாதியைப் பார்த்தவுடன், இரண்டாவது ஏற்கனவே தீர்மானிக்கப்பட்டுவிட்டது. Neither…Nor — இரண்டும் N-ல் தொடங்கும்.",
  tl:"Mudhal paadhiyaip paarththavudan, irandaavadhu erkanave theermaanikkappattuvittadhu. Neither…Nor — irandum N-l thodangum.",
  vis:"      THE TEN FIXED PAIRS\n\n   EITHER    ─────►  OR\n   NEITHER   ─────►  NOR   ← both start with N\n   BOTH      ─────►  AND\n   NOT ONLY  ─────►  BUT ALSO\n   WHETHER   ─────►  OR\n   SO        ─────►  THAT\n   SUCH      ─────►  THAT\n   HARDLY    ─────►  WHEN\n   SCARCELY  ─────►  WHEN\n   NO SOONER ─────►  THAN  ← 'sooner' is a comparative\n\n   ⚠ THE FOUR PLANTED ERRORS:\n     either…nor · neither…or\n     both…as well as · no sooner…when\n\n   ⚠ THE VERB FOLLOWS THE NEAREST SUBJECT\n     (SVA Rule 35)"},

 s13:[
 "Either Ram or his friends ____ coming, and neither of them ____ informed us.|are-has;is-have;are-have|0|'Either…or' takes the nearest subject → ARE (SVA Rule 35). 'Neither of' is fixed singular → HAS (SVA Rule 50).",
 "Neither the teacher ____ the students ____ present when the inspector ____ .|nor-were-arrived;or-was-arrived;nor-was-arrived|0|NEITHER pairs with NOR. Nearest subject 'students' → WERE. Past → ARRIVED.",
 "No sooner had he entered ____ the lights went off, and hardly had we moved ____ it grew dark.|than-when;when-than;than-than|0|NO SOONER pairs with THAN. HARDLY pairs with WHEN.",
 "Both the principal ____ the vice-principal ____ present, and each of them ____ a speech.|and-were-made;as well as-was-made;and-was-made|0|BOTH pairs with AND. Two people → WERE. 'Each of' is singular → MADE.",
 "It was ____ a hot day that we stayed indoors, and it was ____ hot that nobody ____ out.|such-so-went;so-such-went;such-such-went|0|SUCH before a noun phrase. SO before an adjective. 'Nobody' is singular → WENT."],

 s14:{
  rule:"Correlative conjunctions come in fixed pairs that can never be mixed.",
  formula:"EITHER…OR · NEITHER…NOR · BOTH…AND\nNOT ONLY…BUT ALSO · WHETHER…OR\nSO…THAT · SUCH…THAT\nHARDLY…WHEN · SCARCELY…WHEN · NO SOONER…THAN",
  memory:"Neither…Nor — both start with N. Once you see the first half, the second is fixed.",
  ta:"Neither…Nor — ரெண்டும் N-ல ஆரம்பிக்கும். முதல் பாதி பார்த்தா ரெண்டாவது நிச்சயம்.",
  tl:"Neither…Nor — rendum N-la aarambikkum. Mudhal paadhi paarththaa randaavadhu nichchayam.",
  mistake:"Writing 'either…nor', 'neither…or', 'both…as well as' and 'no sooner…when'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — the second half of the pair is what is always swapped."},

 s15:[
 {ta:"Conjunctions module-ஐ ஆரம்பிக்கலாம். இந்த முதல் rule ரொம்ப எளிமையானது, ஆனா SSC-ல அடிக்கடி வரும். இணைச் சொற்கள் ஜோடியா வரும், அந்த ஜோடி மாறவே கூடாது.",
  tl:"Conjunctions module-ai aarambikkalaam. Indha mudhal rule romba elimaiyaanadhu, aanaa SSC-la adikkadi varum. Inaich sorkal jodiyaa varum, andha jodi maarave koodaadhu."},
 {ta:"பத்து ஜோடி இருக்கு. Either…or. Neither…nor. Both…and. Not only…but also. Whether…or. So…that. Such…that. Hardly…when. Scarcely…when. No sooner…than.",
  tl:"Paththu jodi irukku. Either…or. Neither…nor. Both…and. Not only…but also. Whether…or. So…that. Such…that. Hardly…when. Scarcely…when. No sooner…than."},
 {ta:"இதை ஒரு சட்டகம் (frame) மாதிரி நினைச்சுக்கோங்க. 'Either ……… or' — இது ஒரே ஒரு அமைப்பு, நடுவுல ஒரு இடைவெளி. நீங்க 'either' எழுதிட்டீங்கன்னா, 'or' ஏற்கனவே முடிவாயிடுச்சு. வேற தேர்வு இல்ல.",
  tl:"Idhai oru sattagam (frame) maadhiri ninaichukkonga. 'Either ……… or' — idhu ore oru amaippu, naduvula oru idaiveli. Neenga 'either' ezhudhitteengannaa, 'or' erkanave mudivaayiduchu."},
 {ta:"இப்போ SSC-ஓட தந்திரம் சொல்லுறேன். அவங்க முதல் பாதியை தப்பா தர மாட்டாங்க. அவங்க ரெண்டாவது பாதியை மாத்துவாங்க! 'Either Ram NOR Shyam' — 'either' சரி, ஆனா 'nor' தப்பு. 'Neither Ram OR Shyam' — 'neither' சரி, ஆனா 'or' தப்பு.",
  tl:"Ippo SSC-oda thandhiram solluren. Avanga mudhal paadhiyai thappaa thara maattaanga. Avanga randaavadhu paadhiyai maaththuvaanga! 'Either Ram NOR Shyam' — 'either' sari, aanaa 'nor' thappu."},
 {ta:"ஒரு எளிய நினைவு உத்தி சொல்லுறேன். NeitheR மற்றும் NoR — ரெண்டுமே N-ல ஆரம்பிக்குது! எதிர்மறை ஜோடி — N-க்கு N. இதை ஒரு தடவ புரிஞ்சுக்கிட்டா, மறக்கவே மறக்காது. EithEr-க்கு Or.",
  tl:"Oru eliya ninaivu utthi solluren. NeitheR matrum NoR — rendume N-la aarambikkudhu! Edhirmarai jodi — N-kku N. Idhai oru thadava purinjukkittaa, marakkave marakkaadhu."},
 {ta:"கடைசியா ஒரு முக்கியமான இணைப்பு. இந்த ஜோடிகள் வினைச்சொல்லையும் கட்டுப்படுத்துது! 'Either Ram or his friends ARE coming' — verb அருகில் இருக்கிற subject-ஐ பார்த்து வரும். இது நீங்க SVA module-ல Rule 35-ல படிச்சது. SSC ஒரே கேள்வியில ஜோடியையும் verb-ஐயும் சேர்த்து சோதிக்கும். ரெண்டையும் பாருங்க.",
  tl:"Kadaisiyaa oru mukkiyamaana inaippu. Indha jodigal vinaicholaiyum kattuppaduththudhu! 'Either Ram or his friends ARE coming' — verb arugil irukkira subject-ai paarththu varum. Idhu neenga SVA module-la Rule 35-la padichadhu."}]},

/* ========== RULE 87 ========== */
{n:87,rc:"CON-02",d:"Hard",t:"PARALLEL STRUCTURE after Correlatives",
 tam:"இணைச் சொல்லுக்குப் பின் ஒரே இலக்கண வகை வர வேண்டும்",
 s1:{en:"The words following EACH HALF of a correlative pair must belong to the SAME grammatical class — noun with noun, verb with verb, adjective with adjective, phrase with phrase. This balance is called PARALLELISM.",
  ta:"ஒரு இணைச் சொல் ஜோடியின் ஒவ்வொரு பாதிக்குப் பின்னும் வரும் சொற்கள் ஒரே இலக்கண வகையைச் சேர்ந்திருக்க வேண்டும் — பெயர்ச்சொல்லுடன் பெயர்ச்சொல், வினைச்சொல்லுடன் வினைச்சொல், பெயரடையுடன் பெயரடை, தொடருடன் தொடர். இந்தச் சமநிலை PARALLELISM எனப்படுகிறது.",
  tl:"Oru inaich sol jodiyin ovvoru paadhikkup pinnum varum sorkal ore ilakkana vagaiyaich serndhirukka vendum — peyarcholudan peyarchol, vinaicholudan vinaichol. Indhach samanilai PARALLELISM enappadugiradhu.",
  formula:"BOTH SIDES MUST MATCH\n\n  He is not only intelligent but also hardworking.  ✔\n     adjective            adjective\n\n  He is not only intelligent but also works hard.   ✘\n     adjective            verb phrase\n\n  She likes both singing and dancing.               ✔\n     gerund      gerund"},

 s2:[
 {h:"Cover the correlative and compare what remains",
  en:"Put your finger over 'not only' and 'but also'. What is left on each side must be the same kind of word. 'Intelligent … hardworking' — both adjectives, balanced. 'Intelligent … works hard' — adjective and verb, unbalanced.",
  ta:"இணைச் சொல்லை மூடிவிட்டு மீதியை ஒப்பிடுங்கள். 'Not only' மற்றும் 'but also' மீது உங்கள் விரலை வையுங்கள். ஒவ்வொரு பக்கத்திலும் மிச்சம் இருப்பது ஒரே வகைச் சொல்லாக இருக்க வேண்டும். 'Intelligent … hardworking' — இரண்டும் பெயரடைகள், சமநிலை. 'Intelligent … works hard' — பெயரடையும் வினைச்சொல்லும், சமநிலையின்மை.",
  tl:"Inaich sollai moodivittu meedhiyai oppidungal. 'Not only' matrum 'but also' meedhu ungal viralai vaiyungal. Ovvoru pakkaththilum micham iruppadhu ore vagaich sollaaga irukka vendum."},
 {h:"The position of NOT ONLY decides everything",
  en:"'He not only SANG but also DANCED' — verbs on both sides. 'Not only HE but also his BROTHER came' — nouns on both sides. Move 'not only' and you change what must be balanced. Place it directly before the first parallel item.",
  ta:"NOT ONLY-ன் இடம் எல்லாவற்றையும் தீர்மானிக்கிறது. 'He not only SANG but also DANCED' — இரு பக்கமும் வினைச்சொற்கள். 'Not only HE but also his BROTHER came' — இரு பக்கமும் பெயர்ச்சொற்கள். 'Not only'-ஐ நகர்த்தினால் எது சமநிலைப்படுத்தப்பட வேண்டும் என்பது மாறுகிறது. முதல் இணையான பொருளுக்கு நேரடியாக முன் அதை வையுங்கள்.",
  tl:"NOT ONLY-in idam ellaavatraiyum theermaanikkiradhu. 'He not only SANG but also DANCED' — iru pakkamum vinaichorkal. 'Not only HE but also his BROTHER came' — iru pakkamum peyarchorkal."},
 {h:"Parallelism applies to lists too",
  en:"'He likes reading, writing and to paint' is unbalanced — two gerunds and one infinitive. It must be 'reading, writing and painting'. Any list joined by 'and' or 'or' must keep one grammatical form throughout.",
  ta:"Parallelism பட்டியல்களுக்கும் பொருந்தும். 'He likes reading, writing and to paint' சமநிலையற்றது — இரண்டு gerund-கள், ஒரு infinitive. அது 'reading, writing and painting' என்றுதான் இருக்க வேண்டும். 'And' அல்லது 'or'-ஆல் இணைக்கப்பட்ட எந்தப் பட்டியலும் முழுவதும் ஒரே இலக்கண வடிவத்தைப் பேண வேண்டும்.",
  tl:"Parallelism pattiyalgalukkum porundhum. 'He likes reading, writing and to paint' samanilaiyatradhu. Adhu 'reading, writing and painting' endrudhaan irukka vendum."},
 {h:"NOT ONLY at the start forces inversion",
  en:"'Not only DID HE fail, but he also lost interest' — when 'not only' begins the sentence, the auxiliary comes before the subject. This is the same inversion you learnt in SVA Rule 49 and Tense Rule 61.",
  ta:"வாக்கியத்தின் தொடக்கத்தில் NOT ONLY தலைகீழாக்கத்தைக் கட்டாயமாக்குகிறது. 'Not only DID HE fail, but he also lost interest' — 'not only' வாக்கியத்தைத் தொடங்கும்போது, துணை வினைச்சொல் Subject-க்கு முன் வருகிறது. இது நீங்கள் SVA Rule 49-லும் Tense Rule 61-லும் கற்றுக்கொண்ட அதே தலைகீழாக்கம்.",
  tl:"Vaakkiyaththin thodakkaththil NOT ONLY thalaigeezhaakkaththaik kattaayamaakkugiradhu. 'Not only DID HE fail, but he also lost interest'. Idhu SVA Rule 49-lum Tense Rule 61-lum katrukkonda adhe thalaigeezhaakkam."}],

 s3:[
 {h:"Cover and compare",
  d:"   He is NOT ONLY intelligent BUT ALSO hardworking.\n              ✂️              ✂️\n   Cover the correlatives. What is left?\n\n     intelligent  |  hardworking\n     adjective    |  adjective     ✔ balanced\n\n   He is NOT ONLY intelligent BUT ALSO works hard.\n     intelligent  |  works hard\n     adjective    |  verb phrase   ✘ unbalanced"},
 {h:"Position decides what must match",
  d:"   He NOT ONLY sang BUT ALSO danced.\n           ↑          ↑\n         verb       verb          ✔\n\n   NOT ONLY he BUT ALSO his brother came.\n           ↑          ↑\n         noun       noun          ✔\n\n   Place 'not only' directly before\n   the FIRST parallel item."},
 {h:"Lists need parallelism too",
  d:"   ✘ He likes reading, writing and TO PAINT.\n        gerund   gerund    infinitive\n\n   ✔ He likes reading, writing and PAINTING.\n        gerund   gerund     gerund\n\n   ⚠ 'NOT ONLY' AT THE START = INVERSION:\n     NOT ONLY DID HE fail, but he also gave up.\n     (SVA Rule 49 · Tense Rule 61)"}],

 s4:{
 wrong:["\"As long as the meaning is clear, the form does not matter.\" — Exams test the form directly.",
  "\"'Not only intelligent but also works hard' reads fine.\" — An adjective must be balanced with an adjective.",
  "\"'Both singing and to dance' is acceptable.\" — A gerund must be balanced with a gerund.",
  "\"'Not only he failed' is correct at the start.\" — Sentence-initial 'not only' requires inversion."],
 right:["Cover the correlative words and compare what remains.",
  "Both sides must be the same grammatical class.",
  "Place 'not only' directly before the first parallel item.",
  "If 'not only' starts the sentence, invert the auxiliary and subject."]},

 s5:[
 {en:"He is not only intelligent but also hardworking.",ta:"அவர் புத்திசாலி மட்டுமல்ல, கடின உழைப்பாளியும் கூட.",tl:"Avar puththisaali mattumalla, kadina uzhaippaaliyum kooda.",note:"Adjective balanced with adjective."},
 {en:"She likes both singing and dancing.",ta:"அவர் பாடுவதையும் ஆடுவதையும் விரும்புகிறார்.",tl:"Avar paaduvadhaiyum aaduvadhaiyum virumbugiraar.",note:"Gerund balanced with gerund."},
 {en:"He wants either to study or to work.",ta:"அவர் படிக்கவோ வேலை செய்யவோ விரும்புகிறார்.",tl:"Avar padikkavo velai seyyavo virumbugiraar.",note:"Infinitive balanced with infinitive."},
 {en:"Not only did he fail, but he also lost interest.",ta:"அவர் தோல்வியடைந்தது மட்டுமல்ல, ஆர்வத்தையும் இழந்தார்.",tl:"Avar tholviyadaindhadhu mattumalla, aarvaththaiyum izhandhaar.",note:"'Not only' at the start forces inversion."},
 {en:"He enjoys reading, writing and painting.",ta:"அவர் படிப்பது, எழுதுவது, ஓவியம் வரைவது ஆகியவற்றை ரசிக்கிறார்.",tl:"Avar padippadhu, ezhudhuvadhu, oviyam varaivadhu aagiyavatrai rasikkiraar.",note:"All three items are gerunds — a balanced list."}],

 "He enjoys reading, writing and ____.|painting|Medium|A list must stay parallel.",
 "She is not only a singer but also a ____.|dancer|Medium|A noun must match a noun.",
 "He neither called nor ____ a message.|left|Medium|A verb must match a verb.",
 "Both honesty and ____ are needed.|sincerity|Hard|A noun must match a noun.",

 s9:[

 s10:{
  en:"This rule is invisible unless you look for it. The sentence usually MEANS the right thing — 'He is not only intelligent but also works hard' is perfectly understandable. What is wrong is the FORM: an adjective on one side, a verb phrase on the other. The exam relies on you reading for meaning and never checking the shape.",
  ta:"நீங்கள் தேடினால் ஒழிய இந்த விதி கண்ணுக்குத் தெரியாது. வாக்கியம் பொதுவாக சரியான விஷயத்தையே அர்த்தப்படுத்துகிறது — 'He is not only intelligent but also works hard' முற்றிலும் புரிந்துகொள்ளக்கூடியது. தவறாக இருப்பது வடிவம்: ஒரு பக்கம் பெயரடை, மறு பக்கம் வினைச்சொல் தொடர். நீங்கள் பொருளுக்காகப் படித்து வடிவத்தை ஒருபோதும் சரிபார்க்க மாட்டீர்கள் என்று தேர்வு நம்பியிருக்கிறது.",
  tl:"Neengal thedinaal ozhiya indha vidhi kannukkuth theriyaadhu. Vaakkiyam podhuvaaga sariyaana vishayaththaiye arththappaduththugiradhu. Thavaraaga iruppadhu vadivam."},

 s11:{
  en:"COVER THE CORRELATIVE WORDS. What remains on both sides must be the same kind of word.",
  ta:"இணைச் சொற்களை மூடுங்கள். இரு பக்கமும் மிச்சம் இருப்பது ஒரே வகைச் சொல்லாக இருக்க வேண்டும்.",
  tl:"Inaich sorkalai moodungal. Iru pakkamum micham iruppadhu ore vagaich sollaaga irukka vendum.",
  vis:"      THE COVER TEST\n\n   He is NOT ONLY ______ BUT ALSO ______\n                     ✂️            ✂️\n   Cover both correlatives.\n   Compare what is left.\n\n   adjective + adjective   ✔\n   noun      + noun        ✔\n   gerund    + gerund      ✔\n   infinitive+ infinitive  ✔\n\n   adjective + verb phrase ✘\n   gerund    + infinitive  ✘\n\n   ⚠ PLACE 'NOT ONLY' DIRECTLY BEFORE\n     THE FIRST PARALLEL ITEM.\n\n   ⚠ 'NOT ONLY' AT THE START = INVERSION:\n     Not only DID HE fail ...  ✔"},

 s13:[
 "He is not only intelligent ____ also hardworking, and both qualities ____ rare.|but-are;and-is;but-is|0|NOT ONLY pairs with BUT ALSO. 'Both qualities' is plural → ARE.",
 "She likes both singing ____ dancing, but neither of these ____ her profession.|and-is;as well as-are;and-are|0|BOTH pairs with AND. 'Neither of' is fixed singular → IS (SVA Rule 50).",
 "Not only ____ he fail, ____ he also lost interest in ____ studies.|did-but-his;he-and-his;did-and-his|0|Sentence-initial 'not only' → inversion DID. Pairs with BUT ALSO. Singular pronoun → HIS.",
 "He came not ____ argue ____ ____ listen to what each of us ____ to say.|to-but-to-had;for-but-for-have;to-and-to-had|0|Infinitive balanced with infinitive. 'Each of' is singular → HAD.",
 "The scheme is both practical ____ economical, and it is ____ useful that everyone ____ it.|and-so-wants;as well as-such-want;and-such-wants|0|BOTH pairs with AND. SO before an adjective (Rule 93). 'Everyone' is singular → WANTS."],

 s14:{
  rule:"The words after each half of a correlative pair must belong to the same grammatical class.",
  formula:"adjective ↔ adjective | noun ↔ noun\ngerund ↔ gerund | infinitive ↔ infinitive\nphrase ↔ phrase\nPlace 'not only' directly before the first parallel item\n'Not only' at the start → inversion",
  memory:"Cover the correlative words. What remains must match.",
  ta:"இணைச் சொற்களை மூடிட்டு, மிச்சம் இருக்கிறது ஒரே மாதிரி இருக்கணும்.",
  tl:"Inaich sorkalai moodittu, micham irukkiradhu ore maadhiri irukkanum.",
  mistake:"Writing 'not only intelligent but also works hard' — an adjective against a verb phrase.",
  exam:"SSC CGL / CHSL and Bank — appears in Sentence Improvement and Error Spotting."},

 s15:[
 {ta:"இந்த rule Rule 86-ஓட தொடர்ச்சி. அங்க ஜோடி சரியா இருக்கணும்னு பார்த்தோம். இங்க ஜோடிக்கு அப்பறம் வர்ற வார்த்தை சமநிலையா இருக்கணும்னு பார்க்கப் போறோம்.",
  tl:"Indha rule Rule 86-oda thodarchi. Anga jodi sariyaa irukkanumnu paarththom. Inga jodikku apparam varra vaarththai samanilaiyaa irukkanumnu paarkkap porom."},
 {ta:"ஒரு உதாரணம் பாருங்க. 'He is not only intelligent but also hardworking.' இங்க 'intelligent' ஒரு பெயரடை, 'hardworking'-ம் ஒரு பெயரடை. ரெண்டும் ஒரே வகை. சமநிலை. சரி.",
  tl:"Oru udhaaranam paarunga. 'He is not only intelligent but also hardworking.' Inga 'intelligent' oru peyaradai, 'hardworking'-um oru peyaradai. Rendum ore vagai. Samanilai. Sari."},
 {ta:"ஆனா 'He is not only intelligent but also works hard' — இங்க 'intelligent' பெயரடை, ஆனா 'works hard' ஒரு வினைச்சொல் தொடர். ரெண்டும் வேற வகை! சமநிலை இல்ல. தப்பு.",
  tl:"Aanaa 'He is not only intelligent but also works hard' — inga 'intelligent' peyaradai, aanaa 'works hard' oru vinaichol thodar. Rendum veru vagai! Samanilai illa. Thappu."},
 {ta:"இந்த தப்பு நமக்கு தெரியாது, ஏன்னா அர்த்தம் புரியுது! 'அவரு புத்திசாலி, மேலும் கடினமா உழைக்கிறாரு' — அர்த்தம் சரியாதான் இருக்கு. ஆனா இலக்கண வடிவம் தப்பு. SSC அர்த்தத்தை சோதிக்கல, வடிவத்தை சோதிக்குது.",
  tl:"Indha thappu namakku theriyaadhu, yennaa arththam puriyudhu! Arththam sariyaadhaan irukku. Aanaa ilakkana vadivam thappu. SSC arththaththai sodhikkala, vadivaththai sodhikkudhu."},
 {ta:"ஒரு அருமையான சோதனை சொல்லுறேன் — 'மூடல் சோதனை'. உங்க விரலை எடுத்து 'not only' மற்றும் 'but also' மேல வையுங்க. இப்போ ரெண்டு பக்கமும் என்ன மிச்சம் இருக்கு? அது ஒரே வகை வார்த்தையா இருக்கணும். 'Intelligent' | 'hardworking' — ரெண்டும் பெயரடை. சரி.",
  tl:"Oru arumaiyaana sodhanai solluren — 'moodal sodhanai'. Unga viralai eduththu 'not only' matrum 'but also' mela vaiyunga. Ippo rendu pakkamum enna micham irukku? Adhu ore vagai vaarththaiyaa irukkanum."},
 {ta:"கடைசியா ஒரு முக்கியமான விஷயம் — 'Not only' வாக்கியத்தோட ஆரம்பத்துல வந்தா, தலைகீழாக்கம் வேணும்! 'NOT ONLY DID HE fail, but he also gave up.' 'Not only he failed' அப்படின்னு எழுதக்கூடாது. இது நீங்க SVA Rule 49-லயும் Tense Rule 61-லயும் படிச்ச அதே தலைகீழாக்கம். Never, Seldom, Hardly, No sooner, Not only — இதெல்லாம் ஆரம்பத்துல வந்தா auxiliary முன்னாடி வரும்.",
  tl:"Kadaisiyaa oru mukkiyamaana vishayam — 'Not only' vaakkiyaththoda aarambaththula vandhaa, thalaigeezhaakkam venum! 'NOT ONLY DID HE fail, but he also gave up.' Idhu neenga SVA Rule 49-layum Tense Rule 61-layum padicha adhe thalaigeezhaakkam."}]},

/* ========== RULE 88 ========== */
{n:88,rc:"CON-03",d:"Hard",t:"Never use TWO Conjunctions for ONE Relationship",
 tam:"Although...but · Because...so — ஒரே தொடர்புக்கு ஒரு இணைப்புச் சொல் போதும்",
 s1:{en:"Do NOT use two conjunctions to express one logical relationship. ALTHOUGH with BUT, THOUGH with YET, BECAUSE with SO, AS with THEREFORE — each pair says the same thing twice and is wrong.",
  ta:"ஒரு தர்க்கத் தொடர்பை வெளிப்படுத்த இரண்டு இணைப்புச் சொற்களைப் பயன்படுத்தாதீர்கள். ALTHOUGH-உடன் BUT, THOUGH-உடன் YET, BECAUSE-உடன் SO, AS-உடன் THEREFORE — ஒவ்வொரு ஜோடியும் ஒரே விஷயத்தை இரண்டு முறை சொல்கிறது, அது தவறு.",
  tl:"Oru tharkkath thodarbai velippaduththa irandu inaippuch sorkalaip payanpaduththaadheergal. ALTHOUGH-udan BUT, THOUGH-udan YET, BECAUSE-udan SO — ovvoru jodiyum ore vishayaththai irandu murai solgiradhu.",
  formula:"ONE RELATIONSHIP = ONE CONJUNCTION\n\n  ✘ ALTHOUGH he was tired, BUT he continued.\n  ✔ ALTHOUGH he was tired, he continued.\n  ✔ He was tired, BUT he continued.\n\n  ✘ BECAUSE it rained, SO the match was cancelled.\n  ✔ BECAUSE it rained, the match was cancelled.\n  ✔ It rained, SO the match was cancelled."},

 s2:[
 {h:"Tamil and Hindi both allow the double form",
  en:"In Tamil we say the equivalent of 'although … but', and Hindi does the same with 'yadyapi … lekin'. That is why 'Although he was tired, but he continued' feels not just acceptable but complete to an Indian learner.",
  ta:"தமிழும் இந்தியும் இரட்டை வடிவத்தை அனுமதிக்கின்றன. தமிழில் 'although … but' என்பதற்கு இணையானதைச் சொல்கிறோம், இந்தியும் 'yadyapi … lekin'-உடன் அதையே செய்கிறது. அதனால்தான் 'Although he was tired, but he continued' ஒரு இந்திய மாணவருக்கு ஏற்கத்தக்கது மட்டுமல்ல, முழுமையாகவும் தோன்றுகிறது.",
  tl:"Thamizhum Hindiyum irattai vadivaththai anumadhikkindrana. Adhanaal-dhaan 'Although he was tired, but he continued' oru Indhiya maanavarukku erkaththakkadhu mattumalla, muzhumaiyaagavum thondrugiradhu."},
 {h:"Pick one and delete the other",
  en:"Both halves are individually correct. 'Although he was tired, he continued' ✔ and 'He was tired, but he continued' ✔. The error is only in using both at once. Delete either one and the sentence becomes correct.",
  ta:"ஒன்றைத் தேர்ந்தெடுத்து மற்றொன்றை நீக்குங்கள். இரு பாதிகளும் தனித்தனியாகச் சரி. 'Although he was tired, he continued' சரி மற்றும் 'He was tired, but he continued' சரி. இரண்டையும் ஒரே நேரத்தில் பயன்படுத்துவதில் மட்டுமே தவறு. ஏதேனும் ஒன்றை நீக்கினால் வாக்கியம் சரியாகிவிடும்.",
  tl:"Ondraith therndhedhuththu matrondrai neekkungal. Iru paadhigalum thanithaniyaagach sari. Irandaiyum ore neraththil payanpaduththuvadhil mattume thavaru."},
 {h:"THOUGH with YET is a special case",
  en:"'Though he was poor, YET he was honest' is accepted in older and literary English, and some exam keys still allow it. But 'although … but' is never allowed. When in doubt, use only one.",
  ta:"THOUGH-உடன் YET ஒரு சிறப்பு வழக்கு. 'Though he was poor, YET he was honest' பழைய மற்றும் இலக்கிய ஆங்கிலத்தில் ஏற்கப்படுகிறது, சில தேர்வு விடைத்தாள்கள் இன்னும் அதை அனுமதிக்கின்றன. ஆனால் 'although … but' ஒருபோதும் அனுமதிக்கப்படுவதில்லை. சந்தேகம் இருந்தால், ஒன்றை மட்டும் பயன்படுத்துங்கள்.",
  tl:"THOUGH-udan YET oru sirappu vazhakku. 'Though he was poor, YET he was honest' pazhaiya matrum ilakkiya Aangilaththil erkappadugiradhu. Aanaal 'although … but' orupodhum anumadhikkappaduvadhillai."},
 {h:"The full list of forbidden pairs",
  en:"although…but, though…but, because…so, since…so, as…therefore, as…so, unless…if not, when…then (in a clause). Each pair doubles a single logical link.",
  ta:"தடைசெய்யப்பட்ட ஜோடிகளின் முழுப் பட்டியல்: although…but, though…but, because…so, since…so, as…therefore, as…so, unless…if not, when…then (ஒரு clause-ல்). ஒவ்வொரு ஜோடியும் ஒரே தர்க்கத் தொடர்பை இரட்டிப்பாக்குகிறது.",
  tl:"Thadaiseyyappatta jodigalin muzhup pattiyal: although…but, though…but, because…so, since…so, as…therefore, as…so, unless…if not, when…then."}],

 s3:[
 {h:"One link, one word",
  d:"   THE CONTRAST LINK  ⟷\n     ALTHOUGH  ──┐\n     THOUGH    ──┤ pick ONE\n     BUT       ──┘\n\n   THE CAUSE LINK  →\n     BECAUSE   ──┐\n     SINCE     ──┤ pick ONE\n     AS        ──┤\n     SO        ──┘\n\n   Using two says the same thing twice."},
 {h:"Both halves are correct alone",
  d:"   ✘ ALTHOUGH he was tired, BUT he continued.\n\n   Delete 'but':\n   ✔ ALTHOUGH he was tired, he continued.\n\n   Delete 'although':\n   ✔ He was tired, BUT he continued.\n\n   Either fix works. Only the pair is wrong."},
 {h:"The forbidden pairs",
  d:"   ✘ although … but      ✘ though … but\n   ✘ because … so        ✘ since … so\n   ✘ as … therefore      ✘ as … so\n   ✘ unless … if not     ✘ when … then\n\n   ⚠ ONE ACCEPTED EXCEPTION:\n     though … yet  (older, literary English)\n     'Though he was poor, YET he was honest.'"}],

 s4:{
 wrong:["\"'Although … but' makes the contrast clearer.\" — One conjunction already shows the contrast.",
  "\"Tamil allows it, so English should too.\" — English forbids the double form.",
  "\"'Because … so' shows both cause and result.\" — One word covers both.",
  "\"Deleting one word will change the meaning.\" — The meaning stays exactly the same."],
 right:["Find the two conjunctions and delete one.",
  "Either half alone gives a correct sentence.",
  "Contrast: although OR but, never both.",
  "Cause: because OR so, never both."]},

 s5:[
 {en:"Although he was tired, he continued working.",ta:"அவர் களைப்பாக இருந்தபோதிலும், தொடர்ந்து வேலை செய்தார்.",tl:"Avar kalaippaaga irundhabodhilum, thodarndhu velai seydhaar.",note:"Only 'although' — the 'but' is deleted."},
 {en:"He was tired, but he continued working.",ta:"அவர் களைப்பாக இருந்தார், ஆனால் தொடர்ந்து வேலை செய்தார்.",tl:"Avar kalaippaaga irundhaar, aanaal thodarndhu velai seydhaar.",note:"Only 'but' — the 'although' is deleted."},
 {en:"Because it rained, the match was cancelled.",ta:"மழை பெய்ததால், போட்டி ரத்து செய்யப்பட்டது.",tl:"Mazhai peydhadhaal, potti raththu seyyappattadhu.",note:"Only 'because' — the 'so' is deleted."},
 {en:"It rained, so the match was cancelled.",ta:"மழை பெய்தது, எனவே போட்டி ரத்து செய்யப்பட்டது.",tl:"Mazhai peydhadhu, enave potti raththu seyyappattadhu.",note:"Only 'so' — the 'because' is deleted."},
 {en:"Though he was poor, yet he was honest.",ta:"அவர் ஏழையாக இருந்தாலும், நேர்மையானவராகவே இருந்தார்.",tl:"Avar ezhaiyaaga irundhaalum, nermaiyaanavaraagave irundhaar.",note:"'Though … yet' is the one accepted older pairing."}],

 s9:[

 s10:{
  en:"This is one of the strongest mother-tongue interferences in Indian English. Tamil and Hindi both allow the double structure, so 'Although he was tired, but he continued' feels COMPLETE — deleting the 'but' feels like leaving the sentence unfinished. It is not. Both halves are individually correct; only the pair is wrong.",
  ta:"இது இந்திய ஆங்கிலத்தில் மிகவும் வலுவான தாய்மொழித் தலையீடுகளில் ஒன்று. தமிழும் இந்தியும் இரட்டை அமைப்பை அனுமதிக்கின்றன, எனவே 'Although he was tired, but he continued' முழுமையாகத் தோன்றுகிறது — 'but'-ஐ நீக்குவது வாக்கியத்தை முடிக்காமல் விடுவது போலத் தோன்றுகிறது. அப்படி இல்லை. இரு பாதிகளும் தனித்தனியாகச் சரி; ஜோடி மட்டுமே தவறு.",
  tl:"Idhu Indhiya Aangilaththil migavum valuvaana thaaymozhith thalaiyeedugalil ondru. Thamizhum Hindiyum irattai amaippai anumadhikkindrana. Iru paadhigalum thanithaniyaagach sari; jodi mattume thavaru."},

 s11:{
  en:"ONE RELATIONSHIP, ONE CONJUNCTION. Find the two and delete either one.",
  ta:"ஒரு தொடர்பு, ஒரு இணைப்புச் சொல். இரண்டைக் கண்டறிந்து ஏதேனும் ஒன்றை நீக்குங்கள்.",
  tl:"Oru thodarbu, oru inaippuch sol. Irandaik kandarindhu edhenum ondrai neekkungal.",
  vis:"      THE DELETE TEST\n\n   ALTHOUGH he was tired, BUT he continued.\n      ↑                    ↑\n   two words for ONE contrast\n\n   Delete EITHER one:\n     ALTHOUGH he was tired, he continued.  ✔\n     He was tired, BUT he continued.       ✔\n\n   THE FORBIDDEN PAIRS:\n     although…but · though…but\n     because…so · since…so\n     as…therefore · as…so\n\n   ⚠ ONE ACCEPTED EXCEPTION:\n     though … YET  (older, literary)"},

 s13:[
 "Although he was tired, he continued, and neither hunger ____ thirst ____ stop him.|nor-could;or-could;nor-can|0|Delete the 'but'. NEITHER pairs with NOR (Rule 86). Past ability → COULD.",
 "Because it rained, the match ____ cancelled, and each of the players ____ disappointed.|was-was;so was-were;was-were|0|Delete the 'so'. Singular subject → WAS. 'Each of' is singular → WAS.",
 "Though he is poor, ____ he is not only honest ____ also generous.|yet-but;but-and;yet-and|0|'Though … yet' is accepted. NOT ONLY pairs with BUT ALSO (Rule 86).",
 "Since the road ____ blocked, we took a detour, which ____ us nearly two hours.|was-cost;so was-costed;was-costed|0|Delete the 'so'. Passive past → WAS. Irregular past → COST.",
 "Although she is wealthy, she leads ____ simple life that everyone ____ her.|so-admires;such a-admires;such-admire|1|Delete the 'but'. SUCH before a noun phrase (Rule 93). 'Everyone' is singular → ADMIRES."],

 s14:{
  rule:"Never use two conjunctions for one logical relationship.",
  formula:"CONTRAST: although OR but — never both\nCAUSE: because OR so — never both\nFORBIDDEN: although…but · because…so · since…so · as…therefore\nACCEPTED: though … yet (older, literary)",
  memory:"One relationship, one conjunction. Delete either one and the sentence works.",
  ta:"ஒரு தொடர்பு, ஒரு இணைப்புச் சொல். ஏதாவது ஒண்ணை நீக்கினா வாக்கியம் சரியாயிடும்.",
  tl:"Oru thodarbu, oru inaippuch sol. Edhaavadhu onnai neekkinaa vaakkiyam sariyaayidum.",
  mistake:"Writing 'Although he was tired, but he continued' because Tamil and Hindi allow it.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — one of the strongest mother-tongue interference errors."},

 s15:[
 {ta:"இந்த rule நமக்கு ரொம்ப கஷ்டமா இருக்கும். ஏன்? ஏன்னா நம்ம தாய்மொழி இதை அனுமதிக்குது. தமிழ்லயும் இந்தியிலயும் ரெண்டு இணைப்புச் சொல் சேர்த்து சொல்லலாம். ஆனா ஆங்கிலத்துல முடியாது.",
  tl:"Indha rule namakku romba kashtamaa irukkum. Yennaa namma thaaymozhi idhai anumadhikkudhu. Tamil-layum Hindi-yilayum rendu inaippuch sol serthu sollalaam. Aanaa Aangilaththula mudiyaadhu."},
 {ta:"உதாரணம்: 'Although he was tired, BUT he continued.' இது நமக்கு முழுமையா தோணுது. 'But' -ஐ நீக்கினா வாக்கியம் முடியாத மாதிரி இருக்கு. ஆனா ஆங்கிலத்துல 'but' தேவையில்ல!",
  tl:"Udhaaranam: 'Although he was tired, BUT he continued.' Idhu namakku muzhumaiyaa thonudhu. 'But'-ai neekkinaa vaakkiyam mudiyaadha maadhiri irukku. Aanaa Aangilaththula 'but' thevaiyilla!"},
 {ta:"ஏன்? ஏன்னா 'Although' ஏற்கனவே முரண்பாட்டை காட்டிடுச்சு. 'களைப்பா இருந்தாலும்' — 'ஆனாலும்' அப்படிங்கிற அர்த்தம் அதுலயே இருக்கு. மறுபடி 'but' போட்டா, ஒரே விஷயத்தை ரெண்டு தடவ சொல்றோம்.",
  tl:"Yen? Yennaa 'Although' erkanave muranpaattai kaattiduchu. 'Kalaippaa irundhaalum' — 'aanaalum' appadingira arththam adhulaye irukku. Marubadi 'but' pottaa, ore vishayaththai rendu thadava solrom."},
 {ta:"ஒரு அருமையான விஷயம் — ரெண்டு பாதியும் தனித்தனியா சரி! 'Although he was tired, he continued' — சரி. 'He was tired, but he continued' — சரி. ரெண்டையும் சேர்த்தா மட்டும்தான் தப்பு. அதனால எதையாவது ஒண்ணை நீக்குங்க, வாக்கியம் சரியாயிடும்.",
  tl:"Oru arumaiyaana vishayam — rendu paadhiyum thanithaniyaa sari! 'Although he was tired, he continued' — sari. 'He was tired, but he continued' — sari. Rendaiyum serthaa mattum-dhaan thappu."},
 {ta:"காரணத்துக்கும் அதே. 'Because it rained, SO the match was cancelled' — தப்பு. 'Because' ஏற்கனவே காரணத்தை காட்டுது. 'Because it rained, the match was cancelled' — சரி. அல்லது 'It rained, SO the match was cancelled' — சரி.",
  tl:"Kaaranaththukkum adhe. 'Because it rained, SO the match was cancelled' — thappu. 'Because it rained, the match was cancelled' — sari. Alladhu 'It rained, SO the match was cancelled' — sari."},
 {ta:"தடைப் பட்டியல் மனப்பாடம் பண்ணுங்க: although…but, though…but, because…so, since…so, as…therefore, as…so. இதெல்லாம் தப்பு. ஆனா ஒரு விதிவிலக்கு இருக்கு — 'though … YET'. 'Though he was poor, YET he was honest' — இது பழைய இலக்கிய ஆங்கிலத்துல ஏத்துக்கப்படுது, சில விடைத்தாள்ல இன்னும் அனுமதிக்கிறாங்க. ஆனா 'although … but' ஒருபோதும் ஏத்துக்கப்படாது.",
  tl:"Thadaip pattiyal manappaadam pannunga: although…but, though…but, because…so, since…so, as…therefore. Aanaa oru vidhivilakku irukku — 'though … YET'. Aanaa 'although … but' orupodhum eththukkappadaadhu."}]},

/* ========== RULE 89 ========== */
{n:89,rc:"CON-04",d:"Hard",t:"LEST is always followed by SHOULD, never by NOT",
 tam:"'Lest'-ல் ஏற்கனவே எதிர்மறை உள்ளது — 'not' சேர்க்கக் கூடாது",
 s1:{en:"LEST already means 'so that … NOT'. It is therefore followed by SHOULD and never by 'not' or 'will'. Adding 'not' creates a double negative and reverses the meaning.",
  ta:"LEST ஏற்கனவே 'so that … NOT' என்று பொருள்படுகிறது. எனவே அதற்குப் பின் SHOULD வரும், ஒருபோதும் 'not' அல்லது 'will' அல்ல. 'Not' சேர்ப்பது ஒரு இரட்டை எதிர்மறையை உருவாக்கி பொருளைத் தலைகீழாக்குகிறது.",
  tl:"LEST erkanave 'so that … NOT' endru porulpadugiradhu. Enave adharkup pin SHOULD varum, orupodhum 'not' alladhu 'will' alla. 'Not' serppadhu oru irattai edhirmaraiyai uruvaakki porulaith thalaigeezhaakkugiradhu.",
  formula:"LEST  +  subject  +  SHOULD  +  V1\n\n  Walk carefully LEST you SHOULD fall.      ✔\n  Study hard LEST you SHOULD fail.          ✔\n  He hid the letter LEST it SHOULD be seen. ✔\n\n⚠ NEVER:\n  lest you should NOT fall   ✘  double negative\n  lest you WILL fall         ✘  wrong auxiliary"},

 s2:[
 {h:"LEST contains the negative already",
  en:"'Lest you should fall' means 'so that you should NOT fall'. The negative is hidden inside the word 'lest' itself. Adding another 'not' cancels it and makes the sentence say the opposite of what you mean.",
  ta:"LEST-ல் ஏற்கனவே எதிர்மறை உள்ளது. 'Lest you should fall' என்றால் 'நீங்கள் விழக் கூடாது என்பதற்காக'. எதிர்மறை 'lest' என்ற சொல்லுக்குள்ளேயே ஒளிந்திருக்கிறது. இன்னொரு 'not' சேர்ப்பது அதை ரத்து செய்து, நீங்கள் சொல்ல நினைப்பதற்கு நேர் எதிரானதை வாக்கியம் சொல்லச் செய்கிறது.",
  tl:"LEST-l erkanave edhirmarai ulladhu. 'Lest you should fall' endraal 'neengal vizhak koodaadhu enbadharkaaga'. Edhirmarai 'lest' endra sollukkulleye olindhirukkiradhu."},
 {h:"Only SHOULD is allowed after LEST",
  en:"Not 'will', not 'would', not 'may', not 'might' — only SHOULD. 'Lest he will come' and 'lest he may fall' are both wrong. This is one of the strictest rules in English grammar.",
  ta:"LEST-க்குப் பின் SHOULD மட்டுமே அனுமதிக்கப்படுகிறது. 'Will' அல்ல, 'would' அல்ல, 'may' அல்ல, 'might' அல்ல — SHOULD மட்டுமே. 'Lest he will come' மற்றும் 'lest he may fall' இரண்டுமே தவறு. இது ஆங்கில இலக்கணத்தில் மிகக் கடுமையான விதிகளில் ஒன்று.",
  tl:"LEST-kkup pin SHOULD mattume anumadhikkappadugiradhu. 'Will' alla, 'would' alla, 'may' alla — SHOULD mattume. Idhu Aangila ilakkanaththil migak kadumaiyaana vidhigalil ondru."},
 {h:"You can rewrite LEST with 'so that … not'",
  en:"'Walk carefully lest you should fall' = 'Walk carefully so that you may not fall'. Both are correct. If you rewrite it and the meaning stays the same, your 'lest' sentence is right.",
  ta:"LEST-ஐ 'so that … not'-உடன் மீண்டும் எழுதலாம். 'Walk carefully lest you should fall' = 'Walk carefully so that you may not fall'. இரண்டுமே சரி. நீங்கள் அதை மீண்டும் எழுதி பொருள் அப்படியே இருந்தால், உங்கள் 'lest' வாக்கியம் சரி.",
  tl:"LEST-ai 'so that … not'-udan meendum ezhudhalaam. 'Walk carefully lest you should fall' = 'Walk carefully so that you may not fall'. Irandume sari."},
 {h:"LEST is formal and slightly old-fashioned",
  en:"You will rarely hear 'lest' in everyday speech, but it appears regularly in SSC papers because it is a clean, testable rule with one right answer. Learn it for the exam, not for conversation.",
  ta:"LEST முறையானது மற்றும் சற்று பழமையானது. அன்றாடப் பேச்சில் 'lest'-ஐ நீங்கள் அரிதாகவே கேட்பீர்கள், ஆனால் SSC தாள்களில் அது தொடர்ந்து வருகிறது, ஏனெனில் அது ஒரே சரியான விடையுடன் கூடிய ஒரு தெளிவான, சோதிக்கக்கூடிய விதி. உரையாடலுக்கு அல்ல, தேர்வுக்காக அதைக் கற்றுக்கொள்ளுங்கள்.",
  tl:"LEST muraiyaanadhu matrum satru pazhamaiyaanadhu. Andraadap pechil 'lest'-ai neengal aridhaagave ketpeergal, aanaal SSC thaalgalil adhu thodarndhu varugiradhu."}],

 s3:[
 {h:"The negative is hidden inside",
  d:"   LEST  =  so that … NOT\n     ↑\n   the NOT is already in here\n\n   Walk carefully LEST you SHOULD fall.\n     = Walk carefully SO THAT you should NOT fall.\n\n   ⚠ Adding another 'not' cancels it:\n     lest you should NOT fall\n     = so that you should not NOT fall\n     = so that you SHOULD fall   ✘ opposite!"},
 {h:"Only SHOULD is allowed",
  d:"   LEST + subject + SHOULD + V1\n\n   ✔ lest you SHOULD fall\n   ✘ lest you WILL fall\n   ✘ lest you WOULD fall\n   ✘ lest you MAY fall\n   ✘ lest you MIGHT fall\n   ✘ lest you should NOT fall\n\n   One auxiliary, no negative. That is the whole rule."},
 {h:"The rewrite test",
  d:"   LEST version:\n     Study hard LEST you SHOULD fail.\n\n   SO THAT version:\n     Study hard SO THAT you may NOT fail.\n\n   Same meaning. If your rewrite keeps\n   the meaning, the 'lest' sentence is right."}],

 s4:{
 wrong:["\"'Lest you should not fall' makes the warning clearer.\" — It reverses the meaning.",
  "\"'Lest he will come' shows the future.\" — Only 'should' is allowed after 'lest'.",
  "\"'Lest' and 'so that' are interchangeable in form.\" — 'So that' takes 'not'; 'lest' never does.",
  "\"'Lest he may fall' is more polite.\" — Only 'should' works after 'lest'."],
 right:["Remember that 'lest' already contains the negative.",
  "Write LEST + subject + SHOULD + V1, nothing else.",
  "Never add 'not' after 'lest'.",
  "Rewrite with 'so that … not' to check the meaning."]},

 s5:[
 {en:"Walk carefully lest you should fall.",ta:"நீங்கள் விழுந்துவிடக் கூடாது என்பதற்காக கவனமாக நடங்கள்.",tl:"Neengal vizhundhuvidak koodaadhu enbadharkaaga kavanamaaga nadangal.",note:"LEST + SHOULD, with no 'not'."},
 {en:"Study hard lest you should fail in the exam.",ta:"தேர்வில் தோல்வியடையக் கூடாது என்பதற்காக கடினமாகப் படியுங்கள்.",tl:"Thervil tholviyadaiyak koodaadhu enbadharkaaga kadinamaagap padiyungal.",note:"LEST + SHOULD, with no 'not'."},
 {en:"He hid the letter lest it should be seen.",ta:"அது யாருக்கும் தெரியக் கூடாது என்பதற்காக அவர் கடிதத்தை மறைத்தார்.",tl:"Adhu yaarukkum theriyak koodaadhu enbadharkaaga avar kadidhaththai maraiththaar.",note:"LEST + SHOULD in the passive."},
 {en:"She whispered lest the baby should wake up.",ta:"குழந்தை விழித்துக்கொள்ளக் கூடாது என்பதற்காக அவர் மெதுவாகப் பேசினார்.",tl:"Kuzhandhai vizhiththukkollak koodaadhu enbadharkaaga avar medhuvaagap pesinaar.",note:"LEST + SHOULD, with no 'not'."},
 {en:"Run fast so that you may not miss the bus.",ta:"பேருந்தைத் தவறவிடக் கூடாது என்பதற்காக வேகமாக ஓடுங்கள்.",tl:"Perundhaith thavaravidak koodaadhu enbadharkaaga vegamaaga odungal.",note:"The 'so that … not' rewrite of the same idea."}],

 s8:[
 "Walk carefully lest you should not fall.|Walk carefully lest you should fall.|'Lest' already contains the negative.",
 "Study hard lest you will fail.|Study hard lest you should fail.|Only SHOULD follows LEST.",
 "He hid the letter lest it may be seen.|He hid the letter lest it should be seen.|Only SHOULD follows LEST.",
 "She whispered lest the baby should not wake.|She whispered lest the baby should wake.|'Lest' already contains the negative.",
 "Run fast lest you would miss the bus.|Run fast lest you should miss the bus.|Only SHOULD follows LEST.",
 "Hold the rope lest you might slip.|Hold the rope lest you should slip.|Only SHOULD follows LEST.",
 "He left early lest he should not be late.|He left early lest he should be late.|'Lest' already contains the negative.",
 "Speak softly lest they will hear us.|Speak softly lest they should hear us.|Only SHOULD follows LEST.",
 "Run fast so that you may miss the bus.|Run fast so that you may not miss the bus.|'So that' does need the 'not'.",
 "Take an umbrella lest it should not rain.|Take an umbrella lest it should rain.|'Lest' already contains the negative."],

 s9:[
 "Fill in the Blank|Hold the railing tightly lest you ____ slip on the wet staircase.|should not;should|1|'Lest' already contains the negative.",
 "Find the Error|He left the office (A) an hour early (B) lest he will miss (C) the last train home (D).|A;B;C;D|2|Part C. Only SHOULD follows LEST → 'lest he should miss'.",
 "Sentence Improvement|She spoke in a whisper lest the sleeping child should not be disturbed.|should not be;should be;would not be|1|'Lest' already contains the negative.",
 "Fill in the Blank|Study systematically ____ you should fail in the forthcoming examination.|so that;lest|1|The negative sense with 'should' requires 'lest'.",
 "Find the Error|Take an umbrella with you (A) lest it may rain (B) heavily in (C) the afternoon (D).|A;B;C;D|1|Part B. Only SHOULD follows LEST."],

 s10:{
  en:"The exam offers 'lest … not' because a warning FEELS negative, so adding 'not' feels natural. It is a double negative that reverses the meaning entirely. The second trap is the auxiliary — 'lest he will', 'lest he may', 'lest he might' all look reasonable but only 'should' is allowed.",
  ta:"தேர்வு 'lest … not' தருகிறது, ஏனெனில் ஒரு எச்சரிக்கை எதிர்மறையாக உணரப்படுகிறது, எனவே 'not' சேர்ப்பது இயற்கையாகத் தோன்றுகிறது. அது ஒரு இரட்டை எதிர்மறை, பொருளை முற்றிலும் தலைகீழாக்குகிறது. இரண்டாவது பொறி துணை வினைச்சொல் — 'lest he will', 'lest he may', 'lest he might' அனைத்தும் நியாயமாகத் தெரிகின்றன ஆனால் 'should' மட்டுமே அனுமதிக்கப்படுகிறது.",
  tl:"Thervu 'lest … not' tharugiradhu, yenenil oru echcharikkai edhirmaraiyaaga unarappadugiradhu. Adhu oru irattai edhirmarai. Irandaavadhu pori thunai vinaichol."},

 s11:{
  en:"LEST + SHOULD. Nothing else. The 'not' is already inside 'lest'.",
  ta:"LEST + SHOULD. வேறு எதுவும் இல்லை. 'Not' ஏற்கனவே 'lest'-க்குள்ளேயே இருக்கிறது.",
  tl:"LEST + SHOULD. Veru edhuvum illai. 'Not' erkanave 'lest'-kkulleye irukkiradhu.",
  vis:"      THE HIDDEN NEGATIVE\n\n   LEST  =  so that … NOT\n              ↑\n        already inside the word\n\n   ┌──────────────────────────────┐\n   │  LEST + subject + SHOULD + V1│\n   └──────────────────────────────┘\n\n   ✔ lest you SHOULD fall\n   ✘ lest you should NOT fall  (double negative)\n   ✘ lest you WILL fall        (wrong auxiliary)\n   ✘ lest you MAY fall         (wrong auxiliary)\n\n   ⚠ THE REWRITE TEST:\n     lest you should fall\n     = so that you may NOT fall\n\n   'So that' takes the NOT.\n   'Lest' never does."},

 s13:[
 "Walk carefully lest you ____ fall, and hold the railing ____ you may not slip.|should-so that;should not-lest;should-lest|0|LEST + SHOULD with no 'not'. 'So that' does take the 'not'.",
 "He left early lest he ____ miss the train, although he ____ already booked ____ ticket.|should-had-the;will-has-a;should-has-the|0|LEST + SHOULD. The earlier past action → HAD (Tense Rule 54). Specific ticket → THE.",
 "She whispered lest the baby ____ wake, for neither she ____ her husband ____ tired.|should-nor-was;should not-or-were;should-nor-were|2|LEST + SHOULD. NEITHER pairs with NOR (Rule 86). Nearest subject 'husband' → WAS.",
 "Take an umbrella lest it ____ rain, because the sky ____ been cloudy ____ morning.|should-has-since;may-had-for;should-had-since|0|LEST + SHOULD. 'Since morning' → HAS BEEN (Preposition Rule 73).",
 "Study hard lest you ____ fail, and remember it is high time you ____ seriously.|should-worked;will-work;should-work|0|LEST + SHOULD. 'It is high time' takes the past form → WORKED (Modal Rule 60)."],

 s14:{
  rule:"LEST already means 'so that not', so it is followed by SHOULD and never by 'not' or any other auxiliary.",
  formula:"LEST + subject + SHOULD + V1\nNever 'not', never 'will', 'would', 'may' or 'might'\nRewrite as 'so that … may not' to check the meaning",
  memory:"The NOT is already inside LEST. Only SHOULD follows it.",
  ta:"'NOT' ஏற்கனவே LEST-க்குள்ள இருக்கு. அதுக்கு அப்பறம் SHOULD மட்டும்தான்.",
  tl:"'NOT' erkanave LEST-kkulla irukku. Adhukku apparam SHOULD mattum-dhaan.",
  mistake:"Writing 'lest you should not fall' and 'lest he will come'.",
  exam:"SSC CGL / CHSL, CDS and Bank — a clean one-mark question with only one right answer."},

 s15:[
 {ta:"இந்த rule ரொம்ப கடுமையானது — ஒரே ஒரு சரியான பதில்தான் இருக்கு. அதனாலதான் SSC இதை விரும்பி கேட்குது. தெரிஞ்சா ஒரு mark, தெரியலைன்னா ஒரு mark போச்சு.",
  tl:"Indha rule romba kadumaiyaanadhu — ore oru sariyaana padhil-dhaan irukku. Adhanaaladhaan SSC idhai virumbi ketkudhu. Therinjaa oru mark, theriyalainnaa oru mark pochu."},
 {ta:"விதி எளிது: LEST + subject + SHOULD + V1. அவ்ளோதான். 'Walk carefully LEST you SHOULD fall.' வேற எதுவும் வராது.",
  tl:"Vidhi eladhu: LEST + subject + SHOULD + V1. Avlodhaan. 'Walk carefully LEST you SHOULD fall.' Veru edhuvum varaadhu."},
 {ta:"ஏன் 'not' போடக்கூடாது? ஏன்னா 'lest' அப்படிங்கிற வார்த்தையிலேயே எதிர்மறை ஒளிஞ்சிருக்கு! 'Lest' அப்படின்னா 'so that … NOT'. 'Lest you should fall' அப்படின்னா 'நீங்க விழக்கூடாது என்பதற்காக'.",
  tl:"Yen 'not' podakkoodaadhu? Yennaa 'lest' appadingira vaarththaiyileye edhirmarai olinjirukku! 'Lest' appadinnaa 'so that … NOT'. 'Lest you should fall' appadinnaa 'neenga vizhakkoodaadhu enbadharkaaga'."},
 {ta:"இப்போ 'not' சேர்த்தா என்ன ஆகும்? 'Lest you should NOT fall' = 'so that you should not NOT fall' = 'so that you SHOULD fall'! அர்த்தம் தலைகீழா மாறிடுச்சு! நீங்க அவரை விழச் சொல்றீங்க! இது ஒரு இரட்டை எதிர்மறை.",
  tl:"Ippo 'not' serthaa enna aagum? 'Lest you should NOT fall' = 'so that you SHOULD fall'! Arththam thalaigeezhaa maaridichu! Neenga avarai vizhach solreenga! Idhu oru irattai edhirmarai."},
 {ta:"ரெண்டாவது பொறி — துணை வினைச்சொல். 'Lest he WILL come' — தப்பு. 'Lest he MAY fall' — தப்பு. 'Lest he MIGHT slip' — தப்பு. 'Lest he WOULD miss' — தப்பு. SHOULD மட்டும்தான்! இது ஆங்கிலத்துல மிக கடுமையான விதிகள்ல ஒண்ணு.",
  tl:"Randaavadhu pori — thunai vinaichol. 'Lest he WILL come' — thappu. 'Lest he MAY fall' — thappu. SHOULD mattum-dhaan! Idhu Aangilaththula miga kadumaiyaana vidhigalla onnu."},
 {ta:"கடைசியா ஒரு சோதனை சொல்லுறேன். வாக்கியத்தை 'so that … not' -ஆ மாத்திப் பாருங்க. 'Walk carefully lest you should fall' = 'Walk carefully so that you may NOT fall'. கவனிங்க — 'so that'-க்கு 'not' வரும்! 'Lest'-க்கு 'not' வராது! ஏன்னா 'lest'-லயே 'not' இருக்கு. இந்த ரெண்டு அமைப்பையும் ஒப்பிட்டு பாருங்க, தெளிவா புரியும்.",
  tl:"Kadaisiyaa oru sodhanai solluren. Vaakkiyaththai 'so that … not'-aa maaththip paarunga. 'Walk carefully lest you should fall' = 'Walk carefully so that you may NOT fall'. Kavaninga — 'so that'-kku 'not' varum! 'Lest'-kku 'not' varaadhu!"}]},
/* ========== RULE 90 ========== */
{n:90,rc:"CON-05",d:"Hard",t:"UNLESS and UNTIL take NO additional negative",
 tam:"Unless = If not · Until = -வரை — இரண்டிலும் எதிர்மறை ஏற்கனவே உள்ளது",
 s1:{en:"UNLESS already means 'IF … NOT'. UNTIL already carries a negative sense of 'not before'. Neither may take another 'not'. Also, UNLESS and UNTIL clauses take the PRESENT tense even for future meaning.",
  ta:"UNLESS ஏற்கனவே 'IF … NOT' என்று பொருள்படுகிறது. UNTIL ஏற்கனவே 'அதற்கு முன் இல்லை' என்ற எதிர்மறை உணர்வைச் சுமக்கிறது. இரண்டும் இன்னொரு 'not' எடுக்கக்கூடாது. மேலும், UNLESS மற்றும் UNTIL clause-கள் எதிர்காலப் பொருளுக்கும் நிகழ்காலத்தை எடுக்கின்றன.",
  tl:"UNLESS erkanave 'IF … NOT' endru porulpadugiradhu. UNTIL erkanave 'adharku mun illai' endra edhirmarai unarvaich sumakkiradhu. Irandum innoru 'not' edukkakkoodaadhu.",
  formula:"UNLESS  =  IF … NOT\n\n  UNLESS you work hard, you will fail.        ✔\n  IF you do NOT work hard, you will fail.     ✔\n  UNLESS you do NOT work hard, you will fail. ✘\n\nUNTIL  =  up to the time when … not before\n\n  Wait here UNTIL I return.                   ✔\n  Do not wait here until I do not return.     ✘\n\n⚠ BOTH CLAUSES TAKE THE PRESENT TENSE:\n  Unless he COMES, we will not start.  (not 'will come')"},

 s2:[
 {h:"UNLESS is a compressed 'if not'",
  en:"'Unless you work hard' is exactly 'If you do NOT work hard'. The 'not' has been folded into the word. Writing 'unless you do not work hard' unfolds it twice and means the opposite.",
  ta:"UNLESS ஒரு சுருக்கப்பட்ட 'if not'. 'Unless you work hard' என்பது சரியாக 'If you do NOT work hard'. 'Not' அந்தச் சொல்லுக்குள் மடிக்கப்பட்டிருக்கிறது. 'Unless you do not work hard' என்று எழுதுவது அதை இரண்டு முறை விரித்து, எதிரான பொருளைத் தருகிறது.",
  tl:"UNLESS oru surukkappatta 'if not'. 'Unless you work hard' enbadhu sariyaaga 'If you do NOT work hard'. 'Not' andhach sollukkul madikkappattirukkiradhu."},
 {h:"UNTIL means 'up to that point, and not before'",
  en:"'Wait here until I return' already tells you not to leave before the return. Adding 'not' inside the until-clause destroys the sense. 'Do not wait until I do not return' means nothing.",
  ta:"UNTIL என்றால் 'அந்தப் புள்ளி வரை, அதற்கு முன் அல்ல'. 'Wait here until I return' திரும்பி வருவதற்கு முன் கிளம்பக்கூடாது என்று ஏற்கனவே சொல்கிறது. Until-clause-க்குள் 'not' சேர்ப்பது பொருளை அழிக்கிறது. 'Do not wait until I do not return' எதுவும் பொருள்படாது.",
  tl:"UNTIL endraal 'andhap pulli varai, adharku mun alla'. 'Wait here until I return' erkanave solgiradhu. Until-clause-kkul 'not' serppadhu porulai azhikkiradhu."},
 {h:"Both take the present tense for future meaning",
  en:"'Unless he COMES, we will not start' — not 'will come'. 'Wait until he ARRIVES' — not 'will arrive'. This is the same time-clause rule you met in Tense Rule 62, where 'when', 'before' and 'after' also take the present.",
  ta:"இரண்டும் எதிர்காலப் பொருளுக்கு நிகழ்காலம் எடுக்கின்றன. 'Unless he COMES, we will not start' — 'will come' அல்ல. 'Wait until he ARRIVES' — 'will arrive' அல்ல. இது நீங்கள் Tense Rule 62-ல் சந்தித்த அதே நேரக் clause விதி, அங்கே 'when', 'before' மற்றும் 'after'-ம் நிகழ்காலம் எடுக்கின்றன.",
  tl:"Irandum edhirkaalap porulukku nigazhkaalam edukkindrana. 'Unless he COMES, we will not start'. Idhu Tense Rule 62-l sandhiththa adhe nerak clause vidhi."},
 {h:"UNTIL and TILL are the same; UNLESS and TILL are not",
  en:"'Till' and 'until' mean exactly the same, though 'until' is preferred at the start of a sentence. But do not confuse 'until' (time) with 'unless' (condition). 'Wait UNTIL he comes' is time; 'UNLESS he comes' is a condition.",
  ta:"UNTIL மற்றும் TILL ஒன்றே; UNLESS மற்றும் TILL வேறு. 'Till' மற்றும் 'until' சரியாக ஒரே பொருள், இருந்தும் வாக்கியத் தொடக்கத்தில் 'until' விரும்பப்படுகிறது. ஆனால் 'until' (நேரம்) மற்றும் 'unless' (நிபந்தனை) குழப்பிக்கொள்ளாதீர்கள். 'Wait UNTIL he comes' நேரம்; 'UNLESS he comes' ஒரு நிபந்தனை.",
  tl:"UNTIL matrum TILL ondre; UNLESS matrum TILL veru. Aanaal 'until' (neram) matrum 'unless' (nibandhanai) kuzhappikkollaadheergal."}],

 s3:[
 {h:"UNLESS unfolds into IF NOT",
  d:"   UNLESS  =  IF … NOT\n     ↑\n   the NOT is folded in here\n\n   UNLESS you work hard, you will fail.\n     = IF you do NOT work hard, you will fail. ✔\n\n   ✘ UNLESS you do NOT work hard ...\n     = IF you do not NOT work hard ...\n     = IF you DO work hard ...   opposite meaning!"},
 {h:"UNTIL already blocks the earlier time",
  d:"   Wait here ──────────► I return\n              UNTIL\n\n   'Until' already means:\n     up to that point, and NOT before\n\n   ✘ Do not wait until I do NOT return.\n     — the sentence collapses into nonsense"},
 {h:"Present tense for future meaning",
  d:"   ✔ Unless he COMES, we will not start.\n   ✘ Unless he WILL COME, we will not start.\n\n   ✔ Wait until he ARRIVES.\n   ✘ Wait until he WILL ARRIVE.\n\n   Same family as WHEN, BEFORE, AFTER,\n   AS SOON AS  (Tense Rule 62):\n   the time or condition clause stays PRESENT."}],

 s4:{
 wrong:["\"'Unless you do not work hard' makes the warning stronger.\" — It reverses the meaning.",
  "\"'Until he will come' shows the future correctly.\" — Time clauses take the present.",
  "\"'Unless' and 'until' are interchangeable.\" — One is condition, the other is time.",
  "\"'Do not go until he does not come' is emphatic.\" — It is a double negative."],
 right:["Unfold 'unless' into 'if not' and check the meaning.",
  "Never write 'not' inside an unless-clause or an until-clause.",
  "Keep the unless-clause and until-clause in the present tense.",
  "Unless = condition. Until = time."]},

 s5:[
 {en:"Unless you work hard, you will fail.",ta:"நீங்கள் கடினமாக உழைக்காவிட்டால், தோல்வியடைவீர்கள்.",tl:"Neengal kadinamaaga uzhaikkaavittaal, tholviyadaiveergal.",note:"UNLESS with no extra 'not'."},
 {en:"If you do not work hard, you will fail.",ta:"நீங்கள் கடினமாக உழைக்கவில்லை என்றால், தோல்வியடைவீர்கள்.",tl:"Neengal kadinamaaga uzhaikkavillai endraal, tholviyadaiveergal.",note:"The 'if not' version of the same sentence."},
 {en:"Wait here until I return from the office.",ta:"நான் அலுவலகத்திலிருந்து திரும்பி வரும் வரை இங்கேயே காத்திருங்கள்.",tl:"Naan aluvalagaththilirundhu thirumbi varum varai ingeye kaaththirungal.",note:"UNTIL with the present tense and no extra 'not'."},
 {en:"Unless he comes, we will not start the meeting.",ta:"அவர் வராவிட்டால், நாங்கள் கூட்டத்தைத் தொடங்க மாட்டோம்.",tl:"Avar varaavittaal, naangal koottaththaith thodanga maattom.",note:"COMES, not 'will come' — the condition clause stays present."},
 {en:"Do not leave the room until the bell rings.",ta:"மணி அடிக்கும் வரை அறையை விட்டு வெளியேறாதீர்கள்.",tl:"Mani adikkum varai araiyai vittu veliyeraadheergal.",note:"The 'not' belongs to the main clause, never inside the until-clause."}],

 s9:[
 "Fill in the Blank|Unless the government ____ immediate steps, the situation will get worse.|will take;takes|1|The condition clause stays present.",
 "Find the Error|Please do not leave (A) the examination hall (B) until the invigilator (C) does not collect your paper (D).|A;B;C;D|3|Part D. 'Until' takes no extra negative → 'collects your paper'.",
 "Sentence Improvement|Unless you do not submit the form before Friday, your application will be rejected.|Unless you do not submit;Unless you submit;If you submit|1|'Unless' already means 'if not'.",
 "Fill in the Blank|The committee will not take a decision until it ____ all the relevant documents.|will examine;examines|1|The time clause stays present.",
 "Find the Error|He will not be able (A) to appear for the test (B) unless he will pay (C) the prescribed fee (D).|A;B;C;D|2|Part C. The condition clause stays present → 'unless he pays'."],

 s10:{
  en:"Both words hide a negative, and the exam adds a visible one on top. 'Unless you do not work hard' feels like a strong warning but says the opposite. The second layer is tense: 'unless he will come' and 'until he will arrive' look like correct future forms, but condition and time clauses always stay in the present.",
  ta:"இரண்டு சொற்களும் ஒரு எதிர்மறையை மறைத்து வைத்திருக்கின்றன, தேர்வு அதன் மேல் ஒரு தெரியக்கூடிய எதிர்மறையைச் சேர்க்கிறது. 'Unless you do not work hard' ஒரு வலுவான எச்சரிக்கை போலத் தோன்றுகிறது ஆனால் எதிரானதைச் சொல்கிறது. இரண்டாவது அடுக்கு காலம்: 'unless he will come' மற்றும் 'until he will arrive' சரியான எதிர்கால வடிவங்கள் போலத் தெரிகின்றன, ஆனால் நிபந்தனை மற்றும் நேரத் தொடர்கள் எப்போதும் நிகழ்காலத்திலேயே இருக்கும்.",
  tl:"Irandu sorkalum oru edhirmaraiyai maraiththu vaiththirukkindrana, thervu adhan mel oru theriyakkoodiya edhirmaraiyaich serkkiradhu. Irandaavadhu adukku kaalam."},

 s11:{
  en:"UNLESS = IF NOT. UNTIL = not before. Never add another 'not', and keep the clause in the present.",
  ta:"UNLESS = IF NOT. UNTIL = அதற்கு முன் இல்லை. இன்னொரு 'not' சேர்க்காதீர்கள், தொடரை நிகழ்காலத்தில் வையுங்கள்.",
  tl:"UNLESS = IF NOT. UNTIL = adharku mun illai. Innoru 'not' serkkaadheergal, thodarai nigazhkaalaththil vaiyungal.",
  vis:"      TWO HIDDEN NEGATIVES\n\n   UNLESS  =  IF … NOT\n   UNTIL   =  not before that point\n\n   ┌───────────────────────────────┐\n   │ NEVER put 'not' inside either │\n   └───────────────────────────────┘\n\n   ✔ UNLESS you work hard ...\n   ✘ unless you do NOT work hard\n\n   ✔ Wait UNTIL I return.\n   ✘ until I do NOT return\n\n   ⚠ PRESENT TENSE FOR FUTURE MEANING:\n     ✔ Unless he COMES ...\n     ✘ unless he WILL COME\n     ✔ Wait until he ARRIVES.\n     ✘ until he WILL ARRIVE\n     (same family as when / before / after\n      — Tense Rule 62)\n\n   UNLESS = condition · UNTIL = time"},

 s13:[
 "Unless he ____ hard, he will fail, and neither his parents ____ his teacher will be pleased.|works-nor;will work-or;works-or|0|The condition clause stays present. NEITHER pairs with NOR (Rule 86).",
 "Wait here until I ____ , and do not open the door lest a stranger ____ enter.|return-should;will return-will;return-should not|0|The time clause stays present. LEST + SHOULD with no 'not' (Rule 89).",
