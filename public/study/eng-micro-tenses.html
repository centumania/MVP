 s13:[
 "No sooner ____ he arrived ____ it began to rain, and he ____ no umbrella.|had-than-had;did-when-has;had-when-had|0|Inversion with the past perfect → HAD. 'No sooner' pairs with THAN. 'Have' as possession → HAD.",
 "Hardly ____ we sat down ____ the bell rang, and each of us ____ up at once.|we had-than-stood;had we-when-stood;had we-than-stood|1|Inversion → HAD WE. 'Hardly' pairs with WHEN. 'Each of us' is singular → STOOD.",
 "Scarcely had the meeting begun ____ the power failed, and nobody ____ what to do.|than-knew;when-knew;when-was knowing|1|'Scarcely' pairs with WHEN. 'Know' is stative → KNEW (Rule 59).",
 "No sooner had ____ MLA left ____ the crowd dispersed, since ____ news had spread.|an-than-the;a-when-a;an-when-the|0|'MLA' = 'em' → AN. 'No sooner' pairs with THAN. 'News' takes THE.",
 "Hardly had I reached ____ station ____ I realised that I ____ my ticket at home.|the-when-had left;a-than-left;the-than-had left|0|Specific station → THE. 'Hardly' pairs with WHEN. The earlier action → HAD LEFT (Rule 54)."],

 s14:{
  rule:"Hardly and scarcely pair with 'when'; no sooner pairs with 'than'. The first clause takes the past perfect with inversion.",
  formula:"HARDLY / SCARCELY + had + subject + V3 + WHEN + V2\nNO SOONER + had + subject + V3 + THAN + V2",
  memory:"'Sooner' is a comparative, and comparatives take THAN — just like 'taller than'.",
  ta:"'Sooner' ஒரு comparative, comparative-க்கு THAN வரும் — 'taller than' மாதிரி.",
  tl:"'Sooner' oru comparative, comparative-kku THAN varum — 'taller than' maadhiri.",
  mistake:"Swapping the pairs, forgetting the inversion, and using the simple past in the first clause.",
  exam:"SSC CGL / CHSL, CDS and Bank — appears in Error Spotting, Sentence Improvement and Fill in the Blank."},

 s15:[
 {ta:"இந்த rule-ல மூணு விஷயம் ஒரே நேரத்துல சரியா இருக்கணும். ஒண்ணு — சரியான ஜோடி. ரெண்டு — தலைகீழாக்கம். மூணு — past perfect. மூணுல ஒண்ணு தப்பா இருந்தாலும் mark போயிடும்.",
  tl:"Indha rule-la moonu vishayam ore neraththula sariyaa irukkanum. Onnu — sariyaana jodi. Rendu — thalaigeezhaakkam. Moonu — past perfect."},
 {ta:"முதல்ல ஜோடி. HARDLY-க்கு WHEN. SCARCELY-க்கு WHEN. NO SOONER-க்கு THAN. இது நிலையானது, மாறவே மாறாது. SSC 'hardly...than' அப்படின்னும் 'no sooner...when' அப்படின்னும் தந்து உங்களை ஏமாத்தும்.",
  tl:"Mudhalla jodi. HARDLY-kku WHEN. SCARCELY-kku WHEN. NO SOONER-kku THAN. Idhu nilaiyaanadhu, maarave maaraadhu. SSC 'hardly...than' appadinnum 'no sooner...when' appadinnum thandhu ungalai emaaththum."},
 {ta:"ஏன் 'no sooner'-க்கு 'than'? ஒரு அழகான காரணம் இருக்கு. 'Sooner' அப்படிங்கிறது என்ன? 'Soon'-ஓட comparative! Tall → taller. Soon → sooner. Comparative-க்கு எப்பவும் 'than' வரும் இல்லையா? 'He is taller THAN me.' அதே மாதிரி 'No sooner ... THAN'. இந்த ஒரு காரணம் தெரிஞ்சா, நீங்க இதை ஒருபோதும் மறக்க மாட்டீங்க.",
  tl:"Yen 'no sooner'-kku 'than'? Oru azhagaana kaaranam irukku. 'Sooner' appadingiradhu enna? 'Soon'-oda comparative! Tall → taller. Soon → sooner. Comparative-kku eppavum 'than' varum illaiyaa? Adhe maadhiri 'No sooner ... THAN'."},
 {ta:"ரெண்டாவது — தலைகீழாக்கம். 'Hardly HE HAD arrived' — தப்பு. 'Hardly HAD HE arrived' — சரி. துணை வினைச்சொல் 'had' subject-க்கு முன்னாடி வரணும். இது நீங்க SVA module-ல Rule 49-ல படிச்ச அதே தலைகீழாக்கம். Never, seldom, hardly, rarely — இதெல்லாம் வாக்கிய ஆரம்பத்துல வந்தா தலைகீழாக்கம் கட்டாயம்.",
  tl:"Randaavadhu — thalaigeezhaakkam. 'Hardly HE HAD arrived' — thappu. 'Hardly HAD HE arrived' — sari. Thunai vinaichol 'had' subject-kku munnaadi varanum. Idhu neenga SVA module-la Rule 49-la padicha adhe thalaigeezhaakkam."},
 {ta:"மூணாவது — past perfect. முதல் clause-ல 'had + V3' வரணும். 'No sooner DID he arrive' — தப்பு. 'No sooner HAD he ARRIVED' — சரி. ஏன்? ஏன்னா ரெண்டு கடந்தகால செயல் இருக்கு, முதல்ல நடந்ததுக்கு past perfect. இது Rule 54-ல படிச்சோம்.",
  tl:"Moonaavadhu — past perfect. Mudhal clause-la 'had + V3' varanum. 'No sooner DID he arrive' — thappu. 'No sooner HAD he ARRIVED' — sari. Idhu Rule 54-la padichom."},
 {ta:"கடைசியா ஒரு உதவிகரமான trick. உங்களுக்கு குழப்பமா இருந்தா, வாக்கியத்தை 'As soon as'-ல மாத்தி எழுதிப் பாருங்க. 'No sooner had he arrived than it rained' = 'As soon as he arrived, it rained.' அர்த்தம் ஒண்ணுதான். இந்த மாற்று வடிவத்துல தலைகீழாக்கம் இல்ல, past perfect இல்ல — எளிது. ஆனா தேர்வுல 'no sooner' வடிவம் கேட்டா, மூணு விஷயத்தையும் சரியா போடுங்க.",
  tl:"Kadaisiyaa oru udhavigaramaana trick. Ungalukku kuzhappamaa irundhaa, vaakkiyaththai 'As soon as'-la maaththi ezhudhip paarunga. 'No sooner had he arrived than it rained' = 'As soon as he arrived, it rained.' Arththam onnu-dhaan."}]},

/* ========== RULE 62 ========== */
{n:62,rc:"TEN-12",d:"Medium",t:"Future Perfect for an Action Completed by a Future Time",
 tam:"எதிர்காலத்தில் ஒரு நேரத்திற்குள் முடியப்போகும் செயலுக்கு will have + V3",
 s1:{en:"Use the FUTURE PERFECT (will have + V3) for an action that will be FINISHED before a stated point in the future. The signal is usually BY + a future time.",
  ta:"எதிர்காலத்தில் ஒரு குறிப்பிட்ட புள்ளிக்கு முன் முடிந்துவிடும் ஒரு செயலுக்கு FUTURE PERFECT (will have + V3) பயன்படுத்தவும். அறிகுறி பொதுவாக BY + ஒரு எதிர்கால நேரம்.",
  tl:"Edhirkaalaththil oru kurippitta pullikku mun mudindhuvidum oru seyalukku FUTURE PERFECT (will have + V3) payanpaduththavum. Arikuri podhuvaaga BY + oru edhirkaala neram.",
  formula:"WILL HAVE + V3\n\n  By next June, I WILL HAVE COMPLETED my course.\n  They WILL HAVE REACHED Delhi by midnight.\n  By 2030, the city WILL HAVE EXPANDED greatly.\n\nSIGNAL WORD:  BY + future time\n  by tomorrow · by next week · by 2030\n  by the time you return"},

 s2:[
 {h:"Looking back from a future point",
  en:"'By next June I will have completed my course' — imagine standing in next June and looking BACK at the finished course. The future perfect looks backwards from a future viewpoint. That double movement in time is what makes it special.",
  ta:"ஒரு எதிர்காலப் புள்ளியிலிருந்து பின்னோக்கிப் பார்ப்பது. 'By next June I will have completed my course' — அடுத்த ஜூன் மாதத்தில் நின்று, முடிந்த படிப்பைப் பின்னோக்கிப் பார்ப்பதாகக் கற்பனை செய்யுங்கள். Future perfect ஒரு எதிர்காலப் பார்வையிலிருந்து பின்னோக்கிப் பார்க்கிறது. நேரத்தில் அந்த இரட்டை நகர்வுதான் அதைச் சிறப்பாக்குகிறது.",
  tl:"Oru edhirkaalap pulliyilirundhu pinnokkip paarppadhu. Future perfect oru edhirkaalap paarvaiyilirundhu pinnokkip paarkkiradhu. Neraththil andha irattai nagarvudhaan adhaich sirappaakkugiradhu."},
 {h:"'BY' is the signal, 'AT' is not",
  en:"'BY six o'clock' means before or at six — the deadline sense that the future perfect needs. 'AT six o'clock' means exactly at six, which takes the simple future. Read the preposition carefully.",
  ta:"'BY' அறிகுறி, 'AT' அல்ல. 'BY six o'clock' என்றால் ஆறு மணிக்கு முன் அல்லது ஆறு மணிக்கு — future perfect-க்குத் தேவையான காலக்கெடு உணர்வு. 'AT six o'clock' என்றால் சரியாக ஆறு மணிக்கு, அது simple future எடுக்கும். முன்னுருபைக் கவனமாகப் படியுங்கள்.",
  tl:"'BY' arikuri, 'AT' alla. 'BY six o'clock' endraal aaru manikku mun alladhu aaru manikku — future perfect-kkuth thevaiyaana kaalakkedu unarvu. 'AT six o'clock' endraal sariyaaga aaru manikku."},
 {h:"With 'by the time', the other clause is present",
  en:"'By the time you RETURN, I will have finished' — 'by the time' is a time clause, so it takes the PRESENT tense (Rule 55). The main clause takes 'will have + V3'. Two rules working together.",
  ta:"'By the time'-உடன், மற்ற clause நிகழ்காலம். 'By the time you RETURN, I will have finished' — 'by the time' ஒரு time clause, எனவே அது நிகழ்கால tense எடுக்கும் (Rule 55). Main clause 'will have + V3' எடுக்கும். இரண்டு விதிகள் சேர்ந்து செயல்படுகின்றன.",
  tl:"'By the time'-udan, matra clause nigazhgaalam. 'By the time you RETURN, I will have finished' — 'by the time' oru time clause, enave adhu nigazhgaala tense edukkum (Rule 55)."},
 {h:"Future perfect continuous for duration",
  en:"'By 2027 she will have been working here for ten years' — 'will have been + V-ing' emphasises the LENGTH of time up to that future point. Use it when the sentence mentions 'for + a period'.",
  ta:"கால அளவுக்கு future perfect continuous. 'By 2027 she will have been working here for ten years' — 'will have been + V-ing' அந்த எதிர்காலப் புள்ளி வரையிலான கால அளவை வலியுறுத்துகிறது. வாக்கியம் 'for + ஒரு கால அளவு' குறிப்பிடும்போது அதைப் பயன்படுத்துங்கள்.",
  tl:"Kaala alavukku future perfect continuous. 'By 2027 she will have been working here for ten years' — 'will have been + V-ing' andha edhirkaalap pulli varaiyilaana kaala alavai valiyuruththugiradhu."}],

 s3:[
 {h:"Looking back from the future",
  d:"   NOW ─────────► NEXT JUNE ─────────►\n    │                  │\n    │   course runs    │  ← stand HERE\n    └──────────────────┘     and look BACK\n\n   By next June, I WILL HAVE COMPLETED my course.\n\n   The action finishes BEFORE that future point."},
 {h:"BY versus AT",
  d:"   BY six o'clock  →  any time up to six\n                      (a deadline)\n                      → WILL HAVE + V3\n     I will have finished BY six.\n\n   AT six o'clock  →  exactly at six\n                      (a moment)\n                      → WILL + V1\n     I will finish AT six."},
 {h:"Two rules working together",
  d:"   By the time you RETURN, I WILL HAVE FINISHED.\n                    ↑              ↑\n              present tense    future perfect\n              (Rule 55)         (Rule 62)\n\n   The time clause takes the PRESENT.\n   The main clause takes WILL HAVE + V3."}],

 s4:{
 wrong:["\"'By next June I will complete' is simpler.\" — 'By' requires the future perfect.",
  "\"'Will have' is only for the past.\" — 'Had' is for the past; 'will have' is for the future.",
  "\"'By the time you will return' shows the future.\" — Time clauses take the present tense.",
  "\"'At' and 'by' mean the same thing.\" — 'By' is a deadline; 'at' is an exact moment."],
 right:["Look for 'BY + a future time'. That is the signal.",
  "Write will have + V3 in the main clause.",
  "If 'by the time' appears, the other clause takes the present tense.",
  "For a length of time, use 'will have been + V-ing'."]},

 s5:[
 {en:"By next June, I will have completed my course.",ta:"அடுத்த ஜூன் மாதத்திற்குள் நான் என் படிப்பை முடித்திருப்பேன்.",tl:"Aduththa June maadhaththirkul naan en padippai mudiththiruppen.",note:"'By + future time' → future perfect."},
 {en:"They will have reached Delhi by midnight.",ta:"நள்ளிரவுக்குள் அவர்கள் டெல்லியை அடைந்திருப்பார்கள்.",tl:"Nallliravukkul avargal Delhi-yai adaindhiruppaargal.",note:"'By midnight' → future perfect."},
 {en:"By the time you return, I will have finished the work.",ta:"நீங்கள் திரும்பி வரும் நேரத்திற்குள் நான் வேலையை முடித்திருப்பேன்.",tl:"Neengal thirumbi varum neraththirkul naan velaiyai mudiththiruppen.",note:"The time clause takes the present; the main clause takes the future perfect."},
 {en:"By 2027 she will have been working here for ten years.",ta:"2027-க்குள் அவர் இங்கே பத்து ஆண்டுகள் பணியாற்றியிருப்பார்.",tl:"2027-kkul avar inge paththu aandugal paniyaatriyiruppaar.",note:"'For ten years' → future perfect continuous."},
 {en:"The meeting will start at six o'clock sharp.",ta:"கூட்டம் சரியாக ஆறு மணிக்குத் தொடங்கும்.",tl:"Koottam sariyaaga aaru manikkuth thodangum.",note:"'At six' is an exact moment → simple future."}],

 s7:[
 "By next June, I ____ my course.|will have completed|Easy|'By + future time'.",
 "They ____ Delhi by midnight.|will have reached|Easy|'By midnight'.",
 "By 2030, the city ____ greatly.|will have expanded|Easy|'By 2030'.",
 "By the time you return, I ____ dinner.|will have cooked|Medium|'By the time' + main clause.",
 "By tomorrow, he ____ the report.|will have submitted|Medium|'By tomorrow'.",
 "The meeting ____ at six sharp.|will start|Medium|'At six' is a moment → simple future.",
 "By next week, they ____ the bridge.|will have built|Medium|'By next week'.",
 "By 2027, she ____ here for ten years.|will have been working|Hard|A duration → future perfect continuous.",
 "By the time he ____, we will have left.|arrives|Hard|A time clause takes the present.",
 "By Friday, the results ____ announced.|will have been|Hard|Future perfect in the passive.",
 "I ____ my degree by the end of this year.|will have completed|Hard|'By the end of'.",
 "By the time the guests ____, dinner will be ready.|come|Expert|A time clause takes the present.",
 "By next month, he ____ in this office for five years.|will have worked|Expert|Duration up to a future point.",
 "The train ____ at seven in the morning.|will arrive|Expert|A scheduled moment → simple future.",
 "By 2035, most cars ____ electric.|will have become|Expert|'By 2035'."],

 s8:[
 "By next June, I will complete my course.|By next June, I will have completed my course.|'By + future time' requires the future perfect.",

 s10:{
  en:"Students see a future time and reach for plain 'will'. But 'BY next June' means the action must already be FINISHED at that point, and only the future perfect shows completion. The second trap is combining this with Rule 55: 'By the time you WILL return' is wrong because 'by the time' is a time clause and bans 'will'. Two rules must be satisfied in the same sentence.",
  ta:"மாணவர்கள் ஒரு எதிர்கால நேரத்தைப் பார்த்து வெறும் 'will'-ஐ எடுக்கிறார்கள். ஆனால் 'BY next June' என்றால் அந்தப் புள்ளியில் செயல் ஏற்கனவே முடிந்திருக்க வேண்டும், முடிவை future perfect மட்டுமே காட்டுகிறது. இரண்டாவது பொறி இதை Rule 55-உடன் இணைப்பது: 'By the time you WILL return' தவறு, ஏனெனில் 'by the time' ஒரு time clause, அது 'will'-ஐத் தடுக்கிறது. ஒரே வாக்கியத்தில் இரண்டு விதிகளும் திருப்திப்படுத்தப்பட வேண்டும்.",
  tl:"Maanavargal oru edhirkaala neraththaip paarththu verum 'will'-ai edukkiraargal. Aanaal 'BY next June' endraal andhap pulliyil seyal erkanave mudindhirukka vendum. Irandaavadhu pori idhai Rule 55-udan inaippadhu."},

 s15:[
 {ta:"நாம Tenses module-ஓட கடைசி rule-க்கு வந்துட்டோம். Future perfect — 'will have + V3'. இது கொஞ்சம் சிக்கலா தோணும், ஆனா ஒரு படம் மனசுல வெச்சுக்கிட்டா ரொம்ப எளிது.",
  tl:"Naama Tenses module-oda kadaisi rule-kku vandhuttom. Future perfect — 'will have + V3'. Idhu konjam sikkalaa thonum, aanaa oru padam manasula vechukkittaa romba eladhu."},
 {ta:"கற்பனை பண்ணுங்க — நீங்க அடுத்த ஜூன் மாதத்துல நிக்கிறீங்க. அங்க இருந்து பின்னாடி திரும்பி பாருங்க. உங்க படிப்பு முடிஞ்சிருக்கு. அதை இப்போ இருந்து எப்படி சொல்றது? 'By next June, I WILL HAVE COMPLETED my course.'",
  tl:"Karpanai pannunga — neenga aduththa June maadhaththula nikkireenga. Anga irundhu pinnaadi thirumbi paarunga. Unga padippu mudinjirukku. Adhai ippo irundhu eppadi solradhu? 'By next June, I WILL HAVE COMPLETED my course.'"},
 {ta:"Future perfect அப்படிங்கிறது ஒரு எதிர்கால புள்ளியில இருந்து பின்னோக்கி பார்க்குது. அதனாலதான் 'will' (எதிர்காலம்) மற்றும் 'have + V3' (நிறைவு) ரெண்டும் சேர்ந்து வருது. எதிர்காலத்துல முடிஞ்சிருக்கும் — அதுதான் அர்த்தம்.",
  tl:"Future perfect appadingiradhu oru edhirkaala pulliyila irundhu pinnokki paarkkudhu. Adhanaaladhaan 'will' (edhirkaalam) matrum 'have + V3' (niraivu) rendum serndhu varudhu."},
 {ta:"அறிகுறி என்ன? 'BY'. 'By tomorrow', 'by next week', 'by 2030', 'by midnight', 'by the end of the year', 'by the time you return'. இந்த 'by' பார்த்தா உடனே 'will have + V3' போடுங்க.",
  tl:"Arikuri enna? 'BY'. 'By tomorrow', 'by next week', 'by 2030', 'by midnight', 'by the end of the year', 'by the time you return'. Indha 'by' paarththaa udane 'will have + V3' podunga."},
 {ta:"ஆனா ஒரு எச்சரிக்கை — 'by' வேற, 'at' வேற. 'By six o'clock' அப்படின்னா ஆறு மணிக்குள்ள — காலக்கெடு. அதுக்கு future perfect. ஆனா 'AT six o'clock' அப்படின்னா சரியா ஆறு மணிக்கு — ஒரு தருணம். அதுக்கு simple future — 'will start'. முன்னுருபை கவனமா படிங்க.",

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[

 ["Exam Trap","தேர்வு பொறி · Thervu pori"],

 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-tenses', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
