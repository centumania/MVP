<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Tenses — 12 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

  <div class="top">

{n:51,rc:"TEN-01",d:"Easy",t:"Simple Present for Universal Truths and Habits",

  ta:"நிரந்தர உண்மைகள், அறிவியல் உண்மைகள், வழக்கமான செயல்கள், பழமொழிகள், நிலையான கால அட்டவணைகளுக்கு SIMPLE PRESENT பயன்படுத்தவும். இவை எந்தக் குறிப்பிட்ட தருணத்துடனும் பிணைக்கப்படவில்லை, எனவே continuous அல்லது perfect வடிவம் தேவையில்லை.",
  tl:"Nirandhara unmaigal, ariviyal unmaigal, vazhakkamaana seyalgal, pazhamozhigal, nilaiyaana kaala attavanaigalukku SIMPLE PRESENT payanpaduththavum.",
  formula:"SIMPLE PRESENT  →  V1 (+ -s for he/she/it)\n\n  UNIVERSAL TRUTH : The sun RISES in the east.\n  SCIENTIFIC FACT : Water BOILS at 100 degrees.\n  HABIT           : He GOES to office at nine daily.\n  PROVERB         : Honesty PAYS in the long run.\n  TIMETABLE       : The train LEAVES at 6 p.m."},

 s2:[
 {h:"A universal truth stays present even inside a past sentence",
  en:"This is the tested part. 'The teacher said that the earth IS round' — not 'was round'. A fact that is permanently true does not shift back into the past, even when the reporting verb is past. This is the famous exception to Rule 56.",
  ta:"கடந்தகால வாக்கியத்திற்குள்ளும் நிரந்தர உண்மை நிகழ்காலமாகவே இருக்கும். இதுதான் சோதிக்கப்படும் பகுதி. 'The teacher said that the earth IS round' — 'was round' அல்ல. நிரந்தரமாக உண்மையான ஒரு உண்மை கடந்தகாலத்திற்குப் பின்னோக்கி நகராது, reporting verb கடந்தகாலமாக இருந்தாலும். இது Rule 56-ன் புகழ்பெற்ற விதிவிலக்கு.",

 {h:"Habitual action versus action happening now",
  en:"'He goes to office at nine' is a habit — he does it every day. 'He is going to office' is happening at this moment. Look for words like daily, always, usually, every day, often, never — these signal a habit and demand the simple present.",
  ta:"வழக்கமான செயல் மற்றும் இப்போது நடக்கும் செயல். 'He goes to office at nine' ஒரு பழக்கம் — அவர் தினமும் அதைச் செய்கிறார். 'He is going to office' இந்தத் தருணத்தில் நடக்கிறது. daily, always, usually, every day, often, never போன்ற சொற்களைத் தேடுங்கள் — இவை ஒரு பழக்கத்தைக் குறிக்கின்றன, simple present-ஐக் கோருகின்றன.",

 {h:"Timetables use the simple present, not the future",

  ta:"கால அட்டவணைகள் எதிர்காலத்தை அல்ல, simple present-ஐப் பயன்படுத்துகின்றன. 'The train leaves at 6 p.m. tomorrow' — எதிர்காலத்தைக் குறித்தாலும், நிலையான பொது அட்டவணை simple present எடுக்கும். கடைகள், திரையரங்குகள், விமானங்கள், அதிகாரப்பூர்வ அட்டவணைகளுக்கும் அதேதான்.",

 s9:[
 "Fill in the Blank|Our science teacher told us that the earth ____ round the sun once a year.|moved;moves|1|A universal truth stays in the present tense.",
 "Find the Error|He is going (A) to the temple (B) every Friday morning (C) with his mother (D).|A;B;C;D|0|Part A. 'Every Friday' signals a habit → 'He goes'.",
 "Sentence Improvement|The train will leave at six in the evening according to the new timetable.|will leave;leaves;is leaving|1|A fixed timetable takes the simple present.",
 "Fill in the Blank|The guide explained that the Ganga ____ through several northern states.|flowed;flows|1|A permanent geographical fact stays present.",
 "Find the Error|My father read (A) the newspaper (B) every morning (C) before going to work (D).|A;B;C;D|0|Part A. Third person singular habit → 'reads'."],

 s10:{
  en:"The exam hides a universal truth inside a past-tense sentence. 'The teacher SAID that the earth ____ round' — your instinct is to match 'said' and write 'was'. That is Rule 56 thinking, and here it is wrong. A permanent fact never shifts. The second trap is the timetable: 'The train ____ at six tomorrow' looks like the future but takes the simple present.",
  ta:"தேர்வு ஒரு நிரந்தர உண்மையை கடந்தகால வாக்கியத்திற்குள் மறைத்துவிடும். 'The teacher SAID that the earth ____ round' — 'said'-உடன் பொருத்தி 'was' எழுதுவது உங்கள் உள்ளுணர்வு. அது Rule 56 சிந்தனை, இங்கே அது தவறு. ஒரு நிரந்தர உண்மை ஒருபோதும் நகராது. இரண்டாவது பொறி கால அட்டவணை: 'The train ____ at six tomorrow' எதிர்காலம் போலத் தெரிகிறது ஆனால் simple present எடுக்கிறது.",
  tl:"Thervu oru nirandhara unmaiyai kadandhagaala vaakkiyaththirkul maraiththividum. 'The teacher SAID that the earth ____ round' — 'said'-udan poruththi 'was' ezhudhuvadhu ungal ullunarvu. Adhu Rule 56 sindhanai, inge adhu thavaru."},

 s11:{
  en:"IS IT ALWAYS TRUE? Then simple present, no matter what the rest of the sentence does.",
  ta:"அது எப்போதும் உண்மையா? அப்படியானால் simple present, மீதி வாக்கியம் என்ன செய்தாலும் சரி.",
  tl:"Adhu eppodhum unmaiyaa? Appadiyaanaal simple present, meedhi vaakkiyam enna seydhaalum sari.",
  vis:"      THE 'ALWAYS TRUE' TEST\n\n   Ask: was it true yesterday?\n        is it true today?\n        will it be true tomorrow?\n\n   THREE YESES  →  SIMPLE PRESENT\n\n   The earth is round.        ✔ always true\n   Water boils at 100°C.      ✔ always true\n   Honesty pays.              ✔ always true\n\n   ⚠ EVEN AFTER A PAST VERB:\n     He said that the earth IS round.  ✔\n\n   ⚠ TIMETABLES TOO:\n     The train LEAVES at six tomorrow. ✔"},

 s13:[
 "Our teacher told us that the earth ____ round and that water ____ at 100 degrees.|was-boiled;is-boils;is-boiled|1|Both are universal truths and stay in the present tense.",
 "He ____ to office at nine daily, and each of his colleagues ____ the same routine.|goes-follows;go-follow;goes-follow|0|Habit → GOES. 'Each of' is fixed singular (SVA Rule 50) → FOLLOWS.",

 s14:{
  rule:"Use the simple present for universal truths, scientific facts, habits, proverbs and fixed timetables.",
  formula:"UNIVERSAL TRUTH / FACT / HABIT / PROVERB / TIMETABLE → SIMPLE PRESENT\nStays present even after a past reporting verb",
  memory:"Always true? Then simple present, whatever the rest of the sentence does.",
  ta:"எப்பவும் உண்மையா? அப்படின்னா simple present, மீதி வாக்கியம் என்னவா இருந்தாலும்.",
  tl:"Eppavum unmaiyaa? Appadinnaa simple present, meedhi vaakkiyam ennavaa irundhaalum.",
  mistake:"Shifting a universal truth into the past because the reporting verb is past.",
  exam:"SSC CGL / CHSL, RRB and Bank — the 'he said that the earth is round' pattern is very frequent."},

 s15:[
 {ta:"Tenses module-ஐ ஆரம்பிக்கலாம். இது SSC-ல மிக அதிக மதிப்பெண் தரும் module-ல ஒண்ணு. முதல் rule ரொம்ப எளிமையானது — simple present.",
  tl:"Tenses module-ai aarambikkalaam. Idhu SSC-la miga adhiga madhippen tharum module-la onnu. Mudhal rule romba elimaiyaanadhu — simple present."},
 {ta:"Simple present-ஐ எப்போ பயன்படுத்தணும்? ஐந்து சூழல். ஒண்ணு — நிரந்தர உண்மை. 'The sun rises in the east.' ரெண்டு — அறிவியல் உண்மை. 'Water boils at 100 degrees.' மூணு — பழக்கம். 'He goes to office at nine daily.' நாலு — பழமொழி. 'Honesty pays.' அஞ்சு — கால அட்டவணை. 'The train leaves at six.'",
  tl:"Simple present-ai eppo payanpaduththanum? Aindhu soozhal. Onnu — nirandhara unmai. Rendu — ariviyal unmai. Moonu — pazhakkam. Naalu — pazhamozhi. Anju — kaala attavanai."},
 {ta:"இந்த ஐந்துக்கும் ஒரு பொதுத்தன்மை இருக்கு — எதுவும் ஒரு குறிப்பிட்ட நேரத்தோட பிணைக்கப்படல. சூரியன் நேத்தும் உதிச்சது, இன்னைக்கும் உதிக்குது, நாளைக்கும் உதிக்கும். அதனால நேரத்தை காட்டற எந்த சிக்கலான வடிவமும் தேவையில்ல. எளிய நிகழ்காலம் போதும்.",
  tl:"Indha aindhukkum oru podhuththanmai irukku — edhuvum oru kurippitta neraththoda pinaikkappadala. Sooriyan neththum udhichadhu, innaikkum udhikkudhu, naalaikkum udhikkum. Adhanaala neraththai kaattara endha sikkalaana vadivamum thevaiyilla."},
 {ta:"இப்போ SSC-ஓட உண்மையான களம் சொல்லுறேன். அவங்க ஒரு நிரந்தர உண்மையை கடந்தகால வாக்கியத்துக்குள்ள மறைப்பாங்க. 'The teacher SAID that the earth ____ round.' இப்போ என்ன போடுவீங்க? 'Said' கடந்தகாலம், அதனால 'was' போடலாம்னு தோணும். ஆனா தப்பு! சரியான பதில் 'IS'.",
  tl:"Ippo SSC-oda unmaiyaana kalam solluren. Avanga oru nirandhara unmaiyai kadandhagaala vaakkiyaththukkulla maraippaanga. 'The teacher SAID that the earth ____ round.' Ippo enna poduveenga? 'Said' kadandhagaalam, adhanaala 'was' podalaamnu thonum. Aanaa thappu! Sariyaana padhil 'IS'."},
 {ta:"ஏன்? யோசிச்சுப் பாருங்க. Teacher நேத்து சொன்னாரு. ஆனா பூமி இன்னைக்கும் உருண்டையாதான் இருக்கு இல்லையா? அது நேத்து உண்மை, இன்னைக்கும் உண்மை, நாளைக்கும் உண்மை. அதனால அது நிகழ்காலத்துலயே இருக்கும். 'The teacher said that the earth IS round.' இது Rule 56-ஓட விதிவிலக்கு, அதை நாம பின்னாடி விரிவா பார்ப்போம்.",
  tl:"Yen? Yosichup paarunga. Teacher neththu sonnaaru. Aanaa boomi innaikkum urundaiyaadhaan irukku illaiyaa? Adhu neththu unmai, innaikkum unmai, naalaikkum unmai. Adhanaala adhu nigazhgaalaththulaye irukkum."},
 {ta:"கடைசியா ஒரு சின்ன ஆனா முக்கியமான விஷயம் — கால அட்டவணை. 'The train leaves at six tomorrow.' 'Tomorrow' இருக்கு, அதனால 'will leave' போடலாம்னு தோணும். ஆனா இல்ல. ரயில், விமானம், கடை, திரையரங்கு — இதெல்லாம் நிலையான அட்டவணை. அதுக்கு எப்பவும் simple present. இதை SSC அடிக்கடி கேட்கும். மேலும் ஒரு நினைவூட்டல் — 'he goes', 'she writes' அப்படின்னு -s போட மறக்காதீங்க. அது Module 4-ல படிச்ச SVA rule. Tense-ம் agreement-ம் எப்பவும் சேர்ந்தே வரும்.",
  tl:"Kadaisiyaa oru chinna aanaa mukkiyamaana vishayam — kaala attavanai. 'The train leaves at six tomorrow.' 'Tomorrow' irukku, adhanaala 'will leave' podalaamnu thonum. Aanaa illa. Rayil, vimaanam, kadai — idhellaam nilaiyaana attavanai. Adhukku eppavum simple present."}]},

/* ========== RULE 52 ========== */
{n:52,rc:"TEN-02",d:"Hard",t:"NEVER use the Present Perfect with a Definite Past Time",
 tam:"Yesterday, Last year, Ago — இவற்றுடன் present perfect வராது",
 s1:{en:"The PRESENT PERFECT (has/have + V3) can NEVER be used with an adverb of definite past time such as yesterday, last week, in 1999, two days ago or last night. Use the SIMPLE PAST instead.",
  ta:"PRESENT PERFECT (has/have + V3) ஒருபோதும் yesterday, last week, in 1999, two days ago, last night போன்ற குறிப்பிட்ட கடந்தகால நேரக் குறிப்புகளுடன் பயன்படுத்தப்பட முடியாது. அதற்குப் பதிலாக SIMPLE PAST பயன்படுத்தவும்.",
  tl:"PRESENT PERFECT (has/have + V3) orupodhum yesterday, last week, in 1999, two days ago, last night pondra kurippitta kadandhagaala nerak kurippugaludan payanpaduththappada mudiyaadhu. Adharkup padhilaaga SIMPLE PAST payanpaduththavum.",
  formula:"DEFINITE PAST TIME  →  SIMPLE PAST (V2)\n  He WENT to Delhi yesterday.        ✔\n  He HAS GONE to Delhi yesterday.    ✘\n\nNO TIME MARKER  →  PRESENT PERFECT allowed\n  He HAS GONE to Delhi.              ✔\n  I HAVE already finished my work.   ✔"},

 s2:[
 {h:"The present perfect connects the past to NOW",
  en:"'I have finished my work' means the work is finished AND that fact matters right now. The present perfect is a bridge between past and present. A fixed past time like 'yesterday' cuts that bridge, because it locks the action into a closed moment.",
  ta:"Present perfect கடந்தகாலத்தை இப்போதுடன் இணைக்கிறது. 'I have finished my work' என்றால் வேலை முடிந்துவிட்டது, மேலும் அந்த உண்மை இப்போது முக்கியம். Present perfect கடந்தகாலத்திற்கும் நிகழ்காலத்திற்கும் இடையிலான ஒரு பாலம். 'Yesterday' போன்ற ஒரு நிலையான கடந்தகால நேரம் அந்தப் பாலத்தை வெட்டிவிடுகிறது, ஏனெனில் அது செயலை ஒரு மூடிய தருணத்தில் பூட்டிவிடுகிறது.",
  tl:"Present perfect kadandhagaalaththai ippodhudan inaikkiradhu. Present perfect kadandhagaalaththirkum nigazhgaalaththirkum idaiyilaana oru paalam. 'Yesterday' pondra oru nilaiyaana kadandhagaala neram andhap paalaththai vettividugiradhu."},
 {h:"The forbidden time words",
  en:"yesterday, last night, last week, last month, last year, ago, in 1999, in the past, then, when I was young, at that time, once upon a time. Any of these forces the simple past.",
  ta:"தடைசெய்யப்பட்ட நேரச் சொற்கள்: yesterday, last night, last week, last month, last year, ago, in 1999, in the past, then, when I was young, at that time, once upon a time. இவற்றில் ஏதேனும் ஒன்று simple past-ஐக் கட்டாயமாக்கும்.",
  tl:"Thadaiseyyappatta nerach sorkal: yesterday, last night, last week, last month, last year, ago, in 1999, in the past, then, when I was young, at that time."},
 {h:"The words that WELCOME the present perfect",
  en:"already, just, yet, ever, never, so far, till now, recently, lately, since, for, this week, today, this year. These do not fix a closed past moment, so the present perfect is correct with them.",
  ta:"Present perfect-ஐ வரவேற்கும் சொற்கள்: already, just, yet, ever, never, so far, till now, recently, lately, since, for, this week, today, this year. இவை ஒரு மூடிய கடந்தகால தருணத்தை நிர்ணயிக்கவில்லை, எனவே இவற்றுடன் present perfect சரி.",
  tl:"Present perfect-ai varaverkkum sorkal: already, just, yet, ever, never, so far, till now, recently, lately, since, for, this week, today, this year."},
 {h:"Questions with WHEN always take the simple past",
  en:"'When did you meet him?' — never 'When have you met him?'. Asking 'when' means you are asking about a fixed point in the past, so the simple past is required.",
  ta:"WHEN-உடன் வரும் கேள்விகள் எப்போதும் simple past எடுக்கும். 'When did you meet him?' — ஒருபோதும் 'When have you met him?' அல்ல. 'When' கேட்பது என்பது கடந்தகாலத்தில் ஒரு நிலையான புள்ளியைப் பற்றிக் கேட்பது, எனவே simple past தேவை.",
  tl:"WHEN-udan varum kelvigal eppodhum simple past edukkum. 'When did you meet him?' — orupodhum 'When have you met him?' alla."}],

 s3:[
 {h:"The bridge and the wall",
  d:"   PRESENT PERFECT = a bridge to NOW\n\n   past ──────────────────► NOW\n        I have finished my work.\n        (it matters right now)\n\n   'YESTERDAY' = a wall\n\n   past │ WALL │           NOW\n        └──────┘\n   He went yesterday.  (closed, over, finished)\n   No bridge possible."},
 {h:"Two lists to memorise",
  d:"  ✘ FORBIDS present perfect   ✔ ALLOWS it\n  ─────────────────────────   ────────────\n   yesterday                   already\n   last night / week / year    just\n   ago                         yet\n   in 1999                     ever / never\n   when I was young            so far / till now\n   at that time                recently / lately\n   then                        since / for\n   When did ...?               this week / today"},
 {h:"Same action, two tenses",
  d:"   He HAS GONE to Delhi.             ✔ (no time given)\n   He WENT to Delhi yesterday.       ✔ (time given)\n   He HAS GONE to Delhi yesterday.   ✘ (both together)\n\n   You may have the present perfect\n   OR the past time marker —\n   never both in the same clause."}],

 s4:{
 wrong:["\"'Has gone' sounds more complete than 'went'.\" — Not when a past time is stated.",
  "\"'I have met him yesterday' is polite English.\" — It is grammatically impossible.",
  "\"'Ago' can go with either tense.\" — 'Ago' always demands the simple past.",
  "\"'When have you come?' is a normal question.\" — 'When' questions take the simple past."],
 right:["Scan the sentence for a past time word FIRST.",
  "Found one → use V2 (the simple past).",
  "Found already, just, yet, since, for → present perfect is fine.",
  "'When did...?' never takes the present perfect."]},

 s5:[
 {en:"He went to Delhi yesterday.",ta:"அவர் நேற்று டெல்லிக்குச் சென்றார்.",tl:"Avar netru Delhi-kkuch sendraar.",note:"'Yesterday' forces the simple past."},
 {en:"She completed the project last month.",ta:"அவர் கடந்த மாதம் திட்டப்பணியை முடித்தார்.",tl:"Avar kadandha maadham thittappaniyai mudiththaar.",note:"'Last month' forces the simple past."},
 {en:"I have already finished my work.",ta:"நான் ஏற்கனவே என் வேலையை முடித்துவிட்டேன்.",tl:"Naan erkanave en velaiyai mudiththuvitten.",note:"'Already' with no fixed past time → present perfect is correct."},
 {en:"Gandhiji was born in 1869.",ta:"காந்திஜி 1869-ல் பிறந்தார்.",tl:"Gandhiji 1869-l pirandhaar.",note:"A definite year → simple past."},
 {en:"He has not seen his brother since 2019.",ta:"அவர் 2019 முதல் தன் சகோதரரைப் பார்க்கவில்லை.",tl:"Avar 2019 mudhal than sagodhararaip paarkkavillai.",note:"'Since' welcomes the present perfect."}],

 s6:["present perfect|நிகழ்கால நிறைவு|Nigazhgaala niraivu",
  "simple past|எளிய இறந்தகாலம்|Eliya irandhagaalam",
  "yesterday|நேற்று|Netru",
  "last month|கடந்த மாதம்|Kadandha maadham",
  "last year|கடந்த ஆண்டு|Kadandha aandu",

 s10:{
  en:"This is one of the two or three most repeated tense errors in SSC. Indian English speakers say 'I have met him yesterday' constantly, so the wrong form feels natural and even sounds more polished. The exam plants it in almost every paper. The fix is mechanical: before choosing any tense, scan the sentence for a past time word. If you find one, the answer is V2 — nothing else.",
  ta:"இது SSC-ல் மிக அதிகமாக மீண்டும் மீண்டும் வரும் இரண்டு அல்லது மூன்று tense தவறுகளில் ஒன்று. இந்திய ஆங்கிலப் பேச்சாளர்கள் 'I have met him yesterday' என்று தொடர்ந்து சொல்கிறார்கள், எனவே தவறான வடிவம் இயற்கையாகவும், மேலும் மெருகூட்டப்பட்டதாகவும் தோன்றுகிறது. தேர்வு அதை கிட்டத்தட்ட ஒவ்வொரு தாளிலும் நடுகிறது. தீர்வு எந்திரத்தனமானது: எந்த tense-ஐயும் தேர்ந்தெடுப்பதற்கு முன், கடந்தகால நேரச் சொல்லுக்காக வாக்கியத்தை ஸ்கேன் செய்யுங்கள்.",
  tl:"Idhu SSC-l miga adhigamaaga meendum meendum varum tense thavarugalil ondru. Indhiya Aangilap pechaalargal 'I have met him yesterday' endru thodarndhu solgiraargal. Theervu endhiraththanamaanadhu: endha tense-aiyum therndhedupparku mun, kadandhagaala nerach sollukkaaga vaakkiyaththai scan seyyungal."},

 s11:{
  en:"SCAN FOR A PAST TIME WORD FIRST. Found one → V2. No time word → present perfect allowed.",
  ta:"முதலில் கடந்தகால நேரச் சொல்லைத் தேடுங்கள். கிடைத்தால் → V2. நேரச் சொல் இல்லை என்றால் → present perfect அனுமதிக்கப்படுகிறது.",
  tl:"Mudhalil kadandhagaala nerach sollaith thedungal. Kidaiththaal → V2. Nerach sol illai endraal → present perfect anumadhikkappadugiradhu.",
  vis:"      THE SCAN-FIRST METHOD\n\n   Step 1: read the whole sentence\n   Step 2: hunt for a PAST TIME WORD\n\n   FOUND?  →  use V2, nothing else\n     yesterday · last week · ago · in 1999\n     last night · then · at that time\n     When did ...?\n\n   NOT FOUND?  →  present perfect is fine\n     already · just · yet · ever · never\n     so far · till now · recently · since · for\n\n   ⚠ NEVER BOTH TOGETHER:\n     \"has gone yesterday\"  ✘  impossible\n\n   MEMORY LINE:\n   \"YESTERDAY kills HAS.\""},

 s13:[

 "The number of applicants ____ risen since 2020, though only fifty ____ selected last year.|have-were;has-were;has-have been|1|'The number of' → HAS (SVA Rule 38). 'Last year' → WERE selected.",

 s14:{
  rule:"The present perfect cannot be used with a definite past time. Use the simple past instead.",
  formula:"PAST TIME WORD (yesterday, ago, last year, in 1999) → V2\nalready / just / yet / since / for / so far → present perfect",
  memory:"YESTERDAY kills HAS. Scan for a past time word before choosing.",
  ta:"'Yesterday' வந்தா 'has' சாகும். தேர்ந்தெடுக்கிறதுக்கு முன்னாடி கடந்தகால நேரச் சொல்லை தேடுங்க.",
  tl:"'Yesterday' vandhaa 'has' saagum. Therndhedukkiradhukku munnaadi kadandhagaala nerach sollai thedunga.",
  mistake:"Writing 'I have met him yesterday' because Indian English says it constantly.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — one of the top three most repeated tense errors."},

 s15:[
 {ta:"இந்த rule SSC-ல மிக அதிகமா வர்ற tense தப்புல ஒண்ணு. ஏன்? ஏன்னா நாம தினமும் இந்த தப்பை பேசுறோம். 'I have met him yesterday' — இது நமக்கு சரி மாதிரி தோணும், கொஞ்சம் அழகா கூட தோணும். ஆனா இது இலக்கண ரீதியா சாத்தியமே இல்லாதது.",
  tl:"Indha rule SSC-la miga adhigamaa varra tense thappula onnu. Yennaa naama dhinamum indha thappai pesurom. 'I have met him yesterday' — idhu namakku sari maadhiri thonum. Aanaa idhu ilakkana reedhiyaa saadhiyame illaadhadhu."},
 {ta:"ஏன் சாத்தியமில்ல? ஒரு படம் மனசுல வெச்சுக்கோங்க. Present perfect அப்படிங்கிறது ஒரு பாலம். கடந்தகாலத்தை இப்போதோட இணைக்குது. 'I have finished my work' — வேலை முடிஞ்சது, ஆனா அது இப்போ முக்கியம். இப்போ நான் free.",
  tl:"Yen saadhiyamilla? Oru padam manasula vechukkonga. Present perfect appadingiradhu oru paalam. Kadandhagaalaththai ippodhoda inaikkudhu. 'I have finished my work' — velai mudinjadhu, aanaa adhu ippo mukkiyam."},
 {ta:"இப்போ 'yesterday' அப்படிங்கிறத சேர்த்தா என்ன ஆகும்? 'Yesterday' ஒரு சுவர். அது அந்த செயலை நேத்தோட மூடிடுது. நேத்து முடிஞ்சது, இப்போவோட சம்பந்தம் இல்ல. பாலம் உடைஞ்சு போச்சு. அதனால present perfect வர முடியாது. Simple past — 'I MET him yesterday.'",
  tl:"Ippo 'yesterday' appadingiradha serthaa enna aagum? 'Yesterday' oru suvar. Adhu andha seyalai neththoda moodidudhu. Neththu mudinjadhu, ippovoda sambandham illa. Paalam udainju pochu. Adhanaala present perfect vara mudiyaadhu."},
 {ta:"ரெண்டு பட்டியல் மனப்பாடம் பண்ணுங்க. தடைசெய்யப்பட்டவை: yesterday, last night, last week, last month, last year, ago, in 1999, then, at that time, when I was young. இதுல ஏதாவது இருந்தா — கண்டிப்பா V2, simple past.",
  tl:"Rendu pattiyal manappaadam pannunga. Thadaiseyyappattavai: yesterday, last night, last week, last year, ago, in 1999, then, at that time, when I was young. Idhula edhaavadhu irundhaa — kandippaa V2, simple past."},
 {ta:"அனுமதிக்கப்பட்டவை: already, just, yet, ever, never, so far, till now, recently, lately, since, for. இதுல ஏதாவது இருந்தா — present perfect சரி. 'I have already finished', 'He has just left', 'She has not come yet', 'They have been here since Monday'.",
  tl:"Anumadhikkappattavai: already, just, yet, ever, never, so far, till now, recently, lately, since, for. Idhula edhaavadhu irundhaa — present perfect sari."},
 {ta:"கடைசியா ஒரு எளிய பழக்கம் சொல்லுறேன். கேள்வி படிச்சவுடனே tense-ஐ யோசிக்காதீங்க. முதல்ல வாக்கியம் முழுக்க scan பண்ணுங்க — கடந்தகால நேரச் சொல் இருக்கானு. இருந்தா V2, முடிஞ்சது. இல்லைன்னா அப்பறம் யோசிங்க. ஒரு வரி நினைவு வெச்சுக்கோங்க: 'YESTERDAY kills HAS.' நேரச் சொல் வந்தா has/have சாகும்.",
  tl:"Kadaisiyaa oru eliya pazhakkam solluren. Kelvi padichavudane tense-ai yosikkaadheenga. Mudhalla vaakkiyam muzhukka scan pannunga — kadandhagaala nerach sol irukkaanu. Irundhaa V2, mudinjadhu. Oru vari ninaivu vechukkonga: 'YESTERDAY kills HAS.'"}]},

/* ========== RULE 53 ========== */
{n:53,rc:"TEN-03",d:"Medium",t:"SINCE for a Point of Time, FOR for a Period",
 tam:"Since = தொடங்கிய புள்ளி · For = கால அளவு",
 s1:{en:"Use SINCE with a POINT of time (Monday, 2015, morning, his childhood) and FOR with a LENGTH of time (two hours, ten years, a long time). Both normally take the present perfect or present perfect continuous.",
  ta:"ஒரு நேரப் புள்ளியுடன் (Monday, 2015, morning, his childhood) SINCE-ஐயும், ஒரு கால அளவுடன் (two hours, ten years, a long time) FOR-ஐயும் பயன்படுத்தவும். இரண்டுமே பொதுவாக present perfect அல்லது present perfect continuous எடுக்கும்.",
  tl:"Oru nerap pulliyudan (Monday, 2015, morning) SINCE-aiyum, oru kaala alavudan (two hours, ten years) FOR-aiyum payanpaduththavum.",
  formula:"SINCE  +  POINT of time  (WHEN it started)\n  since Monday · since 2015 · since morning\n  since his childhood · since he left\n\nFOR    +  LENGTH of time  (HOW LONG it lasted)\n  for two hours · for ten years\n  for a long time · for three days"},

 s2:[
 {h:"Since answers WHEN, for answers HOW LONG",
  en:"'He has been ill since Monday' tells you WHEN the illness started. 'He has been ill for three days' tells you HOW LONG it has lasted. Ask yourself which question the time expression answers.",
  ta:"Since 'எப்போது' என்பதற்குப் பதில் தருகிறது, for 'எவ்வளவு காலம்' என்பதற்குப் பதில் தருகிறது. 'He has been ill since Monday' நோய் எப்போது தொடங்கியது என்று சொல்கிறது. 'He has been ill for three days' அது எவ்வளவு காலம் நீடித்தது என்று சொல்கிறது. அந்த நேரக் குறிப்பு எந்தக் கேள்விக்குப் பதில் தருகிறது என்று உங்களையே கேளுங்கள்.",
  tl:"Since 'eppodhu' enbadharkup padhil tharugiradhu, for 'evvalavu kaalam' enbadharkup padhil tharugiradhu. Andha nerak kurippu endhak kelvikkup padhil tharugiradhu endru ungalaiye kelungal."},
 {h:"'Since ten years' is the classic Indian error",
  en:"Indian English speakers say 'I have been living here since ten years' constantly. Ten years is a LENGTH, not a point, so it must be 'for ten years'. This single error appears in almost every SSC error-spotting set.",
  ta:"'Since ten years' என்பது பாரம்பரியமான இந்தியத் தவறு. இந்திய ஆங்கிலப் பேச்சாளர்கள் 'I have been living here since ten years' என்று தொடர்ந்து சொல்கிறார்கள். பத்து ஆண்டுகள் என்பது ஒரு கால அளவு, ஒரு புள்ளி அல்ல, எனவே அது 'for ten years' என்றுதான் இருக்க வேண்டும். இந்த ஒரு தவறு கிட்டத்தட்ட ஒவ்வொரு SSC error-spotting தொகுப்பிலும் வருகிறது.",
  tl:"'Since ten years' enbadhu paaramparyamaana Indhiyath thavaru. Paththu aandugal enbadhu oru kaala alavu, oru pulli alla, enave adhu 'for ten years' endrudhaan irukka vendum."},
 {h:"SINCE needs a perfect tense",
  en:"'Since' cannot be used with the simple present or simple future. 'I know him since 2010' is wrong — it must be 'I have known him since 2010'. Whenever you write 'since', check that a have, has or had is present.",
  ta:"SINCE-க்கு ஒரு perfect tense தேவை. 'Since' simple present அல்லது simple future-உடன் பயன்படுத்த முடியாது. 'I know him since 2010' தவறு — அது 'I have known him since 2010' என்றுதான் இருக்க வேண்டும். நீங்கள் 'since' எழுதும்போதெல்லாம், have, has அல்லது had இருக்கிறதா என்று சரிபாருங்கள்.",
  tl:"SINCE-kku oru perfect tense thevai. 'I know him since 2010' thavaru — adhu 'I have known him since 2010' endrudhaan irukka vendum. Neengal 'since' ezhudhumbodhellaam, have, has alladhu had irukkiradhaa endru saripaarungal."},
 {h:"FROM is different from SINCE",
  en:"'From' marks a starting point with the past or future: 'He worked there from 2010 to 2014', 'The new rule applies from next month'. 'Since' is only for perfect tenses connected to now.",
  ta:"FROM என்பது SINCE-லிருந்து வேறுபட்டது. 'From' கடந்தகாலம் அல்லது எதிர்காலத்துடன் ஒரு தொடக்கப் புள்ளியைக் குறிக்கிறது: 'He worked there from 2010 to 2014', 'The new rule applies from next month'. 'Since' இப்போதுடன் இணைந்த perfect tense-களுக்கு மட்டுமே.",
  tl:"FROM enbadhu SINCE-lirundhu verupattadhu. 'From' kadandhagaalam alladhu edhirkaalaththudan oru thodakkap pulliyaik kurikkiradhu. 'Since' ippodhudan inaindha perfect tense-galukku mattume."}],

 s3:[
 {h:"Point versus length",
  d:"   SINCE = a POINT on the timeline\n\n   ────●──────────────────────► NOW\n     Monday\n     \"He has been ill SINCE Monday.\"\n\n   FOR = the LENGTH of the line\n\n   ────├──────────────────┤───► NOW\n       └──  three days  ──┘\n     \"He has been ill FOR three days.\""},
 {h:"Which question does it answer?",
  d:"   SINCE  →  answers WHEN did it start?\n     since Monday · since 2015 · since morning\n     since his childhood · since he left\n\n   FOR    →  answers HOW LONG has it lasted?\n     for two hours · for ten years\n     for a week · for a long time\n\n   ⚠ THE CLASSIC ERROR:\n     since ten years   ✘   for ten years   ✔"},
 {h:"Since demands a perfect tense",
  d:"   I KNOW him since 2010.          ✘ no perfect\n   I HAVE KNOWN him since 2010.    ✔ perfect\n\n   Whenever you write SINCE,\n   look for  HAVE · HAS · HAD\n   somewhere in the sentence."}],

 s4:{
 wrong:["\"'Since ten years' is what everyone says in India.\" — Ten years is a length, so it needs 'for'.",
  "\"'Since' and 'from' mean the same thing.\" — 'From' works with past and future; 'since' needs a perfect tense.",
  "\"'I live here since 2010' is fine.\" — 'Since' requires 'have lived'.",
  "\"'For' can be used with a date.\" — 'For 2015' is meaningless; use 'since 2015'."],
 right:["Ask: does this answer WHEN or HOW LONG?",
  "WHEN → since. HOW LONG → for.",
  "Check that a have, has or had accompanies 'since'.",
  "Use 'from' for past or future starting points instead."]},

 s5:[
 {en:"He has been ill since Monday.",ta:"திங்கள்கிழமையிலிருந்து அவர் உடல்நலமில்லாமல் இருக்கிறார்.",tl:"Thingatkizhamaiyilirundhu avar udalnalamillaamal irukkiraar.",note:"'Monday' is a point of time → SINCE."},
 {en:"She has lived here for ten years.",ta:"அவர் பத்து ஆண்டுகளாக இங்கே வசித்து வருகிறார்.",tl:"Avar paththu aandugalaaga inge vasiththu varugiraar.",note:"'Ten years' is a length → FOR."},
 {en:"I have been waiting since morning.",ta:"காலையிலிருந்து நான் காத்திருக்கிறேன்.",tl:"Kaalaiyilirundhu naan kaaththirukkiren.",note:"'Morning' is a point of time → SINCE."},
 {en:"They have known each other for a long time.",ta:"அவர்கள் நீண்ட காலமாக ஒருவரையொருவர் அறிவார்கள்.",tl:"Avargal neenda kaalamaaga oruvaraiyoruvar arivaargal.",note:"'A long time' is a length → FOR."},
 {en:"The new rule applies from next month.",ta:"புதிய விதி அடுத்த மாதம் முதல் அமலுக்கு வரும்.",tl:"Pudhiya vidhi aduththa maadham mudhal amalukku varum.",note:"A future starting point → FROM, not since."}],

 s8:[

 "He has been ill for Monday.|He has been ill since Monday.|Monday is a point of time.",
 "I have been waiting for morning.|I have been waiting since morning.|Morning is a point of time.",
 "They have known him since a long time.|They have known him for a long time.|'A long time' is a length.",
 "We have been friends for 2010.|We have been friends since 2010.|2010 is a point of time.",
 "I know him since 2010.|I have known him since 2010.|'Since' requires a perfect tense.",
 "He has been sleeping since three hours.|He has been sleeping for three hours.|Three hours is a length.",
 "The new rule applies since next month.|The new rule applies from next month.|A future starting point takes 'from'.",
 "He served in the army since 2010 to 2015.|He served in the army from 2010 to 2015.|'From ... to' marks a past span.",
 "She lives here since her marriage.|She has lived here since her marriage.|'Since' requires a perfect tense."],

 s9:[
 "Fill in the Blank|My uncle has been working in this bank ____ nearly fifteen years now.|since;for|1|Fifteen years is a length of time.",
 "Find the Error|He has been suffering (A) from fever (B) since three days (C) and is very weak (D).|A;B;C;D|2|Part C. Three days is a length → 'for three days'.",
 "Sentence Improvement|I know this gentleman since the year two thousand and ten quite well.|I know;I have known;I knew|1|'Since' requires a perfect tense.",
 "Fill in the Blank|The revised timings will come into effect ____ the first of next month.|since;from|1|A future starting point takes 'from'.",
 "Find the Error|She has not spoken (A) to her brother (B) for last Diwali (C) because of a quarrel (D).|A;B;C;D|2|Part C. 'Last Diwali' is a point of time → 'since last Diwali'."],

 s10:{
  en:"'Since ten years' is possibly the single most common grammatical error in Indian English. Every one of us has said it. The exam plants it because it feels completely normal. The second trap is the missing perfect tense: 'I know him since 2010' has the right preposition but the wrong verb form. Check both — the preposition AND the tense.",
  ta:"'Since ten years' என்பது இந்திய ஆங்கிலத்தில் மிகவும் பொதுவான ஒற்றை இலக்கணத் தவறாக இருக்கலாம். நம்மில் ஒவ்வொருவரும் அதைச் சொல்லியிருக்கிறோம். அது முற்றிலும் இயல்பாகத் தோன்றுவதால் தேர்வு அதை நடுகிறது. இரண்டாவது பொறி காணாமல் போன perfect tense: 'I know him since 2010' இதில் முன்னுருபு சரி ஆனால் வினைச்சொல் வடிவம் தவறு. இரண்டையும் சரிபாருங்கள் — முன்னுருபையும் tense-ஐயும்.",
  tl:"'Since ten years' enbadhu Indhiya Aangilaththil migavum podhuvaana otrai ilakkanath thavaraaga irukkalaam. Adhu mutrilum iyalbaagath thondruvadhaal thervu adhai nadugiradhu. Irandaavadhu pori kaanaamal pona perfect tense."},

 s11:{
  en:"WHEN or HOW LONG? When → since. How long → for. And 'since' always needs have, has or had.",
  ta:"எப்போது, இல்லை எவ்வளவு காலம்? எப்போது → since. எவ்வளவு காலம் → for. மேலும் 'since'-க்கு எப்போதும் have, has அல்லது had தேவை.",
  tl:"Eppodhu, illai evvalavu kaalam? Eppodhu → since. Evvalavu kaalam → for. Melum 'since'-kku eppodhum have, has alladhu had thevai.",
  vis:"      THE TWO-QUESTION TEST\n\n   Ask the time expression:\n\n   \"WHEN did it start?\"   →  SINCE\n     Monday · 2015 · morning · his childhood\n     he left · last Diwali · 6 o'clock\n\n   \"HOW LONG has it lasted?\"  →  FOR\n     two hours · ten years · a week\n     a long time · ages · a decade\n\n   ⚠ THE INDIAN ERROR:\n     since ten years   ✘\n     for ten years     ✔\n\n   ⚠ SINCE NEEDS A PERFECT TENSE:\n     I know him since 2010.        ✘\n     I HAVE KNOWN him since 2010.  ✔"},

 s13:[
 "He has been ill ____ Monday and has not attended office ____ four days.|since-for;for-since;since-since|0|Monday is a point → SINCE. Four days is a length → FOR.",
 "She ____ in this school ____ 2015, and each of her students ____ her.|has taught-since-respects;taught-for-respect;has taught-for-respects|0|'Since' needs a perfect tense → HAS TAUGHT. 2015 is a point → SINCE. 'Each of' → RESPECTS.",
 "The number of complaints ____ risen ____ last year, though nothing ____ done so far.|have-since-has been;has-since-has been;has-for-have been|1|'The number of' → HAS. 'Last year' is a point → SINCE. 'Nothing' is singular → HAS BEEN.",
 "I ____ him ____ ten years, but I met him ____ the first time only yesterday.|have known-for-for;know-since-for;have known-since-for|0|Perfect tense with 'for ten years'. 'For the first time' is a fixed phrase.",
 "The new rule applies ____ next month, and the old one ____ in force ____ 2010.|from-has been-since;since-has been-for;from-was-since|0|A future start → FROM. Perfect with a point of time → HAS BEEN since 2010."],

 s14:{
  rule:"Use 'since' with a point of time and 'for' with a length of time, both with a perfect tense.",
  formula:"SINCE + point (Monday, 2015, morning) + perfect tense\nFOR + length (two hours, ten years)\nFROM + past or future starting point",
  memory:"Since answers WHEN. For answers HOW LONG.",
  ta:"Since = எப்போது தொடங்கியது. For = எவ்வளவு காலம் நீடிச்சது.",
  tl:"Since = eppodhu thodangiyadhu. For = evvalavu kaalam needichadhu.",
  mistake:"Writing 'since ten years', and using 'since' without a perfect tense.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — 'since ten years' is one of the most repeated errors."},

 s15:[
 {ta:"இந்த rule-ல ஒரு தப்பு இருக்கு, அது இந்தியால ரொம்ப பிரபலம். 'I have been living here since ten years.' இதை நாம எல்லாருமே சொல்லியிருக்கோம். ஆனா இது தப்பு.",
  tl:"Indha rule-la oru thappu irukku, adhu India-la romba pirabalam. 'I have been living here since ten years.' Idhai naama ellaarume solliyirukkom. Aanaa idhu thappu."},
 {ta:"ஏன்? ஒரு படம் மனசுல வெச்சுக்கோங்க. ஒரு நேர கோடு (timeline) வரையுங்க. 'Since' அப்படிங்கிறது அந்த கோட்டுல ஒரு புள்ளி. எங்க ஆரம்பிச்சது? 'Since Monday' — திங்கள்கிழமையில இருந்து. அது ஒரு புள்ளி.",
  tl:"Yen? Oru padam manasula vechukkonga. Oru nera kodu (timeline) varaiyunga. 'Since' appadingiradhu andha koottula oru pulli. Enga aarambichadhu? 'Since Monday' — thingatkizhamaiyila irundhu. Adhu oru pulli."},
 {ta:"'For' அப்படிங்கிறது அந்த கோட்டோட நீளம். எவ்ளோ காலம் நீடிச்சது? 'For three days' — மூணு நாள். அது ஒரு நீளம், புள்ளி இல்ல. 'Ten years' நீளம். அதனால 'for ten years'.",
  tl:"'For' appadingiradhu andha koottoda neelam. Evlo kaalam needichadhu? 'For three days' — moonu naal. Adhu oru neelam, pulli illa. 'Ten years' neelam. Adhanaala 'for ten years'."},
 {ta:"ஒரு எளிய சோதனை சொல்லுறேன். அந்த நேரச் சொல்லை பார்த்து கேளுங்க — 'இது எப்போ ஆரம்பிச்சது-ன்னு சொல்லுதா, இல்ல எவ்ளோ காலம்-ன்னு சொல்லுதா?' எப்போ-ன்னா since. எவ்ளோ காலம்-ன்னா for. இந்த ஒரு கேள்வி போதும்.",
  tl:"Oru eliya sodhanai solluren. Andha nerach sollai paarththu kelunga — 'idhu eppo aarambichadhunnu solludhaa, illa evlo kaalamnnu solludhaa?' Eppo-nnaa since. Evlo kaalam-nnaa for."},
 {ta:"இப்போ இன்னொரு முக்கியமான விஷயம். 'Since' எழுதினா, கண்டிப்பா have, has, அல்லது had இருக்கணும். 'I know him since 2010' — தப்பு! ஏன்? 'Know' அப்படிங்கிறது simple present, perfect இல்ல. சரியான வடிவம்: 'I HAVE KNOWN him since 2010.' Since எழுதும்போதெல்லாம் have/has/had இருக்கானு பாருங்க.",
  tl:"Ippo innoru mukkiyamaana vishayam. 'Since' ezhudhinaa, kandippaa have, has, alladhu had irukkanum. 'I know him since 2010' — thappu! Sariyaana vadivam: 'I HAVE KNOWN him since 2010.'"},
 {ta:"கடைசியா 'From' பத்தி. 'From' வேற. அது கடந்தகாலத்துக்கும் எதிர்காலத்துக்கும் வரும். 'He worked there FROM 2010 TO 2014' — கடந்தகாலம், முடிஞ்சது. 'The new rule applies FROM next month' — எதிர்காலம். 'Since' மட்டும்தான் இப்போதோட இணைஞ்ச perfect tense-க்கு. இந்த மூணு வித்தியாசம் தெரிஞ்சா, இந்த rule-ல நீங்க master.",
  tl:"Kadaisiyaa 'From' paththi. 'From' veru. Adhu kadandhagaalaththukkum edhirkaalaththukkum varum. 'He worked there FROM 2010 TO 2014' — kadandhagaalam. 'The new rule applies FROM next month' — edhirkaalam. 'Since' mattum-dhaan ippodhoda inainja perfect tense-kku."}]},

/* ========== RULE 54 ========== */
{n:54,rc:"TEN-04",d:"Hard",t:"Past Perfect for the EARLIER of Two Past Actions",
 tam:"இரு கடந்தகால செயல்களில் முதலில் நடந்ததற்கு had + V3",
 s1:{en:"When TWO actions happened in the past, the EARLIER one takes the PAST PERFECT (had + V3) and the LATER one takes the SIMPLE PAST (V2). The past perfect exists only to show which action came first.",
  ta:"கடந்த காலத்தில் இரண்டு செயல்கள் நடந்தால், முதலில் நடந்தது PAST PERFECT (had + V3) எடுக்கும், பின்னர் நடந்தது SIMPLE PAST (V2) எடுக்கும். எந்தச் செயல் முதலில் வந்தது என்பதைக் காட்டவே past perfect இருக்கிறது.",
  tl:"Kadandha kaalaththil irandu seyalgal nadandhaal, mudhalil nadandhadhu PAST PERFECT (had + V3) edukkum, pinnar nadandhadhu SIMPLE PAST (V2) edukkum.",
  formula:"EARLIER action  →  HAD + V3\nLATER action    →  V2\n\n  The train HAD LEFT before I REACHED the station.\n     ↑ first                    ↑ second\n\n  He HAD FINISHED his work when I CALLED him.\n  She HAD ALREADY EATEN when the guests ARRIVED."},

 s2:[
 {h:"Time order, not sentence order",
  en:"Which clause gets 'had' is decided by WHEN the action happened, NOT by which clause is written first. 'Before I reached, the train had left' and 'The train had left before I reached' are both correct — the train left first in both.",
  ta:"நேர வரிசை, வாக்கிய வரிசை அல்ல. எந்த clause-க்கு 'had' வரும் என்பது செயல் எப்போது நடந்தது என்பதால் தீர்மானிக்கப்படுகிறது, எந்த clause முதலில் எழுதப்பட்டது என்பதால் அல்ல. 'Before I reached, the train had left' மற்றும் 'The train had left before I reached' இரண்டுமே சரி — இரண்டிலும் ரயில்தான் முதலில் புறப்பட்டது.",
  tl:"Nera varisai, vaakkiya varisai alla. Endha clause-kku 'had' varum enbadhu seyal eppodhu nadandhadhu enbadhaal theermaanikkappadugiradhu, endha clause mudhalil ezhudhappattadhu enbadhaal alla."},
 {h:"The signal words",
  en:"BEFORE, AFTER, WHEN, BY THE TIME, ALREADY, AS SOON AS, NO SOONER, HARDLY, SCARCELY. These words connect two past actions, and one of them will need the past perfect.",
  ta:"அறிகுறிச் சொற்கள்: BEFORE, AFTER, WHEN, BY THE TIME, ALREADY, AS SOON AS, NO SOONER, HARDLY, SCARCELY. இந்தச் சொற்கள் இரண்டு கடந்தகால செயல்களை இணைக்கின்றன, அவற்றில் ஒன்றுக்கு past perfect தேவைப்படும்.",
  tl:"Arikurich sorkal: BEFORE, AFTER, WHEN, BY THE TIME, ALREADY, AS SOON AS, NO SOONER, HARDLY, SCARCELY."},
 {h:"BEFORE and AFTER show the order for you",
  en:"'He had finished BEFORE I came' — 'before' tells you finishing was first. 'I came AFTER he had finished' — 'after' tells you the same thing. The word itself points to the earlier action.",
  ta:"BEFORE மற்றும் AFTER உங்களுக்காக வரிசையைக் காட்டுகின்றன. 'He had finished BEFORE I came' — முடிப்பது முதலில் என்று 'before' சொல்கிறது. 'I came AFTER he had finished' — 'after' அதே விஷயத்தைச் சொல்கிறது. அந்தச் சொல்லே முந்தைய செயலைச் சுட்டுகிறது.",
  tl:"BEFORE matrum AFTER ungalukkaaga varisaiyaik kaattugindrana. 'He had finished BEFORE I came' — mudippadhu mudhalil endru 'before' solgiradhu."},
 {h:"Only ONE past perfect per pair",
  en:"'He had finished before I had come' is wrong — you cannot put 'had' in both clauses. One action is earlier and the other is later, so only the earlier one takes the past perfect.",
  ta:"ஒரு ஜோடிக்கு ஒரே ஒரு past perfect மட்டுமே. 'He had finished before I had come' தவறு — இரண்டு clause-லும் 'had' போட முடியாது. ஒரு செயல் முந்தையது, மற்றது பிந்தையது, எனவே முந்தையது மட்டுமே past perfect எடுக்கும்.",
  tl:"Oru jodikku ore oru past perfect mattume. 'He had finished before I had come' thavaru — irandu clause-lum 'had' poda mudiyaadhu."}],

 s3:[
 {h:"Draw the timeline",
  d:"   PAST ────●──────────●──────────► NOW\n            1st        2nd\n         train left  I reached\n            ↓           ↓\n         HAD LEFT     REACHED\n\n   The train HAD LEFT before I REACHED.\n\n   The FIRST action gets HAD + V3.\n   The SECOND action gets V2."},
 {h:"Sentence order does not matter",
  d:"   The train HAD LEFT before I REACHED.   ✔\n   Before I REACHED, the train HAD LEFT.  ✔\n\n   Both are correct.\n   In both, the train left FIRST.\n\n   Decide by TIME, not by position."},
 {h:"Only one HAD",
  d:"   He HAD FINISHED before I CAME.        ✔\n   He HAD FINISHED before I HAD COME.    ✘\n   He FINISHED before I HAD COME.        ✘\n\n   One earlier + one later\n   = one HAD + one V2"}],

 s4:{
 wrong:["\"The first clause in the sentence gets 'had'.\" — Position does not decide; time does.",
  "\"Both actions are past, so both take 'had'.\" — Only the earlier one does.",
  "\"'The train left before I had reached' is fine.\" — The 'had' is on the wrong action.",
  "\"'Had' is only for very old events.\" — It is for whichever of two past actions came first."],
 right:["Draw a mental timeline and mark which happened first.",
  "Earlier → had + V3. Later → V2.",
  "Use 'before' and 'after' as your guide to the order.",
  "Never put 'had' in both clauses."]},

 s5:[
 {en:"The train had left before I reached the station.",ta:"நான் நிலையத்தை அடைவதற்கு முன்பே ரயில் புறப்பட்டுவிட்டது.",tl:"Naan nilaiyaththai adaivadharku munbe rayil purappattuvittadhu.",note:"Leaving was earlier → HAD LEFT."},
 {en:"He had finished his work when I called him.",ta:"நான் அவரை அழைத்தபோது அவர் தன் வேலையை முடித்திருந்தார்.",tl:"Naan avarai azhaiththabodhu avar than velaiyai mudiththirundhaar.",note:"Finishing was earlier → HAD FINISHED."},
 {en:"She had already eaten when the guests arrived.",ta:"விருந்தினர்கள் வந்தபோது அவர் ஏற்கனவே சாப்பிட்டிருந்தார்.",tl:"Virundhinargal vandhabodhu avar erkanave saappittirundhaar.",note:"Eating was earlier → HAD EATEN."},
 {en:"After the sun had set, we returned home.",ta:"சூரியன் மறைந்த பிறகு நாங்கள் வீடு திரும்பினோம்.",tl:"Sooriyan maraindha piragu naangal veedu thirumbinom.",note:"'After' shows setting was earlier → HAD SET."},
 {en:"He told me that he had posted the letter the previous day.",ta:"அவர் முந்தைய நாள் கடிதத்தை அனுப்பியதாக என்னிடம் கூறினார்.",tl:"Avar mundhaiya naal kadidhaththai anuppiyadhaaga ennidam koorinaar.",note:"Posting was earlier than telling → HAD POSTED."}],

 s8:[
 "The train left before I had reached the station.|The train had left before I reached the station.|The 'had' belongs to the earlier action.",
 "When we arrived, the film has already started.|When we arrived, the film had already started.|Two past actions require the past perfect.",
 "He finished his work when I had called him.|He had finished his work when I called him.|Finishing was the earlier action.",
 "She has already eaten when the guests arrived.|She had already eaten when the guests arrived.|Two past actions require the past perfect.",
 "After the sun set, we had returned home.|After the sun had set, we returned home.|Setting was the earlier action.",
 "He told me that he posted the letter the previous day.|He told me that he had posted the letter the previous day.|Posting was earlier than telling.",
 "By the time I woke up, he has gone.|By the time I woke up, he had gone.|Going was earlier than waking.",
 "The patient died before the doctor had come.|The patient had died before the doctor came.|Dying was the earlier action.",
 "He had finished before I had come.|He had finished before I came.|Only the earlier action takes 'had'.",
 "She realised that she has left her purse.|She realised that she had left her purse.|Leaving was earlier than realising."],

 s9:[
 "Fill in the Blank|By the time the fire brigade arrived, the entire building ____ been reduced to ashes.|has;had|1|The burning happened before the arrival.",
 "Find the Error|The train left (A) the platform (B) before we had reached (C) the station (D).|A;B;C;D|0|Part A. Leaving was earlier → 'The train had left'.",
 "Sentence Improvement|He told the police that he has never seen the accused before that night.|has never seen;had never seen;never saw|1|The seeing was earlier than the telling.",
 "Fill in the Blank|After the guests ____ left, she began clearing the dining table quietly.|have;had|1|Leaving was earlier than the clearing.",
 "Find the Error|She realised (A) that she has left (B) her purse (C) in the auto-rickshaw (D).|A;B;C;D|1|Part B. Leaving was earlier than realising → 'had left'."],

 s10:{
  en:"Students decide by SENTENCE POSITION instead of TIME ORDER. Seeing 'The train left before I had reached', they think the first clause is fine because it comes first. But 'before' tells you the train left EARLIER, so the train's verb needs 'had'. The second trap is doubling: 'He had finished before I had come' puts 'had' in both clauses, which is always wrong.",
  ta:"மாணவர்கள் நேர வரிசைக்குப் பதிலாக வாக்கிய இடத்தால் முடிவு செய்கிறார்கள். 'The train left before I had reached' என்று பார்த்து, முதல் clause முதலில் வருவதால் அது சரி என்று நினைக்கிறார்கள். ஆனால் ரயில் முன்னதாகப் புறப்பட்டது என்று 'before' சொல்கிறது, எனவே ரயிலின் வினைச்சொல்லுக்கு 'had' தேவை. இரண்டாவது பொறி இரட்டிப்பு: 'He had finished before I had come' இரண்டு clause-லும் 'had' போடுகிறது, அது எப்போதுமே தவறு.",
  tl:"Maanavargal nera varisaikkup padhilaaga vaakkiya idaththaal mudivu seygiraargal. Aanaal rayil munnadhaagap purappattadhu endru 'before' solgiradhu, enave rayilin vinaicholukku 'had' thevai."},

 s11:{
  en:"DRAW THE TIMELINE. Which happened FIRST? That one gets HAD + V3.",
  ta:"நேர கோட்டை வரையுங்கள். எது முதலில் நடந்தது? அதற்குத்தான் HAD + V3.",
  tl:"Nera koottai varaiyungal. Edhu mudhalil nadandhadhu? Adharkuththaan HAD + V3.",
  vis:"      THE TIMELINE METHOD\n\n   Step 1: find the two past actions\n   Step 2: ask which happened FIRST\n   Step 3: give that one HAD + V3\n\n   PAST ──●────────●──► NOW\n         1st      2nd\n        HAD+V3    V2\n\n   SIGNAL WORDS THAT PAIR TWO PAST ACTIONS:\n   before · after · when · by the time\n   already · as soon as · no sooner · hardly\n\n   ⚠ TWO ERRORS TO AVOID:\n     'had' on the LATER action    ✘\n     'had' in BOTH clauses        ✘"},

 s13:[
 "The train ____ before I ____ the station, so I ____ to wait for two hours.|had left-reached-had;left-had reached-had;had left-had reached-had|0|Leaving was earlier → HAD LEFT. Reaching later → REACHED. Then HAD to wait.",
 "He told me that he ____ the letter ____ day, but it ____ not reached me so far.|had posted-the previous-has;posted-previous-had;had posted-previous-has|0|Posting was earlier → HAD POSTED. 'The previous day' is the reported form of 'yesterday'. 'So far' → HAS.",
 "By the time the police arrived, the thief ____ escaped, and nobody ____ seen ____ face.|has-had-his;had-had-his;had-has-their|1|Escaping was earlier → HAD. 'Nobody' is singular → HAD SEEN + HIS (Pronoun Rule 29).",
 "She realised that she ____ her purse in ____ auto, which she ____ only that morning.|had left-the-had hired;left-a-hired;had left-the-hired|0|Leaving was earlier → HAD LEFT. Specific auto → THE. Hiring was also earlier → HAD HIRED.",
 "After the guests ____ left, each of the servants ____ to clear ____ own table.|have-had-their;had-had-his;had-have-his|1|'After' shows leaving was earlier → HAD. 'Each of' is singular → HAD + HIS."],

 s14:{
  rule:"Of two past actions, the earlier takes the past perfect (had + V3) and the later takes the simple past.",
  formula:"EARLIER → HAD + V3   |   LATER → V2\nSignals: before · after · when · by the time · already",
  memory:"Draw the timeline. Whichever happened first gets HAD.",
  ta:"நேர கோடு வரையுங்க. எது முதல்ல நடந்ததோ அதுக்கு HAD.",
  tl:"Nera kodu varaiyunga. Edhu mudhalla nadandhadho adhukku HAD.",
  mistake:"Deciding by sentence position instead of time order, and putting 'had' in both clauses.",
  exam:"SSC CGL / CHSL, CDS and Bank — extremely frequent in Error Spotting and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule-ஐ புரிஞ்சுக்க ஒரு படம் மனசுல வரையுங்க — ஒரு நேர கோடு. இடது பக்கம் பழைய காலம், வலது பக்கம் இப்போ. இப்போ ரெண்டு கடந்தகால செயல் இருக்கு. அதுல எது முதல்ல நடந்தது?",
  tl:"Indha rule-ai purinjukka oru padam manasula varaiyunga — oru nera kodu. Idhu pakkam pazhaiya kaalam, valadhu pakkam ippo. Ippo rendu kadandhagaala seyal irukku. Adhula edhu mudhalla nadandhadhu?"},
 {ta:"உதாரணம்: 'The train had left before I reached the station.' ரெண்டு செயல் — ரயில் புறப்பட்டது, நான் நிலையம் அடைஞ்சேன். எது முதல்ல? ரயில் புறப்பட்டது. அதுக்கு HAD + V3 — 'had left'. நான் அடைஞ்சது ரெண்டாவது. அதுக்கு V2 — 'reached'.",
  tl:"Udhaaranam: 'The train had left before I reached the station.' Rendu seyal — rayil purappattadhu, naan nilaiyam adainjen. Edhu mudhalla? Rayil purappattadhu. Adhukku HAD + V3. Naan adainjadhu randaavadhu. Adhukku V2."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு point. எந்த clause-க்கு 'had' வரும் அப்படிங்கிறது வாக்கியத்துல எது முதல்ல எழுதப்பட்டிருக்கு அப்படிங்கிறதால தீர்மானிக்கப்படல. நேரத்தால தீர்மானிக்கப்படுது. 'Before I reached, the train had left' — இதுலயும் ரயில்தான் முதல்ல புறப்பட்டது, அதனால 'had left'. வாக்கிய வரிசை மாறினாலும் விதி மாறாது.",
  tl:"Ippo romba mukkiyamaana oru point. Endha clause-kku 'had' varum appadingiradhu vaakkiyaththula edhu mudhalla ezhudhappattirukku appadingiradhaala theermaanikkappadala. Neraththaala theermaanikkappadudhu."},
 {ta:"SSC இதைத்தான் சோதிக்குது. அவங்க 'The train left before I had reached the station' அப்படின்னு எழுதுவாங்க. நீங்க பார்த்தா, 'left' முதல்ல இருக்கு, 'had reached' அப்பறம் இருக்கு — சரியா தோணும். ஆனா தப்பு! 'Before' அப்படிங்கிறது ரயில் முதல்ல புறப்பட்டதுன்னு சொல்லுது. அதனால ரயிலுக்குதான் 'had'.",
  tl:"SSC idhaith-thaan sodhikkudhu. Avanga 'The train left before I had reached the station' appadinnu ezhudhuvaanga. Neenga paarththaa sariyaa thonum. Aanaa thappu! 'Before' appadingiradhu rayil mudhalla purappattadhunnu solludhu."},
 {ta:"அறிகுறிச் சொற்களை கவனிங்க — before, after, when, by the time, already, as soon as. இந்த வார்த்தை பார்த்தா, ரெண்டு கடந்தகால செயல் இருக்குன்னு தெரிஞ்சுக்கோங்க. அப்புறம் எது முதல்லன்னு கண்டுபிடிங்க. 'Before' அப்படிங்கிறது அதுக்கு முன்னாடி இருக்கிற செயல் முதல்ல அப்படின்னு சொல்லுது. 'After' அப்படிங்கிறது அதுக்கு அப்பறம் இருக்கிற செயல் முதல்ல அப்படின்னு சொல்லுது.",
  tl:"Arikurich sorkalai kavaninga — before, after, when, by the time, already, as soon as. Indha vaarththai paarththaa, rendu kadandhagaala seyal irukkunnu therinjukkonga. Appuram edhu mudhallannu kandupidinga."},
 {ta:"கடைசியா ஒரு எச்சரிக்கை — ரெண்டு clause-லயும் 'had' போடாதீங்க. 'He had finished before I had come' — தப்பு! ஒரு செயல் முந்தையது, இன்னொண்ணு பிந்தையது. முந்தையதுக்கு மட்டும் had. 'He HAD FINISHED before I CAME.' ஒரு had, ஒரு V2. இது ஒரு ஜோடி — ரெண்டு had ஒருபோதும் வராது.",
  tl:"Kadaisiyaa oru echcharikkai — rendu clause-layum 'had' podaadheenga. 'He had finished before I had come' — thappu! Mundhaiyadhukku mattum had. 'He HAD FINISHED before I CAME.' Oru had, oru V2."}]},

/* ========== RULE 55 ========== */
{n:55,rc:"TEN-05",d:"Hard",t:"NO 'WILL' in Time Clauses",
 tam:"When, Until, As soon as, If — இவற்றுக்குப் பின் 'will' வராது",
 s1:{en:"After WHEN, UNTIL, TILL, BEFORE, AFTER, AS SOON AS, BY THE TIME, THE MOMENT and IF, use the PRESENT tense even when the meaning is clearly future. Never write 'will' inside these clauses.",
  ta:"WHEN, UNTIL, TILL, BEFORE, AFTER, AS SOON AS, BY THE TIME, THE MOMENT, IF ஆகியவற்றுக்குப் பின், பொருள் தெளிவாக எதிர்காலமாக இருந்தாலும் நிகழ்கால tense பயன்படுத்தவும். இந்த clause-களுக்குள் ஒருபோதும் 'will' எழுதாதீர்கள்.",
  tl:"WHEN, UNTIL, TILL, BEFORE, AFTER, AS SOON AS, BY THE TIME, THE MOMENT, IF aagiyavatrukkup pin, porul thelivaaga edhirkaalamaaga irundhaalum nigazhgaala tense payanpaduththavum.",
  formula:"MAIN CLAUSE (will)  +  TIME CLAUSE (present)\n\n  I WILL CALL you when I REACH home.       ✔\n  I WILL CALL you when I WILL REACH home.  ✘\n\n  Wait until he COMES.                     ✔\n  If it RAINS, we WILL cancel the trip.    ✔"},

 s2:[
 {h:"The main clause already carries the future",
  en:"'I WILL call you when I reach home' — the 'will' in the main clause already tells you the whole sentence is about the future. Repeating it in the time clause is redundant, and English forbids it.",
  ta:"Main clause ஏற்கனவே எதிர்காலத்தைச் சுமக்கிறது. 'I WILL call you when I reach home' — main clause-ல் உள்ள 'will' முழு வாக்கியமும் எதிர்காலத்தைப் பற்றியது என்று ஏற்கனவே சொல்கிறது. Time clause-ல் அதை மீண்டும் சொல்வது தேவையற்றது, ஆங்கிலம் அதைத் தடுக்கிறது.",
  tl:"Main clause erkanave edhirkaalaththaich sumakkiradhu. Main clause-l ulla 'will' muzhu vaakkiyamum edhirkaalaththaip patriyadhu endru erkanave solgiradhu. Time clause-l adhai meendum solvadhu thevaiyatradhu."},
 {h:"Tamil and Hindi both allow the future here",
  en:"In Tamil you can say 'நான் வீட்டுக்கு வருவேன்போது' with a future sense, and Hindi allows the same. That is why 'when I will reach' feels natural to Indian learners. English simply does not permit it.",
  ta:"தமிழும் இந்தியும் இங்கே எதிர்காலத்தை அனுமதிக்கின்றன. தமிழில் எதிர்காலப் பொருளுடன் சொல்ல முடியும், இந்தியும் அதையே அனுமதிக்கிறது. அதனால்தான் 'when I will reach' இந்திய மாணவர்களுக்கு இயற்கையாகத் தோன்றுகிறது. ஆங்கிலம் அதை அனுமதிக்கவே இல்லை.",
  tl:"Thamizhum Hindiyum inge edhirkaalaththai anumadhikkindrana. Adhanaal-dhaan 'when I will reach' Indhiya maanavargalukku iyarkaiyaagath thondrugiradhu. Aangilam adhai anumadhikkave illai."},
 {h:"Which clause takes 'will' and which does not",
  en:"The clause with when, until, if, as soon as → PRESENT tense. The other clause (the main clause) → WILL. Identify the connecting word and you instantly know which is which.",
  ta:"எந்த clause 'will' எடுக்கும், எது எடுக்காது. when, until, if, as soon as உள்ள clause → நிகழ்கால tense. மற்ற clause (main clause) → WILL. இணைப்புச் சொல்லை அடையாளம் கண்டால், எது எது என்று உடனே தெரிந்துவிடும்.",
  tl:"Endha clause 'will' edukkum, edhu edukkaadhu. when, until, if, as soon as ulla clause → nigazhgaala tense. Matra clause (main clause) → WILL."},
 {h:"WHEN as a question word is different",
  en:"'When will you come?' is a QUESTION, not a time clause, so 'will' is correct there. The rule applies only when 'when' joins two clauses: 'I will tell you when he comes'.",
  ta:"கேள்விச் சொல்லாக WHEN வேறுபட்டது. 'When will you come?' ஒரு கேள்வி, ஒரு time clause அல்ல, எனவே அங்கே 'will' சரி. 'When' இரண்டு clause-களை இணைக்கும்போது மட்டுமே இந்த விதி பொருந்தும்: 'I will tell you when he comes'.",
  tl:"Kelvich sollaaga WHEN verupattadhu. 'When will you come?' oru kelvi, oru time clause alla, enave ange 'will' sari. 'When' irandu clause-galai inaikkumbodhu mattume indha vidhi porundhum."}],

 s3:[
 {h:"One will per sentence",
  d:"   I WILL CALL you   when   I REACH home.\n        ↑                        ↑\n   main clause              time clause\n   takes WILL              takes PRESENT\n\n   ⚠ TWO 'WILLS' IN ONE SENTENCE\n     with when/if is almost always WRONG."},
 {h:"The trigger words",
  d:"   These words BAN 'will' after them:\n\n   when · until · till · before · after\n   as soon as · by the time · the moment\n   if · unless · in case · once\n\n   Wait until he COMES.          ✔\n   Wait until he WILL COME.      ✘"},
 {h:"Question when versus clause when",
  d:"   QUESTION:  When WILL you come?        ✔\n              (one clause, a direct question)\n\n   CLAUSE  :  I will tell you when he COMES. ✔\n              (two clauses joined by 'when')\n\n   Only the CLAUSE version bans 'will'."}],

 s4:{
 wrong:["\"The action is in the future, so it needs 'will'.\" — The main clause already shows the future.",
  "\"'I will call you when I will reach' is more complete.\" — It is grammatically wrong.",
  "\"'When will you come?' proves 'will' is allowed after 'when'.\" — That is a question, not a time clause.",
  "\"'If it will rain, we will cancel' is logical.\" — 'If' clauses take the present tense."],
 right:["Find the connecting word: when, until, if, as soon as.",
  "That clause takes the PRESENT tense.",
  "The other clause takes 'will'.",
  "If you see two 'wills' with when or if, one is wrong."]},

 s5:[
 {en:"I will call you when I reach home.",ta:"நான் வீட்டை அடைந்தவுடன் உங்களை அழைப்பேன்.",tl:"Naan veettai adaindhavudan ungalai azhaippen.",note:"The time clause takes the present tense."},
 {en:"Wait until he comes back.",ta:"அவர் திரும்பி வரும் வரை காத்திருங்கள்.",tl:"Avar thirumbi varum varai kaaththirungal.",note:"'Until' bans 'will'."},
 {en:"As soon as the bell rings, we will leave.",ta:"மணி அடித்தவுடன் நாங்கள் புறப்படுவோம்.",tl:"Mani adiththavudan naangal purappaduvom.",note:"'As soon as' takes the present tense."},
 {en:"If it rains tomorrow, we will cancel the trip.",ta:"நாளை மழை பெய்தால், நாங்கள் பயணத்தை ரத்து செய்வோம்.",tl:"Naalai mazhai peydhaal, naangal payanaththai raththu seyvom.",note:"'If' clauses take the present tense for future meaning."},
 {en:"When will you return from Delhi?",ta:"நீங்கள் எப்போது டெல்லியிலிருந்து திரும்புவீர்கள்?",tl:"Neengal eppodhu Delhi-yilirundhu thirumbuveergal?",note:"A direct question → 'will' is correct here."}],

 s7:[
 "I will call you when I ____ home.|reach|Easy|The time clause takes the present.",
 "Wait until he ____.|comes|Easy|'Until' bans 'will'.",
 "As soon as the bell ____, we will go.|rings|Easy|Present tense.",
 "If it ____ tomorrow, we will stay in.|rains|Easy|'If' takes the present.",
 "I shall inform you as soon as he ____.|arrives|Medium|Present tense.",
 "He will wait till you ____ back.|come|Medium|'Till' bans 'will'.",
 "By the time you ____, I will be gone.|arrive|Medium|'By the time' takes the present.",
 "Unless you ____ hard, you will fail.|work|Medium|'Unless' takes the present.",
 "When ____ you come to see me?|will|Hard|A direct question allows 'will'.",
 "The moment he ____ in, tell him.|walks|Hard|'The moment' takes the present.",
 "Before the sun ____, we will finish.|sets|Hard|'Before' takes the present.",
 "I will not leave until she ____.|returns|Hard|'Until' bans 'will'.",
 "Once the results ____ out, we will celebrate.|come|Expert|'Once' takes the present.",
 "In case he ____ late, start without him.|is|Expert|'In case' takes the present.",
 "After the guests ____, we will have dinner.|leave|Expert|'After' takes the present."],

 "I shall inform you as soon as he will arrive.|I shall inform you as soon as he arrives.|'As soon as' takes the present.",

 s9:[
 "Fill in the Blank|I shall hand over the file to you as soon as the officer ____ it.|will sign;signs|1|'As soon as' takes the present tense.",
 "Find the Error|We will start the meeting (A) as soon as the (B) chairman will arrive (C) at the office (D).|A;B;C;D|2|Part C. 'As soon as' bans 'will' → 'arrives'.",

 s10:{
  en:"Tamil and Hindi both allow a future verb in these clauses, so 'when I will reach' feels not just acceptable but MORE correct to an Indian learner. It is one of the strongest mother-tongue interferences in English grammar. The safety check is simple: if you see two 'wills' in one sentence joined by when, if, until or as soon as, one of them is wrong.",
  ta:"தமிழும் இந்தியும் இந்த clause-களில் எதிர்கால வினைச்சொல்லை அனுமதிக்கின்றன, எனவே 'when I will reach' ஒரு இந்திய மாணவருக்கு ஏற்கத்தக்கது மட்டுமல்ல, அதிக சரியானதாகவும் தோன்றுகிறது. இது ஆங்கில இலக்கணத்தில் மிகவும் வலுவான தாய்மொழித் தலையீடுகளில் ஒன்று. பாதுகாப்புச் சோதனை எளிது: when, if, until அல்லது as soon as-ஆல் இணைக்கப்பட்ட ஒரே வாக்கியத்தில் இரண்டு 'will' பார்த்தால், அவற்றில் ஒன்று தவறு.",
  tl:"Thamizhum Hindiyum indha clause-galil edhirkaala vinaicholai anumadhikkindrana, enave 'when I will reach' oru Indhiya maanavarukku erkaththakkadhu mattumalla, adhiga sariyaanadhaagavum thondrugiradhu. Paadhukaappuch sodhanai eladhu."},

 s11:{
  en:"ONE 'WILL' PER SENTENCE. If when, if, until or as soon as appears, that clause takes the present.",
  ta:"ஒரு வாக்கியத்திற்கு ஒரு 'WILL'. When, if, until, as soon as வந்தால், அந்த clause நிகழ்காலம் எடுக்கும்.",
  tl:"Oru vaakkiyaththirku oru 'WILL'. When, if, until, as soon as vandhaal, andha clause nigazhgaalam edukkum.",
  vis:"      THE ONE-WILL RULE\n\n   I WILL call you  |  when I REACH home.\n        ↑                    ↑\n   ONE will here      NO will here\n\n   THE BAN LIST — no 'will' after these:\n   ┌──────────────────────────────────┐\n   │ when · until · till · before     │\n   │ after · as soon as · by the time │\n   │ the moment · if · unless · once  │\n   └──────────────────────────────────┘\n\n   ⚠ QUICK CHECK:\n     Two 'wills' + when/if  →  one is wrong\n\n   ⚠ EXCEPTION — direct questions:\n     When WILL you come?   ✔"},

 s13:[
 "I ____ call you as soon as I ____ home, but do not wait if I ____ late.|will-reach-am;will-will reach-will be;shall-reach-will be|0|Main clause → WILL. 'As soon as' → REACH. 'If' → AM.",
 "By the time you ____ Chennai, the train ____ already left ____ station.|reach-will have-the;will reach-has-a;reach-has-the|0|'By the time' → REACH. Future perfect → WILL HAVE left. Specific station → THE.",
 "If it ____ tomorrow, neither of the two matches ____ played, and everyone ____ disappointed.|rains-will be-will be;will rain-are-are;rains-are-will be|0|'If' → RAINS. 'Neither of' is fixed singular → WILL BE. 'Everyone' → WILL BE.",
 "Wait until ____ doctor ____ , and tell him that ____ patient ____ been ill since Monday.|the-comes-the-has;a-will come-a-has;the-will come-the-had|0|Specific doctor and patient → THE. 'Until' → COMES. 'Since Monday' → HAS BEEN.",
 "Once the results ____ out, each of the students ____ informed of ____ marks.|come-will be-his;will come-are-their;come-are-his|0|'Once' → COME. 'Each of' is singular → WILL BE + HIS."],

 s14:{
  rule:"Use the present tense after when, until, before, after, as soon as, by the time and if, even for future meaning.",
  formula:"MAIN clause → WILL   |   TIME clause → PRESENT\nBan list: when · until · till · before · after · as soon as · by the time · if · unless · once",
  memory:"One 'will' per sentence. Two 'wills' with when or if means one is wrong.",
  ta:"ஒரு வாக்கியத்துக்கு ஒரு 'will'. When/if-ஓட ரெண்டு 'will' இருந்தா, ஒண்ணு தப்பு.",
  tl:"Oru vaakkiyaththukku oru 'will'. When/if-oda rendu 'will' irundhaa, onnu thappu.",
  mistake:"Writing 'when I will reach' because Tamil and Hindi both allow the future there.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — one of the strongest mother-tongue interference errors."},

 s15:[
 {ta:"இந்த rule நமக்கு ரொம்ப கஷ்டமா இருக்கும். ஏன்? ஏன்னா நம்ம தாய்மொழி இதுல வேற மாதிரி வேலை செய்யுது. தமிழ்ல, இந்தியில ரெண்டு இடத்துலயும் எதிர்காலம் சொல்லலாம். ஆனா ஆங்கிலத்துல முடியாது.",
  tl:"Indha rule namakku romba kashtamaa irukkum. Yennaa namma thaaymozhi idhula veru maadhiri velai seyyudhu. Tamil-la, Hindi-yila rendu idaththulayum edhirkaalam sollalaam. Aanaa Aangilaththula mudiyaadhu."},
 {ta:"உதாரணம்: 'I will call you when I reach home.' இதுல 'when I reach' — நிகழ்காலம். ஆனா அர்த்தம் என்ன? நான் இன்னும் வீட்டுக்கு வரல, வருவேன், அப்பறம் phone பண்ணுவேன். அர்த்தம் முழுக்க எதிர்காலம். ஆனா வடிவம் நிகழ்காலம்.",
  tl:"Udhaaranam: 'I will call you when I reach home.' Idhula 'when I reach' — nigazhgaalam. Aanaa arththam enna? Naan innum veettukku varala, varuven, apparam phone pannuven. Arththam muzhukka edhirkaalam. Aanaa vadivam nigazhgaalam."},
 {ta:"ஏன் இப்படி? ஆங்கிலம் ஒரு விஷயத்தை ரெண்டு தடவ சொல்ல விரும்பல. Main clause-ல 'will' இருக்கு இல்லையா? அது ஏற்கனவே 'இது எதிர்காலம்' அப்படின்னு சொல்லிடுச்சு. அதனால time clause-ல மறுபடி 'will' சொல்ல வேணாம்.",
  tl:"Yen ippadi? Aangilam oru vishayaththai rendu thadava solla virumbala. Main clause-la 'will' irukku illaiyaa? Adhu erkanave 'idhu edhirkaalam' appadinnu sollidichu. Adhanaala time clause-la marubadi 'will' solla venaam."},
 {ta:"தடைப் பட்டியல் மனப்பாடம் பண்ணுங்க: when, until, till, before, after, as soon as, by the time, the moment, if, unless, once. இந்த வார்த்தைக்கு அப்பறம் 'will' ஒருபோதும் வராது. நிகழ்காலம்தான்.",
  tl:"Thadaip pattiyal manappaadam pannunga: when, until, till, before, after, as soon as, by the time, the moment, if, unless, once. Indha vaarththaikku apparam 'will' orupodhum varaadhu."},
 {ta:"ஒரு எளிய சோதனை சொல்லுறேன் — 'ஒரு will சோதனை'. வாக்கியத்துல எத்தனை 'will' இருக்கு-ன்னு எண்ணுங்க. When, if, until, as soon as இருக்கிற வாக்கியத்துல ரெண்டு 'will' இருந்தா, கண்டிப்பா ஒண்ணு தப்பு. Time clause-ல இருக்கிற 'will'-ஐ எடுத்துடுங்க.",
  tl:"Oru eliya sodhanai solluren — 'oru will sodhanai'. Vaakkiyaththula eththanai 'will' irukkunnu ennunga. When, if, until, as soon as irukkira vaakkiyaththula rendu 'will' irundhaa, kandippaa onnu thappu."},
 {ta:"கடைசியா ஒரு விதிவிலக்கு — கேள்வி. 'When WILL you come?' இது சரி! ஏன்? ஏன்னா இது ஒரு நேரடி கேள்வி, time clause இல்ல. இங்க 'when' ரெண்டு clause-ஐ இணைக்கல, அது ஒரு கேள்விச் சொல். 'I will tell you when he COMES' — இது clause, இங்க will வராது. வித்தியாசம் தெரியுதா? கேள்விக்குறி இருக்கா-ன்னு பாருங்க.",
  tl:"Kadaisiyaa oru vidhivilakku — kelvi. 'When WILL you come?' Idhu sari! Yennaa idhu oru neradi kelvi, time clause illa. 'I will tell you when he COMES' — idhu clause, inga will varaadhu. Kelvikkuri irukkaanu paarunga."}]},

/* ========== RULE 56 ========== */
{n:56,rc:"TEN-06",d:"Hard",t:"Sequence of Tenses — Past follows Past",
 tam:"Main clause கடந்தகாலமா இருந்தா, subordinate clause-ம் கடந்தகாலம்",
 s1:{en:"If the MAIN clause is in the PAST tense, the SUBORDINATE clause must also be in the PAST tense. The one exception is a UNIVERSAL TRUTH, which always stays in the present.",
  ta:"Main clause கடந்தகால tense-ல் இருந்தால், subordinate clause-ம் கடந்தகால tense-ல் இருக்க வேண்டும். ஒரே விதிவிலக்கு நிரந்தர உண்மை, அது எப்போதும் நிகழ்காலத்திலேயே இருக்கும்.",
  tl:"Main clause kadandhagaala tense-l irundhaal, subordinate clause-um kadandhagaala tense-l irukka vendum. Ore vidhivilakku nirandhara unmai, adhu eppodhum nigazhgaalaththileye irukkum.",
  formula:"PAST main clause  →  PAST subordinate clause\n\n  He SAID that he WAS busy.          ✔\n  She TOLD me that she WOULD come.   ✔\n  I KNEW that he HAD left.           ✔\n\nEXCEPTION — UNIVERSAL TRUTH stays present:\n  He SAID that honesty IS the best policy. ✔\n  She TOLD us that the earth IS round.     ✔"},

 s2:[
 {h:"The backshift table",
  en:"present → past. present continuous → past continuous. present perfect → past perfect. simple past → past perfect. will → would. can → could. may → might. shall → should. must → had to.",
  ta:"பின்னோக்கிய மாற்ற அட்டவணை: present → past. present continuous → past continuous. present perfect → past perfect. simple past → past perfect. will → would. can → could. may → might. shall → should. must → had to.",
  tl:"Pinnokkiya maatra attavanai: present → past. present continuous → past continuous. present perfect → past perfect. simple past → past perfect. will → would. can → could. may → might. shall → should."},
 {h:"The universal truth exception is the tested part",
  en:"'The teacher said that the earth IS round' — not 'was'. A fact that is permanently true does not backshift. This is exactly Rule 51 seen from the other direction, and it is where SSC plants the error.",
  ta:"நிரந்தர உண்மை விதிவிலக்குதான் சோதிக்கப்படும் பகுதி. 'The teacher said that the earth IS round' — 'was' அல்ல. நிரந்தரமாக உண்மையான ஒரு உண்மை பின்னோக்கி நகராது. இது சரியாக Rule 51-ஐ மறுதிசையிலிருந்து பார்ப்பதுதான், SSC தவறை நடுவது இங்கேதான்.",
  tl:"Nirandhara unmai vidhivilakkudhaan sodhikkappadum paguthi. 'The teacher said that the earth IS round' — 'was' alla. Idhu sariyaaga Rule 51-ai maruthisaiyilirundhu paarppadhudhaan."},
 {h:"Habitual facts also stay present",
  en:"'He said that he goes to the temple every Friday' — a continuing habit can stay present. But if the habit has stopped, backshift it: 'He said that he used to go'. Context decides.",
  ta:"வழக்கமான உண்மைகளும் நிகழ்காலத்திலேயே இருக்கும். 'He said that he goes to the temple every Friday' — தொடர்ந்து நடக்கும் ஒரு பழக்கம் நிகழ்காலத்தில் இருக்கலாம். ஆனால் பழக்கம் நின்றுவிட்டால், பின்னோக்கி மாற்றுங்கள்: 'He said that he used to go'. சூழல் தீர்மானிக்கிறது.",
  tl:"Vazhakkamaana unmaigalum nigazhgaalaththileye irukkum. 'He said that he goes to the temple every Friday' — thodarndhu nadakkum oru pazhakkam nigazhgaalaththil irukkalaam."},
 {h:"Present or future main verb means NO change",
  en:"'He SAYS that he IS busy' — the reporting verb is present, so nothing shifts. 'He WILL SAY that he IS busy' — same. Only a PAST main verb triggers the backshift.",
  ta:"நிகழ்கால அல்லது எதிர்கால main verb என்றால் எந்த மாற்றமும் இல்லை. 'He SAYS that he IS busy' — reporting verb நிகழ்காலம், எனவே எதுவும் நகராது. 'He WILL SAY that he IS busy' — அதேதான். கடந்தகால main verb மட்டுமே பின்னோக்கிய மாற்றத்தைத் தூண்டுகிறது.",
  tl:"Nigazhgaala alladhu edhirkaala main verb endraal endha maatramum illai. 'He SAYS that he IS busy' — reporting verb nigazhgaalam, enave edhuvum nagaraadhu. Kadandhagaala main verb mattume pinnokkiya maatraththaith thoondugiradhu."}],

 s3:[
 {h:"The backshift table",
  d:"   DIRECT              →  REPORTED (after past verb)\n   ────────────────────────────────────────\n   is / am / are        →  was / were\n   do / does            →  did\n   has / have           →  had\n   did / V2             →  had + V3\n   will                 →  would\n   can                  →  could\n   may                  →  might\n   shall                →  should\n   must                 →  had to"},
 {h:"The one exception",
  d:"   ⚠ UNIVERSAL TRUTH NEVER BACKSHIFTS\n\n   He said that the earth IS round.        ✔\n   He said that the earth WAS round.       ✘\n\n   He said that honesty IS the best policy.✔\n   He said that water BOILS at 100°C.      ✔\n\n   Ask: is it still true today?\n   YES → keep it present."},
 {h:"Only a past main verb triggers the shift",
  d:"   He SAYS   that he IS busy.    ✔ no shift\n   He WILL SAY that he IS busy.  ✔ no shift\n   He SAID   that he WAS busy.   ✔ shift\n\n   Look at the REPORTING verb first.\n   Past → shift.  Present/future → no shift."}],

 s4:{
 wrong:["\"Reported speech always shifts to the past.\" — Universal truths never shift.",
  "\"'He said that the earth is round' mixes tenses, so it must be wrong.\" — It is correct.",
  "\"'He says that he was busy' is fine.\" — A present reporting verb causes no shift.",
  "\"'Will' stays 'will' in reported speech.\" — It becomes 'would' after a past verb."],
 right:["Look at the reporting verb first. Past → backshift.",
  "Ask whether the reported fact is permanently true. If yes, keep it present.",
  "Learn the shift table: is→was, has→had, will→would, can→could.",
  "Present or future reporting verb → change nothing."]},

 s5:[
 {en:"He said that he was busy that day.",ta:"அன்று தான் பணியில் இருப்பதாக அவர் கூறினார்.",tl:"Andru thaan paniyil iruppadhaaga avar koorinaar.",note:"Past reporting verb → 'is' becomes 'was'."},
 {en:"She told me that she would come the next day.",ta:"அடுத்த நாள் தான் வருவதாக அவர் என்னிடம் கூறினார்.",tl:"Aduththa naal thaan varuvadhaaga avar ennidam koorinaar.",note:"'Will' becomes 'would' after a past verb."},
 {en:"He said that honesty is the best policy.",ta:"நேர்மையே சிறந்த கொள்கை என்று அவர் கூறினார்.",tl:"Nermaiye sirandha kolgai endru avar koorinaar.",note:"A universal truth stays present."},
 {en:"The teacher said that the earth moves round the sun.",ta:"பூமி சூரியனைச் சுற்றி வருகிறது என்று ஆசிரியர் கூறினார்.",tl:"Boomi sooriyanaich sutri varugiradhu endru aasiriyar koorinaar.",note:"A scientific truth stays present."},
 {en:"He says that he is unwell today.",ta:"இன்று தனக்கு உடல்நலமில்லை என்று அவர் கூறுகிறார்.",tl:"Indru thanakku udalnalamillai endru avar koorugiraar.",note:"A present reporting verb causes no shift."}],
