 s9:[
 "Fill in the Blank|Our physics teacher told us that sound ____ more slowly than light.|travelled;travels|1|A scientific truth never backshifts.",
 "Find the Error|He informed the committee (A) that he will submit (B) his report (C) within a week (D).|A;B;C;D|1|Part B. A past reporting verb requires 'would submit'.",
 "Sentence Improvement|The old man said that he was living in that village since his childhood.|was living;had been living;is living|1|'Since his childhood' after a past verb requires the past perfect continuous.",
 "Fill in the Blank|The guide explained that the Ganga ____ through several northern states of India.|flowed;flows|1|A permanent geographical fact stays present.",
 "Find the Error|She says (A) that she was (B) not feeling well (C) since yesterday (D).|A;B;C;D|1|Part B. A present reporting verb causes no shift → 'has not been feeling'."],

 s10:{
  en:"The whole question is the EXCEPTION, not the rule. Students learn 'past follows past' and then mechanically write 'He said that the earth WAS round' — which is wrong. SSC almost never tests the plain backshift; it tests whether you notice a universal truth hiding inside a reported sentence. Always ask: is this still true today?",
  ta:"முழு கேள்வியும் விதிவிலக்குதான், விதி அல்ல. மாணவர்கள் 'கடந்தகாலம் கடந்தகாலத்தைப் பின்பற்றும்' என்று கற்றுக்கொண்டு, பிறகு எந்திரத்தனமாக 'He said that the earth WAS round' என்று எழுதுகிறார்கள் — அது தவறு. SSC வெறும் பின்னோக்கிய மாற்றத்தை கிட்டத்தட்ட ஒருபோதும் சோதிப்பதில்லை; ஒரு reported வாக்கியத்திற்குள் ஒளிந்திருக்கும் நிரந்தர உண்மையை நீங்கள் கவனிக்கிறீர்களா என்று சோதிக்கிறது. எப்போதும் கேளுங்கள்: இது இன்றும் உண்மையா?",
  tl:"Muzhu kelviyum vidhivilakkudhaan, vidhi alla. SSC verum pinnokkiya maatraththai kittaththatta orupodhum sodhippadhillai; oru reported vaakkiyaththirkul olindhirukkum nirandhara unmaiyai neengal kavanikkireergalaa endru sodhikkiradhu."},

 s11:{
  en:"IS IT STILL TRUE TODAY? Yes → keep it present. No → backshift it.",
  ta:"அது இன்றும் உண்மையா? ஆம் → நிகழ்காலத்திலேயே வையுங்கள். இல்லை → பின்னோக்கி மாற்றுங்கள்.",
  tl:"Adhu indrum unmaiyaa? Aam → nigazhgaalaththileye vaiyungal. Illai → pinnokki maatrungal.",
  vis:"      THE 'STILL TRUE?' TEST\n\n   He said that ____ .\n\n   Ask: is this fact STILL TRUE today?\n\n   YES  →  keep the PRESENT tense\n     the earth IS round\n     honesty IS the best policy\n     water BOILS at 100°C\n\n   NO   →  BACKSHIFT it\n     he WAS busy (only that day)\n     he WOULD come (that plan)\n\n   THE SHIFT TABLE:\n   is→was · has→had · did→had done\n   will→would · can→could · may→might"},

 s13:[
 "The teacher said that the earth ____ round and that she ____ explained it earlier.|was-has;is-had;is-has|1|A universal truth stays present → IS. Earlier action → HAD explained (Rule 54).",
 "He told me that he ____ ill since Monday and ____ not attended office ____ four days.|is-has-since;had been-had-for;was-had-for|1|Backshift with 'since Monday' → HAD BEEN. 'Four days' is a length → FOR (Rule 53).",
 "She said that water ____ at 100 degrees and that she ____ the experiment the previous day.|boiled-did;boils-had done;boils-did|1|A scientific truth stays present → BOILS. Earlier action → HAD DONE.",
 "He informed us that he ____ submit the report as soon as the officer ____ it.|will-signs;would-signed;would-signs|1|Backshift → WOULD. The time clause also backshifts after a past verb → SIGNED.",
 "The guide explained that ____ Ganga ____ through ____ north and that it ____ sacred.|the-flows-the-is;a-flowed-a-was;the-flowed-the-was|0|River → THE. Permanent facts stay present → FLOWS and IS."],

 s14:{
  rule:"A past main clause requires a past subordinate clause, except for universal truths which stay present.",
  formula:"PAST reporting verb → BACKSHIFT everything\nis→was · has→had · will→would · can→could · may→might\nEXCEPTION: universal truth stays PRESENT",
  memory:"Is it still true today? Yes, keep it present. No, shift it back.",
  ta:"அது இன்னைக்கும் உண்மையா? உண்மைன்னா நிகழ்காலம். இல்லைன்னா பின்னோக்கி மாத்துங்க.",
  tl:"Adhu innaikkum unmaiyaa? Unmainnaa nigazhgaalam. Illainnaa pinnokki maaththunga.",
  mistake:"Mechanically backshifting a universal truth: 'He said that the earth was round'.",
  exam:"SSC CGL / CHSL, CDS and Bank — the universal-truth exception is what is actually tested."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு பகுதி இருக்கு. முதல் பகுதி எளிது — main clause கடந்தகாலமா இருந்தா, subordinate clause-ம் கடந்தகாலம். 'He SAID that he WAS busy.' 'She TOLD me that she WOULD come.' இது நேரடி.",
  tl:"Indha rule-la rendu paguthi irukku. Mudhal paguthi eladhu — main clause kadandhagaalamaa irundhaa, subordinate clause-um kadandhagaalam. 'He SAID that he WAS busy.' Idhu neradi."},
 {ta:"ஒரு அட்டவணை மனப்பாடம் பண்ணுங்க: is/am/are → was/were. do/does → did. has/have → had. V2 → had + V3. will → would. can → could. may → might. shall → should. must → had to. இது backshift அட்டவணை.",
  tl:"Oru attavanai manappaadam pannunga: is/am/are → was/were. do/does → did. has/have → had. V2 → had + V3. will → would. can → could. may → might. Idhu backshift attavanai."},
 {ta:"ஆனா இப்போ ரொம்ப முக்கியமான ரெண்டாவது பகுதி — விதிவிலக்கு. SSC உண்மையில் இதைத்தான் கேட்குது. 'The teacher said that the earth ____ round.' இப்போ என்ன போடுவீங்க? நீங்க rule-ஐ மட்டும் மனப்பாடம் பண்ணி இருந்தா 'was' போடுவீங்க. ஆனா தப்பு! சரியான பதில் 'IS'.",
  tl:"Aanaa ippo romba mukkiyamaana randaavadhu paguthi — vidhivilakku. SSC unmaiyil idhaith-thaan ketkudhu. 'The teacher said that the earth ____ round.' Neenga rule-ai mattum manappaadam panni irundhaa 'was' poduveenga. Aanaa thappu!"},
 {ta:"ஏன்? ஏன்னா பூமி உருண்டையா இருக்கிறது ஒரு நிரந்தர உண்மை. Teacher நேத்து சொன்னாலும், முந்தானூறு வருஷத்துக்கு முன்னாடி சொன்னாலும், பூமி இன்னைக்கும் உருண்டைதான். அது மாறல. அதனால அது நிகழ்காலத்துலயே இருக்கும்.",
  tl:"Yen? Yennaa boomi urundaiyaa irukkiradhu oru nirandhara unmai. Teacher neththu sonnaalum, munnooru varushaththukku munnaadi sonnaalum, boomi innaikkum urundaidhaan. Adhu maarala. Adhanaala adhu nigazhgaalaththulaye irukkum."},
 {ta:"ஒரு எளிய சோதனை சொல்லுறேன் — 'இன்னைக்கும் உண்மையா?' சோதனை. அந்த விஷயத்தை படிச்சுட்டு கேளுங்க: 'இது இன்னைக்கும் உண்மையா?' பூமி உருண்டை — இன்னைக்கும் உண்மை. நேர்மையே சிறந்த கொள்கை — இன்னைக்கும் உண்மை. தண்ணீர் 100 டிகிரில கொதிக்குது — இன்னைக்கும் உண்மை. இதெல்லாம் நிகழ்காலம்.",
  tl:"Oru eliya sodhanai solluren — 'innaikkum unmaiyaa?' sodhanai. Andha vishayaththai padichuttu kelunga: 'idhu innaikkum unmaiyaa?' Boomi urundai — innaikkum unmai. Nermaiye sirandha kolgai — innaikkum unmai. Idhellaam nigazhgaalam."},
 {ta:"ஆனா 'He said that he was busy' — அவரு அன்னைக்கு பணியில் இருந்தாரு. இன்னைக்கு பணியில் இருக்காரா? தெரியாது. அது நிரந்தர உண்மை இல்ல, அன்னைக்கு மட்டும் உண்மை. அதனால பின்னோக்கி மாறும் — 'was'. இந்த ஒரு கேள்வி — 'இன்னைக்கும் உண்மையா?' — உங்களுக்கு எப்பவும் சரியான பதில் தரும். மேலும் இதை Rule 51-ஓட இணைச்சுப் பாருங்க. அங்க universal truth simple present-ல வரும்னு படிச்சோம். இங்க அது பின்னோக்கி மாறாதுன்னு படிக்குறோம். ஒரே விதி, ரெண்டு பக்கம்.",
  tl:"Aanaa 'He said that he was busy' — avaru annaikku paniyil irundhaaru. Innaikku paniyil irukkaaraa? Theriyaadhu. Adhu nirandhara unmai illa. Adhanaala pinnokki maarum — 'was'. Melum idhai Rule 51-oda inaichup paarunga. Ore vidhi, rendu pakkam."}]},
/* ========== RULE 57 ========== */
{n:57,rc:"TEN-07",d:"Easy",t:"Simple Past for a Finished Action at a Definite Past Time",
 tam:"கடந்த காலத்தில் குறிப்பிட்ட நேரத்தில் முடிந்த செயலுக்கு simple past",
 s1:{en:"Use the SIMPLE PAST (V2) for an action completed at a STATED time in the past, with no connection to the present. After DID, DIDN'T and DOES, always use the BASE FORM V1 — never V2.",
  ta:"கடந்த காலத்தில் குறிப்பிட்ட நேரத்தில் முடிந்த, நிகழ்காலத்துடன் தொடர்பில்லாத செயலுக்கு SIMPLE PAST (V2) பயன்படுத்தவும். DID, DIDN'T, DOES ஆகியவற்றுக்குப் பின் எப்போதும் அடிப்படை வடிவம் V1 பயன்படுத்தவும் — ஒருபோதும் V2 அல்ல.",
  tl:"Kadandha kaalaththil kurippitta neraththil mudindha, nigazhgaalaththudan thodarpillaadha seyalukku SIMPLE PAST (V2) payanpaduththavum. DID, DIDN'T, DOES aagiyavatrukkup pin eppodhum adippadai vadivam V1 payanpaduththavum.",
  formula:"SIMPLE PAST  →  V2\n\n  Gandhi WAS BORN in 1869.\n  I MET him last Sunday.\n  She WROTE the exam two days ago.\n\nAFTER DID / DIDN'T / DOES  →  V1 (base form)\n  Did he WRITE the letter?      ✔  (not 'wrote')\n  He did not GO to school.      ✔  (not 'went')"},

 s2:[
 {h:"The action is closed",
  en:"'I met him last Sunday' — that meeting is over. Nothing about it continues into today. The simple past describes a completed, sealed event. This is exactly why it cannot be replaced by the present perfect (Rule 52).",
  ta:"செயல் மூடப்பட்டுவிட்டது. 'I met him last Sunday' — அந்தச் சந்திப்பு முடிந்துவிட்டது. அதைப் பற்றி எதுவும் இன்றுவரை தொடரவில்லை. Simple past ஒரு முடிக்கப்பட்ட, மூடப்பட்ட நிகழ்வை விவரிக்கிறது. அதனால்தான் அதை present perfect-ஆல் மாற்ற முடியாது (Rule 52).",
  tl:"Seyal moodappattuvittadhu. 'I met him last Sunday' — andhach sandhippu mudindhuvittadhu. Simple past oru mudikkappatta, moodappatta nigazhvai vivarikkiradhu."},
 {h:"The DID + V1 rule is the biggest trap",
  en:"'Did he went?' is wrong. 'Did' already carries the past tense, so the main verb goes back to its base form: 'Did he GO?'. Same for 'He did not GO', 'She didn't COME', 'Does he KNOW?'.",
  ta:"DID + V1 விதிதான் மிகப்பெரிய பொறி. 'Did he went?' தவறு. 'Did' ஏற்கனவே கடந்தகாலத்தைச் சுமக்கிறது, எனவே முதன்மை வினைச்சொல் அதன் அடிப்படை வடிவத்திற்குத் திரும்புகிறது: 'Did he GO?'. 'He did not GO', 'She didn't COME', 'Does he KNOW?' ஆகியவற்றுக்கும் அதேதான்.",
  tl:"DID + V1 vidhidhaan migapperiya pori. 'Did he went?' thavaru. 'Did' erkanave kadandhagaalaththaich sumakkiradhu, enave mudhanmai vinaichol adhan adippadai vadivaththirkuth thirumbugiradhu: 'Did he GO?'."},
 {h:"Past habits use USED TO or WOULD",
  en:"'He used to smoke' and 'He would visit us every Sunday' describe habits that no longer continue. The simple past can also do this: 'He smoked heavily in those days'. All three are past habits.",
  ta:"கடந்தகாலப் பழக்கங்கள் USED TO அல்லது WOULD பயன்படுத்துகின்றன. 'He used to smoke' மற்றும் 'He would visit us every Sunday' இப்போது தொடராத பழக்கங்களை விவரிக்கின்றன. Simple past-ம் இதைச் செய்யலாம்: 'He smoked heavily in those days'. மூன்றுமே கடந்தகாலப் பழக்கங்கள்.",
  tl:"Kadandhagaalap pazhakkangal USED TO alladhu WOULD payanpaduththugindrana. 'He used to smoke' matrum 'He would visit us every Sunday' ippodhu thodaraadha pazhakkangalai vivarikkindrana."},
 {h:"Irregular verbs must be learnt by heart",
  en:"go-went-gone, write-wrote-written, take-took-taken, bring-brought-brought, catch-caught-caught, buy-bought-bought. SSC tests these constantly. V2 goes with the simple past; V3 goes with have, has, had and the passive.",
  ta:"ஒழுங்கற்ற வினைச்சொற்களை மனப்பாடம் செய்ய வேண்டும். go-went-gone, write-wrote-written, take-took-taken, bring-brought-brought, catch-caught-caught, buy-bought-bought. SSC இவற்றைத் தொடர்ந்து சோதிக்கிறது. V2 simple past-உடன் வரும்; V3 have, has, had மற்றும் passive-உடன் வரும்.",
  tl:"Ozhungatra vinaichorkalai manappaadam seyya vendum. go-went-gone, write-wrote-written, take-took-taken, bring-brought-brought. V2 simple past-udan varum; V3 have, has, had matrum passive-udan varum."}],

 s3:[
 {h:"A sealed box in the past",
  d:"   PAST                            NOW\n    ┌──────────┐\n    │ I MET him │  ← closed, finished, sealed\n    │ last Sunday│\n    └──────────┘\n         no link to today\n\n   Compare with the present perfect:\n   \"I HAVE MET him\"  ←── bridge reaches NOW"},
 {h:"DID takes the base form",
  d:"   Did he WENT?      ✘   two past markers\n   Did he GO?        ✔   one past marker\n\n   'DID' already means past.\n   So the main verb relaxes back to V1.\n\n   He did not GO.        ✔\n   She didn't COME.      ✔\n   Does he KNOW?         ✔  (does = present, still V1)"},
 {h:"V1 · V2 · V3",
  d:"   BASE(V1)   PAST(V2)    PARTICIPLE(V3)\n   ─────────────────────────────────────\n   go         went        gone\n   write      wrote       written\n   take       took        taken\n   bring      brought     brought\n   buy        bought      bought\n   see        saw         seen\n\n   V2 → simple past\n   V3 → after have/has/had, and in the passive"}],

 s4:{
 wrong:["\"'Did he went?' has two past forms, so it is extra correct.\" — Only one past marker is allowed.",
  "\"'I have met him last Sunday' is more polished.\" — A stated past time forbids the present perfect.",
  "\"V2 and V3 can be used interchangeably.\" — V2 stands alone; V3 needs have, has or had.",
  "\"'He didn't went' is emphatic.\" — After 'didn't', always use V1."],
 right:["A stated past time → V2, the simple past.",
  "After did, didn't or does → V1, the base form.",
  "Learn the irregular verb table by heart.",
  "V2 alone; V3 only after have, has, had or in the passive."]},

 s5:[
 {en:"Gandhi was born in 1869.",ta:"காந்தி 1869-ல் பிறந்தார்.",tl:"Gandhi 1869-l pirandhaar.",note:"A stated past year → simple past."},
 {en:"I met him last Sunday at the temple.",ta:"நான் கடந்த ஞாயிற்றுக்கிழமை கோயிலில் அவரைச் சந்தித்தேன்.",tl:"Naan kadandha gnaayitrukkizhamai koyilil avaraich sandhiththen.",note:"'Last Sunday' → simple past."},

 {en:"She did not go to school last week.",ta:"அவர் கடந்த வாரம் பள்ளிக்குச் செல்லவில்லை.",tl:"Avar kadandha vaaram pallikkuch sellavillai.",note:"After 'did not' use the base form GO."},
 {en:"He used to smoke heavily in those days.",ta:"அந்த நாட்களில் அவர் அதிகமாகப் புகைபிடிப்பார்.",tl:"Andha naatkalil avar adhigamaagap pugaipidippaar.",note:"'Used to' shows a discontinued past habit."}],

 s7:[
 "Gandhi ____ born in 1869.|was|Easy|A stated year → simple past.",
 "I ____ him last Sunday.|met|Easy|'Last Sunday' → simple past.",
 "Did he ____ the letter?|write|Easy|After 'did' use the base form.",
 "She did not ____ to school.|go|Easy|After 'did not' use the base form.",
 "He ____ the exam two days ago.|wrote|Medium|'Ago' → simple past.",
 "Did they ____ the match yesterday?|win|Medium|After 'did' use the base form.",
 "We ____ to Ooty last summer.|went|Medium|'Last summer' → simple past.",
 "He ____ to smoke in those days.|used|Medium|A discontinued past habit.",
 "Didn't she ____ you about it?|tell|Hard|After 'didn't' use the base form.",
 "The train ____ at six last evening.|arrived|Hard|A stated past time.",
 "He ____ his degree in 2020.|completed|Hard|A stated year.",
 "Does he ____ the answer?|know|Hard|After 'does' use the base form.",
 "They ____ this house in 2015.|bought|Expert|A stated year, irregular verb.",
 "He ____ visit us every Sunday then.|would|Expert|A past habit with 'would'.",
 "Did the officer ____ the file?|see|Expert|After 'did' use the base form."],

 s8:[
 "Did he wrote the letter yesterday?|Did he write the letter yesterday?|After 'did' use the base form.",
 "She did not went to school.|She did not go to school.|After 'did not' use the base form.",
 "Gandhi has been born in 1869.|Gandhi was born in 1869.|A stated year requires the simple past.",
 "I have met him last Sunday.|I met him last Sunday.|A stated past time forbids the present perfect.",
 "Didn't she told you about it?|Didn't she tell you about it?|After 'didn't' use the base form.",
 "Does he knows the answer?|Does he know the answer?|After 'does' use the base form.",
 "We have gone to Ooty last summer.|We went to Ooty last summer.|A stated past time requires the simple past.",
 "He use to smoke in those days.|He used to smoke in those days.|The correct form is 'used to'.",
 "Did they won the match yesterday?|Did they win the match yesterday?|After 'did' use the base form.",

 s9:[
 "Fill in the Blank|The famous poet ____ this collection of verses in the year nineteen fifty.|has written;wrote|1|A stated year requires the simple past.",

 s10:{
  en:"'Did he went?' is the classic error, and it happens because the sentence IS about the past, so students want to show the past twice. English allows only one past marker per verb group. The second trap is the irregular verb table — SSC deliberately picks verbs where V2 and V3 differ (go-went-gone, write-wrote-written) and offers V3 where V2 is needed.",
  ta:"'Did he went?' என்பது பாரம்பரியமான தவறு, அது நிகழ்கிறது ஏனெனில் வாக்கியம் கடந்தகாலத்தைப் பற்றியது, எனவே மாணவர்கள் கடந்தகாலத்தை இரண்டு முறை காட்ட விரும்புகிறார்கள். ஆங்கிலம் ஒரு வினைச்சொல் குழுவுக்கு ஒரே ஒரு கடந்தகாலக் குறியீட்டை மட்டுமே அனுமதிக்கிறது. இரண்டாவது பொறி ஒழுங்கற்ற வினைச்சொல் அட்டவணை — SSC வேண்டுமென்றே V2-ம் V3-ம் வேறுபடும் வினைச்சொற்களைத் தேர்ந்தெடுத்து, V2 தேவைப்படும் இடத்தில் V3-ஐத் தருகிறது.",
  tl:"'Did he went?' enbadhu paaramparyamaana thavaru, adhu nigazhgiradhu yenenil vaakkiyam kadandhagaalaththaip patriyadhu. Aangilam oru vinaichol kuzhuvukku ore oru kadandhagaalak kuriyeettai mattume anumadhikkiradhu."},

 s11:{
  en:"ONE PAST MARKER PER VERB GROUP. If 'did' is there, the main verb goes back to V1.",
  ta:"ஒரு வினைச்சொல் குழுவுக்கு ஒரு கடந்தகாலக் குறியீடு. 'Did' இருந்தால், முதன்மை வினைச்சொல் V1-க்குத் திரும்பும்.",
  tl:"Oru vinaichol kuzhuvukku oru kadandhagaalak kuriyeedu. 'Did' irundhaal, mudhanmai vinaichol V1-kkuth thirumbum.",
  vis:"      THE ONE-MARKER RULE\n\n   He WENT to school.        ✔  one past marker\n   Did he GO to school?      ✔  one past marker (did)\n   Did he WENT to school?    ✘  two markers\n\n   ⚠ AFTER THESE, ALWAYS V1:\n     did · didn't · does · doesn't · do · don't\n\n   THE IRREGULAR TABLE — learn it cold:\n     go   → went   → gone\n     write→ wrote  → written\n     take → took   → taken\n     see  → saw    → seen\n     buy  → bought → bought\n\n   V2 stands ALONE.\n   V3 needs have · has · had · was/were."},

 s12:[
 "Gandhi ____ born in 1869.|was;has been|0",
 "I ____ him last Sunday.|have met;met|1",
 "Did he ____ the letter?|wrote;write|1",
 "She did not ____ to school.|went;go|1",
 "He ____ the exam two days ago.|has written;wrote|1",
 "Did they ____ the match?|won;win|1",
 "We ____ to Ooty last summer.|have gone;went|1",
 "He ____ to smoke in those days.|use;used|1",
 "Didn't she ____ you about it?|told;tell|1",
 "The train ____ at six last evening.|has arrived;arrived|1",
 "He ____ his degree in 2020.|has completed;completed|1",
 "Does he ____ the answer?|knows;know|1",
 "They ____ this house in 2015.|have bought;bought|1",
 "He ____ visit us every Sunday then.|will;would|1",
 "Did the officer ____ the file?|saw;see|1",
 "She ____ the letter last night.|has posted;posted|1",
 "Didn't he ____ the money back?|gave;give|1",
 "We ____ them at the fair last month.|have met;met|1",
 "Does she ____ in this office?|works;work|1",
 "He ____ me the truth yesterday.|has told;told|1"],

 s13:[
 "He ____ to Delhi last week, and I ____ not seen him since then.|went-have;has gone-have;went-had|0|'Last week' → WENT. 'Since then' → HAVE not seen (Rule 52 and 53).",
 "Did the officer ____ the file that ____ missing since Monday?|saw-has been;see-has been;see-had been|1|After 'did' use V1 → SEE. 'Since Monday' → HAS BEEN.",
 "She ____ to visit us every Sunday, but she ____ not come here for two years.|used-has;use-had;used-had|0|A past habit → USED to. 'For two years' → HAS not come.",
 "Gandhi ____ born in 1869 and ____ that non-violence ____ the greatest weapon.|was-said-is;has been-said-was;was-said-was|0|A stated year → WAS. A universal belief stated as a truth stays present → IS (Rule 56).",
 "Didn't he ____ you that the train ____ already left before you ____ the station?|told-has-reached;tell-had-reached;tell-had-had reached|1|After 'didn't' use V1 → TELL. The earlier action → HAD left (Rule 54)."],

 s14:{
  rule:"Use the simple past for a finished action at a stated past time, and the base form V1 after did, didn't and does.",
  formula:"STATED PAST TIME → V2\nAFTER did / didn't / does / doesn't → V1\nV2 alone · V3 only after have, has, had or in the passive",
  memory:"One past marker per verb group. 'Did' already means past, so the verb relaxes to V1.",
  ta:"ஒரு வினைச்சொல் குழுவுக்கு ஒரு past marker. 'Did' இருந்தா verb V1-க்கு திரும்பும்.",
  tl:"Oru vinaichol kuzhuvukku oru past marker. 'Did' irundhaa verb V1-kku thirumbum.",
  mistake:"Writing 'Did he went?' and confusing V2 with V3 in irregular verbs.",
  exam:"SSC CGL / CHSL / MTS and RRB — 'did + V2' is one of the most repeated planted errors."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு பகுதி இருக்கு. முதல் பகுதி எளிது — கடந்த காலத்துல குறிப்பிட்ட நேரத்துல முடிஞ்ச செயலுக்கு V2. 'Gandhi WAS BORN in 1869.' '1869' அப்படிங்கிற குறிப்பிட்ட வருஷம் இருக்கு, செயல் முடிஞ்சது. அதனால simple past.",
  tl:"Indha rule-la rendu paguthi irukku. Mudhal paguthi eladhu — kadandha kaalaththula kurippitta neraththula mudinja seyalukku V2. 'Gandhi WAS BORN in 1869.'"},
 {ta:"ரெண்டாவது பகுதிதான் SSC-ஓட உண்மையான களம் — DID + V1. 'Did he went?' அப்படின்னு நிறைய பேரு எழுதுவாங்க. ஏன்? ஏன்னா வாக்கியம் கடந்தகாலத்தைப் பத்தி, அதனால ரெண்டு இடத்துலயும் கடந்தகாலம் காட்டணும்னு நினைக்கிறோம்.",
  tl:"Randaavadhu paguthidhaan SSC-oda unmaiyaana kalam — DID + V1. 'Did he went?' appadinnu neraiya peru ezhudhuvaanga. Yennaa vaakkiyam kadandhagaalaththaip paththi, adhanaala rendu idaththulayum kadandhagaalam kaattanumnu ninaikkirom."},
 {ta:"ஆனா ஆங்கிலம் ஒரு வினைச்சொல் குழுவுக்கு ஒரே ஒரு கடந்தகாலக் குறியீடுதான் அனுமதிக்குது. 'Did' அப்படிங்கிறதே கடந்தகாலம். அது ஏற்கனவே வேலையை செஞ்சுடுச்சு. அதனால main verb ஓய்வெடுத்து அடிப்படை வடிவத்துக்கு திரும்பிடும். 'Did he GO?' — சரி.",
  tl:"Aanaa Aangilam oru vinaichol kuzhuvukku ore oru kadandhagaalak kuriyeedudhaan anumadhikkudhu. 'Did' appadingiradhe kadandhagaalam. Adhanaala main verb oyveduththu adippadai vadivaththukku thirumbidum. 'Did he GO?' — sari."},
 {ta:"இதே விதி 'did not', 'didn't', 'does', 'doesn't', 'do', 'don't' எல்லாத்துக்கும் பொருந்தும். 'She did not GO', 'He didn't COME', 'Does he KNOW?', 'She doesn't WORK here'. எல்லாத்துக்கும் V1.",
  tl:"Idhe vidhi 'did not', 'didn't', 'does', 'doesn't', 'do', 'don't' ellaaththukkum porundhum. 'She did not GO', 'He didn't COME', 'Does he KNOW?'. Ellaaththukkum V1."},
 {ta:"இப்போ மூணாவது பொறி — ஒழுங்கற்ற வினைச்சொல். go-went-gone, write-wrote-written, take-took-taken, see-saw-seen, buy-bought-bought. SSC வேணும்னே V2-ம் V3-ம் வேற வேறா இருக்கிற வினைச்சொல்லை தேர்ந்தெடுக்கும். 'I have wrote' — தப்பு, 'I have written' சரி. 'He gone' — தப்பு, 'He went' சரி.",
  tl:"Ippo moonaavadhu pori — ozhungatra vinaichol. go-went-gone, write-wrote-written, take-took-taken, see-saw-seen. SSC venumne V2-um V3-um veru veraa irukkira vinaicholai therndhedukkum."},
 {ta:"ஒரு எளிய விதி நினைவு வெச்சுக்கோங்க: V2 தனியா நிக்கும். V3-க்கு எப்பவும் have, has, had, was, were-ல ஒண்ணு துணையா வேணும். 'He wrote' — V2, தனியா. 'He has written' — V3, has-ஓட. 'It was written' — V3, was-ஓட passive-ல. இந்த ஒரு விதி உங்களை நிறைய தப்புலருந்து காப்பாத்தும்.",
  tl:"Oru eliya vidhi ninaivu vechukkonga: V2 thaniyaa nikkum. V3-kku eppavum have, has, had, was, were-la onnu thunaiyaa venum. 'He wrote' — V2, thaniyaa. 'He has written' — V3, has-oda. 'It was written' — V3, was-oda passive-la."}]},

/* ========== RULE 58 ========== */
{n:58,rc:"TEN-08",d:"Medium",t:"Present Continuous for a Fixed Near-Future Plan",
 tam:"திட்டமிடப்பட்ட எதிர்கால ஏற்பாட்டிற்கு present continuous",
 s1:{en:"Use the PRESENT CONTINUOUS (am/is/are + V-ing) for a PLANNED, ARRANGED future event — something already fixed. A public timetable, however, takes the simple present (Rule 51).",
  ta:"திட்டமிடப்பட்ட, ஏற்பாடு செய்யப்பட்ட எதிர்கால நிகழ்வுக்கு — ஏற்கனவே நிர்ணயிக்கப்பட்ட ஒன்றுக்கு — PRESENT CONTINUOUS (am/is/are + V-ing) பயன்படுத்தவும். ஆனால் ஒரு பொது கால அட்டவணை simple present எடுக்கும் (Rule 51).",
  tl:"Thittamidappatta, erpaadu seyyappatta edhirkaala nigazhvukku — erkanave nirnayikkappatta ondrukku — PRESENT CONTINUOUS (am/is/are + V-ing) payanpaduththavum.",
  formula:"PERSONAL ARRANGEMENT  →  am/is/are + V-ing\n  I AM MEETING the collector tomorrow.\n  We ARE LEAVING for Delhi next week.\n  She IS GETTING MARRIED in June.\n\nPUBLIC TIMETABLE  →  SIMPLE PRESENT\n  The train LEAVES at six tomorrow.\n  The film STARTS at seven."},

 s2:[
 {h:"The arrangement already exists NOW",
  en:"'I am meeting the collector tomorrow' — the meeting happens tomorrow, but the ARRANGEMENT exists today. The appointment is already fixed. That present reality is why English uses a present tense form.",
  ta:"ஏற்பாடு இப்போதே இருக்கிறது. 'I am meeting the collector tomorrow' — சந்திப்பு நாளை நடக்கிறது, ஆனால் ஏற்பாடு இன்றே இருக்கிறது. சந்திப்பு ஏற்கனவே நிர்ணயிக்கப்பட்டுவிட்டது. அந்த நிகழ்கால உண்மைதான் ஆங்கிலம் நிகழ்கால வடிவத்தைப் பயன்படுத்தக் காரணம்.",
  tl:"Erpaadu ippodhe irukkiradhu. 'I am meeting the collector tomorrow' — sandhippu naalai nadakkiradhu, aanaal erpaadu indre irukkiradhu. Andha nigazhgaala unmaidhaan Aangilam nigazhgaala vadivaththaip payanpaduththak kaaranam."},
 {h:"Personal plan versus public schedule",
  en:"'I am flying to Delhi tomorrow' — my personal arrangement, so present continuous. 'The flight leaves at 6 a.m.' — the airline's fixed schedule, so simple present. Ask whose plan it is.",
  ta:"தனிப்பட்ட திட்டம் மற்றும் பொது அட்டவணை. 'I am flying to Delhi tomorrow' — என்னுடைய தனிப்பட்ட ஏற்பாடு, எனவே present continuous. 'The flight leaves at 6 a.m.' — விமான நிறுவனத்தின் நிலையான அட்டவணை, எனவே simple present. இது யாருடைய திட்டம் என்று கேளுங்கள்.",
  tl:"Thanippatta thittam matrum podhu attavanai. 'I am flying to Delhi tomorrow' — ennudaiya thanippatta erpaadu, enave present continuous. 'The flight leaves at 6 a.m.' — nilaiyaana attavanai, enave simple present."},
 {h:"GOING TO shows intention, not arrangement",
  en:"'I am going to buy a car' means I intend to. 'I am buying a car tomorrow' means the deal is already fixed. 'Going to' expresses plan or prediction; the plain continuous expresses a settled arrangement.",
  ta:"GOING TO எண்ணத்தைக் காட்டுகிறது, ஏற்பாட்டை அல்ல. 'I am going to buy a car' என்றால் நான் வாங்க எண்ணுகிறேன். 'I am buying a car tomorrow' என்றால் ஒப்பந்தம் ஏற்கனவே நிர்ணயிக்கப்பட்டுவிட்டது. 'Going to' திட்டத்தையோ கணிப்பையோ வெளிப்படுத்துகிறது; வெறும் continuous ஒரு உறுதியான ஏற்பாட்டை வெளிப்படுத்துகிறது.",
  tl:"GOING TO ennaththaik kaattugiradhu, erpaattai alla. 'I am going to buy a car' endraal naan vaanga ennugiren. 'I am buying a car tomorrow' endraal oppandham erkanave nirnayikkappattuvittadhu."},
 {h:"A future time word is usually present",
  en:"tomorrow, next week, next month, this evening, on Sunday, at five o'clock. These signal that the continuous form refers to the future, not to right now.",
  ta:"பொதுவாக ஒரு எதிர்கால நேரச் சொல் இருக்கும்: tomorrow, next week, next month, this evening, on Sunday, at five o'clock. இவை continuous வடிவம் இப்போதை அல்ல, எதிர்காலத்தைக் குறிக்கிறது என்று சுட்டுகின்றன.",
  tl:"Podhuvaaga oru edhirkaala nerach sol irukkum: tomorrow, next week, next month, this evening, on Sunday. Ivai continuous vadivam ippodhai alla, edhirkaalaththaik kurikkiradhu endru suttugindrana."}],

 s3:[
 {h:"The arrangement exists today",
  d:"   TODAY                    TOMORROW\n     │                          │\n  📋 appointment            🤝 meeting\n     already fixed            happens\n\n   Because the ARRANGEMENT is present,\n   English uses a PRESENT form:\n\n   I AM MEETING the collector tomorrow."},
 {h:"Whose plan is it?",
  d:"   MY personal arrangement  →  present continuous\n     I am flying to Delhi tomorrow.\n     We are leaving on Sunday.\n     She is getting married in June.\n\n   A PUBLIC timetable        →  simple present\n     The flight leaves at 6 a.m.\n     The train arrives at nine.\n     The film starts at seven."},
 {h:"Three future forms",
  d:"   WILL          →  a decision made NOW\n     I will help you.  (deciding as I speak)\n\n   GOING TO      →  intention or prediction\n     I am going to buy a car.  (I intend to)\n\n   PRESENT CONT. →  a fixed arrangement\n     I am buying a car tomorrow. (already settled)"}],

 s4:{
 wrong:["\"The event is in the future, so it must take 'will'.\" — A fixed arrangement takes the present continuous.",
  "\"'The train is leaving at six tomorrow' is correct for a schedule.\" — A public timetable takes the simple present.",
  "\"Present continuous can only describe what is happening now.\" — With a future time word it describes an arrangement.",
  "\"'Going to' and the plain continuous mean exactly the same.\" — One is intention, the other is a settled plan."],
 right:["Ask: is this already arranged and fixed?",
  "Fixed personal arrangement → am/is/are + V-ing.",
  "Public timetable → simple present.",
  "Look for tomorrow, next week, on Sunday as future markers."]},

 s10:{
  en:"The exam gives you a sentence with a future time word and offers 'will' as the natural-looking answer. But if the sentence signals that the plan is already SETTLED — tickets booked, invitations printed, appointment fixed — the present continuous is required. The reverse trap is the timetable: a train or flight schedule takes the simple present, not the continuous.",
  ta:"தேர்வு உங்களுக்கு எதிர்கால நேரச் சொல்லுடன் ஒரு வாக்கியத்தைத் தந்து, இயற்கையாகத் தோன்றும் விடையாக 'will'-ஐத் தரும். ஆனால் திட்டம் ஏற்கனவே உறுதி செய்யப்பட்டுவிட்டது என்று வாக்கியம் சுட்டினால் — டிக்கெட் பதிவு செய்யப்பட்டது, அழைப்பிதழ் அச்சிடப்பட்டது, சந்திப்பு நிர்ணயிக்கப்பட்டது — present continuous தேவை. தலைகீழ் பொறி கால அட்டவணை: ஒரு ரயில் அல்லது விமான அட்டவணை simple present எடுக்கும், continuous அல்ல.",
  tl:"Thervu ungalukku edhirkaala nerach solludan oru vaakkiyaththaith thandhu, iyarkaiyaagath thondrum vidaiyaaga 'will'-aith tharum. Aanaal thittam erkanave urudhi seyyappattuvittadhu endru vaakkiyam suttinaal, present continuous thevai."},

 s11:{
  en:"IS IT ALREADY ARRANGED? Yes → present continuous. Is it a public timetable? → simple present.",
  ta:"அது ஏற்கனவே ஏற்பாடு செய்யப்பட்டுவிட்டதா? ஆம் → present continuous. அது பொது கால அட்டவணையா? → simple present.",
  tl:"Adhu erkanave erpaadu seyyappattuvittadhaa? Aam → present continuous. Adhu podhu kaala attavanaiyaa? → simple present.",
  vis:"      THE THREE FUTURE FORMS\n\n   📋 ALREADY ARRANGED (my plan)\n      am / is / are + V-ing\n      I am meeting him tomorrow.\n      Tickets booked · date fixed · invites sent\n\n   🚆 PUBLIC TIMETABLE\n      simple present\n      The train leaves at six.\n      The film starts at seven.\n\n   💭 INTENTION or PREDICTION\n      going to\n      I am going to buy a car someday.\n\n   ⚡ DECISION MADE RIGHT NOW\n      will\n      The phone is ringing — I will answer it."},

 s13:[
 "I ____ the collector tomorrow, but the train ____ at six, so I ____ leave early.|am meeting-leaves-will;will meet-is leaving-will;am meeting-is leaving-will|0|A fixed appointment → AM MEETING. A timetable → LEAVES. A decision → WILL.",
 "We ____ for Delhi next week and ____ there until the conference ____ over.|are leaving-will stay-is;will leave-are staying-will be;are leaving-will stay-will be|0|An arrangement → ARE LEAVING. A plan → WILL STAY. A time clause bans 'will' → IS (Rule 55).",

 s14:{
  rule:"Use the present continuous for a fixed, arranged future event, and the simple present for a public timetable.",
  formula:"FIXED PERSONAL ARRANGEMENT → am/is/are + V-ing\nPUBLIC TIMETABLE → simple present\nINTENTION → going to | DECISION NOW → will",
  memory:"Already arranged? Present continuous. Public schedule? Simple present.",
  ta:"ஏற்கனவே ஏற்பாடு ஆயிடுச்சா? Present continuous. பொது அட்டவணையா? Simple present.",
  tl:"Erkanave erpaadu aayiduchaa? Present continuous. Podhu attavanaiyaa? Simple present.",
  mistake:"Using 'will' for an already settled plan, and the continuous for a public timetable.",
  exam:"SSC CGL / CHSL and Bank — often paired with Rule 51 in the same question set."},

 s15:[
 {ta:"இந்த rule கொஞ்சம் வித்தியாசமானது. நாம பொதுவா 'எதிர்காலம்-ன்னா will' அப்படின்னு நினைப்போம். ஆனா ஆங்கிலத்துல எதிர்காலத்தை சொல்ல நாலு வழி இருக்கு, ஒவ்வொண்ணுக்கும் ஒரு அர்த்தம் இருக்கு.",
  tl:"Indha rule konjam viththiyaasamaanadhu. Naama podhuvaa 'edhirkaalam-nnaa will' appadinnu ninaippom. Aanaa Aangilaththula edhirkaalaththai solla naalu vazhi irukku, ovvonnukkum oru arththam irukku."},
 {ta:"முதல்ல present continuous. 'I am meeting the collector tomorrow.' சந்திப்பு நாளைக்கு, ஆனா வினைச்சொல் நிகழ்காலம். ஏன்? ஏன்னா ஏற்பாடு இன்னைக்கே இருக்கு! Appointment fix ஆயிடுச்சு. அந்த ஏற்பாடு இப்போ இருக்கிறதால நிகழ்கால வடிவம்.",
  tl:"Mudhalla present continuous. 'I am meeting the collector tomorrow.' Sandhippu naalaikku, aanaa vinaichol nigazhgaalam. Yennaa erpaadu innaikke irukku! Appointment fix aayiduchu."},
 {ta:"ஒரு படம் மனசுல வெச்சுக்கோங்க. உங்க diary-ல நாளைக்கு ஒரு entry இருக்கு. அந்த entry இன்னைக்கே இருக்கு. அதனால நிகழ்காலம். 'We are leaving next week' — டிக்கெட் புக் ஆயிடுச்சு. 'She is getting married in June' — தேதி நிச்சயம் ஆயிடுச்சு. எல்லாமே ஏற்கனவே fix.",
  tl:"Oru padam manasula vechukkonga. Unga diary-la naalaikku oru entry irukku. Andha entry innaikke irukku. Adhanaala nigazhgaalam. 'We are leaving next week' — ticket book aayiduchu."},
 {ta:"இப்போ ஒரு முக்கியமான வித்தியாசம் — யாருடைய திட்டம்? உங்களுடைய தனிப்பட்ட ஏற்பாடா, இல்ல பொது அட்டவணையா? 'I am flying to Delhi tomorrow' — என்னோட ஏற்பாடு, present continuous. ஆனா 'The flight leaves at 6 a.m.' — விமான நிறுவனத்தோட அட்டவணை, simple present. இது Rule 51-ல படிச்சோம்.",
  tl:"Ippo oru mukkiyamaana viththiyaasam — yaarudaiya thittam? Ungaludaiya thanippatta erpaadaa, illa podhu attavanaiyaa? 'I am flying to Delhi tomorrow' — ennoda erpaadu. Aanaa 'The flight leaves at 6 a.m.' — attavanai, simple present."},
 {ta:"மத்த ரெண்டு வழியும் சொல்லிடுறேன். 'Going to' — எண்ணம் அல்லது கணிப்பு. 'I am going to buy a car' — வாங்கணும்னு நினைக்கிறேன், ஆனா இன்னும் fix ஆகல. 'Will' — இப்போ எடுக்கிற முடிவு. Phone அடிக்குது, 'I will answer it' — இப்பதான் முடிவு பண்ணுறேன்.",
  tl:"Maththa rendu vazhiyum sollidaren. 'Going to' — ennam alladhu kanippu. 'I am going to buy a car' — vaanganumnu ninaikkiren, aanaa innum fix aagala. 'Will' — ippo edukkira mudivu."},
 {ta:"கடைசியா SSC-ஓட தந்திரம். அவங்க வாக்கியத்துல ஒரு clue கொடுப்பாங்க — 'as our tickets are already booked', 'the invitations have been printed', 'the appointment is fixed'. இந்த மாதிரி clue இருந்தா, திட்டம் ஏற்கனவே உறுதி. அப்படின்னா 'will' இல்ல, present continuous. Clue-ஐ கவனமா படிங்க.",
  tl:"Kadaisiyaa SSC-oda thandhiram. Avanga vaakkiyaththula oru clue koduppaanga — 'as our tickets are already booked', 'the invitations have been printed'. Indha maadhiri clue irundhaa, thittam erkanave urudhi. Appadinnaa 'will' illa, present continuous."}]},

/* ========== RULE 59 ========== */
{n:59,rc:"TEN-09",d:"Hard",t:"Stative Verbs are NOT used in the Continuous Form",
 tam:"Know, Believe, Love, Own, Belong — இவை -ing வடிவில் வராது",
 s1:{en:"Verbs of PERCEPTION, EMOTION, THOUGHT and POSSESSION are STATIVE — they describe a state, not an action in progress. They are not used in the continuous form: know, believe, understand, love, hate, see, hear, own, belong, contain, seem, resemble, need, prefer, want, remember, forget.",
  ta:"உணர்வு, மனநிலை, சிந்தனை, உடைமை ஆகியவற்றைக் குறிக்கும் வினைச்சொற்கள் STATIVE — அவை ஒரு நிலையை விவரிக்கின்றன, நடந்து கொண்டிருக்கும் செயலை அல்ல. இவை continuous வடிவில் பயன்படுத்தப்படுவதில்லை: know, believe, understand, love, hate, see, hear, own, belong, contain, seem, resemble, need, prefer, want, remember, forget.",
  tl:"Unarvu, mananilai, sindhanai, udaimai aagiyavatraik kurikkum vinaichorkal STATIVE — avai oru nilaiyai vivarikkindrana. Ivai continuous vadivil payanpaduththappaduvadhillai.",
  formula:"STATIVE VERBS  →  NEVER -ing\n\n  I KNOW the answer.        ✔\n  I AM KNOWING the answer.  ✘\n\n  She OWNS two houses.      ✔\n  This box CONTAINS books.  ✔\n  He SEEMS tired.           ✔\n  I UNDERSTAND your point.  ✔"},

 s2:[
 {h:"A state has no beginning or end you can watch",
  en:"You can WATCH someone running or eating — those are actions in progress. You cannot watch someone 'knowing' or 'owning'. A state simply IS. Since there is nothing in progress, there is nothing for -ing to describe.",
  ta:"ஒரு நிலைக்கு நீங்கள் பார்க்கக்கூடிய தொடக்கமோ முடிவோ இல்லை. ஒருவர் ஓடுவதையோ சாப்பிடுவதையோ நீங்கள் பார்க்க முடியும் — அவை நடந்து கொண்டிருக்கும் செயல்கள். ஆனால் ஒருவர் 'தெரிந்திருப்பதை' அல்லது 'சொந்தமாக வைத்திருப்பதை' பார்க்க முடியாது. ஒரு நிலை வெறுமனே இருக்கிறது. நடந்து கொண்டிருப்பது எதுவும் இல்லாததால், -ing விவரிக்க எதுவும் இல்லை.",
  tl:"Oru nilaikku neengal paarkkakkoodiya thodakkamo mudivo illai. Oruvar oduvadhaiyo saappiduvadhaiyo neengal paarkka mudiyum. Aanaal oruvar 'therindhiruppadhai' paarkka mudiyaadhu. Oru nilai verumane irukkiradhu."},
 {h:"The five families",
  en:"PERCEPTION: see, hear, smell, taste, feel, notice. EMOTION: love, hate, like, dislike, prefer, want, wish. THOUGHT: know, believe, understand, remember, forget, think, doubt, suppose. POSSESSION: have, own, possess, belong, contain, include. APPEARANCE: seem, appear, look, resemble.",
  ta:"ஐந்து குடும்பங்கள். உணர்வு: see, hear, smell, taste, feel, notice. மனநிலை: love, hate, like, dislike, prefer, want, wish. சிந்தனை: know, believe, understand, remember, forget, think, doubt. உடைமை: have, own, possess, belong, contain, include. தோற்றம்: seem, appear, look, resemble.",
  tl:"Aindhu kudumbangal. Unarvu: see, hear, smell, taste, feel. Mananilai: love, hate, like, prefer, want. Sindhanai: know, believe, understand, remember, forget. Udaimai: have, own, possess, belong, contain. Thotram: seem, appear, look, resemble."},
 {h:"Some verbs change meaning and then allow -ing",
  en:"'I see the board' (perception) but 'I am seeing the doctor' (meeting). 'I think it is true' (opinion) but 'I am thinking about it' (considering). 'He has a car' (possession) but 'He is having dinner' (eating). The meaning decides.",
  ta:"சில வினைச்சொற்கள் பொருள் மாறி -ing அனுமதிக்கின்றன. 'I see the board' (உணர்வு) ஆனால் 'I am seeing the doctor' (சந்திப்பு). 'I think it is true' (கருத்து) ஆனால் 'I am thinking about it' (பரிசீலிப்பது). 'He has a car' (உடைமை) ஆனால் 'He is having dinner' (சாப்பிடுவது). பொருள்தான் தீர்மானிக்கிறது.",
  tl:"Sila vinaichorkal porul maari -ing anumadhikkindrana. 'I see the board' (unarvu) aanaal 'I am seeing the doctor' (sandhippu). 'He has a car' (udaimai) aanaal 'He is having dinner' (saappiduvadhu). Porul-dhaan theermaanikkiradhu."},
 {h:"'Am understanding' is the classic Indian error",
  en:"Indian English speakers say 'I am not understanding' and 'I am knowing' constantly. Both are impossible in standard English. The correct forms are 'I do not understand' and 'I know'.",
  ta:"'Am understanding' என்பது பாரம்பரியமான இந்தியத் தவறு. இந்திய ஆங்கிலப் பேச்சாளர்கள் 'I am not understanding' மற்றும் 'I am knowing' என்று தொடர்ந்து சொல்கிறார்கள். இரண்டுமே தரநிலை ஆங்கிலத்தில் சாத்தியமில்லை. சரியான வடிவங்கள் 'I do not understand' மற்றும் 'I know'.",
  tl:"'Am understanding' enbadhu paaramparyamaana Indhiyath thavaru. Indhiya Aangilap pechaalargal 'I am not understanding' matrum 'I am knowing' endru thodarndhu solgiraargal. Irandume tharanilai Aangilaththil saadhiyamillai."}],

 s3:[
 {h:"Can you watch it happening?",
  d:"   👀 CAN WATCH  →  action  →  -ing allowed\n      running · eating · writing · playing\n      He IS RUNNING.  ✔\n\n   🚫 CANNOT WATCH  →  state  →  no -ing\n      knowing · owning · believing · belonging\n      He IS KNOWING.  ✘\n      He KNOWS.       ✔"},
 {h:"The five stative families",
  d:"  👁️ PERCEPTION : see · hear · smell · taste · feel\n  ❤️ EMOTION    : love · hate · like · prefer · want\n  🧠 THOUGHT    : know · believe · understand\n                  remember · forget · doubt\n  🏠 POSSESSION : have · own · possess · belong\n                  contain · include\n  👤 APPEARANCE : seem · appear · look · resemble"},
 {h:"Same verb, two meanings",
  d:"   SEE\n     I SEE the board.          (perception)  no -ing\n     I AM SEEING the doctor.   (meeting)     -ing ✔\n\n   THINK\n     I THINK it is true.       (opinion)     no -ing\n     I AM THINKING about it.   (considering) -ing ✔\n\n   HAVE\n     He HAS a car.             (possession)  no -ing\n     He IS HAVING dinner.      (eating)      -ing ✔"}],

 s4:{
 wrong:["\"'I am not understanding' shows it is happening right now.\" — Understanding is a state, not an action.",
  "\"Any verb can take -ing if the action is continuing.\" — Stative verbs describe states, not actions.",
  "\"'He is having a car' is more emphatic.\" — 'Have' meaning possession takes no -ing.",
  "\"'I am knowing him for ten years' shows duration.\" — It must be 'I have known him for ten years'."],
 right:["Ask: can I actually WATCH this happening? If not, it is stative.",
  "Memorise the five families: perception, emotion, thought, possession, appearance.",
  "Check whether the verb has shifted to an action meaning (seeing a doctor, having dinner).",
  "Replace 'am understanding' with 'understand'."]},

 s5:[
 {en:"I know the answer to this question.",ta:"இந்தக் கேள்விக்கான பதில் எனக்குத் தெரியும்.",tl:"Indhak kelvikkaana padhil enakkuth theriyum.",note:"'Know' is stative → no -ing."},
 {en:"She owns two houses in the city.",ta:"நகரத்தில் அவருக்கு இரண்டு வீடுகள் சொந்தமாக உள்ளன.",tl:"Nagaraththil avarukku irandu veedugal sondhamaaga ullana.",note:"'Own' is stative → no -ing."},

 {en:"I am seeing the doctor this evening.",ta:"நான் இன்று மாலை மருத்துவரைச் சந்திக்கிறேன்.",tl:"Naan indru maalai maruththuvaraich sandhikkiren.",note:"Here 'see' means 'meet', an action → -ing is allowed."},
 {en:"He is having dinner with his family.",ta:"அவர் தன் குடும்பத்துடன் இரவு உணவு சாப்பிட்டுக் கொண்டிருக்கிறார்.",tl:"Avar than kudumbaththudan iravu unavu saappittuk kondirukkiraar.",note:"Here 'have' means 'eat', an action → -ing is allowed."}],

 s7:[
 "I ____ the answer.|know|Easy|'Know' is stative.",
 "She ____ two houses.|owns|Easy|'Own' is stative.",
 "This box ____ old letters.|contains|Easy|'Contain' is stative.",
 "He ____ very tired today.|seems|Easy|'Seem' is stative.",
 "I ____ your point clearly.|understand|Medium|'Understand' is stative.",
 "This book ____ to my brother.|belongs|Medium|'Belong' is stative.",
 "She ____ her mother closely.|resembles|Medium|'Resemble' is stative.",
 "I ____ coffee to tea.|prefer|Medium|'Prefer' is stative.",
 "I ____ the doctor this evening.|am seeing|Hard|Here 'see' means 'meet' → -ing allowed.",
 "He ____ dinner with us tonight.|is having|Hard|Here 'have' means 'eat' → -ing allowed.",
 "I ____ about your proposal now.|am thinking|Hard|Here 'think' means 'consider' → -ing allowed.",
 "She ____ him for ten years.|has known|Hard|'Know' is stative, so the perfect is used.",
 "The soup ____ delicious.|tastes|Expert|'Taste' as perception is stative.",
 "The chef ____ the soup right now.|is tasting|Expert|Here 'taste' is a deliberate action → -ing allowed.",
 "I ____ what you mean at last.|understand|Expert|'Understand' is stative."],

 s8:[
 "I am knowing the answer.|I know the answer.|'Know' is a stative verb.",
 "She is owning two houses.|She owns two houses.|'Own' is a stative verb.",
 "This box is containing old letters.|This box contains old letters.|'Contain' is a stative verb.",
 "I am not understanding your point.|I do not understand your point.|'Understand' is a stative verb.",
 "This book is belonging to my brother.|This book belongs to my brother.|'Belong' is a stative verb.",
 "She is resembling her mother closely.|She resembles her mother closely.|'Resemble' is a stative verb.",
 "I am preferring coffee to tea.|I prefer coffee to tea.|'Prefer' is a stative verb.",
 "He is seeming very tired today.|He seems very tired today.|'Seem' is a stative verb.",
 "I am knowing him for ten years.|I have known him for ten years.|A stative verb takes the perfect, not the continuous.",
 "He is having a big car and a bungalow.|He has a big car and a bungalow.|'Have' meaning possession takes no -ing."],

 s10:{
  en:"'I am not understanding' is possibly the most recognisable marker of Indian English. It is said in offices, classrooms and on television every day. The exam plants it because it feels completely natural. The second trap is the meaning shift — 'I am seeing the doctor' and 'He is having dinner' ARE correct, so you cannot simply ban -ing on these verbs. You must check the meaning.",
  ta:"'I am not understanding' என்பது இந்திய ஆங்கிலத்தின் மிகவும் அடையாளம் காணக்கூடிய குறியீடாக இருக்கலாம். அது அலுவலகங்களிலும், வகுப்பறைகளிலும், தொலைக்காட்சியிலும் தினமும் சொல்லப்படுகிறது. அது முற்றிலும் இயற்கையாகத் தோன்றுவதால் தேர்வு அதை நடுகிறது. இரண்டாவது பொறி பொருள் மாற்றம் — 'I am seeing the doctor' மற்றும் 'He is having dinner' சரி, எனவே இந்த வினைச்சொற்களில் -ing-ஐ வெறுமனே தடை செய்ய முடியாது. பொருளைச் சரிபார்க்க வேண்டும்.",
  tl:"'I am not understanding' enbadhu Indhiya Aangilaththin migavum adaiyaalam kaanakkoodiya kuriyeedaaga irukkalaam. Irandaavadhu pori porul maatram — 'I am seeing the doctor' matrum 'He is having dinner' sari. Porulaich saripaarkka vendum."},

 s11:{
  en:"CAN YOU WATCH IT HAPPENING? If not, it is a state — no -ing.",
  ta:"அது நடப்பதை நீங்கள் பார்க்க முடியுமா? முடியாவிட்டால், அது ஒரு நிலை — -ing இல்லை.",
  tl:"Adhu nadappadhai neengal paarkka mudiyumaa? Mudiyaavittaal, adhu oru nilai — -ing illai.",
  vis:"      THE CAMERA TEST\n\n   Point a camera at the person.\n   Can you FILM the action happening?\n\n   ✅ FILMABLE  →  action  →  -ing OK\n      running · eating · writing · reading\n\n   ❌ NOT FILMABLE  →  state  →  NO -ing\n      knowing · owning · believing\n      understanding · belonging · resembling\n\n   ⚠ WATCH FOR MEANING SHIFTS:\n     see  = perceive (no -ing) | meet (-ing OK)\n     have = possess  (no -ing) | eat  (-ing OK)\n     think= opinion  (no -ing) | consider (-ing OK)\n     taste= flavour  (no -ing) | sample (-ing OK)\n\n   ⚠ THE INDIAN ERROR:\n     I am not understanding  ✘\n     I do not understand     ✔"},

 s13:[
 "I ____ him for ten years, and I ____ that he ____ an honest man.|have known-believe-is;am knowing-am believing-is;have known-am believing-is|0|Stative verbs take the perfect, not the continuous. 'Honest' silent H → AN.",
 "She ____ the doctor this evening because she ____ a headache since morning.|is seeing-has had;sees-is having;is seeing-is having|0|'See' meaning 'meet' → -ing OK. 'Since morning' with a state → HAS HAD.",
 "He ____ two houses, but neither of them ____ big enough for ____ family.|owns-is-his;is owning-are-their;owns-are-his|0|'Own' is stative → OWNS. 'Neither of' is singular → IS. Singular pronoun → HIS.",
 "I ____ what you mean, but I ____ about it before I ____ a decision.|understand-am thinking-take;am understanding-think-will take;understand-think-take|0|'Understand' is stative. 'Think' meaning 'consider' → AM THINKING. A time clause bans 'will' → TAKE (Rule 55).",
 "The box ____ letters that ____ to my grandfather, who ____ them since 1950.|contains-belonged-had kept;is containing-belongs-kept;contains-belonged-had kept|0|'Contain' is stative. 'Belong' is stative in the past → BELONGED. Earlier action → HAD KEPT."],

 s14:{
  rule:"Stative verbs of perception, emotion, thought, possession and appearance are not used in the continuous form.",
  formula:"STATIVE → no -ing (know, own, believe, understand, belong, contain, seem)\nMEANING SHIFT → -ing allowed (seeing a doctor, having dinner, thinking about)",
  memory:"Can you film it happening? If not, it is a state — no -ing.",
  ta:"அது நடக்கிறத camera-ல படம் பிடிக்க முடியுமா? முடியலைன்னா அது நிலை — -ing இல்ல.",
  tl:"Adhu nadakkiradha camera-la padam pidikka mudiyumaa? Mudiyalainnaa adhu nilai — -ing illa.",
  mistake:"Writing 'I am not understanding' and 'He is having a car'.",
  exam:"SSC CGL / CHSL / MTS and Bank — 'am understanding' is a hallmark Indian English error."},

 s15:[
 {ta:"இந்த rule நமக்கு ரொம்ப முக்கியம், ஏன்னா இதுல நாம பண்ற தப்பு இந்திய ஆங்கிலத்தோட அடையாளமே ஆயிடுச்சு. 'I am not understanding' — இதை நாம office-ல, class-ல, TV-ல எல்லா இடத்துலயும் கேட்குறோம். ஆனா இது தப்பு.",
  tl:"Indha rule namakku romba mukkiyam, yennaa idhula naama panra thappu Indhiya Aangilaththoda adaiyaalame aayiduchu. 'I am not understanding' — idhai naama office-la, class-la, TV-la ellaa idaththulayum ketkurom. Aanaa idhu thappu."},
 {ta:"ஏன் தப்பு? ஒரு எளிய சோதனை சொல்லுறேன் — 'Camera சோதனை'. ஒரு camera எடுத்து அந்த நபரை நோக்கி வையுங்க. அந்த செயலை படம் பிடிக்க முடியுமா? ஒருத்தர் ஓடுறத படம் பிடிக்கலாம். சாப்பிடுறத படம் பிடிக்கலாம். எழுதுறத படம் பிடிக்கலாம். இதெல்லாம் செயல்.",
  tl:"Yen thappu? Oru eliya sodhanai solluren — 'Camera sodhanai'. Oru camera eduththu andha nabarai nokki vaiyunga. Andha seyalai padam pidikka mudiyumaa? Oruththar oduradha padam pidikkalaam. Saappiduradha padam pidikkalaam."},
 {ta:"ஆனா ஒருத்தர் 'தெரிஞ்சுக்கிட்டு இருக்கிறத' படம் பிடிக்க முடியுமா? முடியாது! அது ஒரு நிலை, செயல் இல்ல. 'சொந்தமா வெச்சிருக்கிறத' படம் பிடிக்க முடியுமா? முடியாது. 'நம்புறத' படம் பிடிக்க முடியுமா? முடியாது. இதெல்லாம் நிலை. நிலைக்கு -ing இல்ல.",
  tl:"Aanaa oruththar 'therinjukkittu irukkiradha' padam pidikka mudiyumaa? Mudiyaadhu! Adhu oru nilai, seyal illa. 'Sondhamaa vechirukkiradha' padam pidikka mudiyumaa? Mudiyaadhu. Idhellaam nilai. Nilaikku -ing illa."},
 {ta:"ஐந்து குடும்பம் மனப்பாடம் பண்ணுங்க. உணர்வு: see, hear, smell, taste, feel. மனநிலை: love, hate, like, prefer, want. சிந்தனை: know, believe, understand, remember, forget. உடைமை: have, own, possess, belong, contain. தோற்றம்: seem, appear, look, resemble.",
  tl:"Aindhu kudumbam manappaadam pannunga. Unarvu: see, hear, smell, taste, feel. Mananilai: love, hate, like, prefer, want. Sindhanai: know, believe, understand, remember. Udaimai: have, own, possess, belong, contain. Thotram: seem, appear, look, resemble."},
 {ta:"இப்போ ரொம்ப முக்கியமான ஒரு விஷயம் — சில வினைச்சொல் பொருள் மாறினா -ing எடுக்கும்! 'I SEE the board' — கண்ணால பார்க்கிறது, உணர்வு, -ing இல்ல. ஆனா 'I AM SEEING the doctor' — சந்திக்கிறேன், அது ஒரு செயல், -ing சரி! 'He HAS a car' — உடைமை, -ing இல்ல. ஆனா 'He IS HAVING dinner' — சாப்பிடுறாரு, செயல், -ing சரி!",
  tl:"Ippo romba mukkiyamaana oru vishayam — sila vinaichol porul maarinaa -ing edukkum! 'I SEE the board' — unarvu, -ing illa. Aanaa 'I AM SEEING the doctor' — sandhikkiren, adhu oru seyal, -ing sari! 'He HAS a car' — udaimai. Aanaa 'He IS HAVING dinner' — seyal, -ing sari!"},
 {ta:"அதனால 'இந்த வினைச்சொல்லுக்கு எப்பவும் -ing இல்ல' அப்படின்னு மனப்பாடம் பண்ணாதீங்க. அர்த்தத்தை பாருங்க. நிலையா, செயலா? நிலைன்னா -ing இல்ல. செயல்னா -ing சரி. கடைசியா ஒரு பொதுவான தப்பு — 'I am knowing him for ten years.' இது தப்பு. சரியான வடிவம் 'I HAVE KNOWN him for ten years.' Stative verb-க்கு continuous இல்ல, perfect வரும்.",
  tl:"Adhanaala 'indha vinaicholukku eppavum -ing illa' appadinnu manappaadam pannaadheenga. Arththaththai paarunga. Nilaiyaa, seyalaa? Kadaisiyaa oru podhuvaana thappu — 'I am knowing him for ten years.' Idhu thappu. Sariyaana vadivam 'I HAVE KNOWN him for ten years.'"}]},

/* ========== RULE 60 ========== */
{n:60,rc:"TEN-10",d:"Hard",t:"IT IS TIME and IT IS HIGH TIME take the Past Form",
 tam:"'It is high time' -க்குப் பின் past tense வடிவம் வரும்",
 s1:{en:"After IT IS TIME, IT IS HIGH TIME and IT IS ABOUT TIME, use the PAST TENSE form even though the meaning is present or future. This is the past subjunctive, expressing urgency about something not yet done.",
  ta:"IT IS TIME, IT IS HIGH TIME, IT IS ABOUT TIME ஆகியவற்றுக்குப் பின், பொருள் நிகழ்காலமாகவோ எதிர்காலமாகவோ இருந்தாலும் கடந்தகால tense வடிவம் பயன்படுத்தவும். இது past subjunctive, இன்னும் செய்யப்படாத ஒன்றைப் பற்றிய அவசரத்தை வெளிப்படுத்துகிறது.",
  tl:"IT IS TIME, IT IS HIGH TIME, IT IS ABOUT TIME aagiyavatrukkup pin, porul nigazhgaalamaagavo edhirkaalamaagavo irundhaalum kadandhagaala tense vadivam payanpaduththavum.",
  formula:"IT IS (HIGH) TIME  +  subject  +  V2\n\n  It is high time we STARTED the work.   ✔\n  It is time you WENT to bed.            ✔\n  It is about time he REALISED his mistake. ✔\n\nWITH NO SUBJECT  →  to + V1\n  It is time TO GO.                      ✔\n  It is time TO START the meeting.       ✔"},

 s2:[
 {h:"Why a past form for a present idea",
  en:"This is the SUBJUNCTIVE mood — a special form English keeps for unreal or urgent situations. 'It is high time we started' means we SHOULD have started already but have not. The past form expresses that gap between what should be and what is.",
  ta:"நிகழ்கால கருத்துக்கு ஏன் கடந்தகால வடிவம்? இது SUBJUNCTIVE மனநிலை — உண்மையற்ற அல்லது அவசரமான சூழ்நிலைகளுக்காக ஆங்கிலம் வைத்திருக்கும் ஒரு சிறப்பு வடிவம். 'It is high time we started' என்றால் நாம் ஏற்கனவே தொடங்கியிருக்க வேண்டும் ஆனால் தொடங்கவில்லை. இருக்க வேண்டியதற்கும் இருப்பதற்கும் இடையிலான அந்த இடைவெளியை கடந்தகால வடிவம் வெளிப்படுத்துகிறது.",
  tl:"Nigazhgaala karuththukku yen kadandhagaala vadivam? Idhu SUBJUNCTIVE mananilai. 'It is high time we started' endraal naam erkanave thodangiyirukka vendum aanaal thodangavillai."},
 {h:"With a subject use V2, without a subject use to + V1",
  en:"'It is time WE STARTED' has a subject (we), so V2 is used. 'It is time TO START' has no subject, so the infinitive is used. Look for a subject after 'time' to decide.",
  ta:"Subject இருந்தால் V2, இல்லாவிட்டால் to + V1. 'It is time WE STARTED' இதில் ஒரு subject (we) இருக்கிறது, எனவே V2 பயன்படுத்தப்படுகிறது. 'It is time TO START' இதில் subject இல்லை, எனவே infinitive பயன்படுத்தப்படுகிறது. முடிவு செய்ய 'time'-க்குப் பின் ஒரு subject இருக்கிறதா என்று பாருங்கள்.",
  tl:"Subject irundhaal V2, illaavittaal to + V1. 'It is time WE STARTED' idhil oru subject irukkiradhu. 'It is time TO START' idhil subject illai."},
 {h:"The same subjunctive appears in WISH and IF I WERE",
  en:"'I wish I were rich', 'If I were you', 'He talks as if he were the boss' — all use a past form for an unreal present. 'It is high time' belongs to the same family. Learn them together.",
  ta:"அதே subjunctive WISH மற்றும் IF I WERE-லும் தோன்றுகிறது. 'I wish I were rich', 'If I were you', 'He talks as if he were the boss' — அனைத்தும் உண்மையற்ற நிகழ்காலத்திற்கு கடந்தகால வடிவத்தைப் பயன்படுத்துகின்றன. 'It is high time' அதே குடும்பத்தைச் சேர்ந்தது. அவற்றைச் சேர்த்துக் கற்றுக்கொள்ளுங்கள்.",
  tl:"Adhe subjunctive WISH matrum IF I WERE-lum thondrugiradhu. 'I wish I were rich', 'If I were you' — anaiththum unmaiyatra nigazhgaalaththirku kadandhagaala vadivaththaip payanpaduththugindrana."},
 {h:"Never use 'should' after it is high time",
  en:"'It is high time we should start' is wrong. The past form already carries the sense of obligation, so 'should' is redundant. Simply write 'It is high time we started'.",
  ta:"'It is high time'-க்குப் பின் ஒருபோதும் 'should' பயன்படுத்தாதீர்கள். 'It is high time we should start' தவறு. கடந்தகால வடிவமே கடமையின் உணர்வைச் சுமக்கிறது, எனவே 'should' தேவையற்றது. வெறுமனே 'It is high time we started' என்று எழுதுங்கள்.",
  tl:"'It is high time'-kkup pin orupodhum 'should' payanpaduththaadheergal. 'It is high time we should start' thavaru. Kadandhagaala vadivame kadamaiyin unarvaich sumakkiradhu."}],

 s3:[
 {h:"The gap between should and is",
  d:"   SHOULD HAVE STARTED  ────X──── HAVEN'T STARTED\n           ↑                          ↑\n      what ought to be           what actually is\n\n   That GAP is what the past form expresses.\n\n   It is high time we STARTED the work.\n   (= we should have started already)"},
 {h:"Subject or no subject",
  d:"   WITH a subject   →  V2\n     It is time WE STARTED.\n     It is time YOU WENT to bed.\n     It is high time HE REALISED it.\n\n   WITHOUT a subject →  to + V1\n     It is time TO GO.\n     It is time TO START the meeting.\n\n   Look right after 'time' to decide."},
 {h:"The subjunctive family",
  d:"   All of these use a PAST form\n   for an UNREAL present:\n\n   It is high time we STARTED.\n   I wish I WERE rich.\n   If I WERE you, I would accept.\n   He talks as if he WERE the boss.\n   Suppose he WERE here now.\n\n   Learn them as one group."}],

 s4:{
 wrong:["\"The meaning is present, so use the present tense.\" — The subjunctive requires the past form.",
  "\"'It is high time we should start' adds the sense of duty.\" — 'Should' is redundant and wrong.",
  "\"'It is time to go' proves the infinitive is always right.\" — Only when there is no subject.",
  "\"'It is high time we start' is simpler and clearer.\" — It is grammatically wrong."],
 right:["After 'it is high time', look for a subject.",
  "Subject present → use V2.",
  "No subject → use to + V1.",
  "Never add 'should' after 'it is high time'."]},

 s5:[
 {en:"It is high time we started the work.",ta:"நாம் வேலையைத் தொடங்க வேண்டிய நேரம் இது.",tl:"Naam velaiyaith thodanga vendiya neram idhu.",note:"A subject follows, so the past form STARTED is used."},
 {en:"It is time you went to bed.",ta:"நீ தூங்கச் செல்ல வேண்டிய நேரம் இது.",tl:"Nee thoongach sella vendiya neram idhu.",note:"A subject follows → past form WENT."},
 {en:"It is about time he realised his mistake.",ta:"அவர் தன் தவறை உணர வேண்டிய நேரம் இது.",tl:"Avar than thavarai unara vendiya neram idhu.",note:"'About time' behaves the same way."},
 {en:"It is time to go home now.",ta:"இப்போது வீட்டுக்குச் செல்ல வேண்டிய நேரம்.",tl:"Ippodhu veettukkuch sella vendiya neram.",note:"No subject follows → to + V1."},
 {en:"I wish I were as tall as my brother.",ta:"என் சகோதரனைப் போல நானும் உயரமாக இருக்க விரும்புகிறேன்.",tl:"En sagodharanaip pola naanum uyaramaaga irukka virumbugiren.",note:"The same subjunctive family — 'were' for an unreal wish."}],

 s6:["it is time|நேரம் ஆயிற்று|Neram aayitru",

  "if I were you|நான் உன் இடத்தில் இருந்தால்|Naan un idaththil irundhaal",

 s7:[
 "It is high time we ____ the work.|started|Easy|A subject follows → V2.",
 "It is time you ____ to bed.|went|Easy|A subject follows → V2.",
 "It is about time he ____ his mistake.|realised|Easy|A subject follows → V2.",
 "It is time ____ home now.|to go|Medium|No subject → to + V1.",
 "It is high time the government ____ action.|took|Medium|A subject follows → V2.",
 "It is time we ____ for the station.|left|Medium|A subject follows → V2.",
 "It is high time you ____ smoking.|quit|Medium|A subject follows → past form.",
 "It is time ____ the meeting.|to start|Hard|No subject → to + V1.",
 "It is high time they ____ the truth.|knew|Hard|A subject follows → V2.",
 "I wish I ____ as rich as him.|were|Hard|The subjunctive uses 'were'.",
 "If I ____ you, I would accept it.|were|Hard|The subjunctive uses 'were'.",
 "It is high time she ____ a decision.|made|Expert|A subject follows → V2.",
 "He talks as if he ____ the boss.|were|Expert|The subjunctive uses 'were'.",
 "It is about time we ____ this habit.|gave up|Expert|A subject follows → V2.",
 "It is time ____ about the future.|to think|Expert|No subject → to + V1."],

 s8:[
 "It is high time we start the work.|It is high time we started the work.|The subjunctive requires the past form.",
 "It is time you go to bed.|It is time you went to bed.|A subject requires the past form.",
 "It is high time we should start the work.|It is high time we started the work.|'Should' is redundant after 'it is high time'.",
 "It is about time he realises his mistake.|It is about time he realised his mistake.|The subjunctive requires the past form.",
 "It is high time the government takes action.|It is high time the government took action.|The subjunctive requires the past form.",
 "It is time we should leave for the station.|It is time we left for the station.|'Should' is redundant.",
 "It is high time you quit smoking now.|It is high time you quit smoking now.|This is already correct because 'quit' is the same in V1 and V2.",
 "I wish I was as rich as him.|I wish I were as rich as him.|The subjunctive uses 'were' for all subjects.",
 "If I was you, I would accept it.|If I were you, I would accept it.|The subjunctive uses 'were'.",
 "He talks as if he was the boss.|He talks as if he were the boss.|The subjunctive uses 'were'."],

 s9:[
 "Fill in the Blank|It is high time the authorities ____ strict action against these offenders.|take;took|1|The subjunctive requires the past form.",
 "Find the Error|It is high time (A) we should start (B) preparing for (C) the examination (D).|A;B;C;D|1|Part B. 'Should' is redundant → 'we started'.",
 "Sentence Improvement|It is time you go to bed because you have school tomorrow morning.|you go;you went;you should go|1|A subject requires the past form.",
 "Fill in the Blank|I wish I ____ able to help you with this difficult problem right now.|was;were|1|The subjunctive uses 'were' for all subjects.",
 "Find the Error|It is about time (A) he realises (B) that nobody (C) is going to help him (D).|A;B;C;D|1|Part B. The subjunctive requires 'realised'."],

 s10:{
  en:"The past form for a present meaning feels backwards, so students correct it to the present and lose the mark. The second trap is 'should' — 'It is high time we should start' looks more polite and more complete, but the past form already carries the obligation, so 'should' is redundant and wrong. The third trap is 'was' instead of 'were' in the related wish and if-clauses.",
  ta:"நிகழ்காலப் பொருளுக்கு கடந்தகால வடிவம் தலைகீழாகத் தோன்றுகிறது, எனவே மாணவர்கள் அதை நிகழ்காலமாகத் திருத்தி mark இழக்கிறார்கள். இரண்டாவது பொறி 'should' — 'It is high time we should start' அதிக நாகரிகமாகவும் முழுமையாகவும் தோன்றுகிறது, ஆனால் கடந்தகால வடிவமே கடமையைச் சுமக்கிறது, எனவே 'should' தேவையற்றது மற்றும் தவறு. மூன்றாவது பொறி தொடர்புடைய wish மற்றும் if-clause-களில் 'were'-க்குப் பதிலாக 'was'.",
  tl:"Nigazhgaalap porulukku kadandhagaala vadivam thalaigeezhaagath thondrugiradhu, enave maanavargal adhai nigazhgaalamaagath thiruththi mark izhakkiraargal. Irandaavadhu pori 'should'. Moondraavadhu pori 'were'-kkup padhilaaga 'was'."},

 s11:{
  en:"IT IS HIGH TIME + SUBJECT + V2. No 'should', no present tense.",
  ta:"IT IS HIGH TIME + subject + V2. 'Should' இல்லை, நிகழ்காலம் இல்லை.",
  tl:"IT IS HIGH TIME + subject + V2. 'Should' illai, nigazhgaalam illai.",
  vis:"      THE SUBJUNCTIVE FAMILY\n\n   All use a PAST form for an UNREAL present:\n\n   It is high time we STARTED.\n   It is time you WENT to bed.\n   I wish I WERE rich.\n   If I WERE you, I would accept.\n   He talks as if he WERE the boss.\n\n   ⚠ TWO THINGS TO AVOID:\n     'It is high time we SHOULD start'  ✘\n     'It is high time we START'          ✘\n\n   ⚠ NO SUBJECT? USE TO + V1:\n     It is time TO GO.        ✔\n     It is time TO START.     ✔\n\n   ⚠ ALWAYS 'WERE', NEVER 'WAS':\n     I wish I WERE ...   If I WERE you ..."},

 s13:[
 "It is high time we ____ the work, for the deadline ____ already passed.|start-has;started-has;started-had|1|The subjunctive → STARTED. 'Already' with no past marker → HAS passed.",
 "It is time you ____ to bed, because you ____ school before ____ sun rises.|go-have-the;went-have-the;went-had-a|1|Subjunctive → WENT. 'Have school' → HAVE. Unique object → THE sun.",
 "I wish I ____ as rich as he ____ , but neither of us ____ complaining.|were-is-is;was-is-are;were-is-are|0|Subjunctive → WERE. Hidden verb after 'as' → IS (Pronoun Rule 22). 'Neither of' is singular → IS.",
 "It is high time the government ____ action, since the number of complaints ____ risen.|takes-have;took-has;took-have|1|Subjunctive → TOOK. 'The number of' → HAS (SVA Rule 38).",
 "If I ____ you, I ____ avail ____ of ____ opportunity at once.|was-would-myself-the;were-would-myself-the;were-will-me-a|1|Subjunctive → WERE. 'Would' in the main clause. 'Avail' needs a reflexive → MYSELF (Pronoun Rule 24)."],

 s14:{
  rule:"After 'it is time', 'it is high time' and 'it is about time', use the past form with a subject, or to + V1 without one.",
  formula:"IT IS HIGH TIME + subject + V2\nIT IS TIME + to + V1 (no subject)\nNever add 'should'",
  memory:"It is high time we STARTED — past form for a present need.",
  ta:"'It is high time we STARTED' — நிகழ்கால தேவைக்கு கடந்தகால வடிவம். 'Should' போடாதீங்க.",
  tl:"'It is high time we STARTED' — nigazhgaala thevaikku kadandhagaala vadivam. 'Should' podaadheenga.",
  mistake:"Writing 'it is high time we start' or 'it is high time we should start'.",
  exam:"SSC CGL / CHSL, CDS and Bank — a clean one-mark question if you know the subjunctive."},

 s15:[
 {ta:"இந்த rule முதல்ல விசித்திரமா தோணும். 'It is high time we STARTED the work.' — 'Started' அப்படிங்கிறது கடந்தகாலம். ஆனா நாம இன்னும் தொடங்கவே இல்லையே! அப்பறம் ஏன் கடந்தகாலம்?",
  tl:"Indha rule mudhalla visiththiramaa thonum. 'It is high time we STARTED the work.' — 'Started' appadingiradhu kadandhagaalam. Aanaa naama innum thodangave illaiye! Apparam yen kadandhagaalam?"},
 {ta:"இதுக்கு பேரு subjunctive — கற்பனை வடிவம். ஆங்கிலம் இதை உண்மையற்ற அல்லது அவசரமான சூழ்நிலைக்கு வெச்சிருக்கு. 'It is high time we started' அப்படின்னா என்ன அர்த்தம்? 'நாம ஏற்கனவே தொடங்கியிருக்கணும், ஆனா தொடங்கல.' இருக்க வேண்டியதுக்கும் இருக்கிறதுக்கும் இடையில ஒரு இடைவெளி இருக்கு. அந்த இடைவெளியை கடந்தகால வடிவம் காட்டுது.",
  tl:"Idhukku peru subjunctive — karpanai vadivam. 'It is high time we started' appadinnaa enna arththam? 'Naama erkanave thodangiyirukkanum, aanaa thodangala.' Irukka vendiyadhukkum irukkiradhukkum idaiyila oru idaiveli irukku."},
 {ta:"விதி ரொம்ப சிம்பிள். 'It is time' அல்லது 'It is high time'-க்கு அப்பறம் ஒரு subject இருந்தா — we, you, he, they — அப்பறம் V2 வரும். 'It is time we STARTED', 'It is time you WENT', 'It is high time he REALISED'.",
  tl:"Vidhi romba simple. 'It is time' alladhu 'It is high time'-kku apparam oru subject irundhaa — we, you, he, they — apparam V2 varum. 'It is time we STARTED', 'It is time you WENT'."},
 {ta:"ஆனா subject இல்லைன்னா? அப்போ 'to + V1'. 'It is time TO GO.' 'It is time TO START the meeting.' இங்க யாரு போகணும்னு சொல்லல, பொதுவா சொல்றோம். அதனால infinitive. 'Time'-க்கு அப்பறம் யாராவது இருக்காங்களா-ன்னு பாருங்க.",
  tl:"Aanaa subject illainnaa? Appo 'to + V1'. 'It is time TO GO.' 'It is time TO START the meeting.' Inga yaaru poganumnu sollala, podhuvaa solrom. 'Time'-kku apparam yaaraavadhu irukkaangalaa-nnu paarunga."},
 {ta:"இப்போ ஒரு பெரிய பொறி — 'should'. நிறைய பேரு 'It is high time we SHOULD start' அப்படின்னு எழுதுவாங்க. ஏன்? ஏன்னா 'should' சேர்த்தா கடமை மாதிரி தோணும். ஆனா தப்பு! கடந்தகால வடிவமே கடமையை சொல்லிடுச்சு. 'Should' தேவையில்ல. 'It is high time we STARTED' — இது போதும்.",
  tl:"Ippo oru periya pori — 'should'. Neraiya peru 'It is high time we SHOULD start' appadinnu ezhudhuvaanga. Aanaa thappu! Kadandhagaala vadivame kadamaiyai sollidichu. 'Should' thevaiyilla."},
 {ta:"கடைசியா ஒரு முக்கியமான இணைப்பு. இதே subjunctive வேற இடத்துலயும் வரும். 'I wish I WERE rich' — 'was' இல்ல, 'were'! 'If I WERE you' — 'was' இல்ல! 'He talks as if he WERE the boss.' இதெல்லாம் ஒரே குடும்பம் — உண்மையற்ற நிகழ்காலத்துக்கு கடந்தகால வடிவம். எல்லா subject-க்கும் 'were'. 'I were', 'he were', 'she were'. இதை ஒண்ணா படிச்சா ஞாபகம் இருக்கும்.",
  tl:"Kadaisiyaa oru mukkiyamaana inaippu. Idhe subjunctive veru idaththulayum varum. 'I wish I WERE rich' — 'was' illa, 'were'! 'If I WERE you' — 'was' illa! Idhellaam ore kudumbam. Ellaa subject-kkum 'were'."}]},

/* ========== RULE 61 ========== */
{n:61,rc:"TEN-11",d:"Hard",t:"HARDLY…WHEN, SCARCELY…WHEN, NO SOONER…THAN",
 tam:"Hardly/Scarcely + when · No sooner + than",
 s1:{en:"HARDLY and SCARCELY are followed by WHEN. NO SOONER is followed by THAN. The first clause takes the PAST PERFECT and the sentence is INVERTED — the auxiliary comes before the subject.",
  ta:"HARDLY மற்றும் SCARCELY-க்குப் பின் WHEN வரும். NO SOONER-க்குப் பின் THAN வரும். முதல் clause past perfect எடுக்கும், மேலும் வாக்கியம் தலைகீழாக்கப்படும் — துணை வினைச்சொல் subject-க்கு முன் வரும்.",
  tl:"HARDLY matrum SCARCELY-kkup pin WHEN varum. NO SOONER-kkup pin THAN varum. Mudhal clause past perfect edukkum, melum vaakkiyam thalaigeezhaakkappadum.",
  formula:"HARDLY   had + subject + V3   WHEN  + V2\nSCARCELY had + subject + V3   WHEN  + V2\nNO SOONER had + subject + V3  THAN  + V2\n\n  HARDLY HAD he arrived WHEN it began to rain.\n  NO SOONER HAD she spoken THAN the crowd cheered.\n  SCARCELY HAD we sat down WHEN the bell rang."},

 s2:[
 {h:"The pairs must never be swapped",
  en:"HARDLY marries WHEN. SCARCELY marries WHEN. NO SOONER marries THAN. 'Hardly...than' and 'no sooner...when' are both wrong, and both appear as tempting options in every exam.",
  ta:"ஜோடிகள் ஒருபோதும் மாற்றப்படக் கூடாது. HARDLY-க்கு WHEN. SCARCELY-க்கு WHEN. NO SOONER-க்கு THAN. 'Hardly...than' மற்றும் 'no sooner...when' இரண்டுமே தவறு, ஒவ்வொரு தேர்விலும் இரண்டுமே கவர்ச்சிகரமான option-களாக வருகின்றன.",
  tl:"Jodigal orupodhum maatrappadak koodaadhu. HARDLY-kku WHEN. SCARCELY-kku WHEN. NO SOONER-kku THAN. 'Hardly...than' matrum 'no sooner...when' irandume thavaru."},
 {h:"Why 'than' goes with 'no sooner'",
  en:"'No sooner' contains a COMPARATIVE — 'sooner' is the comparative of 'soon'. Comparatives take 'than', exactly like 'taller than'. That is the whole logic, and it makes the pair easy to remember.",
  ta:"'No sooner'-உடன் ஏன் 'than' வருகிறது? 'No sooner'-ல் ஒரு COMPARATIVE இருக்கிறது — 'sooner' என்பது 'soon'-ன் comparative. Comparative-கள் 'than' எடுக்கும், சரியாக 'taller than' போலவே. அதுதான் முழு தர்க்கம், அது ஜோடியை நினைவில் வைத்துக்கொள்ள எளிதாக்குகிறது.",
  tl:"'No sooner'-udan yen 'than' varugiradhu? 'No sooner'-l oru COMPARATIVE irukkiradhu — 'sooner' enbadhu 'soon'-in comparative. Comparative-kal 'than' edukkum, sariyaaga 'taller than' polave."},
 {h:"Inversion is compulsory",
  en:"'Hardly he had arrived' is wrong. After hardly, scarcely and no sooner at the start of a sentence, the auxiliary must come BEFORE the subject: 'Hardly HAD HE arrived'. This is the same inversion you learnt in SVA Rule 49.",
  ta:"தலைகீழாக்கம் கட்டாயம். 'Hardly he had arrived' தவறு. வாக்கியத்தின் தொடக்கத்தில் hardly, scarcely, no sooner வந்தால், துணை வினைச்சொல் subject-க்கு முன் வர வேண்டும்: 'Hardly HAD HE arrived'. இது நீங்கள் SVA Rule 49-ல் கற்றுக்கொண்ட அதே தலைகீழாக்கம்.",
  tl:"Thalaigeezhaakkam kattaayam. 'Hardly he had arrived' thavaru. Vaakkiyaththin thodakkaththil hardly, scarcely, no sooner vandhaal, thunai vinaichol subject-kku mun vara vendum. Idhu SVA Rule 49-l katrukkonda adhe thalaigeezhaakkam."},
 {h:"They can be rewritten with 'as soon as'",
  en:"'No sooner had he arrived than it rained' means the same as 'As soon as he arrived, it rained'. If you are unsure, mentally rewrite with 'as soon as' to check the meaning and the time order.",
  ta:"இவற்றை 'as soon as'-உடன் மீண்டும் எழுதலாம். 'No sooner had he arrived than it rained' என்பது 'As soon as he arrived, it rained' என்பதற்குச் சமம். உறுதியாகத் தெரியாவிட்டால், பொருளையும் நேர வரிசையையும் சரிபார்க்க மனதுக்குள் 'as soon as'-உடன் மீண்டும் எழுதுங்கள்.",
  tl:"Ivatrai 'as soon as'-udan meendum ezhudhalaam. 'No sooner had he arrived than it rained' enbadhu 'As soon as he arrived, it rained' enbadharkuch samam."}],

 s3:[
 {h:"The three fixed pairs",
  d:"   HARDLY    ─────►  WHEN\n   SCARCELY  ─────►  WHEN\n   NO SOONER ─────►  THAN\n\n   ⚠ NEVER:\n     hardly ... than     ✘\n     no sooner ... when  ✘\n\n   MEMORY:\n   'sooner' is a COMPARATIVE\n   comparatives take THAN (taller THAN)"},
 {h:"The inverted structure",
  d:"   NORMAL   :  He HAD hardly arrived when ...\n   INVERTED :  HARDLY HAD HE arrived when ...\n                      ↑    ↑\n                 auxiliary subject\n\n   The auxiliary jumps BEFORE the subject.\n\n   Hardly he had arrived   ✘\n   Hardly had he arrived   ✔"},
 {h:"Rewrite with 'as soon as'",
  d:"   No sooner HAD he arrived THAN it rained.\n              ↓ same meaning\n   As soon as he arrived, it rained.\n\n   Use this rewrite to check:\n   • the time order (arriving came first)\n   • the meaning (the two events were instant)"}],

 s4:{
 wrong:["\"'Hardly...than' sounds balanced.\" — Hardly always pairs with when.",
  "\"'No sooner...when' feels natural.\" — 'Sooner' is a comparative, so it needs 'than'.",
  "\"'Hardly he had arrived' keeps the normal word order.\" — Inversion is compulsory here.",
  "\"The first clause can take the simple past.\" — It must take the past perfect."],
 right:["Memorise the pairs: hardly-when, scarcely-when, no sooner-than.",
  "Remember 'sooner' is a comparative, and comparatives take 'than'.",
  "Put the auxiliary BEFORE the subject: 'Hardly had he...'.",
  "The first clause takes had + V3; the second takes V2."]},

 s10:{
  en:"The exam swaps the pairs and offers 'hardly...than' or 'no sooner...when' as the answer. Both look balanced and both are wrong. The second trap is the missing inversion: 'Hardly he had arrived' keeps normal word order and feels natural, but after hardly, scarcely and no sooner the auxiliary MUST come first. The third trap is using the simple past instead of the past perfect in the first clause.",
  ta:"தேர்வு ஜோடிகளை மாற்றி 'hardly...than' அல்லது 'no sooner...when'-ஐ விடையாகத் தரும். இரண்டுமே சமநிலையாகத் தெரிகின்றன, இரண்டுமே தவறு. இரண்டாவது பொறி காணாமல் போன தலைகீழாக்கம்: 'Hardly he had arrived' சாதாரண சொல் வரிசையைப் பேணுகிறது, இயற்கையாகத் தோன்றுகிறது, ஆனால் hardly, scarcely, no sooner-க்குப் பின் துணை வினைச்சொல் கண்டிப்பாக முதலில் வர வேண்டும். மூன்றாவது பொறி முதல் clause-ல் past perfect-க்குப் பதிலாக simple past பயன்படுத்துவது.",
  tl:"Thervu jodigalai maatri 'hardly...than' alladhu 'no sooner...when'-ai vidaiyaagath tharum. Irandume samanilaiyaagath therigindrana, irandume thavaru. Irandaavadhu pori kaanaamal pona thalaigeezhaakkam."},

 s11:{
  en:"SOONER is a COMPARATIVE, so it takes THAN. Hardly and scarcely take WHEN.",
  ta:"SOONER ஒரு comparative, எனவே அது THAN எடுக்கும். Hardly மற்றும் scarcely WHEN எடுக்கும்.",
  tl:"SOONER oru comparative, enave adhu THAN edukkum. Hardly matrum scarcely WHEN edukkum.",
  vis:"      THE COMPARATIVE CLUE\n\n   taller  THAN   →  comparative takes THAN\n   sooner  THAN   →  same logic!\n\n   NO SOONER ... THAN   ✔\n   NO SOONER ... WHEN   ✘\n\n   HARDLY   ... WHEN    ✔\n   SCARCELY ... WHEN    ✔\n\n   THE FULL STRUCTURE:\n   ┌────────────────────────────────────┐\n   │ HARDLY/SCARCELY HAD + subject + V3 │\n   │            WHEN + V2               │\n   │                                    │\n   │ NO SOONER HAD + subject + V3       │\n   │            THAN + V2               │\n   └────────────────────────────────────┘\n\n   ⚠ AUXILIARY BEFORE SUBJECT — always."},
