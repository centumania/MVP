 s14:{
  rule:"SHOULD and OUGHT TO express advice, moral duty and expectation. SHOULD HAVE + V3 shows a past duty not performed.",
  formula:"SHOULD / OUGHT TO + V1 → advice or duty now\nSHOULD HAVE + V3 → duty missed, regret\n'Ought' always keeps the 'to'",
  memory:"Should + V1 is duty now. Should have + V3 is duty missed.",
  ta:"Should + V1 = இப்போதைய கடமை. Should have + V3 = தவறவிட்ட கடமை.",
  tl:"Should + V1 = ippodhaiya kadamai. Should have + V3 = thavaravitta kadamai.",
  mistake:"Writing 'you should informed us' and dropping the 'to' after 'ought'.",
  exam:"SSC CGL / CHSL and Bank — 'should have + V3' is tested far more often than plain 'should'."},

 s15:[
 {ta:"இந்த rule-ல SHOULD மற்றும் OUGHT TO பார்க்கப் போறோம். ரெண்டுமே அறிவுரை, கடமை சொல்லுது. ஆனா ரெண்டுமே MUST-ஐ விட மென்மையானது.",
  tl:"Indha rule-la SHOULD matrum OUGHT TO paarkkap porom. Rendume arivurai, kadamai solludhu. Aanaa rendume MUST-ai vida menmaiyaanadhu."},
 {ta:"ஒரு வித்தியாசம் பாருங்க. 'You MUST see a doctor' — இது கட்டளை, வேற வழி இல்ல. 'You SHOULD see a doctor' — இது அறிவுரை, நான் பரிந்துரைக்கிறேன், ஆனா முடிவு உங்களோடது. தேர்வுல நட்பான ஆலோசனை இருந்தா 'should' தான்.",
  tl:"Oru viththiyaasam paarunga. 'You MUST see a doctor' — idhu kattalai. 'You SHOULD see a doctor' — idhu arivurai, naan parindhuraikkiren, aanaa mudivu ungalodadhu."},
 {ta:"இப்போ ரொம்ப முக்கியமான வடிவம் — SHOULD HAVE + V3. SSC உண்மையில் இதைத்தான் அதிகமா கேட்குது. 'You SHOULD HAVE informed us earlier' அப்படின்னா என்ன? உங்களுக்கு தெரிவிக்கிற கடமை இருந்தது, ஆனா நீங்க தெரிவிக்கல. இப்போ நேரம் போயிடுச்சு. வருத்தம், கண்டனம் இதுல இருக்கு.",
  tl:"Ippo romba mukkiyamaana vadivam — SHOULD HAVE + V3. SSC unmaiyil idhaith-thaan adhigamaa ketkudhu. 'You SHOULD HAVE informed us earlier' appadinnaa enna? Ungalukku therivikkira kadamai irundhadhu, aanaa neenga therivikkala."},
 {ta:"நிறைய பேரு 'You should informed us' அப்படின்னு எழுதுவாங்க. ஏன்? ஏன்னா அர்த்தம் கடந்தகாலம். ஆனா Rule 63-ல படிச்சோம் — modal-க்கு -ed போட முடியாது! அதுக்கு பதிலா 'have + V3' போடணும். 'You should HAVE INFORMED us.'",
  tl:"Neraiya peru 'You should informed us' appadinnu ezhudhuvaanga. Aanaa Rule 63-la padichom — modal-kku -ed poda mudiyaadhu! Adhukku padhilaa 'have + V3' podanum. 'You should HAVE INFORMED us.'"},
 {ta:"இன்னொரு பொறி — OUGHT. இது ஒரே ஒரு modal, இதுக்கு மட்டும் 'to' வரும். 'We ought TO help the poor.' 'Citizens ought TO obey the law.' மத்த எல்லா modal-லயும் 'to' இல்லாததால, நாம ஒப்புமையா 'ought' -க்கும் 'to' போட மறந்துடுவோம். ஆனா 'ought' எப்பவும் 'to' வெச்சிருக்கும்.",
  tl:"Innoru pori — OUGHT. Idhu ore oru modal, idhukku mattum 'to' varum. 'We ought TO help the poor.' Maththa ellaa modal-layum 'to' illaadhadhaala, naama oppumaiyaa 'ought'-kkum 'to' poda marandhuduvom. Aanaa 'ought' eppavum 'to' vechirukkum."},
 {ta:"கடைசியா ஒரு கூடுதல் தகவல் — SHOULD எதிர்பார்ப்பையும் சொல்லும். 'The train SHOULD arrive by six' — ரயிலுக்கு ஒழுக்கக் கடமை இருக்கா? இல்ல! இங்க அர்த்தம் 'நாம ஆறு மணிக்குள்ள எதிர்பார்க்கிறோம்'. 'He should be home by now' — அவரு வீட்ல இருக்கணும்னு எதிர்பார்க்கிறோம். இது மூணாவது பயன்பாடு. அறிவுரை, கடமை, எதிர்பார்ப்பு — மூணும் should-ஓட வேலை.",
  tl:"Kadaisiyaa oru koodudhal thagaval — SHOULD edhirpaarppaiyum sollum. 'The train SHOULD arrive by six' — inga arththam 'naama aaru manikkulla edhirpaarkkirom'. Arivurai, kadamai, edhirpaarppu — moonum should-oda velai."}]},

/* ========== RULE 68 ========== */
{n:68,rc:"MOD-06",d:"Hard",t:"NEED and DARE work as BOTH Modal and Main Verb",
 tam:"Need, Dare — modal-ஆ, main verb-ஆ ரெண்டு வழியிலும் வரும்",
 s1:{en:"NEED and DARE sit on the border between modals and ordinary verbs. As MODALS (in negatives and questions) they take NO -s and NO 'to'. As MAIN VERBS they take -s, -ed and 'to'. Never mix the two patterns.",
  ta:"NEED மற்றும் DARE modal-களுக்கும் சாதாரண வினைச்சொற்களுக்கும் இடையிலான எல்லையில் இருக்கின்றன. MODAL-ஆக (எதிர்மறை மற்றும் கேள்விகளில்) அவை -s எடுக்காது, 'to' எடுக்காது. MAIN VERB-ஆக அவை -s, -ed மற்றும் 'to' எடுக்கும். இரண்டு அமைப்புகளையும் ஒருபோதும் கலக்காதீர்கள்.",
  tl:"NEED matrum DARE modal-galukkum saadhaarana vinaichorkalukkum idaiyilaana ellaiyil irukkindrana. MODAL-aaga avai -s edukkaadhu, 'to' edukkaadhu. MAIN VERB-aaga avai -s, -ed matrum 'to' edukkum.",
  formula:"AS A MODAL (negatives and questions)\n  He NEED NOT go.          ✔  (no -s, no 'to')\n  NEED he go?              ✔\n  How DARE you speak so?   ✔\n\nAS A MAIN VERB\n  He DOES NOT NEED TO go.  ✔  (-s and 'to')\n  Does he NEED TO go?      ✔\n  He DARED TO challenge me. ✔\n\n⚠ NEVER MIX:  He need not TO go.  ✘\n              He needs not go.    ✘"},

 s2:[
 {h:"The modal form appears only in negatives and questions",
  en:"'He need not go' and 'Need he go?' are modal uses — and these only exist in the negative and the interrogative. In a plain positive statement, 'need' is always a main verb: 'He needs to go'.",
  ta:"Modal வடிவம் எதிர்மறை மற்றும் கேள்விகளில் மட்டுமே தோன்றுகிறது. 'He need not go' மற்றும் 'Need he go?' modal பயன்பாடுகள் — இவை எதிர்மறையிலும் வினாவிலும் மட்டுமே இருக்கின்றன. வெறும் நேர்மறைக் கூற்றில், 'need' எப்போதும் ஒரு main verb: 'He needs to go'.",
  tl:"Modal vadivam edhirmarai matrum kelvigalil mattume thondrugiradhu. 'He need not go' matrum 'Need he go?' modal payanpaadugal. Verum nermaraik kootril, 'need' eppodhum oru main verb: 'He needs to go'."},
 {h:"The mixing error is what SSC plants",
  en:"'He need not to go' takes the modal form 'need not' but adds the main-verb 'to'. 'He needs not go' takes the main-verb -s but drops the 'to'. Both are hybrids and both are wrong. Choose one pattern and stay with it.",
  ta:"கலக்கும் தவறுதான் SSC நடுவது. 'He need not to go' modal வடிவமான 'need not'-ஐ எடுத்து, main-verb 'to'-ஐச் சேர்க்கிறது. 'He needs not go' main-verb -s-ஐ எடுத்து 'to'-ஐ விடுகிறது. இரண்டுமே கலப்பினங்கள், இரண்டுமே தவறு. ஒரு அமைப்பைத் தேர்ந்தெடுத்து அதிலேயே இருங்கள்.",
  tl:"Kalakkum thavarudhaan SSC naduvadhu. 'He need not to go' modal vadivaththai eduththu, main-verb 'to'-aich serkkiradhu. 'He needs not go' main-verb -s-ai eduththu 'to'-ai vidugiradhu. Irandume kalappinangal."},
 {h:"NEED NOT HAVE + V3 versus DID NOT NEED TO",
  en:"'You need not have waited' means you waited but it was unnecessary. 'You did not need to wait' means it was unnecessary, and you probably did not wait. A fine distinction that exams enjoy.",
  ta:"NEED NOT HAVE + V3 மற்றும் DID NOT NEED TO. 'You need not have waited' என்றால் நீங்கள் காத்திருந்தீர்கள் ஆனால் அது தேவையற்றது. 'You did not need to wait' என்றால் அது தேவையற்றது, மேலும் நீங்கள் காத்திருக்கவில்லை. தேர்வுகள் விரும்பும் ஒரு நுட்பமான வேறுபாடு.",
  tl:"NEED NOT HAVE + V3 matrum DID NOT NEED TO. 'You need not have waited' endraal neengal kaaththirundheergal aanaal adhu thevaiyatradhu. 'You did not need to wait' endraal adhu thevaiyatradhu, melum neengal kaaththirukkavillai."},
 {h:"HOW DARE is a fixed exclamation",
  en:"'How dare you speak to me like that!' is a fixed modal pattern — no -s, no 'to', and no auxiliary. Compare with the main verb: 'He dared to contradict the officer'.",
  ta:"HOW DARE ஒரு நிலையான ஆச்சரியக் குறிப்பு. 'How dare you speak to me like that!' ஒரு நிலையான modal அமைப்பு — -s இல்லை, 'to' இல்லை, துணை வினைச்சொல் இல்லை. Main verb-உடன் ஒப்பிடுங்கள்: 'He dared to contradict the officer'.",
  tl:"HOW DARE oru nilaiyaana aachariyak kurippu. 'How dare you speak to me like that!' oru nilaiyaana modal amaippu. Main verb-udan oppidungal: 'He dared to contradict the officer'."}],

 s3:[
 {h:"Two complete patterns",
  d:"   MODAL PATTERN            MAIN-VERB PATTERN\n   ─────────────            ─────────────────\n   He NEED NOT go.          He DOES NOT NEED TO go.\n   NEED he go?              DOES he NEED TO go?\n   He DARE NOT speak.       He DOES NOT DARE TO speak.\n   How DARE you!            He DARED TO ask.\n\n   ⚠ Pick one column. Never mix them."},
 {h:"The hybrid errors",
  d:"   He need not TO go.     ✘  modal + 'to'\n   He needS not go.       ✘  -s without 'to'\n   Does he need go?       ✘  auxiliary without 'to'\n   He dare to speak.      ✘  modal + 'to'\n\n   Each of these takes half of one pattern\n   and half of the other."},
 {h:"Need not have versus did not need to",
  d:"   You NEED NOT HAVE waited.\n     → you DID wait, but it was pointless\n\n   You DID NOT NEED TO wait.\n     → it was unnecessary\n       (and you probably did not wait)\n\n   One reports a wasted action.\n   The other reports an absent obligation."}],

 s4:{
 wrong:["\"'He need not to go' is complete and polite.\" — The modal form takes no 'to'.",
  "\"'He needs not go' shows the third person.\" — With -s you must add 'to'.",
  "\"'Need' is always a main verb.\" — In negatives and questions it can be a modal.",
  "\"'How dares he speak?' shows agreement.\" — 'How dare you' is a fixed modal pattern."],
 right:["Decide first: modal pattern or main-verb pattern.",
  "Modal → need not go, need he go, dare not speak.",
  "Main verb → does not need to go, dared to ask.",
  "Never take half of one pattern and half of the other."]},

 s5:[
 {en:"He need not go there today.",ta:"அவர் இன்று அங்கே செல்ல வேண்டியதில்லை.",tl:"Avar indru ange sella vendiyadhillai.",note:"The modal pattern — no -s, no 'to'."},
 {en:"He does not need to go there today.",ta:"அவர் இன்று அங்கே செல்ல வேண்டிய அவசியம் இல்லை.",tl:"Avar indru ange sella vendiya avasiyam illai.",note:"The main-verb pattern — auxiliary and 'to'."},
 {en:"How dare you speak to me like that?",ta:"என்னிடம் அப்படிப் பேச உனக்கு எப்படித் துணிவு வந்தது?",tl:"Ennidam appadip pesa unakku eppadith thunivu vandhadhu?",note:"A fixed modal exclamation — no 'to', no auxiliary."},
 {en:"He dared to contradict the senior officer.",ta:"மூத்த அதிகாரியை மறுத்துப் பேச அவர் துணிந்தார்.",tl:"Mooththa adhigaariyai maruththup pesa avar thunindhaar.",note:"The main-verb pattern — -ed and 'to'."},
 {en:"You need not have waited for me so long.",ta:"நீங்கள் எனக்காக இவ்வளவு நேரம் காத்திருக்க வேண்டியதில்லை.",tl:"Neengal enakkaaga ivvalavu neram kaaththirukka vendiyadhillai.",note:"You did wait, but it was unnecessary."}],

 s8:[
 "He need not to go there today.|He need not go there today.|The modal 'need' takes no 'to'.",
 "He needs not go there today.|He does not need to go there today.|With -s you must use the full main-verb pattern.",
 "Does he need go there today?|Does he need to go there today?|The main-verb pattern requires 'to'.",
 "How dares he speak to me like that?|How dare he speak to me like that?|'How dare' is a fixed modal pattern.",
 "He dared contradict the senior officer.|He dared to contradict the senior officer.|The main verb 'dare' takes 'to'.",
 "She do not dare to answer back.|She does not dare to answer back.|The auxiliary must agree with the subject.",
 "You need not waited for me so long.|You need not have waited for me so long.|A wasted past action requires 'need not have + V3'.",
 "Nobody dare to question his authority.|Nobody dare question his authority.|The modal 'dare' takes no 'to'.",
 "He need not attends the meeting tomorrow.|He need not attend the meeting tomorrow.|The modal takes the base form.",
 "She did not need come so early today.|She did not need to come so early today.|The main-verb pattern requires 'to'."],

 s9:[
 "Fill in the Blank|You ____ not worry about the fees, as the scholarship covers everything.|need;needs|0|The modal 'need' takes no -s.",
 "Find the Error|He need not (A) to attend the meeting (B) tomorrow as (C) it has been postponed (D).|A;B;C;D|1|Part B. The modal 'need' takes no 'to' → 'need not attend'.",
 "Sentence Improvement|How dares he question my decision in front of the whole department?|How dares he question;How dare he question;How dares he to question|1|'How dare' is a fixed modal pattern with no -s.",
 "Fill in the Blank|She does not ____ to submit the form again since it is already on file.|need;needs|0|After 'does not', use the base form.",
 "Find the Error|Nobody dared (A) question his authority (B) in the office (C) that morning (D).|A;B;C;D|0|Part A. The main verb 'dared' requires 'to' → 'dared to question'."],

 s10:{
  en:"The exam never gives you a clean modal or a clean main verb — it gives you a HYBRID. 'He need not to go' and 'He needs not go' each take half of one pattern and half of the other, and both look plausible. The cure is to decide the pattern FIRST and then complete it consistently.",
  ta:"தேர்வு உங்களுக்கு ஒரு தூய modal-ஐயோ தூய main verb-ஐயோ ஒருபோதும் தருவதில்லை — அது உங்களுக்கு ஒரு கலப்பினத்தைத் தருகிறது. 'He need not to go' மற்றும் 'He needs not go' ஒவ்வொன்றும் ஒரு அமைப்பின் பாதியையும் மற்றொன்றின் பாதியையும் எடுக்கின்றன, இரண்டுமே நம்பத்தகுந்ததாகத் தெரிகின்றன. தீர்வு முதலில் அமைப்பைத் தீர்மானித்து, பிறகு அதை நிலையாக முடிப்பதுதான்.",
  tl:"Thervu ungalukku oru thooya modal-aiyo thooya main verb-aiyo orupodhum tharuvadhillai — adhu ungalukku oru kalappinaththaith tharugiradhu. Theervu mudhalil amaippaith theermaaniththu, piragu adhai nilaiyaaga mudippadhudhaan."},

 s11:{
  en:"PICK ONE PATTERN AND FINISH IT. Modal: need not go. Main verb: does not need to go.",
  ta:"ஒரு அமைப்பைத் தேர்ந்தெடுத்து அதை முடியுங்கள். Modal: need not go. Main verb: does not need to go.",
  tl:"Oru amaippaith therndhedhuththu adhai mudiyungal. Modal: need not go. Main verb: does not need to go.",
  vis:"      TWO COLUMNS — NEVER MIX\n\n   ┌──────────────────┬──────────────────────┐\n   │ MODAL            │ MAIN VERB            │\n   ├──────────────────┼──────────────────────┤\n   │ need not go      │ does not need to go  │\n   │ Need he go?      │ Does he need to go?  │\n   │ dare not speak   │ does not dare to speak│\n   │ How dare you!    │ He dared to ask.     │\n   └──────────────────┴──────────────────────┘\n\n   ⚠ THE HYBRIDS SSC PLANTS:\n     need not TO go     ✘\n     needS not go       ✘\n     Does he need go?   ✘\n     dared question     ✘\n\n   ⚠ NEED NOT HAVE + V3:\n     You need not have waited.\n     (you waited — it was pointless)"},

 s13:[
 "He need not ____ , since the meeting ____ already been postponed.|to attend-has;attend-has;attend-had|1|The modal takes no 'to'. 'Already' with no past marker → HAS BEEN.",
 "How dare he ____ my decision, when neither of the officers ____ objected?|questions-have;question-has;question-have|1|A fixed modal pattern → QUESTION. 'Neither of' is singular → HAS (SVA Rule 50).",
 "You need not ____ waited, for I ____ told you that I ____ be late.|have-had-would;—-have-will;have-had-will|0|A wasted past action → NEED NOT HAVE. A past reporting verb shifts 'will' → WOULD (Rule 56).",
 "She does not need ____ come early, but she ought ____ inform the office.|to-to;—-—;to-—|0|The main-verb pattern takes 'to'. 'Ought' also keeps its 'to'.",
 "Nobody dared ____ him, and each of the clerks ____ silent throughout ____ meeting.|question-remained-the;to question-remained-the;to question-remain-a|1|The main verb 'dared' takes 'to'. 'Each of' is singular → REMAINED."],

 s14:{
  rule:"NEED and DARE work as modals in negatives and questions, and as main verbs elsewhere. Never mix the patterns.",
  formula:"MODAL: need not go · Need he go? · dare not speak · How dare you\nMAIN VERB: does not need to go · Does he need to go? · dared to ask\nNEED NOT HAVE + V3 = a wasted past action",
  memory:"Pick one column and finish it. Modal takes no 'to'; main verb takes 'to'.",
  ta:"ஒரு column-ஐ தேர்ந்தெடுத்து முடிங்க. Modal-க்கு 'to' இல்ல; main verb-க்கு 'to' வரும்.",
  tl:"Oru column-ai therndhedhuththu mudinga. Modal-kku 'to' illa; main verb-kku 'to' varum.",
  mistake:"Writing 'He need not to go' or 'He needs not go' — half of each pattern.",
  exam:"SSC CGL / CHSL and Bank — the hybrid form is what is always planted."},

 s15:[
 {ta:"இந்த rule கொஞ்சம் வித்தியாசமானது. NEED மற்றும் DARE — இந்த ரெண்டு வார்த்தையும் ரெண்டு வேடம் போடும். சில நேரம் modal மாதிரி, சில நேரம் சாதாரண வினைச்சொல் மாதிரி.",
  tl:"Indha rule konjam viththiyaasamaanadhu. NEED matrum DARE — indha rendu vaarththaiyum rendu vedam podum. Sila neram modal maadhiri, sila neram saadhaarana vinaichol maadhiri."},
 {ta:"Modal-ஆ வரும்போது: 'He NEED NOT go.' கவனிங்க — -s இல்ல, 'to' இல்ல. Rule 63-ல படிச்ச modal விதி அப்படியே பொருந்துது. 'NEED he go?' — கேள்வியிலயும் அப்படித்தான்.",
  tl:"Modal-aa varumbodhu: 'He NEED NOT go.' Kavaninga — -s illa, 'to' illa. Rule 63-la padicha modal vidhi appadiye porundhudhu. 'NEED he go?' — kelviyilayum appadidhaan."},
 {ta:"சாதாரண வினைச்சொல்லா வரும்போது: 'He DOES NOT NEED TO go.' இப்போ 'does' வந்திடுச்சு, 'to'-ம் வந்திடுச்சு. இது சாதாரண வினைச்சொல் அமைப்பு. 'Does he NEED TO go?' — கேள்வியிலயும் அப்படித்தான்.",
  tl:"Saadhaarana vinaicholaa varumbodhu: 'He DOES NOT NEED TO go.' Ippo 'does' vandhidichu, 'to'-um vandhidichu. Idhu saadhaarana vinaichol amaippu."},
 {ta:"இப்போ SSC-ஓட உண்மையான தந்திரம் சொல்லுறேன். அவங்க தூய modal-ஐயோ, தூய main verb-ஐயோ தர மாட்டாங்க. அவங்க கலப்பினம் தருவாங்க! 'He need not TO go' — 'need not' modal, ஆனா 'to' main verb. பாதி பாதி. தப்பு!",
  tl:"Ippo SSC-oda unmaiyaana thandhiram solluren. Avanga thooya modal-aiyo, thooya main verb-aiyo thara maattaanga. Avanga kalappinam tharuvaanga! 'He need not TO go' — paadhi paadhi. Thappu!"},
 {ta:"இன்னொரு கலப்பினம்: 'He needS not go' — 's' main verb, ஆனா 'to' இல்ல. இதுவும் பாதி பாதி. தப்பு! சரியான வழி — ஒரு அமைப்பை தேர்ந்தெடுத்து அதை முழுசா முடிங்க. Modal-னா 'need not go'. Main verb-னா 'does not need to go'. நடுவுல நிக்காதீங்க.",
  tl:"Innoru kalappinam: 'He needS not go' — 's' main verb, aanaa 'to' illa. Idhuvum paadhi paadhi. Thappu! Sariyaana vazhi — oru amaippai therndhedhuththu adhai muzhusaa mudinga."},
 {ta:"கடைசியா 'DARE' பத்தி. 'How DARE you speak to me like that!' — இது ஒரு நிலையான modal அமைப்பு. -s இல்ல, 'to' இல்ல, auxiliary இல்ல. 'How dares he' அப்படின்னு எழுதக்கூடாது. ஆனா main verb-ஆ வரும்போது: 'He DARED TO contradict the officer' — 'dared' மற்றும் 'to' ரெண்டும் வரும். மேலும் ஒரு நுட்பமான வடிவம் — 'You NEED NOT HAVE waited' அப்படின்னா நீங்க காத்திருந்தீங்க, ஆனா தேவையில்லாம. வீணா போன செயல். இதை SSC அடிக்கடி கேட்கும்.",
  tl:"Kadaisiyaa 'DARE' paththi. 'How DARE you speak to me like that!' — idhu oru nilaiyaana modal amaippu. Aanaa main verb-aa varumbodhu: 'He DARED TO contradict the officer'. Melum oru nutpamaana vadivam — 'You NEED NOT HAVE waited' appadinnaa neenga kaaththirundheenga, aanaa thevaiyillaama."}]},

/* ========== RULE 69 ========== */
{n:69,rc:"MOD-07",d:"Hard",t:"USED TO for Past Habits, BE USED TO for Being Accustomed",
 tam:"Used to + V1 = முன்பு இருந்த பழக்கம் · Be used to + V-ing = பழகிவிட்ட நிலை",
 s1:{en:"USED TO + V1 describes a DISCONTINUED past habit. BE or GET USED TO + V-ing means to be ACCUSTOMED to something. In the second structure 'to' is a preposition, so a gerund follows it.",
  ta:"USED TO + V1 நிறுத்தப்பட்ட ஒரு கடந்தகாலப் பழக்கத்தை விவரிக்கிறது. BE அல்லது GET USED TO + V-ing என்றால் ஒன்றுக்குப் பழகியிருத்தல். இரண்டாவது அமைப்பில் 'to' ஒரு முன்னுருபு, எனவே அதற்குப் பின் ஒரு gerund வருகிறது.",
  tl:"USED TO + V1 niruththappatta oru kadandhagaalap pazhakkaththai vivarikkiradhu. BE alladhu GET USED TO + V-ing endraal ondrukkup pazhagiyiruththal. Irandaavadhu amaippil 'to' oru munnurubu.",
  formula:"USED TO + V1  →  a past habit, now stopped\n  He USED TO smoke, but he quit.\n  She USED TO live in Delhi.\n\nBE / GET USED TO + V-ing  →  accustomed\n  I AM USED TO waking up early.\n  She GOT USED TO living alone.\n\n⚠ THE SWITCH: is there am/is/are/get before it?"},

 s2:[
 {h:"The presence of BE changes everything",
  en:"'He used to smoke' — no 'be', so it is a past habit. 'He is used to smoking' — 'is' appears, so it means he is accustomed to it. Look for am, is, are, was, were or get immediately before 'used to'.",
  ta:"BE இருப்பது எல்லாவற்றையும் மாற்றுகிறது. 'He used to smoke' — 'be' இல்லை, எனவே இது ஒரு கடந்தகாலப் பழக்கம். 'He is used to smoking' — 'is' தோன்றுகிறது, எனவே அவர் அதற்குப் பழகியிருக்கிறார் என்று பொருள். 'Used to'-க்கு உடனே முன் am, is, are, was, were அல்லது get இருக்கிறதா என்று பாருங்கள்.",
  tl:"BE iruppadhu ellaavatraiyum maatrugiradhu. 'He used to smoke' — 'be' illai, enave idhu oru kadandhagaalap pazhakkam. 'He is used to smoking' — 'is' thondrugiradhu."},
 {h:"Why the second takes a gerund",
  en:"In 'be used to', the word 'to' is a PREPOSITION, not part of an infinitive. Prepositions are always followed by gerunds — 'used to WAKING', 'accustomed to WORKING', 'look forward to MEETING'. Same rule every time.",
  ta:"இரண்டாவது ஏன் gerund எடுக்கிறது? 'Be used to'-ல், 'to' என்ற சொல் ஒரு முன்னுருபு, ஒரு infinitive-ன் பகுதி அல்ல. முன்னுருபுகளுக்குப் பின் எப்போதும் gerund வரும் — 'used to WAKING', 'accustomed to WORKING', 'look forward to MEETING'. ஒவ்வொரு முறையும் அதே விதி.",
  tl:"Irandaavadhu yen gerund edukkiradhu? 'Be used to'-l, 'to' endra sol oru munnurubu, oru infinitive-in paguthi alla. Munnurubugalukkup pin eppodhum gerund varum."},
 {h:"WOULD also expresses past habits",
  en:"'He would visit us every Sunday' means the same as 'He used to visit us'. But 'would' works only for repeated ACTIONS, not for past STATES. 'He used to be rich' is correct; 'He would be rich' is not.",
  ta:"WOULD-ம் கடந்தகாலப் பழக்கங்களை வெளிப்படுத்துகிறது. 'He would visit us every Sunday' என்பது 'He used to visit us' என்பதற்குச் சமம். ஆனால் 'would' மீண்டும் மீண்டும் நிகழும் செயல்களுக்கு மட்டுமே வேலை செய்யும், கடந்தகால நிலைகளுக்கு அல்ல. 'He used to be rich' சரி; 'He would be rich' சரி அல்ல.",
  tl:"WOULD-um kadandhagaalap pazhakkangalai velippaduththugiradhu. Aanaal 'would' meendum meendum nigazhum seyalgalukku mattume velai seyyum, kadandhagaala nilaigalukku alla."},
 {h:"The negative and question forms",
  en:"'He did not use to smoke' and 'Did he use to smoke?' — after 'did', the -d is dropped: 'use to', not 'used to'. This is the same base-form rule from Rule 57.",
  ta:"எதிர்மறை மற்றும் கேள்வி வடிவங்கள். 'He did not use to smoke' மற்றும் 'Did he use to smoke?' — 'did'-க்குப் பின், -d விடப்படுகிறது: 'use to', 'used to' அல்ல. இது Rule 57-லிருந்து அதே அடிப்படை வடிவ விதி.",
  tl:"Edhirmarai matrum kelvi vadivangal. 'He did not use to smoke' matrum 'Did he use to smoke?' — 'did'-kkup pin, -d vidappadugiradhu: 'use to', 'used to' alla."}],

 s3:[
 {h:"Look for BE before USED TO",
  d:"   NO 'be' before it   →  PAST HABIT  →  + V1\n     He USED TO smoke.\n     (he does not smoke now)\n\n   'be' or 'get' before it →  ACCUSTOMED →  + V-ing\n     He IS USED TO smoking.\n     She GOT USED TO living alone.\n\n   ⚠ am · is · are · was · were · get\n     Any of these = the -ing version."},
 {h:"Why one takes V1 and the other -ing",
  d:"   USED TO smoke\n     'to' = part of the INFINITIVE\n     → base form follows\n\n   USED TO smokING\n     'to' = a PREPOSITION\n     → gerund follows\n\n   Same three letters, two different jobs."},
 {h:"Used to versus would",
  d:"   REPEATED ACTION  →  both work\n     He USED TO visit us.   ✔\n     He WOULD visit us.     ✔\n\n   PAST STATE       →  only 'used to'\n     He USED TO be rich.    ✔\n     He WOULD be rich.      ✘\n\n   ⚠ AFTER 'DID', DROP THE -D:\n     Did he USE TO smoke?   ✔"}],

 s4:{
 wrong:["\"'Used to' always takes -ing.\" — Only when 'be' or 'get' comes before it.",
  "\"'I am used to wake up early' is correct.\" — After 'be used to', use a gerund.",
  "\"'He would be rich in those days' is fine.\" — 'Would' cannot express a past state.",
  "\"'Did he used to smoke?' keeps the past tense.\" — After 'did', use 'use to'."],
 right:["Look for am, is, are, was, were or get before 'used to'.",
  "Found one → gerund. Not found → base form V1.",
  "'Would' works only for repeated actions, not for states.",
  "After 'did', write 'use to' without the -d."]},

 s5:[
 {en:"He used to smoke, but he quit last year.",ta:"அவர் முன்பு புகைபிடிப்பார், ஆனால் கடந்த ஆண்டு விட்டுவிட்டார்.",tl:"Avar munbu pugaipidippaar, aanaal kadandha aandu vittuvittaar.",note:"A discontinued past habit → USED TO + V1."},
 {en:"I am used to waking up early every day.",ta:"தினமும் சீக்கிரம் எழுவது எனக்குப் பழகிவிட்டது.",tl:"Dhinamum seekkiram ezhuvadhu enakkup pazhagividdadhu.",note:"'Am' before it → accustomed → gerund WAKING."},
 {en:"She got used to living alone after some time.",ta:"சிறிது காலத்திற்குப் பிறகு தனியாக வாழ்வது அவருக்குப் பழகிவிட்டது.",tl:"Siridhu kaalaththirkup piragu thaniyaaga vaazhvadhu avarukkup pazhagividdadhu.",note:"'Got' before it → accustomed → gerund LIVING."},
 {en:"He would visit us every Sunday in those days.",ta:"அந்த நாட்களில் அவர் ஒவ்வொரு ஞாயிற்றுக்கிழமையும் எங்களைப் பார்க்க வருவார்.",tl:"Andha naatkalil avar ovvoru gnaayitrukkizhamaiyum engalaip paarkka varuvaar.",note:"A repeated past action → WOULD also works."},
 {en:"Did he use to play cricket in college?",ta:"அவர் கல்லூரியில் கிரிக்கெட் விளையாடுவாரா?",tl:"Avar kalluriyil cricket vilaiyaaduvaaraa?",note:"After 'did', the -d is dropped → USE TO."}],

 s7:[

 "I am used to ____ up early.|waking|Easy|'Am' before it → gerund.",
 "She got used to ____ alone.|living|Easy|'Got' before it → gerund.",
 "He would ____ us every Sunday.|visit|Medium|A repeated past action.",
 "Did he ____ to play cricket?|use|Medium|After 'did', drop the -d.",
 "They used to ____ in that village.|live|Medium|A past habit → base form.",
 "He is used to ____ hard all day.|working|Medium|'Is' before it → gerund.",
 "She used to ____ very shy as a child.|be|Hard|A past state → only 'used to' works.",
 "We are getting used to ____ in a city.|living|Hard|'Getting' before it → gerund.",
 "He did not ____ to drink coffee.|use|Hard|After 'did not', drop the -d.",
 "I am not used to ____ so late.|sleeping|Hard|'Am not' before it → gerund.",
 "My grandfather used to ____ us stories.|tell|Expert|A past habit → base form.",
 "She has got used to ____ Tamil now.|speaking|Expert|'Got' before it → gerund.",
 "They would ____ to the temple daily then.|go|Expert|A repeated past action.",
 "He is used to ____ criticised in public.|being|Expert|'Is used to' plus the passive gerund."],

 s9:[
 "Fill in the Blank|My grandfather ____ tell us wonderful stories when we were small children.|used to;was used to|0|A past habit takes 'used to + V1'.",
 "Find the Error|She is used to (A) wake up at four (B) in the morning (C) for her studies (D).|A;B;C;D|1|Part B. 'Be used to' requires a gerund → 'waking up'.",
 "Sentence Improvement|Did he used to work in this office before he was transferred to Chennai?|Did he used to work;Did he use to work;Did he uses to work|1|After 'did', drop the -d.",
 "Fill in the Blank|After living in Delhi for a year, she finally got used to ____ Hindi.|speak;speaking|1|'Get used to' requires a gerund.",
 "Find the Error|He would be (A) very rich (B) in those days (C) but lost everything later (D).|A;B;C;D|0|Part A. 'Would' cannot express a past state → 'He used to be'."],

 s10:{
  en:"The whole question is whether a form of BE stands before 'used to'. 'He used to smoke' and 'He is used to smoking' look almost identical, and the difference is one tiny word. The exam removes or adds that word and offers the wrong verb form. The second trap is 'Did he used to...' — after 'did', the -d must go.",
  ta:"முழு கேள்வியும் 'used to'-க்கு முன் BE-ன் ஒரு வடிவம் நிற்கிறதா என்பதுதான். 'He used to smoke' மற்றும் 'He is used to smoking' கிட்டத்தட்ட ஒரே மாதிரி தெரிகின்றன, வித்தியாசம் ஒரு சிறிய சொல். தேர்வு அந்தச் சொல்லை நீக்குகிறது அல்லது சேர்க்கிறது, தவறான வினைச்சொல் வடிவத்தைத் தருகிறது. இரண்டாவது பொறி 'Did he used to...' — 'did'-க்குப் பின் -d போக வேண்டும்.",
  tl:"Muzhu kelviyum 'used to'-kku mun BE-in oru vadivam nirkiradhaa enbadhudhaan. 'He used to smoke' matrum 'He is used to smoking' kittaththatta ore maadhiri therigindrana. Irandaavadhu pori 'Did he used to...'."},

 s11:{
  en:"IS THERE A 'BE' BEFORE IT? Yes → gerund. No → base form V1.",
  ta:"அதற்கு முன் ஒரு 'BE' இருக்கிறதா? ஆம் → gerund. இல்லை → அடிப்படை வடிவம் V1.",
  tl:"Adharku mun oru 'BE' irukkiradhaa? Aam → gerund. Illai → adippadai vadivam V1.",
  vis:"      THE 'BE' TEST\n\n   Look immediately BEFORE 'used to':\n\n   ❌ NOTHING there\n      → PAST HABIT → base form V1\n      He USED TO smoke.\n\n   ✅ am · is · are · was · were · get\n      → ACCUSTOMED → gerund\n      He IS USED TO smokING.\n      She GOT USED TO livING alone.\n\n   ⚠ AFTER 'DID', DROP THE -D:\n      Did he USE TO smoke?   ✔\n      Did he USED TO smoke?  ✘\n\n   ⚠ 'WOULD' FOR ACTIONS ONLY:\n      He would visit us.     ✔ action\n      He would be rich.      ✘ state"},

 s13:[
 "He used to ____ heavily, but now he is used to ____ without cigarettes.|smoke-living;smoking-live;smoke-live|0|A past habit → SMOKE. 'Is used to' → LIVING.",
 "She got used to ____ alone after her children ____ abroad.|live-had settled;living-had settled;living-settled|1|'Got used to' → LIVING. The earlier past action → HAD SETTLED (Rule 54).",
 "Did he ____ to work here before he ____ transferred to ____ Delhi office?|used-was-the;use-was-the;use-were-a|1|After 'did', drop the -d. Passive past → WAS. Specific office → THE.",
 "My grandfather used to ____ us stories, and he would ____ for hours together.|tell-talking;telling-talk;tell-talk|2|Both 'used to' and 'would' take the base form.",
 "I am not used to ____ so late, and it is high time I ____ my routine.|sleep-changed;sleeping-changed;sleeping-change|1|'Am used to' → SLEEPING. 'It is high time' → CHANGED (Rule 60)."],

 s14:{
  rule:"USED TO + V1 is a discontinued past habit. BE or GET USED TO + V-ing means accustomed.",
  formula:"USED TO + V1 → past habit (He used to smoke)\nBE / GET USED TO + V-ing → accustomed (He is used to smoking)\nAfter 'did' → use to (drop the -d)",
  memory:"Is there a 'be' before it? Yes means -ing. No means V1.",
  ta:"அதுக்கு முன்னாடி 'be' இருக்கா? இருந்தா -ing. இல்லைன்னா V1.",
  tl:"Adhukku munnaadi 'be' irukkaa? Irundhaa -ing. Illainnaa V1.",
  mistake:"Writing 'I am used to wake up early' and 'Did he used to smoke?'.",
  exam:"SSC CGL / CHSL and Bank — the be-versus-no-be distinction is tested every year."},

 s15:[
 {ta:"இந்த rule-ல ஒரே வார்த்தை 'used to' ரெண்டு முழுக்க வேற அர்த்தம் தரும். வித்தியாசம் ஒரே ஒரு சின்ன வார்த்தை — அதுக்கு முன்னாடி 'be' இருக்கா இல்லையா.",
  tl:"Indha rule-la ore vaarththai 'used to' rendu muzhukka veru arththam tharum. Viththiyaasam ore oru chinna vaarththai — adhukku munnaadi 'be' irukkaa illaiyaa."},
 {ta:"'He USED TO smoke.' — இங்க 'be' இல்ல. அர்த்தம்? முன்னாடி புகைபிடிப்பாரு, இப்போ விட்டுட்டாரு. கடந்தகாலப் பழக்கம், இப்போ நிறுத்திட்டாரு. இதுக்கு அப்பறம் அடிப்படை வடிவம் — 'smoke'.",
  tl:"'He USED TO smoke.' — inga 'be' illa. Arththam? Munnaadi pugaipidippaaru, ippo vittuttaaru. Kadandhagaalap pazhakkam. Idhukku apparam adippadai vadivam — 'smoke'."},
 {ta:"இப்போ 'He IS used to smoking.' — இங்க 'is' வந்திடுச்சு! அர்த்தம் முழுசா மாறிடுச்சு. இப்போ அர்த்தம் — புகைபிடிக்கிறது அவருக்கு பழகிடுச்சு, அது அவருக்கு சாதாரணம். மேலும் இப்போ 'smoking' — -ing வடிவம்!",
  tl:"Ippo 'He IS used to smoking.' — inga 'is' vandhidichu! Arththam muzhusaa maaridichu. Ippo arththam — pugaipidikkiradhu avarukku pazhagidichu. Melum ippo 'smoking' — -ing vadivam!"},
 {ta:"ஏன் -ing? ஒரு அழகான காரணம் இருக்கு. 'Be used to'-ல இருக்கிற 'to' அப்படிங்கிறது முன்னுருபு (preposition), infinitive-ஓட பகுதி இல்ல. முன்னுருபுக்கு அப்பறம் எப்பவும் -ing வரும். 'Look forward to meetING', 'accustomed to workING', 'used to wakING'. அதே விதி.",
  tl:"Yen -ing? Oru azhagaana kaaranam irukku. 'Be used to'-la irukkira 'to' appadingiradhu munnurubu (preposition), infinitive-oda paguthi illa. Munnurubukku apparam eppavum -ing varum."},
 {ta:"அதனால ஒரு எளிய சோதனை — 'used to'-க்கு உடனே முன்னாடி பாருங்க. am, is, are, was, were, get, getting, got — இதுல ஏதாவது இருக்கா? இருந்தா -ing போடுங்க. இல்லைன்னா அடிப்படை வடிவம் V1 போடுங்க. இந்த ஒரு சோதனை போதும்.",
  tl:"Adhanaala oru eliya sodhanai — 'used to'-kku udane munnaadi paarunga. am, is, are, was, were, get, getting, got — idhula edhaavadhu irukkaa? Irundhaa -ing podunga. Illainnaa adippadai vadivam V1 podunga."},
 {ta:"கடைசியா ரெண்டு கூடுதல் விஷயம். ஒண்ணு — 'did'-க்கு அப்பறம் -d போடக்கூடாது. 'Did he USE to smoke?' — 'used' இல்ல. இது Rule 57-ல படிச்ச அதே விதி, did-க்கு அப்பறம் அடிப்படை வடிவம். ரெண்டு — 'would'-ம் கடந்தகாலப் பழக்கம் சொல்லும், ஆனா செயலுக்கு மட்டும்தான். 'He WOULD visit us every Sunday' சரி. ஆனா 'He WOULD be rich' தப்பு! நிலைக்கு (state) 'used to' மட்டும்தான் — 'He USED TO be rich.'",
  tl:"Kadaisiyaa rendu koodudhal vishayam. Onnu — 'did'-kku apparam -d podakkoodaadhu. 'Did he USE to smoke?' Rendu — 'would'-um kadandhagaalap pazhakkam sollum, aanaa seyalukku mattum-dhaan. 'He WOULD visit us' sari. Aanaa 'He WOULD be rich' thappu! Nilaikku 'used to' mattum-dhaan."}]},

/* ========== RULE 70 ========== */
{n:70,rc:"MOD-08",d:"Medium",t:"SHALL and WILL in Offers, Suggestions and Determination",
 tam:"Shall = I/We உடன் ஆலோசனை · Will = சாதாரண எதிர்காலம்",
 s1:{en:"SHALL is used with I and WE for OFFERS and SUGGESTIONS. With the second and third person it expresses COMMAND, PROMISE or DETERMINATION. WILL is the ordinary future marker everywhere else.",
  ta:"OFFERS மற்றும் SUGGESTIONS-க்கு I மற்றும் WE-உடன் SHALL பயன்படுத்தப்படுகிறது. இரண்டாம் மற்றும் மூன்றாம் நபருடன் அது கட்டளை, வாக்குறுதி அல்லது உறுதியை வெளிப்படுத்துகிறது. மற்ற எல்லா இடங்களிலும் WILL சாதாரண எதிர்காலக் குறியீடு.",
  tl:"OFFERS matrum SUGGESTIONS-kku I matrum WE-udan SHALL payanpaduththappadugiradhu. Irandaam matrum moondraam nabarudan adhu kattalai, vaakkurudhi alladhu urudhiyai velippaduththugiradhu.",
  formula:"SHALL with I / WE  →  offer or suggestion\n  SHALL I open the window?     (offer)\n  SHALL we begin the meeting?  (suggestion)\n\nSHALL with you / he / they  →  command, promise\n  You SHALL not enter this room. (command)\n  You SHALL be rewarded.         (promise)\n\nWILL  →  ordinary future\n  He WILL arrive tomorrow."},

 s2:[
 {h:"The classical rule reverses for emphasis",
  en:"In plain future, 'shall' goes with I and we, and 'will' with the rest. But when strong intention, command or promise is expressed, the pattern REVERSES: 'I WILL succeed' (determination), 'You SHALL obey' (command).",
  ta:"வலியுறுத்தலுக்கு பாரம்பரிய விதி தலைகீழாகிறது. வெறும் எதிர்காலத்தில், 'shall' I மற்றும் we-உடன், 'will' மற்றவற்றுடன். ஆனால் வலுவான நோக்கம், கட்டளை அல்லது வாக்குறுதி வெளிப்படுத்தப்படும்போது, அமைப்பு தலைகீழாகிறது: 'I WILL succeed' (உறுதி), 'You SHALL obey' (கட்டளை).",
  tl:"Valiyuruththalukku paaramparya vidhi thalaigeezhaagiradhu. Verum edhirkaalaththil, 'shall' I matrum we-udan, 'will' matravatrudan. Aanaal valuvaana nokkam, kattalai alladhu vaakkurudhi velippaduththappadumbodhu, amaippu thalaigeezhaagiradhu."},
 {h:"SHALL I and SHALL WE are the tested forms",
  en:"'Shall I open the window?' offers help. 'Shall we begin?' suggests an action together. These two are what SSC actually tests — questions with I and we always take 'shall', never 'will'.",
  ta:"SHALL I மற்றும் SHALL WE-தான் சோதிக்கப்படும் வடிவங்கள். 'Shall I open the window?' உதவியை முன்வைக்கிறது. 'Shall we begin?' ஒன்றாகச் செய்யும் ஒரு செயலைப் பரிந்துரைக்கிறது. SSC உண்மையில் இவை இரண்டையும்தான் சோதிக்கிறது — I மற்றும் we-உடன் வரும் கேள்விகள் எப்போதும் 'shall' எடுக்கும், ஒருபோதும் 'will' அல்ல.",
  tl:"SHALL I matrum SHALL WE-dhaan sodhikkappadum vadivangal. 'Shall I open the window?' udhaviyai munvaikkiradhu. 'Shall we begin?' ondraagach seyyum oru seyalaip parindhuraikkiradhu."},
 {h:"The question tag for LET US is SHALL WE",
  en:"'Let us go, shall we?' — this fixed tag comes straight from this rule. It appears in question-tag questions as well as modal questions, so learn it here.",
  ta:"LET US-க்கான கேள்விக் குறிப்பு SHALL WE. 'Let us go, shall we?' — இந்த நிலையான குறிப்பு நேரடியாக இந்த விதியிலிருந்து வருகிறது. இது modal கேள்விகளிலும் question-tag கேள்விகளிலும் வருகிறது, எனவே இங்கேயே கற்றுக்கொள்ளுங்கள்.",
  tl:"LET US-kkaana kelvik kurippu SHALL WE. 'Let us go, shall we?' — indha nilaiyaana kurippu neradiyaaga indha vidhiyilirundhu varugiradhu."},
 {h:"Modern spoken English uses WILL almost everywhere",
  en:"In everyday speech 'Will I open the window?' would be unusual, and most people simply say 'I'll' for everything. But SSC, Banking and CDS still follow the classical rule, so learn it for the exam.",
  ta:"நவீன பேச்சு ஆங்கிலம் கிட்டத்தட்ட எல்லா இடத்திலும் WILL பயன்படுத்துகிறது. அன்றாடப் பேச்சில் 'Will I open the window?' அசாதாரணமாக இருக்கும், பெரும்பாலானவர்கள் எல்லாவற்றுக்கும் 'I'll' என்று சொல்கிறார்கள். ஆனால் SSC, Banking, CDS இன்னும் பாரம்பரிய விதியைப் பின்பற்றுகின்றன, எனவே தேர்வுக்காக அதைக் கற்றுக்கொள்ளுங்கள்.",
  tl:"Naveena pechu Aangilam kittaththatta ellaa idaththilum WILL payanpaduththugiradhu. Aanaal SSC, Banking, CDS innum paaramparya vidhiyaip pinpatrugindrana, enave thervukkaaga adhaik katrukkollungal."}],

 s3:[
 {h:"The classical table",
  d:"   PLAIN FUTURE\n     I / We        →  SHALL\n     You/He/They   →  WILL\n\n   EMPHASIS (determination, command, promise)\n     I / We        →  WILL     ← reversed\n     You/He/They   →  SHALL    ← reversed\n\n   I WILL succeed.     (determination)\n   You SHALL obey.     (command)"},
 {h:"Offers and suggestions",
  d:"   🤝 OFFER      : SHALL I carry your bag?\n                   SHALL I open the window?\n\n   💡 SUGGESTION : SHALL we begin?\n                   SHALL we go for a walk?\n\n   Both use I or WE, both take SHALL.\n   'Will I open the window?' sounds wrong."},
 {h:"The Let us tag",
  d:"   Let us go, SHALL WE?        ✔\n   Let us go, WILL WE?         ✘\n\n   This fixed tag comes from the same rule\n   and appears in question-tag questions too.\n\n   ⚠ MODERN SPEECH USES 'WILL' EVERYWHERE,\n     but SSC follows the classical rule."}],

 s4:{
 wrong:["\"'Will I open the window?' is a normal offer.\" — Offers with I take 'shall'.",
  "\"'Shall' is old-fashioned and never used.\" — SSC still tests it.",
  "\"'Let us go, will we?' is the correct tag.\" — The fixed tag is 'shall we'.",
  "\"'I shall succeed whatever happens' shows determination.\" — Determination with I takes 'will'."],
 right:["An offer or suggestion with I or we → shall.",
  "Plain future with he, she, they, you → will.",
  "Strong determination with I → will. A command to you → shall.",
  "The tag for 'let us' is always 'shall we'."]},

 s5:[
 {en:"Shall I carry your bag for you?",ta:"உங்கள் பையை நான் தூக்கிச் செல்லட்டுமா?",tl:"Ungal paiyai naan thookkich sellattumaa?",note:"An offer with I → SHALL."},
 {en:"Shall we go for a walk this evening?",ta:"இன்று மாலை நாம் நடைப்பயிற்சிக்குச் செல்லலாமா?",tl:"Indru maalai naam nadaippayirchikkuch sellalaamaa?",note:"A suggestion with we → SHALL."},
 {en:"He will arrive tomorrow morning by train.",ta:"அவர் நாளை காலை ரயிலில் வருவார்.",tl:"Avar naalai kaalai rayilil varuvaar.",note:"Plain future with 'he' → WILL."},
 {en:"You shall not enter this room without permission.",ta:"அனுமதி இல்லாமல் நீங்கள் இந்த அறைக்குள் நுழையக் கூடாது.",tl:"Anumadhi illaamal neengal indha araikkul nuzhaiyak koodaadhu.",note:"A command to 'you' → SHALL."},
 {en:"Let us begin the meeting, shall we?",ta:"கூட்டத்தைத் தொடங்குவோமா?",tl:"Koottaththaith thodanguvomaa?",note:"The fixed tag for 'let us' is 'shall we'."}],

 s10:{
  en:"Modern English has almost abandoned 'shall', so 'Will I open the window?' feels perfectly normal. SSC still follows the classical rule, and 'Shall I' and 'Shall we' are what it tests. The second trap is the reversal: for plain future, 'I shall' is right, but for determination, 'I will' is right. The third is the 'let us' tag, which is always 'shall we'.",
  ta:"நவீன ஆங்கிலம் 'shall'-ஐ கிட்டத்தட்ட கைவிட்டுவிட்டது, எனவே 'Will I open the window?' முற்றிலும் இயல்பாகத் தோன்றுகிறது. SSC இன்னும் பாரம்பரிய விதியைப் பின்பற்றுகிறது, 'Shall I' மற்றும் 'Shall we'-தான் அது சோதிக்கிறது. இரண்டாவது பொறி தலைகீழாக்கம்: வெறும் எதிர்காலத்திற்கு 'I shall' சரி, ஆனால் உறுதிக்கு 'I will' சரி. மூன்றாவது 'let us' குறிப்பு, அது எப்போதும் 'shall we'.",
  tl:"Naveena Aangilam 'shall'-ai kittaththatta kaivittuvittadhu, enave 'Will I open the window?' mutrilum iyalbaagath thondrugiradhu. SSC innum paaramparya vidhiyaip pinpatrugiradhu."},

 s11:{
  en:"OFFER OR SUGGESTION WITH I OR WE → SHALL. Everything else → WILL.",
  ta:"I அல்லது WE-உடன் முன்வைத்தல் அல்லது பரிந்துரை → SHALL. மற்ற அனைத்தும் → WILL.",
  tl:"I alladhu WE-udan munvaiththal alladhu parindhurai → SHALL. Matra anaiththum → WILL.",
  vis:"      THE CLASSICAL TABLE\n\n   PLAIN FUTURE\n   ┌──────────────┬────────┐\n   │ I / We       │ SHALL  │\n   │ You/He/They  │ WILL   │\n   └──────────────┴────────┘\n\n   EMPHASIS — the table REVERSES\n   ┌──────────────┬────────┐\n   │ I / We       │ WILL   │ determination\n   │ You/He/They  │ SHALL  │ command, promise\n   └──────────────┴────────┘\n\n   ⚠ WHAT SSC ACTUALLY TESTS:\n     SHALL I ...?   (offer)\n     SHALL WE ...?  (suggestion)\n     Let us go, SHALL WE?  (fixed tag)"},

 s13:[
 "____ I open the window, or ____ you prefer that it ____ closed?|Shall-would-stayed;Will-will-stays;Shall-would-stays|2|An offer with I → SHALL. A polite question → WOULD. A time clause takes the present → STAYS.",
 "____ we begin now, since neither of the guests ____ arrived yet?|Shall-have;Will-has;Shall-has|2|A suggestion with we → SHALL. 'Neither of' is fixed singular → HAS (SVA Rule 50).",
 "Let us go for a walk, ____ we, before ____ sun ____?|shall-the-sets;will-a-sets;shall-the-will set|0|The fixed tag → SHALL WE. Unique object → THE sun. A time clause bans 'will' → SETS (Rule 55).",
 "You ____ be rewarded, and by next month you ____ have received ____ cheque.|will-shall-a;shall-will-the;shall-will-a|1|A promise to 'you' → SHALL. Future perfect → WILL HAVE received. Specific cheque → THE.",
 "____ I help you, or ____ you rather that I ____ you alone?|Shall-would-left;Will-would-leave;Shall-would-left|0|An offer → SHALL I. 'Would rather' takes the past form → LEFT."],

 s14:{
  rule:"SHALL goes with I and we for offers and suggestions; WILL is the ordinary future elsewhere.",
  formula:"SHALL I ...? → offer | SHALL WE ...? → suggestion\nPlain future: I/we shall · you/he/they will\nEmphasis reverses: I WILL (determination) · you SHALL (command)\nLet us go, SHALL WE?",
  memory:"Offer or suggestion with I or we takes SHALL. Everything else takes WILL.",
  ta:"I அல்லது We-ஓட முன்வைப்பு அல்லது பரிந்துரை-ன்னா SHALL. மத்ததெல்லாம் WILL.",
  tl:"I alladhu We-oda munvaippu alladhu parindhurai-nnaa SHALL. Maththadhellaam WILL.",
  mistake:"Writing 'Will I open the window?' and 'Let us go, will we?'.",
  exam:"SSC CGL / CHSL and Bank — 'Shall I' and 'Shall we' are the tested forms."},

 s15:[
 {ta:"நாம Modal Verbs module-ஓட கடைசி rule-க்கு வந்துட்டோம். இது கொஞ்சம் பழைய பாணி விதி, ஆனா SSC இன்னும் இதைத்தான் பின்பற்றுது.",
  tl:"Naama Modal Verbs module-oda kadaisi rule-kku vandhuttom. Idhu konjam pazhaiya paani vidhi, aanaa SSC innum idhaith-thaan pinpatrudhu."},
 {ta:"பாரம்பரிய விதி இதுதான்: வெறும் எதிர்காலத்துக்கு — I மற்றும் We-க்கு 'shall', மத்த எல்லாத்துக்கும் 'will'. 'I shall go tomorrow.' 'He will go tomorrow.'",
  tl:"Paaramparya vidhi idhudhaan: verum edhirkaalaththukku — I matrum We-kku 'shall', maththa ellaaththukkum 'will'. 'I shall go tomorrow.' 'He will go tomorrow.'"},
 {ta:"ஆனா SSC உண்மையில் என்ன கேட்குது தெரியுமா? கேள்வி வடிவம். 'SHALL I open the window?' — நான் ஜன்னலை திறக்கட்டுமா? இது ஒரு முன்வைப்பு (offer). 'SHALL WE begin?' — நாம ஆரம்பிக்கலாமா? இது ஒரு பரிந்துரை (suggestion). இந்த ரெண்டும்தான் அதிகமா வரும்.",
  tl:"Aanaa SSC unmaiyil enna ketkudhu theriyumaa? Kelvi vadivam. 'SHALL I open the window?' — idhu oru offer. 'SHALL WE begin?' — idhu oru suggestion. Indha rendum-dhaan adhigamaa varum."},
 {ta:"நமக்கு இது கஷ்டமா இருக்கும், ஏன்னா நவீன ஆங்கிலத்துல 'shall' கிட்டத்தட்ட காணாம போயிடுச்சு. நாம 'Will I open the window?' அப்படித்தான் சொல்லுவோம், 'I'll' அப்படித்தான் சொல்லுவோம். ஆனா தேர்வுல பாரம்பரிய விதிதான்.",
  tl:"Namakku idhu kashtamaa irukkum, yennaa naveena Aangilaththula 'shall' kittaththatta kaanaama poyidichu. Naama 'Will I open the window?' appadidhaan solluvom. Aanaa thervula paaramparya vidhidhaan."},
 {ta:"இப்போ ஒரு சுவாரஸ்யமான விஷயம் — வலியுறுத்தல் வரும்போது அட்டவணை தலைகீழாகும்! வெறும் எதிர்காலம்: 'I shall go.' ஆனா உறுதி: 'I WILL succeed whatever happens!' — இங்க 'will' வரும். அதே மாதிரி வெறும் எதிர்காலம்: 'You will go.' ஆனா கட்டளை: 'You SHALL obey!' — இங்க 'shall' வரும்.",
  tl:"Ippo oru suvaarasyamaana vishayam — valiyuruththal varumbodhu attavanai thalaigeezhaagum! Verum edhirkaalam: 'I shall go.' Aanaa urudhi: 'I WILL succeed!' Adhe maadhiri 'You will go' aanaa kattalai: 'You SHALL obey!'"},
 {ta:"கடைசியா ஒரு நிலையான வடிவம் ஞாபகம் வெச்சுக்கோங்க — 'Let us go, SHALL WE?' இது ஒரு fixed tag. 'Will we' அப்படின்னு ஒருபோதும் வராது. இது Module 10-ல question tags படிக்கும்போதும் வரும். இப்பவே கத்துக்கிட்டா, அப்போ சுலபமா இருக்கும். Modal Verbs module இத்தோட முடிஞ்சது — எட்டு rule-ம் நீங்க கத்துக்கிட்டீங்க.",
  tl:"Kadaisiyaa oru nilaiyaana vadivam gnaabagam vechukkonga — 'Let us go, SHALL WE?' Idhu oru fixed tag. 'Will we' appadinnu orupodhum varaadhu. Idhu Module 10-la question tags padikkumbodhum varum. Modal Verbs module iththoda mudinjadhu."}]}

/* ================== ENGINE ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[
 ["What is the Rule?","விதி என்ன? · Vidhi enna?"],
 ["Why does this rule exist?","ஏன் இந்த விதி? · Yen indha vidhi?"],
 ["Visual Diagram","படம் மூலம் புரிதல் · Padam moolam purithal"],
 ["Wrong Thinking vs Right Thinking","தவறான சிந்தனை · Thavaraana sinthanai"],
 ["Tamil Translation of Examples","உதாரணங்களின் தமிழ் · Udhaaranangalin Tamil"],
 ["Word-by-Word Meaning","சொல்லுக்குச் சொல் · Sollukku sol"],
 ["Solved Examples — Easy to Hard","தீர்க்கப்பட்ட உதாரணங்கள்"],
 ["Wrong vs Correct","தவறு vs சரி · Thavaru vs Sari"],
 ["SSC / Bank PYQ Style","முந்தைய வினாத்தாள் பாணி"],
 ["Exam Trap","தேர்வு பொறி · Thervu pori"],
 ["Memory Trick","நினைவு உத்தி · Ninaivu utthi"],
 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],
 ["Challenge Round","சவால் சுற்று · Savaal sutru"],
 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],
 ["Centu AI Explains","சென்டு AI விளக்கம்"]
];

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-modals', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
