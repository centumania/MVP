<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Modal Verbs — 8 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

<main>
  <div class="top">

<script>
/* ============ COMPACT DATA FORMAT ============
   s7  solved examples : "sentence|answer|Level|why"
   s8  wrong vs right  : "wrong|correct|why"
   s9  PYQ             : "Type|question|optA;optB;optC|ansIdx|solution"
   s12 practice        : "sentence with ____|optA;optB|ansIdx"
   s13 challenge       : "question|optA;optB;optC|ansIdx|solution"
   s6  word-by-word    : "word|tamil|tanglish"
============================================== */
const RULES=[
/* ========== RULE 63 ========== */
{n:63,rc:"MOD-01",d:"Easy",t:"A Modal is ALWAYS followed by the Bare Infinitive",
 tam:"Modal-க்குப் பின் V1 மட்டுமே — -s இல்லை, -ed இல்லை, 'to' இல்லை",
 s1:{en:"Can, could, may, might, shall, should, will, would and must are followed by the BASE FORM V1 — no -s, no -ed, no 'to'. The modal itself carries the tense, so the main verb stays uninflected.",
  ta:"Can, could, may, might, shall, should, will, would, must ஆகியவற்றுக்குப் பின் அடிப்படை வடிவம் V1 வரும் — -s இல்லை, -ed இல்லை, 'to' இல்லை. Modal-ஏ tense-ஐச் சுமக்கிறது, எனவே முதன்மை வினைச்சொல் மாற்றமின்றி இருக்கும்.",
  tl:"Can, could, may, might, shall, should, will, would, must aagiyavatrukkup pin adippadai vadivam V1 varum — -s illai, -ed illai, 'to' illai. Modal-e tense-aich sumakkiradhu.",
  formula:"MODAL  +  V1  (bare infinitive)\n\n  He can SWIM well.        ✔  (not 'swims')\n  She must GO now.         ✔  (not 'to go')\n  They should STUDY hard.  ✔  (not 'studied')\n\nTHE THREE THAT KEEP 'TO':\n  ought TO · used TO · have TO\n  You ought TO apologise.  ✔"},

 s2:[
 {h:"The modal already carries the tense",
  en:"'He can swim' — 'can' is already a present-tense form, and 'could' is already past. Since the modal shows the tense, the main verb has no work to do. It relaxes back to its plain base form.",
  ta:"Modal ஏற்கனவே tense-ஐச் சுமக்கிறது. 'He can swim' — 'can' ஏற்கனவே ஒரு நிகழ்கால வடிவம், 'could' ஏற்கனவே கடந்தகாலம். Modal tense-ஐக் காட்டுவதால், முதன்மை வினைச்சொல்லுக்கு வேலை இல்லை. அது தன் எளிய அடிப்படை வடிவத்திற்குத் திரும்புகிறது.",
  tl:"Modal erkanave tense-aich sumakkiradhu. 'He can swim' — 'can' erkanave oru nigazhgaala vadivam, 'could' erkanave kadandhagaalam. Modal tense-aik kaattuvadhaal, mudhanmai vinaicholukku velai illai."},
 {h:"Modals never take -s in the third person",
  en:"'He can', 'she must', 'it may' — never 'he cans' or 'she musts'. Modals are the one verb family that ignores subject-verb agreement completely. This is a relief after Module 4.",
  ta:"Modal-கள் மூன்றாம் நபரில் ஒருபோதும் -s எடுப்பதில்லை. 'He can', 'she must', 'it may' — ஒருபோதும் 'he cans' அல்லது 'she musts' அல்ல. Subject-verb agreement-ஐ முற்றிலும் புறக்கணிக்கும் ஒரே வினைச்சொல் குடும்பம் Modal-கள்தான். Module 4-க்குப் பிறகு இது ஒரு நிம்மதி.",
  tl:"Modal-kal moondraam nabaril orupodhum -s eduppadhillai. 'He can', 'she must', 'it may' — orupodhum 'he cans' alladhu 'she musts' alla. Subject-verb agreement-ai mutrilum purakkanikkum ore vinaichol kudumbam Modal-kal-dhaan."},
 {h:"Two modals can never sit together",
  en:"'He will can do it' is impossible. English allows only ONE modal per verb group. To express two ideas, replace one with a phrase: 'He will BE ABLE TO do it', 'You will HAVE TO go'.",
  ta:"இரண்டு modal ஒருபோதும் சேர்ந்து வர முடியாது. 'He will can do it' சாத்தியமில்லை. ஒரு வினைச்சொல் குழுவுக்கு ஆங்கிலம் ஒரே ஒரு modal-ஐ மட்டுமே அனுமதிக்கிறது. இரண்டு கருத்துக்களை வெளிப்படுத்த, ஒன்றை ஒரு தொடரால் மாற்றுங்கள்: 'He will BE ABLE TO do it', 'You will HAVE TO go'.",
  tl:"Irandu modal orupodhum serndhu vara mudiyaadhu. 'He will can do it' saadhiyamillai. Oru vinaichol kuzhuvukku Aangilam ore oru modal-ai mattume anumadhikkiradhu."},
 {h:"MODAL + HAVE + V3 for the past",
  en:"To talk about the past, add 'have + V3' after the modal: 'He must have gone', 'She should have told me', 'They might have missed the bus'. The modal still takes a base form — 'have' — and 'have' takes V3.",
  ta:"கடந்தகாலத்திற்கு MODAL + HAVE + V3. கடந்தகாலத்தைப் பற்றிப் பேச, modal-க்குப் பின் 'have + V3' சேர்க்கவும்: 'He must have gone', 'She should have told me', 'They might have missed the bus'. Modal இன்னும் ஒரு அடிப்படை வடிவத்தை — 'have' — எடுக்கிறது, 'have' V3 எடுக்கிறது.",
  tl:"Kadandhagaalaththirku MODAL + HAVE + V3. Kadandhagaalaththaip patrip pesa, modal-kkup pin 'have + V3' serkkavum: 'He must have gone', 'She should have told me'."}],

 s3:[
 {h:"The modal does the work",
  d:"   He  CAN  SWIM.\n        ↑     ↑\n     carries  stays plain\n     the tense  (no -s, no -ed, no 'to')\n\n   he cans swim    ✘\n   he can swims    ✘\n   he can to swim  ✘\n   he can swim     ✔"},
 {h:"The nine core modals",
  d:"   can · could\n   may · might\n   shall · should\n   will · would\n   must\n\n   ALL take V1 directly.\n\n   THE THREE THAT KEEP 'TO':\n   ought TO · used TO · have TO"},
 {h:"One modal per verb group",
  d:"   He WILL CAN do it.        ✘  two modals\n   He WILL BE ABLE TO do it. ✔\n\n   You MUST WILL go.         ✘\n   You WILL HAVE TO go.      ✔\n\n   FOR THE PAST:\n   He MUST HAVE GONE.        ✔ modal + have + V3\n   She SHOULD HAVE TOLD me.  ✔"}],

 s4:{
 wrong:["\"'He can swims' shows the subject is third person.\" — Modals ignore subject-verb agreement.",
  "\"'She must to go' sounds more complete.\" — Only 'ought' keeps the 'to'.",
  "\"'He will can do it' expresses both future and ability.\" — Two modals cannot sit together.",
  "\"Modals can take -ed for the past.\" — Use modal + have + V3 instead."],
 right:["After any modal, write the plain base form V1.",
  "Never add -s, even with he, she or it.",
  "Only ought, used and have keep the 'to'.",
  "For the past, write modal + have + V3."]},

 s5:[
 {en:"He can swim very well.",ta:"அவர் மிகச் சிறப்பாக நீந்த முடியும்.",tl:"Avar migach sirappaaga neendha mudiyum.",note:"'Can' takes the base form SWIM."},
 {en:"She must go now without delay.",ta:"அவர் இப்போது தாமதமின்றிச் செல்ல வேண்டும்.",tl:"Avar ippodhu thaamadhamindrich sella vendum.",note:"'Must' takes the base form GO, never 'to go'."},
 {en:"You ought to apologise to him.",ta:"நீங்கள் அவரிடம் மன்னிப்புக் கேட்க வேண்டும்.",tl:"Neengal avaridam mannippuk ketka vendum.",note:"'Ought' is the one modal that keeps 'to'."},
 {en:"He will be able to finish it tomorrow.",ta:"அவரால் நாளை அதை முடிக்க முடியும்.",tl:"Avaraal naalai adhai mudikka mudiyum.",note:"Two modals are impossible, so 'be able to' replaces 'can'."},
 {en:"She must have left before we arrived.",ta:"நாங்கள் வருவதற்கு முன்பே அவர் சென்றிருக்க வேண்டும்.",tl:"Naangal varuvadharku munbe avar sendrirukka vendum.",note:"Modal + have + V3 refers to the past."}],

 s6:["modal verb|துணை நிலை வினைச்சொல்|Thunai nilai vinaichol",

  "must have gone|சென்றிருக்க வேண்டும்|Sendrirukka vendum",

 s7:[

 s8:[
 "He can swims very well.|He can swim very well.|Modals take the base form.",
 "She must to go now.|She must go now.|'Must' does not take 'to'.",
 "They should studied harder.|They should study harder.|Modals take the base form.",
 "You ought respect your elders.|You ought to respect your elders.|'Ought' always keeps the 'to'.",
 "He cans speak three languages.|He can speak three languages.|Modals never take -s.",
 "He will can do it tomorrow.|He will be able to do it tomorrow.|Two modals cannot sit together.",
 "She must has gone home.|She must have gone home.|Modal + have + V3, not 'has'.",
 "You should informed me earlier.|You should have informed me earlier.|A past duty requires 'should have + V3'.",
 "He used smoke in those days.|He used to smoke in those days.|'Used' keeps the 'to'.",
 "You must will go there today.|You will have to go there today.|Two modals cannot sit together."],

 s9:[
 "Fill in the Blank|Every candidate must ____ the application form before the last date.|submits;submit|1|Modals take the base form.",
 "Find the Error|He can speaks (A) three languages (B) fluently and (C) writes two of them (D).|A;B;C;D|0|Part A. Modals never take -s → 'can speak'.",
 "Sentence Improvement|You ought respect the opinions of others even if you disagree with them.|ought respect;ought to respect;ought respecting|1|'Ought' always keeps the 'to'.",
 "Fill in the Blank|She ____ have informed us earlier about the change in the timings.|should;should to|0|Modal + have + V3 needs no 'to'.",
 "Find the Error|He will can (A) complete the project (B) before the deadline (C) next month (D).|A;B;C;D|0|Part A. Two modals cannot sit together → 'will be able to complete'."],

 s10:{
  en:"The exam plants 'he can swims' because Module 4 trained you to add -s for he, she and it. Modals are the exception — they ignore agreement completely. The second trap is 'must to go', which feels more complete because so many verbs do take 'to'. Only ought, used and have keep it. The third trap is the double modal: 'will can' looks logical but is impossible.",
  ta:"தேர்வு 'he can swims' என்று நடுகிறது, ஏனெனில் he, she, it-க்கு -s சேர்க்க Module 4 உங்களைப் பயிற்றுவித்தது. Modal-கள் விதிவிலக்கு — அவை agreement-ஐ முற்றிலும் புறக்கணிக்கின்றன. இரண்டாவது பொறி 'must to go', அது முழுமையாகத் தோன்றுகிறது, ஏனெனில் பல வினைச்சொற்கள் 'to' எடுக்கின்றன. Ought, used, have மட்டுமே அதை வைத்திருக்கின்றன. மூன்றாவது பொறி இரட்டை modal: 'will can' தர்க்கரீதியாகத் தெரிகிறது ஆனால் சாத்தியமில்லை.",
  tl:"Thervu 'he can swims' endru nadugiradhu, yenenil he, she, it-kku -s serkka Module 4 ungalaip payitruviththadhu. Modal-kal vidhivilakku. Irandaavadhu pori 'must to go'. Moondraavadhu pori irattai modal."},

 s11:{
  en:"MODAL + V1, ALWAYS. No -s, no -ed, no 'to'. Only OUGHT, USED and HAVE keep the 'to'.",
  ta:"MODAL + V1, எப்போதும். -s இல்லை, -ed இல்லை, 'to' இல்லை. OUGHT, USED, HAVE மட்டுமே 'to' வைத்திருக்கும்.",
  tl:"MODAL + V1, eppodhum. -s illai, -ed illai, 'to' illai. OUGHT, USED, HAVE mattume 'to' vaiththirukkum.",
  vis:"      THE MODAL RULE IN ONE LINE\n\n        MODAL  +  V1\n\n   can · could · may · might\n   shall · should · will · would · must\n            ↓\n      all take the PLAIN verb\n\n   ⚠ THE THREE THAT KEEP 'TO':\n     ought TO · used TO · have TO\n\n   ⚠ NEVER TWO MODALS TOGETHER:\n     will can       ✘  →  will be able to  ✔\n     must will      ✘  →  will have to     ✔\n\n   ⚠ FOR THE PAST:\n     MODAL + HAVE + V3\n     must have gone · should have told"},

 s13:[
 "He ____ swim well, but he ____ to leave before the pool ____.|can-will have-closes;cans-must will-will close;can-must-closes|0|Modal + V1 → CAN SWIM. Two modals are impossible → WILL HAVE TO. A time clause bans 'will' → CLOSES (Rule 55).",
 "She must ____ left already, because the number of cars in the lot ____ fallen.|has-have;have-has;have-have|1|Modal + HAVE + V3 for the past. 'The number of' → HAS (SVA Rule 38).",
 "You ought ____ apologise, and it is high time you ____ your mistake.|to-admitted;—-admit;to-admit|0|'Ought' keeps 'to'. 'It is high time' takes the past form → ADMITTED (Rule 60).",
 "Neither of the boys ____ swim, so both of them ____ to learn before the trip.|can-will have;cans-must;can-must will|0|Modals ignore agreement → CAN. Two modals impossible → WILL HAVE TO.",
 "He should ____ informed us, for by then we ____ already left ____ hotel.|have-had-the;had-have-a;have-have-the|0|Modal + HAVE + V3. The earlier past action → HAD left (Rule 54). 'Hotel' spoken H → THE for a specific one."],

 s14:{
  rule:"A modal is always followed by the bare infinitive V1 — no -s, no -ed, no 'to'.",
  formula:"MODAL + V1\nOught TO · Used TO · Have TO keep the 'to'\nNever two modals: will be able to · will have to\nPast: MODAL + HAVE + V3",
  memory:"The modal carries the tense, so the verb stays plain.",
  ta:"Modal tense-ஐ சுமக்குது, அதனால verb எளிமையாவே இருக்கும்.",
  tl:"Modal tense-ai sumakkudhu, adhanaala verb elimaiyaave irukkum.",
  mistake:"Writing 'he can swims', 'she must to go' and 'he will can do it'.",
  exam:"SSC CGL / CHSL / MTS and RRB — the foundation of every modal question."},

 s15:[
 {ta:"Modal Verbs module-ஐ ஆரம்பிக்கலாம். இது ஒரு நல்ல செய்தியோட ஆரம்பிக்குது — Module 4-ல நாம SVA படிச்சோம், 'he goes', 'she writes' அப்படின்னு -s போடணும்னு. Modal-க்கு அது கிடையாது!",
  tl:"Modal Verbs module-ai aarambikkalaam. Idhu oru nalla seydhiyoda aarambikkudhu — Module 4-la naama SVA padichom, 'he goes', 'she writes' appadinnu -s podanumnu. Modal-kku adhu kidaiyaadhu!"},
 {ta:"'He CAN swim.' 'She MUST go.' 'It MAY rain.' எங்கயுமே -s இல்ல. 'He cans', 'she musts' — இப்படி எல்லாம் ஆங்கிலத்துல கிடையவே கிடையாது. Modal-கள் agreement-ஐ முழுசா புறக்கணிக்குது.",
  tl:"'He CAN swim.' 'She MUST go.' 'It MAY rain.' Engayume -s illa. 'He cans', 'she musts' — ippadi ellaam Aangilaththula kidaiyave kidaiyaadhu. Modal-kal agreement-ai muzhusaa purakkanikkudhu."},
 {ta:"ஏன்? ஒரு எளிய காரணம் இருக்கு. Modal-ஏ tense-ஐ சுமக்குது. 'Can' நிகழ்காலம், 'could' கடந்தகாலம். 'Will' எதிர்காலம், 'would' கடந்தகாலம். Tense வேலையை modal செஞ்சுடுச்சு. அதனால main verb-க்கு வேலை இல்ல, அது எளிமையா அடிப்படை வடிவத்துல இருக்கும்.",
  tl:"Yen? Oru eliya kaaranam irukku. Modal-e tense-ai sumakkudhu. 'Can' nigazhgaalam, 'could' kadandhagaalam. Tense velaiyai modal senjuduchu. Adhanaala main verb-kku velai illa."},
 {ta:"இப்போ ரெண்டாவது பொறி — 'to'. 'She must TO go' அப்படின்னு நிறைய பேரு எழுதுவாங்க. ஏன்? ஏன்னா ஆங்கிலத்துல நிறைய வினைச்சொல்லுக்கு 'to' வரும் — 'want to go', 'need to go', 'try to go'. ஆனா modal-க்கு வராது. மூணு விதிவிலக்கு மட்டும்: ought TO, used TO, have TO.",
  tl:"Ippo randaavadhu pori — 'to'. 'She must TO go' appadinnu neraiya peru ezhudhuvaanga. Aanaa modal-kku varaadhu. Moonu vidhivilakku mattum: ought TO, used TO, have TO."},
 {ta:"மூணாவது பொறி — ரெண்டு modal சேர்ந்து வராது. 'He will can do it' — தப்பு! ஏன்? ஏன்னா ஆங்கிலம் ஒரு வினைச்சொல் குழுவுக்கு ஒரே ஒரு modal-தான் அனுமதிக்கும். ரெண்டு கருத்து சொல்லணும்னா, ஒண்ணை தொடரா மாத்துங்க. 'He will BE ABLE TO do it.' 'You will HAVE TO go.'",
  tl:"Moonaavadhu pori — rendu modal serndhu varaadhu. 'He will can do it' — thappu! Rendu karuththu sollanumnaa, onnai thodaraa maaththunga. 'He will BE ABLE TO do it.' 'You will HAVE TO go.'"},
 {ta:"கடைசியா ரொம்ப முக்கியமான ஒண்ணு — கடந்தகாலம் எப்படி சொல்றது? Modal-க்கு -ed போட முடியாது. அதுக்கு பதிலா 'MODAL + HAVE + V3'. 'He MUST HAVE GONE' — அவரு போயிருக்கணும். 'She SHOULD HAVE TOLD me' — அவரு சொல்லியிருக்கணும் (ஆனா சொல்லல). 'They MIGHT HAVE MISSED the bus.' இந்த அமைப்பு அடுத்த சில rule-ல ரொம்ப முக்கியமா வரும், நல்லா மனசுல வெச்சுக்கோங்க.",
  tl:"Kadaisiyaa romba mukkiyamaana onnu — kadandhagaalam eppadi solradhu? Modal-kku -ed poda mudiyaadhu. Adhukku padhilaa 'MODAL + HAVE + V3'. 'He MUST HAVE GONE'. 'She SHOULD HAVE TOLD me'. Indha amaippu aduththa sila rule-la romba mukkiyamaa varum."}]},

/* ========== RULE 64 ========== */
{n:64,rc:"MOD-02",d:"Medium",t:"CAN for Ability, MAY for Permission and Possibility",
 tam:"Can = திறன் · May = முறையான அனுமதி, சாத்தியம்",
 s1:{en:"CAN expresses ABILITY or informal permission. MAY expresses FORMAL PERMISSION, POSSIBILITY or a WISH. In exams, a polite request for permission always takes MAY.",
  ta:"CAN திறனையோ சாதாரண அனுமதியையோ வெளிப்படுத்துகிறது. MAY முறையான அனுமதி, சாத்தியம் அல்லது வாழ்த்தை வெளிப்படுத்துகிறது. தேர்வுகளில், அனுமதிக்கான ஒரு நாகரிகமான வேண்டுகோள் எப்போதும் MAY எடுக்கும்.",
  tl:"CAN thiranaiyo saadhaarana anumadhiyaiyo velippaduththugiradhu. MAY muraiyaana anumadhi, saadhiyam alladhu vaazhththai velippaduththugiradhu.",
  formula:"CAN  →  ABILITY\n  She CAN speak five languages.\n  He CAN lift that box.\n\nMAY  →  FORMAL PERMISSION\n  MAY I come in, sir?\n\nMAY  →  POSSIBILITY\n  It MAY rain tonight.\n\nMAY  →  WISH / BLESSING\n  MAY you live long!"},

 s2:[
 {h:"Ability versus permission",
  en:"'Can I swim?' asks whether I am ABLE to swim. 'May I swim?' asks whether I am ALLOWED to swim. In a formal setting — asking a teacher, an officer, an examiner — the answer is always 'may'.",
  ta:"திறன் மற்றும் அனுமதி. 'Can I swim?' நான் நீந்த முடியுமா என்று கேட்கிறது. 'May I swim?' நான் நீந்த அனுமதிக்கப்பட்டிருக்கிறேனா என்று கேட்கிறது. ஒரு முறையான சூழலில் — ஆசிரியரிடம், அதிகாரியிடம், தேர்வாளரிடம் கேட்கும்போது — பதில் எப்போதும் 'may'.",
  tl:"Thiran matrum anumadhi. 'Can I swim?' naan neendha mudiyumaa endru ketkiradhu. 'May I swim?' naan neendha anumadhikkappattirukkirenaa endru ketkiradhu. Oru muraiyaana soozhalil padhil eppodhum 'may'."},
 {h:"May for possibility, can for general capability",
  en:"'It MAY rain tonight' — a specific possibility about tonight. 'It CAN rain heavily in this region' — a general capability of the place. 'May' predicts one occasion; 'can' describes what is generally possible.",
  ta:"சாத்தியத்திற்கு may, பொதுத் திறனுக்கு can. 'It MAY rain tonight' — இன்றிரவு பற்றிய ஒரு குறிப்பிட்ட சாத்தியம். 'It CAN rain heavily in this region' — அந்த இடத்தின் ஒரு பொதுத் திறன். 'May' ஒரு சந்தர்ப்பத்தைக் கணிக்கிறது; 'can' பொதுவாக என்ன சாத்தியம் என்பதை விவரிக்கிறது.",
  tl:"Saadhiyaththirku may, podhuth thiranukku can. 'It MAY rain tonight' — oru kurippitta saadhiyam. 'It CAN rain heavily in this region' — oru podhuth thiran."},
 {h:"May for wishes and blessings",
  en:"'May you live long!', 'May God bless you!', 'May your dreams come true!' — this is the optative use, where 'may' comes first in the sentence. It is common in narration questions too.",
  ta:"வாழ்த்துக்களுக்கும் ஆசீர்வாதங்களுக்கும் may. 'May you live long!', 'May God bless you!', 'May your dreams come true!' — இது optative பயன்பாடு, இங்கே 'may' வாக்கியத்தில் முதலில் வருகிறது. Narration கேள்விகளிலும் இது பொதுவானது.",
  tl:"Vaazhththukkalukkum aaseervaadhangalukkum may. 'May you live long!', 'May God bless you!' — idhu optative payanpaadu, inge 'may' vaakkiyaththil mudhalil varugiradhu."},
 {h:"CANNOT is written as one word",
  en:"'Cannot' is one word, not 'can not'. But 'may not' is always two words. This small spelling point appears in error-spotting questions.",
  ta:"CANNOT ஒரே சொல்லாக எழுதப்படுகிறது. 'Cannot' ஒரே சொல், 'can not' அல்ல. ஆனால் 'may not' எப்போதும் இரண்டு சொற்கள். இந்தச் சிறிய எழுத்துக்கூட்டல் விஷயம் error-spotting கேள்விகளில் வருகிறது.",
  tl:"CANNOT ore sollaaga ezhudhappadugiradhu. 'Cannot' ore sol, 'can not' alla. Aanaal 'may not' eppodhum irandu sorkal."}],

 s3:[
 {h:"Am I able, or am I allowed?",
  d:"   CAN  →  Am I ABLE?     💪 capability\n     She CAN speak French.\n     He CAN lift 50 kilos.\n\n   MAY  →  Am I ALLOWED?   🙏 permission\n     MAY I come in, sir?\n     MAY I borrow your book?\n\n   In a formal setting, always MAY."},
 {h:"The four uses of MAY",
  d:"   🙏 PERMISSION  : May I come in?\n   🌧️ POSSIBILITY : It may rain tonight.\n   🎉 WISH        : May you live long!\n   ⚖️ CONCESSION  : He may be rich, but he is unhappy.\n\n   All four are formal, polite or tentative."},
 {h:"Can versus may for possibility",
  d:"   MAY  →  a specific occasion\n     It MAY rain tonight.  (this one night)\n\n   CAN  →  a general capability\n     It CAN rain heavily here in June.\n     (this is what the place is capable of)\n\n   ⚠ SPELLING:\n     cannot  → one word\n     may not → two words"}],

 s4:{
 wrong:["\"'Can I come in, sir?' is normal English.\" — In formal exam English, permission takes 'may'.",
  "\"'Can' and 'may' mean the same thing.\" — One is ability, the other permission.",
  "\"'It can rain tonight' predicts tonight's weather.\" — A specific prediction takes 'may'.",
  "\"'Can not' and 'cannot' are both fine.\" — 'Cannot' is written as one word."],
 right:["Ask: am I talking about ABILITY or PERMISSION?",
  "Ability → can. Formal permission → may.",
  "A specific possibility → may. A general capability → can.",
  "Remember 'cannot' is one word."]},

 s5:[
 {en:"She can speak five languages fluently.",ta:"அவர் ஐந்து மொழிகளை சரளமாகப் பேச முடியும்.",tl:"Avar aindhu mozhigalai saralamaagap pesa mudiyum.",note:"Ability → CAN."},
 {en:"May I come in, sir?",ta:"நான் உள்ளே வரலாமா, ஐயா?",tl:"Naan ulle varalaamaa, aiyaa?",note:"Formal permission → MAY."},
 {en:"It may rain tonight, so carry an umbrella.",ta:"இன்றிரவு மழை பெய்யலாம், எனவே ஒரு குடையை எடுத்துச் செல்லுங்கள்.",tl:"Indriravu mazhai peyyalaam, enave oru kudaiyai eduththuch sellungal.",note:"A specific possibility → MAY."},
 {en:"May you live long and prosper!",ta:"நீங்கள் நீண்ட காலம் வாழ்ந்து செழிக்க வாழ்த்துக்கள்!",tl:"Neengal neenda kaalam vaazhndhu sezhikka vaazhththukkal!",note:"A wish or blessing → MAY."},
 {en:"He cannot lift this heavy box alone.",ta:"அவரால் இந்தக் கனமான பெட்டியைத் தனியாகத் தூக்க முடியாது.",tl:"Avaraal indhak kanamaana pettiyaith thaniyaagath thookka mudiyaadhu.",note:"'Cannot' is written as one word."}],

 s8:[
 "Can I come in, sir?|May I come in, sir?|Formal permission requires 'may'.",
 "She may speak five languages.|She can speak five languages.|Ability requires 'can'.",
 "It can rain tonight, so take an umbrella.|It may rain tonight, so take an umbrella.|A specific possibility requires 'may'.",
 "Can you live long and prosper!|May you live long and prosper!|A blessing requires 'may'.",
 "Can I borrow your notes, madam?|May I borrow your notes, madam?|Formal permission requires 'may'.",
 "He may lift fifty kilos without difficulty.|He can lift fifty kilos without difficulty.|Ability requires 'can'.",
 "He can not lift this box alone.|He cannot lift this box alone.|'Cannot' is written as one word.",
 "Can God bless you always!|May God bless you always!|A blessing requires 'may'.",
 "He may swim when he was five years old.|He could swim when he was five years old.|Past ability requires 'could'.",
 "May a trained athlete run very fast?|Can a trained athlete run very fast?|General ability requires 'can'."],

 s9:[
 "Fill in the Blank|____ I have your permission to leave the hall a little early today?|Can;May|1|Formal permission requires 'may'.",
 "Find the Error|Can I come in (A), sir, (B) I have brought (C) the file you asked for (D)?|A;B;C;D|0|Part A. Formal permission requires 'May I come in'.",
 "Sentence Improvement|She may play the violin beautifully, having learnt it for twelve years.|may play;can play;may to play|1|Ability requires 'can'.",
 "Fill in the Blank|The sky is very dark, so it ____ rain heavily within the next hour.|can;may|1|A specific possibility requires 'may'.",
 "Find the Error|He can not (A) complete the work (B) without the help (C) of his colleagues (D).|A;B;C;D|0|Part A. 'Cannot' is written as one word."],

 s10:{
  en:"Every Indian student says 'Can I come in, sir?' — it is what we are taught in school and what we hear every day. In formal exam English, permission takes 'may'. The exam plants this in almost every modal set. The second trap is possibility: 'It CAN rain tonight' looks fine but a specific forecast needs 'may'.",
  ta:"ஒவ்வொரு இந்திய மாணவரும் 'Can I come in, sir?' என்று சொல்கிறார்கள் — அதுதான் பள்ளியில் நமக்குக் கற்பிக்கப்படுகிறது, அதுதான் தினமும் கேட்கிறோம். முறையான தேர்வு ஆங்கிலத்தில், அனுமதி 'may' எடுக்கிறது. தேர்வு இதை கிட்டத்தட்ட ஒவ்வொரு modal தொகுப்பிலும் நடுகிறது. இரண்டாவது பொறி சாத்தியம்: 'It CAN rain tonight' நன்றாகத் தெரிகிறது ஆனால் ஒரு குறிப்பிட்ட முன்னறிவிப்புக்கு 'may' தேவை.",
  tl:"Ovvoru Indhiya maanavarum 'Can I come in, sir?' endru solgiraargal. Muraiyaana thervu Aangilaththil, anumadhi 'may' edukkiradhu. Irandaavadhu pori saadhiyam."},

 s11:{
  en:"AM I ABLE, OR AM I ALLOWED? Able → can. Allowed → may.",
  ta:"என்னால் முடியுமா, இல்லை எனக்கு அனுமதி இருக்கிறதா? முடியும் → can. அனுமதி → may.",
  tl:"Ennaal mudiyumaa, illai enakku anumadhi irukkiradhaa? Mudiyum → can. Anumadhi → may.",
  vis:"      THE TWO-QUESTION TEST\n\n   💪 \"Am I ABLE to do it?\"    →  CAN\n      She can swim.\n      He can speak French.\n\n   🙏 \"Am I ALLOWED to do it?\" →  MAY\n      May I come in, sir?\n      May I borrow this book?\n\n   MEMORY LINE:\n   \"CAN = Capability.  MAY = May I please.\"\n\n   THE FOUR USES OF MAY:\n   permission · possibility · wish · concession\n\n   ⚠ SPELLING:  cannot (one word)\n                may not (two words)"},

 s13:[
 "____ I come in, sir? I ____ speak English, but I ____ not write it well.|May-can-can;Can-may-may;May-can-may|0|Formal permission → MAY. Ability → CAN. Ability in the negative → CANNOT.",
 "It ____ rain tonight, so it is high time we ____ for shelter.|can-look;may-looked;may-look|1|A specific possibility → MAY. 'It is high time' takes the past form → LOOKED (Rule 60).",
 "____ God bless you, and ____ you ____ able to fulfil all your dreams.|May-may-be;Can-can-be;May-can-be|0|A blessing → MAY. Two modals impossible → 'may you be able to'.",
 "She ____ speak French, and she ____ have learnt it when she ____ in Paris.|can-may-was;may-can-was;can-may-were|0|Ability → CAN. A past possibility → MAY HAVE. Past → WAS.",
 "He ____ not attend today, because neither of the two buses ____ running.|may-is;can-are;may-are|0|Possibility → MAY not. 'Neither of' is fixed singular → IS (SVA Rule 50)."],

 s14:{
  rule:"CAN expresses ability, MAY expresses formal permission, possibility and wishes.",
  formula:"CAN → ability, general capability\nMAY → formal permission, specific possibility, wish\ncannot = one word | may not = two words",
  memory:"CAN = Capability. MAY = May I please.",
  ta:"CAN = திறன். MAY = 'May I please' — அனுமதி.",
  tl:"CAN = thiran. MAY = 'May I please' — anumadhi.",
  mistake:"Writing 'Can I come in, sir?' for formal permission, and 'It can rain tonight'.",
  exam:"SSC CGL / CHSL and Bank — appears in Fill in the Blank and Sentence Improvement."},

 s15:[
 {ta:"இந்த rule-ல ஒரு எளிய கேள்வி கேட்டா போதும் — 'என்னால முடியுமா, இல்ல எனக்கு அனுமதி இருக்கா?' முடியும்-ன்னா CAN. அனுமதி-ன்னா MAY.",
  tl:"Indha rule-la oru eliya kelvi kettaa podhum — 'ennaala mudiyumaa, illa enakku anumadhi irukkaa?' Mudiyum-nnaa CAN. Anumadhi-nnaa MAY."},
 {ta:"'She CAN speak five languages' — இது திறன். அவங்களால முடியும். 'MAY I come in, sir?' — இது அனுமதி. நான் உள்ள வரலாமா-ன்னு கேட்குறேன். ரெண்டும் வேற வேற விஷயம்.",
  tl:"'She CAN speak five languages' — idhu thiran. Avangalaala mudiyum. 'MAY I come in, sir?' — idhu anumadhi. Naan ulla varalaamaa-nnu ketkuren."},
 {ta:"ஆனா இங்க நமக்கு ஒரு பெரிய பிரச்சனை இருக்கு. நாம school-ல எல்லாருமே 'Can I come in, sir?' அப்படித்தான் சொல்லிட்டு வளர்ந்திருக்கோம். அது நம்ம காதுல ஆழமா பதிஞ்சிடுச்சு. ஆனா முறையான ஆங்கிலத்துல, தேர்வு ஆங்கிலத்துல, அனுமதிக்கு 'May I come in, sir?' தான் சரி.",
  tl:"Aanaa inga namakku oru periya prachanai irukku. Naama school-la ellaarume 'Can I come in, sir?' appadidhaan sollittu valarndhirukkom. Aanaa muraiyaana Aangilaththula, thervu Aangilaththula, anumadhikku 'May I come in, sir?' dhaan sari."},
 {ta:"MAY-க்கு நாலு பயன்பாடு இருக்கு. ஒண்ணு — அனுமதி: 'May I go?' ரெண்டு — சாத்தியம்: 'It may rain tonight.' மூணு — வாழ்த்து: 'May you live long!' நாலு — ஒப்புதல்: 'He may be rich, but he is not happy.' நாலுமே முறையானது அல்லது தயக்கமானது.",
  tl:"MAY-kku naalu payanpaadu irukku. Onnu — anumadhi: 'May I go?' Rendu — saadhiyam: 'It may rain tonight.' Moonu — vaazhththu: 'May you live long!' Naalu — oppudhal."},
 {ta:"இப்போ ஒரு நுட்பமான வித்தியாசம் — சாத்தியத்துக்கு may, பொதுத் திறனுக்கு can. 'It MAY rain tonight' — இன்னைக்கு இரவு பத்தி ஒரு குறிப்பிட்ட கணிப்பு. ஆனா 'It CAN rain heavily in this region during June' — இந்த இடத்தோட பொதுவான தன்மை. ஒண்ணு ஒரு நாள் பத்தி, இன்னொண்ணு பொதுவா.",
  tl:"Ippo oru nutpamaana viththiyaasam — saadhiyaththukku may, podhuth thiranukku can. 'It MAY rain tonight' — oru kurippitta kanippu. Aanaa 'It CAN rain heavily in this region during June' — podhuvaana thanmai."},
 {ta:"கடைசியா ஒரு சின்ன ஆனா முக்கியமான விஷயம் — எழுத்துக்கூட்டல். 'Cannot' ஒரே வார்த்தை! 'Can not' அப்படின்னு ரெண்டா எழுதக்கூடாது. ஆனா 'may not' எப்பவும் ரெண்டு வார்த்தை. SSC Error Spotting-ல இதை கேட்பாங்க. சின்ன விஷயம், ஆனா ஒரு mark.",
  tl:"Kadaisiyaa oru chinna aanaa mukkiyamaana vishayam — ezhuththukkoottal. 'Cannot' ore vaarththai! 'Can not' appadinnu rendaa ezhudhakkoodaadhu. Aanaa 'may not' eppavum rendu vaarththai. SSC Error Spotting-la idhai ketpaanga."}]},

/* ========== RULE 65 ========== */
{n:65,rc:"MOD-03",d:"Medium",t:"COULD and MIGHT for Past, Politeness and Remote Possibility",
 tam:"Could, Might = கடந்தகாலம், மரியாதை, குறைந்த சாத்தியம்",
 s1:{en:"COULD and MIGHT are the PAST forms of can and may. They are also used for POLITE requests and for WEAKER, more remote possibility. English uses distance in tense to create distance in politeness and certainty.",
  ta:"COULD மற்றும் MIGHT என்பவை can மற்றும் may-ன் கடந்தகால வடிவங்கள். அவை நாகரிகமான வேண்டுகோள்களுக்கும், பலவீனமான, தொலைவான சாத்தியத்திற்கும் பயன்படுத்தப்படுகின்றன. நாகரிகத்திலும் உறுதியிலும் தூரத்தை உருவாக்க ஆங்கிலம் tense-ல் தூரத்தைப் பயன்படுத்துகிறது.",
  tl:"COULD matrum MIGHT enbavai can matrum may-in kadandhagaala vadivangal. Avai naagarigamaana vendugolgalukkum, palaveenamaana, tholaivaana saadhiyaththirkum payanpaduththappadugindrana.",
  formula:"PAST FORM\n  He COULD swim when he was five.\n  She said she MIGHT come.\n\nPOLITE REQUEST\n  COULD you please help me?\n  MIGHT I make a suggestion?\n\nWEAKER POSSIBILITY\n  It MIGHT rain, but I doubt it.\n  (weaker than 'It may rain')"},

 s2:[
 {h:"Distance in tense means distance in tone",
  en:"'Can you help me?' is direct. 'Could you help me?' is polite. The past form pushes the request one step away from the listener, which softens it. Every language has a politeness device; in English it is tense.",
  ta:"Tense-ல் தூரம் என்றால் தொனியில் தூரம். 'Can you help me?' நேரடியானது. 'Could you help me?' நாகரிகமானது. கடந்தகால வடிவம் வேண்டுகோளைக் கேட்பவரிடமிருந்து ஒரு படி தள்ளிவைக்கிறது, அது அதை மென்மையாக்குகிறது. ஒவ்வொரு மொழிக்கும் ஒரு நாகரிக சாதனம் உண்டு; ஆங்கிலத்தில் அது tense.",
  tl:"Tense-l dhooram endraal thoniyil dhooram. 'Can you help me?' neradiyaanadhu. 'Could you help me?' naagarigamaanadhu. Kadandhagaala vadivam vendugolaik ketpavaridamirundhu oru padi thallivaikkiradhu."},
 {h:"MIGHT is weaker than MAY",
  en:"'It MAY rain' — a real chance. 'It MIGHT rain' — a slimmer chance. When an exam offers both and the sentence contains words like 'slight', 'faint' or 'I doubt', choose 'might'.",
  ta:"MIGHT, MAY-ஐ விட பலவீனமானது. 'It MAY rain' — ஒரு உண்மையான வாய்ப்பு. 'It MIGHT rain' — ஒரு மெலிதான வாய்ப்பு. ஒரு தேர்வு இரண்டையும் தந்து, வாக்கியத்தில் 'slight', 'faint' அல்லது 'I doubt' போன்ற சொற்கள் இருந்தால், 'might' தேர்ந்தெடுங்கள்.",
  tl:"MIGHT, MAY-ai vida palaveenamaanadhu. 'It MAY rain' — oru unmaiyaana vaayppu. 'It MIGHT rain' — oru melidhaana vaayppu."},
 {h:"COULD for general past ability, WAS ABLE TO for one occasion",
  en:"'He COULD swim well as a boy' — a general past ability. But for one specific successful act, use 'was able to': 'The house was on fire, but he WAS ABLE TO escape' — not 'could escape'.",
  ta:"பொதுவான கடந்தகாலத் திறனுக்கு COULD, ஒரு சந்தர்ப்பத்திற்கு WAS ABLE TO. 'He COULD swim well as a boy' — ஒரு பொதுவான கடந்தகாலத் திறன். ஆனால் ஒரு குறிப்பிட்ட வெற்றிகரமான செயலுக்கு 'was able to' பயன்படுத்துங்கள்: 'The house was on fire, but he WAS ABLE TO escape' — 'could escape' அல்ல.",
  tl:"Podhuvaana kadandhagaalath thiranukku COULD, oru sandharppaththirku WAS ABLE TO. 'He COULD swim well as a boy' — podhuvaana kadandhagaalath thiran. Aanaal oru kurippitta vetrigaramaana seyalukku 'was able to' payanpaduththungal."},
 {h:"COULD HAVE and MIGHT HAVE for unrealised past",
  en:"'He could have passed' means he had the ability but did not pass. 'She might have missed the train' means it is possible that she missed it. Both use modal + have + V3 from Rule 63.",
  ta:"நிறைவேறாத கடந்தகாலத்திற்கு COULD HAVE மற்றும் MIGHT HAVE. 'He could have passed' என்றால் அவருக்குத் திறன் இருந்தது ஆனால் தேர்ச்சி பெறவில்லை. 'She might have missed the train' என்றால் அவர் ரயிலைத் தவறவிட்டிருக்கலாம் என்று சாத்தியம். இரண்டும் Rule 63-லிருந்து modal + have + V3 பயன்படுத்துகின்றன.",
  tl:"Niraiveraadha kadandhagaalaththirku COULD HAVE matrum MIGHT HAVE. 'He could have passed' endraal avarukkuth thiran irundhadhu aanaal thercchi peravillai. Irandum Rule 63-lirundhu modal + have + V3 payanpaduththugindrana."}],

 s3:[
 {h:"Past tense, softer tone",
  d:"   DIRECT              POLITE\n   ──────              ──────\n   Can you help?   →   Could you help?\n   Will you come?  →   Would you come?\n   May I ask?      →   Might I ask?\n\n   The past form creates DISTANCE,\n   and distance sounds POLITE."},
 {h:"Strength of possibility",
  d:"   WILL     ████████████  certain\n   MUST     ██████████    almost certain\n   MAY      ██████        real chance\n   MIGHT    ███           slim chance\n   COULD    ███           slim chance\n\n   Look for 'slight', 'faint', 'I doubt'\n   → choose MIGHT"},
 {h:"Could versus was able to",
  d:"   GENERAL past ability  →  COULD\n     He COULD swim as a boy.\n     She COULD read at four.\n\n   ONE successful occasion →  WAS ABLE TO\n     The house was burning, but he\n     WAS ABLE TO escape.        ✔\n     ...but he COULD escape.    ✘"}],

 s4:{
 wrong:["\"'Could' is only the past tense of 'can'.\" — It is also the polite and tentative form.",
  "\"'May' and 'might' are equally strong.\" — 'Might' is weaker.",
  "\"'He could escape from the fire' is correct.\" — One specific success takes 'was able to'.",
  "\"'Could you please helping me?' is polite.\" — After a modal, always use V1."],
 right:["For a polite request, use could or would.",
  "For a slim chance, use might.",
  "For one specific past success, use 'was able to'.",
  "For an unrealised past, use could have or might have + V3."]},

 s5:[
 {en:"He could swim well when he was five.",ta:"அவருக்கு ஐந்து வயதாக இருந்தபோதே நன்றாக நீந்த முடிந்தது.",tl:"Avarukku aindhu vayadhaaga irundhabodhe nandraaga neendha mudindhadhu.",note:"General past ability → COULD."},
 {en:"Could you please pass me the file?",ta:"தயவுசெய்து அந்தக் கோப்பை எனக்குக் கொடுக்க முடியுமா?",tl:"Thayavuseydhu andhak koppai enakkuk kodukka mudiyumaa?",note:"A polite request → COULD."},
 {en:"It might rain, but I doubt it.",ta:"மழை பெய்யலாம், ஆனால் எனக்குச் சந்தேகமாக இருக்கிறது.",tl:"Mazhai peyyalaam, aanaal enakkuch sandhegamaaga irukkiradhu.",note:"'I doubt it' signals a slim chance → MIGHT."},
 {en:"The house was on fire, but he was able to escape.",ta:"வீடு தீப்பிடித்திருந்தது, ஆனால் அவரால் தப்பிக்க முடிந்தது.",tl:"Veedu theeppidiththirundhadhu, aanaal avaraal thappikka mudindhadhu.",note:"One specific success → WAS ABLE TO."},
 {en:"He could have passed if he had worked harder.",ta:"அவர் கடினமாக உழைத்திருந்தால் தேர்ச்சி பெற்றிருக்க முடியும்.",tl:"Avar kadinamaaga uzhaiththirundhaal thercchi petrirukka mudiyum.",note:"An unrealised past ability → COULD HAVE + V3."}],

 s6:["could|முடிந்தது / முடியுமா|Mudindhadhu / Mudiyumaa",
  "might|-லாம் (குறைந்த சாத்தியம்)|-laam (kuraindha saadhiyam)",

  "I doubt it|எனக்குச் சந்தேகம்|Enakkuch sandhegam",

 s7:[
 "He ____ swim when he was five.|could|Easy|General past ability.",
 "____ you please help me?|Could|Easy|A polite request.",
 "It ____ rain, but I doubt it.|might|Easy|A slim chance.",
 "She said she ____ come later.|might|Medium|The past form of 'may'.",

 s8:[
 "He can swim when he was five.|He could swim when he was five.|Past ability requires 'could'.",
 "Can you please pass me the file?|Could you please pass me the file?|A polite request requires 'could'.",
 "It may rain, but I doubt it very much.|It might rain, but I doubt it very much.|'I doubt it' signals a slim chance.",
 "She said she may come later.|She said she might come later.|After a past reporting verb, 'may' becomes 'might'.",
 "The house was on fire, but he could escape.|The house was on fire, but he was able to escape.|One specific success requires 'was able to'.",
 "He could passed if he had worked harder.|He could have passed if he had worked harder.|An unrealised past requires 'could have + V3'.",
 "She might missed the train this morning.|She might have missed the train this morning.|A past possibility requires 'might have + V3'.",
 "Could you please helping me with this?|Could you please help me with this?|A modal takes the base form.",
 "Can I make a suggestion, sir?|Might I make a suggestion, sir?|A very polite request takes 'might'.",
 "After many attempts he could open the lock.|After many attempts he was able to open the lock.|One specific success requires 'was able to'."],

 s9:[
 "Fill in the Blank|____ you kindly lend me your notes for a day or two?|Can;Could|1|A polite request requires 'could'.",
 "Find the Error|There is only (A) a slight chance (B) that he may win (C) the first prize (D).|A;B;C;D|2|Part C. 'A slight chance' signals a slim possibility → 'might win'.",
 "Sentence Improvement|The building was on fire, but all the residents could escape unhurt.|could escape;were able to escape;can escape|1|One specific successful act requires 'were able to'.",
 "Fill in the Blank|He ____ have secured a much better rank if he had prepared systematically.|could;can|0|An unrealised past ability requires 'could have'.",
 "Find the Error|She told me (A) that she may (B) come to the function (C) the next day (D).|A;B;C;D|1|Part B. After a past reporting verb, 'may' becomes 'might'."],

 s10:{
  en:"The exam tests three separate uses of the same two words, and students learn only one. They know 'could is the past of can' but not that it is also the polite form and the tentative form. The sharpest trap is 'could' versus 'was able to' — for ONE specific successful action, 'could' is wrong. 'He could escape from the fire' must be 'was able to escape'.",
  ta:"தேர்வு அதே இரண்டு சொற்களின் மூன்று தனித்தனி பயன்பாடுகளைச் சோதிக்கிறது, மாணவர்கள் ஒன்றை மட்டுமே கற்கிறார்கள். 'Could என்பது can-ன் கடந்தகாலம்' என்று அவர்களுக்குத் தெரியும், ஆனால் அது நாகரிக வடிவமும் தயக்க வடிவமும் என்று தெரியாது. கூர்மையான பொறி 'could' மற்றும் 'was able to' — ஒரு குறிப்பிட்ட வெற்றிகரமான செயலுக்கு 'could' தவறு.",
  tl:"Thervu adhe irandu sorkalin moondru thanithani payanpaadugalaich sodhikkiradhu, maanavargal ondrai mattume karkiraargal. Koormaiyaana pori 'could' matrum 'was able to' — oru kurippitta vetrigaramaana seyalukku 'could' thavaru."},

 s11:{
  en:"PAST TENSE = POLITE TONE = SLIM CHANCE. All three come from the same distance.",
  ta:"கடந்தகால tense = நாகரிகத் தொனி = மெலிதான வாய்ப்பு. மூன்றுமே அதே தூரத்திலிருந்து வருகின்றன.",
  tl:"Kadandhagaala tense = naagarigath thoni = melidhaana vaayppu. Moondrume adhe dhooraththilirundhu varugindrana.",
  vis:"      ONE FORM, THREE JOBS\n\n   COULD / MIGHT\n        ↓\n   1️⃣ PAST     : He could swim as a boy.\n   2️⃣ POLITE   : Could you help me?\n   3️⃣ TENTATIVE: It might rain, but I doubt it.\n\n   All three come from the same idea:\n   the past form creates DISTANCE.\n\n   ⚠ COULD vs WAS ABLE TO:\n     general past ability  →  COULD\n     ONE specific success  →  WAS ABLE TO\n\n     He could swim well.           ✔\n     He was able to escape the fire. ✔\n     He could escape the fire.       ✘"},

 s13:[
 "____ you please tell me whether he ____ swim when he ____ a child?|Could-could-was;Can-can-was;Could-can-was|0|A polite request → COULD. Past ability → COULD. Past → WAS.",
 "There is a slight chance he ____ come, but he ____ have forgotten the date.|may-can;might-might;might-may|1|'A slight chance' → MIGHT. A past possibility → MIGHT HAVE.",
 "The house was burning, but each of the residents ____ to escape before help ____.|could-arrived;was able-arrived;were able-arrived|1|One specific success → WAS ABLE TO. 'Each of' is singular (SVA Rule 50).",
 "He ____ have passed if he ____ harder, but it is high time he ____ this.|could-had worked-realised;can-worked-realises;could-worked-realised|0|Unrealised past → COULD HAVE. Type 3 conditional → HAD WORKED. 'It is high time' → REALISED (Rule 60).",
 "She said she ____ come, and by now she ____ have reached ____ hotel.|may-may-a;might-might-the;might-may-the|1|A past reporting verb shifts 'may' to MIGHT (Rule 56). A tentative deduction → MIGHT HAVE. Specific hotel → THE."],

 s14:{
  rule:"Could and might are the past forms of can and may, and also express politeness and remote possibility.",
  formula:"PAST: He could swim | POLITE: Could you help?\nSLIM CHANCE: It might rain\nONE SUCCESS: was able to (not could)\nUNREALISED PAST: could have / might have + V3",
  memory:"Past tense = polite tone = slim chance. All three come from distance.",
  ta:"கடந்தகால வடிவம் = மரியாதை = குறைந்த வாய்ப்பு. மூணுமே தூரத்துலருந்து வருது.",
  tl:"Kadandhagaala vadivam = mariyaadhai = kuraindha vaayppu. Moonume dhooraththularundhu varudhu.",
  mistake:"Writing 'he could escape the fire' for one specific success instead of 'was able to'.",
  exam:"SSC CGL / CHSL and Bank — the could-versus-was-able-to distinction is the sharpest trap."},

 s15:[
 {ta:"இந்த rule-ல ஒரே ரெண்டு வார்த்தை — could, might — ஆனா மூணு வேலை செய்யுது. நிறைய பேரு ஒரே ஒரு வேலையை மட்டும் கத்துக்கிட்டு தேர்வுக்கு போவாங்க, அப்புறம் மத்த ரெண்டுல தப்பு பண்ணுவாங்க.",
  tl:"Indha rule-la ore rendu vaarththai — could, might — aanaa moonu velai seyyudhu. Neraiya peru ore oru velaiyai mattum kaththukkittu thervukku povaanga."},
 {ta:"முதல் வேலை — கடந்தகாலம். 'He COULD swim when he was five.' Can-ஓட கடந்தகாலம் could. May-ஓட கடந்தகாலம் might. இது எல்லாருக்கும் தெரியும்.",
  tl:"Mudhal velai — kadandhagaalam. 'He COULD swim when he was five.' Can-oda kadandhagaalam could. May-oda kadandhagaalam might. Idhu ellaarukkum theriyum."},
 {ta:"ரெண்டாவது வேலை — மரியாதை. 'Can you help me?' நேரடி. 'COULD you help me?' நாகரிகம். ஏன்? ஒரு அழகான காரணம் இருக்கு. கடந்தகால வடிவம் அந்த கேள்வியை கேட்பவரிடம் இருந்து கொஞ்சம் தள்ளி வைக்குது. தூரம் இருந்தா அது மென்மையா, மரியாதையா தோணும். ஆங்கிலத்துல மரியாதை காட்ட tense-ஐ பயன்படுத்துறாங்க.",
  tl:"Randaavadhu velai — mariyaadhai. 'Can you help me?' neradi. 'COULD you help me?' naagarigam. Kadandhagaala vadivam andha kelviyai ketpavaridam irundhu konjam thalli vaikkudhu. Dhooram irundhaa adhu menmaiyaa, mariyaadhaiyaa thonum."},
 {ta:"மூணாவது வேலை — குறைந்த சாத்தியம். 'It MAY rain' — நல்ல வாய்ப்பு இருக்கு. 'It MIGHT rain' — கொஞ்சம்தான் வாய்ப்பு. வாக்கியத்துல 'slight chance', 'faint hope', 'I doubt it' அப்படிங்கிற வார்த்தை இருந்தா, 'might' போடுங்க.",
  tl:"Moonaavadhu velai — kuraindha saadhiyam. 'It MAY rain' — nalla vaayppu irukku. 'It MIGHT rain' — konjam-dhaan vaayppu. Vaakkiyaththula 'slight chance', 'faint hope', 'I doubt it' appadingira vaarththai irundhaa, 'might' podunga."},
 {ta:"இப்போ மிக முக்கியமான பொறி சொல்லுறேன் — COULD மற்றும் WAS ABLE TO. 'He COULD swim well as a boy' — இது பொதுவான திறன், சரி. ஆனா 'The house was on fire, but he COULD escape' — இது தப்பு! ஏன்?",
  tl:"Ippo miga mukkiyamaana pori solluren — COULD matrum WAS ABLE TO. 'He COULD swim well as a boy' — idhu podhuvaana thiran, sari. Aanaa 'The house was on fire, but he COULD escape' — idhu thappu! Yen?"},
 {ta:"ஏன்னா ஒரு குறிப்பிட்ட சந்தர்ப்பத்துல, ஒரு தடவ மட்டும் வெற்றிகரமா செஞ்ச செயலுக்கு 'could' வராது. அதுக்கு 'WAS ABLE TO' வரும். 'He WAS ABLE TO escape.' 'Could' அப்படிங்கிறது பொதுவான, தொடர்ச்சியான திறனுக்கு மட்டும். ஒரு தடவ — was able to. பொதுவா — could. இந்த வித்தியாசம் SSC-ல ரொம்ப கூர்மையான பொறி.",
  tl:"Yennaa oru kurippitta sandharppaththula, oru thadava mattum vetrigaramaa senja seyalukku 'could' varaadhu. Adhukku 'WAS ABLE TO' varum. 'Could' appadingiradhu podhuvaana, thodarchiyaana thiranukku mattum. Oru thadava — was able to. Podhuvaa — could."}]},

/* ========== RULE 66 ========== */
{n:66,rc:"MOD-04",d:"Hard",t:"MUST versus HAVE TO, MUSTN'T versus NEEDN'T",
 tam:"Must = உள் கட்டாயம் · Have to = வெளி கட்டாயம் · Mustn't = தடை · Needn't = அவசியமில்லை",
 s1:{en:"MUST shows the speaker's OWN strong obligation or a confident deduction. HAVE TO shows obligation imposed from OUTSIDE. In the negative they become opposites: MUSTN'T means PROHIBITION, NEEDN'T means NO OBLIGATION.",
  ta:"MUST பேசுபவரின் சொந்தமான வலுவான கட்டாயத்தையோ உறுதியான ஊகத்தையோ காட்டுகிறது. HAVE TO வெளியிலிருந்து விதிக்கப்பட்ட கட்டாயத்தைக் காட்டுகிறது. எதிர்மறையில் அவை எதிரெதிராகின்றன: MUSTN'T என்றால் தடை, NEEDN'T என்றால் கட்டாயம் இல்லை.",
  tl:"MUST pesubavarin sondhamaana valuvaana kattaayaththaiyo urudhiyaana oogaththaiyo kaattugiradhu. HAVE TO veliyilirundhu vidhikkappatta kattaayaththaik kaattugiradhu. Edhirmaraiyil avai edhiredhiraagindrana.",
  formula:"MUST     →  my own decision / strong deduction\n  I MUST lose weight.  (I have decided)\n  He MUST be at home.  (I am sure)\n\nHAVE TO  →  an outside rule\n  I HAVE TO wear a uniform.  (school rule)\n\nNEGATIVES ARE OPPOSITES:\n  You MUSTN'T smoke here.  →  FORBIDDEN\n  You NEEDN'T come tomorrow. →  NOT NECESSARY"},

 s2:[
 {h:"Who is imposing the obligation?",
  en:"'I must lose weight' — nobody is forcing me; I have decided. 'I have to wear a uniform' — the school forces me. Ask WHO is behind the obligation. Myself → must. Someone else or a rule → have to.",
  ta:"கட்டாயத்தை யார் விதிக்கிறார்? 'I must lose weight' — யாரும் என்னைக் கட்டாயப்படுத்தவில்லை; நான் முடிவு செய்திருக்கிறேன். 'I have to wear a uniform' — பள்ளி என்னைக் கட்டாயப்படுத்துகிறது. கட்டாயத்தின் பின்னால் யார் இருக்கிறார் என்று கேளுங்கள். நானே → must. வேறு யாரோ அல்லது ஒரு விதி → have to.",
  tl:"Kattaayaththai yaar vidhikkiraar? 'I must lose weight' — yaarum ennaik kattaayappaduththavillai; naan mudivu seydhirukkiren. 'I have to wear a uniform' — palli ennaik kattaayappaduththugiradhu."},
 {h:"The negatives are complete opposites",
  en:"This is the single most important point. 'You mustn't go' means you are FORBIDDEN to go. 'You needn't go' means you do not HAVE to go, but you may if you wish. Students treat them as the same and lose the mark.",
  ta:"எதிர்மறைகள் முற்றிலும் எதிரானவை. இதுதான் மிக முக்கியமான ஒற்றைப் புள்ளி. 'You mustn't go' என்றால் நீங்கள் செல்லத் தடை செய்யப்பட்டிருக்கிறீர்கள். 'You needn't go' என்றால் நீங்கள் செல்ல வேண்டியதில்லை, ஆனால் விரும்பினால் செல்லலாம். மாணவர்கள் அவற்றை ஒன்றாகக் கருதி mark இழக்கிறார்கள்.",
  tl:"Edhirmaraigal mutrilum edhiraanavai. Idhudhaan miga mukkiyamaana otraip pulli. 'You mustn't go' endraal neengal sellath thadai seyyappattirukkireergal. 'You needn't go' endraal neengal sella vendiyadhillai."},
 {h:"MUST HAVE for a confident deduction about the past",
  en:"'He must have gone home' means I am almost certain he went. Compare with 'He might have gone home' (possible) and 'He can't have gone home' (I am sure he did not). This is a scale of certainty.",
  ta:"கடந்தகாலம் பற்றிய உறுதியான ஊகத்திற்கு MUST HAVE. 'He must have gone home' என்றால் அவர் சென்றுவிட்டார் என்று நான் கிட்டத்தட்ட உறுதியாக நம்புகிறேன். 'He might have gone home' (சாத்தியம்) மற்றும் 'He can't have gone home' (அவர் செல்லவில்லை என்று உறுதி) ஆகியவற்றுடன் ஒப்பிடுங்கள். இது ஒரு உறுதிப்பாட்டு அளவுகோல்.",
  tl:"Kadandhagaalam patriya urudhiyaana oogaththirku MUST HAVE. 'He must have gone home' endraal avar sendruvittaar endru naan kittaththatta urudhiyaaga nambugiren. Idhu oru urudhippaattu alavugol."},
 {h:"MUST has no past or future form of its own",
  en:"You cannot say 'He musted' or 'He will must'. For the past use 'had to': 'He had to leave early yesterday'. For the future use 'will have to': 'You will have to submit it tomorrow'.",
  ta:"MUST-க்கு சொந்தமாக கடந்தகால அல்லது எதிர்கால வடிவம் இல்லை. 'He musted' அல்லது 'He will must' என்று சொல்ல முடியாது. கடந்தகாலத்திற்கு 'had to' பயன்படுத்துங்கள்: 'He had to leave early yesterday'. எதிர்காலத்திற்கு 'will have to': 'You will have to submit it tomorrow'.",
  tl:"MUST-kku sondhamaaga kadandhagaala alladhu edhirkaala vadivam illai. 'He musted' alladhu 'He will must' endru solla mudiyaadhu. Kadandhagaalaththirku 'had to' payanpaduththungal."}],

 s3:[
 {h:"Who is forcing you?",
  d:"   🧍 MYSELF        →  MUST\n      I MUST lose weight.\n      (my own decision)\n\n   🏫 OUTSIDE RULE  →  HAVE TO\n      I HAVE TO wear a uniform.\n      (the school says so)\n\n   Ask: who is behind this obligation?"},
 {h:"The negatives are opposites",
  d:"   MUSTN'T  →  🚫 FORBIDDEN\n     You mustn't smoke here.\n     (it is not allowed at all)\n\n   NEEDN'T  →  🆓 OPTIONAL\n     You needn't come tomorrow.\n     (you may if you want, but no need)\n\n   ⚠ These are NOT the same.\n     Students lose marks here every year."},
 {h:"The certainty scale for the past",
  d:"   MUST HAVE  ████████  I am almost sure he did\n   MAY HAVE   █████     possibly he did\n   MIGHT HAVE ███       perhaps he did\n   CAN'T HAVE ░░░░░░░░  I am sure he did NOT\n\n   He MUST HAVE gone home.\n   He CAN'T HAVE finished so soon.\n\n   ⚠ NO PAST/FUTURE FOR 'MUST':\n     past   → had to\n     future → will have to"}],

 s4:{
 wrong:["\"'Mustn't' and 'needn't' both mean 'no need'.\" — 'Mustn't' means forbidden.",
  "\"'Must' and 'have to' are interchangeable.\" — One is internal, one is external.",
  "\"'He musted go yesterday' is the past form.\" — Use 'had to'.",
  "\"'You will must come' expresses future obligation.\" — Use 'will have to'."],
 right:["Ask who imposes the obligation: myself → must, an outside rule → have to.",
  "MUSTN'T = forbidden. NEEDN'T = optional. They are opposites.",
  "For the past use 'had to'; for the future use 'will have to'.",
  "For a confident past deduction use 'must have + V3'."]},

 s5:[
 {en:"I must lose weight before the medical test.",ta:"மருத்துவ பரிசோதனைக்கு முன் நான் எடையைக் குறைக்க வேண்டும்.",tl:"Maruththuva parisodhanaikku mun naan edaiyaik kuraikka vendum.",note:"My own decision → MUST."},
 {en:"I have to wear a uniform to school.",ta:"நான் பள்ளிக்குச் சீருடை அணிந்து செல்ல வேண்டும்.",tl:"Naan pallikkuch seerudai anindhu sella vendum.",note:"A school rule imposed from outside → HAVE TO."},
 {en:"You mustn't touch that wire; it is live.",ta:"அந்தக் கம்பியைத் தொடக் கூடாது; அதில் மின்சாரம் இருக்கிறது.",tl:"Andhak kambiyaith thodak koodaadhu; adhil minsaaram irukkiradhu.",note:"MUSTN'T = prohibition."},
 {en:"You needn't come tomorrow; the office is closed.",ta:"நீங்கள் நாளை வர வேண்டியதில்லை; அலுவலகம் மூடப்பட்டிருக்கும்.",tl:"Neengal naalai vara vendiyadhillai; aluvalagam moodappattirukkum.",note:"NEEDN'T = no obligation."},
 {en:"He must have reached home by now.",ta:"அவர் இதற்குள் வீட்டை அடைந்திருக்க வேண்டும்.",tl:"Avar idharkul veettai adaindhirukka vendum.",note:"A confident deduction about the past → MUST HAVE."}],

 s8:[
 "You mustn't come tomorrow if you simply mean it is unnecessary.|You needn't come tomorrow if you simply mean it is unnecessary.|'Mustn't' means forbidden, not unnecessary.",
 "You needn't smoke here because it is banned.|You mustn't smoke here because it is banned.|A ban requires 'mustn't'.",
 "He musted leave early yesterday.|He had to leave early yesterday.|'Must' has no past form.",
 "You will must submit it tomorrow.|You will have to submit it tomorrow.|'Must' has no future form.",
 "I have to lose weight, I have decided myself.|I must lose weight, I have decided myself.|A personal decision requires 'must'.",
 "I must wear a uniform because the school says so.|I have to wear a uniform because the school says so.|An outside rule requires 'have to'.",
 "He must had reached home by now.|He must have reached home by now.|Modal + have + V3, not 'had'.",
 "You needn't touch that live wire.|You mustn't touch that live wire.|Danger requires a prohibition.",
 "He must have finished so soon, which is impossible.|He can't have finished so soon, which is impossible.|Certainty that it did not happen requires 'can't have'.",
 "Students needn't carry mobile phones inside the hall.|Students mustn't carry mobile phones inside the hall.|A rule that forbids requires 'mustn't'."],

 s10:{
  en:"MUSTN'T versus NEEDN'T is the sharpest trap in the whole module. In Tamil and Hindi both are often translated the same way, so students treat them as synonyms. They are opposites: 'mustn't' forbids, 'needn't' releases. The second trap is that 'must' has no past or future form — 'musted' and 'will must' are both impossible.",
  ta:"MUSTN'T மற்றும் NEEDN'T முழு module-லும் மிகக் கூர்மையான பொறி. தமிழிலும் இந்தியிலும் இரண்டும் அடிக்கடி ஒரே மாதிரி மொழிபெயர்க்கப்படுகின்றன, எனவே மாணவர்கள் அவற்றை ஒரே பொருள் கொண்டவையாகக் கருதுகிறார்கள். அவை எதிரானவை: 'mustn't' தடை செய்கிறது, 'needn't' விடுவிக்கிறது. இரண்டாவது பொறி 'must'-க்கு கடந்தகால அல்லது எதிர்கால வடிவம் இல்லை — 'musted' மற்றும் 'will must' இரண்டுமே சாத்தியமில்லை.",
  tl:"MUSTN'T matrum NEEDN'T muzhu module-lum migak koormaiyaana pori. Avai edhiraanavai: 'mustn't' thadai seygiradhu, 'needn't' viduvikkiradhu. Irandaavadhu pori 'must'-kku kadandhagaala alladhu edhirkaala vadivam illai."},

 s11:{
  en:"MUSTN'T = FORBIDDEN. NEEDN'T = OPTIONAL. They are opposites, not synonyms.",
  ta:"MUSTN'T = தடை. NEEDN'T = விருப்பம். அவை எதிரானவை, ஒரே பொருள் அல்ல.",
  tl:"MUSTN'T = thadai. NEEDN'T = viruppam. Avai edhiraanavai, ore porul alla.",
  vis:"      THE NEGATIVE TRAP\n\n   🚫 MUSTN'T  =  FORBIDDEN\n      You mustn't smoke here.\n      = smoking is NOT ALLOWED\n\n   🆓 NEEDN'T  =  OPTIONAL\n      You needn't come tomorrow.\n      = come if you like, but no need\n\n   These are OPPOSITES.\n\n   WHO IS FORCING YOU?\n     myself      →  MUST\n     outside rule →  HAVE TO\n\n   ⚠ NO PAST / FUTURE FOR 'MUST':\n     past   →  had to\n     future →  will have to\n     musted ✘   will must ✘"},

 s14:{
  rule:"MUST is internal obligation, HAVE TO is external. MUSTN'T means forbidden, NEEDN'T means not necessary.",
  formula:"MUST → my own decision / strong deduction\nHAVE TO → an outside rule\nMUSTN'T → forbidden | NEEDN'T → optional\nPast: had to | Future: will have to",
  memory:"MUSTN'T forbids. NEEDN'T releases. They are opposites.",
  ta:"MUSTN'T தடை செய்யுது. NEEDN'T விடுவிக்குது. ரெண்டும் எதிரானது.",
  tl:"MUSTN'T thadai seyyudhu. NEEDN'T viduvikkudhu. Rendum edhiraanadhu.",
  mistake:"Treating 'mustn't' and 'needn't' as the same, and writing 'musted' or 'will must'.",
  exam:"SSC CGL / CHSL and Bank — the mustn't-versus-needn't pair is the most repeated modal trap."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு பகுதி இருக்கு, ரெண்டாவது பகுதிதான் SSC-ல mark இழக்க வைக்கிற இடம். முதல்ல எளிமையான பகுதி பார்ப்போம்.",
  tl:"Indha rule-la rendu paguthi irukku, randaavadhu paguthidhaan SSC-la mark izhakka vaikkira idam. Mudhalla elimaiyaana paguthi paarpom."},
 {ta:"MUST மற்றும் HAVE TO — ரெண்டுமே 'வேண்டும்' அப்படிங்கிற அர்த்தம். ஆனா யாரு கட்டாயப்படுத்துறாங்க அப்படிங்கிறதுல வித்தியாசம். 'I MUST lose weight' — யாரும் என்னை கட்டாயப்படுத்தல, நானே முடிவு பண்ணேன். 'I HAVE TO wear a uniform' — பள்ளி விதி, வெளியில இருந்து வர்ற கட்டாயம்.",
  tl:"MUST matrum HAVE TO — rendume 'vendum' appadingira arththam. Aanaa yaaru kattaayappaduththuraanga appadingiradhula viththiyaasam. 'I MUST lose weight' — naane mudivu pannen. 'I HAVE TO wear a uniform' — palli vidhi."},
 {ta:"இப்போ ரொம்ப முக்கியமான பகுதி — எதிர்மறை. இதுல நிறைய பேரு தப்பு பண்ணுவாங்க, ஏன்னா நம்ம மொழியில ரெண்டையும் ஒரே மாதிரி மொழிபெயர்ப்போம். ஆனா ஆங்கிலத்துல இது ரெண்டும் நேர் எதிரானது!",
  tl:"Ippo romba mukkiyamaana paguthi — edhirmarai. Idhula neraiya peru thappu pannuvaanga, yennaa namma mozhiyila rendaiyum ore maadhiri mozhibeyarppom. Aanaa Aangilaththula idhu rendum ner edhiraanadhu!"},
 {ta:"'You MUSTN'T smoke here' அப்படின்னா என்ன? 'இங்க புகைபிடிக்கவே கூடாது' — தடை. கண்டிப்பா முடியாது. ஆனா 'You NEEDN'T come tomorrow' அப்படின்னா என்ன? 'நாளைக்கு வர வேண்டிய அவசியம் இல்ல' — விருப்பம் இருந்தா வரலாம், ஆனா தேவையில்ல.",
  tl:"'You MUSTN'T smoke here' appadinnaa enna? 'Inga pugaipidikkave koodaadhu' — thadai. Aanaa 'You NEEDN'T come tomorrow' appadinnaa enna? 'Naalaikku vara vendiya avasiyam illa' — viruppam irundhaa varalaam."},
 {ta:"வித்தியாசம் தெரியுதா? ஒண்ணு கதவை மூடுது, இன்னொண்ணு கதவை திறக்குது. MUSTN'T = தடை. NEEDN'T = விடுதலை. SSC இதை ஒவ்வொரு வருஷமும் கேட்குது. வாக்கியத்துல clue இருக்கும் — 'it is banned', 'not allowed', 'under any circumstances' அப்படின்னா mustn't. 'it is a holiday', 'the scholarship covers it', 'you can pay later' அப்படின்னா needn't.",
  tl:"Viththiyaasam theriyudhaa? Onnu kadhavai moodudhu, innonnu kadhavai thirakkudhu. MUSTN'T = thadai. NEEDN'T = vidudhalai. Vaakkiyaththula clue irukkum — 'it is banned', 'not allowed' appadinnaa mustn't."},
 {ta:"கடைசியா ஒரு விஷயம் — MUST-க்கு கடந்தகாலமோ எதிர்காலமோ கிடையாது! 'He musted' அப்படின்னு வார்த்தையே இல்ல. 'He will must' அப்படின்னும் இல்ல (Rule 63-ல படிச்சோம், ரெண்டு modal சேராது). கடந்தகாலத்துக்கு 'HAD TO'. எதிர்காலத்துக்கு 'WILL HAVE TO'. 'He HAD TO leave early yesterday.' 'You WILL HAVE TO submit it tomorrow.' இந்த ரெண்டு வடிவமும் SSC-ல அடிக்கடி வரும்.",
  tl:"Kadaisiyaa oru vishayam — MUST-kku kadandhagaalamo edhirkaalamo kidaiyaadhu! 'He musted' appadinnu vaarththaiye illa. Kadandhagaalaththukku 'HAD TO'. Edhirkaalaththukku 'WILL HAVE TO'."}]},
/* ========== RULE 67 ========== */
{n:67,rc:"MOD-05",d:"Medium",t:"SHOULD and OUGHT TO for Duty and Advice",
 tam:"Should, Ought to = கடமை, அறிவுரை · Should have + V3 = செய்யாத கடந்தகால கடமை",
 s1:{en:"SHOULD and OUGHT TO express MORAL DUTY, ADVICE or EXPECTATION. They are weaker than 'must' — they recommend rather than command. 'Ought' always keeps the 'to'.",
  ta:"SHOULD மற்றும் OUGHT TO ஒழுக்கக் கடமை, அறிவுரை அல்லது எதிர்பார்ப்பை வெளிப்படுத்துகின்றன. அவை 'must'-ஐ விட பலவீனமானவை — அவை கட்டளையிடுவதற்குப் பதிலாக பரிந்துரைக்கின்றன. 'Ought' எப்போதும் 'to' வைத்திருக்கும்.",
  tl:"SHOULD matrum OUGHT TO ozhukkak kadamai, arivurai alladhu edhirpaarppai velippaduththugindrana. Avai 'must'-ai vida palaveenamaanavai. 'Ought' eppodhum 'to' vaiththirukkum.",
  formula:"SHOULD / OUGHT TO  →  advice, duty, expectation\n\n  You SHOULD consult a doctor.\n  We OUGHT TO help the poor.\n  The train SHOULD arrive by six. (expectation)\n\nSHOULD HAVE + V3  →  a PAST duty NOT performed\n  You SHOULD HAVE informed us earlier.\n  (but you did not)"},

 s2:[
 {h:"Advice, not command",
  en:"'You must see a doctor' is an order. 'You should see a doctor' is advice. The speaker recommends but leaves the choice open. When an exam sentence gives friendly counsel, 'should' is the answer.",
  ta:"அறிவுரை, கட்டளை அல்ல. 'You must see a doctor' ஒரு கட்டளை. 'You should see a doctor' ஒரு அறிவுரை. பேசுபவர் பரிந்துரைக்கிறார் ஆனால் தேர்வை திறந்தே விடுகிறார். ஒரு தேர்வு வாக்கியம் நட்பான ஆலோசனையைத் தரும்போது, 'should'தான் விடை.",
  tl:"Arivurai, kattalai alla. 'You must see a doctor' oru kattalai. 'You should see a doctor' oru arivurai. Pesubavar parindhuraikkiraar aanaal thervai thirandhe vidugiraar."},
 {h:"SHOULD HAVE + V3 is the tested form",
  en:"'You should have informed us' means you had a duty to inform, and you FAILED to do it. This form carries regret or reproach. SSC tests this far more often than plain 'should'.",
  ta:"SHOULD HAVE + V3 தான் சோதிக்கப்படும் வடிவம். 'You should have informed us' என்றால் உங்களுக்கு அறிவிக்கும் கடமை இருந்தது, நீங்கள் அதைச் செய்யத் தவறிவிட்டீர்கள். இந்த வடிவம் வருத்தத்தையோ கண்டனத்தையோ சுமக்கிறது. வெறும் 'should'-ஐ விட SSC இதை மிக அதிகமாகச் சோதிக்கிறது.",
  tl:"SHOULD HAVE + V3 dhaan sodhikkappadum vadivam. 'You should have informed us' endraal ungalukku arivikkum kadamai irundhadhu, neengal adhaich seyyath thavarivitteergal. Verum 'should'-ai vida SSC idhai miga adhigamaagach sodhikkiradhu."},
 {h:"SHOULD also expresses expectation",
  en:"'The train should arrive by six' does not mean the train has a moral duty. It means we EXPECT it by six. This use is common in polite predictions: 'He should be home by now'.",
  ta:"SHOULD எதிர்பார்ப்பையும் வெளிப்படுத்துகிறது. 'The train should arrive by six' என்றால் ரயிலுக்கு ஒழுக்கக் கடமை இருக்கிறது என்று அர்த்தமில்லை. ஆறு மணிக்குள் அதை நாம் எதிர்பார்க்கிறோம் என்று பொருள். இந்தப் பயன்பாடு நாகரிகமான கணிப்புகளில் பொதுவானது: 'He should be home by now'.",
  tl:"SHOULD edhirpaarppaiyum velippaduththugiradhu. 'The train should arrive by six' endraal aaru manikkul adhai naam edhirpaarkkirom endru porul."},
 {h:"OUGHT TO is slightly more formal",
  en:"'We ought to help the poor' carries a stronger moral tone than 'we should help the poor'. In meaning they are almost identical, but 'ought' feels more like a principle. The 'to' is never dropped.",
  ta:"OUGHT TO சற்று அதிக முறையானது. 'We ought to help the poor' என்பது 'we should help the poor'-ஐ விட வலுவான ஒழுக்கத் தொனியைச் சுமக்கிறது. பொருளில் அவை கிட்டத்தட்ட ஒரே மாதிரி, ஆனால் 'ought' ஒரு கொள்கை போலத் தோன்றுகிறது. 'To' ஒருபோதும் விடப்படுவதில்லை.",
  tl:"OUGHT TO satru adhiga muraiyaanadhu. 'We ought to help the poor' enbadhu 'we should help the poor'-ai vida valuvaana ozhukkath thoniyaich sumakkiradhu. 'To' orupodhum vidappaduvadhillai."}],

 s3:[
 {h:"Strength of obligation",
  d:"   MUST      ████████████  command, no choice\n   HAVE TO   ██████████    outside rule\n   SHOULD    ██████        advice, recommended\n   OUGHT TO  ██████        moral principle\n   COULD     ███           mere suggestion\n\n   'Should' leaves the choice with the listener."},
 {h:"Present duty versus failed past duty",
  d:"   SHOULD + V1  →  duty NOW\n     You SHOULD inform them.\n     (there is still time)\n\n   SHOULD HAVE + V3  →  duty NOT DONE\n     You SHOULD HAVE informed them.\n     (the chance has gone — regret)\n\n   ⚠ This second form is what SSC tests."},
 {h:"The three jobs of SHOULD",
  d:"   💡 ADVICE      : You should rest.\n   ⚖️ MORAL DUTY  : We should help the poor.\n   ⏰ EXPECTATION : The train should arrive by six.\n\n   ⚠ 'OUGHT' KEEPS ITS 'TO':\n     ought TO help  ✔\n     ought help     ✘"}],

 s4:{
 wrong:["\"'Should' and 'must' mean the same.\" — 'Must' commands; 'should' advises.",
  "\"'You should informed me' is the past form.\" — It must be 'should have informed'.",
  "\"'We ought help the poor' is fine.\" — 'Ought' always keeps the 'to'.",
  "\"'The train should arrive' gives the train a duty.\" — Here 'should' expresses expectation."],
 right:["Advice or recommendation → should or ought to.",
  "A past duty that was NOT done → should have + V3.",
  "'Ought' never drops the 'to'.",
  "'Should' can also mean 'I expect'."]},

 s5:[
 {en:"You should consult a doctor immediately.",ta:"நீங்கள் உடனடியாக ஒரு மருத்துவரை அணுக வேண்டும்.",tl:"Neengal udanadiyaaga oru maruththuvarai anuga vendum.",note:"Advice → SHOULD."},
 {en:"We ought to help the poor and the weak.",ta:"நாம் ஏழைகளுக்கும் பலவீனர்களுக்கும் உதவ வேண்டும்.",tl:"Naam ezhaigalukkum palaveenargalukkum udhava vendum.",note:"A moral principle → OUGHT TO, with the 'to' kept."},
 {en:"You should have informed us earlier.",ta:"நீங்கள் எங்களுக்கு முன்பே தெரிவித்திருக்க வேண்டும்.",tl:"Neengal engalukku munbe theriviththirukka vendum.",note:"A past duty that was not performed → SHOULD HAVE + V3."},
 {en:"The train should arrive by six o'clock.",ta:"ரயில் ஆறு மணிக்குள் வந்துவிட வேண்டும்.",tl:"Rayil aaru manikkul vandhuvida vendum.",note:"Expectation, not moral duty → SHOULD."},
 {en:"Citizens ought to obey the law of the land.",ta:"குடிமக்கள் நாட்டின் சட்டத்திற்குக் கீழ்ப்படிய வேண்டும்.",tl:"Kudimakkal naattin sattaththirkuk keezhppadiya vendum.",note:"A civic principle → OUGHT TO."}],

 s8:[
 "We ought help the poor and the needy.|We ought to help the poor and the needy.|'Ought' always keeps the 'to'.",
 "You should informed us earlier about it.|You should have informed us earlier about it.|A past duty requires 'should have + V3'.",
 "He should submitted the form last week.|He should have submitted the form last week.|A missed past duty requires 'should have + V3'.",
 "Citizens ought obey the law of the land.|Citizens ought to obey the law of the land.|'Ought' keeps the 'to'.",
 "She should had told me about the change.|She should have told me about the change.|Modal + have + V3, not 'had'.",
 "You should to take more rest these days.|You should take more rest these days.|'Should' does not take 'to'.",
 "They should started earlier to avoid traffic.|They should have started earlier to avoid traffic.|A missed past duty requires 'should have + V3'.",
 "One ought keep one's promises always.|One ought to keep one's promises always.|'Ought' keeps the 'to'.",
 "You should not spoken so rudely to her.|You should not have spoken so rudely to her.|A past wrong requires 'should not have + V3'.",
 "He ought to helped his friend in trouble.|He ought to have helped his friend in trouble.|A missed past duty requires 'ought to have + V3'."],

 s9:[
 "Fill in the Blank|You ____ have consulted a specialist before starting this medication.|should;should to|0|A past duty requires 'should have + V3'.",
 "Find the Error|Every citizen ought (A) obey the laws (B) of the country (C) without exception (D).|A;B;C;D|0|Part A. 'Ought' always keeps the 'to' → 'ought to obey'.",
 "Sentence Improvement|You should informed the office about your absence at least a day earlier.|should informed;should have informed;should had informed|1|A missed past duty requires 'should have + V3'.",
 "Fill in the Blank|The parcel ____ reach you by Friday if it was posted on Monday.|must;should|1|A polite expectation requires 'should'.",
 "Find the Error|She should had (A) told me about (B) the change in (C) the meeting timings (D).|A;B;C;D|0|Part A. Modal + have + V3 → 'should have told'."],

 s10:{
  en:"SHOULD HAVE + V3 is what the exam actually tests, not plain 'should'. Students write 'You should informed us' because the meaning is clearly past, forgetting that a modal cannot take -ed. The second trap is 'ought' losing its 'to' — since no other modal takes 'to', students drop it by analogy. Only 'ought' keeps it, always.",
  ta:"SHOULD HAVE + V3-தான் தேர்வு உண்மையில் சோதிக்கிறது, வெறும் 'should' அல்ல. பொருள் தெளிவாகக் கடந்தகாலமாக இருப்பதால் மாணவர்கள் 'You should informed us' என்று எழுதுகிறார்கள், ஒரு modal -ed எடுக்க முடியாது என்பதை மறந்துவிடுகிறார்கள். இரண்டாவது பொறி 'ought' தன் 'to'-ஐ இழப்பது — வேறு எந்த modal-ம் 'to' எடுக்காததால், மாணவர்கள் ஒப்புமையால் அதை விட்டுவிடுகிறார்கள். 'Ought' மட்டுமே அதை வைத்திருக்கிறது, எப்போதும்.",
  tl:"SHOULD HAVE + V3-dhaan thervu unmaiyil sodhikkiradhu, verum 'should' alla. Maanavargal 'You should informed us' endru ezhudhugiraargal, oru modal -ed edukka mudiyaadhu enbadhai marandhuvidugiraargal. Irandaavadhu pori 'ought' than 'to'-ai izhappadhu."},

 s11:{
  en:"SHOULD + V1 = duty now. SHOULD HAVE + V3 = duty missed. OUGHT always keeps its TO.",
  ta:"SHOULD + V1 = இப்போதைய கடமை. SHOULD HAVE + V3 = தவறவிட்ட கடமை. OUGHT எப்போதும் தன் TO-ஐ வைத்திருக்கும்.",
  tl:"SHOULD + V1 = ippodhaiya kadamai. SHOULD HAVE + V3 = thavaravitta kadamai. OUGHT eppodhum than TO-ai vaiththirukkum.",
  vis:"      TWO FORMS, TWO TIMES\n\n   SHOULD + V1        →  duty NOW\n     You SHOULD inform them.\n     (there is still time to act)\n\n   SHOULD HAVE + V3   →  duty MISSED\n     You SHOULD HAVE informed them.\n     (the chance is gone — regret)\n\n   ⚠ 'OUGHT' IS THE ONLY MODAL WITH 'TO':\n     ought TO help      ✔\n     ought help         ✘\n     ought TO HAVE helped ✔ (missed duty)\n\n   ⚠ THE THREE JOBS OF 'SHOULD':\n     advice · moral duty · expectation"},

 s13:[
 "You ____ have informed us, and by then we ____ already left ____ station.|should-had-the;should-have-a;must-had-the|0|A missed past duty → SHOULD HAVE. The earlier past action → HAD left (Rule 54).",
 "We ought ____ help the poor, for it is high time society ____ about them.|to-thought;—-thinks;to-thinks|0|'Ought' keeps 'to'. 'It is high time' → THOUGHT (Rule 60).",
 "He ____ be home by now, because he ____ the office two hours ago.|must-has left;should-left;should-has left|1|A polite expectation → SHOULD. 'Ago' forbids the present perfect → LEFT (Rule 52).",
 "Each of the candidates ____ have brought ____ own pen, but none of them ____.|should-his-did;should-their-did;must-his-do|0|A missed duty → SHOULD HAVE. 'Each of' → singular pronoun HIS (Pronoun Rule 29).",
