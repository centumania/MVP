 s14:{
  rule:"BESIDE means by the side of; BESIDES means in addition to, except, or moreover.",
  formula:"BESIDE → place (sat beside her mother)\nBESIDES → addition (besides English), except (nobody besides me), moreover (Besides, he is honest)\nIdiom: beside oneself with joy",
  memory:"Extra S means extra thing. No S means by the side.",
  ta:"கூடுதல் S-ன்னா கூடுதல் விஷயம். S இல்லைன்னா பக்கத்துல.",
  tl:"Koodudhal S-nnaa koodudhal vishayam. S illainnaa pakkaththula.",
  mistake:"Writing 'sat besides her mother' for place, and 'beside English' for addition.",
  exam:"SSC CGL / CHSL and Bank — appears in Error Spotting and Fill in the Blank."},

 s15:[
 {ta:"இந்த rule-ல ஒரே ஒரு எழுத்து — S — முழு அர்த்தத்தையும் மாத்திடும். BESIDE மற்றும் BESIDES. நமக்கு இது ரொம்ப குழப்பமா இருக்கும், ஏன்னா ரெண்டுமே ஒரே மாதிரி தெரியுது.",
  tl:"Indha rule-la ore oru ezhuththu — S — muzhu arththaththaiyum maaththidum. BESIDE matrum BESIDES. Namakku idhu romba kuzhappamaa irukkum."},
 {ta:"BESIDE — S இல்ல — அர்த்தம் 'அருகில்'. இது ஒரு இட முன்னுருபு. 'She sat BESIDE her mother' — அவங்க அம்மா பக்கத்துல உட்கார்ந்தாங்க. 'The temple stands BESIDE the river' — கோயில் நதிக்கரை பக்கத்துல இருக்கு.",
  tl:"BESIDE — S illa — arththam 'arugil'. Idhu oru ida munnurubu. 'She sat BESIDE her mother' — avanga ammaa pakkaththula utkaarndhaanga."},
 {ta:"BESIDES — S இருக்கு — அர்த்தம் 'கூடுதலாக' அல்லது 'தவிர'. 'BESIDES English, he knows French' — ஆங்கிலம் தவிர பிரெஞ்சும் தெரியும். இங்க இடம் பத்தி பேசவே இல்ல, கூட்டல் பத்தி பேசுறோம்.",
  tl:"BESIDES — S irukku — arththam 'koodudhalaaga' alladhu 'thavira'. 'BESIDES English, he knows French' — Aangilam thavira French-um theriyum."},
 {ta:"இதை நினைவு வெச்சுக்க ஒரு அருமையான trick இருக்கு — 'கூடுதல் S, கூடுதல் விஷயம்'. S ஒரு கூடுதல் எழுத்து, அது கூடுதல் விஷயத்தை காட்டுது. S இல்லைன்னா, அது வெறும் இடம். இந்த ஒரு வரி போதும்.",
  tl:"Idhai ninaivu vechukka oru arumaiyaana trick irukku — 'koodudhal S, koodudhal vishayam'. S oru koodudhal ezhuththu, adhu koodudhal vishayaththai kaattudhu. S illainnaa, adhu verum idam."},
 {ta:"BESIDES-க்கு மூணு வேலை இருக்கு. ஒண்ணு — கூட்டல்: 'Besides English, he knows French.' ரெண்டு — தவிர: 'Nobody besides me knew it.' மூணு — இணைப்பு: 'He is clever. Besides, he is honest.' கவனிங்க, மூணாவதுல அதுக்கு அப்பறம் comma வரும்.",
  tl:"BESIDES-kku moonu velai irukku. Onnu — koottal. Rendu — thavira. Moonu — inaippu: 'He is clever. Besides, he is honest.' Kavaninga, moonaavadhula adhukku apparam comma varum."},
 {ta:"கடைசியா ஒரு நிலையான மரபுத்தொடர் — 'beside oneself'. 'He was BESIDE HIMSELF with joy' — அர்த்தம் அவரு மகிழ்ச்சியில தன்னிலை மறந்தாரு. இங்க இடம் பத்தி எந்த சம்பந்தமும் இல்ல, ஆனா S இல்லாத BESIDE-தான் வரும். இது ஒரு மரபுத்தொடர், காரணம் கேட்க முடியாது. SSC இதை அடிக்கடி கேட்குது, ஏன்னா நாம 'besides himself' அப்படின்னு எழுதிடுவோம்.",
  tl:"Kadaisiyaa oru nilaiyaana marabuththodar — 'beside oneself'. 'He was BESIDE HIMSELF with joy'. Inga idam paththi endha sambandhamum illa, aanaa S illaadha BESIDE-dhaan varum. SSC idhai adikkadi ketkudhu."}]},

/* ========== RULE 77 ========== */
{n:77,rc:"PRE-07",d:"Medium",t:"IN versus INTO, ON versus ONTO",
 tam:"In/On = நிலை · Into/Onto = உள்ளே அல்லது மேலே செல்லும் இயக்கம்",
 s1:{en:"IN and ON show POSITION — where something already is. INTO and ONTO show MOVEMENT — going from outside to inside, or up onto a surface. The -TO ending adds the idea of direction.",
  ta:"IN மற்றும் ON நிலையைக் காட்டுகின்றன — ஏதோ ஒன்று ஏற்கனவே எங்கே இருக்கிறது. INTO மற்றும் ONTO இயக்கத்தைக் காட்டுகின்றன — வெளியிலிருந்து உள்ளே செல்வது, அல்லது ஒரு மேற்பரப்பின் மீது ஏறுவது. -TO விகுதி திசையின் கருத்தைச் சேர்க்கிறது.",
  tl:"IN matrum ON nilaiyaik kaattugindrana. INTO matrum ONTO iyakkaththaik kaattugindrana. -TO vigudhi thisaiyin karuththaich serkkiradhu.",
  formula:"IN / ON  →  POSITION (already there)\n  He is IN the room.\n  The book is ON the table.\n\nINTO / ONTO  →  MOVEMENT (going there)\n  He walked INTO the room.\n  The cat jumped ONTO the table.\n\n⚠ VERBS OF MOTION TAKE INTO / ONTO:\n  walk · run · jump · dive · fall · throw · put"},

 s2:[
 {h:"The -TO carries the direction",
  en:"'In' is static; 'in-TO' adds movement. Think of 'to' as an arrow. 'He is IN the room' shows him already inside. 'He walked IN-TO the room' shows him crossing the doorway from outside.",
  ta:"-TO திசையைச் சுமக்கிறது. 'In' நிலையானது; 'in-TO' இயக்கத்தைச் சேர்க்கிறது. 'To'-வை ஒரு அம்பு போல நினையுங்கள். 'He is IN the room' அவர் ஏற்கனவே உள்ளே இருப்பதைக் காட்டுகிறது. 'He walked IN-TO the room' அவர் வெளியிலிருந்து வாசற்படியைக் கடப்பதைக் காட்டுகிறது.",
  tl:"-TO thisaiyaich sumakkiradhu. 'In' nilaiyaanadhu; 'in-TO' iyakkaththaich serkkiradhu. 'To'-vai oru ambu pola ninaiyungal."},
 {h:"Verbs of motion demand INTO or ONTO",
  en:"Walk, run, jump, dive, fall, throw, put, pour, climb, step, break, get — these all involve movement, so they normally take 'into' or 'onto'. 'He dived INTO the pool', 'She poured milk INTO the glass'.",
  ta:"இயக்க வினைச்சொற்கள் INTO அல்லது ONTO கோருகின்றன. Walk, run, jump, dive, fall, throw, put, pour, climb, step, break, get — இவை அனைத்தும் இயக்கத்தை உள்ளடக்குகின்றன, எனவே அவை பொதுவாக 'into' அல்லது 'onto' எடுக்கின்றன. 'He dived INTO the pool', 'She poured milk INTO the glass'.",
  tl:"Iyakka vinaichorkal INTO alladhu ONTO korugindrana. Walk, run, jump, dive, fall, throw, put, pour, climb, step, break, get — ivai anaiththum iyakkaththai ulladakkugindrana."},
 {h:"INTO also means change or transformation",
  en:"'Water turns INTO ice', 'Translate this INTO Tamil', 'He broke the news INTO pieces'. Here 'into' shows a change of state, not physical movement. The idea of crossing a boundary remains.",
  ta:"INTO மாற்றத்தையும் குறிக்கிறது. 'Water turns INTO ice', 'Translate this INTO Tamil', 'He broke it INTO pieces'. இங்கே 'into' ஒரு நிலை மாற்றத்தைக் காட்டுகிறது, உடல் இயக்கத்தை அல்ல. ஒரு எல்லையைக் கடக்கும் கருத்து இன்னும் இருக்கிறது.",
  tl:"INTO maatraththaiyum kurikkiradhu. 'Water turns INTO ice', 'Translate this INTO Tamil'. Inge 'into' oru nilai maatraththaik kaattugiradhu."},
 {h:"Some verbs allow IN even with movement",
  en:"'He put the key in his pocket' and 'He put the key into his pocket' are both accepted in modern English. But with 'dive', 'crash', 'burst' and 'translate', only INTO works. Exams test the clear cases.",
  ta:"சில வினைச்சொற்கள் இயக்கத்துடனும் IN அனுமதிக்கின்றன. 'He put the key in his pocket' மற்றும் 'He put the key into his pocket' இரண்டுமே நவீன ஆங்கிலத்தில் ஏற்கப்படுகின்றன. ஆனால் 'dive', 'crash', 'burst', 'translate' ஆகியவற்றுடன் INTO மட்டுமே வேலை செய்யும். தேர்வுகள் தெளிவான வழக்குகளைச் சோதிக்கின்றன.",
  tl:"Sila vinaichorkal iyakkaththudanum IN anumadhikkindrana. Aanaal 'dive', 'crash', 'burst', 'translate' aagiyavatrudan INTO mattume velai seyyum."}],

 s3:[
 {h:"Static or moving?",
  d:"   IN   →  🧍 already inside\n     He is IN the room.\n     ┌─────────┐\n     │   🧍    │\n     └─────────┘\n\n   INTO →  🚶 crossing the boundary\n     He walked INTO the room.\n     ┌─────────┐\n   🚶─────────►│\n     └─────────┘"},
 {h:"The motion verbs",
  d:"   These normally take INTO / ONTO:\n\n   walk · run · jump · dive · leap\n   fall · throw · put · pour · climb\n   step · crash · burst · get · move\n\n   He dived INTO the pool.\n   She poured milk INTO the glass.\n   The cat jumped ONTO the table."},
 {h:"INTO for transformation",
  d:"   Water turns INTO ice.\n   Translate this INTO Tamil.\n   He broke it INTO pieces.\n   The caterpillar changed INTO a butterfly.\n\n   No physical movement here —\n   but a BOUNDARY is still crossed:\n   from one state to another."}],

 s4:{
 wrong:["\"'He walked in the room' shows he entered.\" — Entry requires 'into'.",
  "\"'The cat jumped on the table' is fine.\" — Jumping up requires 'onto'.",
  "\"'Into' is only for physical movement.\" — It also shows transformation.",
  "\"'Translate this in Tamil' is correct.\" — Translation requires 'into'."],
 right:["Ask: is something already there, or is it moving there?",
  "Already there → in or on. Moving there → into or onto.",
  "Verbs of motion — walk, jump, dive, pour, throw — take into or onto.",
  "Change of state also takes into: turn into, translate into, break into."]},

 s5:[
 {en:"He is in the room reading a book.",ta:"அவர் அறையில் ஒரு புத்தகம் படித்துக் கொண்டிருக்கிறார்.",tl:"Avar araiyil oru puththagam padiththuk kondirukkiraar.",note:"Position, already inside → IN."},
 {en:"He walked into the room without knocking.",ta:"அவர் கதவைத் தட்டாமல் அறைக்குள் நுழைந்தார்.",tl:"Avar kadhavaith thattaamal araikkul nuzhaindhaar.",note:"Movement from outside to inside → INTO."},
 {en:"The cat jumped onto the table.",ta:"பூனை மேசையின் மீது தாவியது.",tl:"Poonai mesaiyin meedhu thaaviyadhu.",note:"Movement up onto a surface → ONTO."},
 {en:"The boy dived into the swimming pool.",ta:"அந்தப் பையன் நீச்சல் குளத்திற்குள் குதித்தான்.",tl:"Andhap paiyan neechal kulaththirkul kudhiththaan.",note:"'Dive' is a verb of motion → INTO."},
 {en:"Please translate this passage into Tamil.",ta:"தயவுசெய்து இந்தப் பத்தியை தமிழில் மொழிபெயருங்கள்.",tl:"Thayavuseydhu indhap paththiyai Thamizhil mozhibeyarungal.",note:"Transformation → INTO."}],

 s9:[

 s10:{
  en:"Tamil does not mark the difference between position and movement with separate words, so 'He walked in the room' feels complete to an Indian learner. The exam plants exactly this. The second trap is transformation — 'translate this in Tamil' looks harmless but requires 'into'. Look at the VERB: if it involves motion or change, use INTO or ONTO.",
  ta:"தமிழ் நிலைக்கும் இயக்கத்திற்கும் இடையிலான வேறுபாட்டை தனித்தனி சொற்களால் குறிப்பதில்லை, எனவே 'He walked in the room' ஒரு இந்திய மாணவருக்கு முழுமையாகத் தோன்றுகிறது. தேர்வு சரியாக இதைத்தான் நடுகிறது. இரண்டாவது பொறி மாற்றம் — 'translate this in Tamil' பாதிப்பில்லாததாகத் தெரிகிறது ஆனால் 'into' தேவை. வினைச்சொல்லைப் பாருங்கள்: அது இயக்கத்தையோ மாற்றத்தையோ உள்ளடக்கினால், INTO அல்லது ONTO பயன்படுத்துங்கள்.",
  tl:"Tamil nilaikkum iyakkaththirkum idaiyilaana verupaattai thanithani sorkalaal kurippadhillai, enave 'He walked in the room' oru Indhiya maanavarukku muzhumaiyaagath thondrugiradhu. Vinaicholaip paarungal."},

 s11:{
  en:"IS IT MOVING OR RESTING? Moving → INTO or ONTO. Resting → IN or ON.",
  ta:"அது நகர்கிறதா, இல்லை ஓய்வில் இருக்கிறதா? நகர்கிறது → INTO அல்லது ONTO. ஓய்வு → IN அல்லது ON.",
  tl:"Adhu nagargiradhaa, illai oyvil irukkiradhaa? Nagargiradhu → INTO alladhu ONTO. Oyvu → IN alladhu ON.",
  vis:"      THE ARROW TEST\n\n   The -TO is an ARROW ➜\n\n   IN   🧍 already inside      (no arrow)\n   INTO 🚶➜ crossing the door  (arrow)\n\n   ON   📖 lying on the table  (no arrow)\n   ONTO 🐈➜ jumping up        (arrow)\n\n   ⚠ VERBS THAT DEMAND THE ARROW:\n     walk · run · jump · dive · fall\n     throw · pour · climb · crash · burst\n\n   ⚠ TRANSFORMATION ALSO TAKES 'INTO':\n     turn INTO ice · translate INTO Tamil\n     break INTO pieces · change INTO a butterfly"},

 "The cat jumped ____ the table, ____ which the milk ____ been kept.|onto-on-had;on-onto-has;onto-onto-had|0|Movement up → ONTO. Position on a surface → ON. Earlier action → HAD.",
 "Water turns ____ ice ____ zero degrees, and it changes ____ vapour ____ boiling.|into-at-into-on;in-in-in-in;into-at-into-in|0|Transformation → INTO. A precise reading → AT. 'On boiling' is the fixed phrase."],

 s14:{
  rule:"IN and ON show position; INTO and ONTO show movement or transformation.",
  formula:"POSITION → in the room, on the table\nMOVEMENT → walked into the room, jumped onto the table\nTRANSFORMATION → turn into ice, translate into Tamil\nMotion verbs: walk, run, jump, dive, fall, pour, throw, climb",
  memory:"The -TO is an arrow. Arrow means movement.",
  ta:"-TO அப்படிங்கிறது ஒரு அம்பு. அம்பு இருந்தா இயக்கம்.",
  tl:"-TO appadingiradhu oru ambu. Ambu irundhaa iyakkam.",
  mistake:"Writing 'walked in the room' for entry and 'translate this in Tamil'.",
  exam:"SSC CGL / CHSL and Bank — appears in Fill in the Blank and Error Spotting."},

 s15:[
 {ta:"இந்த rule-ல ஒரு அழகான தர்க்கம் இருக்கு. 'In' மற்றும் 'into' — ரெண்டுக்கும் வித்தியாசம் ஒரே ஒரு 'to'. அந்த 'to' ஒரு அம்பு மாதிரி — அது திசையை காட்டுது.",
  tl:"Indha rule-la oru azhagaana tharkkam irukku. 'In' matrum 'into' — rendukkum viththiyaasam ore oru 'to'. Andha 'to' oru ambu maadhiri — adhu thisaiyai kaattudhu."},
 {ta:"'He IS in the room' — அவரு ஏற்கனவே அறைக்குள்ள இருக்காரு. நிலை. இயக்கம் இல்ல. ஆனா 'He WALKED INTO the room' — அவரு வெளியில இருந்து உள்ள வந்தாரு. வாசற்படியை கடந்தாரு. இயக்கம் இருக்கு. அதனால 'into'.",
  tl:"'He IS in the room' — avaru erkanave araikkulla irukkaaru. Nilai. Aanaa 'He WALKED INTO the room' — avaru veliyila irundhu ulla vandhaaru. Iyakkam irukku. Adhanaala 'into'."},
 {ta:"நமக்கு இது கஷ்டமா இருக்கும், ஏன்னா தமிழ்ல நிலைக்கும் இயக்கத்துக்கும் வேற வேற வார்த்தை இல்ல. அதனால 'He walked in the room' அப்படின்னு எழுதிடுவோம். ஆனா ஆங்கிலத்துல இது தப்பு.",
  tl:"Namakku idhu kashtamaa irukkum, yennaa Tamil-la nilaikkum iyakkaththukkum veru veru vaarththai illa. Adhanaala 'He walked in the room' appadinnu ezhudhiduvom. Aanaa Aangilaththula idhu thappu."},
 {ta:"ஒரு எளிய சோதனை — வினைச்சொல்லைப் பாருங்க. Walk, run, jump, dive, fall, throw, pour, climb, crash, step — இதெல்லாம் இயக்க வினைச்சொல். இதுக்கு அப்பறம் INTO அல்லது ONTO வரும். Be, is, are, lie, stand, hang — இதெல்லாம் நிலை வினைச்சொல். இதுக்கு IN அல்லது ON.",
  tl:"Oru eliya sodhanai — vinaicholaip paarunga. Walk, run, jump, dive, fall, throw, pour, climb, crash — idhellaam iyakka vinaichol. Idhukku apparam INTO alladhu ONTO varum."},
 {ta:"இப்போ ஒரு நுட்பமான விஷயம் — INTO மாற்றத்தையும் காட்டும். 'Water turns INTO ice' — தண்ணீர் பனிக்கட்டியா மாறுது. இங்க உடல் இயக்கம் இல்ல, ஆனா நிலை மாறுது. ஒரு எல்லையை கடக்கிறோம் — திரவ நிலைல இருந்து திட நிலைக்கு. அதனால INTO.",
  tl:"Ippo oru nutpamaana vishayam — INTO maatraththaiyum kaattum. 'Water turns INTO ice'. Inga udal iyakkam illa, aanaa nilai maarudhu. Oru ellaiyai kadakkirom."},
 {ta:"அதே மாதிரி 'Translate this INTO Tamil' — ஒரு மொழியில இருந்து இன்னொரு மொழிக்கு மாறுறோம். 'Break it INTO pieces' — முழுசா இருந்து துண்டா மாறுது. 'Change INTO a butterfly' — புழு பட்டாம்பூச்சியா மாறுது. இதெல்லாம் மாற்றம். எல்லாத்துக்கும் INTO. SSC 'translate in Tamil' அப்படின்னு தந்து ஏமாத்தும், கவனமா இருங்க.",
  tl:"Adhe maadhiri 'Translate this INTO Tamil' — oru mozhiyila irundhu innoru mozhikku maarurom. 'Break it INTO pieces'. 'Change INTO a butterfly'. Idhellaam maatram. Ellaaththukkum INTO."}]},

/* ========== RULE 78 ========== */
{n:78,rc:"PRE-08",d:"Hard",t:"Verbs that take NO Preposition",
 tam:"Discuss, Marry, Reach, Enter — இவற்றுக்குப் பின் preposition வராது",
 s1:{en:"Some verbs are TRANSITIVE and take a DIRECT OBJECT, so they need NO preposition after them: discuss, marry, resemble, reach, enter, order, attack, accompany, comprise, lack, emphasise, describe, request, demand, await, resist, board.",
  ta:"சில வினைச்சொற்கள் செயப்படுபொருள் எடுப்பவை, அவை ஒரு நேரடி object எடுக்கின்றன, எனவே அவற்றுக்குப் பின் முன்னுருபு தேவையில்லை: discuss, marry, resemble, reach, enter, order, attack, accompany, comprise, lack, emphasise, describe, request, demand, await, resist, board.",
  tl:"Sila vinaichorkal seyappaduporul eduppavai, avai oru neradi object edukkindrana, enave avatrukkup pin munnurubu thevaiyillai: discuss, marry, resemble, reach, enter, order, attack, accompany, comprise, lack, emphasise, describe.",
  formula:"NO PREPOSITION AFTER THESE\n\n  We discussed THE MATTER.      ✔ (not 'about')\n  She married A DOCTOR.         ✔ (not 'with')\n  He resembles HIS FATHER.      ✔ (not 'to')\n  They reached DELHI.           ✔ (not 'at')\n  He entered THE ROOM.          ✔ (not 'into')\n  The team comprises TEN MEMBERS. ✔ (not 'of')"},

 s2:[
 {h:"The verb already contains the preposition idea",
  en:"'Discuss' already means 'talk ABOUT', so adding 'about' repeats the idea. 'Enter' already means 'go INTO'. 'Reach' already means 'arrive AT'. The preposition is built into the verb's meaning.",
  ta:"வினைச்சொல்லுக்குள்ளேயே முன்னுருபுக் கருத்து இருக்கிறது. 'Discuss' ஏற்கனவே 'talk ABOUT' என்று பொருள்படுகிறது, எனவே 'about' சேர்ப்பது கருத்தை மீண்டும் சொல்கிறது. 'Enter' ஏற்கனவே 'go INTO' என்று பொருள்படுகிறது. 'Reach' ஏற்கனவே 'arrive AT'. முன்னுருபு வினைச்சொல்லின் பொருளுக்குள்ளேயே கட்டமைக்கப்பட்டிருக்கிறது.",
  tl:"Vinaicholukkulleye munnurubuk karuththu irukkiradhu. 'Discuss' erkanave 'talk ABOUT' endru porulpadugiradhu. 'Enter' erkanave 'go INTO'. 'Reach' erkanave 'arrive AT'."},
 {h:"The two most planted errors",
  en:"'DISCUSS ABOUT' and 'REACH AT' appear in almost every SSC error-spotting set. Both feel completely natural to Indian speakers because we say them daily. Both are wrong. 'We discussed the matter', 'They reached Delhi'.",
  ta:"மிக அதிகமாக நடப்படும் இரண்டு தவறுகள். 'DISCUSS ABOUT' மற்றும் 'REACH AT' கிட்டத்தட்ட ஒவ்வொரு SSC error-spotting தொகுப்பிலும் வருகின்றன. இரண்டுமே இந்தியப் பேச்சாளர்களுக்கு முற்றிலும் இயற்கையாகத் தோன்றுகின்றன, ஏனெனில் நாம் அவற்றைத் தினமும் சொல்கிறோம். இரண்டுமே தவறு.",
  tl:"Miga adhigamaaga nadappadum irandu thavarugal. 'DISCUSS ABOUT' matrum 'REACH AT' kittaththatta ovvoru SSC error-spotting thoguppilum varugindrana. Irandume thavaru."},
 {h:"COMPRISE never takes OF",
  en:"'The committee comprises ten members' is correct. 'Comprises of' is wrong, even though 'consists OF' is right. Compare: 'consists of' ✔, 'comprises' ✔, 'comprises of' ✘, 'is composed of' ✔.",
  ta:"COMPRISE ஒருபோதும் OF எடுக்காது. 'The committee comprises ten members' சரி. 'Comprises of' தவறு, 'consists OF' சரியாக இருந்தாலும். ஒப்பிடுங்கள்: 'consists of' சரி, 'comprises' சரி, 'comprises of' தவறு, 'is composed of' சரி.",
  tl:"COMPRISE orupodhum OF edukkaadhu. 'The committee comprises ten members' sari. 'Comprises of' thavaru, 'consists OF' sariyaaga irundhaalum."},
 {h:"But some of these verbs take a preposition in other senses",
  en:"'Marry' takes no preposition when you marry a person, but 'be married TO' is correct: 'She is married to a doctor'. 'Attack' takes none, but 'an attack ON the city' is a noun with a preposition. Context matters.",
  ta:"ஆனால் இந்த வினைச்சொற்களில் சில வேறு பொருள்களில் முன்னுருபு எடுக்கின்றன. நீங்கள் ஒரு நபரை மணக்கும்போது 'marry' முன்னுருபு எடுக்காது, ஆனால் 'be married TO' சரி: 'She is married to a doctor'. 'Attack' எதுவும் எடுக்காது, ஆனால் 'an attack ON the city' ஒரு முன்னுருபுடன் கூடிய பெயர்ச்சொல். சூழல் முக்கியம்.",
  tl:"Aanaal indha vinaichorkalil sila veru porulgalil munnurubu edukkindrana. 'Marry' munnurubu edukkaadhu, aanaal 'be married TO' sari. Soozhal mukkiyam."}],

 s3:[
 {h:"The preposition is inside the verb",
  d:"   DISCUSS   =  talk ABOUT     → no 'about' needed\n   ENTER     =  go INTO        → no 'into' needed\n   REACH     =  arrive AT      → no 'at' needed\n   MARRY     =  wed WITH       → no 'with' needed\n   RESEMBLE  =  look LIKE      → no 'to' needed\n   COMPRISE  =  be made OF     → no 'of' needed\n\n   Adding the preposition REPEATS the idea."},
 {h:"The full list to memorise",
  d:"   discuss · marry · resemble · reach\n   enter · order · attack · accompany\n   comprise · lack · emphasise · describe\n   request · demand · await · resist · board\n\n   MEMORY WORD:  D-M-R-R-E-A-C\n   Discuss · Marry · Resemble · Reach\n   Enter · Attack · Comprise"},
 {h:"The two SSC favourites",
  d:"   ✘ We discussed ABOUT the matter.\n   ✔ We discussed the matter.\n\n   ✘ They reached AT Delhi.\n   ✔ They reached Delhi.\n\n   These two appear in almost every paper\n   because every Indian speaker says them."}],

 s4:{
 wrong:["\"'Discuss about' makes the meaning clearer.\" — 'Discuss' already means 'talk about'.",
  "\"'Reach at the station' is more precise.\" — 'Reach' already means 'arrive at'.",
  "\"'Comprises of' matches 'consists of'.\" — 'Comprise' never takes 'of'.",
  "\"'Married with a doctor' shows the partnership.\" — It must be 'married a doctor'."],
 right:["Memorise the no-preposition list.",
  "Ask whether the verb already contains the preposition's meaning.",
  "'Discuss the matter', 'reach Delhi', 'enter the room', 'comprise ten members'.",
  "Watch the exceptions: 'be married TO', 'an attack ON'."]},

 s5:[
 {en:"We discussed the matter for two hours.",ta:"நாங்கள் அந்த விஷயத்தை இரண்டு மணி நேரம் விவாதித்தோம்.",tl:"Naangal andha vishayaththai irandu mani neram vivaadhiththom.",note:"'Discuss' takes a direct object → no 'about'."},
 {en:"She married a doctor from Chennai.",ta:"அவர் சென்னையைச் சேர்ந்த ஒரு மருத்துவரை மணந்தார்.",tl:"Avar Chennaiyaich serndha oru maruththuvarai manandhaar.",note:"'Marry' takes a direct object → no 'with'."},
 {en:"He resembles his father in every way.",ta:"அவர் எல்லா வகையிலும் தன் தந்தையைப் போலவே இருக்கிறார்.",tl:"Avar ellaa vagaiyilum than thandhaiyaip polave irukkiraar.",note:"'Resemble' takes a direct object → no 'to'."},

 s9:[

 s10:{
  en:"'We discussed about the matter' and 'They reached at Delhi' are said in every Indian office, classroom and news bulletin. That is precisely why SSC plants them. Adding the preposition feels like adding clarity, but the verb already contains that meaning. The third favourite is 'comprises of', which students copy from 'consists of'.",
  ta:"'We discussed about the matter' மற்றும் 'They reached at Delhi' ஒவ்வொரு இந்திய அலுவலகத்திலும், வகுப்பறையிலும், செய்தி அறிக்கையிலும் சொல்லப்படுகின்றன. அதனால்தான் SSC அவற்றை நடுகிறது. முன்னுருபு சேர்ப்பது தெளிவைச் சேர்ப்பது போலத் தோன்றுகிறது, ஆனால் வினைச்சொல் ஏற்கனவே அந்தப் பொருளைக் கொண்டிருக்கிறது. மூன்றாவது விருப்பம் 'comprises of', அதை மாணவர்கள் 'consists of'-லிருந்து நகலெடுக்கிறார்கள்.",
  tl:"'We discussed about the matter' matrum 'They reached at Delhi' ovvoru Indhiya aluvalagaththilum sollappadugindrana. Adhanaal-dhaan SSC avatrai nadugiradhu. Moondraavadhu viruppam 'comprises of'."},

 s11:{
  en:"THE PREPOSITION IS ALREADY INSIDE THE VERB. Discuss = talk about. Reach = arrive at.",
  ta:"முன்னுருபு ஏற்கனவே வினைச்சொல்லுக்குள்ளேயே இருக்கிறது. Discuss = talk about. Reach = arrive at.",
  tl:"Munnurubu erkanave vinaicholukkulleye irukkiradhu. Discuss = talk about. Reach = arrive at.",
  vis:"      THE PREPOSITION IS BUILT IN\n\n   DISCUSS   =  talk ABOUT\n   ENTER     =  go INTO\n   REACH     =  arrive AT\n   MARRY     =  wed WITH\n   RESEMBLE  =  look LIKE\n   COMPRISE  =  be made OF\n   ATTACK    =  make war ON\n   AWAIT     =  wait FOR\n\n   Adding the preposition SAYS IT TWICE.\n\n   MEMORY WORD:  DMRR-EAC\n   Discuss · Marry · Resemble · Reach\n   Enter · Attack · Comprise\n\n   ⚠ WATCH THE EXCEPTIONS:\n     be married TO · an attack ON\n     consist OF (but comprise, no 'of')"},

 s13:[
 "We discussed ____ the matter and reached ____ Delhi ____ midnight.|—-—-by;about-at-at;—-at-by|0|'Discuss' and 'reach' take no preposition. A deadline → BY (Rule 74).",

 "He entered ____ the hall and walked ____ the stage where the guests ____ seated.|—-onto-were;into-on-was;—-on-were|0|'Enter' takes no preposition. Movement up → ONTO (Rule 77). Plural → WERE.",

 s14:{
  rule:"Discuss, marry, resemble, reach, enter, attack, accompany and comprise take a direct object with no preposition.",
  formula:"NO PREPOSITION: discuss · marry · resemble · reach · enter\norder · attack · accompany · comprise · lack · emphasise · await\nEXCEPTIONS: be married TO · an attack ON · consist OF",
  memory:"The preposition is already inside the verb. Discuss means talk about.",
  ta:"முன்னுருபு ஏற்கனவே verb-க்குள்ளேயே இருக்கு. Discuss-ன்னா 'talk about'.",
  tl:"Munnurubu erkanave verb-kkulleye irukku. Discuss-nnaa 'talk about'.",
  mistake:"Writing 'discuss about', 'reach at', 'enter into' and 'comprises of'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — 'discuss about' and 'reach at' are among the most repeated errors of all."},

 s15:[
 {ta:"இந்த rule-ல நாம ஒரு பெரிய பழக்கத்தை மாத்தணும். 'We discussed ABOUT the matter' — இதை நாம office-ல, class-ல, TV-ல எல்லா இடத்துலயும் கேட்குறோம். ஆனா இது தப்பு.",
  tl:"Indha rule-la naama oru periya pazhakkaththai maaththanum. 'We discussed ABOUT the matter' — idhai naama office-la, class-la, TV-la ellaa idaththulayum ketkurom. Aanaa idhu thappu."},
 {ta:"ஏன் தப்பு? 'Discuss' அப்படிங்கிற வார்த்தையோட அர்த்தமே 'talk ABOUT'. அந்த 'about' ஏற்கனவே வினைச்சொல்லுக்குள்ள இருக்கு! மறுபடி 'about' போட்டா, ஒரே விஷயத்தை ரெண்டு தடவ சொல்றோம்.",
  tl:"Yen thappu? 'Discuss' appadingira vaarththaiyoda arththame 'talk ABOUT'. Andha 'about' erkanave vinaicholukkulla irukku! Marubadi 'about' pottaa, ore vishayaththai rendu thadava solrom."},
 {ta:"இதே logic மத்த வினைச்சொல்லுக்கும் பொருந்தும். 'Enter' அப்படின்னா 'go INTO'. அதனால 'enter into the room' — 'into' ரெண்டு தடவ! 'Reach' அப்படின்னா 'arrive AT'. அதனால 'reach at Delhi' — 'at' ரெண்டு தடவ! 'Marry' அப்படின்னா 'wed WITH'. அதனால 'marry with' — தப்பு.",
  tl:"Idhe logic maththa vinaicholukkum porundhum. 'Enter' appadinnaa 'go INTO'. 'Reach' appadinnaa 'arrive AT'. Adhanaala 'reach at Delhi' — 'at' rendu thadava! 'Marry' appadinnaa 'wed WITH'."},
 {ta:"பட்டியலை மனப்பாடம் பண்ணுங்க: Discuss, Marry, Resemble, Reach, Enter, Attack, Comprise, Accompany, Order, Lack, Emphasise, Await, Describe, Request, Board. இதுக்கு எல்லாம் preposition கிடையாது.",
  tl:"Pattiyalai manappaadam pannunga: Discuss, Marry, Resemble, Reach, Enter, Attack, Comprise, Accompany, Order, Lack, Emphasise, Await, Describe, Request, Board."},
 {ta:"இப்போ ஒரு நுட்பமான பொறி — COMPRISE மற்றும் CONSIST. 'The team CONSISTS OF ten players' — சரி! 'Consist'-க்கு 'of' வரும். ஆனா 'The team COMPRISES ten players' — 'of' இல்ல! 'Comprises of' தப்பு. ரெண்டும் ஒரே அர்த்தம், ஆனா ஒண்ணுக்கு preposition வரும், இன்னொண்ணுக்கு வராது. இதை SSC அடிக்கடி கேட்குது.",
  tl:"Ippo oru nutpamaana pori — COMPRISE matrum CONSIST. 'The team CONSISTS OF ten players' — sari! Aanaa 'The team COMPRISES ten players' — 'of' illa! 'Comprises of' thappu."},
 {ta:"கடைசியா சில விதிவிலக்கு. 'Marry' -க்கு preposition இல்ல, ஆனா 'be married TO' சரி! 'She married a doctor' ✔ மற்றும் 'She is married TO a doctor' ✔ — ரெண்டுமே சரி. அதே மாதிரி வினைச்சொல் 'attack' -க்கு preposition இல்ல, ஆனா பெயர்ச்சொல் 'an attack ON the city' — இங்க 'on' வரும். வினைச்சொல்லா, பெயர்ச்சொல்லா அப்படின்னு பாருங்க.",
  tl:"Kadaisiyaa sila vidhivilakku. 'Marry'-kku preposition illa, aanaa 'be married TO' sari! Adhe maadhiri vinaichol 'attack'-kku preposition illa, aanaa peyarchol 'an attack ON the city' — inga 'on' varum."}]},

/* ========== RULE 79 ========== */
{n:79,rc:"PRE-09",d:"Hard",t:"Verbs with a FIXED Preposition",
 tam:"Depend on, Insist on, Consist of, Prefer to — நிலையான இணைகள்",
 s1:{en:"Many verbs are LOCKED to one particular preposition. These are fixed collocations that must be memorised as single units: depend ON, insist ON, consist OF, comply WITH, deprive OF, accuse OF, charge WITH, prefer TO, congratulate ON, apologise FOR, believe IN, rely ON.",
  ta:"பல வினைச்சொற்கள் ஒரு குறிப்பிட்ட முன்னுருபுடன் பூட்டப்பட்டிருக்கின்றன. இவை ஒற்றை அலகுகளாக மனப்பாடம் செய்யப்பட வேண்டிய நிலையான இணைகள்: depend ON, insist ON, consist OF, comply WITH, deprive OF, accuse OF, charge WITH, prefer TO, congratulate ON, apologise FOR, believe IN, rely ON.",
  tl:"Pala vinaichorkal oru kurippitta munnurubudan poottappattirukkindrana. Ivai otrai alagugalaaga manappaadam seyyappada vendiya nilaiyaana inaigal.",
  formula:"VERB + FIXED PREPOSITION\n\n  depend ON · rely ON · insist ON\n  consist OF · deprive OF · accuse OF\n  comply WITH · charge WITH · quarrel WITH\n  prefer TO · object TO · listen TO\n  apologise FOR · wait FOR · long FOR\n  believe IN · succeed IN · result IN\n  congratulate ON · concentrate ON"},

 s2:[
 {h:"These cannot be worked out logically",
  en:"There is no rule that explains why 'depend' takes 'on' and 'consist' takes 'of'. These pairings developed by usage over centuries. You must learn each verb together with its preposition as ONE word: 'depend-on', 'consist-of'.",
  ta:"இவற்றைத் தர்க்கரீதியாகக் கண்டுபிடிக்க முடியாது. 'Depend' ஏன் 'on' எடுக்கிறது, 'consist' ஏன் 'of' எடுக்கிறது என்பதை விளக்கும் விதி எதுவும் இல்லை. இந்த இணைகள் நூற்றாண்டுகளாகப் பயன்பாட்டால் உருவாகின. ஒவ்வொரு வினைச்சொல்லையும் அதன் முன்னுருபுடன் சேர்த்து ஒரே சொல்லாகக் கற்க வேண்டும்: 'depend-on', 'consist-of'.",
  tl:"Ivatraith tharkkareedhiyaagak kandupidikka mudiyaadhu. Indha inaigal nootraandugalaagap payanpaattaal uruvaagina. Ovvoru vinaicholaiyum adhan munnurubudan serthu ore sollaagak katka vendum."},
 {h:"PREFER takes TO, never THAN",
  en:"'I prefer coffee TO tea' — never 'than tea'. This is the single most planted error in this rule, because 'prefer' expresses a comparison and comparisons usually take 'than'. But 'prefer' comes from Latin and takes 'to'.",
  ta:"PREFER TO எடுக்கும், ஒருபோதும் THAN அல்ல. 'I prefer coffee TO tea' — ஒருபோதும் 'than tea' அல்ல. இது இந்த விதியில் மிக அதிகமாக நடப்படும் தவறு, ஏனெனில் 'prefer' ஒரு ஒப்பீட்டை வெளிப்படுத்துகிறது, ஒப்பீடுகள் பொதுவாக 'than' எடுக்கின்றன. ஆனால் 'prefer' லத்தீனிலிருந்து வருகிறது, 'to' எடுக்கிறது.",
  tl:"PREFER TO edukkum, orupodhum THAN alla. 'I prefer coffee TO tea' — orupodhum 'than tea' alla. Idhu indha vidhiyil miga adhigamaaga nadappadum thavaru."},
 {h:"Some verbs change meaning with the preposition",
  en:"'Agree WITH a person', 'agree TO a proposal', 'agree ON a plan'. 'Part WITH money', 'part FROM a friend'. The preposition is not decoration — it changes what the sentence means.",
  ta:"சில வினைச்சொற்கள் முன்னுருபுடன் பொருள் மாறுகின்றன. 'Agree WITH a person', 'agree TO a proposal', 'agree ON a plan'. 'Part WITH money', 'part FROM a friend'. முன்னுருபு அலங்காரம் அல்ல — அது வாக்கியத்தின் பொருளை மாற்றுகிறது.",
  tl:"Sila vinaichorkal munnurubudan porul maarugindrana. 'Agree WITH a person', 'agree TO a proposal', 'agree ON a plan'. Munnurubu alangaaram alla — adhu vaakkiyaththin porulai maatrugiradhu."},
 {h:"Learn them in groups by preposition",
  en:"Group them by their preposition and they are easier to remember. ON: depend, rely, insist, congratulate, concentrate. OF: consist, deprive, accuse, approve, dispose. WITH: comply, charge, quarrel, cope, deal. FOR: apologise, wait, long, care, account.",
  ta:"முன்னுருபு வாரியாகக் குழுக்களாகக் கற்றுக்கொள்ளுங்கள். முன்னுருபு வாரியாகக் குழுவாக்கினால் நினைவில் வைப்பது எளிது. ON: depend, rely, insist, congratulate, concentrate. OF: consist, deprive, accuse, approve, dispose. WITH: comply, charge, quarrel, cope, deal. FOR: apologise, wait, long, care, account.",
  tl:"Munnurubu vaariyaagak kuzhukkalaagak katrukkollungal. ON: depend, rely, insist, congratulate, concentrate. OF: consist, deprive, accuse, approve. WITH: comply, charge, quarrel, cope. FOR: apologise, wait, long, care."}],

 s3:[
 {h:"Learn them in preposition groups",
  d:"   ON   : depend · rely · insist · congratulate\n          concentrate · comment · impose\n\n   OF   : consist · deprive · accuse · approve\n          dispose · beware · repent\n\n   WITH : comply · charge · quarrel · cope\n          deal · interfere · part (money)\n\n   FOR  : apologise · wait · long · care\n          account · atone · compensate\n\n   TO   : prefer · object · listen · refer\n          belong · reply · attend · yield\n\n   IN   : believe · succeed · result · persist"},
 {h:"The PREFER trap",
  d:"   I prefer coffee TO tea.      ✔\n   I prefer coffee THAN tea.    ✘\n\n   'Prefer' feels like a comparison,\n   and comparisons take 'than' —\n   but 'prefer' comes from LATIN\n   and Latin comparatives take 'to'.\n\n   Same family:\n     senior TO · junior TO · superior TO\n     inferior TO · prior TO · preferable TO"},
 {h:"The preposition changes the meaning",
  d:"   AGREE WITH a person\n     I agree with you.\n   AGREE TO a proposal\n     He agreed to the plan.\n   AGREE ON a decision\n     They agreed on a date.\n\n   PART WITH money  (give it away)\n   PART FROM a friend (separate from)"}],

 s4:{
 wrong:["\"'Prefer than' is right because it compares two things.\" — 'Prefer' always takes 'to'.",
  "\"'Comply to the rules' sounds correct.\" — 'Comply' takes 'with'.",
  "\"'Depend upon' and 'depend on' are different.\" — Both are correct; 'depend in' is not.",
  "\"'Consists in' and 'consists of' mean the same.\" — 'Consist of' means 'be made of'."],
 right:["Learn each verb and its preposition as one word.",
  "Group them: depend ON, consist OF, comply WITH, prefer TO.",
  "Remember 'prefer' always takes 'to', never 'than'.",
  "Watch the meaning shifts: agree with, agree to, agree on."]},

 s5:[
 {en:"Success depends on hard work and patience.",ta:"வெற்றி கடின உழைப்பையும் பொறுமையையும் சார்ந்திருக்கிறது.",tl:"Vetri kadina uzhaippaiyum porumaiyaiyum saarndhirukkiradhu.",note:"'Depend' is locked to ON."},
 {en:"He insisted on paying the entire bill.",ta:"முழு பில்லையும் தானே செலுத்துவதாக அவர் வலியுறுத்தினார்.",tl:"Muzhu bill-aiyum thaane seluththuvadhaaga avar valiyuruththinaar.",note:"'Insist' is locked to ON."},
 {en:"The team consists of eleven players.",ta:"அந்த அணியில் பதினொரு வீரர்கள் உள்ளனர்.",tl:"Andha aniyil padhinoru veerargal ullanar.",note:"'Consist' is locked to OF."},
 {en:"I prefer coffee to tea in the morning.",ta:"காலையில் நான் தேநீரைவிட காபியை விரும்புகிறேன்.",tl:"Kaalaiyil naan theneeraivida kaapiyai virumbugiren.",note:"'Prefer' takes TO, never 'than'."},
 {en:"All members must comply with the rules.",ta:"அனைத்து உறுப்பினர்களும் விதிகளைப் பின்பற்ற வேண்டும்.",tl:"Anaiththu uruppinargalum vidhigalaip pinpatra vendum.",note:"'Comply' is locked to WITH."}],

 s8:[
 "Success depends upon on hard work.|Success depends on hard work.|Use either 'on' or 'upon', not both.",
 "He insisted for paying the bill.|He insisted on paying the bill.|'Insist' takes 'on'.",
 "The team consists eleven players.|The team consists of eleven players.|'Consist' takes 'of'.",
 "I prefer coffee than tea.|I prefer coffee to tea.|'Prefer' always takes 'to'.",
 "All members must comply to the rules.|All members must comply with the rules.|'Comply' takes 'with'.",
 "She was accused for theft.|She was accused of theft.|'Accuse' takes 'of'.",
 "He apologised of his rude behaviour.|He apologised for his rude behaviour.|'Apologise' takes 'for'.",
 "I congratulate you for your success.|I congratulate you on your success.|'Congratulate' takes 'on'.",
 "He was charged of murder.|He was charged with murder.|'Charge' takes 'with'.",
 "They were deprived from their rights.|They were deprived of their rights.|'Deprive' takes 'of'."],

 s9:[

 s10:{
  en:"There is no logic to memorise here, only the pairs themselves. The single most planted error is 'prefer than' — it feels right because 'prefer' compares two things, and comparisons normally take 'than'. But 'prefer' belongs to the Latin family with 'senior', 'junior' and 'superior', all of which take 'to'. Learn the verb and its preposition as one word.",
  ta:"இங்கே மனப்பாடம் செய்ய தர்க்கம் எதுவும் இல்லை, இணைகள் மட்டுமே. மிக அதிகமாக நடப்படும் தவறு 'prefer than' — அது சரியெனத் தோன்றுகிறது, ஏனெனில் 'prefer' இரண்டு விஷயங்களை ஒப்பிடுகிறது, ஒப்பீடுகள் பொதுவாக 'than' எடுக்கின்றன. ஆனால் 'prefer' 'senior', 'junior', 'superior' ஆகியவற்றுடன் லத்தீன் குடும்பத்தைச் சேர்ந்தது, அவை அனைத்தும் 'to' எடுக்கின்றன.",
  tl:"Inge manappaadam seyya tharkkam edhuvum illai, inaigal mattume. Miga adhigamaaga nadappadum thavaru 'prefer than'. Aanaal 'prefer' 'senior', 'junior', 'superior' aagiyavatrudan Latin kudumbaththaich serndhadhu."},

 s11:{
  en:"LEARN THE VERB AND ITS PREPOSITION AS ONE WORD. Depend-on. Consist-of. Prefer-to.",
  ta:"வினைச்சொல்லையும் அதன் முன்னுருபையும் ஒரே சொல்லாகக் கற்றுக்கொள்ளுங்கள். Depend-on. Consist-of. Prefer-to.",
  tl:"Vinaicholaiyum adhan munnurubaiyum ore sollaagak katrukkollungal. Depend-on. Consist-of. Prefer-to.",
  vis:"      GROUP THEM BY PREPOSITION\n\n   ON   depend · rely · insist · congratulate\n        concentrate · comment · impose\n\n   OF   consist · deprive · accuse · approve\n        dispose · beware · repent · assure\n\n   WITH comply · charge · quarrel · cope\n        deal · interfere · trust · part (money)\n\n   FOR  apologise · wait · long · care\n        account · atone · compensate · hope\n\n   TO   prefer · object · listen · refer\n        belong · reply · attend · yield\n\n   IN   believe · succeed · result · persist\n\n   ⚠ THE BIGGEST TRAP:\n     prefer TO, never prefer THAN"},

 s13:[

 s14:{
  rule:"Many verbs are locked to one preposition and must be memorised as fixed pairs.",
  formula:"ON: depend, rely, insist, congratulate, concentrate\nOF: consist, deprive, accuse, approve\nWITH: comply, charge, quarrel, cope\nFOR: apologise, wait, long, care\nTO: prefer, object, listen, refer, belong\nIN: believe, succeed, result, persist",
  memory:"Learn the verb and its preposition as one word: depend-on, prefer-to.",
  ta:"Verb-ஐயும் அதோட preposition-ஐயும் ஒரே வார்த்தையா கத்துக்கோங்க: depend-on, prefer-to.",
  tl:"Verb-aiyum adhoda preposition-aiyum ore vaarththaiyaa kaththukkonga: depend-on, prefer-to.",
  mistake:"Writing 'prefer than', 'comply to', 'congratulate for' and 'accused for'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — 'prefer than' is the single most repeated error."},

 s15:[
 {ta:"இந்த rule-ல ஒரு நேர்மையான விஷயம் சொல்லணும் — இங்க தர்க்கம் கிடையாது. 'Depend' ஏன் 'on' எடுக்குது? 'Consist' ஏன் 'of' எடுக்குது? காரணம் இல்ல. நூற்றாண்டுகளா பயன்பாட்டால உருவானது. மனப்பாடம்தான் வழி.",
  tl:"Indha rule-la oru nermaiyaana vishayam sollanum — inga tharkkam kidaiyaadhu. 'Depend' yen 'on' edukkudhu? Kaaranam illa. Nootraandugalaa payanpaattaala uruvaanadhu. Manappaadam-dhaan vazhi."},
 {ta:"ஆனா ஒரு எளிய வழி இருக்கு — வினைச்சொல்லையும் முன்னுருபையும் ஒரே வார்த்தையா கத்துக்கோங்க. 'Depend-on' ஒரு வார்த்தை. 'Consist-of' ஒரு வார்த்தை. 'Prefer-to' ஒரு வார்த்தை. தனித்தனியா கத்துக்காதீங்க.",
  tl:"Aanaa oru eliya vazhi irukku — vinaicholaiyum munnurubaiyum ore vaarththaiyaa kaththukkonga. 'Depend-on' oru vaarththai. 'Consist-of' oru vaarththai. Thanithaniyaa kaththukkaadheenga."},
 {ta:"இன்னும் எளிமையா — முன்னுருபு வாரியா குழுவா படிங்க. ON குழு: depend, rely, insist, congratulate, concentrate. OF குழு: consist, deprive, accuse, approve. WITH குழு: comply, charge, quarrel, cope. FOR குழு: apologise, wait, long, care. TO குழு: prefer, object, listen, belong. IN குழு: believe, succeed, result.",
  tl:"Innum elimaiyaa — munnurubu vaariyaa kuzhuvaa padinga. ON kuzhu: depend, rely, insist, congratulate. OF kuzhu: consist, deprive, accuse. WITH kuzhu: comply, charge, quarrel, cope. TO kuzhu: prefer, object, listen, belong."},
 {ta:"இப்போ மிக முக்கியமான பொறி — PREFER. 'I prefer coffee THAN tea' — இது தப்பு! ஆனா ஏன் நமக்கு இது சரி மாதிரி தோணுது? ஏன்னா 'prefer' ரெண்டு விஷயத்தை ஒப்பிடுது, ஒப்பீட்டுக்கு 'than' வரும் இல்லையா? 'Taller THAN', 'better THAN'.",
  tl:"Ippo miga mukkiyamaana pori — PREFER. 'I prefer coffee THAN tea' — idhu thappu! Aanaa yen namakku idhu sari maadhiri thonudhu? Yennaa 'prefer' rendu vishayaththai oppidudhu."},
 {ta:"ஆனா 'prefer' லத்தீன் மொழியில இருந்து வந்தது. லத்தீன் ஒப்பீட்டு சொல்லுக்கு 'to' வரும், 'than' இல்ல. அதே குடும்பத்துல senior TO, junior TO, superior TO, inferior TO, prior TO, preferable TO — எல்லாத்துக்கும் 'to'. இதை Adjectives module-ல Rule 96-ல மறுபடி பார்ப்போம்.",
  tl:"Aanaa 'prefer' Latin mozhiyila irundhu vandhadhu. Latin oppeettu sollukku 'to' varum, 'than' illa. Adhe kudumbaththula senior TO, junior TO, superior TO, inferior TO, prior TO — ellaaththukkum 'to'."},
 {ta:"கடைசியா ஒரு நுட்பமான விஷயம் — சில வினைச்சொல்லுக்கு முன்னுருபு மாறினா அர்த்தமே மாறிடும். 'Agree WITH a person' — ஒரு நபரோட ஒத்துக்கிறது. 'Agree TO a proposal' — ஒரு திட்டத்துக்கு சம்மதிக்கிறது. 'Agree ON a date' — ஒரு தேதி பத்தி ஒரு முடிவுக்கு வரது. மூணும் வேற வேற அர்த்தம். முன்னுருபு அலங்காரம் இல்ல, அது அர்த்தத்தை மாத்துது.",
  tl:"Kadaisiyaa oru nutpamaana vishayam — sila vinaicholukku munnurubu maarinaa arththame maaridum. 'Agree WITH a person'. 'Agree TO a proposal'. 'Agree ON a date'. Moonum veru veru arththam."}]},

/* ========== RULE 80 ========== */
{n:80,rc:"PRE-10",d:"Hard",t:"Adjectives with a FIXED Preposition",
 tam:"Afraid of, Good at, Angry with — நிலையான பெயரடை இணைகள்",
 s1:{en:"Adjectives too are locked to particular prepositions. Afraid OF, good AT, bad AT, jealous OF, capable OF, confident OF, fond OF, proud OF, ashamed OF, aware OF, similar TO, different FROM, angry WITH a person, angry AT a thing.",
  ta:"பெயரடைகளும் குறிப்பிட்ட முன்னுருபுகளுடன் பூட்டப்பட்டிருக்கின்றன. Afraid OF, good AT, bad AT, jealous OF, capable OF, confident OF, fond OF, proud OF, ashamed OF, aware OF, similar TO, different FROM, ஒரு நபருடன் angry WITH, ஒரு பொருளுடன் angry AT.",
  tl:"Peyaradaigalum kurippitta munnurubugaludan poottappattirukkindrana. Afraid OF, good AT, bad AT, jealous OF, capable OF, confident OF, fond OF, proud OF, similar TO, different FROM.",
  formula:"ADJECTIVE + FIXED PREPOSITION\n\n  OF   : afraid · fond · proud · jealous\n         capable · confident · ashamed · aware\n  AT   : good · bad · clever · quick · surprised\n  WITH : angry (person) · pleased · satisfied\n         popular · busy · familiar\n  TO   : similar · kind · rude · loyal · married\n  FROM : different · absent · free · safe\n  IN   : interested · rich · weak · deficient\n  FOR  : famous · fit · eager · sorry · anxious"},

 s2:[
 {h:"ANGRY WITH a person, ANGRY AT a thing",
  en:"'I am angry WITH him' (a person). 'They were angry AT his rudeness' (a thing or situation). This distinction appears constantly in exams. People take 'with'; things take 'at' or 'about'.",
  ta:"ஒரு நபருடன் ANGRY WITH, ஒரு பொருளுடன் ANGRY AT. 'I am angry WITH him' (ஒரு நபர்). 'They were angry AT his rudeness' (ஒரு பொருள் அல்லது சூழ்நிலை). இந்த வேறுபாடு தேர்வுகளில் தொடர்ந்து வருகிறது. மனிதர்கள் 'with' எடுக்கிறார்கள்; பொருட்கள் 'at' அல்லது 'about' எடுக்கின்றன.",
  tl:"Oru nabarudan ANGRY WITH, oru poruludan ANGRY AT. 'I am angry WITH him' (oru nabar). 'They were angry AT his rudeness' (oru porul). Manidhargal 'with' edukkiraargal; porutkal 'at' edukkindrana."},
 {h:"GOOD AT, not GOOD IN",
  en:"'He is good AT mathematics' — never 'good in'. The same applies to bad at, clever at, quick at, expert at. Indian speakers say 'good in English' constantly, and it is one of the most repeated error-spotting items.",
  ta:"GOOD AT, GOOD IN அல்ல. 'He is good AT mathematics' — ஒருபோதும் 'good in' அல்ல. bad at, clever at, quick at, expert at ஆகியவற்றுக்கும் அதேதான். இந்தியப் பேச்சாளர்கள் 'good in English' என்று தொடர்ந்து சொல்கிறார்கள், அது மிக அதிகமாக மீண்டும் மீண்டும் வரும் error-spotting விஷயங்களில் ஒன்று.",
  tl:"GOOD AT, GOOD IN alla. 'He is good AT mathematics' — orupodhum 'good in' alla. Indhiyap pechaalargal 'good in English' endru thodarndhu solgiraargal."},
 {h:"DIFFERENT FROM, not DIFFERENT THAN",
  en:"'His answer is different FROM mine'. American English allows 'different than', but Indian competitive exams follow British usage and mark 'different than' wrong. Also 'different to' is British but less safe in exams.",
  ta:"DIFFERENT FROM, DIFFERENT THAN அல்ல. 'His answer is different FROM mine'. அமெரிக்க ஆங்கிலம் 'different than' அனுமதிக்கிறது, ஆனால் இந்தியப் போட்டித் தேர்வுகள் பிரிட்டிஷ் வழக்கைப் பின்பற்றி 'different than'-ஐத் தவறாகக் குறிக்கின்றன. மேலும் 'different to' பிரிட்டிஷ் ஆனால் தேர்வுகளில் குறைவாகப் பாதுகாப்பானது.",
  tl:"DIFFERENT FROM, DIFFERENT THAN alla. 'His answer is different FROM mine'. America Aangilam 'different than' anumadhikkiradhu, aanaal Indhiyap pottith thervugal British vazhakkaip pinpatri 'different than'-aith thavaraagak kurikkindrana."},
 {h:"Group them by preposition",
  en:"OF is the biggest family: afraid, fond, proud, jealous, capable, confident, ashamed, aware, sure, tired, full, short. Learn OF first and you have covered half the rule.",
  ta:"முன்னுருபு வாரியாகக் குழுவாக்குங்கள். OF மிகப்பெரிய குடும்பம்: afraid, fond, proud, jealous, capable, confident, ashamed, aware, sure, tired, full, short. முதலில் OF கற்றுக்கொண்டால் விதியில் பாதியை உள்ளடக்கிவிட்டீர்கள்.",
  tl:"Munnurubu vaariyaagak kuzhuvaakkungal. OF migapperiya kudumbam: afraid, fond, proud, jealous, capable, confident, ashamed, aware, sure, tired, full, short."}],

 s3:[
 {h:"The six families",
  d:"   OF   afraid · fond · proud · jealous\n        capable · confident · ashamed · aware\n        sure · tired · full · short\n\n   AT   good · bad · clever · quick\n        expert · surprised · alarmed\n\n   WITH angry (person) · pleased · satisfied\n        popular · busy · familiar · content\n\n   TO   similar · kind · rude · loyal\n        married · faithful · true · equal\n\n   FROM different · absent · free · safe\n\n   IN   interested · rich · weak · deficient\n\n   FOR  famous · fit · eager · sorry · anxious"},
 {h:"Angry WITH or AT?",
  d:"   👤 A PERSON  →  ANGRY WITH\n      I am angry WITH him.\n      She was angry WITH her brother.\n\n   📦 A THING    →  ANGRY AT / ABOUT\n      They were angry AT his rudeness.\n      He was angry ABOUT the delay.\n\n   Same pattern for 'pleased' and 'displeased'."},
 {h:"The two Indian favourites",
  d:"   ✘ He is good IN mathematics.\n   ✔ He is good AT mathematics.\n\n   ✘ Her answer is different THAN mine.\n   ✔ Her answer is different FROM mine.\n\n   Both appear in almost every SSC paper\n   because both are said daily in India."}],

 s4:{
 wrong:["\"'Good in English' is normal Indian English.\" — Formal English requires 'good at'.",
  "\"'Different than' is fine because it compares.\" — Indian exams require 'different from'.",
  "\"'Angry on him' is what we say in Tamil.\" — A person takes 'angry with'.",
  "\"'Afraid from the dark' shows the source of fear.\" — 'Afraid' takes 'of'."],
 right:["Learn each adjective with its preposition as one unit.",
  "OF is the biggest family: afraid, fond, proud, capable, aware.",
  "A person takes 'angry with'; a thing takes 'angry at'.",
  "Remember 'good at' and 'different from'."]},

 s5:[
 {en:"She is afraid of the dark and of dogs.",ta:"அவர் இருட்டையும் நாய்களையும் கண்டு பயப்படுகிறார்.",tl:"Avar iruttaiyum naaygalaiyum kandu payappadugiraar.",note:"'Afraid' is locked to OF."},
 {en:"He is very good at mathematics and physics.",ta:"அவர் கணிதத்திலும் இயற்பியலிலும் மிகவும் திறமையானவர்.",tl:"Avar kanidhaththilum iyarpiyalilum migavum thiramaiyaanavar.",note:"'Good' is locked to AT, never 'in'."},
 {en:"I am angry with him for breaking his promise.",ta:"வாக்குறுதியை மீறியதற்காக நான் அவர் மீது கோபமாக இருக்கிறேன்.",tl:"Vaakkurudhiyai meeriyadharkaaga naan avar meedhu kobamaaga irukkiren.",note:"A person → ANGRY WITH."},
 {en:"They were angry at his rude behaviour.",ta:"அவரது முரட்டுத்தனமான நடத்தை குறித்து அவர்கள் கோபமாக இருந்தனர்.",tl:"Avaradhu muratduththanamaana nadaththai kurithu avargal kobamaaga irundhanar.",note:"A thing or situation → ANGRY AT."},
 {en:"Her handwriting is quite different from mine.",ta:"அவருடைய கையெழுத்து என்னுடையதிலிருந்து முற்றிலும் வேறுபட்டது.",tl:"Avarudaiya kaiyezhuththu ennudaiyadhilirundhu mutrilum verupattadhu.",note:"'Different' is locked to FROM."}],

  "proud of|-ஐப் பற்றி பெருமை|-aip patri perumai",

 s7:[
 "She is afraid ____ the dark.|of|Easy|'Afraid' is locked to OF.",
 "He is good ____ mathematics.|at|Easy|'Good' is locked to AT.",
 "I am angry ____ him.|with|Easy|A person.",
 "Her answer is different ____ mine.|from|Easy|'Different' is locked to FROM.",
 "They were angry ____ his rudeness.|at|Medium|A thing or situation.",
 "He is fond ____ classical music.|of|Medium|'Fond' is locked to OF.",
 "She is interested ____ history.|in|Medium|'Interested' is locked to IN.",
 "This town is famous ____ its temples.|for|Medium|'Famous' is locked to FOR.",
 "He is capable ____ doing better.|of|Hard|'Capable' is locked to OF.",
 "I am not aware ____ these facts.|of|Hard|'Aware' is locked to OF.",
 "Her dress is similar ____ mine.|to|Hard|'Similar' is locked to TO.",
 "He was absent ____ class yesterday.|from|Hard|'Absent' is locked to FROM.",
 "She is weak ____ spoken English.|in|Expert|'Weak' is locked to IN.",
 "We are all proud ____ his achievement.|of|Expert|'Proud' is locked to OF.",
 "He is anxious ____ his son's health.|about|Expert|'Anxious about' for worry."],

 s8:[
 "She is afraid from the dark.|She is afraid of the dark.|'Afraid' takes 'of'.",
 "He is good in mathematics.|He is good at mathematics.|'Good' takes 'at'.",
 "I am angry on him for lying.|I am angry with him for lying.|A person takes 'angry with'.",
 "Her answer is different than mine.|Her answer is different from mine.|'Different' takes 'from'.",
 "He is fond for classical music.|He is fond of classical music.|'Fond' takes 'of'.",
 "She is interested on history.|She is interested in history.|'Interested' takes 'in'.",
 "This town is famous of its temples.|This town is famous for its temples.|'Famous' takes 'for'.",
 "He is capable for doing better.|He is capable of doing better.|'Capable' takes 'of'.",
 "Her dress is similar with mine.|Her dress is similar to mine.|'Similar' takes 'to'.",
 "He was absent in class yesterday.|He was absent from class yesterday.|'Absent' takes 'from'."],

 s9:[
 "Fill in the Blank|My younger sister has always been very good ____ mathematics and science.|in;at|1|'Good' takes 'at'.",
 "Find the Error|The principal was extremely (A) angry on the boys (B) who had broken (C) the window pane (D).|A;B;C;D|1|Part B. A person takes 'angry with'.",
 "Sentence Improvement|His approach to the problem is entirely different than the one we adopted.|different than;different from;different with|1|Indian exams require 'different from'.",
 "Fill in the Blank|The little boy is terribly afraid ____ dogs and refuses to walk alone.|from;of|1|'Afraid' takes 'of'.",
 "Find the Error|She has been (A) deeply interested on (B) Indian classical music (C) since her childhood (D).|A;B;C;D|1|Part B. 'Interested' takes 'in'."],

 s10:{
  en:"'Good in English' and 'angry on him' are direct translations from Tamil and Hindi, which is why they feel so natural. Both are wrong. 'Different than' comes from American media. The subtlest trap is 'angry with' versus 'angry at' — a person takes 'with', a thing takes 'at', and the exam offers both.",
  ta:"'Good in English' மற்றும் 'angry on him' தமிழ் மற்றும் இந்தியிலிருந்து நேரடி மொழிபெயர்ப்புகள், அதனால்தான் அவை மிகவும் இயற்கையாகத் தோன்றுகின்றன. இரண்டுமே தவறு. 'Different than' அமெரிக்க ஊடகங்களிலிருந்து வருகிறது. மிக நுட்பமான பொறி 'angry with' மற்றும் 'angry at' — ஒரு நபர் 'with' எடுக்கிறார், ஒரு பொருள் 'at' எடுக்கிறது, தேர்வு இரண்டையும் தருகிறது.",
  tl:"'Good in English' matrum 'angry on him' Tamil matrum Hindi-yilirundhu neradi mozhibeyarppugal, adhanaal-dhaan avai migavum iyarkaiyaagath thondrugindrana. Miga nutpamaana pori 'angry with' matrum 'angry at'."},

 s11:{
  en:"PERSON TAKES 'WITH', THING TAKES 'AT'. And remember GOOD AT, DIFFERENT FROM.",
  ta:"நபர் 'WITH' எடுக்கிறார், பொருள் 'AT' எடுக்கிறது. மேலும் GOOD AT, DIFFERENT FROM நினைவில் வையுங்கள்.",
  tl:"Nabar 'WITH' edukkiraar, porul 'AT' edukkiradhu. Melum GOOD AT, DIFFERENT FROM ninaivil vaiyungal.",
  vis:"      THE SIX FAMILIES\n\n   OF   afraid · fond · proud · jealous\n        capable · confident · ashamed · aware\n        (the biggest family — learn this first)\n\n   AT   good · bad · clever · quick · expert\n\n   WITH angry (person) · pleased · satisfied\n        popular · busy · familiar\n\n   TO   similar · kind · rude · loyal · married\n\n   FROM different · absent · free · safe\n\n   IN   interested · rich · weak · deficient\n\n   FOR  famous · fit · eager · sorry\n\n   ⚠ THE TWO INDIAN ERRORS:\n     good IN English   ✘  →  good AT   ✔\n     angry ON him      ✘  →  angry WITH ✔"},

 s13:[

 s14:{
  rule:"Adjectives are locked to particular prepositions and must be learnt as fixed pairs.",
  formula:"OF: afraid, fond, proud, capable, aware, ashamed\nAT: good, bad, clever, quick, expert\nWITH: angry (person), pleased, satisfied, popular\nTO: similar, kind, rude, loyal, married\nFROM: different, absent, free, safe\nIN: interested, weak, rich | FOR: famous, fit, eager",
  memory:"Person takes WITH, thing takes AT. Good AT, Different FROM.",
  ta:"நபர்னா WITH, பொருள்னா AT. Good AT, Different FROM.",
  tl:"Nabarnaa WITH, porulnaa AT. Good AT, Different FROM.",
  mistake:"Writing 'good in English', 'angry on him' and 'different than'.",
  exam:"SSC CGL / CHSL / MTS and Bank — 'good in' and 'angry on' are direct mother-tongue errors."},

 s15:[
 {ta:"Rule 79-ல வினைச்சொல்லோட முன்னுருபு பார்த்தோம். இப்போ பெயரடையோட முன்னுருபு பார்க்கலாம். இதுலயும் தர்க்கம் கிடையாது, மனப்பாடம்தான்.",
  tl:"Rule 79-la vinaicholoda munnurubu paarththom. Ippo peyaradaiyoda munnurubu paarkkalaam. Idhulayum tharkkam kidaiyaadhu, manappaadam-dhaan."},
 {ta:"ஆனா ஒரு நல்ல செய்தி — OF குடும்பம் மிகப்பெரியது. Afraid of, fond of, proud of, jealous of, capable of, confident of, ashamed of, aware of, sure of, tired of, full of, short of. இந்த ஒரு குடும்பத்தை கத்துக்கிட்டா, விதியில பாதி முடிஞ்சது.",
  tl:"Aanaa oru nalla seydhi — OF kudumbam migapperiyadhu. Afraid of, fond of, proud of, jealous of, capable of, confident of, ashamed of, aware of, sure of, tired of, full of, short of."},
 {ta:"இப்போ நமக்கு ரொம்ப சிரமமான ரெண்டு விஷயம். ஒண்ணு — 'good IN English'. இதை நாம எல்லாருமே சொல்லுவோம்! 'நான் ஆங்கிலத்துல நல்லா இருக்கேன்' அப்படின்னு தமிழ்ல சொல்றோம், அதை நேரடியா மொழிபெயர்த்து 'good in English' அப்படின்னு எழுதிடுவோம். ஆனா தப்பு! சரியான வடிவம் 'good AT English'.",
  tl:"Ippo namakku romba siramamaana rendu vishayam. Onnu — 'good IN English'. Idhai naama ellaarume solluvom! Aanaa thappu! Sariyaana vadivam 'good AT English'."},
 {ta:"ரெண்டு — 'angry ON him'. தமிழ்ல 'அவன் மேல கோபம்' அப்படின்னு சொல்றோம், அதனால 'angry on him' அப்படின்னு எழுதிடுவோம். ஆனா ஆங்கிலத்துல நபருக்கு 'angry WITH'. 'I am angry WITH him.'",
  tl:"Rendu — 'angry ON him'. Tamil-la 'avan mela kobam' appadinnu solrom, adhanaala 'angry on him' appadinnu ezhudhiduvom. Aanaa Aangilaththula nabarukku 'angry WITH'."},
 {ta:"ஆனா இங்க ஒரு நுட்பமான வித்தியாசம் இருக்கு. நபருக்கு 'angry WITH'. ஆனா பொருளுக்கு அல்லது சூழலுக்கு 'angry AT' அல்லது 'angry ABOUT'. 'I am angry WITH him' (நபர்) ஆனா 'I am angry AT his rudeness' (செயல்). SSC இந்த ரெண்டையும் ஒரே கேள்வியில தந்து சோதிக்கும்.",
  tl:"Aanaa inga oru nutpamaana viththiyaasam irukku. Nabarukku 'angry WITH'. Aanaa porulukku alladhu soozhalukku 'angry AT'. 'I am angry WITH him' aanaa 'I am angry AT his rudeness'."},
 {ta:"கடைசியா 'DIFFERENT FROM'. 'Her answer is different THAN mine' — இது அமெரிக்க ஆங்கிலம். படத்துல, இணையத்துல அப்படித்தான் பார்ப்பீங்க. ஆனா இந்திய தேர்வுல 'different FROM' தான் சரி. 'Different to'-ம் பிரிட்டிஷ்ல இருக்கு, ஆனா தேர்வுக்கு 'from' தான் பாதுகாப்பானது. இந்த மூணு — good at, angry with, different from — SSC-ல அடிக்கடி வரும்.",
  tl:"Kadaisiyaa 'DIFFERENT FROM'. 'Her answer is different THAN mine' — idhu America Aangilam. Aanaa Indhiya thervula 'different FROM' dhaan sari. Indha moonu — good at, angry with, different from — SSC-la adikkadi varum."}]},
/* ========== RULE 81 ========== */
{n:81,rc:"PRE-11",d:"Medium",t:"Nouns with a FIXED Preposition",
 tam:"Reason for, Solution to, Cause of — நிலையான பெயர்ச்சொல் இணைகள்",
 s1:{en:"Nouns too are locked to particular prepositions. REASON FOR, CAUSE OF, SOLUTION TO, REMEDY FOR, KEY TO, ANSWER TO, NEED OF, THIRST FOR, ATTITUDE TOWARDS, ACCESS TO, DESIRE FOR, OBJECTION TO.",
  ta:"பெயர்ச்சொற்களும் குறிப்பிட்ட முன்னுருபுகளுடன் பூட்டப்பட்டிருக்கின்றன. REASON FOR, CAUSE OF, SOLUTION TO, REMEDY FOR, KEY TO, ANSWER TO, NEED OF, THIRST FOR, ATTITUDE TOWARDS, ACCESS TO, DESIRE FOR, OBJECTION TO.",
  tl:"Peyarchorkalum kurippitta munnurubugaludan poottappattirukkindrana. REASON FOR, CAUSE OF, SOLUTION TO, REMEDY FOR, KEY TO, ANSWER TO, NEED OF, ATTITUDE TOWARDS, ACCESS TO.",
  formula:"NOUN + FIXED PREPOSITION\n\n  FOR : reason · remedy · desire · thirst\n        need · respect · regard · sympathy\n  OF  : cause · fear · hope · knowledge\n        habit · lack · sense\n  TO  : solution · key · answer · objection\n        access · reply · exception · alternative\n  IN  : interest · faith · confidence · pride\n  TOWARDS : attitude · behaviour · duty"},

 s2:[
 {h:"REASON FOR but CAUSE OF",
  en:"These two look identical in meaning but take different prepositions. 'What is the REASON FOR the delay?' and 'What was the CAUSE OF the accident?'. Both mean 'why', yet one takes 'for' and the other 'of'. This is the most tested pair.",
  ta:"REASON FOR ஆனால் CAUSE OF. இந்த இரண்டும் பொருளில் ஒரே மாதிரி தெரிகின்றன ஆனால் வெவ்வேறு முன்னுருபுகளை எடுக்கின்றன. 'What is the REASON FOR the delay?' மற்றும் 'What was the CAUSE OF the accident?'. இரண்டுமே 'ஏன்' என்று பொருள்படுகின்றன, இருந்தும் ஒன்று 'for' எடுக்கிறது, மற்றொன்று 'of'. இதுதான் மிக அதிகமாகச் சோதிக்கப்படும் ஜோடி.",
  tl:"REASON FOR aanaal CAUSE OF. Indha irandum porulil ore maadhiri therigindrana aanaal vevveru munnurubugalai edukkindrana. Idhudhaan miga adhigamaagach sodhikkappadum jodi."},
 {h:"SOLUTION TO, not SOLUTION FOR",
  en:"'There is no SOLUTION TO this problem' — never 'solution for'. The same applies to 'answer TO', 'key TO', 'objection TO'. These all point at something, and TO is the pointing preposition.",
  ta:"SOLUTION TO, SOLUTION FOR அல்ல. 'There is no SOLUTION TO this problem' — ஒருபோதும் 'solution for' அல்ல. 'Answer TO', 'key TO', 'objection TO' ஆகியவற்றுக்கும் அதேதான். இவை அனைத்தும் ஏதோ ஒன்றைச் சுட்டுகின்றன, TO சுட்டும் முன்னுருபு.",
  tl:"SOLUTION TO, SOLUTION FOR alla. 'There is no SOLUTION TO this problem' — orupodhum 'solution for' alla. 'Answer TO', 'key TO', 'objection TO' aagiyavatrukkum adhedhaan."},
 {h:"The noun and the verb may differ",
  en:"The verb 'discuss' takes no preposition, but the noun 'discussion' takes 'about' or 'on'. The verb 'attack' takes none, but the noun 'an attack ON'. Always check whether the word is being used as a noun or a verb.",
  ta:"பெயர்ச்சொல்லும் வினைச்சொல்லும் வேறுபடலாம். 'Discuss' வினைச்சொல் முன்னுருபு எடுக்காது, ஆனால் 'discussion' பெயர்ச்சொல் 'about' அல்லது 'on' எடுக்கிறது. 'Attack' வினைச்சொல் எதுவும் எடுக்காது, ஆனால் 'an attack ON' பெயர்ச்சொல். அந்தச் சொல் ஒரு பெயர்ச்சொல்லாகவா வினைச்சொல்லாகவா பயன்படுத்தப்படுகிறது என்று எப்போதும் சரிபாருங்கள்.",
  tl:"Peyarcholum vinaicholum verupadalaam. 'Discuss' vinaichol munnurubu edukkaadhu, aanaal 'discussion' peyarchol 'about' alladhu 'on' edukkiradhu. Andhach sol oru peyarcholaagavaa vinaicholaagavaa payanpaduththappadugiradhu endru eppodhum saripaarungal."},
 {h:"'The reason is THAT', never 'because'",
  en:"'The reason for his absence is THAT he was ill' — never 'is because'. 'Reason' and 'because' both express cause, so using both is redundant. This links to Conjunction Rule 91.",
  ta:"'The reason is THAT', ஒருபோதும் 'because' அல்ல. 'The reason for his absence is THAT he was ill' — ஒருபோதும் 'is because' அல்ல. 'Reason' மற்றும் 'because' இரண்டுமே காரணத்தை வெளிப்படுத்துகின்றன, எனவே இரண்டையும் பயன்படுத்துவது தேவையற்றது. இது Conjunction Rule 91-உடன் தொடர்புடையது.",
  tl:"'The reason is THAT', orupodhum 'because' alla. 'Reason' matrum 'because' irandume kaaranaththai velippaduththugindrana, enave irandaiyum payanpaduththuvadhu thevaiyatradhu."}],

 s3:[
 {h:"The four main families",
  d:"   FOR      reason · remedy · desire · thirst\n            need · respect · sympathy · regard\n\n   OF       cause · fear · hope · knowledge\n            habit · lack · sense · advantage\n\n   TO       solution · key · answer · objection\n            access · reply · alternative · exception\n\n   IN       interest · faith · confidence · pride\n\n   TOWARDS  attitude · behaviour · duty"},
 {h:"The most tested pair",
  d:"   REASON  FOR  the delay      ✔\n   REASON  OF   the delay       ✘\n\n   CAUSE   OF   the accident    ✔\n   CAUSE   FOR  the accident    ✘\n\n   Both mean 'why', but the prepositions\n   are opposite. This pair appears\n   in almost every SSC set."},
 {h:"Noun and verb can differ",
  d:"   VERB                NOUN\n   ────                ────\n   discuss (no prep)   discussion ABOUT / ON\n   attack  (no prep)   an attack ON\n   enter   (no prep)   entrance TO\n   reach   (no prep)   access TO\n\n   Always ask: is this a NOUN or a VERB?"}],

 s4:{
 wrong:["\"'Reason of the delay' matches 'cause of'.\" — 'Reason' takes 'for'.",
  "\"'Solution for the problem' sounds natural.\" — 'Solution' takes 'to'.",
  "\"'A discussion the matter' — 'discuss' takes no preposition.\" — The noun 'discussion' does take one.",
  "\"'The reason is because he was ill' is complete.\" — It must be 'the reason is that'."],
 right:["Learn each noun with its preposition as one unit.",
  "Remember the pair: reason FOR, cause OF.",
  "Solution, key, answer and objection all take TO.",
  "Check whether the word is a noun or a verb before choosing."]},

 s5:[

 s10:{
  en:"REASON FOR versus CAUSE OF is the sharpest pair. Both mean 'why', so students swap them freely. The exam offers 'reason of' and 'cause for' as tempting options. The second trap is 'solution for' — it sounds natural but 'solution' always takes 'to'. And remember that a verb and its noun may take different prepositions.",
  ta:"REASON FOR மற்றும் CAUSE OF-தான் மிகக் கூர்மையான ஜோடி. இரண்டுமே 'ஏன்' என்று பொருள்படுகின்றன, எனவே மாணவர்கள் அவற்றைச் சுதந்திரமாக மாற்றுகிறார்கள். தேர்வு 'reason of' மற்றும் 'cause for'-ஐ கவர்ச்சிகரமான option-களாகத் தருகிறது. இரண்டாவது பொறி 'solution for' — அது இயற்கையாக ஒலிக்கிறது ஆனால் 'solution' எப்போதும் 'to' எடுக்கிறது. மேலும் ஒரு வினைச்சொல்லும் அதன் பெயர்ச்சொல்லும் வெவ்வேறு முன்னுருபுகளை எடுக்கலாம் என்பதை நினைவில் வையுங்கள்.",
  tl:"REASON FOR matrum CAUSE OF-dhaan migak koormaiyaana jodi. Irandume 'yen' endru porulpadugindrana, enave maanavargal avatraich sudhandhiramaaga maatrugiraargal. Irandaavadhu pori 'solution for'."},

 s11:{

  ta:"REASON FOR. CAUSE OF. SOLUTION TO. பெயர்ச்சொல்லையும் அதன் முன்னுருபையும் சேர்த்துக் கற்றுக்கொள்ளுங்கள்.",
  tl:"REASON FOR. CAUSE OF. SOLUTION TO. Peyarcholaiyum adhan munnurubaiyum serthuk katrukkollungal.",
  vis:"      THE FOUR NOUN FAMILIES\n\n   FOR   reason · remedy · desire · thirst\n         need · respect · sympathy · regard\n\n   OF    cause · fear · hope · knowledge\n         habit · lack · sense · advantage\n\n   TO    solution · key · answer · objection\n         access · reply · alternative\n\n   IN    interest · faith · confidence · pride\n\n   ⚠ THE TESTED PAIR:\n     REASON FOR  ✔    reason of   ✘\n     CAUSE  OF   ✔    cause for   ✘\n\n   ⚠ 'THE REASON IS THAT', never 'is because'."},

 s14:{
  rule:"Nouns are locked to particular prepositions: reason FOR, cause OF, solution TO, attitude TOWARDS.",
  formula:"FOR: reason, remedy, desire, need, sympathy\nOF: cause, fear, hope, knowledge, habit\nTO: solution, key, answer, objection, access\nIN: interest, faith, confidence, pride\nTOWARDS: attitude, behaviour",
  memory:"Reason FOR, Cause OF, Solution TO.",
  ta:"Reason FOR, Cause OF, Solution TO — இந்த மூணு ஞாபகம் வெச்சுக்கோங்க.",
  tl:"Reason FOR, Cause OF, Solution TO — indha moonu gnaabagam vechukkonga.",
  mistake:"Writing 'reason of', 'cause for', 'solution for' and 'the reason is because'.",
  exam:"SSC CGL / CHSL and Bank — 'reason for' versus 'cause of' is the most repeated pair."},

 s15:[
 {ta:"Rule 79-ல வினைச்சொல், Rule 80-ல பெயரடை, இப்போ Rule 81-ல பெயர்ச்சொல். மூணுமே ஒரே விஷயம் — நிலையான இணைகள். மனப்பாடம்தான் வழி.",
  tl:"Rule 79-la vinaichol, Rule 80-la peyaradai, ippo Rule 81-la peyarchol. Moonume ore vishayam — nilaiyaana inaigal. Manappaadam-dhaan vazhi."},
 {ta:"ஆனா இங்க ஒரு ஜோடி ரொம்ப முக்கியம் — REASON மற்றும் CAUSE. ரெண்டுமே 'ஏன்' அப்படிங்கிற அர்த்தம். ஆனா 'REASON FOR' மற்றும் 'CAUSE OF'. முன்னுருபு எதிரெதிர்!",
  tl:"Aanaa inga oru jodi romba mukkiyam — REASON matrum CAUSE. Rendume 'yen' appadingira arththam. Aanaa 'REASON FOR' matrum 'CAUSE OF'. Munnurubu edhiredhir!"},
 {ta:"'What is the REASON FOR the delay?' — தாமதத்துக்கான காரணம். 'What was the CAUSE OF the accident?' — விபத்தோட காரணம். ரெண்டுமே காரணம், ஆனா ஒண்ணுக்கு 'for', இன்னொண்ணுக்கு 'of'. SSC இதை மாத்தி மாத்தி கேட்கும் — 'reason of' மற்றும் 'cause for' அப்படின்னு தந்து ஏமாத்தும்.",
  tl:"'What is the REASON FOR the delay?' 'What was the CAUSE OF the accident?' Rendume kaaranam, aanaa onnukku 'for', innonnukku 'of'. SSC idhai maaththi maaththi ketkum."},
 {ta:"இன்னொரு முக்கியமான குடும்பம் — TO. Solution TO, Key TO, Answer TO, Objection TO, Access TO, Alternative TO. இதெல்லாம் எதையோ சுட்டுது. 'Solution FOR this problem' அப்படின்னு நிறைய பேரு எழுதுவாங்க, ஆனா தப்பு. 'Solution TO' தான் சரி.",
  tl:"Innoru mukkiyamaana kudumbam — TO. Solution TO, Key TO, Answer TO, Objection TO, Access TO. Idhellaam edhaiyo suttudhu. 'Solution FOR this problem' appadinnu neraiya peru ezhudhuvaanga, aanaa thappu."},
 {ta:"இப்போ ஒரு நுட்பமான விஷயம் — வினைச்சொல்லுக்கும் பெயர்ச்சொல்லுக்கும் முன்னுருபு வேறுபடலாம். Rule 78-ல படிச்சோம், 'discuss' -க்கு preposition இல்ல. ஆனா பெயர்ச்சொல் 'discussion ABOUT' அல்லது 'discussion ON' எடுக்கும்! அதே மாதிரி வினைச்சொல் 'attack' -க்கு இல்ல, ஆனா 'an attack ON the city'.",
  tl:"Ippo oru nutpamaana vishayam — vinaicholukkum peyarcholukkum munnurubu verupadalaam. Rule 78-la padichom, 'discuss'-kku preposition illa. Aanaa peyarchol 'discussion ABOUT' edukkum!"},
 {ta:"கடைசியா ஒரு ரொம்ப முக்கியமான அமைப்பு — 'The reason is THAT'. 'The reason is BECAUSE he was ill' அப்படின்னு நிறைய பேரு எழுதுவாங்க. இது தப்பு! ஏன்? 'Reason' மற்றும் 'because' ரெண்டுமே காரணத்தை சொல்லுது. ரெண்டையும் சேர்த்தா மிகைப்படுத்தல். சரியான வடிவம் — 'The reason is THAT he was ill' அல்லது வெறுமனே 'He was absent BECAUSE he was ill'. இதை Conjunctions module-ல Rule 91-ல மறுபடி பார்ப்போம்.",
  tl:"Kadaisiyaa oru romba mukkiyamaana amaippu — 'The reason is THAT'. 'The reason is BECAUSE he was ill' appadinnu neraiya peru ezhudhuvaanga. Idhu thappu! Sariyaana vadivam — 'The reason is THAT he was ill'."}]},

/* ========== RULE 82 ========== */
{n:82,rc:"PRE-12",d:"Hard",t:"A Preposition is followed by a GERUND, not an Infinitive",
 tam:"'Look forward to' -ல் 'to' preposition — அதனால் -ing வடிவம்",
 s1:{en:"Expressions ending in the PREPOSITION 'to' are followed by V-ING, not by the base form. LOOK FORWARD TO, BE ACCUSTOMED TO, OBJECT TO, BE ADDICTED TO, BE AVERSE TO, DEVOTED TO, GIVEN TO, WITH A VIEW TO, USED TO (accustomed sense).",
  ta:"முன்னுருபு 'to'-ல் முடியும் தொடர்களுக்குப் பின் V-ING வரும், அடிப்படை வடிவம் அல்ல. LOOK FORWARD TO, BE ACCUSTOMED TO, OBJECT TO, BE ADDICTED TO, BE AVERSE TO, DEVOTED TO, GIVEN TO, WITH A VIEW TO, USED TO (பழகிய பொருளில்).",
  tl:"Munnurubu 'to'-l mudiyum thodargalukkup pin V-ING varum, adippadai vadivam alla. LOOK FORWARD TO, BE ACCUSTOMED TO, OBJECT TO, BE ADDICTED TO, WITH A VIEW TO, USED TO.",
  formula:"PREPOSITION 'TO'  +  V-ING\n\n  I look forward TO HEARING from you.   ✔\n  He is accustomed TO WORKING late.     ✔\n  She objected TO BEING questioned.     ✔\n  He came with a view TO MEETING you.   ✔\n  I am used TO WAKING up early.         ✔\n\n⚠ NOT: look forward to hear  ✘"},

 s2:[
 {h:"Two different 'to' words look identical",
  en:"'I want TO go' — here 'to' is part of the INFINITIVE, so a base form follows. 'I look forward TO going' — here 'to' is a PREPOSITION, so a gerund follows. The three letters are the same but the jobs are opposite.",
  ta:"இரண்டு வெவ்வேறு 'to' சொற்கள் ஒரே மாதிரி தெரிகின்றன. 'I want TO go' — இங்கே 'to' infinitive-ன் பகுதி, எனவே ஒரு அடிப்படை வடிவம் பின்வருகிறது. 'I look forward TO going' — இங்கே 'to' ஒரு முன்னுருபு, எனவே ஒரு gerund பின்வருகிறது. மூன்று எழுத்துக்கள் ஒரே மாதிரி ஆனால் வேலைகள் எதிரானவை.",
  tl:"Irandu vevveru 'to' sorkal ore maadhiri therigindrana. 'I want TO go' — inge 'to' infinitive-in paguthi. 'I look forward TO going' — inge 'to' oru munnurubu."},
 {h:"The noun test tells you which is which",
  en:"If you can put a NOUN after the 'to', it is a preposition. 'I look forward to your LETTER' works, so 'to' is a preposition, so a gerund follows. 'I want to letter' does not work, so that 'to' is an infinitive.",
  ta:"பெயர்ச்சொல் சோதனை எது எது என்று சொல்கிறது. 'To'-க்குப் பின் ஒரு பெயர்ச்சொல்லை வைக்க முடிந்தால், அது ஒரு முன்னுருபு. 'I look forward to your LETTER' வேலை செய்கிறது, எனவே 'to' ஒரு முன்னுருபு, எனவே ஒரு gerund பின்வருகிறது. 'I want to letter' வேலை செய்யாது, எனவே அந்த 'to' ஒரு infinitive.",
  tl:"Peyarchol sodhanai edhu edhu endru solgiradhu. 'To'-kkup pin oru peyarcholai vaikka mudindhaal, adhu oru munnurubu. 'I look forward to your LETTER' velai seygiradhu."},
 {h:"'Look forward to hear from you' is the classic error",
  en:"This phrase appears in almost every formal letter written in India, and it is wrong. It must be 'look forward to HEARING from you'. SSC tests it in Error Spotting and in letter-writing questions.",
  ta:"'Look forward to hear from you' பாரம்பரியமான தவறு. இந்தத் தொடர் இந்தியாவில் எழுதப்படும் கிட்டத்தட்ட ஒவ்வொரு முறையான கடிதத்திலும் வருகிறது, அது தவறு. அது 'look forward to HEARING from you' என்றுதான் இருக்க வேண்டும். SSC இதை Error Spotting-லும் கடித எழுத்துக் கேள்விகளிலும் சோதிக்கிறது.",
  tl:"'Look forward to hear from you' paaramparyamaana thavaru. Indhath thodar Indhiyaavil ezhudhappadum kittaththatta ovvoru muraiyaana kadidhaththilum varugiradhu, adhu thavaru."},
 {h:"This is the same rule as 'be used to' in Modal Rule 69",
  en:"In Module 6 you learnt 'He is used to smoking' takes a gerund because 'to' is a preposition there. This is exactly the same principle applied to a longer list of expressions. One rule, many phrases.",
  ta:"இது Modal Rule 69-ல் உள்ள 'be used to' அதே விதிதான். Module 6-ல் 'He is used to smoking' gerund எடுக்கிறது என்று கற்றுக்கொண்டீர்கள், ஏனெனில் அங்கே 'to' ஒரு முன்னுருபு. இது சரியாக அதே கொள்கை நீளமான தொடர்ப் பட்டியலுக்குப் பயன்படுத்தப்படுகிறது. ஒரு விதி, பல தொடர்கள்.",
  tl:"Idhu Modal Rule 69-l ulla 'be used to' adhe vidhidhaan. Module 6-l 'He is used to smoking' gerund edukkiradhu endru katrukkondeergal. Oru vidhi, pala thodargal."}],

 s3:[
 {h:"Two jobs, three letters",
  d:"   'TO' as an INFINITIVE  →  base form\n     I want TO GO.\n     He decided TO LEAVE.\n\n   'TO' as a PREPOSITION  →  gerund\n     I look forward TO GOING.\n     He is accustomed TO WORKING.\n\n   Same three letters. Opposite jobs."},
 {h:"The noun test",
  d:"   Can you put a NOUN after the 'to'?\n\n   'I look forward to your LETTER'   ✔ works\n     → 'to' is a PREPOSITION\n     → use a GERUND: to HEARING\n\n   'I want to LETTER'                ✘ fails\n     → 'to' is an INFINITIVE\n     → use a BASE FORM: to GO"},
 {h:"The full list",
  d:"   look forward TO      be accustomed TO\n   object TO            be addicted TO\n   be averse TO         be devoted TO\n   be given TO          with a view TO\n   be used TO           in addition TO\n   be opposed TO        confess TO\n   take TO              be prone TO\n\n   ALL of these are followed by -ING."}],

 s4:{
 wrong:["\"'Look forward to hear from you' is standard letter English.\" — It must be 'hearing'.",
  "\"'To' is always part of an infinitive.\" — Sometimes it is a preposition.",
  "\"'Accustomed to work late' is correct.\" — It must be 'to working'.",
  "\"'With a view to meet you' sounds formal.\" — It must be 'to meeting'."],
 right:["Test whether a noun can follow the 'to'.",
  "Noun fits → preposition → use a gerund.",
  "Noun does not fit → infinitive → use a base form.",
  "Memorise the list: look forward to, accustomed to, object to, with a view to."]},

 s5:[
 {en:"I look forward to hearing from you soon.",ta:"விரைவில் உங்களிடமிருந்து செய்தி கிடைக்கும் என எதிர்பார்க்கிறேன்.",tl:"Viraivil ungalidamirundhu seydhi kidaikkum ena edhirpaarkkiren.",note:"'Look forward to' takes a gerund."},
 {en:"He is accustomed to working late at night.",ta:"இரவு நேரத்தில் வேலை செய்வது அவருக்குப் பழகிவிட்டது.",tl:"Iravu neraththil velai seyvadhu avarukkup pazhagividdadhu.",note:"'Accustomed to' takes a gerund."},
 {en:"She objected to being questioned in public.",ta:"பொது இடத்தில் விசாரிக்கப்படுவதை அவர் ஆட்சேபித்தார்.",tl:"Podhu idaththil visaarikkappaduvadhai avar aatchebiththaar.",note:"'Object to' takes a gerund, here in the passive."},
 {en:"He came with a view to meeting the manager.",ta:"மேலாளரைச் சந்திக்கும் நோக்கத்துடன் அவர் வந்தார்.",tl:"Melaalaraich sandhikkum nokkaththudan avar vandhaar.",note:"'With a view to' takes a gerund."},
 {en:"I want to go home early today.",ta:"நான் இன்று சீக்கிரமாக வீட்டுக்குச் செல்ல விரும்புகிறேன்.",tl:"Naan indru seekkiramaaga veettukkuch sella virumbugiren.",note:"Here 'to' is an infinitive → base form GO."}],

 s9:[

 s10:{
  en:"'Look forward to hear from you' appears at the end of almost every formal letter written in India. It is wrong, and SSC knows it is the phrase everyone gets wrong. The whole difficulty is that the same three letters — t, o — do two opposite jobs. The noun test settles it: if a noun can follow, it is a preposition, so use -ING.",
  ta:"'Look forward to hear from you' இந்தியாவில் எழுதப்படும் கிட்டத்தட்ட ஒவ்வொரு முறையான கடிதத்தின் இறுதியிலும் வருகிறது. அது தவறு, அனைவரும் தவறாகச் செய்யும் தொடர் அது என்று SSC-க்குத் தெரியும். முழு சிரமமும் அதே மூன்று எழுத்துக்கள் — t, o — இரண்டு எதிரான வேலைகளைச் செய்வதுதான். பெயர்ச்சொல் சோதனை அதைத் தீர்க்கிறது: ஒரு பெயர்ச்சொல் பின்வர முடிந்தால், அது ஒரு முன்னுருபு, எனவே -ING பயன்படுத்துங்கள்.",
  tl:"'Look forward to hear from you' Indhiyaavil ezhudhappadum kittaththatta ovvoru muraiyaana kadidhaththin irudhiyilum varugiradhu. Muzhu siramamum adhe moondru ezhuththukkal — t, o — irandu edhiraana velaigalaich seyvadhudhaan."},

 s11:{
  en:"CAN A NOUN FOLLOW THE 'TO'? Yes → preposition → use -ING.",
  ta:"'TO'-க்குப் பின் ஒரு பெயர்ச்சொல் வர முடியுமா? முடியும் → முன்னுருபு → -ING பயன்படுத்துங்கள்.",
  tl:"'TO'-kkup pin oru peyarchol vara mudiyumaa? Mudiyum → munnurubu → -ING payanpaduththungal.",
  vis:"      THE NOUN TEST\n\n   Put a NOUN after the 'to' and see:\n\n   \"I look forward to your LETTER\"  ✔ works\n      → 'to' is a PREPOSITION\n      → I look forward to HEARING   ✔\n\n   \"I want to LETTER\"               ✘ fails\n      → 'to' is an INFINITIVE\n      → I want to GO                ✔\n\n   THE -ING LIST:\n   look forward TO · accustomed TO\n   object TO · addicted TO · averse TO\n   devoted TO · given TO · opposed TO\n   with a view TO · in addition TO\n   used TO (accustomed) · confess TO\n   take TO · prone TO\n\n   ⚠ THE FAMOUS ERROR:\n     look forward to HEAR   ✘\n     look forward to HEARING ✔"},
