<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Prepositions — 15 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

<main>
  <div class="top">

</div>

<script>
/* ============ COMPACT DATA FORMAT ============
   s7  solved examples : "sentence|answer|Level|why"
   s8  wrong vs right  : "wrong|correct|why"
   s9  PYQ             : "Type|question|optA;optB;optC|ansIdx|solution"
   s12 practice        : "sentence with ____|optA;optB|ansIdx"
   s13 challenge       : "question|optA;optB;optC|ansIdx|solution"
   s6  word-by-word    : "word|tamil|tanglish"
============================================== */
const RULES=[
/* ========== RULE 71 ========== */
{n:71,rc:"PRE-01",d:"Easy",t:"IN, ON and AT for TIME",
 tam:"In = மாதம், ஆண்டு · On = நாள், தேதி · At = நேரம்",
 s1:{en:"Use IN for months, years, seasons, centuries and parts of the day. Use ON for days and dates. Use AT for exact clock times, festivals and fixed points. The three form a scale from the largest unit to the smallest.",
  ta:"மாதங்கள், ஆண்டுகள், பருவங்கள், நூற்றாண்டுகள், பகலின் பகுதிகளுக்கு IN பயன்படுத்தவும். நாட்கள் மற்றும் தேதிகளுக்கு ON. சரியான கடிகார நேரங்கள், பண்டிகைகள், நிலையான புள்ளிகளுக்கு AT. இந்த மூன்றும் மிகப்பெரிய அலகிலிருந்து மிகச் சிறியது வரையிலான ஒரு அளவுகோலை உருவாக்குகின்றன.",
  tl:"Maadhangal, aandugal, paruvangal, nootraandugal, pagalin paguthigalukku IN payanpaduththavum. Naatkal matrum thedhigalukku ON. Sariyaana kadigaara nerangal, pandigaigalukku AT.",
  formula:"IN  →  large periods\n  in 1998 · in June · in summer\n  in the morning · in the 20th century\n\nON  →  days and dates\n  on Monday · on 15 August\n  on Monday morning · on my birthday\n\nAT  →  exact points\n  at 6 p.m. · at noon · at midnight\n  at Diwali · at present · at dawn"},

 s2:[
 {h:"Think of a funnel from big to small",
  en:"IN holds the biggest containers — a year, a month, a season. ON sits inside them, holding a single day. AT is the sharpest point of all — one moment on the clock. Each preposition zooms in one level further.",
  ta:"பெரியதிலிருந்து சிறியது வரை ஒரு புனலாக நினையுங்கள். IN மிகப்பெரிய கொள்கலன்களைப் பிடித்திருக்கிறது — ஒரு ஆண்டு, ஒரு மாதம், ஒரு பருவம். ON அவற்றுக்குள் அமர்ந்து ஒரே ஒரு நாளைப் பிடித்திருக்கிறது. AT அனைத்திலும் கூர்மையான புள்ளி — கடிகாரத்தில் ஒரு தருணம். ஒவ்வொரு முன்னுருபும் ஒரு நிலை மேலும் உள்ளே நெருங்குகிறது.",
  tl:"Periyadhilirundhu siriyadhu varai oru punalaaga ninaiyungal. IN migapperiya kolkalangalaip pidiththirukkiradhu. ON avatrukkul amarndhu ore oru naalaip pidiththirukkiradhu. AT anaiththilum koormaiyaana pulli."},
 {h:"Adding a day switches IN to ON",
  en:"'In the morning' becomes 'ON Monday morning'. The moment a specific day is attached, the phrase moves from IN to ON. Same with 'in the evening' and 'on Sunday evening'.",
  ta:"ஒரு நாள் சேர்த்தால் IN, ON ஆக மாறுகிறது. 'In the morning' என்பது 'ON Monday morning' ஆகிறது. ஒரு குறிப்பிட்ட நாள் இணைக்கப்படும் தருணத்தில், அந்தத் தொடர் IN-லிருந்து ON-க்கு நகர்கிறது. 'In the evening' மற்றும் 'on Sunday evening'-க்கும் அதேதான்.",
  tl:"Oru naal serthaal IN, ON aaga maarugiradhu. 'In the morning' enbadhu 'ON Monday morning' aagiradhu. Oru kurippitta naal inaikkappadum tharunaththil, andhath thodar IN-lirundhu ON-kku nagargiradhu."},
 {h:"The AT family beyond the clock",
  en:"AT also covers festivals and fixed points: at Diwali, at Christmas, at dawn, at dusk, at noon, at midnight, at present, at the moment, at the age of ten, at the beginning, at the end.",
  ta:"கடிகாரத்திற்கு அப்பாற்பட்ட AT குடும்பம். AT பண்டிகைகளையும் நிலையான புள்ளிகளையும் உள்ளடக்கும்: at Diwali, at Christmas, at dawn, at dusk, at noon, at midnight, at present, at the moment, at the age of ten, at the beginning, at the end.",
  tl:"Kadigaaraththirku appaarpatta AT kudumbam. AT pandigaigalaiyum nilaiyaana pullligalaiyum ulladakkum: at Diwali, at dawn, at noon, at midnight, at present, at the age of ten."},
 {h:"No preposition before next, last, this, every",
  en:"'I will see you next Monday' — never 'on next Monday'. Words like next, last, this, that, every, tomorrow, yesterday take NO preposition at all. This is a very frequent error-spotting item.",
  ta:"Next, last, this, every-க்கு முன் முன்னுருபு இல்லை. 'I will see you next Monday' — ஒருபோதும் 'on next Monday' அல்ல. next, last, this, that, every, tomorrow, yesterday போன்ற சொற்கள் எந்த முன்னுருபையும் எடுப்பதில்லை. இது மிக அடிக்கடி வரும் error-spotting விஷயம்.",
  tl:"Next, last, this, every-kku mun munnurubu illai. 'I will see you next Monday' — orupodhum 'on next Monday' alla. next, last, this, that, every, tomorrow, yesterday pondra sorkal endha munnurubaiyum eduppadhillai."}],

 s3:[
 {h:"The funnel from big to small",
  d:"   IN  ████████████  year · month · season\n         in 1998 · in June · in summer\n              ↓\n   ON  ██████        a single day\n         on Monday · on 15 August\n              ↓\n   AT  ██            one exact point\n         at 6 p.m. · at noon · at dawn\n\n   Each level zooms in one step further."},
 {h:"Adding a day flips IN to ON",
  d:"   in the morning        →  general\n   ON Monday morning     →  a day is attached\n\n   in the evening        →  general\n   ON Sunday evening     →  a day is attached\n\n   The moment a DAY appears, use ON."},
 {h:"The no-preposition list",
  d:"   ⚠ NO preposition before these:\n\n   next Monday · last week · this year\n   that day · every Sunday\n   tomorrow · yesterday · today · tonight\n\n   I will meet you NEXT MONDAY.      ✔\n   I will meet you ON next Monday.   ✘"}],

 s4:{
 wrong:["\"Any time expression needs a preposition.\" — Next, last, this and every take none.",
  "\"'In Monday' is fine because a day is a period.\" — Days always take ON.",
  "\"'On 6 p.m.' works because it is a specific time.\" — Clock times take AT.",
  "\"'In Diwali' is correct because it lasts several days.\" — Festivals take AT."],
 right:["Ask how big the time unit is: year or month → in, day → on, clock time → at.",
  "If a day is named, switch to ON even for morning or evening.",
  "Learn the AT family: noon, midnight, dawn, dusk, present, festivals.",
  "Never use a preposition before next, last, this or every."]},

 s5:[
 {en:"He was born in 1998 in the month of June.",ta:"அவர் 1998-ல் ஜூன் மாதத்தில் பிறந்தார்.",tl:"Avar 1998-l June maadhaththil pirandhaar.",note:"A year and a month both take IN."},
 {en:"The examination will be held on 15 August.",ta:"தேர்வு ஆகஸ்ட் 15-ஆம் தேதி நடைபெறும்.",tl:"Thervu August 15-aam thedhi nadaiperum.",note:"A date takes ON."},
 {en:"We met at six o'clock in the evening.",ta:"நாங்கள் மாலை ஆறு மணிக்குச் சந்தித்தோம்.",tl:"Naangal maalai aaru manikkuch sandhiththom.",note:"A clock time takes AT; a general part of the day takes IN."},
 {en:"She visits her parents at Diwali every year.",ta:"அவர் ஒவ்வொரு ஆண்டும் தீபாவளியின்போது பெற்றோரைப் பார்க்கச் செல்கிறார்.",tl:"Avar ovvoru aandum Deepaavaliyinbodhu petrorai paarkkach selgiraar.",note:"A festival takes AT."},
 {en:"I will meet you next Monday without fail.",ta:"நான் அடுத்த திங்கள்கிழமை தவறாமல் உங்களைச் சந்திப்பேன்.",tl:"Naan aduththa thingatkizhamai thavaraamal ungalaich sandhippen.",note:"'Next Monday' takes NO preposition."}],

 s6:["in|-ல் (பெரிய காலம்)|-l (periya kaalam)",
  "on|-ல் (நாள், தேதி)|-l (naal, thedhi)",
  "at|-க்கு (சரியான நேரம்)|-kku (sariyaana neram)",
  "in June|ஜூன் மாதத்தில்|June maadhaththil",

  "in the morning|காலையில்|Kaalaiyil",
  "on Monday morning|திங்கள் காலையில்|Thingal kaalaiyil",
  "at noon|நண்பகலில்|Nanpagalil",
  "at midnight|நள்ளிரவில்|Nallliravil",
  "at Diwali|தீபாவளியின்போது|Deepaavaliyinbodhu",
  "next Monday|அடுத்த திங்கள்|Aduththa thingal"],

 s7:[
 "He was born ____ 1998.|in|Easy|A year takes IN.",
 "The exam is ____ 15 August.|on|Easy|A date takes ON.",
 "We met ____ six o'clock.|at|Easy|A clock time takes AT.",
 "She wakes up ____ the morning.|in|Easy|A general part of the day takes IN.",
 "The meeting is ____ Monday.|on|Medium|A day takes ON.",
 "He arrived ____ Monday morning.|on|Medium|A day is attached, so ON.",
 "They travel ____ summer every year.|in|Medium|A season takes IN.",
 "The shop closes ____ midnight.|at|Medium|A fixed point takes AT.",
 "We visit them ____ Diwali.|at|Hard|A festival takes AT.",
 "I will see you ____ next Monday.|—|Hard|'Next Monday' takes no preposition.",
 "He retired ____ the age of sixty.|at|Hard|'At the age of' is a fixed phrase.",

 s9:[

 s10:{
  en:"The exam rarely tests 'in June' or 'on Monday' directly. It tests the BORDER cases: 'in the morning' versus 'on Monday morning', 'at Diwali' versus 'in December', and the no-preposition list. 'On next Monday' is planted in almost every paper because adding 'on' feels more complete.",
  ta:"தேர்வு 'in June' அல்லது 'on Monday'-ஐ நேரடியாக அரிதாகவே சோதிக்கிறது. அது எல்லைப்புற வழக்குகளைச் சோதிக்கிறது: 'in the morning' மற்றும் 'on Monday morning', 'at Diwali' மற்றும் 'in December', மேலும் முன்னுருபு இல்லாத பட்டியல். 'On next Monday' கிட்டத்தட்ட ஒவ்வொரு தாளிலும் நடப்படுகிறது, ஏனெனில் 'on' சேர்ப்பது முழுமையாகத் தோன்றுகிறது.",
  tl:"Thervu 'in June' alladhu 'on Monday'-ai neradiyaaga aridhaagave sodhikkiradhu. Adhu ellaippura vazhakkugalaich sodhikkiradhu. 'On next Monday' kittaththatta ovvoru thaalilum nadappadugiradhu."},

 s11:{
  en:"BIG TIME IN, DAY ON, CLOCK AT. And never a preposition before next, last, this or every.",
  ta:"பெரிய காலம் IN, நாள் ON, கடிகாரம் AT. மேலும் next, last, this, every-க்கு முன் ஒருபோதும் முன்னுருபு இல்லை.",
  tl:"Periya kaalam IN, naal ON, kadigaaram AT. Melum next, last, this, every-kku mun orupodhum munnurubu illai.",
  vis:"      THE SIZE SCALE\n\n   🗓️ IN  →  year · month · season · century\n              in 1998 · in June · in winter\n              in the morning · in the 1990s\n\n   📅 ON  →  a single day or date\n              on Monday · on 15 August\n              on Monday morning · on my birthday\n\n   ⏰ AT  →  one exact point\n              at 6 p.m. · at noon · at midnight\n              at dawn · at Diwali · at present\n              at the age of ten\n\n   ⚠ NO PREPOSITION AT ALL:\n     next Monday · last week · this year\n     every Sunday · tomorrow · yesterday"},

 s15:[
 {ta:"Prepositions module-ஐ ஆரம்பிக்கலாம். இது SSC-ல மிக அதிகமா கேட்கப்படுற module. பதினைந்து rule இருக்கு, ஆனா முதல் ரெண்டு rule-ஐ நல்லா புரிஞ்சுக்கிட்டா மத்தது சுலபம்.",
  tl:"Prepositions module-ai aarambikkalaam. Idhu SSC-la miga adhigamaa ketkappaduthra module. Padhinaindhu rule irukku, aanaa mudhal rendu rule-ai nallaa purinjukkittaa maththadhu sulabam."},
 {ta:"நேரத்துக்கு மூணு முன்னுருபு இருக்கு — in, on, at. இதை ஒரு புனல் (funnel) மாதிரி நினைச்சுக்கோங்க. மேல பெரிய வாய், கீழ சின்ன முனை.",
  tl:"Neraththukku moonu munnurubu irukku — in, on, at. Idhai oru punal (funnel) maadhiri ninaichukkonga. Mela periya vaay, keezha chinna munai."},
 {ta:"மேல IN — பெரிய காலம். ஆண்டு, மாதம், பருவம், நூற்றாண்டு. 'in 1998', 'in June', 'in summer', 'in the 20th century'. நடுவுல ON — ஒரு நாள். 'on Monday', 'on 15 August'. கீழ AT — ஒரு துல்லியமான புள்ளி. 'at six o'clock', 'at noon', 'at midnight'.",
  tl:"Mela IN — periya kaalam. Aandu, maadham, paruvam. 'in 1998', 'in June', 'in summer'. Naduvula ON — oru naal. 'on Monday', 'on 15 August'. Keezha AT — oru thulliyamaana pulli. 'at six o'clock', 'at noon'."},
 {ta:"இப்போ ஒரு நுட்பமான விஷயம். 'In the morning' — பொதுவா காலையில். ஆனா 'ON Monday morning' — திங்கள் காலையில். ஏன் மாறுது? ஏன்னா ஒரு நாள் சேர்ந்திடுச்சு! நாள் வந்தா ON. இதை SSC அடிக்கடி கேட்கும்.",
  tl:"Ippo oru nutpamaana vishayam. 'In the morning' — podhuvaa kaalaiyil. Aanaa 'ON Monday morning' — thingal kaalaiyil. Yen maarudhu? Yennaa oru naal serndhidichu! Naal vandhaa ON."},
 {ta:"AT-க்கு கடிகார நேரம் மட்டும் இல்ல. இன்னும் சில நிலையான புள்ளி இருக்கு: at noon, at midnight, at dawn, at dusk, at present, at the moment, at Diwali, at Christmas, at the age of ten. இதெல்லாம் மனப்பாடம் பண்ணுங்க.",
  tl:"AT-kku kadigaara neram mattum illa. Innum sila nilaiyaana pulli irukku: at noon, at midnight, at dawn, at dusk, at present, at Diwali, at the age of ten."},
 {ta:"கடைசியா ஒரு ரொம்ப முக்கியமான விஷயம் — சில நேரச் சொல்லுக்கு முன்னுருபே வராது! 'next Monday', 'last week', 'this year', 'every Sunday', 'tomorrow', 'yesterday'. இதுக்கு எல்லாம் preposition போடக்கூடாது. 'I will see you NEXT MONDAY' — 'on next Monday' இல்ல! SSC இதை கிட்டத்தட்ட ஒவ்வொரு தாள்லயும் கேட்குது, ஏன்னா 'on' சேர்த்தா முழுமையா தோணும். ஆனா தப்பு.",
  tl:"Kadaisiyaa oru romba mukkiyamaana vishayam — sila nerach sollukku munnurube varaadhu! 'next Monday', 'last week', 'this year', 'every Sunday', 'tomorrow', 'yesterday'. 'I will see you NEXT MONDAY' — 'on next Monday' illa!"}]},

/* ========== RULE 72 ========== */
{n:72,rc:"PRE-02",d:"Easy",t:"IN, ON and AT for PLACE",
 tam:"In = உள்ளே · On = மேற்பரப்பு · At = குறிப்பிட்ட புள்ளி",
 s1:{en:"Use IN for enclosed spaces and large areas, ON for surfaces and lines, and AT for specific points or addresses. IN is three-dimensional, ON is two-dimensional, and AT is a single point.",
  ta:"மூடிய இடங்கள் மற்றும் பெரிய பகுதிகளுக்கு IN, மேற்பரப்புகள் மற்றும் கோடுகளுக்கு ON, குறிப்பிட்ட புள்ளிகள் அல்லது முகவரிகளுக்கு AT பயன்படுத்தவும். IN முப்பரிமாணம், ON இருபரிமாணம், AT ஒரு புள்ளி.",
  tl:"Moodiya idangal matrum periya paguthigalukku IN, merparappugal matrum kodugalukku ON, kurippitta pulligal alladhu mugavarigalukku AT payanpaduththavum.",
  formula:"IN  →  inside, enclosed, large area\n  in the room · in Chennai · in India\n  in the box · in the water · in the sky\n\nON  →  a surface or a line\n  on the table · on the wall · on the floor\n  on the second page · on the road\n\nAT  →  a point or an address\n  at the gate · at the bus stop\n  at 12 Anna Salai · at the airport"},

 s2:[
 {h:"Three dimensions, two dimensions, one point",
  en:"IN means you are surrounded — inside a room, inside a city, inside water. ON means you are touching a flat surface — a table, a wall, a road. AT means you are at one spot with no interest in its shape — at the gate, at the corner.",
  ta:"முப்பரிமாணம், இருபரிமாணம், ஒரு புள்ளி. IN என்றால் நீங்கள் சூழப்பட்டிருக்கிறீர்கள் — ஒரு அறைக்குள், ஒரு நகரத்திற்குள், தண்ணீருக்குள். ON என்றால் நீங்கள் ஒரு தட்டையான மேற்பரப்பைத் தொடுகிறீர்கள் — ஒரு மேசை, ஒரு சுவர், ஒரு சாலை. AT என்றால் நீங்கள் ஒரு இடத்தில் இருக்கிறீர்கள், அதன் வடிவத்தில் ஆர்வமில்லை — வாசலில், மூலையில்.",
  tl:"Mupparimaanam, iruparimaanam, oru pulli. IN endraal neengal soozhappattirukkireergal. ON endraal neengal oru thattaiyaana merparappaith thodugireergal. AT endraal neengal oru idaththil irukkireergal."},
 {h:"The same place can take different prepositions",
  en:"'He is IN the office' means he is inside the building. 'He works AT the office' treats it as a point in his routine. 'She lives IN Chennai' but 'The train stops AT Chennai' — the city becomes a point on a route.",
  ta:"அதே இடம் வெவ்வேறு முன்னுருபுகளை எடுக்கலாம். 'He is IN the office' என்றால் அவர் கட்டிடத்திற்குள் இருக்கிறார். 'He works AT the office' அதை அவரது வழக்கத்தில் ஒரு புள்ளியாகக் கருதுகிறது. 'She lives IN Chennai' ஆனால் 'The train stops AT Chennai' — நகரம் ஒரு பாதையில் ஒரு புள்ளியாகிறது.",
  tl:"Adhe idam vevveru munnurubugalai edukkalaam. 'He is IN the office' endraal avar kattidaththirkul irukkiraar. 'She lives IN Chennai' aanaal 'The train stops AT Chennai'."},
 {h:"Large places take IN, small places take AT",
  en:"'He lives IN Chennai' (a large city) but 'He lives AT Adyar' (a small locality). Countries and cities take IN; villages, addresses and small points take AT. Size decides.",
  ta:"பெரிய இடங்கள் IN எடுக்கும், சிறிய இடங்கள் AT எடுக்கும். 'He lives IN Chennai' (ஒரு பெரிய நகரம்) ஆனால் 'He lives AT Adyar' (ஒரு சிறிய பகுதி). நாடுகளும் நகரங்களும் IN எடுக்கும்; கிராமங்கள், முகவரிகள், சிறிய புள்ளிகள் AT எடுக்கும். அளவு தீர்மானிக்கிறது.",
  tl:"Periya idangal IN edukkum, siriya idangal AT edukkum. 'He lives IN Chennai' aanaal 'He lives AT Adyar'. Naadugalum nagarangalum IN edukkum; giraamangal, mugavarigal AT edukkum."},
 {h:"Fixed ON phrases",
  en:"on the wall, on the ceiling, on the floor, on the road, on the bank of a river, on the left, on the right, on page five, on the second floor, on television, on the phone, on the way.",
  ta:"நிலையான ON தொடர்கள்: on the wall, on the ceiling, on the floor, on the road, on the bank of a river, on the left, on the right, on page five, on the second floor, on television, on the phone, on the way.",
  tl:"Nilaiyaana ON thodargal: on the wall, on the ceiling, on the floor, on the road, on the bank of a river, on the left, on the right, on page five, on the second floor, on television, on the way."}],

 s3:[
 {h:"Dimensions",
  d:"   📦 IN  →  3-D, surrounded\n         in the box · in the room\n         in Chennai · in the water\n\n   ▬  ON  →  2-D, a flat surface\n         on the table · on the wall\n         on the road · on page five\n\n   ·  AT  →  1 point, no shape\n         at the gate · at the corner\n         at 12 Anna Salai · at the bus stop"},
 {h:"Big place versus small place",
  d:"   🌍 COUNTRY / CITY  →  IN\n      in India · in Chennai · in Delhi\n\n   📍 LOCALITY / ADDRESS →  AT\n      at Adyar · at 12 Anna Salai\n      at the bus stop · at the airport\n\n   Bigger = IN.  Smaller = AT."},
 {h:"The same word, two views",
  d:"   He is IN the office.\n     → inside the building\n\n   He works AT the office.\n     → a point in his daily routine\n\n   She lives IN Chennai.\n     → inside the city\n\n   The train stops AT Chennai.\n     → a point on the route"}],

 s8:[
 "He lives at Chennai with his family.|He lives in Chennai with his family.|A large city takes IN.",
 "The book is in the table.|The book is on the table.|A table is a surface.",
 "Please wait in the gate.|Please wait at the gate.|A gate is a point.",
 "The picture hangs in the wall.|The picture hangs on the wall.|A wall is a surface.",
 "They arrived in the airport early.|They arrived at the airport early.|An airport is a point of arrival.",
 "The keys are on my pocket.|The keys are in my pocket.|A pocket is an enclosed space.",
 "He is waiting in the bus stop.|He is waiting at the bus stop.|A bus stop is a point.",
 "The answer is in page five.|The answer is on page five.|The fixed phrase is 'on page'.",
 "His office is in the second floor.|His office is on the second floor.|The fixed phrase is 'on the floor'.",
 "We watched the match in television.|We watched the match on television.|The fixed phrase is 'on television'."],

 s9:[
 "Fill in the Blank|The old photograph has been hanging ____ that wall for nearly thirty years.|in;on|1|A wall is a surface.",
 "Find the Error|He has been living (A) at Chennai (B) since his father (C) was transferred there (D).|A;B;C;D|1|Part B. A large city takes IN → 'in Chennai'.",
 "Sentence Improvement|The detailed instructions are given in page seventeen of the handbook.|in page;on page;at page|1|The fixed phrase is 'on page'.",
 "Fill in the Blank|A large crowd had gathered ____ the gate of the collectorate by ten o'clock.|in;at|1|A gate is a specific point.",
 "Find the Error|Our new office (A) is situated in (B) the third floor (C) of that building (D).|A;B;C;D|1|Part B. The fixed phrase is 'on the third floor'."],

 s10:{
  en:"The exam picks places where the shape is arguable. Is a wall a surface or an enclosure? Is a city a container or a point? The answer depends on how the sentence uses it. 'On the wall' and 'on the floor' feel wrong to Indian learners because Tamil marks them differently. And 'in page five' is planted constantly.",
  ta:"தேர்வு வடிவம் விவாதிக்கக்கூடிய இடங்களைத் தேர்ந்தெடுக்கிறது. ஒரு சுவர் ஒரு மேற்பரப்பா அல்லது ஒரு அடைப்பா? ஒரு நகரம் ஒரு கொள்கலனா அல்லது ஒரு புள்ளியா? பதில் வாக்கியம் அதை எப்படிப் பயன்படுத்துகிறது என்பதைப் பொறுத்தது. 'On the wall' மற்றும் 'on the floor' இந்திய மாணவர்களுக்குத் தவறாகத் தோன்றுகின்றன, ஏனெனில் தமிழ் அவற்றை வேறுவிதமாகக் குறிக்கிறது. மேலும் 'in page five' தொடர்ந்து நடப்படுகிறது.",
  tl:"Thervu vadivam vivaadhikkakkoodiya idangalaith therndhedukkiradhu. Padhil vaakkiyam adhai eppadip payanpaduththugiradhu enbadhaip poruththadhu. Melum 'in page five' thodarndhu nadappadugiradhu."},

 s11:{
  en:"AM I SURROUNDED, TOUCHING, OR AT A POINT? Surrounded → in. Touching → on. Point → at.",
  ta:"நான் சூழப்பட்டிருக்கிறேனா, தொடுகிறேனா, ஒரு புள்ளியில் இருக்கிறேனா? சூழப்பட்டு → in. தொட்டு → on. புள்ளி → at.",
  tl:"Naan soozhappattirukkirenaa, thodugirenaa, oru pulliyil irukkirenaa? Soozhappattu → in. Thottu → on. Pulli → at.",
  vis:"      THE DIMENSION TEST\n\n   📦 3-D · SURROUNDED   →  IN\n      in the box · in the room\n      in Chennai · in the water · in the sky\n\n   ▬ 2-D · TOUCHING     →  ON\n      on the table · on the wall · on the floor\n      on the road · on page five · on the 2nd floor\n      on television · on the phone · on the way\n\n   · 1 POINT             →  AT\n      at the gate · at the corner · at the airport\n      at 12 Anna Salai · at the bus stop\n\n   ⚠ SIZE ALSO MATTERS:\n     in Chennai (big) · at Adyar (small)"},

 s13:[
 "He lives ____ Chennai, ____ 12 Anna Salai, ____ the second floor of that building.|in-at-on;at-in-in;in-at-in|0|A large city → IN. An address → AT. A floor → ON.",
 "The picture ____ the wall was painted ____ 1998 by ____ artist from Delhi.|on-in-an;in-on-a;on-in-a|0|A surface → ON. A year → IN. 'Artist' begins with a vowel sound → AN.",
 "They arrived ____ the airport ____ dawn, but the flight ____ already left.|at-at-had;in-in-has;at-at-has|0|A point → AT. A fixed time → AT dawn. The earlier past action → HAD (Tense Rule 54).",
 "The instructions are ____ page five, and each of the candidates ____ read them.|on-has;in-have;on-have|0|The fixed phrase 'on page'. 'Each of' is fixed singular → HAS (SVA Rule 50).",
 "A crowd had gathered ____ the gate, and the police ____ trying to control them.|at-were;in-was;at-was|0|A point → AT. 'Police' is always plural → WERE (SVA Rule 47)."],

 s14:{
  rule:"Use IN for enclosed spaces, ON for surfaces, and AT for specific points or addresses.",
  formula:"IN → inside, 3-D, large area (in the room, in Chennai)\nON → surface, 2-D (on the table, on page five)\nAT → one point or address (at the gate, at 12 Anna Salai)",
  memory:"Surrounded IN, Surface ON, Point AT.",
  ta:"சூழப்பட்டா IN, மேற்பரப்பு ON, புள்ளி AT.",
  tl:"Soozhappattaa IN, merparappu ON, pulli AT.",
  mistake:"Writing 'in the wall', 'at Chennai' for residence, and 'in page five'.",
  exam:"SSC CGL / CHSL / MTS and RRB — appears in almost every preposition question set."},

 s15:[
 {ta:"நேரத்துக்கு in, on, at பார்த்தோம். இப்போ இடத்துக்கு பார்க்கலாம். இதுலயும் அதே மூணு வார்த்தை, ஆனா வேற தர்க்கம் — பரிமாணம் (dimension).",
  tl:"Neraththukku in, on, at paarththom. Ippo idaththukku paarkkalaam. Idhulayum adhe moonu vaarththai, aanaa veru tharkkam — parimaanam (dimension)."},
 {ta:"IN அப்படின்னா நீங்க சூழப்பட்டு இருக்கீங்க. முப்பரிமாணம். 'In the room' — அறைக்குள்ள, சுத்தி சுவர். 'In the box' — பெட்டிக்குள்ள. 'In Chennai' — நகரத்துக்குள்ள. 'In the water' — தண்ணீருக்குள்ள.",
  tl:"IN appadinnaa neenga soozhappattu irukkeenga. Mupparimaanam. 'In the room' — araikkulla, suththi suvar. 'In the box' — pettikkulla. 'In Chennai' — nagaraththukkulla."},
 {ta:"ON அப்படின்னா ஒரு தட்டையான மேற்பரப்பை தொடுறீங்க. இருபரிமாணம். 'On the table' — மேசை மேல. 'On the wall' — சுவர் மேல. 'On the road' — சாலை மேல. நமக்கு 'சுவரில் படம் இருக்கு' அப்படின்னு தமிழ்ல சொல்லுறதால 'in the wall' அப்படின்னு எழுதிடுவோம். ஆனா சுவர் ஒரு மேற்பரப்பு — ON.",
  tl:"ON appadinnaa oru thattaiyaana merparappai thodureenga. Iruparimaanam. 'On the table' — mesai mela. 'On the wall' — suvar mela. Namakku Tamil-la sollurdhaala 'in the wall' appadinnu ezhudhiduvom. Aanaa suvar oru merparappu — ON."},
 {ta:"AT அப்படின்னா ஒரு புள்ளி. வடிவமே முக்கியமில்ல, அது ஒரு இடம். 'At the gate' — வாசல்ல. 'At the bus stop' — பேருந்து நிறுத்தத்துல. 'At the corner' — மூலைல. 'At 12 Anna Salai' — அந்த முகவரில.",
  tl:"AT appadinnaa oru pulli. Vadivame mukkiyamilla, adhu oru idam. 'At the gate' — vaasalla. 'At the bus stop'. 'At the corner'. 'At 12 Anna Salai'."},
 {ta:"இப்போ ஒரு சுவாரஸ்யமான விஷயம் — அளவும் முக்கியம். 'He lives IN Chennai' — சென்னை பெரிய நகரம், IN. ஆனா 'He lives AT Adyar' — அடையாறு ஒரு சின்ன பகுதி, AT. பெரிசு IN, சின்னது AT. அதே சென்னை கூட 'The train stops AT Chennai' அப்படின்னா AT — ஏன்னா இங்க சென்னை ஒரு பாதையில ஒரு நிறுத்தம், ஒரு புள்ளி.",
  tl:"Ippo oru suvaarasyamaana vishayam — alavum mukkiyam. 'He lives IN Chennai' — Chennai periya nagaram, IN. Aanaa 'He lives AT Adyar' — Adyar oru chinna paguthi, AT. Perisu IN, chinnadhu AT."},
 {ta:"கடைசியா சில நிலையான ON தொடர் மனப்பாடம் பண்ணுங்க — இவை காரணமே இல்லாம ON எடுக்குது: on page five, on the second floor, on television, on the phone, on the way, on the left, on the right, on the bank of the river. குறிப்பா 'on page' மற்றும் 'on the floor' — இதை SSC அடிக்கடி கேட்குது, ஏன்னா நாம 'in page', 'in the floor' அப்படின்னு எழுதிடுவோம்.",
  tl:"Kadaisiyaa sila nilaiyaana ON thodar manappaadam pannunga — ivai kaaraname illaama ON edukkudhu: on page five, on the second floor, on television, on the phone, on the way, on the left. Kurippaa 'on page' matrum 'on the floor'."}]},

/* ========== RULE 73 ========== */
{n:73,rc:"PRE-03",d:"Medium",t:"SINCE, FOR and FROM",
 tam:"Since = தொடங்கிய புள்ளி · For = கால அளவு · From = தொடக்கம்",
 s1:{en:"SINCE marks a POINT of time and needs a PERFECT tense. FOR marks a LENGTH of time. FROM marks a starting point with PAST or FUTURE tenses. Each answers a different question.",
  ta:"SINCE ஒரு நேரப் புள்ளியைக் குறிக்கிறது, அதற்கு perfect tense தேவை. FOR ஒரு கால அளவைக் குறிக்கிறது. FROM கடந்தகால அல்லது எதிர்கால tense-களுடன் ஒரு தொடக்கப் புள்ளியைக் குறிக்கிறது. ஒவ்வொன்றும் வெவ்வேறு கேள்விக்குப் பதில் தருகிறது.",
  tl:"SINCE oru nerap pulliyaik kurikkiradhu, adharku perfect tense thevai. FOR oru kaala alavaik kurikkiradhu. FROM kadandhagaala alladhu edhirkaala tense-galudan oru thodakkap pulliyaik kurikkiradhu.",
  formula:"SINCE  +  POINT of time  +  PERFECT tense\n  He has been ill SINCE Monday.\n  I have known him SINCE 2015.\n\nFOR    +  LENGTH of time\n  She has lived here FOR ten years.\n  He waited FOR two hours.\n\nFROM   +  starting point (past or future)\n  He worked there FROM 2010 TO 2014.\n  The rule applies FROM next month."},

 s2:[
 {h:"Three different questions",
  en:"SINCE answers WHEN did it start. FOR answers HOW LONG has it lasted. FROM answers WHERE does the period begin, usually with an end point given by 'to'. Identify the question and the preposition follows.",
  ta:"மூன்று வெவ்வேறு கேள்விகள். SINCE 'எப்போது தொடங்கியது' என்பதற்குப் பதில் தருகிறது. FOR 'எவ்வளவு காலம் நீடித்தது' என்பதற்கு. FROM 'காலம் எங்கே தொடங்குகிறது' என்பதற்கு, பொதுவாக 'to' தரும் ஒரு முடிவுப் புள்ளியுடன். கேள்வியை அடையாளம் காணுங்கள், முன்னுருபு தொடரும்.",
  tl:"Moondru vevveru kelvigal. SINCE 'eppodhu thodangiyadhu' enbadharkup padhil tharugiradhu. FOR 'evvalavu kaalam needithadhu' enbadharku. FROM 'kaalam enge thodangugiradhu' enbadharku."},
 {h:"SINCE cannot live without a perfect tense",
  en:"'I know him since 2010' is wrong. 'Since' needs have, has or had somewhere in the sentence: 'I HAVE KNOWN him since 2010'. Whenever you write 'since', look for the perfect auxiliary.",
  ta:"SINCE ஒரு perfect tense இல்லாமல் வாழ முடியாது. 'I know him since 2010' தவறு. 'Since'-க்கு வாக்கியத்தில் எங்காவது have, has அல்லது had தேவை: 'I HAVE KNOWN him since 2010'. நீங்கள் 'since' எழுதும்போதெல்லாம், perfect துணை வினைச்சொல்லைத் தேடுங்கள்.",
  tl:"SINCE oru perfect tense illaamal vaazha mudiyaadhu. 'I know him since 2010' thavaru. 'Since'-kku vaakkiyaththil engaavadhu have, has alladhu had thevai."},
 {h:"'Since ten years' is the classic Indian error",
  en:"Ten years is a LENGTH, not a point, so it must be 'FOR ten years'. Every Indian speaker has said 'since ten years'. It appears in almost every SSC error-spotting set precisely because it feels natural.",
  ta:"'Since ten years' பாரம்பரியமான இந்தியத் தவறு. பத்து ஆண்டுகள் ஒரு கால அளவு, ஒரு புள்ளி அல்ல, எனவே அது 'FOR ten years' என்றுதான் இருக்க வேண்டும். ஒவ்வொரு இந்தியப் பேச்சாளரும் 'since ten years' என்று சொல்லியிருக்கிறார். இயற்கையாகத் தோன்றுவதால்தான் இது கிட்டத்தட்ட ஒவ்வொரு SSC error-spotting தொகுப்பிலும் வருகிறது.",
  tl:"'Since ten years' paaramparyamaana Indhiyath thavaru. Paththu aandugal oru kaala alavu, oru pulli alla, enave adhu 'FOR ten years' endrudhaan irukka vendum."},
 {h:"FROM pairs with TO or TILL",
  en:"'He worked there from 2010 to 2014', 'The office is open from nine till five'. 'From' almost always has a partner marking the end. 'Since' never does, because it runs up to now.",
  ta:"FROM TO அல்லது TILL-உடன் ஜோடி சேரும். 'He worked there from 2010 to 2014', 'The office is open from nine till five'. 'From'-க்கு கிட்டத்தட்ட எப்போதும் முடிவைக் குறிக்கும் ஒரு துணை இருக்கும். 'Since'-க்கு ஒருபோதும் இல்லை, ஏனெனில் அது இப்போதுவரை ஓடுகிறது.",
  tl:"FROM TO alladhu TILL-udan jodi serum. 'He worked there from 2010 to 2014', 'The office is open from nine till five'. 'Since'-kku orupodhum illai, yenenil adhu ippodhuvarai odugiradhu."}],

 s3:[
 {h:"Point, length, start",
  d:"   SINCE  →  a POINT, running up to NOW\n   ────●─────────────────────► NOW\n     Monday\n\n   FOR    →  the LENGTH of the line\n   ────├──────────────┤──────► NOW\n       └── ten years ──┘\n\n   FROM   →  a start, usually with an end\n   ────●──────────────●\n     2010            2014"},
 {h:"Which question does it answer?",
  d:"   \"WHEN did it start?\"     →  SINCE\n     since Monday · since 2015\n     since morning · since he left\n\n   \"HOW LONG has it lasted?\" →  FOR\n     for two hours · for ten years\n     for a week · for ages\n\n   \"FROM WHEN TO WHEN?\"      →  FROM ... TO\n     from 2010 to 2014\n     from nine till five"},
 {h:"Since needs a perfect tense",
  d:"   I KNOW him since 2010.        ✘\n   I HAVE KNOWN him since 2010.  ✔\n\n   Whenever you write SINCE,\n   hunt for  HAVE · HAS · HAD\n\n   ⚠ FROM does NOT need a perfect tense:\n     He worked there from 2010.  ✔\n     The rule applies from June. ✔"}],

 s4:{
 wrong:["\"'Since ten years' is what everyone says.\" — Ten years is a length, so it needs 'for'.",
  "\"'Since' and 'from' are interchangeable.\" — 'From' works with past and future; 'since' needs a perfect tense.",
  "\"'I live here since 2010' is complete.\" — It must be 'I have lived here since 2010'.",
  "\"'For 2015' shows the starting year.\" — 'For' takes a length, not a date."],
 right:["Ask: WHEN, HOW LONG, or FROM WHEN TO WHEN?",
  "WHEN → since. HOW LONG → for. A span with an end → from ... to.",
  "Check that a have, has or had accompanies 'since'.",
  "Use 'from' for past spans and future starting points."]},

 s5:[
 {en:"He has been ill since Monday morning.",ta:"திங்கள்கிழமை காலையிலிருந்து அவர் உடல்நலமில்லாமல் இருக்கிறார்.",tl:"Thingatkizhamai kaalaiyilirundhu avar udalnalamillaamal irukkiraar.",note:"A point of time with a perfect tense → SINCE."},
 {en:"She has lived in this house for ten years.",ta:"அவர் இந்த வீட்டில் பத்து ஆண்டுகளாக வசித்து வருகிறார்.",tl:"Avar indha veettil paththu aandugalaaga vasiththu varugiraar.",note:"A length of time → FOR."},
 {en:"He worked in that bank from 2010 to 2014.",ta:"அவர் அந்த வங்கியில் 2010 முதல் 2014 வரை பணியாற்றினார்.",tl:"Avar andha vangiyil 2010 mudhal 2014 varai paniyaatrinaar.",note:"A completed past span → FROM ... TO."},
 {en:"The new rule will apply from next month.",ta:"புதிய விதி அடுத்த மாதம் முதல் அமலுக்கு வரும்.",tl:"Pudhiya vidhi aduththa maadham mudhal amalukku varum.",note:"A future starting point → FROM."},
 {en:"I have known him since our college days.",ta:"கல்லூரி நாட்களிலிருந்து அவரை எனக்குத் தெரியும்.",tl:"Kalluri naatkalilirundhu avarai enakkuth theriyum.",note:"A point of time with a perfect tense → SINCE."}],

 s6:["since|முதல் / -லிருந்து|Mudhal / -lirundhu",
  "for|-ஆக (கால அளவு)|-aaga (kaala alavu)",
  "from|-லிருந்து (தொடக்கம்)|-lirundhu (thodakkam)",
  "from ... to|... முதல் ... வரை|... mudhal ... varai",
  "since Monday|திங்களிலிருந்து|Thingalilirundhu",
  "for ten years|பத்து ஆண்டுகளாக|Paththu aandugalaaga",
  "point of time|நேரப் புள்ளி|Nerap pulli",

 s10:{
  en:"'Since ten years' is possibly the single most common grammatical error in Indian English. Every one of us has said it. The exam plants it because it feels completely normal. The second trap is the missing perfect tense — 'I know him since 2010' has the right preposition but the wrong verb form. Check the preposition AND the tense together.",
  ta:"'Since ten years' இந்திய ஆங்கிலத்தில் மிகவும் பொதுவான ஒற்றை இலக்கணத் தவறாக இருக்கலாம். நம்மில் ஒவ்வொருவரும் அதைச் சொல்லியிருக்கிறோம். அது முற்றிலும் இயல்பாகத் தோன்றுவதால் தேர்வு அதை நடுகிறது. இரண்டாவது பொறி காணாமல் போன perfect tense — 'I know him since 2010' இதில் முன்னுருபு சரி ஆனால் வினைச்சொல் வடிவம் தவறு. முன்னுருபையும் tense-ஐயும் சேர்த்துச் சரிபாருங்கள்.",
  tl:"'Since ten years' Indhiya Aangilaththil migavum podhuvaana otrai ilakkanath thavaraaga irukkalaam. Irandaavadhu pori kaanaamal pona perfect tense. Munnurubaiyum tense-aiyum serthuch saripaarungal."},

 s11:{
  en:"WHEN, HOW LONG, or FROM-TO? Since needs a perfect tense; from does not.",
  ta:"எப்போது, எவ்வளவு காலம், இல்லை எங்கிருந்து எங்கே? Since-க்கு perfect tense தேவை; from-க்கு இல்லை.",
  tl:"Eppodhu, evvalavu kaalam, illai engirundhu enge? Since-kku perfect tense thevai; from-kku illai.",
  vis:"      THE THREE-QUESTION TEST\n\n   \"WHEN did it start?\"      →  SINCE\n     Monday · 2015 · morning\n     childhood · he left · last night\n     ⚠ NEEDS have / has / had\n\n   \"HOW LONG has it lasted?\" →  FOR\n     two hours · ten years · a week\n     ages · decades · a long time\n\n   \"FROM WHEN TO WHEN?\"      →  FROM ... TO\n     from 2010 to 2014\n     from nine till five\n     from next month (future)\n\n   ⚠ THE INDIAN ERROR:\n     since ten years   ✘\n     for ten years     ✔"},

 s14:{
  rule:"SINCE marks a point of time with a perfect tense, FOR marks a length, and FROM marks a starting point in the past or future.",
  formula:"SINCE + point + perfect tense (has been ill since Monday)\nFOR + length (for ten years)\nFROM + start, usually with TO or TILL (from 2010 to 2014)",
  memory:"Since answers WHEN. For answers HOW LONG. From answers FROM WHEN TO WHEN.",
  ta:"Since = எப்போது தொடங்கியது. For = எவ்வளவு காலம். From = எங்கிருந்து எங்கே.",
  tl:"Since = eppodhu thodangiyadhu. For = evvalavu kaalam. From = engirundhu enge.",
  mistake:"Writing 'since ten years', and using 'since' without a perfect tense.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — 'since ten years' is among the most repeated errors of all."},

 s15:[
 {ta:"இந்த rule-ஐ நீங்க ஏற்கனவே Tenses module-ல Rule 53-ஆ பார்த்திருக்கீங்க. இப்போ அதை முன்னுருபு (preposition) பக்கத்துலருந்து பார்க்கலாம். ஒரே விதி, ரெண்டு கோணம்.",
  tl:"Indha rule-ai neenga erkanave Tenses module-la Rule 53-aa paarththirukkeenga. Ippo adhai munnurubu pakkaththularundhu paarkkalaam. Ore vidhi, rendu konam."},
 {ta:"மூணு முன்னுருபு, மூணு கேள்வி. SINCE — 'எப்போ ஆரம்பிச்சது?' 'Since Monday', 'since 2015', 'since morning'. இதெல்லாம் நேரக் கோட்டுல ஒரு புள்ளி.",
  tl:"Moonu munnurubu, moonu kelvi. SINCE — 'eppo aarambichadhu?' 'Since Monday', 'since 2015', 'since morning'. Idhellaam nerak koottula oru pulli."},
 {ta:"FOR — 'எவ்ளோ காலம் நீடிச்சது?' 'For ten years', 'for two hours', 'for a week'. இதெல்லாம் நீளம், புள்ளி இல்ல. FROM — 'எங்கிருந்து எங்க வரைக்கும்?' 'From 2010 to 2014', 'from nine till five'. இதுக்கு எப்பவும் ஒரு முடிவு ஜோடி இருக்கும்.",
  tl:"FOR — 'evlo kaalam needichadhu?' 'For ten years', 'for two hours'. Idhellaam neelam. FROM — 'engirundhu enga varaikkum?' 'From 2010 to 2014', 'from nine till five'."},
 {ta:"இப்போ இந்தியால மிக அதிகமா நடக்கிற தப்பு — 'I have been living here since ten years.' இதை நாம எல்லாருமே சொல்லியிருக்கோம். ஆனா தப்பு! பத்து வருஷம் ஒரு நீளம், புள்ளி இல்ல. அதனால 'FOR ten years'.",
  tl:"Ippo India-la miga adhigamaa nadakkira thappu — 'I have been living here since ten years.' Idhai naama ellaarume solliyirukkom. Aanaa thappu! Paththu varusham oru neelam, pulli illa. Adhanaala 'FOR ten years'."},
 {ta:"இன்னொரு முக்கியமான விஷயம் — SINCE எழுதினா, கண்டிப்பா have, has, அல்லது had இருக்கணும். 'I know him since 2010' — தப்பு! ஏன்? 'Know' simple present, perfect இல்ல. சரியான வடிவம் 'I HAVE KNOWN him since 2010.' Since எழுதும்போதெல்லாம் perfect auxiliary இருக்கானு பாருங்க.",
  tl:"Innoru mukkiyamaana vishayam — SINCE ezhudhinaa, kandippaa have, has, alladhu had irukkanum. 'I know him since 2010' — thappu! Sariyaana vadivam 'I HAVE KNOWN him since 2010.'"},
 {ta:"கடைசியா FROM பத்தி. FROM-க்கு perfect tense தேவையில்ல. 'He worked there FROM 2010 TO 2014' — simple past, முடிஞ்ச காலம். 'The rule applies FROM next month' — எதிர்காலம். SINCE மட்டும்தான் இப்போதோட இணைஞ்சு perfect tense கேட்குது. இந்த மூணு வித்தியாசம் தெரிஞ்சா, இந்த rule-ல நீங்க master.",
  tl:"Kadaisiyaa FROM paththi. FROM-kku perfect tense thevaiyilla. 'He worked there FROM 2010 TO 2014' — simple past. 'The rule applies FROM next month' — edhirkaalam. SINCE mattum-dhaan ippodhoda inainju perfect tense ketkudhu."}]},

/* ========== RULE 74 ========== */
{n:74,rc:"PRE-04",d:"Medium",t:"BY for a Deadline, UNTIL for a Continuing State",
 tam:"By = அந்த நேரத்திற்குள் · Until/Till = அந்த நேரம் வரை தொடர்ந்து",
 s1:{en:"BY means NOT LATER THAN a given time — a deadline. UNTIL or TILL means UP TO and CONTINUING to that time. 'By' points to one moment; 'until' covers the whole stretch before it.",
  ta:"BY என்றால் கொடுக்கப்பட்ட நேரத்திற்குப் பிந்தாமல் — ஒரு காலக்கெடு. UNTIL அல்லது TILL என்றால் அந்த நேரம் வரை தொடர்ந்து. 'By' ஒரு தருணத்தைச் சுட்டுகிறது; 'until' அதற்கு முந்தைய முழு நீட்டத்தையும் உள்ளடக்குகிறது.",
  tl:"BY endraal kodukkappatta neraththirkup pindhaamal — oru kaalakkedu. UNTIL alladhu TILL endraal andha neram varai thodarndhu. 'By' oru tharunaththaich suttugiradhu; 'until' adharku mundhaiya muzhu neettaththaiyum ulladakkugiradhu.",
  formula:"BY  →  a DEADLINE, one completed action\n  Submit the form BY Friday.\n  He will be back BY six.\n\nUNTIL / TILL  →  a CONTINUING state\n  Wait UNTIL Friday.\n  The office stays open TILL nine.\n  He did not come UNTIL midnight."},

 s2:[
 {h:"One moment versus a whole stretch",
  en:"'Finish it BY Friday' — the finishing happens once, at some point up to Friday. 'Wait UNTIL Friday' — the waiting continues through every moment up to Friday. Completed action → by. Continuous state → until.",
  ta:"ஒரு தருணம் மற்றும் ஒரு முழு நீட்டம். 'Finish it BY Friday' — முடிப்பது ஒரு முறை நிகழ்கிறது, வெள்ளிக்கிழமை வரை ஏதோ ஒரு புள்ளியில். 'Wait UNTIL Friday' — காத்திருப்பது வெள்ளிக்கிழமை வரை ஒவ்வொரு தருணத்திலும் தொடர்கிறது. முடிக்கப்பட்ட செயல் → by. தொடர்ச்சியான நிலை → until.",
  tl:"Oru tharunam matrum oru muzhu neettam. 'Finish it BY Friday' — mudippadhu oru murai nigazhgiradhu. 'Wait UNTIL Friday' — kaaththiruppadhu velli varai ovvoru tharunaththilum thodargiradhu."},
 {h:"UNTIL loves negatives",
  en:"'He did not come until midnight' and 'Do not leave until I return' — 'until' works naturally with a negative because it describes a state that continued unbroken. 'By' rarely appears with a negative.",
  ta:"UNTIL எதிர்மறைகளை விரும்புகிறது. 'He did not come until midnight' மற்றும் 'Do not leave until I return' — 'until' ஒரு எதிர்மறையுடன் இயற்கையாக வேலை செய்கிறது, ஏனெனில் அது தடையின்றித் தொடர்ந்த ஒரு நிலையை விவரிக்கிறது. 'By' எதிர்மறையுடன் அரிதாகவே வருகிறது.",
  tl:"UNTIL edhirmaraigalai virumbugiradhu. 'He did not come until midnight' matrum 'Do not leave until I return' — 'until' oru edhirmaraiyudan iyarkaiyaaga velai seygiradhu."},
 {h:"BY THE TIME introduces a clause",
  en:"'By the time you arrive, I will have left' — 'by the time' joins two clauses and takes a PRESENT tense even for future meaning. This is the same rule you learnt in Tense Rule 55.",
  ta:"BY THE TIME ஒரு clause-ஐ அறிமுகப்படுத்துகிறது. 'By the time you arrive, I will have left' — 'by the time' இரண்டு clause-களை இணைக்கிறது, எதிர்காலப் பொருளுக்கும் நிகழ்கால tense எடுக்கிறது. இது நீங்கள் Tense Rule 55-ல் கற்றுக்கொண்ட அதே விதி.",
  tl:"BY THE TIME oru clause-ai arimugappaduththugiradhu. 'By the time you arrive, I will have left' — 'by the time' irandu clause-galai inaikkiradhu, edhirkaalap porulukkum nigazhgaala tense edukkiradhu."},
 {h:"UNTIL for time, TO for place",
  en:"'Wait until five o'clock' but 'Walk to the corner'. 'Until' is only for time, never for distance. 'He walked until the corner' is wrong; it must be 'to the corner'.",
  ta:"நேரத்திற்கு UNTIL, இடத்திற்கு TO. 'Wait until five o'clock' ஆனால் 'Walk to the corner'. 'Until' நேரத்திற்கு மட்டுமே, ஒருபோதும் தூரத்திற்கு அல்ல. 'He walked until the corner' தவறு; அது 'to the corner' என்றுதான் இருக்க வேண்டும்.",
  tl:"Neraththirku UNTIL, idaththirku TO. 'Wait until five o'clock' aanaal 'Walk to the corner'. 'Until' neraththirku mattume, orupodhum dhooraththirku alla."}],

 s3:[
 {h:"Deadline versus duration",
  d:"   BY Friday\n   ────────────────●\n              one action, any time up to here\n              Submit the form BY Friday.\n\n   UNTIL Friday\n   ████████████████●\n   continuous state all the way to here\n              Wait UNTIL Friday."},
 {h:"Completed action or continuing state?",
  d:"   ✅ COMPLETED ONCE  →  BY\n      finish · submit · return · reach\n      arrive · complete · pay\n\n   🔄 CONTINUING       →  UNTIL / TILL\n      wait · stay · remain · continue\n      sleep · keep · live\n\n   ⚠ 'UNTIL' LOVES NEGATIVES:\n     He did not come until midnight.\n     Do not leave until I return."},
 {h:"Two special uses",
  d:"   BY THE TIME + present tense\n     By the time you ARRIVE, I will have left.\n     (a clause, not just a noun — Tense Rule 55)\n\n   UNTIL is for TIME only\n     Wait until five o'clock.   ✔\n     Walk until the corner.     ✘\n     Walk TO the corner.        ✔"}],

 s4:{
 wrong:["\"'Submit it until Friday' gives you time.\" — A deadline requires 'by'.",
  "\"'Wait by Friday' means wait up to Friday.\" — Waiting continues, so use 'until'.",
  "\"'By the time you will arrive' shows the future.\" — 'By the time' takes the present tense.",
  "\"'He walked until the gate' is fine.\" — 'Until' is only for time, not distance."],
 right:["Ask: is the action completed once, or does it continue?",
  "Completed once → by. Continuing → until or till.",
  "'Until' pairs naturally with negatives.",
  "Use 'until' only for time; use 'to' for distance."]},

 s7:[

 s9:[
 "Fill in the Blank|All the completed application forms must reach this office ____ the thirtieth of June.|until;by|1|A deadline requires 'by'.",
 "Find the Error|Please wait in the (A) waiting room by (B) the doctor finishes (C) his rounds (D).|A;B;C;D|1|Part B. A continuing state requires 'until'.",
 "Sentence Improvement|The library will remain open by nine o'clock every night during the examination.|by nine;till nine;until nine o'clock by|1|A continuing state requires 'till'.",

 "Find the Error|He did not return (A) home by midnight (B) although he had (C) promised to be early (D).|A;B;C;D|1|Part B. A negative continuing state requires 'until midnight'."],

 s10:{
  en:"The trap is that both prepositions refer to the same moment, so both look correct. 'Submit it BY Friday' and 'Wait UNTIL Friday' both point at Friday — the difference is whether the action happens ONCE or CONTINUES. Watch the verb, not the time. Submit, finish, pay, reach → by. Wait, stay, remain, sleep → until.",
  ta:"பொறி என்னவென்றால் இரண்டு முன்னுருபுகளும் அதே தருணத்தைக் குறிக்கின்றன, எனவே இரண்டுமே சரியாகத் தெரிகின்றன. 'Submit it BY Friday' மற்றும் 'Wait UNTIL Friday' இரண்டுமே வெள்ளிக்கிழமையைச் சுட்டுகின்றன — வித்தியாசம் செயல் ஒரு முறை நிகழ்கிறதா அல்லது தொடர்கிறதா என்பதுதான். நேரத்தை அல்ல, வினைச்சொல்லைக் கவனியுங்கள்.",
  tl:"Pori ennavendraal irandu munnurubugalum adhe tharunaththaik kurikkindrana, enave irandume sariyaagath therigindrana. Viththiyaasam seyal oru murai nigazhgiradhaa alladhu thodargiradhaa enbadhudhaan. Neraththai alla, vinaicholaik kavaniyungal."},

 s11:{
  en:"LOOK AT THE VERB. Done once → BY. Continues → UNTIL.",
  ta:"வினைச்சொல்லைப் பாருங்கள். ஒரு முறை முடிந்தால் → BY. தொடர்ந்தால் → UNTIL.",
  tl:"Vinaicholaip paarungal. Oru murai mudindhaal → BY. Thodarndhaal → UNTIL.",
  vis:"      LOOK AT THE VERB, NOT THE TIME\n\n   ✅ ONE COMPLETED ACTION  →  BY\n      submit · finish · pay · reach\n      return · complete · arrive\n      \"Submit the form BY Friday.\"\n\n   🔄 A CONTINUING STATE    →  UNTIL / TILL\n      wait · stay · remain · sleep\n      keep · continue · live\n      \"Wait UNTIL Friday.\"\n\n   ⚠ NEGATIVES PREFER 'UNTIL':\n     He did not come UNTIL midnight.\n     Do not leave UNTIL I return.\n\n   ⚠ 'UNTIL' IS FOR TIME ONLY:\n     Walk TO the corner.  ✔\n     Walk UNTIL the corner. ✘"},

 s14:{
  rule:"BY marks a deadline for a completed action; UNTIL or TILL marks a state continuing up to that time.",
  formula:"BY → deadline, one completed action (submit by Friday)\nUNTIL / TILL → continuing state (wait until Friday)\nBY THE TIME + present tense clause\nUNTIL is for time only; use TO for distance",
  memory:"Look at the verb. Done once means BY. Continues means UNTIL.",
  ta:"Verb-ஐ பாருங்க. ஒரு தடவ முடிஞ்சா BY. தொடர்ந்தா UNTIL.",
  tl:"Verb-ai paarunga. Oru thadava mudinjaa BY. Thodarndhaa UNTIL.",
  mistake:"Writing 'submit it until Friday' and 'wait by the doctor comes'.",
  exam:"SSC CGL / CHSL and Bank — a steady Fill in the Blank and Sentence Improvement item."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு முன்னுருபும் ஒரே நேரத்தை சுட்டுது, அதனாலதான் குழப்பம். 'BY Friday' மற்றும் 'UNTIL Friday' — ரெண்டுமே வெள்ளிக்கிழமையை காட்டுது. வித்தியாசம் எங்க இருக்கு?",
  tl:"Indha rule-la rendu munnurubum ore neraththai suttudhu, adhanaaladhaan kuzhappam. 'BY Friday' matrum 'UNTIL Friday' — rendume vellikkizhamaiyai kaattudhu. Viththiyaasam enga irukku?"},
 {ta:"வித்தியாசம் வினைச்சொல்லுல இருக்கு! 'Submit the form BY Friday' — சமர்ப்பிக்கிறது ஒரு தடவ நடக்குது. எப்பவும் சமர்ப்பிச்சிட்டே இருக்க முடியாது இல்லையா? ஒரு முறை, முடிஞ்சது. அதனால BY — காலக்கெடு.",
  tl:"Viththiyaasam vinaicholulla irukku! 'Submit the form BY Friday' — samarppikkiradhu oru thadava nadakkudhu. Eppavum samarppichitte irukka mudiyaadhu illaiyaa? Oru murai, mudinjadhu. Adhanaala BY."},
 {ta:"ஆனா 'Wait UNTIL Friday' — காத்திருக்கிறது தொடர்ச்சியான செயல். இன்னைக்கு காத்திருக்கணும், நாளைக்கும் காத்திருக்கணும், வெள்ளிக்கிழமை வரைக்கும் ஒவ்வொரு நிமிஷமும் காத்திருக்கணும். தொடர்ச்சி. அதனால UNTIL.",
  tl:"Aanaa 'Wait UNTIL Friday' — kaaththirukkiradhu thodarchiyaana seyal. Innaikku kaaththirukkanum, naalaikkum kaaththirukkanum, velli varaikkum ovvoru nimishamum. Thodarchi. Adhanaala UNTIL."},
 {ta:"அதனால ஒரு எளிய சோதனை — வினைச்சொல்லைப் பாருங்க. Submit, finish, pay, reach, return, complete — இதெல்லாம் ஒரு தடவ முடியுற செயல். BY. Wait, stay, remain, sleep, keep, continue, live — இதெல்லாம் தொடர்ச்சியான நிலை. UNTIL.",
  tl:"Adhanaala oru eliya sodhanai — vinaicholaip paarunga. Submit, finish, pay, reach, return — idhellaam oru thadava mudiyura seyal. BY. Wait, stay, remain, sleep, keep — idhellaam thodarchiyaana nilai. UNTIL."},
 {ta:"இன்னொரு உதவிகரமான குறிப்பு — UNTIL எதிர்மறையை விரும்பும். 'He did not come UNTIL midnight.' 'Do not leave UNTIL I return.' எதிர்மறை இருந்தா UNTIL-தான் பொருந்தும், ஏன்னா அது தடையில்லாத ஒரு நிலையை விவரிக்குது.",
  tl:"Innoru udhavigaramaana kurippu — UNTIL edhirmaraiyai virumbum. 'He did not come UNTIL midnight.' 'Do not leave UNTIL I return.' Edhirmarai irundhaa UNTIL-dhaan porundhum."},
 {ta:"கடைசியா ரெண்டு விஷயம். ஒண்ணு — 'BY THE TIME' ஒரு clause-ஐ கொண்டு வரும், அதுக்கு நிகழ்காலம் வரும். 'By the time you ARRIVE, I will have left.' 'Will arrive' இல்ல! இது Tense Rule 55-ல படிச்ச அதே விதி. ரெண்டு — UNTIL நேரத்துக்கு மட்டும்தான், தூரத்துக்கு இல்ல. 'Walk TO the corner' — 'until the corner' இல்ல. இந்த ரெண்டையும் SSC கேட்குது.",
  tl:"Kadaisiyaa rendu vishayam. Onnu — 'BY THE TIME' oru clause-ai kondu varum, adhukku nigazhgaalam varum. 'By the time you ARRIVE, I will have left.' Rendu — UNTIL neraththukku mattum-dhaan, dhooraththukku illa. 'Walk TO the corner'."}]},

/* ========== RULE 75 ========== */
{n:75,rc:"PRE-05",d:"Easy",t:"BETWEEN for Two, AMONG for More than Two",
 tam:"இரண்டுக்கு BETWEEN · இரண்டுக்கு மேற்பட்டவற்றுக்கு AMONG",
 s1:{en:"Use BETWEEN for TWO persons or things, and AMONG for MORE THAN TWO. 'Between' comes from an old word meaning 'by two', which is why the rule exists.",
  ta:"இரண்டு நபர்கள் அல்லது பொருட்களுக்கு BETWEEN, இரண்டுக்கு மேற்பட்டவற்றுக்கு AMONG பயன்படுத்தவும். 'Between' என்பது 'இரண்டால்' என்று பொருள்படும் ஒரு பழைய சொல்லிலிருந்து வருகிறது, அதனால்தான் இந்த விதி இருக்கிறது.",
  tl:"Irandu nabargal alladhu porutkalukku BETWEEN, irandukku merpattavatrukku AMONG payanpaduththavum. 'Between' enbadhu 'irandaal' endru porulpadum oru pazhaiya sollilirundhu varugiradhu.",
  formula:"BETWEEN  →  TWO\n  Divide the mango BETWEEN the two boys.\n  Choose BETWEEN tea and coffee.\n  There is a wall BETWEEN the two houses.\n\nAMONG    →  MORE THAN TWO\n  Distribute the sweets AMONG all the children.\n  He is the best AMONG the ten candidates."},

 s2:[
 {h:"The word 'between' contains 'two'",
  en:"'Between' comes from Old English 'be-twain', meaning 'by two'. The word itself carries the number. 'Twain' is the same root as 'twin' and 'two'. This is not an arbitrary rule — the history explains it.",
  ta:"'Between' என்ற சொல்லுக்குள் 'two' இருக்கிறது. 'Between' பழைய ஆங்கிலச் சொல் 'be-twain'-லிருந்து வருகிறது, அதன் பொருள் 'இரண்டால்'. அந்தச் சொல்லே எண்ணைச் சுமக்கிறது. 'Twain' என்பது 'twin' மற்றும் 'two'-வின் அதே வேர். இது ஒரு தன்னிச்சையான விதி அல்ல — வரலாறு அதை விளக்குகிறது.",
  tl:"'Between' endra sollukkul 'two' irukkiradhu. 'Between' pazhaiya Aangilach sol 'be-twain'-lirundhu varugiradhu, adhan porul 'irandaal'. 'Twain' enbadhu 'twin' matrum 'two'-vin adhe ver."},
 {h:"The number is hidden earlier in the sentence",
  en:"You will rarely be told 'there are two people'. The sentence says 'the two boys', 'both the sisters', 'tea and coffee' — all meaning two. Or it says 'all the children', 'the ten candidates' — meaning many. Read backwards to find the number.",
  ta:"எண்ணிக்கை வாக்கியத்தில் முன்னதாகவே மறைந்திருக்கும். 'இரண்டு பேர் இருக்கிறார்கள்' என்று அரிதாகவே சொல்லப்படும். வாக்கியம் 'the two boys', 'both the sisters', 'tea and coffee' என்று சொல்கிறது — அனைத்தும் இரண்டைக் குறிக்கின்றன. அல்லது 'all the children', 'the ten candidates' — பலவற்றைக் குறிக்கின்றன. எண்ணிக்கையைக் கண்டறிய பின்னோக்கிப் படியுங்கள்.",
  tl:"Ennikkai vaakkiyaththil munnadhaagave maraindhirukkum. Vaakkiyam 'the two boys', 'both the sisters', 'tea and coffee' endru solgiradhu. Ennikkaiyaik kandariya pinnokkip padiyungal."},
 {h:"BETWEEN can take more than two in one special case",
  en:"When distinct INDIVIDUAL relationships are meant, 'between' works for more than two: 'a treaty between the five nations', 'the difference between the four options'. Each pair is being considered separately.",
  ta:"ஒரு சிறப்பு வழக்கில் BETWEEN இரண்டுக்கு மேற்பட்டவற்றை எடுக்கலாம். தனித்தனி தனிப்பட்ட உறவுகள் கருதப்படும்போது, 'between' இரண்டுக்கு மேற்பட்டவற்றுக்கு வேலை செய்யும்: 'a treaty between the five nations', 'the difference between the four options'. ஒவ்வொரு ஜோடியும் தனித்தனியாகக் கருதப்படுகிறது.",
  tl:"Oru sirappu vazhakkil BETWEEN irandukku merpattavatrai edukkalaam. Thanithani thanippatta uravugal karudhappadumbodhu, 'between' irandukku merpattavatrukku velai seyyum."},
 {h:"After BETWEEN, use the objective case",
  en:"'Between you and ME', never 'between you and I'. 'Between' is a preposition, so the pronoun after it must be in the objective case. This links directly to Pronoun Rule 23.",
  ta:"BETWEEN-க்குப் பின் objective case பயன்படுத்தவும். 'Between you and ME', ஒருபோதும் 'between you and I' அல்ல. 'Between' ஒரு முன்னுருபு, எனவே அதற்குப் பின் வரும் பிரதிபெயர் objective case-ல் இருக்க வேண்டும். இது Pronoun Rule 23-உடன் நேரடியாகத் தொடர்புடையது.",
  tl:"BETWEEN-kkup pin objective case payanpaduththavum. 'Between you and ME', orupodhum 'between you and I' alla. Idhu Pronoun Rule 23-udan neradiyaaga thodarpudaiyadhu."}],

 s3:[
 {h:"The word carries the number",
  d:"   BE-TWEEN\n      ↑\n    'TWAIN' = TWO\n    (same root as TWIN and TWO)\n\n   👤 ↔ 👤        →  BETWEEN\n\n   👤 👤 👤 👤    →  AMONG\n\n   The history explains the rule."},
 {h:"Where the number hides",
  d:"  SIGNALS FOR TWO         SIGNALS FOR MANY\n  ───────────────         ────────────────\n   the two ...             all the ...\n   both ...                the ten ...\n   tea and coffee          the children\n   the twins               the members\n   husband and wife        the villagers\n   A and B                 the crowd\n\n  Read BACKWARDS before choosing."},
 {h:"Two special notes",
  d:"   ⚠ DISTINCT PAIRS CAN TAKE 'BETWEEN':\n     a treaty BETWEEN the five nations\n     the difference BETWEEN the four options\n     (each pair considered separately)\n\n   ⚠ OBJECTIVE CASE AFTER 'BETWEEN':\n     between you and ME   ✔\n     between you and I    ✘  (Pronoun Rule 23)"}],

 s4:{
 wrong:["\"'Among' sounds more formal, so it is safer.\" — With exactly two it is wrong.",
  "\"'Between the four options' is always wrong.\" — It is right when distinct pairs are meant.",
  "\"'Between you and I' sounds educated.\" — After a preposition, use the objective case.",
  "\"'Divide it among the two boys' is fine.\" — Two people require 'between'."],
 right:["Read backwards and count the people or things.",
  "Two → between. More than two → among.",
  "Look for 'the two', 'both', two names joined by 'and'.",
  "After 'between', always use me, him, her, us, them."]},

 s5:[
 {en:"Divide the mango between the two boys.",ta:"அந்த மாம்பழத்தை இரு பையன்களுக்கு இடையே பங்கிடுங்கள்.",tl:"Andha maambazhaththai iru paiyangalukku idaiye pangidungal.",note:"'The two boys' → BETWEEN."},
 {en:"Distribute the sweets among all the children.",ta:"இனிப்புகளை அனைத்துக் குழந்தைகளுக்கும் விநியோகியுங்கள்.",tl:"Inippugalai anaiththuk kuzhandhaigalukkum viniyogiyungal.",note:"'All the children' → AMONG."},
 {en:"There is a wall between the two houses.",ta:"அந்த இரு வீடுகளுக்கு இடையே ஒரு சுவர் இருக்கிறது.",tl:"Andha iru veedugalukku idaiye oru suvar irukkiradhu.",note:"Two houses → BETWEEN."},
 {en:"He is the best among the ten candidates.",ta:"பத்து வேட்பாளர்களில் அவர்தான் சிறந்தவர்.",tl:"Paththu vetpaalargalil avardhaan sirandhavar.",note:"Ten candidates → AMONG."},
 {en:"This matter is strictly between you and me.",ta:"இந்த விஷயம் உங்களுக்கும் எனக்கும் இடையே மட்டுமே.",tl:"Indha vishayam ungalukkum enakkum idaiye mattume.",note:"'Between' is a preposition → objective case ME."}],

 s6:["between|இடையே (இருவருக்கு)|Idaiye (iruvarukku)",

 s8:[
 "Divide the mango among the two boys.|Divide the mango between the two boys.|Two people require 'between'.",

 "There is a wall among the two houses.|There is a wall between the two houses.|Two things require 'between'.",
 "He is the best between the ten candidates.|He is the best among the ten candidates.|Many people require 'among'.",
 "Choose among tea and coffee.|Choose between tea and coffee.|Two options require 'between'.",
 "The property was shared between four brothers.|The property was shared among four brothers.|Four people require 'among'.",

 "The prize was divided between us three.|The prize was divided among us three.|Three people require 'among'.",
 "She was the tallest between the girls.|She was the tallest among the girls.|Many girls require 'among'."],

 s10:{
  en:"The exam never says 'there are two people'. It hides the number in 'the two brothers', 'both the sisters', 'India and Sri Lanka' or 'all the children'. Students read the second half of the sentence and pick whichever preposition sounds nicer. The number is always in the FIRST half. The second trap is 'between you and I', which mixes this rule with Pronoun Rule 23.",
  ta:"தேர்வு ஒருபோதும் 'இரண்டு பேர் இருக்கிறார்கள்' என்று சொல்வதில்லை. அது எண்ணிக்கையை 'the two brothers', 'both the sisters', 'India and Sri Lanka' அல்லது 'all the children'-ல் மறைக்கிறது. மாணவர்கள் வாக்கியத்தின் இரண்டாவது பாதியைப் படித்து, எந்த முன்னுருபு நன்றாகக் கேட்கிறதோ அதைத் தேர்ந்தெடுக்கிறார்கள். எண்ணிக்கை எப்போதும் முதல் பாதியில் இருக்கும். இரண்டாவது பொறி 'between you and I', அது இந்த விதியை Pronoun Rule 23-உடன் கலக்கிறது.",
  tl:"Thervu orupodhum 'irandu per irukkiraargal' endru solvadhillai. Adhu ennikkaiyai 'the two brothers', 'both the sisters' alladhu 'all the children'-l maraikkiradhu. Ennikkai eppodhum mudhal paadhiyil irukkum."},

 s11:{
  en:"COUNT FIRST. Two → BETWEEN (be-TWAIN). More than two → AMONG.",
  ta:"முதலில் எண்ணுங்கள். இரண்டு → BETWEEN (be-TWAIN). இரண்டுக்கு மேல் → AMONG.",
  tl:"Mudhalil ennungal. Irandu → BETWEEN (be-TWAIN). Irandukku mel → AMONG.",
  vis:"      THE WORD CARRIES THE NUMBER\n\n   BE-TWEEN\n      ↑\n   from 'be-TWAIN' = BY TWO\n   same root as TWIN and TWO\n\n   👤 ↔ 👤          →  BETWEEN\n   👤 👤 👤 👤      →  AMONG\n\n   READ BACKWARDS TO FIND THE NUMBER:\n     the two · both · A and B · the twins\n     husband and wife         →  BETWEEN\n\n     all the · the ten · the crowd\n     the members · the villagers →  AMONG\n\n   ⚠ AFTER 'BETWEEN' USE THE OBJECTIVE CASE:\n     between you and ME   ✔\n     between you and I    ✘"},

 s13:[
 "The property was divided ____ the four sons, but the house went ____ the two elder ones.|among-to;between-among;among-between|0|Four sons → AMONG. 'Went to' takes the preposition TO.",
 "This matter is strictly ____ you and ____, so do not discuss it ____ your friends.|between-me-among;among-I-between;between-I-among|0|Two people → BETWEEN + ME (Pronoun Rule 23). Many friends → AMONG.",
 "A treaty was signed ____ India and Sri Lanka ____ 1987 ____ a Monday.|between-in-on;among-on-in;between-on-in|0|Two countries → BETWEEN. A year → IN. A day → ON (Rule 71).",
 "He is the tallest ____ the ten boys, though ____ him and his brother there ____ little difference.|among-between-is;between-among-is;among-between-are|0|Ten boys → AMONG. Two people → BETWEEN. 'Difference' is singular → IS.",
 "The sweets were distributed ____ all the children, and each of them ____ delighted.|among-was;between-were;among-were|0|Many children → AMONG. 'Each of' is fixed singular → WAS (SVA Rule 50)."],

 s14:{
  rule:"Use BETWEEN for two persons or things and AMONG for more than two.",
  formula:"BETWEEN → two (the two boys, tea and coffee, India and Sri Lanka)\nAMONG → more than two (all the children, the ten candidates)\nBETWEEN can take many when distinct pairs are meant\nAfter BETWEEN use the objective case: between you and me",
  memory:"Be-TWAIN means BY TWO — the word carries the number.",
  ta:"Be-TWAIN அப்படின்னா 'இரண்டால்' — வார்த்தையே எண்ணை சுமக்குது.",
  tl:"Be-TWAIN appadinnaa 'irandaal' — vaarththaiye ennai sumakkudhu.",
  mistake:"Choosing by sound instead of counting, and writing 'between you and I'.",
  exam:"SSC CGL / CHSL / MTS and RRB — a short, high-certainty question if you count first."},

 s15:[
 {ta:"இந்த rule ரொம்ப எளிமையானது, ஆனா ஒரு நிபந்தனை இருக்கு — நீங்க எண்ணணும். இரண்டுன்னா BETWEEN. இரண்டுக்கு மேலன்னா AMONG. அவ்ளோதான்.",
  tl:"Indha rule romba elimaiyaanadhu, aanaa oru nibandhanai irukku — neenga ennanum. Irandunnaa BETWEEN. Irandukku melannaa AMONG. Avlodhaan."},
 {ta:"ஏன் இப்படி? ஒரு அழகான வரலாறு இருக்கு. 'Between' அப்படிங்கிற வார்த்தை பழைய ஆங்கிலத்துல 'be-twain' — அர்த்தம் 'இரண்டால்'. 'Twain' அப்படிங்கிறது 'twin' மற்றும் 'two'-ஓட அதே வேர். அதாவது அந்த வார்த்தையிலேயே 'two' ஒளிஞ்சிருக்கு! இது தன்னிச்சையான விதி இல்ல.",
  tl:"Yen ippadi? Oru azhagaana varalaaru irukku. 'Between' appadingira vaarththai pazhaiya Aangilaththula 'be-twain' — arththam 'irandaal'. 'Twain' appadingiradhu 'twin' matrum 'two'-oda adhe ver."},
 {ta:"ஆனா இங்க ஒரு பிரச்சனை இருக்கு. SSC உங்களுக்கு 'இங்க ரெண்டு பேரு இருக்காங்க' அப்படின்னு நேரடியா சொல்ல மாட்டாங்க. அவங்க அதை மறைச்சு வெப்பாங்க. 'The two boys' — ரெண்டு. 'Both the sisters' — ரெண்டு. 'India and Sri Lanka' — ரெண்டு. 'Tea and coffee' — ரெண்டு. 'Husband and wife' — ரெண்டு.",
  tl:"Aanaa inga oru prachanai irukku. SSC ungalukku neradiyaa solla maattaanga. Avanga adhai maraichu veppaanga. 'The two boys' — rendu. 'Both the sisters' — rendu. 'India and Sri Lanka' — rendu."},
 {ta:"மறுபக்கம் — 'All the children' — பலர். 'The ten candidates' — பலர். 'The crowd' — பலர். 'The villagers' — பலர். 'Four brothers' — பலர். இதெல்லாம் AMONG. அதனால blank-ஐ பார்க்கிறதுக்கு முன்னாடி ஆரம்பத்தை படிங்க.",
  tl:"Marupakkam — 'All the children' — palar. 'The ten candidates' — palar. 'The crowd' — palar. 'Four brothers' — palar. Idhellaam AMONG."},
 {ta:"இப்போ ஒரு நுட்பமான விதிவிலக்கு. சில நேரம் BETWEEN இரண்டுக்கு மேலயும் வரும்! எப்போ? தனித்தனி உறவுகள் கருதப்படும்போது. 'A treaty BETWEEN the five nations' — இங்க ஒவ்வொரு நாட்டுக்கும் ஒவ்வொரு நாட்டுக்கும் தனித்தனி உறவு இருக்கு. 'The difference BETWEEN the four options' — ஒவ்வொண்ணையும் ஒவ்வொண்ணோட ஒப்பிடுறோம். இது அரிதா வரும், ஆனா தெரிஞ்சு வெச்சுக்கோங்க.",
  tl:"Ippo oru nutpamaana vidhivilakku. Sila neram BETWEEN irandukku melayum varum! Eppo? Thanithani uravugal karudhappadumbodhu. 'A treaty BETWEEN the five nations'. 'The difference BETWEEN the four options'."},
 {ta:"கடைசியா ஒரு முக்கியமான இணைப்பு. 'Between' ஒரு முன்னுருபு. அதனால அதுக்கு அப்பறம் objective case வரும் — me, him, her, us, them. 'Between you and ME' — 'between you and I' இல்ல! இது நீங்க Pronouns module-ல Rule 23-ல படிச்ச அதே விதி. SSC இந்த ரெண்டு rule-ஐயும் ஒரே கேள்வியில சேர்த்து கேட்கும். எண்ணிக்கையும் சரியா இருக்கணும், case-ம் சரியா இருக்கணும்.",
  tl:"Kadaisiyaa oru mukkiyamaana inaippu. 'Between' oru munnurubu. Adhanaala adhukku apparam objective case varum — me, him, her, us, them. 'Between you and ME' — 'between you and I' illa! Idhu neenga Pronouns module-la Rule 23-la padicha adhe vidhi."}]},
/* ========== RULE 76 ========== */
{n:76,rc:"PRE-06",d:"Medium",t:"BESIDE means NEXT TO, BESIDES means IN ADDITION TO",
 tam:"Beside = அருகில் · Besides = கூடுதலாக, தவிர",
 s1:{en:"BESIDE is a preposition of PLACE meaning 'by the side of'. BESIDES means 'IN ADDITION TO' or 'APART FROM'. One letter changes the meaning completely from location to addition.",
  ta:"BESIDE என்பது 'பக்கத்தில்' என்று பொருள்படும் ஒரு இட முன்னுருபு. BESIDES என்றால் 'கூடுதலாக' அல்லது 'தவிர'. ஒரே ஒரு எழுத்து பொருளை இடத்திலிருந்து கூட்டலுக்கு முற்றிலும் மாற்றுகிறது.",
  tl:"BESIDE enbadhu 'pakkaththil' endru porulpadum oru ida munnurubu. BESIDES endraal 'koodudhalaaga' alladhu 'thavira'. Ore oru ezhuththu porulai idaththilirundhu koottalukku mutrilum maatrugiradhu.",
  formula:"BESIDE   →  by the side of (PLACE)\n  She sat BESIDE her mother.\n  The temple stands BESIDE the river.\n\nBESIDES  →  in addition to / apart from\n  BESIDES English, he knows French.\n  Nobody was present BESIDES me.\n  He is clever; BESIDES, he is honest."},

 s2:[
 {h:"The extra S means an extra thing",
  en:"BESIDE has no S and means one thing sitting next to another. BESIDES has an S and means one extra thing added on. Remember: extra S, extra thing. This single trick solves the rule.",
  ta:"கூடுதல் S என்றால் கூடுதல் விஷயம். BESIDE-க்கு S இல்லை, அது ஒரு பொருள் இன்னொன்றின் அருகில் அமர்வதைக் குறிக்கிறது. BESIDES-க்கு S இருக்கிறது, அது சேர்க்கப்பட்ட ஒரு கூடுதல் விஷயத்தைக் குறிக்கிறது. நினைவில் வையுங்கள்: கூடுதல் S, கூடுதல் விஷயம். இந்த ஒரு தந்திரம் விதியைத் தீர்க்கிறது.",
  tl:"Koodudhal S endraal koodudhal vishayam. BESIDE-kku S illai, adhu oru porul innondrin arugil amarvadhaik kurikkiradhu. BESIDES-kku S irukkiradhu, adhu serkkappatta oru koodudhal vishayaththaik kurikkiradhu."},
 {h:"BESIDES can also mean 'except'",
  en:"'Nobody besides me knew the answer' means nobody EXCEPT me. In this sense it behaves like 'except' and takes the objective case: 'besides me', never 'besides I'.",
  ta:"BESIDES 'except' என்றும் பொருள்படலாம். 'Nobody besides me knew the answer' என்றால் என்னைத் தவிர யாருக்கும் தெரியாது. இந்தப் பொருளில் அது 'except' போலச் செயல்பட்டு objective case எடுக்கிறது: 'besides me', ஒருபோதும் 'besides I' அல்ல.",
  tl:"BESIDES 'except' endrum porulpadalaam. 'Nobody besides me knew the answer' endraal ennaith thavira yaarukkum theriyaadhu. Indhap porulil adhu 'except' polach seyalpattu objective case edukkiradhu."},
 {h:"BESIDES can also join sentences",
  en:"'He is clever. Besides, he is honest.' Here 'besides' works as a connector meaning 'moreover' or 'in addition'. Notice the comma after it. 'Beside' can never do this job.",
  ta:"BESIDES வாக்கியங்களையும் இணைக்கலாம். 'He is clever. Besides, he is honest.' இங்கே 'besides' 'மேலும்' அல்லது 'கூடுதலாக' என்று பொருள்படும் ஒரு இணைப்பாகச் செயல்படுகிறது. அதற்குப் பின் வரும் காற்புள்ளியைக் கவனியுங்கள். 'Beside' இந்த வேலையை ஒருபோதும் செய்ய முடியாது.",
  tl:"BESIDES vaakkiyangalaiyum inaikkalaam. 'He is clever. Besides, he is honest.' Inge 'besides' oru inaippaagach seyalpadugiradhu. Adharkup pin varum caarpulliyaik kavaniyungal."},
 {h:"BESIDE ONESELF is a fixed idiom",
  en:"'He was beside himself with joy' means he was overwhelmed, almost out of his mind. This is an idiom and always uses BESIDE without the S, even though it has nothing to do with place.",
  ta:"BESIDE ONESELF ஒரு நிலையான மரபுத்தொடர். 'He was beside himself with joy' என்றால் அவர் மகிழ்ச்சியால் மூழ்கிப் போனார், கிட்டத்தட்ட தன்னிலை மறந்தார். இது ஒரு மரபுத்தொடர், இடத்துடன் எந்தத் தொடர்பும் இல்லாவிட்டாலும் எப்போதும் S இல்லாத BESIDE பயன்படுத்துகிறது.",
  tl:"BESIDE ONESELF oru nilaiyaana marabuththodar. 'He was beside himself with joy' endraal avar magizhchiyaal moozhgip ponaar. Idhu oru marabuththodar, eppodhum S illaadha BESIDE payanpaduththugiradhu."}],

 s3:[
 {h:"Extra S, extra thing",
  d:"   BESIDE   (no S)  →  📍 PLACE\n     She sat BESIDE her mother.\n     👤👤  side by side\n\n   BESIDES  (with S) →  ➕ ADDITION\n     BESIDES English, he knows French.\n     English + French\n\n   MEMORY: extra S = extra thing."},
 {h:"The three jobs of BESIDES",
  d:"   ➕ IN ADDITION TO\n      Besides English, he knows French.\n\n   ❌ EXCEPT / APART FROM\n      Nobody besides me knew the answer.\n\n   🔗 CONNECTOR (moreover)\n      He is clever. Besides, he is honest.\n\n   BESIDE has only ONE job: place."},
 {h:"The fixed idiom",
  d:"   BESIDE ONESELF  =  overwhelmed with emotion\n\n     He was BESIDE HIMSELF with joy.\n     She was BESIDE HERSELF with grief.\n\n   ⚠ Always BESIDE (no S) in this idiom,\n     even though no place is involved."}],

 s4:{
 wrong:["\"'Besides' is the safer spelling because it looks complete.\" — With place it must be 'beside'.",
  "\"'She sat besides her mother' is fine.\" — Sitting next to someone requires 'beside'.",
  "\"'Beside English, he knows French' is correct.\" — Addition requires 'besides'.",
  "\"'He was besides himself with joy' has the right spelling.\" — The idiom always uses 'beside'."],
 right:["Ask: is this about POSITION or ADDITION?",
  "Position → beside. Addition → besides.",
  "Remember: extra S means extra thing.",
  "The idiom 'beside oneself' never takes the S."]},

 s5:[
 {en:"She sat beside her mother during the ceremony.",ta:"விழாவின்போது அவர் தன் தாயின் அருகில் அமர்ந்திருந்தார்.",tl:"Vizhaavinbodhu avar than thaayin arugil amarndhirundhaar.",note:"'By the side of' → BESIDE."},
 {en:"Besides English, he can speak French and German.",ta:"ஆங்கிலம் தவிர, அவரால் பிரெஞ்சு மற்றும் ஜெர்மன் மொழிகளையும் பேச முடியும்.",tl:"Aangilam thavira, avaraal French matrum German mozhigalaiyum pesa mudiyum.",note:"'In addition to' → BESIDES."},
 {en:"Nobody was present besides me and my brother.",ta:"நானும் என் சகோதரனும் தவிர வேறு யாரும் இருக்கவில்லை.",tl:"Naanum en sagodharanum thavira veru yaarum irukkavillai.",note:"'Except' → BESIDES with the objective case."},
 {en:"The old temple stands beside the river.",ta:"அந்தப் பழைய கோயில் நதிக்கரையின் அருகில் நிற்கிறது.",tl:"Andhap pazhaiya koyil nadhikkaraiyin arugil nirkiradhu.",note:"A place relationship → BESIDE."},
 {en:"He was beside himself with joy on hearing the news.",ta:"அந்தச் செய்தியைக் கேட்டு அவர் மகிழ்ச்சியில் தன்னிலை மறந்தார்.",tl:"Andhach seydhiyaik kettu avar magizhchiyil thannilai marandhaar.",note:"A fixed idiom → BESIDE without the S."}],

 s10:{
  en:"One letter separates two completely different words, and Tamil-medium learners write 'besides' for 'next to' constantly because the longer form looks more correct. The exam plants both directions — 'sat besides her mother' and 'beside English, he knows French'. The third trap is the idiom 'beside oneself', which has nothing to do with place but still drops the S.",
  ta:"ஒரே ஒரு எழுத்து இரண்டு முற்றிலும் வேறுபட்ட சொற்களைப் பிரிக்கிறது, தமிழ் வழி மாணவர்கள் 'அருகில்' என்பதற்கு 'besides' என்று தொடர்ந்து எழுதுகிறார்கள், ஏனெனில் நீளமான வடிவம் அதிக சரியாகத் தெரிகிறது. தேர்வு இரண்டு திசைகளையும் நடுகிறது — 'sat besides her mother' மற்றும் 'beside English, he knows French'. மூன்றாவது பொறி 'beside oneself' மரபுத்தொடர், அது இடத்துடன் எந்தத் தொடர்பும் இல்லை ஆனால் இன்னும் S-ஐ விடுகிறது.",
  tl:"Ore oru ezhuththu irandu mutrilum verupatta sorkalaip pirikkiradhu, Tamil vazhi maanavargal 'arugil' enbadharku 'besides' endru thodarndhu ezhudhugiraargal. Thervu irandu thisaigalaiyum nadugiradhu."},

 s11:{
  en:"EXTRA S MEANS EXTRA THING. No S means by the side.",
  ta:"கூடுதல் S என்றால் கூடுதல் விஷயம். S இல்லை என்றால் பக்கத்தில்.",
  tl:"Koodudhal S endraal koodudhal vishayam. S illai endraal pakkaththil.",
  vis:"      ONE LETTER, TWO WORDS\n\n   BESIDE   →  📍  by the side of\n     no S       She sat BESIDE her mother.\n                The temple stands BESIDE the river.\n\n   BESIDES  →  ➕  in addition to / except\n     with S     BESIDES English, he knows French.\n                Nobody BESIDES me knew it.\n                He is clever; BESIDES, he is honest.\n\n   MEMORY LINE:\n   \"EXTRA S = EXTRA THING.\"\n\n   ⚠ THE IDIOM ALWAYS DROPS THE S:\n     He was BESIDE HIMSELF with joy.  ✔"},
