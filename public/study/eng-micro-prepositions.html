 s13:[
 "I look forward to ____ from you, and I hope to ____ you ____ next Monday.|hearing-meet-—;hear-meeting-on;hearing-meeting-on|0|'Look forward to' → gerund. 'Hope to' is an infinitive → MEET. 'Next Monday' takes no preposition (Rule 71).",
 "He is accustomed to ____ late, but he is not used to ____ up early.|working-waking;work-wake;working-wake|0|Both 'accustomed to' and 'used to' here take gerunds.",
 "She objected to ____ questioned, and each of the officers ____ her objection.|being-noted;be-noted;being-note|0|'Object to' → gerund in the passive. 'Each of' is singular → NOTED.",
 "He came with a view to ____ the manager, but the manager ____ already left ____ office.|meeting-had-the;meet-has-a;meeting-has-the|0|'With a view to' → gerund. The earlier action → HAD left. Specific office → THE.",
 "In addition to ____ three languages, he is good ____ mathematics and fond ____ music.|knowing-at-of;know-in-for;knowing-in-of|0|'In addition to' → gerund. 'Good at' and 'fond of' (Rule 80)."],

 s14:{
  rule:"When 'to' is a preposition, it is followed by a gerund, not a base form.",
  formula:"PREPOSITION 'TO' + V-ING\nlook forward to · accustomed to · object to\naddicted to · averse to · devoted to · opposed to\nwith a view to · in addition to · used to (accustomed)",
  memory:"Can a noun follow the 'to'? Then it is a preposition, so use -ING.",
  ta:"'To'-க்கு அப்பறம் ஒரு பெயர்ச்சொல் வர முடியுமா? முடிஞ்சா அது preposition, -ING போடுங்க.",
  tl:"'To'-kku apparam oru peyarchol vara mudiyumaa? Mudinjaa adhu preposition, -ING podunga.",
  mistake:"Writing 'look forward to hear from you' and 'accustomed to work late'.",
  exam:"SSC CGL / CHSL and Bank — 'look forward to hear' is one of the most repeated errors of all."},

 s15:[
 {ta:"இந்த rule-ல ஒரு அழகான ஆனா குழப்பமான விஷயம் இருக்கு. ஆங்கிலத்துல ரெண்டு விதமான 'to' இருக்கு! ரெண்டும் ஒரே மாதிரி எழுதப்படுது — t, o — ஆனா ரெண்டும் வேற வேற வேலை செய்யுது.",
  tl:"Indha rule-la oru azhagaana aanaa kuzhappamaana vishayam irukku. Aangilaththula rendu vidhamaana 'to' irukku! Rendum ore maadhiri ezhudhappadudhu — t, o — aanaa rendum veru veru velai seyyudhu."},
 {ta:"முதல் 'to' — infinitive-ஓட பகுதி. 'I want TO GO.' 'He decided TO LEAVE.' இங்க 'to' வினைச்சொல்லோட சேர்ந்து ஒரு அலகா வேலை செய்யுது. அதுக்கு அப்பறம் அடிப்படை வடிவம் வரும்.",
  tl:"Mudhal 'to' — infinitive-oda paguthi. 'I want TO GO.' 'He decided TO LEAVE.' Inga 'to' vinaicholoda serndhu oru alagaa velai seyyudhu."},
 {ta:"ரெண்டாவது 'to' — முன்னுருபு (preposition). 'I look forward TO GOING.' 'He is accustomed TO WORKING.' இங்க 'to' ஒரு முன்னுருபு. முன்னுருபுக்கு அப்பறம் எப்பவும் -ing வடிவம் வரும்.",
  tl:"Randaavadhu 'to' — munnurubu (preposition). 'I look forward TO GOING.' 'He is accustomed TO WORKING.' Munnurubukku apparam eppavum -ing vadivam varum."},
 {ta:"எப்படி கண்டுபிடிக்கிறது? ஒரு அருமையான சோதனை இருக்கு — 'பெயர்ச்சொல் சோதனை'. 'To'-க்கு அப்பறம் ஒரு பெயர்ச்சொல் போட்டுப் பாருங்க. 'I look forward to your LETTER' — பொருந்துதா? பொருந்துது! அப்படின்னா 'to' முன்னுருபு. -ing போடுங்க.",
  tl:"Eppadi kandupidikkiradhu? Oru arumaiyaana sodhanai irukku — 'peyarchol sodhanai'. 'To'-kku apparam oru peyarchol pottup paarunga. 'I look forward to your LETTER' — porundhudhaa? Porundhudhu!"},
 {ta:"இப்போ 'I want to LETTER' — பொருந்துதா? இல்ல! அபத்தமா இருக்கு. அப்படின்னா அந்த 'to' infinitive. அடிப்படை வடிவம் போடுங்க — 'I want to GO'. இந்த ஒரு சோதனை எப்பவும் வேலை செய்யும்.",
  tl:"Ippo 'I want to LETTER' — porundhudhaa? Illa! Abaththamaa irukku. Appadinnaa andha 'to' infinitive. Adippadai vadivam podunga — 'I want to GO'."},
 {ta:"கடைசியா மிக முக்கியமான ஒரு விஷயம். 'I look forward TO HEAR from you' — இது தப்பு! ஆனா இந்த வாக்கியம் இந்தியால எழுதப்படுற கிட்டத்தட்ட ஒவ்வொரு முறையான கடிதத்தோட கடைசியிலயும் வரும். சரியான வடிவம் 'I look forward TO HEARING from you'. மேலும் — Module 6-ல Rule 69-ல 'be used to smoking' படிச்சோம் இல்லையா? அது இதே விதிதான். ஒரே கொள்கை, பல தொடர்.",
  tl:"Kadaisiyaa miga mukkiyamaana oru vishayam. 'I look forward TO HEAR from you' — idhu thappu! Sariyaana vadivam 'I look forward TO HEARING from you'. Melum — Module 6-la Rule 69-la 'be used to smoking' padichom illaiyaa? Adhu idhe vidhidhaan."}]},

/* ========== RULE 83 ========== */
{n:83,rc:"PRE-13",d:"Medium",t:"ABOVE and OVER, BELOW and UNDER",
 tam:"Over/Under = நேரடியாக மேலே/கீழே · Above/Below = அளவில் உயர்வு/தாழ்வு",
 s1:{en:"OVER and UNDER suggest DIRECT vertical position, covering or movement. ABOVE and BELOW suggest a HIGHER or LOWER LEVEL, usually with numbers and measurements, without contact.",
  ta:"OVER மற்றும் UNDER நேரடி செங்குத்து நிலை, மூடுதல் அல்லது இயக்கத்தைக் குறிக்கின்றன. ABOVE மற்றும் BELOW ஒரு உயர்ந்த அல்லது தாழ்ந்த மட்டத்தைக் குறிக்கின்றன, பொதுவாக எண்கள் மற்றும் அளவீடுகளுடன், தொடர்பு இல்லாமல்.",
  tl:"OVER matrum UNDER neradi senguththu nilai, moodudhal alladhu iyakkaththaik kurikkindrana. ABOVE matrum BELOW oru uyarndha alladhu thaazhndha mattaththaik kurikkindrana.",
  formula:"OVER / UNDER  →  direct vertical, covering, movement\n  The plane flew OVER the city.\n  He put a blanket OVER the child.\n  The cat slept UNDER the table.\n\nABOVE / BELOW  →  level, numbers, measurements\n  The temperature is BELOW zero.\n  Her marks are ABOVE average.\n  The village is 200 metres ABOVE sea level."},

 s2:[
 {h:"Numbers and measurements take ABOVE and BELOW",
  en:"'Above sea level', 'below zero', 'above average', 'below the poverty line', 'above fifty marks'. Whenever a scale or a measurement is involved, use above or below, never over or under.",
  ta:"எண்கள் மற்றும் அளவீடுகள் ABOVE மற்றும் BELOW எடுக்கின்றன. 'Above sea level', 'below zero', 'above average', 'below the poverty line', 'above fifty marks'. ஒரு அளவுகோல் அல்லது ஒரு அளவீடு சம்பந்தப்படும்போதெல்லாம், above அல்லது below பயன்படுத்தவும், ஒருபோதும் over அல்லது under அல்ல.",
  tl:"Engal matrum alaveedugal ABOVE matrum BELOW edukkindrana. 'Above sea level', 'below zero', 'above average', 'below the poverty line'."},
 {h:"Covering and movement take OVER",
  en:"'He put a blanket over the child' — the blanket covers and touches. 'The plane flew over the city' — movement across. 'Over' involves contact, covering or crossing; 'above' does not.",
  ta:"மூடுதலும் இயக்கமும் OVER எடுக்கின்றன. 'He put a blanket over the child' — போர்வை மூடுகிறது, தொடுகிறது. 'The plane flew over the city' — குறுக்கே இயக்கம். 'Over' தொடர்பு, மூடுதல் அல்லது கடத்தலை உள்ளடக்குகிறது; 'above' இல்லை.",
  tl:"Moodudhalum iyakkamum OVER edukkindrana. 'He put a blanket over the child' — porvai moodugiradhu, thodugiradhu. 'Over' thodarbu, moodudhal alladhu kadaththalai ulladakkugiradhu."},
 {h:"OVER also means 'more than' with numbers",
  en:"'Over a hundred people attended' means more than a hundred. Here 'over' works with numbers as a quantity word. But for a SCALE like temperature or sea level, use above. 'Over fifty people' ✔ but 'above sea level' ✔.",
  ta:"எண்களுடன் OVER 'அதற்கு மேல்' என்றும் பொருள்படுகிறது. 'Over a hundred people attended' என்றால் நூறுக்கு மேல். இங்கே 'over' ஒரு அளவுச் சொல்லாக எண்களுடன் வேலை செய்கிறது. ஆனால் வெப்பநிலை அல்லது கடல் மட்டம் போன்ற ஒரு அளவுகோலுக்கு above பயன்படுத்தவும்.",
  tl:"Engaludan OVER 'adharku mel' endrum porulpadugiradhu. 'Over a hundred people attended' endraal noorukku mel. Aanaal veppanilai alladhu kadal mattam pondra oru alavugolukku above payanpaduththavum."},
 {h:"UNDER also means 'less than' and 'subject to'",
  en:"'Children under twelve' means less than twelve years old. 'Under the supervision of', 'under arrest', 'under repair', 'under discussion' — here 'under' means 'subject to' or 'in the process of'.",
  ta:"UNDER 'அதற்குக் குறைவாக' மற்றும் 'கீழ்ப்பட்ட' என்றும் பொருள்படுகிறது. 'Children under twelve' என்றால் பன்னிரண்டு வயதுக்குக் குறைவானவர்கள். 'Under the supervision of', 'under arrest', 'under repair', 'under discussion' — இங்கே 'under' 'கீழ்ப்பட்ட' அல்லது 'நடைபெற்று வரும்' என்று பொருள்படுகிறது.",
  tl:"UNDER 'adharkuk kuraivaaga' matrum 'keezhppatta' endrum porulpadugiradhu. 'Children under twelve' endraal pannirandu vayadhukkuk kuraivaanavargal. 'Under the supervision of', 'under arrest', 'under repair'."}],

 s3:[
 {h:"Contact or level?",
  d:"   OVER  →  ☂️ covering, touching, crossing\n     a blanket OVER the child\n     a bridge OVER the river\n     the plane flew OVER the city\n\n   ABOVE →  📏 a higher level, no contact\n     200 metres ABOVE sea level\n     marks ABOVE average\n     ABOVE the poverty line"},
 {h:"Numbers on a scale take ABOVE and BELOW",
  d:"   🌡️ temperature BELOW zero\n   📏 200 metres ABOVE sea level\n   📊 marks ABOVE average\n   💰 BELOW the poverty line\n   📈 BELOW the danger mark\n\n   A SCALE always takes above or below."},
 {h:"The other meanings of UNDER",
  d:"   ⬇️ LESS THAN\n      children UNDER twelve\n      UNDER fifty rupees\n\n   👮 SUBJECT TO\n      UNDER arrest · UNDER treatment\n      UNDER the supervision of\n      UNDER repair · UNDER discussion\n      UNDER consideration · UNDER control"}],

 s4:{
 wrong:["\"'The temperature is under zero' makes sense.\" — A scale requires 'below zero'.",
  "\"'Her marks are over average' shows they are higher.\" — A scale requires 'above average'.",
  "\"'The cat slept below the table' is fine.\" — Physical position requires 'under'.",
  "\"'Above' and 'over' mean exactly the same.\" — 'Over' involves contact or crossing."],
 right:["Ask: is this a measurement or a physical position?",
  "Measurement or scale → above or below.",
  "Covering, touching or crossing → over or under.",
  "Learn the fixed phrases: under arrest, under repair, above sea level."]},

 s5:[
 {en:"The plane flew over the city at dawn.",ta:"விடியற்காலையில் விமானம் நகரத்தின் மேலே பறந்தது.",tl:"Vidiyarkaalaiyil vimaanam nagaraththin mele parandhadhu.",note:"Movement across → OVER."},
 {en:"She put a warm blanket over the child.",ta:"அவர் குழந்தையின் மீது ஒரு சூடான போர்வையைப் போர்த்தினார்.",tl:"Avar kuzhandhaiyin meedhu oru soodaana porvaiyaip porththinaar.",note:"Covering with contact → OVER."},
 {en:"The temperature fell below zero last night.",ta:"நேற்றிரவு வெப்பநிலை பூஜ்ஜியத்திற்குக் கீழே சென்றது.",tl:"Netriravu veppanilai poojiyaththirkuk keezhe sendradhu.",note:"A scale reading → BELOW."},
 {en:"Her marks are well above the class average.",ta:"அவருடைய மதிப்பெண்கள் வகுப்பு சராசரியைவிட மிக அதிகம்.",tl:"Avarudaiya madhippengal vaguppu saraasariyaivida miga adhigam.",note:"A measurement → ABOVE."},
 {en:"The cat was sleeping under the table.",ta:"பூனை மேசைக்கு அடியில் தூங்கிக் கொண்டிருந்தது.",tl:"Poonai mesaikku adiyil thoongik kondirundhadhu.",note:"Physical position directly beneath → UNDER."}],

 s9:[

 s10:{
  en:"The exam tests measurements, because that is where Indian learners go wrong. 'Under zero' and 'over average' feel natural but a SCALE always takes below and above. The reverse trap is physical position — 'below the table' instead of 'under the table'. And the fixed phrases with 'under' — arrest, repair, treatment, consideration — must simply be memorised.",
  ta:"தேர்வு அளவீடுகளைச் சோதிக்கிறது, ஏனெனில் இந்திய மாணவர்கள் தவறு செய்வது அங்கேதான். 'Under zero' மற்றும் 'over average' இயற்கையாகத் தோன்றுகின்றன ஆனால் ஒரு அளவுகோல் எப்போதும் below மற்றும் above எடுக்கிறது. தலைகீழ் பொறி உடல் நிலை — 'under the table'-க்குப் பதிலாக 'below the table'. மேலும் 'under'-உடன் வரும் நிலையான தொடர்கள் — arrest, repair, treatment, consideration — வெறுமனே மனப்பாடம் செய்யப்பட வேண்டும்.",
  tl:"Thervu alaveedugalaich sodhikkiradhu, yenenil Indhiya maanavargal thavaru seyvadhu angedhaan. 'Under zero' matrum 'over average' iyarkaiyaagath thondrugindrana aanaal oru alavugol eppodhum below matrum above edukkiradhu."},

 s11:{
  en:"NUMBERS AND SCALES TAKE ABOVE AND BELOW. Touching and covering take OVER and UNDER.",
  ta:"எண்கள் மற்றும் அளவுகோல்கள் ABOVE மற்றும் BELOW எடுக்கின்றன. தொடுதலும் மூடுதலும் OVER மற்றும் UNDER எடுக்கின்றன.",
  tl:"Engal matrum alavugolgal ABOVE matrum BELOW edukkindrana. Thodudhalum moodudhalum OVER matrum UNDER edukkindrana.",
  vis:"      SCALE OR CONTACT?\n\n   📏 A SCALE OR MEASUREMENT  →  ABOVE / BELOW\n      200 metres ABOVE sea level\n      temperature BELOW zero\n      marks ABOVE average\n      income BELOW the poverty line\n\n   ☂️ CONTACT, COVERING, CROSSING → OVER / UNDER\n      a blanket OVER the child\n      a bridge OVER the river\n      the cat UNDER the table\n\n   ⚠ 'UNDER' ALSO MEANS:\n      less than  : children UNDER twelve\n      subject to : UNDER arrest · UNDER repair\n                   UNDER treatment · UNDER consideration"},

 s14:{
  rule:"OVER and UNDER show direct vertical position or covering; ABOVE and BELOW show level on a scale.",
  formula:"OVER / UNDER → covering, crossing, physical position\nABOVE / BELOW → measurements, scales, levels\nUNDER also means less than, and subject to (under arrest, under repair)",
  memory:"Numbers and scales take ABOVE and BELOW. Touching takes OVER and UNDER.",
  ta:"எண்ணும் அளவுகோலும் ABOVE, BELOW. தொடுதல் OVER, UNDER.",
  tl:"Ennum alavugolum ABOVE, BELOW. Thodudhal OVER, UNDER.",
  mistake:"Writing 'under zero', 'over average' and 'below the table'.",
  exam:"SSC CGL / CHSL and Bank — measurements are where the error is usually planted."},

 s15:[
 {ta:"இந்த rule-ல நாலு வார்த்தை — over, above, under, below. ரெண்டு மேலே, ரெண்டு கீழே. ஆனா ஒவ்வொரு ஜோடிக்கும் ஒரு வித்தியாசம் இருக்கு.",
  tl:"Indha rule-la naalu vaarththai — over, above, under, below. Rendu mele, rendu keezhe. Aanaa ovvoru jodikkum oru viththiyaasam irukku."},
 {ta:"OVER மற்றும் UNDER — இதுல தொடர்பு இருக்கு. மூடுதல், தொடுதல், குறுக்கே செல்லுதல். 'She put a blanket OVER the child' — போர்வை குழந்தையை மூடுது, தொடுது. 'The plane flew OVER the city' — நகரத்தை குறுக்கே கடந்தது. 'The cat slept UNDER the table' — மேசைக்கு நேரடியா கீழே.",
  tl:"OVER matrum UNDER — idhula thodarbu irukku. Moodudhal, thodudhal, kurukke selludhal. 'She put a blanket OVER the child'. 'The plane flew OVER the city'. 'The cat slept UNDER the table'."},
 {ta:"ABOVE மற்றும் BELOW — இதுல தொடர்பு இல்ல. இது ஒரு மட்டம், ஒரு அளவுகோல். '200 metres ABOVE sea level' — கடல் மட்டத்தை விட உயரம். 'Temperature BELOW zero' — பூஜ்ஜியத்தை விட குறைவு. 'Marks ABOVE average' — சராசரியை விட அதிகம்.",
  tl:"ABOVE matrum BELOW — idhula thodarbu illa. Idhu oru mattam, oru alavugol. '200 metres ABOVE sea level'. 'Temperature BELOW zero'. 'Marks ABOVE average'."},
 {ta:"அதனால ஒரு எளிய சோதனை — 'இது அளவீடா, இல்ல உடல் நிலையா?' அளவீடு, எண், அளவுகோல் — ABOVE அல்லது BELOW. உடல் நிலை, மூடுதல், தொடுதல் — OVER அல்லது UNDER.",
  tl:"Adhanaala oru eliya sodhanai — 'idhu alaveedaa, illa udal nilaiyaa?' Alaveedu, en, alavugol — ABOVE alladhu BELOW. Udal nilai, moodudhal, thodudhal — OVER alladhu UNDER."},
 {ta:"இப்போ ஒரு கூடுதல் விஷயம் — UNDER-க்கு இன்னும் ரெண்டு அர்த்தம் இருக்கு. ஒண்ணு — 'குறைவாக'. 'Children UNDER twelve' — பன்னிரண்டு வயதுக்கு கீழ். ரெண்டு — 'கீழ்ப்பட்ட'. 'UNDER arrest', 'UNDER repair', 'UNDER treatment', 'UNDER consideration', 'UNDER discussion', 'UNDER the supervision of'. இதெல்லாம் நிலையான தொடர், மனப்பாடம் பண்ணுங்க.",
  tl:"Ippo oru koodudhal vishayam — UNDER-kku innum rendu arththam irukku. Onnu — 'kuraivaaga'. 'Children UNDER twelve'. Rendu — 'keezhppatta'. 'UNDER arrest', 'UNDER repair', 'UNDER treatment', 'UNDER consideration'."},
 {ta:"கடைசியா ஒரு நுட்பமான விஷயம் — OVER-ம் எண்ணோட வரும்! 'OVER a hundred people attended' — நூறுக்கு மேல். இங்க 'over' அளவுச் சொல்லா வேலை செய்யுது. ஆனா 'ABOVE sea level' அப்படிங்கிறது ஒரு அளவுகோல். வித்தியாசம் — வெறும் எண்ணுக்கு OVER, அளவுகோலுக்கு ABOVE. SSC அளவீட்டை வெச்சுதான் அதிகமா கேட்குது — 'under zero', 'over average' அப்படின்னு தந்து ஏமாத்தும்.",
  tl:"Kadaisiyaa oru nutpamaana vishayam — OVER-um ennoda varum! 'OVER a hundred people attended' — noorukku mel. Aanaa 'ABOVE sea level' appadingiradhu oru alavugol. Verum ennukku OVER, alavugolukku ABOVE."}]},

/* ========== RULE 84 ========== */
{n:84,rc:"PRE-14",d:"Hard",t:"DIFFERENT FROM, COMPARE TO and COMPARE WITH",
 tam:"Different from · Compare to = உவமை · Compare with = ஒப்பீட்டு ஆய்வு",
 s1:{en:"Use DIFFERENT FROM in formal English. COMPARE TO shows LIKENESS or makes a metaphor. COMPARE WITH examines similarities and differences side by side. Latin comparatives — senior, junior, superior, inferior, prior, prefer — all take TO, never THAN.",
  ta:"முறையான ஆங்கிலத்தில் DIFFERENT FROM பயன்படுத்தவும். COMPARE TO ஒற்றுமையைக் காட்டுகிறது அல்லது ஒரு உவமையை உருவாக்குகிறது. COMPARE WITH ஒற்றுமைகளையும் வேறுபாடுகளையும் அருகருகே ஆராய்கிறது. லத்தீன் ஒப்பீட்டுச் சொற்கள் — senior, junior, superior, inferior, prior, prefer — அனைத்தும் TO எடுக்கின்றன, ஒருபோதும் THAN அல்ல.",
  tl:"Muraiyaana Aangilaththil DIFFERENT FROM payanpaduththavum. COMPARE TO otrumaiyaik kaattugiradhu. COMPARE WITH otrumaigalaiyum verupaadugalaiyum arugaruge aaraaygiradhu. Latin oppeettuch sorkal anaiththum TO edukkindrana.",
  formula:"DIFFERENT FROM  (not 'than')\n  His answer is different FROM mine.\n\nCOMPARE TO  →  metaphor, likeness\n  The poet compared her TO a rose.\n\nCOMPARE WITH  →  analysis, side by side\n  Compare this year's figures WITH last year's.\n\nLATIN COMPARATIVES take TO:\n  senior TO · junior TO · superior TO\n  inferior TO · prior TO · preferable TO · prefer TO"},

 s2:[
 {h:"COMPARE TO makes a poem, COMPARE WITH makes a report",
  en:"'Shakespeare compared the world TO a stage' — a metaphor, saying one thing IS like another. 'The auditor compared this year's accounts WITH last year's' — an analysis, examining both side by side. Poetry takes 'to'; analysis takes 'with'.",
  ta:"COMPARE TO ஒரு கவிதையை உருவாக்குகிறது, COMPARE WITH ஒரு அறிக்கையை உருவாக்குகிறது. 'Shakespeare compared the world TO a stage' — ஒரு உவமை, ஒன்று மற்றொன்றைப் போன்றது என்று சொல்வது. 'The auditor compared this year's accounts WITH last year's' — ஒரு ஆய்வு, இரண்டையும் அருகருகே ஆராய்வது. கவிதை 'to' எடுக்கிறது; ஆய்வு 'with' எடுக்கிறது.",
  tl:"COMPARE TO oru kavidhaiyai uruvaakkugiradhu, COMPARE WITH oru arikkaiyai uruvaakkugiradhu. Kavidhai 'to' edukkiradhu; aaivu 'with' edukkiradhu."},
 {h:"The Latin comparative family all take TO",
  en:"Senior, junior, superior, inferior, prior, posterior, anterior, prefer, preferable — all come from Latin, where the comparative was expressed without 'than'. So they all take 'to': 'He is senior TO me', not 'senior than me'.",
  ta:"லத்தீன் ஒப்பீட்டுக் குடும்பம் அனைத்தும் TO எடுக்கின்றன. Senior, junior, superior, inferior, prior, posterior, anterior, prefer, preferable — அனைத்தும் லத்தீனிலிருந்து வருகின்றன, அங்கே ஒப்பீடு 'than' இல்லாமல் வெளிப்படுத்தப்பட்டது. எனவே அவை அனைத்தும் 'to' எடுக்கின்றன: 'He is senior TO me', 'senior than me' அல்ல.",
  tl:"Latin oppeettuk kudumbam anaiththum TO edukkindrana. Senior, junior, superior, inferior, prior, prefer, preferable — anaiththum Latin-lirundhu varugindrana. Enave avai anaiththum 'to' edukkindrana."},
 {h:"DIFFERENT THAN is American, not Indian-exam English",
  en:"American writers accept 'different than'. British English, which every Indian competitive exam follows, requires 'different FROM'. If both appear as options, choose 'from'.",
  ta:"DIFFERENT THAN அமெரிக்கம், இந்தியத் தேர்வு ஆங்கிலம் அல்ல. அமெரிக்க எழுத்தாளர்கள் 'different than' ஏற்றுக்கொள்கிறார்கள். ஒவ்வொரு இந்தியப் போட்டித் தேர்வும் பின்பற்றும் பிரிட்டிஷ் ஆங்கிலம், 'different FROM' கோருகிறது. இரண்டும் option-களாக வந்தால், 'from' தேர்ந்தெடுங்கள்.",
  tl:"DIFFERENT THAN Americam, Indhiyath thervu Aangilam alla. Ovvoru Indhiyap pottith thervum pinpatrum British Aangilam, 'different FROM' korugiradhu."},
 {h:"COMPARED TO can also mean 'in comparison with'",
  en:"'Compared to last year, this year has been better' — here 'compared to' introduces a whole comparison. This use is accepted. The 'to' versus 'with' distinction applies mainly to the verb 'compare X to/with Y'.",
  ta:"COMPARED TO 'ஒப்பிடும்போது' என்றும் பொருள்படலாம். 'Compared to last year, this year has been better' — இங்கே 'compared to' ஒரு முழு ஒப்பீட்டை அறிமுகப்படுத்துகிறது. இந்தப் பயன்பாடு ஏற்கப்படுகிறது. 'To' மற்றும் 'with' வேறுபாடு முக்கியமாக 'compare X to/with Y' வினைச்சொல்லுக்குப் பொருந்தும்.",
  tl:"COMPARED TO 'oppidumbodhu' endrum porulpadalaam. 'Compared to last year, this year has been better'. Indhap payanpaadu erkappadugiradhu."}],

 s3:[
 {h:"Metaphor or analysis?",
  d:"   COMPARE TO   →  🌹 metaphor, likeness\n     The poet compared her TO a rose.\n     Life has been compared TO a journey.\n     (saying one IS like the other)\n\n   COMPARE WITH →  📊 analysis, side by side\n     Compare this year's figures WITH last year's.\n     He compared the two reports WITH each other.\n     (examining both for similarities and differences)"},
 {h:"The Latin family",
  d:"   ALL OF THESE TAKE 'TO', NEVER 'THAN':\n\n   senior TO      junior TO\n   superior TO    inferior TO\n   prior TO       posterior TO\n   anterior TO    preferable TO\n   prefer TO\n\n   MEMORY: SIJS-PP\n   Senior · Inferior · Junior · Superior\n   Prior · Prefer"},
 {h:"Different FROM",
  d:"   His answer is different FROM mine.   ✔ British\n   His answer is different THAN mine.   ✘ American\n   His answer is different TO mine.     ~ British but risky\n\n   Indian competitive exams follow BRITISH.\n   Always choose FROM."}],

 s4:{
 wrong:["\"'Senior than me' is right because it compares.\" — Latin comparatives take 'to'.",
  "\"'Different than' is used everywhere online.\" — That is American usage.",
  "\"'Compare to' and 'compare with' mean the same.\" — One is metaphor, one is analysis.",
  "\"'Prefer than' compares two things.\" — 'Prefer' belongs to the Latin family and takes 'to'."],
 right:["Metaphor → compare to. Analysis → compare with.",
  "Latin comparatives — senior, junior, superior, inferior, prior, prefer — all take 'to'.",
  "Use 'different from' in Indian exams.",
  "Remember SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer."]},

 s5:[
 {en:"His handwriting is quite different from mine.",ta:"அவருடைய கையெழுத்து என்னுடையதிலிருந்து முற்றிலும் வேறுபட்டது.",tl:"Avarudaiya kaiyezhuththu ennudaiyadhilirundhu mutrilum verupattadhu.",note:"British usage → DIFFERENT FROM."},
 {en:"Shakespeare compared the world to a stage.",ta:"ஷேக்ஸ்பியர் உலகத்தை ஒரு நாடக மேடையுடன் ஒப்பிட்டார்.",tl:"Shakespeare ulagaththai oru naadaga medaiyudan oppittaar.",note:"A metaphor → COMPARE TO."},
 {en:"Compare this year's figures with last year's.",ta:"இந்த ஆண்டின் புள்ளிவிவரங்களை கடந்த ஆண்டுடன் ஒப்பிடுங்கள்.",tl:"Indha aandin pullivivarangalai kadandha aandudan oppidungal.",note:"An analysis → COMPARE WITH."},
 {en:"He is senior to me by two years in service.",ta:"பணியில் அவர் என்னைவிட இரண்டு ஆண்டுகள் மூத்தவர்.",tl:"Paniyil avar ennaivida irandu aandugal mooththavar.",note:"A Latin comparative → SENIOR TO."},
 {en:"Health is preferable to wealth in the long run.",ta:"நீண்ட காலத்தில் செல்வத்தைவிட ஆரோக்கியமே மேலானது.",tl:"Neenda kaalaththil selvaththaivida aarokkiyame melaanadhu.",note:"A Latin comparative → PREFERABLE TO."}],

 s10:{
  en:"SENIOR THAN, JUNIOR THAN and PREFER THAN are the three most repeated errors in this rule. They feel right because all three express comparison, and comparison normally takes 'than'. But these words come from Latin, where the comparative was built differently. The second trap is compare to versus compare with — a metaphor takes 'to', an analysis takes 'with'.",
  ta:"SENIOR THAN, JUNIOR THAN மற்றும் PREFER THAN இந்த விதியில் மிக அதிகமாக மீண்டும் மீண்டும் வரும் மூன்று தவறுகள். மூன்றுமே ஒப்பீட்டை வெளிப்படுத்துவதால் அவை சரியெனத் தோன்றுகின்றன, ஒப்பீடு பொதுவாக 'than' எடுக்கிறது. ஆனால் இந்தச் சொற்கள் லத்தீனிலிருந்து வருகின்றன, அங்கே ஒப்பீடு வேறுவிதமாகக் கட்டமைக்கப்பட்டது. இரண்டாவது பொறி compare to மற்றும் compare with — ஒரு உவமை 'to' எடுக்கிறது, ஒரு ஆய்வு 'with' எடுக்கிறது.",
  tl:"SENIOR THAN, JUNIOR THAN matrum PREFER THAN indha vidhiyil miga adhigamaaga meendum meendum varum moondru thavarugal. Aanaal indhach sorkal Latin-lirundhu varugindrana."},

 s11:{
  en:"SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer — all take TO.",
  ta:"SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer — அனைத்தும் TO எடுக்கும்.",
  tl:"SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer — anaiththum TO edukkum.",
  vis:"      THE LATIN FAMILY — ALL TAKE 'TO'\n\n   ┌────────────────────────────────┐\n   │  SENIOR to     JUNIOR to       │\n   │  SUPERIOR to   INFERIOR to     │\n   │  PRIOR to      PREFERABLE to   │\n   │  PREFER to                     │\n   └────────────────────────────────┘\n\n   MEMORY: S-I-J-S-P-P\n\n   ⚠ NEVER 'THAN' WITH THESE.\n\n   COMPARE TO   →  🌹 metaphor\n     compared her TO a rose\n\n   COMPARE WITH →  📊 analysis\n     compared the figures WITH last year's\n\n   DIFFERENT FROM (British, used in Indian exams)"},

 s14:{
  rule:"Use 'different from'; 'compare to' for metaphor and 'compare with' for analysis; Latin comparatives take 'to'.",
  formula:"DIFFERENT FROM (British, used in Indian exams)\nCOMPARE TO → metaphor | COMPARE WITH → analysis\nLATIN: senior, junior, superior, inferior, prior, preferable, prefer — all take TO",
  memory:"SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer — all take TO.",
  ta:"SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer — எல்லாத்துக்கும் TO.",
  tl:"SIJS-PP: Senior, Inferior, Junior, Superior, Prior, Prefer — ellaaththukkum TO.",
  mistake:"Writing 'senior than', 'prefer than', 'different than' and 'compared this year to last year'.",
  exam:"SSC CGL / CHSL and Bank — 'senior than' and 'prefer than' appear almost every year."},

 s15:[
 {ta:"இந்த rule-ல மூணு விஷயம் இருக்கு. முதல்ல மிக முக்கியமான ஒண்ணு — லத்தீன் ஒப்பீட்டுச் சொற்கள். Senior, Junior, Superior, Inferior, Prior, Preferable, Prefer.",
  tl:"Indha rule-la moonu vishayam irukku. Mudhalla miga mukkiyamaana onnu — Latin oppeettuch sorkal. Senior, Junior, Superior, Inferior, Prior, Preferable, Prefer."},
 {ta:"இதெல்லாம் ஒப்பீட்டைச் சொல்லுது. 'He is senior ___ me.' இப்போ என்ன போடுவீங்க? 'Than' அப்படின்னு தோணும் இல்லையா? ஏன்னா ஒப்பீட்டுக்கு 'than' வரும் — 'taller THAN', 'better THAN'. ஆனா தப்பு! சரியான பதில் 'TO'.",
  tl:"Idhellaam oppeettaich solludhu. 'He is senior ___ me.' Ippo enna poduveenga? 'Than' appadinnu thonum illaiyaa? Aanaa thappu! Sariyaana padhil 'TO'."},
 {ta:"ஏன்? ஏன்னா இந்த வார்த்தைகள் லத்தீன் மொழியில இருந்து வந்தது. லத்தீன்ல ஒப்பீட்டு அமைப்பு வேற மாதிரி இருந்தது, 'than' கிடையாது. ஆங்கிலம் அந்த வார்த்தையை எடுத்துக்கிட்டப்போ, அதோட லத்தீன் அமைப்பையும் சேர்த்து எடுத்துக்கிச்சு. அதனால 'senior TO', 'junior TO', 'superior TO', 'inferior TO', 'prior TO', 'prefer TO'.",
  tl:"Yen? Yennaa indha vaarththaigal Latin mozhiyila irundhu vandhadhu. Latin-la oppeettu amaippu veru maadhiri irundhadhu, 'than' kidaiyaadhu. Adhanaala 'senior TO', 'junior TO', 'superior TO'."},
 {ta:"இதை நினைவு வெச்சுக்க ஒரு சொல் — SIJS-PP. Senior, Inferior, Junior, Superior, Prior, Prefer. இந்த ஆறுக்கும் 'to'. இதுல 'Prefer' நீங்க Rule 79-ல ஏற்கனவே பார்த்தீங்க — 'I prefer coffee TO tea'. அது இதே குடும்பம்.",
  tl:"Idhai ninaivu vechukka oru sol — SIJS-PP. Senior, Inferior, Junior, Superior, Prior, Prefer. Indha aarukkum 'to'. Idhula 'Prefer' neenga Rule 79-la erkanave paarththeenga."},
 {ta:"ரெண்டாவது விஷயம் — COMPARE TO மற்றும் COMPARE WITH. இது ஒரு அழகான வித்தியாசம். 'The poet compared her TO a rose' — இது ஒரு உவமை. அவளை ரோஜாவுக்கு ஒப்பிடுறாரு, அதாவது அவள் ரோஜா மாதிரி அப்படின்னு சொல்றாரு. கவிதை. அதுக்கு 'to'.",
  tl:"Randaavadhu vishayam — COMPARE TO matrum COMPARE WITH. 'The poet compared her TO a rose' — idhu oru uvamai. Kavidhai. Adhukku 'to'."},
 {ta:"ஆனா 'The auditor compared this year's accounts WITH last year's' — இது ஒரு ஆய்வு. ரெண்டையும் பக்கத்துல வெச்சு ஒற்றுமை வேற்றுமை பார்க்கிறாரு. அறிக்கை. அதுக்கு 'with'. எளிமையா — கவிதைக்கு TO, ஆய்வுக்கு WITH. கடைசியா 'DIFFERENT FROM' — 'different than' அமெரிக்க ஆங்கிலம், இந்திய தேர்வுல 'from' தான் சரி.",
  tl:"Aanaa 'The auditor compared this year's accounts WITH last year's' — idhu oru aaivu. Arikkai. Adhukku 'with'. Elimaiyaa — kavidhaikku TO, aaivukku WITH. Kadaisiyaa 'DIFFERENT FROM'."}]},

/* ========== RULE 85 ========== */
{n:85,rc:"PRE-15",d:"Hard",t:"IN TIME versus ON TIME, IN THE END versus AT THE END",
 tam:"In time = முன்பே · On time = சரியான நேரத்தில் · In the end = இறுதியில் · At the end = முடிவுப் புள்ளியில்",
 s1:{en:"IN TIME means EARLY ENOUGH, with time to spare. ON TIME means EXACTLY at the scheduled moment. IN THE END means FINALLY, after a long process. AT THE END refers to the final POINT of something.",
  ta:"IN TIME என்றால் போதுமான அளவு முன்னதாக, நேரம் மிச்சத்துடன். ON TIME என்றால் திட்டமிடப்பட்ட தருணத்தில் சரியாக. IN THE END என்றால் இறுதியில், ஒரு நீண்ட செயல்முறைக்குப் பிறகு. AT THE END என்பது ஒன்றின் இறுதிப் புள்ளியைக் குறிக்கிறது.",
  tl:"IN TIME endraal podhumaana alavu munnadhaaga. ON TIME endraal thittamidappatta tharunaththil sariyaaga. IN THE END endraal irudhiyil. AT THE END enbadhu ondrin irudhip pulliyaik kurikkiradhu.",
  formula:"IN TIME     →  early enough, with time to spare\n  We reached the station IN TIME to catch the train.\n\nON TIME     →  exactly at the scheduled moment\n  The train arrived ON TIME at 6.00 sharp.\n\nIN THE END  →  finally, after a long process\n  IN THE END, he agreed to help us.\n\nAT THE END  →  the final point of something\n  There is a summary AT THE END of the chapter."},

 s2:[
 {h:"IN TIME has a purpose, ON TIME has a clock",
  en:"'We reached in time TO catch the train' — there is a purpose, and we had time to spare. 'The train arrived on time' — the clock said 6.00 and it came at 6.00. 'In time' is usually followed by 'to' or 'for'.",
  ta:"IN TIME-க்கு ஒரு நோக்கம் இருக்கிறது, ON TIME-க்கு ஒரு கடிகாரம் இருக்கிறது. 'We reached in time TO catch the train' — ஒரு நோக்கம் இருக்கிறது, நமக்கு நேரம் மிச்சம் இருந்தது. 'The train arrived on time' — கடிகாரம் 6.00 என்று சொன்னது, அது 6.00-க்கு வந்தது. 'In time'-ஐத் தொடர்ந்து பொதுவாக 'to' அல்லது 'for' வரும்.",
  tl:"IN TIME-kku oru nokkam irukkiradhu, ON TIME-kku oru kadigaaram irukkiradhu. 'We reached in time TO catch the train'. 'The train arrived on time'."},
 {h:"IN THE END is a story, AT THE END is a place",
  en:"'In the end, he agreed' tells you how a long story finished. 'At the end of the chapter' tells you WHERE something is located. One is about time and process; the other is about position.",
  ta:"IN THE END ஒரு கதை, AT THE END ஒரு இடம். 'In the end, he agreed' ஒரு நீண்ட கதை எப்படி முடிந்தது என்று சொல்கிறது. 'At the end of the chapter' ஏதோ ஒன்று எங்கே அமைந்திருக்கிறது என்று சொல்கிறது. ஒன்று நேரம் மற்றும் செயல்முறை பற்றியது; மற்றொன்று இடம் பற்றியது.",
  tl:"IN THE END oru kadhai, AT THE END oru idam. 'In the end, he agreed' oru neenda kadhai eppadi mudindhadhu endru solgiradhu. 'At the end of the chapter' edho ondru enge amaindhirukkiradhu endru solgiradhu."},
 {h:"AT LAST is a feeling of relief",
  en:"'At last, the results are out!' expresses relief after a long wait. 'In the end' is neutral. And 'atlast' as one word does not exist — it is always two words.",
  ta:"AT LAST ஒரு நிம்மதி உணர்வு. 'At last, the results are out!' நீண்ட காத்திருப்புக்குப் பிறகு நிம்மதியை வெளிப்படுத்துகிறது. 'In the end' நடுநிலையானது. மேலும் 'atlast' ஒரே சொல்லாக இல்லை — அது எப்போதும் இரண்டு சொற்கள்.",
  tl:"AT LAST oru nimmadhi unarvu. 'At last, the results are out!' neenda kaaththiruppukkup piragu nimmadhiyai velippaduththugiradhu. Melum 'atlast' ore sollaaga illai — adhu eppodhum irandu sorkal."},
 {h:"Related fixed pairs worth learning together",
  en:"IN THE WAY (blocking) versus ON THE WAY (travelling). IN THE FRONT (inside, at the front part) versus IN FRONT OF (before, outside). AT HAND (near) versus IN HAND (under control). Learn these as pairs.",
  ta:"சேர்த்துக் கற்க வேண்டிய தொடர்புடைய நிலையான ஜோடிகள். IN THE WAY (தடுப்பது) மற்றும் ON THE WAY (பயணிப்பது). IN THE FRONT (உள்ளே, முன் பகுதியில்) மற்றும் IN FRONT OF (முன்னால், வெளியே). AT HAND (அருகில்) மற்றும் IN HAND (கட்டுப்பாட்டில்). இவற்றை ஜோடிகளாகக் கற்றுக்கொள்ளுங்கள்.",
  tl:"Serthuk katka vendiya thodarpudaiya nilaiyaana jodigal. IN THE WAY (thaduppadhu) matrum ON THE WAY (payanippadhu). IN THE FRONT matrum IN FRONT OF. AT HAND matrum IN HAND."}],

 s3:[
 {h:"Time to spare or exactly on the clock?",
  d:"   IN TIME  →  ⏰➜  arrived with time to spare\n     5.45 ────► 6.00 train\n     \"We reached IN TIME to catch the train.\"\n     (usually followed by 'to' or 'for')\n\n   ON TIME  →  ⏰  exactly as scheduled\n     6.00 = 6.00\n     \"The train arrived ON TIME.\""},
 {h:"A story or a position?",
  d:"   IN THE END  →  📖 how the story finished\n     IN THE END, he agreed to help.\n     (after much persuasion)\n\n   AT THE END  →  📍 the final point\n     There is a summary AT THE END\n     of the chapter.\n     (a position in the book)"},
 {h:"Other fixed pairs",
  d:"   IN THE WAY   =  blocking\n     Your bag is IN THE WAY.\n   ON THE WAY   =  travelling\n     I met him ON THE WAY to school.\n\n   IN FRONT OF  =  before, outside\n     He stood IN FRONT OF the house.\n   IN THE FRONT =  in the front part, inside\n     He sat IN THE FRONT of the bus.\n\n   ⚠ 'AT LAST' is two words, never 'atlast'."}],

 s4:{
 wrong:["\"'The train arrived in time at 6.00 sharp' is fine.\" — Exactly on schedule requires 'on time'.",
  "\"'We reached on time to catch the train' is correct.\" — Having time to spare requires 'in time'.",
  "\"'At the end, he agreed' shows the conclusion.\" — A process ending requires 'in the end'.",
  "\"'Atlast' is one word.\" — It is always two words: 'at last'."],
 right:["Ask: with time to spare, or exactly on schedule?",
  "Time to spare → in time. Exactly on schedule → on time.",
  "How a story finished → in the end. Where something is → at the end.",
  "Learn the related pairs: in the way / on the way, in front of / in the front."]},

 s5:[
 {en:"We reached the station in time to catch the train.",ta:"ரயிலைப் பிடிக்கும் அளவுக்கு நாங்கள் நிலையத்தை முன்னதாக அடைந்தோம்.",tl:"Rayilaip pidikkum alavukku naangal nilaiyaththai munnadhaaga adaindhom.",note:"Time to spare, with a purpose → IN TIME."},
 {en:"The flight took off on time at six sharp.",ta:"விமானம் சரியாக ஆறு மணிக்குப் புறப்பட்டது.",tl:"Vimaanam sariyaaga aaru manikkup purappattadhu.",note:"Exactly as scheduled → ON TIME."},
 {en:"In the end, he agreed to help us.",ta:"இறுதியில், அவர் எங்களுக்கு உதவ ஒப்புக்கொண்டார்.",tl:"Irudhiyil, avar engalukku udhava oppukkondaar.",note:"After a long process → IN THE END."},
 {en:"There is a summary at the end of the chapter.",ta:"அத்தியாயத்தின் இறுதியில் ஒரு சுருக்கம் இருக்கிறது.",tl:"Aththiyaayaththin irudhiyil oru surukkam irukkiradhu.",note:"A position → AT THE END."},
 {en:"At last, the long-awaited results were declared.",ta:"நீண்ட நாள் எதிர்பார்த்த முடிவுகள் கடைசியில் அறிவிக்கப்பட்டன.",tl:"Neenda naal edhirpaarththa mudivugal kadaisiyil arivikkappattana.",note:"Relief after waiting → AT LAST, always two words."}],

 s10:{
  en:"These pairs differ by a single small word, and the meanings are close enough that both options look plausible. 'In time' versus 'on time' is the sharpest: one means early, the other means punctual. The exam gives you a sentence with a clock reading — that signals 'on time' — or a purpose clause with 'to' — that signals 'in time'. And 'atlast' as one word is a spelling trap.",
  ta:"இந்த ஜோடிகள் ஒரே ஒரு சிறிய சொல்லால் வேறுபடுகின்றன, பொருள்கள் போதுமான அளவு நெருக்கமாக இருப்பதால் இரண்டு option-களும் நம்பத்தகுந்ததாகத் தெரிகின்றன. 'In time' மற்றும் 'on time'-தான் மிகக் கூர்மையானது: ஒன்று முன்னதாக என்று பொருள்படுகிறது, மற்றொன்று நேரந்தவறாமல். தேர்வு உங்களுக்கு ஒரு கடிகார வாசிப்புடன் ஒரு வாக்கியத்தைத் தருகிறது — அது 'on time'-ஐச் சுட்டுகிறது — அல்லது 'to'-உடன் ஒரு நோக்கத் தொடர் — அது 'in time'-ஐச் சுட்டுகிறது.",
  tl:"Indha jodigal ore oru siriya sollaal verupadugindrana. 'In time' matrum 'on time'-dhaan migak koormaiyaanadhu. Thervu ungalukku oru kadigaara vaasippudan oru vaakkiyaththaith tharugiradhu — adhu 'on time'-aich suttugiradhu."},

 s11:{
  en:"TIME TO SPARE = IN TIME. EXACTLY ON THE CLOCK = ON TIME.",
  ta:"நேரம் மிச்சம் = IN TIME. கடிகாரத்தில் சரியாக = ON TIME.",
  tl:"Neram micham = IN TIME. Kadigaaraththil sariyaaga = ON TIME.",
  vis:"      THE FOUR FIXED PAIRS\n\n   ⏰ IN TIME    early enough, time to spare\n                 (usually + 'to' or 'for')\n      ON TIME    exactly as scheduled\n                 (usually with a clock reading)\n\n   📖 IN THE END  finally, after a long process\n      AT THE END  the final point or position\n\n   🚧 IN THE WAY  blocking\n      ON THE WAY  travelling\n\n   🏠 IN FRONT OF  before, outside\n      IN THE FRONT in the front part, inside\n\n   ⚠ 'AT LAST' is TWO words, never 'atlast'."},

}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;

   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){

   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();

    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
