<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CentuMania · Voice, Narration &amp; Miscellaneous — 17 Micro-Classes</title>
<style>
:root{
 --bg:#0e1120;--bg2:#151a2e;--card:#1a2038;--card2:#212844;--line:#2c3456;
 --txt:#e9ecf8;--dim:#98a1c6;--acc:#ffb020;--acc2:#ff7a45;--ok:#3ddc97;--no:#ff5c7a;
 --blue:#5aa9ff;--pur:#b07bff;--sh:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Tamil",sans-serif;line-height:1.65}
/* ---- LAYOUT ---- */
.shell{display:flex;min-height:100vh}
aside{width:270px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
 position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px}
main{flex:1;min-width:0;padding:0 0 80px}
.logo{font-size:11px;letter-spacing:4px;color:var(--acc);font-weight:800;text-transform:uppercase}
aside h2{font-size:16px;margin:4px 0 3px;font-weight:800}
aside .msub{font-size:11.5px;color:var(--dim);margin-bottom:14px}
.rlist{display:grid;gap:4px}
.rbtn{display:flex;gap:9px;align-items:flex-start;background:transparent;border:1px solid transparent;
 color:var(--dim);text-align:left;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;
 font-size:12.5px;line-height:1.35;transition:.13s;width:100%}
.rbtn:hover{background:var(--card);color:var(--txt)}
.rbtn.on{background:var(--card2);border-color:var(--acc);color:var(--txt)}
.rbtn b{min-width:22px;color:var(--acc);font-size:12px}
.rbtn .dn{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.rbtn .tick{margin-left:auto;color:var(--ok);font-size:11px}
/* ---- TOPBAR ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(14,17,32,.95);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:13px 26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:800}
.top h1 em{font-style:normal;color:var(--acc)}
.top .tta{font-size:13px;color:var(--pur);width:100%;margin-top:-4px}
.badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:800;letter-spacing:.4px}
.b-Easy{background:rgba(61,220,151,.16);color:var(--ok)}
.b-Medium{background:rgba(255,176,32,.16);color:var(--acc)}
.b-Hard{background:rgba(255,92,122,.16);color:var(--no)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim)}
.navbtns{margin-left:auto;display:flex;gap:7px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 13px;
 border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ---- STEP ---- */
.body{padding:22px 26px;max-width:940px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
 overflow:hidden;box-shadow:var(--sh)}
.sh{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.sh:hover{background:var(--card2)}
.sn{min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
 background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1405;font-weight:800;font-size:13px}
.st{flex:1;font-weight:700;font-size:15px}
.st small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:1px}
.cv{color:var(--dim);transition:.2s;font-size:13px}
.step.open .cv{transform:rotate(180deg)}
.sb{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.step.open .sb{display:block}
/* ---- CONTENT BLOCKS ---- */
.en{font-size:15px;margin:11px 0 3px}
.ta{font-size:15.5px;color:#dcd2ff;margin:2px 0 1px}
.tl{font-size:12.5px;color:var(--dim);font-style:italic;margin-bottom:9px}
.hd{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:9px 0}
.box.gold{border-left:3px solid var(--acc);background:rgba(255,176,32,.07)}
.box.blue{border-left:3px solid var(--blue)}
.box.red{border-left:3px solid var(--no);background:rgba(255,92,122,.07)}
.box.grn{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}
.box.pur{border-left:3px solid var(--pur)}
pre.dia{background:#0a0d1a;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
 font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--acc);
 overflow-x:auto;margin:10px 0;white-space:pre}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--card2);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
td.w{color:var(--no)}td.c{color:var(--ok)}
td.tam{color:#dcd2ff}
.lvl{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:800;white-space:nowrap}
.l-Easy{background:rgba(61,220,151,.15);color:var(--ok)}
.l-Medium{background:rgba(90,169,255,.15);color:var(--blue)}
.l-Hard{background:rgba(255,176,32,.15);color:var(--acc)}
.l-Expert{background:rgba(255,92,122,.15);color:var(--no)}
/* ---- QUIZ ---- */
.qz{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.qz .qn{font-size:14px;font-weight:600;margin-bottom:8px}
.qz .qn i{font-style:normal;color:var(--acc);margin-right:6px;font-weight:800}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.op{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
 padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s;min-width:74px}
.op:hover{border-color:var(--acc)}
.op.right{background:rgba(61,220,151,.18);border-color:var(--ok);color:var(--ok);font-weight:700}
.op.wrong{background:rgba(255,92,122,.18);border-color:var(--no);color:var(--no)}
.sol{display:none;margin-top:8px;font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.qz.done .sol{display:block}
.scorebar{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--acc);
 border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px;flex-wrap:wrap}
.scorebar b{color:var(--acc);font-size:17px}
.bar{flex:1;min-width:120px;height:7px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:.35s}
/* ---- AI PANEL ---- */
.ai{background:linear-gradient(135deg,rgba(176,123,255,.11),rgba(90,169,255,.07));
 border:1px solid rgba(176,123,255,.35);border-radius:12px;padding:15px 17px;margin:10px 0}
.ai .who{font-size:12px;font-weight:800;color:var(--pur);letter-spacing:.8px;margin-bottom:9px}
.ai p{margin-bottom:11px}
/* ---- REVISION SHEET ---- */
.rev{display:grid;grid-template-columns:150px 1fr;gap:1px;background:var(--line);
 border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;font-size:13.5px}
.rev div{background:var(--bg2);padding:9px 13px}
.rev div:nth-child(odd){color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
/* ---- MISC ---- */
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin:10px 0}
.wc{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.wc b{display:block;font-size:14px;color:var(--blue)}
.wc span{display:block;font-size:13.5px;color:#dcd2ff;margin-top:3px}
.wc em{display:block;font-size:11.5px;color:var(--dim);font-style:italic}
.think{display:grid;gap:6px;margin:9px 0}
.think div{padding:8px 12px;border-radius:8px;font-size:13.5px}
.think .bad{background:rgba(255,92,122,.09);border-left:3px solid var(--no)}
.think .good{background:rgba(61,220,151,.09);border-left:3px solid var(--ok)}
footer{padding:26px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:880px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;position:relative;max-height:250px}
 .body{padding:16px}.top{padding:12px 16px}.rev{grid-template-columns:1fr}
}
@media print{aside,.top .navbtns,.cv{display:none!important}.sb{display:block!important}
 body{background:#fff;color:#000}.step{break-inside:avoid}}
</style>
</head>

</aside>
<main>
  <div class="top">
    <h1 id="tt"></h1>
    <span class="badge" id="tdiff"></span>

  <div class="body" id="body"></div>

</div>

<script>
/* ============ COMPACT DATA FORMAT ============
   s7  solved examples : "sentence|answer|Level|why"
   s8  wrong vs right  : "wrong|correct|why"
   s9  PYQ             : "Type|question|optA;optB;optC|ansIdx|solution"
   s12 practice        : "sentence with ____|optA;optB|ansIdx"
   s13 challenge       : "question|optA;optB;optC|ansIdx|solution"
   s6  word-by-word    : "word|tamil|tanglish"
============================================== */
const RULES=[
/* ========== RULE 104 ========== */
{n:104,rc:"VOI-01",d:"Medium",t:"ACTIVE to PASSIVE — the Three-Step Transformation",
 tam:"Object முன்னால் · BE + V3 · BY + Subject — மூன்று படி",
 s1:{en:"To change ACTIVE to PASSIVE: (1) move the OBJECT to the front as the new subject, (2) change the verb to the correct form of BE + V3, (3) put the old subject at the end after BY.",
  ta:"ACTIVE-ஐ PASSIVE-ஆக மாற்ற: (1) OBJECT-ஐ புதிய Subject-ஆக முன்னால் நகர்த்தவும், (2) வினைச்சொல்லை BE + V3-ன் சரியான வடிவமாக மாற்றவும், (3) பழைய Subject-ஐ BY-க்குப் பிறகு கடைசியில் வைக்கவும்.",
  tl:"ACTIVE-ai PASSIVE-aaga maatra: (1) OBJECT-ai pudhiya Subject-aaga munnaal nagarththavum, (2) vinaicholai BE + V3-in sariyaana vadivamaaga maatravum, (3) pazhaiya Subject-ai BY-kkup piragu kadaisiyil vaikkavum.",
  formula:"THREE STEPS\n\n  ACTIVE :  Ram    writes   a letter.\n            SUBJECT  VERB    OBJECT\n\n  PASSIVE:  A letter  is written  by Ram.\n            OBJECT    BE + V3     BY + SUBJECT\n\n  1. OBJECT comes first\n  2. VERB becomes BE + V3\n  3. SUBJECT goes to the end after BY\n\n⚠ THE VERB IS ALWAYS V3, NEVER V2."},

 s2:[
 {h:"Only transitive verbs can be made passive",
  en:"A passive needs an OBJECT to move to the front. 'Ram writes a letter' has the object 'a letter'. But 'Ram sleeps' has no object, so it can never be passive. Check for an object first.",
  ta:"Transitive verb-கள் மட்டுமே passive ஆக முடியும். ஒரு passive-க்கு முன்னால் நகர்த்த ஒரு OBJECT தேவை. 'Ram writes a letter'-ல் 'a letter' என்ற object உள்ளது. ஆனால் 'Ram sleeps'-க்கு object இல்லை, எனவே அது ஒருபோதும் passive ஆக முடியாது. முதலில் ஒரு object இருக்கிறதா என்று சரிபாருங்கள்.",
  tl:"Transitive verb-gal mattume passive aaga mudiyum. Oru passive-kku munnaal nagarththa oru OBJECT thevai. 'Ram sleeps'-kku object illai, enave adhu orupodhum passive aaga mudiyaadhu."},
 {h:"The verb is always V3, never V2",
  en:"'The letter was WRITTEN', not 'was WROTE'. 'The song was SUNG', not 'was SANG'. This is the single most common mistake in Voice questions, because V2 and V3 look similar for many verbs.",
  ta:"வினைச்சொல் எப்போதும் V3, ஒருபோதும் V2 அல்ல. 'The letter was WRITTEN', 'was WROTE' அல்ல. 'The song was SUNG', 'was SANG' அல்ல. இது Voice கேள்விகளில் மிகப் பொதுவான ஒற்றைத் தவறு, ஏனெனில் பல வினைச்சொற்களுக்கு V2 மற்றும் V3 ஒரே மாதிரி தெரிகின்றன.",
  tl:"Vinaichol eppodhum V3, orupodhum V2 alla. 'The letter was WRITTEN', 'was WROTE' alla. 'The song was SUNG', 'was SANG' alla. Idhu Voice kelvigalil migap podhuvaana otraith thavaru."},
 {h:"Pronouns change form when they move",
  en:"Subject pronouns become object pronouns and the reverse. I→me, he→him, she→her, we→us, they→them, who→whom. 'He helped me' becomes 'I was helped by him'. This is Pronoun Rule 21 in action.",
  ta:"Pronoun-கள் நகரும்போது வடிவம் மாறுகின்றன. Subject pronoun-கள் object pronoun-களாகவும் மாறாகவும் மாறுகின்றன. I→me, he→him, she→her, we→us, they→them, who→whom. 'He helped me' 'I was helped by him' ஆகிறது. இது செயலில் உள்ள Pronoun Rule 21.",
  tl:"Pronoun-gal nagarumbodhu vadivam maarugindrana. I→me, he→him, she→her, we→us, they→them, who→whom. 'He helped me' 'I was helped by him' aagiradhu. Idhu Pronoun Rule 21."},
 {h:"The new verb agrees with the new subject",
  en:"'Ram writes letters' → 'Letters ARE written by Ram' — 'letters' is plural, so 'are'. 'Ram writes a letter' → 'A letter IS written by Ram'. The BE verb follows the new subject, not the old one. That is SVA in the passive.",
  ta:"புதிய வினைச்சொல் புதிய Subject-உடன் ஒத்துப்போகிறது. 'Ram writes letters' → 'Letters ARE written by Ram' — 'letters' பன்மை, எனவே 'are'. 'Ram writes a letter' → 'A letter IS written by Ram'. BE வினைச்சொல் புதிய Subject-ஐப் பின்பற்றுகிறது, பழையதை அல்ல. அது passive-ல் SVA.",
  tl:"Pudhiya vinaichol pudhiya Subject-udan oththuppogiradhu. 'Ram writes letters' → 'Letters ARE written by Ram'. BE vinaichol pudhiya Subject-aip pinpatrugiradhu, pazhaiyadhai alla."}],

 s3:[
 {h:"The three-step swap",
  d:"   ACTIVE\n     Ram    writes   a letter.\n      S        V         O\n      └────────┐   ┌──────┘\n               ╳ (they swap)\n      ┌────────┘   └──────┐\n   PASSIVE\n     A letter  is written  by Ram.\n        S       BE + V3    BY + old S"},
 {h:"Pronouns change form",
  d:"   SUBJECT  →  OBJECT\n     I      →  me\n     he     →  him\n     she    →  her\n     we     →  us\n     they   →  them\n     who    →  whom\n\n   'He helped ME.'\n     → 'I was helped by HIM.'\n        ↑                  ↑\n     me→I              he→him"},
 {h:"The BE verb follows the NEW subject",
  d:"   Ram writes a letter.\n     → A LETTER is written by Ram.   (singular)\n\n   Ram writes letters.\n     → LETTERS are written by Ram.  (plural)\n\n   ⚠ ALWAYS V3, NEVER V2:\n     was WRITTEN  ✔    was wrote   ✘\n     was SUNG     ✔    was sang    ✘\n     was TAKEN    ✔    was took    ✘\n     was DONE     ✔    was did     ✘"}],

 s4:{
 wrong:["\"The passive uses the past form of the verb.\" — It uses the past PARTICIPLE, V3.",
  "\"'The letter was wrote by Ram' is correct.\" — It must be 'written'.",
  "\"'By' can be dropped whenever we like.\" — Drop it only when the doer is unknown or unimportant.",
  "\"Any sentence can be made passive.\" — Only sentences with an object can."],
 right:["Find the object first — no object means no passive.",
  "Always use V3, never V2, after the BE verb.",
  "Change pronouns: I→me, he→him, she→her, we→us, they→them.",
  "Make the BE verb agree with the NEW subject."]},

 s5:[
 {en:"Ram writes a letter every single morning.",ta:"ராம் ஒவ்வொரு காலையும் ஒரு கடிதம் எழுதுகிறான்.",tl:"Raam ovvoru kaalaiyum oru kadidham ezhudhugiraan.",note:"ACTIVE — the subject does the action."},
 {en:"A letter is written by Ram every morning.",ta:"ஒவ்வொரு காலையும் ராமால் ஒரு கடிதம் எழுதப்படுகிறது.",tl:"Ovvoru kaalaiyum Raamaal oru kadidham ezhudhappadugiradhu.",note:"PASSIVE — object first, IS + WRITTEN, BY + Ram."},
 {en:"The teacher punished the boy yesterday.",ta:"நேற்று ஆசிரியர் அந்தப் பையனைத் தண்டித்தார்.",tl:"Netru aasiriyar andhap paiyanaith thandiththaar.",note:"ACTIVE, in the simple past."},
 {en:"The boy was punished by the teacher yesterday.",ta:"நேற்று அந்தப் பையன் ஆசிரியரால் தண்டிக்கப்பட்டான்.",tl:"Netru andhap paiyan aasiriyaraal thandikkappattaan.",note:"PASSIVE — WAS + PUNISHED."},
 {en:"I was helped by him during the examination.",ta:"தேர்வின்போது அவரால் நான் உதவப்பட்டேன்.",tl:"Thervinbodhu avaraal naan udhavappatten.",note:"'He helped me' → me becomes I, he becomes him."}],

 s6:["active voice|செயப்பாட்டு வினை|Seyappaattu vinai",
  "passive voice|செயப்பாட்டுப் பொருள் வினை|Seyappaattup porul vinai",
  "subject|எழுவாய்|Ezhuvaay",
  "object|செயப்படுபொருள்|Seyappadu porul",
  "transitive verb|செயப்படுபொருள் உள்ள வினை|Seyappadu porul ulla vinai",
  "V3|மூன்றாம் வடிவம்|Moondraam vadivam",
  "past participle|இறந்தகால எச்சம்|Irandhakaala echam",
  "by|-ஆல்|-aal",
  "is written|எழுதப்படுகிறது|Ezhudhappadugiradhu",
  "was punished|தண்டிக்கப்பட்டான்|Thandikkappattaan",
  "agreement|ஒத்திசைவு|Oththisaivu"],

 s7:[
 "A letter ____ written by Ram.|is|Easy|A singular subject in the present → IS.",
 "The boy was ____ by the teacher.|punished|Easy|The passive always takes V3.",
 "Letters ____ written by Ram daily.|are|Easy|A plural subject → ARE.",
 "The song was ____ by her beautifully.|sung|Medium|V3 of 'sing' is SUNG, not 'sang'.",
 "I was helped by ____ in the exam.|him|Medium|'He' becomes 'him' after BY.",
 "The work was ____ by the whole team.|done|Medium|V3 of 'do' is DONE, not 'did'.",
 "The book was ____ by my brother.|taken|Medium|V3 of 'take' is TAKEN, not 'took'.",
 "The window was ____ by the boys.|broken|Hard|V3 of 'break' is BROKEN, not 'broke'.",
 "These files ____ checked every week.|are|Hard|A plural subject → ARE.",
 "The letter was ____ by the postman.|delivered|Hard|A regular verb takes -ed for V3.",
 "He was ____ by us at the station.|met|Hard|V3 of 'meet' is MET.",
 "The prize was ____ by the collector.|given|Expert|V3 of 'give' is GIVEN, not 'gave'.",
 "The thief was ____ by the police.|caught|Expert|V3 of 'catch' is CAUGHT.",
 "The trees were ____ by the storm.|shaken|Expert|V3 of 'shake' is SHAKEN, not 'shook'.",

 s9:[

 s10:{
  en:"The V2-for-V3 slip is the biggest killer here. 'Was wrote', 'was sang', 'was took', 'was gave' all appear as tempting options because V2 is the form students recall first. The second trap is subject-verb agreement in the new sentence — the BE verb must follow the NEW subject, which is often a different number from the old one.",
  ta:"V3-க்குப் பதிலாக V2 நழுவுவதுதான் இங்கே மிகப் பெரிய கொலையாளி. 'Was wrote', 'was sang', 'was took', 'was gave' அனைத்தும் கவர்ச்சிகரமான option-களாக வருகின்றன, ஏனெனில் மாணவர்கள் முதலில் நினைவுகூரும் வடிவம் V2. இரண்டாவது பொறி புதிய வாக்கியத்தில் subject-verb ஒத்திசைவு — BE வினைச்சொல் புதிய Subject-ஐப் பின்பற்ற வேண்டும், அது பெரும்பாலும் பழையதிலிருந்து வேறு எண்ணில் இருக்கும்.",
  tl:"V3-kkup padhilaaga V2 nazhuvuvadhudhaan inge migap periya kolaiyaali. 'Was wrote', 'was sang', 'was took', 'was gave' anaiththum kavarchigaramaana option-galaaga varugindrana."},

 s11:{
  en:"OBJECT FIRST, BE + V3, BY + SUBJECT. Always V3, never V2.",
  ta:"OBJECT முதல்ல, BE + V3, BY + SUBJECT. எப்பவும் V3, ஒருபோதும் V2 அல்ல.",
  tl:"OBJECT mudhalla, BE + V3, BY + SUBJECT. Eppavum V3, orupodhum V2 alla.",
  vis:"      THE THREE-STEP SWAP\n\n   ACTIVE :  Ram   writes   a letter.\n              S       V        O\n\n   STEP 1 :  move the OBJECT to the front\n   STEP 2 :  verb becomes BE + V3\n   STEP 3 :  old subject goes after BY\n\n   PASSIVE:  A letter  IS WRITTEN  BY Ram.\n\n   ⚠ ALWAYS V3, NEVER V2\n     written ✔ wrote ✘    sung ✔ sang ✘\n     taken   ✔ took  ✘    done ✔ did  ✘\n     given   ✔ gave  ✘    broken ✔ broke ✘\n\n   ⚠ PRONOUNS CHANGE FORM\n     I↔me · he↔him · she↔her\n     we↔us · they↔them · who↔whom\n\n   ⚠ THE BE VERB FOLLOWS THE NEW SUBJECT"},

 s14:{
  rule:"Move the object to the front, change the verb to BE + V3, and put the old subject after BY.",
  formula:"ACTIVE:  S + V + O\nPASSIVE: O + BE + V3 + BY + S\nAlways V3, never V2\nPronouns change: I↔me, he↔him, she↔her, we↔us, they↔them\nThe BE verb agrees with the NEW subject",
  memory:"Object first, BE + V3, BY + subject. Always V3.",
  ta:"Object முதல்ல, BE + V3, BY + subject. எப்பவும் V3.",
  tl:"Object mudhalla, BE + V3, BY + subject. Eppavum V3.",
  mistake:"Writing 'was wrote', 'was sang', 'was took' — using V2 instead of V3.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — Voice carries 2 to 3 marks in every paper."},

 s15:[
 {ta:"நாம கடைசி module-க்கு வந்துட்டோம். இதுல Voice, Narration, Conditionals, Question Tags எல்லாம் இருக்கு. இது SSC-ல மிக அதிக மதிப்பெண் தர்ற பகுதி.",
  tl:"Naama kadaisi module-kku vandhuttom. Idhula Voice, Narration, Conditionals, Question Tags ellaam irukku. Idhu SSC-la miga adhiga madhippen tharra paguthi."},
 {ta:"Voice-ல ஆரம்பிக்கலாம். ACTIVE அப்படின்னா — யாரு செய்யுறாங்கன்னு முக்கியம். 'Ram writes a letter' — ராம் முக்கியம். PASSIVE அப்படின்னா — எது செய்யப்படுதுன்னு முக்கியம். 'A letter is written by Ram' — கடிதம் முக்கியம்.",
  tl:"Voice-la aarambikkalaam. ACTIVE appadinnaa — yaaru seyyuraangannu mukkiyam. PASSIVE appadinnaa — edhu seyyappadudhunnu mukkiyam."},
 {ta:"மாத்துறது மூணு படி. படி 1 — OBJECT-ஐ முன்னால கொண்டு வாங்க. 'a letter' முன்னாடி. படி 2 — வினைச்சொல்லை BE + V3 ஆக்குங்க. 'writes' → 'is written'. படி 3 — பழைய subject-ஐ BY-க்கு அப்பறம் கடைசியில வையுங்க. 'by Ram'.",
  tl:"Maaththuradhu moonu padi. Padi 1 — OBJECT-ai munnaala kondu vaanga. Padi 2 — vinaicholai BE + V3 aakkunga. Padi 3 — pazhaiya subject-ai BY-kku apparam kadaisiyila vaiyunga."},
 {ta:"இப்போ மிக முக்கியமான ஒரு எச்சரிக்கை — வினைச்சொல் எப்பவும் V3! V2 இல்ல! 'The letter was WROTE' — தப்பு. 'The letter was WRITTEN' — சரி. ஏன் இந்த தப்பு வருது? ஏன்னா நமக்கு V2 தான் முதல்ல ஞாபகம் வரும்.",
  tl:"Ippo miga mukkiyamaana oru echcharikkai — vinaichol eppavum V3! V2 illa! 'The letter was WROTE' — thappu. 'The letter was WRITTEN' — sari."},
 {ta:"கவனமா மனப்பாடம் பண்ணுங்க: write-wrote-WRITTEN. sing-sang-SUNG. take-took-TAKEN. give-gave-GIVEN. break-broke-BROKEN. do-did-DONE. know-knew-KNOWN. drink-drank-DRUNK. shake-shook-SHAKEN. Passive-ல மூணாவது வடிவம் மட்டும்தான்!",
  tl:"Kavanamaa manappaadam pannunga: write-wrote-WRITTEN. sing-sang-SUNG. take-took-TAKEN. give-gave-GIVEN. break-broke-BROKEN. do-did-DONE. Passive-la moonaavadhu vadivam mattum-dhaan!"},
 {ta:"இன்னும் ரெண்டு விஷயம். ஒண்ணு — pronoun வடிவம் மாறும்! 'He helped ME' → 'I was helped by HIM'. 'me' subject ஆனதால 'I' ஆகுது, 'he' object ஆனதால 'him' ஆகுது. இது நீங்க Pronoun Rule 21-ல படிச்சது. ரெண்டு — BE வினைச்சொல் புதிய subject-ஐ பார்த்து வரும்! 'Letters ARE written' (பன்மை) ஆனா 'A letter IS written' (ஒருமை). பழைய subject-ஐ பார்க்காதீங்க!",
  tl:"Innum rendu vishayam. Onnu — pronoun vadivam maarum! 'He helped ME' → 'I was helped by HIM'. Idhu Pronoun Rule 21. Rendu — BE vinaichol pudhiya subject-ai paarththu varum!"}]},

/* ========== RULE 105 ========== */
{n:105,rc:"VOI-02",d:"Hard",t:"The PASSIVE across the Tenses",
 tam:"ஒவ்வொரு காலத்திற்கும் BE-ன் வடிவம் மாறும்",
 s1:{en:"The V3 never changes; only the BE form changes with the tense. IS/AM/ARE + V3 for simple present, WAS/WERE for simple past, WILL BE for future, HAS/HAVE BEEN for present perfect, HAD BEEN for past perfect, IS/ARE BEING for present continuous, WAS/WERE BEING for past continuous.",
  ta:"V3 ஒருபோதும் மாறாது; காலத்துடன் BE வடிவம் மட்டுமே மாறுகிறது. எளிய நிகழ்காலத்திற்கு IS/AM/ARE + V3, எளிய இறந்த காலத்திற்கு WAS/WERE, எதிர்காலத்திற்கு WILL BE, நிகழ்கால நிறைவுக்கு HAS/HAVE BEEN, இறந்தகால நிறைவுக்கு HAD BEEN, நிகழ்கால தொடர்ச்சிக்கு IS/ARE BEING, இறந்தகால தொடர்ச்சிக்கு WAS/WERE BEING.",
  tl:"V3 orupodhum maaraadhu; kaalaththudan BE vadivam mattume maarugiradhu. IS/AM/ARE + V3, WAS/WERE, WILL BE, HAS/HAVE BEEN, HAD BEEN, IS/ARE BEING, WAS/WERE BEING.",
  formula:"THE SEVEN PASSIVE FORMS\n\n  Simple Present    IS / AM / ARE  + V3\n  Simple Past       WAS / WERE     + V3\n  Simple Future     WILL BE        + V3\n  Present Perfect   HAS / HAVE BEEN+ V3\n  Past Perfect      HAD BEEN       + V3\n  Present Continuous IS / ARE BEING+ V3\n  Past Continuous   WAS / WERE BEING+ V3\n\n⚠ NO PASSIVE FOR:\n  Perfect Continuous · Future Continuous"},

 s2:[
 {h:"Only the BE part moves; V3 stays fixed",
  en:"Look at 'write': IS written, WAS written, WILL BE written, HAS BEEN written, HAD BEEN written, IS BEING written. The word 'written' never changes. Learn the seven BE forms and you have learnt all of Voice.",
  ta:"BE பகுதி மட்டுமே நகர்கிறது; V3 நிலையாக இருக்கிறது. 'Write'-ஐப் பாருங்கள்: IS written, WAS written, WILL BE written, HAS BEEN written, HAD BEEN written, IS BEING written. 'Written' என்ற சொல் ஒருபோதும் மாறாது. ஏழு BE வடிவங்களைக் கற்றுக்கொள்ளுங்கள், நீங்கள் Voice முழுவதையும் கற்றுவிட்டீர்கள்.",
  tl:"BE paguthi mattume nagargiradhu; V3 nilaiyaaga irukkiradhu. IS written, WAS written, WILL BE written, HAS BEEN written, HAD BEEN written, IS BEING written. 'Written' endra sol orupodhum maaraadhu."},
 {h:"The continuous passive needs BEING",
  en:"'The house IS BEING built' — present continuous passive. 'The house WAS BEING built' — past continuous. Students often drop the 'being' and write 'is built', which changes the tense completely.",
  ta:"தொடர்ச்சி passive-க்கு BEING தேவை. 'The house IS BEING built' — நிகழ்கால தொடர்ச்சி passive. 'The house WAS BEING built' — இறந்தகால தொடர்ச்சி. மாணவர்கள் அடிக்கடி 'being'-ஐ விட்டுவிட்டு 'is built' எழுதுகிறார்கள், அது காலத்தை முற்றிலும் மாற்றுகிறது.",
  tl:"Thodarchi passive-kku BEING thevai. 'The house IS BEING built' — nigazhkaala thodarchi passive. Maanavargal adikkadi 'being'-ai vittuvittu 'is built' ezhudhugiraargal."},
 {h:"The perfect passive needs BEEN",
  en:"'The work HAS BEEN done' — present perfect passive. 'HAS done' is active, 'HAS BEEN done' is passive. That one word 'been' carries the entire difference. The same for 'HAD BEEN done'.",
  ta:"Perfect passive-க்கு BEEN தேவை. 'The work HAS BEEN done' — நிகழ்கால நிறைவு passive. 'HAS done' active, 'HAS BEEN done' passive. அந்த ஒரு சொல் 'been' முழு வேறுபாட்டையும் சுமக்கிறது. 'HAD BEEN done'-க்கும் அதேதான்.",
  tl:"Perfect passive-kku BEEN thevai. 'The work HAS BEEN done' — nigazhkaala niraivu passive. 'HAS done' active, 'HAS BEEN done' passive. Andha oru sol 'been' muzhu verupaattaiyum sumakkiradhu."},
 {h:"Two tenses have no passive at all",
  en:"Perfect continuous ('has been writing') and future continuous ('will be writing') have no natural passive. 'Has been being written' does not exist in real English. If a question offers such a form, it is wrong.",
  ta:"இரண்டு காலங்களுக்கு passive-ஏ இல்லை. Perfect continuous ('has been writing') மற்றும் future continuous ('will be writing')-க்கு இயற்கையான passive இல்லை. 'Has been being written' உண்மையான ஆங்கிலத்தில் இல்லை. ஒரு கேள்வி அத்தகைய வடிவத்தைத் தந்தால், அது தவறு.",
  tl:"Irandu kaalangalukku passive-e illai. Perfect continuous matrum future continuous-kku iyarkaiyaana passive illai. 'Has been being written' unmaiyaana Aangilaththil illai."}],

 s3:[
 {h:"The seven forms — only BE changes",
  d:"   TENSE               PASSIVE FORM\n   ─────               ────────────\n   Simple Present      IS/AM/ARE + written\n   Simple Past         WAS/WERE  + written\n   Simple Future       WILL BE   + written\n   Present Perfect     HAS/HAVE BEEN + written\n   Past Perfect        HAD BEEN  + written\n   Present Continuous  IS/ARE BEING + written\n   Past Continuous     WAS/WERE BEING + written\n\n   'written' NEVER changes."},
 {h:"BEING and BEEN are the two key words",
  d:"   CONTINUOUS needs BEING\n     The house IS BEING built.\n     The house WAS BEING built.\n\n   PERFECT needs BEEN\n     The work HAS BEEN done.\n     The work HAD BEEN done.\n\n   ⚠ 'HAS done'      = ACTIVE\n     'HAS BEEN done' = PASSIVE\n     one word changes everything"},
 {h:"No passive exists here",
  d:"   ✘ Perfect Continuous\n       'has been being written'  does not exist\n\n   ✘ Future Continuous\n       'will be being written'   does not exist\n\n   If an option shows these forms,\n   it is automatically wrong."}],

 s4:{
 wrong:["\"The V3 changes with the tense.\" — Only the BE form changes.",
  "\"'The house is built' shows the work is going on.\" — That requires 'is being built'.",
  "\"'Has done' and 'has been done' are the same.\" — One is active, one is passive.",
  "\"Every tense has a passive.\" — Perfect continuous and future continuous do not."],
 right:["Learn the seven BE forms; the V3 stays fixed.",
  "Continuous passive needs BEING.",
  "Perfect passive needs BEEN.",
  "Reject any option showing 'has been being' or 'will be being'."]},

 s8:[
 "A new house is built near the river right now.|A new house is being built near the river right now.|The continuous passive needs 'being'.",
 "The work has done by the whole team.|The work has been done by the whole team.|The perfect passive needs 'been'.",
 "The letter will written by him tomorrow.|The letter will be written by him tomorrow.|The future passive needs 'be'.",
 "The road was repaired all last month continuously.|The road was being repaired all last month.|The past continuous passive needs 'being'.",
 "The results had declared before we reached.|The results had been declared before we reached.|The past perfect passive needs 'been'.",
 "These files is checked every Monday.|These files are checked every Monday.|The verb agrees with the plural subject.",
 "The rooms are clean by the staff now.|The rooms are being cleaned by the staff now.|The continuous passive needs 'being' and V3.",
 "The temple were being renovated last year.|The temple was being renovated last year.|A singular subject requires 'was'.",
 "The letters has been posted already.|The letters have been posted already.|A plural subject requires 'have'.",
 "The report has been being written since morning.|The report has been written since morning.|'Has been being' does not exist."],

 s9:[
 "Fill in the Blank|A new flyover ____ constructed near the railway station at the moment.|is;is being|1|The present continuous passive requires 'is being'.",
 "Find the Error|All the arrangements (A) had declared complete (B) before the chief guest (C) reached the venue (D).|A;B;C;D|1|Part B. The past perfect passive requires 'had been declared'.",
 "Sentence Improvement|The final results will declared by the university on the last day of this month.|will declared;will be declared;will been declared|1|The future passive requires 'will be'.",
 "Fill in the Blank|The damaged road ____ repaired throughout the whole of last month by the corporation.|was;was being|1|A continuing past action requires 'was being'.",
 "Find the Error|The entire project report (A) has completed by (B) the consultants (C) two days ahead of schedule (D).|A;B;C;D|1|Part B. The present perfect passive requires 'has been completed'."],

 s10:{
  en:"The two words that decide these questions are BEING and BEEN. Dropping 'being' turns a continuous into a simple; dropping 'been' turns a passive into an active. Both errors leave a sentence that still reads smoothly, which is why they slip past. And any option containing 'has been being' or 'will be being' can be rejected instantly.",
  ta:"இந்தக் கேள்விகளைத் தீர்மானிக்கும் இரண்டு சொற்கள் BEING மற்றும் BEEN. 'Being'-ஐ விடுவது ஒரு தொடர்ச்சியை எளியதாக மாற்றுகிறது; 'been'-ஐ விடுவது ஒரு passive-ஐ active-ஆக மாற்றுகிறது. இரண்டு தவறுகளும் இன்னும் சரளமாகப் படிக்கக்கூடிய வாக்கியத்தை விட்டுச் செல்கின்றன, அதனால்தான் அவை கவனிக்கப்படாமல் நழுவுகின்றன. மேலும் 'has been being' அல்லது 'will be being' கொண்ட எந்த option-ஐயும் உடனடியாக நிராகரிக்கலாம்.",
  tl:"Indhak kelvigalaith theermaanikkum irandu sorkal BEING matrum BEEN. 'Being'-ai viduvadhu oru thodarchiyai eliyadhaaga maatrugiradhu; 'been'-ai viduvadhu oru passive-ai active-aaga maatrugiradhu."},

 s11:{
  en:"ONLY THE BE FORM CHANGES. Continuous needs BEING; perfect needs BEEN.",
  ta:"BE வடிவம் மட்டுமே மாறும். Continuous-க்கு BEING; perfect-க்கு BEEN.",
  tl:"BE vadivam mattume maarum. Continuous-kku BEING; perfect-kku BEEN.",
  vis:"      SEVEN PASSIVE FORMS\n\n   Simple Present     IS/AM/ARE      + V3\n   Simple Past        WAS/WERE       + V3\n   Simple Future      WILL BE        + V3\n   Present Perfect    HAS/HAVE BEEN  + V3\n   Past Perfect       HAD BEEN       + V3\n   Present Continuous IS/ARE BEING   + V3\n   Past Continuous    WAS/WERE BEING + V3\n\n   ⚠ V3 NEVER CHANGES.\n\n   THE TWO KEY WORDS:\n     CONTINUOUS → BEING\n       is BEING built · was BEING built\n     PERFECT    → BEEN\n       has BEEN done · had BEEN done\n\n   ⚠ NO PASSIVE EXISTS FOR:\n     Perfect Continuous (has been being) ✘\n     Future Continuous  (will be being)  ✘"},

 s14:{
  rule:"Only the BE form changes with the tense; the V3 stays the same.",
  formula:"Simple Present IS/AM/ARE · Simple Past WAS/WERE\nSimple Future WILL BE · Present Perfect HAS/HAVE BEEN\nPast Perfect HAD BEEN · Present Continuous IS/ARE BEING\nPast Continuous WAS/WERE BEING\nNo passive: perfect continuous, future continuous",
  memory:"Continuous needs BEING. Perfect needs BEEN. V3 never changes.",
  ta:"Continuous-க்கு BEING. Perfect-க்கு BEEN. V3 மாறவே மாறாது.",
  tl:"Continuous-kku BEING. Perfect-kku BEEN. V3 maarave maaraadhu.",
  mistake:"Dropping 'being' from the continuous passive and 'been' from the perfect passive.",
  exam:"SSC CGL / CHSL and Bank — the seven passive forms cover almost every Voice question asked."},

 s15:[
 {ta:"Rule 104-ல மூணு படி பார்த்தோம். இப்போ ஒரு நல்ல செய்தி — Voice-ல மிச்சம் இருக்கிறது ஒரே ஒரு விஷயம்தான். BE வினைச்சொல்லோட வடிவம்!",
  tl:"Rule 104-la moonu padi paarththom. Ippo oru nalla seydhi — Voice-la micham irukkiradhu ore oru vishayam-dhaan. BE vinaicholoda vadivam!"},
 {ta:"கவனிங்க — V3 ஒருபோதும் மாறாது! 'Written' எப்பவும் 'written' தான். IS written. WAS written. WILL BE written. HAS BEEN written. HAD BEEN written. IS BEING written. WAS BEING written. பாத்தீங்களா? 'Written' மாறவே இல்ல!",
  tl:"Kavaninga — V3 orupodhum maaraadhu! 'Written' eppavum 'written' thaan. IS written. WAS written. WILL BE written. HAS BEEN written. Paaththeengalaa? 'Written' maarave illa!"},
 {ta:"அதனால ஏழு வடிவம் மட்டும் மனப்பாடம் பண்ணுங்க. எளிய நிகழ்காலம் — IS/AM/ARE. எளிய இறந்தகாலம் — WAS/WERE. எதிர்காலம் — WILL BE. நிகழ்கால நிறைவு — HAS/HAVE BEEN. இறந்தகால நிறைவு — HAD BEEN. நிகழ்கால தொடர்ச்சி — IS/ARE BEING. இறந்தகால தொடர்ச்சி — WAS/WERE BEING.",
  tl:"Adhanaala ezhu vadivam mattum manappaadam pannunga. IS/AM/ARE. WAS/WERE. WILL BE. HAS/HAVE BEEN. HAD BEEN. IS/ARE BEING. WAS/WERE BEING."},
 {ta:"இப்போ ரெண்டு சொல் மட்டும் நல்லா கவனிங்க — BEING மற்றும் BEEN. இதுதான் மொத்த வித்தியாசமும்!",
  tl:"Ippo rendu sol mattum nallaa kavaninga — BEING matrum BEEN. Idhudhaan moththa viththiyaasamum!"},
 {ta:"BEING — தொடர்ச்சிக்கு. 'The house IS BEING built' — வீடு இப்போ கட்டப்பட்டு வருது, முடியல. நிறைய பேரு 'being' -ஐ விட்டுட்டு 'is built' அப்படின்னு எழுதிடுவாங்க — அப்போ அர்த்தம் மாறிடும்!",
  tl:"BEING — thodarchikku. 'The house IS BEING built' — veedu ippo kattappattu varudhu, mudiyala. Neraiya peru 'being'-ai vittuttu 'is built' appadinnu ezhudhiduvaanga."},
 {ta:"BEEN — நிறைவுக்கு. 'The work HAS BEEN done' — வேலை முடிஞ்சிடுச்சு. இங்க கவனிங்க — 'HAS done' அப்படின்னா active! 'HAS BEEN done' அப்படின்னா passive! ஒரே ஒரு சொல் 'been', ஆனா முழு voice-ம் மாறிடுச்சு. கடைசியா ஒரு நல்ல விஷயம் — ரெண்டு காலத்துக்கு passive-ஏ கிடையாது! Perfect continuous ('has been being written') மற்றும் future continuous ('will be being written'). இந்த வடிவம் ஆங்கிலத்துலயே இல்ல. option-ல இப்படி வந்தா, உடனே தள்ளிடுங்க.",
  tl:"BEEN — niraivukku. 'The work HAS BEEN done'. Inga kavaninga — 'HAS done' active! 'HAS BEEN done' passive! Kadaisiyaa — rendu kaalaththukku passive-e kidaiyaadhu! 'has been being' matrum 'will be being'."}]},

/* ========== RULE 106 ========== */
{n:106,rc:"VOI-03",d:"Hard",t:"PASSIVE of Modals, Infinitives and IMPERATIVES",
 tam:"Modal + BE + V3 · Imperative-க்கு LET வடிவம்",
 s1:{en:"With a MODAL, the passive is MODAL + BE + V3. With an INFINITIVE, it is TO BE + V3. With an IMPERATIVE (a command), the passive is LET + object + BE + V3, or 'You are requested to…' for polite requests.",
  ta:"ஒரு MODAL-உடன், passive என்பது MODAL + BE + V3. ஒரு INFINITIVE-உடன், அது TO BE + V3. ஒரு IMPERATIVE-உடன் (ஒரு கட்டளை), passive என்பது LET + object + BE + V3, அல்லது கண்ணியமான வேண்டுகோள்களுக்கு 'You are requested to…'.",
  tl:"Oru MODAL-udan, passive enbadhu MODAL + BE + V3. Oru INFINITIVE-udan, adhu TO BE + V3. Oru IMPERATIVE-udan, passive enbadhu LET + object + BE + V3.",
  formula:"MODAL     →  MODAL + BE + V3\n  You must finish it.\n    → It must BE FINISHED by you.\n\nINFINITIVE →  TO BE + V3\n  I want to finish it.\n    → I want it TO BE FINISHED.\n\nIMPERATIVE →  LET + object + BE + V3\n  Open the door.\n    → LET the door BE OPENED.\n  Do not open the door.\n    → LET the door NOT BE OPENED.\n\nPOLITE REQUEST → You are requested to…\n  Please help me.\n    → You are requested to help me."},

 s2:[
 {h:"The modal never changes",
  en:"'Must finish' becomes 'must be finished'. 'Can do' becomes 'can be done'. 'Should send' becomes 'should be sent'. Whatever the modal, it stays exactly as it is and BE + V3 follows.",
  ta:"Modal ஒருபோதும் மாறாது. 'Must finish' 'must be finished' ஆகிறது. 'Can do' 'can be done' ஆகிறது. 'Should send' 'should be sent' ஆகிறது. Modal எதுவாக இருந்தாலும், அது சரியாக அப்படியே இருக்கிறது, BE + V3 பின்வருகிறது.",
  tl:"Modal orupodhum maaraadhu. 'Must finish' 'must be finished' aagiradhu. 'Can do' 'can be done' aagiradhu. Modal edhuvaaga irundhaalum, adhu sariyaaga appadiye irukkiradhu."},
 {h:"Commands take LET",
  en:"'Open the door' has no visible subject — the subject is 'you'. So the passive uses 'LET the door BE OPENED'. For the negative: 'Do not open the door' → 'LET the door NOT BE OPENED' or 'Let not the door be opened'.",
  ta:"கட்டளைகள் LET எடுக்கின்றன. 'Open the door'-க்கு தெரியக்கூடிய Subject இல்லை — Subject 'you'. எனவே passive 'LET the door BE OPENED' பயன்படுத்துகிறது. எதிர்மறைக்கு: 'Do not open the door' → 'LET the door NOT BE OPENED' அல்லது 'Let not the door be opened'.",
  tl:"Kattalaigal LET edukkindrana. 'Open the door'-kku theriyakkoodiya Subject illai — Subject 'you'. Enave passive 'LET the door BE OPENED' payanpaduththugiradhu."},
 {h:"Requests and advice use a different pattern",
  en:"'Please help me' is a request, not a command, so 'Let me be helped' sounds odd. Use 'You are requested to help me'. Similarly for advice: 'Work hard' → 'You are advised to work hard'.",
  ta:"வேண்டுகோள்களும் அறிவுரையும் வெவ்வேறு பாணியைப் பயன்படுத்துகின்றன. 'Please help me' ஒரு வேண்டுகோள், ஒரு கட்டளை அல்ல, எனவே 'Let me be helped' விநோதமாக ஒலிக்கிறது. 'You are requested to help me' பயன்படுத்துங்கள். அறிவுரைக்கும் அதேபோல: 'Work hard' → 'You are advised to work hard'.",
  tl:"Vendugolgalum arivuraiyum vevveru paaniyaip payanpaduththugindrana. 'Please help me' oru vendugol. 'You are requested to help me' payanpaduththungal."},
 {h:"HAVE TO, NEED TO and OUGHT TO follow the modal pattern",
  en:"'You have to submit it' → 'It has to be submitted by you'. 'You ought to do it' → 'It ought to be done by you'. These semi-modals behave exactly like true modals in the passive.",
  ta:"HAVE TO, NEED TO மற்றும் OUGHT TO modal பாணியைப் பின்பற்றுகின்றன. 'You have to submit it' → 'It has to be submitted by you'. 'You ought to do it' → 'It ought to be done by you'. இந்த semi-modal-கள் passive-ல் உண்மையான modal-கள் போலவே நடந்துகொள்கின்றன.",
  tl:"HAVE TO, NEED TO matrum OUGHT TO modal paaniyaip pinpatrugindrana. 'You have to submit it' → 'It has to be submitted by you'."}],

 s3:[
 {h:"Modal + BE + V3",
  d:"   ACTIVE                PASSIVE\n   You MUST finish it. → It MUST BE FINISHED.\n   You CAN do it.      → It CAN BE DONE.\n   You SHOULD send it. → It SHOULD BE SENT.\n   You MAY use it.     → It MAY BE USED.\n   You WILL sign it.   → It WILL BE SIGNED.\n\n   The modal never changes.\n   Just add BE + V3."},
 {h:"Imperatives take LET",
  d:"   COMMAND\n     Open the door.\n       → LET the door BE OPENED.\n\n   NEGATIVE COMMAND\n     Do not open the door.\n       → LET the door NOT BE OPENED.\n\n   REQUEST (please)\n     Please help me.\n       → You are REQUESTED to help me.\n\n   ADVICE\n     Work hard.\n       → You are ADVISED to work hard."},
 {h:"Infinitives and semi-modals",
  d:"   INFINITIVE  →  TO BE + V3\n     I want to finish it.\n       → I want it TO BE FINISHED.\n     He is to do the work.\n       → The work is TO BE DONE by him.\n\n   SEMI-MODALS behave the same:\n     have to  → has/have TO BE + V3\n     need to  → needs TO BE + V3\n     ought to → ought TO BE + V3"}],

 s4:{
 wrong:["\"'It must finished' is enough.\" — The modal passive needs 'be'.",
  "\"'The door should be opened' works for a command.\" — Commands take 'Let … be opened'.",
  "\"'Let me be helped' is the passive of 'Please help me'.\" — Requests use 'You are requested to…'.",
  "\"'Have to' has no passive.\" — It takes 'has to be' + V3."],
 right:["Keep the modal and add BE + V3.",
  "For commands use LET + object + BE + V3.",
  "For requests use 'You are requested to…'.",
  "Semi-modals follow the same pattern: has to be, ought to be, needs to be."]},

 s5:[
 {en:"The work must be finished before Friday.",ta:"வெள்ளிக்கிழமைக்கு முன் வேலை முடிக்கப்பட வேண்டும்.",tl:"Vellikkizhamaikku mun velai mudikkappada vendum.",note:"MODAL + BE + V3."},
 {en:"Let the door be opened at once.",ta:"கதவு உடனே திறக்கப்படட்டும்.",tl:"Kadhavu udane thirakkappadattum.",note:"An imperative passive → LET + BE + V3."},
 {en:"Let the window not be closed just yet.",ta:"ஜன்னல் இப்போது மூடப்பட வேண்டாம்.",tl:"Jannal ippodhu moodappada vendaam.",note:"A negative imperative → LET … NOT BE + V3."},
 {en:"You are requested to submit the form today.",ta:"இன்று படிவத்தைச் சமர்ப்பிக்குமாறு கேட்டுக்கொள்ளப்படுகிறீர்கள்.",tl:"Indru padivaththaich samarppikkumaaru kettukkollappadugireergal.",note:"A polite request → 'You are requested to…'."},
 {en:"The file has to be signed by the director.",ta:"கோப்பு இயக்குநரால் கையொப்பமிடப்பட வேண்டும்.",tl:"Koppu iyakkunaraal kaiyoppamidappada vendum.",note:"A semi-modal → HAS TO BE + V3."}],

 "The order will carried out fully by them.|The order will be carried out fully by them.|The future passive needs 'be'."],

 s9:[
 "Fill in the Blank|All the pending applications must ____ disposed of before the end of this quarter.|be;been|0|The modal passive requires 'be'.",
 "Find the Error|Let the main gate (A) not closed (B) before all the (C) visitors have left (D).|A;B;C;D|1|Part B. The negative imperative passive requires 'not be closed'.",
 "Sentence Improvement|Change the passive of 'Please send me the details': Let me be sent the details.|Let me be sent the details;You are requested to send me the details;Send the details be|1|A polite request uses 'You are requested to'.",
 "Fill in the Blank|The revised guidelines have to ____ followed by every department without exception.|be;been|0|The semi-modal passive requires 'be'.",
 "Find the Error|The committee decided (A) that the report ought to (B) published (C) without further delay (D).|A;B;C;D|2|Part C. 'Ought to' requires 'ought to be published'."],

 s10:{
  en:"Dropping 'be' after a modal is the commonest slip — 'must finished' instead of 'must be finished'. The imperative passive is the second trap because students reach for 'should be' when the answer is 'Let … be'. And requests with 'please' need the 'You are requested to' pattern, not 'Let'.",
  ta:"ஒரு modal-க்குப் பிறகு 'be'-ஐ விடுவது மிகப் பொதுவான நழுவல் — 'must be finished'-க்குப் பதிலாக 'must finished'. Imperative passive இரண்டாவது பொறி, ஏனெனில் விடை 'Let … be' ஆக இருக்கும்போது மாணவர்கள் 'should be'-க்கு கை நீட்டுகிறார்கள். மேலும் 'please'-உடன் வரும் வேண்டுகோள்களுக்கு 'You are requested to' பாணி தேவை, 'Let' அல்ல.",
  tl:"Oru modal-kkup piragu 'be'-ai viduvadhu migap podhuvaana nazhuval — 'must finished'. Imperative passive irandaavadhu pori. Melum 'please'-udan varum vendugolgalukku 'You are requested to' paani thevai."},

 s11:{
  en:"MODAL + BE + V3. Commands take LET. Requests take 'You are requested to'.",
  ta:"MODAL + BE + V3. கட்டளைக்கு LET. வேண்டுகோளுக்கு 'You are requested to'.",
  tl:"MODAL + BE + V3. Kattalaikku LET. Vendugolukku 'You are requested to'.",
  vis:"      THREE SPECIAL PATTERNS\n\n   1. MODAL  →  MODAL + BE + V3\n      must finish → must BE FINISHED\n      can do      → can BE DONE\n      should send → should BE SENT\n      has to sign → has TO BE SIGNED\n      ought to do → ought TO BE DONE\n\n   2. COMMAND →  LET + object + BE + V3\n      Open the door.\n        → LET the door BE OPENED.\n      Do not open it.\n        → LET it NOT BE OPENED.\n\n   3. REQUEST / ADVICE\n      Please help me.\n        → You are REQUESTED to help me.\n      Work hard.\n        → You are ADVISED to work hard.\n\n   ⚠ NEVER DROP THE 'BE'."},

 s14:{
  rule:"Modals take MODAL + BE + V3; commands take LET + object + BE + V3; requests take 'You are requested to'.",
  formula:"MODAL + BE + V3 (must be finished, can be done)\nSEMI-MODAL: has to be, ought to be, needs to be\nINFINITIVE: TO BE + V3\nCOMMAND: LET + object + BE + V3\nNEGATIVE COMMAND: LET + object + NOT BE + V3\nREQUEST: You are requested to… | ADVICE: You are advised to…",
  memory:"Keep the modal, add BE + V3. Commands take LET.",
  ta:"Modal-ஐ அப்படியே வெச்சு BE + V3 சேருங்க. கட்டளைக்கு LET.",
  tl:"Modal-ai appadiye vechu BE + V3 serunga. Kattalaikku LET.",
  mistake:"Writing 'must finished' without 'be', and using 'should be' instead of 'Let … be' for commands.",
  exam:"SSC CGL / CHSL and Bank — the imperative passive with LET is asked almost every year."},

 s15:[
 {ta:"Rule 105-ல ஏழு காலத்தோட passive பார்த்தோம். இப்போ மூணு சிறப்பு வகை — modal, infinitive, மற்றும் கட்டளை.",
  tl:"Rule 105-la ezhu kaalaththoda passive paarththom. Ippo moonu sirappu vagai — modal, infinitive, matrum kattalai."},
 {ta:"முதல்ல modal. இது ரொம்ப எளிது! Modal-ஐ அப்படியே வெச்சுக்கோங்க, அப்பறம் BE + V3 சேருங்க. 'You MUST finish it' → 'It MUST BE FINISHED by you'. 'You CAN do it' → 'It CAN BE DONE'. 'You SHOULD send it' → 'It SHOULD BE SENT'.",
  tl:"Mudhalla modal. Idhu romba eladhu! Modal-ai appadiye vechukkonga, apparam BE + V3 serunga. 'It MUST BE FINISHED'. 'It CAN BE DONE'. 'It SHOULD BE SENT'."},
 {ta:"இங்க ஒரு பெரிய தப்பு நடக்கும் — 'be' -ஐ விட்டுடுவாங்க! 'It must FINISHED' — தப்பு! 'It must BE FINISHED' — சரி. 'be' இல்லாம passive வராது.",
  tl:"Inga oru periya thappu nadakkum — 'be'-ai vittuduvaanga! 'It must FINISHED' — thappu! 'It must BE FINISHED' — sari."},
 {ta:"இப்போ ரெண்டாவது — கட்டளை (imperative). 'Open the door.' இதுல subject எங்க? தெரியல! ஆனா அது 'you' தான். இப்படிப்பட்ட வாக்கியத்துக்கு ஒரு சிறப்பு வடிவம் இருக்கு — LET!",
  tl:"Ippo randaavadhu — kattalai (imperative). 'Open the door.' Idhula subject enga? Theriyala! Aanaa adhu 'you' thaan. Ippadippatta vaakkiyaththukku oru sirappu vadivam irukku — LET!"},
 {ta:"'Open the door' → 'LET the door BE OPENED.' எதிர்மறையா இருந்தா — 'Do not open the door' → 'LET the door NOT BE OPENED.' இந்த LET வடிவம் SSC-ல ஒவ்வொரு வருஷமும் வரும்.",
  tl:"'Open the door' → 'LET the door BE OPENED.' Edhirmaraiyaa irundhaa — 'LET the door NOT BE OPENED.' Indha LET vadivam SSC-la ovvoru varushamum varum."},
 {ta:"ஆனா கவனிங்க — 'please' இருந்தா அது கட்டளை இல்ல, வேண்டுகோள்! அப்போ LET வராது. 'Please help me' → 'YOU ARE REQUESTED TO help me.' அறிவுரையா இருந்தா — 'Work hard' → 'YOU ARE ADVISED TO work hard.' எச்சரிக்கையா இருந்தா — 'YOU ARE WARNED NOT TO...'. மேலும் have to, need to, ought to — இதெல்லாம் modal மாதிரியே. 'You have to submit it' → 'It HAS TO BE SUBMITTED by you.'",
  tl:"Aanaa kavaninga — 'please' irundhaa adhu kattalai illa, vendugol! 'Please help me' → 'YOU ARE REQUESTED TO help me.' 'Work hard' → 'YOU ARE ADVISED TO work hard.' Melum have to, need to, ought to — idhellaam modal maadhiriye."}]},

/* ========== RULE 107 ========== */
{n:107,rc:"VOI-04",d:"Hard",t:"Verbs with TWO Objects and the IMPERSONAL Passive",
 tam:"இரு செயப்படுபொருள் · It is said that... அமைப்பு",
 s1:{en:"A verb with TWO objects gives TWO possible passives — usually the PERSON is made the subject. And with SAY, BELIEVE, REPORT, THINK, KNOW, CONSIDER, the passive uses the IMPERSONAL pattern: 'It is said that…' or 'He is said to…'.",
  ta:"இரண்டு object-கள் உள்ள ஒரு வினைச்சொல் இரண்டு சாத்தியமான passive-களைத் தருகிறது — பொதுவாக நபர் Subject ஆக்கப்படுகிறார். மேலும் SAY, BELIEVE, REPORT, THINK, KNOW, CONSIDER-உடன், passive IMPERSONAL பாணியைப் பயன்படுத்துகிறது: 'It is said that…' அல்லது 'He is said to…'.",
  tl:"Irandu object-gal ulla oru vinaichol irandu saaththiyamaana passive-galaith tharugiradhu — podhuvaaga nabar Subject aakkappadugiraar. Melum SAY, BELIEVE, REPORT-udan, passive IMPERSONAL paaniyaip payanpaduththugiradhu.",
  formula:"TWO OBJECTS → TWO PASSIVES\n\n  He gave me a book.\n    → I was given a book by him.   (preferred)\n    → A book was given to me by him.\n\n  ⚠ Note the 'TO' in the second form.\n\nIMPERSONAL PASSIVE\n\n  People say that he is honest.\n    → IT IS SAID THAT he is honest.\n    → HE IS SAID TO BE honest.\n\n  Verbs: say · believe · report · think\n         know · consider · suppose · expect"},

 s2:[
 {h:"The person usually becomes the subject",
  en:"'He gave me a book' has two objects — 'me' (person) and 'a book' (thing). Both can become the subject, but 'I was given a book' is the natural, preferred form and the one exams usually want.",
  ta:"பொதுவாக நபர் Subject ஆகிறார். 'He gave me a book'-ல் இரண்டு object-கள் உள்ளன — 'me' (நபர்) மற்றும் 'a book' (பொருள்). இரண்டும் Subject ஆக முடியும், ஆனால் 'I was given a book' இயற்கையான, விரும்பப்படும் வடிவம், தேர்வுகள் பொதுவாக விரும்புவது அதுதான்.",
  tl:"Podhuvaaga nabar Subject aagiraar. 'He gave me a book'-l irandu object-gal ullana. Irandum Subject aaga mudiyum, aanaal 'I was given a book' iyarkaiyaana, virumbappadum vadivam."},
 {h:"The thing-first version needs TO or FOR",
  en:"'A book was given TO me by him' — the preposition 'to' appears because the person is no longer the subject. Verbs of giving take 'to'; verbs like buy and make take 'for': 'A cake was made FOR me'.",
  ta:"பொருள் முதலில் வரும் பதிப்புக்கு TO அல்லது FOR தேவை. 'A book was given TO me by him' — நபர் இனி Subject இல்லாததால் 'to' முன்னுருபு தோன்றுகிறது. கொடுக்கும் வினைச்சொற்கள் 'to' எடுக்கின்றன; buy மற்றும் make போன்ற வினைச்சொற்கள் 'for' எடுக்கின்றன: 'A cake was made FOR me'.",
  tl:"Porul mudhalil varum padhippukku TO alladhu FOR thevai. 'A book was given TO me by him'. Kodukkum vinaichorkal 'to' edukkindrana; buy matrum make pondra vinaichorkal 'for' edukkindrana."},
 {h:"The impersonal passive has two forms",
  en:"'People say he is honest' becomes either 'IT IS SAID THAT he is honest' or 'HE IS SAID TO BE honest'. Both are correct. The second form needs an infinitive, so 'is' becomes 'to be'.",
  ta:"Impersonal passive-க்கு இரண்டு வடிவங்கள் உள்ளன. 'People say he is honest' 'IT IS SAID THAT he is honest' அல்லது 'HE IS SAID TO BE honest' ஆகிறது. இரண்டும் சரி. இரண்டாவது வடிவத்திற்கு ஒரு infinitive தேவை, எனவே 'is' 'to be' ஆகிறது.",
  tl:"Impersonal passive-kku irandu vadivangal ullana. 'IT IS SAID THAT he is honest' alladhu 'HE IS SAID TO BE honest'. Irandum sari."},
 {h:"For a past inner clause use TO HAVE + V3",
  en:"'People say he WAS honest' → 'He is said TO HAVE BEEN honest'. When the inner clause is in the past, the infinitive becomes 'to have + V3'. This is the hardest form in Voice.",
  ta:"கடந்தகால உள் clause-க்கு TO HAVE + V3 பயன்படுத்தவும். 'People say he WAS honest' → 'He is said TO HAVE BEEN honest'. உள் clause இறந்த காலத்தில் இருக்கும்போது, infinitive 'to have + V3' ஆகிறது. இது Voice-ல் மிகக் கடினமான வடிவம்.",
  tl:"Kadandhakaala ul clause-kku TO HAVE + V3 payanpaduththavum. 'People say he WAS honest' → 'He is said TO HAVE BEEN honest'. Idhu Voice-l migak kadinamaana vadivam."}],

 s3:[
 {h:"Two objects, two passives",
  d:"   He gave  ME   a book.\n            ↑      ↑\n         person  thing\n\n   PREFERRED (person first):\n     I was given a book by him.\n\n   ALTERNATIVE (thing first):\n     A book was given TO me by him.\n                       ↑\n              the preposition appears\n\n   GIVE-type verbs → TO\n   BUY / MAKE-type → FOR"},
 {h:"The impersonal passive",
  d:"   People SAY that he is honest.\n\n   FORM 1:  IT IS SAID THAT he is honest.\n   FORM 2:  HE IS SAID TO BE honest.\n\n   THE VERBS:\n     say · believe · report · think\n     know · consider · suppose · expect\n     understand · presume · allege"},
 {h:"Past inner clause → TO HAVE + V3",
  d:"   PRESENT inner clause:\n     People say he IS honest.\n       → He is said TO BE honest.\n\n   PAST inner clause:\n     People say he WAS honest.\n       → He is said TO HAVE BEEN honest.\n\n     People believe he STOLE it.\n       → He is believed TO HAVE STOLEN it.\n\n   ⚠ Past inside → 'to have + V3'"}],

 s4:{
 wrong:["\"Only the thing can become the subject.\" — The person is usually preferred.",
  "\"'A book was given me' is complete.\" — It needs 'to me'.",
  "\"'It is said he is honest' needs no 'that'.\" — The impersonal form requires 'that'.",
  "\"'He is said to be honest' works for a past clause too.\" — A past clause needs 'to have been'."],
 right:["Make the PERSON the subject in the preferred passive.",
  "Add 'to' or 'for' when the thing becomes the subject.",
  "Use 'It is said that…' or 'He is said to…'.",
  "For a past inner clause use 'to have + V3'."]},

 s5:[
 {en:"I was given a beautiful book by him.",ta:"அவரால் எனக்கு ஒரு அழகான புத்தகம் கொடுக்கப்பட்டது.",tl:"Avaraal enakku oru azhagaana puththagam kodukkappattadhu.",note:"The person becomes the subject — the preferred form."},
 {en:"A book was given to me by him yesterday.",ta:"நேற்று அவரால் எனக்கு ஒரு புத்தகம் கொடுக்கப்பட்டது.",tl:"Netru avaraal enakku oru puththagam kodukkappattadhu.",note:"The thing becomes the subject → 'to me' appears."},
 {en:"It is said that he is a very honest officer.",ta:"அவர் மிக நேர்மையான அதிகாரி என்று சொல்லப்படுகிறது.",tl:"Avar miga nermaiyaana adhigaari endru sollappadugiradhu.",note:"The impersonal passive → IT IS SAID THAT."},
 {en:"He is said to be a very honest officer.",ta:"அவர் மிக நேர்மையான அதிகாரி என்று சொல்லப்படுகிறார்.",tl:"Avar miga nermaiyaana adhigaari endru sollappadugiraar.",note:"The second impersonal form → HE IS SAID TO BE."},
 {en:"He is believed to have stolen the money.",ta:"அவர் பணத்தைத் திருடியதாக நம்பப்படுகிறது.",tl:"Avar panaththaith thirudiyadhaaga nambappadugiradhu.",note:"A past inner clause → TO HAVE + V3."}],

 s9:[
 "Fill in the Blank|It is widely believed ____ the new policy will benefit small farmers considerably.|—;that|1|The impersonal passive requires 'that'.",
 "Find the Error|A silver medal (A) was awarded him (B) by the chief guest (C) at the closing ceremony (D).|A;B;C;D|1|Part B. The thing-first passive requires 'awarded to him'.",
 "Sentence Improvement|He is believed to steal the documents from the office last month.|to steal;to have stolen;to be stolen|1|A past inner clause requires 'to have stolen'.",
 "Fill in the Blank|The chief minister ____ said to be considering a major reshuffle of his cabinet.|are;is|1|A singular subject requires 'is'.",
 "Find the Error|It is reported (A) the flood waters (B) have receded (C) in most of the affected areas (D).|A;B;C;D|0|Part A. The impersonal passive requires 'It is reported that'."],

 s10:{
  en:"The missing 'to' is the quiet killer — 'A book was given me' feels complete but needs 'to me'. The impersonal passive trips people up in two places: the missing 'that' after 'It is said', and the past form. 'He is believed to steal it' means he steals habitually; 'to have stolen' means he stole once, in the past.",
  ta:"விடுபட்ட 'to' அமைதியான கொலையாளி — 'A book was given me' முழுமையாக உணரப்படுகிறது ஆனால் 'to me' தேவை. Impersonal passive இரண்டு இடங்களில் மக்களைத் தடுமாறச் செய்கிறது: 'It is said'-க்குப் பிறகு விடுபட்ட 'that', மற்றும் இறந்தகால வடிவம். 'He is believed to steal it' என்றால் அவர் பழக்கமாகத் திருடுகிறார்; 'to have stolen' என்றால் அவர் ஒரு முறை, கடந்த காலத்தில் திருடினார்.",
  tl:"Vidubatta 'to' amaidhiyaana kolaiyaali — 'A book was given me' muzhumaiyaaga unarappadugiradhu aanaal 'to me' thevai. Impersonal passive irandu idangalil makkalaith thadumaarach seygiradhu."},

 s11:{
  en:"PERSON FIRST is preferred. THING FIRST needs 'to' or 'for'. Past inside needs 'to have + V3'.",
  ta:"நபர் முதல்ல விரும்பப்படுகிறது. பொருள் முதல்ல வந்தா 'to' அல்லது 'for' தேவை. உள்ளே இறந்தகாலம் இருந்தா 'to have + V3'.",
  tl:"Nabar mudhalla virumbappadugiradhu. Porul mudhalla vandhaa 'to' alladhu 'for' thevai. Ulle irandhakaalam irundhaa 'to have + V3'.",
  vis:"      TWO OBJECTS, TWO PASSIVES\n\n   He gave ME a book.\n\n   PREFERRED:  I was given a book by him.\n   ALTERNATIVE: A book was given TO me by him.\n                                  ↑\n                     GIVE-type → TO\n                     BUY / MAKE → FOR\n\n      THE IMPERSONAL PASSIVE\n\n   People SAY that he is honest.\n     → IT IS SAID THAT he is honest.\n     → HE IS SAID TO BE honest.\n\n   VERBS: say · believe · report · think\n          know · consider · suppose · expect\n\n   ⚠ PAST INNER CLAUSE → TO HAVE + V3\n     People say he WAS honest.\n       → He is said TO HAVE BEEN honest.\n     People believe he STOLE it.\n       → He is believed TO HAVE STOLEN it."},

 s12:[

 s13:[
 "____ was given a book by ____ , and it was ____ than any ____ gift I received.|I-him-better-other;Me-he-more better-other;I-he-better-—|0|The person becomes the subject → I. After BY → HIM. No double comparative (Rule 95). Same group → OTHER (Rule 96).",
 "It is said ____ he is honest, and he is ____ respected in his department.|that-highly;—-high;that-high|0|The impersonal passive needs THAT. HIGHLY = degree (Rule 99).",
 "He is believed to ____ stolen it, ____ neither the police ____ the court could prove it.|have-although-nor;—-although but-or;have-although but-nor|0|A past inner clause → TO HAVE. One conjunction only (Rule 88). NEITHER pairs with NOR.",
 "A book was given ____ me, and hardly ____ I opened it when the bell rang.|to-had;—-had;to-did|0|The thing-first passive needs TO. Inversion after HARDLY, with HAD + V3 (Rule 102).",
 "It is reported ____ the number of victims ____ risen, and ____ information is awaited.|that-has-further;—-have-farther;that-have-further|0|The impersonal passive needs THAT. 'THE number of' is singular → HAS (Rule 103). Abstract addition → FURTHER (Rule 98)."],

 s14:{
  rule:"A verb with two objects gives two passives, and say/believe/report take the impersonal pattern.",
  formula:"TWO OBJECTS: person first (preferred) | thing first + TO or FOR\nIMPERSONAL: It is said THAT… / He is said TO BE…\nVerbs: say, believe, report, think, know, consider, suppose, expect\nPAST INNER CLAUSE → to have + V3",
  memory:"Person first is preferred. Past inside needs 'to have + V3'.",
  ta:"நபர் முதல்ல வர்றது சிறந்தது. உள்ள இறந்தகாலம் இருந்தா 'to have + V3'.",
  tl:"Nabar mudhalla varradhu sirandhadhu. Ulla irandhakaalam irundhaa 'to have + V3'.",
  mistake:"Writing 'A book was given me' without 'to', and 'It is said he is honest' without 'that'.",
  exam:"SSC CGL / CHSL and Bank — the impersonal passive is a repeated 1-mark Voice item."},

 s15:[
 {ta:"இந்த rule-ல ரெண்டு சிறப்பு அமைப்பு இருக்கு. ரெண்டுமே SSC-ல அடிக்கடி வரும்.",
  tl:"Indha rule-la rendu sirappu amaippu irukku. Rendume SSC-la adikkadi varum."},
 {ta:"முதல்ல — ரெண்டு object இருக்கிற வினைச்சொல். 'He gave ME a book.' இதுல ரெண்டு object இருக்கு — 'me' (நபர்) மற்றும் 'a book' (பொருள்). ரெண்டையும் subject ஆக்கலாம்!",
  tl:"Mudhalla — rendu object irukkira vinaichol. 'He gave ME a book.' Idhula rendu object irukku — 'me' (nabar) matrum 'a book' (porul). Rendaiyum subject aakkalaam!"},
 {ta:"விரும்பப்படும் வடிவம் — நபரை subject ஆக்குறது. 'I was given a book by him.' இது இயற்கையா இருக்கு. இன்னொரு வடிவம் — 'A book was given TO me by him.' இங்க கவனிங்க — 'TO' வந்திடுச்சு! ஏன்னா நபர் இப்போ subject இல்ல.",
  tl:"Virumbappadum vadivam — nabarai subject aakkuradhu. 'I was given a book by him.' Innoru vadivam — 'A book was given TO me by him.' Inga kavaninga — 'TO' vandhiduchu!"},
 {ta:"நிறைய பேரு 'A book was given me' அப்படின்னு எழுதிடுவாங்க — 'to' -ஐ மறந்துடுவாங்க. அது தப்பு. மேலும் — give, send, tell, offer, pay போன்ற வினைச்சொல்லுக்கு 'TO'. ஆனா buy, make, get, cook போன்றதுக்கு 'FOR'! 'A cake was made FOR me.'",
  tl:"Neraiya peru 'A book was given me' appadinnu ezhudhiduvaanga — 'to'-ai marandhuduvaanga. Give, send, tell, offer-kku 'TO'. Aanaa buy, make, get, cook-kku 'FOR'!"},
 {ta:"இப்போ ரெண்டாவது அமைப்பு — impersonal passive. 'People SAY that he is honest.' இங்க 'people' யாரு? தெரியல, முக்கியமும் இல்ல. இப்படிப்பட்டதுக்கு ரெண்டு passive வடிவம் இருக்கு. வடிவம் 1 — 'IT IS SAID THAT he is honest.' வடிவம் 2 — 'HE IS SAID TO BE honest.'",
  tl:"Ippo randaavadhu amaippu — impersonal passive. 'People SAY that he is honest.' Vadivam 1 — 'IT IS SAID THAT he is honest.' Vadivam 2 — 'HE IS SAID TO BE honest.'"},
 {ta:"இந்த வினைச்சொல் பட்டியல் மனப்பாடம் பண்ணுங்க — say, believe, report, think, know, consider, suppose, expect, understand. கடைசியா மிக முக்கியமான ஒரு நுட்பம் — உள்ள clause-ல இறந்தகாலம் இருந்தா என்ன ஆகும்? 'People say he WAS honest' → 'He is said TO HAVE BEEN honest.' 'People believe he STOLE it' → 'He is believed TO HAVE STOLEN it.' கவனிங்க — 'to have + V3'! இது Voice-ல மிகக் கடினமான வடிவம், ஆனா தேர்வுல அடிக்கடி வரும்.",
  tl:"Indha vinaichol pattiyal manappaadam pannunga — say, believe, report, think, know, consider, suppose, expect. Kadaisiyaa — ulla clause-la irandhakaalam irundhaa? 'He is said TO HAVE BEEN honest.' 'He is believed TO HAVE STOLEN it.' 'to have + V3'!"}]},

/* ========== RULE 108 ========== */
{n:108,rc:"VOI-05",d:"Medium",t:"Verbs that CANNOT be Passive, and Passives with special Prepositions",
 tam:"Intransitive verb-க்கு passive இல்லை · Known TO, Surprised AT",
 s1:{en:"INTRANSITIVE verbs — those with no object — have no passive: sleep, come, go, die, happen, rise, arrive, laugh, sit, fall. And some passives take a preposition other than BY: KNOWN TO, SURPRISED AT, PLEASED WITH, TIRED OF, FILLED WITH, INTERESTED IN, CONTAINED IN.",
  ta:"INTRANSITIVE வினைச்சொற்கள் — object இல்லாதவை — passive இல்லை: sleep, come, go, die, happen, rise, arrive, laugh, sit, fall. மேலும் சில passive-கள் BY-ஐத் தவிர வேறு முன்னுருபு எடுக்கின்றன: KNOWN TO, SURPRISED AT, PLEASED WITH, TIRED OF, FILLED WITH, INTERESTED IN, CONTAINED IN.",
  tl:"INTRANSITIVE vinaichorkal — object illaadhavai — passive illai: sleep, come, go, die, happen, rise, arrive, laugh, sit, fall. Melum sila passive-gal BY-aith thavira veru munnurubu edukkindrana.",
  formula:"NO PASSIVE (intransitive — no object)\n  sleep · come · go · die · happen\n  rise · arrive · laugh · sit · fall\n  appear · seem · belong · consist\n\n  ✘ 'He was slept' · 'It was happened'\n\nPASSIVES WITH A SPECIAL PREPOSITION\n  known TO       surprised AT / BY\n  pleased WITH   tired OF\n  filled WITH    interested IN\n  contained IN   annoyed WITH\n  covered WITH   satisfied WITH\n  acquainted WITH  disappointed WITH"},

 s2:[
 {h:"No object means no passive",
  en:"'He sleeps' — there is nothing to move to the front. Ask 'sleeps what?' — the question has no answer. Without an object there is nothing to become the new subject, so the passive is impossible.",
  ta:"Object இல்லை என்றால் passive இல்லை. 'He sleeps' — முன்னால் நகர்த்த எதுவும் இல்லை. 'Sleeps what?' என்று கேளுங்கள் — கேள்விக்கு விடை இல்லை. Object இல்லாமல் புதிய Subject ஆக ஏதும் இல்லை, எனவே passive சாத்தியமற்றது.",
  tl:"Object illai endraal passive illai. 'He sleeps' — munnaal nagarththa edhuvum illai. 'Sleeps what?' endru kelungal — kelvikku vidai illai."},
 {h:"'Was happened' is a very common Indian-English error",
  en:"'The accident was happened yesterday' is wrong — 'happen' takes no object. It must be 'The accident happened yesterday'. The same for 'was arrived', 'was died', 'was risen'.",
  ta:"'Was happened' மிகப் பொதுவான இந்திய ஆங்கிலத் தவறு. 'The accident was happened yesterday' தவறு — 'happen' object எடுக்காது. அது 'The accident happened yesterday' என்றுதான் இருக்க வேண்டும். 'Was arrived', 'was died', 'was risen'-க்கும் அதேதான்.",
  tl:"'Was happened' migap podhuvaana Indhiya Aangilath thavaru. 'The accident was happened yesterday' thavaru — 'happen' object edukkaadhu."},
 {h:"Some passives take a preposition of feeling",
  en:"'I was surprised AT the news', not 'by the news'. 'She was pleased WITH the result'. 'He is known TO everyone here'. These prepositions describe a reaction, not an agent, so 'by' does not fit.",
  ta:"சில passive-கள் உணர்வு முன்னுருபு எடுக்கின்றன. 'I was surprised AT the news', 'by the news' அல்ல. 'She was pleased WITH the result'. 'He is known TO everyone here'. இந்த முன்னுருபுகள் ஒரு எதிர்வினையை விவரிக்கின்றன, ஒரு செயல்படுத்துபவரை அல்ல, எனவே 'by' பொருந்தாது.",
  tl:"Sila passive-gal unarvu munnurubu edukkindrana. 'I was surprised AT the news', 'by the news' alla. 'He is known TO everyone here'."},
 {h:"KNOWN takes TO for people and FOR for qualities",
  en:"'He is known TO me' — I know him personally. 'He is known FOR his honesty' — that is what he is famous for. Two different prepositions, two different meanings, and both are tested.",
  ta:"KNOWN மனிதர்களுக்கு TO எடுக்கிறது, குணங்களுக்கு FOR. 'He is known TO me' — நான் அவரை நேரில் அறிவேன். 'He is known FOR his honesty' — அதற்காகத்தான் அவர் பிரபலம். இரண்டு வெவ்வேறு முன்னுருபுகள், இரண்டு வெவ்வேறு பொருள்கள், இரண்டுமே சோதிக்கப்படுகின்றன.",
  tl:"KNOWN manidhargalukku TO edukkiradhu, gunangalukku FOR. 'He is known TO me' — naan avarai neril ariven. 'He is known FOR his honesty' — adharkaagaththaan avar pirabalam."}],

 s3:[
 {h:"Ask 'verb what?'",
  d:"   'He WRITES.'   →  Writes WHAT?  a letter ✔\n                      → object exists\n                      → PASSIVE POSSIBLE\n\n   'He SLEEPS.'   →  Sleeps WHAT?   ✘\n                      → no object\n                      → NO PASSIVE\n\n   NO PASSIVE:\n     sleep · come · go · die · happen\n     rise · arrive · laugh · sit · fall\n     appear · seem · belong · consist"},
 {h:"The common Indian-English errors",
  d:"   ✘ The accident WAS HAPPENED yesterday.\n   ✔ The accident HAPPENED yesterday.\n\n   ✘ He WAS ARRIVED at ten o'clock.\n   ✔ He ARRIVED at ten o'clock.\n\n   ✘ The old man WAS DIED last week.\n   ✔ The old man DIED last week.\n\n   ✘ The sun WAS RISEN early.\n   ✔ The sun ROSE early."},
 {h:"Passives that do not take BY",
  d:"   TO    known TO · married TO\n   AT    surprised AT · shocked AT\n         astonished AT · alarmed AT\n   WITH  pleased WITH · satisfied WITH\n         filled WITH · covered WITH\n         annoyed WITH · acquainted WITH\n   IN    interested IN · contained IN\n         involved IN · engaged IN\n   OF    tired OF · composed OF\n   FOR   known FOR (a quality)\n\n   ⚠ known TO a person\n     known FOR a quality"}],

 s4:{
 wrong:["\"Every verb has a passive form.\" — Intransitive verbs do not.",
  "\"'The accident was happened' is more formal.\" — 'Happen' takes no object.",
  "\"'I was surprised by the news' is the only form.\" — 'Surprised at' is the standard.",
  "\"'Known to' and 'known for' are interchangeable.\" — One is a person, the other a quality."],
 right:["Ask 'verb what?' — no answer means no passive.",
  "Never write 'was happened', 'was arrived', 'was died'.",
  "Learn the special prepositions: known to, surprised at, pleased with.",
  "'Known to' a person, 'known for' a quality."]},

 s8:[

 "Find the Error|The old gentleman (A) was died peacefully (B) in his sleep (C) early last Tuesday (D).|A;B;C;D|1|Part B. 'Die' is intransitive → 'died peacefully'."],

 s10:{
  en:"'The accident was happened' is one of the most persistent Indian-English errors, because we feel that anything in the past 'happened to' something and so should look passive. It cannot: 'happen' has no object. The second layer is prepositions — 'surprised by' and 'pleased at' both feel acceptable but the standard forms are 'surprised at' and 'pleased with'.",
  ta:"'The accident was happened' மிகவும் நிலைத்திருக்கும் இந்திய ஆங்கிலத் தவறுகளில் ஒன்று, ஏனெனில் கடந்த காலத்தில் எதுவும் ஏதோ ஒன்றுக்கு 'நிகழ்ந்தது' என்று உணர்கிறோம், எனவே அது passive போலத் தோன்ற வேண்டும். அது முடியாது: 'happen'-க்கு object இல்லை. இரண்டாவது அடுக்கு முன்னுருபுகள் — 'surprised by' மற்றும் 'pleased at' இரண்டும் ஏற்கத்தக்கதாக உணரப்படுகின்றன ஆனால் நிலையான வடிவங்கள் 'surprised at' மற்றும் 'pleased with'.",
  tl:"'The accident was happened' migavum nilaiththirukkum Indhiya Aangilath thavarugalil ondru. Adhu mudiyaadhu: 'happen'-kku object illai. Irandaavadhu adukku munnurubugal."},

 s11:{
  en:"ASK 'VERB WHAT?' No answer means no passive. And not every passive takes BY.",
  ta:"'Verb what?' என்று கேளுங்கள். விடை இல்லை என்றால் passive இல்லை. மேலும் ஒவ்வொரு passive-ம் BY எடுக்காது.",
  tl:"'Verb what?' endru kelungal. Vidai illai endraal passive illai. Melum ovvoru passive-um BY edukkaadhu.",
  vis:"      NO OBJECT, NO PASSIVE\n\n   'He WRITES' → writes WHAT? a letter ✔\n                  → PASSIVE POSSIBLE\n   'He SLEEPS' → sleeps WHAT?   ✘\n                  → NO PASSIVE\n\n   NEVER PASSIVE:\n     sleep · come · go · die · happen\n     rise · arrive · laugh · sit · fall\n     appear · seem · belong · consist\n\n   ⚠ THE INDIAN-ENGLISH TRAP:\n     ✘ was happened   ✔ happened\n     ✘ was arrived    ✔ arrived\n     ✘ was died       ✔ died\n\n      PASSIVES THAT DO NOT TAKE 'BY'\n\n   TO   known TO · married TO\n   AT   surprised AT · shocked AT\n   WITH pleased WITH · filled WITH\n        covered WITH · satisfied WITH\n   IN   interested IN · contained IN\n   OF   tired OF · composed OF\n   FOR  known FOR (a quality)"},

 s13:[
 "The accident ____ yesterday, and hardly ____ we heard when the police arrived.|happened-had;was happened-had;happened-did|0|'Happen' is intransitive. Inversion after HARDLY with HAD + V3 (Rule 102).",
 "He is known ____ everyone here and known ____ his honesty, which is ____ to none.|to-for-second;for-to-second;to-for-secondly|0|KNOWN TO a person, KNOWN FOR a quality. 'Second to none' is a fixed phrase.",
 "I was surprised ____ the news, and neither my wife ____ my son ____ told me earlier.|at-nor-had;by-or-had;at-nor-have|0|SURPRISED takes AT. NEITHER pairs with NOR (Rule 86). Nearest subject → HAD.",
 "The old man ____ last week, ____ he ____ been ill ____ many months.|died-although-had-for;was died-although but-had-since;died-although but-had-for|0|'Die' is intransitive. One conjunction only (Rule 88). 'For many months' (Preposition Rule 73).",
 "The teacher was pleased ____ his answer, which was ____ to every ____ answer in the class.|with-superior-other;at-more superior-other;with-superior-—|0|PLEASED takes WITH. 'Superior' is already comparative (Rule 95). Same group → OTHER (Rule 96)."],

 s14:{
  rule:"Intransitive verbs have no passive, and some passives take a preposition other than BY.",
  formula:"NO PASSIVE: sleep, come, go, die, happen, rise, arrive,\n  laugh, sit, fall, appear, seem, belong, consist\nSPECIAL PREPOSITIONS:\n  known TO (person) · known FOR (quality)\n  surprised / shocked AT · pleased / filled / covered WITH\n  interested / contained IN · tired / composed OF",
  memory:"Ask 'verb what?'. No answer, no passive.",
  ta:"'Verb what?' -ன்னு கேளுங்க. பதில் இல்லைன்னா passive இல்ல.",
  tl:"'Verb what?'-nnu kelunga. Padhil illainnaa passive illa.",
  mistake:"Writing 'was happened', 'was arrived', 'was died' and 'known by'.",
  exam:"SSC CGL / CHSL, RRB and Bank — 'was happened' is one of the most repeated Error Spotting items."},

 s15:[
 {ta:"Voice-ஓட கடைசி rule. இதுல ரெண்டு விஷயம் — எதுக்கு passive இல்ல, மற்றும் எந்த passive-க்கு 'by' வராது.",
  tl:"Voice-oda kadaisi rule. Idhula rendu vishayam — edhukku passive illa, matrum endha passive-kku 'by' varaadhu."},
 {ta:"முதல்ல ஒரு எளிய கேள்வி — passive பண்ணனும்னா object வேணும் இல்லையா? object-ஐ முன்னால கொண்டு வர்றோம். object இல்லைன்னா என்ன கொண்டு வர்றது?",
  tl:"Mudhalla oru eliya kelvi — passive pannanumnaa object venum illaiyaa? Object-ai munnaala kondu varrom. Object illainnaa enna kondu varradhu?"},
 {ta:"சோதனை ரொம்ப எளிது — 'வினைச்சொல் + WHAT?' -ன்னு கேளுங்க. 'He writes WHAT?' — 'a letter'! object இருக்கு, passive முடியும். 'He sleeps WHAT?' — பதிலே இல்ல! object இல்ல, passive முடியாது.",
  tl:"Sodhanai romba eladhu — 'vinaichol + WHAT?'-nnu kelunga. 'He writes WHAT?' — 'a letter'! 'He sleeps WHAT?' — padhile illa!"},
 {ta:"இப்படிப்பட்ட வினைச்சொல் — sleep, come, go, die, happen, rise, arrive, laugh, sit, fall, appear, seem, belong, consist. இதுக்கெல்லாம் passive-ஏ கிடையாது!",
  tl:"Ippadippatta vinaichol — sleep, come, go, die, happen, rise, arrive, laugh, sit, fall, appear, seem, belong, consist. Idhukkellaam passive-e kidaiyaadhu!"},
 {ta:"இப்போ ஒரு மிக முக்கியமான இந்திய ஆங்கிலத் தப்பு — 'The accident WAS HAPPENED yesterday.' இது நமக்கு சரியா தோணும், ஆனா தப்பு! 'The accident HAPPENED yesterday' தான் சரி. அதே மாதிரி 'was arrived' தப்பு, 'arrived' சரி. 'Was died' தப்பு, 'died' சரி. SSC இதை ஒவ்வொரு வருஷமும் கேட்குது.",
  tl:"Ippo oru miga mukkiyamaana Indhiya Aangilath thappu — 'The accident WAS HAPPENED yesterday.' Idhu namakku sariyaa thonum, aanaa thappu! 'The accident HAPPENED yesterday' thaan sari."},
 {ta:"கடைசியா ரெண்டாவது விஷயம் — எல்லா passive-க்கும் 'by' வராது! உணர்வு காட்டுற passive-க்கு வேற முன்னுருபு. 'Surprised AT', 'shocked AT', 'pleased WITH', 'satisfied WITH', 'filled WITH', 'covered WITH', 'interested IN', 'tired OF', 'composed OF'. இதுல ஒரு அழகான ஜோடி இருக்கு — 'known TO' மற்றும் 'known FOR'! 'He is known TO me' (எனக்கு அவரைத் தெரியும் — நபர்). 'He is known FOR his honesty' (நேர்மைக்காக பிரபலம் — குணம்). ரெண்டும் வேற வேற அர்த்தம்!",
  tl:"Kadaisiyaa — ellaa passive-kkum 'by' varaadhu! 'Surprised AT', 'pleased WITH', 'filled WITH', 'interested IN', 'tired OF'. Idhula oru azhagaana jodi — 'known TO' (nabar) matrum 'known FOR' (gunam)!"}]},
/* ========== RULE 109 ========== */
{n:109,rc:"NAR-01",d:"Hard",t:"DIRECT to INDIRECT — the Reporting Verb and TENSE BACKSHIFT",
 tam:"Reporting verb இறந்தகாலமா இருந்தா, உள்ளே ஒரு படி பின்னால் நகரும்",
 s1:{en:"If the REPORTING VERB is in the PAST (said, told, asked), every tense inside the quotation moves ONE STEP BACK. If the reporting verb is in the PRESENT or FUTURE, nothing changes.",
  ta:"REPORTING VERB இறந்த காலத்தில் இருந்தால் (said, told, asked), மேற்கோளுக்குள் உள்ள ஒவ்வொரு காலமும் ஒரு படி பின்னால் நகர்கிறது. Reporting verb நிகழ்காலத்திலோ எதிர்காலத்திலோ இருந்தால், எதுவும் மாறாது.",
  tl:"REPORTING VERB irandha kaalaththil irundhaal (said, told, asked), merkolukkul ulla ovvoru kaalamum oru padi pinnaal nagargiradhu. Reporting verb nigazhkaalaththilo edhirkaalaththilo irundhaal, edhuvum maaraadhu.",
  formula:"THE BACKSHIFT LADDER\n\n  V1 (write)        →  V2 (wrote)\n  am / is / are     →  was / were\n  V2 (wrote)        →  had written\n  was / were        →  had been\n  have / has V3     →  had V3\n  had V3            →  had V3  (no change)\n  will              →  would\n  can               →  could\n  may               →  might\n  shall             →  should\n  must              →  had to / must\n\n⚠ NO CHANGE if the reporting verb is\n  in the PRESENT or FUTURE."},

 s2:[
 {h:"Only a PAST reporting verb causes the shift",
  en:"'He SAYS, \"I am busy\"' → 'He says that he IS busy' — no change. 'He SAID, \"I am busy\"' → 'He said that he WAS busy' — the shift happens. Check the reporting verb first, always.",
  ta:"இறந்தகால reporting verb மட்டுமே மாற்றத்தை ஏற்படுத்துகிறது. 'He SAYS, \"I am busy\"' → 'He says that he IS busy' — மாற்றம் இல்லை. 'He SAID, \"I am busy\"' → 'He said that he WAS busy' — மாற்றம் நடக்கிறது. எப்போதும் முதலில் reporting verb-ஐச் சரிபாருங்கள்.",
  tl:"Irandhakaala reporting verb mattume maatraththai erpaduththugiradhu. 'He SAYS' → no change. 'He SAID' → the shift happens. Eppodhum mudhalil reporting verb-aich saripaarungal."},
 {h:"SAY becomes TELL when a listener is named",
  en:"'He said to me' becomes 'He TOLD me'. 'He said' with no listener stays 'He said'. The rule: 'say to somebody' → 'tell somebody'; 'tell' never takes 'to' before the person.",
  ta:"கேட்பவர் பெயரிடப்பட்டால் SAY, TELL ஆகிறது. 'He said to me' 'He TOLD me' ஆகிறது. கேட்பவர் இல்லாத 'He said' 'He said'-ஆகவே இருக்கிறது. விதி: 'say to somebody' → 'tell somebody'; 'tell' நபருக்கு முன் ஒருபோதும் 'to' எடுக்காது.",
  tl:"Ketpavar peyaridappattaal SAY, TELL aagiradhu. 'He said to me' 'He TOLD me' aagiradhu. Vidhi: 'say to somebody' → 'tell somebody'; 'tell' orupodhum 'to' edukkaadhu."},
 {h:"Universal truths never shift",
  en:"'The teacher said, \"The sun rises in the east\"' → 'The teacher said that the sun RISES in the east' — not 'rose'. A permanent truth, a habitual fact, or a proverb keeps the present tense.",
  ta:"உலகளாவிய உண்மைகள் ஒருபோதும் மாறாது. 'The teacher said, \"The sun rises in the east\"' → 'The teacher said that the sun RISES in the east' — 'rose' அல்ல. ஒரு நிரந்தர உண்மை, ஒரு பழக்கமான உண்மை, அல்லது ஒரு பழமொழி நிகழ்காலத்தைத் தக்கவைக்கிறது.",
  tl:"Ulagalaaviya unmaigal orupodhum maaraadhu. 'The teacher said that the sun RISES in the east' — 'rose' alla. Oru nirandhara unmai nigazhkaalaththaith thakkavaikkiradhu."},
 {h:"A definite past date blocks the shift too",
  en:"'He said, \"India became free in 1947\"' → 'He said that India BECAME free in 1947' — not 'had become'. When a historical date is fixed, the simple past stays.",
  ta:"ஒரு திட்டவட்டமான கடந்தகால தேதியும் மாற்றத்தைத் தடுக்கிறது. 'He said, \"India became free in 1947\"' → 'He said that India BECAME free in 1947' — 'had become' அல்ல. ஒரு வரலாற்று தேதி நிலையாக இருக்கும்போது, எளிய இறந்த காலம் அப்படியே இருக்கிறது.",
  tl:"Oru thittavattamaana kadandhakaala thedhiyum maatraththaith thadukkiradhu. 'He said that India BECAME free in 1947' — 'had become' alla."}],

 s3:[
 {h:"The backshift ladder",
  d:"   PRESENT           →  PAST\n     write            →  wrote\n     am / is / are    →  was / were\n     writes           →  wrote\n\n   PAST              →  PAST PERFECT\n     wrote            →  had written\n     was / were       →  had been\n\n   PRESENT PERFECT   →  PAST PERFECT\n     have / has V3    →  had V3\n\n   PAST PERFECT      →  no change\n     had V3           →  had V3"},
 {h:"The modal ladder",
  d:"   will   →  would\n   shall  →  should\n   can    →  could\n   may    →  might\n   must   →  had to  (or stays 'must')\n\n   would · should · could · might · ought to\n     →  NO CHANGE (already past forms)"},
 {h:"When NOTHING shifts",
  d:"   1. Reporting verb in PRESENT or FUTURE\n      He SAYS he IS busy.       (no shift)\n      He WILL SAY he IS busy.   (no shift)\n\n   2. UNIVERSAL TRUTH\n      He said the sun RISES in the east.\n\n   3. HABITUAL FACT / PROVERB\n      He said honesty IS the best policy.\n\n   4. DEFINITE PAST DATE\n      He said India BECAME free in 1947.\n\n   ⚠ SAY TO somebody → TELL somebody"}],

 s4:{
 wrong:["\"Every quotation shifts one step back.\" — Only if the reporting verb is past.",
  "\"'He said to me' is correct in indirect speech.\" — It becomes 'He told me'.",
  "\"'The sun rose in the east' is right after 'he said'.\" — A universal truth keeps the present.",
  "\"'Must' always becomes 'had to'.\" — It may also stay 'must'."],
 right:["Check the reporting verb before doing anything.",
  "'Say to somebody' becomes 'tell somebody'.",
  "Universal truths, proverbs and fixed dates do not shift.",
  "Learn the ladder: is→was, wrote→had written, will→would, can→could."]},

 s5:[
 {en:"He said that he was very busy that day.",ta:"அன்று தான் மிகவும் பிஸியாக இருப்பதாக அவர் கூறினார்.",tl:"Andru thaan migavum busy-yaaga iruppadhaaga avar koorinaar.",note:"'I am busy' → 'he was busy' after a past reporting verb."},
 {en:"He told me that he had finished the work.",ta:"வேலையை முடித்துவிட்டதாக அவர் என்னிடம் கூறினார்.",tl:"Velaiyai mudiththuvittadhaaga avar ennidam koorinaar.",note:"'Said to me' → 'told me'; present perfect → past perfect."},
 {en:"She says that she is going to Delhi today.",ta:"இன்று டெல்லிக்குச் செல்வதாக அவர் கூறுகிறார்.",tl:"Indru Delhikkuch selvadhaaga avar koorugiraar.",note:"A present reporting verb → no shift."},
 {en:"The teacher said that the sun rises in the east.",ta:"சூரியன் கிழக்கில் உதிக்கிறது என்று ஆசிரியர் கூறினார்.",tl:"Sooriyan kizhakkil udhikkiradhu endru aasiriyar koorinaar.",note:"A universal truth → no shift."},
 {en:"He said that India became free in 1947.",ta:"1947-ல் இந்தியா சுதந்திரம் அடைந்தது என்று அவர் கூறினார்.",tl:"1947-l India sudhandhiram adaindhadhu endru avar koorinaar.",note:"A definite past date → no shift."}],
