 s13:[
 "____ raining, and the dog has hidden ____ head under the sofa.|It's-its;Its-it's;It's-it's|0|'It is' → IT'S. Possessive → ITS.",
 "The rain ____ the crops badly, and the ____ was felt for months.|affected-effect;effected-affect;affected-affect|0|A verb → AFFECTED. A noun → EFFECT.",
 "The ____ is a man of ____ , and neither bribe ____ threat can move him.|principal-principle-nor;principle-principal-or;principal-principle-or|0|A person → PRINCIPAL. A belief → PRINCIPLE. NEITHER pairs with NOR (Rule 86).",
 "The doctor ____ me to rest, and his ____ was ____ to any I had received.|advised-advice-superior;adviced-advise-more superior;advised-advice-more superior|0|A verb → ADVISED. A noun → ADVICE. 'Superior' is already comparative (Rule 95).",
 "Everyone came ____ my brother, who was ____ ill to travel that day.|except-too;accept-so;except-so|0|'Leaving out' → EXCEPT. TOO + TO expresses a negative result (Rule 93)."],

 s14:{
  rule:"Certain word pairs differ by one letter but carry entirely different meanings and word classes.",
  formula:"ITS possessive / IT'S = it is\nAFFECT verb / EFFECT noun (A=Action, E=End result)\nPRINCIPAL head or main / PRINCIPLE a rule\nSTATIONARY still / STATIONERY paper\nADVICE noun / ADVISE verb · PRACTICE noun / PRACTISE verb\nLOSE misplace / LOOSE not tight\nACCEPT receive / EXCEPT leaving out",
  memory:"'It's' expands to 'it is'. A is for Action. The principAL is your PAL.",
  ta:"'It's' 'it is'-ஆ விரியும். A என்றால் Action. PrincipAL உங்க PAL.",
  tl:"'It's' 'it is'-aa viriyum. A endraal Action. PrincipAL unga PAL.",
  mistake:"Writing 'it's tail', 'a bad affect', 'the principle of the college' and 'stationary shop'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — these pairs appear in Spelling and Fill in the Blank."},

 s15:[
 {ta:"இது ஒரு எளிமையான rule, ஆனா தேர்வுல இலவச மதிப்பெண் தரக்கூடியது. சில ஜோடி சொல் ஒரே எழுத்து வித்தியாசத்துல வேற வேற அர்த்தம் தரும்.",
  tl:"Idhu oru elimaiyaana rule, aanaa thervula ilavasa madhippen tharakkoodiyadhu. Sila jodi sol ore ezhuththu viththiyaasaththula veru veru arththam tharum."},
 {ta:"முதல் ஜோடி — ITS மற்றும் IT'S. இது ரொம்ப எளிது! 'IT'S' அப்படின்னா 'IT IS' அல்லது 'IT HAS'. Apostrophe இருந்தா அது சுருக்கம். 'ITS' அப்படின்னா உடைமை — 'அதனுடைய'. சோதனை — 'it is'-ஆ விரிக்க முடியுமா? முடிஞ்சா apostrophe போடுங்க.",
  tl:"Mudhal jodi — ITS matrum IT'S. 'IT'S' appadinnaa 'IT IS'. 'ITS' appadinnaa udaimai. Sodhanai — 'it is'-aa virikka mudiyumaa? Mudinjaa apostrophe podunga."},
 {ta:"ரெண்டாவது — AFFECT மற்றும் EFFECT. இது ரொம்ப பேரு குழம்புற ஜோடி. AFFECT ஒரு வினைச்சொல் — 'The rain AFFECTED the crops'. EFFECT ஒரு பெயர்ச்சொல் — 'a bad EFFECT'. நினைவு உத்தி: A = ACTION (செயல், அதனால வினைச்சொல்). E = END RESULT (விளைவு, அதனால பெயர்ச்சொல்).",
  tl:"Randaavadhu — AFFECT matrum EFFECT. AFFECT oru vinaichol. EFFECT oru peyarchol. Ninaivu utthi: A = ACTION. E = END RESULT."},
 {ta:"மூணாவது — PRINCIPAL மற்றும் PRINCIPLE. PRINCIPAL அப்படின்னா தலைமையாசிரியர் அல்லது 'முதன்மையான'. PRINCIPLE அப்படின்னா கொள்கை, விதி. நினைவு உத்தி: 'princip-AL' -ல கடைசி மூணு எழுத்து 'PAL' — நண்பன், அதாவது நபர்! 'princip-LE' -ல கடைசி ரெண்டு எழுத்து 'LE' — 'ruLE' மாதிரி!",
  tl:"Moonaavadhu — PRINCIPAL matrum PRINCIPLE. Ninaivu utthi: 'princip-AL'-la kadaisi moonu ezhuththu 'PAL' — nanban, adhaavadhu nabar! 'princip-LE' — 'ruLE' maadhiri!"},
 {ta:"நாலாவது — STATIONARY மற்றும் STATIONERY. STATIONARY = அசையாத, நிற்குற. STATIONERY = பேனா, பேப்பர். நினைவு உத்தி: station-A-ry — 'stAnd still' (நிற்குது). station-E-ry — 'writEr' (எழுதுறவரு).",
  tl:"Naalaavadhu — STATIONARY matrum STATIONERY. Ninaivu utthi: station-A-ry — 'stAnd still'. station-E-ry — 'writEr'."},
 {ta:"இன்னும் சில முக்கியமான ஜோடி — ADVICE (பெயர்ச்சொல், 'c') மற்றும் ADVISE (வினைச்சொல், 's'). PRACTICE (பெயர்ச்சொல்) மற்றும் PRACTISE (வினைச்சொல்). இதுல ஒரு அழகான விதி — 'C' பெயர்ச்சொல்லுக்கு, 'S' வினைச்சொல்லுக்கு! மேலும் LOSE (தொலைச்சுடுறது) மற்றும் LOOSE (இறுக்கம் இல்லாத). ACCEPT (ஏத்துக்கிறது) மற்றும் EXCEPT (தவிர). COMPLEMENT (நிறைவு செய்யுறது) மற்றும் COMPLIMENT (பாராட்டு). THEIR, THERE, THEY'RE. YOUR மற்றும் YOU'RE.",
  tl:"Innum sila mukkiyamaana jodi — ADVICE (peyarchol, 'c') matrum ADVISE (vinaichol, 's'). 'C' peyarcholukku, 'S' vinaicholukku! Melum LOSE matrum LOOSE. ACCEPT matrum EXCEPT. COMPLEMENT matrum COMPLIMENT."}]},

/* ========== RULE 120 ========== */
{n:120,rc:"MIS-04",d:"Hard",t:"THE FINAL CHECKLIST — the Twelve Errors SSC Plants Most Often",
 tam:"இறுதிச் சரிபார்ப்பு — SSC அதிகம் வைக்கும் பன்னிரண்டு தவறுகள்",
 s1:{en:"This closing rule is a checklist, not new grammar. Twelve error patterns account for the majority of one-mark grammar questions in SSC, RRB and Bank papers. Run this list over any sentence and you will catch most planted errors in seconds.",
  ta:"இந்த இறுதி விதி ஒரு சரிபார்ப்புப் பட்டியல், புதிய இலக்கணம் அல்ல. SSC, RRB மற்றும் Bank தாள்களில் ஒரு மதிப்பெண் இலக்கணக் கேள்விகளில் பெரும்பான்மையை பன்னிரண்டு தவறு வடிவங்கள் கொண்டுள்ளன. எந்த வாக்கியத்தின் மீதும் இந்தப் பட்டியலை ஓட்டுங்கள், நீங்கள் பெரும்பாலான வைக்கப்பட்ட தவறுகளை நொடிகளில் பிடிப்பீர்கள்.",
  tl:"Indha irudhi vidhi oru saripaarppup pattiyal, pudhiya ilakkanam alla. Endha vaakkiyaththin meedhum indhap pattiyalai ottungal, neengal perumbaalaana vaikkappatta thavarugalai nodigalil pidippeergal.",
  formula:"THE TWELVE-POINT CHECK\n\n  1  Subject-verb agreement\n  2  The article A / AN / THE\n  3  Tense consistency\n  4  Pronoun case and agreement\n  5  Preposition collocation\n  6  Double negatives\n  7  Two conjunctions for one link\n  8  Degrees of comparison\n  9  Adjective versus adverb\n 10  Misplaced 'only' or a dangling phrase\n 11  Redundancy\n 12  Parallel structure"},

 s2:[
 {h:"Start with the verb and its real subject",
  en:"Find the main verb, then find the word it actually belongs to — not the nearest noun. 'The quality of the mangoes IS good', not 'are'. Checks 1 and 4 together catch roughly a third of all Error Spotting questions.",
  ta:"வினைச்சொல்லிலும் அதன் உண்மையான Subject-லும் தொடங்குங்கள். முதன்மை வினைச்சொல்லைக் கண்டறியுங்கள், பிறகு அது உண்மையில் சொந்தமான சொல்லைக் கண்டறியுங்கள் — அருகில் உள்ள பெயர்ச்சொல்லை அல்ல. 'The quality of the mangoes IS good', 'are' அல்ல. சரிபார்ப்பு 1 மற்றும் 4 சேர்ந்து அனைத்து Error Spotting கேள்விகளிலும் தோராயமாக மூன்றில் ஒரு பங்கைப் பிடிக்கின்றன.",
  tl:"Vinaicholilum adhan unmaiyaana Subject-lum thodangungal. 'The quality of the mangoes IS good', 'are' alla. Saripaarppu 1 matrum 4 serndhu moondril oru pangaip pidikkindrana."},
 {h:"Then scan for hidden negatives and doubled words",
  en:"Look for lest, unless, until, hardly, seldom, scarcely and never — each already carries a negative. Then look for although…but, because…so, more better and return back. Checks 6, 7 and 11 catch the whole redundancy family.",
  ta:"பிறகு மறைந்த எதிர்மறைகள் மற்றும் இரட்டிப்பான சொற்களைத் தேடுங்கள். lest, unless, until, hardly, seldom, scarcely மற்றும் never-ஐத் தேடுங்கள் — ஒவ்வொன்றும் ஏற்கனவே ஒரு எதிர்மறையைச் சுமக்கிறது. பிறகு although…but, because…so, more better மற்றும் return back-ஐத் தேடுங்கள். சரிபார்ப்பு 6, 7 மற்றும் 11 முழு மிகைப்படுத்தல் குடும்பத்தையும் பிடிக்கின்றன.",
  tl:"Piragu maraindha edhirmaraigal matrum irattippaana sorkalaith thedungal. lest, unless, until, hardly, seldom, scarcely matrum never. Piragu although…but, because…so, more better matrum return back."},
 {h:"Check every preposition against its verb or adjective",
  en:"Prepositions are pure memory, and they carry more marks than any other single area. Discuss takes none. Married takes 'to'. Good takes 'at'. Angry takes 'with' a person. Reason takes 'for'; cause takes 'of'. Check 5 alone is worth two marks a paper.",
  ta:"ஒவ்வொரு முன்னுருபையும் அதன் வினைச்சொல் அல்லது பெயரடைக்கு எதிராகச் சரிபாருங்கள். முன்னுருபுகள் தூய நினைவு, மேலும் அவை வேறு எந்த ஒற்றைப் பகுதியையும் விட அதிக மதிப்பெண்களைச் சுமக்கின்றன. Discuss எதுவும் எடுக்காது. Married 'to' எடுக்கும். Good 'at' எடுக்கும். Angry ஒரு நபருடன் 'with' எடுக்கும். Reason 'for' எடுக்கும்; cause 'of' எடுக்கும்.",
  tl:"Ovvoru munnurubaiyum adhan vinaichol alladhu peyaradaikku edhiraach saripaarungal. Discuss edhuvum edukkaadhu. Married 'to'. Good 'at'. Angry 'with'. Reason 'for'; cause 'of'."},
 {h:"Finally read the sentence for shape, not meaning",
  en:"Parallelism, misplaced 'only' and dangling phrases are invisible if you read for meaning, because the meaning is always clear. Read the FORM instead: does each side of the correlative match? Does the opening phrase describe the subject that follows?",
  ta:"இறுதியாக வாக்கியத்தை வடிவத்திற்காகப் படியுங்கள், பொருளுக்காக அல்ல. நீங்கள் பொருளுக்காகப் படித்தால் parallelism, தவறான இடத்தில் உள்ள 'only' மற்றும் தொங்கும் தொடர்கள் கண்ணுக்குத் தெரியாது, ஏனெனில் பொருள் எப்போதும் தெளிவாக இருக்கிறது. அதற்குப் பதிலாக வடிவத்தைப் படியுங்கள்: இணைச் சொல்லின் ஒவ்வொரு பக்கமும் பொருந்துகிறதா? தொடக்கத் தொடர் அதைத் தொடர்ந்து வரும் Subject-ஐ விவரிக்கிறதா?",
  tl:"Irudhiyaaga vaakkiyaththai vadivaththirkaagap padiyungal, porulukkaaga alla. Adharkup padhilaaga vadivaththaip padiyungal: inaich sollin ovvoru pakkamum porundhugiradhaa?"}],

 s3:[
 {h:"The twelve-point check",
  d:"    1  SVA        Is the verb with its REAL subject?\n    2  ARTICLE    A / AN by SOUND · THE for specific\n    3  TENSE      Do all the verbs agree in time?\n    4  PRONOUN    Case and antecedent correct?\n    5  PREPOSITION Right one for that word?\n    6  NEGATIVE   Is there a hidden negative?\n    7  CONJUNCTION Two words for one link?\n    8  DEGREE     Two items or three?\n    9  ADJ / ADV  Linking verb or action verb?\n   10  PLACEMENT  Is 'only' next to what it limits?\n   11  REDUNDANCY Is anything said twice?\n   12  PARALLEL   Do both sides match in form?"},
 {h:"The fastest three checks",
  d:"   THESE THREE CATCH THE MOST MARKS:\n\n   ① FIND THE REAL SUBJECT\n     The quality of the mangoes IS good.\n     Each of the boys HAS a pen.\n     Neither of them WAS present.\n\n   ② SCAN FOR HIDDEN NEGATIVES\n     lest · unless · until · hardly\n     seldom · scarcely · rarely · never\n     → never add another 'not'\n\n   ③ CHECK EVERY PREPOSITION\n     discuss (none) · married TO · good AT\n     angry WITH · reason FOR · cause OF\n     superior TO · prefer TO"},
 {h:"The invisible errors — read the FORM",
  d:"   These read perfectly but are wrong:\n\n   ✘ Ram is taller than any boy in his class.\n       (needs 'any OTHER boy')\n   ✘ He is not only clever but also works hard.\n       (adjective vs verb phrase)\n   ✘ I only read the first page.\n       (should be 'read ONLY the first page')\n   ✘ Walking down the road, a snake bit him.\n       (the snake was walking!)\n   ✘ My handwriting is better than Ram.\n       (writing compared with a person)\n\n   MEANING IS CLEAR. FORM IS WRONG.\n   Read the FORM."}],

 s4:{
 wrong:["\"If a sentence reads smoothly, it is correct.\" — Most planted errors read smoothly.",
  "\"I will spot the error by instinct.\" — Instinct misses form errors entirely.",
  "\"Prepositions are too many to learn.\" — The exam repeats the same forty.",
  "\"There is no time for a checklist in the exam.\" — Three checks take under ten seconds."],
 right:["Find the real subject before checking the verb.",
  "Scan for hidden negatives before reading anything else.",
  "Check every preposition against its verb or adjective.",
  "Read the FORM, not just the meaning."]},

 s5:[
 {en:"The quality of these mangoes is really excellent.",ta:"இந்த மாம்பழங்களின் தரம் மிகவும் சிறப்பாக உள்ளது.",tl:"Indha maambazhangalin tharam migavum sirappaaga ulladhu.",note:"Check 1 — the real subject is 'quality', so IS."},
 {en:"Ram is taller than any other boy in his class.",ta:"தன் வகுப்பில் உள்ள மற்ற எந்தப் பையனையும் விட ராம் உயரமானவன்.",tl:"Than vaguppil ulla matra endhap paiyanaiyum vida Raam uyaramaanavan.",note:"Check 8 — 'other' is needed because Ram is in that class."},
 {en:"Although he was tired, he continued working.",ta:"அவர் களைப்பாக இருந்தபோதிலும், தொடர்ந்து வேலை செய்தார்.",tl:"Avar kalaippaaga irundhabodhilum, thodarndhu velai seydhaar.",note:"Check 7 — one conjunction, not 'although … but'."},
 {en:"He is not only intelligent but also hardworking.",ta:"அவர் புத்திசாலி மட்டுமல்ல, கடின உழைப்பாளியும் கூட.",tl:"Avar puththisaali mattumalla, kadina uzhaippaaliyum kooda.",note:"Check 12 — adjective balanced with adjective."},
 {en:"Walking down the road, he was bitten by a snake.",ta:"சாலையில் நடந்து கொண்டிருந்தபோது அவரை ஒரு பாம்பு கடித்தது.",tl:"Saalaiyil nadandhu kondirundhabodhu avarai oru paambu kadiththadhu.",note:"Check 10 — the opening phrase must describe 'he'."}],

 s6:["checklist|சரிபார்ப்புப் பட்டியல்|Saripaarppup pattiyal",
  "real subject|உண்மையான எழுவாய்|Unmaiyaana ezhuvaay",
  "hidden negative|மறைந்த எதிர்மறை|Maraindha edhirmarai",
  "collocation|நிலையான இணை|Nilaiyaana inai",
  "redundancy|மிகைப்படுத்தல்|Migaippaduththal",
  "parallel structure|இணை அமைப்பு|Inai amaippu",
  "dangling phrase|தொங்கும் தொடர்|Thongum thodar",
  "form|வடிவம்|Vadivam",
  "meaning|பொருள்|Porul",
  "error spotting|தவறு கண்டறிதல்|Thavaru kandaridhal",
  "one-mark question|ஒரு மதிப்பெண் கேள்வி|Oru madhippen kelvi"],

 s7:[
 "The quality of these mangoes ____ excellent.|is|Easy|Check 1 — the real subject is 'quality'.",
 "Each of the boys ____ a new pen.|has|Easy|Check 1 — 'each of' is always singular.",
 "Ram is taller than any ____ boy in his class.|other|Easy|Check 8 — Ram is in that class.",
 "____ he was tired, he continued working.|Although|Medium|Check 7 — one conjunction only.",
 "He is not only clever but also ____ .|hardworking|Medium|Check 12 — adjective with adjective.",
 "Walking down the road, ____ was bitten.|he|Medium|Check 10 — the phrase must describe 'he'.",
 "Hold the rope lest you ____ slip.|should|Medium|Check 6 — LEST takes SHOULD, no 'not'.",
 "He is good ____ mathematics and physics.|at|Hard|Check 5 — 'good at'.",
 "The reason for his delay is ____ he was ill.|that|Hard|Check 11 — 'the reason is that'.",
 "The flower smells very ____ this morning.|sweet|Hard|Check 9 — a linking verb takes an adjective.",
 "Of the two options, this is the ____ one.|better|Hard|Check 8 — two items take the comparative.",
 "He read ____ the first page of the book.|only|Expert|Check 10 — 'only' next to what it limits.",
 "Neither the boys nor the teacher ____ present.|was|Expert|Check 1 — the nearest subject decides.",
 "This method is far ____ than the older one.|better|Expert|Check 11 — no 'more better'.",
 "My handwriting is better than ____ .|Ram's|Expert|Check 12 — compare like with like."],

 s8:[
 "The quality of these mangoes are excellent.|The quality of these mangoes is excellent.|Check 1 — the real subject is 'quality'.",
 "Ram is taller than any boy in his class.|Ram is taller than any other boy in his class.|Check 8 — Ram belongs to that class.",
 "Although he was tired, but he continued working.|Although he was tired, he continued working.|Check 7 — one conjunction is enough.",
 "He is not only clever but also works hard.|He is not only clever but also hardworking.|Check 12 — an adjective must match an adjective.",
 "Walking down the road, a snake bit him.|Walking down the road, he was bitten by a snake.|Check 10 — the phrase must describe the subject.",
 "Hold the rope lest you should not slip.|Hold the rope lest you should slip.|Check 6 — 'lest' already carries the negative.",
 "The reason for his delay is because he was ill.|The reason for his delay is that he was ill.|Check 11 — 'reason … because' is redundant.",
 "The flower smells very sweetly this morning.|The flower smells very sweet this morning.|Check 9 — a linking verb takes an adjective.",
 "Of the two options, this is the best one.|Of the two options, this is the better one.|Check 8 — two items take the comparative.",
 "My handwriting is better than Ram.|My handwriting is better than Ram's.|Check 12 — compare writing with writing."],

 s9:[
 "Find the Error|The quality of (A) the mangoes sold (B) in this market (C) are extremely poor (D).|A;B;C;D|3|Check 1. The real subject is 'quality' → IS.",
 "Find the Error|Although he had (A) prepared very well (B), but he could not (C) clear the interview (D).|A;B;C;D|2|Check 7. One conjunction only — delete the 'but'.",
 "Find the Error|He is not only (A) a brilliant student (B) but also plays (C) football extremely well (D).|A;B;C;D|2|Check 12. A noun must be balanced with a noun.",
 "Find the Error|Ram is definitely taller (A) than any boy (B) in his own (C) class this year (D).|A;B;C;D|1|Check 8. Ram is in that class → 'any other boy'.",
 "Find the Error|Hold the railing firmly (A) lest you should not (B) slip on the (C) wet marble staircase (D).|A;B;C;D|1|Check 6. 'Lest' already carries the negative."],

 s10:{
  en:"The single biggest exam mistake is trusting your ear. Every planted error in an SSC paper is designed to READ correctly — that is the whole craft of setting the question. 'Ram is taller than any boy in his class' and 'My handwriting is better than Ram' both sound perfect. The checklist exists because instinct alone will miss them.",
  ta:"தேர்வில் மிகப் பெரிய ஒற்றைத் தவறு உங்கள் காதை நம்புவது. ஒரு SSC தாளில் வைக்கப்பட்ட ஒவ்வொரு தவறும் சரியாகப் படிக்கும்படி வடிவமைக்கப்பட்டுள்ளது — அதுதான் கேள்வியை அமைப்பதன் முழு கலை. 'Ram is taller than any boy in his class' மற்றும் 'My handwriting is better than Ram' இரண்டுமே சரியாக ஒலிக்கின்றன. உள்ளுணர்வு மட்டும் அவற்றைத் தவறவிடும் என்பதால் சரிபார்ப்புப் பட்டியல் இருக்கிறது.",
  tl:"Thervil migap periya otraith thavaru ungal kaadhai nambuvadhu. Ovvoru thavarum sariyaagap padikkumbadi vadivamaikkappattullodhu. Ullunarvu mattum avatraith thavaravidum enbadhaal saripaarppup pattiyal irukkiradhu."},

 s11:{
  en:"READ THE FORM, NOT THE MEANING. The meaning is always clear; the form is where the error hides.",
  ta:"வடிவத்தைப் படியுங்கள், பொருளை அல்ல. பொருள் எப்போதும் தெளிவாக இருக்கும்; தவறு வடிவத்தில்தான் மறைந்திருக்கும்.",
  tl:"Vadivaththaip padiyungal, porulai alla. Porul eppodhum thelivaaga irukkum; thavaru vadivaththil-dhaan maraindhirukkum.",
  vis:"      THE TWELVE-POINT CHECK\n\n    1  SVA         real subject, not the nearest noun\n    2  ARTICLE     a / an by SOUND · the for specific\n    3  TENSE       do all the verbs agree in time?\n    4  PRONOUN     case and antecedent\n    5  PREPOSITION the right one for that word\n    6  NEGATIVE    lest · unless · until · hardly\n                   seldom · scarcely · never\n    7  CONJUNCTION although…but · because…so\n    8  DEGREE      two items or three? 'any OTHER'?\n    9  ADJ / ADV   linking verb or action verb?\n   10  PLACEMENT   'only' · dangling phrase\n   11  REDUNDANCY  more better · return back\n                   the reason is because\n   12  PARALLEL    do both sides match in form?\n\n   ⚠ THE THREE FASTEST CHECKS:\n     ① find the REAL subject\n     ② scan for HIDDEN NEGATIVES\n     ③ check every PREPOSITION\n\n   ⚠ EVERY PLANTED ERROR READS CORRECTLY.\n     That is the point. Read the FORM."},

 s13:[
 "The quality of the mangoes ____ poor, ____ the price ____ risen sharply.|is-although-has;are-although but-have;is-although but-has|0|Check 1 — the real subject is 'quality'. Check 7 — one conjunction only.",
 "Ram is taller than any ____ boy, and of the two brothers he is ____ .|other-the taller;—-the tallest;other-the tallest|0|Check 8 — 'other' is needed. 'Of the two' → THE + comparative.",
 "He is not only clever but also ____ , and he is ____ to all his classmates.|hardworking-superior;works hard-more superior;hardworking-more superior|0|Check 12 — parallel adjectives. Check 11 — no 'more superior'.",
 "Hold the rope lest you ____ slip, and be careful ____ the staircase ____ wet.|should-because-is;should not-so-is;should-so-is|0|Check 6 — LEST + SHOULD. Check 7 — one conjunction only.",
 "The flower smells ____ , and the reason ____ ____ it was watered this morning.|sweet-is-that;sweetly-is-because;sweet-is-because|0|Check 9 — a linking verb takes an adjective. Check 11 — 'the reason is that'."],

 s14:{
  rule:"Twelve error patterns account for most one-mark grammar questions; run the checklist rather than trusting your ear.",
  formula:"1 SVA · 2 Article · 3 Tense · 4 Pronoun\n5 Preposition · 6 Hidden negative · 7 Double conjunction\n8 Degree · 9 Adj vs Adv · 10 Placement\n11 Redundancy · 12 Parallel structure\nFASTEST THREE: real subject, hidden negatives, prepositions",
  memory:"Read the FORM, not the meaning. Every planted error reads correctly.",
  ta:"வடிவத்தைப் படிங்க, பொருளை இல்ல. ஒவ்வொரு தவறும் சரியாத்தான் படிக்கும்.",
  tl:"Vadivaththaip padinga, porulai illa. Ovvoru thavarum sariyaaththaan padikkum.",
  mistake:"Trusting your ear instead of checking the form systematically.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — this checklist covers the whole Error Spotting section."},

 s15:[
 {ta:"நாம நூற்று இருபது rule-ஓட கடைசிக்கு வந்துட்டோம். இந்த rule புதிய இலக்கணம் இல்ல — இது ஒரு சரிபார்ப்புப் பட்டியல். எல்லாத்தையும் ஒண்ணா சேர்த்து வெக்குற இடம்.",
  tl:"Naama nootru irubadhu rule-oda kadaisikku vandhuttom. Indha rule pudhiya ilakkanam illa — idhu oru saripaarppup pattiyal."},
 {ta:"முதல்ல ஒரு உண்மை சொல்லுறேன், இது ரொம்ப முக்கியம். தேர்வுல வெக்குற ஒவ்வொரு தப்பும் சரியாத்தான் படிக்கும்! அதுதான் கேள்வி தயாரிக்கிறவங்களோட கலை.",
  tl:"Mudhalla oru unmai solluren, idhu romba mukkiyam. Thervula vekkura ovvoru thappum sariyaaththaan padikkum! Adhudhaan kelvi thayaarikkiravangaloda kalai."},
 {ta:"'Ram is taller than any boy in his class' — சரியா ஒலிக்குது இல்ல? ஆனா தப்பு! 'My handwriting is better than Ram' — சரியா ஒலிக்குது! ஆனா தப்பு! 'The flower smells sweetly' — சரியா ஒலிக்குது! ஆனா தப்பு! அதனால காதை நம்பாதீங்க — சரிபார்ப்புப் பட்டியலை நம்புங்க.",
  tl:"'Ram is taller than any boy in his class' — sariyaa olikkudhu illa? Aanaa thappu! Adhanaala kaadhai nambaadheenga — saripaarppup pattiyalai nambunga."},
 {ta:"பன்னிரண்டு விஷயம். ஒண்ணு — SVA, உண்மையான subject-ஐ கண்டுபிடிங்க. ரெண்டு — article. மூணு — காலம். நாலு — pronoun. அஞ்சு — முன்னுருபு. ஆறு — மறைந்த எதிர்மறை. ஏழு — ஒரே தொடர்புக்கு ரெண்டு இணைப்புச் சொல். எட்டு — ஒப்பீட்டு நிலை. ஒன்பது — பெயரடையா வினையடையா. பத்து — 'only' இடம். பதினொண்ணு — மிகைப்படுத்தல். பன்னிரண்டு — இணை அமைப்பு.",
  tl:"Pannirandu vishayam. Onnu — SVA. Rendu — article. Moonu — kaalam. Naalu — pronoun. Anju — munnurubu. Aaru — maraindha edhirmarai. Ezhu — rendu inaippuch sol. Ettu — oppeettu nilai. Onbadhu — peyaradaiyaa vinaiyadaiyaa. Paththu — 'only' idam. Padhinonnu — migaippaduththal. Pannirandu — inai amaippu."},
 {ta:"நேரம் குறைவா இருந்தா, இந்த மூணு மட்டும் பண்ணுங்க. ஒண்ணு — உண்மையான subject-ஐ கண்டுபிடிச்சு verb-ஐ சரிபாருங்க. ரெண்டு — மறைந்த எதிர்மறை இருக்கான்னு பாருங்க (lest, unless, until, hardly, seldom, scarcely, never). மூணு — ஒவ்வொரு முன்னுருபையும் சரிபாருங்க. இந்த மூணு பத்து நொடியில முடியும், ஆனா பாதி கேள்விக்கு பதில் தந்துடும்.",
  tl:"Neram kuraivaa irundhaa, indha moonu mattum pannunga. Onnu — unmaiyaana subject. Rendu — maraindha edhirmarai. Moonu — munnurubu. Indha moonu paththu nodiyila mudiyum, aanaa paadhi kelvikku padhil thandhudum."},
 {ta:"கடைசியா ஒரு வார்த்தை. நீங்க இப்போ நூற்று இருபது விதியும் படிச்சிட்டீங்க. ஆயிரக்கணக்கான உதாரணம், ஆயிரக்கணக்கான பயிற்சிக் கேள்வி. முதல் நாள் 'எனக்கு English Grammar தெரியாது'-ன்னு நினைச்சிருந்தீங்கன்னா, இப்போ நிலைமை வேற. ஆனா ஒண்ணு ஞாபகம் வெச்சுக்கோங்க — படிச்சது போதாது, பயிற்சி பண்ணனும். ஒவ்வொரு rule-லயும் இருபது கேள்வி இருக்கு. திரும்பத் திரும்ப செய்யுங்க. வெற்றி நிச்சயம். வாழ்த்துக்கள்!",
  tl:"Kadaisiyaa oru vaarththai. Neenga ippo nootru irubadhu vidhiyum padichitteenga. Aanaa onnu gnaabagam vechukkonga — padichadhu podhaadhu, payirchi pannanum. Ovvoru rule-layum irubadhu kelvi irukku. Thirumbath thirumba seyyunga. Vetri nichchayam. Vaazhththukkal!"}]}
];

/* ================== ENGINE ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const P=(s,n)=>String(s).split("|").concat(Array(n).fill("")).slice(0,n);
let cur=0, done={}, ansd={}, sc={};

const STEPS=[
 ["What is the Rule?","விதி என்ன? · Vidhi enna?"],
 ["Why does this rule exist?","ஏன் இந்த விதி? · Yen indha vidhi?"],
 ["Visual Diagram","படம் மூலம் புரிதல் · Padam moolam purithal"],
 ["Wrong Thinking vs Right Thinking","தவறான சிந்தனை · Thavaraana sinthanai"],
 ["Tamil Translation of Examples","உதாரணங்களின் தமிழ் · Udhaaranangalin Tamil"],
 ["Word-by-Word Meaning","சொல்லுக்குச் சொல் · Sollukku sol"],
 ["Solved Examples — Easy to Hard","தீர்க்கப்பட்ட உதாரணங்கள்"],
 ["Wrong vs Correct","தவறு vs சரி · Thavaru vs Sari"],
 ["SSC / Bank PYQ Style","முந்தைய வினாத்தாள் பாணி"],
 ["Exam Trap","தேர்வு பொறி · Thervu pori"],
 ["Memory Trick","நினைவு உத்தி · Ninaivu utthi"],
 ["Practice Set — 20 Questions","பயிற்சி தொகுப்பு"],
 ["Challenge Round","சவால் சுற்று · Savaal sutru"],
 ["One-Page Revision Sheet","ஒரு பக்க மறுபார்வை"],
 ["Centu AI Explains","சென்டு AI விளக்கம்"]
];

function tri(en,ta,tl){
 let h="";
 if(en) h+=`<div class="en">${esc(en)}</div>`;
 if(ta) h+=`<div class="ta">${esc(ta)}</div>`;
 if(tl) h+=`<div class="tl">${esc(tl)}</div>`;
 return h;
}

function buildStep(i,r){
 let c="";
 if(i===0){
   c=`<div class="box gold">${tri(r.s1.en,r.s1.ta,r.s1.tl)}</div>`;
   if(r.s1.formula) c+=`<div class="hd">Formula</div><pre class="dia">${esc(r.s1.formula)}</pre>`;
 }
 if(i===1) c=r.s2.map(b=>`<div class="hd">${esc(b.h)}</div><div class="box blue">${tri(b.en,b.ta,b.tl)}</div>`).join("");
 if(i===2) c=r.s3.map(d=>`<div class="hd">${esc(d.h)}</div><pre class="dia">${esc(d.d)}</pre>`).join("");
 if(i===3){
   c=`<div class="hd">How students think — and why it fails</div><div class="think">`+
     r.s4.wrong.map(x=>`<div class="bad">✘ ${esc(x)}</div>`).join("")+`</div>`+
     `<div class="hd">How you must think</div><div class="think">`+
     r.s4.right.map(x=>`<div class="good">✔ ${esc(x)}</div>`).join("")+`</div>`;
 }
 if(i===4) c=r.s5.map(x=>`<div class="box pur"><div class="en"><b>${esc(x.en)}</b></div>
   <div class="ta">${esc(x.ta)}</div><div class="tl">${esc(x.tl)}</div>
   ${x.note?`<div style="font-size:12.5px;color:var(--acc);margin-top:6px">▸ ${esc(x.note)}</div>`:""}</div>`).join("");
 if(i===5){
   c=`<div class="wordgrid">`+r.s6.map(w=>{const[a,b,d]=P(w,3);
     return `<div class="wc"><b>${esc(a)}</b><span>${esc(b)}</span><em>${esc(d)}</em></div>`;}).join("")+`</div>`;
 }
 if(i===6){
   c=`<table><tr><th style="width:46px">#</th><th>Sentence</th><th style="width:80px">Answer</th><th style="width:78px">Level</th><th>Why</th></tr>`+
     r.s7.map((x,k)=>{const[s,a,l,w]=P(x,4);
       return `<tr><td>${k+1}</td><td>${esc(s)}</td><td class="c"><b>${esc(a)}</b></td>
       <td><span class="lvl l-${esc(l)}">${esc(l)}</span></td><td style="color:var(--dim)">${esc(w)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===7){
   c=`<table><tr><th style="width:40px">#</th><th>✘ Wrong</th><th>✔ Correct</th><th>Reason</th></tr>`+
     r.s8.map((x,k)=>{const[w,g,y]=P(x,3);
       return `<tr><td>${k+1}</td><td class="w">${esc(w)}</td><td class="c">${esc(g)}</td>
       <td style="color:var(--dim)">${esc(y)}</td></tr>`;}).join("")+`</table>`;
 }
 if(i===8) c=r.s9.map((x,k)=>{const[t,q,o,a,s]=P(x,5);
   return qzHtml(r.n,"p"+k,q,o.split(";"),+a,s,t);}).join("");
 if(i===9) c=`<div class="box red">${tri(r.s10.en,r.s10.ta,r.s10.tl)}</div>`;
 if(i===10){
   c=`<div class="box gold">${tri(r.s11.en,r.s11.ta,r.s11.tl)}</div>`;
   if(r.s11.vis) c+=`<pre class="dia">${esc(r.s11.vis)}</pre>`;
 }
 if(i===11){
   c=scoreBar(r.n,"q",r.s12.length)+r.s12.map((x,k)=>{const[q,o,a]=P(x,3);
     return qzHtml(r.n,"q"+k,q,o.split(";"),+a,"",""+(k+1));}).join("");
 }
 if(i===12) c=`<div class="box gold" style="margin-bottom:12px"><b>Mixed with Tense, Pronoun, Article and Preposition — real SSC difficulty.</b></div>`+
   r.s13.map((x,k)=>{const[q,o,a,s]=P(x,4);
     return qzHtml(r.n,"c"+k,q,o.split(";"),+a,s,"C"+(k+1));}).join("");
 if(i===13){
   const v=r.s14;
   c=`<div class="rev">
     <div>Rule</div><div>${esc(v.rule)}</div>
     <div>Formula</div><div><code>${esc(v.formula)}</code></div>
     <div>Memory</div><div>${esc(v.memory)}</div>
     <div>Tamil</div><div class="tam">${esc(v.ta)}<br><em style="color:var(--dim);font-size:12px">${esc(v.tl)}</em></div>
     <div>Common Mistake</div><div style="color:var(--no)">${esc(v.mistake)}</div>
     <div>Exam Value</div><div>${esc(v.exam)}</div></div>`;
 }
 if(i===14){
   c=`<div class="ai"><div class="who">🎙️ CENTU AI EXPLAINS — வகுப்பு நேரம்</div>`+
     r.s15.map(p=>`<p class="ta">${esc(p.ta)}</p><p class="tl">${esc(p.tl)}</p>`).join("")+`</div>`;
 }
 return `<div class="step" data-s="${i}">
   <div class="sh"><div class="sn">${i+1}</div>
   <div class="st">${esc(STEPS[i][0])}<small>${esc(STEPS[i][1])}</small></div>
   <span class="cv">▼</span></div>
   <div class="sb">${c}</div></div>`;
}

function qzHtml(rn,id,q,opts,ans,sol,tag){
 const key=rn+"-"+id;
 return `<div class="qz" id="z-${key}" data-a="${ans}" data-k="${key}">
   <div class="qn">${tag?`<i>${esc(tag)}.</i>`:""}${esc(q)}</div>
   <div class="ops">${opts.map((o,j)=>`<button class="op" data-k="${key}" data-j="${j}">${esc(o.trim())}</button>`).join("")}</div>
   ${sol?`<div class="sol">💡 ${esc(sol)}</div>`:`<div class="sol">💡 Correct answer: <b>${esc(opts[ans]||"")}</b></div>`}</div>`;
}
function scoreBar(rn,pre,total){
 return `<div class="scorebar" id="sb-${rn}-${pre}">Your score: <b id="sv-${rn}-${pre}">0</b> / ${total}
   <span class="bar"><i id="sp-${rn}-${pre}"></i></span>
   <span style="color:var(--dim);font-size:12px">Tap an option to check instantly</span></div>`;
}

function renderRule(){
 const r=RULES[cur];
 $("#tt").innerHTML=`Rule ${r.n} · <em>${esc(r.t)}</em>`;
 $("#tta").textContent=r.tam;
 $("#tdiff").textContent=r.d; $("#tdiff").className="badge b-"+r.d;
 $("#trc").textContent=r.rc;
 $("#body").innerHTML=STEPS.map((_,i)=>buildStep(i,r)).join("");
 document.querySelector('.step[data-s="0"]').classList.add("open");
 $("#prev").disabled=cur===0; $("#next").disabled=cur===RULES.length-1;
 document.querySelectorAll(".rbtn").forEach((b,i)=>b.classList.toggle("on",i===cur));
 window.scrollTo({top:0,behavior:"smooth"});
 // restore answers
 Object.keys(ansd).forEach(k=>{ if(k.startsWith(r.n+"-")) paint(k,ansd[k]); });
 ["q","c","p"].forEach(pre=>updBar(r.n,pre));
}
function paint(key,chosen){
 const box=document.getElementById("z-"+key); if(!box) return;
 const ans=+box.dataset.a;
 box.querySelectorAll(".op").forEach((b,j)=>{
   if(j===ans) b.classList.add("right"); else if(j===chosen) b.classList.add("wrong");});
 box.classList.add("done");
}
function updBar(rn,pre){
 const el=document.getElementById("sv-"+rn+"-"+pre); if(!el) return;
 const tot=document.querySelectorAll(`[id^="z-${rn}-${pre}"]`).length;
 let got=0; Object.keys(ansd).forEach(k=>{
   if(k.startsWith(rn+"-"+pre)){const b=document.getElementById("z-"+k); if(b&&ansd[k]===+b.dataset.a) got++;}});
 el.textContent=got;
 const bar=document.getElementById("sp-"+rn+"-"+pre); if(bar) bar.style.width=(tot?got/tot*100:0)+"%";
}

document.addEventListener("click",e=>{
 const sh=e.target.closest(".sh"); if(sh){sh.parentElement.classList.toggle("open");return;}
 const op=e.target.closest(".op");
 if(op){
   const k=op.dataset.k; if(ansd[k]!==undefined) return;
   ansd[k]=+op.dataset.j; paint(k,+op.dataset.j);
   const rn=k.split("-")[0], pre=k.split("-")[1][0];
   updBar(rn,pre);
   if(pre==="q"){done[rn]=true; drawList();}
   return;
 }
 const rb=e.target.closest(".rbtn"); if(rb){cur=+rb.dataset.i;renderRule();}
});
$("#prev").onclick=()=>{if(cur>0){cur--;renderRule();}};
$("#next").onclick=()=>{if(cur<RULES.length-1){cur++;renderRule();}};
$("#allopen").onclick=()=>{
 const all=document.querySelectorAll(".step"), anyClosed=[...all].some(s=>!s.classList.contains("open"));
 all.forEach(s=>s.classList.toggle("open",anyClosed));
 $("#allopen").textContent=anyClosed?"Close all steps":"Open all steps";
};
window.addEventListener("beforeprint",()=>document.querySelectorAll(".step").forEach(s=>s.classList.add("open")));

function drawList(){
 $("#rlist").innerHTML=RULES.map((r,i)=>
  `<button class="rbtn ${i===cur?"on":""}" data-i="${i}">
    <b>${r.n}</b><span>${esc(r.t)}<span class="dn">${esc(r.rc)} · ${r.d}</span></span>
    ${done[r.n]?'<span class="tick">✔</span>':''}</button>`).join("");
}
drawList();
renderRule();
</script>
<script>
/* ===== CentuMania metrics — universal v2 (generator-agnostic; additive) =====
 * Handles three different option-rendering engines seen across this batch:
 *  A) .opts[data-a] container + .opt[data-j] options (class8-12 MASTER packs)
 *  B) .qz/.opts[data-a] container + .op/.opt[data-j] options, .right/.wrong
 *     classes applied on click (MicroClasses, Grammar Bible)
 *  C) .opt-btn[data-oi] with no DOM-exposed answer key; correctness read
 *     back from the inline background-color the module sets on click
 *     (Geography / Polity / GK / Art & Culture)
 * Detection cascades: explicit data-a/data-ans first (most reliable), then
 * known correct/wrong class names, then the inline-style colour signature.
 */
(function(){
  if(window.__cmTrackU||window.__cmTrackInit)return; window.__cmTrackU=1;
  var CM_DEFAULT='eng-micro-voice-narration', CM_T0=Date.now(), CM_ACTIVE=0, _vt=Date.now(), _lastQ=0;
  function tok(){try{var t=localStorage.getItem('cm:access_token');if(t)return t;}catch(e){}try{var st=[localStorage,sessionStorage],s,i,k,d;for(s=0;s<st.length;s++){for(i=0;i<st[s].length;i++){k=st[s].key(i);if(k&&k.indexOf('sb-')===0&&k.slice(-11)==='-auth-token'){d=JSON.parse(st[s].getItem(k)||'{}');if(d&&d.access_token)return d.access_token;}}}}catch(e){}return null;}
  function mat(){try{return localStorage.getItem('cm:material_id')||CM_DEFAULT;}catch(e){return CM_DEFAULT;}}
  function sid(){try{var id=sessionStorage.getItem('cm:analytics_session');if(!id){id=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Math.random().toString(36).slice(2)+Date.now().toString(36));sessionStorage.setItem('cm:analytics_session',id);}return id;}catch(e){return 'a'+Date.now();}}
  function inter(t,n,m){try{var k=tok();if(!k||!n)return;fetch('/api/study/interaction',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({interaction_type:t,node_id:String(n),material_id:mat(),session_id:sid(),timestamp:new Date().toISOString(),metadata:m||{}})}).catch(function(){});}catch(e){}}
  function ev(name,m){try{var k=tok();if(!k)return;fetch('/api/events',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})})}).catch(function(){});}catch(e){}}
  function beacon(name,m){try{var k=tok();if(!k)return;var p=JSON.stringify({_token:k,event_name:name,session_id:sid(),event_timestamp:new Date().toISOString(),metadata:Object.assign({material_id:mat()},m||{})});if(navigator.sendBeacon)navigator.sendBeacon('/api/events/beacon',new Blob([p],{type:'application/json'}));}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.hidden){CM_ACTIVE+=Date.now()-_vt;beacon('tab_switch',{seconds_active:Math.round(CM_ACTIVE/1000)});}else{_vt=Date.now();}});
  window.addEventListener('pagehide',function(){if(!document.hidden)CM_ACTIVE+=Date.now()-_vt;beacon('session_end',{seconds_total:Math.round((Date.now()-CM_T0)/1000),seconds_active:Math.round(CM_ACTIVE/1000)});});
  ev('material_opened',{});ev('session_start',{});
  /* chapter/section navigation (Engine A's .cn-pill) counts as node_opened */
  document.addEventListener('click',function(e){
    var p=e.target&&e.target.closest&&e.target.closest('.cn-pill[data-ci]');
    if(!p||p._cmOpened)return; p._cmOpened=1;
    var ci=p.getAttribute('data-ci');
    inter('node_opened','ch'+ci,{}); ev('node_open',{node_id:'ch'+ci});
  });
  /* answer clicks across all three engines */
  var _cmCardIdx=0, _cmCardMap=(typeof WeakMap!=='undefined')?new WeakMap():null;
  function cmCardIndex(card){
    if(!card)return -1;
    if(_cmCardMap){ if(_cmCardMap.has(card))return _cmCardMap.get(card); var i=_cmCardIdx++; _cmCardMap.set(card,i); return i; }
    return -1;
  }
  document.addEventListener('click',function(e){
    var o=e.target&&e.target.closest&&e.target.closest('.opt,.op,.mopt,.opt-btn,.option,[data-oi]');
    if(!o||o._cmSeen)return; o._cmSeen=1;
    var container=o.closest('.opts,.qz,.mcq-card,.mcq,[data-nid],[data-qi]')||o.parentElement;
    var card=o.closest('.mcq-card,.mcq,.qz,.opts')||container;
    var nid=(container&&(container.getAttribute('data-nid')||container.getAttribute('data-node')||container.getAttribute('data-k')||container.id))||o.getAttribute('data-r');
    var qiRaw=(container&&container.getAttribute('data-qi'))||o.getAttribute('data-q')||o.getAttribute('data-j');
    var qi=qiRaw!=null?parseInt(qiRaw,10):NaN;
    var correctAttr=container&&(container.getAttribute('data-a')||container.getAttribute('data-ans'));
    var myIdx=o.getAttribute('data-j')!=null?o.getAttribute('data-j'):(o.getAttribute('data-o')!=null?o.getAttribute('data-o'):o.getAttribute('data-oi'));
    // No usable identifier anywhere in the DOM (Engine C): fall back to a
    // per-card sequential index so distinct questions in the same file never
    // collide on the same synthetic node_id (which would silently drop every
    // answer after the first under the server's first-attempt lock).
    if(!nid||isNaN(qi)){ var ci=cmCardIndex(card); if(!nid)nid='q'+ci; if(isNaN(qi))qi=ci; }
    var now=Date.now(),dt=_lastQ?now-_lastQ:0;_lastQ=now;
    setTimeout(function(){
      var isCorrect;
      if(correctAttr!=null&&myIdx!=null){
        isCorrect=(parseInt(correctAttr,10)===parseInt(myIdx,10));
      } else {
        var cl=o.classList;
        if(cl.contains('right')||cl.contains('ok')||cl.contains('correct'))isCorrect=true;
        else if(cl.contains('wrong')||cl.contains('bad')||cl.contains('incorrect'))isCorrect=false;
        else {
          var bg=(o.style&&o.style.backgroundColor)||'';
          if(!bg&&window.getComputedStyle)bg=getComputedStyle(o).backgroundColor;
          if(bg.indexOf('220, 252, 231')!==-1)isCorrect=true;
          else if(bg.indexOf('254, 226, 226')!==-1)isCorrect=false;
          else isCorrect=false;
        }
      }
      inter('mcq_attempt',String(nid),{question_index:qi,is_correct:!!isCorrect});
      ev('answer',{node_id:String(nid),question_index:qi,is_correct:!!isCorrect,time_spent_ms:dt});
    },90);
  });
})();
</script>
