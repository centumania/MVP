 s14:{
  rule:"Type 1 is present + will, Type 2 is past + would, Type 3 is had + V3 with would have + V3.",
  formula:"TYPE 1: IF + present, WILL + V1 (real)\nTYPE 2: IF + past (WERE), WOULD + V1 (imaginary)\nTYPE 3: IF + HAD + V3, WOULD HAVE + V3 (past regret)\nNEVER 'will' or 'would' inside the IF clause\nType 2 uses WERE for every subject",
  memory:"No 'will' or 'would' inside the IF clause. Ever.",
  ta:"IF clause-க்குள்ள 'will' அல்லது 'would' ஒருபோதும் வராது.",
  tl:"IF clause-kkulla 'will' alladhu 'would' orupodhum varaadhu.",
  mistake:"Writing 'If it will rain', 'If I was rich' and 'If he had studied, he would pass'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — conditionals appear in Fill in the Blank and Error Spotting."},

 s15:[
 {ta:"இப்போ Conditionals — 'if' வாக்கியம். இது SSC-ல ரொம்ப அடிக்கடி வரும், ஆனா ஒரே ஒரு விதி தெரிஞ்சா பெரும்பாலான கேள்விக்கு பதில் சொல்லிடலாம்.",
  tl:"Ippo Conditionals — 'if' vaakkiyam. Idhu SSC-la romba adikkadi varum, aanaa ore oru vidhi therinjaa perumbaalaana kelvikku padhil sollidalaam."},
 {ta:"மூணு வகை இருக்கு. TYPE 1 — உண்மையான சாத்தியம். 'If it RAINS, we WILL STAY at home.' மழை பெய்யலாம், பெய்யாமலும் இருக்கலாம். நிஜம்.",
  tl:"Moonu vagai irukku. TYPE 1 — unmaiyaana saaththiyam. 'If it RAINS, we WILL STAY at home.' Nijam."},
 {ta:"TYPE 2 — கற்பனை, இப்போ. 'If I WERE rich, I WOULD BUY a car.' நான் பணக்காரன் இல்ல, இது கற்பனை. இங்க ரொம்ப முக்கியம் — 'WERE'! 'If I WAS rich' தப்பு! எல்லா subject-க்கும் 'were' தான். If I WERE, If he WERE, If she WERE.",
  tl:"TYPE 2 — karpanai, ippo. 'If I WERE rich, I WOULD BUY a car.' Inga romba mukkiyam — 'WERE'! 'If I WAS rich' thappu! Ellaa subject-kkum 'were' thaan."},
 {ta:"TYPE 3 — கடந்தகால வருத்தம். 'If he HAD STUDIED, he WOULD HAVE PASSED.' அவரு படிக்கல, தேர்ச்சியும் பெறல. இப்போ மாத்த முடியாது. முடிஞ்சு போச்சு. இங்க ரெண்டு பாதியிலயும் perfect வடிவம் வேணும் — HAD + V3 மற்றும் WOULD HAVE + V3.",
  tl:"TYPE 3 — kadandhakaala varuththam. 'If he HAD STUDIED, he WOULD HAVE PASSED.' Inga rendu paadhiyilayum perfect vadivam venum — HAD + V3 matrum WOULD HAVE + V3."},
 {ta:"இப்போ மிக முக்கியமான ஒரே ஒரு விதி சொல்லுறேன். இது பெரும்பாலான கேள்வியை தீர்த்துடும் — 'IF clause-க்குள்ள WILL அல்லது WOULD ஒருபோதும் வராது!'",
  tl:"Ippo miga mukkiyamaana ore oru vidhi solluren. Idhu perumbaalaana kelviyai theerththudum — 'IF clause-kkulla WILL alladhu WOULD orupodhum varaadhu!'"},
 {ta:"'If it WILL rain' — தப்பு! 'If it RAINS' — சரி. 'If I WOULD be rich' — தப்பு! 'If I WERE rich' — சரி. 'If we WOULD HAVE started' — தப்பு! 'If we HAD started' — சரி. option பார்க்கும்போது முதல்ல IF clause-ஐ பாருங்க. அதுக்குள்ள 'will' அல்லது 'would' இருந்தா, உடனே தள்ளிடுங்க. அரை நொடியில பாதி option போயிடும்!",
  tl:"'If it WILL rain' — thappu! 'If it RAINS' — sari. 'If I WOULD be rich' — thappu! 'If I WERE rich' — sari. Option paarkkumbodhu mudhalla IF clause-ai paarunga. Adhukkulla 'will' alladhu 'would' irundhaa, udane thallidunga!"}]},

/* ========== RULE 115 ========== */
{n:115,rc:"CND-02",d:"Hard",t:"MIXED Conditionals and INVERSION without IF",
 tam:"கலப்பு நிபந்தனை · Had I known... · Were I you...",
 s1:{en:"A MIXED conditional joins a past condition to a present result: IF + HAD + V3, WOULD + V1. And the 'if' can be dropped entirely by INVERTING: 'HAD I known…', 'WERE I you…', 'SHOULD you need help…'.",
  ta:"ஒரு MIXED conditional ஒரு கடந்தகால நிபந்தனையை ஒரு நிகழ்கால விளைவுடன் இணைக்கிறது: IF + HAD + V3, WOULD + V1. மேலும் தலைகீழாக்குவதன் மூலம் 'if'-ஐ முற்றிலும் நீக்கலாம்: 'HAD I known…', 'WERE I you…', 'SHOULD you need help…'.",
  tl:"Oru MIXED conditional oru kadandhakaala nibandhanaiyai oru nigazhkaala vilaivudan inaikkiradhu: IF + HAD + V3, WOULD + V1. Melum thalaigeezhaakkuvadhan moolam 'if'-ai mutrilum neekkalaam.",
  formula:"MIXED CONDITIONAL\n  past condition → present result\n  IF + HAD + V3 , WOULD + V1\n\n  If he HAD STUDIED, he WOULD BE\n  an officer today.\n  (he did not study — so today he is not)\n\nINVERSION — drop the 'if'\n  If I HAD known  →  HAD I KNOWN\n  If I WERE you   →  WERE I YOU\n  If you SHOULD need → SHOULD YOU NEED\n\n  HAD I known, I would have come.\n  WERE I you, I would accept it.\n  SHOULD you need help, call me."},

 s2:[
 {h:"A mixed conditional crosses two time zones",
  en:"'If he had studied, he would BE an officer TODAY' — the condition is in the past but the result is in the present. That is why the main clause uses 'would be', not 'would have been'.",
  ta:"ஒரு mixed conditional இரண்டு கால மண்டலங்களைக் கடக்கிறது. 'If he had studied, he would BE an officer TODAY' — நிபந்தனை கடந்த காலத்தில் ஆனால் விளைவு நிகழ்காலத்தில். அதனால்தான் முதன்மை clause 'would be' பயன்படுத்துகிறது, 'would have been' அல்ல.",
  tl:"Oru mixed conditional irandu kaala mandalangalaik kadakkiradhu. Nibandhanai kadandha kaalaththil aanaal vilaivu nigazhkaalaththil. Adhanaal-dhaan mudhanmai clause 'would be' payanpaduththugiradhu."},
 {h:"Only three words allow inversion",
  en:"HAD, WERE and SHOULD can move to the front and replace the 'if'. No other verb can. 'Rained it tomorrow' is nonsense — only these three work.",
  ta:"மூன்று சொற்கள் மட்டுமே தலைகீழாக்கத்தை அனுமதிக்கின்றன. HAD, WERE மற்றும் SHOULD முன்னால் நகர்ந்து 'if'-ஐ மாற்றலாம். வேறு எந்த வினைச்சொல்லும் முடியாது. 'Rained it tomorrow' அபத்தம் — இந்த மூன்று மட்டுமே வேலை செய்கின்றன.",
  tl:"Moondru sorkal mattume thalaigeezhaakkaththai anumadhikkindrana. HAD, WERE matrum SHOULD munnaal nagarndhu 'if'-ai maatralaam. Veru endha vinaicholum mudiyaadhu."},
 {h:"After inversion, never write 'if' as well",
  en:"'Had I if known' is wrong. The inversion REPLACES the 'if'. Writing both is like using two conjunctions for one relationship — the same error family as Rule 88.",
  ta:"தலைகீழாக்கத்திற்குப் பிறகு, 'if'-ஐயும் ஒருபோதும் எழுதாதீர்கள். 'Had I if known' தவறு. தலைகீழாக்கம் 'if'-ஐ மாற்றுகிறது. இரண்டையும் எழுதுவது ஒரே தொடர்புக்கு இரண்டு இணைப்புச் சொற்களைப் பயன்படுத்துவது போன்றது — Rule 88-ன் அதே தவறுக் குடும்பம்.",
  tl:"Thalaigeezhaakkaththirkup piragu, 'if'-aiyum orupodhum ezhudhaadheergal. 'Had I if known' thavaru. Thalaigeezhaakkam 'if'-ai maatrugiradhu."},
 {h:"BUT FOR and OTHERWISE work like conditionals",
  en:"'BUT FOR your help, I would have failed' means 'if it had not been for your help'. 'Work hard, OTHERWISE you will fail' means 'if you do not work hard'. Both carry a hidden condition.",
  ta:"BUT FOR மற்றும் OTHERWISE conditional போல வேலை செய்கின்றன. 'BUT FOR your help, I would have failed' என்றால் 'உங்கள் உதவி இல்லாதிருந்திருந்தால்'. 'Work hard, OTHERWISE you will fail' என்றால் 'நீங்கள் கடினமாக உழைக்கவில்லை என்றால்'. இரண்டும் ஒரு மறைந்த நிபந்தனையைச் சுமக்கின்றன.",
  tl:"BUT FOR matrum OTHERWISE conditional pola velai seygindrana. 'BUT FOR your help, I would have failed'. 'Work hard, OTHERWISE you will fail'. Irandum oru maraindha nibandhanaiyaich sumakkindrana."}],

 s3:[
 {h:"Mixed — past cause, present result",
  d:"   TYPE 3 (both past)\n     If he HAD STUDIED,\n       he WOULD HAVE PASSED.\n       (both halves in the past)\n\n   MIXED (past cause, present result)\n     If he HAD STUDIED,\n       he WOULD BE an officer TODAY.\n        ↑ past cause    ↑ present result\n\n   Look for 'today', 'now', 'at present'\n   in the main clause."},
 {h:"The three inversions",
  d:"   If I HAD known ...\n     →  HAD I KNOWN ...\n\n   If I WERE you ...\n     →  WERE I YOU ...\n\n   If you SHOULD need help ...\n     →  SHOULD YOU NEED help ...\n\n   ⚠ ONLY had, were and should invert.\n   ⚠ NEVER write 'if' as well:\n       ✘ Had I if known ...\n       ✔ Had I known ..."},
 {h:"Hidden conditions",
  d:"   BUT FOR  =  if it had not been for\n     BUT FOR your help,\n       I would have failed.\n\n   OTHERWISE / OR ELSE  =  if not\n     Work hard, OTHERWISE you will fail.\n     Hurry, OR ELSE you will miss the bus.\n\n   IN CASE  =  if by chance\n     Take an umbrella IN CASE it rains.\n\n   PROVIDED / AS LONG AS  =  only if\n     You may go PROVIDED you finish first."}],

 s4:{
 wrong:["\"Both halves of a conditional must be in the same time.\" — Mixed conditionals cross times.",
  "\"Any verb can be inverted to replace 'if'.\" — Only had, were and should can.",
  "\"'Had I if known' is more emphatic.\" — The inversion replaces the 'if'.",
  "\"'But for' has nothing to do with conditionals.\" — It carries a hidden condition."],
 right:["Look for 'today' or 'now' in the main clause — that signals a mixed conditional.",
  "Only had, were and should can invert.",
  "After inverting, delete the 'if'.",
  "Treat 'but for', 'otherwise' and 'in case' as hidden conditionals."]},

 s5:[
 {en:"If he had studied, he would be an officer today.",ta:"அவர் படித்திருந்தால், இன்று ஒரு அதிகாரியாக இருப்பார்.",tl:"Avar padiththirundhaal, indru oru adhigaariyaaga iruppaar.",note:"A mixed conditional — past cause, present result."},
 {en:"Had I known the truth, I would have come at once.",ta:"உண்மையை நான் அறிந்திருந்தால், உடனே வந்திருப்பேன்.",tl:"Unmaiyai naan arindhirundhaal, udane vandhiruppen.",note:"Inversion replaces 'If I had known'."},
 {en:"Were I you, I would accept the offer today.",ta:"நான் உங்கள் இடத்தில் இருந்தால், இன்றே அந்த வாய்ப்பை ஏற்பேன்.",tl:"Naan ungal idaththil irundhaal, indre andha vaayppai erpen.",note:"Inversion replaces 'If I were you'."},
 {en:"Should you need any help, please call me.",ta:"உங்களுக்கு ஏதேனும் உதவி தேவைப்பட்டால், தயவுசெய்து என்னை அழையுங்கள்.",tl:"Ungalukku edhenum udhavi thevaippattaal, dhayavuseydhu ennai azhaiyungal.",note:"Inversion replaces 'If you should need'."},
 {en:"But for your timely help, I would have failed.",ta:"உங்களுடைய சரியான நேரத்து உதவி இல்லாவிட்டால், நான் தோற்றிருப்பேன்.",tl:"Ungaludaiya sariyaana neraththu udhavi illaavittaal, naan thotriruppen.",note:"'But for' carries a hidden Type 3 condition."}],

 "____ for your help, I would have failed.|But|Medium|'But for' carries a hidden condition.",
 "Work hard, ____ you will fail the test.|otherwise|Medium|'Otherwise' means 'if not'.",
 "Take an umbrella ____ case it rains.|in|Medium|'In case' means 'if by chance'.",
 "Had he ____ earlier, he would be well now.|come|Hard|A mixed conditional with inversion.",
 "You may go ____ you finish the work.|provided|Hard|'Provided' means 'only if'.",
 "____ she taken the medicine, she would be fine.|Had|Hard|Inversion replaces 'If she had'.",
 "Hurry up, ____ else you will miss the bus.|or|Hard|'Or else' means 'if not'.",
 "____ it not for you, I would have lost.|Were|Expert|'Were it not for' is a fixed inversion.",
 "If they had saved, they ____ be rich today.|would|Expert|A mixed conditional → WOULD + V1.",
 "____ I to meet him, I would tell him.|Were|Expert|'Were I to' is a fixed inversion.",
 "You will pass ____ long as you work hard.|as|Expert|'As long as' means 'only if'."],

 s8:[
 "If he had studied, he would have been an officer today.|If he had studied, he would be an officer today.|A present result needs 'would be'.",
 "Had I if known the truth, I would have come.|Had I known the truth, I would have come.|The inversion replaces the 'if'.",
 "If were I you, I would accept the offer.|Were I you, I would accept the offer.|The inversion replaces the 'if'.",
 "If should you need help, please call me.|Should you need help, please call me.|The inversion replaces the 'if'.",
 "But for your help, I would fail the exam.|But for your help, I would have failed the exam.|'But for' with a past sense needs 'would have'.",
 "Work hard, otherwise you would fail the test.|Work hard, otherwise you will fail the test.|A real warning takes 'will'.",
 "Had he came earlier, he would be well now.|Had he come earlier, he would be well now.|The inversion needs V3 after 'had'.",
 "You may go provided if you finish the work.|You may go provided you finish the work.|'Provided' already means 'if'.",
 "Was I you, I would accept the offer.|Were I you, I would accept the offer.|The inversion requires 'were'.",
 "If they had saved, they would have been rich today.|If they had saved, they would be rich today.|A present result needs 'would be'."],

 s9:[
 "Fill in the Blank|____ I known about the meeting earlier, I would certainly have attended it.|If;Had|1|Inversion replaces 'If I had'.",
 "Find the Error|If I would be (A) in your place (B), I would definitely (C) take up that offer (D).|A;B;C;D|0|Part A. It must be 'Were I in your place' or 'If I were'.",
 "Sentence Improvement|If he had taken the medicine on time, he would have been perfectly fine today.|would have been;would be;will be|1|A present result requires 'would be'.",
 "Fill in the Blank|____ you require any further clarification, kindly contact the undersigned.|If;Should|1|Inversion with 'should' fits a formal request.",
 "Find the Error|But for your (A) timely intervention (B), the situation would (C) become much worse (D).|A;B;C;D|3|Part D. A past hypothetical requires 'would have become'."],

 s10:{
  en:"Mixed conditionals catch students because both halves look like they should match. They do not: a past cause can produce a present result, and then the main clause takes 'would be', not 'would have been'. Look for 'today' or 'now'. The inversion trap is simpler — students keep the 'if' as well, giving 'Had I if known'.",
  ta:"Mixed conditional-கள் மாணவர்களைப் பிடிக்கின்றன, ஏனெனில் இரு பாதிகளும் பொருந்த வேண்டும் போலத் தெரிகின்றன. அவை பொருந்துவதில்லை: ஒரு கடந்தகால காரணம் ஒரு நிகழ்கால விளைவை உருவாக்க முடியும், அப்போது முதன்மை clause 'would be' எடுக்கிறது, 'would have been' அல்ல. 'Today' அல்லது 'now'-ஐத் தேடுங்கள். தலைகீழாக்கப் பொறி எளிமையானது — மாணவர்கள் 'if'-ஐயும் வைத்திருக்கிறார்கள்.",
  tl:"Mixed conditional-gal maanavargalaip pidikkindrana. Oru kadandhakaala kaaranam oru nigazhkaala vilaivai uruvaakka mudiyum, appodhu mudhanmai clause 'would be' edukkiradhu."},

 s11:{
  en:"ONLY HAD, WERE and SHOULD can invert. After inverting, the 'if' is gone.",
  ta:"HAD, WERE மற்றும் SHOULD மட்டுமே தலைகீழாக முடியும். தலைகீழாக்கிய பிறகு, 'if' போய்விடும்.",
  tl:"HAD, WERE matrum SHOULD mattume thalaigeezhaaga mudiyum. Thalaigeezhaakkiya piragu, 'if' poyvidum.",
  vis:"      MIXED AND INVERTED\n\n   MIXED — past cause, PRESENT result\n     If he HAD STUDIED,\n       he WOULD BE an officer TODAY.\n           ↑ not 'would have been'\n\n     Look for TODAY · NOW · AT PRESENT\n     in the main clause.\n\n   INVERSION — the 'if' disappears\n     If I HAD known    → HAD I KNOWN\n     If I WERE you     → WERE I YOU\n     If you SHOULD need→ SHOULD YOU NEED\n\n   ⚠ ONLY THESE THREE INVERT.\n   ⚠ NEVER KEEP THE 'IF' AS WELL:\n       ✘ Had I if known ...\n\n      HIDDEN CONDITIONS\n   BUT FOR      = if it had not been for\n   OTHERWISE    = if not\n   OR ELSE      = if not\n   IN CASE      = if by chance\n   PROVIDED     = only if\n   AS LONG AS   = only if"},

 s14:{
  rule:"A mixed conditional joins a past condition to a present result; had, were and should can invert and replace 'if'.",
  formula:"MIXED: IF + HAD + V3, WOULD + V1 (present result)\nINVERSION: Had I known · Were I you · Should you need\nAfter inverting, the 'if' disappears\nHIDDEN CONDITIONS: but for, otherwise, or else,\n  in case, provided, as long as",
  memory:"Only had, were and should invert. The 'if' then disappears.",
  ta:"Had, were, should மட்டும்தான் தலைகீழாகும். அப்பறம் 'if' போயிடும்.",
  tl:"Had, were, should mattum-dhaan thalaigeezhaagum. Apparam 'if' poyidum.",
  mistake:"Writing 'would have been' for a present result, and keeping the 'if' after inverting.",
  exam:"SSC CGL / CHSL, CDS and Bank — inversion without 'if' is a favourite Sentence Improvement item."},

 s15:[
 {ta:"Rule 114-ல மூணு வகை பார்த்தோம். இப்போ ரெண்டு கூடுதல் விஷயம் — கலப்பு நிபந்தனை மற்றும் 'if' இல்லாத தலைகீழாக்கம்.",
  tl:"Rule 114-la moonu vagai paarththom. Ippo rendu koodudhal vishayam — kalappu nibandhanai matrum 'if' illaadha thalaigeezhaakkam."},
 {ta:"முதல்ல கலப்பு (mixed). இதுல ரெண்டு காலம் கலக்கும்! 'If he HAD STUDIED, he WOULD BE an officer TODAY.' நிபந்தனை கடந்தகாலம் (படிக்கல), ஆனா விளைவு இப்போ (இன்று அதிகாரி இல்ல).",
  tl:"Mudhalla kalappu (mixed). Idhula rendu kaalam kalakkum! 'If he HAD STUDIED, he WOULD BE an officer TODAY.' Nibandhanai kadandhakaalam, aanaa vilaivu ippo."},
 {ta:"கவனிங்க — இங்க 'would HAVE BEEN' இல்ல, 'would BE' தான்! ஏன்? ஏன்னா விளைவு இப்போ. 'Today', 'now', 'at present' அப்படிங்கிற சொல் main clause-ல இருந்தா, அது கலப்பு நிபந்தனை.",
  tl:"Kavaninga — inga 'would HAVE BEEN' illa, 'would BE' thaan! Yennaa vilaivu ippo. 'Today', 'now', 'at present' appadingira sol main clause-la irundhaa, adhu kalappu nibandhanai."},
 {ta:"இப்போ ரெண்டாவது — 'if' இல்லாம நிபந்தனை சொல்றது! ஆங்கிலத்துல 'if' -ஐ முழுசா நீக்கிட்டு வாக்கியத்தை தலைகீழா மாத்தலாம்.",
  tl:"Ippo randaavadhu — 'if' illaama nibandhanai solradhu! Aangilaththula 'if'-ai muzhusaa neekkittu vaakkiyaththai thalaigeezhaa maaththalaam."},
 {ta:"'If I HAD known' → 'HAD I KNOWN'. 'If I WERE you' → 'WERE I YOU'. 'If you SHOULD need' → 'SHOULD YOU NEED'. மூணு சொல் மட்டும்தான் இப்படி நகர முடியும் — HAD, WERE, SHOULD. வேற எந்த வினைச்சொல்லும் முடியாது!",
  tl:"'If I HAD known' → 'HAD I KNOWN'. 'If I WERE you' → 'WERE I YOU'. 'If you SHOULD need' → 'SHOULD YOU NEED'. Moonu sol mattum-dhaan — HAD, WERE, SHOULD."},
 {ta:"இங்க ஒரு பெரிய தப்பு நடக்கும் — 'if'-ஐயும் வெச்சுக்குவாங்க! 'Had I IF known' — தப்பு! தலைகீழாக்கம் 'if'-ஐ மாத்திடுச்சு, ரெண்டும் வேணாம். இது Rule 88-ஓட அதே கொள்கை — ஒரே வேலைக்கு ரெண்டு சொல் வேணாம். கடைசியா — சில சொல் மறைஞ்ச நிபந்தனை சொல்லும். 'BUT FOR your help' = 'உங்க உதவி இல்லாட்டி'. 'OTHERWISE' மற்றும் 'OR ELSE' = 'இல்லாட்டி'. 'IN CASE' = 'ஒருவேளை'. 'PROVIDED' மற்றும் 'AS LONG AS' = 'அப்படின்னா மட்டும்'. இதெல்லாத்துக்கும் conditional விதிதான்.",
  tl:"Inga oru periya thappu nadakkum — 'if'-aiyum vechukkuvaanga! 'Had I IF known' — thappu! Idhu Rule 88-oda adhe kolgai. Kadaisiyaa — 'BUT FOR', 'OTHERWISE', 'OR ELSE', 'IN CASE', 'PROVIDED', 'AS LONG AS' — idhellaam maraincha nibandhanai."}]},

/* ========== RULE 116 ========== */
{n:116,rc:"CND-03",d:"Hard",t:"WISH, IF ONLY, AS IF and IT IS TIME — the Subjunctive WERE",
 tam:"விருப்பம் மற்றும் கற்பனைக்கு WERE · உண்மையில்லாத நிலை",
 s1:{en:"After I WISH, IF ONLY, AS IF, AS THOUGH, IT IS TIME and WOULD RATHER, an unreal situation takes the PAST form — and the verb 'be' becomes WERE for every subject.",
  ta:"I WISH, IF ONLY, AS IF, AS THOUGH, IT IS TIME மற்றும் WOULD RATHER-க்குப் பிறகு, ஒரு உண்மையற்ற நிலை இறந்தகால வடிவத்தை எடுக்கிறது — மேலும் 'be' வினைச்சொல் ஒவ்வொரு Subject-க்கும் WERE ஆகிறது.",
  tl:"I WISH, IF ONLY, AS IF, AS THOUGH, IT IS TIME matrum WOULD RATHER-kkup piragu, oru unmaiyatra nilai irandhakaala vadivaththai edukkiradhu — melum 'be' vinaichol ovvoru Subject-kkum WERE aagiradhu.",
  formula:"UNREAL PRESENT → PAST FORM, 'BE' → WERE\n\n  I WISH I WERE rich.\n  IF ONLY he WERE here!\n  He talks AS IF he WERE the boss.\n  IT IS TIME we WENT home.\n  I WOULD RATHER you CAME tomorrow.\n\nUNREAL PAST → HAD + V3\n\n  I WISH I HAD STUDIED harder.\n  IF ONLY he HAD LISTENED to me!\n  He talks AS IF he HAD SEEN it himself.\n\n⚠ NEVER 'I wish I AM' or 'I wish I WAS'."},

 s2:[
 {h:"'I wish' always means it is not true",
  en:"'I wish I were rich' means I am NOT rich. The past form signals unreality, not past time. That is why 'I wish I am rich' is wrong — it destroys the whole meaning of the wish.",
  ta:"'I wish' எப்போதும் அது உண்மையல்ல என்று பொருள்படுகிறது. 'I wish I were rich' என்றால் நான் பணக்காரன் அல்ல. இறந்தகால வடிவம் உண்மையின்மையைச் சுட்டுகிறது, கடந்த காலத்தை அல்ல. அதனால்தான் 'I wish I am rich' தவறு — அது விருப்பத்தின் முழு பொருளையும் அழிக்கிறது.",
  tl:"'I wish' eppodhum adhu unmaiyalla endru porulpadugiradhu. 'I wish I were rich' endraal naan panakkaaran alla. Irandhakaala vadivam unmaiyinmaiyaich suttugiradhu."},
 {h:"For a past regret use HAD + V3",
  en:"'I wish I had studied harder' regrets the past. 'I wish I studied harder' would mean the present. One step further back in form means one step further back in time.",
  ta:"கடந்தகால வருத்தத்திற்கு HAD + V3 பயன்படுத்தவும். 'I wish I had studied harder' கடந்த காலத்தை வருந்துகிறது. 'I wish I studied harder' நிகழ்காலத்தைக் குறிக்கும். வடிவத்தில் ஒரு படி மேலும் பின்னால் என்றால் காலத்தில் ஒரு படி மேலும் பின்னால்.",
  tl:"Kadandhakaala varuththaththirku HAD + V3 payanpaduththavum. 'I wish I had studied harder' kadandha kaalaththai varundhugiradhu."},
 {h:"IT IS TIME takes the past form",
  en:"'It is time we WENT home', not 'it is time we go home'. 'It is high time you STARTED working'. This expression always takes the past form even though it points to the present moment.",
  ta:"IT IS TIME இறந்தகால வடிவத்தை எடுக்கிறது. 'It is time we WENT home', 'it is time we go home' அல்ல. 'It is high time you STARTED working'. இந்தத் தொடர் நிகழ் தருணத்தைச் சுட்டினாலும் எப்போதும் இறந்தகால வடிவத்தை எடுக்கிறது.",
  tl:"IT IS TIME irandhakaala vadivaththai edukkiradhu. 'It is time we WENT home'. 'It is high time you STARTED working'."},
 {h:"AS IF takes WERE only when the comparison is untrue",
  en:"'He talks as if he WERE the boss' — he is not the boss. But 'It looks as if it IS going to rain' — that may well be true, so the present stays. Untrue comparison takes 'were'.",
  ta:"ஒப்பீடு உண்மையல்ல என்றால் மட்டுமே AS IF WERE எடுக்கிறது. 'He talks as if he WERE the boss' — அவர் முதலாளி அல்ல. ஆனால் 'It looks as if it IS going to rain' — அது உண்மையாக இருக்கலாம், எனவே நிகழ்காலம் அப்படியே இருக்கிறது. உண்மையற்ற ஒப்பீடு 'were' எடுக்கிறது.",
  tl:"Oppeedu unmaiyalla endraal mattume AS IF WERE edukkiradhu. 'He talks as if he WERE the boss' — avar mudhalaali alla. Aanaal 'It looks as if it IS going to rain'."}],

 s3:[
 {h:"The past form signals unreality",
  d:"   I WISH I WERE rich.\n     = I am NOT rich  😞\n\n   IF ONLY he WERE here!\n     = he is NOT here\n\n   He talks AS IF he WERE the boss.\n     = he is NOT the boss\n\n   The past form does NOT mean past time.\n   It means NOT TRUE."},
 {h:"Two levels of unreality",
  d:"   UNREAL PRESENT  →  PAST FORM\n     I wish I WERE rich.\n     I wish I KNEW the answer.\n     I wish he CAME every day.\n\n   UNREAL PAST     →  HAD + V3\n     I wish I HAD STUDIED harder.\n     I wish he HAD LISTENED to me.\n     If only I HAD KNOWN earlier!\n\n   One step further back in form\n   = one step further back in time."},
 {h:"The full expression list",
  d:"   I WISH …           → past form / had + V3\n   IF ONLY …          → past form / had + V3\n   AS IF / AS THOUGH  → past form (if untrue)\n   IT IS TIME …       → past form\n   IT IS HIGH TIME …  → past form\n   WOULD RATHER …     → past form\n   SUPPOSE / SUPPOSING→ past form\n\n   ⚠ 'BE' BECOMES 'WERE' FOR EVERY SUBJECT.\n     I were · he were · she were · it were"}],

 s4:{
 wrong:["\"'I wish I am rich' expresses the wish clearly.\" — A wish requires the past form.",
  "\"'It is time we go home' is correct.\" — It requires 'we went home'.",
  "\"'As if' always takes 'were'.\" — Only when the comparison is untrue.",
  "\"'I wish I studied harder' regrets the past.\" — A past regret needs 'had studied'."],
 right:["Remember: after 'wish', the past form means NOT TRUE.",
  "For a past regret use 'had' + V3.",
  "'It is time' and 'it is high time' always take the past form.",
  "Use 'were' for every subject in an unreal situation."]},

 s5:[
 {en:"I wish I were rich enough to help them.",ta:"அவர்களுக்கு உதவும் அளவுக்கு நான் பணக்காரனாக இருந்திருந்தால் நன்றாக இருக்கும்.",tl:"Avargalukku udhavum alavukku naan panakkaaranaaga irundhirundhaal nandraaga irukkum.",note:"'Wish' + WERE — I am not rich."},
 {en:"I wish I had studied harder in college.",ta:"கல்லூரியில் நான் இன்னும் கடினமாகப் படித்திருக்க வேண்டும்.",tl:"Kalloriyil naan innum kadinamaagap padiththirukka vendum.",note:"A past regret → HAD + V3."},
 {en:"If only he were here to see this today.",ta:"இதைப் பார்க்க அவர் இன்று இங்கே இருந்திருந்தால் எவ்வளவு நன்றாக இருக்கும்.",tl:"Idhaip paarkka avar indru inge irundhirundhaal evvalavu nandraaga irukkum.",note:"'If only' + WERE — he is not here."},
 {en:"He talks as if he were the owner of the company.",ta:"அவர் நிறுவனத்தின் உரிமையாளர் போலப் பேசுகிறார்.",tl:"Avar niruvanaththin urimaiyaalar polap pesugiraar.",note:"An untrue comparison → AS IF + WERE."},
 {en:"It is high time we started working on it.",ta:"நாம் அதில் வேலை செய்யத் தொடங்க வேண்டிய நேரம் இது.",tl:"Naam adhil velai seyyath thodanga vendiya neram idhu.",note:"'It is high time' → the past form STARTED."}],

 s6:["I wish|நான் விரும்புகிறேன்|Naan virumbugiren",
  "if only|இருந்திருந்தால்|Irundhirundhaal",

 s10:{
  en:"The past form here does not mean past time — it means NOT TRUE. That is the whole idea, and once it clicks, every expression in this rule becomes obvious. The commonest errors are 'I wish I am', 'I wish I was' and 'it is high time we start'. All three replace the unreal past with a real present and destroy the meaning.",
  ta:"இங்கே இறந்தகால வடிவம் கடந்த காலத்தைக் குறிக்கவில்லை — அது உண்மையல்ல என்று பொருள்படுகிறது. அதுதான் முழு கருத்து, அது ஒரு முறை பொருந்தியவுடன், இந்த விதியில் உள்ள ஒவ்வொரு தொடரும் தெளிவாகிவிடும். மிகப் பொதுவான தவறுகள் 'I wish I am', 'I wish I was' மற்றும் 'it is high time we start'. மூன்றுமே உண்மையற்ற இறந்த காலத்தை உண்மையான நிகழ்காலத்தால் மாற்றி பொருளை அழிக்கின்றன.",
  tl:"Inge irandhakaala vadivam kadandha kaalaththaik kurikkavillai — adhu unmaiyalla endru porulpadugiradhu. Migap podhuvaana thavarugal 'I wish I am', 'I wish I was' matrum 'it is high time we start'."},

 s11:{
  en:"THE PAST FORM MEANS 'NOT TRUE', not past time. And 'be' becomes WERE.",
  ta:"இறந்தகால வடிவம் 'உண்மையல்ல' என்று பொருள், கடந்த காலம் அல்ல. மேலும் 'be' WERE ஆகும்.",
  tl:"Irandhakaala vadivam 'unmaiyalla' endru porul, kadandha kaalam alla. Melum 'be' WERE aagum.",
  vis:"      THE PAST FORM = NOT TRUE\n\n   I WISH I WERE rich.\n     → I am NOT rich\n   IF ONLY he WERE here!\n     → he is NOT here\n   He talks AS IF he WERE the boss.\n     → he is NOT the boss\n\n   TWO LEVELS OF UNREALITY\n\n   UNREAL PRESENT → PAST FORM\n     I wish I WERE rich.\n     I wish I KNEW the answer.\n\n   UNREAL PAST    → HAD + V3\n     I wish I HAD STUDIED harder.\n     If only he HAD LISTENED!\n\n   THE FULL LIST\n     I wish · if only · as if · as though\n     it is time · it is high time\n     would rather · suppose / supposing\n\n   ⚠ 'BE' → 'WERE' FOR EVERY SUBJECT\n     ✘ I wish I AM · ✘ I wish I WAS\n     ✔ I wish I WERE"},

 s14:{
  rule:"After wish, if only, as if, it is time and would rather, an unreal situation takes the past form and 'be' becomes 'were'.",
  formula:"UNREAL PRESENT → past form (be → WERE)\nUNREAL PAST → HAD + V3\nI wish · if only · as if · as though\nit is time · it is high time · would rather · supposing\nAS IF takes 'were' only when the comparison is untrue",
  memory:"The past form means NOT TRUE, not past time.",
  ta:"இறந்தகால வடிவம் 'உண்மையில்ல'-ன்னு அர்த்தம், கடந்தகாலம் இல்ல.",
  tl:"Irandhakaala vadivam 'unmaiyilla'-nnu arththam, kadandhakaalam illa.",
  mistake:"Writing 'I wish I am', 'I wish I was' and 'it is high time we start'.",
  exam:"SSC CGL / CHSL, CDS and Bank — 'it is high time' and 'I wish I were' are repeated items."},

 s15:[
 {ta:"இந்த rule-ல ஒரு ரொம்ப அழகான கருத்து இருக்கு. இதை ஒரு தடவ புரிஞ்சுக்கிட்டா, எல்லா தொடரும் தெளிவாயிடும்.",
  tl:"Indha rule-la oru romba azhagaana karuththu irukku. Idhai oru thadava purinjukkittaa, ellaa thodarum thelivaayidum."},
 {ta:"'I WISH I WERE rich.' இங்க 'were' இறந்தகாலம் இல்ல! இது 'உண்மையில்ல' -ன்னு அர்த்தம்! நான் பணக்காரன் இல்ல, அது என்னோட ஆசை மட்டும்தான்.",
  tl:"'I WISH I WERE rich.' Inga 'were' irandhakaalam illa! Idhu 'unmaiyilla'-nnu arththam! Naan panakkaaran illa, adhu ennoda aasai mattum-dhaan."},
 {ta:"ஆங்கிலத்துல இறந்தகால வடிவம் ரெண்டு வேலை செய்யுது. ஒண்ணு — உண்மையா கடந்தகாலம் காட்டுறது. ரெண்டு — 'இது உண்மையில்ல' -ன்னு காட்டுறது. இதுக்கு subjunctive-ன்னு பேரு.",
  tl:"Aangilaththula irandhakaala vadivam rendu velai seyyudhu. Onnu — unmaiyaa kadandhakaalam kaatturadhu. Rendu — 'idhu unmaiyilla'-nnu kaatturadhu."},
 {ta:"அதனால 'I wish I AM rich' தப்பு! 'I wish I WAS rich'-ம் தப்பு! 'I wish I WERE rich' தான் சரி. எல்லா subject-க்கும் 'were' — I were, he were, she were, it were.",
  tl:"Adhanaala 'I wish I AM rich' thappu! 'I wish I WAS rich'-um thappu! 'I wish I WERE rich' thaan sari. Ellaa subject-kkum 'were'."},
 {ta:"இப்போ ரெண்டு நிலை இருக்கு. நிகழ்கால கற்பனை — இறந்தகால வடிவம். 'I wish I WERE rich', 'I wish I KNEW the answer'. கடந்தகால வருத்தம் — HAD + V3. 'I wish I HAD STUDIED harder', 'If only he HAD LISTENED'. ஒரு படி பின்னால போனா, ஒரு படி பின்னால காலம்.",
  tl:"Ippo rendu nilai irukku. Nigazhkaala karpanai — irandhakaala vadivam. Kadandhakaala varuththam — HAD + V3. Oru padi pinnaala ponaa, oru padi pinnaala kaalam."},
 {ta:"கடைசியா பட்டியல் — I WISH, IF ONLY, AS IF, AS THOUGH, IT IS TIME, IT IS HIGH TIME, WOULD RATHER, SUPPOSING. இதெல்லாத்துக்கும் இறந்தகால வடிவம். 'IT IS HIGH TIME we STARTED' — 'we start' இல்ல! இது SSC-ல ஒவ்வொரு வருஷமும் வரும். ஆனா ஒரு நுட்பம் — 'AS IF' எப்பவும் 'were' எடுக்காது! ஒப்பீடு உண்மையில்லாட்டி மட்டும்தான். 'He talks as if he WERE the boss' (அவரு boss இல்ல). ஆனா 'It looks as if it IS going to rain' (அது நிஜமா நடக்கலாம்).",
  tl:"Kadaisiyaa pattiyal — I WISH, IF ONLY, AS IF, AS THOUGH, IT IS TIME, IT IS HIGH TIME, WOULD RATHER, SUPPOSING. 'IT IS HIGH TIME we STARTED'! Aanaa 'AS IF' eppavum 'were' edukkaadhu — oppeedu unmaiyillaatti mattum-dhaan."}]},

/* ========== RULE 117 ========== */
{n:117,rc:"MIS-01",d:"Medium",t:"QUESTION TAGS — the Opposite-Polarity Rule",
 tam:"Positive வாக்கியத்துக்கு negative tag · எதிர் துருவம்",
 s1:{en:"A question tag takes the OPPOSITE polarity: a POSITIVE sentence takes a NEGATIVE tag, and a NEGATIVE sentence takes a POSITIVE tag. Use the same auxiliary as the sentence, and always use a PRONOUN in the tag.",
  ta:"ஒரு question tag எதிர் துருவத்தை எடுக்கிறது: ஒரு POSITIVE வாக்கியம் ஒரு NEGATIVE tag எடுக்கிறது, ஒரு NEGATIVE வாக்கியம் ஒரு POSITIVE tag எடுக்கிறது. வாக்கியத்தின் அதே துணை வினைச்சொல்லைப் பயன்படுத்துங்கள், மேலும் tag-ல் எப்போதும் ஒரு PRONOUN பயன்படுத்துங்கள்.",
  tl:"Oru question tag edhir thuruvaththai edukkiradhu: oru POSITIVE vaakkiyam oru NEGATIVE tag edukkiradhu, oru NEGATIVE vaakkiyam oru POSITIVE tag edukkiradhu.",
  formula:"OPPOSITE POLARITY\n\n  POSITIVE sentence → NEGATIVE tag\n    He is coming, ISN'T HE?\n    You went there, DIDN'T YOU?\n\n  NEGATIVE sentence → POSITIVE tag\n    He is not coming, IS HE?\n    You never went there, DID YOU?\n\n⚠ SPECIAL CASES\n  Let us go, SHALL WE?\n  Let him go, WILL YOU?\n  Open the door, WILL YOU?\n  I am right, AREN'T I?\n  Everyone came, DIDN'T THEY?\n  Nothing happened, DID IT?"},

 s2:[
 {h:"Find the auxiliary; if there is none, use DO",
  en:"'He is coming' has 'is' → the tag is 'isn't he'. 'He came' has no auxiliary → use 'did': 'didn't he'. 'He has gone' has 'has' → 'hasn't he'. Always reuse the auxiliary that is already there.",
  ta:"துணை வினைச்சொல்லைக் கண்டறியுங்கள்; இல்லையென்றால் DO பயன்படுத்துங்கள். 'He is coming'-ல் 'is' இருக்கிறது → tag 'isn't he'. 'He came'-க்கு துணை வினைச்சொல் இல்லை → 'did' பயன்படுத்துங்கள்: 'didn't he'. 'He has gone'-ல் 'has' இருக்கிறது → 'hasn't he'. ஏற்கனவே இருக்கும் துணை வினைச்சொல்லை எப்போதும் மீண்டும் பயன்படுத்துங்கள்.",
  tl:"Thunai vinaicholaik kandariyungal; illaiyendraal DO payanpaduththungal. 'He is coming' → 'isn't he'. 'He came' → 'didn't he'. 'He has gone' → 'hasn't he'."},
 {h:"Hidden negatives count as negative",
  en:"'He NEVER comes, does he?' — 'never' is a negative, so the tag is positive. The same for hardly, scarcely, seldom, rarely, nothing, nobody, none and few. This links to Rule 102.",
  ta:"மறைந்த எதிர்மறைகள் எதிர்மறையாகக் கணக்கிடப்படுகின்றன. 'He NEVER comes, does he?' — 'never' ஒரு எதிர்மறை, எனவே tag நேர்மறை. hardly, scarcely, seldom, rarely, nothing, nobody, none மற்றும் few-க்கும் அதேதான். இது Rule 102-உடன் இணைகிறது.",
  tl:"Maraindha edhirmaraigal edhirmaraiyaagak kanakkidappadugindrana. 'He NEVER comes, does he?' — 'never' oru edhirmarai, enave tag nermarai."},
 {h:"'Let us' takes SHALL WE",
  en:"'Let us go, SHALL WE?' — a suggestion. But 'Let him go, WILL YOU?' — permission. And a plain command takes 'will you': 'Open the door, will you?'. These three are fixed and must be memorised.",
  ta:"'Let us' SHALL WE எடுக்கிறது. 'Let us go, SHALL WE?' — ஒரு பரிந்துரை. ஆனால் 'Let him go, WILL YOU?' — அனுமதி. மேலும் ஒரு எளிய கட்டளை 'will you' எடுக்கிறது: 'Open the door, will you?'. இந்த மூன்றும் நிலையானவை, மனப்பாடம் செய்யப்பட வேண்டும்.",
  tl:"'Let us' SHALL WE edukkiradhu. 'Let us go, SHALL WE?' — oru parindhurai. Aanaal 'Let him go, WILL YOU?' — anumadhi."},
 {h:"'I am' takes AREN'T I",
  en:"'I am right, AREN'T I?' — 'amn't I' does not exist in English, so 'aren't I' is used instead. This is an oddity but it is fixed and the exam tests it.",
  ta:"'I am' AREN'T I எடுக்கிறது. 'I am right, AREN'T I?' — 'amn't I' ஆங்கிலத்தில் இல்லை, எனவே 'aren't I' அதற்குப் பதிலாகப் பயன்படுத்தப்படுகிறது. இது ஒரு விநோதம் ஆனால் அது நிலையானது, தேர்வு அதைச் சோதிக்கிறது.",
  tl:"'I am' AREN'T I edukkiradhu. 'I am right, AREN'T I?' — 'amn't I' Aangilaththil illai, enave 'aren't I' payanpaduththappadugiradhu."}],

 s3:[
 {h:"Opposite polarity",
  d:"   POSITIVE  ────►  NEGATIVE tag\n     He is coming,     isn't he?\n     She went there,   didn't she?\n     They have gone,   haven't they?\n\n   NEGATIVE  ────►  POSITIVE tag\n     He is not coming, is he?\n     She never went,   did she?\n     Nobody came,      did they?\n\n   Plus sign meets minus sign, always."},
 {h:"Which auxiliary?",
  d:"   AUXILIARY PRESENT → reuse it\n     He IS coming    → isn't he\n     He HAS gone     → hasn't he\n     He WILL come    → won't he\n     He CAN swim     → can't he\n\n   NO AUXILIARY → use DO / DOES / DID\n     He CAME         → didn't he\n     She WORKS hard  → doesn't she\n     They LIVE here  → don't they"},
 {h:"The fixed special cases",
  d:"   Let US go,          SHALL WE?\n   Let HIM go,         WILL YOU?\n   Open the door,      WILL YOU?\n   Do not go,          WILL YOU?\n   I am right,         AREN'T I?\n   Everyone came,      DIDN'T THEY?\n   Everything is fine, ISN'T IT?\n   Nothing happened,   DID IT?\n   Nobody came,        DID THEY?\n   There is a problem, ISN'T THERE?\n   This is good,       ISN'T IT?"}],

 s4:{
 wrong:["\"The tag repeats the sentence's polarity.\" — It must be the opposite.",
  "\"'He never comes, doesn't he?' is right.\" — 'Never' is negative, so the tag is positive.",
  "\"'Let us go, will you?' is correct.\" — 'Let us' takes 'shall we'.",
  "\"'I am right, amn't I?' follows the pattern.\" — English uses 'aren't I'."],
 right:["Positive sentence → negative tag; negative sentence → positive tag.",
  "Reuse the auxiliary; if there is none, use do, does or did.",
  "Treat never, hardly, seldom, nothing and nobody as negatives.",
  "Memorise: Let us → shall we; I am → aren't I."]},

 s5:[
 {en:"He is coming to the meeting, isn't he?",ta:"அவர் கூட்டத்திற்கு வருகிறார், இல்லையா?",tl:"Avar koottaththirku varugiraar, illaiyaa?",note:"Positive sentence → negative tag."},

 s10:{
  en:"Hidden negatives are the main trap. 'He hardly ever comes' looks positive because there is no 'not', but 'hardly' is a negative, so the tag must be positive. The same for never, seldom, nothing and nobody. The second layer is the fixed set — 'Let us … shall we' and 'I am … aren't I' simply have to be memorised.",
  ta:"மறைந்த எதிர்மறைகள் முக்கியப் பொறி. 'He hardly ever comes' நேர்மறையாகத் தெரிகிறது, ஏனெனில் 'not' இல்லை, ஆனால் 'hardly' ஒரு எதிர்மறை, எனவே tag நேர்மறையாக இருக்க வேண்டும். never, seldom, nothing மற்றும் nobody-க்கும் அதேதான். இரண்டாவது அடுக்கு நிலையான தொகுப்பு — 'Let us … shall we' மற்றும் 'I am … aren't I' வெறுமனே மனப்பாடம் செய்யப்பட வேண்டும்.",
  tl:"Maraindha edhirmaraigal mukkiyap pori. 'He hardly ever comes' nermaraiyaagath therigiradhu, aanaal 'hardly' oru edhirmarai. Irandaavadhu adukku nilaiyaana thoguppu."},

 s11:{
  en:"OPPOSITE POLARITY. Positive takes negative; negative takes positive.",
  ta:"எதிர் துருவம். நேர்மறை எதிர்மறை எடுக்கும்; எதிர்மறை நேர்மறை எடுக்கும்.",
  tl:"Edhir thuruvam. Nermarai edhirmarai edukkum; edhirmarai nermarai edukkum.",
  vis:"      OPPOSITE POLARITY\n\n   POSITIVE  →  NEGATIVE tag\n     He is coming,    ISN'T HE?\n     She went there,  DIDN'T SHE?\n\n   NEGATIVE  →  POSITIVE tag\n     He is not coming, IS HE?\n     Nobody came,      DID THEY?\n\n   ⚠ HIDDEN NEGATIVES COUNT:\n     never · hardly · scarcely · seldom\n     rarely · nothing · nobody · none · few\n     He NEVER comes, DOES he?\n\n   THE FIXED SET — MEMORISE:\n     Let US go        →  SHALL WE?\n     Let HIM go       →  WILL YOU?\n     Open the door    →  WILL YOU?\n     I AM right       →  AREN'T I?\n     EVERYONE came    →  DIDN'T THEY?\n     NOTHING happened →  DID IT?\n     THERE is a problem → ISN'T THERE?\n     THIS is good     →  ISN'T IT?"},

 s14:{
  rule:"A question tag takes the opposite polarity, reuses the auxiliary and always uses a pronoun.",
  formula:"POSITIVE sentence → NEGATIVE tag\nNEGATIVE sentence → POSITIVE tag\nNo auxiliary → use do / does / did\nHidden negatives: never, hardly, seldom, nothing, nobody, few\nFIXED: Let us → shall we | Let him / command → will you\n  I am → aren't I | everyone → they | nothing → it | there → there",
  memory:"Opposite polarity. Positive takes negative, negative takes positive.",
  ta:"எதிர் துருவம். Positive-க்கு negative, negative-க்கு positive.",
  tl:"Edhir thuruvam. Positive-kku negative, negative-kku positive.",
  mistake:"Missing hidden negatives like 'hardly' and writing 'Let us go, will we?'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — question tags appear as a direct 1-mark item."},

 s15:[
 {ta:"Question tag — வாக்கியத்தோட கடைசில வர்ற சின்ன கேள்வி. 'He is coming, ISN'T HE?' இது SSC-ல நேரடியா ஒரு mark.",
  tl:"Question tag — vaakkiyaththoda kadaisila varra chinna kelvi. 'He is coming, ISN'T HE?' Idhu SSC-la neradiyaa oru mark."},
 {ta:"விதி மிக எளிது — எதிர் துருவம்! வாக்கியம் positive-ஆ இருந்தா tag negative. வாக்கியம் negative-ஆ இருந்தா tag positive. கூட்டல் குறிக்கு கழித்தல் குறி.",
  tl:"Vidhi miga eladhu — edhir thuruvam! Vaakkiyam positive-aa irundhaa tag negative. Vaakkiyam negative-aa irundhaa tag positive."},
 {ta:"'He is coming, ISN'T HE?' — வாக்கியம் positive, tag negative. 'He is NOT coming, IS HE?' — வாக்கியம் negative, tag positive. எளிது!",
  tl:"'He is coming, ISN'T HE?' — vaakkiyam positive, tag negative. 'He is NOT coming, IS HE?' — vaakkiyam negative, tag positive."},
 {ta:"எந்த துணை வினைச்சொல் போடணும்? வாக்கியத்துலயே இருக்கிற அதே! 'He IS coming' → 'isn't he'. 'He HAS gone' → 'hasn't he'. 'He WILL come' → 'won't he'. துணை வினைச்சொல்லே இல்லாட்டி? DO, DOES, DID போடுங்க. 'He CAME' → 'didn't he'.",
  tl:"Endha thunai vinaichol podanum? Vaakkiyaththulaye irukkira adhe! 'He IS coming' → 'isn't he'. Thunai vinaicholle illaatti? DO, DOES, DID podunga."},
 {ta:"இப்போ மிக முக்கியமான பொறி — மறைந்த எதிர்மறை! 'He HARDLY ever comes' — இதுல 'not' இல்ல, அதனால positive மாதிரி தோணும். ஆனா 'hardly' ஒரு எதிர்மறை! அதனால tag POSITIVE — 'does he?'. இதே மாதிரி never, seldom, rarely, scarcely, nothing, nobody, none, few. இது நீங்க Rule 102-ல படிச்சது!",
  tl:"Ippo miga mukkiyamaana pori — maraindha edhirmarai! 'He HARDLY ever comes' — idhula 'not' illa, aanaa 'hardly' oru edhirmarai! Adhanaala tag POSITIVE — 'does he?'."},
 {ta:"கடைசியா சில நிலையான வடிவம் — இதெல்லாம் மனப்பாடம்தான். 'Let US go' → 'SHALL WE?'. 'Let HIM go' → 'WILL YOU?'. கட்டளை ('Open the door') → 'WILL YOU?'. 'I AM right' → 'AREN'T I?' (ஏன்னா 'amn't I' ஆங்கிலத்துல இல்ல!). 'EVERYONE came' → 'DIDN'T THEY?'. 'NOTHING happened' → 'DID IT?'. 'THERE is a problem' → 'ISN'T THERE?'. 'THIS is good' → 'ISN'T IT?'. இந்த எட்டு மனப்பாடம் பண்ணுங்க, tag கேள்வி எப்பவும் சரியா வரும்.",
  tl:"Kadaisiyaa sila nilaiyaana vadivam — idhellaam manappaadam-dhaan. 'Let US go' → 'SHALL WE?'. 'Let HIM go' → 'WILL YOU?'. 'I AM right' → 'AREN'T I?'. 'EVERYONE came' → 'DIDN'T THEY?'. 'NOTHING happened' → 'DID IT?'. 'THERE is' → 'ISN'T THERE?'."}]},
/* ========== RULE 118 ========== */
{n:118,rc:"MIS-02",d:"Hard",t:"The SUBJUNCTIVE after SUGGEST, INSIST, DEMAND and ORDER",
 tam:"Suggest/insist/demand + THAT + SHOULD + அடிப்படை வடிவம்",
 s1:{en:"After SUGGEST, INSIST, DEMAND, ORDER, PROPOSE, RECOMMEND, REQUEST, URGE and DESIRE, the 'that' clause takes SHOULD + V1 — or the bare V1 with no 's', no tense and no modal.",
  ta:"SUGGEST, INSIST, DEMAND, ORDER, PROPOSE, RECOMMEND, REQUEST, URGE மற்றும் DESIRE-க்குப் பிறகு, 'that' clause SHOULD + V1 எடுக்கிறது — அல்லது 's' இல்லாத, காலம் இல்லாத, modal இல்லாத வெறும் V1.",
  tl:"SUGGEST, INSIST, DEMAND, ORDER, PROPOSE, RECOMMEND, REQUEST, URGE matrum DESIRE-kkup piragu, 'that' clause SHOULD + V1 edukkiradhu — alladhu 's' illaadha, kaalam illaadha verum V1.",
  formula:"VERB + THAT + subject + SHOULD + V1\n\n  He SUGGESTED that I SHOULD GO.        ✔\n  He SUGGESTED that I GO.               ✔\n  He SUGGESTED that I WENT.             ✘\n  He SUGGESTED me to go.                ✘\n\n  She INSISTED that he SHOULD APOLOGISE.\n  They DEMANDED that the rule BE CHANGED.\n  The doctor RECOMMENDED that he REST.\n\n⚠ NO 's' ON THE VERB, EVEN AFTER HE / SHE\n  He suggested that she GO.  (not 'goes')"},

 s2:[
 {h:"The verb loses its tense entirely",
  en:"'He suggested that I go' — no 's', no past, no 'will'. This is the subjunctive: the verb sits in its bare form because the action is proposed, not real. 'He suggested that I went' is wrong.",
  ta:"வினைச்சொல் அதன் காலத்தை முற்றிலும் இழக்கிறது. 'He suggested that I go' — 's' இல்லை, இறந்த காலம் இல்லை, 'will' இல்லை. இது subjunctive: செயல் முன்மொழியப்பட்டது, உண்மையானது அல்ல என்பதால் வினைச்சொல் அதன் வெற்று வடிவத்தில் அமர்கிறது. 'He suggested that I went' தவறு.",
  tl:"Vinaichol adhan kaalaththai mutrilum izhakkiradhu. 'He suggested that I go' — 's' illai, irandha kaalam illai, 'will' illai. Idhu subjunctive."},
 {h:"SUGGEST never takes an object plus infinitive",
  en:"'He suggested ME to go' is wrong. 'Suggest' cannot be followed by a person plus 'to'. Say 'He suggested that I should go' or 'He suggested going'. This is one of the most planted errors in SSC.",
  ta:"SUGGEST ஒருபோதும் object மற்றும் infinitive எடுக்காது. 'He suggested ME to go' தவறு. 'Suggest'-ஐத் தொடர்ந்து ஒரு நபர் மற்றும் 'to' வர முடியாது. 'He suggested that I should go' அல்லது 'He suggested going' சொல்லுங்கள். இது SSC-ல் மிக அதிகமாக வைக்கப்படும் தவறுகளில் ஒன்று.",
  tl:"SUGGEST orupodhum object matrum infinitive edukkaadhu. 'He suggested ME to go' thavaru. 'He suggested that I should go' alladhu 'He suggested going' sollungal."},
 {h:"The negative is 'should not' or bare 'not'",
  en:"'He insisted that she SHOULD NOT GO' or 'He insisted that she NOT GO'. There is no 'does not' or 'did not' in the subjunctive — the 'not' sits directly before the bare verb.",
  ta:"எதிர்மறை 'should not' அல்லது வெறும் 'not'. 'He insisted that she SHOULD NOT GO' அல்லது 'He insisted that she NOT GO'. Subjunctive-ல் 'does not' அல்லது 'did not' இல்லை — 'not' நேரடியாக வெற்று வினைச்சொல்லுக்கு முன் அமர்கிறது.",
  tl:"Edhirmarai 'should not' alladhu verum 'not'. 'He insisted that she SHOULD NOT GO' alladhu 'He insisted that she NOT GO'. Subjunctive-l 'does not' alladhu 'did not' illai."},
 {h:"Fixed subjunctive phrases keep the old form",
  en:"'God SAVE the king', 'Long LIVE the queen', 'Heaven FORBID', 'So BE it', 'Come what MAY'. These frozen phrases preserve the old English subjunctive and never take an 's'.",
  ta:"நிலையான subjunctive தொடர்கள் பழைய வடிவத்தைத் தக்கவைக்கின்றன. 'God SAVE the king', 'Long LIVE the queen', 'Heaven FORBID', 'So BE it', 'Come what MAY'. இந்த உறைந்த தொடர்கள் பழைய ஆங்கில subjunctive-ஐப் பாதுகாக்கின்றன, ஒருபோதும் 's' எடுக்காது.",
  tl:"Nilaiyaana subjunctive thodargal pazhaiya vadivaththaith thakkavaikkindrana. 'God SAVE the king', 'Long LIVE the queen', 'So BE it', 'Come what MAY'."}],

 s3:[
 {h:"The verb sits in its bare form",
  d:"   VERB + THAT + subject + SHOULD + V1\n              or\n   VERB + THAT + subject + V1 (bare)\n\n   He suggested that I SHOULD GO.   ✔\n   He suggested that I GO.          ✔\n   He suggested that he GO.         ✔ (no 's'!)\n   He suggested that I WENT.        ✘\n   He suggested that I WILL GO.     ✘"},
 {h:"The verb list",
  d:"   SUGGEST    INSIST     DEMAND\n   ORDER      PROPOSE    RECOMMEND\n   REQUEST    URGE       DESIRE\n   COMMAND    ADVISE     REQUIRE\n\n   All take: that + subject + should + V1\n\n   ⚠ 'SUGGEST' NEVER TAKES A PERSON + 'TO'\n     ✘ He suggested ME to go.\n     ✔ He suggested that I should go.\n     ✔ He suggested going."},
 {h:"Negatives and frozen phrases",
  d:"   NEGATIVE\n     He insisted that she SHOULD NOT go.\n     He insisted that she NOT go.\n     ✘ 'that she did not go'\n\n   FROZEN SUBJUNCTIVES\n     God SAVE the king.\n     Long LIVE the queen.\n     Heaven FORBID.\n     So BE it.\n     Come what MAY.\n     If need BE.\n\n   These never take an 's'."}],

 s4:{
 wrong:["\"'He suggested that I went' matches the past reporting verb.\" — The subjunctive has no tense.",
  "\"'He suggested me to go' is normal English.\" — 'Suggest' never takes a person plus 'to'.",
  "\"'He insisted that she goes' follows subject-verb agreement.\" — The subjunctive takes no 's'.",
  "\"'God saves the king' is the correct form.\" — The frozen phrase is 'God save the king'."],
 right:["Use 'that + subject + should + V1', or the bare V1.",
  "Never write 'suggested me to' — use 'suggested that I should'.",
  "The subjunctive verb takes no 's', no tense and no modal.",
  "Learn the frozen phrases: God save, Long live, So be it."]},

 s5:[
 {en:"He suggested that I should apply for the post.",ta:"அந்தப் பதவிக்கு நான் விண்ணப்பிக்க வேண்டும் என்று அவர் பரிந்துரைத்தார்.",tl:"Andhap padhavikku naan vinnappikka vendum endru avar parindhuraiththaar.",note:"SUGGEST + THAT + SHOULD + V1."},
 {en:"She insisted that he apologise at once.",ta:"அவர் உடனே மன்னிப்புக் கேட்க வேண்டும் என்று அவள் வலியுறுத்தினாள்.",tl:"Avar udane mannippuk ketka vendum endru aval valiyuruththinaal.",note:"The bare subjunctive — no 's' on 'apologise'."},
 {en:"They demanded that the rule be changed immediately.",ta:"விதி உடனடியாக மாற்றப்பட வேண்டும் என்று அவர்கள் கோரினர்.",tl:"Vidhi udanadiyaaga maatrappada vendum endru avargal korinar.",note:"'Be changed' — the passive subjunctive."},
 {en:"The doctor recommended that he rest for a week.",ta:"அவர் ஒரு வாரம் ஓய்வெடுக்க வேண்டும் என்று மருத்துவர் பரிந்துரைத்தார்.",tl:"Avar oru vaaram oyvedukka vendum endru maruththuvar parindhuraiththaar.",note:"'Rest', not 'rests' — the subjunctive takes no 's'."},
 {en:"He insisted that she should not go there alone.",ta:"அவள் அங்கே தனியாகச் செல்லக் கூடாது என்று அவர் வலியுறுத்தினார்.",tl:"Aval ange thaniyaagach sellak koodaadhu endru avar valiyuruththinaar.",note:"The negative subjunctive → SHOULD NOT + V1."}],

 s9:[

 s10:{
  en:"'He suggested me to go' is the single most planted error in this rule, because 'advise', 'tell' and 'ask' all allow that shape — but 'suggest' does not. The second trap is the missing 's': after 'he' and 'she' we instinctively add one, but the subjunctive has no tense and no agreement at all.",
  ta:"'He suggested me to go' இந்த விதியில் மிக அதிகமாக வைக்கப்படும் ஒற்றைத் தவறு, ஏனெனில் 'advise', 'tell' மற்றும் 'ask' அனைத்தும் அந்த வடிவத்தை அனுமதிக்கின்றன — ஆனால் 'suggest' அனுமதிக்காது. இரண்டாவது பொறி விடுபட்ட 's': 'he' மற்றும் 'she'-க்குப் பிறகு நாம் உள்ளுணர்வாக ஒன்றைச் சேர்க்கிறோம், ஆனால் subjunctive-க்கு காலமும் இல்லை, ஒத்திசைவும் இல்லை.",
  tl:"'He suggested me to go' indha vidhiyil miga adhigamaaga vaikkappadum otraith thavaru. Irandaavadhu pori vidubatta 's': subjunctive-kku kaalamum illai, oththisaivum illai."},

 s11:{
  en:"SHOULD + V1, or the bare V1. No 's', no tense, no 'suggested me to'.",
  ta:"SHOULD + V1, அல்லது வெறும் V1. 's' இல்ல, காலம் இல்ல, 'suggested me to' இல்ல.",
  tl:"SHOULD + V1, alladhu verum V1. 's' illa, kaalam illa, 'suggested me to' illa.",
  vis:"      THE SUBJUNCTIVE\n\n   VERB + THAT + subject + SHOULD + V1\n              or the BARE V1\n\n   He suggested that I SHOULD GO.  ✔\n   He suggested that I GO.         ✔\n   He suggested that he GO.        ✔  no 's'!\n   He suggested that I WENT.       ✘\n   He suggested that I WILL GO.    ✘\n\n   THE VERBS:\n     suggest · insist · demand · order\n     propose · recommend · request\n     urge · desire · command · require\n   ALSO: it is essential / necessary /\n         important / imperative THAT …\n\n   ⚠ 'SUGGEST' NEVER TAKES PERSON + 'TO'\n     ✘ He suggested ME TO go.\n     ✔ He suggested THAT I SHOULD go.\n     ✔ He suggested GOING.\n\n   ⚠ NEGATIVE: should NOT + V1, or bare NOT + V1\n\n   ⚠ FROZEN PHRASES:\n     God SAVE the king · Long LIVE the queen\n     So BE it · Come what MAY · If need BE"},

 s14:{
  rule:"After suggest, insist, demand and similar verbs, the 'that' clause takes should + V1 or the bare V1.",
  formula:"VERB + THAT + subject + SHOULD + V1 (or bare V1)\nsuggest · insist · demand · order · propose · recommend\nrequest · urge · desire · command · require\nit is essential / necessary / important / imperative THAT\nNO 's', NO tense, NO modal on the verb\n'Suggest' never takes a person + 'to'",
  memory:"Should + V1, or the bare verb. No 's', no tense.",
  ta:"Should + V1, இல்லாட்டி வெறும் வினைச்சொல். 's' இல்ல, காலம் இல்ல.",
  tl:"Should + V1, illaatti verum vinaichol. 's' illa, kaalam illa.",
  mistake:"Writing 'He suggested me to go' and 'He insisted that he apologises'.",
  exam:"SSC CGL / CHSL, CDS and Bank — 'suggested me to' is one of the most repeated Error Spotting items."},

 s15:[
 {ta:"இந்த rule-ல ஒரு பழைய ஆங்கில வடிவம் இருக்கு — subjunctive. இது கொஞ்சம் வித்தியாசமா தோணும், ஆனா SSC-ல அடிக்கடி வரும்.",
  tl:"Indha rule-la oru pazhaiya Aangila vadivam irukku — subjunctive. Idhu konjam viththiyaasamaa thonum, aanaa SSC-la adikkadi varum."},
 {ta:"சில வினைச்சொல்லுக்கு அப்பறம் 'that' clause-ல வினைச்சொல் அதோட காலத்தையே இழந்துடும்! SUGGEST, INSIST, DEMAND, ORDER, PROPOSE, RECOMMEND, REQUEST, URGE, DESIRE.",
  tl:"Sila vinaicholukku apparam 'that' clause-la vinaichol adhoda kaalaththaiye izhandhudum! SUGGEST, INSIST, DEMAND, ORDER, PROPOSE, RECOMMEND, REQUEST, URGE, DESIRE."},
 {ta:"'He suggested that I SHOULD GO' — சரி. 'He suggested that I GO' — இதுவும் சரி! ஆனா 'He suggested that I WENT' — தப்பு! ஏன்? ஏன்னா அது இன்னும் நடக்கல, அது ஒரு பரிந்துரை மட்டும்தான். அதனால காலம் கிடையாது.",
  tl:"'He suggested that I SHOULD GO' — sari. 'He suggested that I GO' — idhuvum sari! Aanaa 'He suggested that I WENT' — thappu! Yennaa adhu innum nadakkala, adhu oru parindhurai mattum-dhaan."},
 {ta:"மிக முக்கியமான ஒரு விஷயம் — 's' போடக்கூடாது! 'He insisted that he APOLOGISE' — 'apologises' இல்ல! 'The doctor recommended that he REST' — 'rests' இல்ல! Subjunctive-க்கு subject-verb ஒத்திசைவே கிடையாது.",
  tl:"Miga mukkiyamaana oru vishayam — 's' podakkoodaadhu! 'He insisted that he APOLOGISE' — 'apologises' illa! 'The doctor recommended that he REST' — 'rests' illa!"},
 {ta:"இப்போ SSC-ஓட மிகப் பிரபலமான பொறி — 'He SUGGESTED ME TO go.' இது தப்பு! ஏன்? ஏன்னா 'advise', 'tell', 'ask' -க்கு 'me to' வரும் ('He advised me to go' — சரி). ஆனா 'suggest' -க்கு வராது! சரியான வடிவம் — 'He suggested THAT I SHOULD go' அல்லது 'He suggested GOING'.",
  tl:"Ippo SSC-oda migap pirabalamaana pori — 'He SUGGESTED ME TO go.' Idhu thappu! 'He advised me to go' — sari. Aanaa 'suggest'-kku varaadhu! 'He suggested THAT I SHOULD go' alladhu 'He suggested GOING'."},
 {ta:"கடைசியா ரெண்டு விஷயம். ஒண்ணு — 'It is essential/necessary/important/imperative THAT...' இதுக்கும் subjunctive! 'It is essential that he BE present' — 'is' இல்ல! ரெண்டு — சில உறைந்த தொடர். 'God SAVE the king' ('saves' இல்ல!). 'Long LIVE the queen'. 'So BE it'. 'Come what MAY'. 'If need BE'. இதெல்லாம் பழைய ஆங்கிலத்தோட மிச்சம், அப்படியே மனப்பாடம் பண்ணுங்க.",
  tl:"Kadaisiyaa rendu vishayam. Onnu — 'It is essential/necessary/important/imperative THAT...' idhukkum subjunctive! Rendu — 'God SAVE the king', 'Long LIVE the queen', 'So BE it', 'Come what MAY', 'If need BE'."}]},

/* ========== RULE 119 ========== */
{n:119,rc:"MIS-03",d:"Medium",t:"Commonly CONFUSED Word Pairs",
 tam:"Its/It's · Affect/Effect · Principal/Principle · Stationary/Stationery",
 s1:{en:"Certain pairs differ by one letter but carry entirely different meanings. ITS is possessive, IT'S means 'it is'. AFFECT is a verb, EFFECT is a noun. PRINCIPAL is a head or main, PRINCIPLE is a rule. STATIONARY means still, STATIONERY means writing material.",
  ta:"சில ஜோடிகள் ஒரு எழுத்தால் வேறுபடுகின்றன ஆனால் முற்றிலும் வேறுபட்ட பொருள்களைச் சுமக்கின்றன. ITS உடைமை, IT'S என்றால் 'it is'. AFFECT ஒரு வினைச்சொல், EFFECT ஒரு பெயர்ச்சொல். PRINCIPAL ஒரு தலைவர் அல்லது முதன்மை, PRINCIPLE ஒரு விதி. STATIONARY என்றால் அசையாத, STATIONERY என்றால் எழுதுபொருள்.",
  tl:"Sila jodigal oru ezhuththaal verupadugindrana aanaal mutrilum verupatta porulgalaich sumakkindrana. ITS udaimai, IT'S endraal 'it is'. AFFECT oru vinaichol, EFFECT oru peyarchol.",
  formula:"THE HIGH-FREQUENCY PAIRS\n\n  ITS (possessive)   IT'S (it is)\n  AFFECT (verb)      EFFECT (noun)\n  PRINCIPAL (head)   PRINCIPLE (rule)\n  STATIONARY (still) STATIONERY (paper)\n  COMPLEMENT (completes) COMPLIMENT (praise)\n  ADVICE (noun)      ADVISE (verb)\n  PRACTICE (noun)    PRACTISE (verb)\n  LOSE (misplace)    LOOSE (not tight)\n  THEIR / THERE / THEY'RE\n  YOUR / YOU'RE\n  ACCEPT (receive)   EXCEPT (leaving out)"},

 s2:[
 {h:"ITS versus IT'S — the apostrophe means 'is'",
  en:"'The dog wagged ITS tail' — possessive, no apostrophe. 'IT'S raining' — 'it is raining'. If you can expand it to 'it is' or 'it has', use the apostrophe. Otherwise do not.",
  ta:"ITS மற்றும் IT'S — apostrophe என்றால் 'is'. 'The dog wagged ITS tail' — உடைமை, apostrophe இல்லை. 'IT'S raining' — 'it is raining'. அதை 'it is' அல்லது 'it has' என்று விரிவாக்க முடிந்தால், apostrophe பயன்படுத்துங்கள். இல்லையெனில் வேண்டாம்.",
  tl:"ITS matrum IT'S — apostrophe endraal 'is'. 'The dog wagged ITS tail' — udaimai. 'IT'S raining' — 'it is raining'. Adhai 'it is' endru virivaakka mudindhaal, apostrophe payanpaduththungal."},
 {h:"AFFECT is what you do; EFFECT is what happens",
  en:"'The rain AFFECTED the crops' — a verb, an action. 'The rain had a bad EFFECT on the crops' — a noun, a result. Memory: A for Action (affect), E for End result (effect).",
  ta:"AFFECT என்பது நீங்கள் செய்வது; EFFECT என்பது நிகழ்வது. 'The rain AFFECTED the crops' — ஒரு வினைச்சொல், ஒரு செயல். 'The rain had a bad EFFECT on the crops' — ஒரு பெயர்ச்சொல், ஒரு விளைவு. நினைவு: Action-க்கு A (affect), End result-க்கு E (effect).",
  tl:"AFFECT enbadhu neengal seyvadhu; EFFECT enbadhu nigazhvadhu. Ninaivu: Action-kku A (affect), End result-kku E (effect)."},
 {h:"PRINCIPAL is a person or the main thing",
  en:"'The PRINCIPAL of the college' — a person. 'The PRINCIPAL reason' — the main one. 'PRINCIPLE' is always a rule or belief: 'a man of PRINCIPLE'. Memory: the principAL is your PAL.",
  ta:"PRINCIPAL ஒரு நபர் அல்லது முதன்மையானது. 'The PRINCIPAL of the college' — ஒரு நபர். 'The PRINCIPAL reason' — முதன்மையானது. 'PRINCIPLE' எப்போதும் ஒரு விதி அல்லது நம்பிக்கை: 'a man of PRINCIPLE'. நினைவு: principAL உங்கள் PAL.",
  tl:"PRINCIPAL oru nabar alladhu mudhanmaiyaanadhu. 'The PRINCIPAL of the college' — oru nabar. 'PRINCIPLE' eppodhum oru vidhi: 'a man of PRINCIPLE'. Ninaivu: principAL ungal PAL."},
 {h:"ADVICE is the thing; ADVISE is the doing",
  en:"'He gave me good ADVICE' — a noun, with a 'c'. 'He ADVISED me to wait' — a verb, with an 's'. The same pattern runs through practice/practise and licence/license.",
  ta:"ADVICE பொருள்; ADVISE செய்தல். 'He gave me good ADVICE' — ஒரு பெயர்ச்சொல், 'c'-உடன். 'He ADVISED me to wait' — ஒரு வினைச்சொல், 's'-உடன். அதே பாணி practice/practise மற்றும் licence/license வழியாகவும் இயங்குகிறது.",
  tl:"ADVICE porul; ADVISE seydhal. 'He gave me good ADVICE' — oru peyarchol, 'c'-udan. 'He ADVISED me to wait' — oru vinaichol, 's'-udan."}],

 s3:[
 {h:"The apostrophe pairs",
  d:"   ITS    = belonging to it   (no apostrophe)\n   IT'S   = it is / it has\n     The dog wagged ITS tail.\n     IT'S raining outside.\n\n   THEIR  = belonging to them\n   THERE  = in that place\n   THEY'RE= they are\n\n   YOUR   = belonging to you\n   YOU'RE = you are\n\n   ⚠ TEST: can you expand it to two words?\n     Yes → use the apostrophe."},
 {h:"Noun or verb?",
  d:"   AFFECT (verb)     EFFECT (noun)\n     The rain AFFECTED the crops.\n     The rain had an EFFECT on them.\n     A = Action · E = End result\n\n   ADVICE (noun)     ADVISE (verb)\n     good ADVICE  ·  he ADVISED me\n\n   PRACTICE (noun)   PRACTISE (verb)\n     daily PRACTICE · I PRACTISE daily\n\n   ⚠ 'C' for the noun, 'S' for the verb."},
 {h:"The meaning pairs",
  d:"   PRINCIPAL  head, main   (your PAL)\n   PRINCIPLE  a rule or belief\n\n   STATIONARY not moving  (stAnd still)\n   STATIONERY paper, pens (writEr)\n\n   COMPLEMENT completes it\n   COMPLIMENT praise\n\n   LOSE   misplace  ·  LOOSE  not tight\n   ACCEPT receive   ·  EXCEPT leaving out\n   BESIDE next to   ·  BESIDES in addition"}],

 s4:{

 s5:[
 {en:"The dog wagged its tail happily at the gate.",ta:"நாய் வாசலில் மகிழ்ச்சியுடன் தன் வாலை ஆட்டியது.",tl:"Naay vaasalil magizhchiyudan than vaalai aattiyadhu.",note:"ITS — possessive, with no apostrophe."},
 {en:"It's raining heavily outside right now.",ta:"இப்போது வெளியே கனமழை பெய்கிறது.",tl:"Ippodhu veliye kanamazhai peygiradhu.",note:"IT'S — short for 'it is'."},
 {en:"The heavy rain affected the standing crops.",ta:"கனமழை நிற்கும் பயிர்களைப் பாதித்தது.",tl:"Kanamazhai nirkum payirgalaip paadhiththadhu.",note:"AFFECT — a verb."},
 {en:"The rain had a bad effect on the crops.",ta:"மழை பயிர்களில் மோசமான விளைவை ஏற்படுத்தியது.",tl:"Mazhai payirgalil mosamaana vilaivai erpaduththiyadhu.",note:"EFFECT — a noun."},
 {en:"The principal is a man of high principle.",ta:"தலைமையாசிரியர் உயர்ந்த கொள்கை உள்ளவர்.",tl:"Thalaimaiyaasiriyar uyarndha kolgai ullavar.",note:"PRINCIPAL the person, PRINCIPLE the rule — both in one sentence."}],

 s7:[
 "The dog wagged ____ tail happily.|its|Easy|Possessive → ITS, no apostrophe.",
 "____ raining heavily outside now.|It's|Easy|'It is' → IT'S.",
 "The rain ____ the standing crops badly.|affected|Easy|A verb → AFFECT.",
 "The rain had a bad ____ on the crops.|effect|Medium|A noun → EFFECT.",
 "The ____ of the college addressed us.|principal|Medium|A person → PRINCIPAL.",
 "He is a man of high ____ .|principle|Medium|A rule or belief → PRINCIPLE.",
 "The bus remained ____ for an hour.|stationary|Medium|Not moving → STATIONARY.",
 "He bought pens from the ____ shop.|stationery|Hard|Writing material → STATIONERY.",
 "He gave me some very useful ____ .|advice|Hard|A noun → ADVICE.",
 "The doctor ____ me to rest completely.|advised|Hard|A verb → ADVISE.",
 "She paid him a nice ____ on his work.|compliment|Hard|Praise → COMPLIMENT.",
 "Be careful not to ____ your ticket.|lose|Expert|Misplace → LOSE.",
 "The screw has become very ____ .|loose|Expert|Not tight → LOOSE.",
 "Everyone came ____ my elder brother.|except|Expert|Leaving out → EXCEPT.",
 "He needs daily ____ to improve his game.|practice|Expert|A noun → PRACTICE."],

 s8:[
 "The dog wagged it's tail happily at the gate.|The dog wagged its tail happily at the gate.|Possessive 'its' takes no apostrophe.",
 "Its raining heavily outside right now.|It's raining heavily outside right now.|'It is' requires the apostrophe.",
 "The heavy rain effected the standing crops.|The heavy rain affected the standing crops.|The verb is 'affect'.",
 "The rain had a bad affect on the crops.|The rain had a bad effect on the crops.|The noun is 'effect'.",
 "The principle of the college addressed us.|The principal of the college addressed us.|A person is a 'principal'.",
 "He is a man of high principal values.|He is a man of high principles.|A belief is a 'principle'.",
 "He bought pens from the stationary shop.|He bought pens from the stationery shop.|Writing material is 'stationery'.",
 "The doctor adviced me to rest completely.|The doctor advised me to rest completely.|The verb is 'advise'.",
 "Be careful not to loose your ticket.|Be careful not to lose your ticket.|To misplace is 'lose'.",
 "Everyone came accept my elder brother.|Everyone came except my elder brother.|'Leaving out' is 'except'."],

 s9:[
 "Fill in the Blank|The prolonged drought has had a devastating ____ on agriculture in the region.|affect;effect|1|A noun requires 'effect'.",
 "Find the Error|The principle of (A) the college has (B) announced a holiday (C) on Monday next (D).|A;B;C;D|0|Part A. The head of a college is the 'principal'.",
 "Sentence Improvement|The doctor adviced him to avoid oily food for at least a month.|adviced;advised;advice|1|The verb is 'advise', so the past is 'advised'.",
 "Fill in the Blank|The vehicle remained ____ at the traffic signal for nearly ten minutes.|stationery;stationary|1|Not moving is 'stationary'.",
 "Find the Error|Everyone in the class (A) submitted the assignment (B) accept two (C) students who were absent (D).|A;B;C;D|2|Part C. 'Leaving out' is 'except'."],

 s10:{
  en:"These are pure spelling-and-meaning questions, and they are free marks if you know them. The exam favours four: its/it's, affect/effect, principal/principle and stationary/stationery. Each pair has a memory hook — 'it's' expands to 'it is', A is for Action, the principAL is your PAL, and stationEry is for writEr.",
  ta:"இவை தூய எழுத்துக்கூட்டல் மற்றும் பொருள் கேள்விகள், அவை உங்களுக்குத் தெரிந்தால் இலவச மதிப்பெண்கள். தேர்வு நான்கை விரும்புகிறது: its/it's, affect/effect, principal/principle மற்றும் stationary/stationery. ஒவ்வொரு ஜோடிக்கும் ஒரு நினைவு கொக்கி உண்டு — 'it's' 'it is'-ஆக விரிகிறது, A என்பது Action-க்கு, principAL உங்கள் PAL, மேலும் stationEry writEr-க்கு.",
  tl:"Ivai thooya ezhuththukkoottal matrum porul kelvigal, avai ungalukkuth therindhaal ilavasa madhippengal. Ovvoru jodikkum oru ninaivu kokki undu."},

 s11:{
  en:"'IT'S' expands to 'it is'. A is for Action. The principAL is your PAL.",
  ta:"'IT'S' 'it is'-ஆ விரியும். A என்பது Action. PrincipAL உங்க PAL.",
  tl:"'IT'S' 'it is'-aa viriyum. A enbadhu Action. PrincipAL unga PAL.",
  vis:"      THE MEMORY HOOKS\n\n   IT'S  →  expand to 'IT IS'\n     ✔ IT'S raining  = it is raining\n     ✔ ITS tail      = belonging to it\n\n   AFFECT / EFFECT\n     A = ACTION  (verb)   → rain AFFECTED crops\n     E = END result (noun)→ a bad EFFECT\n\n   PRINCIPAL / PRINCIPLE\n     The principAL is your PAL (a person)\n     A principLE is a ruLE\n\n   STATIONARY / STATIONERY\n     stationAry — stAnd still\n     stationEry — for a writEr\n\n   'C' NOUN, 'S' VERB\n     adviCe (noun)  ·  adviSe (verb)\n     practiCe (noun)·  practiSe (verb)\n\n   OTHERS\n     LOSE misplace   · LOOSE not tight\n     ACCEPT receive  · EXCEPT leaving out\n     COMPLEMENT completes · COMPLIMENT praise\n     THEIR / THERE / THEY'RE\n     YOUR / YOU'RE"},
