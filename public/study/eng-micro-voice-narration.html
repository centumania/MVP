 s7:[
 "He said that he ____ very busy.|was|Easy|Past reporting verb → is becomes was.",
 "He ____ me that he had finished.|told|Easy|'Said to me' becomes 'told me'.",
 "She says that she ____ going to Delhi.|is|Easy|A present reporting verb → no shift.",
 "He said the sun ____ in the east.|rises|Medium|A universal truth → no shift.",
 "He said India ____ free in 1947.|became|Medium|A definite past date → no shift.",
 "He said that he ____ come the next day.|would|Medium|'Will' becomes 'would'.",
 "She said that she ____ swim very well.|could|Medium|'Can' becomes 'could'.",
 "He said that he ____ written the letter.|had|Hard|Present perfect becomes past perfect.",
 "They said they ____ been waiting long.|had|Hard|'Have been' becomes 'had been'.",
 "He said that he ____ go there alone.|might|Hard|'May' becomes 'might'.",
 "She said that honesty ____ the best policy.|is|Hard|A proverb → no shift.",
 "He said that he ____ to leave at once.|had|Expert|'Must' becomes 'had to'.",
 "He said he ____ already seen that film.|had|Expert|Present perfect becomes past perfect.",
 "She said she ____ studying when I called.|was|Expert|'Am studying' becomes 'was studying'.",
 "He said that water ____ at 100 degrees.|boils|Expert|A universal truth → no shift."],

 s8:[
 "He said that he is very busy that day.|He said that he was very busy that day.|A past reporting verb causes the backshift.",
 "He said to me that he had finished the work.|He told me that he had finished the work.|'Said to' becomes 'told'.",
 "He told to me that he was leaving.|He told me that he was leaving.|'Tell' never takes 'to' before the person.",
 "The teacher said that the sun rose in the east.|The teacher said that the sun rises in the east.|A universal truth does not shift.",
 "He said that India had become free in 1947.|He said that India became free in 1947.|A definite past date does not shift.",
 "He said that he will come the next day.|He said that he would come the next day.|'Will' becomes 'would'.",
 "She said that she can swim very well.|She said that she could swim very well.|'Can' becomes 'could'.",
 "He said that he has written the letter.|He said that he had written the letter.|Present perfect becomes past perfect.",
 "She said that honesty was the best policy.|She said that honesty is the best policy.|A proverb does not shift.",
 "She said she is studying when I called.|She said she was studying when I called.|A past reporting verb causes the backshift."],

 s9:[
 "Fill in the Blank|The principal announced that the examination ____ postponed to the following week.|is;had been|1|A past reporting verb shifts 'has been' to 'had been'.",
 "Find the Error|He said to me (A) that he would (B) return the book (C) on the following day (D).|A;B;C;D|0|Part A. With a listener named, 'said to me' becomes 'told me'.",
 "Sentence Improvement|Our teacher told us that water boiled at a hundred degrees centigrade at sea level.|water boiled;water boils;water had boiled|1|A universal truth does not shift.",
 "Fill in the Blank|She said that she ____ been waiting at the station since early that morning.|has;had|1|Present perfect continuous shifts to past perfect continuous.",
 "Find the Error|The guide explained (A) that the Taj Mahal had been (B) built by Shah Jahan (C) in the seventeenth century (D).|A;B;C;D|1|Part B. A definite historical period keeps the simple past → 'was built'."],

 s10:{
  en:"Students backshift everything mechanically, which produces 'the sun rose in the east' and 'India had become free in 1947'. Both are wrong. Universal truths, proverbs and fixed historical dates stay put. The other trap is 'said to me' — with a listener named it must become 'told me', and 'tell' never takes 'to'.",
  ta:"மாணவர்கள் அனைத்தையும் இயந்திரத்தனமாக பின்னால் நகர்த்துகிறார்கள், அது 'the sun rose in the east' மற்றும் 'India had become free in 1947' -ஐ உருவாக்குகிறது. இரண்டும் தவறு. உலகளாவிய உண்மைகள், பழமொழிகள் மற்றும் நிலையான வரலாற்று தேதிகள் அப்படியே இருக்கின்றன. மற்ற பொறி 'said to me' — கேட்பவர் பெயரிடப்பட்டால் அது 'told me' ஆக வேண்டும், மேலும் 'tell' ஒருபோதும் 'to' எடுக்காது.",
  tl:"Maanavargal anaiththaiyum iyandhiraththanamaaga pinnaal nagarththugiraargal. Ulagalaaviya unmaigal, pazhamozhigal matrum nilaiyaana varalaatru thedhigal appadiye irukkindrana."},

 s11:{
  en:"CHECK THE REPORTING VERB FIRST. Past → shift one step back. Present or future → no change.",
  ta:"முதல்ல reporting verb-ஐ பாருங்கள். இறந்தகாலம் → ஒரு படி பின்னால். நிகழ்காலம் அல்லது எதிர்காலம் → மாற்றம் இல்லை.",
  tl:"Mudhalla reporting verb-ai paarungal. Irandhakaalam → oru padi pinnaal. Nigazhkaalam alladhu edhirkaalam → maatram illai.",
  vis:"      THE BACKSHIFT LADDER\n\n   write / writes   →  wrote\n   am / is / are    →  was / were\n   wrote            →  had written\n   was / were       →  had been\n   have / has + V3  →  had + V3\n   had + V3         →  had + V3 (no change)\n\n   will  → would      shall → should\n   can   → could      may   → might\n   must  → had to (or stays 'must')\n   would / should / could / might → no change\n\n   ⚠ NOTHING SHIFTS WHEN:\n     · reporting verb is present or future\n     · it is a universal truth\n       (the sun RISES in the east)\n     · it is a proverb\n       (honesty IS the best policy)\n     · it is a fixed past date\n       (India BECAME free in 1947)\n\n   ⚠ SAY TO somebody → TELL somebody\n     'tell' never takes 'to'"},

 s13:[
 "He ____ me that he ____ finished the work and ____ leave the next day.|told-had-would;said-had-will;told-has-would|0|'Said to me' → TOLD. Present perfect → HAD. 'Will' → WOULD.",
 "The teacher said that the sun ____ in the east and that honesty ____ the best policy.|rises-is;rose-was;rises-was|0|Both are permanent truths → no backshift.",
 "He said that India ____ free in 1947, and hardly ____ anyone disputed it since then.|became-has;had become-had;became-had|0|A fixed date → no shift. Inversion after HARDLY, and 'since then' → HAS.",
 "She said that she ____ been waiting ____ morning and ____ very tired.|had-since-was;has-for-was;had-for-was|0|Present perfect → HAD BEEN. 'Since morning' (Preposition Rule 73). Backshift → WAS.",
 "He said that he ____ swim, ____ neither his brother ____ his sister could.|could-although-nor;can-although but-or;could-although but-nor|0|'Can' → COULD. One conjunction only (Rule 88). NEITHER pairs with NOR (Rule 86)."],

 s14:{
  rule:"A past reporting verb shifts every tense inside one step back; a present or future one changes nothing.",
  formula:"is→was · writes→wrote · wrote→had written\nhave/has V3→had V3 · will→would · can→could\nmay→might · shall→should · must→had to\nNO SHIFT: universal truths, proverbs, fixed past dates,\n  or when the reporting verb is present/future\nSAY TO somebody → TELL somebody",
  memory:"Check the reporting verb first. Past means shift; present means no change.",
  ta:"முதல்ல reporting verb பாருங்க. இறந்தகாலம்னா நகரும்; நிகழ்காலம்னா மாறாது.",
  tl:"Mudhalla reporting verb paarunga. Irandhakaalamnaa nagarum; nigazhkaalamnaa maaraadhu.",
  mistake:"Shifting universal truths and fixed dates, and writing 'said to me' instead of 'told me'.",
  exam:"SSC CGL / CHSL / MTS, RRB and Bank — Narration carries 2 to 3 marks in every paper."},

 s15:[
 {ta:"இப்போ Narration-க்கு வர்றோம். இது SSC-ல Voice அளவுக்கே முக்கியம். நேரடிக் கூற்றை மறைமுகக் கூற்றா மாத்துறது.",
  tl:"Ippo Narration-kku varrom. Idhu SSC-la Voice alavukke mukkiyam. Neradik kootrai maraimugak kootraa maaththuradhu."},
 {ta:"முதல்ல மிக முக்கியமான கேள்வி — reporting verb எந்த காலத்துல இருக்கு? இதுதான் எல்லாத்தையும் தீர்மானிக்குது!",
  tl:"Mudhalla miga mukkiyamaana kelvi — reporting verb endha kaalaththula irukku? Idhudhaan ellaaththaiyum theermaanikkudhu!"},
 {ta:"Reporting verb இறந்தகாலம்-ன்னா (said, told, asked) — உள்ள இருக்கிற காலம் ஒரு படி பின்னால நகரும். Reporting verb நிகழ்காலம் அல்லது எதிர்காலம்-ன்னா (says, will say) — எதுவும் மாறாது!",
  tl:"Reporting verb irandhakaalam-nnaa (said, told, asked) — ulla irukkira kaalam oru padi pinnaala nagarum. Reporting verb nigazhkaalam-nnaa (says) — edhuvum maaraadhu!"},
 {ta:"ஏணி இப்படி இருக்கு — நிகழ்காலம் இறந்தகாலம் ஆகும். இறந்தகாலம் past perfect ஆகும். Present perfect past perfect ஆகும். Past perfect மாறவே மாறாது. Will→would, can→could, may→might, shall→should, must→had to.",
  tl:"Eni ippadi irukku — nigazhkaalam irandhakaalam aagum. Irandhakaalam past perfect aagum. Present perfect past perfect aagum. Will→would, can→could, may→might, shall→should."},
 {ta:"இப்போ மிக முக்கியமான விதிவிலக்கு! நாலு விஷயம் ஒருபோதும் நகராது. ஒண்ணு — உலகளாவிய உண்மை. 'The sun RISES in the east' — 'rose' ஆகாது! ரெண்டு — பழமொழி. 'Honesty IS the best policy'. மூணு — நிலையான வரலாற்று தேதி. 'India BECAME free in 1947' — 'had become' ஆகாது!",
  tl:"Ippo miga mukkiyamaana vidhivilakku! Naalu vishayam orupodhum nagaraadhu. Onnu — ulagalaaviya unmai. Rendu — pazhamozhi. Moonu — nilaiyaana varalaatru thedhi."},
 {ta:"நாலாவது — reporting verb-ஏ நிகழ்காலமா இருந்தா. நிறைய மாணவர்கள் இயந்திரம் மாதிரி எல்லாத்தையும் நகர்த்திடுவாங்க, அதுதான் தப்பு. கடைசியா ஒரு எளிய ஆனா முக்கியமான விதி — 'SAID TO somebody' → 'TOLD somebody'! 'He said to me' → 'He TOLD me'. மேலும் 'tell'-க்கு அப்பறம் 'to' ஒருபோதும் வராது — 'He told me' சரி, 'He told to me' தப்பு!",
  tl:"Naalaavadhu — reporting verb-e nigazhkaalamaa irundhaa. Kadaisiyaa — 'SAID TO somebody' → 'TOLD somebody'! 'He said to me' → 'He TOLD me'. Melum 'tell'-kku apparam 'to' orupodhum varaadhu!"}]},

/* ========== RULE 110 ========== */
{n:110,rc:"NAR-02",d:"Hard",t:"Changes to PRONOUNS, TIME and PLACE words",
 tam:"SON விதி · now→then · today→that day · here→there",
 s1:{en:"In indirect speech, pronouns change by the SON rule: the FIRST person follows the Subject, the SECOND person follows the Object, the THIRD person does Not change. Time and place words also shift: now→then, today→that day, here→there.",
  ta:"மறைமுகக் கூற்றில், pronoun-கள் SON விதிப்படி மாறுகின்றன: முதல் நபர் Subject-ஐப் பின்பற்றுகிறார், இரண்டாம் நபர் Object-ஐப் பின்பற்றுகிறார், மூன்றாம் நபர் மாறுவதில்லை. நேரம் மற்றும் இட சொற்களும் மாறுகின்றன: now→then, today→that day, here→there.",
  tl:"Maraimugak kootril, pronoun-gal SON vidhippadi maarugindrana: mudhal nabar Subject-aip pinpatrugiraar, irandaam nabar Object-aip pinpatrugiraar, moondraam nabar maaruvadhillai.",
  formula:"THE SON RULE\n  S — first person (I, we) follows the SUBJECT\n  O — second person (you) follows the OBJECT\n  N — third person (he, she, they) — NO change\n\nTIME AND PLACE\n  now        → then\n  today      → that day\n  tonight    → that night\n  tomorrow   → the next day\n  yesterday  → the previous day\n  last night → the previous night\n  next week  → the following week\n  ago        → before\n  here       → there\n  this       → that\n  these      → those\n  thus       → so"},

 s2:[
 {h:"S — the first person follows the subject",
  en:"'RAM said, \"I am tired\"' → 'Ram said that HE was tired'. The 'I' becomes 'he' because the subject is Ram. If the subject were 'Sita', it would become 'she'.",
  ta:"S — முதல் நபர் Subject-ஐப் பின்பற்றுகிறார். 'RAM said, \"I am tired\"' → 'Ram said that HE was tired'. Subject ராம் என்பதால் 'I' 'he' ஆகிறது. Subject 'சீதா' என்றால், அது 'she' ஆகும்.",
  tl:"S — mudhal nabar Subject-aip pinpatrugiraar. 'RAM said, \"I am tired\"' → 'Ram said that HE was tired'. Subject Raam enbadhaal 'I' 'he' aagiradhu."},
 {h:"O — the second person follows the object",
  en:"'He said to ME, \"YOU are late\"' → 'He told me that I was late'. The 'you' becomes 'I' because the object is 'me'. If the object were 'Ram', 'you' would become 'he'.",
  ta:"O — இரண்டாம் நபர் Object-ஐப் பின்பற்றுகிறார். 'He said to ME, \"YOU are late\"' → 'He told me that I was late'. Object 'me' என்பதால் 'you' 'I' ஆகிறது. Object 'ராம்' என்றால், 'you' 'he' ஆகும்.",
  tl:"O — irandaam nabar Object-aip pinpatrugiraar. 'He said to ME, \"YOU are late\"' → 'He told me that I was late'. Object 'me' enbadhaal 'you' 'I' aagiradhu."},
 {h:"N — the third person never changes",
  en:"'He said, \"SHE is my sister\"' → 'He said that SHE was his sister'. The 'she' stays 'she'. Only the possessive 'my' changes to 'his' because it belongs to the speaker.",
  ta:"N — மூன்றாம் நபர் ஒருபோதும் மாறுவதில்லை. 'He said, \"SHE is my sister\"' → 'He said that SHE was his sister'. 'She' 'she'-ஆகவே இருக்கிறது. உடைமைச் சொல் 'my' மட்டுமே 'his' ஆக மாறுகிறது, ஏனெனில் அது பேசுபவருக்குச் சொந்தமானது.",
  tl:"N — moondraam nabar orupodhum maaruvadhillai. 'He said, \"SHE is my sister\"' → 'He said that SHE was his sister'. 'She' 'she'-aagave irukkiradhu."},
 {h:"Time and place words shift only if the situation has changed",
  en:"If you are reporting on the same day and in the same place, 'today' and 'here' need not change. But in exams the situation has always moved, so shift them: today→that day, here→there.",
  ta:"நிலைமை மாறியிருந்தால் மட்டுமே நேரம் மற்றும் இட சொற்கள் மாறுகின்றன. நீங்கள் அதே நாளில் அதே இடத்தில் தெரிவித்தால், 'today' மற்றும் 'here' மாற வேண்டியதில்லை. ஆனால் தேர்வுகளில் நிலைமை எப்போதும் நகர்ந்திருக்கிறது, எனவே அவற்றை மாற்றுங்கள்: today→that day, here→there.",
  tl:"Nilaimai maariyirundhaal mattume neram matrum ida sorkal maarugindrana. Aanaal thervugalil nilaimai eppodhum nagarndhirukkiradhu, enave avatrai maatrungal."}],

 s3:[
 {h:"The SON rule",
  d:"   S — FIRST person (I, me, we, us, my, our)\n       follows the SUBJECT of the reporting verb\n     RAM said, \"I am tired.\"\n       → Ram said that HE was tired.\n\n   O — SECOND person (you, your)\n       follows the OBJECT of the reporting verb\n     He said to ME, \"YOU are late.\"\n       → He told me that I was late.\n\n   N — THIRD person (he, she, they)\n       NO change\n     He said, \"SHE is here.\"\n       → He said that SHE was there."},
 {h:"Time words",
  d:"   now        →  then\n   today      →  that day\n   tonight    →  that night\n   tomorrow   →  the next day\n   yesterday  →  the previous day\n   last night →  the previous night\n   last week  →  the previous week\n   next week  →  the following week\n   ago        →  before\n   just now   →  just then"},
 {h:"Place and pointing words",
  d:"   here   →  there\n   this   →  that\n   these  →  those\n   thus   →  so\n   hither →  thither\n   come   →  go\n\n   ⚠ NO CHANGE if the report is made\n     at the same time and place:\n     'He said here just now that he IS busy.'"}],

 s4:{
 wrong:["\"All pronouns become third person.\" — Only the first and second person change.",
  "\"'You' always becomes 'he'.\" — It follows the object of the reporting verb.",
  "\"'Tomorrow' becomes 'the next day' only sometimes.\" — In exams it always does.",
  "\"'She' becomes 'he' in indirect speech.\" — The third person never changes."],
 right:["Apply SON: Subject for first person, Object for second, No change for third.",
  "Find the subject and the object of the reporting verb first.",
  "Shift time words: now→then, today→that day, tomorrow→the next day.",
  "Shift place words: here→there, this→that, these→those."]},

 s5:[
 {en:"Ram said that he was very tired that day.",ta:"அன்று தான் மிகவும் களைப்பாக இருந்ததாக ராம் கூறினான்.",tl:"Andru thaan migavum kalaippaaga irundhadhaaga Raam koorinaan.",note:"'I' follows the subject Ram → HE; 'today' → that day."},
 {en:"He told me that I was late for the class.",ta:"நான் வகுப்புக்குத் தாமதமாக வந்ததாக அவர் என்னிடம் கூறினார்.",tl:"Naan vaguppukkuth thaamadhamaaga vandhadhaaga avar ennidam koorinaar.",note:"'You' follows the object me → I."},
 {en:"He said that she was his younger sister.",ta:"அவள் தன் தங்கை என்று அவர் கூறினார்.",tl:"Aval than thangai endru avar koorinaar.",note:"'She' does not change; 'my' → his."},
 {en:"She said that she would come the next day.",ta:"மறுநாள் தான் வருவதாக அவர் கூறினார்.",tl:"Marunaal thaan varuvadhaaga avar koorinaar.",note:"'Tomorrow' → the next day; 'will' → would."},
 {en:"He said that he had seen her there the previous day.",ta:"முந்தைய நாள் அவளை அங்கே பார்த்ததாக அவர் கூறினார்.",tl:"Mundhaiya naal avalai ange paarththadhaaga avar koorinaar.",note:"'Here' → there; 'yesterday' → the previous day."}],

 s9:[
 "Fill in the Blank|Ravi told his friend that ____ would return the borrowed money the following week.|I;he|1|'I' follows the subject Ravi.",
 "Find the Error|She told me (A) that you had (B) not attended (C) the last three classes (D).|A;B;C;D|1|Part B. 'You' follows the object 'me' → 'I had'.",
 "Sentence Improvement|The manager said that he would be visiting the branch office tomorrow morning.|tomorrow morning;the next morning;that morning|1|'Tomorrow' becomes 'the next day' or 'the next morning'.",
 "Fill in the Blank|The witness said that he had seen the accused standing ____ on the previous night.|here;there|1|'Here' becomes 'there'.",
 "Find the Error|He told the boys (A) that you should (B) all report to (C) the office at once (D).|A;B;C;D|1|Part B. 'You' follows the object 'the boys' → 'they should'."],

 s10:{
  en:"The SON rule looks simple until the object is a named person. 'He said to RAM, \"You are wrong\"' becomes 'He told Ram that HE was wrong' — the 'you' follows Ram, not the speaker. Students often write 'I was wrong'. The other layer is time words: forgetting to change 'tomorrow' and 'yesterday' costs a mark even when everything else is right.",
  ta:"Object ஒரு பெயரிடப்பட்ட நபராக இருக்கும் வரை SON விதி எளிமையாகத் தெரிகிறது. 'He said to RAM, \"You are wrong\"' 'He told Ram that HE was wrong' ஆகிறது — 'you' ராமைப் பின்பற்றுகிறது, பேசுபவரை அல்ல. மாணவர்கள் அடிக்கடி 'I was wrong' என்று எழுதுகிறார்கள். மற்ற அடுக்கு நேரச் சொற்கள்: 'tomorrow' மற்றும் 'yesterday'-ஐ மாற்ற மறப்பது மற்ற அனைத்தும் சரியாக இருந்தாலும் ஒரு மதிப்பெண் இழக்கச் செய்கிறது.",
  tl:"Object oru peyaridappatta nabaraaga irukkum varai SON vidhi elimaiyaagath therigiradhu. 'He told Ram that HE was wrong' — 'you' Raamaip pinpatrugiradhu, pesubavarai alla."},

 s11:{
  en:"SON — Subject for I, Object for you, No change for he and she.",
  ta:"SON — I-க்கு Subject, you-க்கு Object, he மற்றும் she-க்கு மாற்றம் இல்லை.",
  tl:"SON — I-kku Subject, you-kku Object, he matrum she-kku maatram illai.",
  vis:"      THE SON RULE\n\n   S  FIRST person (I, we, my, our)\n      → follows the SUBJECT\n      RAM said, \"I am tired.\"\n        → Ram said HE was tired.\n\n   O  SECOND person (you, your)\n      → follows the OBJECT\n      He said to ME, \"YOU are late.\"\n        → He told me I was late.\n      He said to RAM, \"YOU are late.\"\n        → He told Ram HE was late.\n\n   N  THIRD person (he, she, they)\n      → NO change\n\n      TIME AND PLACE\n   now → then          here → there\n   today → that day    this → that\n   tomorrow → the next day\n   yesterday → the previous day\n   last night → the previous night\n   next week → the following week\n   ago → before        these → those"},

 "He told Ram that ____ was mistaken, ____ neither of them ____ willing to admit it.|he-although-was;you-although but-were;he-although but-was|0|'You' follows the object Ram → HE. One conjunction only (Rule 88). 'Neither of' is singular → WAS."],

 s14:{
  rule:"Pronouns change by the SON rule; time and place words shift to their past-report equivalents.",
  formula:"S — first person follows the SUBJECT\nO — second person follows the OBJECT\nN — third person: NO change\nnow→then · today→that day · tomorrow→the next day\nyesterday→the previous day · here→there · this→that\nthese→those · ago→before · next week→the following week",
  memory:"SON — Subject, Object, No change.",
  ta:"SON — Subject, Object, No change.",
  tl:"SON — Subject, Object, No change.",
  mistake:"Making 'you' follow the speaker instead of the object, and forgetting to change 'tomorrow' and 'here'.",
  exam:"SSC CGL / CHSL and Bank — the SON rule decides at least one option in every Narration question."},

 s15:[
 {ta:"Rule 109-ல காலம் எப்படி மாறுதுன்னு பார்த்தோம். இப்போ pronoun, நேரம், இடம் எப்படி மாறுதுன்னு பார்க்கலாம்.",
  tl:"Rule 109-la kaalam eppadi maarudhunnu paarththom. Ippo pronoun, neram, idam eppadi maarudhunnu paarkkalaam."},
 {ta:"Pronoun மாத்துறதுக்கு ஒரு அழகான உத்தி இருக்கு — SON விதி! S, O, N. மூணு எழுத்து, மூணு விதி.",
  tl:"Pronoun maaththuradhukku oru azhagaana utthi irukku — SON vidhi! S, O, N. Moonu ezhuththu, moonu vidhi."},
 {ta:"S = SUBJECT. முதல் நபர் (I, we, my, our) reporting verb-ஓட SUBJECT-ஐ பார்த்து மாறும். 'RAM said, \"I am tired\"' — subject ராம், அதனால 'I' → 'HE'. 'SITA said, \"I am tired\"' — subject சீதா, அதனால 'I' → 'SHE'.",
  tl:"S = SUBJECT. Mudhal nabar (I, we, my, our) reporting verb-oda SUBJECT-ai paarththu maarum. 'RAM said, \"I am tired\"' → 'HE'. 'SITA said' → 'SHE'."},
 {ta:"O = OBJECT. இரண்டாம் நபர் (you, your) reporting verb-ஓட OBJECT-ஐ பார்த்து மாறும். 'He said to ME, \"YOU are late\"' — object 'me', அதனால 'you' → 'I'. ஆனா 'He said to RAM, \"YOU are late\"' — object ராம், அதனால 'you' → 'HE'! இங்கதான் நிறைய பேரு தப்பு பண்ணுவாங்க.",
  tl:"O = OBJECT. Irandaam nabar (you, your) reporting verb-oda OBJECT-ai paarththu maarum. 'He said to ME' → 'I'. Aanaa 'He said to RAM' → 'HE'! Ingadhaan neraiya peru thappu pannuvaanga."},
 {ta:"N = NO CHANGE. மூணாவது நபர் (he, she, they, it) ஒருபோதும் மாறாது! 'He said, \"SHE is my sister\"' → 'He said that SHE was HIS sister.' 'She' அப்படியே இருக்கு, ஆனா 'my' → 'his' ஆகுது (ஏன்னா 'my' முதல் நபர்).",
  tl:"N = NO CHANGE. Moonaavadhu nabar (he, she, they, it) orupodhum maaraadhu! 'He said that SHE was HIS sister.' 'She' appadiye irukku, aanaa 'my' → 'his' aagudhu."},
 {ta:"கடைசியா நேரம் மற்றும் இட சொல். இதெல்லாம் மனப்பாடம்தான். now→then. today→that day. tonight→that night. tomorrow→the next day. yesterday→the previous day. last night→the previous night. next week→the following week. ago→before. here→there. this→that. these→those. நிறைய பேரு காலத்தை மாத்திட்டு நேரச் சொல்லை மறந்துடுவாங்க — ஒரு mark போச்சு!",
  tl:"Kadaisiyaa neram matrum ida sol. Idhellaam manappaadam-dhaan. now→then. today→that day. tomorrow→the next day. yesterday→the previous day. ago→before. here→there. this→that. these→those."}]},

/* ========== RULE 111 ========== */
{n:111,rc:"NAR-03",d:"Hard",t:"Indirect Speech of QUESTIONS",
 tam:"கேள்விக்கு ASK · Wh- கேள்விக்கு அதே சொல் · Yes/No கேள்விக்கு IF",
 s1:{en:"For a question, change the reporting verb to ASK, ENQUIRE or WANT TO KNOW. For a WH- question keep the wh-word as the link. For a YES/NO question use IF or WHETHER. In both cases the sentence loses its question shape — the subject comes before the verb and the question mark disappears.",
  ta:"ஒரு கேள்விக்கு, reporting verb-ஐ ASK, ENQUIRE அல்லது WANT TO KNOW ஆக மாற்றவும். ஒரு WH- கேள்விக்கு wh-சொல்லை இணைப்பாக வைக்கவும். ஒரு YES/NO கேள்விக்கு IF அல்லது WHETHER பயன்படுத்தவும். இரண்டிலும் வாக்கியம் அதன் கேள்வி வடிவத்தை இழக்கிறது — Subject வினைச்சொல்லுக்கு முன் வருகிறது, கேள்விக்குறி மறைகிறது.",
  tl:"Oru kelvikku, reporting verb-ai ASK, ENQUIRE alladhu WANT TO KNOW aaga maatravum. Oru WH- kelvikku wh-sollai inaippaaga vaikkavum. Oru YES/NO kelvikku IF alladhu WHETHER payanpaduththavum.",
  formula:"WH- QUESTION → keep the wh-word\n  He said, \"Where do you live?\"\n    → He ASKED me WHERE I LIVED.\n\nYES / NO QUESTION → use IF or WHETHER\n  He said, \"Are you busy?\"\n    → He ASKED me IF I WAS busy.\n\n⚠ THE QUESTION SHAPE DISAPPEARS:\n  · subject BEFORE the verb\n  · no 'do', 'does' or 'did'\n  · no question mark\n  · no 'that'"},

 s2:[
 {h:"The auxiliary DO, DOES, DID vanishes",
  en:"'Where DO you live?' becomes 'where I LIVED' — the 'do' disappears and its tense moves into the main verb. 'What DID he say?' becomes 'what he HAD SAID'. This is the step students most often miss.",
  ta:"துணை வினைச்சொல் DO, DOES, DID மறைகிறது. 'Where DO you live?' 'where I LIVED' ஆகிறது — 'do' மறைந்து அதன் காலம் முதன்மை வினைச்சொல்லுக்குள் நகர்கிறது. 'What DID he say?' 'what he HAD SAID' ஆகிறது. மாணவர்கள் அடிக்கடி தவறவிடும் படி இதுதான்.",
  tl:"Thunai vinaichol DO, DOES, DID maraigiradhu. 'Where DO you live?' 'where I LIVED' aagiradhu. 'What DID he say?' 'what he HAD SAID' aagiradhu."},
 {h:"Never use THAT with a question",
  en:"'He asked me THAT where I lived' is wrong. The wh-word or 'if' already does the joining. 'That' belongs only to statements, never to questions.",
  ta:"ஒரு கேள்வியுடன் ஒருபோதும் THAT பயன்படுத்தாதீர்கள். 'He asked me THAT where I lived' தவறு. Wh-சொல் அல்லது 'if' ஏற்கனவே இணைக்கும் வேலையைச் செய்கிறது. 'That' கூற்றுகளுக்கு மட்டுமே சொந்தம், ஒருபோதும் கேள்விகளுக்கு அல்ல.",
  tl:"Oru kelviyudan orupodhum THAT payanpaduththaadheergal. 'He asked me THAT where I lived' thavaru. 'That' kootrugalukku mattume sondham."},
 {h:"The subject comes before the verb",
  en:"'Are you busy?' has 'are' before 'you'. In indirect speech it becomes 'if I WAS busy' — subject first. The sentence stops being a question and becomes a statement inside a bigger sentence.",
  ta:"Subject வினைச்சொல்லுக்கு முன் வருகிறது. 'Are you busy?'-ல் 'you'-க்கு முன் 'are' இருக்கிறது. மறைமுகக் கூற்றில் அது 'if I WAS busy' ஆகிறது — Subject முதலில். வாக்கியம் ஒரு கேள்வியாக இருப்பதை நிறுத்தி ஒரு பெரிய வாக்கியத்திற்குள் ஒரு கூற்றாக மாறுகிறது.",
  tl:"Subject vinaicholukku mun varugiradhu. 'Are you busy?'-l 'you'-kku mun 'are' irukkiradhu. Maraimugak kootril adhu 'if I WAS busy' aagiradhu."},
 {h:"WHETHER is safer than IF when a choice follows",
  en:"'He asked whether I would come OR NOT' — with 'or not', 'whether' is preferred. 'If' also works in most cases, but 'whether … or not' is the standard exam form.",
  ta:"ஒரு தேர்வு பின்வரும்போது WHETHER, IF-ஐ விட பாதுகாப்பானது. 'He asked whether I would come OR NOT' — 'or not'-உடன், 'whether' விரும்பப்படுகிறது. பெரும்பாலான சந்தர்ப்பங்களில் 'if'-ம் வேலை செய்கிறது, ஆனால் 'whether … or not' நிலையான தேர்வு வடிவம்.",
  tl:"Oru thervu pinvarumbodhu WHETHER, IF-ai vida paadhugaappaanadhu. 'He asked whether I would come OR NOT'. 'Whether … or not' nilaiyaana thervu vadivam."}],

 s3:[
 {h:"Two kinds of question",
  d:"   WH- QUESTION  →  keep the wh-word\n     what · where · when · why\n     who · whom · whose · which · how\n\n     He said, \"WHERE do you live?\"\n       → He asked me WHERE I lived.\n\n   YES / NO QUESTION  →  IF or WHETHER\n     He said, \"ARE you busy?\"\n       → He asked me IF I was busy."},
 {h:"What disappears",
  d:"   DIRECT                INDIRECT\n   ──────                ────────\n   ? question mark   →   gone\n   do / does / did   →   gone (tense moves)\n   verb before subject → subject first\n   said              →   asked / enquired\n\n   ✘ He asked me THAT where I lived.\n   ✔ He asked me where I lived.\n     ('that' never joins a question)"},
 {h:"The DO / DID rule in detail",
  d:"   \"Where DO you LIVE?\"\n     → where I LIVED\n        do + live  →  lived\n\n   \"What DID he SAY?\"\n     → what he HAD SAID\n        did + say  →  had said\n\n   \"Where DOES she WORK?\"\n     → where she WORKED\n        does + work → worked\n\n   The auxiliary vanishes;\n   its tense enters the main verb."}],

 s4:{
 wrong:["\"'He asked that where I lived' joins the clauses.\" — 'That' never joins a question.",
  "\"'He asked where do I live' keeps the question form.\" — The question shape must go.",
  "\"'If' and 'whether' cannot both be used.\" — Both work; 'whether' is safer with 'or not'.",
  "\"The question mark stays in indirect speech.\" — It disappears."],
 right:["Change 'said' to 'asked' or 'enquired'.",
  "Keep the wh-word for a wh-question; use if or whether for a yes/no question.",
  "Remove do, does and did, and move the tense into the main verb.",
  "Put the subject before the verb and delete the question mark."]},

 s5:[
 {en:"He asked me where I lived at that time.",ta:"அப்போது நான் எங்கே வசித்தேன் என்று அவர் என்னிடம் கேட்டார்.",tl:"Appodhu naan enge vasiththen endru avar ennidam kettaar.",note:"A wh-question → keep 'where'; 'do' vanishes."},
 {en:"He asked me if I was busy that evening.",ta:"அன்று மாலை நான் பிஸியாக இருந்தேனா என்று அவர் கேட்டார்.",tl:"Andru maalai naan busy-yaaga irundhenaa endru avar kettaar.",note:"A yes/no question → IF; subject before verb."},
 {en:"She asked whether I would come or not.",ta:"நான் வருவேனா இல்லையா என்று அவர் கேட்டார்.",tl:"Naan varuvenaa illaiyaa endru avar kettaar.",note:"'Whether … or not' is the standard form."},
 {en:"He asked me what I had said to the manager.",ta:"நான் மேலாளரிடம் என்ன சொன்னேன் என்று அவர் கேட்டார்.",tl:"Naan melaalaridam enna sonnen endru avar kettaar.",note:"'Did say' → 'had said'; the auxiliary vanishes."},
 {en:"The officer enquired why we had come so late.",ta:"நாங்கள் ஏன் அவ்வளவு தாமதமாக வந்தோம் என்று அதிகாரி விசாரித்தார்.",tl:"Naangal yen avvalavu thaamadhamaaga vandhom endru adhigaari visaariththaar.",note:"'Enquired' is another correct reporting verb."}],

 s6:["asked|கேட்டார்|Kettaar",

 s7:[

 s8:[
 "He asked me that where I lived.|He asked me where I lived.|'That' never joins a question.",
 "He asked me where did I live.|He asked me where I lived.|The question shape must disappear.",
 "He asked me if was I busy that evening.|He asked me if I was busy that evening.|The subject comes before the verb.",
 "He said me where I lived.|He asked me where I lived.|A question takes 'asked'.",

 s9:[
 "Fill in the Blank|The interviewer asked me ____ I had any previous experience in this particular field.|that;if|1|A yes/no question requires 'if' or 'whether'.",
 "Find the Error|He asked me (A) that where I (B) had kept the (C) important files (D).|A;B;C;D|0|Part A. 'That' never joins a question → 'He asked me where'.",
 "Sentence Improvement|The teacher asked the boy why did he come late to the class that morning.|why did he come;why he had come;why he did come|1|The auxiliary vanishes and the tense shifts.",
 "Fill in the Blank|The officer wanted to know ____ the applicant would be able to join immediately or not.|if;whether|1|'Whether … or not' is the standard form.",
 "Find the Error|She asked me (A) how do I manage (B) to finish so much (C) work in a single day (D).|A;B;C;D|1|Part B. 'Do manage' becomes 'managed' → 'how I managed'."],

 s10:{
  en:"Three things go wrong at once here. Students keep the question word order ('where did I live'), add a stray 'that', and forget that 'do', 'does' and 'did' must vanish. The cleanest way to check your answer is to read it aloud: if it still sounds like a question, it is wrong.",
  ta:"இங்கே ஒரே நேரத்தில் மூன்று விஷயங்கள் தவறாகின்றன. மாணவர்கள் கேள்வி சொல் வரிசையை வைத்திருக்கிறார்கள் ('where did I live'), ஒரு தவறான 'that' சேர்க்கிறார்கள், மேலும் 'do', 'does' மற்றும் 'did' மறைய வேண்டும் என்பதை மறக்கிறார்கள். உங்கள் விடையைச் சரிபார்க்க தெளிவான வழி அதை உரக்கப் படிப்பது: அது இன்னும் ஒரு கேள்வி போல ஒலித்தால், அது தவறு.",
  tl:"Inge ore neraththil moondru vishayangal thavaraagindrana. Ungal vidaiyaich saripaarkka thelivaana vazhi adhai urakkap padippadhu: adhu innum oru kelvi pola oliththaal, adhu thavaru."},

 s11:{
  en:"SAID becomes ASKED. The question shape disappears. WH- keeps the wh-word; YES/NO takes IF.",
  ta:"SAID, ASKED ஆகும். கேள்வி வடிவம் மறையும். WH- wh-சொல்லை வைக்கும்; YES/NO IF எடுக்கும்.",
  tl:"SAID, ASKED aagum. Kelvi vadivam maraiyum. WH- wh-sollai vaikkum; YES/NO IF edukkum.",
  vis:"      TURNING A QUESTION INTO A STATEMENT\n\n   WH- QUESTION → keep the wh-word\n     \"WHERE do you live?\"\n       → He asked me WHERE I LIVED.\n\n   YES / NO QUESTION → IF / WHETHER\n     \"ARE you busy?\"\n       → He asked me IF I WAS busy.\n\n   ⚠ WHAT DISAPPEARS:\n     ? question mark      → gone\n     do / does / did      → gone\n     verb-before-subject  → subject first\n     'that'               → never used\n\n   ⚠ THE AUXILIARY'S TENSE MOVES IN:\n     do   + live  →  lived\n     does + work  →  worked\n     did  + say   →  had said\n\n   ⚠ READ YOUR ANSWER ALOUD.\n     If it still sounds like a question,\n     it is wrong."},

 s13:[
 "He asked me ____ I ____ , and I told him that I ____ in Chennai.|where-lived-lived;that where-lived-lived;where-did live-lived|0|No 'that' with a question. 'Do live' → LIVED. The backshift applies.",
 "She asked ____ I would come or not, and hardly ____ I answered when she left.|whether-had;if-did;whether-did|0|'Whether … or not' is standard. Inversion after HARDLY, with HAD (Rule 102).",
 "He asked me what I ____ said, ____ neither the clerk ____ the peon had heard me.|had-although-nor;did-although but-or;had-although but-nor|0|'Did say' → HAD SAID. One conjunction only (Rule 88). NEITHER pairs with NOR.",
 "The officer enquired why we ____ come so late and ____ we ____ any excuse.|had-whether-had;did-that-had;had-that-had|0|The backshift → HAD COME. A yes/no question → WHETHER. Backshift → HAD.",
 "He asked me ____ I ____ help him, and I said that I ____ try my best.|if-could-would;that-can-will;if-can-would|0|A yes/no question → IF. 'Can' → COULD. 'Will' → WOULD."],

 s14:{
  rule:"Questions take ASK; wh-questions keep the wh-word and yes/no questions take IF or WHETHER; the question shape disappears.",
  formula:"said → asked / enquired / wanted to know\nWH- question → keep the wh-word\nYES/NO question → IF or WHETHER (whether … or not)\nRemove: question mark, do/does/did, verb-before-subject\nNever use 'that' with a question",
  memory:"Said becomes asked. The question shape must vanish.",
  ta:"Said, asked ஆகும். கேள்வி வடிவம் மறையணும்.",
  tl:"Said, asked aagum. Kelvi vadivam maraiyanum.",
  mistake:"Writing 'He asked me that where I lived' and keeping 'did' in 'why did he come'.",
  exam:"SSC CGL / CHSL and Bank — the interrogative narration is asked almost every year."},

 s15:[
 {ta:"கேள்வியை மறைமுகக் கூற்றா மாத்துறது கொஞ்சம் வித்தியாசம். இங்க மூணு விஷயம் ஒரே நேரத்துல நடக்கும்.",
  tl:"Kelviyai maraimugak kootraa maaththuradhu konjam viththiyaasam. Inga moonu vishayam ore neraththula nadakkum."},
 {ta:"முதல்ல — reporting verb மாறும். 'Said' → 'ASKED' அல்லது 'ENQUIRED' அல்லது 'WANTED TO KNOW'. கேள்விக்கு 'said' வராது.",
  tl:"Mudhalla — reporting verb maarum. 'Said' → 'ASKED' alladhu 'ENQUIRED' alladhu 'WANTED TO KNOW'. Kelvikku 'said' varaadhu."},
 {ta:"ரெண்டாவது — இணைப்புச் சொல். ரெண்டு வகை கேள்வி இருக்கு. WH- கேள்வி (what, where, when, why, who, how) — அதே wh-சொல்லையே இணைப்பா வெச்சுக்கோங்க. YES/NO கேள்வி (Are you...? Do you...?) — IF அல்லது WHETHER போடுங்க.",
  tl:"Randaavadhu — inaippuch sol. WH- kelvi — adhe wh-sollaiye inaippaa vechukkonga. YES/NO kelvi — IF alladhu WHETHER podunga."},
 {ta:"மூணாவது — இதுதான் மிக முக்கியம் — கேள்வி வடிவமே மறையணும்! 'Where DO YOU live?' அப்படின்னு கேள்வி வடிவம். மறைமுகத்துல 'where I LIVED' — subject முன்னாடி, 'do' போயிடுச்சு, கேள்விக்குறி இல்ல!",
  tl:"Moonaavadhu — idhudhaan miga mukkiyam — kelvi vadivame maraiyanum! 'Where DO YOU live?' → 'where I LIVED' — subject munnaadi, 'do' poyiduchu, kelvikkuri illa!"},
 {ta:"'Do', 'does', 'did' எங்க போச்சு? அது மறைஞ்சு, அதோட காலம் முதன்மை வினைச்சொல்லுக்குள்ள போயிடுச்சு! 'do + live' = 'lived'. 'does + work' = 'worked'. 'did + say' = 'had said'. இது நிறைய பேரு தவறவிடுற படி.",
  tl:"'Do', 'does', 'did' enga pochu? Adhu marainju, adhoda kaalam mudhanmai vinaicholukkulla poyiduchu! 'do + live' = 'lived'. 'did + say' = 'had said'."},
 {ta:"இன்னொரு பெரிய தப்பு — 'THAT' போடுறது! 'He asked me THAT where I lived' — தப்பு! கேள்விக்கு 'that' ஒருபோதும் வராது. Wh-சொல்லோ 'if'-ஓ ஏற்கனவே இணைச்சிடுச்சு. கடைசியா ஒரு எளிய சோதனை — உங்க பதிலை உரக்கப் படிங்க. அது இன்னும் கேள்வி மாதிரி ஒலிச்சா, அது தப்பு! மறைமுகக் கூற்று எப்பவும் ஒரு கூற்று மாதிரிதான் இருக்கும்.",
  tl:"Innoru periya thappu — 'THAT' poduradhu! 'He asked me THAT where I lived' — thappu! Kadaisiyaa oru eliya sodhanai — unga padhilai urakkap padinga. Adhu innum kelvi maadhiri olichaa, adhu thappu!"}]},

/* ========== RULE 112 ========== */
{n:112,rc:"NAR-04",d:"Hard",t:"Indirect Speech of COMMANDS, REQUESTS and ADVICE",
 tam:"கட்டளைக்கு ORDER · வேண்டுகோளுக்கு REQUEST · TO + வினைச்சொல்",
 s1:{en:"For an IMPERATIVE, choose the reporting verb by the tone — ORDER, COMMAND, TELL for a command; REQUEST for a request; ADVISE for advice; FORBID for a prohibition. The verb becomes TO + V1, and the negative becomes NOT TO + V1.",
  ta:"ஒரு IMPERATIVE-க்கு, தொனியைக் கொண்டு reporting verb-ஐத் தேர்ந்தெடுங்கள் — ஒரு கட்டளைக்கு ORDER, COMMAND, TELL; ஒரு வேண்டுகோளுக்கு REQUEST; அறிவுரைக்கு ADVISE; தடைக்கு FORBID. வினைச்சொல் TO + V1 ஆகிறது, எதிர்மறை NOT TO + V1 ஆகிறது.",
  tl:"Oru IMPERATIVE-kku, thonaiyaik kondu reporting verb-aith therndhedungal — ORDER, COMMAND, TELL; REQUEST; ADVISE; FORBID. Vinaichol TO + V1 aagiradhu, edhirmarai NOT TO + V1 aagiradhu.",
  formula:"CHOOSE BY THE TONE\n\n  Command   → ordered / commanded / told\n  Request   → requested (with 'please')\n  Advice    → advised\n  Prohibition→ forbade / warned … not to\n  Suggestion→ suggested / proposed\n\n  He said, \"Go at once.\"\n    → He ORDERED me TO GO at once.\n  He said, \"Please help me.\"\n    → He REQUESTED me TO HELP him.\n  He said, \"Do not smoke.\"\n    → He ADVISED me NOT TO SMOKE.\n\n⚠ VERB → TO + V1\n⚠ NEGATIVE → NOT TO + V1"},

 s2:[
 {h:"The word 'please' signals a request",
  en:"If the direct speech contains 'please' or 'kindly', the reporting verb must be REQUESTED, not ordered. 'He said, \"Please help me\"' → 'He REQUESTED me to help him'. Missing this costs the mark even if the rest is right.",
  ta:"'Please' என்ற சொல் ஒரு வேண்டுகோளைச் சுட்டுகிறது. நேரடிக் கூற்றில் 'please' அல்லது 'kindly' இருந்தால், reporting verb REQUESTED ஆக இருக்க வேண்டும், ordered அல்ல. 'He said, \"Please help me\"' → 'He REQUESTED me to help him'. இதைத் தவறவிடுவது மற்றவை சரியாக இருந்தாலும் மதிப்பெண்ணை இழக்கச் செய்கிறது.",
  tl:"'Please' endra sol oru vendugolaich suttugiradhu. 'He said, \"Please help me\"' → 'He REQUESTED me to help him'. Idhaith thavaraviduvadhu madhippennai izhakkach seygiradhu."},
 {h:"'Do not' becomes 'not to', never 'to not'",
  en:"'Do not go' becomes 'NOT TO GO', not 'to not go'. The 'not' comes before the 'to'. This is the fixed English pattern for a negative infinitive in reported commands.",
  ta:"'Do not' 'not to' ஆகிறது, ஒருபோதும் 'to not' அல்ல. 'Do not go' 'NOT TO GO' ஆகிறது, 'to not go' அல்ல. 'Not' 'to'-க்கு முன் வருகிறது. தெரிவிக்கப்பட்ட கட்டளைகளில் ஒரு எதிர்மறை infinitive-க்கான நிலையான ஆங்கில பாணி இது.",
  tl:"'Do not' 'not to' aagiradhu, orupodhum 'to not' alla. 'Do not go' 'NOT TO GO' aagiradhu. 'Not' 'to'-kku mun varugiradhu."},
 {h:"There is no tense backshift in an imperative",
  en:"Because the verb becomes an infinitive, there is nothing to backshift. 'He said, \"Go now\"' → 'He ordered me to go THEN' — only the time word changes, not the verb form.",
  ta:"ஒரு imperative-ல் கால மாற்றம் இல்லை. வினைச்சொல் ஒரு infinitive ஆவதால், பின்னால் நகர்த்த எதுவும் இல்லை. 'He said, \"Go now\"' → 'He ordered me to go THEN' — நேரச் சொல் மட்டுமே மாறுகிறது, வினைச்சொல் வடிவம் அல்ல.",
  tl:"Oru imperative-l kaala maatram illai. Vinaichol oru infinitive aavadhaal, pinnaal nagarththa edhuvum illai. Nerach sol mattume maarugiradhu."},
 {h:"'Let us' becomes 'suggested that we should'",
  en:"'He said, \"Let us go\"' → 'He SUGGESTED that we SHOULD GO' or 'He PROPOSED going'. 'Let us' is a suggestion, not a command, so it takes a different structure entirely.",
  ta:"'Let us' 'suggested that we should' ஆகிறது. 'He said, \"Let us go\"' → 'He SUGGESTED that we SHOULD GO' அல்லது 'He PROPOSED going'. 'Let us' ஒரு பரிந்துரை, ஒரு கட்டளை அல்ல, எனவே அது முற்றிலும் வேறு அமைப்பை எடுக்கிறது.",
  tl:"'Let us' 'suggested that we should' aagiradhu. 'He said, \"Let us go\"' → 'He SUGGESTED that we SHOULD GO'. 'Let us' oru parindhurai, oru kattalai alla."}],

 s3:[
 {h:"Match the reporting verb to the tone",
  d:"   TONE          REPORTING VERB\n   ────          ──────────────\n   command    →  ordered / commanded / told\n   request    →  requested  (look for 'please')\n   advice     →  advised\n   prohibition→  forbade / warned … not to\n   suggestion →  suggested / proposed\n   entreaty   →  begged / implored\n\n   The word 'PLEASE' or 'KINDLY'\n   always means REQUESTED."},
 {h:"Verb → TO + V1",
  d:"   \"Go at once.\"\n     → ordered me TO GO at once.\n\n   \"Please help me.\"\n     → requested me TO HELP him.\n\n   \"Work hard.\"\n     → advised me TO WORK hard.\n\n   ⚠ NEGATIVE:\n   \"Do not smoke.\"\n     → advised me NOT TO SMOKE.\n     ✘ 'to not smoke'"},
 {h:"Two special forms",
  d:"   'LET US ...'  →  a suggestion\n     He said, \"Let us go.\"\n       → He SUGGESTED that we SHOULD GO.\n       → He PROPOSED going.\n\n   'DO NOT ...'  →  a prohibition\n     He said, \"Do not touch it.\"\n       → He FORBADE me to touch it.\n       → He WARNED me NOT TO touch it.\n\n   ⚠ NO TENSE BACKSHIFT IN AN IMPERATIVE\n     (the verb becomes an infinitive)"}],

 s4:{
 wrong:["\"'Said' works for a command too.\" — Commands need 'ordered' or 'told'.",
  "\"'Please' does not change the reporting verb.\" — It requires 'requested'.",
  "\"'To not go' is the negative form.\" — It must be 'not to go'.",
  "\"'Let us go' becomes 'ordered us to go'.\" — It is a suggestion, not a command."],
 right:["Read the tone and choose the reporting verb to match.",
  "'Please' or 'kindly' always means 'requested'.",
  "Turn the verb into TO + V1; the negative is NOT TO + V1.",
  "'Let us' becomes 'suggested that we should'."]},

 s5:[
 {en:"He ordered me to go there at once.",ta:"உடனே அங்கே செல்லுமாறு அவர் எனக்கு உத்தரவிட்டார்.",tl:"Udane ange sellumaaru avar enakku uththaravittaar.",note:"A command → ORDERED + TO + V1."},
 {en:"He requested me to help him with the work.",ta:"வேலையில் தனக்கு உதவுமாறு அவர் என்னைக் கேட்டுக்கொண்டார்.",tl:"Velaiyil thanakku udhavumaaru avar ennaik kettukkondaar.",note:"'Please' → REQUESTED."},
 {en:"The doctor advised me not to smoke at all.",ta:"புகைப்பிடிக்கவே கூடாது என்று மருத்துவர் எனக்கு அறிவுறுத்தினார்.",tl:"Pugaippidikkave koodaadhu endru maruththuvar enakku arivuruththinaar.",note:"Advice → ADVISED + NOT TO + V1."},
 {en:"He forbade the children to touch the machine.",ta:"இயந்திரத்தைத் தொடக்கூடாது என்று அவர் குழந்தைகளைத் தடுத்தார்.",tl:"Iyandhiraththaith thodakkoodaadhu endru avar kuzhandhaigalaith thaduththaar.",note:"A prohibition → FORBADE."},
 {en:"He suggested that we should go together.",ta:"நாம் ஒன்றாகச் செல்லலாம் என்று அவர் பரிந்துரைத்தார்.",tl:"Naam ondraagach sellalaam endru avar parindhuraiththaar.",note:"'Let us' → SUGGESTED THAT WE SHOULD."}],

 s7:[
 "He ____ me to go there at once.|ordered|Easy|A command takes ORDERED.",
 "He ____ me to help him.|requested|Easy|'Please' takes REQUESTED.",
 "The doctor ____ me not to smoke.|advised|Easy|Advice takes ADVISED.",
 "He ordered me ____ go immediately.|to|Medium|The verb becomes TO + V1.",
 "He advised me ____ to worry at all.|not|Medium|The negative is NOT TO + V1.",
 "He ____ the children to touch it.|forbade|Medium|A prohibition takes FORBADE.",
 "He ____ that we should go together.|suggested|Medium|'Let us' takes SUGGESTED.",
 "She ____ me to be more careful.|advised|Hard|Advice takes ADVISED.",
 "He ____ me not to open the door.|warned|Hard|A warning takes WARNED.",
 "The beggar ____ me to give him food.|begged|Hard|An entreaty takes BEGGED.",
 "He requested me ____ lend him a pen.|to|Hard|The verb becomes TO + V1.",
 "The officer ____ them to stand in line.|ordered|Expert|A command takes ORDERED.",
 "He ____ that they should leave early.|suggested|Expert|A suggestion takes SUGGESTED.",
 "She told me ____ to disturb her again.|not|Expert|The negative is NOT TO + V1.",
 "He ____ me to keep the secret safe.|told|Expert|A plain instruction takes TOLD."],

 s8:[
 "He said me to go there at once.|He ordered me to go there at once.|A command requires 'ordered'.",
 "He ordered me to help him, please.|He requested me to help him.|'Please' requires 'requested'.",
 "The doctor advised me to not smoke.|The doctor advised me not to smoke.|The negative is 'not to', never 'to not'.",
 "He ordered me go there immediately.|He ordered me to go there immediately.|The verb becomes 'to' + V1.",
 "He said, Let us go, so he ordered us to go.|He suggested that we should go.|'Let us' is a suggestion.",
 "He forbade the children to not touch it.|He forbade the children to touch it.|'Forbade' already carries the negative.",
 "She advised me that I should not to worry.|She advised me not to worry.|The correct form is 'advised me not to worry'.",
 "He requested me that to lend him a pen.|He requested me to lend him a pen.|'That' is not used with an infinitive.",
 "The officer told them to standing in line.|The officer told them to stand in line.|The infinitive takes V1.",
 "He warned me to not open the door.|He warned me not to open the door.|The negative is 'not to'."],

 s9:[
 "Fill in the Blank|The doctor strongly ____ the patient not to take any solid food for two days.|ordered;advised|1|Medical guidance is advice.",
 "Find the Error|He requested me (A) to not disturb (B) him while he was (C) working on the report (D).|A;B;C;D|1|Part B. The negative infinitive is 'not to disturb'.",
 "Sentence Improvement|He said to the peon, 'Please bring me a glass of water' — He ordered the peon to bring him water.|ordered the peon;requested the peon;told the peon|1|'Please' requires 'requested'.",
 "Fill in the Blank|The captain ____ that the team should practise for an extra hour every evening.|ordered;suggested|1|A proposal is a suggestion.",
 "Find the Error|The security guard (A) forbade the visitors (B) not to enter (C) the restricted area (D).|A;B;C;D|2|Part C. 'Forbade' already carries the negative → 'forbade the visitors to enter'."],

 s10:{
  en:"The reporting verb carries the mark here. 'Said' is never right for an imperative — you must read the tone and pick 'ordered', 'requested', 'advised' or 'forbade'. The word 'please' is the clearest signal: it always means 'requested'. And the negative is 'not to', never 'to not' — a small detail the exam plants deliberately.",
  ta:"Reporting verb இங்கே மதிப்பெண்ணைச் சுமக்கிறது. ஒரு imperative-க்கு 'said' ஒருபோதும் சரி அல்ல — நீங்கள் தொனியைப் படித்து 'ordered', 'requested', 'advised' அல்லது 'forbade' தேர்ந்தெடுக்க வேண்டும். 'Please' என்ற சொல் தெளிவான அறிகுறி: அது எப்போதும் 'requested' என்று பொருள்படுகிறது. மேலும் எதிர்மறை 'not to', ஒருபோதும் 'to not' அல்ல — தேர்வு வேண்டுமென்றே வைக்கும் ஒரு சிறிய விவரம்.",
  tl:"Reporting verb inge madhippennaich sumakkiradhu. Oru imperative-kku 'said' orupodhum sari alla. 'Please' endra sol thelivaana arikuri: adhu eppodhum 'requested' endru porulpadugiradhu."},

 s11:{
  en:"READ THE TONE. Command→ordered, please→requested, advice→advised. Verb becomes TO + V1.",
  ta:"தொனியைப் படியுங்கள். கட்டளை→ordered, please→requested, அறிவுரை→advised. வினைச்சொல் TO + V1 ஆகும்.",
  tl:"Thonaiyaip padiyungal. Kattalai→ordered, please→requested, arivurai→advised. Vinaichol TO + V1 aagum.",
  vis:"      CHOOSE BY THE TONE\n\n   command     → ordered / commanded / told\n   request     → requested   ('PLEASE' / 'KINDLY')\n   advice      → advised\n   prohibition → forbade / warned … not to\n   suggestion  → suggested / proposed\n   entreaty    → begged / implored\n\n   ⚠ VERB → TO + V1\n     \"Go at once.\"\n       → ordered me TO GO at once.\n\n   ⚠ NEGATIVE → NOT TO + V1\n     \"Do not smoke.\"\n       → advised me NOT TO SMOKE.\n     ✘ 'to not smoke'\n\n   ⚠ 'LET US ...' → a SUGGESTION\n     \"Let us go.\"\n       → suggested that we SHOULD GO.\n\n   ⚠ NO TENSE BACKSHIFT\n     (the verb becomes an infinitive)"},

 s12:[
 "He ____ me to go there at once.|said;ordered|1",
 "He ____ me to help him (please).|ordered;requested|1",
 "The doctor ____ me not to smoke.|ordered;advised|1",
 "He ordered me ____ go immediately.|—;to|1",
 "He advised me ____ to worry at all.|to;not|1",
 "He ____ the children to touch it.|advised;forbade|1",
 "He ____ that we should go together.|ordered;suggested|1",
 "She ____ me to be more careful.|commanded;advised|1",
 "He ____ me not to open the door.|requested;warned|1",
 "The beggar ____ me to give him food.|ordered;begged|1",
 "He requested me ____ lend him a pen.|—;to|1",
 "The officer ____ them to stand in line.|advised;ordered|1",
 "He ____ that they should leave early.|ordered;suggested|1",
 "She told me ____ to disturb her again.|to;not|1",
 "He ____ me to keep the secret safe.|said;told|1",
 "He advised me ____ smoke in the room.|to not;not to|1",
 "The teacher ____ us to be punctual.|said;advised|1",
 "He ____ me to lend him some money.|ordered;requested|1",
 "The guard ____ us to enter the hall.|forbade to;forbade|1",
 "He ____ that we should try once more.|told;suggested|1"],

 s13:[
 "He ____ me to go there and ____ me not to return ____ midnight.|ordered-warned-before;said-warned-until;ordered-said-before|0|A command → ORDERED. A warning → WARNED + NOT TO. 'Before midnight'.",
 "He ____ me to help him, and hardly ____ I agreed when he left.|requested-had;ordered-did;requested-did|0|'Please' → REQUESTED. Inversion after HARDLY with HAD (Rule 102).",
 "The doctor ____ me ____ to smoke, ____ neither my wife ____ my son knew of it.|advised-not-although-nor;ordered-to not-although but-or;advised-not-although but-nor|0|Advice → ADVISED. The negative → NOT TO. One conjunction only. NEITHER pairs with NOR.",
 "He ____ that we ____ go together, and it was ____ a good idea that all agreed.|suggested-should-such;ordered-will-so;suggested-should-so|0|'Let us' → SUGGESTED THAT … SHOULD. SUCH before a noun phrase (Rule 93).",
 "The officer ____ them to stand in line, and each of the men ____ at once.|ordered-obeyed;advised-obey;ordered-obey|0|A command → ORDERED. 'Each of' is singular → OBEYED (SVA Rule 50)."],

 s14:{
  rule:"Imperatives take a reporting verb chosen by tone, and the verb becomes TO + V1.",
  formula:"command → ordered / commanded / told\nrequest → requested ('please' or 'kindly')\nadvice → advised | prohibition → forbade / warned not to\nsuggestion → suggested that … should\nVERB → TO + V1 | NEGATIVE → NOT TO + V1\nNo tense backshift in an imperative",
  memory:"Read the tone. 'Please' always means requested. Negative is NOT TO.",
  ta:"தொனியைப் படிங்க. 'Please' இருந்தா எப்பவும் requested. எதிர்மறை NOT TO.",
  tl:"Thonaiyaip padinga. 'Please' irundhaa eppavum requested. Edhirmarai NOT TO.",
  mistake:"Using 'said' for a command, missing 'please', and writing 'to not' instead of 'not to'.",
  exam:"SSC CGL / CHSL and Bank — the imperative narration is a repeated 1-mark item."},

 s15:[
 {ta:"கட்டளை, வேண்டுகோள், அறிவுரை — இதெல்லாத்தையும் மறைமுகக் கூற்றா மாத்துறது கொஞ்சம் வேற மாதிரி.",
  tl:"Kattalai, vendugol, arivurai — idhellaaththaiyum maraimugak kootraa maaththuradhu konjam veru maadhiri."},
 {ta:"இங்க மிக முக்கியமான விஷயம் — reporting verb-ஐ தொனியை (tone) பார்த்து தேர்ந்தெடுக்கணும்! 'Said' ஒருபோதும் வராது.",
  tl:"Inga miga mukkiyamaana vishayam — reporting verb-ai thonaiyai (tone) paarththu therndhedukkanum! 'Said' orupodhum varaadhu."},
 {ta:"கட்டளையா? — ORDERED, COMMANDED, TOLD. வேண்டுகோளா? — REQUESTED. அறிவுரையா? — ADVISED. தடையா? — FORBADE அல்லது WARNED. பரிந்துரையா? — SUGGESTED. கெஞ்சுதலா? — BEGGED.",
  tl:"Kattalaiyaa? — ORDERED, COMMANDED, TOLD. Vendugolaa? — REQUESTED. Arivuraiyaa? — ADVISED. Thadaiyaa? — FORBADE. Parindhuraiyaa? — SUGGESTED."},
 {ta:"இதுல ஒரு அருமையான அறிகுறி இருக்கு — 'PLEASE' அல்லது 'KINDLY'! இந்த சொல் இருந்தா, அது நிச்சயமா வேண்டுகோள். REQUESTED தான் போடணும். நிறைய பேரு 'please' -ஐ பார்க்காம 'ordered' போட்டு mark இழந்துடுவாங்க.",
  tl:"Idhula oru arumaiyaana arikuri irukku — 'PLEASE' alladhu 'KINDLY'! Indha sol irundhaa, adhu nichchayamaa vendugol. REQUESTED thaan podanum."},
 {ta:"அடுத்து — வினைச்சொல் என்ன ஆகும்? TO + V1! 'Go' → 'to go'. 'Help' → 'to help'. 'Work' → 'to work'. எளிது. ஆனா எதிர்மறை வந்தா கவனம் — 'Do not go' → 'NOT TO GO'! 'To not go' இல்ல! 'Not' முன்னாடி வரும்.",
  tl:"Aduththu — vinaichol enna aagum? TO + V1! 'Go' → 'to go'. Aanaa edhirmarai vandhaa kavanam — 'Do not go' → 'NOT TO GO'! 'To not go' illa!"},
 {ta:"ஒரு நல்ல செய்தி — இங்க கால மாற்றம் (backshift) கிடையாது! ஏன்? ஏன்னா வினைச்சொல் infinitive ஆயிடுச்சு, infinitive-க்கு காலம் கிடையாது. நேரச் சொல் மட்டும் மாறும் ('now' → 'then'). கடைசியா ஒரு சிறப்பு வடிவம் — 'LET US'! 'He said, \"Let us go\"' இது கட்டளை இல்ல, பரிந்துரை! 'He SUGGESTED that we SHOULD GO' அல்லது 'He PROPOSED going'.",
  tl:"Oru nalla seydhi — inga kaala maatram (backshift) kidaiyaadhu! Yennaa vinaichol infinitive aayiduchu. Kadaisiyaa oru sirappu vadivam — 'LET US'! 'He SUGGESTED that we SHOULD GO'."}]},

/* ========== RULE 113 ========== */
{n:113,rc:"NAR-05",d:"Hard",t:"Indirect Speech of EXCLAMATIONS and WISHES",
 tam:"ஆச்சரியத்துக்கு EXCLAIM · வாழ்த்துக்கு WISH · What a/How → very, great",
 s1:{en:"For an EXCLAMATION use EXCLAIMED WITH JOY / SORROW / SURPRISE, and turn 'What a…' or 'How…' into 'that … very' or 'a great'. For a WISH use WISHED or PRAYED. The exclamation mark disappears.",
  ta:"ஒரு ஆச்சரியக் கூற்றுக்கு EXCLAIMED WITH JOY / SORROW / SURPRISE பயன்படுத்தவும், மேலும் 'What a…' அல்லது 'How…'-ஐ 'that … very' அல்லது 'a great' ஆக மாற்றவும். ஒரு வாழ்த்துக்கு WISHED அல்லது PRAYED பயன்படுத்தவும். ஆச்சரியக்குறி மறைகிறது.",
  tl:"Oru aachariyak kootrukku EXCLAIMED WITH JOY / SORROW / SURPRISE payanpaduththavum, melum 'What a…' alladhu 'How…'-ai 'that … very' alladhu 'a great' aaga maatravum.",
  formula:"EXCLAMATION\n  \"What a beautiful sight!\"\n    → He EXCLAIMED WITH JOY that it was\n      A VERY beautiful sight.\n  \"How foolish I am!\"\n    → He EXCLAIMED that he was VERY foolish.\n  \"Alas! I am ruined.\"\n    → He EXCLAIMED WITH SORROW that he\n      was ruined.\n\nWISH\n  \"May you live long!\"\n    → He WISHED that I MIGHT live long.\n  \"Good morning!\"\n    → He WISHED me good morning.\n\n⚠ Hurrah/Bravo → with joy\n  Alas → with sorrow · Oh → with surprise"},

 s2:[
 {h:"The interjection tells you the emotion",
  en:"HURRAH and BRAVO mean joy. ALAS means sorrow. OH and AH mean surprise. The interjection itself is dropped, but it decides the phrase 'with joy', 'with sorrow' or 'with surprise'.",
  ta:"இடைச்சொல் உங்களுக்கு உணர்ச்சியைச் சொல்கிறது. HURRAH மற்றும் BRAVO மகிழ்ச்சியைக் குறிக்கின்றன. ALAS துக்கத்தைக் குறிக்கிறது. OH மற்றும் AH ஆச்சரியத்தைக் குறிக்கின்றன. இடைச்சொல்லே கைவிடப்படுகிறது, ஆனால் அது 'with joy', 'with sorrow' அல்லது 'with surprise' தொடரைத் தீர்மானிக்கிறது.",
  tl:"Idaichol ungalukku unarchiyaich solgiradhu. HURRAH matrum BRAVO magizhchiyaik kurikkindrana. ALAS thukkaththaik kurikkiradhu. OH matrum AH aachariyaththaik kurikkindrana."},
 {h:"'What a' becomes 'a very'; 'How' becomes 'very'",
  en:"'What a beautiful sight!' → 'a VERY beautiful sight'. 'How foolish I am!' → 'I was VERY foolish'. The exclamatory word is replaced by an ordinary intensifier and the sentence becomes a plain statement.",
  ta:"'What a' 'a very' ஆகிறது; 'How' 'very' ஆகிறது. 'What a beautiful sight!' → 'a VERY beautiful sight'. 'How foolish I am!' → 'I was VERY foolish'. ஆச்சரியச் சொல் ஒரு சாதாரண தீவிரப்படுத்தியால் மாற்றப்படுகிறது, வாக்கியம் ஒரு எளிய கூற்றாக மாறுகிறது.",
  tl:"'What a' 'a very' aagiradhu; 'How' 'very' aagiradhu. 'What a beautiful sight!' → 'a VERY beautiful sight'. 'How foolish I am!' → 'I was VERY foolish'."},
 {h:"Wishes use WISHED or PRAYED with MIGHT",
  en:"'May you live long!' → 'He WISHED that I MIGHT live long'. 'May God bless you!' → 'He PRAYED that God MIGHT bless me'. The 'may' becomes 'might' because the reporting verb is past.",
  ta:"வாழ்த்துக்கள் MIGHT-உடன் WISHED அல்லது PRAYED பயன்படுத்துகின்றன. 'May you live long!' → 'He WISHED that I MIGHT live long'. 'May God bless you!' → 'He PRAYED that God MIGHT bless me'. Reporting verb இறந்த காலம் என்பதால் 'may' 'might' ஆகிறது.",
  tl:"Vaazhththukkal MIGHT-udan WISHED alladhu PRAYED payanpaduththugindrana. 'May you live long!' → 'He WISHED that I MIGHT live long'."},
 {h:"Greetings simply use WISHED",
  en:"'Good morning!' → 'He wished me good morning'. 'Good night!' → 'He bade me good night'. These need no 'that' clause at all — they are complete as they stand.",
  ta:"வாழ்த்துகள் வெறுமனே WISHED பயன்படுத்துகின்றன. 'Good morning!' → 'He wished me good morning'. 'Good night!' → 'He bade me good night'. இவற்றுக்கு 'that' clause-ஏ தேவையில்லை — அவை அப்படியே முழுமையானவை.",
  tl:"Vaazhththugal verumane WISHED payanpaduththugindrana. 'Good morning!' → 'He wished me good morning'. 'Good night!' → 'He bade me good night'."}],

 s3:[
 {h:"The interjection decides the emotion",
  d:"   Hurrah! · Bravo! · Hooray!\n     →  exclaimed WITH JOY\n\n   Alas! · Ah me!\n     →  exclaimed WITH SORROW\n\n   Oh! · Ah! · What!\n     →  exclaimed WITH SURPRISE\n\n   Bravo! (for another person)\n     →  applauded\n\n   The interjection itself is DROPPED."},
 {h:"What a / How → very",
  d:"   \"WHAT A beautiful sight!\"\n     → that it was A VERY beautiful sight.\n\n   \"HOW foolish I am!\"\n     → that he was VERY foolish.\n\n   \"WHAT A pity!\"\n     → that it was A GREAT pity.\n\n   ⚠ The exclamation mark DISAPPEARS.\n   ⚠ The sentence becomes a STATEMENT."},
 {h:"Wishes and greetings",
  d:"   WISH  →  wished / prayed  +  MIGHT\n     \"May you live long!\"\n       → wished that I MIGHT live long.\n     \"May God bless you!\"\n       → prayed that God MIGHT bless me.\n\n   GREETING  →  wished / bade\n     \"Good morning!\"  → wished me good morning\n     \"Good night!\"    → bade me good night\n     \"Goodbye!\"       → bade me goodbye"}],

 s4:{
 wrong:["\"'Said' is fine for an exclamation.\" — It needs 'exclaimed'.",
  "\"'What a' stays in indirect speech.\" — It becomes 'a very' or 'a great'.",
  "\"'May' stays 'may' after a past reporting verb.\" — It becomes 'might'.",
  "\"The interjection is kept.\" — It is dropped, but it decides the emotion phrase."],
 right:["Use 'exclaimed with joy / sorrow / surprise'.",
  "Turn 'What a' into 'a very' and 'How' into 'very'.",
  "Use 'wished' or 'prayed' with 'might' for a wish.",
  "Drop the interjection and the exclamation mark."]},

 s5:[
 {en:"He exclaimed with joy that it was a very beautiful sight.",ta:"அது மிக அழகான காட்சி என்று அவர் மகிழ்ச்சியுடன் கூறினார்.",tl:"Adhu miga azhagaana kaatchi endru avar magizhchiyudan koorinaar.",note:"'What a beautiful sight!' → 'a very beautiful sight'."},
 {en:"He exclaimed with sorrow that he was ruined.",ta:"தான் நாசமாகிவிட்டதாக அவர் துக்கத்துடன் கூறினார்.",tl:"Thaan naasamaagividdadhaaga avar thukkaththudan koorinaar.",note:"'Alas!' → 'with sorrow'."},
 {en:"He exclaimed that he had been very foolish.",ta:"தான் மிகவும் முட்டாள்தனமாக நடந்துகொண்டதாக அவர் கூறினார்.",tl:"Thaan migavum muttaalthanamaaga nadandhukondadhaaga avar koorinaar.",note:"'How foolish I have been!' → 'very foolish'."},
 {en:"He wished that I might live long and prosper.",ta:"நான் நீண்ட காலம் வாழ்ந்து செழிக்க வேண்டும் என்று அவர் வாழ்த்தினார்.",tl:"Naan neenda kaalam vaazhndhu sezhikka vendum endru avar vaazhththinaar.",note:"'May you live long!' → WISHED … MIGHT."},
 {en:"He wished me good morning and walked away.",ta:"அவர் எனக்கு காலை வணக்கம் சொல்லிவிட்டு நடந்து சென்றார்.",tl:"Avar enakku kaalai vanakkam sollivittu nadandhu sendraar.",note:"A greeting → simply WISHED, with no 'that' clause."}],

 s7:[
 "He ____ with joy that it was beautiful.|exclaimed|Easy|An exclamation takes EXCLAIMED.",
 "He exclaimed with ____ that he was ruined.|sorrow|Easy|'Alas!' means sorrow.",
 "He exclaimed that it was a ____ fine day.|very|Easy|'What a' becomes 'a very'.",
 "He ____ that I might live long.|wished|Medium|A wish takes WISHED.",
 "He ____ me good morning politely.|wished|Medium|A greeting takes WISHED.",
 "He exclaimed with ____ at the loud noise.|surprise|Medium|'Oh!' means surprise.",
 "He wished that God ____ bless me.|might|Medium|'May' becomes 'might'.",
 "He ____ me goodbye at the station.|bade|Hard|'Goodbye' takes BADE.",
 "She exclaimed that it was a ____ pity.|great|Hard|'What a pity!' becomes 'a great pity'.",
 "He exclaimed that he had been ____ foolish.|very|Hard|'How foolish!' becomes 'very foolish'.",
 "They ____ with joy that they had won.|exclaimed|Hard|'Hurrah!' means joy.",
 "He ____ that the country might prosper.|prayed|Expert|A prayer takes PRAYED.",
 "She exclaimed with sorrow that he ____ died.|had|Expert|The backshift applies.",
 "He ____ me good night and left the room.|bade|Expert|'Good night' takes BADE.",
 "He exclaimed that it was a ____ clever answer.|very|Expert|'What a' becomes 'a very'."],

 s8:[
 "He said that what a beautiful sight it was.|He exclaimed with joy that it was a very beautiful sight.|An exclamation requires 'exclaimed' and 'a very'.",
 "He exclaimed that alas he was ruined.|He exclaimed with sorrow that he was ruined.|The interjection is dropped and becomes 'with sorrow'.",
 "He exclaimed that how foolish he was.|He exclaimed that he was very foolish.|'How' becomes 'very'.",
 "He wished that I may live long and prosper.|He wished that I might live long and prosper.|'May' becomes 'might'.",
 "He said me good morning and walked away.|He wished me good morning and walked away.|A greeting requires 'wished'.",
 "He said with joy that they had won the match.|He exclaimed with joy that they had won the match.|An exclamation requires 'exclaimed'.",
 "She exclaimed that what a pity it was.|She exclaimed that it was a great pity.|'What a pity' becomes 'a great pity'.",
 "He prayed that God may bless the country.|He prayed that God might bless the country.|'May' becomes 'might'.",
 "He wished me goodbye at the railway station.|He bade me goodbye at the railway station.|'Goodbye' takes 'bade'.",
 "He exclaimed with sorrow that his friend has died.|He exclaimed with sorrow that his friend had died.|A past reporting verb causes the backshift."],

 s9:[
 "Fill in the Blank|On hearing the result, she ____ with joy that she had finally succeeded.|said;exclaimed|1|An exclamation requires 'exclaimed'.",
 "Find the Error|He exclaimed with sorrow (A) that alas (B) he had lost (C) everything he owned (D).|A;B;C;D|1|Part B. The interjection is dropped in indirect speech.",
 "Sentence Improvement|Convert 'How beautiful this garden is!': He exclaimed that how beautiful that garden was.|that how beautiful;that that garden was very beautiful;how that garden was beautiful|1|'How' becomes 'very' and the shape becomes a statement.",
 "Fill in the Blank|The old priest prayed that God ____ grant the family peace and prosperity.|may;might|1|A past reporting verb changes 'may' to 'might'.",
 "Find the Error|As he left the house (A), he wished me (B) goodbye and promised (C) to return the next week (D).|A;B;C;D|1|Part B. 'Goodbye' takes 'bade me goodbye'."],

 s10:{
  en:"Two things trip students here. First, the interjection is dropped — 'He exclaimed that alas he was ruined' keeps a word that should have become 'with sorrow'. Second, the exclamatory shape must go: 'that how foolish he was' is still exclamatory in form. It must become the plain statement 'that he was very foolish'.",
  ta:"இங்கே இரண்டு விஷயங்கள் மாணவர்களைத் தடுமாறச் செய்கின்றன. முதலில், இடைச்சொல் கைவிடப்படுகிறது — 'He exclaimed that alas he was ruined' 'with sorrow' ஆக இருக்க வேண்டிய ஒரு சொல்லை வைத்திருக்கிறது. இரண்டாவதாக, ஆச்சரிய வடிவம் போக வேண்டும்: 'that how foolish he was' இன்னும் வடிவத்தில் ஆச்சரியமானது. அது 'that he was very foolish' என்ற எளிய கூற்றாக மாற வேண்டும்.",
  tl:"Inge irandu vishayangal maanavargalaith thadumaarach seygindrana. Mudhalil, idaichol kaividappadugiradhu. Irandaavadhaaga, aachariya vadivam poga vendum."},

 s11:{
  en:"EXCLAIMED WITH joy, sorrow or surprise. 'What a' becomes 'a very'. 'How' becomes 'very'.",
  ta:"EXCLAIMED WITH மகிழ்ச்சி, துக்கம் அல்லது ஆச்சரியம். 'What a' 'a very' ஆகும். 'How' 'very' ஆகும்.",
  tl:"EXCLAIMED WITH magizhchi, thukkam alladhu aachariyam. 'What a' 'a very' aagum. 'How' 'very' aagum.",
  vis:"      EXCLAMATIONS AND WISHES\n\n   THE INTERJECTION DECIDES THE EMOTION\n     Hurrah! Bravo!  →  with JOY\n     Alas!           →  with SORROW\n     Oh! Ah! What!   →  with SURPRISE\n   … then the interjection is DROPPED.\n\n   THE EXCLAMATORY WORD BECOMES ORDINARY\n     \"WHAT A beautiful sight!\"\n       → that it was A VERY beautiful sight.\n     \"HOW foolish I am!\"\n       → that he was VERY foolish.\n     \"WHAT A pity!\"\n       → that it was A GREAT pity.\n\n   WISHES → wished / prayed + MIGHT\n     \"May you live long!\"\n       → wished that I MIGHT live long.\n\n   GREETINGS → wished / bade\n     \"Good morning!\" → wished me good morning\n     \"Goodbye!\"      → bade me goodbye\n\n   ⚠ THE EXCLAMATION MARK DISAPPEARS."},

 s14:{
  rule:"Exclamations take 'exclaimed with joy/sorrow/surprise'; wishes take 'wished' or 'prayed' with 'might'.",
  formula:"Hurrah/Bravo → with JOY | Alas → with SORROW\nOh/Ah → with SURPRISE (the interjection is dropped)\n'What a' → 'a very' or 'a great' | 'How' → 'very'\nWISH → wished / prayed + MIGHT\nGREETING → wished me good morning / bade me goodbye",
  memory:"Exclaimed WITH the emotion. 'What a' becomes 'a very'.",
  ta:"உணர்ச்சியோட EXCLAIMED WITH. 'What a' 'a very' ஆகும்.",
  tl:"Unarchiyoda EXCLAIMED WITH. 'What a' 'a very' aagum.",
  mistake:"Keeping the interjection, keeping 'what a' or 'how', and writing 'may' instead of 'might'.",
  exam:"SSC CGL / CHSL and Bank — exclamatory narration completes the four narration types."},

 s15:[
 {ta:"Narration-ஓட கடைசி வகை — ஆச்சரியக் கூற்று மற்றும் வாழ்த்து. இதுவும் ஒரு தனி அமைப்பு.",
  tl:"Narration-oda kadaisi vagai — aachariyak kootru matrum vaazhththu. Idhuvum oru thani amaippu."},
 {ta:"முதல்ல reporting verb — 'EXCLAIMED'. ஆனா அத்தோட ஒரு உணர்ச்சி சேர்க்கணும்! 'EXCLAIMED WITH JOY', 'EXCLAIMED WITH SORROW', 'EXCLAIMED WITH SURPRISE'.",
  tl:"Mudhalla reporting verb — 'EXCLAIMED'. Aanaa adhoda oru unarchi serkkanum! 'EXCLAIMED WITH JOY', 'EXCLAIMED WITH SORROW', 'EXCLAIMED WITH SURPRISE'."},
 {ta:"எந்த உணர்ச்சின்னு எப்படி தெரியும்? இடைச்சொல்லை (interjection) பாருங்க! 'Hurrah!' அல்லது 'Bravo!' — மகிழ்ச்சி. 'Alas!' — துக்கம். 'Oh!' அல்லது 'Ah!' — ஆச்சரியம்.",
  tl:"Endha unarchinnu eppadi theriyum? Idaicholai (interjection) paarunga! 'Hurrah!' — magizhchi. 'Alas!' — thukkam. 'Oh!' — aachariyam."},
 {ta:"இப்போ மிக முக்கியம் — அந்த இடைச்சொல்லை நீக்கிடணும்! 'He exclaimed that ALAS he was ruined' — தப்பு! 'Alas' -ஐ எடுத்துட்டு 'with sorrow' போடணும். 'He exclaimed WITH SORROW that he was ruined' — சரி.",
  tl:"Ippo miga mukkiyam — andha idaicholai neekkidanum! 'He exclaimed that ALAS he was ruined' — thappu! 'He exclaimed WITH SORROW that he was ruined' — sari."},
 {ta:"அடுத்து — 'What a' மற்றும 'How' என்ன ஆகும்? 'WHAT A beautiful sight!' → 'that it was A VERY beautiful sight'. 'HOW foolish I am!' → 'that he was VERY foolish'. 'WHAT A pity!' → 'that it was A GREAT pity'. ஆச்சரிய வடிவமே போயிடும், சாதாரண கூற்று ஆகும்.",
  tl:"Aduththu — 'What a' matrum 'How' enna aagum? 'WHAT A beautiful sight!' → 'A VERY beautiful sight'. 'HOW foolish I am!' → 'VERY foolish'. 'WHAT A pity!' → 'A GREAT pity'."},
 {ta:"கடைசியா வாழ்த்து. 'May you live long!' — இது வாழ்த்து. 'He WISHED that I MIGHT live long.' கவனிங்க — 'may' → 'might'! ஏன்னா reporting verb இறந்தகாலம். 'May God bless you!' → 'He PRAYED that God MIGHT bless me.' மேலும் சாதாரண வாழ்த்து — 'Good morning!' → 'He WISHED me good morning' (இங்க 'that' clause-ஏ தேவையில்ல). 'Goodbye!' → 'He BADE me goodbye'. இதோட Narration-ஓட நாலு வகையும் முடிஞ்சது!",
  tl:"Kadaisiyaa vaazhththu. 'May you live long!' → 'He WISHED that I MIGHT live long.' Kavaninga — 'may' → 'might'! 'Good morning!' → 'He WISHED me good morning'. 'Goodbye!' → 'He BADE me goodbye'."}]},
/* ========== RULE 114 ========== */
{n:114,rc:"CND-01",d:"Hard",t:"The THREE Types of CONDITIONAL Sentence",
 tam:"Type 1 = சாத்தியம் · Type 2 = கற்பனை · Type 3 = கடந்த வருத்தம்",
 s1:{en:"TYPE 1 (real, possible): IF + PRESENT, WILL + V1. TYPE 2 (unreal, imaginary): IF + PAST, WOULD + V1. TYPE 3 (impossible, past regret): IF + HAD + V3, WOULD HAVE + V3. Never put WILL or WOULD inside the IF clause.",
  ta:"TYPE 1 (உண்மையான, சாத்தியமான): IF + நிகழ்காலம், WILL + V1. TYPE 2 (உண்மையற்ற, கற்பனை): IF + இறந்தகாலம், WOULD + V1. TYPE 3 (சாத்தியமற்ற, கடந்தகால வருத்தம்): IF + HAD + V3, WOULD HAVE + V3. IF clause-க்குள் ஒருபோதும் WILL அல்லது WOULD வைக்காதீர்கள்.",
  tl:"TYPE 1 (unmaiyaana, saaththiyamaana): IF + nigazhkaalam, WILL + V1. TYPE 2 (unmaiyatra, karpanai): IF + irandhakaalam, WOULD + V1. TYPE 3: IF + HAD + V3, WOULD HAVE + V3.",
  formula:"TYPE 1  — real, possible\n  IF + PRESENT , WILL + V1\n  If it RAINS, we WILL STAY at home.\n\nTYPE 2  — unreal, imaginary\n  IF + PAST , WOULD + V1\n  If I WERE rich, I WOULD BUY a car.\n\nTYPE 3  — impossible, past regret\n  IF + HAD + V3 , WOULD HAVE + V3\n  If he HAD STUDIED, he WOULD HAVE PASSED.\n\n⚠ NEVER 'IF I WILL' OR 'IF I WOULD'."},

 s2:[
 {h:"Type 1 is about a real possibility",
  en:"'If it rains, we will stay at home' — rain is genuinely possible. The IF clause takes the PRESENT even though it points to the future. That is the same time-clause rule you met in Rule 90 with 'unless' and 'until'.",
  ta:"Type 1 ஒரு உண்மையான சாத்தியம் பற்றியது. 'If it rains, we will stay at home' — மழை உண்மையிலேயே சாத்தியம். IF clause எதிர்காலத்தைச் சுட்டினாலும் நிகழ்காலத்தை எடுக்கிறது. அது Rule 90-ல் 'unless' மற்றும் 'until'-உடன் நீங்கள் சந்தித்த அதே நேரக் clause விதி.",
  tl:"Type 1 oru unmaiyaana saaththiyam patriyadhu. 'If it rains, we will stay at home'. IF clause edhirkaalaththaich suttinaalum nigazhkaalaththai edukkiradhu. Adhu Rule 90-l sandhiththa adhe nerak clause vidhi."},
 {h:"Type 2 uses WERE for every subject",
  en:"'If I WERE rich', 'If he WERE here' — never 'was'. In an unreal condition the subjunctive 'were' is used for all subjects, including I, he and she. 'If I was rich' is the commonest Type 2 error.",
  ta:"Type 2 ஒவ்வொரு Subject-க்கும் WERE பயன்படுத்துகிறது. 'If I WERE rich', 'If he WERE here' — ஒருபோதும் 'was' அல்ல. உண்மையற்ற நிபந்தனையில் subjunctive 'were' அனைத்து Subject-களுக்கும் பயன்படுத்தப்படுகிறது, I, he மற்றும் she உட்பட. 'If I was rich' மிகப் பொதுவான Type 2 தவறு.",
  tl:"Type 2 ovvoru Subject-kkum WERE payanpaduththugiradhu. 'If I WERE rich', 'If he WERE here' — orupodhum 'was' alla. 'If I was rich' migap podhuvaana Type 2 thavaru."},
 {h:"Type 3 talks about something that can never change",
  en:"'If he had studied, he would have passed' — but he did not study and he did not pass. It is over. Type 3 always expresses regret about a fixed past. Both halves need a perfect form: HAD + V3 and WOULD HAVE + V3.",
  ta:"Type 3 ஒருபோதும் மாற முடியாத ஒன்றைப் பற்றிப் பேசுகிறது. 'If he had studied, he would have passed' — ஆனால் அவர் படிக்கவில்லை, தேர்ச்சி பெறவில்லை. அது முடிந்துவிட்டது. Type 3 எப்போதும் ஒரு நிலையான கடந்த காலம் பற்றிய வருத்தத்தை வெளிப்படுத்துகிறது. இரு பாதிகளுக்கும் ஒரு perfect வடிவம் தேவை: HAD + V3 மற்றும் WOULD HAVE + V3.",
  tl:"Type 3 orupodhum maara mudiyaadha ondraip patrip pesugiradhu. 'If he had studied, he would have passed'. Iru paadhigalukkum oru perfect vadivam thevai: HAD + V3 matrum WOULD HAVE + V3."},
 {h:"WILL and WOULD never go inside the IF clause",
  en:"'If it will rain' and 'If I would be rich' are both wrong. The modal belongs only to the main clause. This is the single rule that solves most conditional questions instantly.",
  ta:"WILL மற்றும் WOULD ஒருபோதும் IF clause-க்குள் செல்வதில்லை. 'If it will rain' மற்றும் 'If I would be rich' இரண்டுமே தவறு. Modal முதன்மை clause-க்கு மட்டுமே சொந்தம். பெரும்பாலான conditional கேள்விகளை உடனடியாகத் தீர்க்கும் ஒற்றை விதி இது.",
  tl:"WILL matrum WOULD orupodhum IF clause-kkul selvadhillai. 'If it will rain' matrum 'If I would be rich' irandume thavaru. Modal mudhanmai clause-kku mattume sondham."}],

 s3:[
 {h:"The three ladders",
  d:"   TYPE 1  real, possible\n     IF + PRESENT ────► WILL + V1\n     If it RAINS, we WILL STAY at home.\n\n   TYPE 2  unreal, imaginary\n     IF + PAST ───────► WOULD + V1\n     If I WERE rich, I WOULD BUY a car.\n\n   TYPE 3  impossible, past regret\n     IF + HAD + V3 ───► WOULD HAVE + V3\n     If he HAD STUDIED, he WOULD HAVE PASSED."},
 {h:"WERE for every subject in Type 2",
  d:"   ✔ If I WERE rich ...\n   ✔ If he WERE here ...\n   ✔ If she WERE taller ...\n   ✘ If I WAS rich ...\n\n   This is the SUBJUNCTIVE 'were'.\n   It ignores number entirely.\n\n   ⚠ 'If I were you, I would ...' is\n     the most common exam sentence."},
 {h:"The one rule that solves most questions",
  d:"   ┌───────────────────────────────┐\n   │  NEVER 'WILL' OR 'WOULD'      │\n   │  INSIDE THE 'IF' CLAUSE       │\n   └───────────────────────────────┘\n\n   ✘ If it WILL rain, we will stay.\n   ✔ If it RAINS, we will stay.\n\n   ✘ If I WOULD be rich, I would buy.\n   ✔ If I WERE rich, I would buy.\n\n   Look at the IF clause first.\n   If it has 'will' or 'would', reject it."}],

 s4:{
 wrong:["\"'If it will rain' shows the future correctly.\" — The IF clause takes the present.",
  "\"'If I was rich' is normal English.\" — An unreal condition takes 'were'.",
  "\"Type 2 and Type 3 mean the same.\" — One is present-unreal, one is past-impossible.",
  "\"'If he had studied, he would pass' is Type 3.\" — Type 3 needs 'would have passed'."],
 right:["Check the IF clause first — no 'will' or 'would' allowed there.",
  "Type 1: present + will. Type 2: past + would. Type 3: had + V3, would have + V3.",
  "Use 'were' for every subject in Type 2.",
  "Both halves of Type 3 must be perfect forms."]},

 s5:[
 {en:"If it rains tomorrow, we will stay at home.",ta:"நாளை மழை பெய்தால், நாங்கள் வீட்டிலேயே இருப்போம்.",tl:"Naalai mazhai peydhaal, naangal veettileye iruppom.",note:"Type 1 — a real possibility."},
 {en:"If I were rich, I would buy a big house.",ta:"நான் பணக்காரனாக இருந்தால், ஒரு பெரிய வீடு வாங்குவேன்.",tl:"Naan panakkaaranaaga irundhaal, oru periya veedu vaanguven.",note:"Type 2 — imaginary, with WERE."},
 {en:"If he had studied, he would have passed easily.",ta:"அவர் படித்திருந்தால், எளிதாகத் தேர்ச்சி பெற்றிருப்பார்.",tl:"Avar padiththirundhaal, elidhaagath thercchi petrirupppaar.",note:"Type 3 — a past regret; he did not study."},
 {en:"If I were you, I would accept the offer.",ta:"நான் உங்கள் இடத்தில் இருந்தால், அந்த வாய்ப்பை ஏற்றுக்கொள்வேன்.",tl:"Naan ungal idaththil irundhaal, andha vaayppai etrukkolven.",note:"The most common Type 2 sentence in exams."},
 {en:"If you work hard, you will surely succeed.",ta:"நீங்கள் கடினமாக உழைத்தால், நிச்சயமாக வெற்றி பெறுவீர்கள்.",tl:"Neengal kadinamaaga uzhaiththaal, nichchayamaaga vetri peruveergal.",note:"Type 1 — a real possibility."}],

 "If I would be you, I would accept the offer.|If I were you, I would accept the offer.|'Would' never goes in the IF clause.",
 "If you will work hard, you will succeed.|If you work hard, you will succeed.|The IF clause takes the present.",
 "If he would work harder, he would pass.|If he worked harder, he would pass.|'Would' never goes in the IF clause.",
 "If she would have come, we would have waited.|If she had come, we would have waited.|Type 3 needs 'had' + V3 in the IF clause.",
 "If I had known, I would told you at once.|If I had known, I would have told you at once.|Type 3 needs 'would have' + V3.",
 "If he was here, he would help us now.|If he were here, he would help us now.|An unreal condition takes 'were'.",
 "If we would have started early, we would have won.|If we had started early, we would have won.|The IF clause takes 'had' + V3."],

 s9:[
 "Fill in the Blank|If the committee ____ the proposal today, the work will begin next Monday.|will approve;approves|1|Type 1 → the IF clause takes the present.",
 "Find the Error|If I would be (A) in your position (B), I would certainly (C) accept the offer (D).|A;B;C;D|0|Part A. 'Would' never goes in the IF clause → 'If I were'.",
 "Sentence Improvement|If he had prepared properly, he would definitely clear the interview last month.|would definitely clear;would definitely have cleared;will definitely clear|1|Type 3 needs 'would have' + V3.",
 "Fill in the Blank|If I ____ the answer, I would have told you immediately without any hesitation.|knew;had known|1|The main clause has 'would have' → Type 3.",

 s10:{
  en:"'If it will rain' and 'If I would be' are the two errors the exam plants most often, and both are caught by one check: look at the IF clause and reject any 'will' or 'would' inside it. The second layer is Type 3, where BOTH halves need a perfect form. 'If he had studied, he would pass' mixes Type 3 with Type 2 and is wrong.",
  ta:"'If it will rain' மற்றும் 'If I would be' தேர்வு மிக அடிக்கடி வைக்கும் இரண்டு தவறுகள், இரண்டையும் ஒரே சரிபார்ப்பால் பிடிக்கலாம்: IF clause-ஐப் பாருங்கள், அதற்குள் எந்த 'will' அல்லது 'would'-ஐயும் நிராகரியுங்கள். இரண்டாவது அடுக்கு Type 3, அங்கே இரு பாதிகளுக்கும் ஒரு perfect வடிவம் தேவை. 'If he had studied, he would pass' Type 3-ஐ Type 2-உடன் கலக்கிறது, அது தவறு.",
  tl:"'If it will rain' matrum 'If I would be' thervu miga adikkadi vaikkum irandu thavarugal. IF clause-aip paarungal, adharkul endha 'will' alladhu 'would'-aiyum niraagariyungal."},

 s11:{
  en:"NO 'WILL' OR 'WOULD' INSIDE THE IF CLAUSE. Ever.",
  ta:"IF clause-க்குள்ள 'WILL' அல்லது 'WOULD' ஒருபோதும் வராது.",
  tl:"IF clause-kkulla 'WILL' alladhu 'WOULD' orupodhum varaadhu.",
  vis:"      THE THREE TYPES\n\n   TYPE 1  real, possible\n     IF + PRESENT  →  WILL + V1\n     If it RAINS, we WILL STAY at home.\n\n   TYPE 2  unreal, imaginary (now)\n     IF + PAST     →  WOULD + V1\n     If I WERE rich, I WOULD BUY a car.\n\n   TYPE 3  impossible, past regret\n     IF + HAD + V3 →  WOULD HAVE + V3\n     If he HAD STUDIED,\n       he WOULD HAVE PASSED.\n\n   ┌──────────────────────────────┐\n   │ NEVER 'WILL' OR 'WOULD'      │\n   │ INSIDE THE 'IF' CLAUSE       │\n   └──────────────────────────────┘\n\n   ⚠ TYPE 2 USES 'WERE' FOR EVERY SUBJECT\n     If I WERE · If he WERE · If she WERE\n     ✘ 'If I was'\n\n   ⚠ TYPE 3 NEEDS A PERFECT FORM\n     IN BOTH HALVES."},
